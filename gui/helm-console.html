<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Phoenix — Helm Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: 16px; }
    .panel-inner {
      padding: 24px 60px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-mid {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 36px;
      min-height: 0;
    }
    .panel-mid > .radar-col   { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
    .panel-mid > .ctrl-col    { width: 460px; flex-shrink: 0; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; }
    .hero h1 .sub { font-size: 12px; margin-top: 2px; }
    .hero .bar { width: 6px; }
    .hero { gap: 12px; padding: 4px 0; }

    .radar-col .radar-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    /* Radar circle fills full screen height in landscape (surround-frame at 125dvh so 80% = 100dvh). */
    .radar-col .radar-surround-frame { aspect-ratio: 1/1; width: auto; height: calc(100dvh * 1.25); max-height: none; max-width: none; display: flex; align-items: center; justify-content: center; }
    .radar-col .radar-surround-frame .radar { width: 80%; height: 80%; max-height: none; max-width: none; }

    .ctrl-col .stick-area { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .ctrl-col .btn-row { display: flex; gap: 12px; width: 100%; }
    .ctrl-col .btn-row .btn { flex: 1; --h: 68px; font-size: 22px; padding: 0 16px 0 52px; }
    .ctrl-col .btn-row .btn .led { width: 18px; height: 18px; left: 16px; }

    .side-rail {
      position: absolute;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.4em;
    }
    .side-rail.top    { top: 16px;    left: 50%; transform: translateX(-50%); }
    .side-rail.bottom { bottom: 14px; left: 50%; transform: translateX(-50%); }

    .readout { padding: 8px 18px; }
    .readout .v { font-size: 36px; }
    .readout .k { font-size: 12px; }
    .readout .u { font-size: 12px; }
    .readout .sub { font-size: 11px; }
    .radar-col > .readout { padding: 10px 22px; }
    .radar-col > .readout .v { font-size: 28px; }

    .radar canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #hdg, #spd, #pos-x, #pos-z {
      position: absolute;
      left: -9999px;
      visibility: hidden;
    }

    .helm-readout-overlay {
      position: absolute;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      color: var(--cyan);
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 3;
      background: linear-gradient(180deg, rgba(20,28,60,0.75), rgba(8,12,28,0.55));
      border-top: 1px solid var(--line-faint);
      border-bottom: 1px solid var(--line-faint);
      padding: 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .helm-readout-overlay .k {
      font-family: "Chakra Petch", sans-serif;
      font-size: 9px;
      color: var(--ink-faint);
      letter-spacing: 0.3em;
      display: block;
    }
    .helm-readout-overlay .v {
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .readout-hdg { top: 14px; left: 14px; }
    .readout-spd { top: 14px; right: 14px; }
    .readout-x   { bottom: 14px; left: 14px; }
    .readout-z   { bottom: 14px; right: 14px; }

    .lock-tag {
      position: absolute;
      top: 50%; right: 10%;
      transform: translateY(-50%);
      z-index: 3;
      background: rgba(10, 8, 20, 0.85);
      border: 1px solid var(--fire);
      padding: 4px 8px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);
    }
    .lock-tag.show { display: flex; }
    .lock-tag .k {
      font-family: "Chakra Petch", sans-serif;
      font-weight: 600;
      font-size: 8px;
      letter-spacing: 0.3em;
      color: var(--ink-faint);
    }
    .lock-tag .id {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--fire);
    }

    .stick-container {
      width: 280px;
      height: 280px;
    }
    .stick-bezel {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at center, #0a0d11 0%, #14171c 75%, #050608 100%);
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 4px #0a0d11, inset 0 0 0 5px var(--cyan-dim);
      cursor: grab;
      touch-action: none;
    }
    .stick-bezel:active { cursor: grabbing; }

    .stick-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(108, 182, 208, 0.18);
      pointer-events: none;
    }
    .stick-ring.outer { inset: 16px; }
    .stick-ring.mid   { inset: 52px; }

    .stick-cross-h, .stick-cross-v {
      position: absolute;
      background: rgba(108, 182, 208, 0.14);
      pointer-events: none;
    }
    .stick-cross-h { left: 18px; right: 18px; top: 50%; height: 1px; }
    .stick-cross-v { top: 18px; bottom: 18px; left: 50%; width: 1px; }

    .stick-arrow {
      position: absolute;
      width: 0; height: 0;
      pointer-events: none;
      opacity: 0.5;
    }
    .stick-arrow.up    { top: 8px;    left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--cyan-dim); }
    .stick-arrow.down  { bottom: 8px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--cyan-dim); }
    .stick-arrow.left  { left: 8px;   top: 50%;  transform: translateY(-50%); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-right: 8px solid var(--cyan-dim); }
    .stick-arrow.right { right: 8px;  top: 50%;  transform: translateY(-50%); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid var(--cyan-dim); }

    .stick-axis-label {
      position: absolute;
      font-family: "Chakra Petch", sans-serif;
      font-weight: 600;
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.22em;
      pointer-events: none;
    }
    .stick-axis-label.top    { top: 20px;    left: 50%; transform: translateX(-50%); }
    .stick-axis-label.bottom { bottom: 20px; left: 50%; transform: translateX(-50%); }
    .stick-axis-label.left   { left: 18px;   top: 50%;  transform: translateY(-50%) rotate(-90deg); }
    .stick-axis-label.right  { right: 18px;  top: 50%;  transform: translateY(-50%) rotate(90deg); }

    .stick-nub {
      position: absolute;
      left: 50%; top: 50%;
      width: 56px; height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3a4049 0%, #22262d 50%, #14171c 100%);
      border: 1.5px solid var(--cyan);
      box-shadow: 0 0 20px rgba(108, 182, 208, 0.35), inset 0 0 0 2px #14171c;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .stick-nub::after {
      content: "";
      position: absolute; inset: 18px;
      border-radius: 50%;
      background: #14171c;
      border: 1px solid var(--cyan-dim);
    }

    .stick-readout {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      color: var(--cyan);
      letter-spacing: 0.1em;
      text-align: center;
    }
    .stick-readout .sep { color: var(--ink-faint); }

    .stick-directions {
      display: flex;
      width: 100%;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: 0.18em;
      padding: 0 8px;
    }

    .impulse-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(5, 8, 24, 0.7);
      z-index: 5;
      transition: opacity 0.1s ease, visibility 0s 0.1s;
    }
    .impulse-overlay.show {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.1s ease, visibility 0s 0s;
    }
    .impulse-bar-wrap {
      width: 200px;
      height: 12px;
      background: var(--bg-deep);
      border: 1px solid var(--line-faint);
    }
    .impulse-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
      box-shadow: 0 0 10px rgba(108, 182, 208, 0.4);
      transform: scaleX(0);
      transform-origin: left;
      transition: none;
    }
    .impulse-status {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      color: var(--ink);
    }
    .radar.impulse-stabilized .scan {
      animation: none;
      opacity: 0.35;
    }
    .boost-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .boost-control .btn {
      width: 100%;
    }
    .boost-battery-track {
      width: 100%;
      height: 8px;
      background: var(--bg-deep);
      border: 1px solid var(--line-faint);
    }
    .boost-battery-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--amber, #d8a23a), var(--amber, #f0c057));
      transform: scaleX(1);
      transform-origin: left;
      transition: none;
    }
  /* ── Landscape: compact for phone screens ──────────────────── */
  @media (orientation: landscape) and (max-width: 900px) {
    /* Minimal top padding, near-zero bottom — buttons sit at the screen edge */
    .panel-inner { padding: 8px 20px 4px; gap: 6px; }
    .panel-mid { gap: 12px; }
    /* Tighter ctrl-col gaps push buttons as low as possible */
    .panel-mid > .ctrl-col { width: 300px; gap: 4px; }
    /* Footer takes vertical space away from the joystick; hide it on small landscape */
    .console-footer { display: none; }
    /* Larger joystick: fills the freed space (60dvh on a 390px phone ≈ 234px) */
    .stick-container { width: min(260px, 60dvh); height: min(260px, 60dvh); }
    /* Stick readout text is visible in the radar overlay; hide here to save space */
    .stick-readout { display: none; }
    .stick-directions { display: none; }
    .ctrl-col .stick-area { gap: 0; }
    .ctrl-col .btn-row .btn { --h: 44px; font-size: 14px; padding: 0 10px 0 36px; }
    .ctrl-col .btn-row .btn .led { width: 14px; height: 14px; left: 10px; }
    .stick-nub { width: 40px; height: 40px; }
    .stick-nub::after { inset: 12px; }
    .readout .v { font-size: 24px; }
    .radar-col > .readout { padding: 6px 14px; }
    .radar-col > .readout .v { font-size: 18px; }
    .radar-col .radar-surround-frame { max-height: none; max-width: none; }
    .helm-readout-overlay { font-size: 10px; }
    .helm-readout-overlay .v { font-size: 11px; }
    .readout-hdg { top: 8px; left: 12%; }
    .readout-spd { top: 8px; right: 12%; }
    .readout-x { bottom: 8px; left: 12%; }
    .readout-z { bottom: 8px; right: 12%; }
    .lock-tag { right: 5%; }
    .lock-tag .k { font-size: 7px; }
    .lock-tag .id { font-size: 8px; }
    .impulse-bar-wrap { width: 140px; }
    .impulse-status { font-size: 12px; }
  }

  /* ── Portrait reflow ───────────────────────────────────────── */
  @media (orientation: portrait) {
    body { overflow-y: auto; overflow-x: hidden; }

    .panel-inner {
      padding: 0.75rem 0.5rem;
      gap: 0.5rem;
    }

    .panel-mid {
      flex-direction: column;
      gap: 0.5rem;
    }

    .panel-mid > .radar-col { width: 100%; }
    .panel-mid > .ctrl-col  { width: 100%; }

    .hero {
      padding: 0.25rem 0;
      gap: 0.5rem;
    }
    .hero h1 { font-size: 1.25rem; letter-spacing: 0.15em; }
    .hero h1 .sub { display: none; }
    .hero .bar { display: none; }
    .hero .complexity { display: none; }
    .hero .spacer { display: none; }

    .side-rail { display: none; }

    .radar-col .radar-wrap { min-height: 35vh; }
    /* Portrait: radar circle fills full screen width (surround-frame at 125vw so 80% = 100vw). */
    .radar-col .radar-surround-frame { width: calc(100vw * 1.25); height: auto; max-height: none; max-width: none; }
    .radar-col > .readout { padding: 0.4rem 0.6rem; }
    .radar-col > .readout .v { font-size: 1.25rem; }

    .ctrl-col .stick-area { gap: 0.25rem; }
    .stick-container { width: min(75vw, 240px); height: min(75vw, 240px); }

    .ctrl-col .btn-row .btn { --h: 3rem; font-size: 0.9rem; padding: 0 0.5rem 0 2.5rem; }
    .ctrl-col .btn-row .btn .led { width: 12px; height: 12px; left: 10px; }

    .side-rail.top,
    .side-rail.bottom { display: none; }

    .readout { padding: 0.3rem 0.6rem; }
    .readout .v { font-size: 1.5rem; }
    .readout .k { font-size: 0.6rem; }
    .readout .u { font-size: 0.6rem; }

    .console-footer { font-size: 0.65rem; gap: 0.5rem; }

    .helm-readout-overlay { display: none; }
    .lock-tag { top: auto; bottom: 0.5rem; right: 0.5rem; transform: none; font-size: 0.6rem; }
    .lock-tag .k { font-size: 0.5rem; }
    .lock-tag .id { font-size: 0.6rem; }

    .impulse-overlay { gap: 0.5rem; }
    .impulse-bar-wrap { width: 70vw; }
  }
  </style>
</head>
<body style="background:#000; margin:0; overflow:hidden;">

  <div id="hdg" aria-hidden="true"></div>
  <div id="spd" aria-hidden="true"></div>
  <div id="pos-x" aria-hidden="true"></div>
  <div id="pos-z" aria-hidden="true"></div>

  <div class="frame landscape" data-screen-label="Helm Console">
    <div class="panel">
      <div class="panel-inner">

        <div class="panel-mid">

          <section class="radar-col">
            <div class="radar-wrap">
              <div class="radar-surround-frame">
                <img class="radar-surround" src="src_assets/helm_console/radar-surround.png" alt="">
                <div class="radar" style="aspect-ratio:1/1;">
                <img class="bg" id="radar-bg-img" src="src_assets/helm_console/radar-bg.png" alt="">
                <div class="scan"></div>
                <div class="crosshair-h"></div>
                <div class="crosshair-v"></div>
                <div class="range-label" id="rl-33" style="top:50%; left:8%;  transform:translateY(-50%);">&mdash;</div>
                <div class="range-label" id="rl-66" style="top:50%; left:20%; transform:translateY(-50%);">&mdash;</div>
                <div class="range-label" id="rl-100" style="top:50%; left:33%; transform:translateY(-50%);">&mdash;</div>
                <canvas id="radar"></canvas>

                <div class="helm-readout-overlay readout-hdg">
                  <span class="k">HDG</span>
                  <span class="v" id="hdg-val">000.0</span>
                </div>
                <div class="helm-readout-overlay readout-spd">
                  <span class="k">SPD</span>
                  <span class="v" id="spd-val">00.0</span>
                </div>
                <div class="helm-readout-overlay readout-x">
                  <span class="k">X</span>
                  <span class="v" id="x-val">+0000.0</span>
                </div>
                <div class="helm-readout-overlay readout-z">
                  <span class="k">Z</span>
                  <span class="v" id="z-val">+0000.0</span>
                </div>

                <div class="lock-tag" id="lock-tag">
                  <span class="k">LOCK</span>
                  <span class="id" id="lock-id">A-014</span>
                </div>
                </div><!-- /.radar -->
              </div><!-- /.radar-surround-frame -->
            </div>

          </section>

          <section class="ctrl-col">
            <div class="stick-area">
              <div class="stick-container" id="stick-container">
                <div class="stick-bezel" id="stick-bezel">
                  <div class="stick-ring outer"></div>
                  <div class="stick-ring mid"></div>
                  <div class="stick-cross-h"></div>
                  <div class="stick-cross-v"></div>
                  <div class="stick-arrow up"></div>
                  <div class="stick-arrow down"></div>
                  <div class="stick-arrow left"></div>
                  <div class="stick-arrow right"></div>
                  <div class="stick-axis-label top">FWD</div>
                  <div class="stick-axis-label bottom">REV</div>
                  <div class="stick-axis-label left">PORT</div>
                  <div class="stick-axis-label right">STBD</div>
                  <div class="stick-nub" id="stick-nub"></div>

                  <div class="impulse-overlay" id="impulse-overlay">
                    <div class="impulse-bar-wrap">
                      <div class="impulse-bar-fill" id="impulse-fill"></div>
                    </div>
                    <div class="impulse-status" id="impulse-status">CHARGING</div>
                    <button class="btn danger" id="cancel-impulse-btn" style="--h:48px; font-size:16px; padding:0 16px 0 44px; width:auto;" type="button">
                      <span class="btn-bg"></span>
                      <span class="led fire"></span>
                      <span class="label">CANCEL</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="stick-readout">
                <span id="thrust-val">+0.00</span>
                <span class="sep">/</span>
                <span id="steering-val">+0.00</span>
              </div>

              <div class="stick-directions">
                <span>PORT</span>
                <span>STBD</span>
              </div>
            </div>

            <div class="btn-row">
              <button id="on-screen-btn" class="btn" type="button">
                <span class="btn-bg"></span>
                <span class="led" id="screen-led"></span>
                <span class="label">ON SCREEN</span>
              </button>
              <button id="impulse-btn" class="btn" type="button">
                <span class="btn-bg"></span>
                <span class="led" id="impulse-led"></span>
                <span class="label">IMPULSE</span>
              </button>
            </div>
            <div class="boost-control" id="boost-control" style="display:none;">
              <button id="boost-btn" class="btn" type="button">
                <span class="btn-bg"></span>
                <span class="led" id="boost-led"></span>
                <span class="label">BOOST</span>
              </button>
              <div class="boost-battery-track">
                <div class="boost-battery-fill" id="boost-battery-fill"></div>
              </div>
            </div>
          </section>

        </div>

        <footer class="console-footer footer-bar">
          <span class="dot"></span>
          <span id="footer-status">HELM ONLINE</span>
          <span class="sep">&middot;</span>
          <span id="footer-mode" style="color:var(--ink-faint);">THRUST</span>
          <span style="flex:1"></span>
          <span id="footer-right" style="color:var(--ink-faint);">&mdash;</span>
        </footer>

      </div>
    </div>
  </div>

  <script src="radar-widget.js"></script>

  <script type="module">
    import { initConsole, renderDamageBar } from './console-core.js';

    var _state         = null;
    var _radarWidget   = null;
    var _lastRadarJson  = '';

    function padHeading(d) {
      d = ((d % 360) + 360) % 360;
      return d.toFixed(1).padStart(5, '0');
    }
    function signed(n) {
      var s = n >= 0 ? '+' : '-';
      return s + Math.abs(n).toFixed(1).padStart(6, '0');
    }

    // ── Inbound state push (ADR-0001 §2) ─────────────────────────────────
    // Handled by initConsole({ render }) — see bottom of script.

    function _renderConsole(s) {
      _state = s;

      document.getElementById('hdg').dataset.heading = String(s.heading || 0);
      document.getElementById('spd').dataset.speed   = String(s.speed || 0);
      document.getElementById('pos-x').dataset.x     = String(s.x || 0);
      document.getElementById('pos-z').dataset.z     = String(s.z || 0);

      var hdg = s.heading || 0;
      // Radar background is a world-fixed compass ring; rotate it opposite to
      // heading so it stays true while the ship marker holds its forward-up position.
      var radarBgImg = document.getElementById('radar-bg-img');
      if (radarBgImg) radarBgImg.style.transform = 'rotate(' + (-hdg) + 'deg)';
      document.getElementById('hdg-val').textContent = padHeading(hdg);
document.getElementById('spd-val').textContent = (s.speed || 0).toFixed(1).padStart(4, '0');
      document.getElementById('x-val').textContent   = signed(s.x || 0);
      document.getElementById('z-val').textContent   = signed(s.z || 0);

      var lockTag = document.getElementById('lock-tag');
      if (s.lock_id) {
        lockTag.classList.add('show');
        document.getElementById('lock-id').textContent = s.lock_id;
      } else {
        lockTag.classList.remove('show');
      }

      var screenLed = document.getElementById('screen-led');
      var screenLedTarget = s.on_screen ? 'led on' : 'led';
      if (screenLed.className !== screenLedTarget) screenLed.className = screenLedTarget;
      var screenLabel = document.querySelector('#on-screen-btn .label');
      if (screenLabel) screenLabel.textContent = s.on_screen ? 'CLEAR SCREEN' : 'ON SCREEN';

      var ip = s.impulse_charge_progress || 0;
      var impulseOverlay = document.getElementById('impulse-overlay');
      var impulseFill = document.getElementById('impulse-fill');
      var impulseStatus = document.getElementById('impulse-status');
      var impulseLed = document.getElementById('impulse-led');
      var impulseBtn = document.getElementById('impulse-btn');
      var radarEl = document.querySelector('.radar');
      var impulseCharging = ip > 0 && ip < 1.0;

      if (ip > 0) {
        impulseOverlay.classList.add('show');
        if (radarEl) radarEl.classList.toggle('impulse-stabilized', impulseCharging);
        impulseFill.style.transform = 'scaleX(' + ip + ')';
        impulseStatus.textContent = ip >= 1.0 ? 'ENGAGED' : (ip * 100).toFixed(0) + '%';
        if (impulseLed.className !== 'led on') impulseLed.className = 'led on';
        if (impulseBtn.className !== 'btn disabled') impulseBtn.className = 'btn disabled';
      } else {
        impulseOverlay.classList.remove('show');
        if (radarEl) radarEl.classList.remove('impulse-stabilized');
        if (impulseLed.className !== 'led') impulseLed.className = 'led';
        if (impulseBtn.className !== 'btn') impulseBtn.className = 'btn';
      }

      var boostControl = document.getElementById('boost-control');
      if (s.boost_enabled) {
        boostControl.style.display = '';
        var batt = s.boost_battery || 0;
        document.getElementById('boost-battery-fill').style.transform = 'scaleX(' + batt + ')';
        var boostLed = document.getElementById('boost-led');
        var boostLedTarget = s.boost_active ? 'led on' : 'led';
        if (boostLed.className !== boostLedTarget) boostLed.className = boostLedTarget;
        // engaged → danger; empty & idle → disabled (can't engage); else ready.
        var boostBtn = document.getElementById('boost-btn');
        var boostCls = s.boost_active ? 'btn danger' : (batt <= 0 ? 'btn disabled' : 'btn');
        if (boostBtn.className !== boostCls) boostBtn.className = boostCls;
      } else {
        boostControl.style.display = 'none';
      }

      var footerMode = document.getElementById('footer-mode');
      if (s.on_screen) {
        footerMode.textContent = 'ON SCREEN';
        footerMode.style.color = 'var(--cyan)';
      } else {
        footerMode.textContent = 'THRUST';
        footerMode.style.color = 'var(--ink-faint)';
      }

      if (_radarWidget) {
        var radarPayload = {
          mode: 'pre-projected',
          blips: s.blips || [],
          regions: s.regions || [],
        };
        var radarJson = JSON.stringify(radarPayload);
        if ((!impulseCharging || !_lastRadarJson) && radarJson !== _lastRadarJson) {
          _lastRadarJson = radarJson;
          _radarWidget.update(radarPayload);
        }
      }

      renderDamageBar(s.own_hull, 'hull-display', 'hull-fill', 'hull-val');
    }

    var _stickValue = { x: 0, y: 0 };
    var _stickPointerId = null;
    var _stickRaf;
    var _inputRaf = null; // keyboard/gamepad loop handle

    function _stickFmt(v) {
      return (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2);
    }
    function _stickUpdateNub() {
      var bezel = document.getElementById('stick-bezel');
      var r = bezel.getBoundingClientRect();
      var radius = Math.min(r.width, r.height) / 2 - 28;
      var nub = document.getElementById('stick-nub');
      nub.style.marginLeft = (_stickValue.x * radius) + 'px';
      nub.style.marginTop  = (_stickValue.y * radius) + 'px';
      document.getElementById('thrust-val').textContent = _stickFmt(-_stickValue.y);
      document.getElementById('steering-val').textContent = _stickFmt(_stickValue.x);
      sendAction('helm_input', { thrust: -_stickValue.y, steering: _stickValue.x });
    }
    function _stickSetFromPointer(clientX, clientY) {
      var bezel = document.getElementById('stick-bezel');
      var r = bezel.getBoundingClientRect();
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height / 2;
      var radius = Math.min(r.width, r.height) / 2 - 28;
      var dx = (clientX - cx) / radius;
      var dy = (clientY - cy) / radius;
      var d = Math.hypot(dx, dy);
      if (d > 1) { dx /= d; dy /= d; }
      _stickValue = { x: dx, y: dy };
      _stickUpdateNub();
    }
    function _stickDecay() {
      if (_stickPointerId !== null) return;
      if (_inputRaf !== null) return; // keyboard/gamepad has control
      var k = 0.15;
      _stickValue.x *= (1 - k);
      _stickValue.y *= (1 - k);
      if (Math.abs(_stickValue.x) < 0.005 && Math.abs(_stickValue.y) < 0.005) {
        _stickValue = { x: 0, y: 0 };
        _stickUpdateNub();
        return;
      }
      _stickUpdateNub();
      _stickRaf = requestAnimationFrame(_stickDecay);
    }

    (function initStick() {
      var bezel = document.getElementById('stick-bezel');
      if (!bezel) return;

      function down(e) {
        // Don't start a joystick drag when the pointer originated inside the
        // impulse overlay (e.g. the Cancel Impulse button). Without this guard,
        // setPointerCapture() steals all subsequent pointer events from the
        // button so its click listener never fires.
        if (e.target && e.target.closest && e.target.closest('#impulse-overlay')) return;
        // Only claim the first touch — additional fingers must reach other controls.
        if (_stickPointerId !== null) return;
        _stickPointerId = e.pointerId;
        if (bezel.setPointerCapture) bezel.setPointerCapture(e.pointerId);
        cancelAnimationFrame(_stickRaf);
        _stickSetFromPointer(e.clientX, e.clientY);
        e.preventDefault();
      }
      function move(e) {
        if (e.pointerId !== _stickPointerId) return;
        _stickSetFromPointer(e.clientX, e.clientY);
      }
      function up(e) {
        if (e.pointerId !== _stickPointerId) return;
        _stickPointerId = null;
        try { if (bezel.releasePointerCapture) bezel.releasePointerCapture(e.pointerId); } catch(_) {}
        _stickRaf = requestAnimationFrame(_stickDecay);
      }
      bezel.addEventListener('pointerdown', down);
      bezel.addEventListener('pointermove', move);
      bezel.addEventListener('pointerup', up);
      bezel.addEventListener('pointercancel', up);
      // Heartbeat: resend the current position at ~10 Hz while the finger is held
      // still. Without this the server only receives an update when the pointer
      // actually moves, leaving the last-received value stale if the connection
      // drops a packet while dragging.
      setInterval(function() { if (_stickPointerId !== null) _stickUpdateNub(); }, 100);
    })();

    (function initKeyboardGamepad() {
      var _keys = {};

      function _getGamepadInput() {
        if (!navigator.getGamepads) return { x: 0, y: 0 };
        var gamepads = navigator.getGamepads();
        for (var i = 0; i < gamepads.length; i++) {
          var gp = gamepads[i];
          if (!gp || gp.axes.length < 2) continue;
          var dead = 0.1;
          return {
            x: Math.abs(gp.axes[0]) > dead ? gp.axes[0] : 0,
            y: Math.abs(gp.axes[1]) > dead ? gp.axes[1] : 0
          };
        }
        return { x: 0, y: 0 };
      }

      function _inputLoop() {
        _inputRaf = null;
        if (_stickPointerId !== null) return; // pointer has priority

        var kx = 0, ky = 0;
        if (_keys['ArrowLeft']  || _keys['KeyA']) kx -= 1;
        if (_keys['ArrowRight'] || _keys['KeyD']) kx += 1;
        if (_keys['ArrowUp']    || _keys['KeyW']) ky -= 1; // up = forward thrust
        if (_keys['ArrowDown']  || _keys['KeyS']) ky += 1;

        var gp = _getGamepadInput();
        var nx = kx !== 0 ? kx : gp.x;
        var ny = ky !== 0 ? ky : gp.y;

        var d = Math.hypot(nx, ny);
        if (d > 1) { nx /= d; ny /= d; }

        var hasInput = nx !== 0 || ny !== 0;
        var hasKeys = Object.keys(_keys).length > 0;

        if (hasInput) {
          cancelAnimationFrame(_stickRaf);
          _stickValue = { x: nx, y: ny };
          _stickUpdateNub();
          _inputRaf = requestAnimationFrame(_inputLoop);
        } else if (hasKeys) {
          // All-zero directional keys held (e.g. opposing keys cancel) — keep polling
          _inputRaf = requestAnimationFrame(_inputLoop);
        } else {
          // No input — hand off to decay
          _stickRaf = requestAnimationFrame(_stickDecay);
        }
      }

      function _startInputLoop() {
        if (_inputRaf) return;
        cancelAnimationFrame(_stickRaf);
        _inputRaf = requestAnimationFrame(_inputLoop);
      }

      document.addEventListener('keydown', function(e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
        var relevant = ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS'];
        if (relevant.indexOf(e.code) === -1) return;
        e.preventDefault();
        _keys[e.code] = true;
        _startInputLoop();
      });

      document.addEventListener('keyup', function(e) {
        delete _keys[e.code];
        // If loop isn't running, start it so it can trigger decay when keys empty
        if (!_inputRaf && _stickPointerId === null) _startInputLoop();
      });

      // Gamepad: start polling on connect, and periodically check for silent connections
      window.addEventListener('gamepadconnected', _startInputLoop);
      setInterval(function() {
        if (_stickPointerId !== null || _inputRaf) return;
        var gp = _getGamepadInput();
        if (gp.x !== 0 || gp.y !== 0) _startInputLoop();
      }, 200);
    })();

    document.getElementById('on-screen-btn').addEventListener('click', function() {
      sendAction('set_radar_view', {});
    });

    document.getElementById('impulse-btn').addEventListener('click', function() {
      sendAction('start_impulse_charge', {});
    });

    document.getElementById('cancel-impulse-btn').addEventListener('click', function() {
      sendAction('cancel_impulse', {});
    });

    (function initBoostBtn() {
      var btn = document.getElementById('boost-btn');
      if (!btn) return;
      var _boostPointerId = null;
      btn.addEventListener('pointerdown', function(e) {
        if (_boostPointerId !== null) return;
        _boostPointerId = e.pointerId;
        if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
        sendAction('set_boost', { active: true });
        e.preventDefault();
      });
      function release(e) {
        if (e.pointerId !== _boostPointerId) return;
        _boostPointerId = null;
        try { if (btn.releasePointerCapture) btn.releasePointerCapture(e.pointerId); } catch(_) {}
        sendAction('set_boost', { active: false });
      }
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
    })();

    _radarWidget = (function() {
      var canvas = document.getElementById('radar');
      if (!canvas || typeof RadarWidget === 'undefined') return null;
      return new RadarWidget(canvas, {
        consoleId:   'helm',
        orientation: 'ship_up',
        onBlipTap:   function(uuid) {
          sendAction('set_target', { uuid: uuid });
        },
      });
    })();

    var sendAction = initConsole({ name: 'Helm', render: _renderConsole }).sendAction;
  </script>
</body>
</html>

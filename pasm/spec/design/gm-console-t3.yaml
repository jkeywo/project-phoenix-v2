  - component: gm-t3-authored-gm-widgets
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Typed World-Authored GM Widgets
      summary: "A scenario author composes a Game Master's desk from four typed widgets and nothing else: a filtered attention list, a Station workload summary, existing permitted GM action buttons and an authored note. They are an extension of the [[gm_role_preset]] vocabulary - [[gm_role_preset.widget]] blocks carrying a stable id, a String Table label and only the facet keys their own type owns - validated at world load with the preset and widget index that named them. The attention widget authors DEFAULT filters over the one #1433 private filter/snooze controller rather than filtering a second time, and those defaults apply on the operator's own live preset switch alone; the workload widget summarises the rows #1438 already published; an action widget activates the shipped GM control by DOM id, so the T2 confirmation, admission and feedback are the ones that button already had; a note's text is a String Table id rendered through textContent. Presentation-only and personal, exactly as the presets are: never a GmAction, a snapshot field, a digest fold or another operator's browser."
      rationale:
        - "[ai] Issue #1439 (PRD #1419 story 13, presentation contract PRD #1418). The vocabulary is a TYPED TABLE rather than an author-supplied fragment because that is what makes 'no arbitrary author UI code, no new GM permissions' structural instead of a review convention: there is no field in GmRolePresetWidget in which markup, a script, a style, a selector or a verb could arrive, so the browser never has to defend against one."
        - "[ai] Every facet key belongs to exactly one type and a key on the wrong type is a LOAD FAILURE, not an ignored setting. An author who writes `text` on an attention widget has written a note they will never see; accepting it silently is the 'configured something that does nothing' outcome the typed schema exists to prevent, and it is indistinguishable on a live desk from the feature being broken."
        - "[ai] Band and category are validated against gm_attention's own vocabularies (GmAttentionBand::from_authored and the new GmAttentionCategory::from_authored/authored_vocabulary), so a new producer cannot be added without the authoring vocabulary growing with it, and an unknown reference fails the load naming what may be written instead. Permitted action ids are validated against GM_WIDGET_ACTION_IDS, whose one job is to be the same list as gui/gm-role-presets.js's GM_ROLE_PRESET_QUICK_ACTION_IDS - a lib test reads the shipped module and fails if the two drift, for TASK_DEMAND_INVENTORY's reason."
        - "[ai] A note's text is checked as the SHAPE of a strings.csv id (ASCII alphanumerics, dot, underscore, hyphen) rather than against a blocklist of dangerous characters. A blocklist is a guess about what is dangerous; an id charset is a statement about what a note IS. The page then renders it with textContent, so even a poked String Table row becomes literal characters on screen and the desk has no path from authored content to parsed markup at all."
        - "[ai] The attention widget is composition, not a second filter. It seeds and then READS the one controller every GM surface shares and the occurrences the queue already parsed; the workload widget reads the rows the advisory already parsed. Two surfaces that disagreed about what is waiting would be worse than one surface, and a second narrowing implementation is how that happens."
        - "[ai] Authored defaults apply on the operator's own live switch and NEVER on a reconnect. gui/gm-role-presets.js grew an onEffective(preset, {source}) hook for exactly this distinction: 'select' is the operator asking for this role's view, while 'restore' must leave the filters and the remaining snooze minute they actually left behind. Re-imposing the author's defaults over a reconnect would quietly contradict PRD #1419's promise that private state survives it. A facet a widget omits is reset to All on a switch, so moving from a narrow role to a broad one does not leave the previous role's narrowing on an operator who asked for something else."
        - "[ai] The authored `ship` names a world entity the way [[gm_role_preset]].contacts does, because the queue's own ship facet is a runtime entity id no author can know. It is resolved against the live queue (or the workload rows) when the default is applied, and a hull this session has never seen leaves the facet UNNARROWED: narrowing to an id that exists nowhere would empty every surface and read as 'nothing is happening', which is the opposite of the truth."
        - "[ai] An action widget forwards to the shipped control rather than submitting anything. There is exactly one implementation of pausing a session and this is not it, so the confirmation category, the admission check and the ActionFeedbackLifecycle are unchanged and un-duplicated. A control the desk is not currently offering (missing, hidden or disabled) is mirrored as a disabled button with a sentence saying how many - a button that quietly does nothing is worse than one that is visibly unavailable."
        - "[ai] The region is the last block of the desk's LEFT column, under the attention queue and the roster - the post-M5 screen's place for a world's own mission panel (gm-t3-post-m5-desk-screen; it was a full-width implicit row below the five-row grid when this issue landed, before the desk was recomposed into six regions). It is hidden whenever the effective preset composes no widget, so a scenario that authors none leaves the column exactly as it was and the smoke spec's vertical-fit contract at both default-text viewports is untouched. #gm-widgets is deliberately absent from GM_ROLE_PRESET_PANEL_IDS: gui/gm-widgets-panel.js owns its hidden state from the authored composition, and a second writer there would race it exactly as it would for the Station puppet's controls."
        - "[ai] A removed preset needs no branch of its own. resolveGmRolePreset already falls back to the built-in All, whose widget list is empty, so the region simply goes away - and because the operator's CHOICE is untouched, the preset reappearing after a world reload restores their composition without them re-selecting it."
        - "[ai] Two Game Masters may hold identical or different presets with identical authority: the composition is read from the effective preset on each browser and the filters are scoped by session id plus operator id, so neither inherits the other's narrowing or their snoozes and neither one's selection is visible to the fleet. A new session has no stored scope and no stored identity, so it starts on All with no stale snoozes - the reset that needs no explicit clear."
    architecture:
      kind: gm-presentation-composition
      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-t3-station-workload, gm-t2-role-presets, gm-milestone-facilitation-assistance]
      runs_in: [host-browser-runtime]
    implementation:

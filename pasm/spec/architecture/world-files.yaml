      summary: Runs the engineering-owned transfer umbilical - the third slice of PRD #1143's coupling family. Takes the start/stop commands, gates the flow on the ship's docked relationship (#1159), reads both docked ends' capacity ledgers, hands them plus the authored rate and direction and the stored carry to the pure flow-arithmetic module, and queues the resulting capacity move on each end through the infrastructure adjustment queue. Publishes the umbilical's blackboard. It gates on the dock the way the dock gates on Helm's manoeuvre.
      rationale:
        - "[ai] IT COPIES THE TRACTOR'S AND DOCK'S SHAPE (rule 10). A pure Bevy-free `flow` module owns the arithmetic - how much of the authored capacity crosses this tick, clamped by source depletion and destination headroom in both directions with no over/undershoot, metering a per-second rate onto a whole-number ledger through a carry - unit-tested in isolation. A `server` adapter gathers the live world, calls in, and applies what comes back. The umbilical is a first-class engineering `[[system]]`: it declares a power group, carries a damage entry, is admission-gated, registers as an admitted consumer and publishes under its own system id."
        - "[ai] IT FLOWS ONLY WHILE DOCKED. The whole slice gates on #1159's docked relationship: the flow tick runs after the dock tick (reading the fresh docked_partner) and refuses `Undocked` the moment the two hulls part, so resupply requires Helm to have achieved the dock first - two seats on two ships, or two seats on one. The capacity moves through the SAME queue the arrest (#1158) and the operations transfer use - a CapacityAdjustment on each end drained by tick_infrastructure_condition, ordered before it so the move lands the same tick - so the goods cross the docked partner's own authored ceiling and re-publish onto the counter a scenario predicate reads."
        - "[ai] THE ARITHMETIC IS PURE AND CLAMPS BOTH WAYS. Direction resolves which docked end is source and which destination (deliver = operator -> partner, collect the reverse), and the move is clamped by the source's level and the destination's headroom so it can neither drain past empty nor fill past the ceiling. The carry keeps only the sub-unit remainder, never a whole-unit backlog the clamp discarded, so a source that runs dry and later refills does not dump a hoard (no overshoot) and a freed-up destination resumes at the authored rate (no undershoot)."
        - "[ai] EACH INTERRUPTION STOPS THE FLOW AND KEEPS WHAT HAS MOVED. Stopping, undocking, dropping below the authored min_power_level, damaging the umbilical to Disabled, or a partner that carries no such capacity all clear the running intent and record the one refusal the console shows, checked most-actionable-first like the tractor's and dock's verdicts. What has already crossed the umbilical has crossed - the ledgers are not rewound."

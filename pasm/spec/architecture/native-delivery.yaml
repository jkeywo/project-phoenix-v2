  - component: bridge-layout-store
    core:
      status: implemented
      confidence: confirmed
      title: Saved Bridge Layouts
      summary: Per-user, per-ship-class layout persistence (issue #1334). Every ACCEPTED lobby layout change — the viewscreen's monitor, a station console's screen — is filed as a validated bridge profile under the operator's own settings directory keyed by ship class (%APPDATA%\ProjectPhoenix\bridge-layouts\<class>.toml on Windows, via the directories crate), and picking that class in a later session pre-applies it. The store is Bevy-free and its LOCATION IS INJECTED so tests never touch a real user directory; the Bevy adapter is two systems beside it. A saved layout is re-validated on load against the profile schema AND against the store's own narrower one (seats only — no station-less [[display.pane]], no [[touch]], no [[media]]), and one that fails either is ignored with a warning naming the remedy, never fatal. An explicit --profile wins for its run, is not pre-applied over, and is NEVER written back — nor read back in, which is what keeps `reserved` empty on an unauthored run.
      rationale:
        - "[ai] The class key is the hull TEMPLATE PATH'S FILE STEM, because there is no authored class identity to key on: ShipConfig carries stations, systems and power groups and no class id, so the only stable name a hull answers to is the template it was loaded from — which is exactly what SelectedShipResource already holds on both world-arrival paths, in the canonical form install_world_selection stored (so ./assets\\entities\\x.toml and assets/entities/x.toml are one hull rather than two). The STEM rather than the whole path because the directory it names is one an operator opens, copies between machines and deletes single entries from, and assets_entities_alliance_destroyer.toml is not that directory. The trade bought is that two hulls of one file name in different directories (a mod pack shipping its own alliance_destroyer.toml) share a saved layout — a degradation rather than a fault, because the file is adopted through reconcile + adopt_profile against the hull actually flying, so stations the other hull lacks arrive unassigned and are reported, the same graceful answer a changed monitor set gets. ShipClassKey is a NEWTYPE and the store takes one instead of a &str: every character outside [a-z0-9_-] becomes _, and a stem that reduces to nothing but separators is None, so a key can hold no path separator, no drive letter and no .. and traversal is unrepresentable rather than filtered. One Windows caveat is RECORDED RATHER THAN FIXED: a hull template named for a DOS device (con.toml, nul.toml, aux.toml, com1.toml) reduces to that reserved word and Windows resolves bridge-layouts\\con.toml to the device rather than to a file, so that class's saves fail with an ordinary LayoutStoreError::Write warning and it simply never remembers — the same degradation an unwritable directory gets. No shipped hull is named that, the failure is loud and costs nothing else, and a reserved-name escape would make the file name stop matching the hull the operator is looking at."
        - "[ai] The pre-apply fires at the HULL-KNOWN MOMENT rather than at boot, and that moment is a STATE rather than a path: the frame SelectedShipResource first names a class this host is not already remembering. A --world host resolves its hull in install_world_selection before the App runs; a --lobby host (#1326) resolves it at the pick, minutes later, on a running world — so a system written against either path would cover one of them. It also RECONCILES ONTO THE HULL'S ROSTER in that same moment, and that half is not optional: apply_bridge_profile seeds the layout from whatever roster exists when winit first reports monitors, which on a world-less host is nothing at all, so without it a --lobby host would carry an empty roster for the rest of the run and the lobby's per-station screen rows (a map over eligibility()) would be empty with it. Adoption then goes through BridgeLayout::adopt_profile — the SAME door a hand-authored --profile comes through — so a saved layout gets no privileges a written one does not have, and a monitor that is gone is a SeatRefused note plus an unassigned station rather than an error. Adoption and reconcile notes are LOGGED, never pushed to the lobby's notice row, for the reason boot-time adoption notes already are: this is a bridge arriving, not an answer to a press."
        - "[ai] The two systems are ordered after the WHOLE display adapter (bridge_display::BridgeDisplaySet, added by #1334 for exactly this), not merely after apply_bridge_profile. They take ResMut<BridgeLayoutResource>, which follow_layout_stations and watch_runtime_displays also want, so a narrower constraint leaves the executor to serialise them in an order that is arbitrary but SILENT — the consoles a remembered layout seats would open on the seed frame or the one after it depending on how the run went, which is the class of difference that first shows up on somebody else's machine. Ordered after the set it is always the frame after: the adoption lands in the frame the layout is first seeded (the resource exists by then — apply_bridge_profile is exclusive and inserts it directly), and the follower opens the consoles on the next pass, the same one-frame settle a lobby press already takes. The set is what a plugin OUTSIDE the chain can name; a private member of it is not. ONE ROW OF THAT STORY IS LEFT OPEN ON PURPOSE, and is recorded rather than left to be rediscovered: host_lobby::publish_bridge_layout also holds ResMut<BridgeLayoutResource> in Update and is in neither set, so the executor may run it either side of the adoption — the same ambiguity class. It is ACCEPTED because the cost is bounded and one-directional: an adoption marks the resource changed and the publisher pushes any layout that changed, so a publisher that ran first republishes the adopted arrangement on the very next frame, leaving the lobby's rows at worst one frame late on the boot-or-pick frame and never wrong (the consoles themselves follow follow_layout_stations, inside the set). Ordering it would mean dragging the lobby's whole Update chain after the display adapter and moving every notice's frame with it, to buy one frame once per class."
        - "[ai] WRITE ON EVERY ACCEPTED CHANGE — not debounced, not deferred to shutdown. A saved layout is a handful of [[display]] tables written through one atomic rename, so the per-press cost is a rounding error beside the frame that press already caused, while both alternatives carry a lossy window: a debounce needs a timer, a flush on the last edit and an answer for a host killed inside the window (the arrangement the operator just made is the one they lose), and a write-on-exit needs a shutdown hook a windowed process is not guaranteed to reach — closed from the taskbar, or taken down with a display driver, loses the whole session. The trigger is the law resource's change detection PLUS a value compare against what the file holds, because change detection answers did somebody hold a ResMut, not is the bridge different: a press the no-op doctrine accepted, or a reconcile that rebuilt an identical layout, marks the resource and must not rewrite the file — the change detection is a run condition (resource_exists_and_changed::<BridgeLayoutResource>) on the writer and the value compare is inside it, so the claim and the code agree. A FAILING DISK IS WARNED ABOUT ONCE PER CHANGE, NOT ONCE PER FRAME. A failed write leaves that record alone so the next accepted change retries rather than the host giving up for the run, and taken alone that is a log storm waiting for a read-only %APPDATA%: LayoutStoreError::Write is a PERSISTENT condition (a locked-down profile directory, a full disk, a scanner holding the file, a class keyed to a reserved device name), so the arrangement differs from the file would stay true on every frame forever and bury LogCat::Lobby under one repeated sentence at the frame rate. The retry is therefore keyed on the CHANGE in two layers: the run condition means an idle bridge never reaches the writer, and Remembered::unsaved records the arrangement the disk REFUSED so a frame that does get there — this module is not the law's only writer, so another writer's frame can open the gate with nothing for it to do — offers the disk something new or nothing. THE RECORD IS CLEARED THE MOMENT THE LIVE BRIDGE IS BACK TO WHAT THE DISK HOLDS, which is what keeps that a suppression rather than a giving-up: the operator's own recovery from a failed write is to put the bridge back while they go and fix the directory and then make the change again, and that third press produces THE VERY ARRANGEMENT THE DISK REFUSED because undo-then-redo is the only path back to it — so a record that cleared only on a successful write would swallow that press and every one after it, ending the session with one bridge on screen and another on disk, after a warning that had promised a retry. Clearing it at the nothing-to-do return cannot re-open the storm, because reaching that return means the file already holds what is on screen and a warning is a whole accepted change away. The next different arrangement, including the operator's press after they have fixed the directory, tries again and recovers."
        - "[ai] A CABLE COMING OUT IS NOT THE OPERATOR CHANGING THEIR MIND. The saved layout is the operator's INTENT, and the law's resource has a second writer that is not them: bridge_display's reconcile, which degrades a station whose monitor has gone to unassigned. Writing that would mean a screen blipping through a dock permanently forgets where two consoles were on a bridge nobody touched — the same silent loss #1123's never-re-home doctrine refuses, arriving through the file instead of through a window. So the trigger is the arrangement changed while THE BRIDGE DID NOT: Remembered carries the monitor IDENTITIES its saved layout was agreed on (identities rather than DiscoveredMonitors, because a display that merely moved or renegotiated its mode is not a bridge that changed and reconcile_layout deliberately rebuilds nothing for it), and a frame that changed the monitor set RE-BASELINES AND WRITES NOTHING. The file keeps the fuller arrangement and the next press writes the updated layout, because by then the bridge and the baseline agree again — which is exactly how #1334's changed-monitor criterion says the console comes back. It is also what makes the cross-session case right AS FAR AS IT GOES: launching on a laptop with two of four screens adopts a degraded layout and writes nothing, so merely RUNNING there costs the operator nothing — but the moment they rearrange anything on the laptop that press is filed and the file becomes the two-screen bridge, because a press is intent and nothing here can tell tidying up on the road from this is my layout now. The arrangement survives the trip, not the editing. Two edges are recorded rather than hidden: a press landing in the same frame as an unplug is re-baselined with it and reaches the file only on the next press (a rare race, with the bridge on screen correct throughout), and reconcile_seated_consoles surrendering a seat it could not build a console for changes no monitor, so that IS filed — a real state the operator is told about, and re-pressing writes it back."
        - "[ai] The write is ATOMIC — temp file beside the target, sync_all, rename over the top — because the failure it avoids is a host crashing mid-save and the NEXT boot finding half a TOML file, which reads as your saved layout is corrupt for a bridge that was fine. On Windows std::fs::rename is MoveFileExW with MOVEFILE_REPLACE_EXISTING, so unlike a bare MoveFile it does replace an existing destination and within one volume is the closest thing Windows offers to a POSIX rename; it can still fail with a sharing violation while an editor, indexer or scanner holds the target open, which surfaces as an ordinary warning with the PREVIOUS FILE UNTOUCHED. The temporary carries the process id so two hosts saving one class cannot write each other's, and is removed on EITHER failure so an ORDINARY failed save leaves no debris. A HARD kill between the create and the rename does leave one, because nothing runs at all — and this is a directory an operator browses — so build_native_host_app calls LayoutStore::sweep_temporaries once when it opens the real store, removing that debris and logging each at debug. WHAT IT MATCHES IS THE WRITER'S OWN NAME SHAPE — <file name>.<process id>.tmp — rather than every *.tmp in the directory: this is a directory an operator opens, and their own notes.tmp beside their layouts is not a file the host has any business deleting on the next launch, silently. Swept by name rather than by age, and the race that buys is recorded rather than closed: a second host of the same user launching in the microseconds another is between its create and its rename would delete that temporary, whose owner then reports an ordinary Write failure with its PREVIOUS FILE UNTOUCHED and files again on the next accepted change — the failure mode a sharing violation already has. An age threshold would need a clock and a number to close a window that is already a documented no-op."
        - "[ai] --profile PRECEDENCE IS ALSO THE DATA-LOSS GUARD, and it is held in FOUR places because the failure is silent and permanent. to_validated_profile emits seats and only seats, so the authored --pane participant surfaces a layout merely knows about (BridgeLayout::reserved_on) do not come back out of a file: persisting a --profile-seeded layout would drop the operator's [[display.pane]] entries silently, and the next boot would read those screens as free and move the viewscreen on top of a crew member's live console — the exact failure `reserved` exists to prevent, re-introduced by the save. #1334 had two answers available (re-emit the participant slots, or refuse to persist such a layout) and took the second: build_native_host_app gives a --profile run no store resource at all; both systems are additionally gated on BridgeDisplayConfig::authored being false, so a composition that inserted one anyway still writes nothing; LayoutStore::save REFUSES a reservation-carrying layout outright at the only door onto the disk, so a caller added later inherits the guard rather than having to remember it; and LayoutStore::LOAD refuses a FILE carrying a station-less [[display.pane]] (LayoutStoreError::NotALobbyLayout), the mirror of the same rule at the other door. The fourth is NOT belt-and-braces and is what the fix round added: the saved file IS a bridge profile in a directory an operator browses, so copy your --profile in here is an invitation this feature extends, and without a load-side refusal the chain runs — the pre-apply adopts it so `reserved` is populated on a run NOBODY AUTHORED (falsifying the invariant below), the bridge acquires a PHANTOM OCCUPANT (a screen reported full at seats nobody can see, a Station window with a permanently dead half, refusals naming a console that is nowhere on screen), and the operator's first press is then refused by save's WouldDropReservations FOR EVER because the file that caused it is never rewritten: one ship class silently un-saveable, with the only line in the log being the wrong sentence. Refused at the door it drops into the existing warned-ignored-file-left path and the warning names the REMEDY (delete the [[display.pane]] entries that have no station =, or point --profile at this file instead), and the next lobby press files a real layout over it, so a copied profile costs one session's arrangement rather than the class. Which leaves the invariant stated positively: a saved layout is only ever a lobby-built one, and a lobby-built layout is reservation-free by construction, because nothing but adopt_profile populates `reserved` and — BECAUSE load refuses a station-less pane slot — nothing but an authored --profile reaches it."
        - "[ai] A saved layout is NEVER TRUSTED, and it goes through TWO DOORS, OUTERMOST FIRST: load parses AND re-validates, handing back the same ValidatedProfile a hand-authored --profile produces, so a file edited by hand, written by an older schema version, or truncated by a full disk meets exactly the refusals the flag meets; and then the store's OWN NARROWER SCHEMA, which holds the viewscreen and the seated station consoles and nothing else. That order is deliberate — this is not a bridge profile is the more fundamental complaint and should be the sentence an operator gets first — and the caller's whole answer to either is a warning naming the file plus the bridge it already has. [[touch]] AND [[media]] ARE REFUSED RATHER THAN PRESERVED: save writes to_profile(), an EMPTY profile with the displays written into it, so those tables were previously wiped silently by the next press. Preserving them through BridgeLayout::write_displays_into (which exists for exactly that) was the alternative and is NOT taken, for two reasons — it would not actually be lossless, because write_displays_into replaces the whole [[display]] list so the file's participant slots would still be dropped one table over and out of the reservation guard's sight; and it puts a read, a parse and a policy for an unparseable file onto the WRITE path, which runs on every accepted press. So the store's schema is displays-only, and the claim that survives is the one true in the direction that matters: a file this store WROTE is a profile an operator may hand straight back to --profile, while a --profile is not in general a file this store will READ. REFUSING THEM DOES NOT SAVE THOSE TABLES and the note says so rather than claiming the refusal is free: the file is ignored for the run and the first press files a saved layout over it, so they are gone by the end of the session either way — what changes is that the loss is ANNOUNCED, by a sentence naming where they belong, before it happens, instead of being discovered by an operator wondering why their touchscreen stopped working. THE REMEDY IS COMPOSED FROM WHAT THE FILE ACTUALLY CARRIES, one imperative per refusal class present (delete the station-less [[display.pane]] entries; move every [[touch]]/[[media]] table into a --profile of your own) with the one move that always works as the tail (point --profile at this file instead). One blended sentence naming every class was the first shape and it was wrong in the ORDINARY case: an operator whose file held a [[touch]] mapping and nothing else was told to delete pane entries their file does not contain and was never told what to do with the table that was refused. The finding and the remedy are built from the same three table-name constants, so they cannot drift into naming different things. The door DESTRUCTURES BridgeProfile rather than hand-walking its fields, so a field added to the profile is a BUILD FAILURE at the door rather than a table the store silently accepts and then overwrites out of the file on the next press. The file is LEFT WHERE IT IS rather than deleted or moved aside: an operator who hand-edited it wants to see what they wrote. An absent file is Ok(None) rather than an error, because that is the ordinary state of a class nobody has arranged, and reading creates no directory — the FIRST WRITE does, which is what makes created on first write true rather than intended."
        - "[ai] BaseDirs::data_dir() rather than ProjectDirs. ProjectDirs appends its own config/data leaf on Windows (%APPDATA%\\<Org>\\<App>\\data), which is neither the path this issue specifies nor a directory an operator would look in; data_dir() is %APPDATA% exactly and the store joins ProjectPhoenix/bridge-layouts onto it, so the Windows path is the authored one and Linux (~/.local/share) and macOS (~/Library/Application Support) get their own conventional root rather than a Windows-shaped one. The crate is declared in the NATIVE-ONLY target stanza, not [dependencies]: native_host is itself cfg(not(wasm32)), so the browser build must not carry a home-directory resolver it can never reach. A machine with no resolvable home directory gets a warning and runs without saved layouts — a bridge nobody can remember is still a bridge."

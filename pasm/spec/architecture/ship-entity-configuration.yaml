entities:
  - component: entity-template-cache
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Cache
      summary: Host-side cache of parsed entity TOML templates used by world loading and spawning.
    architecture:
      kind: configuration-cache
      authority: authoritative
      owns: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs, src/entities/config_cache.rs]
      symbols: [EntityConfig, ConfigCachePlugin]
      tests: [cargo test]

  - state: entity-template-state
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template State
      summary: Parsed entity-template configuration for tags, mesh, collider, hull, behaviour, weapons, systems, presentation, and authored capability settings.
    architecture:
      classification: authoritative
      owner: entity-template-cache
      writers: [entity-template-cache]
    implementation:
      status: declared
      paths: [src/entities/config.rs, assets/entities]
      symbols: [EntityConfig]

  - component: entity-template-composition-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Composition Resolver
      summary: Resolves ordered relative entity-TOML includes depth-first, merges fragments and declaring-template overrides through the established entity merge contract, and returns one fully resolved template with source provenance before validation or spawning.
      rationale:
        - Reusable entity and fine-system behaviour fragments must be authoring-time composition rather than a second runtime inheritance or policy-lookup model.
        - Deterministic merge order, include-chain diagnostics, and cycle rejection prevent content composition from becoming hidden behaviour.
        - "Issue #869 (e1898df7) built it. Entity TOML gains an ordered `includes` key (INCLUDES_KEY), resolved depth-first in declared order with each fragment merged into the accumulator and the DECLARING template merged LAST, so the includer always wins: a template including [a, b] resolves as ((a closure) then (b closure)) then self. The result is ONE fully resolved TOML document, parsed exactly once, BEFORE validation and spawning. Includes do not exist at runtime — no lookup, no inheritance, no second control path."
        - "Issue #869 put resolution deliberately UPSTREAM of the per-instance override path rather than folding the two together, and the reasoning is not preference. (1) EntityConfig is deny_unknown_fields, so an `includes` key cannot survive parsing; folding resolution into entity_loader::apply_overrides — which starts from an already-parsed EntityConfig — would have meant adding an includes field to EntityConfig purely to carry authoring metadata into the runtime and then scrubbing it there, which is exactly what this issue forbids. This resolver operates on raw TOML text and the key never reaches the struct. (2) CARDINALITY: includes resolve once per TEMPLATE (cached), overrides once per INSTANCE, and apply_overrides pays a serialise-merge-render-reparse round trip because its input is already a struct — fusing them would multiply that round trip by every spawn. Both layers nonetheless call the SAME merge (entity_override::merge_entity_config_toml), so there is still exactly one set of merge rules."
        - "Issue #869 merge semantics, stated because they are the trap the #878 hull migration will meet first. The two arrays that reconcile by key — behaviour.state by `name` and behaviour.doctrine by `id` — merge element-wise; a fragment authoring doctrine = [] CLEARS what earlier fragments contributed, which is a fragment's only subtractive lever. EVERY OTHER ARRAY REPLACES WHOLESALE: tags, [[station]], [[system]], [[shield_arc]], [[weapons_console.phaser_banks]] and the rest. A hull that includes a systems fragment and then declares its own [[system]] blocks replaces the fragment's whole suite rather than adding to it. That is merge_toml's long-standing array rule, shared with instance overrides; widening it would change override semantics too and was deliberately out of scope."
        - "Issue #869 PATHS are resolved relative to the declaring template and canonicalised LEXICALLY (backslash to slash, . and .. collapsed) rather than through std::fs::canonicalize, because the key must be identical on WASM (no filesystem) and natively — the same keys double as config-cache keys and as the cycle-detection identity. Cycles, missing files and invalid resolved templates are load errors naming the include chain."
        - "Issue #869 extended BOTH preload paths rather than duplicating them, and the browser one needed a new idea: a delivered file may be a FRAGMENT, which never enters the config cache, so cache membership alone could not stop a fragment shared by five hulls being refetched for ever. PreloadStep expresses the browser walk (Ready / AwaitingIncludes). A test drives the same fixtures through the native and browser walks and asserts byte-identical output and identical provenance."
        - "SCOPE LIMIT, stated so this status is not read as more than it is: NO SHIPPED HULL IS COMPOSED YET. The only templates declaring includes are the composition fixtures under assets/entities/fragments/ — composed_escort.toml and npc_escort_core.toml, plus the reusable ai/fleet_baseline.toml and ai/captain_red_alert_aggressive.toml they pull in. Migrating the shipped hulls onto fragments is issue #878, and #885 authored its ten selector-block copies INLINE and byte-identical precisely because that migration has not happened (composition resolves strictly upstream of the parser and the parser rejects an includes key, so about ninety test sites that read shipped hull text raw would have had to move at the same time — measured at 169 failures across 88 sites)."
    architecture:
      kind: configuration-transform
      authority: authoritative
      owns: [resolved-entity-template-state]
      reads: [entity-template-state]
      produces: [resolved-entity-template-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/entities/include_resolve.rs, src/entities/config_cache.rs, src/entities/loader.rs]
      symbols: [resolve_template, resolve_from_disk, load_entity_config, preload_step, PreloadStep, ResolvedTemplate, Provenance, FieldOrigin, MergeStep, IncludeError, IncludeErrorDetail, FsFragmentSource, INCLUDES_KEY]
      tests: [cargo test]

  - state: resolved-entity-template-state
    core:
      status: implemented
      confidence: confirmed
      title: Resolved Entity Template State
      summary: One validated EntityConfig plus include-chain provenance, after all declared entity-TOML fragments and declaring-template overrides have been deterministically composed.
      rationale:
        - "Issue #869 realises the provenance half. Provenance records which fragment set each field and the include chain that reached it. The two merge-reconciled arrays are addressed BY KEY (state by name, doctrine by id) rather than by index, because positions are not stable across a merge, and a leaf write PRUNES its former subtree so a cleared list stops reporting fields that no longer exist. The provenance types are deliberately kept free of project types so the module stays liftable."
    architecture:
      classification: authoritative
      owner: entity-template-composition-resolver
      writers: [entity-template-composition-resolver]
      readers: [ship-config-loader, entity-spawn-orchestrator, entity-template-schema-validator]
    implementation:
      status: declared
      paths: [src/entities/include_resolve.rs]
      symbols: [ResolvedTemplate, Provenance, FieldOrigin, MergeStep]
      tests: [cargo test]

  - component: ship-config-loader
    core:
      status: implemented
      confidence: confirmed
      title: Ship Configuration Loader
      summary: Extracts and validates station/system topology, ratings, power groups, and per-system configuration from a ship entity template.
    architecture:
      kind: configuration-validator
      authority: authoritative
      writes: [ship-station-system-topology-state]
      reads: [entity-template-state]
      validates: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/config.rs, src/entities/config.rs, src/ship/system_registry.rs]
      symbols: [parse_and_validate, ShipConfig]
      tests: [cargo test]

  - component: entity-spawn-orchestrator
    core:
      status: implemented
      confidence: confirmed
      title: Entity Spawn Orchestrator
      summary: Instantiates world and runtime entities with authored transform, collider, hull, ship, behaviour, faction, system, and presentation components.
    architecture:
      kind: lifecycle-service
      authority: authoritative
      owns: [spawned-entity-state]
      reads: [entity-template-state, world-configuration-state, ship-station-system-topology-state]
      produces: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/world/server.rs]
      symbols: [spawn_entity]
      tests: [cargo test]

  - state: spawned-entity-state
    core:
      status: implemented
      confidence: confirmed
      title: Spawned Entity State
      summary: Authoritative live ECS entities and their stable world/runtime identity after template and world configuration are resolved.
    architecture:
      classification: authoritative
      owner: entity-spawn-orchestrator
      writers: [entity-spawn-orchestrator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/core/messages.rs]
      messages: [EntitySpawned, EntityDespawned]

  - component: model-marker-contract
    core:
      status: implemented
      confidence: confirmed
      title: Model Marker Contract
      summary: Connects authored model rigs and named marker points to ship systems, weapon origins, engine effects, cameras, and other presentation/runtime attachments. Every reference is validated against the selected rig at authoring time in the editor, in CI over the shipped templates, and at native/headless startup before any entity spawns; the browser host does not yet run the gate because its rig sidecars arrive asynchronously.
    architecture:
      kind: configuration-contract
      authority: authoritative
      reads: [entity-template-state, ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: confirmed
      paths:
        - src/entities/model_rig.rs
        - src/entities/marker_validate.rs
        - src/entities/config.rs
        - src/server/pfx.rs
        - src/headless/app.rs
      symbols: [ModelRig, MarkerFinding, MarkerRole, validate_entity_markers, duplicate_marker_findings]
      tests: [cargo test]
    exceptions:
      - rule: every-marker-reference-is-validated-before-attachment
        scope:
          - host-browser-runtime
        rationale: >-
          The gate runs at authoring time in the editor, in CI over every shipped template, and at
          native/headless startup before App::new. It does not run in the browser host: there rig
          sidecars are fetched asynchronously by JS (wasm_push_sidecar_toml) some frames after the
          entity template is parsed, so no point in the boot sequence knows the full set of rigs
          before glb_visual attaches. A hand-edited template that bypassed both the editor and CI
          would therefore still fall back silently in the browser.
        temporary: true
        removal_condition:
          - browser-host-validates-marker-references-once-sidecar-fetches-settle
        approval_status: accepted
    evidence:
      - kind: test
        reference: phaser_bank_missing_marker_is_located_error
        summary: An unresolved weapon marker is a source-located error finding rather than a silent fall back to the ship centre.
      - kind: test
        reference: weapon_referencing_camera_marker_is_incompatible
        summary: The reserved camera_ marker namespace is enforced in both directions, so a weapon cannot claim a viewpoint.
      - kind: test
        reference: duplicate_marker_declaration_is_located
        summary: A rig that declares the same marker twice is reported with its line rather than being silently deduplicated.
      - kind: test
        reference: every_shipped_entity_marker_reference_resolves
        summary: Every marker reference in the shipped entity templates resolves against the rig its mesh selects.

  - component: entity-override-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Entity Override Resolver
      summary: Applies world-authored entity overrides to template defaults before spawn without changing the template's shared definition.
    architecture:
      kind: configuration-transform
      authority: authoritative
      reads: [entity-template-state, world-configuration-state]
      transforms: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/entity_override.rs, src/entities/spawner.rs]
      tests: [cargo test]

  - component: world-available-ship-catalog
    core:
      status: implemented
      confidence: confirmed
      title: World Available Ship Catalog
      summary: Exposes the template paths and labels offered for player-ship selection. Reads a loaded world's available ship entries, and — before any world is loaded — builds the catalog from the base scenario manifest so each selectable scenario's ships are available pre-load.
    architecture:
      kind: catalog-provider
      authority: authoritative
      owns: [scenario-ship-catalog-state]
      produces: [scenario-ship-catalog-state]
      reads: [world-configuration-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/manifest.rs, src/world/config.rs, src/server/bridge.rs, server.html]
      symbols: [AvailableShipEntry, ScenarioCatalog, build_catalog]
      tests: [cargo test]

  - component: entity-template-schema-validator
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Schema Validator
      summary: Parses and validates the authored entity configuration surface, including mesh and LOD, collider, region, hull, systems, stations, weapons, Helm, Power, Shields, Sensors, Navigation, Comms, behaviour, faction, and presentation sections.
    architecture:
      kind: configuration-validator
      authority: authoritative
      reads: [entity-template-state]
      validates: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs, src/ship/config.rs]
      tests: [cargo test]

  - component: entity-component-composition
    core:
      status: implemented
      confidence: confirmed
      title: Entity Component Composition
      summary: Applies each present validated template section as the matching runtime component set, including stable IDs/names, transform, physics, ship systems, faction/behaviour, combat, regions, and visual configuration.
    architecture:
      kind: entity-composer
      authority: authoritative
      reads: [entity-template-state, ship-station-system-topology-state]
      writes: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/entities/loader.rs, src/ship/config.rs]
      tests: [cargo test]

  - component: entity-template-capability-contract
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Capability Contract
      summary: Treats ship systems and station topology as authored capabilities rather than fixed categories, so templates may omit engines or any console system while the runtime composes only declared components.
    architecture:
      kind: configuration-contract
      authority: authoritative
      reads: [entity-template-state, ship-station-system-topology-state]
      coordinates: [entity-component-composition]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs, src/ship/config.rs, src/entities/spawner.rs]
      tests: [cargo test]

# Harrow Cruiser (Ironveil class)
#
# Medium-weight cruiser. Two phaser banks (port + starboard), shielded,
# fights to the death. (#474) Rebalanced for the combat-test scenario
# (#475) — gained weapons (previously had a `[behaviour]` block declaring
# `attacking` state but no `[weapons_console]`, so could not fire),
# gained `on_attacked → pursue` transition (mirrors the destroyer),
# gained a `[shields]` block, removed flee/warp_out from combat.

name = "Harrow Cruiser"
tags = ["ship", "npc", "comms_contact"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "medium"
description = "Harrow Cruiser"

[hull]
hull_integrity = 120.0

# Single omni shield arc (issue #514). NPCs have no `[shields]` station so
# the auto-generated `[[system]]` entry is `ai_only = true` and ownerless.
[[shield_arc]]
id = "all"
label = "All"
center_deg = 0
width_deg = 360
max_hp = 60
regen_per_sec = 1.0

[collider]
shape = "Capsule"
radius = 3.0
length = 7.0

[radar_appearance]
colour = [0.8, 0.3, 0.1]
size = 7.0
icon = "cruiser"

[mesh]
model = "assets/models/dynasty_cruiser.glb"
shape = "cuboid"
size = [6.0, 2.0, 10.0]
colour = [0.8, 0.3, 0.1]

[helm_console]
max_speed = 12.5
max_reverse_speed = 6.25
acceleration = 4.1665
deceleration = 12.5
max_yaw_rate = 0.196
max_bank_deg = 10.0

[helm_console.engine_pfx]
color = [ 1.0, 0.22, 0.08, 0.68 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.55

[weapons_console]

# Port bank: facing -90° (left side), wide auto-arc so the cruiser can
# fire one bank or the other depending on relative bearing without
# perfect alignment.
[[weapons_console.phaser_banks]]
id = "port"
facing_deg = -90.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 50.0
beam_damage_per_sec = 8.0
beam_duration_secs = 5.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.2, 0.05, 1.0]

# Starboard bank: facing +90° (right side).
[[weapons_console.phaser_banks]]
id = "starboard"
facing_deg = 90.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 50.0
beam_damage_per_sec = 8.0
beam_duration_secs = 5.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.2, 0.05, 1.0]

[comms]
range = 600.0

[ai_profile]
aggression = 0.7
sensor_range = 110.0

# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# (#572) Doctrine-based behaviour (FSM dissolved). Destroy outscores Patrol so
# the cruiser immediately engages any hostile; falls back to patrol waypoints
# when no target is visible.

[behaviour]

[[behaviour.doctrine]]
id            = "patrol-ironveil"
text          = "Patrol the Ironveil sector"
directive_kind    = "Patrol"
directive_anchors = ["ironveil_patrol_a", "ironveil_patrol_b"]
directive_loop    = true
base_priority     = 20.0
target_speed      = 0.5

[[behaviour.doctrine]]
id            = "destroy-hostiles"
text          = "Engage and destroy hostile ships"
directive_kind = "Destroy"
base_priority  = 35.0
target_speed   = 0.9
maintain_range = 45.0


# Ship systems (all AI-controlled - no human consoles)
[[system]]
id = "helm"
kind = "helm"
ai_only = true

# Fine Tactical systems (issue #512): port + starboard phaser banks. No torpedoes.
# `phaser_bank_system_id("port")` resolves to `SystemId("phaser-port")` via
# the `phaser-<id>` naming convention, and the resolver has that id from the
# [[system]] block below, so per-bank gating (system_is_registered + own
# fine-system policy) is used for firing.
[[system]]
id = "phaser-port"
kind = "phaser_bank"
ai_only = true

[[system]]
id = "phaser-starboard"
kind = "phaser_bank"
ai_only = true

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
ai_only = true

[[system]]
id = "power-battery"
kind = "power_battery"
ai_only = true

[base]
offset = [ 0, -1.212814313222212, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 2.098914957382016, 2.098914957382016, 2.098914957382016 ]

[extents]
min = [ -1.9959791227143848, -1.2148179993671715, -1.5273063418705248 ]
max = [ 2, 1.212814313222212, 1.514345080220818 ]
size = [ 3.9959791227143846, 2.4276323125893837, 3.041651422091343 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_rare_2
# Same bands and ratios as the four common asteroids, so every rock in a
# field switches level at the same distance. No `remesh_voxel_size` here:
# the import already brought this mesh down to the commons' density with a
# UV-preserving Blender collapse (scripts/blender-decimate.py), which is
# what the voxel pre-pass was standing in for on the stubborn commons.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_rare_2.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_rare_2_lod1.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_rare_2.glb"
ratio = 0.536
error = 0.01
texture_size = 512

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_rare_2_lod2.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_rare_2.glb"
ratio = 0.113
error = 0.01
texture_size = 128

[[lod]]
billboard = "assets/models/asteroid_rare_2_lod3.png"
scale = [ 3.9836, 2.419, 1.0 ]

[lod.capture]
source = "assets/models/asteroid_rare_2.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

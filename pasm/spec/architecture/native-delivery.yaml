  - component: bridge-layout-law
    core:
      status: implemented
      confidence: confirmed
      title: Bridge Layout Law
      summary: The runtime transition law every path that rearranges a bridge obeys (issue #1327) — the lobby's monitor buttons and per-station screen rows, a saved per-ship-class layout being pre-applied, and a hand-authored --profile. Exactly one viewscreen; a station console never on the viewscreen's monitor; at most two consoles per screen, split deterministically side by side. Pure and Bevy-free - apply(state, action) answers a NEW layout or a typed refusal, per-monitor occupancy and per-station eligibility are reported so no UI re-derives a rule, and the whole arrangement converts to and from the validated display profile. Where bridge-display-profile judges a FILE, this judges a TRANSITION.
      rationale:
        - "[ai] The layout keys stations by StationId, never by participant label. A console the lobby opens on a wall monitor is claimable by anyone — crew symmetry is not decided by where a screen is — so at layout time there IS no participant to name; what is being placed is the ship's own authoring key for a claimable station. The id survives persistence because PaneSlot carries an optional station field beside its label, as a SEPARATE field rather than an overloaded label: label keeps its one meaning (the participant name open_pane_for_name resolves and DuplicatePaneLabel governs), and a pane with no station reads back as exactly the --pane pane it is, instead of being minted into a station whose id happens to be somebody's name. Skipped when absent, so every profile authored before #1327 round-trips byte-identically."
        - "[ai] BridgeProfile::validate gains MissingViewscreen — a profile that assigns monitors but names no viewscreen. That is the one station-over-viewscreen path a hand-authored profile still had: apply_bridge_profile puts the viewscreen role on the process's PRIMARY window, so with no viewscreen entry that window is never placed and stays wherever the OS opened it, on a monitor a station entry may also name, whereupon a borderless-fullscreen console covers the shared view. Gated on there being displays at all, because a touch/media-only profile opens no Station window and so has nothing to cover the viewscreen with — the shape the #1126 kit ships, and the shape --pane's own profile-less tiling path relies on."
        - "[ai] A station on the viewscreen's monitor is deliberately NOT a profile refusal: a monitor appears at most once in a profile (DuplicateId), so inside one file it is already structurally impossible. The overlap is a property of a runtime TRANSITION and is refused there, as LayoutRefusal::StationOnViewscreenMonitor. Two refusals for one rule, in two places, is how they start disagreeing."
        - "[ai] Moving the viewscreen onto a monitor that is holding consoles is REFUSED (ViewscreenMonitorHoldsStations), not resolved by evicting them. Silent eviction is the same failure as a silently re-homed missing display one slice up: an arrangement the operator did not ask for. Unassigning first is two deliberate steps, and the refusal message says so."
        - "[ai] There is no separate move action. Assigning a station that is already seated IS the move — the PRD's press a different screen button — so the lobby presses one button either way and cannot pick the wrong verb. Capacity is judged AFTER the already-there case, so re-pressing a full monitor's own button for a console already on it is a no-op rather than a MonitorFull refusal counted against occupants that include itself."
        - "[ai] The viewscreen is a required field, not an Option. The lobby is DRAWN on the viewscreen, so a bridge always has one and a layout can only ever move it. Making it total means every value of BridgeLayout is a lawful bridge, to_profile can never emit the shape MissingViewscreen exists to catch, and the one-monitor case falls out for free — the only monitor is the viewscreen, so every station's row is excluded is-viewscreen and no console opens natively."
        - "[ai] The model reports WHY a monitor is greyed (is-viewscreen / full) rather than leaving the UI to re-derive it, and marks the station's own monitor Selected rather than Full — a station is one of its own occupants, so full there would tell the operator the opposite of the truth. A screen-button row is a map over eligibility() and contains no rule of its own."
        - "[ai] adopt_profile places every seat through apply, so a profile cannot smuggle in an arrangement the law forbids: a monitor that is gone, a station off this ship's roster, a monitor that is now the viewscreen, a third console — each meets the same rule a button press would, and is reported as a LayoutAdoption rather than silently dropped. Adoption REPLACES the seating rather than merging into it (a saved layout, or a --profile taking precedence over one, is this arrangement rather than these additions), and write_displays_into leaves the profile's touch and media assignments alone, because a bridge profile is one file with more than displays in it."
        - "[ai] MAX_STATIONS_PER_MONITOR is defined AS MAX_PANES_PER_STATION rather than as a second 2: a station the layout seats becomes a pane on that monitor's Station surface, so the runtime precondition and the author-time density rule are one legibility bound seen from two ends, with one place to change it. The split is a constant (side by side) rather than a per-monitor choice, because the lobby offers no control for it and a setting nothing sets is a way for two paths to disagree."
        - "[ai] reconcile(monitors, roster) is how a bridge that CHANGED under a running host is rebuilt — a screen unplugged, another plugged in, a different ship class. It is never an error, because there is nothing for an operator to fix at the moment a cable comes out: surviving seats are kept in their own order, everything else degrades to unassigned. But nothing degrades silently. The one that would otherwise pass unnoticed is the viewscreen: when its own monitor is gone it falls back to primary-else-first and REPORTS that (ViewscreenMonitorGone), because a working viewscreen somewhere else looks exactly like nothing having happened. When its monitor survived it is KEPT, even off the primary — a re-plug of some other screen is no reason to overrule the operator's choice. Stations whose monitor or station id vanished are named (StationMonitorGone / StationOffRoster) and left unassigned rather than re-homed, the same no-silent-re-homing rule a missing display gets one slice up; a station NEW to the roster arrives unassigned with no note, because an unplaced console is the ordinary state of one nobody has put on a screen. Every kept seat still goes through apply, so the compound case falls out lawfully rather than needing a second rule: a fallback landing on an occupied monitor unseats those consoles by rule 2, reported as SeatRefused. Handed no monitors at all it keeps the layout whole and says so — a bridge is at least one screen, and an empty enumeration is a display driver restarting far more often than it is a bridge that ceased to exist."
        - "[ai] to_validated_profile is INFALLIBLE, not a Result. A lawful layout cannot write a profile validate rejects — the version is this build's, the roles are the two words the module writes, monitors are deduplicated, every emitted Station holds one or two panes, each pane's label and station id are the station's own unique id, and rule 1 guarantees exactly one viewscreen — so a Result would hand every consumer an impossible error to invent a story for, and both available stories are bad (an unwrap that reads as a panic waiting to happen, or a swallowed error hiding a real bug). It validates-and-expects internally with the construction argued in the doc comment and pinned by two tests; if it ever fires, the law itself is wrong, which is a panic rather than a value."
        - "[ai] The no-op doctrine covers all THREE actions that ask for what already holds: naming the current viewscreen, seating a station on the monitor it is already on, and closing a console that is not open. UnassignStation of an unseated station answers Ok(clone) rather than a refusal, and LayoutRefusal::StationNotAssigned was deleted as unreachable. Two of the three are reachable without anyone pressing anything twice — a lobby off button pressed by two clients at once, a station unassigned between another operator's read and their click — so refusing them would make an ordinary race look like a fault. The boundary is still a boundary: an action naming a monitor this bridge lacks or a station off this ship's roster is a stale button, and is still refused as that."
        - "[ai] MonitorOccupancy::free_slots is Option<usize>, None for the viewscreen, rather than 0. Zero and none are different facts and a zero reads as the wrong one: full is a monitor holding two consoles somebody can free a slot on, while the viewscreen is a screen no console ever opens on. A consumer drawing occupied slots as MAX - free_slots would have drawn two occupied slots on the shared view. is_viewscreen is the distinction, and ExclusionReason is how it reaches a button."
        - "[ai] ProfileError::DuplicatePaneStation refuses a file whose panes name one station twice, putting the file law on the same footing as the transition law's LayoutAdoption::StationNamedTwice. A station has exactly one console, so a profile seating it on two screens leaves nothing to say which one it opens on. It cannot fire on anything a layout writes (each station is seated once and each pane is named for its station), which is part of why to_validated_profile is infallible. The adoption branch stays regardless: ValidatedProfile is a public struct, adoption is the one door every seat comes through, and a law that trusted its input to have been checked elsewhere is a law with a hole in it. PaneSlot also loses its derived Default in the same pass — a default pane has an empty label and no station, names nobody, and validate would accept it."
        - "[ai] A console an AUTHORED profile opened is an OCCUPANT even though the layout cannot move it (issue #1330). adopt_profile seats only panes that name a station, so a hand-authored --pane profile (PaneSlot::for_participant, station: None) seated nothing and left its monitor looking free — while the display adapter had opened a real borderless-fullscreen console on it, so set_viewscreen ACCEPTED and the shared view covered a crew member's live screen. Rule 2's mirror now consults a parallel RESERVED set, populated from exactly those station-less panes and carried through reconcile with its screen. It is a set of labels rather than faked StationIds because a StationId is an id some ship's roster has: a minted one would have appeared on the roster-driven eligibility rows as a station nobody can claim, with an unassign button that could not work. It blocks the VIEWSCREEN and nothing else — it takes no console capacity and gets no eligibility row, because whether a seated station may share an authored Station window is the pane host's compositing question (#1124), and the viewscreen is the only surface this law actually moves today. The refusal names seats and authored labels together, in one list, because the operator is looking at one screen."
        - "[ai] Seat order within a monitor is the order the consoles were assigned, and it is deliberately NOT canonicalised: it is the left-to-right order the panes are drawn in, what the file records, and part of PartialEq. So moving a console off a shared screen and back swaps the two halves, because the console that stayed is now the earlier of the two. That is the operator's own two actions showing up on the screen they are watching rather than a rearrangement behind their back, and it is pinned by a test so it is a contract rather than an accident."

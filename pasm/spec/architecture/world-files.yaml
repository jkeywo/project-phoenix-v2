        - "[ai] FOLDED into the authoritative-state digest, in a namespace of its own, keyed on the minted entity id: the operation's id, verb and target, its banked and required tick counts, its spent stall budget, the sub-tick fraction a slowed hold has banked, the rate it last banked at, and its state with the reason attached. Progress folds as the tick COUNTS and the integer remainder rather than as the 0-1 fraction, because those are what the simulation advances - and because folding whole ticks alone would hide a divergence smaller than one tick, which is exactly the size a hazard band introduces, one tick at a time, for as long as the storm lasts."

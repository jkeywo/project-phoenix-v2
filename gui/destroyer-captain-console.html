<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Project Phoenix — Destroyer Captain Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: 16px; margin: 0; background: #000; overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner {
      padding: 22px 52px 20px;
      display: flex; flex-direction: column; gap: 12px;
      height: 100%;
    }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .console-body .col {
      display: flex; flex-direction: column;
      background: rgba(14,17,23,0.6);
      border: 1px solid var(--edge);
      padding: 12px;
      min-height: 0;
      overflow-y: auto;
    }
    .console-body .col h2 {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 0.3em;
      color: var(--ink-dim); text-transform: uppercase;
      margin: 0 0 8px; padding: 0; flex-shrink: 0;
      border-bottom: 1px solid var(--edge);
      padding-bottom: 6px;
    }
    .col-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .console-footer {
      display: flex; align-items: center; gap: 14px;
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      color: var(--ink-faint); flex-shrink: 0; padding: 6px 0;
    }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }

    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .hero h1 { font-size: 20px; }
      .hero h1 .sub { font-size: 10px; }
      .console-body {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .console-body .col { padding: 8px; }
    }
    @media (orientation: landscape) {
      .console-body .col:first-child { border-right: none; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Destroyer Captain Console">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1>CAPTAIN<span class="sub">COMMAND &amp; SENSORS</span></h1>
        <span class="auto-badge" id="captain-auto-badge" hidden>AUTO</span>
      </div>

      <div class="console-body">
        <div class="col" id="captain-col">
          <h2>Command</h2>
          <div class="col-content" id="captain-content">
            <!-- Captain state rendered here -->
          </div>
        </div>
        <div class="col" id="sensors-col">
          <h2>Sensors</h2>
          <div class="col-content" id="sensors-content">
            <!-- Sensors state rendered here -->
          </div>
        </div>
      </div>

      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status">CAPTAIN STATION</span>
        <span class="sep">·</span>
        <span id="footer-alert" style="color:var(--ink-faint)">STANDARD</span>
        <span class="spacer"></span>
        <span id="footer-target" style="color:var(--ink-faint)">NO TARGET</span>
      </footer>
    </div>
  </div>

  <script type="module">
    import { initConsole } from './console-core.js';
    import { setAutoState } from './console-ui.js';
    import { renderRedAlertFragment, renderViewscreenFragment } from './system-registry.js';

    function renderCaptain(captainState, container) {
      if (!captainState || !container) return;

      var s = captainState;
      var redAlert = !!s.red_alert;
      var objs = s.objectives || [];
      var hullPct = s.hull_integrity_pct !== undefined ? s.hull_integrity_pct : 100;

      var html = '';

      // Alert status
      html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-faint);margin-bottom:10px;">';
      html += '<div style="width:10px;height:10px;border-radius:50%;background:' + (redAlert ? 'var(--fire-bright)' : 'var(--loaded)') + ';box-shadow:0 0 6px ' + (redAlert ? 'var(--fire-bright)' : 'var(--loaded)') + '"></div>';
      html += '<span style="font-family:\'Chakra Petch\',sans-serif;font-size:14px;font-weight:600;letter-spacing:0.2em;color:' + (redAlert ? 'var(--fire-bright)' : 'var(--loaded)') + ';">' + (redAlert ? 'RED ALERT' : 'STANDARD') + '</span>';
      html += '</div>';

      // Hull integrity
      var hullCls = hullPct <= 30 ? 'var(--fire-bright)' : hullPct <= 60 ? 'var(--reloading)' : 'var(--loaded)';
      html += '<div style="margin-bottom:10px;">';
      html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:0.2em;margin-bottom:4px;">HULL INTEGRITY</div>';
      html += '<div style="display:flex;align-items:center;gap:8px;">';
      html += '<div style="flex:1;height:10px;background:var(--bg-deep);border:1px solid var(--line-faint);position:relative;overflow:hidden;">';
      html += '<div style="position:absolute;top:0;left:0;bottom:0;width:' + hullPct.toFixed(1) + '%;background:linear-gradient(90deg,var(--loaded-dim),var(--loaded));"></div>';
      html += '</div>';
      html += '<span style="font-family:\'Chakra Petch\',sans-serif;font-size:13px;font-weight:600;color:' + hullCls + ';min-width:36px;text-align:right;">' + Math.round(hullPct) + '%</span>';
      html += '</div>';
      html += '</div>';

      // Objectives
      html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:0.2em;margin-bottom:6px;">OBJECTIVES (' + objs.length + ')</div>';
      if (objs.length === 0) {
        html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-faint);">— NO OBJECTIVES —</div>';
      } else {
        objs.forEach(function(o) {
          var status = (o.status || 'Active').toLowerCase();
          var statusColor = status === 'completed' ? 'var(--loaded)' : status === 'failed' ? 'var(--fire-bright)' : 'var(--cyan)';
          html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-faint);">';
          html += '<div style="width:8px;height:8px;border-radius:50%;background:' + statusColor + ';margin-top:3px;flex-shrink:0;"></div>';
          html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink);flex:1;">' + (o.text || '') + '</span>';
          if (o.mandatory) html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;color:var(--ink-faint);border:1px solid var(--line-faint);padding:1px 4px;">REQ</span>';
          html += '</div>';
        });
      }

      container.innerHTML = html;
    }

    function renderSensors(sensorsState, container) {
      if (!sensorsState || !container) return;

      var s = sensorsState;
      var blips = s.blips || [];
      var target = s.target_name || null;
      var targetBearing = s.target_bearing;
      var targetRange = s.target_range;
      var targetStance = s.target_stance || 'neutral';

      var html = '';

      // Contact count
      var shipCount = blips.filter(function(b) { return b.kind === 'ship'; }).length;
      html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:0.2em;margin-bottom:10px;">' + shipCount + ' SHIP' + (shipCount !== 1 ? 'S' : '') + ' IN RANGE</div>';

      // Target info
      html += '<div style="margin-bottom:8px;">';
      html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-dim);letter-spacing:0.2em;margin-bottom:4px;">SENSOR TARGET</div>';
      if (target) {
        var stanceColor = targetStance === 'hostile' ? 'var(--fire-bright)' : targetStance === 'friendly' ? 'var(--loaded)' : 'var(--cyan)';
        html += '<div style="font-family:\'Chakra Petch\',sans-serif;font-size:14px;font-weight:600;color:' + stanceColor + ';margin-bottom:4px;">' + target.toUpperCase() + '</div>';
        if (targetBearing !== null && targetBearing !== undefined) {
          html += '<div style="display:flex;gap:12px;font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-faint);">';
          html += '<span>BRG <span style="color:var(--ink);">' + targetBearing.toFixed(1) + '°</span></span>';
          if (targetRange !== null && targetRange !== undefined) {
            html += '<span>RNG <span style="color:var(--ink);">' + Math.round(targetRange) + ' AU</span></span>';
          }
          html += '</div>';
        }
      } else {
        html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-faint);">NO TARGET</div>';
      }
      html += '</div>';

      // Scan range
      var scanRange = s.scan_range || 500;
      html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--ink-faint);letter-spacing:0.2em;">RANGE <span style="color:var(--ink);">' + scanRange + ' AU</span></div>';

      container.innerHTML = html;
    }

    initConsole({
      name: 'captain',
      render: function(s) {
        var captainContent = document.getElementById('captain-content');
        var sensorsContent = document.getElementById('sensors-content');

        if (s.captain) {
          renderCaptain(s.captain, captainContent);
          renderRedAlertFragment(document, s.captain);
          renderViewscreenFragment(document, s.captain);

          // Footer alert status
          var footerAlert = document.getElementById('footer-alert');
          if (footerAlert) {
            if (s.captain.red_alert) {
              footerAlert.textContent = '◉ RED ALERT';
              footerAlert.style.color = 'var(--fire)';
            } else {
              footerAlert.textContent = 'STANDARD';
              footerAlert.style.color = 'var(--ink-faint)';
            }
          }
        }

        if (s.sensors) {
          renderSensors(s.sensors, sensorsContent);

          // Footer target
          var footerTarget = document.getElementById('footer-target');
          if (footerTarget) {
            footerTarget.textContent = s.sensors.target_name
              ? '\u25C9 ' + s.sensors.target_name
              : 'NO TARGET';
            footerTarget.style.color = s.sensors.target_name ? 'var(--tactical)' : 'var(--ink-faint)';
          }
        }

        setAutoState(null, document.getElementById('captain-auto-badge'), !!(s.captain && s.captain.captain_auto));
      }
    });
  </script>
</body>
</html>

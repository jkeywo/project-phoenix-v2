<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.captain.doc_title">Project Phoenix — Captain Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: 16px; margin: 0; background: #000; overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(14,17,23,0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    ph-camera-select, ph-red-alert, ph-objective-list { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: 20px; } .hero h1 .sub { font-size: 10px; } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .col { padding: 8px; } }
    @media (orientation: landscape) { .console-body .col:first-child { border-right: none; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Captain Console" data-i18n-attr="data-screen-label:console.captain.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.captain.title">CAPTAIN</span><span class="sub" data-i18n="console.captain.subtitle">COMMAND</span></h1>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.captain.command">Command</h2>
          <ph-camera-select id="camera-select"></ph-camera-select>
          <ph-red-alert id="red-alert"></ph-red-alert>
          <ph-objective-list id="objective-list"></ph-objective-list>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.captain.station_footer">CAPTAIN STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_target">NO TARGET</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-camera-select.js';
    import '../components/ph-red-alert.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    initConsole({
      name: 'captain',
      render: function(s) {
        var c = document.getElementById('camera-select');
        var r = document.getElementById('red-alert');
        var o = document.getElementById('objective-list');
        c.state = { views: s.camera_views || [], current_view: s.view_direction || '', auto: s.viewscreen_auto || false };
        r.state = { active: !!s.red_alert, auto: s.red_alert_auto || false };
        o.state = { objectives: s.objectives || [], boosted_objective_id: s.boosted_objective_id ?? null };
        var n = (s.blips && s.blips.length) || 0;
        document.getElementById('footer-target').textContent = n > 0 ? n + ' contacts' : 'NO TARGET';
        document.getElementById('footer-target').style.color = n > 0 ? 'var(--ink-dim)' : 'var(--ink-faint)';
        document.getElementById('station-damage').state = s.own_hull || null;
      }
    });
  </script>
</body>
</html>

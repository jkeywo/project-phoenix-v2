  - decision: gm-t2-action-result-contract
    core:
      status: partially-implemented
      confidence: confirmed
      title: Typed, Attributed, Idempotent GM Actions
      summary: "Every GM mutation is a named typed command carrying operator identity, idempotency key, stable target identities, and a structured applied/no-op/refused result. Targets and preconditions are revalidated at the agreed apply tick and simultaneous equal-GM actions use deterministic ordering. GM actions use the same scenario-authorable vocabulary where one exists and never expose raw ECS mutation, arbitrary components, teleportation, arbitrary asset paths, or a generic expected-version transaction in T2."

  - component: gm-ready-and-force-start-policy
    core:
      status: implemented
      confidence: confirmed
      title: Collective Crew and GM Start Policy
      summary: "Each ship host publishes an exact bounded tally of connected non-Spectator crew and its ready subset; each connected GM publishes an independent ready flag. The authenticated mesh owner combines every cohort with every connected GM, requires all participants ready for automatic start, excludes disconnected participants and Spectators, and supports a GM-only roster. Any connected GM may request force-start past readiness, but neither automatic nor forced start bypasses successfully loaded world, hull, Station-map, compatibility, peer, or terminal presentation-preload validation. The browser proposal carries apply_tick 0; only Rust on the technical owner assigns a safe exact tick and embeds the immutable attributed grant in its authenticated TickFrame. Every peer applies that canonical grant once, enters InProgress directly, and returns an applied, no-op, or refused result. The mesh star centre decides ordering only and grants no product authority."
      rationale:
        - "One owner-ordered policy is required because independent per-host all-ready answers cannot represent crew and GM participants distributed across several authoritative peers."
        - "Readiness, authenticated GM attribution, content compatibility, and presentation-preload completion are frozen when the technical owner seals the canonical grant. Re-reading peer-local readiness or frame-paced preload state at apply_tick could split peers when those values straddle local fixed-tick boundaries; Rust therefore revalidates only deterministic managed-mode, phase, generation, and canonical-grant state. There is no asynchronous JavaScript start-grant broadcast."
        - "The private frozen topology separates owner and technical participants from player ships, so zero-ship GM simulations join the same wait-set without exposing their mesh slots in the public GM roster. Exact-generation asynchronous adoption must be accepted by Rust before JavaScript publishes that topology or releases buffered frames and grants; the pre-adoption frame FIFO and lobby/grant ingress queues are bounded, with absolute projections coalesced and generation edges retained."
        - "Every multi-participant fresh-Lobby adoption rebases to activation tick 1, a zero-overstep fixed clock at one timestep, the authored world RNG seed, and the tick-1 WorldIdMint boundary before installing the wait-set. A multi-participant render frame may commit at most one whole fixed tick; whole catch-up debt is discarded after sealing while the fractional interpolation remainder survives. Returned-to-Lobby, resume-staged, or already-started worlds fail closed."
        - "Fresh-Lobby Leave is also asynchronous: browser transport and adopted state remain live until Rust accepts the exact leave generation, while a phase-boundary refusal preserves the fleet. Raw host pause, instagib, and teleport/debug mutation paths are neutralised or refused while FleetLockstep is installed because they are not replicated inputs."
        - "AssetPreloadResource remains presentation state and rendererless peers report that terminal gate ready. #1291 canonicalises primary authored ModelMarkers as simulation-owned weapon/target geometry: every authoritative profile binds the exact primary sidecar bytes into frozen content identity, resolves the same component before fixed consumers run, and lets renderer/LOD systems consume but never replace or remove it."
        - "The legacy single-ship countdown and unattributed AI launch route remain available outside a managed fleet and are suppressed while the collective policy owns mission start."
    architecture:
      kind: session-policy
      authority: authoritative
      coordinates: [gm-t2-peer-and-admission-contract, gm-operator-admission-and-presence, gm-milestone-peer-tracer]

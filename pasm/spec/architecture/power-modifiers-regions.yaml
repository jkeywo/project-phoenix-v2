entities:
  - component: ship-power-controller
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power Controller
      summary: Owns power-group allocation, reactor availability, battery reserves, brownout behavior, and the authoritative power blackboard. Since issue #831 handle_power_messages is the single applier of admitted SetPowerGroupAllocation commands for the human and AI paths alike (the AI decide system emits admitted commands rather than writing a private intent component).
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [ship-power-state]
      reads: [ship-station-system-topology-state, system-control-source-state, inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/ship/config.rs, src/modifiers/power_system.rs]
      symbols: [handle_power_messages, tick_power_system, authored_power_group_seed, from_authored_groups]
      tests: [cargo test, tests/smoke/power-console.spec.ts]

  - state: ship-power-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power State
      summary: Authoritative per-ship power-group levels, battery charge, reactor/battery availability, and emergency lock state.
    architecture:
      classification: authoritative
      owner: ship-power-controller
      writers: [ship-power-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/core/messages.rs]
      symbols: [PowerBlackboard]

  - component: ship-modifier-cache
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Cache
      summary: Per-ship source-aware cache that combines numeric modifiers and OR-aggregated flags into authoritative gameplay multipliers.
      rationale:
        - Power, impulse, and regions must compose without each feature directly changing every consumer's tuning value.
    architecture:
      kind: modifier-service
      authority: authoritative
      owns: [ship-modifier-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]
      tests: [cargo test]

  - component: authored-power-ai-rule-evaluator
    core:
      status: implemented
      confidence: confirmed
      title: Authored Power AI Rule Evaluator
      summary: Per-ship Power AI that evaluates data-defined rules for every authored power group. Each rule targets one power group and carries its own minimum permitted battery reserve (min_battery_reserve), so a rule can never engage below its own floor and allocation planning avoids avoidable brownouts without a fixed global emergency mode. ai_power_allocation iterates the ship's authored PowerAiConfigResource.rules and emits an admitted SetPowerGroupAllocation system-control-command per engage/disengage rather than mutating power state directly.
      rationale:
        - "Issue #762 generalized the two hardcoded blocks into this evaluator. The pure engine tick_power_rule (src/console_ai/core.rs) reduces each authored rule's trigger (Thrust{threshold}/RedAlert) to an armed signal and reuses the tick_power_movement_rule EngageState hysteresis, passing the rule's own min_battery_reserve as the engage floor. Rules are authored as [[power.ai.rule]] entries in the ship TOML; PowerAiConfigToml::to_ai_rules resolves them (falling back to the two canonical legacy rules synthesised from the flat [power.ai] fields for back-compat). ShipPowerAiState holds one EngageState per rule keyed by a stable per-rule slot key."
        - "Issue #762 (seeding reconciliation): PowerSystem::from_authored_groups seeds every authored [power_groups.*] group (e.g. ops) at spawn — via authored_power_group_seed in spawner.rs and server_app.rs — so a rule targeting an authored group is allocatable rather than returning UnknownGroup. The four alliance hulls rest their four groups at a sustainable total (<=6) so idle ships recharge and neither the brownout advisory nor the emergency lock fires unprovoked."
        - "Issue #693 implemented a narrower precursor, ai_power_allocation, that ran exactly two hardcoded rules (movement->helm, red-alert->weapons). Issue #762 retired those hardcoded blocks; the two rules now exist only as data (the parse-time back-compat default)."
        - "Issue #831 (admission symmetry): ai_power_allocation no longer writes ship-power-state through a private PowerReactorIntents component drained by a paired integrate_power_state adapter. It emits an admitted SetPowerGroupAllocation system-control-command through command_admission::validate_and_admit (its ship's own ai:<uuid> token, checked against operate_ai on the reactor), which ship-power-controller's handle_power_messages applies — the single applier for the human and AI paths alike. The evaluator therefore sends a command; it does not mutate power state directly and never branches on control source after admission."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [ship-power-state, system-control-source-state, ship-system-blackboards-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/core.rs, src/console_ai/server.rs, src/entities/config.rs, src/ship/power.rs, src/modifiers/power_system.rs]
      symbols: [tick_power_rule, PowerAiRule, PowerRuleTrigger, ai_power_allocation, PowerAiConfigResource, ShipPowerAiState, authored_power_group_seed]
      tests: [cargo test]

  - state: ship-modifier-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier State
      summary: Authoritative per-ship modifiers for speed, yaw, radar range, phaser damage, hull damage, repair rate, and repair-team capacity plus Comms-jammed and sensor-blind flags.
    architecture:
      classification: authoritative
      owner: ship-modifier-cache
      writers: [ship-modifier-translator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]

  - component: ship-modifier-translator
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Translator
      summary: Translates power allocation, active impulse, and region entry/exit into source-keyed modifier and flag updates, clearing all region effects on exit.
    architecture:
      kind: translator
      authority: authoritative
      writes: [ship-modifier-state]
      reads: [ship-power-state, impulse-drive-state, region-membership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/coordination.rs, src/regions/server.rs]
      symbols: [apply_power_modifiers, apply_region_effects, apply_impulse_to]
      tests: [cargo test]

  - component: region-containment-service
    core:
      status: implemented
      confidence: confirmed
      title: Region Containment Service
      summary: Evaluates authored sphere, box, and torus region membership for live ships and emits entry and exit events.
    architecture:
      kind: spatial-service
      authority: authoritative
      owns: [region-membership-state]
      reads: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/shape.rs]
      symbols: [RegionPlugin, RegionShape]
      tests: [cargo test]

  - state: region-membership-state
    core:
      status: implemented
      confidence: confirmed
      title: Region Membership State
      summary: Authoritative transient relation recording which ships currently occupy each authored region and which region effects apply.
    architecture:
      classification: authoritative
      owner: region-containment-service
      writers: [region-containment-service]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/effects.rs]
      symbols: [RegionEffectKind]

  - component: region-effect-resolution
    core:
      status: implemented
      confidence: confirmed
      title: Region Effect Resolution
      summary: Resolves damage zones, slow zones, impulse blockers, radar dampening, Comms jamming, sensor blindness, and nebula fog from active region membership.
    architecture:
      kind: effect-resolver
      authority: authoritative
      reads: [region-membership-state]
      writes: [ship-modifier-state, authoritative-damage-state, impulse-drive-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/effects.rs, src/regions/server.rs, src/modifiers/coordination.rs]
      symbols: [RegionEffectKind]
      tests: [cargo test]

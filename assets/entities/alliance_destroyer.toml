# 360° suppression phaser (issue #639): omni-directional suppression beam.
[[weapons_console.phaser_banks]]
id = "omni"
facing_deg = 0
fire_arc_deg = 360
auto_arc_deg = 360
beam_range = 30
beam_damage_per_sec = 3
beam_duration_secs = 4
cooldown_secs = 4
marker = "phasers_omni"

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). One unconditional rule: when the host offers the bank a
  # decision it fires. Every readiness gate — availability, cooldown, range,
  # arc, target validity — is the host's and is unchanged; the policy is the
  # authored DECISION layered on top, and `idle = true` is how a bank opts out.
  [weapons_console.phaser_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapons_console.phaser_banks.ai.rule]]
  priority = 0
  channel = "phaser_fire"
  when = "fact(red_alert) >= param(min_alert_to_fire)"
  verb = "fire_phaser"

# Forward blaster banks (issue #639): 45° forward blasters, port and starboard.
[[weapons_console.blaster_banks]]
id = "port"
marker = "blaster_port"
facing_deg = 0
fire_arc_deg = 45
volley_count = 3
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
# Blaster damage (#915 tuning pass). Was 20. The two forward banks are the
# destroyer's whole offence — 2 x 3 x 20 every 5 s is ~24 dps, which folded the
# Harrow patrol in a single approach, before the fight became one.
#
# This number is a STEP FUNCTION, not a dial, because it decides how many volley
# cycles a kill costs. Measured over 25 seeds against the patrol (the 5-seed demo
# config cannot resolve this matchup at all — see the note in
# scripts/balance-runs.demo.toml):
#
#   14  cruiser matchup collapses to 1/5
#   15  patrol 56% win, +69 margin, 36.1 s median
#   16  patrol 56% win, +73 margin, 36.1 s median   <- here
#   17  patrol 100% win, +109 margin, 31.1 s median
#   20  patrol 100% win, +184 margin, 21.1 s median
#
# 16 is the top of the near-even band: the patrol duel is a genuine coin flip
# rather than a fight the destroyer is scripted to win. Anything from 17 up is a
# guaranteed sweep. Moving between those two bands is a DESIGN choice about the
# demo, not a tuning nudge — there is nothing in between.
damage = 16
shield_pierce = 0.1
range = 35

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). Mirror of the phaser banks on the `blaster_fire`
  # channel: unconditional, with the host still enforcing availability,
  # cooldown, range, arc and target validity before the volley starts.
  [weapons_console.blaster_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapons_console.blaster_banks.ai.rule]]
  priority = 0
  channel = "blaster_fire"
  when = "fact(red_alert) >= param(min_alert_to_fire)"
  verb = "fire_blaster"

[[weapons_console.blaster_banks]]
id = "starboard"
marker = "blaster_starboard"
facing_deg = 0
fire_arc_deg = 45
volley_count = 3
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
# Blaster damage (#915 tuning pass). Was 20. The two forward banks are the

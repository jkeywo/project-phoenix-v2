# Split power hull HP across the two fine power systems (issue #513).
# Coarse `Power` block is retired; its 25 HP is split reactor 15 / battery 10
# to reflect that the reactor is the larger/more critical component and to
# preserve the sum at 25.
[[hull.system_hull]]
system_id = "power-reactor"
display_name = "Power Reactor"
max_hp = 15
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.15

[[hull.system_hull]]

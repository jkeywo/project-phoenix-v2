  - component: helm-blackboard-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Helm Blackboard Publisher
      summary: Host publisher that derives every ship's helm, lateral-thrust, and engine status blackboards from that ship's own authoritative motion and drive state.
      rationale:
        - "Per-entity over Ship since #824, following the publish_weapons_core_blackboard pattern: ship-state fields (position, yaw, speeds, impulse charge, boost state, damage-scaled radar range, engine and lateral entries) are computed for every ship with the missing-component default idiom; player-resource-derived data stays gated on Has<LocalShip> — the LocalShip's base radar range comes from ShipClientConfigResource and the engine joystick fan-out is read from the InterSystemQueue for the LocalShip only, while an NPC's base range comes from its own HelmConsoleSection. NPC helm AI reads the live radar_range from its own entry (helm_ai_radar_range); broadcast stays LocalShip-filtered so NPC entries add zero bandwidth."
        - "The Helm console blackboard is keyed by the helm station id (\"helm\"), not a system id: since #801 \"helm\" names a crew station only, while per-system blackboards such as helm-lateral-thrust keep system-id keys. The wire key strings are unchanged."
    architecture:
      kind: adapter
      authority: authoritative
      reads:
        - authoritative-ship-motion-state
        - last-helm-input-state
        - impulse-drive-state
        - boost-drive-state
      produces:
        - helm-status-blackboard-state
        - helm-lateral-thrust-blackboard-state
        - helm-engine-blackboard-state
      runs_in:

regen_per_sec = 2
offline_duration = 10

# ── Shield arcs (issue #514) ────────────────────────────────────────────
# Four evenly-spaced arcs. Each auto-generates a `[[system]]` entry with
# `id = "shield-arc-<id>"` and `kind = "shield_arc"`, plus per-arc hull HP
# tracked in `ShipArcHull` (7+6+6+6 = 25 total, preserving the retired
# `[[hull.system_hull]] system_id = "shields"` budget).

[[shield_arc]]
id = "fore"
label = "Fore"
center_deg = 0
width_deg = 90
hull_max_hp = 7

[[shield_arc]]
id = "port"
label = "Port"
center_deg = 270
width_deg = 90
hull_max_hp = 6

[[shield_arc]]
id = "aft"
label = "Aft"
center_deg = 180
width_deg = 90
hull_max_hp = 6

[[shield_arc]]
id = "starboard"
label = "Starboard"
center_deg = 90
width_deg = 90
hull_max_hp = 6


  - component: client-console-registry
    core:
      status: implemented
      confidence: confirmed
      title: Client Console Mount Lifetime
      summary: Parent-side Console lifetime derives mounted documents from server-supplied Stations, owns their identity and load listeners, publishes authoritative snapshots under the existing dirty and latency-cause policies, and retains declarations for the Station Bar. Canonical DOM naming, URL resolution, payload builders, locale and accessibility remain collaborators; switching Stations preserves iframe identity.
      rationale:
        - "[ai] createConsoleMounts owns load order: locale installation, an IFRAME_LOAD snapshot, that Station's overlay reset, accessibility, bindings, feedback preferences and gamepad presentation. Live readers ensure reloads use current state and private preferences; a missing registry skips bindings, feedback and gamepad refresh together."
        - "[ai] Welcome reduction and dirty publication precede remount effects. Host-origin publication retains active-Station plus always-push-family filtering; explicit local and load refreshes retain their existing causes and cannot acknowledge pending commands."
        - "[ai] Replaced mounts detach listeners and invalidate already-queued load callbacks. An obsolete callback previously resolved its snapshot by Station id and could publish into its replacement and clear the replacement's overlay. Explicit disposal removes owned sections while preserving unrelated shell content."
        - "[ai] Declarations retain the last report until a fresh report replaces it. Mounted frame identity distinguishes Stations sharing one document; absent or unmatched sources retain the existing claimed-name fallback. This presentation refactor changes neither command Admission nor GM Station puppet lifetime."
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [session-station-ownership-state, ship-station-system-topology-state, client-system-console-family-replica]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/console-mount.js, gui/iframe-bridge.js, gui/mount-plan.js, gui/content-switcher.js, gui/console-state.js, gui/console-resolver.js, gui/dirty-consoles.js, client.html]

name = "entity.station_outpost.name"
tags = ["station", "destructible"]

[target]
tags = ["station"]
threat_level = "none"
description = "entity.station_outpost.target.description"

[hull]
hull_integrity = 200.0

[collider]
# Matched to the visible hull, at John's request. Shares
# `alliance_research_outpost.glb` with `depot_transfer`, so it shares its size:
# 7.56 x 3.37 x 7.59 on screen at the sidecar's `[base].scale` of [4, 4, 4], a max
# half-extent of 3.80. The 12 here was over three times that — the worst of the
# four station colliders, and it could not be left while its own mesh-mate was
# corrected.
#
# Sharing the mesh means sharing the shape: a Cylinder of radius 3.8 and
# half_height 1.68, exactly as `depot_transfer.toml` authors it. No world spawns
# this template today, so nothing measurable moves here — it is corrected
# alongside its mesh-mate for the same reason it was resized alongside it, that
# one mesh cannot describe two different bodies.
shape = "Cylinder"
radius = 3.8
half_height = 1.68
length = 0.0

[radar_appearance]
colour = [0.3, 0.8, 0.6]
size = 12.0
icon = "station"

[mesh]
# Uses the Alliance research-outpost hull (with its LOD ladder + billboard);
# the torus below is the streaming/flat-render fallback, as on the other
# stations (see station_axiom, station_research_outpost).
model = "assets/models/alliance_research_outpost.glb"
# Same hull as `depot_transfer`, so the same stand-in: 7.56 x 3.37 x 7.59
# measured, minor = 1.68 and major = 2.12 derived from it. See
# `depot_transfer.toml` for the arithmetic and `station_axiom.toml` for why the
# fallback is derived from the sidecar's extents.
#
# The 12.0 / 3.0 this replaces drew a 30-unit ring for a 7.6-unit outpost — the
# worst of the five station fallbacks, just as its 12-unit collider was the
# worst of the four before the correction above.
shape = "torus"
radius = 2.12
minor_radius = 1.68
colour = [0.3, 0.8, 0.6]

# Stations broadcast on long-range comms — easily reachable across most of
# the default world.
[comms]
range = 1600.0

entities:
  - decision: accessibility-private-effect-profile
    core:
      status: implemented
      confidence: confirmed
      title: Private Effect-Named Accessibility Profile
      summary: "One shared Accessibility settings surface and private per-player operator profile serve browser clients and native panes. Native panes reuse the browser schema, bindings and presentation consumers through a capability adapter, with host-fed gamepad snapshots. Unavailable outputs such as native vibration are suppressed without discarding their portable settings. Persistent native controller preferences follow the private per-console contract in native-controller-preferences-and-assignment, separately from bridge hardware layouts. Settings name functional effects such as text scale, contrast, motion, timing or assistance; they never name or infer a diagnosis. OS preferences supply defaults where available and explicit player overrides win."
      rationale:
        - "The profile belongs to the player/pane, not the physical bridge layout, station claim or scenario save."
        - "Other players never receive the settings or reasons. Only a derived functional result required for eligibility or an explicitly requested assistance state crosses the client boundary."
        - "T1 owns the schema and cheap presentation controls while the settings shell, native panes and shared Hero Bar are changing; later bands add deeper assistance without replacing the profile."
        - "The browser implementation arrived through #1102 and #1168; #1280 made native panes consume that same versioned profile through #1124 input routing and #1127 Accessibility application rather than forking either path."
    game_design:
      must_not_be: [labelled by medical need, exposed to other players, stored as part of a bridge hardware profile, allowed to make the browser route secondary]
    implementation:
      status: declared
      paths: [gui/accessibility-profile.js, gui/operator-profile.js, gui/operator-surface-adapter.js, gui/settings-panel.js, gui/tokens.css, src/native_host/panes/pane_boot.js]
      tests: [tests/client/accessibility-profile.test.js, tests/client/operator-profile.test.js, tests/client/operator-surface-adapter.test.js, tests/client/design-tokens.test.js, tests/client/pane-scripts.test.js]

  - decision: accessibility-presentation-ceiling-and-resets
    core:
      status: implemented
      confidence: confirmed
      title: Two Hundred Percent Text, Explicit Defaults and Scoped Resets
      summary: "The exposed in-app text-size ceiling is 200%, mirrored as one contract between the client slider bound and the native bridge reflow model, and a pane's minimum operable width demand grows with it. Every presentation setting reports whether its live value is an explicit operator choice, a value the system supplied, or the built-in default, and says so where a preference could not be read at all. Changing a setting previews live; each setting resets individually; a Reset all is scoped to the presentation settings alone and never reaches bindings, gamepad tuning, feedback preferences, GM confirmation policy, operator identity or scenario saves. Forced-colour rendering is the browser's, not Phoenix's: a Phoenix contrast selection cannot alter it, and the shared tokens and control family keep borders and keyboard focus visible under it."
      rationale:
        - "PRD #1418 asks for usable enlargement through 200%, so the slider bound and the native SUPPORTED_TEXT_SCALE_MAX move together; the drift guard the_supported_extremes_match_the_client keeps them one number rather than two."
        - "The per-pane width demand is MIN_CONSOLE_LOGICAL_WIDTH_PX x the text multiplier, so raising the ceiling to 2.0 raises a split pane's supported width from 480 to 640 logical pixels. The height floor is deliberately fixed: consoles absorb vertical growth by scrolling."
        - "A stored 'default' means follow-the-system, and the system may be saying something or nothing. Reporting the source separately is what lets an operator tell an explicit 100% from a system that never answered, and an unreadable preference from a neutral one."
        - "Reset scope is structural rather than a maintained exclusion list: the presentation reset rebuilds the presentation block only, and the enclosing operator profile re-snapshots every other field from its own owner."
        - "The chamfered control family draws its focus ring as an inset box-shadow, which a forced-colours mode removes; without an explicit border fallback every stepper, toggle and fire control loses its keyboard indicator in high contrast."
        - "Power allocation is the workflow carried end to end through shell, console iframe and controls at 100/150/200% under issue #1422; enlargement changes presentation only and never the authoritative order a control sends."
        - "Issue #1424 extends the forced-colours baseline from #1422's DOM-styled controls to the shared scope (`ph-radar.js`, mounted by both Tactical and Sensors): a `<canvas>` fill and an SVG stroke attribute are colour strings, not CSS declarations, so the browser cannot repaint them the way it repaints a `.btn`. A live `forced-colors: active` media query, resolved once per render rather than cached, substitutes the system keywords Highlight/Mark for the authored --signal/--fire-hot tokens. The same issue separates hostile, selected and Tactical-locked contacts by SHAPE — a filled wedge, a single ring, a concentric double ring — never by colour alone, so the distinction survives forced colours and colour-deficient vision together; a Sensors selection never grows the second (lock) ring, preserving Tactical's sole weapons-lock authority. No target authority, selection semantics or wire field changed: target_tags already carried the IFF stance the console's own selects filter reads, and the marker/ring choices are read-only presentation over it."
    game_design:
      must_not_be: [allowed to shrink text to preserve a layout, permitted to defeat browser-enforced colours, a reset that reaches bindings identity or saves, a setting that hides which value is actually in force, a hostile/selected/locked distinction that relies on colour alone]
    implementation:
      status: declared
      paths: [gui/accessibility-profile.js, gui/settings-panel.js, gui/tokens.css, gui/components/ph-console-styles.js, gui/components/ph-power-controls.js, gui/components/ph-radar.js, gui/components/ph-scope-chrome.js, gui/components/ph-tactical-radar.js, client.html, src/native_host/setup_accessibility.rs]
      tests: [tests/client/accessibility-200-percent.test.js, tests/client/accessibility-presentation.test.js, tests/client/tactical-sensors-contact-cues.test.js, tests/client/ph-tactical-radar.test.js, tests/smoke/text-scale-power-workflow.spec.js, tests/smoke/text-scale-tactical-sensors-workflow.spec.js, cargo test]

  - decision: accessibility-viewscreen-endpoint-presentation
    core:
      status: implemented
      confidence: confirmed
      title: The Shared Display Owns Its Own Text Size and Contrast
      summary: "A Viewscreen's text size and contrast belong to the DISPLAY, not to a person. Both viewscreen runtimes edit them in their own settings menu's Display tab, preview them live, reset them individually and reset them together within that scope alone, and persist them on that endpoint across sessions independently of scenario saves and of every operator's private profile. The browser viewscreen's endpoint is its own browser storage under a key distinct from the operator profile; the native viewscreen's is a file the host process owns, because its embedded view's storage session is ephemeral. Text scale reaches the menus, overlays and lobby chrome and never the 3D scene."
      rationale:
        - "A shared screen is read by a whole room, so whoever adjusts it adjusts it for everyone present and the room keeps the change. That is a different fact from a private operator profile, which is one player's choice travelling with them, so it is a second record under its own key rather than a section of the first: neither module reads or writes the other's, and a profile import cannot silently rescale a viewscreen."
        - "Persistence is per ENDPOINT, not per browser vendor and not per account: browser storage is that browser's on that machine, which PRD #1418 states is not a promise of cross-browser synchronisation."
        - "The native lobby view's Ultralight storage session is ephemeral and never written to disk, so the page cannot remember anything itself. The host seeds the document with the saved record through the same head-script seam the Windows preference read already uses, and the page sends the WHOLE record back when a control moves — idempotent, so a dropped message cannot leave the file and the screen disagreeing about one of two values."
        - "The vocabulary, the clamps, the follow-system resolution and the explicit/system/default status are the private profile's, imported rather than restated: a viewscreen that clamped text scale differently from a console would be a second contract, and the native bridge already mirrors the one."
        - "Neither viewscreen document set a root font size, so every --text-* rung on them ignored a text-scale setting entirely. One named token, multiplied by --a11y-text-scale in both documents, is what makes the setting reach the menu it is set in. The scene is unaffected by construction: the canvas is sized as a percentage of its shell and the simulation draws in world units."
        - "Reset scope is structural rather than a maintained exclusion list: the record contains this display's two settings and nothing else, so a Reset all has no path to a scenario save, an operator profile, host bindings or the fleet code."
        - "Motion, shake and flash stay out of this record until #1428 wires the effect controls to their real consumers on every surface at once; a half of that lever here would give the room two places to ask for the same thing."
    game_design:
      must_not_be: [a per-player setting, stored inside a scenario save, able to overwrite an operator's private profile, a control that forgets what it was told, a text size that shrinks the shared view of space]
    implementation:
      status: declared
      paths: [gui/viewscreen-presentation.js, gui/viewscreen-presentation-panel.js, gui/server-settings.js, gui/native-settings.js, gui/settings-tabs.js, gui/tokens.css, server.html, src/native_host/viewscreen_presentation.rs, src/native_host/host_lobby/scenario.rs, src/native_host/host_lobby/document.rs, src/native_host/host_lobby/host_lobby_link.js, src/native_host/panes/document.rs]
      tests: [tests/client/viewscreen-presentation.test.js, tests/client/native-settings.test.js, tests/client/server-settings.test.js, tests/smoke/viewscreen-settings-presentation.spec.js, cargo test]

  - decision: accessibility-station-eligibility-contract
    core:
      status: implemented
      confidence: confirmed
      title: Anonymous Station and Rating Eligibility
      summary: "A client evaluates whether the complete station surface at a required rating is compatible with its private profile and publishes only an eligible/ineligible functional result. Station selection explains incompatibility locally; the human-seeking resolver skips an ineligible destination without disclosing why."
      rationale:
        - "Eligibility covers the base hull at full supported player count. It does not account for missing players or guarantee that one person can operate every station required by a complex scenario."
        - "Every base hull must validate at least one compatible station/rating under the complete supported option set for a simple scenario. Content band C2 adds the scenario-floor composition and authoring validation on T1's transport/resolver seam."
        - "Assistance is a per-function override layered separately from station rating even when both delegate work to the same limited-AI policy runtime."
    game_design:
      must_not_be: [a disclosure of enabled settings, a promise of solo complex-scenario completion, implemented as a second automation engine]
    implementation:
      status: declared
      paths: [client.html, gui/accessibility-profile.js, gui/lobby-view.js, src/core/messages.rs, src/lobby/handler.rs, src/lobby/session.rs, src/ship/coordination_systems.rs, src/ship/eligibility.rs]
      tests: [tests/client/accessibility-eligibility.test.js, cargo test]

  - decision: accessibility-incremental-delivery
    core:
      status: partially-implemented
      confidence: confirmed
      title: Accessibility Delivered Across the C/T Roadmap
      summary: "Accessibility is one continuing programme across both roadmap tracks. The browser profile, anonymous eligibility, real contrast/reduced-motion presentation, keyboard operability, focus integrity and accessible-name floors are implemented, and #1280 reuses the same private profile in native panes with explicit capability degradation. Content increments continue through C2 complexity composition, C3 alternative motion and docking, C4 mastery-task assistance, C5 dense tactical information, C6 continuing-mode navigation and return, C7 strategy, C8 generation constraints and C9 alternative participation and completion audit. Technical bands T2-T6 carry matching improvements for the operator surfaces they introduce."
      rationale:
        - "An increment lands when the owning UI, authority or authoring seam is already changing, avoiding a late retrofit. It need not be fictionally or mechanically tied to the band’s headline content."
        - "Every band still has its own visual/UX polish pass. Accessibility is planned and tested alongside that pass but remains a distinct set of requirements."
        - "PRD #1168 delivered T1's platform interaction tranche through #1170-#1178: shared keyboard conventions, empty structural debt floors, modal focus, high contrast and reduced motion on both console and viewscreen surfaces."
        - "T2 issue #1285 extends the shared private two-slot bindings and correlated feedback contract across every shipped Sensors and Science action without widening station authority, scan availability or protected information projections."
        - "T2 issue #1288 completes the same contract for Helm: thrust, steering, ship-specific lateral thrust, impulse, hold-to-boost, viewscreen and contextual dock/undock retain their existing command owners and cadence while keyboard modifiers, standard-gamepad inputs, pointer controls and ship variants activate stable semantic identities. Correlated discrete actions settle only when the owning server consumer applies or refuses them, and interrupted boost holds release instead of latching propulsion."
        - "T3 issue #1422 raises the exposed text ceiling to 200%, adds explicit-default reporting, live preview, per-setting and scoped resets, and the first forced-colours baseline, carried through the Power allocation workflow on shell, iframe and controls."
        - "T3 issue #1424 carries that same 100/150/200%-plus-forced-colours contract through Tactical and Sensors: target selection, weapon banks and scan readouts stay reachable and readable, keyboard focus and the current target/status stay visible without an optimistic local lock, and hostile/selected/locked contacts on the shared scope canvas gain non-colour shape cues that also resolve real system colour keywords under forced colours."
        - "T3 issue #1427 gives the shared Viewscreen its own endpoint-owned text size and contrast on both runtimes, saved on that machine across sessions and isolated from every private profile and from scenario saves."
        - "C9 completes richer authorised spectator monitors and the whole-product audit; it is not the first point at which accessibility work occurs."
    game_design:
      must_not_be: [deferred as one final polish project, treated as identical to difficulty, required to map one-to-one onto scenario fiction]
    implementation:
      status: declared
      paths: [gui/accessibility-profile.js, gui/focus-trap.js, gui/roving-tabindex.js, gui/semantic-action-registry.js, gui/gamepad-input.js, gui/stations/sensors-actions.js, gui/stations/helm-actions.js, gui/tokens.css, src/command_admission/mod.rs, src/dock/server.rs, src/science/server.rs, src/server/viewscreen_border.rs, src/ship/helm_admission.rs, src/ship/sensors.rs]
      tests: [tests/client/interaction-floors.test.js, tests/client/sensors-actions.test.js, tests/client/sensors-semantic-structure.test.js, tests/client/helm-actions.test.js, tests/client/helm-semantic-structure.test.js, tests/client/gamepad-input.test.js, tests/smoke/comms-ops-keyboard.spec.js, tests/smoke/semantic-action-helm.spec.js, tests/smoke/modal-focus-keyboard.spec.js, tests/smoke/viewscreen-reduced-motion.render.spec.js]

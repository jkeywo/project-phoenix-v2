      symbols: [GmCrewActivity, GmQuietPlugin, observe_crew_activity, counts_as_worked_control, quiet_row, quiet_settings, QUIET_REASON, QUIET_ID_PREFIX, DEFAULT_QUIET_SECONDS, GmAttentionSettings, is_ai_token, rebase_after_restore]

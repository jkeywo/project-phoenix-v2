  - component: authored-live-room-sound
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Live Authored Room Sound
      summary: "An accepted PresentationCue::Sound resolves a captured Viewscreen definition and creates only a frame-local request. The shared producer applies receiving LocalShip and M7 source suppression before the existing room audio channel; browser/native providers render one current occurrence through their normal category, Master, comfort and output owners."
      rationale:
        - "[ai] GM and declarative/Rhai scenario callers reuse the existing presentation action, apply validation and normal Admission/result/attribution bookkeeping. Unknown definitions, private audiences and absent named source entities refuse at apply. Playback availability does not change canonical success."
        - "[ai] A source entity is an optional policy link, never an adapter truth lookup. Effective forced Sensors mode applies the same conceal or delayed/degraded-source predicate as combat audio. Static authored signals carry no entity link. Definition equivalents carry only authored meaning, source, urgency and optional listener-relative direction."
        - "[ai] Current config prewarms assets without scheduling playback. Occurrences carry the existing room lifecycle generation and a process-local serial, consumed before mute/visibility/readiness checks. Native requests expire after the existing short delivery window; decoding commits only the current request under its owner lock. New, hidden, restored or late receivers never replay missed occurrences."
        - "[ai] Catalogs and canonical action records remain normal content/bookkeeping. No cue list, audio journal, saved playback frontier, catch-up store, remote media or speech mechanism is introduced. Informative equivalents replace one current live row independently of audio success; decorative cues have no caption."
    architecture:

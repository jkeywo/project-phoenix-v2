<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title data-i18n="dynasty.console.damage_control.title"></title><link rel="stylesheet" href="../console.css"><style>body{margin:0;background:var(--surface-void);overflow:hidden}.frame,.panel-inner{height:100%}.panel-inner{box-sizing:border-box;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.col{min-height:0;overflow:auto;border:1px solid var(--edge);padding:10px;display:flex;flex-direction:column;gap:8px}.threat-readout{display:flex;justify-content:space-between}.threat-readout:not(.active){visibility:hidden}@media(orientation:portrait){.panel-inner{grid-template-columns:1fr;padding:8px}}</style></head><body><div class="frame" data-i18n-attr="data-screen-label:dynasty.console.damage_control.label"><div class="panel"></div><main class="panel-inner dynasty-layout"><details class="dynasty-guidance" id="role-guidance"><summary data-i18n="dynasty.onboarding.guide"></summary><p data-i18n="dynasty.onboarding.damage_control.role"></p><ol><li data-i18n="dynasty.onboarding.prepare"></li><li data-i18n="dynasty.onboarding.approach"></li><li data-i18n="dynasty.onboarding.strike"></li><li data-i18n="dynasty.onboarding.recover"></li></ol><p data-i18n="dynasty.onboarding.backfill.text"></p><p data-i18n="dynasty.onboarding.inputs.text"></p></details><section class="col"><h2 data-i18n="console.captain.shields_power">Shields</h2><div class="threat-readout" id="threat-row"><span data-i18n="console.shields.threat_bearing">Threat Bearing</span><strong id="threat-bearing">—</strong></div><ph-shield-facings id="shield-facings"></ph-shield-facings></section><section class="col"><h2 data-i18n="console.engineering.repair">Repair</h2><ph-hull-integrity id="hull-integrity"></ph-hull-integrity><ph-station-damage id="core-damage" label="Core" data-i18n-attr="label:console.repair.core"></ph-station-damage><ph-repair-teams id="repair-teams"></ph-repair-teams><div class="dynasty-aux-panel" id="tractor-panel" hidden><h2 data-i18n="console.engineering.tractor"></h2><div class="dynasty-aux-row"><button id="tractor-btn" type="button" data-i18n="console.tractor.engage"></button><span id="tractor-status">—</span></div><div id="tractor-refusal" hidden></div></div><div class="dynasty-aux-panel" id="umbilical-panel" hidden><h2 data-i18n="console.engineering.umbilical"></h2><div class="dynasty-aux-row"><button id="umbilical-btn" type="button" data-i18n="console.umbilical.start"></button><span id="umbilical-status">—</span></div><div id="umbilical-refusal" hidden></div></div></section></main></div><script type="module">import'../components/ph-shield-facings.js';import'../components/ph-hull-integrity.js';import'../components/ph-station-damage.js';import'../components/ph-repair-teams.js';import{initConsole}from'../console-core.js';import{renderDamageControl}from'./console.js';import{TRACTOR_TOGGLE_ACTION_ID,UMBILICAL_TOGGLE_ACTION_ID}from'../stations/engineering-actions.js';initConsole({name:'damage-control',render:renderDamageControl,actionFamilies:['shields','repair','engineering'],getActionContext:()=> 'engineering'});document.getElementById('tractor-btn').addEventListener('click',()=>window.activateSemanticAction(TRACTOR_TOGGLE_ACTION_ID,{context:'engineering',source:'control'}));document.getElementById('umbilical-btn').addEventListener('click',()=>window.activateSemanticAction(UMBILICAL_TOGGLE_ACTION_ID,{context:'engineering',source:'control'}));</script></body></html>

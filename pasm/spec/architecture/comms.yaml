entities:
  - component: comms-dialogue-controller
    core:
      status: implemented
      confidence: confirmed
      title: Comms Dialogue Controller
      summary: Routes admitted hail, response, clear, viewscreen and channel-2 actions against the shared ship Comms inbox. It also evaluated world-authored [[comms]] templates until issue #985 deleted that front-end; a thread is opened by a script now, through comms::scripted::open_scripted_comms_threads.
      rationale:
        - "[ai] Combat-test station reports use authored single-shot on_hull_below comms templates. The fixed-tick world collector compares EntitySystemHull aggregate fractions and emits downward crossings with both samples, so strict 75%, 50%, and 10% alerts fire once even when one hit crosses several bands; repair never re-arms a fired template."
        - "Issue #786: the single router for both origins. handle_hail and handle_respond_to_message are reused UNCHANGED by AI-origin commands — the Comms AI emits the same admitted Hail and RespondToMessage payloads a human Comms officer sends, so the response's TriggerAction dispatch (dispatch_action / apply_dispatch_result) and follow-up advance run identically for both, and nothing downstream of admission branches on actor (AGENTS.md #6)."
        - "Issue #786 retires the handle_comms_channel2 AI stub. That system used to call inbox.record_response(&id, 0) directly whenever the Comms system was AI-operated — a write to the authoritative inbox that bypassed admission AND bypassed handle_respond_to_message entirely, so an AI 'response' fired no trigger actions and advanced no follow-up. The system is now inject-only and no longer reads ShipSystemControlSources; the decision moved to the authored comms-ai-operator policy."
        - "Issue #786: the router's existing stale-dialogue, sender-range, and response-index bounds gates are what protect against stale AI dialogue actions. Because an AI response is an ordinary admitted command, those gates apply to it identically — no AI-side staleness check exists or is needed."
        - "[ai] Issue #984 S8 (following #864) puts comms state into the SAVE. Nothing comms-shaped was in PhoenixSnapshot before it — not the inbox, not active_dialogues, not a template's fired latch — so a save taken mid-thread reloaded to an empty Comms console with a scenario waiting on an answer that could no longer be given. snapshot::CommsState now carries: CommsInboxRes verbatim in inbox order (CommsMessage is the wire type and was already serde); active_dialogues sorted by message id; open_hails; and WorldScriptRuntime.pending_comms_opens in QUEUE order, because open_scripted_comms_threads drains it front-to-back and mints a message id per request from the tick-scoped WorldIdMint — a reordered queue hands different threads different ids, which world_digest folds."
        - "[ai] Issue #984 S8 drew the carry line ON THE NODE, not on the kind of thread: a DECLARATIVE node's responses could hold Vec<TriggerAction> and a nested follow_up tree, which is the serde commitment ScenarioState refuses for pending_delayed_actions, so such a node was left out and RestoreGap::CommsDialoguesUncarried reported it. Issue #985 deleted the front-end that could author one — a node is built only by project_node now, whose responses are (text, important) — so snapshot::reduce_dialogue_node is infallible, every dialogue travels, and the refusal path and its RestoreGap went with the shape that needed them."
        - "[ai] Issue #984 S8 NOT COVERED, recorded so a later comms-resume slice does not rediscover it. contacts, range_flags and range_active are DERIVED — update_comms_range_flags rebuilds the roster from the live hailable entities and recomputes the range map every tick — and needs_broadcast is set true by the restore rather than carried. OnScreenMessage is a viewscreen presentation choice, excluded as a client projection. A restored node_fn/on_pick resolves against the RECOMPILED script set, which is safe because #864's content binding already refuses a save whose scripts moved. SNAPSHOT_FORMAT went 2 to 3 for the comms payload and 3 to 4 when issue #985 removed template_fired / uncarried_follow_ups / uncarried_dialogues from it: the fields all default, so an older save parses, and parsing one is the silently-wrong outcome each bump exists to refuse."
    architecture:
      kind: interaction-controller
      authority: authoritative
      owns: [comms-inbox-state, comms-dialogue-state]
      reads: [world-configuration-state, world-name-binding-state, world-flag-state]
      writes: [comms-inbox-state, comms-dialogue-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/console/comms/inbox.rs, src/comms/content.rs, src/comms/server.rs]
      tests: [cargo test]

  - state: comms-inbox-state
    core:
      status: implemented
      confidence: confirmed
      title: Comms Inbox State
      summary: Shared ship Comms messages, contacts, read and urgent status, sender endpoint identity, and player-facing sender text.
    architecture:
      classification: authoritative
      owner: comms-dialogue-controller
      writers: [comms-dialogue-controller, world-comms-runtime, comms-hail-roster]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/console/comms/inbox.rs, src/console/comms/server.rs, src/comms/server.rs, src/core/messages.rs]
      symbols: [CommsInboxRes, CommsInbox]

  - state: comms-dialogue-state
    core:
      status: implemented
      confidence: confirmed
      title: Comms Dialogue State
      summary: Active dialogue nodes, response follow-ups, and pending delayed delivery associated with message threads.
    architecture:
      classification: authoritative
      owner: comms-dialogue-controller
      writers: [comms-dialogue-controller]
    implementation:
      status: declared
      paths: [src/comms/content.rs, src/comms/server.rs, src/console/comms/server.rs]
      symbols: [CommsRuntime, ActiveDialogue, ScriptedDialogue]

  - component: comms-range-enforcer
    core:
      status: implemented
      confidence: confirmed
      title: Comms Range and Jamming Enforcer
      summary: Computes physical sender range and rejects hails and responses for unknown, out-of-range, or jammed endpoints while allowing synthetic senders to remain readable.
    architecture:
      kind: admission-policy
      authority: authoritative
      owns: [comms-range-state]
      reads: [authoritative-ship-motion-state, ship-modifier-state]
      validates: [comms-dialogue-controller]
      produces: [comms-range-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/comms/range.rs, src/comms/component.rs, src/comms/server.rs, src/console/comms/server.rs]
      tests: [cargo test]

  - state: comms-range-state
    core:
      status: implemented
      confidence: confirmed
      title: Comms Range State
      summary: Per-sender reachability flags used both for authoritative command gates and for the replicated unavailable presentation.
    architecture:
      classification: authoritative
      owner: comms-range-enforcer
      writers: [comms-range-enforcer]
    implementation:
      status: declared
      paths: [src/comms/server.rs, src/console/comms/server.rs, src/comms/component.rs]
      # The flags are fields on CommsRuntime (range_flags/range_active), not a
      # dedicated type; CommsRange is the per-entity authored range component
      # they are computed from.
      symbols: [CommsRuntime, CommsRange, CommsHailable]

  - component: comms-hail-roster
    core:
      status: implemented
      confidence: confirmed
      title: Comms Hail Roster
      summary: Builds the set of endpoints the Comms officer may hail from TWO sources during the Rhai transition — the world's declarative [[comms]] templates and the live entities that opt in with [comms] hailable = true — unioned on entity UUID with the declarative entry winning its display metadata, and appended in a query-order-independent sort so the player-visible contact order is deterministic.
      rationale:
        - "[ai] Issue #985: the roster had exactly ONE source — world_config.comms, resolved from each template's `from` reference id through name_to_uuid by init_comms_runtime and merge_world_comms. The Rhai conversion's milestone M7 deletes [[comms]] parsing outright, which would empty CommsRuntime.contacts and take resolve_hail_target, candidate_fact(source_comms_contact) and every hail candidate with it. The entity-derived source therefore has to land BEFORE the teardown, behaviour-preserving while both sources coexist, rather than as part of it."
        - "[ai] Issue #985 DUAL-SOURCE RULE, stated as the invariant the coexistence period rests on. The roster is the union of the declarative and entity-derived sets, keyed on entity UUID. On a collision the DECLARATIVE entry wins outright: its authored name and its live in_range / is_urgent stamps are left untouched, and the entity-derived candidate adds nothing. That is what makes the union a no-op for every world authoring [[comms]] today. At M7 the declarative half is gone and the entity-derived half is the sole source, so a converting world moves its [[comms]] display_name onto the entity as [comms] display_name — the label precedence (display_name, then the entity's EntityName reference id, then the raw UUID) is written to make that move label-preserving, because for a world-declared [[entity]] the EntityName IS the `name` its [[comms]] from would have named."
        - "[ai] Issue #985 OPT-IN, chosen on an entity census rather than on taste. Thirteen shipped entity templates declare [comms] range — every Alliance hull, every Harrow hull, the Requiem courier, all three stations, and the RNG-coverage lancer — because `range` marks a range-gated comms ENDPOINT, not a hailable contact. Deriving the roster from the range component alone would take combat_test from one contact (Starbase Alpha) to that plus every hostile wave ship the trigger pipeline spawns, and would give patrol, reinforcements and rng_coverage — which author no [[comms]] at all — a non-empty roster where they have none. So reachability and hailability are separate authored facts: `[comms] hailable = true` is the opt-in, authored on NOTHING at this commit, and the M7-era world conversions turn it on per world. Two shipped-content tests hold that line: one asserts no shipped template opts in, the other snapshots each shipped world's declarative roster."
        - "[ai] Issue #985 DETERMINISM: the entity-derived candidates come off a Bevy query, whose iteration order is archetype order and not a stable contract, and the roster is player-visible (CommsState.contacts) and AI-visible (the hail candidate set). merge_entity_contacts therefore sorts each tick's candidates by (name, uuid) before appending, and appends only — it never re-sorts the declarative prefix, which would itself be a behaviour change. Within a tick the order is a pure function of the candidate set; across ticks it follows the sim's own deterministic spawn order."
        - "[ai] Issue #985 LIFECYCLE is deliberately fused with the range pass rather than given its own system. update_comms_range_flags already walked every CommsRange entity to refresh range_flags and already pruned contacts, open_hails and stale flags against that same live set; the derivation reads the same query in the same pass. A hailable entity therefore joins the roster the tick after it spawns and leaves it the tick after it is destroyed, and the roster can never disagree with the range flags about which entities are live. The union runs AFTER the prune (so a candidate is never added and dropped in one pass) and BEFORE the in_range stamp (so a new contact carries its real reachability on the tick it appears, not a default-true first frame)."
        - "[ai] Issue #985 KNOWN GAP, recorded so M7 does not rediscover it: a scripted [[comms]] thread (WorldConfig.scripted_comms, Rhai milestone M4) contributes NO contact today — only the declarative WorldConfig.comms list does. No shipped world scripts a comms thread yet, and a shipped-content test asserts that, so the gap is currently unreachable. The entity-derived source is what closes it: a world converting a thread to Rhai authors hailable = true on that thread's sender in the same commit."
    architecture:
      kind: derivation
      authority: authoritative
      reads: [world-configuration-state, world-name-binding-state, comms-range-state]
      writes: [comms-inbox-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/comms/roster.rs, src/comms/component.rs, src/comms/server.rs, src/entities/config.rs, src/entities/spawner.rs]
      symbols: [EntityContact, merge_entity_contacts, entity_contact_label, CommsHailable, CommsConfig, update_comms_range_flags, init_comms_runtime]
      tests: [cargo test]

  - component: comms-blackboard-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Comms Blackboard Publisher
      summary: Projects messages, contacts, urgency, reachability, and objective snapshots to the local ship's Comms surface. Since issue #831 it publishes per-Ship (With<Ship>): the shared player-channel content is gated on Has<LocalShip> and written to the local ship, while every NPC ship receives an empty Comms blackboard entry for architectural consistency (comms is fundamentally a player channel, so NPC entries carry no messages, objectives, or contacts).
    architecture:
      kind: blackboard-publisher
      authority: authoritative
      reads: [comms-inbox-state, comms-range-state, objective-runtime-state]
      writes: [ship-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/core/messages.rs, gui/comms-state.js]

  - component: comms-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Comms AI Operator
      summary: Backfill Comms decides both of its actions from authored data — WHO to hail through a per-system target selector over Hail-directive objectives enriched by the comms contact roster, and HOW to answer an open dialogue through an inline stateless channel/verb policy — and emits both as ordinary admitted commands through the shared AI-emit seam for the same handlers a human Comms officer's commands reach.
      rationale:
        - "Issue #786: Comms is the FIRST system to author BOTH fine-system AI machines. Hail targets are a variable per-tick candidate set keyed by REAL contact UUIDs, which is selector vocabulary; dialogue responses are a fixed, small, index-addressed list, which is channel/verb vocabulary (the same argument that kept Shields on channel/verb in #783)."
        - "Issue #786 retires the last AI-OWNED comms state. CommsAiHailState.last_hailed is deleted; its anti-respam job moves to CommsRuntime.open_hails — shared authoritative comms state that handle_hail writes for EVERY hail past the server-side range gate, human officer or Backfill AI alike. The AI reads it back as candidate_fact(has_open_hail_thread). This is a LATCH, not a per-tick inbox derivation, and that is deliberate: the obvious inbox-derived alternative does not terminate. A hail to a target with no matching on_hailed template — or one whose template has already fired, since evaluate_comms_templates latches state.fired permanently — seats no message and no dialogue, so an inbox-derived guard never arms and a standing Hail directive re-emits WorldEvent::Hailed every tick, which repeat-able on_hailed triggers would act on without bound. Provenance is discriminated: has_open_hail_thread means a hail WE issued, while the separate candidate_fact(has_unread_from_sender) means any live inbound traffic and is seeded for authors but deliberately kept OUT of the canonical eligibility — gating on it would let a scenario-pushed greeting (e.g. before_the_fire's on_world_loaded message from Axiom Station) permanently suppress a legitimate Hail directive naming that same station. Nothing per-AI survives, so a human/AI control flip still needs no reset."
        - "Issue #786 latch RE-ARM, stated precisely because it is easy to overclaim. Three events retire an open_hails entry, and none of them is the hail itself. (1) handle_clear_comms — the human Comms officer emptying the slate. This is a HUMAN path only: ClearComms is emitted by gui/comms-state.js and gui/action-map.js and by nothing else, and TriggerAction has no ClearComms variant, so no scenario can script one and an UNMANNED (Backfill) ship — the only case these AI hosts exist for — never sees one. (2) operate_comms_ai's per-tick candidacy retirement: the entry is dropped once its target stops being a live hail candidate, i.e. no positive Comms-relevant Hail directive names it any more, or it has left comms range. This is the re-arm the retired last_hailed had (it was reset whenever no target was selectable), and it is the ONLY re-arm an unmanned ship gets; without it every contact would be hailable exactly once per session and a mission's later 'hail them again' beat would be silently dropped forever. It runs below the operate_ai gate, so a human officer's open channels are never closed under them. (3) update_comms_range_flags prunes entries whose entity has despawned, alongside contacts and range_flags — otherwise the set grows monotonically and a LoadWorld/UnloadWorld/LoadWorld cycle re-registering the same authored UUID would leave that contact permanently un-hailable. TERMINATION survives all three because the retirement is keyed on CANDIDACY: a standing directive's target is a candidate on every tick of its life, so the latch is never retired for exactly the case that would loop, and every retirement needs an externally-driven change (objective completion/removal, physical movement across the range boundary, despawn) that the hail cannot cause."
        - "Issue #786 AC2 system availability is ENFORCED, not merely seeded: self_fact(comms_available) > 0 is a term in the canonical hail eligibility and fact(comms_available) > 0 a term in the canonical response rule, both read off EntitySystemHull, so a Disabled or Destroyed Comms system stops the ship hailing AND answering. The canonical response rule also names fact(sender_in_range) > 0, restoring a precondition the retired channel-2 stub held by construction (it ran only on message arrival): without it, a sender leaving comms range mid-dialogue makes the AI re-emit a response handle_respond_to_message is guaranteed to reject, every tick, forever."
        - "Issue #786 AC4: both halves take WorldContentRuntime as a shared Res and hand only its flag store to select/resolve_channel as &[&FlagStore]. Every FlagStore mutator requires &mut self, so the read-only guarantee on scenario flags and counters is structural, not conventional. Legitimate scenario mutation stays in the consequence router."
        - "Issue #786 WIRING: both hosts are filtered With<LocalShip>, so they run ONLY on the player ship — and the player ship never goes through entities::spawner::spawn_entity. server_app::spawn_game_start_entities therefore attaches CommsTargetSelector + CommsResponseAiPolicy too, via the shared comms_console_ai_components helper both spawn paths call so they cannot drift. Without that attach the feature is dead in production: the hosts fall back to a tick-local canonical default every tick, an authored [comms_console] block parses and validates and is then silently ignored, and self_fact/fact(power_rating) is permanently ABSENT (the #779 empty-facts failure mode). RepairTargetSelector (#785) had the same player-ship gap — less severe because operate_repair_ai's host is With<Ship>, so spawner-built NPCs carried one, but an authored [repair.selector] on a player-class hull was ignored — and is attached at the same site. Proved by tests/headless_runner.rs, which boots the real world and reads the components off the spawned LocalShip."
        - "Issue #885 (411ace37 authored the selector, 8555e336 deleted the fallbacks) closed the synthesis half. Both Comms blocks are AUTHORED on every shipped hull, and the two synthesisers that used to invent them — default_comms_target_selector_config (the retired filter+argmax) and default_comms_response_ai_config (the retired channel-2 auto-response stub's decision) — are deleted along with every call site. Strict AI-declaration mode is the default in EntityConfig::from_toml, so a hull that omits [comms_console.selector] or [comms_console.ai] fails the load rather than getting behaviour invented for it. The authored selector is byte-equivalent to what the synthesiser produced, proved through the real spawner on every shipped hull."
        - "Issue #885 also deleted thirteen of the eighteen selector params the synthesisers used to declare, none of which any guard referenced. The Comms hail selector kept score_band_low/mid/high — its eligibility and score guards NAME them — and lost score_band_weight, which no guard ever read: a score term's magnitude is its own authored weight field, so the rung weight is written directly as weight = 100.0 and never reaches for a param(...)."
        - "Issue #786 DETERMINISM: handle_hail and handle_clear_comms both write open_hails under ResMut<CommsRuntime>, so handle_clear_comms is explicitly .after(handle_hail) — clear wins on a same-tick tie, matching the inbox semantics they share. operate_comms_ai holds CommsRuntime as ResMut solely for the candidacy retirement, and is .before(handle_hail); operate_comms_response_ai is .after(operate_comms_ai). The Input-set order is therefore total: operate_comms_ai, handle_hail, operate_comms_response_ai, handle_respond_to_message, handle_clear_comms."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, scored-objective-pool-state, comms-inbox-state, comms-dialogue-state, comms-range-state, world-flag-state, world-name-binding-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/comms/server.rs, src/entities/config.rs, src/entities/spawner.rs, src/server_app/world_setup.rs, src/ai/selector.rs, src/ai/policy.rs]
      symbols: [operate_comms_ai, operate_comms_response_ai, CommsTargetSelector, CommsResponseAiPolicy, comms_console_ai_components, seed_comms_hail_facts, seed_comms_self_facts, seed_comms_response_facts]
      tests: [cargo test]

  - component: important-comms-decision-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Important Comms Decision Presentation
      summary: Authored-response presentation contract that warns and confirms responses the world author marked important before normal submission, without changing server authority or response finality. The authored `important` flag rides the wire per response (`CommsResponseView.important`); the phone comms component arms an important response on first click and submits only on a second confirm click.
    architecture:
      kind: presentation-contract
      authority: non-authoritative
      reads: [world-configuration-state, comms-dialogue-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/core/messages.rs, src/comms/content.rs, gui/components/ph-comms-current-message.js]
      symbols: [CommsResponseView, response_views]
      tests: [cargo test, npx vitest run]

  - component: comms-response-availability-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Comms Response Availability Presentation
      summary: Phone presentation that greys and disables response controls when the authoritative sender reachability flag says the physical channel is unavailable. Each wire response carries an `available` flag stamped from the same range pass that stamps message `sender_in_range`; the comms component renders unavailable responses visible-but-greyed and refuses to submit them.
    architecture:
      kind: presentation-contract
      authority: non-authoritative
      reads: [comms-range-state, comms-dialogue-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/comms/server.rs, src/console/comms/server.rs, gui/components/ph-comms-current-message.js]
      symbols: [CommsResponseView, broadcast_comms_state, publish_comms_blackboard]
      tests: [cargo test, npx vitest run]

  - component: comms-response-rejection-feedback
    core:
      status: implemented
      confidence: confirmed
      title: Comms Response Rejection Feedback
      summary: Host-to-phone rejection feedback that lets the attempted response flash red when a stale (no active dialogue), out-of-range, or out-of-bounds submission is refused. The host emits `ServerMessage::CommsResponseRejected { message_id, response_index }` to the submitting comms token at the drop points in `handle_respond_to_message`; the client folds it into sim state and the comms component flashes the matching response control red.
    architecture:
      kind: interaction-feedback-contract
      authority: authoritative
      reads: [comms-range-state, comms-dialogue-state]
      runs_in: [host-browser-runtime, phone-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/core/messages.rs, src/core/codec.rs, gui/sim-state.js, gui/console-state.js, gui/dirty-consoles.js, gui/components/ph-comms-current-message.js]
      symbols: [handle_respond_to_message, CommsRespondAux]
      tests: [cargo test, npx vitest run]

entities:
  - component: tactical-fine-system-operator
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Fine System Operator
      summary: Applies Tactical authority and availability separately to phaser banks, blaster banks, torpedo tubes, tactical radar, and torpedo magazine rather than treating Tactical as one indestructible system.
    architecture:
      kind: system-operator
      authority: authoritative
      reads: [ship-station-system-topology-state, system-control-source-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, src/ship/system_registry.rs]
      tests: [cargo test]

  - component: torpedo-magazine-round-claim
    core:
      status: implemented
      confidence: confirmed
      title: Torpedo Magazine Round Claim
      summary: Shared magazine owns ammunition and accepts same-tick tube claims only while available; disabled magazines block loading and launch.
    architecture:
      kind: inter-system-policy
      authority: authoritative
      reads: [torpedo-state, inter-system-message-state, authoritative-damage-state]
      writes: [torpedo-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, src/core/messages.rs]
      symbols: [handle_torpedo_magazine_inter_system]
      tests: [cargo test]

  - component: tactical-ai-weapon-operator
    core:
      status: implemented
      confidence: confirmed
      title: Tactical AI Weapon Operator
      summary: Uses scored Destroy objectives and fine-system availability to select and track targets, and issue arc-bearing coordination when a usable family lacks arc; firing decisions for individual weapon families live in separate decide/apply AI systems that read the resulting target.
      rationale:
        - "Issue #694 removed the torpedo-firing block that used to run inline inside this operator (operate_tactical_ai). Torpedo auto-fire now lives in torpedo-auto-fire-ai (ai_torpedo_auto_fire in src/console_ai/server.rs). Issue #697 then split target selection itself into ai_target_selection (decide, writes WeaponsBlackboard.locked_target) and operate_tactical_ai (apply, writes WeaponsTarget), and issue #698 split phaser firing the same way into phaser-auto-fire-ai. Issue #700 deleted operate_tactical_ai: with every other responsibility rehomed, the remaining glue was folded back into ai_target_selection, which now gates on any_tactical_system_operates_ai (any tactical fine system's own operate_ai policy — the dead coarse tactical fallback was deleted by #801), publishes its choice to WeaponsBlackboard.locked_target as observable intent, and applies the same choice to WeaponsTarget in one system. Selection could not be separated from application by a sim set the way the other AI decide/apply pairs are — every WeaponsTarget reader runs in SimSet::Input — so keeping them in one system is what makes the AI's read-modify-write atomic against handle_set_target, the other Input writer of WeaponsTarget."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [scored-objective-pool-state, weapons-target-state, system-control-source-state, authoritative-damage-state]
      writes: [weapons-target-state]
      coordinates: [coordination-lag-router]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, src/ai/core.rs]
      symbols: [ai_target_selection]
      tests: [cargo test]

  - component: torpedo-auto-fire-ai
    core:
      status: implemented
      confidence: confirmed
      title: Torpedo Auto-Fire AI
      summary: Decide/apply AI pair that selects loaded, in-arc torpedo tubes to fire at the ship's locked weapons target and applies the launch via the same primitive the human torpedo-fire path uses.
      rationale:
        - "Issue #694 replaced the old fused torpedo-firing block formerly inline in operate_tactical_ai. ai_torpedo_auto_fire decides which tubes to fire and writes TorpedoIntents; issue #698 folded the former integrate_torpedo_intents into integrate_weapons_state (src/console/weapons/mod.rs), the single adapter that drains both TorpedoIntents and PhaserIntents and applies them via TorpedoSystem::launch / ActiveBeam, dual-writing the legacy TorpedoSystemResource for the LocalShip the same way integrate_power_state does for power."
        - Gated on AiHighFidelity plus a dedicated torpedo_magazine_system_id() operate_ai policy, distinct from the per-fine-system Tactical gate that governs target selection.
        - "Issue #698 promoted this from preliminary to full: the target_locked and target_shields inputs to the pure auto_fire_torpedo decision were hardcoded to true/0, and now read real state — target_locked from the locked WeaponsTarget resolving to a live entity, target_shields from the sum of the target's online ShipShields facings. Targets without ShipShields (asteroids, debris) read 0 and stay torpedo-eligible."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [weapons-target-state, torpedo-state, system-control-source-state]
      writes: [torpedo-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/console_ai/core.rs, src/console/weapons/mod.rs]
      symbols: [ai_torpedo_auto_fire, integrate_weapons_state, auto_fire_torpedo, TorpedoIntents]
      tests: [cargo test]

  - component: phaser-auto-fire-ai
    core:
      status: implemented
      confidence: confirmed
      title: Phaser Auto-Fire AI
      summary: Decide/apply AI pair that picks an off-cooldown, in-auto-arc phaser bank to fire at the ship's locked weapons target and applies the beam via the same ActiveBeam state the human fire path drives.
      rationale:
        - "Issue #698 split the former fused tick_phaser_auto_fire into ai_phaser_auto_fire (decide, SimSet::Input, writes PhaserIntents) and integrate_weapons_state (apply, SimSet::Physics, mutates ActiveBeam and triggers BeamStartedEvent). The decider stays in Input so it keeps reading pre-sync_ship_position Transforms exactly as the fused system did; drain_power_for_active_beam is explicitly ordered after the integrator so beam power still drains on the beam's first tick."
        - "Gated on any_bank_operates_ai (per-bank phaser_bank_system_id() operate_ai policy; a ship declaring no fine banks has no bank that can be AI-operated — the dead coarse tactical fallback was deleted by #801), OR the LocalShip's CurrentPhaserMode::Auto toggle. Per-bank policy is re-checked when choosing which bank fires, so one offline bank does not disarm the others."
        - "Deliberately NOT gated on AiHighFidelity, unlike ai_torpedo_auto_fire: low-LOD NPCs must keep firing phasers, and the CurrentPhaserMode::Auto leg is a human console toggle rather than AI at all. PhaserIntents is therefore not part of the lod_ai_ships promote/demote bundle; ActiveBeam's #[require(PhaserIntents)] guarantees it exists wherever a beam does."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [weapons-target-state, system-control-source-state]
      writes: [weapons-target-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs]
      symbols: [ai_phaser_auto_fire, integrate_weapons_state, PhaserIntents, PhaserCmd]
      tests: [cargo test]
  - component: tactical-weapons-controls
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Weapons Controls
      summary: Tactical player and Backfill controls select a target, fire configured phaser, blaster, and torpedo banks, and manage phaser mode and torpedo tubes through admitted ControlSystem commands.
      rationale:
        - "Every wire target names a declared system since #801: SetTarget targets the tactical-radar system, and SetPhaserMode / SetPhaserFrequency target the new declared phaser-control system (a single system owning the ship-wide firing mode and emitter frequency; the data model is unchanged). The coarse tactical system is deleted — \"tactical\" survives only as a station id keying the Weapons console blackboard and coordination routing."
    architecture:
      kind: control-interface
      authority: authoritative
      owns: [weapons-target-state]
      produces: [weapons-target-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, gui/action-map.js]
      symbols: [handle_set_target, handle_fire_phaser, handle_fire_torpedo]
      tests: [cargo test, npx vitest run]

  - state: weapons-target-state
    core:
      status: implemented
      confidence: confirmed
      title: Weapons Target State
      summary: Authoritative locked target used by player weapons and current Tactical projections.
    architecture:
      classification: authoritative
      owner: tactical-weapons-controls
      writers: [tactical-weapons-controls]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs]
      symbols: [WeaponsTarget]
      tests: [cargo test]

  - component: phaser-beam-system
    core:
      status: implemented
      confidence: confirmed
      title: Phaser Beam System
      summary: Per-bank arc-limited sustained beams accumulate damage while in range, then enter cooldown. Ship TOML supplies bank arcs and beam tuning.
    architecture:
      kind: weapon-system
      authority: authoritative
      owns: [phaser-beam-state]
      reads: [weapons-target-state]
      produces: [phaser-beam-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, src/entities/config.rs]
      symbols: [handle_fire_phaser, tick_beams, PhaserBankConfig]
      tests: [cargo test]

  - state: phaser-beam-state
    core:
      status: implemented
      confidence: confirmed
      title: Phaser Beam State
      summary: Active beam, per-bank cooldown, firing mode, frequency, and shield-pierce damage state.
    architecture:
      classification: authoritative
      owner: phaser-beam-system
      writers: [phaser-beam-system]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs]
      symbols: [ActiveBeam, PhaserCooldown, CurrentPhaserMode]
      tests: [cargo test]

  - component: blaster-projectile-system
    core:
      status: implemented
      confidence: confirmed
      title: Blaster Projectile System
      summary: Per-bank straight-line predicted bolt volleys with optional hold-to-charge, per-bank cooldown, collision radius, range lifetime, and shield pierce.
    architecture:
      kind: weapon-system
      authority: authoritative
      owns: [blaster-projectile-state]
      produces: [blaster-projectile-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/weapons/blaster.rs, src/console/weapons/mod.rs, src/entities/config.rs]
      symbols: [BlasterSystem, BlasterProjectile, BlasterBankConfig]
      tests: [cargo test]

  - state: blaster-projectile-state
    core:
      status: implemented
      confidence: confirmed
      title: Blaster Projectile State
      summary: In-flight bolts plus each bank's pending volley, cooldown, and optional charge progress.
    architecture:
      classification: authoritative
      owner: blaster-projectile-system
      writers: [blaster-projectile-system]
    implementation:
      status: declared
      paths: [src/weapons/blaster.rs]
      symbols: [BlasterVolleyState]
      tests: [cargo test]

  - component: torpedo-system
    core:
      status: implemented
      confidence: confirmed
      title: Torpedo System
      summary: Per-tube firing arcs and reload state draw from a shared magazine; in-flight guided torpedoes detonate by proximity and snapshot launch-time damage and shield pierce.
    architecture:
      kind: weapon-system
      authority: authoritative
      owns: [torpedo-state]
      reads: [weapons-target-state]
      produces: [torpedo-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/weapons/torpedo.rs, src/console/weapons/mod.rs, src/entities/config.rs]
      symbols: [TorpedoSystem, build_torpedo_target_snapshot, tick_torpedo_lifecycle, TorpedoesConfig]
      tests: [cargo test]

  - state: torpedo-state
    core:
      status: implemented
      confidence: confirmed
      title: Torpedo State
      summary: Shared ammunition, per-tube load state, and in-flight torpedo guidance and detonation state.
    architecture:
      classification: authoritative
      owner: torpedo-system
      writers: [torpedo-system]
    implementation:
      status: declared
      paths: [src/weapons/torpedo.rs]
      symbols: [TorpedoSystem]
      tests: [cargo test]

  - component: tactical-weapons-projection
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Weapons Projection
      summary: Publishes configured arcs, target lock, per-bank readiness and cooldown, blaster charge, tube status, magazine, and in-flight visual events to Tactical GUI.
    architecture:
      kind: projection
      authority: authoritative
      reads: [weapons-target-state, phaser-beam-state, blaster-projectile-state, torpedo-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, gui/components/ph-phasers-controls.js, gui/components/ph-blasters-controls.js, gui/components/ph-torpedo-controls.js]
      symbols: [weapons_update_broadcaster]
      tests: [cargo test, npx vitest run]

  - component: phaser-attack-target-lock
    core:
      status: proposed
      confidence: confirmed
      title: Phaser Attack Target Lock
      summary: A phaser attack captures the current weapons target when it begins and keeps that target for the attack while the target remains in the firing arc.
    architecture:
      kind: weapon-policy
      authority: authoritative
      reads: [weapons-target-state]
      runs_in: [host-browser-runtime]

  - component: patterned-barrel-attacks
    core:
      status: proposed
      confidence: confirmed
      title: Patterned Barrel Attacks
      summary: Blaster and torpedo banks declare multiple barrel marker points and a timed attack pattern of offsets and barrel-index arrays, allowing alternating or simultaneous shots.
    architecture:
      kind: configuration-schema
      authority: authoritative
      runs_in: [host-browser-runtime]

  - component: weapon-readiness-feedback-policy
    core:
      status: proposed
      confidence: confirmed
      title: Weapon Readiness Feedback Policy
      summary: Phaser, blaster, and torpedo projections expose a consistent readiness, target-range, target-arc, and blocking-reason contract to Tactical.
    architecture:
      kind: projection-policy
      authority: authoritative
      reads: [weapons-target-state, phaser-beam-state, blaster-projectile-state, torpedo-state]
      runs_in: [host-browser-runtime]

  - component: three-dimensional-torpedoes
    core:
      status: proposed
      confidence: confirmed
      title: Three-Dimensional Torpedoes
      summary: Torpedoes use full 3D position, guidance, collision, and detonation once ship vertical movement becomes simulation truth.
    architecture:
      kind: weapon-system
      authority: authoritative
      replacement: torpedo-system
      runs_in: [host-browser-runtime]

  - component: weapon-family-arc-bearing-coordination
    core:
      status: proposed
      confidence: confirmed
      title: Weapon-Family Arc-Bearing Coordination
      summary: Tactical requests a Helm bearing when the selected usable phaser, blaster, or torpedo family has a target in range but outside its available firing arcs.
    architecture:
      kind: coordination-policy
      authority: authoritative
      reads: [weapons-target-state]
      coordinates: [tactical-weapons-controls]
      runs_in: [host-browser-runtime]

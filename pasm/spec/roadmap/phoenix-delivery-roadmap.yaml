  - component: roadmap-completed-demo-baseline
    core:
      status: accepted
      confidence: confirmed
      title: Completed Demo Baseline
      summary: "Completed work provides seeded headless balance and after-action reports (#835), baseline player-ship Backfill doctrine (#842), scenario catalogue, QR-first selection, and game-over return (#754-#756), legacy save/load tracer bullets (#431-#435), native scenario hosting (#420), and mod-pack export and host overlay resolution (#759-#760)."
      rationale:

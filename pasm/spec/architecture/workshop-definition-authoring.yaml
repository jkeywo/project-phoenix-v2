        - "npx vitest run editor/tests/workshop-composition.test.js tests/client/workshop-composition-panel.test.js tests/client/workshop-layout-model.test.js tests/client/workshop-authoring.test.js tests/client/workshop-runtime.test.js editor/tests/workshop-provider.test.js tests/client/native-workshop-boot.test.js tests/client/operator-profile.test.js"
        - "tests/smoke/workshop-composition.render.spec.js"
  - component: workshop-entity-composition
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Workshop Entity Template and Fragment Composition
      summary: "The Workshop entity panel composes one entity template from its ordered includes over the exact source of a browser mod draft or a native selected workspace: it adds, removes and reorders included fragments, adds and removes supported components, shows every effective field with the member that authored it and the merge chain it came through, and writes an inherited value into the local document as an exact-source override on request. The runtime READS include_resolve::resolve_template's Provenance rather than merging a second time, so who owns a field is the answer the simulation spawns from; the supported component list and each component's default are read out of EntityConfig's own serde, never listed here. An edit is refused at edit time with the source untouched when it would introduce a missing, cyclic, self or disallowed include, a component the runtime does not know, or a composed template that no longer parses, and the same include rules are findings with the offending entry's line in validate_pack and validate_project. Preview and Test reuse the shared model preview and the existing disposable Test over the same unsaved source."
      rationale:
        - "[ai] D1. The runtime owns composition. src/entities/include_resolve.rs already returns the composed document and a Provenance keyed by field address (hull.hull_integrity, system[id=helm-thrust].ai_only, station[id=bridge].rating[name=Std].automated_systems); entity.rs reads it. A second merge here would drift from the one the runtime spawns from and the drift would be invisible — the panel would simply attribute a field to the wrong file. The keyed-array identity keys come from the merge's own MergePolicy::array_rule, never a copy of entity_override::COMPOSE_KEYED_ARRAYS."
        - "[ai] D2. The component vocabulary is DERIVED. EntityConfig is deny_unknown_fields, so a probe document carrying one key it cannot know is answered with serde's own \"unknown field `x`, expected one of `a`, `b`, …\"; supported_components parses that list out once behind a OnceLock and a ratchet test pins it, so a component added to the runtime appears in the panel with no edit here. component_skeleton asks the runtime what a component with nothing authored IS — deserialise an empty table into it through EntityConfig::from_toml and serialise back — and a component that cannot answer is LISTED with skeleton false so the panel says why it offers no Add. Serde's list deliberately omits includes (the resolver strips it) and the keys EntityConfig::from_toml consumes before serde sees them (station, system, power_groups, shield_arc), which is why component-unsupported is asked of the RUNTIME at edit time rather than compared against that list: a top-level-key check would refuse every edit on every real hull."
        - "[ai] D3. Criterion 4 says refuse, so entity::compose applies the exact-source edit to a COPY, re-resolves and re-parses over candidate ∪ dependencies with the edited member winning, and returns the untouched source with `<rule>: <detail>` — the rule being the finding category the same violation reports as, which the panel maps to a workshop.entity.refused.* sentence with the runtime's own words as the detail and an `other` row that carries them verbatim. Only rules the edit INTRODUCES are refused (#1475's before/after multiset of the edited member's violations), because a fragment is legitimately not a complete entity on its own — tests/fixtures/mod-packs/partial-entity-include.zip pins that — and a hand-broken draft must be repairable one edit at a time. component-inherited is the one rule judged from the request BEFORE the edit runs, so the message names the owning member instead of toml_edit's \"the key does not exist\"."
        - "[ai] D4. ONE new panel, entity, at Workshop layout v8, joining the inspector's column after definitions on both sides (gui/workshop-layout-model.js and src/native_host/panes/operator.rs migrate a stored v7 layout by placing it in the group holding inspector), because it is a specialised form over the same runtime the inspector reads. #1481 (ship stations, systems and AI) will EXTEND this panel rather than add another, because it authors the same document."
        - "[ai] D5. Materialising is the ONLY place a runtime value is serialised into source, and it writes NEW local text only: entity::materialise reads the resolved value at the provenance address, serialises exactly that subtree, and puts it at the address's own path, so no existing span is ever rewritten. It refuses an address that is already local, one the resolved document does not carry, and a keyed-array entry the local source has not got — the merge reconciles those by key and has nowhere to put a value whose key it cannot find. A put creates at most ONE missing plain-key level, which is what the exact-source owner supports; a deeper gap says to materialise the enclosing component first. A provenance POSITION — system[2], the fallback for an entry of a keyed array that carries no key — is refused wherever it appears in the address and not only as its last step, because the merge APPENDS a keyless entry after the ones it reconciled: the resolved position and the local one are not the same array, so an indexed PARENT that happened to resolve locally would write the value into whichever local entry sat at that index. FieldView::materialisable carries that whole answer to the panel, computed by the same put_path the route runs, so Materialise is offered exactly where it lands and the row otherwise says why it is not there."
        - "[ai] Who authors a component is a STRUCTURAL question about the contributing documents — does any template beneath this one declare that top-level key — and never a provenance reading, because provenance records only the WINNER of each leaf. The two come apart in both directions and both were real defects: a template that overrides PART of an inherited component wins the leaves it authored while the inherited table is still beneath it (38 component-and-fragment pairs on the shipped composed hulls, helm_console on the Alliance Cruiser among them), and a template that SHADOWS every leaf a fragment authors wins them all while that fragment's whole component waits to be composed back the moment the local text goes (power on all four Harrow hulls). So ComponentView carries local and inherited_from INDEPENDENTLY: a component with LOCAL text offers Remove and the row names the fragment whose copy composes once the override is dropped, which is ordinary authoring; a component with NO local text of its own offers no Remove at all, because a whole inherited table has no tombstone the merge understands, and the row says to materialise a field and edit the local copy instead. component-inherited is therefore scoped to exactly that second case (the contract's own wording) and is still implemented and tested, because a control whose every press is refused is a finding in its own right. A keyed array ENTRY does have a tombstone (an entry carrying its id plus _remove = true) and is an ordinary local edit inside the array, so it never reaches that rule."
        - "[ai] Includes are written as the text the resolver reads — relative to the DECLARING template's own directory, the form canonical_include_path joins — computed in the panel from the two member paths rather than by a second copy of the resolver's rules. A reorder is `set` edits on the swapped slots rather than remove-and-append, so an entry's comments and blank lines stay with their positions; removals follow by descending index, new entries are inserted at the end, and an absent key is created with one whole-array put because the catalog cannot tell an empty list from a defaulted one. The panel's own pre-checks (empty, self, duplicate, not-an-entity-path) refuse only a violation the edit ADDS — the same before/after multiset the runtime's introduced rule compares — so a draft whose includes was hand-edited to hold a bad entry can still have its OTHER entries reordered or removed one edit at a time, which is the principle the runtime half was built on."
        - "[ai] A field row is read-only for THREE distinct reasons and says which: it is inherited and not yet materialised (criterion 2); its provenance address is KEYED (system[id=…].ai_only), so the local array index an edit would need is not in the address and those arrays are #1481's; or its value is a list or a sub-table, which contract B's `set` route — scalars only — refuses outright. A row offering a text box whose every Apply is refused is a defect in its own right, so the panel does not offer one — and for the same reason an INHERITED row whose address the local document cannot name yet carries no Materialise either, and says which reason it is. The address split that decides the keyed case tracks QUOTING on both sides now: include_resolve's join_field quotes any key holding a dot, a bracket, an equals or a space, so a naive split on dots turned one such key into several segments that name nothing and offered a box whose every Apply was refused with the catch-all sentence."
        - "[ai] Criterion 5 reuses the surfaces that exist rather than adding a renderer: the panel's Preview drives the models panel's OWN #workshop-preview-subject select and reveals the model-preview dock panel, and Test drives the Test panel's OWN #workshop-test-ship select. One preview, one Test, one catalogue — and a surface that cannot take the template answers false, which the panel reports honestly instead of appearing to work. The Test panel is not a dock panel (it appends itself to the surface root), so there is nothing to reveal for it; the status says the hull is selected and Start Test runs it."
        - "[ai] EntityComposition carries both skeleton (the availability flag the contract names) and skeleton_source (that default as ONE inline TOML value). The flag alone cannot serve the panel: a component Add is an exact-source Edit::Put and Put needs a value_source string, while deciding what a component's default IS belongs to the runtime type — so the text travels with the flag, exactly when the flag is set, and a ratchet test puts every one of them through the exact-source edit owner."
        - "[ai] entity-unresolvable follows the runtime's own asymmetry exactly (include_resolve::composition_finding): it fires only for a COMPOSED template, because a template that composes nothing and is not a valid entity is the ordinary source error the source gate already owns. An EntityComposition for a path in neither the draft nor its dependencies is answered Ok with an empty origin, resolvable false and an unknown-document error rather than Err, so a panel opening on a stale or empty path still renders its sections."
        - "[ai] Review round: the two halves were integrated against the contract's shapes end to end — the three kebab ops (entity, entity-edit, entity-materialise) against Operation::Entity/EntityEdit/EntityMaterialise and Response::Entity's `entity` status tag, the browser adapters against wasm_workshop_entity/_entity_edit/_entity_materialise with TEXT-ONLY dependencies, every EntityComposition field the panel reads by name against what entity.rs emits, and the panel's refusal prefix table against the runtime's own rule names (materialise-local, materialise-unknown-address, materialise-keyed-entry). Three deviations were closed rather than papered over: ComponentView gained skeleton_source (a bool cannot be an Edit::Put value_source, so component Add could never have worked); the panel's refusal table took the runtime's own materialise rule names, which its invented ones did not match; and a LOCAL field holding a list or a sub-table is now read-only, because document::edit's Set refuses an array or an inline table outright and contract B's field route is scalars. Criterion 5's wiring (previewTemplate and testTemplate) gained the jsdom test it had never had."
        - "[ai] Review round 2 (three independent reviewers, 17 findings): four dead controls and one silent undo were fixed at the root, and the root of all of them was one mistake — provenance-winner data answering structural questions. component_owners now reads the contributing documents, so a partly overridden component is local AND inherited (its Remove lands instead of always being refused) and a fully shadowed one names the fragment that would compose back (its removal is announced instead of silently undone); compose's component-inherited guard is scoped to a component with no local text; put_path refuses an indexed provenance position anywhere in the address; FieldView::materialisable decides whether the panel draws Materialise at all; the JS fieldSegments split tracks quoting the way entity.rs's split_address does; planIncludeEdits refuses only introduced violations; workshop.entity.refused.address stops materialise-unknown-address borrowing the missing-fragment sentence and refused.keyed says what the array entry problem actually is. The panel also moves focus AFTER the busy hold drops (inside it every stable fallback is disabled, so a Remove on a component with no skeleton dropped focus to the body). One reviewer finding was over-stated and is recorded as such: the two gates do NOT double-report a broken include on a world-reachable hull, which src/workshop/tests.rs now pins on both the project and the pack path. document.rs also gained the mirror of insert_element's padding rule, because the includes Remove is a new caller of it: removing the last element of a padded single-line array kept the space before the closing bracket."

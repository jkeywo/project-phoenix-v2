entities:
  - component: shield-arc-system
    core:
      status: implemented
      confidence: confirmed
      title: Shield Arc System
      summary: Per-ship variable arc shield system with authored geometry, priority, health, regeneration, offline recovery, and per-arc fine-system availability; every Ship entity (player and NPC alike) publishes its own aggregate and per-arc blackboards.
    architecture:
      kind: defense-system
      authority: authoritative
      owns: [shield-arc-state]
      reads: [ship-station-system-topology-state, system-control-source-state]
      produces: [shield-status-blackboard-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/weapons/shield.rs, src/entities/config.rs]
      symbols: [tick_shields, ShieldSystem, ShieldArcConfig]
      tests: [cargo test, tests/smoke/shields-console.spec.ts]

  - state: shield-arc-state
    core:
      status: implemented
      confidence: confirmed
      title: Shield Arc State
      summary: Authoritative current shield arcs including geometry, priority, health, focused state, damage multiplier, offline timer, and availability.
    architecture:
      classification: authoritative
      owner: shield-arc-system
      writers: [shield-arc-system]
      replicas: [shield-status-blackboard-state]
    implementation:
      status: declared
      paths: [src/weapons/shield.rs, src/core/messages.rs]
      symbols: [ShieldSystem]

  - component: shield-focus-controller
    core:
      status: implemented
      confidence: confirmed
      title: Shield Focus Controller
      summary: Admitted Shields command handler that focuses one authored shield arc or clears the active focus for human and AI commands alike, applying configured protection and trade-off multipliers.
      rationale:
        - "Issue #826: the single applier for both origins — the AI's ai_shield_focus emits admitted SetShieldArcFocus payloads through validate_and_admit, so no shields intent component or separate AI adapter exists. The handler runs in SimSet::Physics (moved from Input) ordered after ai_shield_focus: admission clears AdmittedCommands before Input each tick, so the applier must consume same-tick after the AI emit or AI commands would be silently lost."
    architecture:
      kind: control-handler
      authority: authoritative
      reads: [shield-arc-state, system-control-source-state]
      writes: [shield-arc-state]
      consumes: [set-shield-arc-focus-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/core/messages.rs, gui/action-map.js]
      symbols: [handle_shields_messages]
      messages: [SetShieldArcFocus]
      tests: [cargo test, tests/client/ph-shield-facings.test.js]

  - message: set-shield-arc-focus-command
    core:
      status: implemented
      confidence: confirmed
      title: Set Shield Arc Focus Command
      summary: Request to set or clear the focused authored shield arc, produced by the Shields console (human) or by the Shields AI's admitted emission.
    architecture:
      authority: request
      producer: [client-network-interface, shields-recent-damage-ai]
      consumer: [shield-focus-controller]
      validator: [system-command-admission-policy]
      trust_boundary: client-to-host
      payload: SetShieldArcFocus
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/action-map.js]
      messages: [SetShieldArcFocus]

  - component: shield-damage-router
    core:
      status: implemented
      confidence: confirmed
      title: Shield Damage Router
      summary: Routes incoming collision, weapon, and region damage through matching online arcs by geometry and priority before leaking remaining damage to system hull.
    architecture:
      kind: damage-router
      authority: authoritative
      reads: [shield-arc-state]
      writes: [shield-arc-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/weapons/shield.rs, src/console/weapons/mod.rs, src/regions/server.rs, src/server_app.rs]
      symbols: [ShieldSystem]
      tests: [cargo test]

  - state: shield-status-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Shield Status Blackboard State
      summary: Replicated aggregate and per-arc shield snapshot published into every Ship entity's own blackboards (player and NPC), read by the Shields console and other ship systems.
    architecture:
      classification: replicated
      owner: shield-arc-system
      derived_from: [shield-arc-state]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/core/messages.rs, gui/components/ph-shield-panel.js]
      symbols: [ShieldsBlackboard]
      tests: [cargo test, tests/client/ph-shield-panel.test.js]

  - component: shields-recent-damage-ai
    core:
      status: implemented
      confidence: confirmed
      title: Shields Recent Damage AI
      summary: AI-controlled Shields records real per-arc incoming damage against a per-arc previous-health snapshot and focuses concentrated damage over the authored damage window, falling back to a configured health-imbalance rule only when damage is not concentrated.
      rationale:
        - "Issue #826 (admission symmetry, following the #824 helm precedent): ai_shield_focus keeps the #692 decision logic (damage tracking, health imbalance, threat-bearing override via tick_shield_focus_ai) but no longer writes an intent component. It emits SetShieldArcFocus payloads through the shared command_admission::ai_emit::emit_ai_command seam (issue #738 collapsed the seven per-operator emit_*_ai_command copies into it) using its ship's own ai:<uuid> token, validated against that entity's own ControlSourceResolver (operate_ai must hold on the targeted arc). The write into the per-entity AdmittedCommands is direct and same-tick; shield-focus-controller (handle_shields_messages, SimSet::Physics, ordered after the emit) applies it. The paired integrate_shield_state adapter and the ShieldArcIntents transport are deleted."
        - "Issue #747 corrected the recent-damage focus signal. (1) ShieldsDamageHistory.last_hp holds a per-arc previous-health snapshot observed every tick, so real incoming damage is measured as prev_hp - current_hp rather than misreading a stored delta as prior health (the original defect). (2) Damage concentration is now measured over the AUTHORED damage_window_secs (floored at min_damage_window_secs), not a fixed last-min_damage_window_secs slice, so 'concentrated damage over authored windows' is honoured; the pruning window and the concentration window agree. (3) A focus-decay guard skips HP drops on a non-focused arc still at or above its reduced effective max_hp (ShieldSystem::tick decay bleeding toward the cap), so a focus side effect is never recorded as incoming fire. (4) ai_shield_focus now emits through the single-owner console_ai::shields_emit::emit_shields_ai_command wrapper (mirroring src/ship/helm_ai_emit.rs), making this operator's dependency on host-command-admission an observed per-entity code edge."
    architecture:
      kind: ai-operator
      authority: authoritative
      owns: [shields-damage-history-state]
      reads: [shield-arc-state, system-control-source-state]
      writes: [shields-damage-history-state]
      produces: [set-shield-arc-focus-command]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: observed
      paths: [src/ship/shields.rs, src/console_ai/core.rs, src/console_ai/server.rs, src/console_ai/shields_emit.rs, src/entities/config.rs, src/entities/spawner.rs]
      symbols: [ai_shield_focus, tick_shield_focus_ai, ShieldsDamageHistory, ShieldsAiConfigToml, emit_shields_ai_command]
      tests: [cargo test]

  - state: shields-damage-history-state
    core:
      status: implemented
      confidence: confirmed
      title: Shields Damage History State
      summary: Per-ship, per-arc timestamped damage data used by Shields AI over authored time windows, with a per-arc previous-health snapshot (last_hp) that supplies the damage-detection baseline each tick.
    architecture:
      classification: authoritative
      owner: shields-recent-damage-ai
      writers: [shields-recent-damage-ai]
    implementation:
      status: observed
      paths: [src/ship/shields.rs]
      symbols: [ShieldsDamageHistory, DamageRecord]

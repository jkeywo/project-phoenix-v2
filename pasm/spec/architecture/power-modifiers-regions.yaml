entities:
  - component: ship-power-controller
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power Controller
      summary: "Owns one canonical per-entity EnergyNetworkState: reactor ramp/capacitor, local consumer reserves, thermal hysteresis, desired/effective nested allocations, deterministic incoming-flow cuts/restoration and physical coolant credit. Simulation joins actual World stocks through existing service endpoints and queues withdrawals; no allocation output multipliers, global battery or lock remain."
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [ship-power-state, power-brownout-coordination-state]
      reads: [ship-station-system-topology-state, system-control-source-state, inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/modifiers/power_system.rs, crates/phoenix-sim-gameplay/src/resources/energy.rs, crates/phoenix-sim-gameplay/src/resources/energy_network.rs, crates/phoenix-simulation/src/ship/energy_runtime.rs, crates/phoenix-sim-gameplay/src/ship/power.rs]
      symbols: [PowerSystem, EnergyNetworkState, handle_power_messages, tick_power_system, coolant_bindings, reorder_energy_group, capture_continuation, restore_continuation]
      tests: [cargo test, tests/smoke/power-console.spec.js, crates/phoenix-sim-gameplay/src/modifiers/power_system_tests.rs]

  - state: ship-power-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power State
      summary: "Canonical energy continuation contains all local reserves/heat/thermal stops, reactor requested and actual output, group settings and effective allocations, saved cuts and restoration holds, fine overrides, weapon restraint, fractional coolant credit and funded-work readings. Immutable hardware is re-derived. Snapshot format 43 and rules 0.15 reject incompatible prior state."
    architecture:
      classification: authoritative
      owner: ship-power-controller
      writers: [ship-power-controller]
      replicas: [ship-system-blackboards-state, sensor-radar-blackboard-state]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/ship/power.rs, crates/phoenix-model/src/messages.rs, crates/phoenix-sim-gameplay/src/modifiers/power_system.rs, crates/phoenix-simulation/src/snapshot/mod.rs, tests/snapshot_resume.rs]
      symbols: [PowerBlackboard, PowerState, capture_continuation, restore_continuation]
      tests: [cargo test --features headless --test snapshot_resume power_continuation_, crates/phoenix-model/src/messages_view_mode_tests.rs, crates/phoenix-sim-gameplay/src/modifiers/power_system_tests.rs]

  - state: power-brownout-coordination-state
    core:
      status: implemented
      confidence: confirmed
      title: Power Brownout Coordination State
      summary: "Per-ship set of already-reported incoming-flow cuts and pending change edge. Reports fan out to affected Consoles, including nested consumers. Snapshot continuation sorts and restores the whole set; no exhaustion lock is represented."
    architecture:
      classification: authoritative
      owner: ship-power-controller
      writers: [ship-power-controller]
      derived_from: [ship-power-state]
    implementation:
      status: observed
      paths: [crates/phoenix-simulation/src/ship/power.rs, crates/phoenix-simulation/src/snapshot/mod.rs, crates/phoenix-simulation/src/server_app/registration.rs, tests/snapshot_resume.rs, crates/phoenix-sim-gameplay/src/ship/power.rs, crates/phoenix-simulation/src/snapshot/schema.rs]
      symbols: [PowerBrownoutState, PowerBrownoutContinuationState, tick_power_brownout_advisory]

      tests: [crates/phoenix-simulation/src/server_app/registration_physics_boundary_tests.rs]
  - component: ship-modifier-cache
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Cache
      summary: Per-ship source-aware cache that combines numeric modifiers and OR-aggregated flags into authoritative gameplay multipliers.
      rationale:
        - "Damage, impulse and regions compose source-aware effects. Incoming power flow is no longer an output multiplier; actual work consumes local energy."
    architecture:
      kind: modifier-service
      authority: authoritative
      owns: [ship-modifier-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/modifiers/cache.rs, crates/phoenix-model/src/messages.rs]
      symbols: [ShipModifiers]
      tests: [cargo test, crates/phoenix-sim-gameplay/src/modifiers/cache_tests.rs, crates/phoenix-model/src/messages_view_mode_tests.rs]

  - component: authored-power-ai-rule-evaluator
    core:
      status: implemented
      confidence: confirmed
      title: Authored Power AI Rule Evaluator
      summary: "The individual reactor System executes supported authored numeric state trees over its explicit permitted Console view. Finite facts, bounded channels, top-down last-write resolution, inheritance/reference nodes and private continuation use the same shared host as Dock. It emits ordinary admitted settings and stands down for a human."
      rationale:
        - "Increment 8 adopts consumer-local-energy-flow, reactor-local-capacitor-and-thermal-state and finite-coolant-and-saved-flow-cuts. Earlier group amplifiers, ranked-rung AI and ship-wide exhaustion lock are superseded. Existing System identity, Console knowledge, admission and transport remain."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [ship-power-state, system-control-source-state, ship-system-blackboards-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console_ai/server.rs, crates/phoenix-sim-gameplay/src/entities/config.rs, crates/phoenix-simulation/src/ship/power.rs, crates/phoenix-sim-gameplay/src/ai/policy.rs, crates/phoenix-sim-gameplay/src/modifiers/power_system.rs, crates/phoenix-sim-gameplay/src/entities/ai_policy_schema.rs, crates/phoenix-sim-gameplay/src/ship/power.rs]
      symbols: [ai_power_allocation, decide_tree_with_numbers, power_numeric_bindings, compile_ship_trees_with_energy, ShipAiTreeRuntime]
      tests: [cargo test, crates/phoenix-sim-gameplay/src/modifiers/power_system_tests.rs]

  - state: ship-modifier-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier State
      summary: Authoritative per-ship modifiers for speed, yaw, radar range, phaser damage, shield regeneration, hull damage, repair rate, and repair-team capacity plus Comms-jammed and sensor-blind flags.
    architecture:
      classification: authoritative
      owner: ship-modifier-cache
      writers: [ship-modifier-translator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/modifiers/cache.rs, crates/phoenix-model/src/messages.rs]
      symbols: [ShipModifiers]

      tests: [crates/phoenix-sim-gameplay/src/modifiers/cache_tests.rs, crates/phoenix-model/src/messages_view_mode_tests.rs]
  - component: ship-modifier-translator
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Translator
      summary: "Combines damage, impulse and region effects through existing modifier slots. Retired PowerGroup contributions are removed rather than translated into speed, yaw, damage or shield recovery. Actual machinery is limited by local work grants at its owning physical processor."
      rationale:
        - "Increment 8 removes allocation amplifiers while preserving independently authored equipment ranges and ordinary damage/environment effects. Low reserves restrict actual affordable work, not a second allocation-level multiplier."
    architecture:
      kind: translator
      authority: authoritative
      writes: [ship-modifier-state]
      reads: [ship-power-state, impulse-drive-state, region-membership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/modifiers/coordination.rs, crates/phoenix-simulation/src/regions/server.rs, crates/phoenix-simulation/src/ship/shields.rs, crates/phoenix-sim-gameplay/src/weapons/shield.rs, crates/phoenix-sim-gameplay/src/ship/shields.rs]
      symbols: [apply_power_modifiers, apply_region_effects, apply_impulse_to, tick_shields, tick_with_regen_scale]
      tests: [cargo test, crates/phoenix-simulation/src/modifiers/coordination_tests.rs]

  - component: region-containment-service
    core:
      status: implemented
      confidence: confirmed
      title: Region Containment Service
      summary: Evaluates authored sphere, box, and torus region membership for live ships and emits entry and exit events.
    architecture:
      kind: spatial-service
      authority: authoritative
      owns: [region-membership-state]
      reads: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/regions/server.rs, crates/phoenix-sim-gameplay/src/regions/shape.rs]
      symbols: [RegionPlugin, RegionShape]
      tests: [cargo test, crates/phoenix-sim-gameplay/src/regions/shape_tests.rs]

  - state: region-membership-state
    core:
      status: implemented
      confidence: confirmed
      title: Region Membership State
      summary: Authoritative transient relation recording which ships currently occupy each authored region and which region effects apply.
    architecture:
      classification: authoritative
      owner: region-containment-service
      writers: [region-containment-service]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/regions/server.rs, crates/phoenix-sim-gameplay/src/regions/effects.rs]
      symbols: [RegionEffectKind]

      tests: [crates/phoenix-sim-gameplay/src/regions/effects_tests.rs]
  - component: region-effect-resolution
    core:
      status: implemented
      confidence: confirmed
      title: Region Effect Resolution
      summary: Resolves damage zones, slow zones, impulse blockers, radar dampening, Comms jamming, sensor blindness, and nebula fog from active region membership.
    architecture:
      kind: effect-resolver
      authority: authoritative
      reads: [region-membership-state]
      writes: [ship-modifier-state, authoritative-damage-state, impulse-drive-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/regions/effects.rs, crates/phoenix-simulation/src/regions/server.rs, crates/phoenix-sim-gameplay/src/modifiers/coordination.rs]
      symbols: [RegionEffectKind]
      tests: [cargo test, crates/phoenix-sim-gameplay/src/regions/effects_tests.rs, crates/phoenix-simulation/src/modifiers/coordination_tests.rs]

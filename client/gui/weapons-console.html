<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Phoenix — Tactical Console</title>
  <!-- Keep the radar sweep (radar-widget.js) running at full rate even when
       this console's tab loses focus — see gui/bg-raf-keepalive.js. Must
       load before any requestAnimationFrame call. -->
  <script src="bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="console.css">
  <style>
    /* ── Landscape layout (2160×1080) — mirrors weapons-landscape.html ── */
    body { font-size: 16px; }
    .panel-inner {
      padding: 24px 60px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel-mid {
      flex: 1;
      display: flex;
      flex-direction: row;
      gap: 36px;
      min-height: 0;
    }
    .panel-mid > .radar-col   { flex: 1; min-width: 0; max-width: 720px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
    .panel-mid > .ctrl-col    { flex: 1; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
    .panel-inner > .hero       { padding: 4px 0 4px; flex-shrink: 0; }
    .panel-inner > .footer-bar { flex-shrink: 0; }

    /* Compress hero on landscape */
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; }
    .hero h1 .sub { font-size: 12px; margin-top: 2px; }
    .hero .bar { width: 6px; }
    .hero { gap: 12px; }

    /* Radar circle fills full screen height in landscape (surround-frame at 125dvh so 80% = 100dvh). */
    .radar-col .radar-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .radar-col .radar-surround-frame { aspect-ratio: 1/1; width: auto; height: calc(100dvh * 1.25); max-height: none; max-width: none; display: flex; align-items: center; justify-content: center; }
    .radar-col .radar-surround-frame .radar { width: 80%; height: 80%; max-height: none; max-width: none; }

    /* Compress inset bodies */
    .ctrl-col .inset             { flex: 1; min-height: 0; }
    /* Torpedo bay sizes to its content so every tube row stays visible
       (no internal scroll); the phaser array takes the remaining height. */
    .ctrl-col .torpedo-bay       { flex: 0 0 auto; }
    .ctrl-col .inset .inset-body { padding: 14px 26px; }
    .ctrl-col .section-header    { margin-bottom: 8px; font-size: 18px; }
    .ctrl-col .section-header .tag { font-size: 10px; }
    .ctrl-col .readout           { padding: 8px 18px; }
    .ctrl-col .readout .v        { font-size: 36px; }
    .ctrl-col .readout .v.tactical { font-size: 36px; }
    .ctrl-col .readout .k        { font-size: 12px; }
    .ctrl-col .readout .u        { font-size: 12px; }
    .ctrl-col .readout .sub      { font-size: 11px; }
    .ctrl-col .chip              { --h: 56px; font-size: 18px; }
    .ctrl-col .tube-status-row   { margin-top: 8px; }
    .ctrl-col .tube-status       { height: 30px; font-size: 14px; }
    .ctrl-col .btn               { --h: 68px; font-size: 22px; padding: 0 22px 0 56px; }
    .ctrl-col .btn .led          { width: 18px; height: 18px; left: 18px; }
    .ctrl-col .cooldown          { padding: 8px 0; }
    .ctrl-col .cooldown .value   { font-size: 18px; }

    /* ── Per-bank cooldown rows ──────────────────────────────── */
    .cooldown-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px 0;
    }
    .cooldown-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cooldown-row .bank-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      min-width: 48px;
      text-align: right;
      text-transform: uppercase;
    }
    .cooldown-row .bar {
      flex: 1;
      position: relative;
      height: 12px;
      background: var(--bg-deep);
      border: 1px solid var(--line-faint);
      overflow: hidden;
    }
    .cooldown-row .bar .fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      transition: width 0.12s linear, background 0.12s linear;
    }
    .cooldown-row .bar .ticks {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(90deg,
        transparent 0, transparent 11px,
        rgba(0,0,0,0.4) 11px, rgba(0,0,0,0.4) 12px);
      pointer-events: none;
    }
    .cooldown-row.is-ready  .bar .fill { background: linear-gradient(90deg, var(--loaded-dim), var(--loaded)); }
    .cooldown-row.is-firing .bar .fill { background: linear-gradient(90deg, var(--tactical-dim), var(--tactical)); box-shadow: 0 0 10px rgba(240,132,56,0.5); }
    .cooldown-row.is-cooling .bar .fill { background: linear-gradient(90deg, var(--reloading-dim), var(--reloading)); }
    .cooldown-row .value {
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      min-width: 58px;
      text-align: right;
      color: var(--ink-faint);
    }
    .cooldown-row.is-ready  .value { color: var(--loaded); }
    .cooldown-row.is-firing .value { color: var(--tactical); }
    .cooldown-row.is-cooling .value { color: var(--reloading); }
    .cooldown-row .arc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--bg-deep);
      border: 1px solid var(--line-faint);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .cooldown-row.arc-active .arc-dot {
      background: var(--loaded);
      border-color: var(--loaded);
      box-shadow: 0 0 5px var(--loaded);
    }

    .ctrl-col .frequency         { padding: 8px 0 4px; }
    .ctrl-col .frequency .freq-bar { height: 26px; }
    .ctrl-col .tubes             { display: flex; gap: 10px; margin-top: 6px; }
    .ctrl-col .fire-row          { margin-top: 12px; }

    /* Compact MAN/AUTO phaser-mode toggle that lives beside the fire button. */
    .phaser-mode-toggle {
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
      align-self: stretch;
    }
    .phaser-mode-toggle .opt {
      text-align: center;
      cursor: pointer;
      padding: 4px 14px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phaser-mode-toggle .opt:first-child { border-bottom: 1px solid var(--line-faint); }
    .radar-col > .readout        { padding: 10px 22px; }
    .radar-col > .readout .v     { font-size: 28px; }
    .torpedo-bay .inset-body {
      display: grid;
      grid-template-columns: minmax(112px, 0.8fr) minmax(0, 1.7fr);
      align-items: start;
      gap: 18px;
      height: 100%;
    }
    .torpedo-summary {
      min-width: 0;
    }
    .torpedo-summary .section-header {
      flex-wrap: wrap;
      gap: 6px;
    }
    #tube-list {
      min-width: 0;
      overflow-y: visible;
      padding-right: 2px;
    }

    /* Narrow landscape compact breakpoint (phone landscape) */
    @media (orientation: landscape) and (max-width: 900px) {
      .panel-inner { padding: 14px 20px 16px; gap: 8px; }
      .panel-mid { gap: 16px; }
      .panel-mid > .radar-col { max-width: 50%; }
      .hero h1 { font-size: 28px; letter-spacing: 0.18em; }
      .hero { gap: 10px; }
      .hero .sub { font-size: 11px; }
      .hero .complexity { display: none; }
      .radar-col .radar-surround-frame { max-height: none; max-width: none; }
      .side-rail { font-size: 9px; }
      .side-rail.top { top: 10px; }
      .side-rail.bottom { bottom: 10px; }
      .ctrl-col .inset .inset-body { padding: 10px 14px; }
      .ctrl-col .readout { padding: 6px 12px; }
      .ctrl-col .readout .v { font-size: 24px; }
      .ctrl-col .readout .k { font-size: 10px; }
      .ctrl-col .chip { --h: 36px; font-size: 12px; padding: 0 0.5rem; }
      .ctrl-col .btn { --h: 44px; font-size: 14px; padding: 0 10px 0 36px; }
      .ctrl-col .btn .led { width: 14px; height: 14px; left: 10px; }
      .ctrl-col .tube-status { height: 22px; font-size: 11px; }
      .ctrl-col .cooldown .value { font-size: 14px; }
      .cooldown-list { gap: 4px; padding: 4px 0; }
      .cooldown-row { gap: 8px; }
      .cooldown-row .bank-label { font-size: 9px; min-width: 38px; letter-spacing: 0.12em; }
      .cooldown-row .bar { height: 9px; }
      .cooldown-row .value { font-size: 10px; min-width: 44px; letter-spacing: 0.1em; }
      .cooldown-row .arc-dot { width: 7px; height: 7px; }
      .ctrl-col .frequency .freq-bar { height: 18px; }
      .radar-col > .readout { padding: 6px 14px; }
      .radar-col > .readout .v { font-size: 20px; }
      .section-header { font-size: 14px; }
      .torpedo-bay .inset-body {
        grid-template-columns: minmax(88px, 0.7fr) minmax(0, 1.8fr);
        gap: 10px;
      }
    }

    /* Short landscape phones: keep the whole console inside the iframe. */
    @media (orientation: landscape) and (max-height: 480px) {
      body { overflow: hidden; }
      .panel-inner {
        padding: 8px 14px 10px;
        gap: 5px;
      }
      .panel-mid {
        gap: 10px;
      }
      .panel-mid > .radar-col {
        max-width: 46%;
        gap: 5px;
      }
      .panel-mid > .ctrl-col {
        gap: 6px;
      }
      .panel-inner > .hero {
        padding: 0;
      }
      .hero {
        gap: 7px;
      }
      .hero h1 {
        font-size: clamp(18px, 5.2vh, 24px);
        letter-spacing: 0.14em;
      }
      .hero h1 .sub,
      .hero .bar,
      .hero .complexity,
      .hero .hull {
        display: none;
      }
      .side-rail,
      .footer-bar {
        display: none;
      }
      .radar-col .radar-surround-frame {
        height: calc(100dvh * 1.25);
        max-height: none;
        max-width: none;
      }
      .radar-col > .readout {
        padding: 4px 9px;
        gap: 6px;
      }
      .radar-col > .readout .v,
      #target-name {
        font-size: clamp(14px, 4.4vh, 18px) !important;
      }
      .radar-col > .readout .k,
      .radar-col > .readout .sub {
        font-size: 9px;
        line-height: 1.2;
      }
      .ctrl-col .inset .inset-body {
        padding: 6px 10px;
      }
      .ctrl-col .section-header {
        margin-bottom: 3px;
        font-size: clamp(10px, 3.1vh, 12px);
        letter-spacing: 0.18em;
      }
      .ctrl-col .section-header .tag {
        font-size: 8px;
        padding: 1px 4px;
      }
      .ctrl-col .readout {
        padding: 3px 8px;
        gap: 6px;
      }
      .ctrl-col .readout .v,
      .ctrl-col .readout .v.tactical {
        font-size: clamp(18px, 6vh, 23px);
      }
      .ctrl-col .readout .k,
      .ctrl-col .readout .u,
      .ctrl-col .readout .sub {
        font-size: 8px;
      }
      .torpedo-bay .inset-body {
        grid-template-columns: minmax(72px, 0.58fr) minmax(0, 1.9fr);
        gap: 7px;
      }
      #tube-list {
        max-height: none;
      }
      .ctrl-col .tubes {
        gap: 4px;
        margin-top: 3px;
      }
      .ctrl-col .chip {
        --h: clamp(24px, 7.5dvh, 32px);
        padding: 0 5px;
        font-size: clamp(9px, 2.8vh, 11px);
        letter-spacing: 0.14em;
      }
      .ctrl-col .tube-status-row {
        gap: 4px;
        margin-top: 3px;
      }
      .ctrl-col .tube-status {
        height: clamp(16px, 5dvh, 20px);
        gap: 4px;
        font-size: clamp(8px, 2.5vh, 10px);
        letter-spacing: 0.12em;
      }
      .ctrl-col .tube-status .dot {
        width: 5px;
        height: 5px;
      }
      .ctrl-col .btn {
        --h: clamp(28px, 9dvh, 38px);
        padding: 0 8px 0 28px;
        font-size: clamp(10px, 3.2vh, 13px);
        letter-spacing: 0.14em;
      }
      .ctrl-col .btn .led {
        width: 10px;
        height: 10px;
        left: 9px;
      }
      .ctrl-col .fire-row {
        margin-top: 4px;
      }
      .ctrl-col .fire-row[style] {
        padding-top: 5px !important;
      }
      .ctrl-col [data-hideable="phaser_mode_selector"] {
        gap: 6px !important;
      }
      .mini-toggle {
        font-size: 8px;
        letter-spacing: 0.1em;
      }
      .mini-toggle .opt {
        padding: 4px 6px;
      }
      .ctrl-col .cooldown {
        padding: 3px 0;
        gap: 6px;
      }
      .ctrl-col .cooldown .label {
        font-size: 8px;
      }
      .ctrl-col .cooldown .bar {
        height: 8px;
      }
      .ctrl-col .cooldown .value {
        min-width: 46px;
        font-size: 10px;
      }
      .cooldown-list { gap: 3px; padding: 3px 0; }
      .cooldown-row { gap: 6px; }
      .cooldown-row .bank-label {
        font-size: clamp(7px, 2vh, 8px);
        min-width: clamp(28px, 8vh, 36px);
        letter-spacing: 0.1em;
      }
      .cooldown-row .bar { height: clamp(6px, 2vh, 8px); }
      .cooldown-row .value {
        font-size: clamp(8px, 2.5vh, 10px);
        min-width: clamp(36px, 10vh, 46px);
        letter-spacing: 0.08em;
      }
      .cooldown-row .arc-dot { width: 6px; height: 6px; }
      .ctrl-col .frequency {
        padding: 3px 0 1px;
        gap: 3px;
      }
      .ctrl-col .frequency .freq-bar {
        height: 10px;
      }
      .freq-row {
        display: none;
      }
      .help-btn {
        width: 1.4rem;
        height: 1.4rem;
        font-size: 0.8rem;
      }
    }

    /* Side-rail micro-labels (centred top/bottom of frame) */
    .side-rail {
      position: absolute;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.4em;
    }
    .side-rail.top    { top: 16px;    left: 50%; transform: translateX(-50%); }
    .side-rail.bottom { bottom: 14px; left: 50%; transform: translateX(-50%); }

    /* Live-canvas overlay in the radar div */
    .radar canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Hidden data-attr containers (smoke-test targets — not visible) */
    #banks, #tubes {
      position: absolute;
      left: -9999px;
      visibility: hidden;
    }

    @media (orientation: portrait) {
      body { overflow-y: auto; overflow-x: hidden; }

      .panel-inner {
        padding: 0.75rem 0.5rem;
        gap: 0.5rem;
      }

      .panel-mid {
        flex-direction: column;
        gap: 0.5rem;
      }

      .panel-mid > .radar-col { width: 100%; }
      .panel-mid > .ctrl-col  { width: 100%; flex-direction: row; flex-wrap: wrap; }

      .hero {
        padding: 0.25rem 0;
        gap: 0.5rem;
      }
      .hero h1 { font-size: 1.25rem; letter-spacing: 0.15em; }
      .hero h1 .sub { display: none; }
      .hero .bar { display: none; }
      .hero .complexity { display: none; }
      .hero .hull { display: none; }
      .hero .spacer { display: none; }

      .side-rail { display: none; }

      .radar-col .radar-wrap { min-height: 30vh; }
      /* Portrait: radar circle fills full screen width (surround-frame at 125vw so 80% = 100vw). */
      .radar-col .radar-surround-frame { width: calc(100vw * 1.25); height: auto; max-height: none; max-width: none; }
      .radar-col .radar { max-height: none; max-width: none; }
      .radar-col > .readout { padding: 0.4rem 0.6rem; }
      .radar-col > .readout .v { font-size: 1.25rem; }

      /* Weapons panels side by side */
      .ctrl-col .inset { flex: 1; min-width: 0; }
      .ctrl-col .inset .inset-body { padding: 0.5rem; }
      .ctrl-col .section-header { font-size: 0.75rem; margin-bottom: 0.25rem; }
      .ctrl-col .section-header .tag { font-size: 0.5rem; }
      .ctrl-col .readout { padding: 0.3rem 0.4rem; }
      .ctrl-col .readout .v { font-size: 1.25rem; }
      .ctrl-col .readout .k { font-size: 0.55rem; }
      .ctrl-col .readout .u { font-size: 0.55rem; }
      .ctrl-col .chip { --h: 2rem; font-size: 0.6rem; padding: 0 0.4rem; }

      .ctrl-col .tube-status-row { margin-top: 0.25rem; }
      .ctrl-col .tube-status { height: 1.5rem; font-size: 0.65rem; gap: 0.25rem; }
      .ctrl-col .tube-status .dot { width: 6px; height: 6px; }

      .ctrl-col .fire-row { margin-top: 0.25rem; }
      .ctrl-col .btn { --h: 2.75rem; font-size: 0.8rem; padding: 0 0.5rem 0 2rem; }
      .ctrl-col .btn .led { width: 10px; height: 10px; left: 8px; }

      .ctrl-col .cooldown { padding: 0.25rem 0; }
      .ctrl-col .cooldown .value { font-size: 0.8rem; }
      .cooldown-list { gap: 0.25rem; padding: 0.25rem 0; }
      .cooldown-row { gap: 0.4rem; }
      .cooldown-row .bank-label { font-size: 0.55rem; min-width: 2.2rem; letter-spacing: 0.12em; }
      .cooldown-row .bar { height: 0.6rem; }
      .cooldown-row .value { font-size: 0.65rem; min-width: 2.8rem; letter-spacing: 0.08em; }
      .ctrl-col .frequency { padding: 0.25rem 0; }
      .ctrl-col .frequency .freq-bar { height: 1.25rem; }

      .ctrl-col .tubes { gap: 0.25rem; margin-top: 0.25rem; }
      .torpedo-bay .inset-body {
        display: block;
        height: auto;
      }
      #tube-list {
        overflow-y: visible;
        padding-right: 0;
      }

      .console-footer { font-size: 0.65rem; gap: 0.5rem; }
    }
  </style>
</head>
<body style="background:#000; margin:0; overflow:hidden;">

  <!-- Hidden data containers for smoke tests (#banks .bank, #tubes .tube) -->
  <div id="banks" aria-hidden="true"></div>
  <div id="tubes" aria-hidden="true"></div>

  <div class="frame landscape" data-screen-label="Weapons Console">
    <div class="panel">
      <div class="panel-inner">

        <!-- ── Main split: radar (left) + controls (right) ───────────── -->
        <div class="panel-mid">

          <!-- ── LEFT: Tactical radar ─────────────────────────────────── -->
          <section class="radar-col">
            <div class="radar-wrap">
              <div class="radar-surround-frame">
                <img class="radar-surround" src="src_assets/helm_console/radar-surround.png" alt="">
                <div class="radar" style="aspect-ratio:1/1;">
                  <img class="bg" src="src_assets/helm_console/radar-bg.png" alt="">
                  <div class="scan"></div>
                  <div class="crosshair-h"></div>
                  <div class="crosshair-v"></div>
                  <div class="range-label" id="rl-33" style="top:50%; left:8%;  transform:translateY(-50%);">—</div>
                  <div class="range-label" id="rl-66" style="top:50%; left:20%; transform:translateY(-50%);">—</div>
                  <div class="range-label" id="rl-100" style="top:50%; left:33%; transform:translateY(-50%);">—</div>
                  <canvas id="radar"></canvas>
                </div><!-- /.radar -->
              </div><!-- /.radar-surround-frame -->
            </div>

            <!-- Target readout strip under radar (hidden by Tactical Low preset) -->
            <div class="readout" data-hideable="target_lock_button">
              <div>
                <div class="k">LOCKED TARGET</div>
                <div class="v" id="target-name" style="font-size:32px;">—</div>
                <div class="sub" id="target-desc" style="display:none; color: var(--ink-faint);"></div>
              </div>
              <div class="spacer"></div>
              <div>
                <div class="sub" id="target-threat" style="display:none;"></div>
                <div class="sub" id="target-sub">NO LOCK</div>
              </div>
            </div>
          </section>

          <!-- ── RIGHT: Torpedo bay + Phaser array ───────────────────── -->
          <section class="ctrl-col">

            <!-- TORPEDO BAY ──────────────────────────────── -->
            <div class="inset torpedo-bay" data-hideable="torpedo_tube_selector">
              <div class="inset-body">
                <div class="torpedo-summary">
                  <div class="section-header">
                    <span>TORPEDO BAY</span>
                    <span class="tag" id="tube-count-tag">— TUBES</span>
                  </div>

                  <div class="readout">
                    <div class="k">MAG</div>
                    <div class="v tactical" id="torpedo-count" data-count="0">0</div>
                    <div class="u">RDS</div>
                    <div class="spacer"></div>
                  </div>
                </div>

                <!-- Per-tube rows (built dynamically) -->
                <div id="tube-list"></div>
              </div>
            </div>

            <style>
              .tube-row {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-top: 0;
              }
              .tube-row + .tube-row { margin-top: 10px; }
              .tube-row .tube-name {
                font-family: "JetBrains Mono", monospace;
                font-size: 12px;
                letter-spacing: 0.12em;
                color: var(--ink-faint);
                min-width: 80px;
                flex-shrink: 0;
              }
              .tube-buttons {
                margin-left: auto;
                display: flex;
                gap: 8px;
                flex-shrink: 0;
              }
              .tube-row .load-btn,
              .tube-row .fire-btn {
                --cham: 6px;
                position: relative;
                height: 36px;
                width: 100px;
                flex-shrink: 0;
                border: none;
                background: linear-gradient(180deg, #5e6f96 0%, #3a4674 50%, #1a2148 100%);
                clip-path: polygon(
                  var(--cham) 0, calc(100% - var(--cham)) 0, 100% var(--cham),
                  100% calc(100% - var(--cham)), calc(100% - var(--cham)) 100%,
                  var(--cham) 100%, 0 calc(100% - var(--cham)), 0 var(--cham)
                );
                color: var(--ink-dim);
                font-family: "Chakra Petch", sans-serif;
                font-weight: 600;
                font-size: 11px;
                letter-spacing: 0.18em;
                cursor: pointer;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                user-select: none;
              }
              .tube-row .load-btn::before,
              .tube-row .fire-btn::before {
                content: "";
                position: absolute;
                inset: 1.5px;
                --cham: 4.5px;
                background: linear-gradient(180deg, #1a2148 0%, #0e1432 50%, #070b22 100%);
                clip-path: polygon(
                  var(--cham) 0, calc(100% - var(--cham)) 0, 100% var(--cham),
                  100% calc(100% - var(--cham)), calc(100% - var(--cham)) 100%,
                  var(--cham) 100%, 0 calc(100% - var(--cham)), 0 var(--cham)
                );
              }
              .tube-row .load-btn span,
              .tube-row .fire-btn span {
                position: relative;
                z-index: 1;
              }
              .tube-row .load-btn:disabled,
              .tube-row .fire-btn:disabled {
                cursor: default;
                opacity: 0.45;
              }
              .tube-row .load-btn .load-fill {
                position: absolute;
                inset: 0;
                width: 0%;
                background: rgba(0,200,120,0.14);
                transition: width 0.15s linear;
                pointer-events: none;
                z-index: 0;
              }
              .tube-row .load-btn.btn-unload .load-fill {
                background: rgba(255,120,60,0.14);
              }
              .tube-row .load-btn.btn-load { color: var(--loaded); }
              .tube-row .load-btn.btn-unload { color: var(--reloading); }
              .tube-row .load-btn.btn-loading,
              .tube-row .load-btn.btn-unloading { color: var(--ink-faint); }
              .tube-row .fire-btn.armed {
                background: linear-gradient(180deg, #8c4818 0%, #5a2c10 50%, #2a1008 100%);
                color: var(--tactical);
              }
              .tube-row .fire-btn.armed::before {
                background: linear-gradient(180deg, #2a1408 0%, #180c04 50%, #0c0602 100%);
              }

              @media (orientation: landscape) and (max-height: 480px) {
                .tube-row {
                  gap: 5px;
                }
                .tube-row + .tube-row {
                  margin-top: 5px;
                }
                .tube-row .tube-name {
                  min-width: 56px;
                  font-size: clamp(8px, 2.4vh, 9px);
                  letter-spacing: 0.08em;
                }
                .tube-buttons {
                  gap: 4px;
                }
                .tube-row .load-btn,
                .tube-row .fire-btn {
                  height: clamp(23px, 7dvh, 28px);
                  width: clamp(56px, 18vw, 68px);
                  font-size: clamp(8px, 2.4vh, 9px);
                  letter-spacing: 0.1em;
                }
              }

              @media (orientation: portrait) {
                .tube-row { flex-direction: column; align-items: stretch; gap: 4px; margin-top: 10px; }
                .tube-row:first-child { margin-top: 10px; }
                .tube-row .tube-name { min-width: unset; font-size: 10px; }
                .tube-buttons { margin-left: 0; }
                .tube-row .load-btn,
                .tube-row .fire-btn { height: 30px; font-size: 10px; flex: 1; }
              }
            </style>

            <!-- PHASER ARRAY ──────────────────────────────── -->
            <div class="inset">
              <div class="inset-body">
                <div class="section-header">
                  <span>PHASER ARRAY</span>
                  <span class="tag" id="phaser-tag">BEAM</span>
                </div>

                <div class="cooldown-list" id="phaser-cooldowns">
                  <!-- Per-bank cooldown rows are built dynamically from
                       `state.banks` + `state.phaserBanks` (ship config). -->
                </div>

                <!-- Fire phasers + compact MAN/AUTO mode toggle.
                     The toggle (hidden by the Tactical Low preset) sits next
                     to the fire button; the button itself is always visible. -->
                <div class="fire-row" style="margin-top:auto; padding-top:18px; display:flex; gap:12px; align-items:stretch;">
                  <button id="fire-phaser" class="btn danger" style="flex:1;" type="button">
                    <span class="btn-bg"></span>
                    <span class="led fire"></span>
                    <span class="label">FIRE PHASERS</span>
                  </button>
                  <span class="auto-badge" id="tactical-auto-badge" hidden>AUTO</span>
                  <div class="mini-toggle phaser-mode-toggle" id="phaser-mode-toggle" data-hideable="phaser_mode_selector">
                    <div class="opt" id="mode-man">MAN</div>
                    <div class="opt active" id="mode-auto">AUTO</div>
                  </div>
                </div>

                <!-- Fire blasters button (issue #631). Shown only when the
                     ship config declares at least one blaster bank. -->
                <div id="fire-blasters-row" style="padding-top:8px; display:none;">
                  <button id="fire-blaster" class="btn danger" style="width:100%;" type="button">
                    <span class="btn-bg"></span>
                    <span class="led fire"></span>
                    <span class="label">FIRE BLASTERS</span>
                  </button>
                </div>
              </div>
            </div>

          </section>
        </div>
        <!-- /panel-mid -->

        <div class="hull" id="hull-display" style="display:none; padding: 4px 16px;">
          <span>HULL</span>
          <div class="bar"><div class="fill" id="hull-fill" style="width:100%;"></div></div>
          <span class="val" id="hull-val">—</span>
          <div id="hull-sys-popup" class="hull-sys-popup" style="display:none;"></div>
        </div>

        <!-- Footer bar -->
        <footer class="console-footer footer-bar">
          <span class="dot"></span>
          <span id="footer-status">TACTICAL ONLINE</span>
          <span class="sep">·</span>
          <span id="footer-lock" style="color:var(--ink-faint);">NO LOCK</span>
          <span style="flex:1"></span>
          <span id="footer-right" style="color:var(--ink-faint);">—</span>
        </footer>

      </div>
    </div>
  </div>

  <script src="radar-widget.js"></script>

  <script type="module">
    import { initConsole, renderStationDamageBar } from './console-core.js';
    import { setAutoState } from './console-ui.js';

    // ── State ────────────────────────────────────────────────────────────
    var _selectedBank  = 'fore';
    var _state         = null;
    var _radarWidget   = null;

    // Stable per-tube DOM refs, keyed by tube id. State pushes arrive at
    // 10Hz; rebuilding the load/fire buttons from scratch on every push
    // destroyed the button mid-click (mousedown on the old node, mouseup
    // after it had already been replaced), so most clicks were silently
    // dropped. Buttons are now created once and updated in place.
    var _tubeRowEls = {};

    // Stable per-bank cooldown DOM refs, keyed by bank id. Built once on
    // first render (or when the ship config changes); updated in place at
    // 10Hz so the bar can animate smoothly without DOM churn.
    var _cooldownRowEls = {};

    // ── Inbound state push (ADR-0001 §2) ─────────────────────────────────
    // Handled by initConsole({ render }) — see bottom of script.

    // Build the (stable) DOM nodes for one torpedo tube row. Click handlers
    // look up the tube's current state from `_state` at click time rather
    // than capturing it, since these nodes now persist across many renders.
    function _buildTubeRow(id) {
      var loadBtn = document.createElement('button');
      loadBtn.type = 'button';

      var fill = document.createElement('span');
      fill.className = 'load-fill';

      var lbl = document.createElement('span');
      loadBtn.appendChild(fill);
      loadBtn.appendChild(lbl);

      loadBtn.addEventListener('click', function() {
        var t = (_state && _state.tubes || []).find(function(x) { return x.id === id; });
        var st = t ? (t.state || (t.loaded ? 'loaded' : 'unloaded')) : 'unloaded';
        loadBtn.disabled = true;
        if (st === 'loaded') {
          loadBtn.className = 'load-btn btn-unloading';
          fill.style.width = '0%';
          lbl.textContent = 'UNLOADING ' + (t && typeof t.load_time === 'number' ? t.load_time.toFixed(1) : '…') + 's';
          sendAction('unload_tube', { tube: id });
        } else if (st === 'loading') {
          loadBtn.className = 'load-btn btn-unloading';
          fill.style.width = '0%';
          lbl.textContent = 'CANCEL…';
          sendAction('unload_tube', { tube: id });
        } else {
          loadBtn.className = 'load-btn btn-loading';
          fill.style.width = '0%';
          lbl.textContent = 'LOADING 0%';
          sendAction('load_tube', { tube: id });
        }
      });

      var fireBtn = document.createElement('button');
      fireBtn.type = 'button';
      var fireLbl = document.createElement('span');
      fireLbl.textContent = 'FIRE';
      fireBtn.appendChild(fireLbl);
      fireBtn.addEventListener('click', function() {
        var targetUuid = (_state && _state.target_uuid) ? _state.target_uuid : null;
        sendAction('fire_torpedo', { tube: id, target_uuid: targetUuid });
      });

      var row = document.createElement('div');
      row.className = 'tube-row';

      var nameEl = document.createElement('span');
      nameEl.className = 'tube-name';

      var btns = document.createElement('div');
      btns.className = 'tube-buttons';
      btns.appendChild(loadBtn);
      btns.appendChild(fireBtn);

      row.appendChild(nameEl);
      row.appendChild(btns);

      return { row: row, nameEl: nameEl, loadBtn: loadBtn, fill: fill, lbl: lbl, fireBtn: fireBtn };
    }

    // Build the (stable) DOM nodes for one per-bank cooldown row.
    function _buildCooldownRow(id) {
      var row = document.createElement('div');
      row.className = 'cooldown-row';
      row.dataset.id = id;

      var label = document.createElement('div');
      label.className = 'bank-label';
      // Drop the hyphen-style id (e.g. "fore_port") down to a short label.
      label.textContent = String(id).replace(/_/g, ' ').toUpperCase();

      var bar = document.createElement('div');
      bar.className = 'bar';
      var fill = document.createElement('div');
      fill.className = 'fill';
      var ticks = document.createElement('div');
      ticks.className = 'ticks';
      bar.appendChild(fill);
      bar.appendChild(ticks);

      var value = document.createElement('div');
      value.className = 'value';
      value.textContent = '—';

      var arcDot = document.createElement('div');
      arcDot.className = 'arc-dot';
      arcDot.title = 'Target in arc';

      row.appendChild(label);
      row.appendChild(arcDot);
      row.appendChild(bar);
      row.appendChild(value);

      return { row: row, fill: fill, value: value, arcDot: arcDot };
    }

    // Reconcile cooldown rows against the current bank set: build new
    // rows for unseen ids, drop rows for removed ids. Returns the ordered
    // list of bank ids (as drawn in the DOM) so the caller can update them.
    function _ensureCooldownRows(bankIds) {
      var listEl = document.getElementById('phaser-cooldowns');
      if (!listEl) return [];

      var seen = {};
      bankIds.forEach(function(id) { seen[id] = true; });

      // Remove stale rows (bank no longer in ship config).
      Object.keys(_cooldownRowEls).forEach(function(id) {
        if (!seen[id]) {
          _cooldownRowEls[id].row.remove();
          delete _cooldownRowEls[id];
        }
      });

      // Add new rows (and re-order to match the ship config order).
      bankIds.forEach(function(id) {
        var els = _cooldownRowEls[id];
        if (!els) {
          els = _buildCooldownRow(id);
          _cooldownRowEls[id] = els;
        }
        // Re-append in current order; this is a no-op if already last.
        listEl.appendChild(els.row);
      });

      return bankIds;
    }

    // Update a single cooldown row's bar + value from per-bank state.
    // `cooldownTotal` is the ship-config-provided cooldown duration for
    // this bank (used to size the bar fill). When 0 or absent, falls back
    // to the bank's observed peak `cooldown_remaining` since the last reset.
    var _cooldownPeak = {};
    function _renderCooldownRow(els, bankState, cooldownTotal, targetInArc) {
      var remaining = typeof bankState.cooldown_remaining === 'number'
        ? Math.max(0, bankState.cooldown_remaining) : 0;
      var onCooldown = !!bankState.on_cooldown;

      // Track the peak remaining we've seen so the bar still works for
      // banks where the config didn't ship a cooldown_secs (defensive).
      if (remaining > (_cooldownPeak[bankState.id] || 0)) {
        _cooldownPeak[bankState.id] = remaining;
      } else if (!onCooldown) {
        _cooldownPeak[bankState.id] = 0;
      }
      var total = cooldownTotal > 0 ? cooldownTotal : (_cooldownPeak[bankState.id] || 0);

      var stateClass = 'cooldown-row';
      var fillPct = 0;
      var valueText = '';

      if (!onCooldown) {
        // Ready to fire (modulo target lock — that's the FIRE button's job).
        stateClass += ' is-ready';
        fillPct = 100;
        valueText = 'READY';
      } else if (remaining <= 0.05) {
        // on_cooldown but no countdown remaining = beam currently firing.
        stateClass += ' is-firing';
        fillPct = 100;
        valueText = 'FIRING';
      } else {
        // Post-beam cooldown: bar refills as remaining drains to 0.
        stateClass += ' is-cooling';
        fillPct = total > 0 ? Math.max(0, Math.min(100, (1 - remaining / total) * 100)) : 0;
        valueText = remaining.toFixed(1) + 's';
      }

      if (targetInArc) stateClass += ' arc-active';
      els.row.className = stateClass;
      els.fill.style.width = fillPct.toFixed(1) + '%';
      els.value.textContent = valueText;
    }

    function _renderConsole(s) {
      _state = s;

      // ── Hidden data-attr containers (smoke-test targets) ────────────────
      // #banks .bank[data-id][data-fire-ready][data-on-cooldown]
      // #tubes .tube[data-id][data-loaded][data-reload-secs]
      var banksEl = document.getElementById('banks');
      banksEl.innerHTML = '';
      (s.banks || []).forEach(function(b) {
        var row = document.createElement('div');
        row.className = 'bank';
        row.dataset.id = b.id;
        row.dataset.fireReady  = String(!!b.fire_ready);
        row.dataset.onCooldown = String(!!b.on_cooldown);
        banksEl.appendChild(row);
      });

      var tubesDataEl = document.getElementById('tubes');
      tubesDataEl.innerHTML = '';
      (s.tubes || []).forEach(function(t) {
        var row = document.createElement('div');
        row.className = 'tube';
        row.dataset.id         = t.id;
        row.dataset.loaded     = String(!!t.loaded);
        row.dataset.reloadSecs = String(t.reload_secs);
        tubesDataEl.appendChild(row);
      });

      // ── Torpedo magazine count ───────────────────────────────────────────
      var countEl = document.getElementById('torpedo-count');
      var n = (typeof s.torpedo_count === 'number') ? s.torpedo_count : 0;
      countEl.textContent   = String(n);
      countEl.dataset.count = String(n);

      // ── Per-tube rows ────────────────────────────────────────────────────
      var tubes = s.tubes || [];
      var tubeCountTag = document.getElementById('tube-count-tag');
      if (tubeCountTag) tubeCountTag.textContent = tubes.length + ' TUBE' + (tubes.length !== 1 ? 'S' : '');

      var tubeList = document.getElementById('tube-list');

      // Drop rows for tubes that no longer exist (tube list is static in
      // practice, but stay correct if it ever changes).
      var seenIds = {};
      tubes.forEach(function(t) { seenIds[t.id] = true; });
      Object.keys(_tubeRowEls).forEach(function(id) {
        if (!seenIds[id]) {
          _tubeRowEls[id].row.remove();
          delete _tubeRowEls[id];
        }
      });

      tubes.forEach(function(t) {
        var state    = t.state || (t.loaded ? 'loaded' : 'unloaded');
        var progress = typeof t.progress === 'number' ? t.progress : (t.loaded ? 1 : 0);
        var name     = t.id.replace(/_/g, ' ').toUpperCase();

        var els = _tubeRowEls[t.id];
        if (!els) {
          els = _buildTubeRow(t.id);
          _tubeRowEls[t.id] = els;
          tubeList.appendChild(els.row);
        }

        els.nameEl.textContent = name;
        els.fill.style.width = (progress * 100).toFixed(1) + '%';
        els.loadBtn.disabled = state === 'unloading';

        if (state === 'loaded') {
          els.loadBtn.className = 'load-btn btn-unload';
          els.lbl.textContent = 'UNLOAD';
        } else if (state === 'unloaded') {
          els.loadBtn.className = 'load-btn btn-load';
          els.lbl.textContent = 'LOAD';
        } else if (state === 'loading') {
          els.loadBtn.className = 'load-btn btn-loading';
          els.lbl.textContent = 'LOADING ' + Math.round(progress * 100) + '%';
        } else {
          els.loadBtn.className = 'load-btn btn-unloading';
          var secsLeft = typeof t.reload_secs === 'number' ? t.reload_secs : 0;
          els.lbl.textContent = 'UNLOADING ' + secsLeft.toFixed(1) + 's';
        }

        els.fireBtn.disabled = state !== 'loaded';
        els.fireBtn.className = state === 'loaded' ? 'fire-btn armed' : 'fire-btn';
      });

      // ── Phaser state ─────────────────────────────────────────────────────
      var banks   = s.banks || [];
      var anyReady = banks.some(function(b) { return b.fire_ready; });

      var modeStr        = String(s.phaser_mode || 'Auto');
      var modeMEl        = document.getElementById('mode-man');
      var modeAEl        = document.getElementById('mode-auto');
      if (modeMEl) modeMEl.className = 'opt' + (modeStr === 'Manual' ? ' active' : '');
      if (modeAEl) modeAEl.className = 'opt' + (modeStr !== 'Manual' ? ' active' : '');

      // ── Per-bank phaser cooldown bars ────────────────────────────────
      // One row per bank, each showing READY / FIRING / x.xs cooling.
      // Ship-config-provided cooldown_secs sizes the bar; falls back to
      // the observed peak `cooldown_remaining` when missing.
      var bankConfigs = s.phaser_arcs || [];
      var bankCooldownTotals = {};
      bankConfigs.forEach(function(b) {
        if (b && b.id && typeof b.cooldown_secs === 'number') {
          bankCooldownTotals[b.id] = b.cooldown_secs;
        }
      });
      // Bank id order: prefer ship config order, fall back to broadcast order.
      var orderedIds = bankConfigs.length > 0
        ? bankConfigs.map(function(b) { return b.id; })
        : banks.map(function(b) { return b.id; });
      // Compute target bearing (degrees clockwise from ship-forward) from the
      // locked blip's pre-projected radar coords (radar_x=starboard, radar_y=forward).
      var targetBearingDeg = null;
      var targetBlip = s.target_uuid
        ? (s.blips || []).find(function(b) { return b.uuid === s.target_uuid; })
        : null;
      if (targetBlip && targetBlip.radar_x != null && targetBlip.radar_y != null) {
        targetBearingDeg = Math.atan2(targetBlip.radar_x, targetBlip.radar_y) * 180 / Math.PI;
      }

      _ensureCooldownRows(orderedIds);
      orderedIds.forEach(function(id) {
        var els  = _cooldownRowEls[id];
        var bank = banks.find(function(b) { return b.id === id; });
        var cfg  = bankConfigs.find(function(b) { return b.id === id; });
        if (!els || !bank) return;
        var inArc = false;
        if (targetBearingDeg !== null && cfg && cfg.fire_arc_deg > 0) {
          var diff = ((targetBearingDeg - cfg.facing_deg) % 360 + 540) % 360 - 180;
          inArc = Math.abs(diff) <= cfg.fire_arc_deg / 2;
        }
        _renderCooldownRow(els, bank, bankCooldownTotals[id] || 0, inArc);
      });

      var firePhaserBtn = document.getElementById('fire-phaser');
      if (firePhaserBtn) {
        firePhaserBtn.className = 'btn ' + (anyReady ? 'danger' : 'disabled');
      }

      // ── Target readout ────────────────────────────────────────────────
      var nameEl    = document.getElementById('target-name');
      var subEl     = document.getElementById('target-sub');
      var descEl    = document.getElementById('target-desc');
      var threatEl  = document.getElementById('target-threat');
      var hasLock   = !!s.target_uuid;
      var lockedBlip = hasLock ? (s.blips || []).find(function(b) { return b.uuid === s.target_uuid; }) : null;
      if (nameEl) nameEl.textContent = hasLock ? (s.target_name || s.target_uuid.substring(0, 20) + '…') : '—';
      if (subEl)  subEl.textContent  = hasLock ? '◉ LOCK ACTIVE' : 'NO LOCK';
      if (descEl) {
        var desc = lockedBlip && lockedBlip.description;
        descEl.textContent = desc || '';
        descEl.style.display = desc ? '' : 'none';
      }
      if (threatEl) {
        var tl = lockedBlip && lockedBlip.threat_level;
        var tlMap = { none: null, low: 'THREAT: LOW', medium: 'THREAT: MEDIUM', high: 'THREAT: HIGH' };
        var tlText = tl ? (tlMap[tl] || null) : null;
        var tlColor = { low: 'var(--green)', medium: 'var(--yellow, #f0c040)', high: 'var(--tactical)' };
        threatEl.textContent = tlText || '';
        threatEl.style.display = tlText ? '' : 'none';
        threatEl.style.color = tl ? (tlColor[tl] || 'var(--ink-faint)') : '';
      }

      var footerLock = document.getElementById('footer-lock');
      if (footerLock) {
        footerLock.textContent = hasLock ? '◉ LOCK ACTIVE' : 'NO LOCK';
        footerLock.style.color = hasLock ? 'var(--tactical)' : 'var(--ink-faint)';
      }

      // ── Radar widget ─────────────────────────────────────────────────
      if (_radarWidget) {
        _radarWidget.update({
          mode:         'pre-projected',
          blips:        s.blips        || [],
          phaser_arcs:  s.phaser_arcs  || [],
          torpedo_arcs: s.torpedo_arcs || [],
          target_uuid:  s.target_uuid  || null,
          regions:      s.regions      || [],
        });
      }

      // ── Damage bar ───────────────────────────────────────────────────
      renderStationDamageBar(s.own_hull, 'hull-display', 'hull-fill', 'hull-val', 'hull-sys-popup');

      // AUTO badge: show when tactical station is AI-controlled (Backfill rating).
      setAutoState(document.getElementById('fire-phaser'), document.getElementById('tactical-auto-badge'), !!s.tactical_auto);

      // Fire blasters row: visible only when the ship has blaster banks.
      var blastersRow = document.getElementById('fire-blasters-row');
      if (blastersRow) {
        var hasBlasters = Array.isArray(s.blasters) && s.blasters.length > 0;
        blastersRow.style.display = hasBlasters ? '' : 'none';
      }
    }

    // ── Outbound actions ──────────────────────────────────────────────────
    document.getElementById('fire-phaser').addEventListener('click', function() {
      // Fire with first fire-ready bank, falling back to _selectedBank ('fore')
      var bank = _selectedBank || 'fore';
      if (_state && _state.banks) {
        var ready = _state.banks.filter(function(b) { return b.fire_ready; });
        if (ready.length > 0) bank = ready[0].id;
      }
      sendAction('fire_phaser', { bank: bank });
    });

    // Fire blasters button — fires the first fire-ready blaster bank.
    var fireBlasterEl = document.getElementById('fire-blaster');
    if (fireBlasterEl) {
      fireBlasterEl.addEventListener('click', function() {
        var bank = 'fore';
        if (_state && Array.isArray(_state.blasters)) {
          var ready = _state.blasters.filter(function(b) { return b.fire_ready; });
          if (ready.length > 0) bank = ready[0].id;
          else if (_state.blasters.length > 0) bank = _state.blasters[0].id;
        }
        sendAction('fire_blaster', { bank: bank });
      });
    }

    // MAN/AUTO toggle beside the fire button — each option sets its mode.
    var _modeManEl = document.getElementById('mode-man');
    var _modeAutoEl = document.getElementById('mode-auto');
    if (_modeManEl) _modeManEl.addEventListener('click', function() {
      sendAction('set_phaser_mode', { mode: 'Manual' });
    });
    if (_modeAutoEl) _modeAutoEl.addEventListener('click', function() {
      sendAction('set_phaser_mode', { mode: 'Auto' });
    });

    // ── Radar tap-to-lock via RadarWidget ────────────────────────────────
    // RadarWidget handles hit-testing and calls onBlipTap with the uuid.
    _radarWidget = (function () {
      var canvas = document.getElementById('radar');
      if (!canvas || typeof RadarWidget === 'undefined') return null;
      return new RadarWidget(canvas, {
        consoleId:   'tactical',
        orientation: 'world_fixed',  // tactical = north-up (world-fixed); orientation is ignored in pre-projected mode

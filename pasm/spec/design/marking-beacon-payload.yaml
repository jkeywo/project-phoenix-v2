entities:
  - decision: layered-combat-physical-marking-consumer
    core:
      status: accepted
      confidence: confirmed
      title: Marking Delivers Finite Subject-Relative Observation Equipment
      summary: "S012A's physical marking equipment is an adopted bounded opt-in guided-payload consumer. Normal finite loading/launch/interception, actual configured entities, shared physical constraints, paid observations and compatible Radio reports remain their existing owners. Root adopted the reviewed endpoint-contact, attachment and paid-report contracts before runtime; actual consumer verification remains required."
      rationale:
        - "The adopted contract is docs/gameplay-redesign/implementation/increment-15-marking.md, reviewed through b5d4faba by Root, Craft and Comms before runtime. Selected physical beacons are required; the bounded implementation resolves previously open contact, observation and reporting choices. No tracking bonus, free identification, hidden interior, universal penetration or broad mine/terrain/recovery mechanic is selected by this slice."
        - "A mark-only guided round freezes its accepted child recipe and launch faction. Only a surviving actual supported unshielded hull contact consumes the round into one equipped body. The first explicit model requires actual current Damage endpoint containment in the live same-body parentless Ball/Y-Capsule/Y-Cylinder Collider at current ShipPhysics pose with AbsoluteONE scale, then actual Collider.project_point(solid=false) boundary placement. Existing locked bevy_rapier3d0.33 contains_point/project_point APIs supply exact shape queries; World/proximity radius and zero explosive radius are never proof. Between-endpoint crossings may miss; no swept-impact/CCD claim is made. Simulation's existing tick_torpedo_lifecycle alone selects the exact mark-only predicate; pure Gameplay proximity excludes these rounds, so a coarse outside-shape match cannot consume or stop flight. Only real contact reaches existing handle_collision_full removal with value-only result; pure Gameplay imports no Rapier/scene/controller knowledge and unmarked/source-excluded/PDC/final-expiry behavior stays unchanged. Zero damaging/EMP payload, PDC, shield-up, expiry and unsupported contact create no beacon. Exact API/shape choice awaits Root/Craft review before adoption."
        - "Use actual accepted configured equipment and extend the existing runtime spawn provenance/content closure, with deterministic round-child identity and complete accepted-loader regression. No private JSON merge, runtime file fallback, second ammunition inventory or source-only lookup after launcher loss."
        - "An explicit canonical Attached/Detached relation drives the same physical synchronization owner's rigid-constraint projection before Rapier and after later Dock/Tractor corrections, without a second integrator or independent pose intent. Attached equipment has no competing motion/actuator writer. Local offset uses the inverse/full existing physical yaw-and-roll quaternion and projects with that same rotation, matching collider banking without new pitch/vertical controls or child intent. Attached captured ShipPhysics is a checked candidate relation/subject projection and becomes ordinary retained pose only on actual detach. Exact phase/API and writer census must be reviewed by Root/Craft before adoption; Carried/Disabled is not attachment."
        - "Use existing RapierPhysicsPlugin's BevyPhysicsHooks SystemParam with ActiveHooks FILTER_CONTACT_PAIRS only on beacon, actual PairFilterContextView entities, None only for exact attached subject and Some COMPUTE_IMPULSES otherwise; nonbeacon pairs do not invoke it. Add the same exact relation-aware pair predicate at the ordinary server_app/collision consumer so touching attached bodies cannot repeatedly damage/de-overlap/force their own mechanical pair. The exclusion ends on detach and grants no third-body, weapon, ray, compartment-damage or detection immunity. This missing seam must be proven before contact spawning."
        - "The adopted first slice excludes all carry-capable target bodies: actual ProbeCustody or accepted ProbeProfile, including deployed craft. Contact and both candidate/current-parent continuation guards mirror this restriction. Disabled is not destruction and never triggers false detach; ordinary independent hull/facility targets remain eligible. A later attached-stored-body physical-presence design remains open, without a generic all-target claim or new custody owner."
        - "The first paid SensorRadar measures only the actual attached subject's position/observed motion with existing cadence, uncertainty, provenance and history. No identity/assessment/private route is exposed. Actual subject removal detaches at the last physical pose and ends subject-only measurement; broken observation/link does not imply physical loss."
        - "Expose exact actor/System/current-tick raw Radio paid-fraction receipts, not already Operation-scaled/pre-motion Endpoint.listening. Rebuild current pose and Operation once at the late report boundary without paying continuous work again; absent receipt is zero. Source emission pays/stamps once per new sample regardless of viable receivers. Only delivery uses current compatible paid receiver route/condition/channel/keys/coverage. It reuses original radar sample export/receipt into existing same-faction recipient owners. Legacy range-only sharing remains unchanged. Exact paid-endpoint/report timing must be reviewed by Root/Comms before adoption."
        - "Finite battery and ordinary component/compartment damage govern endurance and vulnerability. Actual exhaustion leaves inert hardware; jamming/destruction interrupt supported reporting. Existing per-System controllers and System-addressed authority remain; general recovery/cleaning/mines and broad craft modes are outside this consumer."
        - "Canonical attachment, runtime recipe and successful-report frontier join existing snapshot/fold/preflight with complete candidate validation before writes. Derived poses/paid routes never become new saved owners. Workshop payload reference and equipment closure use existing accepted document/history/Preview/Test. Source preparation is not native execution or an increment15 exit."

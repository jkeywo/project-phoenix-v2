  - component: gm-t2-map-feed-and-inspector-shell
    core:
      status: accepted
      confidence: confirmed
      title: Omniscient Map, Activity Feed, and Reusable Inspector Shell
      summary: "M1 shows every player ship, NPC, structure, authored hazard and authored Region with stable identity, position, faction, broad health/status, and current target. Asteroid fields render as aggregate Regions, never as individual asteroids unless authored as named selectable entities. Selection opens a minimal reusable inspector shell. One bounded tick-stamped activity stream projects existing structured balance/scenario sources: damage, destruction, Objectives, trigger fires, Red Alert, connections, and GM actions, with category/ship filters and selection links. Detailed doctrine, damage, Comms, knowledge, and attention scoring wait for the milestones that own them."
      rationale:
        - "The map, selection, inspector, panels, capability adapters, and action adapters are T2 components designed for M6 reuse, not a disposable GM page."
        - "The feed consumes existing structured events rather than creating a parallel GM-only event bus; M4 later derives attention assistance from this evidence."
    architecture:
      kind: gm-presentation
      authority: non-authoritative
      coordinates: [gm-milestone-peer-tracer, gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/gm_projection.rs, src/console_bridge.rs, src/core/codec.rs, src/server/bridge.rs, gui/gm-local-projection.js, gui/entity-inspector.js, gui/components/ph-navigation-map.js, assets/strings/strings.csv, server.html]

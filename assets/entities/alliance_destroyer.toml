[shields_console]
# What a reactor point spent on `shields` buys: `ModifierSlot::ShieldRegen`
# (issue #952). Index 0 is 0.0 rather than the fleet default's -0.5 because
# Shields rest at level 2, alongside Helm and Weapons: each `[[shield_arc]]`
# therefore regenerates at its authored rate. The rungs either side trade a
# reactor point for slower or faster shield recovery.
power_multipliers = [ -0.5, 0, 0.25, 0.5 ]
focus_bonus_max_hp = 0
focus_bonus_regen = 4
focus_penalty_max_hp = 0
focus_penalty_regen = 1.0

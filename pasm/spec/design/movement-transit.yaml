  - decision: redesign-movement-single-physical-executor
    core:
      status: accepted
      confidence: confirmed
      title: Direct and Assisted Helm Share Actual Actuators
      summary: "Increment 18 extends existing Helm intent and physics with desired speed/absolute heading assistance, visible direct-control toggle and equipment-limited sustained boost. Capital ships remain planar except limited collision avoidance; actual small craft use full 3D. No parallel physics or second System controller."
      rationale:
        - "Selected G027/G032/G045 and S041/S044–53/S083–84; docs/gameplay-redesign/implementation/increment-18.md fixes scope and evidence. Under the approved parallel-work contract, runtime may follow 15 initial integration/targeted checks; full completion retains 14/15 verified prerequisites. Remote formation joins 16, not a silent dependency waiver."
        - "[ai] Extend existing ship/helm intent, per-axis ordinary AI, console/helm admission and ShipPhysics integration. Human direct input, assistance and delegated AI remain mutually exclusive intent writers. Mode switches preserve actual motion, paid resources and conditions. Ordinary propulsion consumes electrical energy; finite fuel belongs long-distance travel."
  - decision: redesign-movement-observed-relative-intent
    core:
      status: accepted
      confidence: confirmed
      title: Relative Assistance Uses Held Evidence and Local Authority
      summary: "Match Speed persists on the same measured contact's last observed speed, holds with stale feedback after loss and cancels on throttle/explicit toggle. Helm retains heading. Optional routes/formations use ordinary received intent and actual local capabilities, without perfect range/aspect holding or central fleet control."
      rationale:
        - "[ai] Store public handle and original sampled speed/tick as local intent, not a duplicate truth map. Unknown velocity is unavailable rather than zero; prediction/loss cannot read current actor motion. Reacquisition does not substitute a different contact. Existing collision and physical holds still constrain execution."
        - "[ai]16 requests/receipts distinguish sending, recipient acceptance and actual formation/readiness. Link loss preserves accepted onboard work under its policy, not unseen new orders. Human breakaway remains normal authority. Navigation publication does not engage autopilot or seize human Helm."
        - "S053 formation jumps use the best participating drive stats, with each member's own working drive capable of the jump type and actual authority/readiness/resource commitment. Shared scatter-then-gravity translation preserves actual relative offsets, without slot snapping, guaranteed clearance or carrying a disabled/no-drive hull. First supported profiles declare effective-stat combination and membership/interruption; neither weakest-drive tuning nor independent scatter can silently replace the selected contract."
  - decision: redesign-movement-dock-and-transit-conservation
    core:
      status: accepted
      confidence: confirmed
      title: Dock Separation and Configured Transit Preserve Physical Consequences
      summary: "Extend actual Dock/mating with visible equipment/state-dependent separation and supported emergency release; actual Tractor/Umbilical/services remain separate owners. Supported local jump and discrete transit consume real resources/fuel, use deterministic scatter-then-gravity-push arrival and preserve canonical transition phases."
      rationale:
        - "[ai] Delegated approach/manual takeover uses one existing Helm controller; physical release does not require rediscovering a held mate. New coupling still needs permitted evidence and actual geometry. No universal damage penalty or scripted checklist is implied."
        - "Local jumps require no universal receiving anchor and reset velocity in the local navigation frame. Inter-system drive accuracy/gravity and velocity/heading are explicit profiles. Static orbital bodies remain static. Researched portal/instant-kill alternatives are not automatically selected."
        - "[ai] Reuse actual Stock/resource grants, world transition/content binding and deterministic mint/RNG. Preparation, commitment and arrival retain payment/side-effect frontiers; interruption/restore cannot duplicate fuel, arrival or entities. Physical placement inspects actual bounds only for resolution, never hidden navigation advice."
  - decision: redesign-movement-authoring-and-continuation
    core:
      status: accepted
      confidence: confirmed
      title: Movement Extensions Are Authorable and Continuable
      summary: "Supported finite profiles and controls use existing accepted Workshop source/history/includes/Preview/Test, normal admitted Human/AI actions and immediate snapshot/digest integration. Whole-candidate owner/phase/clock/geometry/resource preflight precedes writes; initial source does not claim a verified playable exit."
      rationale:
        - "[ai] Actual assisted/direct, stale match, coupled/separating and paid transit checkpoints require fresh JSON bootstrap with at least 360 complete capture/digest comparisons and different-LocalShip peer proof. Shipped content, gameplay/movement comparisons, physical browser/native controls and 2/4/6/8-human workload/performance acceptance remain distinct."
        - "[ai] Per-engine intent presentation derives from this ship's canonical restored LastHelmInput (or NPC actuator input), the same source as the ordinary joystick fan-out. An ephemeral queue left by bootstrap must not overwrite restored intent during publication; restore must not create a second saved joystick state."

  - decision: movement-sustained-boost-existing-owner
    core:
      status: accepted
      confidence: confirmed
      title: Sustained Boost Uses the Existing Paid Drive
      summary: "Boost engagement is operator intent, not a universal timed burst. The existing sole Helm physics integrator applies only the exact authored Boost System's available, condition-scaled local work grant. Partial reserve permits engagement; exhaustion or thermal stop withholds actuation without inventing another duration or controller."
      rationale:
        - "[ai] Inspection found that actual physics already pays sustained boost from the energy reserve and tick_boost only projects that reserve. active_duration/recharge_duration are compatibility tuning fields unused by that execution path; they do not create a new timer. Preserve existing multipliers, reserve and thermal tuning."
        - "[ai] Retained engagement and current availability remain distinct. Offline/missing equipment cannot grant boost or debit its reserve; an operator can always release their own engaged intent. The existing per-System Boost AI emits the same normal SetBoost commands using the actual authored owner, including custom IDs."
        - "[ai] Phone hold controls must not require a full reserve before re-engagement. Report actual paid fraction and equipment availability separately from retained engagement. Targeted source/owner tests do not claim full increment 18 acceptance."

  - decision: movement-paid-dock-separation
    core:
      status: accepted
      confidence: confirmed
      title: Normal Dock Separation Holds When Equipment Cannot Work
      summary: "The existing DockControl clear destination is the sole retained separation progress. Each ordinary separating movement requires the actual installed Dock System's current source, Operation and local continuous work grant. Disabled, Offline or unpaid equipment holds its pose and clear destination until it can resume."
      rationale:
        - "[ai] Inspection found the undock branch preceded disabled checks and its returned pose bypassed payment when disabled. Close that actual consumer gap without resetting progress, inventing a timer or creating a second Helm controller. Existing approach ownership and exact mate constraint remain unchanged in this slice."
        - "[ai] Construct the clear point from canonical physical pose and the actual mating marker's outward direction. Continuing separation needs no new observation of its former mate. Actual Umbilical/services lose their ordinary docked-partner relation on release; they retain their existing interruption/conservation owners."
        - "[ai] Charge only the granted motion, with finite authored approach speed/clear distance and actual condition fraction. Derived feedback may report separation/progress; saved identity, clear geometry and physical pose remain existing owners. Emergency release is a future explicitly authored supported mechanism with consequences, never an implicit free normal-undock exception."
        - "[ai] Source cases must cover disabled/source/payment hold, paid resume and JSON continuation with exact physical/reserve state. No new runtime capability is claimed by this contract checkpoint."

  - decision: movement-dock-body-placement
    core:
      status: accepted
      confidence: confirmed
      title: Moving Dock Equipment Shares the Existing Physical Pose
      summary: "DockMating moves_body is explicit and defaults false. Mobile Dock profiles opt in; stationary berth/service equipment does not gain propulsion. A supported moving Dock on a nonship seeds the existing ShipPhysics pose owner without adding Ship, AI or another integrator."
      rationale:
        - "[ai] DockProbe and other accepted controlled moving equipment must preserve physical placement through the ordinary snapshot/digest path. Do not save a second Dock pose or rely on an unsaved Transform. Existing mobile Dock profiles migrate explicitly; passive berth markers/services remain intact."
        - "[ai] Releasing a stationary provider's existing coupling is distinct from powered clearance and may clear that relationship without applying a movement pose. Controlled body separation still requires accepted equipment, actual physical marker direction and paid operability; missing-config fixtures have no runtime bypass."

  - decision: movement-first-local-jump-actual-consumer
    core:
      status: accepted
      confidence: confirmed
      title: Local Jump Uses One Actual Drive and the Permitted Navigation Course
      summary: "The first optional TransitDrive component/System freezes the existing permitted own Navigation course on ordinary Begin, performs paid preparation, commits actual Stock fuel and Power atomically, and applies one deterministic physical arrival. It introduces no parallel course, fuel or motion owner."
      rationale:
        - "[ai] The drive Console explicitly receives the same typed Navigation view used by its Human operator. The one normal individual System AI consumes an explicit permitted transit request/directive plus that course and local phase/capability through a closed authored tree, emitting the same admitted Begin/Cancel. Mere waypoint availability never orders a jump; a bounded same-drive handled objective-id/revision frontier prevents alternating standing-request replay, and human-started preparation continues across delegation. Capacity is checked before admission, with no eviction/reuse/change of accepted keys; optional exact permitted request keys on normal Begin do not carry positions or duplicate World mission progression. AI emits only fresh visible requests after authored reading_ticks through existing per-System TreeRuntime reading, while a no-key manual Begin remains deliberate. The retention limit is a technical validation bound, not another capacity gameplay task. No private target or global waypoint lookup, new planner or second controller is permitted."
        - "[ai] Distinguish Idle, Preparing, Committed and completed arrival frontier. Current source, Operation and actual continuous grants advance preparation; unavailability holds. Begin while active refuses; Cancel affects only pre-commit work and refunds no performed energy. The existing per-ship drive map permits one active Preparing/Committed order; competing Begin refuses before work and candidate preflight rejects multiple active orders, preserving alternate-drive histories without another mutex or arrival writer. The order freezes its accepted profile/work/fuel requirement. Ready preparation automatically attempts a staged actual Local/System Stock claim plus discrete Power debit; both commit once or neither does. A failed commit retains a reported allowed waiting phase without double spending or re-scattering."
        - "[ai] One existing ShipPhysics placement resets local velocity once. Accepted goal/origin/date, paid progress and commit/arrival result persist through restore/LOD. Stable drive/order-keyed scatter precedes stable outward gravity displacement from explicit finite authored World/body arrival policy; visual radius/mass alone is not gravity. Normal own views report forecast/actual placement, and nonrepresentable/no valid placement refuses without promising collision-free arrival. No alternate inventory, fuel counter, duration engine or physics loop is created."
        - "[ai] First gravity sources use typed optional EntityConfig.arrival_gravity through the normal static World-row overrides/resolver, requiring an ordinary non-movable actor and finite unambiguous absolute placement. The first source set is base World static rows only: layered/additive and action/script gravity-bearing spawns refuse explicitly. Existing spawn-reference validation and the runtime SpawnEntity pre-mint guard cover resolved templates and computed overrides without a new body registry or lifecycle. Relative/random/conditional/movable sources refuse. Actual source pose and accepted policy must still agree at commitment; unsupported movement cannot use obsolete authored gravity. The same order privately retains bounded keyed scatter and original sorted body inputs with deterministic reconstruction and immutable provenance validation before restore writes; a committed receipt survives later source loss and grants no operator knowledge of those inputs."
        - "[ai] The optional reference hull carries finite real fuel with supported delivery/replenishment, accepted Workshop configuration and truthful phase/cancel HUD. Actual normal Human/AI, paid conservation, interruption/repeated-order, no-write and fresh JSON 360-step full capture/digest evidence remain required. Inter-system World content transitions and formation receipts/readiness are later extensions of the same owner, not completed by the LocalJump source slice."

  - decision: configured-transit-gravity-response
    core:
      status: accepted
      confidence: confirmed
      title: Existing Transit Uses the Accepted Drive Gravity Response
      summary: "The actual LocalJump profile adds finite nonnegative gravity_response, default 1. Existing placement multiplies each original static body exclusion radius by the frozen accepted drive response in wider arithmetic; collision and finite-placement admission remain separate."
      rationale:
        - "[ai] Default response is omitted from JSON to preserve unchanged original keyed scatter. Smaller response reduces gravity displacement; zero does not bypass physical colliders. Original body policies and dated evidence remain immutable, with no extra arrival state or RNG stream."
        - "[ai] Snapshot preflight recomputes arrival from accepted response/profile and actual static recipes. No-placement retains the existing waiting phase and cannot partially consume fuel or energy. Existing Workshop accepted-source/history fields edit the same supported profile."
        - "[ai] Optional gravity-hardened LocalJump Cruiser uses response 0.25 with existing System, finite fuel/energy/preparation/feeds/AI unchanged. Tuning is provisional. Native/continuation/authoring proof is required; this is neither formation nor inter-system completion."

  - decision: tracked-world-transit-consumer
    core:
      status: accepted
      confidence: confirmed
      title: First Sector Transit Uses Existing Anchored World Layers
      summary: "Closed authored destination IDs bind accepted supporting-world paths and finite arrival anchors in the existing unified anchored World space. The same actual Transit System/order owns preparation and paid handoff; tracked World layers own materialisation, scripts, origin, minting and content binding."
      rationale:
        - "[ai] Explicit drive destination domain and the permitted Navigation route view gate Human/ordinary AI admission. Commands never name arbitrary files, reveal private destination actors or let Scenario/HTN place a ship directly. No second universe, spatial identity, transport, content loader or background sector simulation is introduced."
        - "[ai] The existing layer queue is the sole pending load owner. Parse/content/placement refusal waits or refuses without half fuel commitment. Fixed-boundary actual arrival is once, at rest with heading retained, using the accepted destination, frozen drive profile and original static gravity inputs. Restore cannot mint or pay twice."
        - "[ai] Destination load preserves actual source actors, craft, crew, stocks, ordnance and obligations. First implementation leaves source layers resident; return reuses their live state and scripts. Subsequent explicit unloading must respect remaining actors/obligations. Own typed route/status/actual receipt joins continuing modes and planner without granting foreign knowledge."
        - "[ai] Actual departure/return, finite conservation, no-write, complete fresh JSON360 continuation, multiplayer symmetry and accepted Workshop authoring are required. Formation later uses actually received/acknowledged Comms orders and each member's ordinary equipment/authority. This contract alone is not an implementation or full increment18 exit."

  - decision: received-formation-intent-stages
    core:
      status: accepted
      confidence: confirmed
      title: FormUp Separates Comms Acceptance from Own Navigation and Helm Execution
      summary: "First FormUp carries a finite two-integer World-x/z slot, with the genuine heard sender as leader. Actual Comms reading/choice/outcomes express coordination acceptance; independently authorised Navigation selects an earned leader and own Helm explicitly engages or makes its ordinary AI decision."
      rationale:
        - "[ai] Human selects an earned own contact alias; AI requires uniquely matured independently observed identity/name and genuinely held faction/reference evidence. Private Broad source UUID maps cannot correlate a Comms sender. Missing/ambiguous evidence stays pending, and explicit supported Console feeds grant only genuinely heard suggestions."
        - "[ai] Navigation owns slot intent; Helm owns assistance/motion. Execute only from own current earned leader position/velocity, pause/report stale or absent evidence, preserve source/rating authority and manual breakaway. World-axis offset requires no hidden heading, snapping or guaranteed station keeping. No Comms/Scenario/planner foreign actuator write."
        - "Actual status distinguishes received, coordination acceptance, leader selection, awaiting Helm, executing, paused and broken away. Source learns stages only through real paid Comms reports; accepting a request proves no machinery or jump readiness. Formation travel later binds real acknowledgements and each member's own paid drive. Contract only, no runtime/exit evidence."

  - decision: current-transit-world-policy-binding
    core:
      status: accepted
      confidence: confirmed
      title: Actual Transit Retains Its Current Accepted World Policy Context
      summary: "One canonical TransitWorldBinding records Base or an accepted destination for actual drive-equipped ships. Successful physical World arrival alone changes it; local jumps use this current World and relevant static supporting recipes. It is policy/route context, not new spatial identity or physics/filter/lifetime ownership."
      rationale:
        - "[ai] Adopted with integrator agreement before runtime. Preparing/refused/cancelled work cannot overwrite context. Seed Base or an unambiguous accepted authored-layer mapping; refuse unsupported ambiguity. Existing EntityOriginLayer remains lifetime/script ownership, without reparenting flag chains or unload lists."
        - "[ai] Capture/digest and full no-write preflight bind context to accepted content/source and actual Transit records. Dormant prefetched masses are not physical global obstacles; actual body pose/visibility/removal/physics retain their owners. Actual departure, return and later local jump must prove destination/current-World scope including relevant static supporting worlds."


  - decision: first-navigation-world-route-selection
    core:
      status: accepted
      confidence: confirmed
      title: World Routes Reuse the Existing Paid Navigation Waypoint
      summary: "First World-route selection uses the existing paid Navigation waypoint at an exact permitted authored route anchor. A World-capable drive freezes the unique closed route ID, point and generation from its permitted Navigation reading; free courses remain local. No new waypoint owner or route command is introduced."
      rationale:
        - "[ai] Agreed with the integrator before implementation. The route must be present in the same permitted Navigation publication; a guessed private anchor cannot grant World travel. Ambiguous/shared anchor coordinates refuse with an actionable reason. Existing authored Reach-to-anchor Navigation policy can select the same course."
        - "[ai] Immutable route and static-body recipes derive at the existing materialisation boundary. The actual Transit owner retains current World context and paid work/arrival; private actors and file paths are not route UI data. Dormant closure checkpoint alone implements neither route operation nor sector travel."


  - decision: retained-transit-world-arrival-frontier
    core:
      status: accepted
      confidence: confirmed
      title: Retained Transit Receipts Keep Their Original World Scope
      summary: "Each accepted order freezes its original World context. One minimal latest successful World-arrival stamp remains in the existing ship Transit owner; it retains owner, closed route identity and actual arrival tick without another phase or payment state."
      rationale:
        - "[ai] Independent review identified that another drive or a later local order can leave older Arrived receipts behind. Validate those against their own immutable original/selected scope, never the ship's later current scope. Only the latest World-arrival frontier determines current context."
        - "[ai] With no successful World-arrival stamp, context must equal actual authored origin. A completed World arrival updates context and stamp together; earlier inactive receipts remain historical. Capture, fold and no-write preflight preserve and cross-check this causal frontier."


  - decision: formation-course-and-axis-demand-owners
    core:
      status: accepted
      confidence: confirmed
      title: Formation Reuses the Existing Navigation Course and Helm Axis Intent
      summary: "A Formation variant in the existing NavigationWaypoint retains the actual accepted Comms reference, earned public leader handle and dated measured slot cache. Each existing Helm axis can explicitly retain a follow demand bound to that semantic course generation; normal manual axis commands replace it."
      rationale:
        - "[ai] Integrator agreed before runtime. Comms acceptance is an available ordinary Navigation selector candidate, not a forced latest-request autopilot. A dedicated received-formation source/fact carries no mission-objective source score; existing authored selector priorities still decide. Human Navigation chooses a genuinely heard request and earned own alias through its own admitted paid command. AI correlates only a unique independently matured observed sender identity."
        - "[ai] Measurement refresh preserves the course generation; a different/cleared course invalidates prior assistance. Missing/stale permitted leader motion retains the same dated intent but suppresses execution and surfaces the reason. No private actor pose, hidden leader heading or source-UUID identity correlation can improve the sample."
        - "[ai] Human Helm engages each own axis through an explicit HUD action. Ordinary individual Helm AI makes its normal decision after the existing clearance handoff. The existing mechanical axis consumer and paid integrator remain the only actuator path; follow state is not a new AI, fleet controller or physics owner. Snapshot/digest/preflight extend existing course/axis definitions with actual reference, clock and ownership joins."


  - decision: formation-current-axis-inputs
    core:
      status: accepted
      confidence: confirmed
      title: Formation Assistance Uses Current Permitted Axis Inputs
      summary: "The existing paid axis resolver consumes a derived current-tick context, independently keyed by actual Helm System. Each context contains only its explicitly permitted Navigation generation and current earned measured slot/motion; it creates no canonical goal, controller, resource or physical-state copy."
      rationale:
        - "[ai] Integrator approved before runtime. Simulation rebuilds the context at the existing admitted Helm control boundary; Gameplay verifies its logical tick before the one physical integrator consumes it. Missing, stale, paused or generation-mismatched context yields a neutral or ordinary braking request under real actuator limits and inertia. Restoration never reuses a pre-restore grant/context."
        - "[ai] Human Helm explicitly selects each own axis through the existing HUD. Manual axis/mode commands replace following normally. Ordinary individual AI may select the same retained demand only when its normal cleared Navigation travel is the chosen plan, preserving combat, docking and avoidance priorities. No hidden leader pose or heading enters the context."

  - decision: helm-explicit-navigation-feed-follow
    core:
      status: accepted
      confidence: confirmed
      title: Explicit Navigation Feeds Share Their Earned Dated Motion
      summary: "An explicitly permitted Navigation publication shares its earned dated Formation motion with Helm; each actual axis chooses whether to follow through its existing retained intent and paid integrator."
      rationale:
        - "[ai] Approved before the consuming boundary correction: same canonical intent and semantic generation, neither published nor canonical course paused, and the original published sample within its actual producing instrument's configured freshness. Another instrument's separate alias must not be rediscovered; no private leader pose or heading is consulted. A newer source observation cannot renew the age of an older shared sample."
        - "[ai] Current-tick inputs are derived and cleared at restore. The existing held AI motion plan retains only its selected semantic generation through its existing continuation. Ordinary travel verbs may request following; authored combat/pass, docking, bearing and hazard decisions retain priority. Manual input replaces only that axis's retained demand."
        - "[ai] HUD availability is a pure projection independent of the mechanical input cache. Existing held-publication restoration may preserve exact positive availability at the saved/current-or-previous fixed publication frontier; empty held affordances remain withheld. It cannot restore a paid input context, renew a sample or grant machinery control. No new canonical clock is introduced."

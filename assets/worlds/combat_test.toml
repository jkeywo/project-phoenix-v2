# Wave 8 (final) — 1x Harrow patrol cruiser, t=315. The Ironveil-class hull, and
# the one wave whose template carries a Patrol entry of its own. The override
# stands `patrol-ironveil` DOWN rather than re-pointing or de-prioritising it:
# `directive_kind = "None"` leaves nothing for the Helm to serve, and clearing
# the two Patrol-owned fields with it — `directive_anchors = []`,
# `directive_loop = false` — is what frees `ironveil_patrol_a`/`_b` from this
# world's anchor table AND keeps the merge legal (see the anchors section
# above). `base_priority = 0` and the empty `modifiers` keep it out of the
# scored pool as well, so it cannot lead a pool every consumer reads the FIRST
# entry of. There is no picket line for it to hold any more, and it arrives
# committed to the assault like every other wave.
[[trigger]]
condition = "on_timer"
after_secs = 315.0

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_patrol.toml"
  name          = "wave_8"
  anchor        = "enemy_e_far"
  groups        = ["hostiles", "wave_8"]
  overrides = { weapons_console = { radar = { range = 200.0, shows = ["player", "ship", "station"], selects = ["ship", "station"] } }, behaviour = { doctrine = [
    { id = "patrol-ironveil", directive_kind = "None", directive_anchors = [], directive_loop = false, base_priority = 0.0, modifiers = [] },
    { id = "assault-starbase", directive_kind = "Destroy", directive_target = "world.entity.starbase_alpha.name",
      base_priority = 50.0, target_speed = 0.9, maintain_range = 25.0,
      zero_gates = [{ condition = "not_attacked" }] },
    { id = "close-on-starbase", directive_kind = "Reach", directive_anchor = "harrow_assault_point",
      base_priority = 35.0, target_speed = 0.9 },
  ] } }

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_cruiser.toml"
  name          = "wave_8_bonus"
  position      = [1400.0, 0.0, -40.0]
  groups        = ["hostiles", "wave_8"]
  when          = "counter(ship_power) >= 100"
  overrides = { weapons_console = { radar = { range = 200.0, shows = ["player", "ship", "station"], selects = ["ship", "station"] } }, behaviour = { doctrine = [
    { id = "assault-starbase", directive_kind = "Destroy", directive_target = "world.entity.starbase_alpha.name",
      base_priority = 50.0, target_speed = 0.9, maintain_range = 25.0,
      zero_gates = [{ condition = "not_attacked" }] },
    { id = "close-on-starbase", directive_kind = "Reach", directive_anchor = "harrow_assault_point",

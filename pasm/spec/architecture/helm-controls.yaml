entities:
  - component: helm-collision-physics
    core:
      status: implemented
      confidence: confirmed
      title: Helm Collision Physics
      summary: Current authoritative planar physics applies thrust, yaw, lateral movement, collision response, and collision damage before the proposed shared 3D motion planner exists.
    architecture:
      kind: physics-service
      authority: authoritative
      reads: [last-helm-input-state, ship-modifier-state]
      writes: [authoritative-ship-motion-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/physics.rs, src/ship_plugin.rs, src/server_app.rs]
      symbols: [compute_physics]
      tests: [cargo test]

  - component: helm-console-interface
    core:
      status: implemented
      confidence: confirmed
      title: Helm Console Interface
      summary: Player-facing helm surface for steering, thrust, lateral thrust, impulse, boost, and radar display.
      rationale:
        - Helm input is issued from the phone client as ControlSystem messages, not by mutating simulation state locally.
        - The same interface also renders engine, boost, impulse, and lateral-thrust status from replicated blackboards.
    architecture:
      kind: client-interface
      authority: non-authoritative
      owns:
        - helm-ui-state
      reads:
        - helm-status-blackboard-state
        - helm-lateral-thrust-blackboard-state
        - helm-engine-blackboard-state
      writes:
        - helm-ui-state
      sends:
        - helm-input-command
        - lateral-thrust-command
        - start-impulse-charge-command
        - cancel-impulse-command
        - toggle-boost-command
        - set-boost-command
      depends_on:
        - client-network-interface
      runs_in:
        - phone-browser-runtime
    implementation:
      status: declared
      paths:
        - gui/action-map.js
        - gui/console-state.js
        - gui/battleship/helm.html
        - gui/cruiser/helm.html
        - gui/destroyer/helm.html

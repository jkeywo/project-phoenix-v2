entities:
  - component: client-console-registry
    core:
      status: implemented
      confidence: confirmed
      title: Client Console Mount Plan
      summary: Pure-JavaScript mount plan deriving the phone console panels from the server-supplied ship stations — canonical station-id DOM naming with the single tactical alias, console URL resolution, section switching over the mounted stations, and per-console payload builders whose shapes are documented as typedefs; the static console registry it replaced was deleted in issue 827.
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [session-station-ownership-state, ship-station-system-topology-state, client-system-console-family-replica]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/mount-plan.js, gui/content-switcher.js, gui/console-state.js, gui/console-resolver.js]
      tests: [npx vitest run]

  - state: client-system-console-family-replica
    core:
      status: partially-implemented
      confidence: confirmed
      title: Client System Console Family Replica
      summary: Read-only phone-client copy of the selected ship's System instance id to Console Family projection. The #1251 tracer carries Command and Dock; absence means an unmigrated descriptor until issue #1252, never a new source of ownership or command authority.
    architecture:
      classification: replicated
      owner: system-kind-registry
      derived_from: [system-console-family-projection-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/lobby/server.rs, gui/sim-state.js]
      tests: [cargo test, npx vitest run]

  - component: client-console-family-router
    core:
      status: partially-implemented
      confidence: confirmed
      title: Client Console Family Router
      summary: Selects console payload builders and BlackboardUpdate dirtiness from authoritative per-System Console Family metadata. Command builder selection plus Dock-to-Helm refresh, authored-id blackboard lookup and action targeting are the #1251 tracer; exact/prefix inference remains only for unmigrated families and the station-name fallback only before Welcome, with both removed by issue #1252.
      rationale:
        - "A Console Family describes presentation only. Station topology still decides which surface owns a System, and SystemId still targets command authority."
        - "The temporary matcher runs only when an instance has no projected descriptor entry; it must not learn new Command or Dock spellings, because that would hide missing authoritative metadata."
        - "Welcome establishes the metadata boundary even when its map is empty: after that point a missing Command descriptor cannot be replaced by the canonical Station-name builder fallback."
    architecture:
      kind: presentation-router
      authority: non-authoritative
      reads: [client-system-console-family-replica, ship-station-system-topology-state, ship-system-blackboards-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/sim-state.js, gui/console-state.js, gui/dirty-consoles.js, gui/action-map.js, gui/destroyer/helm.console.js, gui/destroyer/helm.html, client.html]
      tests: [npx vitest run]

  - component: client-simulation-state-store
    core:
      status: implemented
      confidence: confirmed
      title: Client Simulation State Store
      summary: Pure-JavaScript receiver that folds authoritative server messages into local presentation state and builds per-console iframe payloads; the payload contracts are documented as JSDoc typedefs beside each builder (issue 827).
    architecture:
      kind: client-state-store
      authority: non-authoritative
      owns: [client-presentation-state]
      reads: [simulation-state-replica, ship-system-blackboards-state]
      produces: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/sim-state.js, gui/console-state.js, gui/lobby-state.js]
      tests: [npx vitest run]

  - state: client-presentation-state
    core:
      status: implemented
      confidence: confirmed
      title: Client Presentation State
      summary: Local non-authoritative console, lobby, connection, and panel data derived from host messages; it can be discarded and reconstructed on reconnect.
    architecture:
      classification: local
      owner: client-simulation-state-store
      writers: [client-simulation-state-store]
    implementation:
      status: declared
      paths: [gui/sim-state.js, gui/console-state.js, gui/lobby-state.js]

  - component: client-action-dispatcher
    core:
      status: implemented
      confidence: confirmed
      title: Client Action Dispatcher
      summary: Maps console UI actions to typed client messages and applies only optimistic local presentation mutations where the interface requires them.
    architecture:
      kind: client-command-adapter
      authority: non-authoritative
      reads: [client-presentation-state]
      sends: [system-control-command]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/action-map.js, gui/sim-state.js]
      tests: [npx vitest run]

  - component: client-access-and-tab-shell
    core:
      status: implemented
      confidence: confirmed
      title: Client Access Shell
      summary: Uses authoritative station ownership and the selected ship configuration to show the player's single console (one human = one station; the active console is derived from station ownership — the tab bar, swipe switching, and their helper modules were deleted in issue 827), plus the lobby station roster, responsive phone layout, connection status, and reconnection state. Message routing, roster folding, lobby view selection, and coordination-popup normalisation are extracted pure modules; client.html keeps only bootstrap and DOM glue.
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [session-station-ownership-state, client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [client.html, gui/client-router.js, gui/station-roster.js, gui/lobby-view.js, gui/coordination-popup.js, gui/mount-plan.js, gui/connection-manager.js, assets/phone_border]
      tests: [npx vitest run, tests/smoke]

  - component: client-settings-and-help-surface
    core:
      status: implemented
      confidence: confirmed
      title: Client Settings, Help, and Accessibility Surface
      summary: Local settings, volume, control help, and inline panel assistance; these change client presentation only and do not grant authority or alter simulation state.
    architecture:
      kind: client-preferences
      authority: local
      reads: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/settings-panel.js, gui/help-panel.js]
      tests: [npx vitest run]

  - component: ship-manual-content-builder
    core:
      status: implemented
      confidence: confirmed
      title: Ship Manual Content Builder
      summary: Reads ship-authored per-station overview text and the authoritative configured topology to build a ship-specific player manual source.
    architecture:
      kind: documentation-builder
      authority: authoritative
      owns: [ship-authored-station-help-state]
      reads: [ship-station-system-topology-state]
      produces: [ship-authored-station-help-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/manual.rs, src/ship/config.rs]
      tests: [cargo test]

  - state: ship-authored-station-help-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship-Authored Station Help State
      summary: Per-station authored overview text (`[[station]] manual_overview`) explaining how to play this ship's version of each station — literal authored prose, the sanctioned authored-content exception, not a strings id.
    architecture:
      classification: authoritative
      owner: ship-manual-content-builder
      writers: [ship-manual-content-builder]
    implementation:
      status: declared
      paths: [src/ship/config.rs, assets/entities/alliance_cruiser.toml, assets/entities/alliance_courier.toml, assets/entities/alliance_destroyer.toml, assets/entities/alliance_battleship.toml]
      # `manual_overview` is a field on StationConfig, not a dedicated type —
      # the closest real symbol is the struct that carries it.
      symbols: [StationConfig]

  - component: system-manual-section-provider
    core:
      status: implemented
      confidence: confirmed
      title: System Manual Section Provider
      summary: Per-system-kind documentation provider registry that derives structured manual content (numeric metrics, non-numeric capability value-codes, and machine codes the client maps to string ids) from the configured system, its vessel-specific values, and the station-rating automation mapping. Issue #773 completes the coverage begun by #772 (Shields): every configured system kind that carries vessel-specific config has a provider — weapons (phaser/blaster banks, torpedo tubes + magazine), tactical/sensor radar, sensors, power reactor + battery, repair, comms, and helm (whose vertical movement mode rides the capability list). Kinds with no numeric config (captain, red_alert, viewscreen, ownerless capabilities) stay overview-only rather than emitting a fabricated section.
    architecture:
      kind: documentation-provider
      authority: derived
      reads: [ship-station-system-topology-state]
      produces: [system-manual-section-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/manual.rs, src/ship/rating.rs, src/lobby/server.rs]
      tests: [cargo test, npx vitest run]

  - state: system-manual-section-state
    core:
      status: implemented
      confidence: confirmed
      title: System Manual Section State
      summary: Generated player-facing documentation sections for the systems configured on the current ship — numeric metrics plus non-numeric capability value-codes and machine codes only, never composed English. The capability list (added in #773) carries enum-valued capabilities such as the helm vertical movement mode as machine value-codes the client resolves through string ids.
    architecture:
      classification: derived
      owner: system-manual-section-provider
      writers: [system-manual-section-provider]
    implementation:
      status: declared
      paths: [src/ship/manual.rs]

  - component: station-manual-aggregator
    core:
      status: implemented
      confidence: confirmed
      title: Station Manual Aggregator
      summary: Combines each authored station's ship-authored overview with the generated manual sections for the systems it owns, at the same selected-ship / Welcome seam that already flows station data to the client.
    architecture:
      kind: documentation-aggregator
      authority: derived
      owns: [ship-manual-state]
      reads: [ship-authored-station-help-state, system-manual-section-state, ship-station-system-topology-state]
      produces: [ship-manual-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/manual.rs, src/lobby/server.rs]
      tests: [cargo test]

  - state: ship-manual-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Manual State
      summary: Derived ship-specific manual with one station section per authored station, replicated read-only via the dedicated `ServerMessage::ShipManual` wire variant.
    architecture:
      classification: derived
      owner: station-manual-aggregator
      writers: [station-manual-aggregator]
      replicas: [ship-manual-replica]
    implementation:
      status: declared
      paths: [src/ship/manual.rs, src/lobby/server.rs, src/core/messages.rs, src/core/codec.rs]
      tests: [cargo test]

  - state: ship-manual-replica
    core:
      status: implemented
      confidence: confirmed
      title: Ship Manual Replica
      summary: Phone-client copy of the current ship manual, stored as read-only presentation state and used only for player-facing reading — never mutated and never a source of authority.
    architecture:
      classification: replicated
      owner: station-manual-aggregator
      derived_from: [ship-manual-state]
    implementation:
      status: declared
      paths: [gui/sim-state.js]
      tests: [npx vitest run]

  - component: client-ship-manual-surface
    core:
      status: implemented
      confidence: confirmed
      title: Client Ship Manual Surface
      summary: Read-only client manual within the phone Settings menu, with tabs for every authored station and vessel-specific generated system sections. The client-only Station Help tab presents the held station's static controls reference; neither documentation surface sends or dispatches.
    architecture:
      kind: client-documentation-surface
      authority: non-authoritative
      reads: [ship-manual-replica, client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/manual-panel.js, client.html, assets/strings/strings.csv]
      tests: [npx vitest run]

  - component: client-station-rating-control
    core:
      status: implemented
      confidence: confirmed
      title: Client Station Rating Control
      summary: Non-authoritative station-holder control within the settings overlay that requests a selected authored rating and presents the host-replicated active rating.
    architecture:
      kind: client-command-adapter
      authority: non-authoritative
      reads: [client-presentation-state, station-rating-replica, session-station-ownership-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/settings-panel.js, gui/sim-state.js]
      messages: [SetStationRating, RatingChanged]
      tests: [npx vitest run]

  - component: client-mid-round-station-handoff
    core:
      status: implemented
      confidence: confirmed
      title: Client Mid-Round Station Handoff
      summary: Client presentation that labels the existing in-progress readiness hand-off as Take Station after a player claims an available station, while retaining Ready for the lobby, and confirms an in-round station release before returning control to Backfill.
    architecture:
      kind: client-command-adapter
      authority: non-authoritative
      reads: [client-presentation-state, lobby-session-replica, system-control-source-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [client.html, gui/lobby-view.js, gui/client-router.js, assets/strings/strings.csv]
      messages: [SelectStation, ReleaseStation, SetReady]
      tests: [npx vitest run]

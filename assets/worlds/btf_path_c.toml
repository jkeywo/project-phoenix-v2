# btf_path_c.toml — Soldier branch: Attack on Ironveil
# Loaded when the crew attacks Ironveil (root world trigger: on_attacked Ironveil).

# ── Triggers ──────────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity    = "Ironveil"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-harrow-orders"
  text      = "Decrypted Harrow orders recovered: Ashrender is the weapon platform."
  mandatory = false

# ── Comms templates ───────────────────────────────────────────────────────────

[[comms]]
from    = "_self"
trigger = "on_world_loaded"
message = "TACTICAL ALERT — I.V. Ironveil has opened fire. Science is tracking hull frequencies. Recommend Tactical tune shield harmonics to counter gamma-frequency phaser banks."

[[comms]]
from    = "_self"
trigger = "on_destroyed"
entity  = "Ironveil"
message = "INTERNAL REPORT — DECRYPTED SIGNAL INTERCEPT from I.V. Ironveil wreckage: HARROW OPERATIONAL ORDER HK-7 CONFIRMED. CODENAME: APHELION PROTOCOL. Authorised by High Executor Veth Harrow, countersigned Archivist Kallas. PRIMARY TARGET: Axiom Station (coordinates attached). SECONDARY TARGET: Kaleth Prime — atmospheric saturation required as territorial demonstration. ASHRENDER CONFIRMED ON STATION. WEAPON CHARGE: PROCEEDING ON SCHEDULE. NOTE: negotiator extraction complete. Varen is aboard Ashrender. — END INTERCEPT."

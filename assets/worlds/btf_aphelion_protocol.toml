# The Aphelion Protocol ΓÇö Finale
#
# Loaded when Ironveil is destroyed OR after the 600 s fallback timer.
# The Kobayashi Maru: two possible responses, both end with the ship destroyed.
# The choice is between saving people now (Shield Containment) and potentially
# saving more later (Fight and Broadcast).
#
# Option 1 ΓÇö Shield Containment (always available):
#   Engineering routes all power to shields; Helm positions Ardent between
#   Ashrender and the station; Science tunes shields to Ashrender's resonance
#   frequency. Ardent absorbs the discharge and is destroyed. Station saved.
#
# Option 2 ΓÇö Fight and Broadcast (unlocked by completing a path):
#   Ardent holds off escalating Harrow reinforcement waves while a contact
#   transmits something that may shape the war to come. The longer the crew
#   survives, the better the outcome. Ardent is eventually destroyed.
#   What is being broadcast depends on which path the crew chose:
#     Path A (path_a_chosen): Dr. Sol Varen transmits a peace record to
#       Alliance Command ΓÇö more systems receive it the longer Ardent holds.
#     Path B (path_b_chosen): Dr. Myst broadcasts resonance data that will
#       degrade the weapon's effectiveness ΓÇö fewer casualties in the war.
#     Path C (path_c_chosen): Ardent itself broadcasts the Harrow manifest
#       on open channels ΓÇö more factions receive the evidence, narrowing
#       Harrow's political cover for starting the war.
#
# Broadcast tier flags (set as waves are cleared):
#   broadcast_tier_1    Wave 1 cleared (minimal reach)
#   broadcast_tier_2    Wave 2 cleared (significant reach)
#   broadcast_tier_3    Wave 3 cleared (maximum reach ΓÇö rare)
#
# Requires: Draft 10 (Region entities) for radiation zone spawn.
#           Schema additions: spawn_entity action, on_all_destroyed condition,
#           on_player_destroyed condition, flag-gated triggers.

preload = [
    "assets/entities/region_radiation_zone.toml",
    "assets/entities/ship_harrow_patrol.toml",
    "assets/entities/ship_harrow_warhawk.toml",
]

# ΓöÇΓöÇ SPAWN RADIATION ZONE CENTRED ON ASHRENDER ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[spawn]]
entity = "assets/entities/region_radiation_zone.toml"
position = [620.0, 0.0, -380.0]
name = "aphelion_radiation_zone"


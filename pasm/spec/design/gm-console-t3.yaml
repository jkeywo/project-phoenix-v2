      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-t3-eligible-beats, gm-t3-idle-npc-advisory, gm-milestone-facilitation-assistance]
      runs_in: [host-browser-runtime, headless-runtime]

manual_overview = "You command the destroyer. Set the viewscreen, call Red Alert, and direct a four-seat crew through the fight. The destroyer is built to hit hard and turn fast, so keep Helm and Tactical coordinated and call your shots early. Simplified rating hands Red Alert to the ship's AI."


  - component: helm-impulse-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Impulse AI Operator
      summary: Per-axis impulse decide system whose stateless policy resolves the impulse-channel engage_impulse mode verb to decide whether the impulse manoeuvre is PERMITTED this tick; the host then applies the authored doctrine use_impulse and decide_impulse geometry, emitting an admitted StartImpulseCharge/CancelImpulse only on a genuine engage/cancel transition.
      rationale:
        - "Issue #780 moved the ACTUATION DECISION onto the authored #775 policy spine while preserving the pre-#780 baseline exactly. HelmImpulseAiPolicy (attached at spawn from [helm_console.impulse_ai]) resolves the impulse channel to the engage_impulse mode verb over a fact snapshot seeded from the shared hazard surface and availability (seed_helm_actuator_facts: impulse_available/boost_available). A hold resolution emits nothing."
        - "Issue #885 (8555e336) deleted the default_impulse_ai_config synthesiser that used to fill an unauthored block (an unconditional permit rule). Strict AI-declaration mode is now the default in EntityConfig::from_toml, so an undeclared block is a LOAD ERROR rather than an invented policy, and every shipped hull authors the block explicitly."
        - "Availability + manoeuvre policy (AC6): impulse capability is the presence of ImpulseConfigResource — no config, no emit. The engage-vs-cancel decision itself stays host-side (decide_impulse geometry over the radar-gated visible view) and the authored doctrine use_impulse veto is unchanged, so the policy verb is an additional authored gate layered on top."
        - "Runs on the one shared AI decision cadence (AGENTS.md #7; ai_tick_ready — see ai-helm-tick-cadence); emits through the shared validate_and_admit seam like its siblings (AGENTS.md #6). Full removal of the residual hardcoded decision is the coordinated tail #794."
        - "Issue #792 CONTENT CONSTRAINT, discovered on the first hull that holds station inside its own drive's cruise window: the impulse autopilot HARD-OVERRIDES commanded throttle, so a doctrine that commands a dead stop at an authored radius inside impulse_engage_distance is simply flown through its own hold. The Harrow warhawk commanded a stop at 180 units and was carried to 22. The fix is authored, not host-side — [helm_console.impulse_ai] idle = true holds the drive off on the hull's own fine-system policy — which is what the hull's own authored block is for; before #885 the same statement was made by overriding the #780 synthesiser's unconditional permit, and since #885 the block is authored either way. Any future hull whose held radius falls inside impulse_engage_distance needs the same declaration; the symptom is a station-keeping doctrine that appears to work in the pure planner and closes to knife range in the live sim."
    architecture:

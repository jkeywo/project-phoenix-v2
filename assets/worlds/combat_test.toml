  [[trigger.action]]
  type = "complete_objective"
  id   = "obj-destroy-wave-7"

  [[trigger.action]]
  type = "increment_flag"
  name = "mission_threat_remaining"
  by   = -1

[[trigger]]
condition = "on_all_destroyed"

    // -- Dynamic console mounting (Module H / issue #621) ----------------------
    // Called after a Welcome message updates state.shipStations.
    // Creates <section id="{sectionId}" class="console-section"> +
    // <iframe id="{iframeId}"> for each station the ship has, using
    // resolveConsoleUrl() to determine the iframe src.
    // Stations not present on this ship have no DOM elements, keeping the DOM
    // minimal and matching only what the current ship configuration provides.
    function mountConsoles(shipStations) {
      const container = $('console-container');
      if (!container) return;

      // Remove all previously-mounted console sections (identified by class),
      // but leave the lobby-ui, tab-bar and help-area siblings untouched.
      const existing = container.querySelectorAll('.console-section');
      for (const el of existing) el.remove();

      const stations = (shipStations && shipStations.stations) || [];
      const registry = window.CONSOLE_REGISTRY || {};

      for (const st of stations) {
        const stationId = st.id;
        if (!stationId) continue;

        // Derive the section/iframe ids: prefer the REGISTRY entry so we stay
        // consistent with content-switcher.js; fall back to the default scheme.
        const entry = registry[stationId];
        const sectionId = entry ? entry.sectionId : (stationId + '-ui');
        const iframeId  = entry ? entry.iframeId  : (stationId + '-iframe');

        const url = (typeof window.resolveConsoleUrl === 'function')
          ? window.resolveConsoleUrl(shipStations, stationId)
          : (st.console || null);
        if (!url) continue;

        const section = document.createElement('section');
        section.id = sectionId;
        section.className = 'console-section';

        const iframe = document.createElement('iframe');
        iframe.id = iframeId;
        iframe.src = url;
        iframe.title = st.name || stationId;
        iframe.allowFullscreen = true;

        section.appendChild(iframe);
        container.appendChild(section);

        // Attach load listener so the iframe re-pushes state after load/reload.
        _attachIframeLoadListener(iframe, stationId);
      }
    }

    // -- Console action postMessage bridge (issue #422) ------------------------
    // All iframe consoles send {type:'console_action', payload:json} via
    // postMessage.  Dispatch is table-driven via gui/action-map.js (issue #455).
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'console_action') return;
      let action;
      try { action = JSON.parse(event.data.payload); } catch (_) { return; }
      if (!action || !action.action) return;
      if (typeof window.dispatchConsoleAction === 'function') {
        window.dispatchConsoleAction(action, send, (patch) => Object.assign(state, patch));
        return;
      }
      // Fallback for the rare race window before module scripts load.
      // Only covers set_sensors_target (mutates local state); other actions
      // are silently deferred (non-critical � they arrive after module load).
      if (action.action === 'set_sensors_target' && action.uuid) {
        state.sensorsTarget = action.uuid;
        send('SetScienceTarget', { uuid: action.uuid });
      } else if (action.action === 'set_navigation_waypoint'
          && Number.isFinite(action.x)
          && Number.isFinite(action.z)) {
        send('SetNavigationWaypoint', { x: action.x, z: action.z });
      } else if (action.action === 'clear_navigation_waypoint') {
        send('ClearNavigationWaypoint');
      }
    });

    // -- Event wiring --------------------------------------------

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        sessionStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    // Engage button, view selector, Red Alert button, and helm joystick all
    // live in the per-console iframe pages (gui/*-console.html); the old
    // Bevy WASM client console UIs (#47�#49) were retired with the pure-JS
    // client migration.

    // Orientation watching (resize + orientationchange ? recompute the
    // singleton and rerender so the tab bar flips) lives in
    // gui/device-orientation.js, which owns window.currentOrientation().

    // -- Swipe to switch console tabs (when 2+ consoles assigned) -------
    (function initSwipe() {
      const root = document.body;
      let startX = 0, startY = 0, startT = 0, swiping = false, swipeCommitted = false;

      root.addEventListener('touchstart', e => {
        // Block swipe from buttons (tab bar, lobby buttons, etc.) so a
        // tap-to-press isn't misinterpreted as the start of a gesture.
        if (e.target.closest('button, [role="button"]')) return;
        // Block swipe from the bottom portion of the screen where the
        // virtual thumbstick joystick lives (~200px pad at the bottom).
        const touchY = e.touches[0].clientY;
        const viewportH = window.innerHeight;
        if (touchY > viewportH * 0.65) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startT = performance.now();
        swiping = true;
        swipeCommitted = false;
      }, { passive: true });

      // Non-passive so we can preventDefault() once the gesture is clearly
      // horizontal, preventing the browser from treating it as a scroll.
      root.addEventListener('touchmove', e => {
        if (!swiping) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
          swipeCommitted = true;
          e.preventDefault();
        }
      }, { passive: false });

      root.addEventListener('touchend', e => {
        if (!swiping) return;
        swiping = false;
        if (!swipeCommitted) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = performance.now() - startT;
        if (dt > 600) return;
        if (Math.abs(dx) < 60) return;
        if (Math.abs(dy) > Math.abs(dx) * 0.6) return;
        const mine = myConsoles(state);
        if (mine.length < 2 || state.phase !== 'InProgress') return;
        const idx = Math.max(0, mine.indexOf(activeConsole));
        const next = (dx < 0)
          ? (idx - 1 + mine.length) % mine.length
          : (idx + 1) % mine.length;
        // setActiveConsole() is the single source of truth � also called by
        // the tab-bar onPress handler (issue #441) and the render() reconciler.
        setActiveConsole(mine[next]);
        scheduleRender();
      }, { passive: true });
    })();

    // -- Swipe relay for console iframes --------------------------
    // Console UIs run in iframes; touch events inside them don't reach the
    // body-level listeners above. After each iframe loads we inject a tiny
    // detector that posts SwipeConsole messages back to this window.
    const SWIPE_RELAY_CODE = `(function(){
      if(window.__swipeRelayInstalled)return;
      window.__swipeRelayInstalled=true;
      var sx,sy,st,sw=false,sc=false;
      document.addEventListener('touchstart',function(e){
        if(e.target.closest('button,[role="button"],input,select,textarea'))return;
        var t=e.touches[0];
        if(t.clientY>window.innerHeight*0.65)return;
        sx=t.clientX;sy=t.clientY;st=performance.now();sw=true;sc=false;
      },{passive:true});
      document.addEventListener('touchmove',function(e){
        if(!sw)return;
        var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
        if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy)){sc=true;e.preventDefault();}
      },{passive:false});
      document.addEventListener('touchend',function(e){
        if(!sw)return;sw=false;if(!sc)return;
        var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
        if(performance.now()-st>600||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6)return;
        window.parent.postMessage({type:'SwipeConsole',direction:dx<0?'left':'right'},'*');
      },{passive:true});
    })();`;

    function injectSwipeRelay(iframeEl) {
      try {
        const doc = iframeEl && iframeEl.contentDocument;
        if (!doc || iframeEl.contentWindow.__swipeRelayInstalled) return;
        const s = doc.createElement('script');
        s.textContent = SWIPE_RELAY_CODE;
        (doc.head || doc.body || doc.documentElement).appendChild(s);
      } catch (_) {}
    }

    // Handle SwipeConsole messages posted by the injected relay.
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'SwipeConsole') return;
      const mine = myConsoles(state);
      if (mine.length < 2 || state.phase !== 'InProgress') return;
      const idx = Math.max(0, mine.indexOf(activeConsole));
      const next = (e.data.direction === 'left')
        ? (idx - 1 + mine.length) % mine.length
        : (idx + 1) % mine.length;
      setActiveConsole(mine[next]);
      scheduleRender();
    });

    // -- Incoming message handler --------------------------------

    function handleMessage(msg) {
      // JS state modules (issue #460) � every inbound ServerMessage is applied
      // to the pure state modules first; they are the source of truth that the
      // inline `state` object mirrors below. Guards cover the brief window
      // before the module scripts have executed.
      if (window.lobbyState)      window.lobbyState.apply(msg);
      if (window.simState)        window.simState.apply(msg);
      if (window.commsState)      window.commsState.apply(msg);
      // Mirror objectives from simState (handles ObjectiveSummary / CommsState internally).
      if (window.simState) state.objectives = window.simState.objectives || [];
      switch (msg.type) {
        case 'Welcome':
          if (window.lobbyState) {
            state.phase      = window.lobbyState.phase;
            state.players    = window.lobbyState.players;
            state.shipStations = window.lobbyState.shipStations;
          } else {
            state.phase   = msg.data.state.phase;
            state.shipStations = msg.data.ship_stations || { stations: [] };
            state.players = msg.data.state.players.map(p => ({ ...p }));
          }
          // Mount console sections dynamically from ship_stations (Module H).
          // mountConsoles() creates <section>+<iframe> for each station the
          // ship carries and attaches load listeners — replacing the old static
          // HTML sections that were hardcoded for every possible console.
          mountConsoles(state.shipStations);
          if (window.simState) {
            // Share the module's entity array so in-place SimState position
            // updates and Entity/AsteroidSpawned appends flow through, and
            // pick up the Welcome repair-team pre-seed.
            state.asteroids   = window.simState.world.entities;
            state.repairTeams = window.simState.repairTeams;
            state.consoleHull = window.simState.consoleHull;
            // Radar ranges + arc configs from server ship_config (data-driven).
            state.weaponsRadarRange = window.simState.weaponsRadarRange;
            state.helmRadarRange    = window.simState.helmRadarRange;
            state.sensorsRadarRange = window.simState.sensorsRadarRange;
            state.tacticalRadarShows   = window.simState.tacticalRadarShows;
            state.tacticalRadarSelects = window.simState.tacticalRadarSelects;
            state.sensorsRadarShows    = window.simState.sensorsRadarShows;
            state.sensorsRadarSelects  = window.simState.sensorsRadarSelects;
            // Navigation chart filter inputs � the Navigation builder has a
            // two-stage filter (outer entity filter on `navChartShows`, then
            // the inner `buildBlips` filter), so omitting these silently
            // drops every non-objective entity from the nav chart.
            state.navChartShows        = window.simState.navChartShows;
            state.navChartSelects      = window.simState.navChartSelects;
            state.navChartRange        = window.simState.navChartRange;
            state.phaserArcConfigs  = window.simState.phaserArcConfigs;
            state.torpedoArcConfigs = window.simState.torpedoArcConfigs;
            state.navigationWaypoint = window.simState.navigationWaypoint;
            state.controlSources = window.simState.controlSources || {};
            state.stationRatings = window.simState.stationRatings || {};
            state.stationSystems = window.simState.stationSystems || {};
            // Live blackboard reference � simState.blackboards is mutated in-place
            // each tick so this reference assignment keeps state.blackboards current.
            state.blackboards = window.simState.blackboards;
            // Push the pre-seeded repair teams so the Repair console renders its
            // rows immediately on (re)connect, before the first RepairState
            // broadcast (no-op unless Repair is the active console).
            pushRepairConsoleState();
          }

          // Inject ship theme CSS from Welcome ship_css (Fix: Module F).
          const shipCss = (msg.data.ship_config || {}).ship_css;
          if (shipCss) {
            let linkEl = document.getElementById('ship-theme-css');
            if (!linkEl) {
              linkEl = document.createElement('link');
              linkEl.rel = 'stylesheet';
              linkEl.id = 'ship-theme-css';
              document.head.appendChild(linkEl);
            }
            linkEl.href = shipCss;
          }

          if (msg.data.state.world) {
            const nameEl2 = document.getElementById('ship-name');
            const missionEl = document.getElementById('ship-mission');
            if (nameEl2) nameEl2.textContent = msg.data.state.world.scenario_title || 'Phoenix';
            if (missionEl) missionEl.textContent = msg.data.state.world.scenario_description || '';
          }
          setStatus('Connected');
          rebuildStations();
          break;
        case 'PlayerJoined': {
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const p = msg.data.player;
            const existing = state.players.findIndex(x => x.token === p.token);
            if (existing >= 0) state.players[existing] = { ...p };
            else state.players.push({ ...p });
          }
          rebuildStations();
          break;
        }
        case 'PlayerLeft':
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            state.players = state.players.filter(p => p.token !== msg.data.token);
          }
          rebuildStations();
          break;
        case 'StationAssigned': {
          const stationId = msg.data.station_id
            ? (typeof msg.data.station_id === 'string' ? msg.data.station_id : msg.data.station_id.id)
            : null;
          if (msg.data.token === myToken && !stationId) {
            pendingMidGameClaim = false;
          }
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const { token, station } = msg.data;
            // A station is held by at most one player — clear any other holder first.
            if (stationId) {
              for (const p of state.players) {
                if (p.token !== token && (typeof p.station === 'string' ? p.station : (p.station && p.station.id)) === stationId) {
                  p.station = null;
                }
              }
            }
            const target = state.players.find(p => p.token === token);
            if (target) {
              target.station = stationId || station || null;
            }
          }
          rebuildStations();
          break;
        }
        case 'NameChanged': {
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const p = state.players.find(p => p.token === msg.data.token);
            if (p) p.name = msg.data.name;
          }
          if (msg.data.token === myToken) myName = msg.data.name;
          rebuildStations();
          break;
        }
        case 'GameStartCountdown':
          state.countdownSecs = (msg.data && msg.data.remaining_secs) || 0;
          rebuildStations();
          break;
        case 'GameStarted':
          state.phase = 'InProgress';
          state.countdownSecs = 0;
          const loadingEl = document.getElementById('asset-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          break;
        case 'LoadingProgress': {
          const frac = msg.data?.fraction ?? 0;
          const pct = Math.round(frac * 100);
          const pctEl = document.getElementById('asset-loading-pct');
          const assetEl = document.getElementById('asset-loading');
          if (assetEl) assetEl.style.display = 'flex';
          if (pctEl) pctEl.textContent = String(pct);
          break;
        }
        case 'SimState': {
          const snap = msg.data.snapshot;
          // SimSnapshot now carries only entity_states. Per-system fields
          // (ship position, view_mode, red_alert, etc.) are now delivered
          // via BlackboardUpdate; see the 'BlackboardUpdate' case below.
          if (!window.simState && snap.entity_states) {
            for (const es of snap.entity_states) {
              const match = state.asteroids.find(a => a.uuid === es.uuid);
              if (match && es.position) {
                match.position = es.position;
              }
            }
          }
          // Refresh every radar-bearing console each tick. The tactical radar
          // blips are built client-side from ship_x/z/yaw + the entity array
          // (same as sensors), so the weapons console must be pushed here too �
          // otherwise it only refreshes on the sparse WeaponsUpdate/TargetLock
          // events and the radar appears to crawl at ~1 Hz while sensors is
          // smooth at the 10 Hz SimState cadence.
          pushWeaponsConsoleState();
          pushRepairConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          // Don't re-render the full lobby at 10Hz when spectating or when a
          // mid-game station claim is still pending Ready � it destroys CSS
          // hover state and tears down the Ready/Leave button listeners.
          // The push calls are no-ops when no game console is active.
          if (showingLobbyDuringGame(state)) return;
          // Fall through to scheduleRender() so the helm + captain iframes
          // receive updated state.
          break;
        }
        case 'WorldSetup': {
          // Share the sim-state module's entity array (in-place updates and
          // spawn/despawn flow through automatically).
          state.asteroids = window.simState
            ? window.simState.world.entities
            : ((msg.data.world && msg.data.world.entities) || []);
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          return;
        }
        case 'EntitySpawned':
        case 'AsteroidSpawned': {
          // Handled by the sim-state module (idempotent append); re-mirror the
          // entity array and refresh the radar-bearing consoles.
          if (!window.simState) return;
          state.asteroids = window.simState.world.entities;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          return;
        }
        case 'TargetLock': {
          const { uuid, locked } = msg.data;
          if (locked) {
            state.weaponsTarget = uuid;
            state.weaponsLocked = true;
          } else {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          break;
        }
        case 'BlackboardUpdate': {
          // simState.apply() already wrote blackboards[systemId] = bb.data above.
          // state.blackboards is the same object reference, so it's already current.
          const updatedSystems = new Set((msg.data.updates || []).map(([id]) => id));
          // Mirror per-system blackboard data into flat state fields used by
          // non-module fallback builders and by radar blip calculations that
          // need ship_x/z/yaw on every SimState tick.
          if (updatedSystems.has('helm')) {
            const bb = state.blackboards['helm'];
            if (bb) {
              state.shipX                = bb.x             ?? state.shipX;
              state.shipZ                = bb.z             ?? state.shipZ;
              state.shipYaw              = bb.yaw           ?? state.shipYaw;
              state.forwardSpeed         = bb.forward_speed ?? state.forwardSpeed;
              state.impulseChargeProgress = bb.impulse_charge ?? state.impulseChargeProgress;
              state.boostBattery         = bb.boost_battery ?? state.boostBattery;
              state.boostActive          = !!bb.boost_active;
              state.boostEnabled         = !!bb.boost_enabled;
            }
            pushHelmConsoleState();
          }
          if (updatedSystems.has('captain') || updatedSystems.has('viewscreen')) {
            const bb = state.blackboards['captain'];
            if (bb) {
              const vm = bb.view_mode;
              const vd = vm && vm.kind === 'Camera' ? vm.data : null;
              // Map the Cinematic enum tag to the camera-button label "cinematic".
              const kind = vm && vm.kind === 'Cinematic' ? 'cinematic' : (vm && vm.kind);
              state.currentView = vd || kind || state.currentView;
              if (bb.camera_views) state.cameraViews = bb.camera_views;
              const nextAlert = !!bb.red_alert;
              if (state.redAlert !== nextAlert) {
                state.redAlert = nextAlert;
                applyBezelAlert(nextAlert);
              }
            }
            pushCaptainConsoleState();
            // Helm/Sensors/Comms/Navigation each derive their own "on screen"
            // button state from state.currentView, so a view-mode change must
            // refresh all of them too, not just the captain console � otherwise
            // the button that requested the view change never reflects the
            // toggle (see #on-screen-btn on Helm).
            pushHelmConsoleState();
            pushSensorsConsoleState();
            pushCommsConsoleState();
            pushNavigationConsoleState();
          }
          if (updatedSystems.has('navigation')) {
            const bb = state.blackboards['navigation'];
            if (bb) state.navigationWaypoint = bb.navigation_waypoint || null;
            pushNavigationConsoleState();
          }
          if (updatedSystems.has('tactical'))   pushWeaponsConsoleState();
          if (updatedSystems.has('power'))      pushPowerConsoleState();
          if (updatedSystems.has('shields'))    pushShieldsConsoleState();
          if (updatedSystems.has('repair'))     pushRepairConsoleState();
          if (updatedSystems.has('comms'))      pushCommsConsoleState();
          if (updatedSystems.has('sensors'))    pushSensorsConsoleState();
          // Same guard as SimState: don't re-render the lobby at 10 Hz while
          // spectating or mid-game-claim-pending � it rebuilds the station
          // list every frame, destroying button listeners before a click can
          // register.
          if (showingLobbyDuringGame(state)) return;
          break;
        }
        case 'WeaponsUpdate': {
          // Save full bank/tube/torpedo/mode state for the iframe console.
          const { target_uuid, target_name, banks, tubes, torpedo_count, phaser_mode, blips } = msg.data;
          const previousTarget = state.weaponsTarget;
          const bankList = Array.isArray(banks) ? banks : [];
          const fire_ready  = bankList.some(b => b.fire_ready);
          const on_cooldown = bankList.length > 0 && bankList.every(b => b.on_cooldown);
          const readyBank   = bankList.find(b => b.fire_ready) || bankList[0] || null;
          state.weaponsReadyBankId   = readyBank ? readyBank.id : null;
          state.weaponsFireReady     = fire_ready;
          state.weaponsOnCooldown    = on_cooldown;
          state.weaponsBanks         = bankList;
          state.weaponsTubes         = Array.isArray(tubes) ? tubes : [];
          state.weaponsTorpedoCount  = typeof torpedo_count === 'number' ? torpedo_count : 0;
          state.weaponsPhaserMode    = phaser_mode || 'Auto';
          state.weaponsBlips         = Array.isArray(blips) ? blips : state.weaponsBlips;
          if (target_uuid) {
            state.weaponsTarget = target_uuid;
            state.weaponsTargetName = target_name || (previousTarget === target_uuid ? state.weaponsTargetName : null);
            state.weaponsLocked = true;
          } else {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          break;
        }
        case 'BeamStarted': {
          state.weaponsFiring = true;
          pushWeaponsConsoleState();
          break;
        }
        case 'BeamEnded': {
          state.weaponsFiring = false;
          pushWeaponsConsoleState();
          break;
        }
        case 'SystemHullUpdate': {
          state.consoleHull = window.simState
            ? window.simState.consoleHull
            : (msg.data.entries || []);
          pushRepairConsoleState();
          break;
        }
        case 'RepairState': {
          state.repairTeams = window.simState
            ? window.simState.repairTeams
            : (msg.data.teams || []);
          pushRepairConsoleState();
          break;
        }
        case 'PowerState': {
          const { helm, weapons, sensors, battery_charge, locked } = msg.data;
          if (typeof helm           === 'number') state.powerHelm    = helm;
          if (typeof weapons        === 'number') state.powerWeapons = weapons;
          if (typeof sensors        === 'number') state.powerSensors = sensors;
          if (typeof battery_charge === 'number') state.powerBattery = battery_charge;
          state.powerLocked = !!locked;
          pushPowerConsoleState();
          break;
        }
        case 'ShieldStatus': {
          state.shieldFacings = (msg.data.facings || []).map(f => ({
            label: f.label,
            hp: f.hp,
            max_hp: f.max_hp,
            online: f.online,
            offline_remaining: f.offline_remaining || 0,
            is_focused: !!f.is_focused,
          }));
          // Derive focused facing from facings list.
          const focused = state.shieldFacings.find(f => f.is_focused);
          state.shieldFocusedFacing = focused ? focused.label : null;
          pushShieldsConsoleState();
          break;
        }
        case 'AsteroidDestroyed': {
          const { uuid } = msg.data;
          // Removal already done in place by the sim-state module when loaded.
          state.asteroids = window.simState
            ? window.simState.world.entities
            : state.asteroids.filter(a => a.uuid !== uuid);
          if (state.weaponsTarget === uuid) {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          if (state.sensorsTarget === uuid) state.sensorsTarget = null;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          break;
        }
        case 'EntityDespawned': {
          const { uuid } = msg.data;
          // Removal already done in place by the sim-state module when loaded.
          state.asteroids = window.simState
            ? window.simState.world.entities
            : state.asteroids.filter(a => a.uuid !== uuid);
          if (state.weaponsTarget === uuid) {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          if (state.sensorsTarget === uuid) state.sensorsTarget = null;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          break;
        }
        case 'DamageTaken': {
          const { hull } = msg.data;
          if (hull > 0) {
            const clamped = Math.min(hull, 30);
            const duration = Math.round(50 + (clamped / 30) * 250); // 50�300 ms
            if (navigator.vibrate) navigator.vibrate(duration);
          }
          return;
        }
        case 'CoordinationPopup': {
          const { target, payload, sender_label } = msg.data;
          showCoordinationPopup(payload, sender_label);
          return;
        }
        case 'CommsState': {
          // Handled by the comms-state module (gui/comms-state.js); mirror its
          // messages/contacts for buildCommsConsoleState. Previously only the
          // (now deleted) Bevy drain consumed this message.
          if (window.commsState) {
            state.commsMessages = window.commsState.messages;
            state.commsContacts = window.commsState.contacts;
          } else {
            state.commsMessages = msg.data.messages || [];
            state.commsContacts = msg.data.contacts || [];
          }
          pushCommsConsoleState();
          break;
        }
        case 'ShipDestroyed':
          state.shipDestroyed = true;
          break;
        case 'GameOver':
          state.phase = 'GameOver';
          state.gameOverReason = msg.data.reason || null;
          break;
        case 'RatingChanged': {
          // sim-state.js already updated window.simState.stationRatings with the
          // new rating before this handler fires. Mirror it immediately so the
          // badge re-renders from the fresh data rather than stale controlSources
          // that will only update on the next SimState tick (up to 100 ms later).
          if (window.simState) state.stationRatings = window.simState.stationRatings || {};
          // Always push the captain console state immediately; the captain badge
          // reads controlSources which lags, but stationRatings is already fresh.
          pushCaptainConsoleState();
          break;
        }
        case 'ReadyChanged':
          if (msg.data.token === myToken && msg.data.ready) pendingMidGameClaim = false;
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const p = state.players.find(p => p.token === msg.data.token);
            if (p) p.ready = msg.data.ready;
          }
          rebuildStations();
          break;
        case 'ObjectiveSummary':
          break; // fall through to scheduleRender
        case 'ScenarioLoaded':
          break; // fall through to scheduleRender (render reads window.lobbyState.waitingForScenario)
        default:
          return; // unknown � skip re-render
      }
      // Don't re-render the full lobby at high frequency during mid-game
      // spectating/claiming — renderLobby does list.innerHTML = '' which
      // destroys all button event listeners, so a click between DOM teardown
      // and rebuild lands on a stale/deleted node and never fires.
      // Lobby-mutating handlers (StationAssigned, ReadyChanged, etc.) all
      // call rebuildStations() which calls scheduleRender() internally, so
      // this guard is safe for them too.
      if (!showingLobbyDuringGame(state)) { scheduleRender(); }
    }

    // -- PeerJS connection (extracted to gui/connection-manager.js, issue #603) --

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus('No host ID in URL. Scan the QR code on the view screen.');
    } else {
      (async () => {
        // Gate on DOMContentLoaded before touching any module-dependent state.
        // See the comment above the original gate for the full rationale.
        if (document.readyState === 'loading') {
          await new Promise(resolve =>
            document.addEventListener('DOMContentLoaded', resolve, { once: true }));
        }

        // Resolve this tab's session token now that all deferred modules have
        // run. Each tab gets its own token, which is what lets several clients
        // on one desktop connect as distinct players. The inline branch is a
        // last-ditch fallback for the rare case the module genuinely failed to
        // load.
        myToken = (typeof window.installSessionToken === 'function')
          ? window.installSessionToken()
          : (() => {
              let t = sessionStorage.getItem('session-token');
              if (!t) {
                t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                  .map(b => b.toString(16).padStart(2, '0')).join('');
                sessionStorage.setItem('session-token', t);
              }
              return t;
            })();
        console.log(`[client] session token ${myToken.slice(0, 8)}`);

        // Mount the settings panel (gear button + overlay) once state is ready.
        // Provide send, a getState closure, and the UI click audio element.
        if (typeof window.mountSettings === 'function') {
          window.mountSettings({
            send: (type, data) => send(type, data),
            getState: () => state,
            audioEl: document.getElementById('ui-click'),
            myToken: myToken,
          });
        }

        console.log('[PeerJS] fetching ICE servers');
        const iceServers = await window.fetchIceServers();
        console.log('[PeerJS] ICE config:', iceServers.map(s => s.urls));

        if (typeof window.connectionManager === 'undefined') {
          console.warn('[client] connection-manager module not loaded; falling back to inline Peer setup');
          return;
        }

        window.connectionManager.connect(hostPeerId, {
          iceServers,
          getIdent: () => ({ token: myToken, name: myName }),
          onData: handleMessage,
          onStatus: (state) => {
            setConnectionStatus(state);
            if (state === 'ready') {
              acquireWakeLock();
              setStatus('Waiting for server');
            } else if (state === 'connecting') {
              setStatus('Connecting to host');
            } else if (state === 'disconnected') {
              releaseWakeLock();
              setStatus('Disconnected');
            } else if (state === 'error') {
              releaseWakeLock();
              setStatus('Cannot reach host - the network may be blocking WebRTC relay traffic. Try a different network.');
            }
          },
          onError: (type) => {
            if (type === 'peer-unavailable') {
              setStatus('Host not found \u2014 rescan the QR code on the view screen.');
            } else {
              setStatus('Peer error: ' + type);
            }
          },
          onLog: (msg) => console.log(msg),
        });
      })();
    }</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.captain.doc_title">Project Phoenix — Captain Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; }
    .console-body .sensors-col { display: flex; }
    .console-body .sensors-col ph-sensor-radar { width: 100%; height: 100%; }
    .console-body .cmd-col { display: flex; flex-direction: column; min-height: 0; }
    .cmd-col .controls-row { display: flex; gap: 12px; flex-shrink: 0; }
    .cmd-col .controls-row > * { flex: 1; min-width: 0; }
    ph-objective-list { flex: 1; min-height: 0; }
    ph-deadline-list { flex-shrink: 0; padding-top: 4px; border-top: 1px solid var(--line-soft); }
    ph-operation-panel { flex-shrink: 0; padding-top: 4px; border-top: 1px solid var(--line-soft); }
    ph-scan-readout { flex-shrink: 0; padding-top: 4px; border-top: 1px solid var(--line-soft); }
    ph-sensor-panel { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }

    /* Visiting consoles (issue #984): Comms and Navigation follow the crew, so
       this station carries the same toggle/panel pair the destroyer's Tactical
       console has, shown only while the seek holds a system here. */
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    .overlay-toggle { background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; min-height: var(--control-hit-min); }
    .overlay-toggle:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-toggle.active { background: rgba(var(--rgb-cyan-dim), 0.9); border-color: var(--cyan); color: var(--cyan); }
    .overlay-toggle .unread-badge { display: none; margin-left: 6px; background: var(--fire-bright); color: var(--surface-void); font-size: var(--text-xs); font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 1.4; }
    .overlay-toggle .unread-badge.show { display: inline-block; }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-navigation-map, .overlay-panel ph-comms-contact-list, .overlay-panel ph-comms-current-message { flex: 1; min-height: 0; }
    .overlay-toggle[hidden] { display: none; }

    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .hero h1 { font-size: var(--text-xl); }
      .hero h1 .sub { font-size: var(--text-xs); }
      .console-body { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
      .console-body .sensors-col { width: 100%; aspect-ratio: 1 / 1; flex-shrink: 0; }
      .console-body .cmd-col { flex: 1; }
      .cmd-col .controls-row { gap: 8px; }
    }

    @media (orientation: landscape) {
      .console-body { display: grid; grid-template-columns: auto 1fr; gap: 16px; }
      .console-body .sensors-col { height: 100%; aspect-ratio: 1 / 1; }
      .console-body .cmd-col { overflow-y: auto; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Captain Console" data-i18n-attr="data-screen-label:console.captain.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.captain.title">CAPTAIN</span><span class="sub" data-i18n="console.destroyer_captain.subtitle">COMMAND &amp; SENSORS</span></h1>
        <div class="hero-controls">
          <span class="auto-badge" id="captain-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          <!-- Human-seeking systems (issue #984): hidden until the seek parks
               Navigation or Comms on this station, and hidden again the moment
               it moves on. -->
          <button class="overlay-toggle" id="nav-toggle" data-overlay="nav-overlay" data-active="false" hidden data-i18n="console.common.nav_toggle">Nav</button>
          <button class="overlay-toggle" id="comms-toggle" data-overlay="comms-overlay" data-active="false" hidden><span data-i18n="console.common.comms_toggle">Comms</span><span class="unread-badge" id="comms-unread">!</span></button>
        </div>
      </div>
      <div class="console-body">
        <div class="sensors-col">
          <ph-sensor-radar id="sensor-radar"></ph-sensor-radar>
        </div>
        <div class="cmd-col">
          <div class="controls-row">
            <ph-camera-select id="camera-select"></ph-camera-select>
            <ph-red-alert id="red-alert"></ph-red-alert>
          </div>
          <ph-objective-list id="objective-list"></ph-objective-list>
          <ph-deadline-list id="deadline-list"></ph-deadline-list>
          <ph-operation-panel id="operation-panel"></ph-operation-panel>
          <ph-scan-readout id="scan-readout"></ph-scan-readout>
          <ph-sensor-panel id="sensor-panel"></ph-sensor-panel>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.captain.station_footer">CAPTAIN STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_target">NO TARGET</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <!-- Visiting consoles (issue #984). Present in the markup always, opened
         only through toggles that appear while the seek holds the system here.
         Same ids as the destroyer's Tactical console — gui/visiting-systems.js
         renders all four seats through one code path. -->
    <div class="overlay-panel" id="nav-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.navigation_panel">Navigation</h2>
      <ph-navigation-map id="navigation-map"></ph-navigation-map>
      <ph-civilian-traffic id="civilian-traffic"></ph-civilian-traffic>
    </div>
    <div class="overlay-panel" id="comms-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.comms_panel">Comms</h2>
      <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
      <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
    </div>
  </div>
  <script type="module">
    import '../components/ph-camera-select.js';
    import '../components/ph-red-alert.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-deadline-list.js';
    import '../components/ph-operation-panel.js';
    import '../components/ph-scan-readout.js';
    import '../components/ph-sensor-radar.js';
    import '../components/ph-sensor-panel.js';
    import '../components/ph-station-damage.js';
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-current-message.js';
    import '../components/ph-navigation-map.js';
    import '../components/ph-civilian-traffic.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    import { setAutoState } from '../console-ui.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    import { renderVisitingSystems } from '../visiting-systems.js';

    // Delegated, because the toggles these panels hang off start `hidden` and
    // only become controls when the seek hands this station the system.
    initConsoleOverlays();

    // Generic system-id-keyed payload (issue #825): resolve each panel's view
    // from the fine system ids this station owns, falling back through the
    // ids each hull may declare for the same console family.
    function system(s, ...ids) { for (const id of ids) if (s.systems && s.systems[id]) return s.systems[id]; return {}; }
    initConsole({
      name: 'captain',
      // s is a SystemStationConsolePayload — see the @typedef in gui/console-state.js.
      render: function(s) {
        // Comms and Navigation follow the crew (issue #984). The Captain is
        // THIRD in this hull's authored seek order, behind Engineering: the
        // chair whose attention is meant to stay on the whole board is not the
        // first place to put a second job.
        renderVisitingSystems(s);
        var cameraEl = document.getElementById('camera-select');
        var redAlertEl = document.getElementById('red-alert');
        var objectiveEl = document.getElementById('objective-list');
        var sensorRadarEl = document.getElementById('sensor-radar');
        var sensorEl = document.getElementById('sensor-panel');
        var cap = system(s, 'captain', 'red-alert', 'viewscreen');
        var sensors = system(s, 'sensors', 'sensor-radar');
        cameraEl.state = { views: cap.camera_views || [], current_view: cap.view_direction || '', auto: cap.viewscreen_auto || false };
        redAlertEl.state = { active: !!cap.red_alert, hold: !!cap.weapons_hold, auto: cap.red_alert_auto || false };
        objectiveEl.state = { objectives: cap.objectives || [], boosted_objective_id: cap.boosted_objective_id ?? null };
        // Visible mission deadlines, counted down server-side (issue #1024).
        document.getElementById('deadline-list').state = { deadlines: cap.deadlines || [] };
        // External operations (issue #1026). The hold's progress is computed
        // server-side off eligible ticks; the panel paints it and runs no clock.
        // Its start button aims at whatever the captain has selected on the
        // sensor radar — the science target IS how this console names a thing
        // outside the hull, so an operation orders itself against the same one.
        document.getElementById('operation-panel').state = {
          operations: cap.operations || {},
          target_uuid: sensors.target_uuid || null,
        };
        // The science scan (issue #1032). The readout is DERIVED server-side
        // from the subject's own condition track — there is no authored scan
        // text anywhere behind it — and the button aims at whatever the captain
        // has selected on the sensor radar, the same target the operation panel
        // orders against.
        document.getElementById('scan-readout').state = {
          scan: sensors.scan || {},
          target_uuid: sensors.target_uuid || null,
        };
        sensorRadarEl.state = sensors;
        sensorEl.state = sensors;
        var targetName = sensors.target_name || null;
        document.getElementById('footer-target').textContent = targetName ? '\u25C9 ' + targetName : t('console.common.no_target');
        document.getElementById('footer-target').style.color = targetName ? 'var(--tactical)' : 'var(--ink-faint)';
        // Station badge: the retired composite's captain_auto meant "station
        // is Backfill-rated". The per-system equivalent is every owned system
        // AI-run \u2014 the conjunction of the resolved views' *_auto flags
        // (controlSources can lag a rating change by one tick).
        setAutoState(null, document.getElementById('captain-auto-badge'), !!(cap.red_alert_auto && cap.viewscreen_auto && sensors.sensors_auto));
        document.getElementById('station-damage').state = s.own_hull || null;
      }
    });
  </script>
</body>
</html>

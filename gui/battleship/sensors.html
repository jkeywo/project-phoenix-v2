<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.sensors.doc_title">Project Phoenix - Sensors Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: auto 1fr; gap: 16px; }
    .radar-col { height: 100%; aspect-ratio: 1 / 1; }
    .data-col { min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .data-panel { display: flex; flex-direction: column; gap: 8px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    .data-panel h2 { margin: 0; font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; }
    .metric { display: flex; justify-content: space-between; gap: 12px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    .metric strong { color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-lg); }
    #btn-cancel-impulse[hidden] { display: none; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; } .radar-col { width: 100%; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Sensors Console" data-i18n-attr="data-screen-label:console.sensors.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The locked target the
           footer named heads the scan column it belongs to. -->
      <div class="console-body">
        <div class="radar-col">
          <ph-sensor-radar id="sensor-radar"></ph-sensor-radar>
        </div>
        <div class="data-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="sensors-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <div class="data-panel">
            <h2 data-i18n="console.sensors.scan_summary">Scan Summary</h2>
            <div class="metric"><span data-i18n="console.sensors.scan_range">Scan Range</span><strong id="scan-range-val">0</strong></div>
            <div class="metric"><span data-i18n="console.sensors.contacts">Contacts</span><strong id="contact-sub">0</strong></div>
            <button class="btn" id="btn-cancel-impulse" type="button" hidden><span class="btn-bg"></span><span class="label" data-i18n="console.common.cancel_impulse">Cancel Impulse</span></button>
          </div>
          <div class="data-panel">
            <h2 data-i18n="console.sensors.target_analysis">Target Analysis</h2>
            <div class="metric"><span data-i18n="console.sensors.name">Name</span><strong id="tgt-name" data-i18n="console.common.no_target">NO TARGET</strong></div>
            <div class="metric"><span data-i18n="console.sensors.kind">Kind</span><strong id="tgt-kind-tag" data-i18n="console.common.no_contact">NO CONTACT</strong></div>
            <div id="shield-facings" data-i18n="console.common.no_shield_data">NO SHIELD DATA</div>
            <div class="metric"><span data-i18n="console.sensors.shield_status">Shield Status</span><strong id="shields-tag" data-i18n="console.common.no_data">NO DATA</strong></div>
            <!-- Shield Freq (issue #927) folded into this dedicated Target
                 Analysis section rather than duplicated via the shared
                 ph-sensor-panel below — see hide-shield-rows on that element. -->
            <div class="metric"><span data-i18n="component.sensor_panel.shield_freq">Shield Freq</span><strong id="shield-freq-tag" data-i18n="console.common.no_data">NO DATA</strong></div>
          </div>
          <!-- hide-shield-rows: this console's Target Analysis panel above
               already shows target shields (renderShieldFacings()) and
               Shield Freq — without this the shared panel duplicated both. -->
          <ph-sensor-panel id="sensor-panel" hide-shield-rows></ph-sensor-panel>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-sensor-radar.js';
    import '../components/ph-sensor-panel.js';
    import { initConsole } from '../console-core.js';
    import { SENSORS_CANCEL_IMPULSE_ACTION_ID } from '../stations/sensors-actions.js';
    // The render lives in gui/battleship/sensors.console.js (issue #1235):
    // the shared Sensors renderer + this hull's variant. s is a
    // SensorsConsolePayload — see the @typedef in gui/console-state.js. The
    // vitest suite imports the same renderStation.
    import { renderStation } from './sensors.console.js';

    var consoleApi = initConsole({ name: 'sensors', render: renderStation });

    document.getElementById('btn-cancel-impulse').addEventListener('click', function() {
      window.activateSemanticAction(SENSORS_CANCEL_IMPULSE_ACTION_ID, { source: 'control' });
    });
  </script>
</body>
</html>

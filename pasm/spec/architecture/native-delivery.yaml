  - component: bridge-display-profile
    core:
      status: implemented
      confidence: confirmed
      title: Bridge Display Profile
      summary: A reusable, hand-editable TOML profile that assigns every configured monitor a role — the shared viewscreen, or a crew Station hosting one or two console panes — so a native host covers each monitor with one borderless-fullscreen surface and reloads the same layout after a reboot. The pure model (stable monitor identity, the one/two-pane density rule, pane geometry, the round-trip and the missing-display resolution) is Bevy-free and CI-tested; the winit adapter that reads real monitors and opens the windows is provable only on a machine with displays.
      rationale:
        - "[ai] The stable identity is name@WxH — the OS-reported name and native resolution — because winit (and Bevy's Monitor component) exposes no serial or EDID, nothing a display carries in hardware. Position and scale factor are deliberately EXCLUDED, because both change under the ordinary rearrange the identity must survive; two identical monitors, indistinguishable to winit, are the one case that falls back to a position suffix and does not survive a physical swap. On Windows the name is often the GDI device name (like DISPLAY5), so the identity is only as stable as that slot across a re-plug — the honest limit of what the platform gives, documented on identify()."
        - "[ai] The layout/profile model is PURE and lives apart from the winit adapter, because that is where every acceptance criterion with logic in it lives: a monitor keeps its identity across an OS-settings rearrange, a Station refuses a third pane, a profile reloads to the same roles, a vanished monitor is named rather than silently re-homed. All of it runs under the ordinary cargo test; only opening a real borderless-fullscreen window needs a display, and that is the #[ignore]d integration test, exactly as #1121's GPU proof is."
        - "[ai] The density rule (MAX_PANES_PER_STATION = 2) is a documented legibility bound, not a designer's tunable: a console is authored to be read one, or side-by-side two, to a screen, and three at bridge distance is unreadable. A profile that names three panes is refused at validation with an authored explanation naming the monitor, before any window opens."
        - "[ai] A missing or changed display is REPORTED, never silently replaced or rearranged. resolve() instantiates a surface only for a present, matched identity; a profile entry whose monitor is gone becomes a named MonitorMissing whose role is left unfilled rather than moved. A display whose resolution changed has a different identity, so it surfaces as one missing (the old id) and one unassigned (the new id) — both named, nothing moved."
        - "[ai] TOML rather than RON: a bridge profile is operator configuration in the same family as the world and scenario files an author hand-edits, and toml is a dependency on every target while ron is native-only here. It round-trips display roles, pane geometry, Station assignments and the touch-input mapping. It is NOT the private player Accessibility profile (#1127): this is shared operator config of the physical room, carries nothing about any one player, and is a separate file."
        - "[ai] The viewscreen goes on the process's PRIMARY window — the one #1121 opened and the game cameras already target — put into BorderlessFullscreen on its monitor, so no camera retargeting is needed; each Station spawns its own borderless-fullscreen window. The setup surface for #1123 is ([ai] decision) the profile file plus a --setup enumeration mode that prints the monitors and validates a profile, NOT an interactive on-screen UI — the touch/keyboard-operable setup screen is #1124/#1128's."
        - "[ai] The applier became APPLY-ON-CHANGE for the viewscreen role (issue #1330), because the lobby moves it while the host runs. Opening the Station windows stays a one-shot — a window can only be spawned once — but BridgeDisplayApplied now records WHICH monitor the viewscreen is on, and follow_layout_viewscreen moves the primary window whenever the live BridgeLayout names a different one. A host with no --profile also gains a SYNTHESISED BridgeDisplayConfig built from the displays it found, so the applier and the #1125 runtime watcher run on every windowed host rather than only on a configured one — which is what the monitor row needs in order to follow a cable. That config carries authored: false and is a DESCRIPTION rather than an instruction: it places no window, and the applied baseline is set to the seeded viewscreen whether or not anything moved to reach it. So a run with no lobby press takes the follower's first return every frame and opens exactly the single #1121 window it always did; the byte-for-byte promise moved from \"no config, so nothing runs\" to \"a config with no action, so nothing changes\". An explicit --profile still wins at boot and seeds the layout the lobby then edits."
        - "[ai] watch_runtime_displays also rebuilds the live layout, on a SETTLE rather than on a change: the candidate roster must be the same different thing for the whole DISPLAY_LOSS_DEBOUNCE_FRAMES window before reconcile runs. The #1125 debounce protects a human's station from a winit blip; this one protects the shared view itself, because reconcile falls back to the primary when the viewscreen's monitor is missing and acting on a one-frame blip would drag the viewscreen across the room and back while the crew watched. Its LayoutAdoption notes become lobby feedback; BOOT-time adoption notes deliberately do not, because a hand-authored --pane profile produces one per participant slot and opening the row with a wall of them would bury the answer to an actual press."
        - "[ai] A LIVE roster is re-identified against what the layout already knows (identify_stable), never re-derived with identify. identify's answer depends on the set it is given — an identical twin arriving suffixes BOTH of a pair with #x,y, that twin leaving collapses the survivor back to the short key, and a display renegotiating its mode rewrites the WxH half outright — so a freshly derived string compared against the layout's stored one reads three ordinary events as \"the monitor the viewscreen is on has gone\": it fired ViewscreenMonitorGone, discarded the operator's choice and had follow_layout_viewscreen slam the primary window into borderless fullscreen, on a host nobody had touched. So a display still plugged in CARRIES the identity it was known by, matched by form (the same technique present_assigned_identities uses on the pane side, sharing one identity_forms), through four passes ordered strongest first so a position-free match can never take the screen a position-anchored one names. Two changes at once — moved AND re-moded — are deliberately not chased: nothing anchors that, and guessing would re-home the shared view. The carried identities are written back to BridgeLayoutResource::monitors, because the row is drawn from those and the button round-trip is exact string equality. It lives in the pure identity model beside identify rather than in BridgeLayout: the LAW keeps plain string identity, and the instability is entirely a property of live derivation, which is the adapter's side of the line."
        - "[ai] STATION WINDOWS ARE NOW OPENED AND CLOSED WHILE THE HOST RUNS (issue #1331), which is what makes \"press a screen button and that station's console opens on that monitor\" true. follow_layout_stations is the station half of the apply-on-change applier and the exact counterpart of follow_layout_viewscreen: it diffs the live layout's SEATING against BridgeStationSurfaces, spawns a borderless-fullscreen Station window on a monitor that gains its first console, mints a console pane for each newly seated station (PaneBus::open_console), recomputes the whole monitor's rectangles when its seat count changes, closes the pane of anything the layout no longer seats, and despawns a Station window that is holding nothing — one frame later, because the pane host tears the view and the Station camera down on its own unordered schedule and despawning in the same pass leaves a camera rendering to a window that is gone. So the boot pass is still a one-shot and BridgeStationSurfaces stopped being a boot record: it is the LIVE seam both seating paths read."
        - "[ai] Whether a console needs OPENING is asked of the BUS, for every station the layout seats, rather than derived from a diff of what the surfaces gained. The rule is then \"every seated station has a console\" instead of \"a console is opened when a press adds one\", which is what a --profile that seats a STATION (PaneSlot::for_station) needs: its Station window and its pane slot exist from boot, so a diff finds nothing new and leaves the operator looking at an empty borderless-fullscreen screen. It also makes the sweep idempotent, which is what lets the move pass close-and-recreate without having to tell it what it did."
        - "[ai] MOVING a console is REBUILDING it, on the same identity. An Ultralight view is created at one size on one window, so a console the operator moved to another screen — or whose rectangle changed because a second console joined its screen or left it — cannot be re-placed. follow_layout_stations therefore closes and RECREATES it, which is #1125's crash path used deliberately rather than a second mechanism: the same session token survives, so the rebuilt page's Identify is a reconnect the lobby answers by restoring the held station, and whoever claimed that console keeps it across the move with the same moment on Backfill a view crash costs. open_pending_views builds the new view against the surfaces that same pass rewrote, so it lands on the screen the operator chose whichever order the two unordered systems ran in."
        - "[ai] A console is opened by the DISPLAY layer and never by the lobby. host_lobby::drain_surface_records's layout arm only moves the layout, because an unplug reconciles a console away with nobody pressing anything — and if the press path opened consoles, the unplug path would need its own closing code, which is two implementations of one rule. Both changes arrive as a lawful transition on BridgeLayoutResource, and that is the only thing the follower reads. It also makes the #1125 display-loss semantics fall out rather than be restated: reconcile leaves a station whose monitor is gone unassigned, its console closes on the same frame through the ordinary PaneBus::close, and its station flips to Backfill exactly as a dropped phone's does."
        - "[ai] #1330 left a tripwire — unplug-closes-no-pane on a no-profile host holds only because the SYNTHESISED BridgeDisplayConfig carries no pane labels — and flagged rebuilding that config from the live layout as the obvious next move. #1331 settled that it is NOT the move, and the config stays the BOOT description. Two reasons: the console already closes on an unplug through the law (above), so a rebuild would close it a second time; and assigned_surfaces's pane_labels are the AUTHORED profile's participant names, answering #1125's question about the arrangement the host was STARTED with — folding lobby-opened station ids into them would make one list answer two questions and the answer to neither would be checkable. The tripwire test was split into its two claims instead: unplugging_a_monitor_with_no_console_on_it_closes_no_pane and unplugging_a_monitor_holding_a_runtime_console_closes_exactly_it. WHAT THAT DOES NOT MEAN, and what a first reading of it got wrong, is that the two lists cannot OVERLAP. They can, and a --profile was how: PaneSlot::for_station names its pane for its station, so an AUTHORED station slot put a station id straight into pane_labels and the watcher resolved it against the LIVE bus — unplugging the monitor the profile named then closed a console the lobby had since moved to another screen, ending a human's watch over a display their console was not on and minting a fresh token in its place. The lists are kept apart at the SOURCE instead: assigned_surfaces excludes a station-bearing slot outright, so pane_labels really is participants only and a station's console is the law's on every host, authored or not."
        - "[ai] StationPane gained a station field, mirroring PaneSlot::station, and it is what tells a console the LOBBY owns from a --pane participant's the OPERATOR authored. The follower rewrites the first kind and never touches the second, so a monitor carrying an authored pane keeps it while station consoles are laid out around it. A monitor carrying BOTH is reachable only through a --profile plus a lobby press, and how that pair composites is issue #1332's; the law already declined to make an authored pane consume console capacity, and this declines to invent a rule for it."
        - "[ai] A STATION SURFACE IS THE LAW'S TO DROP, NOT THIS FRAME'S WINIT REPORT. Every reader of a lost display waits out DISPLAY_LOSS_DEBOUNCE_FRAMES before believing it; the surface sweep did not, and retained on the monitors present this frame — so a single absent frame, unmasked by any lobby press (which writes its notices on every record and so marks the layout changed), despawned a live console's Station window while the law still seated it, left a camera rendering to a window that was gone, and left a pane the close sweep could no longer find. follow_layout_stations now drops a surface only when the LAYOUT stops naming its monitor, returns on a frame reporting no monitors at all with the pass still owed, runs on a change to EITHER of its two inputs (the layout AND the monitors, because a display that left and came back must get its Station window rebuilt), and drives the close sweep by the BUS ∩ the LAW — every rostered station the layout does not seat whose console is still open — rather than by the surfaces it has just rewritten."
        - "[ai] THE LAW AND THE ADAPTER ARE RECONCILED, and a seat can be GIVEN BACK. follow_layout_stations applies the layout and cannot see whether the application worked: a failed make_pane_view, or a seat with no BridgeStationSurfaces slot to composite onto, leaves a station card claiming a screen that is black with nothing retrying and nothing saying so. reconcile_seated_consoles asks the question it cannot — does every seated station have a console OPEN ON THE BUS and A SLOT ON A SURFACE — and a station that fails it for the same grace window is rebuilt on its own identity through #1125's close+recreate, BOUNDED by the same per-identity budget a flapping view crash is held to. When that budget is spent the seat is SURRENDERED through the law (UnassignStation) with a LayoutNotice the row renders (LayoutAdoption::ConsoleCouldNotOpen), so the screen frees everywhere at once and the station is on Backfill honestly. On the pane host's side a failed view build now takes back the Station camera it minted — it is created before the fallible build and retire_closed_panes only sweeps cameras when a pane CLOSES — and faults the pane, so the failure enters that same path instead of leaving an open pane with nothing behind it."
        - "[ai] A PANE NAME MAY NOT SHADOW A STATION ID, BY EITHER ROUTE. Pane names and station ids became one namespace when the screen rows started opening a console under its station's own id, so --pane helm on a hull with a helm station is two participants under one key and the row's off button would close the person's console rather than the station's. A name reaches the bus by a SECOND route as well — a --profile [[display.pane]] with a label and no station key — and that route is the one that reopens the hole above: such a slot stays in assigned_surfaces's pane_labels, so unplugging the authored monitor closes the station's console the lobby had opened elsewhere and mints a fresh token, while the law never unseated anything. app::install_world_selection refuses BOTH lists where the roster is finally known: at the prompt for a --world host, and at the pick for a --lobby one (where unwind_failed_load then puts the lobby back). With that refusal in force a duplicate pane label is unreachable from authored input, and BridgeStationSurfaces::slot_for prefers the station-bearing slot so the unreachable case is decided rather than positional."
        - "[ai] THE ADAPTER'S REPORTS AND ITS WINDOWS FOLLOW THE SAME EVIDENCE. Three round-3 corrections, all of them a reader trusting a proxy for the thing it meant. RuntimeDisplayLoss branched on pane_labels.is_empty(), which stopped meaning 'the viewscreen' the moment a station-bearing slot contributed no label — so a stations-only monitor reported the viewscreen's sentence ('nowhere to draw ... no station is affected') on the same frame the law printed StationMonitorGone; it branches on the DisplayRole now. A Station window whose display blipped and returned kept a BorderlessFullscreen naming the despawned Monitor entity, and bevy_winit re-applies fullscreen only on a mode change, so the window stayed where the OS parked it while the geometry, rects and input used the returned monitor; the surface records the entity it is anchored to and the applier rewrites the mode, exactly as follow_layout_viewscreen does for the primary window. And reconcile_seated_consoles now declines a frame reporting no monitors at all, as the applier and the watcher already did, so ten such frames after a press no longer surrender a seat the applier never got to attempt."
        - "[ai] BridgeLayoutResource::notices is APPENDED to by every writer and DRAINED by the publisher. Three systems in two unordered chains write it — the lobby's drain_surface_records (PreUpdate), and reconcile_layout and reconcile_seated_consoles here — and all three assigned, so whichever ran last erased the others. The frame where that decides something is the frame worth reporting: a press landing as a seat is surrendered dropped ConsoleCouldNotOpen, the one notice the reconciler exists to deliver. Appending keeps a frame's notices together; publish_bridge_layout clears what it has pushed (through bypass_change_detection, so the drain cannot schedule a second push that blanks the row it just filled), which is what keeps the list 'what the lobby is owed' rather than everything that ever happened."
        - "[ai] BOTH #1331 CARRY-FORWARDS ARE ANSWERED IN #1332. (a) THE OVERLAP: assign, MonitorChoice::Excluded(Full) and MonitorOccupancy::free_slots counted only seats, so a screen already holding a hand-authored --pane console offered a station a slot, the law took the press, and the adapter laid the newcomer across the whole monitor on top of it. A CONSOLE IS A CONSOLE WHOEVER OPENED IT: rule 3 now counts reserved_on with the seats through one BridgeLayout::occupant_count, so a screen carrying one authored pane has one free slot and one carrying two has none, and LayoutRefusal::MonitorFull carries the authored labels beside the station ids so its count and its list are what an operator can see on the glass. (b) THE GEOMETRY, and the window-sharing call it forced: a monitor has exactly ONE Station window (the #1124 pane host composites N panes onto it), so there is no second window to open and \"refuse to double-book the window\" would have made the law offer a slot the adapter always refused. The runtime console therefore SHARES the authored one's Station window, and BridgeLayout::surface_rects lays out the WHOLE occupancy in ONE pane_rects call — reserved first (it was there from boot, so it keeps the left half), stations after in seat order. Two tilings, each handed the full rectangle, was the bug; one tiling over a count rule 3 already bounds is the fix, with no new tiler. station_rects is now that same tiling FILTERED rather than a tiling of its own, so the two cannot drift."
        - "[ai] THE NEIGHBOUR REBUILD IS SURFACED, NOT HIDDEN (#1332 carry-forward (b)). Seating or unseating a console re-lays out the whole monitor, so the console BESIDE it loses its rectangle; an Ultralight view is built at one size on one window, so it goes through #1125's close+recreate and its crew member spends a page load disconnected with their station on Backfill. THE SAME-TOKEN RECLAIM HOLDS and that is what makes the flap acceptable rather than a seat loss: process_disconnect_with_stations leaves the station on the Player record and snapshots its rating into last_rating, and handle_identify's reconnect-yield restores both when the same token identifies again — GATED on no OTHER connected peer holding that station, so the seat is genuinely claimable by somebody else for the length of one page load. That window is not new (it is #1125's crash path and #1331's move), and it is now the only thing left unmitigated. What #1332 adds is that it is no longer SILENT: follow_layout_stations tells a moved console from a re-tiled one by the evidence it already has — monitor changed means the operator moved it, rectangle changed where it stood means a neighbour arrived or left — and the second raises LayoutAdoption::ConsoleRetiling on the lobby row, naming the console and its screen. It carries a name rather than a StationId because an authored --pane participant is re-tiled by the same rule. The operator's own move stays silent, because narrating a press back to the person who made it buries the line that is news."
        - "[ai] #1332 FIX ROUND — ONE TILING, AND IT IS THE AUTHORED ONE. The two entries above state the law as \"surface_rects tiles the whole occupancy, reserved first, along LAYOUT_SPLIT\". Both halves of that were wrong and are superseded here. #1332 left TWO tilings live: apply_bridge_profile laid a --profile's Station out from the FILE (that entry's pane order, that entry's split) while surface_rects laid the same screen out reserved-first on the constant. follow_layout_stations is chained immediately after the applier in the same Update, so the boot frame drew the operator's arrangement and the very next system overwrote it: an authored [helm(station), Ada(participant)] booted helm-left and flipped to Ada-left — closing and RECREATING a console nobody had touched and pushing a ConsoleRetiling notice onto the row, which routes straight around the deliberate rule that BOOT adoption notes are logged and never pushed — and an authored split = \"stacked\" screen was re-carved side by side. THE LAW NOW CARRIES THE AUTHORED INTENT: each reservation keeps the INDEX its [[display]] entry gave it (Reservation), and each monitor keeps its authored SPLIT (BridgeLayout::split_on), both recorded in adopt_profile and carried forward by reconcile like the reservations themselves. BridgeLayout::occupants_at is the one place the drawn order is decided — each authored surface takes its authored slot (clamped and walked forward when a refused sibling shrank the screen), the seats fill what is left in seat order — and apply_bridge_profile is now a READER of surface_rects rather than a second tiler. One caller, so there is nothing for a second answer to disagree with. LAYOUT_SPLIT is the DEFAULT for a screen nothing authored (every screen on a host with no --profile, and any unnamed screen on a host with one), not an override of one that was: do not reintroduce a blanket order in either direction, and do not tile with the constant where a profile authored an axis. occupants_on reports that same drawn order, so the greyed button and the monitor button read the way the glass reads rather than merely naming the same set; stations_on stays SEAT order, which is the stations' order relative to each other with an authored surface possibly interleaved."
        - "[ai] #1334 FIX ROUND — A SCREEN'S SPLIT IS WRITTEN WHATEVER ITS OCCUPANCY. write_displays_into emitted `split` only for a screen holding two consoles, on the grounds that a single console is the whole monitor and the field is ignored for it. That read as tidiness and was a SILENT DROP of the operator's own setting: the law carries a split for every screen (split_on), validate and adopt_profile take one on ANY Station entry, and no LayoutAction can set one — so a screen an operator authored stacked survived exactly as long as it held two consoles and vanished from the file on the first save that caught it holding one, coming back side by side next session with nothing said, and with no verb anywhere in the lobby to put it back. It is emitted unconditionally now: one redundant line in a file an operator reads is a smaller cost than a setting they cannot see disappearing, and it makes the round-trip claim TRUE rather than narrower. ONE LOSS IS LEFT AND IT IS STRUCTURAL RATHER THAN CHOSEN: a screen holding NO consoles is not written at all, because a [[display]] with an empty pane list is not a shape the file has (validate refuses it on the density rule), so emptying an authored stacked screen still forgets its axis."
        - "[ai] #1332 FIX ROUND — A REBUILD SAYS WHAT ACTUALLY HAPPENED. follow_layout_stations classified EVERY in-place rectangle change as \"the split changed\", which is a sentence the code cannot support for a display that renegotiated its mode: identify_stable carries such a display's identity across, the law sees the same bridge with the same consoles on the same screen, and every pane on it gets a new rectangle with nothing having joined or left. The three causes are now told apart by the evidence the pass already has (Rebuild): MONITOR changed means the operator moved it and nothing is said; rectangle changed on a screen whose OCCUPANCY also changed is a neighbour arriving or leaving (LayoutAdoption::ConsoleRetiling); rectangle changed on a screen holding exactly what it held is a resize (LayoutAdoption::ConsoleResized). Both surprises still reach the row — the console really did reload either way — with the cause that actually happened. Separate variants rather than one with a {cause} parameter, because they are separate SENTENCES and t() interpolates values, not grammar. And every sentence about the reclaim now states its gate: the crew member reconnects on the same identity AND STAYS ON AI CONTROL if somebody else claimed the station during the page load, which the rustdoc and this slice always said and the Display line and the strings.csv description did not."
        - "[ai] #1332 FIX ROUND — AN AUTHORED CONSOLE'S SLOT IS NOT THE LOBBY'S TO FREE, SO THE ROW SAYS SO. Once a reserved surface costs a console slot (the (a) half above), a --pane participant who never connects permanently halves that screen — and there is NO lobby control that frees it: no station row, no off button, nothing short of restarting the host with different arguments. The alternative considered was feeding bus liveness back into the law and freeing a reservation whose pane the bus no longer has. Rejected: BridgeLayout is pure and Bevy-free by construction (it opens no window and reads no monitor), and a liveness input would make the arrangement change under an operator who pressed nothing — the exact class of surprise this fix round exists to remove. NOTE THE EVIDENCE, because the first version of this entry cited a window that does not exist: the gap between PaneBus::close and PaneBus::recreate is NOT observable — they are consecutive statements in ONE system body (follow_layout_stations' rebuild pass), and the lobby's own assign already ran back in PreUpdate. The real windows are MULTI-FRAME, and there is one for whichever signal is picked. Keyed on Live: a rebuilt console is OPEN BUT NOT LIVE from the moment recreate returns until its page has reloaded and pump_pane calls mark_live — a whole page load, on every move, re-tile and resize a console goes through. Keyed on Closed: #1125's crash path leaves a faulted pane closed from the fault until the recovery pass rebuilds it, and once its per-identity budget is spent, closed for the rest of the run. Either hands the slot to a station that then OVERLAPS the console coming back. The pane also genuinely IS on the glass from boot, whether or not a human has reached it, so the count is honest. The HONEST-ROW branch is taken instead: MonitorButtonPayload carries `reserved` (the subset of `stations` the lobby cannot free) and hostLobbyStationRows renders server.station_row.full_authored for a full screen holding one, naming it as unreclaimable from here. A greyed screen that only listed the names would be true and useless — the operator reads \"close one of these\" and finds nothing to close."
        - "[ai] Deferred continuation, LANDED in #1124: compositing an Ultralight pane onto its assigned Station window. This slice opened the Station windows and laid out each pane's rectangle (published in BridgeStationSurfaces); #1124 added the monitor geometry to BridgeStationSurface and made the pane host render each seated pane on its Station window through a per-Station 2-D camera and route that window's input to it. A Station window with no seated pane stays borderless-fullscreen but empty — a disclosed state, not a bug."

entities:
  - decision: redesign-deployables-ordinary-entity-lifecycle
    core:
      status: accepted
      confidence: confirmed
      title: Deployables Use Ordinary Actual Entities and Systems
      summary: "Increment 19 adopts finite probes/turrets/decoys, carried combat/utility craft, mines, supply/work drones and optional energy/shield support through common actual entity/System/job/resource/damage rules. Direct human piloting, per-family simulations and a universal construction interface are excluded."
      rationale:
        - "Selected G061 and S013/S017/S019/S061/S083–84/S086/S092–94/S100–101; detailed scope/evidence lives in docs/gameplay-redesign/implementation/increment-19.md. Static work may follow 15 initial integration/targeted checks after 19/20 custody adoption. Remote/carried craft join 16/18, deception 17, passengers 20; full completion requires verified 16/17/18 exits. Preparation starts no runtime."
        - "[ai] First actual battery-only engineless probe performs physical deploy, dated sensor acquisition and recovery, then a finite-round stationary turret reuses the same lifecycle. Actual entity/config/spawn, energy/damage, jobs/navigation, portable condition and Stock owners remain authoritative. 15 emitted-shot carriers are not craft storage or an operable deployable."
        - "[ai] Battery-only equipment uses the same EnergyNetwork with explicitly zero sustainable generation, finite source/local reserves and existing paid work/losses. Initial validation and profile reconfiguration accept zero generation but retain all finite nonnegative output/ramp/reserve/thermal checks. Existing powered profiles do not change. An actual authored finite probe consumes this capability; this prerequisite does not itself complete physical deployment/recovery."
  - decision: redesign-deployables-one-identity-and-shared-custody
    core:
      status: accepted
      confidence: confirmed
      title: Carried and Deployed State Preserve One Physical Asset
      summary: "One stable actual craft/deployable retains equipment, reserves, condition and lifecycle across carried/launching/deployed/recovering/lost states. Initial storage retains its ordinary entity/continuation owner with explicit nonspatial inactive capability; bay occupancy derives from location, without a parallel mutable blueprint/count."
      rationale:
        - "[ai] Stage actual source/access/readiness/exclusive job/compatible receiving space before the next executable step. Paid work/refusal/recall follows actual job/cursor/flight without teleport, duplicate ID, refill, healed replacement or retroactive refund. Portable EMP/resistance ages against causal time even while stored; emitted rounds retain their actual flight owner."
        - "[ai] Shared 19/20 custody assigns craft/deployment/motion/capacity to 19 and actual people/team identity/condition/location to 20. Passenger views derive from one custody record; existing navigation owns crossings. A delivered team and its shuttle retain distinct exclusive commitments, with later extraction requiring actual transport/travel/capacity. 16 receipts are not physical handoffs."
        - "[ai] First physical probe support is battery-only, engineless and childless with no weapons/passengers. Canonical Carried(parent,bay) or Deployed location retains the actual entity; one actual BayJob alone owns launch/recovery work and derives transitional views. Finite compatible bay allocation is disjoint from cargo/locker space. Handling uses actual installed/source/Operation/access/Power and finite authored stopped-parent speed threshold, with no fake Helm or second integrator."
        - "[ai] Observer privacy and Carried custody feed one Presentation visibility owner. Deployed never forces visibility; removal of all current hide reasons restores that owner's original Visibility, preserving independent hidden state. Serverless previews use the same owner with no observer roots. No independent custody writer may reveal concealed or unobserved actors."
        - "[ai] Simulation owns sole ProbeCustody, derived Disabled and actual backend presence without renderer features. Presentation reads that same public custody owner with Allow<Disabled> to supply same-entity custody hide reasons before extraction; Visibility is never canonical or a Simulation dependency. Headless backend and Presentation visual witnesses remain separate from physical-device/GPU acceptance."
        - "[ai] Stored presence is derived, not another inventory: explicit backend detachment/reinitialization and canonical stored-query participation must be proved on the actual probe. Passive reserve/condition/thermal/absolute EMP aging continues while active work/generation/acquisition stops; existing no-work Broad loss withdraws current support without discarding or refreshing held history. Same identity, reserves and physical state survive recovery/release."
        - "[ai] Actual parent removal transactionally loses actual Carried craft through the same ordinary cleanup/event boundary; Deployed craft survive, and disabled present parents only block handling. No free ejection, clone or hidden orphan is permitted. Bulk restore suppresses gameplay cascades and preflights complete parent/bay/craft/jobs/claims/location/capacity/clock before writes; unsupported contained-craft single-row inverse refuses before creation. Actual removal/backend/passive-aging and fresh JSON 360/no-write tests are probe-consumer evidence, not a general craft/passenger exit."
        - "[ai] First seam uses actual CraftBay(id,power_input,BayConfig), ProbeProfile occupied space, and ordinary LaunchCraft/RecoverCraft/CancelCraftHandling. Own stored ID is legitimate bay knowledge; recovery requires exact current permitted contact. Initial World-row carried_by(parent,bay) resolves within the actual spawn chain before gameplay/publication. Conditional, layered and runtime Carried recipes refuse before materialization initially; no bootstrap operating frame or second identity registry."
        - "[ai] Sensor-only recovery loss pauses the same Job/claim without a destruction inference. Actual bound craft removal settles active work once as Failed through the normal removal hook, with no refund or new remote truth report. The optional positive Bay tree selects the first stable own stored craft from safe local readiness and emits ordinary Launch; default policies Hold."
        - "[ai] Voluntary CancelCraftHandling terminally settles the same Job as Cancelled, retaining performed work in that record, releasing its receiving claim and leaving actual custody unchanged without refund. A later assignment is a new JobId/full requirement. Ordinary condition/motion/access/power interruption instead pauses and resumes the same active work; Cancel never holds a bay hostage."
        - "[ai] First fixed handled probe reuses existing ShipPhysics as its sole captured/digested XYZ/yaw owner, with zero finite forward/lateral/vertical velocity. Actual bay completion writes release pose once alongside the sanctioned Dock mechanical writer; ordinary position sync projects it. No Ship/PhysicsConfig/Helm/propulsion/integrator or duplicate CraftPose is installed, and saved-candidate preflight enforces the fixed-probe boundary."
        - "[ai] Initial custody preserves ordinary ship tags. Carried GameStart craft follows explicit unconditional crew slot rows and cannot be selected/mapped as a crew hull; ambiguous predecessors refuse and actual bootstrap repeats the crew-placement gate before mint. No classification workaround or active bootstrap frame is permitted."
        - "[ai] The same Bay Job advances paid work after Dock motion in Modifiers. Ready work retains actual custody until the next end-Physics CommitCraftHandling boundary, rechecking actual motion/source/Operation/access/recovery contact/range/space before one location/pose transition. Existing Rapier SyncBackend then removes or initializes handles before Damage; blocked ready work is not charged again. No pending queue, extra saved phase or extra physics step is introduced."
        - "[ai] Visible first probe support permits the existing same-entity procedural primitive render path. Descendant-producing GLB/rig/light/celestial profiles remain unsupported and are refused by actual materialization validation; no extra child/presence registry is introduced. Actual visible deployment/stow/release must be proved on this supported path."
  - decision: redesign-deployables-link-loss-and-special-consumers
    core:
      status: accepted
      confidence: confirmed
      title: Onboard Work and Dated Evidence Survive Link Loss Honestly
      summary: "Craft retain ordinary individual System AI and accepted onboard work after link loss. 16 validity/supersession and returned receipts constrain new instructions. 14 sensor owners retain original dated gap history; parent operators receive only legitimately delivered data, not hidden remote progress/pose or another catch-up store."
      rationale:
        - "Mines use actual local trigger/sensing/identification and physical payload, not hidden faction truth or friendly blast immunity. Indiscriminate variants remain possible. 17 decoys are actual short-lived engineless battery/spoofer ships, distinct from apparent report geometry."
        - "S092 standing deliveries use actual cargo, reserve goals, viable jobs and destination capacity without all-future reservations or gifts. S093 work craft repair/deploy carried equipment, not general new-entity fabrication. S094 permits real compatible energy/shield assistance only; component repair remains teams/work craft. 20 supplies actual rescue/Medical/participant continuation and pods retain equipment-backed signalling plus pickup."
        - "[ai] The next bounded 19/20 join, after retained PersonnelRoster verification, adds accepted finite passenger berths to an ordinary battery-only engineless pod. Actual Bay custody/handling remains unchanged in ownership; manifest and berth occupancy derive solely from PersonnelRoster and actual active escort jobs. Bay handling and escort handoffs exclude one another through those existing actual job owners. First physical owned boarding/recovery/unload does not claim a moving shuttle, pilot, foreign rescue/capture or broader personnel exit; detailed contract lives in increment-20.md."
  - decision: redesign-deployables-authoring-and-continuation
    core:
      status: accepted
      confidence: confirmed
      title: Deployment and Sorties Are Authorable and Conserved Through Restore
      summary: "Accepted Workshop ordinary profiles/bays/tools/triggers/goals/feeds use existing history/includes/Preview/Test. Full-candidate parent/craft/personnel identity, phase/location, exclusive job/space, profile/order/clock validation precedes writes. Canonical physical and information owners are captured once; foundation commits are not verified craft/passenger exits."
      rationale:
        - "[ai] Human/ordinary AI paid deploy/flight/return/transfer/link-gap checkpoints require at least 360 fresh JSON complete capture/digest comparisons and different-LocalShip peers, plus missing-parent/blocked-space/tampered no-write cases. No reset of resources/condition/identity, no phantom remote knowledge. Shipped content, physical browser/native/Workshop, performance/combat/sortie and 2/4/6/8-human workload acceptance remain separate."

  - decision: redesign-deployables-fixed-battery-beam-turret
    core:
      status: accepted
      confidence: confirmed
      title: Fixed Beam Turrets Reuse Ordinary Ship Systems
      summary: "The next supported carried equipment recipe is a fixed battery beam turret. Its existing static point-defence predicate installs the ordinary Ship bundle and individual radar/beam AI; Bay custody, physical presence, damage, paid reserves and continuation retain their established owners."
      rationale:
        - "[ai] A strict accepted recipe requires AI-only TacticalRadar and PhaserBank Systems with explicit same-Console permitted feeds, a real Broad scanner, finite positive local work costs, ordinary generic beam definition and fixed childless physical damage layout. Zero generation, no Helm/behaviour/propulsion, no projectile/magazine/passenger or additional actuator capability are admitted by this subtype. Existing sensor probes and passenger pods retain their accepted boundaries."
        - "[ai] is_static_point_defence is the sole existing spawn classification; no turret marker, family controller, shadow target, remote truth grant or special link-loss logic is introduced. Actual local Broad evidence and ordinary own/hostile target rules govern firing. Parent communications loss grants no new information and does not stop valid onboard AI work."
        - "[ai] Launch/recovery remain the same actual paid Bay Job and one retained entity/custody/pose. Carried Disabled participation prevents active radar/weapon work while passive reserve aging and canonical state remain. Restoration must retain identity, finite reserves, equipment damage, actual beam state, history and full custody with no refill."
        - "[ai] Source/data acceptance is not a playable exit: actual Human and ordinary AI launch, genuine acquired firing and energy expenditure, own/hostile filtering, stored inactivity, whole-JSON360/no-write and Workshop Preview/Test evidence remain required before this subtype is declared delivered. Finite-round turrets, identity decoys and moving craft remain separate later consumers."

  - decision: redesign-deployables-fixed-finite-identity-decoy
    core:
      status: accepted
      confidence: confirmed
      title: Physical Decoys Use The Ordinary Paid Identity Emitter
      summary: "The next fixed carried composition is a sensorless, unarmed actual identity-emitter body. The existing finite battery, Boolean intent, individual System state tree, damage, Bay custody and observation owners provide its complete first behavior; no fake actor, family controller, network or expiry timer is added."
      rationale:
        - "[ai] The closed recipe is childless fixed ordinary geometry/damage with no Helm/behaviour/propulsion, weapons, personnel/passenger berths, own sensing or other actuator. Its actual AI-only IdentityEmitter System has its own Console scope, real PowerInput, supported enabled channel/configured state tree and positive finite local work cost. Reactor output and source reserve cannot sustain emissions. Existing sensor/pod and beam-turret boundaries remain separate."
        - "[ai] Short-lived means the actual local emitter battery exhausts through ordinary paid work/passive loss. A depleted body remains a real recoverable physical asset; it neither emits an unpaid claim nor expires through a new clock/despawn path. Bay recovery/relaunch never replenishes or recreates it. Finite service/refitting remains the existing accepted resource owner."
        - "[ai] An observer must physically acquire this same actual entity through its own supported Broad instrument before ordinary identity substitution. The literal callsign/faction claim changes neither real body, actual faction, aim, target tags, permission nor remote identity association. Independent focused/Comms evidence and prior dated records retain their ordinary owners. Sensorless equipment promises no onboard sensing or remote-order link."
        - "[ai] Ordinary Human/AI Bay handling and actual observer acquisition, paid claim, depletion/withdrawal, stored inactivity, same-identity recovery and fresh whole-JSON360/no-write plus accepted Workshop composition require evidence. Source acceptance alone and a retained apparent identity are not physical acquisition or full increment19 completion."

  - decision: redesign-deployables-first-moving-utility-shuttle
    core:
      status: accepted
      confidence: confirmed
      title: Moving Utility Craft Use Their Own Navigation And Paid Helm
      summary: "The first moving consumer is an unarmed ordinary AI utility shuttle. Its actual Full3D XYZ/yaw hull, individual System AI, one onboard Navigation/shared-Job voyage and existing paid sole physics integrator execute finite travel and return. Fixed-craft native evidence must clear before runtime starts."
      rationale:
        - "[ai] Root adopted the independently reviewed coupled increment-19-voyage-comms.md contract before runtime. Existing actual paid Bay launch creates identical bounded own report and child VoyageRef association; explicit Bay and Navigation Console feeds authorize semantic SendCraftOrder intent. Actual paid Radio emission alone mints immutable Contact-only Travel/Recall sequence/expiry from retained sent lineage, with no foreign delivery oracle or new inbox."
        - "[ai] Actual recipient Comms reading/Accept only offers local intent. Its own separately admitted Navigation creates or redirects one real Job/current leg and existing waypoint generation; nonterminal AtWaypoint can wait for Recall, and accepted work survives link/expiry loss. One current owner transition/event projection supplies paid returned facts and event-specific deduplication; no transition archive, copied pre-Nav queue, private pose grant or substitute controller. Only genuine home Bay handoff reports Recovered. Unknown/expired/superseded/wrong-voyage requests cannot operate machinery. Snapshot/source/history/actual paid travel proofs and final acceptance remain required."
        - "[ai] Root approval selects actual Bay launch provenance for home identity only, with original craft/parent/Bay-job/launch frontier and no live pose, radar track or velocity grant. Outbound uses an accepted known authored finite XYZ waypoint explicitly published to issuing Navigation and genuinely transmitted through a closed Contact-only paid Comms request. Return requires the craft's current permitted earned home contact, elevation and motion; missing/stale/ambiguous evidence pauses ordinary local work without private source-map correlation."
        - "[ai] First own XYZ flight reuses current-World Navigation Picture charted points after actual chart range/shows/concealment, existing SetNavigationWaypoint/chart-contact admission and the same goal generation/clearance/shared Helm. Do not add a second authored waypoint list, registry, command or simple-course Job. Extract a neutral id/label/float-XYZ point shape while preserving TransitRouteView API/wire semantics, and publish charted points separately from foreign World arrivals and civilian routes. Capitals retain planar anchoring but may hold explicit public points for later Comms. Only new voyage wire conversion requires integral plus/minus 1,000,000; existing fractional routes/chart authoring remains valid."
        - "[ai] Full3D charted spatial cache retains original accepted point/source/publication frontier under existing Navigation ownership; legitimate refresh preserves course generation, missing view never reads private pose or supplies zero/own height. Normal shared motion planner and individual vertical AI consume this cleared demand through the existing paid integrator and priorities. Snapshot/digest/preflight uses complete candidate ownership/knowledge at both restore doors without new selection/work/observation or pretending to authenticate erased source history. Reuse existing dated ObservedElevation only for the later measured moving-home return, not a special Nav scanner."
        - "[ai] Comms delivery, reading and Accept only offer local intent. The craft's own admitted Navigation acceptance owns the actual shared Job and same generation-addressed NavigationWaypoint; ordinary independent Helm Systems consume explicit permitted dated XYZ demand under existing authority, priorities and paid actuator limits. Full3D here means existing XYZ translation plus yaw, not new pitch/roll machinery, another pilot/controller, remote pose writes or a Human vertical-control promise. Capital Planar/Bounded journeys remain unchanged."
        - "[ai] Actual BayState retains only its latest Job; a new begin_order replaces a terminal result, so it cannot preserve multiple genuine launches. Extend that same Bay owner with at most 128 dated own launch reports, newest own event per craft and deterministic oldest retirement. One real paid physical launch cause establishes both the child's immutable home association and the parent's retained knowledge copy atomically; no second custody/pose/global launch registry is created. Failed, ready-only or cancelled handling emits no cause. This technical history never blocks launch or reserves a resource."
        - "[ai] Only an explicit actual Bay Console feed exposes the parent's historical report to Comms/Navigation. It can establish a known receiver/VoyageRef for best-effort new-family transmission, never current contact/alias/pose/route/delivery viability or future control. Foreign custody/relaunch/loss cannot silently update or withdraw this local history. The source uses ordinary paid emission/delivery with no reception oracle; the receiver independently checks its own actual association/current relationship and admits its own Navigation. Snapshots validate exact available cause/mint/scope/clocks before writes while preserving historical reports after genuine actor/Job replacement or loss, without inventing authentication of erased past."
        - "[ai] Closed travel/recall orders bind one actual launch voyage, monotonically issued sequence, finite emission-based expiry and immutable original request reference. Sequence mints only at actual paid send from retained own lineage; a newly heard/read request supersedes only after real local Navigation acceptance. Expiry rejects new unaccepted intent, never stops accepted onboard work merely because its link is lost. The current accepted leg/frontier survives inbox view retirement, without a second inbox or all-future resource reservation."
        - "[ai] Typed owner-event receipts distinguish Navigation acceptance, actual waypoint arrival, return and pause from Comms Accept and physical recovery. Each binds its original accepted request, onboard Navigation Job and launch provenance. Actual transition identity, rather than coarse Comms Completed alone, controls returned receipt deduplication. Recovered first comes from the home carrier's genuine local completed Bay handoff; a Carried/Disabled craft cannot emit a fictional final radio message. ReportStatus, Formation and facility ReceiveCraft are not travel completion mechanisms."
        - "[ai] Data-authored same-body relative-speed and XYZ-range limits are checked before paid recovery admission and again at end-Physics commit alongside existing source/Operation/access/space/stopped-parent checks. Ordinary Helm approaches/brakes through the paid sole integrator; Dock cannot compete as a pose writer. Failed feasibility pauses the same handling Job without teleport, resource refund, duplicate custody or inferred remote destruction. Exact installed mode governs deployed versus stored motion validation. The relative constraint is optional for legacy fixed profiles: omission preserves strict zero child motion and the existing parent speed limit, rather than imposing a new zero relative-speed requirement. Supported moving profiles require an explicit finite positive bound; omission never permits unlimited moving recovery."
        - "[ai] Detailed owner seams, closed vocabulary and evidence are specified in docs/gameplay-redesign/implementation/increment-19-moving-craft.md. This is adopted design only: actual finite nonplanar flight, real Comms link loss and stale/superseded orders, matched same-body capture, fresh JSON360/no-write, authoring and physical UI acceptance remain required. Armed derivatives, moving passengers, inter-system travel and broader sortie families remain later consumers."

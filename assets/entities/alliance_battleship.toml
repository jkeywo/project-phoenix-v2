[navigation_console.system_chart]
range = 800
shows = [ "region", "asteroid_field", "star", "planet", "station", "player", "objective_marker" ]
selects = [ "station", "planet", "star", "region" ]

[comms]
range = 1000

# Shields — Cruiser baseline × 1.4
# max_hp: 100 × 1.4 = 140; regen_per_sec: 2.5 × 1.4 = 3.5
[shields_console]
focus_bonus_max_hp = 0
focus_bonus_regen = 5
focus_penalty_max_hp = 0
focus_penalty_regen = 1.0
focus_decay_rate = 10
focus_focused_damage_multiplier = 0.5
focus_unfocused_damage_multiplier = 1.25

[shields_console.base]
max_hp = 140
regen_per_sec = 3.5
offline_duration = 10

# 5-arc shields: priority-1 directional arcs absorb first; priority-2 omni absorbs when
# the relevant directional arc is offline.
[[shield_arc]]
id = "fore"
label = "entity.alliance_battleship.shield_arc.fore.label"
center_deg = 0
width_deg = 90
hull_max_hp = 10

[[shield_arc]]
id = "starboard"
label = "entity.alliance_battleship.shield_arc.starboard.label"
center_deg = 90
width_deg = 90
hull_max_hp = 9

[[shield_arc]]
id = "aft"
label = "entity.alliance_battleship.shield_arc.aft.label"
center_deg = 180
width_deg = 90
hull_max_hp = 9

[[shield_arc]]
id = "port"
label = "entity.alliance_battleship.shield_arc.port.label"
center_deg = 270
width_deg = 90
hull_max_hp = 9

[[shield_arc]]
id = "omni"
label = "entity.alliance_battleship.shield_arc.omni.label"
center_deg = 0
width_deg = 360
priority = 2
hull_max_hp = 8

[power]
capacity = 90
rates = [ 5, 4, 3, 2, -2, -5 ]
emergency_threshold = 22

[captain_console]

[engineering_console]

[radar_appearance]
colour = [ 0, 1, 0.2 ]
size = 5
# Ordinary-ship icon: a world-spawned copy of this hull is an NPC. The player's
# own ship gets the `playerShip` icon injected at spawn (see hull tags note).
icon = "ship"

[power_groups.ops]
label = "entity.alliance_battleship.power_groups.ops.label"
# Rests at 1 so the four authored groups sum to a sustainable total (<=6): the
# reactor recharges at idle and the AI/human spends up only on demand (#762).
default_level = 1
min_level = 1
max_level = 4

[power_groups.helm]
label = "entity.alliance_battleship.power_groups.helm.label"
default_level = 2
min_level = 1
max_level = 4

[power_groups.weapons]
label = "entity.alliance_battleship.power_groups.weapons.label"
default_level = 2
min_level = 1
max_level = 4

[power_groups.sensors]
label = "entity.alliance_battleship.power_groups.sensors.label"
default_level = 1
min_level = 1
max_level = 4

# ── 9-Station crew layout ────────────────────────────────────────────────────

[[station]]
id = "captain"
name = "Captain"
description = "entity.alliance_battleship.station.captain.description"
rank = "Cpt."
short_code = "CPT"
console = "gui/battleship/captain.html"
manual_overview = "You command a capital ship with a full nine-seat bridge crew. Set the viewscreen, call Red Alert, and coordinate the whole crew through a sustained engagement. The battleship is slow but overwhelming — your job is to keep every station pulling in the same direction. Simplified rating hands Red Alert to the ship's AI."

[[station.rating]]
name = "Std"
automated_systems = []

[[station.rating]]
name = "Simplified"
automated_systems = ["red-alert"]

[[station]]
id = "helm"
name = "Helm"
description = "entity.alliance_battleship.station.helm.description"
rank = "Ltn."
short_code = "HLM"
console = "gui/battleship/helm.html"
manual_overview = "You fly a heavy warship. It is slow to turn and slow to stop, so plan your manoeuvres well ahead: throttle and steering set your line, lateral thrust helps bring the broadside arcs to bear, and impulse gives you a measured burst. Anticipate where Tactical needs the guns pointed and get there early."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.alliance_battleship.station.tactical.description"
rank = "Ltn."
short_code = "TAC"
console = "gui/battleship/tactical.html"
manual_overview = "You run the battleship's formidable weapons suite: fore and aft phasers, a heavy forward blaster, and a six-tube torpedo battery. Lock targets, manage tube loading and volley patterns, and match phaser frequency to enemy shields. There is a lot of firepower to conduct here — prioritise threats and keep the volume of fire up. Simplified rating auto-fires the phaser banks."

[[station.rating]]
name = "Std"
automated_systems = []

[[station.rating]]
name = "Simplified"
automated_systems = ["phaser-fore", "phaser-aft"]

[[station]]
id = "repair"
name = "Repair"
description = "entity.alliance_battleship.station.repair.description"
rank = "Ltn."
short_code = "ENG"
console = "gui/battleship/repair.html"
manual_overview = "You lead damage control. Dispatch repair teams to damaged systems by priority and watch the ship-wide hull picture. On a capital ship there is always something to fix under sustained fire, so triage hard: keep the guns, the drives, and the shields alive before the cosmetic damage."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "sensors"
name = "Sensors"
description = "entity.alliance_battleship.station.sensors.description"
rank = "Ens."
short_code = "SCI"
console = "gui/battleship/sensors.html"
manual_overview = "You are the ship's eyes. Sweep the long-range radar, identify and classify contacts, and feed target designations to Tactical so the guns are always working the right threat. On a big ship in a big fight, your early warning is what keeps the crew ahead of the enemy."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "shields"
name = "Shields"
description = "entity.alliance_battleship.station.shields.description"
rank = "Ens."
short_code = "SHD"
console = "gui/battleship/shields.html"
manual_overview = "You run the shield grid, a dedicated station on a ship this size. Focus an arc to reinforce it against the bearing of incoming fire, watch each facing's HP and regeneration, and rotate focus as the enemy shifts their aim. The generated Shields section below reads this ship's actual arc strength and regen rate."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "navigation"
name = "Navigation"
description = "entity.alliance_battleship.station.navigation.description"
rank = "Ens."
short_code = "NAV"
console = "gui/battleship/navigation.html"
manual_overview = "You plot the ship's course. Set waypoints on the system chart for the Helm to follow and clear them onto new headings as the mission develops. A battleship handles slowly, so give the Helm plenty of warning and think several moves ahead of the current position."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "power"
name = "Power"
description = "entity.alliance_battleship.station.power.description"
rank = "Ltn."
short_code = "PWR"
console = "gui/battleship/power.html"
manual_overview = "You manage the reactor. Allocate power between helm, weapons, and sensors to match the tactical situation, and watch the battery reserve during heavy weapons fire. On a capital ship the demands are constant and competing — read the battle and shift power to wherever the crew needs it most."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "comms"
name = "Comms"
description = "entity.alliance_battleship.station.comms.description"
rank = "Ens."
short_code = "COM"
console = "gui/battleship/comms.html"
manual_overview = "You handle communications. Hail contacts, read and answer incoming traffic, and keep the captain and crew informed of mission developments. On a capital ship you are the link between the bridge and everyone else in the sector — stay on top of the message queue and flag anything urgent."

[[station.rating]]
name = "Std"
automated_systems = []


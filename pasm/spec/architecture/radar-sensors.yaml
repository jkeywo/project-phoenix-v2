entities:
  - component: radar-projection-service
    core:
      status: implemented
      confidence: confirmed
      title: Shared Radar Projection Service
      summary: Builds range-, visibility-, and presentation-filtered radar contact projections for Helm, Tactical, Sensors, navigation, and the viewscreen.
    architecture:
      kind: projection-service
      authority: authoritative
      owns: [radar-contact-projection-state]
      reads: [authoritative-ship-motion-state, ship-modifier-state]
      produces: [radar-contact-projection-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/radar.rs, src/radar_config.rs, src/gui/radar.rs, src/server/radar.rs, gui/radar-widget.js]
      tests: [cargo test, npx vitest run]

  - state: radar-contact-projection-state
    core:
      status: implemented
      confidence: confirmed
      title: Radar Contact Projection State
      summary: Derived contact positions, appearance, range and selection eligibility for each consuming radar surface; it is not a second authoritative entity store.
    architecture:
      classification: replicated
      owner: radar-projection-service
      derived_from: [authoritative-ship-motion-state, ship-modifier-state]
    implementation:
      status: declared
      paths: [src/radar.rs, src/radar_config.rs, src/core/messages.rs, gui/radar-widget.js]

  - component: sensors-target-controller
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Controller
      summary: Applies admitted SetScienceTarget/ClearScienceTarget commands for human and AI origins alike, storing each ship's selected Sensors contact and emitting a channel-3 target designation for Tactical on every set (never on a clear).
      rationale:
        - "Issue #828: the single applier for both origins — the Sensors AI (operate_sensors_ai) emits admitted payloads through validate_and_admit, so no direct AI write into sensors-target-state exists. The handler (handle_sensors_messages) runs in SimSet::Physics (moved from Input) ordered after the AI emit: admission clears AdmittedCommands before Input each tick, so the applier must consume same-tick after the emit or AI commands would be silently lost."
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [sensors-target-state]
      reads: [system-control-source-state, radar-contact-projection-state]
      writes: [sensors-target-state]
      sends: [sensors-target-designation]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, gui/components/ph-sensor-radar.js]
      tests: [cargo test, npx vitest run]

  - state: sensors-target-state
    core:
      status: implemented
      confidence: confirmed
      title: Sensor Radar Selection State
      summary: Per-ship Science Target UUID owned by the sensor radar, written only through Admission (issue #828) and read only by the sensor-radar publisher (issue #829) — no other module imports the component. The sensor-radar blackboard replicates it as selected_target, and the viewscreen aggregator lifts it to science_target.
      rationale:
        - "Issue #829 renamed SensorsTarget to SensorRadarSelection and made it radar-owned: cross-system consumers read the viewscreen Science Target fact, never this live selection (spec §3)."
    architecture:
      classification: authoritative
      owner: sensors-target-controller
      writers: [sensors-target-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]
      symbols: [SensorRadarSelection]

  - state: tactical-radar-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Radar Blackboard State
      summary: Per-ship tactical-radar blackboard carrying the Combat Lock (selected_target) plus the tactical radar blips and region overlays, which moved off the Weapons blackboard (issue #829).
      rationale:
        - "Issue #829: publish_tactical_radar_blackboard (SimSet::Publish) writes selected_target for every ship from that ship's TacticalRadarSelection component; blips/regions are computed for the LocalShip only. This system is the tactical radar authority and is the only reader of the live selection besides its writers (handle_set_target, ai_target_selection, kill-clears, revalidation, comms RemoveFactionEnemy) and debug_overlay."
        - "Spec-compliance follow-up: publish_weapons_core_blackboard, publish_phaser_bank_blackboards and compute_current_weapons_update were missed by #829 and still read the live TacticalRadarSelection. All three now read ViewscreenBlackboard.combat_lock, closing the last §3 breach. The two SimSet::Publish publishers therefore see last tick's lock (spec §1 one-tick lag); compute_current_weapons_update runs in SimSet::Broadcast, after the PublishAggregate aggregator, so it sees the current tick's."
    architecture:
      classification: derived
      owner: tactical-weapons-controls
      derived_from: [weapons-target-state, radar-contact-projection-state]
    implementation:
      status: declared
      paths: [src/console/weapons/blackboard.rs, src/core/messages.rs, gui/console-state.js]
      symbols: [TacticalRadarBlackboard]
      tests: [cargo test, npx vitest run]

  - state: sensor-radar-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Sensor Radar Blackboard State
      summary: Per-ship sensor-radar blackboard carrying the Science Target (selected_target), mirrored from SensorRadarSelection and lifted by the viewscreen aggregator into science_target (issue #829).
    architecture:
      classification: derived
      owner: sensors-target-controller
      derived_from: [sensors-target-state]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, gui/console-state.js]
      symbols: [SensorRadarBlackboard]

  - message: sensors-target-designation
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Designation
      summary: Channel-3 coordination payload carrying the Sensors-selected contact UUID and label to Tactical; it advises and does not replace Tactical target authority.
    architecture:
      authority: request
      producer: [sensors-target-controller]
      consumer: [inter-system-message-router]
      payload: TargetDesignation
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, src/ship_plugin.rs]

  - component: sensors-frequency-advisor
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Frequency Advisor
      summary: Observes Tactical's locked target and sends Tactical a shield-frequency hint when the target or observed frequency changes; ships running AI-high-fidelity Sensors under AI control instead hand off to a delayed AI variant.
      rationale:
        - "Issue #692 scoped this immediate readout to skip ships that carry AiHighFidelity with Sensors under AI control (operate_ai policy). Those ships instead run the new ai_frequency_hint system in src/console_ai/server.rs, which wires the previously-orphaned console_ai::core::tick_frequency_hint pure function to replicate a Low-complexity operator's reaction delay rather than this system's immediate readout. Human-held Sensors, the common case for the player ship, is unaffected."
    architecture:
      kind: coordination-producer
      authority: authoritative
      reads: [weapons-target-state, shield-arc-state]
      sends: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]
      symbols: [tick_sensors_frequency_hint]
      tests: [cargo test]

  - component: sensors-frequency-advisor-ai-delayed
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Frequency Advisor (AI Delayed Variant)
      summary: AI-controlled Sensors companion to sensors-frequency-advisor that replicates a Low-complexity operator's reaction delay before sending Tactical a shield-frequency hint, for ships running AiHighFidelity with Sensors under AI control.
      rationale:
        - "Issue #692 wires the previously-orphaned console_ai::core::tick_frequency_hint pure function into this Bevy system; it previously had no caller anywhere in the codebase."
    architecture:
      kind: coordination-producer
      authority: authoritative
      reads: [weapons-target-state, shield-arc-state]
      sends: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/console_ai/core.rs]
      symbols: [ai_frequency_hint, tick_frequency_hint, ShipFrequencyHintState]
      tests: [cargo test]

  - component: sensors-radar-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Radar Publisher
      summary: Publishes every Ship entity's own Sensors blackboard (player and NPC alike) — its own damage-scaled radar range and selected target — with the player-only authored show/select filters gated on the local ship.
      rationale:
        - "Issue #828 (per-Ship publish, following the #824 helm / #826 shields precedent): split on Has<LocalShip>. The local ship's base range stays the console config; an NPC's base follows effective_sensor_range's preference order (its own AiProfile.sensor_range, console config only as fallback), each scaled by that ship's own SensorRadarRange modifier. radar_shows/radar_selects come from ShipClientConfigResource, which describes the local player's hull only, so NPCs get empty filters — they don't render a radar."
    architecture:
      kind: blackboard-publisher
      authority: authoritative
      reads: [sensors-target-state, ship-modifier-state]
      writes: [ship-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]

  - component: sensors-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Sensors AI Operator
      summary: Per-ship decide-and-emit Sensors AI with three priority tiers — mirror the ship's combat lock, resolve a named Destroy objective, or independently select the nearest faction-hostile — all bounded by the ship's own damage-scaled sensor horizon, emitting the decision as an admitted SetScienceTarget/ClearScienceTarget command on change only.
      rationale:
        - "Issue #828 (admission symmetry, following the #824 helm / #826 shields precedent): operate_sensors_ai keeps its selection logic but no longer writes sensors-target-state directly. It emits through the shared command_admission::validate_and_admit seam using its ship's own ai:<uuid> token, validated against that entity's own ControlSourceResolver (operate_ai must hold); sensors-target-controller applies it later the same tick. Emit-on-change means an AI selection now produces exactly one channel-3 target designation per change — previously the AI bypassed the applier and produced none."
        - "Issue #746 added the independent horizon-limited hostile-selection tier (priority 3, the fallback below the combat-lock mirror and Destroy-objective tiers). When neither higher tier yields a detectable target, operate_sensors_ai builds a WorldView over the ship's own faction/position snapshot and calls ai::core::find_nearest_hostile, gating the result on the same damage-scaled effective_sensor_range as the other tiers. The pick is advisory only — it flows through the same SetScienceTarget path a human uses and never mutates weapons-target-state, so Tactical keeps firing-target authority. A selected hostile that leaves the (possibly damage-shrunken) horizon or despawns yields no tier and is dropped via ClearScienceTarget."
        - "This entity absorbs the formerly separate sensors-target-selection-ai proposal: gating, horizon, selection, and emission are all one system (operate_sensors_ai)."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, ship-system-blackboards-state, weapons-target-state, sensors-target-state]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/ai/core.rs]
      symbols: [operate_sensors_ai, emit_sensors_ai_command, effective_sensor_range, find_nearest_hostile]
      tests: [cargo test]

  - component: sensors-target-selection-ai
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Selection AI
      summary: Per-ship AI selection policy that chooses an appropriate hostile within the Sensors system's own damage-scaled horizon and lets the existing advisory paths inform Tactical; realized by the same operate_sensors_ai system as sensors-ai-operator.
      rationale:
        - "Issue #828 folded this proposal into sensors-ai-operator: one system (operate_sensors_ai) carries the gating, the horizon, and the selection, and it emits admitted commands through host-command-admission rather than writing sensors-target-state directly — sensors-target-controller performs the write and sends the target designation when the admitted set applies. Kept as a named entity because design-slice links (sensors.yaml roles/decisions) reference it."
        - "Issue #746 realized the independent selection this policy names: the operate_sensors_ai priority-3 tier calls ai::core::find_nearest_hostile over the ship's own faction/position snapshot and gates the winner on effective_sensor_range, so the ship picks its own nearest in-horizon enemy rather than only echoing Tactical's lock or an objective name. The choice is designated to Tactical as advisory intelligence and never becomes a firing lock (weapons-target-state is untouched). Tests cover horizon damage scaling, hostility, target loss, and per-ship isolation."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, radar-contact-projection-state, ship-system-blackboards-state]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/ai/core.rs]
      symbols: [operate_sensors_ai, find_nearest_hostile]
      tests: [cargo test]

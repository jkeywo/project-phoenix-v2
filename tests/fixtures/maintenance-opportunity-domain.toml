[domain]
format=1
id="maintenance-operators"
exports=["restore-room","deliver-parts"]
requires=["repair_internal","delivery_local"]

[[task]]
kind="primitive"
id="restore-room"
parameters=[{name="actor",kind="actor"},{name="owner",kind="system"},{name="team",kind="team"},{name="visit",kind="repair_request"},{name="target",kind="repair_target"},{name="goal",kind="repair_goal"}]
definition="useful-restoration"
[task.request]
kind="repair"
actor={source="parameter",name="actor"}
owner={source="parameter",name="owner"}
team={source="parameter",name="team"}
request={source="parameter",name="visit"}
target={source="parameter",name="target"}
goal={source="parameter",name="goal"}

[[task]]
kind="primitive"
id="deliver-parts"
parameters=[{name="actor",kind="actor"},{name="owner",kind="system"},{name="from",kind="store"},{name="to",kind="store"},{name="resource",kind="commodity"},{name="amount",kind="quantity"}]
definition="parts-received"
[task.request]
kind="delivery"
actor={source="parameter",name="actor"}
owner={source="parameter",name="owner"}
source={source="parameter",name="from"}
destination={source="parameter",name="to"}
commodity={source="parameter",name="resource"}
amount={source="parameter",name="amount"}

[[situation_definition]]
id="useful-restoration"
initial="useful"
[[situation_definition.state]]
id="useful"
when={kind="achieved"}
call={script="tests/fixtures/optional-maintenance-world.toml#script.setup",function="complete_optional"}

[[situation_definition]]
id="parts-received"
initial="received"
[[situation_definition.state]]
id="received"
when={kind="received"}

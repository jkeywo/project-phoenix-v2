  - component: repair-team-cycle-policy
    core:
      status: implemented
      confidence: confirmed
      title: Repair Team Cycle Policy
      summary: Repair teams travel to a target, repair at authored rate while on site, then return; Core is a valid repair target alongside station-owned systems.
      rationale:
        - "Issue #785 pinned the cycle's intra-Physics ordering explicitly: operate_repair_ai (decide/emit) → handle_dispatch_repair_team + handle_set_repair_priority + handle_set_repair_target_priority (apply) → tick_repair_teams (advance). #830 had pinned only the first edge, leaving tick_repair_teams ambiguous against the appliers even though all three mutate ShipRepairTeams; Bevy's parallel executor then serialised them run-varyingly, and a dispatch landing BEFORE the tick let a Returning { remaining } slot hit remaining <= 0 and flip straight to Travelling instead of staying Returning. That system-order ambiguity — not map iteration order — was the root cause of the intermittent all_busy_teams_ignore_further_dispatches failure. RepairPlugin::build now declares tick_repair_teams .after(handle_dispatch_repair_team).after(handle_set_repair_priority).after(handle_set_repair_target_priority), matching the .chain() its own npc_repair_app fixture already used, so the cycle advances deterministically every tick."
        - "[ai] Issue #1385 adds the FOURTH applier, handle_recall_repair_team, to that same list: tick_repair_teams is declared .after it as well. The #785 rule is every ShipRepairTeams applier before the advance, not those three by name, and a new verb that writes the component joins it. The recall's load-bearing pair is this edge rather than any pair inside the applier tuple: a recall admitted on the tick a team would otherwise arrive resolves recall-first to Returning { remaining: elapsed } — the walk out so far, less this tick's advance — and tick-first to a team that LANDED (Repairing, which also opens issue #737's on-site information gate and on_site_systems for that tick) and then walks home the full travel_duration. Different slot, different arrival time and a different visibility projection from identical input, i.e. a digest divergence between two hosts of one fleet, which no ambiguity check in this repo would have caught."
        - "[ai] Issue #1385 also CHAINS the applier tuple itself in register_repair_dispatch (dispatch → recall → set_priority → set_target_priority) instead of pinning one pair. Grouping four systems that all take &mut ShipRepairTeams orders none of them, and the order is observable because handle_set_repair_target_priority resolves WHICH SLOT it writes out of that same component: RepairTeams::prioritise_system → priority_team_for_system takes the first Repairing slot whose sweep group covers the tapped system and whose sweep_candidates — built against the on_site_systems() exclusion set — still contain it. With two teams on site in one group and a third damaged system C, a same-tick RecallRepairTeam { team_idx: 0 } + SetRepairTargetPriority { C } pins team 0 and loses the pin with the recalled slot if the tap runs first, and pins team 1 if the recall runs first (its system leaves the occupied set). priority_system_id steers next_sweep_target, so team 1 repairs a DIFFERENT system next and the divergence reaches EntitySystemHull and the digest — the same #785 class as the tick edge above, and it already existed for dispatch vs. set_target_priority before the recall verb was added. Chaining closes both holes; the chosen order is the intended reading, where a recall undoes an order the player can see including one given on this very tick."
    architecture:
      kind: lifecycle-policy
      authority: authoritative
      reads: [repair-team-state, authoritative-damage-state, ship-modifier-state]
      writes: [repair-team-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/repair_teams.rs, src/console/repair/server.rs]
      symbols: [RepairTeams, tick_repair_teams]
      tests: [cargo test]


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phoenix — Model Viewer</title>

  <!-- Same build settings as server.html: Trunk's bundled wasm-opt rejects
       WASM emitted by newer Rust toolchains, so it is disabled here too. The
       viewer is a dev tool, so no -Oz post-build pass is wired up at all. -->
  <link data-trunk rel="rust" data-wasm-opt="0"
        data-cargo-no-default-features data-cargo-features="viewer" />
  <!-- Deliberately NO `rel="copy-dir"` for assets. server.html copies the whole
       tree, but that is ~300 MB and Trunk's staging rename of it fails on
       Windows (`os error 5`). Instead `scripts/link-viewer-assets.mjs` points
       dist-viewer/assets at the real assets/ directory, so the viewer reads
       models and shaders straight from the repo — nothing to copy, and an
       edited .wgsl is live on the next reload. -->

  <style>
    :root {
      --bg: #07080d;
      --panel: rgba(14, 18, 28, 0.92);
      --border: #26304a;
      --text: #c8d4ea;
      --muted: #7d8aa6;
      --accent: #4ea3ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #canvas { display: block; width: 100vw; height: 100vh; outline: none; }

    #panel {
      position: fixed; top: 12px; left: 12px; width: 290px;
      max-height: calc(100vh - 24px); overflow-y: auto;
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px;
      backdrop-filter: blur(8px);
    }
    #panel h1 {
      margin: 0 0 10px; font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); font-weight: 600;
    }
    fieldset {
      border: 0; border-top: 1px solid var(--border);
      margin: 14px 0 0; padding: 10px 0 0;
    }
    legend {
      padding: 0 6px 0 0; font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
    }
    label { display: block; margin: 8px 0 3px; color: var(--muted); font-size: 11px; }
    select, input[type="range"], input[type="color"] { width: 100%; }
    select {
      background: #10141f; color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 5px 6px;
    }
    input[type="range"] { accent-color: var(--accent); margin: 0; }
    input[type="color"] {
      height: 26px; padding: 0; border: 1px solid var(--border);
      border-radius: 4px; background: #10141f;
    }
    .row { display: flex; align-items: center; gap: 8px; }
    .row > span { flex: 0 0 52px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
    .modes { display: flex; gap: 4px; margin-top: 4px; }
    .modes button {
      flex: 1; padding: 6px 0; cursor: pointer;
      background: #10141f; color: var(--muted);
      border: 1px solid var(--border); border-radius: 4px;
      font: inherit; font-size: 11px;
    }
    .modes button[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: #05080f; font-weight: 600;
    }
    .check { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--text); }
    .check input { accent-color: var(--accent); }
    #hint { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.6; }
    #status {
      position: fixed; bottom: 12px; left: 12px;
      color: var(--muted); font-size: 11px;
    }
    #status.error { color: #ff7a7a; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="panel">
    <h1>Model Viewer</h1>

    <label for="model">Model</label>
    <select id="model"></select>

    <label for="variant">Rig variant</label>
    <select id="variant"><option value="">(base)</option></select>

    <fieldset>
      <legend>Lighting</legend>
      <div class="modes" id="modes">
        <button data-mode="off" aria-pressed="false">Off</button>
        <button data-mode="ambient" aria-pressed="true">Ambient</button>
        <button data-mode="directional" aria-pressed="false">Directional</button>
      </div>

      <label for="ambientColor">Ambient colour</label>
      <input type="color" id="ambientColor" value="#998c80" />

      <label for="ambientBrightness">Ambient brightness</label>
      <div class="row">
        <input type="range" id="ambientBrightness" min="0" max="2000" step="10" value="300" />
        <span id="ambientBrightnessOut">300</span>
      </div>

      <label for="illuminance">Directional illuminance</label>
      <div class="row">
        <input type="range" id="illuminance" min="0" max="50000" step="250" value="10000" />
        <span id="illuminanceOut">10000</span>
      </div>

      <label for="yaw">Directional yaw</label>
      <div class="row">
        <input type="range" id="yaw" min="-3.14" max="3.14" step="0.01" value="-0.6" />
        <span id="yawOut">-0.60</span>
      </div>

      <label for="pitch">Directional pitch</label>
      <div class="row">
        <input type="range" id="pitch" min="-1.57" max="1.57" step="0.01" value="-0.5" />
        <span id="pitchOut">-0.50</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Environment</legend>
      <label for="skybox">Skybox brightness</label>
      <div class="row">
        <input type="range" id="skybox" min="0" max="2000" step="10" value="450" />
        <span id="skyboxOut">450</span>
      </div>
      <label class="check"><input type="checkbox" id="gizmos" /> Show rig gizmos</label>
    </fieldset>

    <div id="hint">
      Drag to orbit · right-drag to pan · wheel to zoom.<br />
      URL params: <code>?model=</code> <code>?variant=</code>
      <code>?entity=</code> <code>?lighting=</code> <code>?gizmos=1</code>
    </div>
  </div>

  <div id="status">Loading…</div>

  <script type="module">
    const params = new URLSearchParams(location.search);
    const status = document.getElementById('status');
    const setStatus = (text, isError = false) => {
      status.textContent = text;
      status.classList.toggle('error', isError);
    };

    // Trunk fires TrunkApplicationStarted and sets window.wasmBindings once the
    // bundle is instantiated. Same handshake as server.html — don't import the
    // generated .js by name, its filename is content-hashed.
    const wasm = await new Promise((resolve) => {
      if (window.wasmBindings) return resolve(window.wasmBindings);
      addEventListener('TrunkApplicationStarted', () => resolve(window.wasmBindings), { once: true });
    });

    // TOML fetching: rig sidecars and entity configs are requested by Rust and
    // delivered back through this callback. Identical to the wiring in
    // server.html — an empty string on 404 tells Rust to stop re-requesting and
    // fall back to an identity rig.
    wasm.set_world_fetch_callback((path) => {
      fetch(path)
        .then((r) => (r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status))))
        .then((toml) => wasm.wasm_push_sidecar_toml(path, toml))
        .catch(() => wasm.wasm_push_sidecar_toml(path, ''));
    });

    // Start Bevy from a fresh, NON-async task.
    //
    // `App::run()` on wasm throws a control-flow exception to unwind the Rust
    // stack while leaving the winit event loop alive. Called directly from this
    // async module script, that throw is caught by the promise machinery and
    // turned into a rejected promise — the loop never starts, the app never
    // ticks a frame, and nothing loads. `setTimeout` puts the call on a plain
    // task where the throw reaches the top level as intended. server.html gets
    // this for free by calling wasm_init() from a normal function.
    setTimeout(() => {
      wasm.viewer_init();
      setStatus('Ready');
    }, 0);

    // ── Model dropdown, from the generated index ───────────────────────────
    const modelSelect = document.getElementById('model');
    const variantSelect = document.getElementById('variant');
    let models = [];

    function populateVariants(model) {
      variantSelect.innerHTML = '<option value="">(base)</option>';
      for (const variant of model?.variants ?? []) {
        const option = document.createElement('option');
        option.value = variant;
        option.textContent = variant;
        variantSelect.append(option);
      }
      variantSelect.value = params.get('variant') ?? '';
    }

    try {
      const index = await fetch('assets/models/index.json').then((r) => r.json());
      models = index.models;
      for (const model of models) {
        const option = document.createElement('option');
        option.value = model.path;
        option.textContent = model.name;
        modelSelect.append(option);
      }
      const current = params.get('model') ?? 'assets/models/alliance_cruiser.glb';
      modelSelect.value = current;
      populateVariants(models.find((m) => m.path === current));
    } catch (err) {
      setStatus('Could not read assets/models/index.json — run the build once', true);
    }

    const loadCurrent = () => {
      wasm.viewer_load_model(modelSelect.value, variantSelect.value || undefined);
      setStatus(`Loading ${modelSelect.value}…`);
    };

    modelSelect.addEventListener('change', () => {
      populateVariants(models.find((m) => m.path === modelSelect.value));
      loadCurrent();
    });
    variantSelect.addEventListener('change', loadCurrent);

    // ── Lighting ───────────────────────────────────────────────────────────
    const modeButtons = [...document.querySelectorAll('#modes button')];
    const setMode = (mode) => {
      for (const button of modeButtons) {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      }
      wasm.viewer_set_lighting(mode);
      // The mode reset also restores default ambient/directional values on the
      // Rust side, so push the panel's current values back down after it.
      pushAmbient();
      pushDirectional();
    };
    for (const button of modeButtons) {
      button.addEventListener('click', () => setMode(button.dataset.mode));
    }

    const ambientColor = document.getElementById('ambientColor');
    const ambientBrightness = document.getElementById('ambientBrightness');
    const illuminance = document.getElementById('illuminance');
    const yaw = document.getElementById('yaw');
    const pitch = document.getElementById('pitch');
    const skybox = document.getElementById('skybox');
    const gizmos = document.getElementById('gizmos');

    // <input type="color"> is sRGB hex; the Rust side takes sRGB 0..1.
    const hexToRgb = (hex) => [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255,
    ];

    function pushAmbient() {
      const [r, g, b] = hexToRgb(ambientColor.value);
      wasm.viewer_set_ambient(r, g, b, Number(ambientBrightness.value));
    }
    function pushDirectional() {
      wasm.viewer_set_directional(
        Number(illuminance.value), Number(yaw.value), Number(pitch.value));
    }

    // Wire each slider to its readout and its wasm setter.
    const bind = (input, output, push, format = (v) => v) => {
      const sync = () => {
        output.textContent = format(Number(input.value));
        push();
      };
      input.addEventListener('input', sync);
      sync();
    };
    const fixed2 = (v) => v.toFixed(2);

    bind(ambientBrightness, document.getElementById('ambientBrightnessOut'), pushAmbient);
    bind(illuminance, document.getElementById('illuminanceOut'), pushDirectional);
    bind(yaw, document.getElementById('yawOut'), pushDirectional, fixed2);
    bind(pitch, document.getElementById('pitchOut'), pushDirectional, fixed2);
    bind(skybox, document.getElementById('skyboxOut'),
         () => wasm.viewer_set_skybox_brightness(Number(skybox.value)));
    ambientColor.addEventListener('input', pushAmbient);
    gizmos.addEventListener('change', () => wasm.viewer_set_gizmos(gizmos.checked));

    // Seed the panel from the URL and the engine's own defaults, so it opens
    // showing what is actually on screen.
    skybox.value = wasm.viewer_default_skybox_brightness();
    document.getElementById('skyboxOut').textContent = skybox.value;
    gizmos.checked = params.get('gizmos') === '1';
    setMode(params.get('lighting') ?? 'ambient');
  </script>
</body>
</html>

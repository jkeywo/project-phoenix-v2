# Rig for assets/models/alliance_courier.glb (Alliance Courier, the
# single-station player hull).
#
# Raw GLB frame: the hull runs along Z, broad stern at -Z (half-width 0.55),
# tapering to a bow at +Z (half-width 0.08). Same orientation as the
# destroyer, so the same [base].rotation of 180 deg about Y applies: it turns
# the raw +Z bow into ship-local -Z, which is Bevy's forward.
#
# Marker positions are in RAW-GLB space, not post-base space — the base rig
# (offset/rotation/scale) is applied to them at resolve time by
# ModelMarkers::resolve_world_position. So markers here read "backwards":
# engines at raw -Z end up at the ship's stern, and camera_fore at raw +Z ends
# up at the bow. [extents] below, by contrast, ARE post-base (raw * scale +
# offset).

[base]
offset = [ 0, -0.0623404, 0 ]
rotation = [ 0, 3.14, 0 ]
scale = [ 0.4, 0.4, 0.4 ]

[extents]
min = [ -0.2223608, -0.0623404, -0.3776708 ]
max = [ 0.2222476, 0.0623404, 0.379188 ]
size = [ 0.4446084, 0.1246808, 0.7568588 ]

# Engine nozzles on the broad stern (raw -Z), thrust pointing aft.
# Raw +X is the ship's PORT side: the 180 deg Y rotation maps raw +X to
# ship-local -X, and ship -X is port when forward is -Z.
[markers.engine_port]
position = [ 0.36, 0.13, -0.93 ]
direction = [ 0, 0, -1 ]

[markers.engine_starboard]
position = [ -0.36, 0.13, -0.93 ]
direction = [ 0, 0, -1 ]

# Single blaster, muzzle at the bow.
[markers.blaster_fore]
position = [ 0, 0.12, 0.9 ]
direction = [ 0, 0, 1 ]

# Bow camera. Also the viewscreen's default view: CameraView::default() is
# "camera_fore", so this marker is mandatory, not optional.
[markers.camera_fore]
position = [ 0, 0.15, 0.99 ]
direction = [ 0, 0, 1 ]

[[lod]]
max_distance = 15.0
model = "assets/models/alliance_courier.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/alliance_courier_lod1.glb"

[lod.generate]
source = "assets/models/alliance_courier.glb"
ratio = 0.95
error = 0.01
texture_size = 512
remesh_voxel_size = 0.021

[[lod]]
max_distance = 400.0
model = "assets/models/alliance_courier_lod2.glb"

[lod.generate]
source = "assets/models/alliance_courier.glb"
ratio = 0.25
error = 0.01
texture_size = 256
remesh_voxel_size = 0.021

[[lod]]
billboard = "assets/models/alliance_courier_lod3.png"
scale = [ 0.7576, 0.1247, 1.0 ]

[lod.capture]
source = "assets/models/alliance_courier.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

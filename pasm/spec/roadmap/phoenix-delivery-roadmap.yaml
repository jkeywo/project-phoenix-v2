  - state: world-snapshot-artifact
    core:
      status: accepted
      confidence: confirmed
      title: Authoritative World Snapshot
      summary: Versioned portable representation of authoritative simulation state and its content compatibility manifest, excluding transport sessions, browser UI, renderer state, and other derived presentation state.
    architecture:
      classification: authoritative
      owner: roadmap-authoritative-snapshots
      writers: [roadmap-snapshot-contract-tracer, roadmap-authoritative-snapshots]
      readers: [roadmap-falling-skyway-foundation, roadmap-deterministic-simulation-foundation, roadmap-p2p-multiship-delivery, roadmap-native-and-cloud-delivery, roadmap-borrowed-sun-content, roadmap-narrow-season-content, roadmap-broken-tithe-content, roadmap-silent-corridor-content]

# Inline equivalent of fragments/jobs/repair_workflow.toml for this baked hull.
# [ai] Structural equivalence: one existing stage per tick.
[repair.workflow]
root = "repair-job"
[[repair.workflow.tree]]
id = "repair-job"
initial = "execute"
[[repair.workflow.tree.state]]
id = "execute"
[[repair.workflow.tree.state.task]]
id = "travel"
action = { kind = "write", channel = "advance_travel", value = { source = "fact", name = "travelling" } }
[[repair.workflow.tree.state.task]]
id = "repair"
action = { kind = "write", channel = "apply_repair", value = { source = "fact", name = "repairing" } }
[[repair.workflow.tree.state.task]]
id = "return"
action = { kind = "write", channel = "advance_return", value = { source = "fact", name = "returning" } }
[[repair.workflow.tree.state.task]]
id = "external"
action = { kind = "write", channel = "apply_external", value = { source = "fact", name = "external" } }


entities:
  - component: fine-system-ai-policy-schema
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy Schema
      summary: Defines inline per-system reactive rules, optional states, explicit priorities, named parameters, typed local memory, targeting, and explicit idle declarations for every AI-capable fine system.
      rationale:
        - "[ai] AI behaviour belongs to the fine system that owns the operated capability rather than a ship-wide combat controller."
        - Stateless systems should not acquire artificial lifecycle states merely to use the common evaluator.
        - "[ai] Designer-tunable behaviour values belong in entity TOML rather than Rust branches or hidden runtime defaults."
        - Reusable behaviour fragments may compose into entity TOML before validation, but the runtime receives only the owning system's fully resolved inline policy.
        - "Issue #775 shipped the Captain schema slice: [captain_console.ai] with the red_alert boolean channel and set_red_alert verb, plus explicit idle and canonical-default synthesis (default_captain_ai_config)."
        - "Issue #779 extended the schema to the Helm travel axes: [helm_console.engines_ai] (longitudinal channel, actuate_desired_travel verb) and [helm_console.steering_ai] (yaw channel, actuate_desired_facing verb), each with idle/canonical-default synthesis (default_engines_ai_config / default_steering_ai_config). These are value-less MODE verbs — the FineSystemAiRuleToml value field is ignored because the continuous thrust/yaw magnitude lives in the DesiredMotion planner fact, never in the authored payload."
        - "Issue #780 extended the schema to the four secondary Helm fine actuators: [helm_console.lateral_ai] (lateral / actuate_lateral_thrust), [helm_console.vertical_ai] (vertical / actuate_vertical_thrust), [helm_console.impulse_ai] (impulse / engage_impulse), [helm_console.boost_ai] (boost / engage_boost), each with idle/canonical-default synthesis (default_lateral_ai_config / default_vertical_ai_config / default_impulse_ai_config / default_boost_ai_config). All value-less MODE verbs; engage-vs-cancel / continuous magnitude / capability ceiling stay host-side. Baseline-preserving defaults: lateral/vertical unconditional actuate, impulse unconditional permit, boost explicit idle."
        - "Issue #781 extended the schema to individual weapon BANKS — the first fine systems that are Vec entries, not entities. Each AI-capable phaser and blaster bank carries an inline [[weapons_console.phaser_banks]].ai / [[weapons_console.blaster_banks]].ai block: phaser banks drive the phaser_fire channel with the fire_phaser verb (PHASER_FIRE_CHANNEL/PHASER_FIRE_VERB), blaster banks the blaster_fire channel with the fire_blaster verb (BLASTER_FIRE_CHANNEL/BLASTER_FIRE_VERB). These are value-less ACTION verbs: the verb decides only WHETHER to open fire this tick; the target (the ship's authoritative combat lock), the firing bank, the beam frequency, and all thresholds (range/arc/cooldown) stay TOML on the bank config and host-side, never in the verb. Canonical-default synthesis (default_phaser_bank_ai_config / default_blaster_bank_ai_config) is an unconditional 'fire' rule so a bank without an authored ai keeps auto-firing exactly as before (AC1 baseline); an explicit idle = true is the per-bank opt-out. Because banks are Vec entries, the resolved per-bank policies attach as SHIP-LEVEL components keyed by bank id (PhaserBankAiPolicies / BlasterBankAiPolicies), not per-entity."
        - "Issue #782 extended the schema to the torpedo TWO-STAGE pipeline: individual tubes (Vec entries) plus the shared magazine. Each AI-capable tube carries an inline [[torpedoes.tubes]].ai block driving TWO channels — torpedo_load (load_torpedo verb, TORPEDO_LOAD_CHANNEL/TORPEDO_LOAD_VERB) and torpedo_launch (launch_torpedo verb, TORPEDO_LAUNCH_CHANNEL/TORPEDO_LAUNCH_VERB) — and the shared magazine carries a [torpedoes].ai block driving torpedo_magazine_grant (grant_torpedo_round verb, TORPEDO_MAGAZINE_CHANNEL/TORPEDO_MAGAZINE_GRANT_VERB). All value-less ACTION verbs: LOAD emits the same admitted SetTorpedoVolleyTarget a Tactical player sends (which the auto-load path turns into a ClaimTorpedoRound reservation), LAUNCH emits the same admitted FireTorpedo, and GRANT is resolved inside the single magazine consumer right before the authoritative claim_magazine_round. Counts/ranges/arcs stay TOML/host-side. Canonical-default synthesis (default_torpedo_tube_ai_config = unconditional load+launch; default_torpedo_magazine_ai_config = unconditional grant) preserves baseline (AC1); an explicit idle = true is the per-tube / per-magazine opt-out. Resolved tube policies attach ship-level keyed by tube id (TorpedoTubeAiPolicies); the magazine policy attaches as TorpedoMagazineAiPolicy."
        - "Issue #784 extended the schema to Power allocation via [power.ai_policy], introducing TWO NOVELTIES over every prior host. NOVELTY 1 — DYNAMIC GROUP-ID CHANNELS: the output channels are the ship's AUTHORED [power_groups.*] keys (helm/weapons/sensors/ops/...), not a fixed const slice, so a rule's `channel` is per-ship data and the valid-channel set is built at load from ship data (POWER_SET_ALLOCATION_VERB is the only verb). NOVELTY 2 — FIRST VALUE-CARRYING MAGNITUDE VERB: set_power_group_allocation carries an ABSOLUTE target level in a new FineSystemAiRuleToml `level: u8` payload (decoded in to_policy to AiPolicyVerb::SetPowerGroupAllocation(level)); every prior verb was value-less or the boolean set_red_alert. Each allocation rule declares a MINIMUM BATTERY RESERVE as an authored param referenced by its `when` guard (fact(battery_pct) >= param(min_reserve)), which is both the AC2 reserve declaration and the AC5 brownout-avoidance predicate — a below-reserve guard never fires so allocation never rises when the battery can't sustain it, replacing the retired global emergency exception. Canonical-default synthesis (default_power_ai_config) reproduces the retired helm-thrust / weapons-red-alert baseline as reserve-guarded rules, so omitting the block preserves behaviour."
        - "Issue #785 extended the schema to Repair team dispatch via [repair.selector] — the FIRST selector block that is not inside a *_console section. Repair teams are a ship-wide engineering capability whose tunables (repair_team_count / travel_duration_secs / repair_rate_hp_per_sec) already live under [repair], so the selector joins them there rather than inventing a [repair_console] table the wire never uses. It is a FineSystemAiSelectorToml (the #776 selector shape), not a FineSystemAiConfigToml channel/verb policy: repair ranks a VARIABLE candidate set (whichever stations coordination reported damaged this tick), which is selector vocabulary, whereas #783 Shields stayed on channel/verb precisely because its arcs are a fixed 4-set. The authored ranking reproduces the retired (tier desc, deficit desc) comparator: a tier ladder contributing 1000 per DamageTier ordinal step plus a banded deficit ladder contributing 100 per crossed damage-fraction band (param deficit_band_low/mid/high = 0.80/0.90/0.95), so the max deficit stack (300) is strictly below one tier step (1000) and tier always dominates. Each ladder's magnitude is its own score term's authored `weight` field — NOT a param. Issue #885 (411ace37) deleted the tier_weight and deficit_weight param DECLARATIONS the #785 synthesiser carried, because no guard ever read them: a score term writes its magnitude directly, so a param was a second indirection that could only disagree with the weight beside it. Only deficit_band_low/mid/high survive, because the score guards name them. The bands sit INSIDE the urgent range and deliberately do NOT coincide with the DamageTier thresholds (0.75/0.25 HP): because tier strictly dominates, the deficit ladder only ever discriminates WITHIN one tier, so bands placed at 0.25/0.5/0.75 would all fire together for every Disabled station (all of which are above 0.75 damage by definition) and a station at 1/100 HP would tie a station at 24/100 HP. At 0.80/0.90/0.95 the ladder splits the Disabled tier into four buckets and the nearly-dead station actually outranks the barely-disabled one; the Damaged tier's remaining span resolves on the deterministic station-id tie-break. The deficit ladder is BANDED rather than continuous because an authored score term contributes a fixed weight when its boolean guard fires — the selector has no multiplicative term; inside a band the ranking falls through to the selector's smallest-key tie-break, which is deterministic. switch_margin is 0."
        - "Issue #786 extended the schema to the Comms console via a NEW [comms_console] section carrying BOTH machines at once — the FIRST system to author a selector AND a channel/verb policy. [comms_console.selector] is a FineSystemAiSelectorToml ranking WHO to hail (sources hail-objectives + comms-contacts, COMMS_SELECTOR_SOURCES); [comms_console.ai] is a FineSystemAiConfigToml driving the single comms_respond channel with the respond_to_message verb (COMMS_RESPOND_CHANNEL/COMMS_RESPOND_VERB) deciding HOW to answer an open dialogue. The split follows the shape of the decision, not the system: hail targets are a variable per-tick candidate set keyed by REAL contact UUIDs (selector vocabulary), while dialogue responses are a fixed, small, INDEX-addressed list (the #783 Shields argument for channel/verb). respond_to_message is the SECOND value-carrying verb after #784's set_power_group_allocation, and it carries its index in a NEW, SEPARATE FineSystemAiRuleToml `response_index: u8` field rather than reusing `level` — the two address different things (a power magnitude vs. a position in a response list) and fusing them would make an authored rule's meaning depend on its verb. The section is deliberately [comms_console], NOT fields on [comms]: that block is the per-ENTITY comms RANGE, present on stations and NPCs that are merely hailable. Canonical-default synthesis: default_comms_target_selector_config reproduces the retired filter+argmax, default_comms_response_ai_config reproduces the retired channel-2 auto-response stub's decision (priority 0, when \"true\", response_index 0)."
        - "Issue #882 CLOSED this component by landing the 'optional states / typed local memory' clause that kept it proposed through twelve shipped hosts. FineSystemAiConfigToml gains three tables, all #[serde(default)]: initial_state (Option<String>), state (Vec<FineSystemAiStateToml> — id + its own rule list + its own transition list) and memory (HashMap<String,f32>, typed private memory declarations). FineSystemAiTransitionToml is priority + to + when; there is no `from` because a transition is authored inside the state it leaves. FineSystemAiRuleToml deliberately gained NO `state` field: it is deny_unknown_fields, and nesting rules under their owning state keeps a rule's owner unambiguous — so the SAME rule shape decodes identically whether authored top-level or per-state (shared decode_rules/decode_verb). BACK-COMPAT GUARANTEE: because every new field is defaulted, all twelve shipped stateless blocks parse byte-identically and decode to AiPolicy { machine: None }, pinned by every_shipped_stateless_default_still_parses_as_stateless over all fourteen canonical default_*_ai_config functions. A block that authors no `state` never enters the transition code path at all."
        - "Issue #883 is the FIRST authored doctrine on the stateful path, and it added the schema's first SECOND VERB ON AN EXISTING CHANNEL. The `yaw` channel now accepts either actuate_desired_facing (#779 — re-solve the facing against the world this tick) or the new hold_committed_heading (HELM_HOLD_COMMITTED_HEADING_VERB — fly the heading the host froze in this system's own memory(escape_heading_rad) at the last committed transition); HELM_STEERING_VERBS was that validated PAIR at #883 and has since grown to SEVEN members (see the #788-#793 bullet below). Both are value-less MODE verbs, so no heading is ever an authored payload. The distinction the second verb exists to express is that holding a CHANNEL is not holding a HEADING: a None resolution holds the last admitted steering COMMAND, and a non-zero yaw at the merge instant would keep turning for ever. assets/entities/ship_harrow_destroyer.toml is the first hull to author it, and the first hull whose helm BEHAVIOUR is content rather than shared code: [helm_console.engines_ai], [helm_console.steering_ai] and [helm_console.boost_ai] each authored the SAME three-state machine AT #883 (acquire / inbound / escape) with its own channel's rules, its own [.param] table carrying every manoeuvre threshold, and its own [.memory] declarations. That hull now runs SEVEN states per axis — #788 added recover / reenter and #789 added pressed_pivot / pressed_pass — but the per-axis mirroring is unchanged: all three machines still declare the same state ids. Three independent machines rather than one shared one is the schema's AC3 scoping made visible: they reach the same leg on the same tick by agreeing about host-seeded facts, not by reading each other."
        - "Issue #918 gave a doctrine LEG the right to decline a channel-3 request: FineSystemAiStateToml gains yields_to_arc_requests (bool, #[serde(default)] TRUE, decoded onto AiPolicyState), and the host asks AiPolicy::leg_yields_to_arc_requests(current_state) before apply_arc_bearing_request may overwrite the planner's solved facing. It is authored on the STATE rather than on the rule because the unit a designer commits a heading in is the leg; it follows that a STATELESS policy — a helm with no doctrine — has no leg to decline with and always yields, which is how #673-#684 survives unchanged with no branch anywhere on who raised the request (AGENTS.md #6). Shipped users: the broadside ring's `orbit` leg and the attack pass's `escape` leg, in both the fragment library and the two bespoke Harrow hulls; every travelling leg beside them leaves the default standing."
        - "Issues #788-#792 took the `yaw` channel from the #883 PAIR to SEVEN legal verbs, one per host-flown leg, all still value-less MODE verbs: actuate_desired_facing (#779), hold_committed_heading (#883), hold_recovery_orbit (#788, HELM_HOLD_RECOVERY_ORBIT_VERB), pivot_to_reengage (#788, HELM_PIVOT_TO_REENGAGE_VERB), hold_combat_orbit (#790, HELM_HOLD_COMBAT_ORBIT_VERB), hold_torpedo_bearing (#791, HELM_HOLD_TORPEDO_BEARING_VERB) and hold_artillery_position (#792, HELM_HOLD_ARTILLERY_POSITION_VERB). Verify the membership against HELM_STEERING_VERBS in src/entities/config.rs rather than against this list. They are deliberately NOT collapsed into fewer verbs even where the geometry overlaps, because each one names the authored PARAMETER SET its host requires: hold_recovery_orbit and hold_combat_orbit both hold a ring, but the first derives its radius from the target's own longest usable direct-fire reach plus an authored margin and is gated on the six shield-RECOVERY scalars, while the second holds a designer-authored radius and is shields-independent; pivot_to_reengage, hold_torpedo_bearing and hold_artillery_position all put the bow on the target, but the first is gated on the same six recovery scalars, the second tracks the target's LIVE position with no lead (right for a fixed tube at knife range), and the third tracks a PREDICTIVE intercept solution (right for a slow bolt with seconds of flight). Reusing a verb would have obliged a hull with no standoff doctrine to invent parameters it does not have. Every other axis keeps its single-verb slice, so a yaw verb on the longitudinal/lateral/vertical/impulse/boost channel still fails the entity load."
        - "Issues #788-#793 add three more authored-doctrine hulls beside the #883 destroyer, each a different shape of the same schema. ship_harrow_destroyer grew from three states per axis to SEVEN (#788 recover / reenter, #789 pressed_pivot / pressed_pass) across all three of its machines. assets/entities/ship_harrow_cruiser.toml (#790, extended by #791) authors TWO machines — engines_ai and steering_ai, no boost_ai — over acquire / orbit / torpedo_run. assets/entities/ship_harrow_warhawk.toml (#792) gains authored doctrine policies for the first time, having been pure legacy-fallback until then: two machines over acquire / reposition / hold, plus a bow blaster bank and (#793) an opposed fore/aft torpedo pair. The hulls are not variations on one template: the destroyer flies passes, the cruiser circles, the battleship stops and holds station, and each expresses that entirely in [helm_console.*_ai] content."
        - "Issue #792 records a CONSTRAINT the schema did not previously have to state: [helm_console.impulse_ai] idle = true is load-bearing on any hull whose held radius falls inside its own drive's cruise window. The impulse autopilot hard-overrides commanded throttle, so the warhawk commanded a dead stop at its authored artillery radius and was then flown through its own gun line by its own drive. Holding the drive idle on the hull's own fine-system policy — rather than a host branch — is what makes a station-keeping doctrine expressible at all, and this is the first shipped hull to need it. Any future hull that holds station inside impulse_engage_distance will hit the same thing."
        - "Issue #793 is the schema's first case of TWO SHIPPED DOCTRINES TAKING OPPOSITE READINGS ON PURPOSE, and the difference is worth recording because neither is a mistake. The cruiser's tube launch guard conjoins the SHIP-WIDE fact(tubes_full) — every tube at its volley_max — because its doctrine is a committed salvo: the whole battery goes into one window and a partial battery should not open one. The warhawk's two opposed tubes deliberately do NOT read tubes_full and gate on the PER-TUBE fact(loaded) instead, because its doctrine is opportunistic and per-launcher: a loaded fore tube bearing on a collapsed arc must not refuse the shot merely because the aft tube is eight seconds into a reload, which is exactly what the ship-wide reading would do and would degrade two launchers into one. Same schema, same fact vocabulary, opposite conjuncts, both correct for their hull."
        - "Issue #869 (e1898df7) REALISED the fragment clause above — 'reusable behaviour fragments may compose into entity TOML before validation' — which had been a schema promise with no implementation. Entity TOML gains an ordered `includes` key, resolved depth-first with the declaring template merged LAST, into one fully resolved document BEFORE validation and spawning. Includes do not exist at runtime: there is no lookup, no inheritance and no second control path, and EntityConfig is deny_unknown_fields so the key cannot survive parsing. Resolution is deliberately UPSTREAM of the per-instance override path rather than folded into it — see entity-template-composition-resolver in architecture/ship-entity-configuration.yaml for the reasoning and the provenance model. IMPORTANT SCOPE LIMIT: no SHIPPED hull is composed yet. The only templates that declare includes are the composition fixtures under assets/entities/fragments/ (composed_escort.toml and npc_escort_core.toml, plus the reusable ai/fleet_baseline.toml and ai/captain_red_alert_aggressive.toml they pull in). Migrating the shipped hulls onto fragments is #878, and #885 authored its ten selector-block copies INLINE and byte-identical precisely because that migration has not happened."
        - "Issue #889 (3d21957d) added the schema's per-policy CADENCE field, and it is the one field whose runtime half is deliberately not claimed. FineSystemAiConfigToml gains `evaluate_every_ticks: u32` (serde default 1 = every shared AI base tick). It is AUTHORABLE and VALIDATED — the u32 type makes a non-integer multiple a TOML type error, and validate_fine_system_ai_policy rejects 0 outright, since a policy that never evaluates is an `idle = true` declaration rather than a cadence — but it is NOT HONOURED AT RUNTIME. No host reads it; every gated decider runs on the one shared latch regardless. Nothing shipped authors a value other than the default. See ai-policy-tick-scheduler, which stays proposed for exactly this reason."
        - "Issue #885 (411ace37 then 8555e336) CLOSED PRD #774 US7 and, in doing so, retired every 'canonical-default synthesis' clause in the bullets above. The nineteen synthesisers — fourteen default_*_ai_config plus five default_*_target_selector_config — are DELETED along with every call site, and AiDeclarationMode::Strict is the DEFAULT for EntityConfig::from_toml, so an AI-capable fine system that declares neither a policy nor an explicit idle is a LOAD ERROR instead of having behaviour invented for it. Read the earlier bullets' `default_*` references as historical provenance — they record what the retired synthesiser produced and therefore what the authored blocks had to reproduce — not as a live fallback. The migration was proved behaviour-preserving both ways: every authored block decodes to exactly what its synthesiser produced, checked through the real spawner on every shipped hull, and a component-set diff across all ten hulls showed no drift. src/entities/ai_declaration_manifest.rs is the ledger: EXPECTED_UNDECLARED is now empty and UNDECLARED_HIGH_WATER_MARK is 0, and the module deliberately distinguishes the burn-down that was AUTHORING (206 → 174 → 124 → 0) from the one step that was mere DELETION (the two raider hulls #892 retired, which brought nothing closer to US7)."
        - "Issue #885 records ONE deliberate hole in the model, and the code says so at the site. The implicit phaser bank a ship receives when it authors none has no TOML entry, so it has nowhere to carry a policy; it still fires on readiness alone. That is outside the declaration model rather than an undeclared slot inside it. Separately, the four selectors with no idle lever (Sensors, Navigation, Repair, Comms-hail) still have no way to say 'deliberately does nothing' in the schema — FineSystemAiSelectorToml has no idle field and no sibling of the Tactical radar's [weapons_console] selector_idle. #885 answered that by AUTHORING all fifty selector blocks rather than by widening the schema, because the project owner ruled US7's operative reading is 'nothing is silently synthesised' — an out-of-band idle field would still have left the selector built and attached from a Rust default. The gap remains real for anything NEW that wants to opt out."
        - "Issue #875 CONSUMED the #869 fragment mechanism for the first time on shipped content, and the SCOPE LIMIT recorded in the #869 bullet above is now stale: assets/entities/alliance_destroyer.toml is a composed hull. The library under assets/entities/fragments/ai/ is fleet_baseline.toml (promoted from #869/#885b fixture to the ship-level spine — the five target selectors, Shields focus, Power allocation, Comms response and the three secondary helm axes), captain_alliance.toml (the Alliance red-alert doctrine, parameterised by combat_window_secs and alert_on_hostile_within), and movement_attack_pass.toml (a CLASS movement doctrine: the engines/steering/boost triple over shadow / acquire / inbound / escape / recover / reenter). A hull writes `includes` and a `param` table and nothing else."
        - "Issue #875 records the GRANULARITY the library is forced into, and it is #911 merge semantics rather than taste. Arrays with no stable identity — *.ai.rule, *_ai.state[].transition, *.selector.score — still replace wholesale on compose, so ONE FRAGMENT MUST OWN AN ENTIRE POLICY BLOCK; two fragments cannot each contribute a rule to the same policy. All specialisation therefore runs through the `param` table, which is an ordinary table and deep-merges. That constraint is what makes the AC1 knobs (aggression = commit_range / approach_speed / escape_duration_secs, safe-range = safe_range_margin, posture = press_posture) parameters rather than rule overrides. The FIRE GATE knob is the one that stayed on the hull: min_alert_to_fire lives on each bank's and tube's own .ai block, and those arrays merge by `id`, so a shared fragment could only name bank ids it cannot know and an unmatched id would APPEND a weapon with no geometry."
        - "Issue #875 states the CONTRACT a class movement fragment owes, because both halves are silent failures. A movement fragment REPLACES the baseline's three travel axes whole, which means it must author `rule = []` on Engines and Steering (a policy carrying both top-level rules and states is rejected by validate_fine_system_ai_policy) and `idle = false` on Boost (idle is mutually exclusive with state and deep-merges as a plain scalar, so an inherited idle Boost would either reject the machine or, if the states were dropped instead, compose into a hull that validates, spawns and never boosts). authored_ai_pins::boost_is_the_only_idle_baseline_and_two_hulls_depart_from_it is the assertion that notices."
        - "Issue #875 added the movement POSTURE fact, the first fact derived from a ship's own bridge state rather than from geometry. POSTURE_FACT (`posture`) is seeded by helm_ai::seed_helm_actuator_facts — the ONE seeder every helm policy host calls, which is what makes it available to transition guards and per-state rule guards alike on all seven hosts — as an ORDINAL: 0.0 DEFENSIVE, 1.0 PRESSED, read off HelmAiShipFrame::red_alert, which is folded once per shared tick from ShipRedAlert for the same reason hostile_arc_exposure is. It is deliberately a DIFFERENT NAME from the weapons' fact(red_alert) fire gate (#872): that one means 'the captain has authorised fire' and this means 'which movement doctrine is licensed', and a hull that later wants to press without being weapons-free retunes one without disturbing the other. Seeded ALWAYS and never conditionally — an absent fact makes every comparison false, which reads exactly like DEFENSIVE and would hide a never-wired-up posture. A doctrine compares it against its own authored press_posture, never a literal, so a future intermediate rung touches no guard."
        - "Issue #875 found and closed a PRECEDENCE hole that composition would otherwise have opened. PRD #774 stories 10/11 require a captain's Navigation waypoint to redirect a backfilled ship at any time, and that held for free only while every player hull flew ordinary doctrine travel — helm_ai_decision reads the cleared waypoint, and the pass arms in helm_motion_planner are a SUBSTITUTION for that call. The fallback pass_legs arm is the sharp one: it fires in any state that resolved no other leg verb, so even a hull resting in its defensive leg would have kept closing while its orders went unflown. helm_planner::pass_under_navigation_orders now stands the WHOLE surface down (every leg, not `active` alone) when the cleared waypoint names a destination OTHER than the manoeuvre's own target — upstream of every leg, so 'at any time' means at any time. It reads the ONE shared waypoint component both the human console and operate_navigation_ai write, so it branches on the ORDER — specifically on its destination — and never on its origin (AGENTS.md #6)."
        - "Issue #875 records WHY that precedence reads the waypoint's DESTINATION rather than merely its presence, because presence alone was tried first and was wrong. NavigationWaypoint has two writers, and the second is the ship's own operate_navigation_ai, which waypoints the top Helm-relevant Destroy target ANCHORED to it whenever the directive names one. Backfill automates every station-owned system, so on any hull declaring a navigation system — every Alliance hull does, no Harrow hull does — a mission that names a Destroy target puts a cleared waypoint on the ship's own helm and LEAVES it there (NavigationWaypoint::set is idempotent for an anchored target that merely moves, so the generation never bumps and the clearance never lifts). A presence gate therefore had a hull's own backfilled Navigation cancel its own backfilled Helm's class doctrine on every such mission, permanently. HelmAiShipFrame::nav_waypoint_anchor carries the anchored source_uuid alongside the position so the planner can tell a redirection from the ship's own Navigation agreeing with it; a Free waypoint anchors to nobody and is always a redirection. Proved by headless_runner::a_targeted_destroy_objective_does_not_cancel_the_hulls_own_attack_pass over assets/worlds/probe_targeted_pass.toml — the pure unit tests over pass_under_navigation_orders structurally cannot see it, and probe_duel.toml authors an UNTARGETED Destroy, which is the one shape that never reaches the nav operator's objective arm."
        - "Issue #875 UNDER-CLAIMS the reach of that precedence, against an earlier draft of this bullet that said it also changed behaviour for the four hand-authored Harrow doctrines. It cannot. No Harrow hull declares a `[[system]]` of kind navigation, so control_source::source_for returns the Human default, operate_navigation_ai skips the ship, and no admitted SetNavigationWaypoint can reach a system the hull does not declare — cleared_nav_waypoint is permanently None on a Harrow. The four Harrow doctrines share the hole in code and cannot reach it today. That is why their headless coverage stayed green through this change on merit rather than by luck."
        - "Issue #875 leaves AC7 — 'every fact the authored policies read has a human-visible console counterpart, or a gap is filed' — UNMET AS A MECHANISM. There is no fact-to-console mapping, test or document anywhere in the repository; the enumeration was done by hand and filed against #880. Also unmet: the issue's architecture-review gate on the fragment-library interface is a human decision and is not claimed here."
        - "Issue #876 added the library's SECOND class movement doctrine and composed the player battleship onto it. assets/entities/fragments/ai/movement_artillery.toml is the gun line — engines_ai and steering_ai over shadow / acquire / reposition / hold, posture-gated exactly as movement_attack_pass.toml is — and assets/entities/alliance_battleship.toml takes it with `includes` plus a TWO-KEY param table per axis (max_artillery_range / artillery_hold_range) and nothing else. The envelope is the only thing the hull specialises because the envelope is the only thing that belongs to the hull: it comes in from the class default 200/180 to 50/45 because this ship's artillery piece is a 50-unit heavy bow blaster rather than a 200-unit gun, and authored_ai_pins::the_battleship_tunes_the_artillery_envelope_to_its_own_gun asserts that RELATION (both axes agree, inner below outer, outer not past the longest blaster's own range) rather than the numbers."
        - "Issue #876 AMENDS the #875 movement-fragment contract in one direction and extends it in another, and both are recorded on fleet_baseline.toml itself. `rule = []` on Engines and Steering is owed by EVERY movement fragment — a class doctrine is a machine on both travel axes or it is not one. `idle = false` on Boost is owed ONLY by a fragment that SUPPLIES a boost machine: a doctrine with no boost leg (a gun line: lighting a drive abandons the firing position) says so by leaving the block alone, and the hull keeps the baseline's honest `idle = true`. That is why boost_is_the_only_idle_baseline_and_two_hulls_depart_from_it still names two hulls after this issue rather than three. The EXTENSION is Impulse: movement_artillery.toml replaces [helm_console.impulse_ai] with an explicit idle, and must author `idle = true` AND `rule = []` together, because `idle` deep-merges as a plain scalar over the baseline's unconditional permit and an idle policy carrying an inherited rule is the same contradiction validate_fine_system_ai_policy rejects from the other side. #792's finding — the impulse autopilot hard-overrides commanded throttle, so a hull whose hold band lies inside the drive's cruise window sails through its own gun line — is now a property of the DOCTRINE rather than of one hand-authored hull, and authored_ai_pins::the_composed_battleship_holds_its_impulse_drive_idle asserts both the declaration and the band-inside-the-window inequality that makes it load-bearing."
        - "Issue #876 AC1 IS DELIVERED: the player CRUISER flies a broadside orbit, and the account that stood here saying it could not is superseded. assets/entities/fragments/ai/movement_broadside_orbit.toml is the class doctrine — two copies of one posture-gated machine over shadow / acquire / orbit / torpedo_run on engines_ai and steering_ai, no boost_ai and no impulse_ai — and assets/entities/alliance_cruiser.toml adopts it with an includes line and FOUR param keys across TWO axes: combat_orbit_range 22 and combat_orbit_speed 0.7 on Steering, which is the axis the host reads the fighting ring off, plus torpedo_run_range 25 restated on BOTH Steering and Engines. The Engines restatement is not redundancy. No Rust reads torpedo_run_range; it is referenced only by the orbit state's own entry guard, and that state exists on both axes because they are two independent copies of one machine that agree by reading the same facts rather than by sharing state — a copy left on the class default of 50 would break its ring at a different range from the other and the two axes would disagree about which leg they are flying. the_torpedo_run_opens_on_a_loaded_salvo_and_closes_on_the_hulls_own_armament exists to pin exactly that, asserting the two copies agree before it asserts anything else. The CONTROL claim that once stood here is confirmed withdrawn: the orbit's correction is proportional with no integral term, so the ring settles slightly OUTSIDE the authored radius at r * (r - R) = v * R * tracking_full_steer_rad / (max_yaw_rate * gain), and there is no controller defect. What actually blocked AC1 was neither control nor arc GEOMETRY but CHANNEL 3. tick_weapons_arc_request raises an ArcBearingRequest for the first weapon family that has the target in reach and cannot bear; a torpedo's reach is speed * lifespan (300 units on this hull) so the tube family is effectively never out of reach, and a settled ring holds the target at exactly 90 degrees by construction — a circular path makes the heading the tangent — so all three of this hull's 90-degree fore/aft tubes are permanently out of arc. apply_arc_bearing_request does not BIAS the doctrine's facing, it OVERWRITES steering with a bow-on tracking solution after the planner has solved the ring tangent, for every yaw verb including hold_combat_orbit. Measured, and the figures belong to TWO DIFFERENT configurations that an earlier draft of this bullet fused into one. Plain ring, radius 32, throttle 0.6, torpedo leg made unreachable, 30 s of probe_aggressor: the fore tubes report Ready on 3 of 901 published readiness ticks and OutOfArc on 807, and the engagement inverts from the uncomposed hull's 64 dealt / 0 taken to 50 dealt / 136 taken. The separate 7.8-unit sawtooth figure is the SHIELD-GATED ring-22 variant — the one whose torpedo_run entry also conjoined fact(target_facing_shield_down) — and belongs to the paragraph below about why that conjunct is omitted, not to the plain ring. The fix is a DOCTRINE decision rather than a precedence rule. evaluate_family_arc_request emits nothing for a family in which some emitter is READY, so the torpedo_run leg — entered on fact(tubes_full) and fact(tubes_fillable) inside an authored torpedo_run_range, left on the salvo being spent, the battery being gone or the target being lost, each armament exit conjoined with fact(torpedoes_in_flight) < 1 — satisfies the request by flying the hull's own doctrine. Those four facts are seeded on every ship every shared tick by seed_torpedo_opportunity_facts and are TRANSITION-scope only, which is why every rule in the fragment is unconditional. Result on probe_aggressor over 30 s at the shipped ring 22 / throttle 0.7: the fore tubes recover to Ready on 446 of 548 published readiness ticks and OutOfArc on 11, against 3 of 901 for the plain ring above (the denominators differ because the tactical blackboard publishes on change); the sawtooth is gone, the range holding 21.8-22.0; and the engagement goes to 67 dealt / 0 taken. That is a real IMPROVEMENT on the uncomposed hull, which is 64 dealt / 0 taken on this probe and not the 62 an earlier draft of this bullet claimed the composed hull returns to — that 62 was the composed hull at the withdrawn throttle of 0.35, i.e. BELOW uncomposed rather than level with it. The entry deliberately OMITS fact(target_facing_shield_down), which ship_harrow_cruiser.toml does take, and the reason is the JOB rather than the shot: auto_fire_torpedo really does refuse every launch while the striking arc is up, for every hull, but the arc request fires on the strictly weaker condition that a loaded tube cannot bear. Gating the leg on the launcher's own precondition leaves Channel 3 flying the ship across the whole rest of the engagement — measured at 0 run ticks in 901 and 101 dealt against 370 taken, because this hull's beams put about 1 damage per second into an 80-point arc regenerating 6.5. The Harrow needs the stricter guard because its rounds author damage_shields = 0 and its beams are a 270-degree pair worked from the beam, so bow-on it can neither strip the arc nor use the rounds; a hull whose forward bank bears on its own bow can strip the arc it is about to shoot through, so the same bow hold is self-completing. torpedo_run_range exists because the bow hold is flown at torpedo_bearing_speed = 0 and so CUTS THRUST wherever it is entered, which makes the gate a park-range dial and lets the hull's EFFECTIVE beam reach be bracketed by sweeping it. Swept on probe_aggressor over 40 s at throttle 0.35: parked at 26.3-28.3 the hull still deals 80, parked at 27.4-29.2 it deals ZERO. The reach is therefore inside 26.3-27.4, against an authored beam_range of 40, because a phaser's range is scaled by ModifierSlot::RadarRange, which the SENSORS power group drives, and the fleet-baseline Power policy authors rules for helm and weapons and NONE for sensors — so a fully backfilled hull sits at level 1, contributes -0.5, and rebuild_cache folds a negative sum as 1 / (1 + |sum|) = 0.667, putting 40 * 0.667 = 26.7 squarely inside the measured bracket. A fighting ring authored against the nominal number would keep the target outside the guns for the whole engagement. SUPERSEDED BY ISSUE #955: the RadarRange multiplication was removed from every firing and reach-reporting path, so the hull's beams now reach the authored 40 and the 26.3-27.4 bracket above is a historical measurement of the pre-#955 build. The ring stays at 22 because the throttle and ring sweeps below were measured there and a fighting distance is an authored balance decision, not one derived from reach; what #955 changes is that the run-in opens fire at 40 rather than closing to 26.7 first. The gate is UNDER-CLAIMED rather than oversold: at the shipped throttle of 0.7 the approach is quick enough that the tubes have not finished reloading before the ring is reached, so gates from 25 out to 200 all park the hull at 21.8-22.0 and all deal the same 83 — the run-in freeze it guards against is measured at 0.35 and does not currently bind at 0.7. It is authored because the doctrine's contract owes it on both axes and because a slower approach makes it bind. The residual is stated rather than hidden: the leg ABSORBS the request, it does not remove it, because the two conditions are different shapes and a reloading hull just outside its run range is still overwritten. Closing that needs a precedence rule saying a class movement doctrine's facing outranks an arc-bearing request, which is ISSUE #918 and is deliberately not attempted here — #918's other half is the destroyer's escape leg, whose frozen heading has the same problem and no torpedo run to hide behind. What the residual costs is a THROTTLE decision: apply_arc_bearing_request overwrites steering and leaves throttle alone, so whatever fraction of the ring Channel 3 flies is flown bow-on at combat_orbit_speed, straight at the thing being circled. The account of that decision recorded here at first — that the class default of 0.6 closed to 2.8 units in probe_duel and broke off on hazard avoidance to 380, that 0.35 resolved the same duel in a kill, and that ring 20-26 crossed with throttle 0.30-0.45 was a tested-good band — is WITHDRAWN IN FULL. None of it reproduces, and 0.35 shipped the WORST corner of the region it claimed for itself. Re-measured at 30 Hz, --deterministic, throttle the only variable: on probe_aggressor damage dealt climbs 62 / 63 / 64 / 65 / 65 across 0.35-0.55 and sits FLAT at 67 with 0 taken across 0.60-0.85 before breaking at 0.90, where the hull first starts taking damage (46) — so 0.35 was below the uncomposed hull's own 64 and every value in 0.60-0.85 is above it. On probe_duel, 45 s over 30 seeds, survivals against uncomposed main's 14/30: 0.35 → 0/10, 0.50 → 3/10, 0.60 → 5/20, 0.68 → 15/20, 0.70 → 18/30, 0.72 → 11/20, 0.75 → 17/30, 0.78 → 20/20, 0.80 → 27/30, 0.82 → 6/20, 0.85 → 8/20. probe_duel is stated honestly as a RULE-OUT instrument rather than a fitting one: its outcomes are quantised, whole blocks of seeds returning byte-identical damage totals, so the seed nudges a nearly-deterministic two-body geometry across thresholds rather than sampling a distribution, and read against throttle it is not smooth — 0.78 wins every seed and 0.82 loses fourteen of twenty. What it says reliably is that everything below 0.65 and everything from 0.82 up is worse than uncomposed and the whole of 0.68-0.80 is at least as good. The shipped 0.7 is therefore chosen off the aggressor's flat optimum and the hull's own turn authority — a settled ring demands a sustained yaw of v / r, and at the ~23.3 equilibrium radius 0.6 asks 65 per cent of max_yaw_rate 0.4, 0.7 asks 75, 0.8 asks 85 and 0.9 asks 95, which is exactly where the aggressor probe breaks — and only CHECKED against the duel. It is deliberately not the duel's best point: 0.78 and 0.80 both score higher and neither is authored, because a value four hundredths from the 0.82 collapse is fitted to one hostile. The DUEL OUTCOME is stated rather than left out, because the withdrawn 0.35 was a balance REGRESSION there and a bullet that only reports the aggressor would hide it: across the same 30 seeds the shipped hull survives 18 against uncomposed main's 14, deals a mean 29.0 against 22.5, and takes a mean 189 against 281. The 0.35 regression — less damage dealt and an earlier death on every seed, turning survivals into deaths — is GONE rather than merely reduced, on all three measures. What is NOT claimed is that the cruiser wins this duel: at every throttle tested, composed or not, the best result on probe_duel is a draw. The doctrine improves a fight this hull still does not win. BESPOKE_DOCTRINES now lists alliance_cruiser engines and steering; the earlier note calling the hull one of the ships the fleet baseline is derived FROM described the withheld state, not a property of the hull, and does not survive the doctrine shipping. Boost and impulse are still NOT listed: no leg of a ring engages the drive, and a fighting ring is comfortably inside the impulse autopilot's own 40-unit cancel radius, unlike the artillery band which sits inside the cruise window and is why THAT fragment must idle it."
        - "Issue #937 records the DEPENDENCY a closest-approach detector has on the world snapshot's published HEADINGS, because it is invisible in the authored doctrine and it silently disabled the destroyer's whole attack-pass loop. movement_attack_pass.toml leaves `inbound` on three conjuncts, and the load-bearing one is fact(closing_rate) < param(closing_rate_epsilon). closing_rate is NOT a difference of two range readings: ai::core::target_relative_motion builds it from the radial component of the RELATIVE velocity, and it reconstructs BOTH ships' velocities from (yaw, forward_speed). So the detector is only as good as the heading ai::server::build_world_snapshot publishes for the OTHER ship. That producer read the heading off each entity's render Transform, which carries the negation ship::physics_systems::sync_ship_position applies (Bevy's Y euler turns counter-clockwise; ShipPhysics.yaw turns clockwise), while every consumer of the field — both target_relative_motion callers, both avoidance projections in ai::core, and weapons::arc_geometry::weapon_arc_sectors, whose output is compared against world_bearing_deg's atan2(dx, -dz) — reconstructs forward as (sin y, -cos y), which is ShipPhysics.yaw's convention and nothing else's. Every target's velocity therefore came back MIRRORED, and the hostile weapon-arc overlay with it. The cost was a destroyer that ran in, merged, read 'still closing' while it was flying away, never called closest approach, and ground along at contact range beside the ship it had just rammed — reported as 'orbits at ~range 5 instead of making attack runs'. It is a SILENT failure of the #779 shape one level down: the fact is present, finite and moves when the ship turns, and every fixture built from a hand-rolled quaternion agreed with it. The snapshot now publishes ShipPhysics.yaw for anything that has one, for the same reason the neighbouring forward_speed line already did. Pinned at both ends: ai::server::tests::the_snapshot_publishes_headings_in_the_simulations_own_convention runs a ship through the real sync and asserts on the FORWARD VECTOR the snapshot implies rather than on the number, and headless_runner::the_composed_destroyer_passes_breaks_off_and_passes_again asserts the four-phase SEQUENCE — merge, commit, re-open past the hull's own commit_range, merge again — over assets/worlds/probe_attack_pass_cycle.toml, which pairs the destroyer with an ORBITING Harrow cruiser because two hulls flying the same fly-through pass meet nearly head-on, where a mirrored velocity is still mostly radial and the detector fires anyway (which is why probe_duel.toml passed either way)."
    architecture:
      kind: configuration-schema
      authority: authoritative
      reads: [resolved-entity-template-state, ship-station-system-topology-state]
      produces: [fine-system-ai-policy-state]
      runs_in: [host-browser-runtime]

  - component: ai-policy-expression-runtime
    core:
      status: implemented
      confidence: confirmed
      title: AI Policy Expression Runtime
      summary: Extends the world-trigger predicate grammar with typed AI facts, explicit self/candidate/target contexts, read-only world flags and counters, ship power rating, named parameters, and bounded history operators.
      rationale:
        - "[ai] AI authoring should mirror the repository's existing predicate syntax instead of introducing a second expression style."
        - Scenario flags and counters are useful doctrine inputs but remain read-only to fine-system policies.
        - Registered typed facts preserve validation without allowing arbitrary scripts or component access.
        - "Issue #776 landed the three explicit contexts and authored ship power rating: bare fact(...) stays SELF for #775 back-compat, self_fact/candidate_fact/target_fact select the self, candidate, and currently-retained-target fact sets, and power_rating is a seeded SELF fact. Bounded-history operators were left proposed at #776 — no author needed them yet. They shipped in #890; see below."
        - "Issues #788/#789 left that clause true AT THE TIME and are worth reading against it, because bounded history itself already existed host-side. The windows are folded host-side and reduced host-side to ordinary scalar facts (fact(safe_distance_held), fact(separation_progress)); the GRAMMAR gained no window operator, no aggregate function and no history atom, and an authored guard still compares one atom to a literal or a param(...). The same host-derived-fact device covers every comparison the flat grammar cannot express: fact(range_above_min_seen) (#883) for fact-versus-memory, fact(safe_range) and fact(inside_threat_range) (#788) for this-ship-versus-that-ship's-reach, and fact(target_facing_shield_down) (#791) for a per-arc reading resolved through the target's own arc router. Keeping the derivation host-side is what keeps guards a flat readable table and src/ai/policy.rs Bevy-free."
        - "Issue #890 (59ce639f) makes that last clause FALSE on purpose: the grammar now HAS a history atom. `history(<reducer>, <fact>, <capacity>) CMP <operand>` adds one atom in the shape every other atom already has — one reducer compared against one operand — so it composes with and/or/not and with param(...) operands for free. The reducers are min, max and net_change (HISTORY_REDUCERS). A bespoke held(...) predicate was rejected because it would have needed a new primitive per comparison direction, whereas `min` over a full window compared for at-least IS the existing BoundedHistory::all_at_least, cross-checked against that primitive by a test over four series. Every reducer is gated on a FULL window — an unfilled window reduces to None and the comparison reads false — because a partly-filled window measures a shorter span than the designer authored, and would do so most confidently right after a clear. This is what retires the per-question-Rust pattern PRD #774 §5.2 forbids and that #788 and #789 each fell into (fact(safe_distance_held), fact(separation_progress) were bespoke Rust windows with their own capacity params and fold sites)."
        - "Issue #890 SCOPE: the windows ride on the per-fine-system PRIVATE MEMORY BAG (AiPolicyMemory) that memory(...) and state_time already use, not on a fourth argument threaded through every evaluation entry point. That is what dissolved the evaluation-scope problem instead of needing a rejection for it: the same bag is reachable from the shared tick that folds it (tick_policy_machine, via ai_policy_state_tick) and from the per-axis actuator hosts that resolve per-state rule guards later in the SAME tick, so a history guard works in both authorable positions rather than reading false in one. Keying a window on (fact, capacity) together is what makes two windows over the same reading with independent authored lengths expressible — the #789 level-versus-trend pair. It is bounded twice: the set of windows is re-derived each fold from what the guards actually ask for, and each window is capacity-bounded. An ABSENT reading CLEARS the window rather than being skipped, because a window closed over a hole would span more real time than its authored length while claiming not to."
        - "Issue #890 REJECTIONS, all at load and all following the #891 flag-guard precedent — everywhere the atom cannot work is a load error rather than a silent false. Rejected: (1) a history(...) guard on any of the SIXTEEN hosts that fold no window (only Helm engines, steering and boost do, and all three fold in the one place their machines are advanced); (2) a history(...) guard in a STATELESS policy, which is never ticked and so has no bag to fold; (3) a history(...) guard anywhere in a target SELECTOR, which is evaluated per candidate against a default bag on every host; (4) a history(...) atom in a WORLD trigger, entity `when` guard or trigger-action `when` guard, which evaluate against a flag chain alone with no per-system scope a window could belong to. An undeclared or non-integral/zero capacity param is also rejected — the window counts shared AI ticks, so it must be a positive whole number. The once-per-tick fold is proved BEHAVIOURALLY, by counting shared ticks rather than frames, and STRUCTURALLY, by a scan that fails if a fold appears in a function no host declares in ai_flag_hosts::AI_HOSTS: folding twice arms an eight-tick window at four."
        - "Issue #891 (6b0d0d62) is the precedent #890 follows and the reason the host table exists. flag(name) and counter(name) are full citizens of the shared grammar and every policy/selector API takes a flags: &[&FlagStore] chain, but only three of the nineteen hosts build one from WorldContentRuntime.flags — the other sixteen pass a literal &[]. On those, a flag(...) guard parsed, validated and then read false for ever. #891 stage 1 converts that silent trap into a load error, per host, in src/entities/ai_flag_hosts.rs. The table is not hand-maintained: each host records the eval sites whose last argument decides the answer, and a test RE-DERIVES the declared FlagChain by reading those functions out of the crate's own source, while a second test fails on any resolve/select call site no host claims. Threading the real chain into the remaining sixteen is stage 2; when a host is plumbed its entry flips and the rejection stops firing for it alone, with no rewrite of the rejection."

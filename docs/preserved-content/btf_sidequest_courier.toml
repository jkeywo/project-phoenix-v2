# Side Quest ΓÇö The Requiem Courier
#
# Loaded when the crew hails the Requiem courier (before aphelion_triggered).
# The courier is running black-market medical supplies to the Research Outpost,
# embargoed by Administrator Chen for political reasons during the talks.
# The crew must decide whether to let the shipment through or block it.
#
# This is load-once and idempotent. The courier is NOT involved in the finale.
#
# Flags set here:
#   courier_allowed   set if the crew lets the shipment through

# ΓöÇΓöÇ OBJECTIVES ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[objective]]
id = "courier_decision"
text = "Decide what to do about the Requiem courier's contraband shipment."
auto_add = true

# ΓöÇΓöÇ OPENING COMMS ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[comms]]
id = "courier_intro"
from = "Requiem Courier"
subject = "Private Channel"
message = "Ardent, I'll be brief. I'm carrying medical supplies for the Research Outpost ΓÇö the Station has them embargoed. People there are running low. I just need to pass."
trigger = "on_load"

[[comms.responses]]
text = "What kind of supplies?"
follow_up = "courier_supplies_detail"

[[comms.responses]]
text = "The embargo is in place for a reason. You'll have to turn back."
follow_up = "courier_blocked"

[[comms]]
id = "courier_supplies_detail"
from = "Requiem Courier"
subject = "Re: Supplies"
message = "Broad-spectrum antivirals, bone-knit compounds. Nothing tactical. The Outpost has a team doing field work ΓÇö they picked something up in the nebula. They need this."

[[comms.responses]]
text = "Go ahead. We didn't see you."
follow_up = "courier_allowed_response"

[[comms.responses]]
text = "I can't authorise this. The embargo stands."
follow_up = "courier_blocked"

[[comms]]
id = "courier_allowed_response"
from = "Requiem Courier"
subject = "Re: Passage"
message = "Thank you, Ardent. Requiem doesn't forget. Get home safe."
actions = [
    { set_flag = "courier_allowed" },
    { complete_objective = "courier_decision" },
]

[[comms]]
id = "courier_blocked"
from = "Requiem Courier"
subject = "Re: Embargo"
message = "Understood. Rerouting now. For what it's worth ΓÇö Administrator Chen's politics and those researchers' health are two different things."
actions = [
    { complete_objective = "courier_decision" },
]

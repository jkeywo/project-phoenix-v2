  - state: vertical-movement-mode-state
    core:
      status: implemented
      confidence: confirmed
      title: Vertical Movement Mode State
      summary: Ship capability declaring whether the craft supports no vertical motion (Planar), bounded AI vertical motion, or full 3D six-degree-of-freedom flight, plus the authored bounded limits (max vertical offset, gradual return rate).
      rationale:
        - Vertical movement support is ship-specific rather than universal, just like engines, steering, lateral thrust, and boost.
        - Bounded motion provides AI-only above-below avoidance without turning the current player game into full free 3D flight.
        - In bounded mode the ship should return gradually toward its authored cruise plane once avoidance urgency falls, rather than snapping immediately back.

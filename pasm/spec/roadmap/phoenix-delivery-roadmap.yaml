  - component: roadmap-ship-customisation
    core:
      status: proposed
      confidence: confirmed
      title: Ship Customisation — Per-Station Materiel Loadout
      summary: "Per-station MATERIEL customisation — the crew chooses WHAT systems the ship carries, not how it is operated — spanning content bands C5 (MVP) and C6 (flesh-out), the two post-demo bands that add no new hull. Customise, not upgrade: every option is a net-neutral sidegrade, the sole sanctioned power increase being a mission-authored starbase reactor reward (band C6). The budget is SOFT, denominated in the roadmap-broken-tithe-foundation supply/demand power model — nothing is rejected in the lobby; over-fitting is self-limiting at run time (more per-component demand drains the battery toward the exhaustion lock sooner, and overpowered components overheat offline-to-cool). Every system draws power so every station can customise under one currency; the reactor is itself a customisable component ({generation, battery, recovery, dissipation} profile). Authority: the station's lobby CLAIMANT owns its loadout section, unclaimed/AI-backfilled stations fly the hull's authored default (what the Backfill AI already flies), and the loadout is FROZEN AT SPAWN into one deterministic template that rides the initial-state hash like ship selection, refittable only at a starbase. C5 MVP: a variant-swap tracer built on the delivered #869/#911 fragment composition (each customisable system ships as N balanced variant fragments; lobby choice = which composes in) — NO new data primitive — for ONE hull on TWO axes (reactor profile + one Tactical combat variant), landing AFTER #922 closes the base hulls, with variants authored net-neutral and proven by the #835 seeded duel harness. C6 flesh-out: typed+sized MOUNTS (the genuinely new primitive — mount topology plus validator) with empty/optional slots, reactor profiles and variant breadth fleet-wide, and the starbase refit/reward path (needs a mid-sim refit command and campaign persistence #863/#867)."
      rationale:
        - "Settled in a 2026-08-17 grill from ~/Downloads/custom-ship-report.md (EVE/Starsector/Endless Sky/EmptyEpsilon survey). It is the platform capability for C5 and C6 specifically because those bands add no new hull, so the 'one capability per band' cadence needs a feature to carry."
        - "It is a HARD CONSUMER of the C4 power redesign, and in fact forced that redesign's scope: soft-budget sidegrades are impossible on the boost/amplifier power model, where a stronger component costs nothing extra to run and is therefore a strict upgrade. See roadmap-broken-tithe-foundation."
        - "The MVP is deliberately a tracer bullet against band C5's own purpose: C5 is the full-matrix balance-closure band (#922), and a fit budget multiplies the matchup matrix, so the MVP is scoped to one hull and layered AFTER base closure, with the duel harness — not playtest — the guard that no variant dominates. Reactor-plus-one-combat-axis is the smallest slice that exercises both the soft-budget mechanic and a player-visible loadout choice."
        - "Staging the mount primitive into C6 keeps the new-data-model cost out of the balance-heavy band: C5 reuses fragment composition wholesale and introduces no schema. A non-blocking lobby sustainability meter (sustained vs peak draw vs reactor) belongs in C5's polish PRD so the soft budget is legible."
        - "The campaign/skirmish split that protects closed balance is by AUTHORING, not a mode toggle: only campaign scenarios author starbase upgrade rewards, so skirmish and versus stay fixed-budget sidegrade forever."
        - "Recommended tracer hull is the battleship (the C4 power-network hull, biggest reactor, where profiles matter most); the destroyer is the alternative as the most-onboarded hull. Not yet John-confirmed."
    architecture:
      kind: roadmap-milestone
      authority: non-authoritative
      reads: [entity-template-state, resolved-entity-template-state, ship-station-system-topology-state, world-snapshot-artifact]
      coordinates: [roadmap-broken-tithe-foundation, roadmap-composable-entity-templates, roadmap-authoritative-snapshots, roadmap-post-demo-readiness]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-post-demo-readiness
    core:
      status: accepted
      confidence: confirmed
      title: Post-Demo Catalogue Readiness
      summary: "Generalise the demo's readiness mechanisms across the full catalogue (#922) one hull at a time: destroyer in release A, cruiser in C1 (#1080-#1083), courier in C3 behind its doctrine (#877), battleship in C4, then full-matrix and mixed-fleet balance closure plus the generalised curation manifest in C5. Each hull slice is its contextual station tutorials, its sidecar-owned model LODs, and its seeded matchup evidence together."
      rationale:
        - "#922 is content and coverage on modules the demo already built — the tutorial overlay framework, the sidecar LOD pipeline, the seeded balance harness, and the curation manifest — so it never needs a new framework, only per-hull authoring."
        - "The one-hull-per-band rollout means every release adds a hull that is actually finished, rather than four half-onboarded hulls appearing at once."
        - Cruiser and battleship Backfill doctrine is already authored (#876); only the courier's (#877) still gates its slice.

# Committed mod-pack fixture (issue #991): a pack whose world is VALID TOML but
# fails the world schema — the `[[entity]]` block omits the required
# `template_path`, so `parse_world` rejects it and validate_manifest reports
# `unparseable-scenario-world`. Distinct from a non-TOML file (that would be
# `unparseable-content`) and from a world the manifest cannot resolve at all
# (`missing-scenario-world`, the unresolved-manifest-world fixture).
#
# Regenerate the .zip with `node scripts/build-mod-pack-fixtures.mjs`
# (byte-reproducible; gated by `--check`). The SAME .zip bytes are validated
# from both Rust (src/world/mod_pack.rs) and the browser smoke spec
# (tests/smoke/mod-pack.spec.js).

[pack]
format = 1
id = "schema-invalid-world"
version = "1.0.0"
name = "Schema Invalid World"

[pack.requires]
content_id = "phoenix-base"
content_epoch = 1

[[scenario]]
id = "schema_invalid"
world = "assets/worlds/schema_invalid.toml"

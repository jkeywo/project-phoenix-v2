# ── The witness (issue #1039) ────────────────────────────────────────────────
#
# The rigger who works the Ladder B transfer arm, tied up on the picket with the
# rest of them. Present from the first tick for the reason the strike is: she
# was on that arm the day the operator's file says it was inspected, and she was
# on it long before anybody sent a destroyer. Nothing calls her; her channel
# opens only if the crew earn it, which is the whole of #1039.
#
# [ai] A PERSON WITH HER OWN HULL, rather than a second thread on the committee's
# channel, and the choice is the beat. What she gives the crew is testimony — one
# named someone saying what she saw — where the committee are a body that votes,
# take positions and speak for a floor. They are also the channel #1036 spends on
# the negotiation and CLOSES on the force-open, so hanging corroboration off it
# would make "will they talk to us" and "have they stopped talking to us" the
# same question. A hull of her own also makes her a dossier subject through
# #1030's hail door, so "who told us this" is answerable on the panel rather than
# implied by a provenance.
#
# She costs the world one entity and therefore moves its digest — the header at
# the top of this file carries that A/B — and a civilian hauler is the hull
# because it is what `probe_evidence.toml`'s own witness flies and what the
# committee are moored in. There is no smaller civilian template.
#
# Held on her mooring by `moor_the_claimants` alongside the committee, and for
# the reason #1039's own note gives for where that mooring IS: her channel has to
# be answerable from the ladder leg the mission already sends helm to. A skiff
# that flew off up the corridor for six minutes would make that note false
# without contradicting a word of it.
[[entity]]
template_path = "assets/entities/ship_civilian_hauler.toml"
id = "rigger_tacket"
name = "world.falling_skyway.entity.rigger_tacket.name"
transform = { anchor = "rigger_mooring" }
overrides = { comms = { hailable = true } }

# ── THE RESTRAINT INTERACTION (#1041) ────────────────────────────────────────
#
# Havelock's hired picket, and the one place in this mission where the crew can
# choose how much force to use.
#
# A Harrow patrol boat, for three reasons and not for flavour. It is ARMED,
# which the Requiem cutter beside it is not — "out of the fight" means nothing
# said of a hull with no guns. Its faction is NEUTRAL by default, so it sits
# there doing nothing until somebody starts something: the fleet's own faction
# files call the Harrow "a non-engaging neighbour the player must choose to
# provoke", which is the premise a restraint lever needs. And its gun line
# authors `min_alert_to_fire = 0`, so it is the hull a weapons hold has to beat
# the hard way.
#
# The `[infrastructure]` on a warship is a composition, not a new combat state.
# A condition track already falls with hull damage and already owns named
# operational flags with hysteresis (#1025), so crossing one downward is what
# DISABLED means here: the mount is off, the ship is not, and the crossing is an
# event the script can hear. `guns_online` starts up, because the picket arrives
# whole.
#
# Its one doctrine entry is re-pointed at its own anchor, the per-id edit the
# Havelock cutter above uses and for the same reason — left on the template's
# Ironveil patrol anchors, this world would have to declare two anchors named
# after somebody else's border.
[[entity]]
template_path = "assets/entities/ship_harrow_patrol.toml"
id = "havelock_enforcer"
name = "world.falling_skyway.entity.havelock_enforcer.name"
transform = { anchor = "corporate_picket" }
overrides = { comms = { hailable = true }, infrastructure = { publish = false, condition = 100.0, condition_max = 100.0, threshold = [
  { flag = "havelock_enforcer_guns_online", fails_below = 0.35 },
] }, behaviour = { doctrine = [
  { id = "patrol-ironveil", directive_kind = "Reach", directive_anchors = [], directive_loop = false, directive_anchor = "corporate_picket" },
] } }


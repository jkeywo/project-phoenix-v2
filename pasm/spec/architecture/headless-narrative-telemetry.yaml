entities:
  - component: narrative-event-emitter
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Event Emitter
      summary: Emits a NarrativeEvent for every authored mission-timeline moment — Objective posted/completed/failed, named deadline fired, authored beat fired, Comms thread opened, Comms response answered, a MARKED entity spawning or being destroyed on either removal path, and a ship's-computer message shown/superseded/expired — unconditionally on every runtime, so the after-action timeline exists whether or not anyone is collecting it.
      rationale:
        - "The ship's-computer message (issue #1342) is its own producer, tick_computer_message, rather than an arm of emit_scenario_narrative: unlike an Objective/deadline it has no other authoritative owner to log through, so the one system that mutates ActiveComputerMessage also reports the shown/superseded pair honestly at the moment it changes. Expiry is a SimTick comparison, not a scheduled callback — the same freeze-for-free-under-pause property mission deadlines get, without a queued Rhai dispatch this state machine has no handler to fire. A show_message(..) request is buffered onto EffectQueue<ComputerMessageRequest> by the shared dispatch applier for the same #1223 reason narrative_beat is: the applier holds no message writer."
        - "Kept a SEPARATE message from BalanceEvent (PRD #1337). The combat ledger is a fold of the balance stream alone and must stay so: a story beat that also happens to be a kill produces one event in each stream, and nothing narrative can move a damage total."
        - "Authored, never inferred. An Objective/deadline/Comms transition is authored by construction; a beat is an explicit ctx.effects.narrative_beat call; an entity outcome requires the scenario to have set narrative = true on the [[entity]], which attaches a NarrativeMark. An unmarked hull produces no timeline entry however violently it dies — that gate is what keeps the timeline readable instead of a second copy of the damage log."
        - "The mark is attached at BOTH declared spawn timings — spawn_immediate_entities_internal for spawn_on = immediate, spawn_game_start_entities for spawn_on = game_start — because narrative = true says nothing about WHEN the hull enters the world. Only a NAMED row can be marked (the mark's payload IS the authored name), and world::validate raises a narrative-mark-needs-name warning on the nameless combination rather than dropping the flag in silence: a silently-ignored authoring flag is the one failure the authored-never-inferred rule cannot absorb, because the author believes they marked the hull. A hull a SCRIPT spawns has no [[entity]] row to carry the flag and records its story through ctx.effects.narrative_outcome instead."
        - "ONE hull, ONE uuid, whichever timing spawned it. A marked entity reaches the timeline twice under different resolutions — marked_entity_spawned reads the uuid off the spawned entity, while ctx.effects.narrative_outcome resolves the authored NAME through name_to_uuid — so the two are only the same actor if the spawner used the registered uuid. spawn_game_start_entities therefore reads WorldConfig.name_to_uuid for named rows exactly as the immediate path does, and mints only for anonymous ones (the player-ship placeholder). The assign pass registers every named row with no spawn_on filter, so a minted game_start hull was addressable by nobody: the name resolved to a uuid belonging to no entity in the world. That split predates the timeline — it broke comms from, trigger targets and set_target too — and the timeline is where it became visible."
        - "A comms_answered beat points the OTHER WAY from the comms_opened it answers. source is who produced the moment, and a choice is produced by the crew: the answering hull, the station that station_for_system resolved for the comms system, and the comms system itself — the one narrative kind whose actor is a station-side decision, and so the only place NarrativeActor's station/system axes are live. The hailing entity is the target, which is the opened event's source, so opened-source == answered-target pairs the exchange without crediting the counterparty with the crew's decision. An axis that cannot be resolved stays null rather than being string-cast from the system id."
        - "Objective transitions are recorded by the MANAGER, not by the call sites. An Objective can be completed from a trigger action, a Rhai effect, a comms response, or the Helm AI satisfying its own directive; the systems owning those sites are at Bevy's 16-parameter limit already. Every one of them goes through ObjectiveManager's four mutators, so each mutator appends an ObjectiveTransition and emit_scenario_narrative drains that log once a tick — no site can be missed by the next one added, and the log is what makes intra-tick fidelity possible: an objective posted and completed inside ONE fixed tick is one status field but two beats, and a snapshot diff can only ever report the state the tick ended in. The diff survives as a backstop for state that moves outside the manager's API, and for deadlines, which have no API to log through and cannot fire twice in a tick. The per-system Local each diff keeps is deliberately NOT a resource: derived, non-authoritative, and therefore out of the #894 census and out of the snapshot; the transition log itself is drained every tick and read by nothing authoritative."
        - "Authored beats and authored entity outcomes DO have one true chokepoint — the script boundary — so they ride the #1223 effect-queue pattern: apply_dispatch_result buffers a NarrativeRequest::Authored and emit_authored_and_marked_entity_narrative turns it into an event, because the applier holds no message writers."
        - "A marked hull cannot vanish silently. The engine has TWO removal paths and only one of them is a kill: ActionCmd::DestroyEntity (ctx.effects.destroy_entity, and its deferred schedule form) despawns without writing a BalanceEvent, and it must keep doing so — an authorial removal in the combat ledger would make a rescue-by-despawn count as a destruction in the AAR, which is exactly what PRD #1337's supplements-never-changes rule forbids. So the applier queues a NarrativeRequest::ScriptedRemoval instead, and the emitter turns it into marked_entity_destroyed ONLY when the run's timeline holds no authored outcome for that entity. An author who despawns a marked hull to mean rescued/escaped/abandoned records that outcome before, or on the same tick as, the destroy; recording it a tick later is too late. The signal is queued for every scripted removal because the applier is lent plain &mut Vec sinks and no component query, so the NarrativeMark gate lives in the emitter, which already remembers every marked uuid it has seen."
        - "String Ids, never localized prose: an Objective's text, a Comms body, a deadline's label all pass through verbatim, so the timeline is byte-stable across locales and downstream analysis can localize or narrate it consistently."
    architecture:
      kind: telemetry-emitter
      authority: observational
      reads: [objective-runtime-state, mission-deadline-state, balance-event-stream, comms-inbox-state]
      produces: [narrative-event-stream]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/narrative.rs, src/narrative.rs, src/objectives.rs, src/world/dispatch.rs, src/world/server.rs, src/world/script/effects.rs, src/world/config.rs, src/world/validate.rs, src/console/comms/server.rs, src/server_app/registration.rs, src/server_app/world_setup.rs, src/core/computer_message.rs]
      symbols: [NarrativeEvent, NarrativeKind, NarrativeActor, NarrativeValue, NarrativeMark, NarrativeRequest, ObjectiveTransition, emit_scenario_narrative, emit_authored_and_marked_entity_narrative, tick_computer_message, ActiveComputerMessage, ComputerMessageRequest]
      tests: [cargo test, tests/narrative_timeline.rs]

  - state: narrative-event-stream
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Event Stream
      summary: The NarrativeEvent message stream and the authored NarrativeMark component that gates its entity half — one event per authored mission-timeline moment, carrying an event kind, an authored semantic identifier or String Id, an optional source Station/System/entity, an optional target, and structured outcome data.
      rationale:
        - "NarrativeMark is Presentation-class for the #894 digest boundary: the fixed tick never reads it, nothing branches on it, and neither sim_digest nor snapshot walks it. It decides only what the after-action surface SHOWS."
        - "The event itself carries no timestamp. The monotonic sequence, the fixed sim tick and the derived sim time are stamped at COLLECTION, so a chokepoint only has to know what it knows and the sequence is a total order across every emitter."
    architecture:
      classification: observational
      owner: narrative-event-emitter
      writers: [narrative-event-emitter]
      readers: [narrative-telemetry-collector]
    implementation:
      status: declared
      paths: [src/core/narrative.rs]
      symbols: [NarrativeEvent, NarrativeKind, NarrativeMark]
      tests: [cargo test]

  - component: narrative-telemetry-collector
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Telemetry Collector
      summary: Headless-only system that drains the NarrativeEvent stream each tick, assigning each event its run-scoped monotonic sequence and stamping it with the fixed SimTick and derived sim time, into the run telemetry buffer's narrative vector — and, under --format ndjson, pushing the timeline-eligible ones onto the inline stream.
      rationale:
        - "A SECOND collector beside collect_balance_events rather than an extra arm of it, chained after it in Last so an ndjson tick reads traffic-then-combat-then-story and the sequence is a fixed function of the tick rather than of executor order."
        - "Always folds, filters only the stream — the same split the balance collector makes. NarrativeKind::in_timeline_stream holds ReportRowUpdated out of the ndjson flow because a re-scored report row is a rate, not a beat; its final value arrives in the folded timeline and in ReportFinalized."
    architecture:
      kind: telemetry-collector
      authority: observational
      reads: [narrative-event-stream]
      produces: [run-telemetry-state]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/headless/report.rs, src/headless/app.rs, src/core/telemetry.rs]
      symbols: [collect_narrative_events, StampedNarrativeEvent, RunTelemetry]
      tests: [cargo test, tests/narrative_timeline.rs]

  - component: narrative-timeline-projector
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Timeline Projector
      summary: Pure fold over the stamped narrative log producing the run report's mission timeline — every event in monotonic sequence order plus a per-kind census — hand-encoded into the report JSON beside the combat ledgers.
      rationale:
        - "Pure, with no ECS access, so the projection is unit-testable without booting an app — the same shape combat-ledger-aggregator has, and deliberately NOT folded into the ledgers or the outcome classification: PRD #1337 keeps the story surface beside the combat ledger, never inside it."
        - "Present in EVERY report with no debug flag, like damage_by_ship and station_activity. A run with nothing authored reports count: 0, which says the scenario told no story without a reader having to know whether a flag was on. Only the inline ndjson stream is format-gated."
        - "Determinism: nothing in sim_digest.rs or snapshot.rs reads a narrative event, and no fold stage walks RunTelemetry's narrative vector, so recording is inert to the authoritative digest by construction. tests/narrative_timeline.rs A/Bs the JSON and NDJSON formats of the same seeded run and requires every digest-relevant report field to match byte for byte."
    architecture:
      kind: pure-aggregator
      authority: observational
      reads: [run-telemetry-state]
      produces: [run-report-artifact]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/core/narrative.rs, src/headless/report.rs]
      symbols: [fold_narrative, NarrativeTimeline, RunReport]
      tests: [cargo test, tests/narrative_timeline.rs]

  - component: task-lifecycle-emitter
    core:
      status: implemented
      confidence: confirmed
      title: Task Lifecycle Emitter
      summary: Turns the queued start/end reports from continuous workflows — the science scan and the tractor hold are the two tracer workflows — into paired narrative beats, minting each activation's deterministic task key, resolving the station its system belongs to, and guaranteeing exactly one terminal event per activation across completion, cancellation, failure, interruption, subject loss and mission end.
      rationale:
        - "Generic by construction, not scan-shaped or tractor-shaped. A continuous task is an operator, a system, a verb, an optional subject, a start and exactly one terminal moment; the later mechanics of PRD #1337 (#1345, #1346, #1348, #1350) push the same TaskLifecycleRequest and inherit the whole contract rather than inventing parallel lifecycle telemetry."
        - "The SITES report one fact each — work began, or work ended for this reason — and the EMITTER makes all five judgements. handle_tractor_commands, tick_tractor, operate_tractor_ai and tick_scans know none of the ordinal, the owning station, whether the subject is still in the world, whether another site already reported the same ending, or whether this is the hundredth identical retry of a standing order; concentrating those here is what keeps a new workflow's cost to two queue pushes."
        - "Exactly one terminal event is enforced by the registry, not hoped for: a terminal report for a slot with no live activation is DROPPED. That is what lets operate_tractor_ai report an order withdrawal and handle_tractor_commands report the ReleaseTractor it causes, on the same tick, and have the timeline record the truer of the two — the AI host is ordered before the command handler, so the first report through the queue wins and a withdrawn order does not read as a crew decision."
        - "A restart is a NEW activation, never a second event on the old one. A start on a slot that already holds one closes the old key as restarted first, so both are separately identifiable and neither is left unterminated. The ordinal is per slot, so simultaneous tasks on one hull (a hold and a scan) count independently."
        - "A hold whose subject was destroyed can only report itself as out of range or as having lost its lock — a despawned hull and a distant one are identical to hold_status. The emitter upgrades exactly those two reasons to target_destroyed when the subject really has left the world, and closes a still-live activation whose subject vanished even when no site reports it, which is what covers a scripted removal. NoSuchTarget is deliberately not upgraded: it names a contact that was never there."
        - "A POLL is BOUNDED, never erased. An AI host serving a standing objective re-issues its request on every authored snapshot until the objective is satisfied — the Sensors host's ScanTarget says so in as many words, because tick_scans is the sole applier of capability and range refusals — so an order that can never be fulfilled is refused again on every cadence, and each refusal is a whole start-and-terminal pair. An INSTANTANEOUS activation that repeats, exactly, the FAILED terminal its slot last recorded gets no beats of its own and spends no ordinal; it is COUNTED against the retained terminal instead, and the count is written once as a task_repeated census beat carrying that terminal's key, when the standing failure ends or the run does. That keeps a standing unfulfillable order at O(1) beats in the report, the counts and the ndjson stream while leaving every attempt identifiable — the emitter CANNOT tell an AI cadence retry from an engineer pressing Engage a second time on a target still out of reach (one slot, one subject, one unchanged refusal, both halves minted by one tick), so a rule that dropped the pair whole would silently erase deliberate crew actions and break the AC that repeated tasks stay separately identifiable. Nothing else coalesces at all: a completion is work that happened, a cancellation is a decision somebody made, a changed subject or reason is a changed fact, and a task that spanned ticks was never a poll."
        - "The SUBJECT is half of a hold's key, so the activation is opened by the COUPLING that formed and never by the intent that asked for one. handle_tractor_commands (SimSet::Input) and handle_set_target — the ship's one TacticalRadarSelection applier, in the SAME set with no ordering between them, and joined by the world and scripted-comms appliers writing from other sets — cannot agree on what the lock is at the moment an engage is read, while tick_tractor couples in SimSet::Modifiers against the lock as it finally stands. So tick_tractor reports every transition of coupled_target: None -> Some opens the hold on the hull actually gripped, Some(a) -> Some(b) closes the old hold as target_lost and opens a new one, and a refusal before any coupling formed opens and closes one activation in the same tick so a refused engage is still a beat. Keying off the intent instead would name a hull the beam is not holding for the whole activation, permanently — from the next tick the coupling and the lock agree again, so nothing would ever correct it — pointing the vanished-subject sweep at the wrong entity into the bargain."
        - "The run's LAST terminal events cannot come from a system. Reaching max_ticks is not a transition — run() simply stops calling update() — so headless::report::finalize_task_lifecycles drains the registry at the report boundary and writes the mission_ended terminals with the same stamping and the same ndjson line the per-tick collector uses, keeping the stream and the report's timeline in agreement. It drains the outstanding poll counts there too, for the same reason: a standing order still being re-issued when the run stopped has no later beat to report its repeats against. The GamePhase::GameOver case IS observable, and the emitter closes both in the tick it happens."
        - "Determinism: the drained batch is STABLY sorted by slot, so the timeline's order does not depend on the archetype order the reporting queries walked, while the order of reports within a slot — the part that carries meaning — is preserved exactly. The registry is a BTreeMap, so every sweep walks in slot order. No wall clock, no RNG."
        - "Capture is read-only. The sites push onto a ClearedAtFold EffectQueue and touch no component; the registry is Presentation-class; nothing in sim_digest or snapshot walks either. tests/task_lifecycle_narrative.rs A/Bs the JSON and NDJSON formats of the same driven run and requires the authoritative digest and every report line to match."
    architecture:
      kind: telemetry-emitter
      authority: observational
      reads: [task-lifecycle-registry, tractor-beam-state, science-scan-state]
      produces: [narrative-event-stream]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/task_lifecycle.rs, src/narrative.rs, src/tractor/server.rs, src/science/server.rs, src/headless/report.rs, src/server_app/registration.rs]
      symbols: [TaskKey, TaskSlot, TaskOutcome, TaskTerminalReason, TaskActivation, TaskLifecycleRequest, TaskLifecycles, start_event, terminal_event, repeats_event, emit_task_lifecycle_narrative, finalize_task_lifecycles]
      tests: [cargo test, tests/task_lifecycle_narrative.rs]

  - state: task-lifecycle-registry
    core:
      status: implemented
      confidence: confirmed
      title: Task Lifecycle Registry
      summary: The live activation per task slot (operator, system, verb), the per-slot ordinal counter that keeps repeats and restarts distinct, and the last terminal each slot recorded together with how many identical attempts have been folded into it — the state that makes one-start-one-terminal an invariant rather than an aspiration, and that tells a beat from a poll without losing count of the poll.
      rationale:
        - "Presentation-class for the #894 digest boundary: the fixed tick never reads it, nothing branches on it, and neither sim_digest nor snapshot walks it. It decides only what the after-action surface SHOWS."
        - "A resource rather than a Local on the emitter — unlike the objective and deadline views the other narrative emitters keep — for one reason: the run's last terminal events are the ones nothing in the schedule can emit, because the run has stopped. The report boundary drains what is left here."
        - "take_all empties the live set but KEEPS the ordinal counters, so a slot that is closed and started again still mints a fresh key."
        - "The last-terminal map is per slot and bounded by the number of slots, not by the number of activations: an unfulfillable order polled for a whole run adds one entry and never grows it. Every terminal the emitter writes records itself there, sweeps included, so what the poll rule compares against is the whole truth about the slot rather than the half some workflow reported."
        - "Each entry keeps the whole retained ACTIVATION, not just its subject and reason, plus an integer count of the coalesced repeats. The activation is what lets the census beat be reported under the same key as the terminal the repeats were folded into, so the count never floats free of the thing it counts; the counter is what keeps a coalesced attempt bounded rather than erased. Draining the count leaves the retained terminal in place, so the next identical attempt still coalesces instead of re-opening the flood."
    architecture:
      classification: observational
      owner: task-lifecycle-emitter
      writers: [task-lifecycle-emitter]
      readers: [task-lifecycle-emitter, narrative-telemetry-collector]
    implementation:
      status: declared
      paths: [src/core/task_lifecycle.rs]
      symbols: [TaskLifecycles, TaskActivation, TaskKey, TaskSlot]
      tests: [cargo test]

  - state: post-mission-report-state
    core:
      status: implemented
      confidence: confirmed
      title: Post-Mission Report State
      summary: The MissionReport accumulator a scenario writes over the course of a run — an ordered list of report rows, each carrying a stable authored id, a localized heading and outcome String Id, a semantic ReportRowState, and a hidden signed diagnostic score.
      rationale:
        - "It exists because an ending used to be one word. A mission that saved the stricken hauler and lost the traffic had to pick victory or defeat, which is a verdict with the reasoning thrown away. A report is the reasoning: one row per thing the mission was about, in the order the author put them in."
        - "AUTHORITATIVE, not presentation — the opposite call from NarrativeMark. A scenario SCRIPT writes it (ctx.effects.report_row), so two instances on the same seed must hold the same rows in the same order or they have diverged. sim_digest folds every field of every row including the hidden score, and snapshot captures and restores them, so a resumed run cannot silently un-rescue the hauler. Classified Folded and not DeferredFold because the fold really does walk every field."
        - "Order is CONTENT, so the rows live in a Vec in authored write order and the fold walks them in that order rather than sorting. Two instances that agree on the rows but disagree on their order would show two different reports and must not share a digest."
        - "A row that was never written is OMITTED, never written as unresolved. A run that ends catastrophically before Lyra's fate is decided reports no Lyra row at all: the mission never reached the point where the question had an answer, and inventing one would be the report lying about what the crew did. A report with NO rows is not a report — the ending falls back to its declared victory/defeat framing, which is what keeps every scenario that has not opted in exactly as it was."
        - "The signed score is the reason the player projection is a SEPARATE shape. Design wants a diagnostic number; players want an account of what happened to the people they were sent to help, and a crew reading 'Lyra Ascending: saved (+6)' is reading a coupon. ServerMessage::GameOver's GameOverReportRow and ViewscreenHudState's game_over_report have no score field at all, so the split is a compile-time guarantee rather than a filter somebody has to remember; the headless OutcomeReport JSON carries the scores and the total."
        - "PER-RUN, and a session is not. reset_mission_report clears the accumulator (and its inbound queue) on OnEnter(InProgress), beside reset_command_log and for the identical reason: a second round reached through ReturnToLobby must not inherit the first round's rows. Without that boundary a report-free scenario played after Falling Skyway publishes Lyra's row, is classified reported, and beats report_finalized over a report nobody wrote — the same 'lying about what the crew did' failure as an invented row, arriving by a different door. The restore path is deliberately NOT covered by it: snapshot resume writes State::new and skips OnEnter, so a resumed run keeps the rows the captured tick held."
    architecture:
      classification: authoritative
      owner: post-mission-report-accumulator
      writers: [post-mission-report-accumulator]
      readers: [narrative-timeline-projector, host-state-broadcaster, viewscreen-hud-effects, run-outcome-classifier]
    implementation:
      status: declared
      paths: [src/core/report.rs, src/sim_digest.rs, src/snapshot.rs, src/server_app/registration.rs]
      symbols: [MissionReport, ReportRow, ReportRowState, SnapshotReportRow, GameOverReportRow, reset_mission_report]
      tests: [cargo test, tests/narrative_timeline.rs, tests/snapshot_resume.rs]

  - component: post-mission-report-accumulator
    core:
      status: implemented
      confidence: confirmed
      title: Post-Mission Report Accumulator
      summary: The single system that drains the script boundary's report-row queue into MissionReport in queue order, beating each row that ACTUALLY moved onto the narrative timeline as report_row_updated, and the game-over broadcast that finalizes the report and publishes its score-free player projection.
      rationale:
        - "One writer, and it is not the applier. ctx.effects.report_row resolves at the script boundary, but apply_dispatch_result is lent plain &mut Vec sinks and holds no resources, so a row rides the #1223 effect-queue pattern exactly as an authored narrative beat does: ActionCmd::SetReportRow onto EffectQueue<ReportRow>, drained by apply_report_rows. Having exactly one writer is what makes the ordering promise a property of the type rather than of every caller remembering it."
        - "A beat only on a real change. A scenario may re-state a row every tick — a running count re-scored as a window moves — and that is a RATE, not a beat. MissionReport::set_row reports whether anything moved, so an identical restatement produces nothing; NarrativeKind::in_timeline_stream additionally holds report_row_updated out of the ndjson flow, so even a genuinely churning row reaches the folded timeline without flooding a reader's scrollback. report_finalized happens once and is streamed."
        - "Finalization lives at OnEnter(GameOver) beside the broadcast, and fires only when the report has rows: beating 'finalized' over an empty report would tell an after-action reader a report existed. OnEnter runs before the telemetry collectors in Last on the same frame, so the beat is stamped with the tick the run ended on."
        - "RunOutcome::Reported OUTRANKS victory and defeat in classify() rather than sitting beside them. A run that pulls Lyra clear and then loses the skyway is a declared defeat AND a report holding a saved row; framing it as DEFEAT throws the row away, which is the exact failure the report exists to fix. The declared Outcome is not lost — still latched on GameOverReason, still folded, still on the wire — it simply stops being the frame, on the phone and on the Viewscreen alike."
        - "Two player surfaces, one normalizer. The phone reads rows off ServerMessage::GameOver and the Viewscreen reads them off ViewscreenHudState, so the two overlays are genuinely different code — but both run their rows through the single exported reportRows in gui/game-over-view.js, which decides which row is renderable (a row missing either String Id is dropped: a blank line says less than no line) and lower-cases the state before anything styles on it. A second copy of those two rules is how the surfaces come to disagree about what the report SAYS, so there is one."
        - "Emptiness is refused at the AUTHORING boundary, not at the renderers. report_row rejects a blank id/heading/outcome with the same raise a missing key gets, because a row with an empty heading is dropped by reportRows on both surfaces while its score still folds into MissionReport::total — a total counting a row no player can see is exactly the invariant #1344 states as 'a total equal to the visible report rows' hidden scores'."
    architecture:
      kind: effect-applier
      authority: authoritative
      owns: [post-mission-report-state]
      reads: [narrative-event-stream]
      produces: [post-mission-report-state, narrative-event-stream]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/mission_report.rs, src/world/dispatch.rs, src/world/server.rs, src/world/script/effects.rs, src/server_app/broadcast_publish.rs, src/server/viewscreen_border.rs, src/core/balance.rs, gui/game-over-view.js, gui/lobby-state.js, client.html, server.html]
      symbols: [apply_report_rows, reset_mission_report, finalized_event, SetReportRow, report_row, on_game_over_enter, RunOutcome, classify, gameOverView, reportRows]
      tests: [cargo test, tests/narrative_timeline.rs, tests/client/game-over-view.test.js]

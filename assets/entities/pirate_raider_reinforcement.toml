# Harrow Destroyer Reinforcement (formerly Pirate Raider Reinforcement)
#
# Variant of pirate_raider.toml used when reinforcements arrive via a
# LoadWorld trigger. Identical to the base destroyer except the
# `enemy_in_range` detection radius is expanded to 400 units so the
# destroyer immediately detects and pursues the player from its spawn
# position (~370 units from player start in the default scenario).
#
# (#474) Re-balanced alongside pirate_raider.toml: hull 30 + shield 15
# at 0.5/s regen, phaser pierce 0.1, no flee — fight to the death.

name = "Harrow Destroyer"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "high"
description = "Harrow Destroyer"

[hull]
hull_integrity = 30.0

[shields]
max_hp = 15.0
regen_per_sec = 0.5

[collider]
shape = "Capsule"
radius = 2.0
length = 4.0

[helm_console]
max_speed = 40.0
max_reverse_speed = 0.0
acceleration = 25.0
deceleration = 60.0
max_yaw_rate = 2.0
max_bank_deg = 15.0

[weapons_console]

[[weapons_console.phaser_banks]]
id = "fore"
facing_deg = 0.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 75.0
beam_damage_per_sec = 6.0
beam_duration_secs = 4.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.1, 0.1, 1.0]

[radar_appearance]
colour = [1.0, 0.2, 0.2]
size = 4.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_destroyer.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [1.0, 0.2, 0.2]

[comms]
range = 400.0

# ── Behaviour ────────────────────────────────────────────────────────────────

[behaviour]
initial_state = "patrol"

[[behaviour.state]]
name = "idle"
kind = "idle"
target_speed = 0.0

[[behaviour.state]]
name = "patrol"
kind = "patrolling"
waypoints = ["patrol_alpha", "patrol_beta", "patrol_gamma"]
loop_path = true
target_speed = 0.4

[[behaviour.state]]
name = "pursue"
kind = "pursuing"
target_speed = 0.9

[[behaviour.state]]
name = "attack"
kind = "attacking"
maintain_range = 50.0
target_speed = 0.8

[[behaviour.state]]
name = "warp_out"
kind = "warping_out"
duration_secs = 8.0
target_speed = 1.0

# ── Transitions ───────────────────────────────────────────────────────────────

# Any state: attacked → pursue attacker immediately.
[[behaviour.transition]]
from = ["patrol", "idle", "pursue", "attack"]
condition = "on_attacked"
to = "pursue"

# Patrolling or idle: enemy comes into detection range → pursue.
# (#475) Radius extended to 5000 so destroyers detect the player from
# anywhere on the map. The 400 radius in the original reinforcement
# variant is no longer needed — even the base destroyer now detects at
# 5000u.
[[behaviour.transition]]
from = ["patrol", "idle"]
condition = "enemy_in_range"
radius = 5000.0
to = "pursue"

# Pursuing: enemy enters weapons range → attack.
[[behaviour.transition]]
from = "pursue"
condition = "in_weapons_range"
to = "attack"

# Attacking: target destroyed → return to patrol.
[[behaviour.transition]]
from = "attack"
condition = "target_destroyed"
to = "patrol"

# Any active state: scenario unloaded → warp out gracefully.
[[behaviour.transition]]
from = ["patrol", "idle", "pursue", "attack"]
condition = "on_scenario_unloaded"
to = "warp_out"

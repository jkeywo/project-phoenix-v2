entities:
  - decision: redesign-compatible-incremental-migration
    core:
      status: accepted
      confidence: confirmed
      title: Playable Incremental Migration
      summary: "Keep shipped content and supported journeys working at each increment. Preserve the networking architecture, System-addressed admission and individual knowledge-limited System AI. Use one authoritative implementation per migrated capability; temporary definition/payload adapters have an explicit removal increment. Older saves and packs may require conversion or their compatible version."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-local-energy-flow
    core:
      status: accepted
      confidence: confirmed
      title: Local Energy Reserves and Flow-Limited Operation
      summary: "Increment 8 replaces planned ship-wide exhaustion with power flow into local System batteries, fullness-dependent passive drain and heat from changes in local charge. Apply the selected flow-cut and recovery policies, retaining operator intent. Coolant is consumable; used-coolant recycling remains provisional. This is target design, not the current runtime."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-independent-broad-focused-sensors
    core:
      status: accepted
      confidence: confirmed
      title: Independent Broad and Focused Sensors
      summary: "Increment 14 uses independent broad and focused scanner Systems with separate power demand. Focused enquiry does not pause broad collection. Both produce permitted observations through common evidence and Console knowledge processing. This replaces the earlier mutually exclusive scan-axis plan without claiming that current scan code has already migrated."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-static-celestial-bodies
    core:
      status: accepted
      confidence: confirmed
      title: Static Celestial Bodies
      summary: "Planets, moons, satellites and asteroid fields remain static. Moving entities are not orbiting bodies. Terrain can obstruct appropriate sensor and Comms paths. Coarse planetary mode retains ordinary planar capital-ship controls without restoring orbital body motion."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-no-message-capacity
    core:
      status: accepted
      confidence: confirmed
      title: No Simulated Message Capacity
      summary: "Comms conversations, sensor feeds, structured orders and receipts do not consume message-capacity pools, traffic budgets or congestion quotas. Preserve equipment, power, range, interference, terrain, channels, security and knowledge constraints. Outage-pending orders, receipts, AI reading time and finite listening/search coverage are distinct mechanisms."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-compatible-field-refits
    core:
      status: accepted
      confidence: confirmed
      title: Compatible Field and Facility Refits
      summary: "Increment 13 allows appropriate compatible equipment changes in the field using real equipment, parts, access and work time; major refits require suitable facilities. Authored mount/interface compatibility and actual resource costs govern fitting. No additional abstract fitting currency or ordinary player room/layout editor is introduced."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-authored-mission-planning
    core:
      status: accepted
      confidence: confirmed
      title: Authored HTN Missions and Crew-Aware Scheduling
      summary: "Future increment 22 composes parameterised activities using partial-order HTN domains and explicit library imports. Scenario trees execute lifecycles; Rhai retains sandboxed buffered effects; physical work uses ordinary admitted Systems and jobs. World owns planning, Gameplay owns machinery, Session supplies participation and Simulation connects contracts. One owner advances progression; hypothetical effects never establish completion."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-22.md defines ordered delivery and acceptance. Existing scenarios remain supported; increments 0–21 are unchanged."
        - "Schedule separate ship capability, human attention and shared physical constraints. Minute buckets forecast attention; exact simulation times govern dependencies/deadlines. Co-hosted Consoles share the operator budget. Combat effectiveness is balanced separately; planning forecasts do not reserve actual resources."
        - "Deadlines vary within authored bounds before commitment; announced deadlines change only through in-world causes. Replanning preserves history and earned advantages, supports refusal and partial failure, and never fabricates resources or forces player actions."
  - decision: redesign-persistent-mission-consequences
    core:
      status: accepted
      confidence: confirmed
      title: Continuing Modes and Persistent Mission Consequences
      summary: "Future increment 23 delivers authored Patrol, then War, then Sandbox using persistent real assets and commitments. Stable entity references, ownership/control, custody, passengers, service needs and objective credit retain authoritative owners. Situation completion never rolls back physical consequences."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-23.md defines the capture, service, return-to-port and evacuation demonstration before procedural search."
        - "Distinguish proposals, revealed offers, acceptance and completion. Ordinary observations, Comms and optional objectives reveal opportunities; acceptance is not a command. Outside actors change needs through actual work without automatic cross-objective credit."
  - decision: redesign-bounded-opportunity-discovery
    core:
      status: accepted
      confidence: confirmed
      title: Bounded Opportunity Discovery and Adaptive Direction
      summary: "Future increment 24 uses bounded GOAP-like search over the same activity operators around authored goals and values. Bind actual assets and needs, revalidate candidates and admit feasible optional opportunities into the HTN. Hypothetical search never mutates the world; uncertain player/NPC actions are not guaranteed effects."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-24.md defines discovery, admission, pacing, diagnostics and final acceptance."
        - "Adapt unannounced work within authored difficulty bounds, preserving committed deadlines, recovery and earned advantages. Prefer existing entities; include continuing obligations. Low input is not proof of boredom and delegation does not automatically create replacement chores. No message-capacity accounting is introduced."
        - "Bound depth, candidates and deterministic expansions; reject cycles, duplicates and unsupported effects. Exhaustion yields no offer while execution continues. Stable ordering, saved commitments/director history and necessary continuation preserve replay and restore."
        - "Retain Workshop and planetary activities, catalogue/shipped-content coverage and 2/4/6/8-seat audits. Validate schedules with scripted crews and meaningful participation with human playtests, separately from combat balance."

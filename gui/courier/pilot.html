<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.pilot.doc_title">Project Phoenix — Pilot Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: 16px; margin: 0; background: #000; overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; position: relative; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(14,17,23,0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; height: 100%; gap: 10px; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0; padding: 0 0 6px; flex-shrink: 0; border-bottom: 1px solid var(--edge); }
    ph-courier-radar, ph-blasters-controls, ph-sensor-panel, ph-helm-joystick, ph-lateral-thrust-joystick { flex-shrink: 0; }
    ph-courier-radar { width: 100%; aspect-ratio: 1 / 1; }
    .stick-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row > * { flex: 1; }
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    /* Camera buttons deliberately do NOT carry .overlay-toggle: closeAllOverlays
       clears the active state of everything with that class, which would wipe
       the camera highlight every time an overlay opens. */
    .overlay-toggle, .cam-btn { background: rgba(14,17,23,0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; }
    .overlay-toggle:hover, .cam-btn:hover { background: rgba(30,35,50,0.9); border-color: var(--ink-dim); }
    .overlay-toggle.active, .cam-btn.active { background: rgba(30,50,80,0.9); border-color: var(--cyan); color: var(--cyan); }
    .cam-sep { width: 1px; align-self: stretch; background: var(--edge); margin: 0 4px; }
    .overlay-toggle .unread-badge { display: none; margin-left: 6px; background: var(--fire-bright); color: #000; font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 1.4; }
    .overlay-toggle .unread-badge.show { display: inline-block; }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(14,17,23,0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; }
    .overlay-back:hover { background: rgba(30,35,50,0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(5,8,24,0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0 0 6px; flex-shrink: 0; border-bottom: 1px solid var(--edge); }
    .overlay-panel ph-navigation-map, .overlay-panel ph-comms-contact-list, .overlay-panel ph-comms-current-message, .overlay-panel ph-objective-list { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    /* Red alert is AI-run on this hull: show it, never offer a button. */
    .alert-badge { font-family: "Chakra Petch", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.2em; padding: 2px 8px; border: 1px solid var(--fire-bright); color: var(--fire-bright); text-transform: uppercase; display: none; }
    .alert-badge.show { display: inline-block; }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .hero h1 { font-size: 20px; } .hero h1 .sub { font-size: 10px; }
      .console-body { grid-template-columns: 1fr; overflow-y: auto; }
      .console-body .col { padding: 8px; }
      .overlay-toggle, .cam-btn { font-size: 11px; padding: 6px 10px; letter-spacing: 0.1em; }
      .overlay-panel { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Pilot Console" data-i18n-attr="data-screen-label:console.pilot.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.pilot.title">PILOT</span><span class="sub" data-i18n="console.pilot.subtitle">COURIER</span></h1>
        <div class="hero-controls">
          <span class="alert-badge" id="red-alert-badge" data-i18n="console.common.red_alert_badge">Red Alert</span>
          <button class="overlay-toggle" id="nav-toggle" data-active="false" data-i18n="console.common.nav_toggle">Nav</button>
          <button class="overlay-toggle" id="comms-toggle" data-active="false"><span data-i18n="console.common.comms_toggle">Comms</span><span class="unread-badge" id="comms-unread">!</span></button>
          <button class="overlay-toggle" id="obj-toggle" data-active="false" data-i18n="console.common.objectives_toggle">Objectives</button>
          <span class="cam-sep"></span>
          <button class="cam-btn" id="cam-cinematic" data-i18n="console.pilot.cam_cinematic">Cinematic</button>
          <button class="cam-btn" id="cam-fore" data-i18n="console.pilot.cam_fore">Fore</button>
        </div>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.pilot.radar">Radar</h2>
          <ph-courier-radar id="courier-radar"></ph-courier-radar>
          <ph-sensor-panel id="sensor-panel"></ph-sensor-panel>
        </div>
        <div class="col">
          <h2 data-i18n="console.pilot.flight_and_weapons">Flight &amp; Weapons</h2>
          <div class="stick-row">
            <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
            <ph-lateral-thrust-joystick id="lateral-thrust-joystick"></ph-lateral-thrust-joystick>
          </div>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
          <ph-blasters-controls id="blasters-controls"></ph-blasters-controls>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.pilot.station_footer">PILOT STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_target">NO TARGET</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <div class="overlay-panel" id="nav-overlay">
      <button class="overlay-back" id="nav-back">&#8592; Back</button>
      <h2 data-i18n="console.pilot.navigation">Navigation</h2>
      <ph-navigation-map id="navigation-map"></ph-navigation-map>
    </div>
    <div class="overlay-panel" id="comms-overlay">
      <button class="overlay-back" id="comms-back">&#8592; Back</button>
      <h2 data-i18n="console.pilot.comms">Comms</h2>
      <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
      <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
    </div>
    <div class="overlay-panel" id="obj-overlay">
      <button class="overlay-back" id="obj-back">&#8592; Back</button>
      <h2 data-i18n="console.pilot.objectives">Objectives</h2>
      <ph-objective-list id="objective-list"></ph-objective-list>
    </div>
  </div>
  <script type="module">
    import '../components/ph-courier-radar.js';
    import '../components/ph-sensor-panel.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-lateral-thrust-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import '../components/ph-blasters-controls.js';
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-current-message.js';
    import '../components/ph-navigation-map.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';

    var OVERLAY_IDS = ['nav-overlay', 'comms-overlay', 'obj-overlay'];

    function closeAllOverlays() {
      OVERLAY_IDS.forEach(function(oid) {
        var el = document.getElementById(oid);
        if (el) el.classList.remove('open');
      });
      document.querySelectorAll('.overlay-toggle').forEach(function(b) {
        b.dataset.active = 'false';
        b.classList.remove('active');
      });
    }

    function toggleOverlay(id, btnId) {
      var overlay = document.getElementById(id);
      var btn = document.getElementById(btnId);
      var isOpen = btn.dataset.active === 'true';
      closeAllOverlays();
      if (!isOpen) {
        overlay.classList.add('open');
        btn.dataset.active = 'true';
        btn.classList.add('active');
      }
    }

    // Generic system-id-keyed payload (issue #825): resolve each panel's view
    // from the fine system ids this station owns. NOTE: no shipped TOML
    // declares a 'pilot' station any more (the two-station Courier replaced
    // the single-pilot layout) — this page is dormant, migrated mechanically
    // so it works again the moment a TOML re-declares 'pilot'.
    function system(s, ...ids) { for (const id of ids) if (s.systems && s.systems[id]) return s.systems[id]; return {}; }
    initConsole({
      name: 'pilot',
      // s is a SystemStationConsolePayload — see the @typedef in gui/console-state.js.
      render: function(s) {
        var w = system(s, 'tactical-radar', 'blaster-fore');
        var sensors = system(s, 'sensors', 'sensor-radar');
        var n = system(s, 'navigation');
        var c = system(s, 'comms');
        var cap = system(s, 'captain', 'viewscreen', 'red-alert');
        var h = system(s, 'helm-thrust', 'helm-joystick', 'helm-steering');

        // One radar, fed the weapons blips — its `shows` list is the authored
        // union of helm/sensors/tactical. No `range`: ph-radar ignores it,
        // blips arrive already projected. No phaser/torpedo arcs either; this
        // hull has neither.
        document.getElementById('courier-radar').state = {
          blips: w.blips || [],
          x: w.ship_x || 0,
          z: w.ship_z || 0,
          speed: w.ship_speed || 0,
          ship_heading: w.ship_heading || 0,
          phaser_arcs: [],
          torpedo_arcs: [],
          target_uuid: w.target_uuid || null,
          selected_target_uuid: w.target_uuid || null,
        };
        // Same tap fills the sensor panel — ph-courier-radar sends both
        // set_target and set_sensors_target.
        document.getElementById('sensor-panel').state = sensors;

        document.getElementById('helm-joystick').state = { auto: !!h.helm_auto };
        document.getElementById('lateral-thrust-joystick').state = { auto: !!h.lateral_auto };
        document.getElementById('impulse-btn').state = {
          state: h.impulse_charge_progress > 0 ? 'charging' : 'ready',
          charge_pct: (h.impulse_charge_progress || 0) * 100,
          auto: !!h.helm_auto,
        };
        document.getElementById('boost-btn').state = {
          available: !!h.boost_enabled,
          active: !!h.boost_active,
          recharge_pct: h.boost_battery != null ? h.boost_battery * 100 : 100,
          auto: !!h.helm_auto,
        };
        document.getElementById('blasters-controls').state = { banks: w.blasters || [] };

        document.getElementById('comms-contact-list').state = { contacts: c.contacts || [] };
        var messages = c.messages || [];
        document.getElementById('comms-unread').classList.toggle(
          'show', messages.some(function(m) { return !m.is_read; })
        );
        var threadMsg = messages.find(function(m) { return !m.is_read; })
          || messages[messages.length - 1] || null;
        document.getElementById('comms-current-message').state = { thread: threadMsg, rejection: c.rejection };

        document.getElementById('navigation-map').state = {
          blips: n.blips || [],
          range: n.radar_range || 5000,
          ship_pos: { x: n.ship_x || 0, z: n.ship_z || 0 },
          ship_heading: n.ship_heading || 0,
          waypoint: n.waypoint || null,
        };

        document.getElementById('objective-list').state = {
          objectives: cap.objectives || [],
          boosted_objective_id: cap.boosted_objective_id ?? null,
        };

        // Red alert runs itself on this hull — report it, don't offer it.
        document.getElementById('red-alert-badge').classList.toggle('show', !!cap.red_alert);

        var view = cap.view_direction || '';
        document.getElementById('cam-fore').classList.toggle('active', view === 'camera_fore');
        document.getElementById('cam-cinematic').classList.toggle('active', view === 'cinematic');

        var targetName = w.target_name || w.target_uuid || null;
        var footerTarget = document.getElementById('footer-target');
        footerTarget.textContent = targetName ? '◉ ' + targetName : 'NO TARGET';
        footerTarget.style.color = targetName ? 'var(--fire-bright)' : 'var(--ink-faint)';
        document.getElementById('station-damage').state = s.own_hull || null;
      }
    });

    document.getElementById('nav-toggle').addEventListener('click', function() { toggleOverlay('nav-overlay', 'nav-toggle'); });
    document.getElementById('comms-toggle').addEventListener('click', function() { toggleOverlay('comms-overlay', 'comms-toggle'); });
    document.getElementById('obj-toggle').addEventListener('click', function() { toggleOverlay('obj-overlay', 'obj-toggle'); });
    document.getElementById('nav-back').addEventListener('click', closeAllOverlays);
    document.getElementById('comms-back').addEventListener('click', closeAllOverlays);
    document.getElementById('obj-back').addEventListener('click', closeAllOverlays);

    // Both round-trip through set_view; the server maps "cinematic" to
    // ViewMode::Cinematic and "camera_*" to the matching rig marker.
    document.getElementById('cam-fore').addEventListener('click', function() {
      window.sendAction('set_view', { direction: 'camera_fore' });
    });
    document.getElementById('cam-cinematic').addEventListener('click', function() {
      window.sendAction('set_view', { direction: 'cinematic' });
    });
  </script>
</body>
</html>

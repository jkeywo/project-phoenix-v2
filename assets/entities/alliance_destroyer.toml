# ── Coupling-system damage entries (issue #1164 S11a) ────────────────────────
# The tractor, umbilical and dock (authored as systems further down) each carry
# a hull entry so a storm can KNOCK THEM OUT — this is the damage half of how
# the Falling Skyway storm now reaches the crew's external work. The old
# operations model let a `region_effect = "slow_zone"` interrupt THROTTLE the
# tow/repair rate; there is no throttle any more. A radiation band's
# `damage_zone` picks these systems the same way it picks any other (issue
# #1052's ordered `RegionDamage` draw over `EntitySystemHull`), and a tractor or
# umbilical damaged to `Disabled` stops where it stands through its OWN
# interruption — danger reaching an operational system exactly as it reaches a
# gun or an engine.
#
# 30 HP each MIRRORS the shipped NPC counterparts (`ship_harrow_tug.toml`,
# `alliance_tender.toml`) that own the identical systems — the player/NPC
# symmetry PRD #1143 is built on — and at the radiation band's ~2.5 effective
# points a second that is about ten seconds of exposure to disable one, a felt
# threat across a ~48-second crossing rather than an instant loss. These three
# are OPERATIONAL, not combat, systems: they sit OUTSIDE the 300-point combat
# durability ladder above (every hull that ladder was tuned against authors none
# of them), so the hull's combat pool is unchanged in intent even though the
# raw `is_destroyed` sum now includes them.
[[hull.system_hull]]
system_id = "tractor"
max_hp = 30
damaged_threshold_pct = 0.5
disabled_threshold_pct = 0.15
debuff_magnitude = 0.15

[[hull.system_hull]]
system_id = "umbilical"
max_hp = 30
damaged_threshold_pct = 0.5
disabled_threshold_pct = 0.15
debuff_magnitude = 0.15

[[hull.system_hull]]
system_id = "dock"
max_hp = 30
damaged_threshold_pct = 0.5
disabled_threshold_pct = 0.15
debuff_magnitude = 0.15

[repair]
repair_team_count = 2
travel_duration_secs = 5
repair_rate_hp_per_sec = 0.5

# External repair-team dispatch (issue #1161), the replacement for the retired
# `field_repair` operations capability (issue #1164 S11a). The old capability
# sent one of the hull's two teams to a structure to put condition back into it
# in the field; the same trade is now the engineering-owned `repair` system's
# `DispatchExternalRepair` verb, admission-gated exactly like every other system
# and AI-drivable through `operate_external_repair_ai` (#1162).
#
# The two numbers are carried straight across from the `field_repair` capability
# they replace: `range = 400` was its reach, and `repair_rate = 0.5` is its
# `condition_per_second` — half a condition point a second on the target's own
# track, so a team dispatched abroad restores the same 15 points over 30 seconds
# the old verb paid, with one of the hull's two teams committed for the duration
# (the "own repairs slow while a team is away" trade the tender probe proves).
# [ai] Both unratified, preserved from the capability rather than re-tuned here.
[repair.external_dispatch]
range = 400.0
repair_rate = 0.5

[weapons_console]
power_multipliers = [ -0.5, 0, 0.25, 0.5 ]
torpedo_arc_color = [ 1, 0.55, 0.2, 0.15 ]

# Re-authored by issue #952, which retired the `sensors` power group and with it
# the only thing that ever scaled this number. Every tactical radar range in the
# fleet was tuned against a live horizon of `range x 0.667` — the rung those
# hulls rested `sensors` at — so leaving the authored figures alone would have
# widened every acquisition horizon in the fleet by half, silently, as a side
# effect of a reactor change. The multiplier is folded into the number instead:
# the live horizon is unchanged, and it is now simply what is written here.
[weapons_console.radar]
range = 50
shows = [ "player", "ship", "asteroid", "station", "missile", "torpedo", "region" ]
selects = [ "ship", "station", "asteroid" ]

# 360° suppression phaser (issue #639): omni-directional suppression beam.
[[weapons_console.phaser_banks]]
id = "omni"
facing_deg = 0
fire_arc_deg = 360
auto_arc_deg = 360
beam_range = 30
beam_damage_per_sec = 3
beam_duration_secs = 4
cooldown_secs = 4
beam_color = [ 0.25, 0.75, 1, 1 ]
marker = "phasers_omni"

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). One unconditional rule: when the host offers the bank a
  # decision it fires. Every readiness gate — availability, cooldown, range,
  # arc, target validity — is the host's and is unchanged; the policy is the
  # authored DECISION layered on top, and `idle = true` is how a bank opts out.
  [weapons_console.phaser_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapons_console.phaser_banks.ai.rule]]
  priority = 0
  channel = "phaser_fire"
  when = "fact(red_alert) >= param(min_alert_to_fire)"
  verb = "fire_phaser"

# Forward blaster banks (issue #639): 45° forward blasters, port and starboard.
[[weapons_console.blaster_banks]]
id = "port"
marker = "blaster_port"
facing_deg = 0
fire_arc_deg = 45
volley_count = 3
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
# Blaster damage (#915 tuning pass). Was 20. The two forward banks are the
# destroyer's whole offence — 2 x 3 x 20 every 5 s is ~24 dps, which folded the
# Harrow patrol in a single approach, before the fight became one.
#
# This number is a STEP FUNCTION, not a dial, because it decides how many volley
# cycles a kill costs. Measured over 25 seeds against the patrol (the 5-seed demo
# config cannot resolve this matchup at all — see the note in
# scripts/balance-runs.demo.toml):
#
#   14  cruiser matchup collapses to 1/5
#   15  patrol 56% win, +69 margin, 36.1 s median
#   16  patrol 56% win, +73 margin, 36.1 s median   <- here
#   17  patrol 100% win, +109 margin, 31.1 s median
#   20  patrol 100% win, +184 margin, 21.1 s median
#
# 16 is the top of the near-even band: the patrol duel is a genuine coin flip
# rather than a fight the destroyer is scripted to win. Anything from 17 up is a
# guaranteed sweep. Moving between those two bands is a DESIGN choice about the
# demo, not a tuning nudge — there is nothing in between.
damage = 16
shield_pierce = 0.1
range = 35

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). Mirror of the phaser banks on the `blaster_fire`
  # channel: unconditional, with the host still enforcing availability,
  # cooldown, range, arc and target validity before the volley starts.
  [weapons_console.blaster_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapons_console.blaster_banks.ai.rule]]
  priority = 0
  channel = "blaster_fire"
  when = "fact(red_alert) >= param(min_alert_to_fire)"
  verb = "fire_blaster"

[[weapons_console.blaster_banks]]
id = "starboard"
marker = "blaster_starboard"
facing_deg = 0
fire_arc_deg = 45
volley_count = 3
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
# Blaster damage (#915 tuning pass). Was 20. The two forward banks are the
# destroyer's whole offence — 2 x 3 x 20 every 5 s is ~24 dps, which folded the
# Harrow patrol in a single approach, before the fight became one.
#
# This number is a STEP FUNCTION, not a dial, because it decides how many volley
# cycles a kill costs. Measured over 25 seeds against the patrol (the 5-seed demo
# config cannot resolve this matchup at all — see the note in
# scripts/balance-runs.demo.toml):
#
#   14  cruiser matchup collapses to 1/5
#   15  patrol 56% win, +69 margin, 36.1 s median
#   16  patrol 56% win, +73 margin, 36.1 s median   <- here
#   17  patrol 100% win, +109 margin, 31.1 s median
#   20  patrol 100% win, +184 margin, 21.1 s median
#
# 16 is the top of the near-even band: the patrol duel is a genuine coin flip
# rather than a fight the destroyer is scripted to win. Anything from 17 up is a
# guaranteed sweep. Moving between those two bands is a DESIGN choice about the
# demo, not a tuning nudge — there is nothing in between.
damage = 16
shield_pierce = 0.1
range = 35

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). Mirror of the phaser banks on the `blaster_fire`
  # channel: unconditional, with the host still enforcing availability,
  # cooldown, range, arc and target validity before the volley starts.
  [weapons_console.blaster_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the

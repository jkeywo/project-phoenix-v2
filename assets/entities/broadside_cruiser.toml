# Optional increment-15 battery test hull. Existing Cruiser remains unchanged.
# Added physical locker space and finite rounds are explicit; generation is unchanged.
# Sustained aft beam and side-facing two-barrel bolt share the existing Weapons bus.
includes = [ "alliance_cruiser.toml" ]
name = "entity.broadside_cruiser.name"

[[weapon]]
id = "phaser-aft"
strategy_id = "aft"
marker = "phasers_aft"

[weapon.mount]
facing_deg = 180
fire_arc_deg = 270
range = 40

[weapon.delivery]
kind = "beam"
damage_per_sec = 32
duration_secs = 6
cooldown_secs = 6
auto_arc_deg = 270
cycle_jitter = 0
color = [ 0.25, 0.75, 1, 1 ]
operation = "sustained"

[weapon.ai.param]
min_alert_to_fire = 1

[[weapon.ai.rule]]
priority = 0
channel = "phaser_fire"
when = "fact(red_alert) >= param(min_alert_to_fire)"
verb = "fire_phaser"

[weapon.impact]
damage_type = "laser"
penetration = 20

[[weapon]]
id = "blaster-side"
targets = ["ship", "asteroid"]
strategy_id = "side"
barrels = [ "phasers_fore", "phasers_aft" ]

[weapon.mount]
facing_deg = 90
fire_arc_deg = 40
range = 35

[weapon.delivery]
kind = "bolt"
volley_count = 0
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
damage = 16
shield_pierce = 0.1
recoil_impulse = 6

[weapon.delivery.rounds]
store = "local-kinetic-rounds"
amount = 1

[weapon.ai.param]
min_alert_to_fire = 1

[[weapon.ai.rule]]
priority = 0
channel = "blaster_fire"
when = "fact(red_alert) >= param(min_alert_to_fire)"
verb = "fire_blaster"

[weapon.impact]
damage_type = "physical"
penetration = 25

[[weapon.pattern]]
barrels = [ 0, 1 ]
offset_secs = 0

[[system]]
id = "blaster-side"
kind = "blaster_bank"
console = "tactical"
power_group = "energy-blaster-side"

[[system.damage_component]]
id = "operation"
binding = "operation"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "intake"
binding = "intake"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "cooling"
binding = "cooling"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1


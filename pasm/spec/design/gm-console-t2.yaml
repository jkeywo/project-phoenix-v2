  - component: gm-t3-spawn-undo-exposure
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Taking a GM Placement Back Before Two Seconds of Sensor Exposure
      summary: "A GM placement joins the typed inverse family, under one extra cutoff: it may be taken back only while it has spent under two cumulative simulation seconds inside the sensor range of ANY player ship. An Applied SpawnPaletteEntity records GmAffectedField::SpawnedEntity — the placement's deterministic scenario name and the fact that an entity now stands under it — and starts a GmSpawnExposure stopwatch on that name. observe_gm_spawn_exposure counts one fixed step per step in which the placement is inside some player hull's effective_sensor_range; overlapping hulls count once, leaving the range holds the count rather than resetting it, and reaching the cutoff closes a permanent latch. Below the cutoff the inverse is the ordinary safe removal: gm_despawn::validate_target decides, and the placement leaves through the same DestroyEntity cascade a GM despawn runs. The counter and its latch are captured in the snapshot and folded into the digest; the journal projection publishes current eligibility in milliseconds so a GM reads the clock before it runs out."
      rationale:
        - "[ai] Issue #1443 (PRD #1420 M5 story 4), carrying PRD #1418's usability contract. The inverse is an ordinary UndoGmAction through the #1442 family, so admission, ordering, idempotency, cross-peer agreement, snapshot capture and replay are unchanged; exposure narrows WHEN it may run and adds no second mechanism."
        - "[ai] GmAffectedField::SpawnedEntity names the placement by its deterministic scenario NAME, not by uuid. The reducer runs in PreUpdate and decides the name there; the uuid is not minted until the ordinary trigger pipeline drains the arm in FixedUpdate. Keying on the uuid would leave a fixed step in which a placement was unwatched, and every peer derives the same name from the same canonical sequence."
        - "[ai] Exposure is counted as fixed STEPS, never differenced against SimTick, for observe_idle_npcs' reason: a difference sampled outside the fixed loop advances across a pause and takes its answer from whichever frame read the counter. Pause therefore needs no special case — a step that never starts cannot count — and the boundary is exact rather than frame-paced."
        - "[ai] Coverage is a union: exposed() asks whether ANY player hull is in range, so three ships watching one raider is still one second per second. Concealment and identification are deliberately not consulted — a ContactMode::Conceal override changes what a console draws, not that the ship was there to be found — and PRD #1420 makes exposure the ONE cutoff, so firing and damage add none of their own."
        - "[ai] A player hull is the authored `player` tag or a live FleetSlotOf seat, the same two replicated facts gm_despawn::removable protects a fleet hull by, and its horizon is ship::sensors::effective_sensor_range — the simulation's own answer to how far that hull can see. Nothing reads LocalShip or ShipClientConfigResource: both are peer-local, and this counter is folded into the authoritative digest."
        - "[ai] The latch is STORED, not recomputed. It is a permanent refusal that no later world state re-opens, and the cumulative count behind it is history a restored world cannot be asked for. A resume that dropped either would hand a GM back an undo the crews had already had two seconds to see, and make eligibility a function of when somebody saved. SNAPSHOT_FORMAT bumped 34 -> 35."
        - "[ai] The safe-removal policy still decides the rest: being placed by a GM two ticks ago exempts nothing, so a palette entry whose authored tags lack gm_removable refuses with the ordinary protected-entity reason. UnknownEntity from that gate is reported as affected-state-changed instead, because 'nothing carries that uuid' IS the affected field having moved. A placement still armed and undrained is withdrawn from the pending queue — nothing exists to remove, and cancelling the arm is strictly smaller than spawning and then removing."
        - "[ai] Refusals are separately named for #1442's reason: sensor-exposure-elapsed says the window shut, inverse-unsupported says this build kept no stopwatch for that placement, affected-state-changed says it no longer stands. The request never carries the exposure figure — it is a fact about the world, which the reducer reads for itself at the apply tick, so a preview that has gone stale is refused there rather than honoured."
        - "[ai] Per PRD #1418 stories 28-31: the journal row publishes GmSpawnExposureStatus in milliseconds of a stated limit, the preview renders it as a sentence beside the eligibility one, and the Undo control is hidden — never disabled — once the window shuts or when a session reports no clock at all. The clock republishes constantly, so the panel's existing reading discipline is what keeps selection, focus and the control stable underneath it; no republish opens a dialog."

[base]
offset = [ 0, -7.787349481562496, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 12.62423190002327, 12.62423190002327, 12.62423190002327 ]

[extents]
min = [ -11.617948270812136, -7.778420757289907, -11.95630673922666 ]

  - component: gm-t2-authored-npc-doctrine
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Authored NPC Doctrine Selection
      summary: "Issue #1308 selects a scenario-authored NPC doctrine palette entry through the typed SetNpcDoctrine action. The palette declares stable id, display label, explicit eligible NPC identities and ordinary DoctrineObjective entries. Browser ingress carries only target and palette identities; the Rhai set_npc_doctrine effect resolves an authored entity name and reaches the same live applier. The ordinary BehaviourSection scorer, blackboards, AI command producers and domain appliers operate the selected intent."
      rationale:
        - "[ai] One compatibility predicate serves projection and application. It checks explicit target membership, live NPC identity, configured directive consumers and the global anchors ordinary AI reads. Hail and Order are unavailable because their ordinary producers consume only LocalShip mission objectives. Fleet/player hulls and civilian traffic are excluded because their existing owners retain control. Damage and temporary puppeting do not redefine authored compatibility. Missing targets, withdrawn entries and incompatible actors produce structured refusals without partial mutation."
        - "[ai] Absolute selection is idempotent. A changed profile replaces standing doctrine and resets only its route cursors. Canonical order resolves simultaneous choices; the journal and bounded results retain operator, correlation, target and authored choice. Activity entries carry the NPC ship reference for the existing semantic ship filter."
        - "[ai] The optional applied profile stores its exact doctrine and original baseline with the entity, restores ordinary BehaviourSection before consumers run, and contributes a UUID-sorted digest section only when present. The binary fold enumerates every doctrine field rather than serializing the authoring schema's flattened unknown-field map. Layer unload withdraws its palette entries but does not revoke already-applied intent. A complete empty snapshot clears a bootstrap selection. Existing doctrine-free bytes remain unchanged."
        - "[ai] The NPC panel uses the shared confirmation category npc.directive with immediate default. Intent and its human-readable description are captured before acceptance; correlation and Pending state are created only after acceptance. Withdrawing the selected entry preserves it visibly and disables Apply until explicit reselection. The panel displays authored choices and actual scored intent without exposing raw AI policy or controls."

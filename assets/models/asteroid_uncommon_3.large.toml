[base]
offset = [ 0, -1.7024513002354278, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 4.211118469659542, 4.211118469659542, 4.211118469659542 ]

[extents]
min = [ -3.9174044563185233, -1.7057946015238568, -3.997041185824851 ]
max = [ 3.9457958194827176, 1.7024513002354278, 4 ]
size = [ 7.8632002758012405, 3.4082459017592845, 7.997041185824851 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_uncommon_3
# Same bands and ratios as the four common asteroids, so every rock in a
# field switches level at the same distance. No `remesh_voxel_size` here:
# the import already brought this mesh down to the commons' density with a
# UV-preserving Blender collapse (scripts/blender-decimate.py), which is
# what the voxel pre-pass was standing in for on the stubborn commons.
[[lod]]
max_distance = 25.0
model = "assets/models/asteroid_uncommon_3.glb"

[[lod]]
max_distance = 150.0
model = "assets/models/asteroid_uncommon_3_lod1.glb"

[lod.generate]
source = "assets/models/asteroid_uncommon_3.glb"
ratio = 0.15
error = 0.01
texture_size = 512

[[lod]]
max_distance = 300.0
model = "assets/models/asteroid_uncommon_3_lod2.glb"

[lod.generate]
source = "assets/models/asteroid_uncommon_3.glb"
ratio = 0.1
error = 0.1
texture_size = 256

[[lod]]
shape = "sphere"
scale = [ 1.0, 0.5, 1.0 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_common_2
# Ladder ported from asteroid_common_4 (bands, ratios, far-sphere squash)
# so all four common asteroids share one visual LOD profile. This mesh
# turned out to be stubborn the same way: a plain regeneration at these
# ratios comes out LARGER than the source and the growth gate refuses it
# (confirmed by running the regeneration). Reach for the Blender voxel
# pre-pass (remesh_voxel_size below + --remesh) before --force — see
# scripts/blender-voxel-remesh.py and asteroid_common_4's sidecar.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_common_2.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_common_2_lod1.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_common_2.glb"
ratio = 0.319
error = 0.01
texture_size = 256

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_common_2_lod2.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_common_2.glb"
ratio = 0.113
error = 0.01
texture_size = 128

[[lod]]
billboard = "assets/models/asteroid_common_2_lod3.png"
scale = [ 1.988, 1.3242, 1.0 ]

[lod.capture]
source = "assets/models/asteroid_common_2.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

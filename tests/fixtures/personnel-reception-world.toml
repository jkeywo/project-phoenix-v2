# Actual optional reception consumer; no fabricated custody/condition/work.
[global]
seed=191919
[player_spawn]
position=[0,0,0]
[[ship_slot]]
id="crew"
label="Crew"
default_ship="assets/entities/reception_carrier.toml"
[[ship_slot.ships]]
template_path="assets/entities/reception_carrier.toml"
[[entity]]
template_path="assets/entities/reception_carrier.toml"
id="player-ship"
name="player-ship"
spawn_on="game_start"
[[entity]]
template_path="assets/entities/personnel_pod.toml"
id="personnel-pod"
name="personnel-pod"
spawn_on="game_start"
carried_by={parent="player-ship",bay="probe-bay"}
[[entity]]
template_path="assets/entities/physical_probe.toml"
id="empty-probe"
name="empty-probe"
spawn_on="game_start"
carried_by={parent="player-ship",bay="probe-bay"}
[[entity]]
template_path="assets/entities/reception_outpost.toml"
id="receiver"
name="receiver"
transform={position=[0,0,-28]}

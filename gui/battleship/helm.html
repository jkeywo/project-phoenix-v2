<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.battleship_helm.doc_title">Project Phoenix — Helm Console</title>
  <script src="../bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; align-self: flex-start; }
    .hero h1 { margin: 0; font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); }
    .hero h1 .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); color: var(--ink-faint); }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
    .ctrl-col { min-height: 0; display: flex; flex-direction: column; gap: 12px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    ph-helm-radar, ph-helm-joystick { flex: 1; min-height: 0; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; } .ctrl-col { padding: 8px; } }
    /* Landscape is height-starved, so the hero stops being an in-flow row and
       becomes a bar floating over the top of the chart: `.console-body` then
       gets the panel's whole content height and the radar grows into it. The
       offsets mirror the landscape `body .panel-inner` padding console.css
       forces (16px top / 20px right / 44px left) so the bar starts exactly at
       the content box — the 44px is the settings cog's gutter, which the bar
       must never cover. `pointer-events: none` keeps the radar draggable
       underneath. Portrait keeps the hero in flow.

       Only the chart runs under the bar; the control column is pushed clear of
       it — and still ends up taller than it was with the hero in flow.

       The radar takes its width from its (definite) height, so a bare `1fr`
       track picks that width up as its automatic minimum and the grid overflows
       its container. `minmax(0, 1fr)` is what lets the track shrink below that;
       the max-width clamp then letterboxes the radar rather than pushing the
       controls out. */
    @media (orientation: landscape) {
      /* The floating bar's height: its own floor, and what the control
         columns clear so that only the chart runs underneath it. */
      :root { --hero-bar: 34px; }
      .hero {
        position: absolute; z-index: 3; pointer-events: none;
        top: 16px; left: 44px; right: 20px;
        min-height: var(--hero-bar); align-items: center; padding: 2px 10px;
        background: rgba(var(--rgb-base), 0.92); border: 1px solid var(--line-faint);
      }
      .hero h1 { font-size: var(--text-xl); line-height: 26px; }
      .hero h1 .sub { display: inline; margin-top: 0; margin-left: 14px; }
      .console-body { grid-template-columns: minmax(0, 1fr) 300px; }
      .console-body .ctrl-col { margin-top: calc(var(--hero-bar) + 6px); }
      /* `isolation` matters: ph-helm-radar's readouts are `z-index: 10` inside
         its shadow root, and the host is only `position: relative` — with no
         stacking context of its own they escape into the root one and paint
         straight through the bar that is supposed to be above them. */
      ph-helm-radar { width: auto; height: 100%; aspect-ratio: 1 / 1; max-width: 100%; max-height: 100%; justify-self: center; isolation: isolate; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Helm Console" data-i18n-attr="data-screen-label:console.helm.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.helm.title">HELM</span><span class="sub" data-i18n="console.battleship_helm.subtitle">PROPULSION &amp; COURSE</span></h1>
        <span class="auto-badge" id="helm-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
      </div>
      <div class="console-body">
        <ph-helm-radar id="helm-radar"></ph-helm-radar>
        <div class="ctrl-col">
          <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span data-i18n="console.helm.station_footer">HELM STATION</span>
        <span class="spacer"></span>
        <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
        <ph-station-damage id="station-damage"></ph-station-damage>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-helm-radar.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/battleship/helm.console.js (issue #1235): the
    // shared Helm renderer + this hull's variant (no lateral joystick, plain
    // contact-count footer, no bespoke tail). s is a HelmConsolePayload — see
    // the @typedef in gui/console-state.js. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './helm.console.js';
    initConsole({ name: 'helm', family: 'helm', render: renderStation });
  </script>
</body>
</html>

# [ai] Independent paid acquisition uses each actual fitted radar and its own authored coverage/filter.
[[sensing.broad]]
reading_ticks = 120
system = "tactical-radar"
sample_interval_secs = 0.5
identity_secs = 1
classification_secs = 3
assessment_secs = 6
position_error = 2
drift_error_per_sec = 0.5
track_retention_secs = 60

[sensing.control]
combat_lock = "tactical-radar"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.destroyer_helm.doc_title">Project Phoenix — Helm Console</title>
  <script src="../bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    /* The two rails this scope sits between (issue #1375). 200px is what
       ph-lateral-thrust-joystick's 180px pad wants; 240px is ph-helm-joystick's
       dial at full size. Everything else about the scope's size — square, side
       = min(free width, free height) — is gui/console.css's one `.scope-cell`
       rule, which is why this document no longer carries an aspect-ratio of its
       own or a landscape variant of one.

       `--scope-rail-min` is where those rails STOP shrinking, and this is the
       only console that needs one: no other hull puts a scope between two
       control rails, and 200 + 240 + two gutters is more than a 650x450 window
       has to give. Both rails yield alongside the square rather than the
       square alone taking the shortfall, and 160px is the floor — below it
       ph-helm-joystick's dial (inset rings at 52px, a 56px nub) stops being a
       dial. Both widgets size themselves to the rail, so a shrunk rail is a
       smaller control, never a control drawn over the scope. */
    .console-body { --scope-rail-start: 200px; --scope-rail-end: 240px; --scope-rail-min: 160px; }
    .console-body .ctrl-col { display: flex; flex-direction: column; justify-content: space-evenly; gap: 12px; min-height: 0; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    /* Wraps because this rail shrinks (issue #1375). IMPULSE and BOOST side by
       side want ~216px of type; the rail's floor is 160px, so on a small
       landscape screen they go one above the other instead of running out
       past the rail and over the scope. */
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-row > * { flex: 1 1 6rem; }
    /* Contextual dock control (issue #1159): shown only while a berth is in
       range or a dock is held, so a hull with no dock system is unchanged. */
    .dock-panel { flex-shrink: 0; border-top: 1px solid var(--edge); padding-top: 8px; margin-top: 4px; }
    .dock-panel[hidden] { display: none; }
    .dock-row { display: flex; align-items: center; gap: 10px; }
    .dock-btn { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.14em; padding: 6px 14px; background: rgba(var(--rgb-panel), 0.8); color: var(--ink); border: 1px solid var(--edge); cursor: pointer; min-height: var(--control-hit-min); }
    .dock-btn.docked { background: var(--loaded); color: var(--surface-void); border-color: var(--loaded); }
    .dock-status { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    .dock-refusal { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--reloading); margin-top: 6px; }
    /* Under-tow-load indicator (issue #1157): shown only while this ship's
       tractor holds a target, so a hull with no tractor is unchanged. */
    .tow-load-panel { flex-shrink: 0; border-top: 1px solid var(--edge); padding-top: 8px; margin-top: 4px; display: flex; align-items: center; gap: 8px; }
    .tow-load-panel[hidden] { display: none; }
    .tow-load-label { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.14em; color: var(--reloading); }
    .tow-load-target { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }

    /* Portrait (issue #1376, John's 2026-09-06 decision): nothing scrolls.
       Stacking three full-width blocks — the scope, then this rail's own
       240px dial, 180px pad and two buttons — stood 1035px tall on an 812px
       phone with only the `overflow-y: auto` below to reach BOOST, which is
       exactly what the old `order: -2`/`order: -1` stack did. Instead the
       full-width square scope sits on top and the two rails share ONE ROW
       beneath it, each shrinking to its half of the width — the joystick's
       well is fluid down to that width (see ph-helm-joystick.js's `.well`),
       and the lateral pad the same way. `.helm-scope-row` (gui/console.css)
       is the shared rule this document opts into rather than spelling out a
       grid track list of its own — the plain `.scope-row` stack every other
       console keeps still applies where this class is absent.
       `--scope-rail-start/-end/-min` are the landscape rail's own properties;
       they are simply inert in portrait, same as before. `overflow-y: auto`
       stays as the safety net #1375 established — proved by screenshot
       (issue #1376 commit) never to trigger at 375x812 or 390x844, it is
       what a console whose stack outgrows some future viewport falls back on
       instead of clipping. */
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .console-body { overflow-y: auto; }
      .console-body .ctrl-col { padding: 8px; }
    }
    /* 8px rather than the 12px of the base rule: ph-helm-joystick's disc is a
       fixed 240px and the column has to fit it inside a phone's landscape
       height, where every pixel of chrome counts. */
    @media (orientation: landscape) { .console-body .ctrl-col { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Helm Console" data-i18n-attr="data-screen-label:console.helm.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The locked target
           the footer named heads the movement column the AUTO badge belongs
           to. -->
      <div class="console-body scope-row helm-scope-row">
        <div class="ctrl-col movement-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="helm-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <ph-lateral-thrust-joystick id="lateral-thrust-joystick"></ph-lateral-thrust-joystick>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
          <!-- Contextual dock control (issue #1159): a hull whose helm owns a
               `dock` system publishes a `dock` blackboard; a hull without one
               never does, so this panel stays hidden and the console is
               unchanged. -->
          <div class="dock-panel" id="dock-panel" hidden>
            <div class="dock-row">
              <button id="dock-btn" class="dock-btn" data-i18n="console.dock.dock">Dock</button>
              <span id="dock-status" class="dock-status">—</span>
            </div>
            <div id="dock-refusal" class="dock-refusal" hidden></div>
          </div>
          <!-- Under-tow-load indicator (issue #1157): shown only while this
               ship's tractor holds a target, so the helm can see it is under
               load and why. A hull with no tractor publishes no `tractor`
               blackboard, so this banner stays hidden and the console is
               unchanged. -->
          <div class="tow-load-panel" id="tow-load-panel" hidden>
            <span class="tow-load-label" data-i18n="console.helm.under_tow">Under tow load</span>
            <span id="tow-load-target" class="tow-load-target"></span>
          </div>
        </div>
        <div class="radar-col scope-cell">
          <ph-helm-radar id="helm-radar"></ph-helm-radar>
        </div>
        <div class="ctrl-col joystick-col">
          <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-helm-radar.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-lateral-thrust-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import { initConsole } from '../console-core.js';
    import { HELM_ACTION_CONTEXT, HELM_DOCK_ACTION_ID } from '../stations/helm-actions.js';
    // The render lives in gui/destroyer/helm.console.js (issue #1235): the
    // shared Helm renderer + this hull's variant (lateral joystick, static
    // footer, plus a bespoke Dock/under-tow-load tail). s is a
    // HelmConsolePayload — see the @typedef in gui/console-state.js. The
    // vitest suite imports the same renderStation.
    import { renderStation } from './helm.console.js';

    var consoleHandle = initConsole({ name: 'helm', render: renderStation });

    // The one dock button toggles dock/undock through the action map, which
    // sends the same admitted command a dock AI would (issues #1159, #1251).
    // The semantic adapter reads the current authoritative dock view, so the
    // contextual ship variant cannot dispatch a stale system id or verb.
    document.getElementById('dock-btn').addEventListener('click', function() {
      consoleHandle.activateSemanticAction(HELM_DOCK_ACTION_ID, {
        context: HELM_ACTION_CONTEXT, source: 'control',
      });
    });
  </script>
</body>
</html>

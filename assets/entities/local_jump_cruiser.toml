# Optional LocalJump Cruiser. Existing Cruiser equipment/tuning is preserved.
# [ai] Provisional first-consumer tuning: two seconds preparation, three commit energy,
# two finite fuel units and two-unit scatter; 120 semantic reading ticks. No balance verdict.
# 24 real fuel units and 48 additional locker spaces are explicit. Logistics replenishes
# the local drive store from the finite hold through ordinary physical delivery.
includes = [ "alliance_cruiser.toml" ]
name = "entity.local_jump_cruiser.name"

[[system]]
id = "local-jump"
kind = "transit-drive"
console = "helm"
power_group = "energy-local-jump"

[[system.damage_component]]
id = "drive"
binding = "operation"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "power"
binding = "intake"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "cooling"
binding = "cooling"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.component]]
kind = "power_input"
id = "power"

[[system.component]]
kind = "transit_drive"
id = "drive"
power_input = "power"
navigation_source = "navigation"

[system.component.config]
preparation_work_secs = 2
max_distance = 500
scatter_radius = 2
reading_ticks = 120

[system.component.config.fuel]
store = "local-transit-fuel"
amount = 2

[system.config.ai]

import init, * as bindings from './project-phoenix-150fde075612f5d4.js';

  <script>
    // ── Connection status ──────────────────────────────────────────────────

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = 'Disconnected — reconnecting…';
      } else if (state === 'error') {
        dot.style.background = '#f44';
        label.textContent = 'Error — refresh to retry';
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
      }
    }

    // ── Fullscreen controller ──────────────────────────────────────────────

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    // ── Screen Wake Lock (keep screen on when active) ─────────────────
    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      try {
        if (wakeLockSentinel) return;
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLockSentinel) { wakeLockSentinel.release(); wakeLockSentinel = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });

    window.addEventListener('beforeunload', () => releaseWakeLock());

    // ── PeerJS host peer ───────────────────────────────────────────────────

    // peer connection id → session token (resolved once Identify arrives)
    const peerTokens = new Map();
    // session token → DataConnection (for routing server→client messages)
    const tokenConns = new Map();
    // messages queued before WASM is ready
    const msgQueue = [];

    const hostPeerId = Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const joinUrl = location.href.replace(/[^/]*$/, '') + 'client/#' + hostPeerId;

    function initPeerJS() {
      setConnectionStatus('connecting');
      const peer = new Peer(hostPeerId, { config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject', transport: 'tcp' },
      ] } });

      peer.on('open', () => {
        setConnectionStatus('ready');
        const canvas = document.getElementById('qr');
        canvas.style.display = 'block';
        QRCode.toCanvas(canvas, joinUrl, { width: 200 });
        document.getElementById('qr-link').href = joinUrl;
      });

      peer.on('disconnected', () => {
        setConnectionStatus('disconnected');
        peer.reconnect();
      });

      peer.on('connection', (conn) => {
        conn.on('data', (raw) => {
          const json = typeof raw === 'string' ? raw : JSON.stringify(raw);
          let token = peerTokens.get(conn.peer);

          // First message from this peer must be Identify — extract the token
          if (!token) {
            try {
              const msg = JSON.parse(json);
              if (msg.type === 'Identify') {
                token = msg.data.token;
                peerTokens.set(conn.peer, token);
                tokenConns.set(token, conn);
              }
            } catch (_) { return; }
          }

          if (token) dispatchToWasm(token, json);
        });

        conn.on('close', () => {
          const token = peerTokens.get(conn.peer);
          if (!token) return;
          wasmBindings.wasm_player_disconnected(token);
          peerTokens.delete(conn.peer);
          tokenConns.delete(token);
        });

        conn.on('error', (err) => console.error('[PeerJS conn]', err));
      });

      peer.on('error', (err) => { console.error('[PeerJS host]', err); setConnectionStatus('error'); });
    }

    // ── Scenario selection ────────────────────────────────────────────────

    let selectedScenario = null;
    let wasmReady = false;

    document.querySelectorAll('.world-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        selectedScenario = this.dataset.path;
        document.getElementById('scenario-panel').style.display = 'none';
        initPeerJS();
        acquireWakeLock();
        if (wasmReady) startPhoenix();
      });
    });

    // Allow automated tests (and quick dev launches) to bypass the picker via
    // ?scenario=<path>, e.g. /?scenario=assets/worlds/default.toml
    (function() {
      const sp = new URLSearchParams(location.search).get('scenario');
      if (sp) {
        selectedScenario = sp;
        document.getElementById('scenario-panel').style.display = 'none';
        initPeerJS();
        acquireWakeLock();
      }
    })();

    // ── WASM dispatch ─────────────────────────────────────────────────────

    function dispatchToWasm(token, json) {
      if (typeof wasm_receive_message === 'function') {
        wasm_receive_message(token, json);
      } else {
        msgQueue.push([token, json]);
      }
    }

    // ── Outbound routing ───────────────────────────────────────────────────

    // ── JS audio state ─────────────────────────────────────────────────────
    let prevRedAlert = false;
    let gameAudioStarted = false;

    function startGameAudio() {
      if (gameAudioStarted) return;
      gameAudioStarted = true;
      const hum = document.getElementById('bg-hum');
      hum.volume = 0.25;
      hum.play().catch(() => {});
      const engine = document.getElementById('ship-engine');
      engine.volume = 0.0;
      engine.play().catch(() => {});
    }

    function routeOutbound(target, payload) {
      try {
        const parsed = JSON.parse(payload);
        if (parsed.type === 'GameStarted') {
          document.getElementById('overlay').style.display = 'none';
          startGameAudio();
        }
        if (parsed.type === 'SimState') {
          const snapshot = parsed.data?.snapshot;
          const redAlert = snapshot?.red_alert;
          if (redAlert && !prevRedAlert) {
            document.getElementById('red-alert-siren').play().catch(() => {});
          }
          prevRedAlert = redAlert;
          const engine = document.getElementById('ship-engine');
          engine.volume = (snapshot?.engine_thrust ?? 0) * 0.15;
        }
      } catch (_) {}

      if (target === 'all') {
        for (const conn of tokenConns.values()) conn.send(payload);
      } else if (target.startsWith('token:')) {
        tokenConns.get(target.slice(6))?.send(payload);
      } else if (target.startsWith('except:')) {
        const exc = target.slice(7);
        for (const [t, conn] of tokenConns.entries()) {
          if (t !== exc) conn.send(payload);
        }
      }
    }

// ── Config Preload ──────────────────────────────────────────────────────

// Track which entity paths have been requested to prevent duplicate fetches
const fetchedPaths = new Set();

// Preload sequence: fetch map -> load map -> fetch entities -> load entities -> init
async function preloadAndStart(scenarioPath) {
  const spinner = document.getElementById('wasm-spinner');

  try {
    // Step 1: Set up the config request callback
    window.set_config_request_callback = wasmBindings.set_config_request_callback;
    set_config_request_callback(handleConfigRequest);

    // Step 2: Fetch and load the unified world TOML (map + scenario in one file)
    const worldResponse = await fetch(scenarioPath);
    if (!worldResponse.ok) {
      console.error('Failed to fetch world:', worldResponse.status);
      throw new Error('World fetch failed');
    }
    const worldToml = await worldResponse.text();

    // Step 3: Load the world — parses both the map half (anchors, [[entity]],
    // global config) and the scenario half (spawns, triggers, comms) from one
    // TOML, then fires callbacks for all referenced entity paths.
    window.wasm_load_world = wasmBindings.wasm_load_world;
    window.wasm_load_config = wasmBindings.wasm_load_config;
    window.wasm_is_preload_complete = wasmBindings.wasm_is_preload_complete;

    wasm_load_world(scenarioPath, worldToml);

  } catch (e) {
    console.error('Preload failed:', e);
    if (spinner) spinner.style.display = 'none';
    // Show error to user — use wasm-spinner element so we don't destroy #qr-link
    const errDiv = document.getElementById('wasm-spinner');
    if (errDiv) {
      errDiv.innerHTML = '<div style="color: #f44; padding: 2rem; text-align: center; font-family: monospace;">Failed to load game configuration. See console for details.</div>';
      errDiv.style.display = 'flex';
    }
    return;
  }
}

// Handle config fetch requests from Rust
function handleConfigRequest(path) {
  // Prevent duplicate fetches
  if (fetchedPaths.has(path)) {
    return;
  }
  fetchedPaths.add(path);
  
  // Fetch the entity config
  fetch(path)
    .then(response => response.ok ? response.text() : Promise.reject(new Error(`HTTP ${response.status}`)))
    .then(toml => {
      let complete = false;
      try {
        // wasm_load_config returns true when the last pending config is loaded.
        complete = wasm_load_config(path, toml) === true;
      } catch (e) {
        console.error(`Failed to parse config at ${path}:`, e);
        // Rust already cleaned up in_flight/pending in the Err path.
        // Check if all other paths finished before this one errored.
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    })
    .catch(err => {
      console.error(`Failed to fetch config at ${path}:`, err);
      // Fetch failed — call wasm_load_config with empty string so Rust can
      // remove this path from in_flight/pending and know whether preload is done.
      let complete = false;
      try {
        complete = wasm_load_config(path, '') === true;
      } catch (_) {
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    });
}

// Finish initialization after preload completes
  let _finishInitCalled = false;
function finishInit() {
  if (_finishInitCalled) return;
  _finishInitCalled = true;
  const spinner = document.getElementById('wasm-spinner');
  
  window.wasm_init = wasmBindings.wasm_init;
  window.wasm_receive_message = wasmBindings.wasm_receive_message;
  window.set_message_callback = wasmBindings.set_message_callback;
  window.wasm_validate_stations = wasmBindings.wasm_validate_stations;
  window.wasm_set_debug_regions = wasmBindings.wasm_set_debug_regions;
  window.wasm_is_debug_regions_enabled = wasmBindings.wasm_is_debug_regions_enabled;
  window.wasm_toggle_debug_regions = wasmBindings.wasm_toggle_debug_regions;
  window.wasm_toggle_debug_overlay = wasmBindings.wasm_toggle_debug_overlay;
  window.wasm_toggle_debug_pause = wasmBindings.wasm_toggle_debug_pause;
  window.wasm_get_debug_state = wasmBindings.wasm_get_debug_state;
  window.wasm_toggle_debug_damage = wasmBindings.wasm_toggle_debug_damage;
  window.wasm_get_damage_log = wasmBindings.wasm_get_damage_log;
  window.wasm_toggle_debug_entities = wasmBindings.wasm_toggle_debug_entities;
  window.wasm_get_entity_debug_state = wasmBindings.wasm_get_entity_debug_state;
  window.wasm_toggle_entity_inspector = wasmBindings.wasm_toggle_entity_inspector;
  window.wasm_get_entity_inspector = wasmBindings.wasm_get_entity_inspector;

  // Validate station config before starting PeerJS or the Bevy app.
  // A malformed [stations] section must refuse to boot.
  fetch('assets/entities/player_ship.toml')
    .then(r => r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(toml => {
      try {
        wasm_validate_stations(toml);
      } catch (err) {
        showFatalError('Station config error: ' + (err && err.message ? err.message : String(err)));
        return;
      }
      startServer();
    })
    .catch(err => {
      showFatalError('Failed to load player_ship.toml: ' + String(err));
    });
}

function showFatalError(message) {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) {
    spinner.innerHTML =
      '<div style="color:#f44;padding:2rem;text-align:center;font-family:monospace;max-width:40rem;">' +
      '<strong>Fatal configuration error</strong><br><br>' +
      message.replace(/</g, '&lt;') +
      '<br><br>Fix the TOML and reload the page.</div>';
    spinner.style.display = 'flex';
  }
  // PeerJS is already constructed but we never call startServer(), so it
  // will open its peer but never receive connections that matter.
  console.error('[Phoenix] Fatal:', message);
}

function startServer() {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) spinner.style.display = 'none';

  // Read ?debug_regions=1 URL parameter before WASM init
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get('debug_regions') === '1') {
    wasm_set_debug_regions(true);
  }

  set_message_callback(routeOutbound);

  // Register the runtime world-fetch callback so load_world triggers can
  // additively load a world TOML (e.g. patrol.toml) during gameplay.
  if (typeof wasmBindings.set_world_fetch_callback === 'function') {
    wasmBindings.set_world_fetch_callback(function(path) {
      fetch(path)
        .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
        .then(toml => { wasmBindings.wasm_push_world_toml(path, toml); })
        .catch(err => {
          console.error('[Phoenix] Failed to fetch world TOML at ' + path + ':', err);
          // Push empty string so Rust stops re-requesting.
          wasmBindings.wasm_push_world_toml(path, '');
        });
    });
  }
  
  // Flush before wasm_init: App::run() in WASM unwinds the JS stack by
  // throwing, so any code after wasm_init() never executes.
  for (const [token, json] of msgQueue.splice(0)) wasm_receive_message(token, json);

  // Signal smoke tests (and any other listeners) that wasm_receive_message is
  // now set and the msgQueue has been flushed.  We dispatch PhoenixReady BEFORE
  // wasm_init() because App::run() in WASM throws (unwinding the JS stack), so
  // code placed after wasm_init() is unreachable.
  window.__phoenixReady = true;
  window.dispatchEvent(new CustomEvent('PhoenixReady'));

  try { wasm_init(); } catch (_) {}
}

// ── WASM startup ───────────────────────────────────────────────────────
// Trunk fires TrunkApplicationStarted once the WASM binary is fully
// instantiated and sets window.wasmBindings to the wasm-bindgen exports.

function startPhoenix() {
  preloadAndStart(selectedScenario).catch(err => {
    console.error('Failed to start preload:', err);
  });
}

window.addEventListener('TrunkApplicationStarted', () => {
  wasmReady = true;
  if (selectedScenario) startPhoenix();
});

    // ── F4 — toggle region wireframes ────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F4') {
        e.preventDefault();
        if (typeof wasm_toggle_debug_regions === 'function') {
          wasm_toggle_debug_regions();
        }
      }
    });

    // ── F3 — toggle modifier debug overlay ───────────────────────────────
    (function() {
      var overlayEl = document.getElementById('debug-overlay');
      var overlayVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F3') {
          e.preventDefault();
          overlayVisible = !overlayVisible;
          overlayEl.style.display = overlayVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_overlay === 'function') {
            wasm_toggle_debug_overlay();
          }
        }
      });

      // Refresh overlay text every animation frame while visible.
      function rafLoop() {
        if (overlayVisible && typeof wasm_get_debug_state === 'function') {
          overlayEl.textContent = wasm_get_debug_state();
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F9 — debug pause simulation ──────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F9') {
        e.preventDefault();
        if (typeof wasm_toggle_debug_pause === 'function') {
          wasm_toggle_debug_pause();
        }
      }
    });

    // ── F8 — toggle damage debug log ─────────────────────────────────────
    (function() {
      var damageEl = document.getElementById('damage-log-overlay');
      var damageVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F8') {
          e.preventDefault();
          damageVisible = !damageVisible;
          damageEl.style.display = damageVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_damage === 'function') {
            wasm_toggle_debug_damage();
          }
        }
      });

      function rafLoop() {
        if (damageVisible && typeof wasm_get_damage_log === 'function') {
          damageEl.textContent = wasm_get_damage_log();
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F7 — toggle entity behavior overlay ─────────────────────────────
    (function() {
      var entityEl = document.getElementById('entity-debug-overlay');
      var entityVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F7') {
          e.preventDefault();
          entityVisible = !entityVisible;
          entityEl.style.display = entityVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_entities === 'function') {
            wasm_toggle_debug_entities();
          } else if (entityVisible) {
            entityEl.textContent = '(entity overlay: WASM not ready — hard-reload the page)';
          }
        }
      });

      function rafLoop() {
        if (entityVisible) {
          if (typeof wasm_get_entity_debug_state === 'function') {
            var txt = wasm_get_entity_debug_state();
            entityEl.textContent = txt.length > 0 ? txt : '(entity overlay active — waiting for Bevy)';
          }
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F2 — toggle entity inspector overlay ────────────────────────────
    (function() {
      var inspectorEl = document.getElementById('entity-inspector-overlay');
      var inspectorVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F2') {
          e.preventDefault();
          inspectorVisible = !inspectorVisible;
          inspectorEl.style.display = inspectorVisible ? 'block' : 'none';
          if (typeof wasm_toggle_entity_inspector === 'function') {
            wasm_toggle_entity_inspector();
          } else if (inspectorVisible) {
            inspectorEl.textContent = '(entity inspector: WASM not ready — hard-reload the page)';
          }
        }
      });

      function rafLoop() {
        if (inspectorVisible) {
          if (typeof wasm_get_entity_inspector === 'function') {
            var txt = wasm_get_entity_inspector();
            inspectorEl.textContent = txt.length > 0 ? txt : '(entity inspector active — waiting for Bevy)';
          }
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();
  </script>
</body>

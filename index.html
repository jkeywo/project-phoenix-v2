<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prevent the entry HTML from being cached so users always pick up the
       latest Trunk-hashed JS/WASM filenames after a deploy. The hashed
       assets themselves remain cacheable forever via their content hash. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Project Phoenix — View Screen</title>

  <!-- CDN deps loaded before our script so they're in scope synchronously -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <!-- HUD overlay fonts (match raw/gui/borders/demo.html) -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000 url('assets/logo.png') center center / contain no-repeat; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #overlay { position: absolute; bottom: 1rem; right: 1rem; z-index: 190; }
    #qr { display: none; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; font-family: monospace;
    }
    #top-bar-row { display: flex; align-items: center; gap: 0.5rem; }
    #conn-label { font-size: 0.75rem; color: #f44; }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #4c4; flex-shrink: 0; }
    #fullscreen-btn {
      background: none; border: none; color: #cce; font-size: 1.1rem;
      cursor: pointer; padding: 0; line-height: 1;
    }
    #wasm-spinner {
      position: fixed; inset: 0; z-index: 100;
      background: #000 url('assets/logo.png') center 40% / min(55vw, 55vh) auto no-repeat;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #aae; font-family: monospace; font-size: 0.9rem;
      gap: 1rem;
      padding-bottom: 15vh;
    }
    .spinner-ring {
      width: 48px; height: 48px;
      border: 4px solid #223;
      border-top-color: #aae;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #scenario-panel {
      position: fixed; inset: 0; z-index: 200;
      background: #000 url('assets/logo.png') center center / min(45vw, 45vh) auto no-repeat;
      display: flex; flex-direction: row; align-items: stretch;
      font-family: monospace; color: #cce;
    }
    #world-list {
      display: flex; flex-direction: column; gap: 0.5rem;
      padding: 1.5rem 1rem;
      width: 14rem; min-width: 12rem; max-width: 18rem;
      overflow-y: auto;
      background: rgba(0,0,0,0.75);
      border-right: 1px solid #334;
      box-sizing: border-box;
    }
    #world-list-label {
      font-size: 0.75rem; color: #889; letter-spacing: 0.06em;
      margin-bottom: 0.5rem; text-transform: uppercase;
    }
    .world-btn {
      background: #111; color: #aae; border: 1px solid #334;
      padding: 0.55rem 0.9rem; font-family: monospace; font-size: 0.95rem;
      border-radius: 4px; cursor: pointer; text-align: left;
      letter-spacing: 0.04em; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; transition: background 0.15s, border-color 0.15s;
    }
    .world-btn:hover { background: #223; border-color: #558; }
    .world-btn.active { background: #224; border-color: #66c; color: #ccf; }
    /* ── Lobby panel (issue #436) ────────────────────────────────────────── */
    .lobby-panel {
      position: fixed;
      inset: 0;
      z-index: 180;
      font-family: monospace;
      color: #cce;
    }
    .lobby-bg {
      position: absolute;
      inset: 0;
      background: rgb(0, 0, 0);
    }
    .lobby-panel-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: clamp(1rem, 3vw, 2rem) clamp(1rem, 4vw, 3rem);
      box-sizing: border-box;
    }
    .lobby-grid-column {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }
    .station-card {
      display: flex; flex-direction: column; gap: 6px;
      padding: 10px 12px; border-radius: 6px;
      background: #0e0e14; border: 1px solid #2a2d3a;
      transition: border-color .2s, box-shadow .2s;
      font-family: 'Chakra Petch', system-ui, monospace;
    }
    .station-card.claimed {
      border-color: #2a8a96; box-shadow: 0 0 8px rgba(42,138,150,0.25);
    }
    .station-card.empty {
      opacity: 0.5; border-style: dashed;
      background: repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,0.02) 6px,rgba(255,255,255,0.02) 12px);
    }
    .station-card .card-header {
      display: flex; align-items: center; justify-content: space-between;
    }
    .station-card .card-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: bold; background: #191e28;
      color: #5fd8e8; border: 1px solid #2a3a48;
    }
    .station-card .card-name {
      font-size: 0.9rem; font-weight: 600; color: #cce;
    }
    .station-card .card-rank {
      font-size: 0.65rem; color: #778; text-transform: uppercase; letter-spacing: .06em;
    }
    .station-card .card-consoles {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .station-card .console-chip {
      padding: 2px 8px; border-radius: 3px;
      font-size: 0.65rem; background: #181e2a; color: #7aa;
      border: 1px solid #2a3a48;
    }
    .station-card .complexity-pill {
      padding: 1px 8px; border-radius: 8px;
      font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
      background: #2a3a48; color: #7aa;
    }
    .station-card .complexity-pill.low {
      background: #1a3828; color: #5fd88a; border: 1px solid #2a6850;
    }
    /* Crew dots */
    .crew-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2a2d3a; border: 1px solid #3a3d4a;
      transition: background .2s, border-color .2s;
    }
    .crew-dot.filled { background: #5fd8e8; border-color: #5fd8e8; }
    /* Ready badge states */
    #lobby-ready-badge.go {
      background: #0a2830; color: #5fd8e8; border-color: #5fd8e8;
      animation: ready-pulse 1.5s ease-in-out infinite;
    }
    @keyframes ready-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(95,216,232,0.3); }
      50% { box-shadow: 0 0 14px rgba(95,216,232,0.6); }
    }

    /* Lobby responsive layout */
    .lobby-body {
      display: flex;
      flex: 1;
      gap: 2rem;
      padding-top: 1rem;
      overflow: hidden;
      min-height: 0;
    }
    .lobby-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 360px));
      gap: 12px;
      flex: 1;
      align-content: start;
      justify-content: center;
      overflow-y: auto;
    }
    .lobby-rail {
      width: 18rem;
      min-width: 14rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      border-left: 1px solid #334;
      padding-left: 1.5rem;
    }
    .lobby-rail-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      color: #889;
    }
    .lobby-rail-spacer { flex: 1; }
    .lobby-status-hint {
      font-size: 0.75rem;
      color: #667;
      text-align: right;
      padding-top: 0.5rem;
      border-top: 1px solid #334;
    }
    .lobby-rail-label {
      font-size: 0.7rem;
      color: #667;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 0.5rem;
    }

    /* Card font scaling for wide screens / readability */
    .station-card .card-name { font-size: clamp(0.85rem, 1vw, 1rem); }
    .station-card .card-rank { font-size: clamp(0.6rem, 0.7vw, 0.7rem); }
    .station-card .console-chip { font-size: clamp(0.6rem, 0.7vw, 0.7rem); }
    .station-card .complexity-pill { font-size: clamp(0.55rem, 0.65vw, 0.65rem); }

    .station-card { min-height: 90px; }

    /* Connected-list pills (used in both landscape column and compact wrap) */
    .spectator-pill {
      padding: 4px 10px;
      border-radius: 3px;
      background: #181e2a;
      color: #aac;
      border: 1px solid #2a3a48;
      font-size: 0.75rem;
      white-space: nowrap;
      align-self: flex-start;
    }
    .spectator-pill.waiting {
      font-style: italic;
      color: #778;
      border-style: dashed;
    }
    .spectator-empty {
      color: #556;
      font-size: 0.8rem;
      font-style: italic;
    }

    /* Aggregate RESERVED chip (compact mode only) */
    .reserved-aggregate {
      display: none;
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px dashed #2a2d3a;
      background: repeating-linear-gradient(45deg,transparent,transparent 6px,rgba(255,255,255,0.02) 6px,rgba(255,255,255,0.02) 12px);
      font-size: 0.75rem;
      color: #667;
      text-align: center;
      letter-spacing: .04em;
      font-family: 'Chakra Petch', system-ui, monospace;
    }

    /* Header reflow */
    .lobby-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: 0.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #334;
    }
    .lobby-title-block { display: flex; flex-direction: column; }
    .lobby-status-block {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      row-gap: 0.5rem;
    }
    .lobby-crew-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lobby-crew-label {
      font-size: 0.75rem;
      color: #889;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    #lobby-title {
      font-size: clamp(1.1rem, 2.5vw, 1.6rem);
      font-weight: bold;
      letter-spacing: .08em;
      color: #cce;
    }
    #lobby-subtitle {
      font-size: 0.8rem;
      color: #778;
    }
    #lobby-crew-count {
      font-size: clamp(1rem, 2vw, 1.4rem);
      font-weight: bold;
      color: #aae;
      font-family: 'JetBrains Mono', monospace;
    }
    #lobby-crew-dots { display: flex; gap: 4px; }
    #lobby-spectator-tag {
      font-size: 0.7rem;
      color: #667;
      padding: 2px 6px;
      border: 1px solid #445;
      border-radius: 3px;
    }
    #lobby-ready-badge {
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: .1em;
      background: #332;
      color: #ca0;
      border: 1px solid #ca0;
      transition: all .3s ease;
    }

    /* Compact form: portrait OR narrow landscape */
    @media (orientation: portrait), (max-width: 720px) {
      .lobby-body {
        flex-direction: column;
        overflow: auto;
      }
      .lobby-grid {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        overflow-y: visible;
      }
      /* Hide individual RESERVED placeholders, show aggregate */
      .lobby-grid .station-card.empty.per-slot { display: none; }
      .reserved-aggregate.active { display: block; }
      /* Rail collapses to bottom strip */
      .lobby-rail {
        width: auto;
        min-width: 0;
        border-left: none;
        border-top: 1px solid #334;
        padding-left: 0;
        padding-top: 0.75rem;
        flex-direction: column;
        gap: 0.5rem;
      }
      .lobby-rail-spacer { display: none; }
      .lobby-status-hint {
        text-align: left;
        border-top: none;
        padding-top: 0;
      }
      /* CONNECTED list becomes flex-wrap of pills */
      .lobby-rail-section {
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px;
      }
    }

    /* ── HTML viewscreen HUD overlay (issue #422) ───────────────────────── */
    #hud-overlay {
      position: absolute; inset: 0; z-index: 15;
      pointer-events: none;
      --signal-cyan: #5fd8e8;
      --alert: #ff3344;
    }
    /* Red-alert inner glow — full-screen vignette, pulsing. Ported from
       raw/gui/borders/demo.html .screen::after / @keyframes pulse. */
    #hud-vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--alert),
                  inset 0 0 32px 4px rgba(255, 51, 68, 0.55),
                  inset 0 0 80px 0 rgba(255, 51, 68, 0.18);
      opacity: 0;
      transition: opacity .25s ease;
    }
    #hud-overlay.alert-on #hud-vignette {
      opacity: 1;
      animation: hud-pulse 1.3s ease-in-out infinite;
    }
    @keyframes hud-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    /* Bottom-centre status strip: HEADING / HULL / CONDITION. */
    #hud-strip {
      position: absolute; left: 50%; bottom: 0.6rem;
      transform: translateX(-50%);
      display: none; /* hidden until first __updateHud call */
      flex-direction: row; gap: 2.4rem;
      align-items: center; justify-content: center;
      padding: 0.4rem 1.4rem;
      font-family: "Chakra Petch", system-ui, sans-serif;
    }
    #hud-strip.shown { display: flex; }
    .hud-cell { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .hud-label {
      font: 600 11px/1 "Chakra Petch", system-ui, sans-serif;
      letter-spacing: 0.14em; color: #b8c0c8;
    }
    .hud-value {
      font: 500 18px/1 "JetBrains Mono", monospace;
      color: var(--signal-cyan);
    }
    #hud-overlay.alert-on .hud-value { color: var(--alert); }

    /* ─── Viewscreen border frame (raw/gui/borders/demo.html) ──────────────── */
    #hud-overlay {
      --t: 44px;
      --vs-signal: #5fd8e8;
      --vs-alert: #ff3344;
      --vs-text: #b8c0c8;
    }
    /* All frame pieces are absolute children of #hud-overlay (inset:0) */
    .vs-piece, .vs-edge {
      position: absolute;
      pointer-events: none;
    }
    /* Tiled edges */
    .vs-edge { background-repeat: repeat; image-rendering: pixelated; }
    .vs-edge.top {
      top: 0; left: 240px; right: 240px;
      height: var(--t);
      background-image: url("gui/borders/edge-top.png");
      background-size: 64px 44px;
    }
    .vs-edge.bottom {
      bottom: 0; left: 240px; right: 240px;
      height: var(--t);
      background-image: url("gui/borders/edge-bottom.png");
      background-size: 64px 44px;
    }
    .vs-edge.left {
      left: 0; top: 140px; bottom: 140px;
      width: var(--t);
      background-image: url("gui/borders/edge-left.png");
      background-size: 44px 64px;
    }
    .vs-edge.right {
      right: 0; top: 140px; bottom: 140px;
      width: var(--t);
      background-image: url("gui/borders/edge-right.png");
      background-size: 44px 64px;
    }
    /* Corners (240×140 px) */
    .vs-corner {
      width: 240px; height: 140px;
      background-repeat: no-repeat; background-size: contain;
      image-rendering: pixelated;
    }
    .vs-corner.tl { top: 0; left: 0;     background-image: url("gui/borders/corner-tl.png"); }
    .vs-corner.tr { top: 0; right: 0;    background-image: url("gui/borders/corner-tr.png"); }
    .vs-corner.bl { bottom: 0; left: 0;  background-image: url("gui/borders/corner-bl.png"); }
    .vs-corner.br { bottom: 0; right: 0; background-image: url("gui/borders/corner-br.png"); }
    /* Caps (centred top/bottom) */
    .vs-cap {
      background-repeat: no-repeat; background-size: contain;
      image-rendering: pixelated;
    }
    .vs-cap.top {
      top: 0; left: 50%; transform: translateX(-50%);
      width: 320px; height: 56px;
      background-image: url("gui/borders/cap-top.png");
    }
    .vs-cap.bottom {
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 520px; height: 56px;
      background-image: url("gui/borders/cap-bottom.png");
    }
    /* Red alert — swap PNG assets */
    #hud-overlay.alert-on .vs-edge.top    { background-image: url("gui/borders/edge-top-alert.png"); }
    #hud-overlay.alert-on .vs-edge.bottom { background-image: url("gui/borders/edge-bottom-alert.png"); }
    #hud-overlay.alert-on .vs-edge.left   { background-image: url("gui/borders/edge-left-alert.png"); }
    #hud-overlay.alert-on .vs-edge.right  { background-image: url("gui/borders/edge-right-alert.png"); }
    #hud-overlay.alert-on .vs-corner.tl   { background-image: url("gui/borders/corner-tl-alert.png"); }
    #hud-overlay.alert-on .vs-corner.tr   { background-image: url("gui/borders/corner-tr-alert.png"); }
    #hud-overlay.alert-on .vs-corner.bl   { background-image: url("gui/borders/corner-bl-alert.png"); }
    #hud-overlay.alert-on .vs-corner.br   { background-image: url("gui/borders/corner-br-alert.png"); }
    #hud-overlay.alert-on .vs-cap.top     { background-image: url("gui/borders/cap-top-alert.png"); }
    #hud-overlay.alert-on .vs-cap.bottom  { background-image: url("gui/borders/cap-bottom-alert.png"); }
    /* Ship designation text (top-centre, over cap-top) */
    .vs-designation {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      font-family: "Chakra Petch", system-ui, sans-serif;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.5em;
      color: var(--vs-signal);
      pointer-events: none;
      white-space: nowrap;
    }
    #hud-overlay.alert-on .vs-designation { color: var(--vs-alert); }
    /* 4-slot status strip (bottom-centre, over cap-bottom) */
    .vs-status-strip {
      position: absolute;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 408px; height: 36px;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0 12px;
      pointer-events: none;
    }
    .vs-status-slot {
      display: flex; flex-direction: column;
      justify-content: center;
      padding-left: 18px;
    }
    .vs-slot-label {
      font-family: "Chakra Petch", system-ui, sans-serif; font-weight: 600;
      font-size: 8px; letter-spacing: 0.32em;
      color: var(--vs-text);
      text-transform: uppercase;
    }
    .vs-slot-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px; color: var(--vs-signal);
      margin-top: 2px; letter-spacing: 0.06em;
    }
    #hud-overlay.alert-on .vs-slot-value { color: var(--vs-alert); }
  </style>

<body>
  <!-- ── HTML bridge transport shim (ADR-0001 §3, verbatim) ───────────────── -->
  <script>
    window.__sendAction = function(json) {
      if (window.ipc) {
        window.ipc.postMessage(json);          // wry native server
      } else {
        window.wasmBindings.wasm_ui_action(json); // browser WASM (server or client)
      }
    };
  </script>

  <!-- Game audio (browser Web Audio API — Bevy 0.18 WASM audio is broken) -->
  <audio id="bg-hum"          src="assets/sounds/background_hum.ogg"  loop></audio>
  <audio id="ship-engine"     src="assets/sounds/ship_engine.wav"      loop></audio>
  <audio id="red-alert-siren" src="assets/sounds/red_alert_siren.ogg"      ></audio>

  <!-- Scenario selector shown before the server boots -->
  <div id="scenario-panel">
    <div id="world-list">
      <div id="world-list-label">Select a world</div>
      <button class="world-btn" data-path="assets/worlds/default.toml">Starbase Alpha</button>
      <button class="world-btn" data-path="assets/worlds/patrol.toml">Patrol</button>
      <button class="world-btn" data-path="assets/worlds/before_the_fire.toml">Before the Fire</button>
    </div>
  </div>

  <!-- ── HTML Lobby Panel (issue #436) ──────────────────────────────────── -->
  <div id="lobby-panel" class="lobby-panel" style="display:none;">
    <!-- Background overlay -->
    <div class="lobby-bg"></div>

    <div class="lobby-panel-wrap">

      <!-- Header row: title + crew counter + ready badge -->
      <div class="lobby-header">
        <div class="lobby-title-block">
          <div id="lobby-title">Loading…</div>
          <div id="lobby-subtitle"></div>
        </div>
        <div class="lobby-status-block">
          <div class="lobby-crew-info">
            <span class="lobby-crew-label">Crew</span>
            <span id="lobby-crew-count">0/0</span>
            <div id="lobby-crew-dots"></div>
            <span id="lobby-spectator-tag" style="display:none;">Spectator</span>
          </div>
          <div id="lobby-ready-badge">AWAITING SELECTION</div>
        </div>
      </div>

      <!-- Body: station grid + log rail -->
      <div class="lobby-body">

        <!-- Active station grid + aggregate RESERVED chip -->
        <div class="lobby-grid-column">
          <div id="station-grid" class="lobby-grid"></div>

    const hostPeerId = Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const joinUrl = location.href.replace(/[^/]*$/, '') + 'client/index.html#' + hostPeerId;

    function initPeerJS() {
      setConnectionStatus('connecting');
      const peer = new Peer(hostPeerId, { config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject', transport: 'tcp' },

        conn.on('data', (raw) => {

          // First message from this peer must be Identify — extract the token

          tokenConns.delete(token);

    function dispatchToWasm(token, json) {

        msgQueue.push([token, json]);

    // ── JS audio state ─────────────────────────────────────────────────────
    let prevRedAlert = false;
    let gameAudioStarted = false;

      const engine = document.getElementById('ship-engine');
      engine.volume = 0.0;
      engine.play().catch(() => {});
    }

    function routeOutbound(target, payload) {
      try {
        const parsed = JSON.parse(payload);
        if (parsed.type === 'GameStarted') {
          document.getElementById('overlay').style.display = 'none';
          startGameAudio();
        }
        if (parsed.type === 'SimState') {
          const snapshot = parsed.data?.snapshot;
          const redAlert = snapshot?.red_alert;
          if (redAlert && !prevRedAlert) {
            document.getElementById('red-alert-siren').play().catch(() => {});
          }
          prevRedAlert = redAlert;
          const engine = document.getElementById('ship-engine');
          engine.volume = (snapshot?.engine_thrust ?? 0) * 0.15;
        }
      } catch (_) {}

      if (target === 'all') {
        for (const conn of tokenConns.values()) conn.send(payload);
      } else if (target.startsWith('token:')) {
        tokenConns.get(target.slice(6))?.send(payload);
      } else if (target.startsWith('except:')) {
        const exc = target.slice(7);
        for (const [t, conn] of tokenConns.entries()) {
          if (t !== exc) conn.send(payload);
        }
      }
    }

// ── Config Preload ──────────────────────────────────────────────────────

// Track which entity paths have been requested to prevent duplicate fetches
const fetchedPaths = new Set();

// Preload sequence: fetch map -> load map -> fetch entities -> load entities -> init
async function preloadAndStart(scenarioPath) {
  const spinner = document.getElementById('wasm-spinner');

  try {
    // Step 1: Set up the config request callback
    window.set_config_request_callback = wasmBindings.set_config_request_callback;
    set_config_request_callback(handleConfigRequest);

    // Step 2: Fetch and load the unified world TOML (map + scenario in one file)
    const worldResponse = await fetch(scenarioPath);
    if (!worldResponse.ok) {
      console.error('Failed to fetch world:', worldResponse.status);
      throw new Error('World fetch failed');
    }
    const worldToml = await worldResponse.text();

    // Step 3: Load the world — parses both the map half (anchors, [[entity]],
    // global config) and the scenario half (spawns, triggers, comms) from one
    // TOML, then fires callbacks for all referenced entity paths.
    window.wasm_load_world = wasmBindings.wasm_load_world;
    window.wasm_load_config = wasmBindings.wasm_load_config;
    window.wasm_is_preload_complete = wasmBindings.wasm_is_preload_complete;

    wasm_load_world(scenarioPath, worldToml);

  } catch (e) {
    console.error('Preload failed:', e);
    if (spinner) spinner.style.display = 'none';
    // Show error to user — use wasm-spinner element so we don't destroy #qr-link
    const errDiv = document.getElementById('wasm-spinner');
    if (errDiv) {
      errDiv.innerHTML = '<div style="color: #f44; padding: 2rem; text-align: center; font-family: monospace;">Failed to load game configuration. See console for details.</div>';
      errDiv.style.display = 'flex';
    }
    return;
  }
}

// Handle config fetch requests from Rust
function handleConfigRequest(path) {
  // Prevent duplicate fetches
  if (fetchedPaths.has(path)) {
    return;
  }
  fetchedPaths.add(path);
  
  // Fetch the entity config
  fetch(path)
    .then(response => response.ok ? response.text() : Promise.reject(new Error(`HTTP ${response.status}`)))
    .then(toml => {
      let complete = false;
      try {
        // wasm_load_config returns true when the last pending config is loaded.
        complete = wasm_load_config(path, toml) === true;
      } catch (e) {
        console.error(`Failed to parse config at ${path}:`, e);
        // Rust already cleaned up in_flight/pending in the Err path.
        // Check if all other paths finished before this one errored.
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    })
    .catch(err => {
      console.error(`Failed to fetch config at ${path}:`, err);
      // Fetch failed — call wasm_load_config with empty string so Rust can
      // remove this path from in_flight/pending and know whether preload is done.
      let complete = false;
      try {
        complete = wasm_load_config(path, '') === true;
      } catch (_) {
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    });
}

// Finish initialization after preload completes
  let _finishInitCalled = false;
function finishInit() {
  if (_finishInitCalled) return;
  _finishInitCalled = true;
  const spinner = document.getElementById('wasm-spinner');
  
  window.wasm_init = wasmBindings.wasm_init;
  window.wasm_receive_message = wasmBindings.wasm_receive_message;
  window.set_message_callback = wasmBindings.set_message_callback;
  window.wasm_validate_stations = wasmBindings.wasm_validate_stations;
  window.wasm_set_debug_regions = wasmBindings.wasm_set_debug_regions;
  window.wasm_is_debug_regions_enabled = wasmBindings.wasm_is_debug_regions_enabled;
  window.wasm_toggle_debug_regions = wasmBindings.wasm_toggle_debug_regions;
  window.wasm_toggle_debug_overlay = wasmBindings.wasm_toggle_debug_overlay;
  window.wasm_toggle_debug_pause = wasmBindings.wasm_toggle_debug_pause;
  window.wasm_get_debug_state = wasmBindings.wasm_get_debug_state;
  window.wasm_toggle_debug_damage = wasmBindings.wasm_toggle_debug_damage;
  window.wasm_get_damage_log = wasmBindings.wasm_get_damage_log;
  window.wasm_toggle_debug_entities = wasmBindings.wasm_toggle_debug_entities;
  window.wasm_get_entity_debug_state = wasmBindings.wasm_get_entity_debug_state;
  window.wasm_toggle_entity_inspector = wasmBindings.wasm_toggle_entity_inspector;
  window.wasm_get_entity_inspector = wasmBindings.wasm_get_entity_inspector;

  // ── HTML console bridge exports (issue #422 / ADR-0001) ─────────────────
  // Expose the inbound action entry point and the state-push callback
  // registrations. The HUD callback is wired immediately so the viewscreen
  // overlay starts receiving state as soon as the sim runs.
  window.wasm_ui_action = wasmBindings.wasm_ui_action;
  window.set_console_state_callback = wasmBindings.set_console_state_callback;
  window.set_hud_state_callback = wasmBindings.set_hud_state_callback;
  window.set_lobby_state_callback = wasmBindings.set_lobby_state_callback;
  if (typeof set_hud_state_callback === 'function') {
    set_hud_state_callback(window.__updateHud);
  }
  if (typeof set_lobby_state_callback === 'function') {
    set_lobby_state_callback(window.__updateLobby);
  }

  // ── HTML console state relay (issue #428) ────────────────────────────────
  // WASM pushes console state via flush_console_state → set_console_state_callback.
  // We relay it to HTML console pages (gui/*.html) open in the same browser
  // origin via BroadcastChannel ('phoenix-console-state').  Those pages send
  // their actions back on the same channel and we forward them to wasm_ui_action.
  var _consoleBroadcast = ('BroadcastChannel' in window)
      ? new BroadcastChannel('phoenix-console-state')
      : null;
  window.__updateConsole = function(name, json) {
    if (_consoleBroadcast) {
      _consoleBroadcast.postMessage({ type: 'console_state', name: name, json: json });
    }
  };
  if (_consoleBroadcast) {
    _consoleBroadcast.onmessage = function(e) {
      if (e.data && e.data.type === 'console_action' && typeof wasm_ui_action === 'function') {
        wasm_ui_action(e.data.payload);
      }
    };
  }
  if (typeof set_console_state_callback === 'function') {
    set_console_state_callback(window.__updateConsole);
  }

  // Validate station config before starting PeerJS or the Bevy app.
  // A malformed [stations] section must refuse to boot.
  fetch('assets/entities/player_ship.toml')
    .then(r => r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(toml => {
      try {
        wasm_validate_stations(toml);
      } catch (err) {
        showFatalError('Station config error: ' + (err && err.message ? err.message : String(err)));
        return;
      }
      startServer();
    })
    .catch(err => {
      showFatalError('Failed to load player_ship.toml: ' + String(err));
    });
}

function showFatalError(message) {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) {
    spinner.innerHTML =
      '<div style="color:#f44;padding:2rem;text-align:center;font-family:monospace;max-width:40rem;">' +
      '<strong>Fatal configuration error</strong><br><br>' +
      message.replace(/</g, '&lt;') +
      '<br><br>Fix the TOML and reload the page.</div>';
    spinner.style.display = 'flex';
  }
  // PeerJS is already constructed but we never call startServer(), so it
  // will open its peer but never receive connections that matter.
  console.error('[Phoenix] Fatal:', message);
}

function startServer() {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) spinner.style.display = 'none';

  // Read ?debug_regions=1 URL parameter before WASM init
  const urlParams = new URLSearchParams(location.search);
  if (urlParams.get('debug_regions') === '1') {
    wasm_set_debug_regions(true);
  }

  set_message_callback(routeOutbound);

  // Register the runtime world-fetch callback so load_world triggers can
  // additively load a world TOML (e.g. patrol.toml) during gameplay.
  if (typeof wasmBindings.set_world_fetch_callback === 'function') {
    wasmBindings.set_world_fetch_callback(function(path) {
      fetch(path)
        .then(r => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status)))
        .then(toml => { wasmBindings.wasm_push_world_toml(path, toml); })
        .catch(err => {
          console.error('[Phoenix] Failed to fetch world TOML at ' + path + ':', err);
          // Push empty string so Rust stops re-requesting.
          wasmBindings.wasm_push_world_toml(path, '');
        });
    });
  }
  
  // Flush before wasm_init: App::run() in WASM unwinds the JS stack by
  // throwing, so any code after wasm_init() never executes.
  for (const [token, json] of msgQueue.splice(0)) wasm_receive_message(token, json);

  // Signal smoke tests (and any other listeners) that wasm_receive_message is
  // now set and the msgQueue has been flushed.  We dispatch PhoenixReady BEFORE
  // wasm_init() because App::run() in WASM throws (unwinding the JS stack), so
  // code placed after wasm_init() is unreachable.
  window.__phoenixReady = true;
  window.dispatchEvent(new CustomEvent('PhoenixReady'));

  try { wasm_init(); } catch (_) {}
}

// ── WASM startup ───────────────────────────────────────────────────────
// Trunk fires TrunkApplicationStarted once the WASM binary is fully
// instantiated and sets window.wasmBindings to the wasm-bindgen exports.

function startPhoenix() {
  preloadAndStart(selectedScenario).catch(err => {
    console.error('Failed to start preload:', err);
  });
}

window.addEventListener('TrunkApplicationStarted', () => {
  wasmReady = true;
  if (selectedScenario) startPhoenix();
});

    // ── F4 — toggle region wireframes ────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F4') {
        e.preventDefault();
        if (typeof wasm_toggle_debug_regions === 'function') {
          wasm_toggle_debug_regions();
        }
      }
    });

    // ── F3 — toggle modifier debug overlay ───────────────────────────────
    (function() {
      var overlayEl = document.getElementById('debug-overlay');
      var overlayVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F3') {
          e.preventDefault();
          overlayVisible = !overlayVisible;
          overlayEl.style.display = overlayVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_overlay === 'function') {
            wasm_toggle_debug_overlay();
          }
        }
      });

      // Refresh overlay text every animation frame while visible.
      function rafLoop() {
        if (overlayVisible && typeof wasm_get_debug_state === 'function') {
          overlayEl.textContent = wasm_get_debug_state();
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F9 — debug pause simulation ──────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F9') {
        e.preventDefault();
        if (typeof wasm_toggle_debug_pause === 'function') {
          wasm_toggle_debug_pause();
        }
      }
    });

    // ── F8 — toggle damage debug log ─────────────────────────────────────
    (function() {
      var damageEl = document.getElementById('damage-log-overlay');
      var damageVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F8') {
          e.preventDefault();
          damageVisible = !damageVisible;
          damageEl.style.display = damageVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_damage === 'function') {
            wasm_toggle_debug_damage();
          }
        }
      });

      function rafLoop() {
        if (damageVisible && typeof wasm_get_damage_log === 'function') {
          damageEl.textContent = wasm_get_damage_log();
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F7 — toggle entity behavior overlay ─────────────────────────────
    (function() {
      var entityEl = document.getElementById('entity-debug-overlay');
      var entityVisible = false;

      document.addEventListener('keydown', function(e) {
        if (e.key === 'F7') {
          e.preventDefault();
          entityVisible = !entityVisible;
          entityEl.style.display = entityVisible ? 'block' : 'none';
          if (typeof wasm_toggle_debug_entities === 'function') {
            wasm_toggle_debug_entities();
          } else if (entityVisible) {
            entityEl.textContent = '(entity overlay: WASM not ready — hard-reload the page)';
          }
        }
      });

      function rafLoop() {
        if (entityVisible) {
          if (typeof wasm_get_entity_debug_state === 'function') {
            var txt = wasm_get_entity_debug_state();
            entityEl.textContent = txt.length > 0 ? txt : '(entity overlay active — waiting for Bevy)';
          }
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();

    // ── F2 — toggle entity inspector overlay ────────────────────────────
    (function() {

          inspectorEl.style.display = inspectorVisible ? 'block' : 'none';
          if (typeof wasm_toggle_entity_inspector === 'function') {
            wasm_toggle_entity_inspector();
          } else if (inspectorVisible) {
            inspectorEl.textContent = '(entity inspector: WASM not ready — hard-reload the page)';
          }
        }

      function rafLoop() {
        if (inspectorVisible) {
          if (typeof wasm_get_entity_inspector === 'function') {
            var txt = wasm_get_entity_inspector();
            inspectorEl.textContent = txt.length > 0 ? txt : '(entity inspector active — waiting for Bevy)';
          }
        }
        requestAnimationFrame(rafLoop);
      }
      requestAnimationFrame(rafLoop);
    })();
  </script>

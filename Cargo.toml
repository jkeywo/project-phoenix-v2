[package]
name = "project-phoenix"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

# Headless simulation runner. Native only — it drives the app with a manual
# fixed-timestep loop, which has no meaning under requestAnimationFrame.
[[bin]]
name = "phoenix-headless"
path = "src/bin/phoenix_headless.rs"
required-features = ["headless"]

# Asset budgets and baseline comparison (issue #868). Native only, and needs no
# simulation — it reads what is on disk and what a capture recorded, so it is
# not gated on the headless feature the way the runner is. It carries its own
# gate instead: an UNgated bin is a second wasm target artifact, and Trunk
# refuses to guess between it and the cdylib ("found more than one target
# artifact"), which broke every browser build and skipped the smoke suite with
# it. Any native-only bin added here needs a `required-features` for the same
# reason.
[[bin]]
name = "capture-billboard"
path = "src/bin/capture_billboard.rs"
required-features = ["capture"]

[[bin]]
name = "phoenix-perf"
path = "src/bin/phoenix_perf.rs"
required-features = ["perf"]

# Automatic LOD switch-range tuner (see src/bin/tune_lods.rs). Native-only, same
# `capture` feature as capture-billboard (both are offscreen GPU render tools),
# and — like every native-only bin here — it MUST carry `required-features` or
# Trunk's wasm build finds a second target artifact and refuses to build.
[[bin]]
name = "tune-lods"
path = "src/bin/tune_lods.rs"
required-features = ["capture"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["server"]
# Server feature: builds the host crate (Trunk → server.html) which runs
# the lobby, simulation, and 3D renderer. Includes the JS↔WASM bridge in
# `bridge.rs`.
server = []
# Viewer feature: builds the standalone model/shader viewer (Trunk →
# viewer.html), a dev tool for iterating on model appearance, lighting and
# WGSL without booting the game.
#
# Depends on `server` because the simulation modules reference `crate::bridge`
# and `crate::server::renderer` directly, so the crate does not currently
# compile without it. The viewer only *runs* its own plugin — none of the
# simulation systems are registered — so this costs binary size, not
# behaviour. If viewer rebuilds ever get painful, breaking those references is
# the thing to fix.
viewer = ["server"]
# Debug feature: enables Bevy's debug feature for local development.
# Not included in release/deployed builds (opt in via `--features debug`).
debug = ["bevy/debug"]
# Headless feature: builds the `phoenix-headless` binary and the
# `crate::headless` module it lives in. Additive alongside `server` — cargo
# features are per-package, so bevy's render stack is still *compiled*; headless
# only avoids instantiating `RenderPlugin`.
headless = []
# Perf feature: builds the `phoenix-perf` asset-budget and baseline tool. It
# exists to keep that binary out of the wasm target list rather than to gate any
# code — see the `[[bin]]` note above.
perf = []
# Capture feature: builds the `capture-billboard` tool, a native headless
# renderer that bakes a model's far-LOD billboard atlas (see src/bin). Pulls in
# the `image` crate for PNG encoding; kept out of the default/wasm builds because
# it renders offscreen with a native GPU adapter.
capture = ["server", "dep:image", "dep:crossbeam-channel"]

[dependencies]
bevy = { version = "0.18.1", features = ["webgl2", "webp"] }
# PNG encoding for the `capture-billboard` tool (optional; enabled by the
# `capture` feature). Matches the version Bevy already resolves.
image = { version = "0.25", optional = true }
# Main-world ↔ render-world channel for the headless capture readback, as in
# Bevy's headless_renderer example (optional; `capture` feature).
crossbeam-channel = { version = "0.5", optional = true }
# `libm` feature: glam's own `f32`/`f64` math module (see `math.rs` in the
# glam source) cfg's its libm-backed block on bare `feature = "libm"`, with
# no `not(feature = "std")` guard — so this alone genuinely swaps glam's
# `sin`/`cos`/`atan2`/… for the pure-Rust libm crate on a std (native) target,
# not only on no_std/wasm. Verified by reading glam 0.30.10's
# `src/f32/math.rs` cfg attributes directly (issue #909 AC-2), not assumed.
glam = { version = "0.30", features = ["libm"] }
# nalgebra/parry3d/rapier3d/simba (issue #909): put the physics solver's own
# transcendentals on the same shared libm as `crate::simmath` (issue #908),
# rather than leaving `glam` fixed while the collision/dynamics stack still
# drifts across targets.
#
# The naive fix — just turning on each crate's `libm` cargo feature — is a
# **verified no-op** here, not a hypothetical one. `simba` (which supplies
# `nalgebra`'s and `parry3d`'s scalar `ComplexField`/`RealField` impls for
# `f32`/`f64`, the actual `sin`/`cos`/`atan2`/`powf` call sites) picks its
# implementation by macro-gated cfg in `simba-0.9.1/src/scalar/complex.rs`:
#   `cfg(all(not(std), not(libm_force), libm))`  → routes through libm
#   `cfg(all(std, not(libm_force)))`              → routes through std  (wins
#                                                     whenever `std` is on,
#                                                     `libm` or not)
#   `cfg(libm_force)`                             → routes through libm
#                                                     unconditionally
# Because this workspace's dependency graph unifies `simba`'s features across
# every consumer, `simba/std` is always on here (nalgebra's own `default`
# feature pulls it in, and nothing in the graph opts every edge out of it) —
# so plain `nalgebra/libm` / `simba/libm` is silently ignored on native, and
# only the wasm side would ever have differed. `libm_force` is the escape
# hatch that bypasses the `std` check entirely; `parry3d` and `rapier3d` each
# expose it pre-wired under their own `enhanced-determinism` feature
# (`enhanced-determinism = ["simba/libm_force", ...]` in their manifests) —
# the crates' own answer to exactly this cross-platform determinism problem.
# `nalgebra/libm` is still listed below per the issue's AC wording and
# because it is harmless and forward-looking, but `rapier3d`'s
# `enhanced-determinism` (cascading into `parry3d/enhanced-determinism` and
# `simba/libm_force`) is what actually forces the switch.
#
# NOTE: this does not by itself make the physics solver bit-exact — Rapier's
# `parallel` feature (enabled below on native) still lets the solver reorder
# float accumulation order-of-operations across threads, which is a second,
# independent divergence source. That is issue #896's serial-solve fix; #909
# is scoped to the shared-libm plumbing only. See the cross-target vector
# battery in src/simmath_vectors.rs — which folds nalgebra's and glam's own
# outputs into the same digest, not just `crate::simmath`'s — for what this
# Cargo.toml change actually proves.
#
# COST: `enhanced-determinism` hard-conflicts with rapier3d's and parry3d's
# SIMD features — both crates carry
# `#[cfg(all(feature = "simd-is-enabled", feature = "enhanced-determinism"))]
# std::compile_error!("SIMD cannot be enabled when the `enhanced-determinism`
# feature is also enabled.")` (rapier3d-0.31.0/src/lib.rs:46,
# parry3d-0.25.3/src/lib.rs:31). So `simd-stable`/`simd-nightly` are
# permanently off the table for as long as this is on: it is a determinism-for-
# throughput trade, not a free win, and "just turn on SIMD for the physics" is
# a build break rather than a tuning knob.
#
# Not covered by any of this: the `noise` crate below (0.9.0, which exposes no
# `libm` feature at all). Verified exact by reading its source rather than
# assumed: the Perlin path this repo uses — `core/perlin.rs::perlin_2d` via
# `noise_fns/generators/perlin.rs`, reached from
# `src/asteroids/spawner.rs::perlin2d_octaves` — computes with nothing but
# `floor`-to-integer, integer permutation-table hashing (`permutationtable.rs`,
# an XorShift-seeded `[u8; 256]`), gradient dot-products that are plain ± of
# two components, `math/s_curve/quintic.rs` (`x*x*x*(x*(x*6−15)+10)`),
# `math/interpolate.rs::linear` (`b*α + a*(1−α)`), one const `SCALE_FACTOR`
# multiply, and a `clamp`. No transcendental anywhere in it, so IEEE-754
# already pins every operation bit-for-bit on both targets and there is
# nothing for libm routing to fix.
#
# One honest caveat, and it is not a libm one: `floor_to_isize` casts through
# `isize`, which is 32-bit on wasm32 and 64-bit here. Inside i32 range the two
# agree exactly (the hash masks to `& 0xff` regardless); beyond it wasm would
# panic on the `NumCast::from(...).unwrap()` while native keeps going. Lattice
# coordinates are nowhere near that, so it is a bound to respect, not a live
# divergence.
nalgebra = { version = "0.34.2", features = ["libm"] }
parry3d = { version = "0.25.3", features = ["enhanced-determinism"] }
rapier3d = { version = "0.31.0", features = ["enhanced-determinism"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
wasm-bindgen = "0.2.120"
rand = "0.9"
# No `libm` feature exists on this crate, and none is needed — its Perlin path
# is transcendental-free, so it is already bit-exact cross-target. Reasoning
# recorded in the nalgebra/parry3d/rapier3d determinism block above (#909 AC-5).
noise = "0.9"
toml = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
# Pure-Rust libm backing `crate::simmath` (issue #908). Simulation code must
# not call std's float transcendentals (`sin`, `cos`, `atan2`, …): std routes
# them to the platform's libm (native links the system one, wasm gets Rust's),
# and IEEE-754 guarantees nothing about their last bit, so a lockstep sim
# desyncs across targets. Already in Cargo.lock transitively — no new
# supply-chain surface.
libm = "0.2"
# The fleet's cross-runtime measurement contract (issue #868). Phoenix's first
# vellum crate — pinned to the rev pyproject.toml already pins for pasm, so the
# repo carries one vellum rev rather than two. The `json` feature is on because
# CI stores the capture artifact; `Baseline` round-trips RON without it.
vellum-perf = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484", features = ["json"] }
# The seeded simulation generator behind `crate::sim_rng` (issue #897). Same
# vellum rev as `vellum-perf` above, for the same reason — one vellum rev in
# the repo, not two. Taken for a property `rand`'s `SmallRng` does not have:
# `Pcg32` is `Serialize`, so the six `SimStream` positions can enter a world
# snapshot (#862). Its only dependency is serde, so it is a non-event for the
# wasm build. `rand` stays regardless: it still backs the *cosmetic* unseeded
# generators in the renderer, pfx and asteroid modules, which are deliberately
# not part of the seeded simulation.
vellum-rng = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484" }
# The replay-as-save contract behind `crate::command_admission::log` (issue
# #898). Same vellum rev as the two above, for the same reason. Zero
# dependencies of its own, so it is a non-event for the wasm build.
#
# What phoenix takes from it is a *shape*, not a scheduler: `Simulation` states
# the three rules a command log rests on — same commands on the same seed reach
# the same state, a refusal changes nothing at all, and a refusal never reaches
# the log — and the `testkit` feature (a dev-dependency, below) checks them
# against a real implementation instead of a toy. The crate has no notion of a
# tick: `LoggedCommand { tick, command }` is phoenix's, because the tick a
# command applies on is phoenix's contract with its lockstep peers (#854), not
# vellum's.
vellum-replay = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484" }
# The digest primitives behind `crate::headless::digest` (issue #901): `fnv1a`,
# `fold_digest`/`FOLD_SEED` and `digest_postcard`. Same vellum rev as the three
# above — one vellum rev in the repo, not two.
#
# Named as *the* primitive by issue #894's boundary record
# (`vellum-digest-primitive-reference`), which deliberately did not wire it:
# that issue decided the boundary, this one computes a digest against it.
#
# Its published check vectors (FNV-1a's and CRC-32's) are asserted upstream in
# the crate's own tests and are deliberately NOT re-tested here — a second copy
# of a published vector proves nothing this repository owns.
#
# Dependencies are serde, postcard and base64: all pure, all already wasm-clean,
# so this is a non-event for the browser build exactly as `vellum-rng` and
# `vellum-replay` were. Default features only — `ron-digest` stays off, because
# phoenix's fold is defined over postcard bytes and the two never produce the
# same number for the same value.
vellum-digest = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484" }
# The fleet's persistence contract behind `crate::snapshot` (issue #862). Same
# vellum rev as the four above — one vellum rev in the repo, not two.
#
# Phoenix supplies the snapshot *payload* and nothing else: `Run`'s envelope,
# `Versions`' three-dimensional gate and `Store`'s slot abstraction all come
# from here, which is why this repository defines no save envelope, no version
# field and no compatibility validator of its own. `Moved` is what a host is
# shown when a stored save will not load, rendered verbatim — a phoenix-invented
# status would be a second, quietly disagreeing answer to a question this crate
# has already settled.
#
# The `run` feature pulls `Run`, `Snapshot` and `verify`, and with them
# `vellum-replay` — already a dependency above, so it costs nothing new. The
# storage backends are per-target below because they have to be: `backend-fs` is
# a filesystem the browser does not have, and `backend-web` is `localStorage`,
# which the crate cfg's to `wasm32` anyway. Cargo unifies the stanzas into one
# `vellum-save` per target.
vellum-save = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484", features = ["run"] }

[dev-dependencies]
# The contract checks (`vellum_replay::contract`), which the crate gates behind
# `testkit` precisely so no shipped binary pulls them in. Cargo unifies this
# with the dependency above for test builds only.
vellum-replay = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484", features = ["testkit"] }

# `bevy/debug` (issue #894): without it, `ComponentInfo::name()` (used by
# `tests/authoritative_state_enumeration.rs` to enumerate the sim app's
# registered components/resources) returns a fixed "<Enable the debug
# feature...>" placeholder for every type, making the enumeration guard blind.
# Declared here rather than in `[dependencies]` so no shipped binary (server,
# headless, wasm) pays for it — Cargo unifies it into the SAME `bevy` instance
# for test builds only, the same pattern `vellum-replay`/`testkit` uses above.
bevy = { version = "0.18.1", features = ["debug"] }

# Native: SERIAL physics, deliberately matching wasm (issue #896).
#
# This stanza used to carry `features = ["parallel"]`, and the wasm stanza below
# never could (the browser build is single-threaded). A parallel broadphase does
# not hand contacts to the narrow phase in the same order a serial one does, so
# the two targets could disagree on contact order while any two NATIVE instances
# agreed perfectly — a divergence invisible to native-only testing that would
# first surface in real P2P between a browser and anything else. The feature is
# off here so both targets run the identical solver; the cost is native physics
# throughput, which the non-gating perf baselines will register and which is the
# right trade for a simulation that claims determinism.
#
# If a build ever wants the parallel solver back, that has to be an explicit,
# recorded choice for a build that does NOT claim determinism —
# `the_deterministic_build_runs_rapier_serially` in tests/headless_runner.rs is
# the guard that makes silently re-adding it fail.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_rapier3d = { version = "0.33" }
# Baselines are authored RON read by the headless harness, which is native-only
# (`src/headless` is cfg'd off under wasm). Keeping the reader here means the
# browser build carries no parser it cannot reach.
ron = "0.12"
# `FileStore` — `<root>/<slot>.ron` (issue #862). Native only, because a
# filesystem is: the browser gets `backend-web` in the wasm stanza below. Both
# unify into the single `vellum-save` declared in `[dependencies]`.
vellum-save = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484", features = ["backend-fs"] }

# WASM: no parallel, uses single-threaded runtime
# getrandom 0.3+ needs wasm_js feature + cfg(getrandom_backend="js")
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_rapier3d = { version = "0.33", features = ["dim3"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
# `LocalStorage` — `localStorage["phoenix:<slot>"]` (issue #862). The browser
# half of the pair whose native half is `backend-fs` above.
vellum-save = { git = "https://github.com/jkeywo/vellum", rev = "582a61206d39c13d051d2e73bf463bb5d167d484", features = ["backend-web"] }

[target.wasm32-unknown-unknown.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3.97", features = ["Window", "Location", "Navigator", "NavigatorAutomationInformation", "console", "Performance"] }
# Routes Rust panics through console.error with a real message + location.
# Without this, a panic anywhere in the Bevy app (e.g. inside a system) traps
# the wasm instance and every subsequent JS→WASM call surfaces as a bare
# "RuntimeError: memory access out of bounds" — usually pointing at whatever
# entry point fired next (typically `wasm_receive_message`), which makes the
# real panic site invisible.
console_error_panic_hook = "0.1"

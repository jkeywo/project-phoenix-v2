      owner: visiting-station-resolver
      writers: [visiting-station-resolver]
    implementation:
      status: declared
      paths: [src/ship/components.rs, src/server_app/broadcast.rs, src/core/messages.rs, gui/sim-state.js, gui/hero-bar.js]

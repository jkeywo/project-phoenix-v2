# Per-axis helm systems (issue #701; thrust/steering declared in #800,
# impulse/boost/lateral in #703/#704/#801 — no coarse `helm` system remains).
# This hull declares five axes: helm-thrust, helm-steering, helm-impulse,
# helm-boost and helm-lateral-thrust, all owned by the helm station and power
# group. None appear in any rating's `automated_systems`, and an unmanned Helm
# gets the `Backfill` rating, which automates every station-owned system — so
# all five axes come up on AI together; a manned Helm keeps them all on the
# human.
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "helm"
power_group = "helm"


# Harrow Destroyer Reinforcement (formerly Pirate Raider Reinforcement)
#
# Variant of pirate_raider.toml used when reinforcements arrive via a
# LoadWorld trigger. Identical to the base destroyer except the
# detection range is effectively global since operate_helm scans all
# WorldView entities rather than using a radius trigger.
#
# (#474) Re-balanced alongside pirate_raider.toml: hull 30 + shield 15
# at 0.5/s regen, phaser pierce 0.1, no flee — fight to the death.
# (#572) FSM dissolved — doctrine-based AI.

name = "entity.pirate_raider_reinforcement.name"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "high"
description = "entity.pirate_raider_reinforcement.target.description"

[hull]
hull_integrity = 30.0

# Single omni shield arc (issue #514). NPCs have no `[shields]` station so
# the auto-generated `[[system]]` entry is `ai_only = true` and ownerless.
[[shield_arc]]
id = "all"
label = "entity.pirate_raider_reinforcement.shield_arc.all.label"
center_deg = 0
width_deg = 360
max_hp = 15
regen_per_sec = 0.5

[collider]
shape = "Capsule"
radius = 2.0
length = 4.0

[helm_console]
max_speed = 20.0
max_reverse_speed = 0.0
acceleration = 12.5
deceleration = 30.0
max_yaw_rate = 2.0
max_bank_deg = 15.0

[helm_console.engine_pfx]
color = [ 1.0, 0.22, 0.08, 0.68 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.45

[weapons_console]

[[weapons_console.phaser_banks]]
id = "fore"
facing_deg = 0.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 37.5
beam_damage_per_sec = 6.0
beam_duration_secs = 4.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.1, 0.1, 1.0]

[radar_appearance]
colour = [1.0, 0.2, 0.2]
size = 4.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_destroyer.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [1.0, 0.2, 0.2]

[comms]
range = 400.0

[ai_profile]
aggression = 0.8
sensor_range = 120.0

# ── Behaviour ────────────────────────────────────────────────────────────────
#
# (#572) Doctrine-based behaviour. Destroy outscores Patrol so the
# reinforcement immediately hunts any hostile it can find.

[behaviour]

[[behaviour.doctrine]]
id        = "patrol-sector"
text      = "entity.pirate_raider_reinforcement.behaviour.doctrine.patrol_sector.text"
directive_kind    = "Patrol"
directive_anchors = ["patrol_alpha", "patrol_beta", "patrol_gamma"]
directive_loop    = true
base_priority     = 20.0
target_speed      = 0.4

[[behaviour.doctrine]]
id            = "destroy-hostiles"
text          = "entity.pirate_raider_reinforcement.behaviour.doctrine.destroy_hostiles.text"
directive_kind = "Destroy"
base_priority  = 35.0
target_speed   = 0.9
maintain_range = 25.0

# ── Stations ──────────────────────────────────────────────────────────────────
#
# Crew stations (issue #871), mirroring `alliance_destroyer.toml` — the
# comparable player hull for this destroyer-class raider. See the fuller note in
# `pirate_raider.toml`: every seat boots on the implicit `Backfill` rating, which
# automates every system the station owns, so an unmanned hull behaves exactly as
# it did when its systems were ownerless + `ai_only`.
#
# The auto-generated `shield-arc-all` system (synthesised from `[[shield_arc]]`,
# no shields station on this hull) is the only thing left ownerless + `ai_only`.

[[station]]
id = "captain"
name = "Captain"
description = "entity.pirate_raider_reinforcement.station.captain.description"
rank = "Cpt."
short_code = "CPT"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "helm"
name = "Helm"
description = "entity.pirate_raider_reinforcement.station.helm.description"
rank = "Ltn."
short_code = "HLM"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.pirate_raider_reinforcement.station.tactical.description"
rank = "Lt. Cmdr."
short_code = "TAC"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "engineering"
name = "Engineering"
description = "entity.pirate_raider_reinforcement.station.engineering.description"
rank = "Ltn."
short_code = "ENG"

[[station.rating]]
name = "Std"
automated_systems = []

# ── Systems ───────────────────────────────────────────────────────────────────
#
# Red Alert authored explicitly (issue #871) rather than left to the #749
# ownerless provision, so the Captain seat owns it. Control source is unchanged:
# Backfill automates it.
[[system]]
id = "red-alert"
kind = "red_alert"
station = "captain"

# Per-axis helm systems (issues #701/#703, declared in #800 and #704), owned by
# the Helm seat.
#
# #800 declared thrust + steering. #704 adds impulse + lateral-thrust, which the
# deleted `operate_helm_ai` monolith used to drive on this hull's behalf: an
# undeclared system resolves to ControlSource::Human (`operate_ai = false`), so
# the monolith never stood down from those two axes here. Declaring them hands
# both to `ai_helm_impulse` / `ai_helm_lateral_thrust`, which was what made the
# delete behaviour-preserving. (Since #803 both systems decide on the shared
# AI-helm sim tick — `[global] ai_helm_tick_hz`, default 30 Hz — rather than
# once per rendered frame as the monolith did.)
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "helm"

[[system]]
id = "helm-steering"
kind = "helm_steering"
station = "helm"

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
station = "helm"

# Boost drive axis (issue #801), declared for hull-uniformity with the player
# ships: every helm axis is a declared system on every hull. No AI drives
# boost, so the declaration gives the axis the standard damage/repair surface
# plus a lever for a human at the Helm seat.
[[system]]
id = "helm-boost"
kind = "helm_boost"
station = "helm"

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
station = "helm"

# The Tactical radar (issue #871) — the system every player hull declares and no
# NPC hull did, which is what blocked #887 from routing AI target selection
# through admission.
[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"

# Fine Tactical systems (issue #512): one phaser bank ("fore"). No torpedoes.
[[system]]
id = "phaser-fore"
kind = "phaser_bank"
station = "tactical"

# Ship-wide phaser settings (issue #801): firing mode + emitter frequency.
# One declared system (NOT per-bank) so SetPhaserMode/SetPhaserFrequency
# admission gates on a real system instead of the deleted coarse `tactical`.
[[system]]
id = "phaser-control"
kind = "phaser_control"
station = "tactical"

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
station = "engineering"

[[system]]
id = "power-battery"
kind = "power_battery"
station = "engineering"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Prevent the entry HTML from being cached so users always pick up the
       latest Trunk-hashed JS/WASM filenames after a deploy. The hashed
       assets themselves remain cacheable forever via their content hash. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Which build is this? (issue #940.) The client is pure JS — no WASM to
       bake a flag into, and scripts/build-client.mjs is a deterministic file
       copy with no compile step — so the meta tag IS the answer here, unlike
       server.html where it only covers the WASM boot window. deploy-demo.yml
       flips it to "true" and fails the run if the rewrite did not land.
       gui/build-flags.js resolves it; the settings cog hides its Debug/Cheat
       tab when it is true. -->
  <meta name="phoenix-build-demo" content="false" />
  <title data-i18n="client.doc_title">Project Phoenix — Console</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
<!-- The shared design vocabulary (PRD #1023 module 1): colours, edges, ink,
     accents, space, the type ramp and its legibility floor, and the control
     sizes. Defined once and consumed by this page, the host viewscreen, and
     every console document (which reaches it through gui/console.css). -->
<link rel="stylesheet" href="gui/tokens.css" />
  <!-- Keep rAF-driven UI (scheduleRender, radar sweeps, joystick decay in
       the console iframes) running at full rate even when this tab loses
       focus — see gui/bg-raf-keepalive.js. Must load before any other
       script calls requestAnimationFrame. -->
  <script src="gui/bg-raf-keepalive.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Loads assets/strings/strings.csv before anything renders. Its top-level
       await blocks every module that imports gui/strings.js, so t() is ready
       by the time the lobby paints. Keep this first. -->
  <script type="module" src="gui/strings-boot.js"></script>
  <!-- Pure-function helpers shared with Vitest unit tests (issues #439, #440, #827). -->
  <script type="module" src="gui/phase-toggle.js"></script>
  <script type="module" src="gui/console-resolver.js"></script>
  <!-- Extracted shell modules (issue #827): mount plan (station id → DOM ids
       + iframe URLs), section switching, the lobby roster fold, the pure
       per-message router, the lobby view model, and the coordination-popup
       payload normaliser. -->
  <script type="module" src="gui/mount-plan.js"></script>
  <script type="module" src="gui/content-switcher.js"></script>
  <script type="module" src="gui/console-mount.js"></script>
  <script type="module" src="gui/hero-bar.js"></script>
  <script type="module" src="gui/station-roster.js"></script>
  <script type="module" src="gui/client-router.js"></script>
  <script type="module" src="gui/lobby-view.js"></script>
  <!-- Crew-public Spectator summary surface (issue #1105). Depends on
       gui/hero-bar.js for the shared health/importance classifiers. -->
  <script type="module" src="gui/spectator-view.js"></script>
  <!-- Onboarding/session-flow state (PRD #1023 module 4): the in-flight
       scenario/ship pick, the game-over frame, and whether a console's link is
       live, still loading or dead. All three are pure rules the inline script
       renders; none of them touch the DOM themselves. -->
  <script type="module" src="gui/scenario-pick.js"></script>
  <script type="module" src="gui/game-over-view.js"></script>
  <script type="module" src="gui/link-state.js"></script>
  <script type="module" src="gui/coordination-popup.js"></script>
  <!-- Per-tab session identity (issue: multiple clients on one desktop).
       localStorage is shared across all tabs of an origin, so every console
       tab read the same session-token and the host collapsed them onto one
       player. installSessionToken() gives each tab its own token. -->
  <script type="module" src="gui/session-token.js"></script>
  <script type="module" src="gui/iframe-bridge.js"></script>
  <!-- Key events reach only the focused document and never cross into an
       iframe, so console keybinds died whenever the last click landed on host
       chrome. Relays them to the active console (see gui/key-relay.js). -->
  <script type="module" src="gui/key-relay.js"></script>
  <script type="module" src="gui/console-state.js"></script>
  <!-- Declarative message → dirty-console table (issue #823): handleMessage()
       fans iframe pushes out through window.dirtyConsolesFor instead of
       per-console push wrappers. -->
  <script type="module" src="gui/dirty-consoles.js"></script>
  <!-- Console input-to-feedback measurement (issue #1169, PRD #1144): this
       phone's own round-trip clock. Publishes window.ConsoleLatencyMeter for
       the inline glue below, which stamps each dispatch and resolves it when
       the issuing console's surface is next handed fresh state — both stamps on
       THIS device, so no cross-clock arithmetic is involved. -->
  <script type="module" src="gui/console-latency.js"></script>
  <script type="module" src="gui/action-map.js"></script>
  <!-- Pure JS client-state modules (issue #460). Each exposes a singleton
       (window.lobbyState / simState / commsState) with an apply(serverMessage)
       method; handleMessage() feeds every inbound message through them,
       replacing the deleted Bevy message drain. -->
  <script type="module" src="gui/lobby-state.js"></script>
  <script type="module" src="gui/sim-state.js"></script>
  <!-- Contextual tutorials (issue #916): trigger evaluation + client-local
       progress. Script-tag order does NOT matter: the module imports the
       sim-state singleton directly and hydrates simState.tutorialProgress
       from localStorage in the module graph (it is in fact already evaluated
       by the console-state.js tag above; this tag documents the dependency
       and defines window.applyTutorialAction for the inline script). -->
  <script type="module" src="gui/tutorial-state.js"></script>
  <script type="module" src="gui/device-orientation.js"></script>
  <script type="module" src="gui/comms-state.js"></script>
  <!-- Connection manager: PeerJS lifecycle extracted into a tested module (issue #603) -->
  <script type="module" src="gui/connection-manager.js"></script>
  <!-- Settings panel: client controls plus Station Help and Ship Manual. -->
  <script type="module" src="gui/settings-panel.js"></script>
  <!-- Private per-player Accessibility profile (issue #1102): presentation
       effects + inert assistance schema. Hydrates simState.accessibilityProfile
       from localStorage in the module graph and defines
       window.applyAccessibilityProfile / setAccessibilityPresentation for the
       inline script below. Never sent to the host — client-local. -->
  <script type="module" src="gui/accessibility-profile.js"></script>
  <style>
    /* The lobby's vocabulary is gui/tokens.css, linked above — it used to keep
       a parallel `:root` here whose `--edge` was a different colour from the
       consoles' and whose `--dim` sat below the contrast floor. Retired into
       the shared ramp; tests/client/console-tokens.test.js keeps it retired. */
    html, body { margin: 0; padding: 0; background: var(--surface-abyss); color: var(--ink); font-family: monospace; }
    body { box-sizing: border-box; }
    label { display: block; margin-bottom: 0.5rem; font-size: var(--text-md); }
    input[type="text"] { display: block; width: 100%; box-sizing: border-box;
      background: var(--surface-panel); color: var(--ink); border: 1px solid var(--edge); padding: 0.5rem; margin-top: 0.25rem; }
    button { display: block; width: 100%; background: var(--surface-lift); color: var(--ink);
      border: 1px solid var(--edge); padding: 0.75rem; margin: 0.4rem 0; cursor: pointer;
      font-family: monospace; font-size: var(--text-lg); text-align: left; min-height: var(--control-hit-min); }
    button:active { background: var(--surface-ridge); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.mine { border-color: var(--sky); color: var(--sky); }
    /* Status line: bottom-left, above canvas. z-index 25 keeps it above the
       phone bezel (15) so connection status isn't obscured by the corner. */
    #status { position: fixed; bottom: 0.5rem; left: 0.75rem; color: var(--edge-bright); font-size: var(--text-sm); z-index: 25; }
    /* Connection diagnostics readout: sits above #status, same corner. Shows
       relay reachability + per-attempt ICE stage so a phone user can report
       why a connection is stuck without opening devtools. */
    #conn-diag { position: fixed; bottom: 1.6rem; left: 0.75rem; color: var(--edge-strong);
      font-size: var(--text-xs); z-index: 25; white-space: pre-line; max-width: 85vw; }
    section { display: none; }
    section.active { display: block; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem; font-family: monospace;
    }
    #conn-label { font-size: var(--text-sm); color: var(--fire-hot); }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--loaded); flex-shrink: 0; }
    #retry-now-btn {
      display: none; width: auto; background: var(--fire-deep); color: var(--tactical-bright);
      border: 1px solid var(--fire); padding: 0.2rem 0.5rem; margin: 0;
      font-size: var(--text-sm); cursor: pointer; min-height: var(--control-hit-min);
    }
    #retry-now-btn.visible { display: inline-block; }
    #retry-now-btn:active { background: var(--reloading-dim); }
    #fullscreen-btn {
      display: inline; width: auto; background: none; border: none; color: var(--ink);
      font-size: var(--text-lg); cursor: pointer; padding: 0; margin: 0; line-height: 1; min-height: var(--control-hit-min);
    }
    /* View selector cross and Red Alert button moved to Bevy WASM (#48). */
    /* Console container: full-screen flex column layout host for all console
        sections. One human = one station (issue #827) — a single console
        section fills the viewport; there is no tab bar. */
    #console-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
      pointer-events: none;
    }
    #console-container > *, #console-container section.active > * {
      pointer-events: auto;
    }
    /* -- Link state (PRD #1023 module 4, user stories 14 and 15) ---------
       A console renders from local state, so it looks the same whether the
       numbers behind it are live, stale or absent. [data-link] is what makes
       that difference visible.

       `connecting` is dimmed but still live to the touch: it is "not yet", and
       it resolves on its own. `dead` is "no longer" — dimmed harder, drained
       of colour, and inert, so a thumb cannot keep firing torpedoes into a
       link that closed thirty seconds ago. pointer-events on the container is
       what actually stops the taps: the controls themselves live inside
       console iframes and shadow roots this page does not own. */
    #console-container[data-link="connecting"] { opacity: 0.55; }
    #console-container[data-link="dead"] {
      opacity: 0.32; filter: grayscale(0.85);
      pointer-events: none;
    }
    #console-container[data-link="dead"] > *,
    #console-container[data-link="dead"] section.active > * {
      pointer-events: none;
    }
    #console-container[data-link] { transition: opacity .25s ease, filter .25s ease; }
    #link-banner[aria-hidden="true"] { display: none; }
    #link-banner {
      position: fixed; z-index: 188;
      top: max(env(safe-area-inset-top), 3.2rem); left: 50%;
      transform: translateX(-50%);
      max-width: min(92vw, 46ch);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 10px 18px; border-radius: 6px;
      font-family: 'Chakra Petch', monospace; text-align: center;
      background: var(--scrim-panel);
      border: 1px solid var(--edge-strong);
      pointer-events: none;
    }
    #link-banner[data-mode="dead"] {
      border-color: var(--fire); background: rgba(var(--rgb-fire), 0.18);
    }
    #link-banner .link-banner-title {
      font-size: var(--text-md); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      color: var(--ink);
    }
    #link-banner[data-mode="dead"] .link-banner-title { color: var(--fire-bright); }
    #link-banner .link-banner-detail { font-size: var(--text-sm); color: var(--ink-dim); }
    #link-banner .link-banner-detail:empty { display: none; }
    /* Helm console UI moved to Bevy WASM (#49). */
    /* Weapons console: full-viewport iframe overlay when active (issue #422).
       Padding leaves room for the phone bezel (issue #439); see --bezel-inset
       further down. */
    /* The active HTML console section fills the container. */
    .console-section.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
      margin: 0;
    }
    .console-section iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      display: block;
    }
    #station-hero[aria-hidden="true"] { display: none; }
    #station-hero {
      display: flex; gap: 10px;
      align-items: center; flex: 0 0 auto; padding: 4px 10px;
      min-height: var(--control-hit-min); z-index: 16;
      background: var(--surface-panel); border-bottom: 1px solid var(--edge-strong);
      font-family: 'Chakra Petch', monospace;
    }
    #station-hero-tabs { display: flex; flex: 1 1 auto; gap: 4px; overflow-x: auto; min-width: 0; }
    #station-hero-tabs button {
      position: relative; overflow: hidden;
      width: auto; margin: 0; padding: 3px 9px 8px; min-height: var(--control-hit-min);
      display: flex; flex-direction: column; gap: 1px; white-space: nowrap;
      font-size: var(--text-sm); text-align: center;
    }
    #station-hero-tabs button[aria-selected="true"] {
      border-color: var(--signal); min-height: var(--control-hit-min);
    }
    .station-tab-health {
      position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
      overflow: hidden; background: var(--surface-ridge);
    }
    .station-tab-health-fill {
      display: block; height: 100%;
      background: color-mix(in srgb,
        var(--fire) var(--station-health-loss-pct),
        var(--loaded) var(--station-health-pct));
    }
    .station-tab-health-fill[hidden] { display: none; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    /* Persistent per-tab importance cue (issue #1101): its OWN element and glyph
       token, held apart from the health cue above, so an off-screen event or a
       continuing condition reads on every tab without colour and alongside
       health. Never a sort key — importance never reorders tabs. */
    .station-tab-importance { font-size: var(--text-xs); color: var(--ink-dim); letter-spacing: 0.06em; }
    #station-hero-details { display: flex; flex-direction: column; flex: 0 0 auto; gap: 1px; }
    #station-hero-title { font-size: var(--text-md); font-weight: 700; }
    #station-hero-rating, #station-hero-ai { font-size: var(--text-xs); color: var(--ink-dim); }
    @media (orientation: landscape) {
      #console-container.station-hero-visible { flex-direction: row; }
      #station-hero {
        width: clamp(88px, 12vw, 112px); height: 100%; min-height: 0;
        box-sizing: border-box; align-items: stretch; gap: 4px;
        padding: max(4px, env(safe-area-inset-top)) 4px
          max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
        border-right: 1px solid var(--edge-strong); border-bottom: 0;
      }
      #station-hero-tabs {
        flex-direction: column; overflow-x: hidden; overflow-y: auto;
        min-height: 0; align-items: stretch;
      }
      #station-hero-tabs button { width: 100%; flex: 0 0 auto; }
      #station-hero-details {
        writing-mode: vertical-rl; transform: rotate(180deg);
        flex-direction: row; align-items: center; overflow: hidden;
        max-height: 100%; white-space: nowrap;
      }
    }
    /* --- Phone-bezel red alert glow animation -----------------------------
       Pure CSS no PNGs. A thin 2px inset border holds the base frame color;
       when .alert-on is toggled we swap `--bezel-frame` to red and kick off
       a continuous pulse so the console rings like an alarm.
         - 0.5s ease ease-out: fade-in / fade-out transition on the ring color.
         - slow, infinite pulse while active (keyframes below).
       z-index: 15 — above the weapons iframe (10) and canvas (0), below the
       top-bar status overlay (20) and the loading spinner (200). The bezel
       is purely cosmetic; pointer-events: none lets clicks through. */

    :root {
      --bezel-frame: rgba(var(--rgb-science), 0.7);
      --bezel-glow-size: 4px;
      --bezel-pulse-intensity: 0.6;
      --bezel-red: var(--fire-hot);
      --bezel-inset: 0px;
    }

    #phone-bezel {
      position: fixed; inset: var(--bezel-inset);
      z-index: 15; pointer-events: none; display: block;
      border: 2px solid transparent;
      transition: border-color 0.5s ease-out, box-shadow 0.5s ease-out;
    }

    #phone-bezel.alert-on {
      border-color: var(--bezel-red);
      box-shadow: 0 0 var(--bezel-glow-size) calc(var(--bezel-glow-size) * 3) var(--bezel-frame);
      /* `infinite`, not `forwards`: the alert is a STATE, and the bezel is how
         the whole crew reads that state off each other's phones across a room.
         With no iteration count the pulse ran exactly once — about three
         seconds of alarm at the moment the captain raised it, and then a
         static red frame for the rest of the engagement. The keyframes were
         always written for a loop (the comment inside says "a steady slow
         pulsing loop"); only the iteration count was missing. */
      animation: bezel-pulse 2.8s ease-in-out infinite;
    }

    #phone-bezel.alert-on::after {
      /* Extra outer ring visible while the slow pulse continues so corners and edges look like an actual
         glowing frame without extra DOM nodes per edge/corner piece. */
      content: ''; position: absolute; inset: -2px;
      border: 1.5px solid rgba(var(--rgb-fire), var(--bezel-pulse-intensity));
      border-radius: inherit; pointer-events: none; opacity: 0.85;
    }

    @keyframes bezel-pulse {
       /* Initial fade-in up to peak intensity, then a steady slow pulsing loop. */
      0%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(var(--rgb-fire), 0.5); opacity: 1; }
     50%   { box-shadow: inset 0 0 8px var(--bezel-red), 0 0 16px calc(var(--bezel-glow-size) * 4) rgba(var(--rgb-fire), 0.9); border-color: var(--fire-hot); opacity: 0.95; }
    100%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(var(--rgb-fire), 0.5); opacity: 1; }
}

    /* Reduced motion: still the pulse, keep the alert.
       A looping red flash across the whole screen edge is exactly the kind of
       thing a player who asks for reduced motion is asking not to be given.
       The answer is to stop the ANIMATION, not to hide the STATE — so the
       bezel holds at the keyframe's peak: full red border and full glow,
       simply not moving. Someone reading the room still sees a ship at red
       alert.

       The global layer in gui/tokens.css (issue #1172) already collapses this
       loop's duration off BOTH the OS media query and the stamped
       `data-reduced-motion` attribute; this rule only holds the BRIGHTER frame.
       It is attribute-driven, not `@media`, so the tri-state resolves cleanly:
       it lands exactly when the profile stamps `reduce` (explicit ON, or OS
       reduce folded through the resolver) and steps aside for an explicit OFF.
       Its `data-reduced-motion` attribute plus the id/class outweigh the bare
       loop rule above, so it wins wherever it sits. */
    :root[data-reduced-motion="reduce"] #phone-bezel.alert-on {
      animation: none;
      border-color: var(--fire-hot);
      box-shadow: inset 0 0 8px var(--bezel-red),
                  0 0 16px calc(var(--bezel-glow-size) * 4) rgba(var(--rgb-fire), 0.9);
    }

     #phone-bezel[aria-hidden="true"] { display: none; }
    #coordination-popup {
      display: none;
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 180;
      background: var(--surface-panel-up);
      border: 1px solid var(--science);
      border-radius: 8px;
      padding: 12px 18px;
      max-width: 320px;
      color: var(--ink);
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-xl);
      box-shadow: 0 4px 20px rgba(var(--rgb-void), 0.6);
      cursor: pointer;
      user-select: none;
    }
    #coordination-popup .popup-sender {
      font-size: var(--text-lg);
      color: var(--sky);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #coordination-popup .popup-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    #coordination-popup .popup-body {
      font-size: var(--text-xl);
      color: var(--ink-dim);
    }

    /* -- Asset loading overlay (shown during Loading phase) ---------- */
    #asset-loading {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface-abyss);
      color: var(--sky);
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-lg);
      text-align: center;
      gap: 16px;
    }
    #asset-loading .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--surface-ridge);
      border-top-color: var(--sky);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #asset-loading .pct { font-size: var(--text-xl); font-weight: 600; }

    /* -- Game-over overlay (shown when GamePhase::GameOver) ---------- */
    #game-over-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 190;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(var(--rgb-void), 0.88);
      color: var(--ink);
      font-family: 'Chakra Petch', monospace;
      text-align: center;
      padding: 32px;
    }
    /* The frame, outermost first (PRD #1023 module 4): the scenario that just
       ended, the result it ended in, then the world's own closing prose. The
       accent is the only thing the outcome changes — the layout is identical
       for a win and a loss, so neither reads as the "special" ending. */
    #game-over-overlay .game-over-scenario {
      font-size: var(--text-md);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 10px;
    }
    #game-over-overlay .game-over-scenario:empty { display: none; }
    #game-over-overlay .game-over-headline {
      font-size: var(--text-display);
      font-weight: 700;
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--edge-strong);
    }
    #game-over-overlay[data-outcome="victory"] .game-over-headline {
      color: var(--loaded-bright); border-bottom-color: var(--loaded);
    }
    #game-over-overlay[data-outcome="defeat"] .game-over-headline {
      color: var(--fire-bright); border-bottom-color: var(--fire);
    }
    #game-over-overlay[data-outcome="ended"] .game-over-headline {
      color: var(--ink); border-bottom-color: var(--edge-strong);
    }
    #game-over-overlay .game-over-message {
      font-size: var(--text-lg);
      white-space: pre-wrap;
      line-height: 1.7;
      max-width: 64ch;
      letter-spacing: 0.03em;
    }
    #game-over-overlay .game-over-return-btn {
      margin-top: 32px;
      padding: 12px 32px;
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-lg);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink);
      background: rgba(var(--rgb-cyan), 0.12);
      border: 1px solid var(--ink-dim);
      border-radius: 2px;
      cursor: pointer; min-height: var(--control-hit-min);
    }

    /* -- Waiting-for-scenario overlay (shown after ReturnToLobby until host picks) */
    #waiting-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 185;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(var(--rgb-void), 0.92);
      color: var(--ink-dim);
      font-family: 'Chakra Petch', monospace;
      text-align: center;
      padding: 32px;
      font-size: var(--text-lg);
      letter-spacing: 0.06em;
    }
    #waiting-overlay .spinner-ring {
      display: inline-block;
      width: 32px; height: 32px;
      margin-bottom: 24px;
      border: 2px solid rgba(var(--rgb-cyan), 0.2);
      border-top-color: var(--ink-dim);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* QR-first scenario/ship picker overlay (issue #755). */
    #scenario-picker-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 186;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      background: rgba(var(--rgb-void), 0.94);
      color: var(--ink-dim);
      font-family: 'Chakra Petch', monospace;
      padding: 24px 18px;
      gap: 16px;
      overflow-y: auto;
    }
    #scenario-picker-heading {
      text-align: center;
      font-size: var(--text-xl);
      letter-spacing: 0.08em;
      color: var(--ink);
      text-transform: uppercase;
    }
    #scenario-picker-body { display: flex; flex-direction: column; gap: 12px; }
    #scenario-picker-body .scenario-btn {
      display: block; width: 100%;
      padding: 16px 18px;
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-lg); letter-spacing: 0.06em;
      color: var(--ink); text-align: left;
      background: rgba(var(--rgb-cyan), 0.1);
      border: 1px solid var(--edge-control); border-radius: 6px;
      cursor: pointer; min-height: var(--control-hit-min);
    }
    #scenario-picker-body .scenario-btn:active { background: rgba(var(--rgb-cyan), 0.22); }
    /* In-flight pick (PRD #1023 user story 16). The tapped button keeps its
       accent and gains a line saying the request is out; every other button
       recedes, because the arbiter will ignore a second request anyway and a
       picker that keeps taking taps it will not act on is what made the stage
       change feel arbitrary. */
    #scenario-picker-body .scenario-btn:disabled { opacity: 0.45; cursor: default; }
    #scenario-picker-body .scenario-btn.pending:disabled {
      opacity: 1; border-color: var(--signal); background: rgba(var(--rgb-cyan), 0.2);
    }
    #scenario-picker-body .scenario-pending {
      margin-top: 6px; font-size: var(--text-sm); color: var(--signal);
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
    }
    /* Another phone won the race. Stated, and naming what it chose, so the
       stage the player was moved to has a cause. */
    #scenario-picker-body .scenario-race-note {
      padding: 10px 14px; border-radius: 6px; text-align: center;
      font-size: var(--text-md); color: var(--ink);
      background: rgba(var(--rgb-gold), 0.14); border: 1px solid var(--gold);
      letter-spacing: 0.03em;
    }
    #scenario-picker-body .scenario-desc { font-size: var(--text-sm); color: var(--ink-dim); margin-top: 6px; letter-spacing: 0.02em; }
    #scenario-picker-body .scenario-locked-note { text-align: center; color: var(--ink-dim); font-size: var(--text-md); letter-spacing: 0.05em; }
    /* Mod-origin badge on a scenario button (issue #990): a base scenario gets
       none, a mod-supplied one wears the applied pack's name. */
    #scenario-picker-body .scenario-origin {
      display: inline-block; margin-top: 8px;
      padding: 2px 8px; border-radius: 4px;
      font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink); background: rgba(var(--rgb-cyan), 0.22);
      border: 1px solid var(--ink-faint);
    }

    /* -- "Mods active" lobby list (issue #990) --------------------------- */
    #lobby-mods[aria-hidden="true"] { display: none; }
    #lobby-mods {
      display: flex; flex-direction: column; gap: 3px;
      margin: 4px 0 2px;
      font-family: 'Chakra Petch', monospace;
    }
    #lobby-mods .mods-active-heading {
      font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    #lobby-mods .mods-active-row {
      font-size: var(--text-md); letter-spacing: 0.03em; color: var(--ink);
    }
    #lobby-mods .mods-active-version { color: var(--ink-dim); margin-left: 6px; }


    /* -- Lobby section: full-viewport when active ------------------------ */
    #lobby-ui.active {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      /* Top padding clears the settings cog (issue #940): `.settings-btn` is
         2rem square at a 0.5rem inset, so it reaches 40px down from the top
         and the lobby's first row — #lobby-header, holding #ship-name — has to
         start below that or the gear clips its first characters. Cleared on
         the top rather than the left so the header stays aligned with the
         station list beneath it; 4px of slack over the 40px the cog reaches.
         Pinned by tests/client/settings-panel.test.js. */
      padding: 44px 12px 6px;
      background: var(--surface-abyss);
      color: var(--ink);
      font-family: 'Chakra Petch', system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      pointer-events: auto;
    }
    /* -- Spectator summary surface (issue #1105) ------------------------- */
    #spectator-ui { display: none; }
    #spectator-ui.active {
      display: flex; flex-direction: column; gap: 12px;
      position: fixed; inset: 0; z-index: 6; overflow: auto;
      padding: 44px 12px 12px;
      background: var(--surface-abyss); color: var(--ink);
      font-family: 'Chakra Petch', system-ui, sans-serif;
    }
    #spectator-header { font-size: var(--text-lg); font-weight: 600; letter-spacing: .06em; }
    #spectator-alert { font-size: var(--text-md); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
    #spectator-alert[data-alert="red"] { color: var(--tactical-bright); font-weight: 700; }
    #spectator-hull { font-size: var(--text-sm); color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
    .spectator-section { display: flex; flex-direction: column; gap: 4px; }
    .spectator-heading { font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
    .spectator-station-row { display: flex; justify-content: space-between; font-size: var(--text-sm); }
    .spectator-station-health { color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
    .spectator-objective-row { font-size: var(--text-sm); }
    .spectator-objective-row.done { text-decoration: line-through; color: var(--ink-dim); }
    .spectator-objectives-empty { font-size: var(--text-xs); color: var(--ink-dim); }
    /* Claim-an-open-Station list (issue #1106). Rows reuse the lobby
       .station-row visuals (claim/ineligible buttons, inline reason); only the
       list container and the neutral stale-claim notice are scoped here. */
    #spectator-claims { display: flex; flex-direction: column; gap: 6px; }
    #spectator-claim-status:empty { display: none; }
    #spectator-claim-status { font-size: var(--text-sm); color: var(--ink-dim); }
    #spectator-claim-status[data-state="taken"] { color: var(--reloading); }
    .spectator-claims-empty { font-size: var(--text-xs); color: var(--ink-dim); }
    #spectate-btn { padding: 6px 14px; border-radius: 4px; background: var(--surface-panel-up);
      color: var(--ink); border: 1px solid var(--edge-strong); font-family: 'Chakra Petch', sans-serif;
      letter-spacing: .06em; }

    /* Ship header */
    #lobby-header { display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0 8px; border-bottom: 1px solid var(--edge); flex-shrink: 0; }
    #ship-info { display: flex; flex-direction: column; gap: 1px; }
    #ship-name { font-size: var(--text-lg); font-weight: 600; color: var(--ink); letter-spacing: .06em; }
    #ship-mission { font-size: var(--text-xs); color: var(--ink-faint); letter-spacing: .04em; }
    #crew-ready { display: flex; align-items: center; gap: 8px; }
    #crew-display { font-family: 'JetBrains Mono', monospace; font-size: var(--text-sm); color: var(--ink-faint); }
    #ready-pill { padding: 2px 10px; border-radius: 10px; font-size: var(--text-xs);
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      background: var(--reloading-deep); color: var(--reloading); border: 1px solid var(--reloading);
      transition: all .3s ease; }
    #ready-pill.go { background: var(--surface-panel-up); color: var(--signal); border-color: var(--signal);
      animation: pill-pulse 1.5s ease-in-out infinite; }
     @keyframes spin { to { transform: rotate(360deg); } }

     @keyframes pill-pulse {
        0%, 100%{ box-shadow: 0 0 4px rgba(var(--rgb-signal), 0.2); }
       50%      { box-shadow: 0 0 12px rgba(var(--rgb-signal), 0.5); }
    }

    /* Name input row */
    #lobby-name-row { flex-shrink: 0; padding: 6px 0 2px; }
    #lobby-name-row label { font-size: var(--text-sm); color: var(--ink-faint); margin: 0;
      display: flex; align-items: center; gap: 8px; }
    #lobby-name-row input { flex: 1; background: var(--surface-panel); color: var(--ink);
      border: 1px solid var(--edge); padding: 4px 8px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: var(--text-md);
      display: inline; width: auto; margin: 0; }
    /* Station list */
    #station-list { flex: 1; overflow-y: auto; padding: 8px 0; display: flex;
      flex-direction: column; gap: 6px; }
    .station-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 6px; background: var(--surface-panel); border: 1px solid var(--edge);
      transition: border-color .2s, background .2s; }
    .station-row.mine { border-color: var(--signal); background: var(--cyan-deep); }
    .station-row.taken { opacity: 0.7; }
    .station-row .glyph { width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--text-sm); font-weight: 700; flex-shrink: 0;
      background: var(--surface-panel-up); color: var(--ink-faint); border: 1px solid var(--edge); }
    .station-row.mine .glyph { border-color: var(--signal); color: var(--signal); }
    .station-row .info { flex: 1; min-width: 0; }
    .station-row .info .name { font-size: var(--text-md); font-weight: 600; }
    .station-row .info .meta { font-size: var(--text-xs); color: var(--ink-faint);
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .station-row .info .meta .cons { padding: 1px 5px; border-radius: 2px;
      background: var(--surface-panel-up); font-size: var(--text-xs); color: var(--ink-dim); }
    /* What the seat does, read before it is claimed (PRD #1023 module 4).
       --ink-dim rather than --ink-faint: this is copy meant to be read at
       arm's length, not a de-emphasised label. */
    .station-row .info .desc { font-size: var(--text-sm); color: var(--ink-dim);
      margin-top: 2px; line-height: 1.4; }
    .station-row .info .occupant { font-size: var(--text-sm); color: var(--signal); }
    .station-row .action { flex-shrink: 0; }
    .station-row .action button { padding: 4px 12px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: var(--text-sm);
      font-weight: 600; letter-spacing: .06em; cursor: pointer; border: 1px solid;
      transition: background .15s; display: block; width: auto; margin: 0; text-align: center; min-height: var(--control-hit-min); }
    .station-row .action .claim-btn { background: var(--surface-panel-up); color: var(--signal);
      border-color: var(--signal); }
    .station-row .action .claim-btn:hover { background: var(--cyan-dim); }
    .station-row .action .mine-btn { background: var(--cyan-deep); color: var(--signal);
      border-color: var(--signal); }
    .station-row .action .taken-btn { background: var(--surface-panel); color: var(--ink-faint);
      border-color: var(--edge); cursor: default; }
    /* A free seat blocked by this player's private accessibility profile
       (issue #1103 AC1). Muted like 'taken'; the functional reason sits inline
       under the station name and is local-only. */
    .station-row .action .ineligible-btn { background: var(--surface-panel); color: var(--ink-faint);
      border-color: var(--edge); cursor: not-allowed; }
    .station-row.ineligible { opacity: 0.75; }
    .station-row .info .ineligible-reason { font-size: var(--text-sm); color: var(--ink-dim);
      margin-top: 2px; line-height: 1.4; font-style: italic; }
    /* Detail panel */
    #detail-panel { flex-shrink: 0; border-top: 1px solid var(--edge);
      padding: 8px 0 4px; margin-top: 4px; transition: opacity .3s ease; }
    #detail-panel.idle { opacity: 0.4; }
    #detail-panel .detail-header { display: flex; align-items: center; justify-content: space-between; }
    #detail-panel .detail-station-name { font-size: var(--text-md); font-weight: 600; color: var(--ink-faint); }
    #detail-panel.active .detail-station-name { color: var(--signal); }
    #detail-panel .detail-station-desc:empty { display: none; }
    #detail-panel .detail-station-desc { font-size: var(--text-sm); color: var(--ink-dim);
      margin: 3px 0 0; line-height: 1.4; }
    #detail-panel .detail-consoles { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    #detail-panel .detail-consoles .chip { padding: 2px 8px; border-radius: 3px;
      font-size: var(--text-xs); background: var(--surface-panel-up); color: var(--ink-dim); border: 1px solid var(--edge);
      cursor: pointer; transition: background .15s, border-color .15s, color .15s; display: inline-flex; align-items: center; justify-content: center; min-height: var(--control-hit-min); }
    #detail-panel .detail-consoles .chip:hover { border-color: var(--signal); color: var(--signal); }
    #detail-panel .detail-consoles .chip.selected { background: var(--surface-panel-up);
      border-color: var(--signal); color: var(--signal); }
    #detail-panel .detail-ratings { display: flex; gap: 2px; margin: 4px 0; }
    #detail-panel .detail-ratings .rating-btn { padding: 2px 10px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: var(--text-xs);
      font-weight: 500; cursor: pointer; border: 1px solid var(--edge);
      background: var(--surface-panel); color: var(--ink-faint); display: block; width: auto; margin: 0;
      transition: background .15s, border-color .15s; min-height: var(--control-hit-min); }
    #detail-panel .detail-ratings .rating-btn.active { background: var(--surface-panel-up);
      border-color: var(--signal); color: var(--signal); }
    #detail-panel .detail-release-btn { padding: 2px 10px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: var(--text-xs);
      font-weight: 600; letter-spacing: .06em; cursor: pointer;
      border: 1px solid var(--fire-hot); background: transparent; color: var(--fire-hot);
      display: block; width: auto; margin: 0; flex-shrink: 0;
      transition: background .15s; min-height: var(--control-hit-min); }
    #detail-panel .detail-release-btn:hover { background: rgba(var(--rgb-fire), 0.1); }
    /* Lobby footer */
    #lobby-footer { flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 6px 0 4px;
      border-top: 1px solid var(--edge); margin-top: auto; }
    #status-line { font-size: var(--text-xs); color: var(--ink-faint); }
    #ready-btn { padding: 6px 16px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: var(--text-sm);
      font-weight: 700; letter-spacing: .12em; cursor: pointer;
      border: 1px solid var(--edge); background: var(--surface-panel); color: var(--ink-faint);
      transition: all .3s ease; display: none; width: auto; margin: 0; min-height: var(--control-hit-min); }
    #ready-btn.armed { display: block; background: var(--surface-panel-up);
      border-color: var(--signal); color: var(--signal); }
    #ready-btn.armed:hover { background: var(--cyan-dim); }
    #ready-btn.armed.glow { animation: ready-pulse 1s ease-in-out infinite; }
    @keyframes ready-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(var(--rgb-signal), 0.3); }
      50%       { box-shadow: 0 0 18px rgba(var(--rgb-signal), 0.7); }
    }
    #ready-btn:disabled { opacity: 0.4; cursor: default; animation: none !important; }

    /* ── Settings panel ──────────────────────────────────────────
       Gear button fixed at top-left, overlay modal centered.
       Mounted by gui/settings-panel.js.

       Top-left rather than the pre-#940 bottom-left: it mirrors the host
       page's cog, and bottom-left is already #status's corner.

       z-index 195, not 60. Issue #939 hit exactly this trap on the host page —
       a cog buried under full-viewport panels is unreachable in most of the
       states you want it in. On this page those panels are #coordination-popup
       (180), #waiting-overlay (185), #scenario-picker-overlay (186) and
       #game-over-overlay (190), so the gear has to clear all four. It stays
       BELOW #asset-loading (200), which is a genuine "nothing is ready yet"
       screen. The overlay it opens is 1000, above everything. */
    .settings-btn {
      position: fixed;
      top: 0.5rem;
      left: 0.5rem;
      z-index: 195;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-lg);
      line-height: 1;
      color: var(--ink-faint);
      background: rgba(var(--rgb-panel), 0.7);
      border: 1px solid var(--edge);
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      padding: 0; min-height: var(--control-hit-min);
    }
    .settings-btn:hover { color: var(--ink); border-color: var(--loaded); }
    .settings-btn:active { background: rgba(var(--rgb-panel-up), 0.85); }
    .settings-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(var(--rgb-deep), 0.88);
      cursor: pointer;
    }
    .settings-overlay[hidden] { display: none; }
    .settings-overlay .settings-popup {
      cursor: auto;
      background: var(--surface-panel);
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      min-width: 260px;
      max-width: 340px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    /* The client has two documentation tabs in addition to the host's controls. */
    .settings-tabs {
      display: flex; gap: 0.3rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--edge);
      padding-bottom: 0.5rem;
    }
    .settings-tab {
      display: block; width: auto; margin: 0; flex: 1;
      padding: 0.35rem 0.4rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      text-align: center;
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-tab.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .settings-body {
      display: flex; flex-direction: column; gap: 1rem;
      max-height: 60vh; overflow-y: auto;
    }
    .settings-documentation { display: flex; flex-direction: column; gap: 0.7rem; }
    .station-help-group { display: flex; flex-direction: column; gap: 0.65rem; }
    .station-help-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.12em;
      color: var(--signal); text-transform: uppercase;
    }
    .station-help-sections { display: flex; flex-direction: column; gap: 0.65rem; }
    .station-help-section-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.08em; color: var(--ink);
    }
    .station-help-section-body {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); line-height: 1.45; color: var(--ink-faint); margin-top: 0.15rem;
    }
    .settings-section { display: flex; flex-direction: column; gap: 0.4rem; }
    .settings-section-hint {
      font-size: var(--text-sm); color: var(--ink-faint); line-height: 1.35;
    }
    .settings-section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--signal);
      text-transform: uppercase;
    }
    .settings-rating-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .settings-rating-btn {
      display: block; width: auto; margin: 0;
      padding: 0.35rem 0.7rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-rating-btn.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .settings-rating-btn:active { background: var(--cyan-dim); }
    .settings-vol-row {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .settings-vol-row input[type="range"] {
      flex: 1; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: var(--edge); border-radius: 2px;
      outline: none; margin: 0;
    }
    .settings-vol-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 1rem; height: 1rem; border-radius: 50%;
      background: var(--signal); cursor: pointer; border: none;
    }
    .settings-vol-row input[type="range"]::-moz-range-thumb {
      width: 1rem; height: 1rem; border-radius: 50%;
      background: var(--signal); cursor: pointer; border: none;
    }
    .settings-vol-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); color: var(--ink-faint);
      min-width: 2.5rem; text-align: right;
    }
    .settings-action-btn {
      display: block; width: 100%; margin: 0;
      padding: 0.5rem 0.75rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink);
      text-align: center;
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-action-btn:active { background: var(--cyan-dim); }
    .settings-leave-btn {
      border-color: var(--fire-hot); color: var(--fire-hot);
    }
    .settings-leave-btn:active { background: rgba(var(--rgb-fire), 0.1); }

    /* ── Ship manual content in the Settings menu ──────────────── */
    .manual-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .manual-tab {
      padding: 0.3rem 0.6rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-xs); font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .manual-tab.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .manual-panel-host { overflow-y: auto; }
    .manual-station-panel { display: flex; flex-direction: column; gap: 0.7rem; }
    .manual-overview {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); line-height: 1.5; color: var(--ink);
      white-space: pre-wrap;
    }
    .manual-section {
      display: flex; flex-direction: column; gap: 0.25rem;
      border-top: 1px solid var(--edge); padding-top: 0.5rem;
    }
    .manual-section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--signal);
    }
    .manual-metric {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); color: var(--ink-faint);
    }
    .manual-automation-heading {
      margin-top: 0.35rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-xs); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    .manual-automation-row {
      display: flex; gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-xs); color: var(--ink-faint);
    }
    .manual-rating-name { color: var(--signal); min-width: 5rem; }
    .manual-rating-systems { flex: 1; word-break: break-word; }

    /* ── Reduced motion, continued ──────────────────────────────
       These loops hold a BRIGHTER frame than their base while the global layer
       in gui/tokens.css (issue #1172) collapses the motion off both the OS
       media query and the stamped `data-reduced-motion` attribute.

       Attribute-driven, matching the bezel above: they land when the profile
       stamps `reduce` and step aside for an explicit OFF, so the tri-state
       resolves both ways. And an attribute selector adds specificity where a
       bare `@media` override did not: `@media (prefers-reduced-motion)
       { #ready-pill.go { animation: none } }` weighs exactly as much as the
       `#ready-pill.go` that starts the pulse, so it had to be written LATER to
       win — the reason these once lived last in the file. The
       `:root[data-reduced-motion="reduce"]` prefix outweighs the loop rule
       outright, so they now win wherever they sit. */
    /* The two spinners. A spinner says "still working", and a ring with one
       arc in a different colour still reads as a progress indicator that has
       stopped moving — which is honest, because the work IS proceeding.
       Removing it would leave a blank panel reading as broken, which is a
       defect this same PRD fixes elsewhere. */
    :root[data-reduced-motion="reduce"] #asset-loading .spinner-ring,
    :root[data-reduced-motion="reduce"] #waiting-overlay .spinner-ring {
      animation: none;
    }
    /* The two "you are good to go" glows, held at the peak of their own pulse
       so the ready state is still the brightest thing in the footer. */
    :root[data-reduced-motion="reduce"] #ready-pill.go {
      animation: none;
      box-shadow: 0 0 12px rgba(var(--rgb-signal), 0.5);
    }
    :root[data-reduced-motion="reduce"] #ready-btn.armed.glow {
      animation: none;
      box-shadow: 0 0 18px rgba(var(--rgb-signal), 0.7);
    }
  </style>
</head>
<body>
  <!-- UI click sound (played from JS). -->
  <audio id="ui-click" src="assets/sounds/ui_click.ogg"></audio>

  <!-- This is a pure-JS console (issue #463): no client-side WASM. The page
       and its assets are shipped to dist/client/ by scripts/build-client.mjs
       (npm run build:client) — a plain file copy, NOT a Trunk build, because
       Trunk would implicitly compile the crate's default (server) lib into a
       WASM bundle and inject a loader even with no `rel="rust"` link.
       All client state lives in the gui/*.js modules loaded in <head>. -->

  <!-- Console container: full-screen flex layout host for all in-game
       console sections. [data-orientation] drives portrait (column) vs
       landscape (row) styling in console CSS; set by render() on each paint. -->
  <div id="console-container" data-orientation="portrait">

    <section id="lobby-ui">
      <!-- Ship header -->
      <div id="lobby-header">
        <div id="ship-info">
          <div id="ship-name" data-i18n="client.default_ship_name">Phoenix</div>
          <div id="ship-mission" data-i18n="client.standing_by">Standing by</div>
        </div>
        <div id="crew-ready">
          <span id="crew-display">0/0</span>
          <span id="ready-pill" data-i18n="client.pill_connecting">CONNECTING</span>
        </div>
      </div>

      <!-- Active mod packs the host applied (issue #990). Populated by
           renderActiveMods() from lobbyState.activePacks; empty (and hidden)
           when no packs are applied, so nothing extra renders in the base game. -->
      <div id="lobby-mods" aria-hidden="true"></div>

      <!-- Name input -->
      <div id="lobby-name-row">
        <label><span data-i18n="client.name_label">Name</span>
          <input id="name-input" type="text" placeholder="Your name" data-i18n-attr="placeholder:client.name_placeholder" autocomplete="off" />
        </label>
      </div>

      <!-- Station list -->
      <div id="station-list"></div>

      <!-- At-your-station detail panel -->
      <div id="detail-panel" class="idle">
        <div class="detail-header">
          <span class="detail-station-name" data-i18n="client.no_station">No station assigned</span>
        </div>
        <div class="detail-station-desc"></div>
        <div id="detail-console-area">
          <div class="detail-consoles"></div>
          <div class="detail-ratings"></div>
        </div>
      </div>

      <!-- Footer -->
      <div id="lobby-footer">
        <span id="status-line" data-i18n="client.connecting_host">Connecting to host…</span>
        <!-- Spectate toggle (issue #1105): opt out of a station into the
             explicit Spectator role, or (when spectating) opt back into the
             crew. Label + handler are set by renderLobby from the view model. -->
        <button id="spectate-btn" data-i18n="client.spectator.spectate" style="display:none">Spectate</button>
        <button id="ready-btn" data-i18n="client.ready">READY</button>
      </div>
    </section>

    <!-- Spectator summary surface (issue #1105): the one crew-public read-only
         view a Spectator sees during an in-progress mission, instead of the
         station-select lobby. It shows only Audience::All crew-public data —
         objectives, red-alert, ship-wide hull, per-Station health — never any
         per-station private feed (a seatless client never receives one). -->
    <section id="spectator-ui" aria-hidden="true">
      <div id="spectator-header" data-i18n="client.spectator.title">Spectating</div>
      <div id="spectator-alert" role="status" aria-live="polite"></div>
      <div id="spectator-hull" role="status" aria-live="polite"></div>
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.stations_heading">Crew stations</div>
        <div id="spectator-stations"></div>
      </div>
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.objectives_heading">Objectives</div>
        <div id="spectator-objectives"></div>
      </div>
      <!-- Claim an open Station (issue #1106): a Spectator may enter play by
           taking any currently-open seat it is eligible for, through the SAME
           authoritative SelectStation path an ordinary lobby claim uses. Only
           OPEN∩ELIGIBLE seats offer a live button; an ineligible open seat is
           shown disabled with a private reason; a lost race / stale seat leaves
           the participant here with a neutral notice. -->
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.claim_heading">Open stations</div>
        <div id="spectator-claim-status" role="status" aria-live="polite"></div>
        <div id="spectator-claims"></div>
      </div>
    </section>

    <nav id="station-hero" aria-hidden="true" aria-label="" data-i18n-attr="aria-label:client.hero.label">
      <div id="station-hero-tabs" role="tablist"></div>
      <div id="station-hero-details">
        <div id="station-hero-title"></div>
        <div id="station-hero-rating"></div>
        <div id="station-hero-ai" role="status" aria-live="polite"></div>
      </div>
    </nav>

    <!-- Console sections are mounted dynamically by mountConsoles() when a
         Welcome message arrives with ship_stations. Each section is created
         with the same id/iframe-id conventions as the static originals
         (e.g. #captain-ui / #captain-iframe) so all downstream $() references
         continue to resolve. -->
  </div>

  <div id="status" data-i18n="client.connecting">Connecting…</div>
  <div id="conn-diag"></div>

  <div id="top-bar">
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="retry-now-btn" title="Retry connection now" data-i18n="client.retry_now" data-i18n-attr="title:client.retry_now_tip">Retry now</button>
    <button id="fullscreen-btn" title="Toggle fullscreen" data-i18n-attr="title:client.fullscreen_tip">⛶</button>
  </div>

  <!-- Asset loading overlay: shown during GamePhase::Loading while the
       server pre-caches GLB models, radar icons, and rig sidecars. -->
  <div id="asset-loading">
    <div class="spinner-ring"></div>
    <span><span data-i18n="client.preparing_scenario">Preparing scenario&hellip;</span> <span class="pct" id="asset-loading-pct">0</span>%</span>
  </div>

  <!-- Game-over overlay: shown when GamePhase::GameOver. Displays either
       "Ship Destroyed" (hull death) or the scenario's game_over message. -->
  <div id="game-over-overlay">
    <div class="game-over-scenario" id="game-over-scenario"></div>
    <div class="game-over-headline" id="game-over-headline"></div>
    <div class="game-over-message" id="game-over-message"></div>
    <button id="return-to-lobby-btn" class="game-over-return-btn" data-i18n="client.return_to_lobby">Return to Lobby</button>
  </div>

  <!-- Link banner (PRD #1023 module 4): says out loud what the dimmed console
       behind it means — either the host is gone, or its first state has not
       landed yet. Hidden whenever the link is live. -->
  <div id="link-banner" aria-hidden="true" role="status">
    <div class="link-banner-title"></div>
    <div class="link-banner-detail"></div>
  </div>

  <!-- Waiting-for-scenario overlay: shown after ReturnToLobby while the
       host picks a scenario from the server's scenario-selection panel. -->
  <div id="waiting-overlay">
    <div class="spinner-ring"></div>
    <span data-i18n="client.waiting_scenario">Waiting for host to select a scenario&hellip;</span>
  </div>

  <!-- QR-first scenario/ship picker overlay (issue #755): before any world is
       loaded, the host broadcasts the pre-load catalog and any connected phone
       can make the first valid selection (first-valid-wins, no voting). -->
  <div id="scenario-picker-overlay">
    <div id="scenario-picker-heading" data-i18n="client.select_scenario">Select a scenario</div>
    <div id="scenario-picker-body"></div>
  </div>

  <!-- Top-centre coordination popup overlay (issue #494). Shown for AI-to-human
       coordination messages. Click-to-dismiss, auto-dismiss after 8s. -->
  <div id="coordination-popup" onclick="dismissCoordinationPopup()">
    <div class="popup-sender"><span id="popup-from"></span><span id="popup-arrow"></span><span id="popup-to"></span><span id="popup-colon"></span></div>
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>

  <!-- Phone bezel frame (issue #439). CSS-only red alert glow; no images.
       The .alert-on class drives the keyframe animation (see <style>).
       Hidden by default; render() flips aria-hidden once in-game. -->
  <div id="phone-bezel" aria-hidden="true"></div>



  <script type="module">
    // Localisation bridge: the big inline script below is a classic script,
    // so it cannot import gui/strings.js. Publish the API on window and
    // substitute the static data-i18n markup once the table is loaded.
    import './gui/strings-boot.js';
    import { t, has, applyToDom, wireText } from './gui/strings.js';
    window.phStrings = { t, has, applyToDom, wireText };
    applyToDom(document);
  </script>

  <!-- Page chrome (issue #1227): connection-status dot, Screen Wake Lock,
       fullscreen toggle, and the mechanical half of the #conn-diag
       renderer — gui/page-chrome.js is the single source server.html and
       client.html both used to carry as verbatim copies. The classic
       script below can't `import` a module directly; early calls made
       before this island has mounted go through the
       window.__pageChromeReady queue defined near that script's own
       #1227 bridge block. -->
  <script type="module">
    import { mountPageChrome } from './gui/page-chrome.js';
    import { t } from './gui/strings.js';
    const chrome = mountPageChrome({
      doc: document,
      t,
      statusColors: { active: 'var(--loaded)', trouble: 'var(--fire-hot)' },
      statusLabels: { disconnected: 'client.reconnecting', error: 'client.conn_error' },
    });
    window.__pageChromeReady(chrome);
  </script>

  <script>
    // Resolve a string id via the module bridge. Safe before modules load —
    // falls back to the raw id, and every call site re-resolves on render.
    function t(id, params) {
      return window.phStrings ? window.phStrings.t(id, params) : id;
    }

    // Resolve a value that MAY be a string id, via the same module bridge —
    // gui/strings.js's wireText() encodes the has(value) ? t(value) : fallback
    // rule once; this just forwards to it (or reproduces its default before the
    // module bridge has mounted, same shape as `t` above).
    function wireText(value, fallback) {
      if (window.phStrings) return window.phStrings.wireText(value, fallback);
      if (fallback !== undefined) return fallback;
      return value === null || value === undefined ? '' : String(value);
    }

    // ── Page chrome bridge (issue #1227) ────────────────────────────────────
    // The status dot/label/retry-button, the Screen Wake Lock and the
    // fullscreen toggle now live in gui/page-chrome.js (shared with
    // server.html). This classic script can't `import` a module directly
    // (this page's bulk logic is a classic script too, despite the
    // `type="module"` islands elsewhere on it), so calls made before the
    // page-chrome island below has mounted — setConnectionStatus('connecting')
    // runs synchronously at the bottom of this same script, well before any
    // deferred module — are queued and replayed in order once it calls
    // window.__pageChromeReady(chrome). Same shape as server.html's #1227
    // bridge (itself modelled on the #1224 host-channel queue).
    window.__pageChromeQueue = [];
    let _pageChrome = null;
    function chromeSetConnectionStatus(state) {
      if (_pageChrome) _pageChrome.setConnectionStatus(state);
      else window.__pageChromeQueue.push(['setConnectionStatus', state]);
    }
    function acquireWakeLock() {
      if (_pageChrome) return _pageChrome.acquireWakeLock();
      window.__pageChromeQueue.push(['acquireWakeLock', undefined]);
    }
    function releaseWakeLock() {
      if (_pageChrome) _pageChrome.releaseWakeLock();
      else window.__pageChromeQueue.push(['releaseWakeLock', undefined]);
    }
    window.__pageChromeReady = function(chrome) {
      _pageChrome = chrome;
      window.__pageChromeQueue.splice(0).forEach(function(c) { chrome[c[0]](c[1]); });
    };

    // Station names in ShipStations are lookup identifiers; display them via
    // the derived station.<id>.name string when the table has one.
    function stationLabel(st) {
      if (!st) return '';
      return wireText('station.' + st.id + '.name', st.name || st.id || '');
    }
    // What a station DOES, shown on its lobby row before the claim tap (PRD
    // #1023 module 4). The copy is already authored per hull as
    // `entity.<hull>.station.<id>.description` and rides the wire in
    // StationDef.description — this reuses those ids rather than minting a
    // second, diverging set. A phone's copy came through localiseTree and is
    // already resolved text; a mod pack's literal prose never was an id —
    // wireText() substitutes only what the table actually holds.
    function stationDescription(st) {
      return st ? wireText(st.description, '') : '';
    }

    // -- Click sound --------------------------------------------------------
    // Message types that should NOT trigger a click (continuous / connection
    // setup messages that are not the result of a deliberate button press).
    // `ReportConsoleLatency` (issue #1169) belongs here for a reason sharper than
    // "not a button press": it is a diagnostic report sent WHILE latency is being
    // measured, so a click on it would put an audio decode on the very path whose
    // timing is the subject.
    const NO_CLICK = new Set(['SetThrust', 'SetSteering', 'LateralThrustInput', 'Identify', 'SetName', 'ReportStationEligibility', 'ReportConsoleLatency']);

    const CLICK_PITCH_VARIANCE = 0.08; // +/- 8% playback-rate jitter so repeated clicks don't sound identical

    function playClick() {
      const el = document.getElementById('ui-click');
      if (!el) return;
      el.currentTime = 0;
      // preservesPitch defaults to true in modern browsers, which normalizes
      // pitch back out of playbackRate changes — disable it so the rate
      // jitter below actually varies the pitch.
      el.preservesPitch = false;
      el.webkitPreservesPitch = false;
      el.mozPreservesPitch = false;
      el.playbackRate = 1 + (Math.random() * 2 - 1) * CLICK_PITCH_VARIANCE;
      el.play().catch(() => {});
    }

    // -- Connection status --------------------------------------------------

    /// The connection-manager status verbatim, and whether the host has said
    /// anything at all since the link came up. Together they decide whether a
    /// console is live, still loading, or dead (gui/link-state.js).
    let linkStatus = 'connecting';
    let linkHasData = false;

    /// Dim + disable the console, or mark it as still loading, per
    /// gui/link-state.js. Game shell only: in the lobby the status line and
    /// the ready pill already carry this, and dimming the roster the player is
    /// trying to claim from would be worse than useless.
    function renderLinkState(inGame) {
      const container = document.getElementById('console-container');
      const banner = document.getElementById('link-banner');
      if (!container || typeof window.linkView !== 'function') return;
      const lv = window.linkView(linkStatus, linkHasData);
      const mode = inGame ? lv.mode : 'live';
      container.dataset.link = mode;
      // aria-disabled rather than the disabled attribute: the controls live
      // inside console iframes and shadow roots this page does not own, so the
      // container's own pointer-events is what actually stops the taps.
      container.setAttribute('aria-disabled', (inGame && lv.disable) ? 'true' : 'false');
      if (banner) {
        const showBanner = inGame && lv.bannerId;
        banner.setAttribute('aria-hidden', showBanner ? 'false' : 'true');
        banner.dataset.mode = mode;
        if (showBanner) {
          const title = banner.querySelector('.link-banner-title');
          const detail = banner.querySelector('.link-banner-detail');
          if (title) title.textContent = t(lv.mode === 'dead' ? 'client.link_dead' : 'client.link_connecting');
          // The dead case says BOTH that the link is gone and what the client
          // is doing about it; connecting has nothing to add to its own title.
          if (detail) detail.textContent = lv.mode === 'dead' ? t(lv.bannerId) : '';
        }
      }
    }

    // Status dot/label/retry-button, the Screen Wake Lock and the
    // fullscreen toggle now live in gui/page-chrome.js (issue #1227),
    // shared with server.html. chromeSetConnectionStatus/acquireWakeLock/
    // releaseWakeLock (defined near the top of this script, by the
    // window.__pageChromeReady bridge) are this script's calls into it.
    // setConnectionStatus keeps the link-state bookkeeping that is genuinely
    // this page's own concern — page-chrome has no notion of "has the
    // console rendered live data yet".
    function setConnectionStatus(state) {
      linkStatus = state;
      // A link that dropped has to re-earn "has data": whatever the console is
      // showing when it comes back is from before the gap, so the console goes
      // back through CONNECTING rather than straight to live with stale
      // numbers on it (PRD #1023 user story 15).
      //
      // No scheduleRender() here, deliberately: this runs once at boot, ABOVE
      // the scheduler's own `let _renderFrame`, and touching it from here put
      // the whole inline script in a temporal dead zone. The onStatus callback
      // that drives every LATER transition repaints instead.
      if (state !== 'ready') linkHasData = false;
      chromeSetConnectionStatus(state);
    }

    // -- Return to Lobby (GameOver overlay button) ---------------------------
    (function initReturnToLobby() {
      const btn = document.getElementById('return-to-lobby-btn');
      if (!btn) return;
      btn.addEventListener('click', () => send('ReturnToLobby'));
    })();

    setConnectionStatus('connecting');

    // -- Retry-now control (issue #614) --------------------------------------
    // Visible only while disconnected/retrying (see setConnectionStatus).
    // Bypasses the connection manager's current backoff wait and attempts a
    // reconnect immediately.
    (function initRetryNow() {
      const btn = document.getElementById('retry-now-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (window.connectionManager && typeof window.connectionManager.retryNow === 'function') {
          window.connectionManager.retryNow();
        }
      });
    })();

    // -- Persistence ---------------------------------------------

    const NAMES = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return NAMES[Math.floor(Math.random() * NAMES.length)];
    }

    // Session identity is resolved per-tab by gui/session-token.js
    // (installSessionToken) just before we Identify — see the connection block
    // below. It is not resolved here because that module is deferred and has
    // not executed yet at parse time. Resolving per-tab (sessionStorage) rather
    // than per-origin (localStorage) is what lets several console tabs run on
    // one desktop without colliding on a single shared token.
    let myToken = null;

    // Display name is per-tab (sessionStorage), not per-origin (localStorage):
    // several clients on one desktop must not all default to the same name, or
    // they look like one another in the lobby. Falls back to a fresh random
    // name per tab. (Identity is the token, not the name — see myToken.)
    let myName = sessionStorage.getItem('player-name') || randomName();
    sessionStorage.setItem('player-name', myName);

    // -- State ---------------------------------------------------

    // Lobby / lifecycle mirror ONLY (players, phase, station roster, game-over
    // flags). All SIM state lives exclusively in window.simState
    // (gui/sim-state.js) — the console builders read it directly, so do NOT
    // add sim-derived fields here (issue #819 deleted the old hand-maintained
    // mirror and the flat blackboard scalars).
    const uiState = { players: [], phase: 'Lobby',
      shipStations: { stations: [] },
      stations: [], maxPlayers: 0, allFilled: false, allReady: false, countdownSecs: 0,
      shipDestroyed: false, gameOverReason: null };

    /// Currently-active console during InProgress. One human = one station
    /// (issue #827): derived by render() as mine[0] || null via
    /// reconcileActiveConsole — null for spectators and in the lobby.
    let activeConsole = null;

    /// Last red-alert value applied to the phone bezel, so the class toggle
    /// only runs when the captain blackboard's flag actually changes.
    /// (The flag itself lives in window.simState.redAlert — issue #819.)
    let bezelAlertOn = false;

    /// Console selected in the lobby detail panel. Null until the player picks one.
    /// Resets when the player releases their station.
    let lobbyConsole = null;
    /// The mounted settings panel (issue #940), or null before the connection
    /// bootstrap runs. handleMessage repaints it when `DebugState` arrives.
    let settingsPanel = null;
    let pendingMidGameClaim = false;
    // #771 AC3: a mid-round station release is a two-step arm→confirm (imitates
    // ph-comms-current-message). First click arms + swaps the button to a
    // confirm string; second click sends ReleaseStation. In-progress only —
    // lobby release stays immediate. Reset whenever we leave InProgress.
    let releaseArmed = false;
    // #1106: the station id a Spectator last tapped "claim" on. A lost race /
    // stale seat is a silent server no-op (no self-addressed message), so the
    // client watches this seat: when it reappears as taken, we show a neutral
    // "that seat was taken" line and keep the participant on the spectator
    // surface. Cleared whenever we are no longer spectating.
    let pendingSpectatorClaim = null;

    // Single source of truth for changing the active console. Called only by
    // the render() reconciler now that the tab bar and swipe gesture are gone
    // (issue #827). No-op if the value is already current. Delegates the
    // null/undefined/"" ? next sentinel mapping to gui/lobby-state.js
    // (nextActiveConsole) so the contract is locked by Vitest.
    function setActiveConsole(name) {
      const step = (typeof window.nextActiveConsole === 'function')
        ? window.nextActiveConsole(activeConsole, name)
        : { changed: (name || null) !== activeConsole, next: name || null };
      if (!step.changed) return;
      activeConsole = step.next;
    }

    // -- Helpers -------------------------------------------------

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function playerStation(s) {
      const m = me(s);
      if (!m) return null;
      return typeof m.station === 'string' ? m.station
        : (m.station && typeof m.station.id === 'string' ? m.station.id : null);
    }
    function myConsoles(s) {
      // Post issue #619 a player owns exactly one station id (or none).
      // Callers that historically wanted a "consoles" list (for the tab bar)
      // treat this as a one-element list.
      const sid = playerStation(s);
      return sid ? [sid] : [];
    }

    /// True while the lobby/station-select panel is being shown over an
    /// in-progress game: true spectators, and mid-game claimants who have
    /// picked a station but not yet pressed Ready. Single source of truth for
    /// render()'s vis.lobby override and the SimState/BlackboardUpdate
    /// render guards below — those messages arrive at ~10Hz and must skip the
    /// lobby DOM rebuild in this state, or a click on Ready/Leave can land
    /// between the old button being torn down and the new one's listener
    /// being attached.
    function showingLobbyDuringGame(s) {
      if (s.phase !== 'InProgress') return false;
      const player = me(s);
      // An explicit Spectator (issue #1105) renders the crew-public summary
      // surface, never the station-select lobby — and its read-only surface
      // must re-paint live on each SimState, so it is excluded from this
      // "skip the lobby rebuild" guard.
      if (player && player.spectator) return false;
      return pendingMidGameClaim || !playerStation(s) || !!(player && !player.ready);
    }
    // Explicit Spectator role during an in-progress mission (issue #1105).
    function spectatingInGame(s) {
      return s.phase === 'InProgress' && !!(me(s) && me(s).spectator);
    }
    function isCaptain(s)     { return playerStation(s) === 'captain'; }
    function isHelm(s)        { return playerStation(s) === 'helm'; }

    function send(type, data) {
      if (!window.connectionManager || !window.connectionManager.connected) return;
      const clickType = (type === 'ControlSystem' && data && data.payload) ? data.payload.type : type;
      if (!NO_CLICK.has(clickType)) playClick();
      // Client messages (commands, lobby actions) are always reliable
      window.connectionManager.send(type, data, 'reliable');
    }

    function setStatus(text) { $('status').textContent = text; }

    // -- Phone bezel red-alert toggle (issue #439) -------------------------
    // Toggles the .alert-on class on #phone-bezel; CSS keyframes drive the
    // red glow pulse (no PNG swaps needed with the CSS-only implementation).
    function applyBezelAlert(alert) {
      const root = $('phone-bezel');
      if (root) root.classList.toggle('alert-on', !!alert);
    }



    // Console/station display label via the string table (issue #827): the
    // tab-bar CONSOLE_LABEL map is gone; station.<id>.name is the single
    // source. Falls back to the raw id before the string table loads so the
    // first paint never blanks out.
    function consoleLabel(name) {
      if (!name) return '';
      return wireText('station.' + name + '.name', name);
    }

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(uiState);
      });
    }
    // Expose so gui/device-orientation.js can coalesce its resize-driven
    // re-render through the same rAF scheduler (issue #462).
    window.scheduleRender = scheduleRender;

    // QR-first scenario/ship picker rendering (issue #755). Keyed on the

  - component: repair-visibility-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Repair Visibility Publisher
      summary: Host publisher that derives the different damage views for Engineering and owning stations.
      rationale:
        - Aggregate hull, core detail, owner-local detail, and on-site team detail are different information surfaces.
        - Team arrival is an information gate for non-core engineering detail.
        - >-
          Issue #737: the four views must be decided on the host. Before it, the
          publisher's paths spanned host AND client and every connected client
          received exact per-system detail for the whole ship at `Target::All`,
          so the separation was presentation-only and the hidden rows were
          already on every phone. The entity is now host-only.
        - >-
          One projection serves both the live broadcast and the reconnect
          resync, so reconnecting cannot be used to obtain withheld detail.
          The Repair owner registers the Hull cache reset and reconnect
          projector under the stable `hull` lifecycle key; the generic runner
          knows neither LastBroadcastHull nor SystemHullUpdate and targets the
          returned Snapshot only to the reconnecting session.
        - >-
          The boundary needs two gates, not one. Filtering `system_hull` alone
          left `RepairBlackboard.queue_depth` — every *damaged* system's exact
          tier and HP deficit — and `teams` — each team's destination system —
          riding through a `..bb.clone()` spread to every connected token, which
          made the row filter cosmetic in exactly the case that matters. The
          repair blackboard is now (1) sent only to the Engineering holder, and
          (2) projected field by field with no struct-update spread, so a newly
          added field cannot silently ride through unprojected.
        - >-
          [ai] Restricting the audience is safe because nothing but the Engineering
          console reads this payload: `buildRepairConsoleState` is reached only
          from a station that owns the `repair` system (battleship `repair`,
          cruiser/destroyer `engineering`, courier `captain`). A viewer who is
          not entitled receives an *empty* blackboard rather than no message, so
          a player who has just moved off Engineering cannot keep a stale copy.
    architecture:
      kind: adapter
      authority: authoritative
      reads:
        - authoritative-damage-state
        - repair-team-state
      produces:
        - engineering-aggregate-hull-state
        - engineering-destroyed-capability-state
        - core-damage-detail-state
        - station-owner-local-damage-state
        - onsite-repair-detail-state
      depends_on:
        # The projection pushes finished per-token payloads straight into the
        # broadcaster's outbox: there is no per-recipient fan-out primitive in
        # the `SimBroadcaster` Audience model, which resolves one producer to
        # one Target.
        - host-state-broadcaster
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      # `src/console/repair/server.rs` is genuinely part of this entity's
      # surface — `publish_repair_blackboard` constructs the unprojected
      # blackboard, `queue_depth` included. It is deliberately NOT listed: five
      # other entities already claim that file (repair-team-cycle-policy,
      # authoritative-damage-state, host-repair-team-state, repair-team-state,
      # and the NPC-AI console router), so it is already multi-owned and
      # dropped from attribution. Adding a sixth claim would not restore
      # attribution, only obscure the ownership. The projection seam this entity
      # is actually observed at is `visibility.rs`, which owns the decision.
      paths:
        - src/console/repair/visibility.rs
      symbols:
        - HullVisibility
        - LastBroadcastHull
        - push_hull_updates
        - project_repair_blackboards
        - hull_update_for_token
        - register_hull_replication_lifecycle
        - ReplicationLifecycleAdapter

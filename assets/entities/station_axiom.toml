name = "entity.station_axiom.name"
tags = [ "station", "comms_contact", "allied" ]

# The Federation (issue #936). This station is tagged `allied` in every world
# that fields it, and until now it belonged to nobody: a factionless entity is
# never `hostile` to anything and never `friendly` to anything either, so
# "Starbase Alpha" in `assets/worlds/combat_test.toml` was a defence objective
# the defenders had no relationship with. Authoring the faction here rather than
# as a per-world override is deliberate — an allied station is allied in all
# three worlds that spawn it (`combat_test`, `default`, `before_the_fire`), and
# the Harrow are neutral to the Federation in the other two, so nothing outside
# the combat scenario changes hostility as a result.
#
# It does NOT, by itself, make the station auto-acquirable as an enemy target:
# `ai_target_selection` reads faction off the `With<Ship>` scan surface, so a
# station is never the "nearest hostile". A raider reaches it through a named
# `Destroy` directive, which is what combat_test's `assault-starbase` override
# authors.
faction = "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa"

[target]
tags = [ "station" ]
threat_level = "none"
description = "entity.station_axiom.target.description"

[hull]
hull_integrity = 800

[collider]
shape = "Ball"
radius = 12
length = 0

[radar_appearance]
colour = [ 0.3, 0.8, 0.6 ]
size = 18
icon = "station"

[mesh]
model = "assets/models/alliance_starbase.glb"
shape = "torus"
radius = 18
minor_radius = 4.5
colour = [ 0.3, 0.8, 0.6 ]

[comms]
range = 800

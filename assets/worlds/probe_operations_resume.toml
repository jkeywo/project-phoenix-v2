# Snapshot fixture for issue #1027 — a slowed hold and a moved capacity.
#
# This is the operations-bearing resume fixture carved out of the retired
# `probe_operations` world (#1164, S11a). The operations FEATURE stays live until
# #1166, so its snapshot/resume coverage stays too: `snapshot_resume`'s
# `the_resumed_world_keeps_a_slowed_hold_and_a_moved_capacity` needs a world
# where, at the capture tick, one tender is holding a field-repair the storm band
# has stretched to half rate mid-tick, and one depot is carrying a capacity a
# completed transfer has already moved off its authored value. It deliberately
# keeps the `[operations]` capability the four non-op replacement probes drop.
#
# The packhorse + depot pair and the tender + berth pair are lifted verbatim from
# the retired world so the exact tick-700 state the test asserts on — 50 % rate,
# a banked sub-tick remainder, and a berth filled 20 → 40 — is reproduced
# unchanged. The tow/escort/clear-repair pairs the retired world also carried are
# dropped: nothing reads them.
#
# Timeline (60 Hz):
#
#   tick   0   depot-berth at 20/40 berths, depot-storm at 40/100 condition
#   tick  60   t=1 s: the packhorse's field-repair opens, at the band's 50 % rate
#   tick 120   t=2 s: the transfer opens
#   tick 480   t=8 s: the transfer completes — 20 berths move into depot-berth,
#              taking it to 40/40, its ceiling
#   tick 700   the capture: the field-repair is still running, slowed and
#              mid-tick; the berth is at 40

[global]
seed = 1027
ai_helm_tick_hz = 30.0

[player_spawn]
position = [6000.0, 0.0, 6000.0]

# The player ship. Present because a world needs one; parked far enough away that
# nothing it does reaches any operation under test.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "player-ship"
transform = { position = [6000.0, 0.0, 6000.0] }
spawn_on = "game_start"

# ── TRANSFER ─────────────────────────────────────────────────────────────────
#
# 40 aboard the tender, 20 in a depot whose ceiling is 40. One delivery of 20
# exactly fills it, moving the depot's `depot_transfer_throughput` capacity off
# its authored value — the moved-capacity half of the test.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
name = "world.probe_operations.entity.tender.name"
transform = { position = [1200.0, 0.0, 0.0] }
overrides = { operations = { capability = [{ verb = "transfer", range = 4000.0, duration_secs = 6, power_group = "helm", min_power_level = 2, transfer = { capacity = "depot_transfer_throughput", amount = 20, direction = "deliver" } }] }, infrastructure = { publish = false, capacity = [{ id = "depot_transfer_throughput", amount = 40 }] } }

[[entity]]
template_path = "assets/entities/depot_transfer.toml"
name = "world.probe_operations.entity.berth.name"
transform = { position = [1400.0, 0.0, 0.0] }
overrides = { infrastructure = { capacity = [{ id = "depot_transfer_throughput", amount = 20, ceiling = 40 }] } }

# ── FIELD REPAIR, inside the storm band ──────────────────────────────────────
#
# The packhorse works its repair inside the band, so the interrupt holds it at
# the authored 50 % rate — the slowed-hold half of the test.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
name = "world.probe_operations.entity.packhorse.name"
transform = { position = [0.0, 0.0, 4800.0] }
overrides = { operations = { capability = [{ verb = "field_repair", range = 4000.0, duration_secs = 20, power_group = "helm", min_power_level = 2, condition_per_second = 2.0, repair_teams = 1, interrupt = [{ cause = "region", region_effect = "slow_zone", response = "slow", rate_percent = 50 }] }] } }

[[entity]]
template_path = "assets/entities/depot_transfer.toml"
name = "world.probe_operations.entity.depot_storm.name"
transform = { position = [200.0, 0.0, 4800.0] }
overrides = { infrastructure = { condition = 40.0 } }

# The band. 400-unit radius centred on the packhorse, so it is inside from tick
# zero and its AI drift cannot take it out.
[[entity]]
template_path = "assets/entities/region_storm_band.toml"
name = "world.probe_operations.entity.storm.name"
transform = { position = [0.0, 0.0, 4800.0] }

[script]
setup = """
on_timer(1, "begin_operations");
on_timer(2, "begin_transfer");

fn begin_operations(ctx) {
    ctx.effects.field_repair(
        "world.probe_operations.entity.packhorse.name",
        "world.probe_operations.entity.depot_storm.name",
    );
    ctx.flags.operations_begun = 1;
}

fn begin_transfer(ctx) {
    ctx.effects.transfer(
        "world.probe_operations.entity.tender.name",
        "world.probe_operations.entity.berth.name",
    );
    ctx.flags.transfer_begun = 1;
}
"""

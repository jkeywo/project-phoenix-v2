  id             = "obj-destroy-wave-8"
  text           = "world.combat_test.trigger.action.obj_destroy_wave_8.text"
  mandatory      = true
  targets        = ["wave_8"]
  target         = "wave_8"
  directive_kind = "Destroy"
  base_priority  = 80.0

# Wave 8 extra: +1 dynasty cruiser if ship_power >= 100 (battleship only)
[[trigger]]
condition  = "on_timer"
after_secs = 300.0
when       = "counter(ship_power) >= 100"

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_patrol.toml"
  name          = "wave_8b"
  position      = [1400.0, 0.0, 140.0]
  overrides = { behaviour = { doctrine = [
    { id = "assault-starbase", directive_kind = "Destroy", directive_target = "Starbase Alpha",
      base_priority = 50.0, target_speed = 0.9, maintain_range = 25.0,
      zero_gates = [{ condition = "not_attacked" }] },
  ] } }

# ── Endings ──────────────────────────────────────────────────────────────────

# Victory: all waves destroyed. Three variants gated by ship_power so that the
# on_all_destroyed list matches exactly the entities that were spawned this
# session — an unregistered name in the list permanently blocks the trigger.
#
#   ship_power < 90  (destroyer, power_rating=70): base 8 only
#   ship_power >= 90 and < 100  (cruiser, power_rating=90): base 8 + odd-wave destroyers
#   ship_power >= 100  (battleship, power_rating=100): base 8 + all b-ships

[[trigger]]
condition = "on_all_destroyed"
group     = "waves"
after_secs = 301.0
when      = "counter(ship_power) < 90"

  [[trigger.action]]
  type       = "game_over"
  message    = "world.combat_test.trigger.action.18.message"
  outcome    = "victory"
  delay_secs = 5.0

[[trigger]]
condition = "on_all_destroyed"
group     = "waves"
after_secs = 301.0
when      = "counter(ship_power) >= 90 and counter(ship_power) < 100"

  [[trigger.action]]
  type       = "game_over"
  message    = "world.combat_test.trigger.action.19.message"
  outcome    = "victory"
  delay_secs = 5.0

[[trigger]]
condition = "on_all_destroyed"
group     = "waves"
after_secs = 301.0
when      = "counter(ship_power) >= 100"

  [[trigger.action]]
  type       = "game_over"
  message    = "world.combat_test.trigger.action.20.message"
  outcome    = "victory"
  delay_secs = 5.0

# Defeat: Starbase Alpha destroyed.
[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.starbase_alpha.name"

  [[trigger.action]]
  type    = "game_over"
  message = "world.combat_test.trigger.action.21.message"
  outcome = "defeat"


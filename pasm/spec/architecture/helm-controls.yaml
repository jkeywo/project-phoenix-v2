  - component: ai-helm-tick-cadence
    core:
      status: implemented
      confidence: confirmed
      title: AI Helm Tick Cadence
      summary: Shared fixed-rate sim tick (one AiHelmTickTimer plus an AiHelmTickReady latch) that gates the helm decision-surface assembly (build_helm_ai_surfaces_frame) and all four per-axis AI helm systems — ai_helm_thrust, ai_helm_steering, ai_helm_impulse, and ai_helm_lateral_thrust — so AI helm decisions run at a TOML-authored rate instead of once per rendered frame.
      rationale:
        - "Issue #803: AI helm decisions were coupled to host frame rate — a 144 Hz host steered on ~4x fresher data than a 60 Hz one — a determinism blocker for P2P lockstep (PRD #620). One shared timer replaces per-frame execution and the private AiLateralThrustTimer."
        - "The tick rate is data-driven: [global] ai_helm_tick_hz in the world TOML, serde default 30 Hz (the old lateral timer's period), reconciled from WorldConfig at runtime because the timer resource is built before the config exists."
        - Existing ordering edges between the gated systems are preserved; the latch follows the AiSnapshotTimer idiom because run_if conditions must use read-only params.
    architecture:
      kind: scheduler
      authority: authoritative
      coordinates:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths:
        - src/ship_plugin.rs
        - src/world/config.rs
        - assets/worlds/default.toml
      symbols:
        - AiHelmTickTimer
        - AiHelmTickReady
        - tick_ai_helm_timer
        - ai_helm_tick_ready
      tests:
        - cargo test


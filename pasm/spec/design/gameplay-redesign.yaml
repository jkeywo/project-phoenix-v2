entities:
  - decision: redesign-first-vessel-acquisition
    core:
      status: accepted
      confidence: confirmed
      title: First Paid Whole-Vessel Acquisition
      summary: "Opt-in paid external Security Board work may acquire an actually disabled non-player autonomous NPC with an absent/empty accepted personnel profile and actual roster. Keep the same entity, physical resources, damage, access, knowledge and per-System AI; Session owns the minimal operational-owner record and effective faction derives from it or the original recipe. No launch-slot/seat/controller rewrite or human machinery grant."
      rationale:
        - "Root-approved bounded contract 2026-10-16: docs/gameplay-redesign/implementation/capture-acquisition-contract.md. Use an accepted externally capable optional Security profile; combined local/external team capability, populated-crew capture, prize crew, negotiated surrender, remote orders and full20/23 remain open."
        - "[ai] Exact real Security ActivityJob/team/target and paid useful-work completion cause bind the same prepared acquisition transaction; retain actual withdrawal/home settlement separately. Acquisition-time checks include actual disablement, no player/Fleet/authored-slot/occupied Human/GM authority, registered acquiring faction and empty personnel eligibility. Revalidate before writes; deterministic competing contenders cannot replace the first owner or duplicate credit. No power/HP modification manufactures eligibility."
        - "[ai] The first autonomous target explicitly declares a nonempty base-World post-acquisition doctrine containing only the existing AiDirective::None hold objectives prepared/applied through existing NpcDoctrineControl in the same transaction. Actual hardware/configuration governs recovery; no nonoperational/blanket-AI-off latch or second controller. Originally populated personnel profiles are unsupported. Preserve emitted physical effects and revalidate stale future AI targeting through ordinary owners."
        - "[ai] Fold and snapshot the Session owner/cause, derive effective faction, and validate accepted source, frozen registered faction, exact retained Job/cause/clocks before candidate writes. Later legitimate GM/crew/control-source/faction changes or acquiring-actor loss cannot invalidate historical eligibility. Current conditions do not authenticate past eligibility; contradictory retained evidence still refuses. Actual paid partial-work JSON360 continuations, conservation, stale/competing/no-write and owner-loss proofs plus Workshop support are required."
  - decision: redesign-compatible-incremental-migration
    core:
      status: accepted
      confidence: confirmed
      title: Playable Incremental Migration
      summary: "Keep shipped content and supported journeys working at each increment. Preserve the networking architecture, System-addressed admission and individual knowledge-limited System AI. Use one authoritative implementation per migrated capability; temporary definition/payload adapters have an explicit removal increment. Older saves and packs may require conversion or their compatible version."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-local-energy-flow
    core:
      status: accepted
      confidence: confirmed
      title: Local Energy Reserves and Flow-Limited Operation
      summary: "Increment 8 replaces planned ship-wide exhaustion with power flow into local System batteries, fullness-dependent passive drain and heat from changes in local charge. Apply the selected flow-cut and recovery policies, retaining operator intent. Coolant is consumable; used-coolant recycling remains provisional. This is target design, not the current runtime."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-independent-broad-focused-sensors
    core:
      status: accepted
      confidence: confirmed
      title: Independent Broad and Focused Sensors
      summary: "Increment 14 uses independent broad and focused scanner Systems with separate power demand. Focused enquiry does not pause broad collection. Both produce permitted observations through common evidence and Console knowledge processing. This replaces the earlier mutually exclusive scan-axis plan without claiming that current scan code has already migrated."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-static-celestial-bodies
    core:
      status: accepted
      confidence: confirmed
      title: Static Celestial Bodies
      summary: "Planets, moons, satellites and asteroid fields remain static. Moving entities are not orbiting bodies. Terrain can obstruct appropriate sensor and Comms paths. Coarse planetary mode retains ordinary planar capital-ship controls without restoring orbital body motion."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-no-message-capacity
    core:
      status: accepted
      confidence: confirmed
      title: No Simulated Message Capacity
      summary: "Comms conversations, sensor feeds, structured orders and receipts do not consume message-capacity pools, traffic budgets or congestion quotas. Preserve equipment, power, range, interference, terrain, channels, security and knowledge constraints. Outage-pending orders, receipts, AI reading time and finite listening/search coverage are distinct mechanisms."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-compatible-field-refits
    core:
      status: accepted
      confidence: confirmed
      title: Compatible Field and Facility Refits
      summary: "Increment 13 allows appropriate compatible equipment changes in the field using real equipment, parts, access and work time; major refits require suitable facilities. Authored mount/interface compatibility and actual resource costs govern fitting. No additional abstract fitting currency or ordinary player room/layout editor is introduced."
      rationale:
        - "User-selected gameplay and architecture decisions, adopted 2026-10-13 for the approved incremental implementation sequence. Current runtime remains described by existing implemented slices until its migration lands."
  - decision: redesign-authored-mission-planning
    core:
      status: accepted
      confidence: confirmed
      title: Authored HTN Missions and Crew-Aware Scheduling
      summary: "Future increment 22 composes parameterised activities using partial-order HTN domains and explicit library imports. Scenario trees execute lifecycles; Rhai retains sandboxed buffered effects; physical work uses ordinary admitted Systems and jobs. World owns planning, Gameplay owns machinery, Session supplies participation and Simulation connects contracts. One owner advances progression; hypothetical effects never establish completion."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-22.md defines ordered delivery and acceptance. Existing scenarios remain supported; increments 0–21 are unchanged."
        - "Schedule separate ship capability, human attention and shared physical constraints. Minute buckets forecast attention; exact simulation times govern dependencies/deadlines. Co-hosted Consoles share the operator budget. Combat effectiveness is balanced separately; planning forecasts do not reserve actual resources."
        - "Deadlines vary within authored bounds before commitment; announced deadlines change only through in-world causes. Replanning preserves history and earned advantages, supports refusal and partial failure, and never fabricates resources or forces player actions."
        - "[ai] First22C schedules only existing real imported internal Repair/local-delivery leaves. Optional closed primitive forecast uses finite integer min/max/recovery seconds and at most16 nonoverlapping active/monitor phases with attention_permille1..1000; unattended time stays implicit. Optional temporal profiles select a deadline by distinct occupied operator thresholds, bounded16 profiles and86400seconds. Actual fixed timestep converts conservatively to checked exact ticks. Deterministic earliest topological placement respects conservative predecessor finish, actual Repair team/Logistics-owner forecast exclusivity and continuous per-operator overlap; minute buckets summarize only. Actual source membership, ordinary authority host, replicated non-Backfill rating and actual replicated occupied Station are required to count Human capacity; cohosted Consoles share one budget, vacant/default Human never adds one, AI adds no human, missing/Offline withholds. Initially vacant later joins need the same admitted presence provenance, never local Sessions fallback. Same PlanChoice retains original bounded participation/control/rating/timestep inputs, profile/deadline and exact node intervals. Candidate validation recomputes from saved original inputs plus immutable source without reconstructing past crew from today's Sessions/ratings or rejecting history after disconnect/refit. Real acknowledged evidence and forecast earliest start jointly gate mission release, never dispatch or credit. Deadlines remain fixed; overdue inspection cannot invent failure/cancellation/reward or a second callback queue. First estimates remain provisional; hazard/permission exit requires a separately adopted actual communication lineage consumer, not hypothetical effects."
        - "[ai] The first22B consumer reads explicitly named closed versioned TOML domain-library imports through the existing overlay-aware WorldReader and LedgerPlan before content freeze. Validate import/private-reference closure, cycles, exports, compatible typed parameters and finite bounds. The first maintenance plan binds one actual actor; each offered hull must have some supported decomposition, and runtime selects against that actor's actual accepted equipment rather than LocalShip or live condition/stock truth. Deterministic supported methods lower to existing22A Repair/delivery situation leaves and explicit actual-evidence dependencies. World saves root arguments/selected method identity/choice tick, accepted actor UUID and bounded released-leaf id/original-tick frontier. Release and situation arming commit atomically at the existing World boundary; the exact released historical instance cannot disappear or rearm after actor loss, while unreleased future work remains distinct. Existing bootstrap/slot provenance validates the actor; no physical progress is copied. Frozen source derives the graph, while existing situations keep sole execution/evidence ownership. Ready own-System typed requests are mission instructions, not hidden damage/Stock/remote facts; actual target choice and diagnosis still use normal permitted reports/tools. They travel through ordinary permitted Repair/Logistics publications and the same voluntary Human/per-System AI admitted commands; no planner dispatcher, resource claim, new controller or feedback-as-completion. Candidate validation preserves method/dependency/accepted history across restore; attention scheduling, plan repair and dynamic search remain later scope."
        - "[ai] Same PlanChoice temporal decision is closed Committed or Refused, retaining complete original bounded inputs and deterministic explanation; refused leaves never release, and missing-history validation stays strict. Explicit missing/Offline/unoccupied input cannot invent human capacity. Later22D reconsideration requires an explicit cause and preserved commitments/history. Actual ShipCrewPresence Station set extends existing ratings/sources: bootstrap actual connected available launch crew or identical frozen occupied crew (never Backfill defaults), then actual post-handler claim/reconnect/ready/rating/AFK/release/disconnect outcomes travel as optional occupied on existing admitted AssignStationRating. Legacy/GM/NPC rating-only updates omit it and cannot create a human. MeshCrewState saves/restores/folds the bounded sorted authored Station set with existing crew authority; no new Session/player/token store, transport or World Session query. Missing bootstrap input waits before choosing, and historical forecast inputs never re-count today's crew."
  - decision: redesign-persistent-mission-consequences
    core:
      status: accepted
      confidence: confirmed
      title: Continuing Modes and Persistent Mission Consequences
      summary: "Future increment 23 delivers authored Patrol, then War, then Sandbox using persistent real assets and commitments. Stable entity references, ownership/control, custody, passengers, service needs and objective credit retain authoritative owners. Situation completion never rolls back physical consequences."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-23.md defines the capture, service, return-to-port and evacuation demonstration before procedural search."
        - "Distinguish proposals, revealed offers, acceptance and completion. Ordinary observations, Comms and optional objectives reveal opportunities; acceptance is not a command. Outside actors change needs through actual work without automatic cross-objective credit."
        - "[ai] First23A optionally binds planning.required_commitment to the existing unique real CommitmentLedger Open promise before root choice. Normal Comms dialogue acceptance records it through the existing effect path; offered/refused dialogue creates no acceptance or forced System command. PlanChoice retains immutable required ID; candidate preflight validates original made/resolved clocks and choice relation using that same ledger. Later resolution preserves root/deadline/physical work; only explicit authored actual-owner cancellation may stop work. Missing-root protection allows absent promise, same-tick acceptance awaiting collection or same-tick make/resolve, never laundering an earlier open interval by later resolution. Existing plans unchanged; full Patrol awaits actual custody/capture/transport/reception."
  - decision: redesign-bounded-opportunity-discovery
    core:
      status: accepted
      confidence: confirmed
      title: Bounded Opportunity Discovery and Adaptive Direction
      summary: "Future increment 24 uses bounded GOAP-like search over the same activity operators around authored goals and values. Bind actual assets and needs, revalidate candidates and admit feasible optional opportunities into the HTN. Hypothetical search never mutates the world; uncertain player/NPC actions are not guaranteed effects."
      rationale:
        - "User-approved revision 2026-10-14; docs/gameplay-redesign/implementation/increment-24.md defines discovery, admission, pacing, diagnostics and final acceptance."
        - "Adapt unannounced work within authored difficulty bounds, preserving committed deadlines, recovery and earned advantages. Prefer existing entities; include continuing obligations. Low input is not proof of boredom and delegation does not automatically create replacement chores. No message-capacity accounting is introduced."
        - "Bound depth, candidates and deterministic expansions; reject cycles, duplicates and unsupported effects. Exhaustion yields no offer while execution continues. Stable ordering, saved commitments/director history and necessary continuation preserve replay and restore."
        - "Retain Workshop and planetary activities, catalogue/shipped-content coverage and 2/4/6/8-seat audits. Validate schedules with scripted crews and meaningful participation with human playtests, separately from combat balance."
        - "[ai] First24A discovers useful structural Repair or actual finite local Delivery then Repair from current own permitted maintenance evidence and authoritative Damage/Stock/services/routes/jobs, excluding existing automatic incoming or committed work. Closed primitive preconditions/effects reuse actual recipes and typed bindings. Sorted scratch search bounds depth8/expansions256/candidates16, rejects cycles, never mutates machinery or reserves goods. Accepted history retains bounded original discovery inputs/source/bindings/order; present-day usefulness cannot rewrite history. Full captured-vessel search remains after real custody."
        - "[ai] Optional children retain a bounded source-derived execution identity in the same World owner; primary PlanChoice stays unchanged. Reuse primitive expansion, shared HTN release/history, Situation and ordinary owner consumers. Scope leaves/definitions/callbacks/publications without arbitrary prefixes or fake authored source. First admission waits for all prior nodes, actual terminal settlement/home/release and completed callbacks. Both arming and pairwise history permit reuse only strictly after prior settlement, never RepairAchieved. Retain all scoped evidence; global32 situations and8 optional records refuse exhaustion without eviction. Unreleased/refused future nodes need explicit closed decisions; no physical rollback."
        - "[ai] Immutable original proposal context travels through normal Comms open/dialogue/admitted response; a stale message cannot accept a replacement. Revalidate current own evidence and actual finite needs/jobs/routes/stocks/capacity before atomically recording the existing promise, optional choice and releases. Failed admission leaves no promise. Offer/refusal differs from acceptance; no timer/entry callback impersonates a bound response. Snapshot/digest/Workshop validate complete proposal/decision/source/actor/namespace/promise/settlement history before writes. Concurrent24B/C pacing, captured-vessel chains and full23/24/planetary/catalogue/crew acceptance remain open."
        - "[ai] Reserve generated Promise ids opportunity.<source>.<ordinal>: literal script recording is an authoring error and computed script attempts raise before ledger buffering, discarding the call. Only the World collector records a generated Promise from the exact validated proposal tuple atomically with child release; prefix possession alone grants no authority. Unrelated script ids and authored keep/break consequences remain supported."
        - "[ai] Offered maintenance retains exactly one bound pending-open or active dialogue; actual final root source failures record a closed source-unavailable outcome without a user decision or Promise, while script-budget deferral retains its envelope and decision-free bound replies refuse before effects/selection."
        - "[ai] Accepted future Repair intent uses only its own permitted Console view and excludes ordinary candidates whose actual router-resolved work footprint would consume that exact target before its prerequisite; unrelated work and normal Human overrides remain admitted. A common dated future/unaccepted-node disposition retains the original execution/node/choice, actual permitted observation and cause without a fake JobId or retroactive achievement. Externally changed work has an explicit authored consequence through the existing sandbox/effect boundary with a retained actual result/tick; prior real assignments still settle normally before reuse."
        - "[ai] First monitoring consumer supports only the generated maintenance source's final compartment Structure leaf and requires an exact accepted changed_work script/function. Ordinary work-list requested target and physical-sweep discriminator derive from existing physical assignments; absent exact target does not make Refit/Treatment/transfer a sweep. Bounded first/latest own Repair/Stock/route/work-list readings distinguish missing parts, inaccessible route, already-owned work, clearance and immutable externally restored target. Keep original choice/deadline/releases; no observed unscoped Job is rebound. Shared trigger sandbox/budget/application receipts retain actual changed-work result/tick, no invented Situation or physical fact and no automatic Promise success. Prior actual jobs/callbacks still settle; refused consequence does not establish settlement. Publication/GUI remain own-Console readonly; full autonomous/Human/native acceptance and wider plan repair remain to verify."
        - "[ai] Ordinary per-System AI may receive exact accepted future-leaf/team/target/prerequisite intent only through its own permitted Console. Intent prioritization prevents competing ordinary teams from consuming the same pending work, without early Job/resource reservation, command authority or retroactive evidence binding. Human override remains ordinary admission; if frozen work becomes inapplicable, retain an explicit supported blocked/cancelled/externally-changed outcome rather than silent waiting or credit. Initial Human operation with ordinary delegated continuation may land before this full autonomous-chain join; it does not close24."
  - decision: redesign-activity-existing-physical-evidence
    core:
      status: accepted
      confidence: confirmed
      title: Activity Execution Consumes Actual Repair and Delivery Outcomes
      summary: "Increment 22A first binds two disjoint authored situation instances to existing physical Repair and main-to-local delivery. World owns instance progression/evidence, Gameplay retains actual jobs/resources, and Simulation joins narrow shared post-commit facts through the existing World event lifecycle. Command Applied, hypothetical effects and successful scripts never establish physical completion."
      rationale:
        - "[ai] Read-only owner inspection pins RepairTeams scoped JobId/physical stage and separate terminal return, and LogisticsTickResult.completed after exact Receive. Terminal team rows can be replaced and last_outcome retains only one; neither is a completion journal. Supported achieved-work, assignment settlement, exact received/returned quantities and real refusal/interruption remain distinct. Detailed contracts are in docs/gameplay-redesign/implementation/increment-22.md."
        - "[ai] Reuse saved pending_world_events and existing collection/codec, not a second universal bus. Physical commit/enqueue is one observable fixed-step frontier; unconsumed bound facts survive timing/restore until World acknowledgement before transient-buffer replacement. Bounded per-instance evidence/terminal keys suppress duplicate progression/effects; admission limits cannot drop already committed facts. World stores no Stock/damage/job mirror and imports no sibling domain. These retention limits apply only to admitted bound activities; ordinary unbound work keeps operating without a planner backlog or planner-presence gate."
        - "[ai] Actual Human/ordinary AI repair/delivery, simultaneous and delayed completions, reassignment/recall/return, failed payment and at least 360 complete JSON capture/digest continuations plus malformed no-write frontiers establish this slice. Schema-only/synthetic events are insufficient. Early contracts do not start runtime, change 21's full completion prerequisite, replace approved HTN/Scenario ownership or alter 24's hypothetical operator search."
        - "[ai] The first implementation binds only explicitly armed disjoint requests and takes accepted scoped JobId directly from the ordinary owner result. Reserve the named achieved/settled or exact delivery terminal evidence slots at arming. Repair returns committed remedy results separately from actual return settlement; Logistics retains every completed Receive/Return through its staged commit. Simulation enqueues bound post-commit facts in the existing saved pending World event owner. Collection withholds these retained facts from unrelated legacy callbacks; only the bound World situation consumer acknowledges them. Scenario states lower to the existing World condition/script-effect boundary, with one persisted activation frontier per call; this is not the later HTN implementation. Ordinary unbound work remains unchanged."
        - "[ai] A Repair binding declares both its exact ordinary admitted request/team and the required named target/remedy. Existing AI may legitimately dispatch a group and repair a different component first; only the matching committed target/result credits the bound goal. Validate that goal against the actual group's supported physical scope without steering the ordinary controller. Consumed terminal evidence remains historical after slot reassignment, later damage or actor loss; snapshot validation checks immutable supported identity/remedies and saved lifecycle frontiers, not today's former team slot or foreign live condition."
        - "[ai] This first real consumer accepts only named actors declared by the base World or actual authored launch slots. Declared but unresolved actors arm when physically present; dynamic script/GM and layer-only bindings refuse with an actionable source error. Base template/overrides and the existing launch bootstrap retain immutable provenance after actor removal without copying a new spawn owner into the planner. Dynamic opportunities remain open22 work and must later reuse actual existing recipe/content provenance."
        - "[ai] The sole World PlanChoice retains original ordered immutable-capability rejection explanations within the existing expanded-node and 512-character diagnostic budgets. Candidate preflight reconstructs the accepted complete recipe selection and checks method identities plus explanations; this metadata never claims current damage, stock or resources. Privileged Scenario inspection derives the graph without reselection, progress or gameplay grants."
        - "[ai] Body-only restore cannot rewind a physical Repair/Logistics job frontier beneath retained accepted World activity history. Refuse that inverse before writes or actor rebuild; full snapshot rollback carries and validates its own matching World frontier. Explicit candidate origin resolution must be exact and preserve the accepted base/slot equipment recipe rather than borrowing bootstrap capability after a failed read or override."
        - "[ai] The existing GameStartEntityUuid bootstrap record retains the actual FleetPlacement authored slot id beside its existing authored row and UUID. Validate unique slot/UUID identities and compatible authored rows before candidate application. Removed launch-slot history reuses that immutable bootstrap relation, FrozenShipSlots hull choice and the existing player-hull override merge; neither current LocalShip nor a guessed actor provides provenance."
        - "[ai] Workshop authoring reuses the ordinary pure Repair visit resolver and a closed immutable binding-support check in Gameplay. ContentPreparation validates each declared actor/launch offer against its actual compiled Repair team/goal/remedy or approved Logistics route before accepting Preview/Test. Forms never become a second acceptance owner; changing related equipment must fail the same backend check. Live inspection projects the existing World lifecycle and retained facts through the privileged ScenarioState surface without acknowledging evidence or dispatching work."

        - "[ai] Actual replicated crew participation follows the existing operative connected holder, excluding AFK/spectator/disconnected/superseded tokens. Lobby readiness is not an ongoing authority gate: existing reconnect and in-play unready retain operational participation. Historical Human forecasts validate their owner Console home/human-seeking candidate and Station rating, without consulting current Sessions. Empty participation owners remain distinct from absent bootstrap owners in deterministic state."

        - "[ai] First22D refusal recovery appends at most eight dated crew/control-change decisions on the same PlanChoice only before any release and while its effective temporal decision refuses. Exact actual owner-input changes provide the cause. Preserve original methods, actor, difficulty profile and absolute deadline; schedule from the cause tick, recompute every historical decision before candidate writes, and stop reconsidering once committed. Exhaustion/unchanged input retains refusal; this does not finish capability-loss or outside-actor continuation."

        - "[ai] The communication activity joins actual16ReportStatus execution through a closed ActivityExecution reference: physical JobId or actual emitter/System/origin/recipient/emission identity, never a fake job. Publish released instructions only after the same recipient is already in the issuing Console permitted contacts. Human/ordinaryAI issue the normal paid SendCommsRequest with validated optional context, binding the minted origin at that commit. Only own heard matching read/Report/Decline receipts create retained scoped activity facts; original clocks and explicit Scenario permission effects stay distinct. Candidate Comms/World lineage validates before writes; source/Workshop and deterministic continuation share existing owners."
        - "[ai] First22C permission composition adds actual application ticks to the same bounded Situation activation result history. Result/tick keys agree, clocks follow required evidence and original state order, and full candidate validation precedes writes. Closed scenario_applied state dependencies require the exact authored callback state and its actual Applied result/tick; receipt alone and Refused never release. Earlier callback references only inside acyclic lifecycles. No second permission store or fabricated physical work. Separate/cohosted operator forecasts use existing temporal owners and retain original absolute deadlines; authored estimates require separate measured native/human evidence."

      tests: [cargo test --features headless --lib gm_role_preset, cargo test --features headless --lib gm_roster_decoder_rejects_duplicates_bounds_and_private_fields, npx vitest run tests/client/gm-role-presets.test.js tests/client/gm-join-page.test.js, tests/smoke/gm-m1-exit.spec.js, tests/smoke/gm-page.spec.js]

  - decision: gm-t2-device-and-milestone-boundaries
    core:
      status: accepted
      confidence: confirmed
      title: T2 Device Floor and T3/T4 Boundary
      summary: "T2 supports desktop keyboard/mouse and large landscape tablets with touch, zoom, scalable text, visible focus, and non-colour state; phone portrait is out of scope. T3 owns M4 attention assistance and M5 safety/recovery, including live-session restore and undo. T4 M6 owns native integration and the integrated Workshop/Live Inspector. At M6 one native simulation instance may carry one fixed player-ship slot alongside local GM operator identities, advertises both ship and gm capabilities, and contributes once to deterministic NPC ownership; browser GM remains GM-only. M7 owns false/ghost/degraded/delayed information and M8 owns in-sim presentation controls."
      rationale:
        - "The combined native instance is one simulation peer with multiple local operator roles, never two duplicate simulations. T2 browser delivery stays focused while its reusable map, selection, inspector, panel, capability, and action components become the M6 foundation."
    architecture:
      kind: scope-boundary
      authority: non-authoritative
      coordinates: [gm-milestone-performing, gm-milestone-integrated-workshop, gm-milestone-information-control, gm-milestone-presentation]

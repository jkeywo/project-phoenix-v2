      rationale:
        - The smallest useful shared interface is a local-space velocity-based contract rather than direct thrust or steering commands.
        - Keeping this blackboard 3D allows bounded and full-3D ships to share the same contract even while current consumer logic remains mostly planar.
        - Desired facing belongs beside desired velocity because some helm requests care more about orientation than translation.

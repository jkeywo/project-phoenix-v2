    // current stage so the DOM (and the ph-ship-picker web component) is only
    // rebuilt when the stage actually changes — the render loop runs at rAF
    // cadence and must not tear down a half-tapped picker.
    let _pickerStageKey = null;
    /// The request this phone has sent and not yet seen answered, and the
    /// "another phone got there first" record left by the last one that lost
    /// the race. Both are pure-rule state — see gui/scenario-pick.js — kept
    /// here because the arbiter never addresses an acknowledgement to us.
    let _pick = null;
    let _pickNotice = null;

    /// Settle an outstanding pick against a freshly-arrived lock. Called from
    /// handleMessage on every ScenarioCatalog broadcast (PRD #1023 module 4).
    function settleScenarioPick() {
      const ls = window.lobbyState;
      if (!ls || !window.scenarioPick) return;
      const settled = window.scenarioPick.settlePick(_pick, ls.selectionLocked);
      _pick = settled.pending;
      if (settled.state === 'lost') {
        // Name what actually won, not just that we lost. `lostTo` is a
        // scenario id or a template_path; resolve it back to its catalogue
        // label so the message reads as prose.
        _pickNotice = { choice: pickChoiceLabel(settled.lostTo) };
      } else if (settled.state === 'won') {
        _pickNotice = null;
      }
    }

    /// Catalogue label for a locked scenario id or ship template_path.
    function pickChoiceLabel(id) {
      const ls = window.lobbyState;
      const catalog = (ls && ls.scenarioCatalog) || [];
      for (const sc of catalog) {
        if (!sc) continue;
        if (sc.id === id) return wireText(sc.label) || sc.id;
        for (const sh of (sc.ships || [])) {
          if (sh && sh.template_path === id) {
            return wireText(sh.label) || wireText(sh.name) || id;
          }
        }
      }
      return String(id || '');
    }

    function renderScenarioPicker() {
      const ls = window.lobbyState;
      const body = document.getElementById('scenario-picker-body');
      const heading = document.getElementById('scenario-picker-heading');
      if (!ls || !body || !window.scenarioPick) return;
      const catalog = ls.scenarioCatalog || [];
      const activePacks = ls.activePacks || [];
      const locked = ls.selectionLocked || { scenario_id: null, template_path: null };
      const pv = window.scenarioPick.scenarioPickView({
        catalog, locked, pending: _pick, notice: _pickNotice,
      });

      let stage;
      if (locked.scenario_id == null) stage = 'scenario';
      else if (locked.template_path == null) stage = 'ship:' + locked.scenario_id;
      else stage = 'locked';
      // Pack count is in the key so a change to the applied mods re-renders the
      // scenario buttons' mod-origin badges (issue #990), not only a catalog
      // change (the two arrive together, but a later pack edit updates one).
      // The pending id and the race notice are in it too: a tap must repaint
      // the picker WITHOUT waiting for a stage change, since waiting for the
      // stage change is exactly the silence the pending state exists to fill.
      const key = stage + '|' + catalog.length + '|' + activePacks.length
        + '|' + (pv.pendingId || '') + '|' + (pv.noticeParams ? pv.noticeParams.choice : '');
      if (key === _pickerStageKey) return;
      _pickerStageKey = key;

      body.innerHTML = '';
      // "Another phone chose X" — rendered above whichever stage the player
      // was moved to, so the stage change has a stated cause (PRD #1023 user
      // story 16).
      if (pv.noticeId) {
        const notice = document.createElement('div');
        notice.className = 'scenario-race-note';
        notice.setAttribute('role', 'status');
        notice.textContent = t(pv.noticeId, pv.noticeParams);
        body.appendChild(notice);
      }
      if (stage === 'scenario') {
        if (heading) heading.textContent = t('client.select_scenario');
        if (pv.emptyId) {
          const note = document.createElement('div');
          note.className = 'scenario-locked-note';
          // NOT "waiting for the host to select a scenario": the host has
          // already broadcast its catalogue and the catalogue is empty.
          note.textContent = t(pv.emptyId);
          body.appendChild(note);
          return;
        }
        for (const sc of catalog) {
          const btn = document.createElement('button');
          btn.className = 'scenario-btn';
          btn.dataset.scenarioId = sc.id;
          const title = document.createElement('div');
          title.textContent = sc.label || sc.id;
          btn.appendChild(title);
          if (sc.description) {
            const desc = document.createElement('div');
            desc.className = 'scenario-desc';
            desc.textContent = sc.description;
            btn.appendChild(desc);
          }
          // Mod-origin badge (issue #990): only a mod-supplied scenario gets one;
          // a base scenario returns null and stays unmarked.
          const badge = (typeof window.scenarioOriginBadge === 'function')
            ? window.scenarioOriginBadge(sc, activePacks) : null;
          if (badge) {
            const badgeEl = document.createElement('span');
            badgeEl.className = 'scenario-origin';
            badgeEl.textContent = t('client.scenario_mod_origin', { name: badge.name });
            btn.appendChild(badgeEl);
          }
          // Immediate feedback (PRD #1023 user story 16). The arbiter sends no
          // acknowledgement, so between the tap and the next catalogue
          // broadcast the picker used to look untouched — which is how a phone
          // on a slow link ends up tapping twice.
          if (pv.pendingId === sc.id) {
            btn.classList.add('pending');
            btn.setAttribute('aria-busy', 'true');
            const wait = document.createElement('div');
            wait.className = 'scenario-pending';
            wait.textContent = t('client.pick_pending');
            btn.appendChild(wait);
          }
          btn.disabled = !pv.accepting;
          btn.addEventListener('click', () => {
            if (!pv.accepting) return;
            _pick = window.scenarioPick.pendingPick('scenario', sc.id);
            _pickNotice = null;
            scheduleRender();
            // Same action map as the host page — two transports (issue #755).
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_scenario', scenario_id: sc.id }, send);
            } else {
              send('SelectScenario', { scenario_id: sc.id });
            }
          });
          body.appendChild(btn);
        }
      } else if (stage.startsWith('ship:')) {
        if (heading) heading.textContent = t('client.select_ship');
        const entry = catalog.find(s => s && s.id === locked.scenario_id);
        const ships = (entry && entry.ships) || [];
        import('./gui/components/ph-ship-picker.js').then(() => {
          if (_pickerStageKey !== key) return; // stage changed meanwhile
          const picker = document.createElement('ph-ship-picker');
          body.appendChild(picker);
          // The picker greys itself out and marks the tapped card while the
          // request is unacknowledged (PRD #1023 user story 16).
          picker.state = { ships, pendingTemplate: pv.pendingId, accepting: pv.accepting };
          picker.addEventListener('ship-selected', (e) => {
            const tp = e.detail.template_path;
            _pick = window.scenarioPick.pendingPick('ship', tp);
            _pickNotice = null;
            scheduleRender();
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_player_ship', template_path: tp }, send);
            } else {
              send('SelectPlayerShip', { template_path: tp });
            }
          });
        });
      } else {
        if (heading) heading.textContent = t('client.select_ship');
        const note = document.createElement('div');
        note.className = 'scenario-locked-note';
        note.textContent = t('client.scenario_locked');
        body.appendChild(note);
      }
    }

    function render(s) {
      // QR-first pre-scenario picker (issue #755): before any world loads, the
      // host delivers the catalog and this phone can make the first valid
      // selection. Short-circuit the normal lobby/game render while active.
      const pickerEl = document.getElementById('scenario-picker-overlay');
      const pickingScenario = !!(window.lobbyState && window.lobbyState.showScenarioPicker());
      if (pickerEl) pickerEl.style.display = pickingScenario ? 'flex' : 'none';
      if (pickingScenario) {
        $('lobby-ui').className = '';
        const bezel0 = $('phone-bezel');
        if (bezel0) bezel0.setAttribute('aria-hidden', 'true');
        renderScenarioPicker();
        return;
      }

      // Phase ? section visibility (pure JS module, gui/phase-toggle.js).
      // Falls back to a local check if the module hasn't loaded yet so the
      // first paint isn't blank — module load races init on slow networks.
      const vis = (typeof window.sectionVisibility === 'function')
        ? window.sectionVisibility(s.phase)
        : { lobby: s.phase !== 'InProgress' && s.phase !== 'GameOver',
            game: s.phase === 'InProgress' || s.phase === 'GameOver',
            bezel: s.phase === 'InProgress' || s.phase === 'GameOver' };
      const mine = myConsoles(s);
      // An explicit Spectator (issue #1105) gets the crew-public summary surface
      // instead of the station-select lobby OR the game shell. Checked first so
      // it wins over the mid-game-claimant lobby override below.
      const spectating = spectatingInGame(s);
      // Pending mid-game claimants (and stationless non-spectators) stay in the
      // lobby. Ready is the point where the server hands the station over from AI.
      if (spectating) {
        vis.lobby = false; vis.game = false; vis.bezel = false;
      } else if (showingLobbyDuringGame(s)) {
        vis.lobby = true; vis.game = false; vis.bezel = false;
      }
      const specSection = $('spectator-ui');
      if (specSection) {
        specSection.className = spectating ? 'active' : '';
        specSection.setAttribute('aria-hidden', spectating ? 'false' : 'true');
      }
      const inGame = vis.game;
      $('lobby-ui').className = vis.lobby ? 'active' : '';
      // Phone bezel (issue #439) is part of the game shell only — the lobby
      // is borderless. Toggle visibility via aria-hidden so the CSS
      // [aria-hidden="true"] { display: none } rule drives the cascade.
      const bezel = $('phone-bezel');
      if (bezel) bezel.setAttribute('aria-hidden', vis.bezel ? 'false' : 'true');

      // Reconcile activeConsole with current consoles list (port of the
      // deleted Bevy reconcile_active_console — see gui/lobby-state.js).
      if (inGame) {
        const hero = (typeof window.heroBarModel === 'function')
          ? window.heroBarModel({
              directStation: playerStation(s),
              stations: (s.shipStations && s.shipStations.stations) || [],
              stationSystems: window.simState && window.simState.stationSystems,
              blackboards: window.simState && window.simState.blackboards,
              stationHosts: window.simState && window.simState.stationHosts,
              stationHealth: window.simState && window.simState.stationHealth,
              stationImportance: window.simState && window.simState.stationImportance,
              stationRatings: window.simState && window.simState.stationRatings,
              activeStation: activeConsole,
            }) : { tabs: mine.map(id => ({ id })), selected: mine[0] || null };
        const available = hero.tabs.map(tab => tab.id);
        const next = (typeof window.reconcileActiveConsole === 'function')
          ? window.reconcileActiveConsole(activeConsole, available)
          : ((activeConsole && available.includes(activeConsole)) ? activeConsole : (available[0] || null));
        if (next !== activeConsole) setActiveConsole(next);
      } else {
        setActiveConsole(null);
      }
      renderStationHero(s, inGame);

      // Console sections: map activeConsole → HTML section id via
      // gui/content-switcher.js, over the sections this ship actually mounts
      // (issue #827). Only the matching section gets `.active`. Sections that
      // don't exist on this ship are simply absent from the DOM; the $() call
      // returns null and is silently skipped.
      const stationIds = ((s.shipStations && s.shipStations.stations) || [])
        .map(st => st.id).filter(Boolean);
      if (typeof window.applyConsoleVisibility === 'function') {
        // The tab-switch seam (gui/console-mount.js): a pure `.active` toggle
        // over the mounted sections. It never touches iframe nodes, so session-
        // local console state survives a switch away and back (issue #1099 AC1).
        window.applyConsoleVisibility(document, activeConsole, inGame, stationIds);
      } else {
        // Boot-race fallback: canonical `${id}-ui` scheme + the one tactical →
        // weapons alias (single home: gui/mount-plan.js).
        const sections = Object.fromEntries(stationIds.map(id => {
          const base = id === 'tactical' ? 'weapons' : id;
          return [base + '-ui', inGame && activeConsole === id];
        }));
        for (const [sectionId, visible] of Object.entries(sections)) {
          const el = $(sectionId);
          if (el) el.className = visible ? 'console-section active' : 'console-section';
        }
      }

      // Orientation drives console CSS via the container's data attribute.
      const orientation = (typeof window.currentOrientation === 'function')
        ? window.currentOrientation()
        : (window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait');
      const container = $('console-container');
      if (container) container.dataset.orientation = orientation;

      // Link state (PRD #1023 module 4): the console dims and stops taking
      // taps when the host is gone, and reads as LOADING rather than broken
      // before the first state lands. Game shell only — the lobby has its own
      // status line and ready pill for the same information.
      renderLinkState(inGame);

      // Game-over overlay: covers the game shell when phase is GameOver.
      // Framed with the scenario's name and the run's outcome (PRD #1023
      // module 4, user story 17) rather than a bare line of text.
      const gameOverEl = document.getElementById('game-over-overlay');
      const gameOverMsgEl = document.getElementById('game-over-message');
      if (gameOverEl && gameOverMsgEl && typeof window.gameOverView === 'function') {
        const ls = window.lobbyState;
        const gv = window.gameOverView({
          phase: s.phase,
          shipDestroyed: s.shipDestroyed,
          reason: s.gameOverReason,
          // Authored per world, and published on `ServerMessage::GameOver`
          // since the #1023 wire pass; lobby-state parks it here. Null for an
          // ending that declared no side, which the view frames as ENDED.
          outcome: ls ? ls.gameOverOutcome : null,
          scenarioTitle: ls ? ls.scenarioTitle : '',
        });
        if (gv.visible) {
          gameOverEl.dataset.outcome = gv.outcome;
          const scenarioEl = document.getElementById('game-over-scenario');
          if (scenarioEl) scenarioEl.textContent = wireText(gv.scenarioName);
          const headlineEl = document.getElementById('game-over-headline');
          if (headlineEl) headlineEl.textContent = t(gv.headlineId);
          gameOverMsgEl.textContent = gv.bodyId ? t(gv.bodyId) : wireText(gv.bodyText);
          gameOverEl.style.display = 'flex';
        } else {
          gameOverEl.style.display = 'none';
        }
      }

      // Waiting-for-scenario overlay: shown after ReturnToLobby while the
      // host selects a scenario from the server scenario-selection panel.
      const waitingEl = document.getElementById('waiting-overlay');
      if (waitingEl) {
        waitingEl.style.display = (window.lobbyState && window.lobbyState.waitingForScenario) ? 'flex' : 'none';
      }

      if (spectating) {
        renderSpectator(s);
      } else {
        // A successful claim (issue #1106) seats the ex-Spectator and clears the
        // role, so we drop off the spectator surface; forget any pending claim
        // so a later re-spectate never shows a stale "seat taken" notice.
        pendingSpectatorClaim = null;
        if (inGame) renderGame(s);
        else if (!(window.lobbyState && window.lobbyState.waitingForScenario)) renderLobby(s);
      }
    }

    // Render the crew-public Spectator summary surface (issue #1105) from the
    // already-held simState. A Spectator receives only Audience::All broadcasts,
    // so this shows exactly the crew-public set — objectives, red-alert,
    // ship-wide hull, per-Station health — and no per-station private feed.
    function renderSpectator(s) {
      if (typeof window.spectatorSummaryModel !== 'function'
          || typeof window.renderSpectatorDom !== 'function') return;
      const sim = window.simState || {};
      const model = window.spectatorSummaryModel({
        redAlert: sim.redAlert,
        hullAggregate: sim.hullAggregate,
        hullDestroyed: sim.hullDestroyed,
        stations: (s.shipStations && s.shipStations.stations) || [],
        stationHealth: sim.stationHealth,
        stationImportance: sim.stationImportance,
        objectives: sim.objectives,
      });
      window.renderSpectatorDom({
        alertEl: $('spectator-alert'),
        hullEl: $('spectator-hull'),
        stationsEl: $('spectator-stations'),
        objectivesEl: $('spectator-objectives'),
        model,
        translate: (id, params) => t(id, params),
        // Objective text is a wire string id (may carry text_params); resolve it
        // the same way the rest of the shell resolves wire copy.
        objectiveText: (o) => (window.phStrings && window.phStrings.has(o.text))
          ? t(o.text, o.textParams || {}) : (o.text || ''),
      });
      renderSpectatorClaims(s);
    }

    // Render the "claim an open Station" list on the Spectator surface (issue
    // #1106). A Spectator may enter play by taking any currently-open, eligible
    // seat — through the SAME authoritative SelectStation message an ordinary
    // lobby claim sends (AC2). Open∩eligible seats get a live claim button;
    // ineligible open seats are shown disabled with the private #1103 reason
    // (AC1); a lost race / stale seat leaves a neutral notice and keeps the
    // participant here (AC3). The roster is live because StationAssigned is
    // broadcast to all, so a race lost to another player repaints as taken.
    function renderSpectatorClaims(s) {
      const listEl = $('spectator-claims');
      const statusEl = $('spectator-claim-status');
      if (!listEl || typeof window.spectatorClaimModel !== 'function') return;
      const roster = s.stations || [];

      // Neutral stale/lost-race notice (AC3): the seat we tapped came back
      // taken. Keep the Spectator on the surface; leak no other-player identity.
      if (statusEl) {
        const stale = typeof window.spectatorClaimStale === 'function'
          && window.spectatorClaimStale(roster, pendingSpectatorClaim, myToken);
        if (stale) {
          statusEl.textContent = t('client.spectator.claim_taken');
          statusEl.dataset.state = 'taken';
          pendingSpectatorClaim = null;
        } else if (!pendingSpectatorClaim) {
          statusEl.textContent = '';
          statusEl.removeAttribute('data-state');
        }
      }

      const rows = window.spectatorClaimModel(roster, stationEligibility);
      listEl.innerHTML = '';
      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'spectator-claims-empty';
        empty.textContent = t('client.spectator.claim_none');
        listEl.appendChild(empty);
        return;
      }
      for (const row of rows) {
        const rowEl = document.createElement('div');
        // Reuse the lobby row visuals (issue #1106): the claim/ineligible
        // buttons and inline reason are styled under `.station-row`.
        rowEl.className = 'station-row spectator-claim-row'
          + (row.button === 'ineligible' ? ' ineligible' : '');
        rowEl.dataset.station = row.id;

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = stationLabel(row);
        info.appendChild(nameEl);
        if (row.rank) {
          const meta = document.createElement('div');
          meta.className = 'meta';
          const rankEl = document.createElement('span');
          rankEl.textContent = row.rank;
          meta.appendChild(rankEl);
          info.appendChild(meta);
        }
        // A free seat this player is INELIGIBLE for (issue #1103 AC1): the
        // private functional reason, local-only, mirroring the lobby roster.
        if (row.button === 'ineligible' && row.ineligibleReason) {
          const why = document.createElement('div');
          why.className = 'ineligible-reason';
          const fns = (row.ineligibleReason.functions || [])
            .map(f => t('client.assist_function.' + f))
            .join(', ');
          why.textContent = t('client.station_ineligible_reason', { functions: fns });
          info.appendChild(why);
        }
        rowEl.appendChild(info);

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (row.button === 'ineligible') {
          // Blocked claim: the disabled control never sends SelectStation.
          btn.className = 'ineligible-btn';
          btn.textContent = t('client.station_ineligible');
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = t('client.claim');
          btn.addEventListener('click', () => {
            // Remember the seat so a lost race can render its neutral notice,
            // then send the SAME authoritative message the lobby roster uses.
            pendingSpectatorClaim = row.id;
            send('SelectStation', { station: row.name });
            scheduleRender();
          });
        }
        action.appendChild(btn);
        rowEl.appendChild(action);
        listEl.appendChild(rowEl);
      }
    }

    // "Mods active" lobby list (issue #990): render the packs the host applied
    // from lobbyState.activePacks. Nothing renders (and the row is hidden) when
    // no packs are applied, so the base game shows no empty banner. Separate
    // from the station list so it survives the boot-race guard below — a mid-
    // round spectator still sees what mods the session is running.
    function renderActiveMods() {
      const el = document.getElementById('lobby-mods');
      if (!el) return;
      const rows = (typeof window.activePacksView === 'function')
        ? window.activePacksView(window.lobbyState && window.lobbyState.activePacks)
        : [];
      el.innerHTML = '';
      if (rows.length === 0) {
        el.setAttribute('aria-hidden', 'true');
        return;
      }
      el.setAttribute('aria-hidden', 'false');
      const heading = document.createElement('div');
      heading.className = 'mods-active-heading';
      heading.textContent = t('client.mods_active');
      el.appendChild(heading);
      for (const row of rows) {
        const rowEl = document.createElement('div');
        rowEl.className = 'mods-active-row';
        const nameEl = document.createElement('span');
        nameEl.className = 'mods-active-name';
        nameEl.textContent = row.name;
        rowEl.appendChild(nameEl);
        if (row.version) {
          const verEl = document.createElement('span');
          verEl.className = 'mods-active-version';
          verEl.textContent = t('client.mods_active_version', { version: row.version });
          rowEl.appendChild(verEl);
        }
        el.appendChild(rowEl);
      }
    }

    // ── Anonymous accessibility eligibility (issue #1103) ─────────────────
    // The client evaluates the complete station surface at its required rating
    // against its PRIVATE profile (gui/accessibility-profile.js), blocks and
    // privately explains an ineligible direct claim (AC1), and reports ONLY the
    // anonymous ineligible station-id set to the host (AC2). The profile and the
    // functional reasons never leave the device.

    /** The required rating for a station: the in-game visiting rating when the
     *  human-seeking resolver has placed it, else the direct-claim rating, else
     *  the station's authored base rating. */
    function requiredRatingForStation(id, ratings) {
      const sim = window.simState;
      const host = sim && sim.stationHosts && sim.stationHosts[id];
      if (host && host.rating) return host.rating;
      const direct = sim && sim.stationRatings && sim.stationRatings[id];
      if (direct) return direct;
      return (ratings && ratings[0]) || '';
    }

    /** Eligibility for one lobby roster station — { eligible, reason }. The
     *  `reason` is the PRIVATE functional explanation, shown only to this
     *  player; it is never sent anywhere. */
    function stationEligibility(st) {
      const sim = window.simState;
      if (!sim || typeof window.deriveStationEligibility !== 'function') {
        return { eligible: true, reason: null };
      }
      const rating = requiredRatingForStation(st.id, st.ratings);
      const gaps = (sim.stationAssistGaps || {})[st.id];
      return window.deriveStationEligibility(sim.accessibilityProfile, gaps, rating);
    }

    /** Recompute the anonymous ineligible-station set and report it to the host.
     *  Only station ids cross the wire — no reason, no setting. */
    function computeAndSendEligibility() {
      const sim = window.simState;
      if (!sim || typeof window.deriveStationEligibility !== 'function') return;
      const gaps = sim.stationAssistGaps || {};
      const profile = sim.accessibilityProfile;
      const ineligible = [];
      const seen = new Set();
      const evalStation = (id, ratings) => {
        if (seen.has(id)) return;
        seen.add(id);
        const rating = requiredRatingForStation(id, ratings);
        const r = window.deriveStationEligibility(profile, gaps[id], rating);
        if (!r.eligible) ineligible.push(id);
      };
      // Claimable seats carry their authored ratings in the roster; any other
      // station the projection knows (auxiliary / human-seeking) is evaluated at
      // its in-game visiting rating when present, permissively otherwise.
      for (const st of (uiState.stations || [])) evalStation(st.id, st.ratings);
      for (const id of Object.keys(gaps)) evalStation(id, null);
      ineligible.sort();
      send('ReportStationEligibility', { ineligible });
    }

    // Re-report whenever the private assistance profile changes (the hook is
    // fired by gui/accessibility-profile.js after it persists the change).
    window.onAccessibilityAssistanceChanged = computeAndSendEligibility;

    /** Re-report on the messages that change a published required rating or the
     *  projection: Welcome (projection + ratings arrive) and RatingChanged. */
    function maybeReportEligibility(msg) {
      if (msg && (msg.type === 'Welcome' || msg.type === 'RatingChanged')) {
        computeAndSendEligibility();
      }
    }

    function renderLobby(s) {
      renderActiveMods();
      const list = document.getElementById('station-list');
      if (!list) return;
      // Pure selectors live in gui/lobby-view.js (issue #827); this function
      // only writes DOM. Boot race: skip the paint until the module loads —
      // the next server message re-renders.
      if (typeof window.lobbyViewModel !== 'function') return;
      const vm = window.lobbyViewModel(s, myToken, lobbyConsole, {
        labelFor: stationLabel,
        describeFor: stationDescription,
        stationRatings: window.simState ? window.simState.stationRatings : null,
        // Anonymous accessibility eligibility per row (issue #1103 AC1).
        eligibilityFor: stationEligibility,
      });
      // Detail-panel console auto-select (and clear on release) is part of
      // the view model.
      lobbyConsole = vm.selectedConsole;
      const mine = myConsoles(s);
      // #771 AC3/AC4: the armed-release confirm only exists in-progress; leaving
      // InProgress (or never being in it) disarms so lobby release is immediate.
      const inProgress = s.phase === 'InProgress';
      if (!inProgress) releaseArmed = false;
      // Shared by the row RELEASE and detail LEAVE controls. In-progress: first
      // click arms (re-render swaps to the confirm label), second click sends.
      // Lobby: immediate send. Preserves the pendingMidGameClaim reset either way.
      const releaseStation = () => {
        const step = window.releaseConfirmStep(s.phase, releaseArmed);
        releaseArmed = step.armed;
        if (!step.send) {
          scheduleRender();
          return;
        }
        pendingMidGameClaim = false;
        send('ReleaseStation');
      };

      // Station help lives in Settings; keep the lobby roster visible.
      list.style.display = '';

      list.innerHTML = '';
      for (const row of vm.rows) {
        const rowEl = document.createElement('div');
        rowEl.className = row.rowClass;

        const glyph = document.createElement('div');
        glyph.className = 'glyph';
        glyph.textContent = row.glyph;
        rowEl.appendChild(glyph);

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = row.label;
        info.appendChild(nameEl);
        const meta = document.createElement('div');
        meta.className = 'meta';
        if (row.rank) {
          const rankEl = document.createElement('span');
          rankEl.textContent = row.rank;
          meta.appendChild(rankEl);
        }
        // Post issue #619 a station carries a single (lowercase) id — the
        // station itself is the "console" for chip-rendering purposes.
        if (row.chipId) {
          const chip = document.createElement('span');
          chip.className = 'cons';
          chip.textContent = consoleLabel(row.chipId);
          meta.appendChild(chip);
        }
        info.appendChild(meta);
        // The job, before the claim (PRD #1023 module 4). Rendered for every
        // row kind — free, taken and mine — so the roster reads as a crew
        // manifest rather than a list of buttons.
        if (row.description) {
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = row.description;
          info.appendChild(desc);
        }
        if (row.occupant) {
          const occ = document.createElement('div');
          occ.className = 'occupant';
          occ.textContent = row.occupant;
          info.appendChild(occ);
        }
        rowEl.appendChild(info);

        // A free seat this player is INELIGIBLE for (issue #1103 AC1): explain
        // privately, in functional terms, right on the row. The reason is
        // local-only — it is never sent to the host or another player.
        if (row.button === 'ineligible' && row.ineligibleReason) {
          const why = document.createElement('div');
          why.className = 'ineligible-reason';
          const fns = (row.ineligibleReason.functions || [])
            .map(f => t('client.assist_function.' + f))
            .join(', ');
          why.textContent = t('client.station_ineligible_reason', { functions: fns });
          info.appendChild(why);
        }

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (row.button === 'release') {
          btn.className = 'mine-btn';
          btn.textContent = inProgress && releaseArmed ? t('client.release_confirm') : t('client.release');
          btn.addEventListener('click', () => releaseStation());
        } else if (row.button === 'taken') {
          btn.className = 'taken-btn';
          btn.textContent = t('client.taken');
          btn.disabled = true;
        } else if (row.button === 'ineligible') {
          // Blocked direct claim: the disabled control never sends SelectStation.
          btn.className = 'ineligible-btn';
          btn.textContent = t('client.station_ineligible');
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = t('client.claim');
          btn.addEventListener('click', () => {
            if (uiState.phase === 'InProgress') pendingMidGameClaim = true;
            send('SelectStation', { station: row.name });
            scheduleRender();
          });
        }
        action.appendChild(btn);
        rowEl.appendChild(action);
        list.appendChild(rowEl);
      }

      // Detail panel
      const detail = document.getElementById('detail-panel');
      if (detail) {
        const detailHeader = detail.querySelector('.detail-header');
        if (vm.detail.active) {
          detail.className = 'active';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = vm.detail.stationName;
          detailHeader.appendChild(nameSpan);
          const releaseBtn = document.createElement('button');
          releaseBtn.className = 'detail-release-btn';
          releaseBtn.textContent = inProgress && releaseArmed ? t('client.release_confirm') : t('client.leave');
          releaseBtn.addEventListener('click', () => releaseStation());
          detailHeader.appendChild(releaseBtn);
          // The same authored line the row carried, restated where the player
          // now sits (PRD #1023 module 4).
          const descEl = detail.querySelector('.detail-station-desc');
          if (descEl) descEl.textContent = vm.detail.stationDescription || '';
          const consolesArea = detail.querySelector('.detail-consoles');
          consolesArea.innerHTML = '';
          for (const c of vm.detail.consoles) {
            const chip = document.createElement('span');
            chip.className = 'chip' + (c === lobbyConsole ? ' selected' : '');
            chip.textContent = consoleLabel(c);
            chip.addEventListener('click', () => {
              lobbyConsole = c;
              scheduleRender();
            });
            consolesArea.appendChild(chip);
          }

          // Complexity toggle: purely data-driven off the station's declared
          // ratings (the view model omits it when the station only has its
          // base rating).
          const ratingsArea = detail.querySelector('.detail-ratings');
          ratingsArea.innerHTML = '';
          if (vm.detail.ratings) {
            const activeRating = vm.detail.ratings.active;
            for (const r of vm.detail.ratings.list) {
              const ratingBtn = document.createElement('button');
              ratingBtn.className = 'rating-btn' + (r === activeRating ? ' active' : '');
              ratingBtn.textContent = wireText('station.rating.' + r.toLowerCase() + '.name', r.toUpperCase());
              ratingBtn.addEventListener('click', () => {
                if (r !== activeRating) send('SetStationRating', { rating_name: r });
              });
              ratingsArea.appendChild(ratingBtn);
            }
          }
        } else {
          detail.className = 'idle';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = t('client.no_station');
          detailHeader.appendChild(nameSpan);
          const idleDesc = detail.querySelector('.detail-station-desc');
          if (idleDesc) idleDesc.textContent = '';
          detail.querySelector('.detail-consoles').innerHTML = '';
          detail.querySelector('.detail-ratings').innerHTML = '';
        }
      }

      // Header
      const crewEl = document.getElementById('crew-display');
      if (crewEl) crewEl.textContent = vm.crew.filled + '/' + vm.crew.max;
      const pill = document.getElementById('ready-pill');
      if (pill) {
        if (vm.allReady) { pill.textContent = t('client.all_crew_ready'); pill.className = 'go'; }
        else { pill.textContent = t('client.awaiting_crew'); pill.className = ''; }
      }

      // Ready button (per-player, replaces captain-only Engage)
      const readyBtn = document.getElementById('ready-btn');
      if (readyBtn) {
        if (vm.readyBtn.visible) {
          readyBtn.style.display = 'block';
          readyBtn.disabled = false;
          if (vm.readyBtn.mode === 'countdown') {
            // Countdown active — keep button in ready state, show timer.
            readyBtn.textContent = vm.readyBtn.secs + 's';
            readyBtn.className = 'armed glow';
          } else if (vm.readyBtn.mode === 'ready-confirmed') {
            readyBtn.textContent = t('client.ready_confirmed');
            readyBtn.className = 'armed glow';
          } else if (vm.readyBtn.mode === 'take-station') {
            // In-progress claiming: same SetReady{true} hand-off, relabelled
            // as Take Station (#771 AC1/AC2 — text only, sendReady unchanged).
            readyBtn.textContent = t('client.take_station');
            readyBtn.className = 'armed';
          } else {
            readyBtn.textContent = t('client.ready');
            readyBtn.className = 'armed';
          }
          readyBtn.onclick = () => send('SetReady', { ready: vm.readyBtn.sendReady });
        } else {
          readyBtn.style.display = 'none';
        }
      }

      // Spectate toggle (issue #1105): opt into / out of the explicit Spectator
      // role. 'spectate' sends SetSpectator{true} (vacate seat + unready on the
      // server); 'join' sends SetSpectator{false} to rejoin the crew.
      const spectateBtn = document.getElementById('spectate-btn');
      if (spectateBtn) {
        if (vm.spectateBtn && vm.spectateBtn.visible) {
          spectateBtn.style.display = 'block';
          const joining = vm.spectateBtn.mode === 'join';
          spectateBtn.textContent = joining ? t('client.spectator.join') : t('client.spectator.spectate');
          spectateBtn.onclick = () => send('SetSpectator', { spectator: !joining });
        } else {
          spectateBtn.style.display = 'none';
        }
      }

      // Status line
      const statusLine = document.getElementById('status-line');
      if (statusLine) {
        statusLine.textContent = t(vm.statusLine.id, vm.statusLine.params);
      }
    }

    function rebuildStations() {
      // Pure fold in gui/station-roster.js (issue #827): players + station
      // defs → roster rows + lobby aggregates. Boot race: leave the previous
      // roster in place until the module loads.
      if (typeof window.buildStationRoster === 'function') {
        const defs = (uiState.shipStations && uiState.shipStations.stations) || [];
        const roster = window.buildStationRoster(uiState.players, defs);
        uiState.stations   = roster.stations;
        uiState.maxPlayers = roster.maxPlayers;
        uiState.allFilled  = roster.allFilled;
        uiState.allReady   = roster.allReady;
      }
      uiState.countdownSecs = window.lobbyState ? window.lobbyState.countdownSecs : 0;
      scheduleRender();
    }

    // Repair UI (issue #462): the full repair affordance is owned by the
    // Repair console iframe (gui/repair-console.html), which renders the hull
    // readout + per-team dispatch buttons and sends `dispatch_repair_team`
    // itself. The pure shell-button logic ported from the old Bevy
    // `handle_repair_button_press` / `refresh_repair_button` lives in
    // gui/repair-button.js (all-busy guard, message shape, refresh states).
    // The earlier `renderRepair` / `renderRepairButtons` shell stubs targeted
    // HTML ids that were never added (orphaned Bevy-era remnants) and were
    // removed here; the iframe supersedes them.

    // -- iframe state-push helper (wraps gui/iframe-bridge.js) ----------------
    function _pushIframe(iframeEl, consoleName, stateJson) {
      // Module not loaded yet (boot race): drop the push — pushes are idempotent
      // snapshots and the next tick repeats them.
      if (typeof window.iframeBridgePush !== 'function') return;
      window.iframeBridgePush(iframeEl, consoleName, stateJson);
    }

    // -- Generic console state push (ship-agnostic) --------------------------
    // Every station id (including the aggregate cruiser/destroyer consoles like
    // `engineering` = power+repair and `science` = sensors+shields) is handled
    // generically by window.buildConsoleState(name, window.simState), which nests the
    // sub-panel payloads. Iframe ids resolve through gui/mount-plan.js (the
    // single home of the `${id}-iframe` scheme + the tactical → weapons
    // alias) so whatever iframe the current ship actually mounted is fed.
    // This is the ONLY push path (#823): handleMessage fans out through
    // pushDirtyConsoles below, and renderGame / iframe-load listeners push
    // the active console directly.
    function consoleIframeId(name) {
      return (typeof window.iframeIdFor === 'function')
        ? window.iframeIdFor(name) : (name + '-iframe');
    }

    // ── Console input-to-feedback latency (issue #1169, PRD #1144) ───────────
    // The phone measures its OWN round trip: `console-core.sendAction` stamps
    // the input event inside the console document, the dispatch below stamps the
    // hand-off to the transport, and a SERVER-CAUSED push of the issuing
    // console's payload is the acknowledgement. All three stamps are on this
    // device, so nothing here subtracts a host clock from a phone clock, and
    // only durations are reported — never a timestamp, and never a surface name
    // (the host assigns that, so a client cannot claim a series it does not own).
    //
    // WHICH push counts is the whole correctness question (issue #1169 review,
    // finding B1). `pushConsoleStateFor` is also called by a local re-render, by
    // a freshly loaded iframe, and by client-local tutorial progress; acking on
    // those records a plausible 40 ms "response" for a command a stalled data
    // channel never delivered. So every call site names its cause and
    // `ackEligible` (gui/console-latency.js, unit-tested) decides — the decision
    // deliberately does not live in this inline script.
    //
    // The meter is created lazily and tolerates its module not having executed
    // yet, exactly as `pushDirtyConsoles` tolerates `dirtyConsolesFor` missing:
    // this is diagnostic, and a dropped early sample costs nothing.
    let _latencyMeter = null;
    function latencyMeter() {
      if (_latencyMeter) return _latencyMeter;
      if (typeof window.ConsoleLatencyMeter !== 'function') return null;
      _latencyMeter = new window.ConsoleLatencyMeter();
      return _latencyMeter;
    }

    /** The `PUSH_CAUSE` vocabulary, or a safe stand-in before the module loads. */
    function pushCause() {
      return window.CONSOLE_PUSH_CAUSE || {};
    }

    /** Follow the host's flag and ship whatever has finished measuring. */
    let _latencyFlushedAt = 0;
    const LATENCY_FLUSH_MS = 2000;
    function maybeReportConsoleLatency(force) {
      const meter = latencyMeter();
      if (!meter || typeof window.isConsoleLatencyEnabled !== 'function') return;
      // The host owns the switch; a client never measures on its own initiative.
      const on = window.isConsoleLatencyEnabled(window.simState && window.simState.debugFlags);
      if (on !== meter.enabled) meter.setEnabled(on);
      if (!on) return;
      // The batching decision itself lives in gui/console-latency.js
      // (`shouldFlush`, unit-tested) rather than in this inline script: batching
      // is why measuring does not change what is measured, and `force` is the
      // teardown path where there is no next chance.
      const now = window.consoleLatencyNowMs ? window.consoleLatencyNowMs() : Date.now();
      if (typeof window.consoleLatencyShouldFlush !== 'function') return;
      const go = window.consoleLatencyShouldFlush({
        enabled: on,
        hasPayload: meter.hasPayload(),
        now,
        lastFlushedAt: _latencyFlushedAt,
        force: !!force,
        intervalMs: LATENCY_FLUSH_MS,
      });
      if (!go) return;
      const batch = meter.drain();
      _latencyFlushedAt = now;
      const msg = window.consoleLatencyMessage(batch.samples, batch.expired);
      send(msg.type, msg.data);
    }

    // Ship what has been measured before the page goes away (issue #1169 review).
    // `pagehide` is the reliable teardown signal on mobile Safari, where `unload`
    // never fires; `visibilitychange` to hidden covers a backgrounded tab the OS
    // may never resume. Without these, up to a flush interval of real
    // measurements is lost exactly when a player puts the phone down.
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pagehide', () => maybeReportConsoleLatency(true));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') maybeReportConsoleLatency(true);
      });
    }

    /**
     * Push one console's payload to its iframe.
     *
     * `cause` is a `PUSH_CAUSE` value naming WHY (issue #1169): only
     * `SERVER_MESSAGE` — an inbound host message that carried or dirtied state
     * for this console — may acknowledge a pending action. Omitting it is
     * treated as non-acknowledging, so a future call site that forgets
     * under-reports rather than fabricating samples.
     */
    function pushConsoleStateFor(name, cause) {
      if (!name) return;
      const json = (typeof window.buildConsoleState === 'function' && window.simState)
        ? window.buildConsoleState(name, window.simState)
        : '{}';
      _pushIframe($(consoleIframeId(name)), name, json);
      const meter = latencyMeter();
      if (meter) meter.noteAck(name, cause);
    }

    function pushActiveConsoleState(cause) {
      pushConsoleStateFor(activeConsole, cause);
    }

    // Resolve the active console's iframe the same way pushConsoleStateFor
    // does, so the relay always follows whatever iframe this ship mounted.
    function activeConsoleIframe() {
      if (!activeConsole) return null;
      return $(consoleIframeId(activeConsole));
    }

    // Send the host's key events to the active console, so helm's WASD/arrows,
    // Ctrl impulse and Shift boost keep working after a click on the tab bar or
    // any other host chrome moved focus out of the console iframe. Called from
    // the DOMContentLoaded gate below, once the deferred modules have run.
    function installConsoleKeyRelay() {
      if (typeof window.installKeyRelay !== 'function') return;
      window.installKeyRelay(document, () => {
        const el = activeConsoleIframe();
        try { return el && el.contentDocument; } catch (_) { return null; }
      });
    }

    // -- Message-driven console refresh (issue #823) --------------------------
    // The per-console build*/push*ConsoleState wrapper pairs that used to live
    // here were deleted: handleMessage() now computes which consoles a message
    // dirties via the declarative table in gui/dirty-consoles.js and pushes
    // each through the generic pushConsoleStateFor above. Pushes are gated on
    // the console being active, except Stations projected from the
    // unconditional Console Families in dirty-consoles.js
    // (captain — its push was always unconditional).
    function pushDirtyConsoles(msg) {
      // Boot race: the module scripts may not have executed yet — drop the
      // fan-out; pushes are idempotent snapshots and the next message repeats
      // them (same tolerance as _pushIframe / pushConsoleStateFor).
      if (typeof window.dirtyConsolesFor !== 'function') return;
      const stationSystems = window.simState ? window.simState.stationSystems : null;
      const systemConsoleFamilies = window.simState ? window.simState.systemConsoleFamilies : null;
      const blackboardConsoleFamilies = window.simState ? window.simState.blackboardConsoleFamilies : null;
      const alwaysPush = window.alwaysPushConsoles
        ? window.alwaysPushConsoles(stationSystems, systemConsoleFamilies)
        : new Set();
      for (const name of window.dirtyConsolesFor(
        msg,
        stationSystems,
        systemConsoleFamilies,
        blackboardConsoleFamilies,
      )) {
        // The one acknowledging push (issue #1169): this fan-out runs only for
        // consoles an INBOUND host message dirtied, which is exactly the
        // causality `send_to_ack` claims.
        if (alwaysPush.has(name) || activeConsole === name) {
          pushConsoleStateFor(name, pushCause().SERVER_MESSAGE);
        }
      }
    }

    // Attach on-load listener for an iframe that was created dynamically by
    // mountConsoles(). Each iframe re-pushes its console state on load so it
    // receives the current snapshot even after a reload or late mount.
    // consoleName must be the lowercase station id.
    function _attachIframeLoadListener(iframeEl, consoleName) {
      if (!iframeEl) return;
      iframeEl.addEventListener('load', () => {
        // Push the freshly-loaded iframe its current snapshot. Generic so it
        // covers every station id the ship mounts (including engineering /
        // science aggregates the old per-name switch never handled).
        // NOT an acknowledgement (issue #1169): a reloaded iframe is handed a
        // snapshot that may be seconds old and owes nothing to the host having
        // answered anything.
        pushConsoleStateFor(consoleName, pushCause().IFRAME_LOAD);
        // Re-apply the private Accessibility profile to this same-origin console
        // now that its document has (re)loaded — a reload otherwise resets the
        // iframe :root, losing the text-scale var until the next apply (#1102).
        if (typeof window.applyAccessibilityProfile === 'function') {
          window.applyAccessibilityProfile({ iframes: [iframeEl] });
        }
      });
    }

    function renderGame(s) {
      // Refresh whichever console is currently visible. This is ship-agnostic:
      // it covers the aggregate cruiser/destroyer consoles (engineering,
      // science, …) as well as the standalone ones — all resolve to their
      // iframe via the registry.
      // NOT an acknowledgement (issue #1169): a render fires on rotation,
      // resize and tab switches, none of which mean the host answered.
      pushActiveConsoleState(pushCause().RENDER);
    }

    function renderStationHero(s, inGame) {
      const root = $('station-hero');
      const tabsEl = $('station-hero-tabs');
      if (!root || !tabsEl || typeof window.heroBarModel !== 'function'
          || typeof window.renderHeroBarDom !== 'function') return;
      const model = window.heroBarModel({
        directStation: playerStation(s),
        stations: (s.shipStations && s.shipStations.stations) || [],
        stationSystems: window.simState && window.simState.stationSystems,
        blackboards: window.simState && window.simState.blackboards,
        stationHosts: window.simState && window.simState.stationHosts,
        stationHealth: window.simState && window.simState.stationHealth,
        stationImportance: window.simState && window.simState.stationImportance,
        stationRatings: window.simState && window.simState.stationRatings,
        activeStation: activeConsole,
      });
      const heroVisible = !!(inGame && model.tabs.length);
      root.setAttribute('aria-hidden', heroVisible ? 'false' : 'true');
      root.parentElement?.classList.toggle('station-hero-visible', heroVisible);
      if (!inGame || !model.tabs.length) return;
      window.renderHeroBarDom({
        tabsEl,
        titleEl: $('station-hero-title'),
        ratingEl: $('station-hero-rating'),
        aiEl: $('station-hero-ai'),
        model,
        translate: t,
        onActivate: stationId => {
          setActiveConsole(stationId);
          // Tell the host this Station's tab was visited (issue #1101), so it
          // clears the one-off `unread` importance flag authoritatively through
          // the next SimState — NOT an optimistic local clear. In-game only:
          // renderStationHero returns early outside a live game, so onActivate
          // never fires in the lobby. A continuing `critical` condition is
          // immune host-side, so this cannot lower an alert.
          send('StationVisited', { station: stationId });
          scheduleRender();
        },
      });
    }

    // -- Coordination popup (issue #494) ---------------------------------------
    let coordinationPopupTimer = null;
      function showCoordinationPopup(payload, sender_label, target_label) {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      const fromEl = document.getElementById('popup-from');
      const arrowEl = document.getElementById('popup-arrow');
      const toEl = document.getElementById('popup-to');
      const colonEl = document.getElementById('popup-colon');
      const titleEl = document.getElementById('popup-title');
      const bodyEl = document.getElementById('popup-body');
      if (!fromEl || !arrowEl || !toEl || !colonEl || !titleEl || !bodyEl) return;
      // Payload → { sender, title, body } normalisation is pure and lives in
      // gui/coordination-popup.js (issue #827); only the DOM writes and the
      // auto-dismiss timer stay here.
      if (typeof window.normalizeCoordinationPayload !== 'function') return;
        const norm = window.normalizeCoordinationPayload(payload, sender_label, target_label);
      fromEl.textContent = `[${norm.from}]`;
      arrowEl.textContent = norm.to ? ' → ' : '';
      toEl.textContent = norm.to ? `[${norm.to}]` : '';
      colonEl.textContent = ':';
      titleEl.textContent = norm.title;
      bodyEl.textContent = norm.body;
      el.style.display = 'block';
      if (coordinationPopupTimer) clearTimeout(coordinationPopupTimer);
      coordinationPopupTimer = setTimeout(dismissCoordinationPopup, 8000);
    }
    function dismissCoordinationPopup() {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      el.style.display = 'none';
      if (coordinationPopupTimer) {
        clearTimeout(coordinationPopupTimer);
        coordinationPopupTimer = null;
      }
    }

    // -- Dynamic console mounting (Module H / issues #621, #827) ---------------
    // Called after a Welcome message updates uiState.shipStations.
    // gui/mount-plan.js decides WHAT to mount (station id → section/iframe
    // ids + URL, tactical alias included); this loop only creates the DOM.
    // Stations not present on this ship have no DOM elements, keeping the DOM
    // minimal and matching only what the current ship configuration provides.
    function mountConsoles(shipStations) {
      const container = $('console-container');
      if (!container) return;
      // The mount seam lives in gui/console-mount.js (issues #827, #1099): it
      // owns node creation (via gui/mount-plan.js planMounts) so the iframe
      // nodes it creates are the persistent ones a tab switch must preserve.
      // We attach the per-iframe load listener here so the iframe re-pushes
      // state after load/reload.
      if (typeof window.mountConsolesDom === 'function') {
        window.mountConsolesDom(document, container, shipStations,
          (iframe, mount) => _attachIframeLoadListener(iframe, mount.stationId));
      }
    }

    // -- Console action postMessage bridge (issue #422) ------------------------
    // All iframe consoles send {type:'console_action', payload:json} via
    // postMessage.  Dispatch is table-driven via gui/action-map.js (issue #455).
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'console_action') return;
      let action;
      try { action = JSON.parse(event.data.payload); } catch (_) { return; }
      if (!action || !action.action) return;
      // Contextual tutorial progress (issue #916): every console action feeds
      // the client-local progress store — using a control completes its
      // `control_unused` overlays — and `tutorial_dismiss` is handled
      // entirely client-side (presentation state, never forwarded to the
      // host). On change, re-push the acting console so the overlay advances
      // immediately rather than waiting for the next server message.
      if (window.simState && typeof window.applyTutorialAction === 'function') {
        let tutStorage = null;
        try { tutStorage = window.localStorage; } catch (_) { /* privacy mode */ }
        const tut = window.applyTutorialAction(window.simState, action, tutStorage);
        // NOT an acknowledgement (issue #1169): tutorial progress is entirely
        // client-local and never leaves the device.
        if (tut.changed) pushConsoleStateFor(action.console || activeConsole, pushCause().TUTORIAL);
        if (tut.handled) return;
      }
      if (typeof window.dispatchConsoleAction === 'function') {
        // Console-latency dispatch stamp (issue #1169), taken immediately before
        // the envelope reaches the transport so `input_to_send` covers exactly
        // the client-local hop — the console's postMessage plus the action-map
        // lookup — and nothing else. `action.__input_ms` is the console
        // document's own stamp and stops here; the action map builds its
        // outbound `ClientMessage` from named fields, so it never crosses the
        // wire.
        const meter = latencyMeter();
        if (meter) meter.noteDispatch(action.action, action.console || activeConsole, action.__input_ms);
        // Optimistic local patches (weaponsTarget / sensorsTarget) land on the
        // one sim store; simState.weaponsTarget has a setter for this path.
        window.dispatchConsoleAction(action, send, (patch) => {
          if (window.simState) Object.assign(window.simState, patch);
        });
        return;
      }
      // Fallback for the rare race window before module scripts load.
      // Only covers set_sensors_target (mutates local state); other actions
      // are silently deferred (non-critical — they arrive after module load).
      if (action.action === 'set_sensors_target' && action.uuid) {
        if (window.simState) window.simState.sensorsTarget = action.uuid;
        send('ControlSystem', {
          target: 'sensors',
          payload: { type: 'SetScienceTarget', data: { uuid: action.uuid } },
        });
      } else if (action.action === 'set_navigation_waypoint'
          && Number.isFinite(action.x)
          && Number.isFinite(action.z)) {
        send('ControlSystem', {
          target: 'navigation',
          payload: { type: 'SetNavigationWaypoint', data: { x: action.x, z: action.z } },
        });
      } else if (action.action === 'clear_navigation_waypoint') {
        send('ControlSystem', {
          target: 'navigation',
          payload: { type: 'ClearNavigationWaypoint' },
        });
      }
    });

    // -- Event wiring --------------------------------------------

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        sessionStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    // Engage button, view selector, Red Alert button, and helm joystick all
    // live in the per-console iframe pages (gui/*-console.html); the old
    // Bevy WASM client console UIs (#47–#49) were retired with the pure-JS
    // client migration.

    // Orientation watching (resize + orientationchange ? recompute the
    // singleton and rerender so console CSS re-flows) lives in
    // gui/device-orientation.js, which owns window.currentOrientation().

    // -- Incoming message handler --------------------------------

    function handleMessage(msg) {
      // The host has said something, so the console's panels are showing real
      // numbers rather than their empty shape — it may leave CONNECTING (PRD
      // #1023 user story 15). Any message counts: the point is that the link
      // is carrying traffic, not which traffic.
      if (msg && !linkHasData) { linkHasData = true; scheduleRender(); }
      // JS state modules (issue #460) — every inbound ServerMessage is applied
      // to the pure state modules first. window.simState is the ONLY sim
      // store (issue #819): the console builders read it directly. Guards
      // cover the brief window before the module scripts have executed.
      if (window.lobbyState)      window.lobbyState.apply(msg);
      if (window.simState)        window.simState.apply(msg);
      if (window.commsState)      window.commsState.apply(msg);
      // The QR-first ScenarioCatalog message (issue #755) is not part of the
      // client-router case table, so force a render to (re)draw the picker.
      if (msg && msg.type === 'ScenarioCatalog') { settleScenarioPick(); scheduleRender(); }
      // The host's debug/session read-back (issue #940) only arrives on change,
      // and it is the one push that can change what an OPEN settings panel
      // shows — so repaint here rather than from the render loop, which would
      // rebuild the volume slider out from under a dragging finger.
      if (msg && msg.type === 'DebugState' && settingsPanel) settingsPanel.rebuildContent();
      // Declarative iframe fan-out (#823): gui/dirty-consoles.js maps the
      // message to the console names to re-push. Runs after the state applies
      // above so every push carries fresh data. On Welcome the consoles are
      // (re)mounted AFTER this fan-out — that is fine: each iframe's load
      // listener re-pushes its snapshot once it actually loads.
      pushDirtyConsoles(msg);
      // Per-case routing is pure and lives in gui/client-router.js (issue
      // #827): it applies the uiState mutations and hands back a side-effect
      // plan for the DOM glue below. Boot race: modules run before
      // DOMContentLoaded and the connection waits for it, so routeMessage is
      // present for every real message; drop otherwise (next message repeats).
      if (typeof window.routeMessage !== 'function') return;
      const result = window.routeMessage(msg, {
        uiState,
        myToken,
        pendingMidGameClaim,
        bezelAlertOn,
        lobbyState: window.lobbyState || null,
        redAlert: !!(window.simState && window.simState.redAlert),
      });
      pendingMidGameClaim = result.pendingMidGameClaim;
      bezelAlertOn = result.bezelAlertOn;
      if (result.myName !== undefined) myName = result.myName;
      for (const fx of result.sideEffects) applySideEffect(fx);
      if (result.rebuildStations) rebuildStations();
      // Re-derive and report anonymous eligibility AFTER the roster/projection/
      // ratings have folded in (issue #1103): only the ineligible station-id set
      // — no reason, no setting — goes back to the host.
      maybeReportEligibility(msg);
      // Console input-to-feedback latency (issue #1169), on the same "report a
      // locally-derived minimum" footing as the eligibility report above: only
      // durations this device measured for itself leave the phone, batched.
      // Driven off inbound traffic rather than a timer so a disconnected phone
      // stops reporting by itself.
      maybeReportConsoleLatency();
      if (result.shouldRender) scheduleRender();
    }

    // DOM side effects named by the router (see gui/client-router.js for the
    // catalogue). Everything here is a plain element write.
    function applySideEffect(fx) {
      switch (fx.effect) {
        case 'mount-consoles':
          mountConsoles(fx.shipStations);
          break;
        case 'ship-theme': {
          // Inject ship theme CSS from Welcome ship_css (Fix: Module F).
          let linkEl = document.getElementById('ship-theme-css');
          if (!linkEl) {
            linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.id = 'ship-theme-css';
            document.head.appendChild(linkEl);
          }
          linkEl.href = fx.href;
          break;
        }
        case 'ship-info': {
          const nameEl2 = document.getElementById('ship-name');
          const missionEl = document.getElementById('ship-mission');
          if (nameEl2) nameEl2.textContent = fx.title;
          if (missionEl) missionEl.textContent = fx.description;
          break;
        }
        case 'status':
          setStatus(t(fx.id));
          break;
        case 'hide-loading': {
          const loadingEl = document.getElementById('asset-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          break;
        }
        case 'show-loading': {
          const pctEl = document.getElementById('asset-loading-pct');
          const assetEl = document.getElementById('asset-loading');
          if (assetEl) assetEl.style.display = 'flex';
          if (pctEl) pctEl.textContent = String(fx.pct);
          break;
        }
        case 'bezel-alert':
          applyBezelAlert(fx.on);
          break;
        case 'vibrate':
          if (navigator.vibrate) navigator.vibrate(fx.duration);
          break;
        case 'coordination-popup':
            showCoordinationPopup(fx.payload, fx.senderLabel, fx.targetLabel);
          break;
      }
    }

    // -- PeerJS connection (extracted to gui/connection-manager.js, issue #603) --

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus(t('client.status_no_host_id'));
    } else {
      (async () => {
        // Gate on DOMContentLoaded before touching any module-dependent state.
        // See the comment above the original gate for the full rationale.
        if (document.readyState === 'loading') {
          await new Promise(resolve =>
            document.addEventListener('DOMContentLoaded', resolve, { once: true }));
        }

        // Resolve this tab's session token now that all deferred modules have
        // run. Each tab gets its own token, which is what lets several clients
        // on one desktop connect as distinct players. The inline branch is a
        // last-ditch fallback for the rare case the module genuinely failed to
        // load.
        myToken = (typeof window.installSessionToken === 'function')
          ? window.installSessionToken()
          : (() => {
              let t = sessionStorage.getItem('session-token');
              if (!t) {
                t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                  .map(b => b.toString(16).padStart(2, '0')).join('');
                sessionStorage.setItem('session-token', t);
              }
              return t;
            })();
        console.log(`[client] session token ${myToken.slice(0, 8)}`);

        installConsoleKeyRelay();

        // Mount the settings panel (gear button + overlay) once state is ready.
        // Provide send, a getState closure, and the UI click audio element.
        if (typeof window.mountSettings === 'function') {
          settingsPanel = window.mountSettings({
            send: (type, data) => send(type, data),
            // Station roster from the lobby mirror; the active rating and the
            // host's debug read-back (issue #940) live in the sim store,
            // composed here so the panel sees one object.
            getState: () => ({
              ...uiState,
              stationRatings: window.simState ? window.simState.stationRatings : {},
              debugFlags: window.simState ? window.simState.debugFlags : null,
              // Private Accessibility profile (issue #1102); the tab paints the
              // player's explicit choices from it. Client-local, never on the wire.
              accessibilityProfile: window.simState ? window.simState.accessibilityProfile : null,
            }),
            // The Accessibility tab's write path (issue #1102): update the
            // client-local profile, persist it privately, and re-apply to the
            // shell + every mounted console iframe. Deliberately NOT `send` —
            // no accessibility setting ever becomes a ClientMessage (AC5).
            onAccessibility: (effect, value) => {
              if (typeof window.setAccessibilityPresentation === 'function') {
                window.setAccessibilityPresentation(effect, value);
              }
            },
            // Every audio channel this page owns. Master volume scales each
            // element's own authored level rather than replacing it, so adding
            // a channel here needs no other change (issue #940).
            audioEls: [document.getElementById('ui-click')],
            getManual: () => (window.simState ? window.simState.shipManual : null),
            myToken: myToken,
          });
        }

        // Apply the private Accessibility profile to the shell at boot (issue
        // #1102). Console iframes are (re)covered as they mount and on every
        // iframe load — see mountConsoles / _attachIframeLoadListener.
        if (typeof window.applyAccessibilityProfile === 'function') {
          window.applyAccessibilityProfile();
        }

        console.log('[PeerJS] fetching ICE servers');
        const { servers: iceServers, relayAvailable, relaySource } = await window.fetchIceServers();
        console.log('[PeerJS] ICE config:', iceServers.map(s => s.urls));

        // Connection diagnostics readout (#conn-diag). A phone stuck behind
        // CGNAT shows "connecting…" forever with the real story buried in an
        // unreachable console — this mirrors the relay + ICE stage on screen.
        //
        // writeDiagLines is the shared mechanical half from gui/page-chrome.js
        // (issue #1227) — guard for a missing #conn-diag, join, set
        // textContent. The line-building logic here (this device's own relay
        // probe + ICE attempt history) is client-specific and stays local;
        // see that module's doc comment for why it isn't unified with
        // server.html's own renderConnDiag. diagEl itself is still looked up
        // directly below for the show/hide toggle, which isn't part of the
        // shared renderer's job.
        const diagEl = document.getElementById('conn-diag');
        // _pageChrome can still be null here: this async function resumes
        // after the fetchIceServers() await, and nothing guarantees the
        // page-chrome module island has mounted (fired
        // window.__pageChromeReady) by then — the other three bridge calls
        // above all guard the same race. mountConnDiag returns a value
        // rather than firing a queueable side effect, so a no-op fallback
        // (not the queue) is the guard here.
        const writeDiagLines = _pageChrome ? _pageChrome.mountConnDiag('conn-diag') : () => {};
        const diag = { attempt: 0, ice: '', types: [], probe: null, relayAvailable, relaySource };
        function renderDiag() {
          const lines = [];
          if (!diag.relayAvailable) lines.push(t('client.diag_no_relay'));
          else if (diag.probe === 'unreachable') lines.push(t('client.diag_relay_fail'));
          else if (diag.relaySource === 'openrelay') {
            lines.push(diag.probe === 'reachable'
              ? t('client.diag_relay_fallback_ok')
              : t('client.diag_relay_fallback'));
          }
          else if (diag.probe === 'reachable') lines.push(t('client.diag_relay_ok'));
          if (diag.attempt > 0) {
            lines.push(t('client.diag_stage', {
              attempt: diag.attempt,
              ice: diag.ice || '—',
              types: diag.types.length ? diag.types.join(', ') : t('client.diag_none'),
            }));
          }
          writeDiagLines(lines);
        }
        renderDiag();
        if (relayAvailable && typeof window.probeTurnRelay === 'function') {
          window.probeTurnRelay(iceServers).then(verdict => {
            console.log('[ICE] relay probe:', verdict);
            diag.probe = verdict;
            renderDiag();
          });
        }

        if (typeof window.connectionManager === 'undefined') {
          console.warn('[client] connection-manager module not loaded; falling back to inline Peer setup');
          return;
        }

        window.connectionManager.connect(hostPeerId, {
          iceServers,
          getIdent: () => ({ token: myToken, name: myName }),
          onData: handleMessage,
          onStatus: (state) => {
            setConnectionStatus(state);
            // The console's live/connecting/dead treatment is part of render()
            // (PRD #1023 module 4); a status change has to repaint it.
            scheduleRender();
            // Diagnostics only matter while the link is down; hide them once
            // the DataChannel is up so they don't sit under the lobby.
            if (diagEl) diagEl.style.display = state === 'ready' ? 'none' : '';
            if (state === 'ready') {
              acquireWakeLock();
              setStatus(t('client.status_waiting_server'));
            } else if (state === 'connecting') {
              setStatus(t('client.status_connecting_host'));
            } else if (state === 'disconnected') {
              releaseWakeLock();
              setStatus(t('client.status_disconnected'));
            } else if (state === 'error') {
              releaseWakeLock();
              setStatus(t('client.status_unreachable'));
            }
          },
          onError: (type) => {
            if (type === 'peer-unavailable') {
              setStatus(t('client.status_host_not_found'));
            } else {
              setStatus(t('client.status_peer_error', { type: type }));
            }
          },
          onLog: (msg) => console.log(msg),
          onDiag: (e) => {
            if (e.event === 'attempt') { diag.attempt = e.attempt; diag.ice = ''; diag.types = []; }
            else if (e.event === 'ice-state') diag.ice = e.state;
            else if (e.event === 'candidates') diag.types = e.types;
            else if (e.event === 'timeout') diag.ice = 'timeout';
            else if (e.event === 'open') diag.ice = 'connected';
            renderDiag();
          },
        });
      })();
    }</script>
</body>
</html>

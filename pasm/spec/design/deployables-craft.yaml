entities:
  - decision: redesign-deployables-ordinary-entity-lifecycle
    core:
      status: accepted
      confidence: confirmed
      title: Deployables Use Ordinary Actual Entities and Systems
      summary: "Increment 19 adopts finite probes/turrets/decoys, carried combat/utility craft, mines, supply/work drones and optional energy/shield support through common actual entity/System/job/resource/damage rules. Direct human piloting, per-family simulations and a universal construction interface are excluded."
      rationale:
        - "Selected G061 and S013/S017/S019/S061/S083–84/S086/S092–94/S100–101; detailed scope/evidence lives in docs/gameplay-redesign/implementation/increment-19.md. Static work may follow 15 initial integration/targeted checks after 19/20 custody adoption. Remote/carried craft join 16/18, deception 17, passengers 20; full completion requires verified 16/17/18 exits. Preparation starts no runtime."
        - "[ai] First actual battery-only engineless probe performs physical deploy, dated sensor acquisition and recovery, then a finite-round stationary turret reuses the same lifecycle. Actual entity/config/spawn, energy/damage, jobs/navigation, portable condition and Stock owners remain authoritative. 15 emitted-shot carriers are not craft storage or an operable deployable."
        - "[ai] Battery-only equipment uses the same EnergyNetwork with explicitly zero sustainable generation, finite source/local reserves and existing paid work/losses. Initial validation and profile reconfiguration accept zero generation but retain all finite nonnegative output/ramp/reserve/thermal checks. Existing powered profiles do not change. An actual authored finite probe consumes this capability; this prerequisite does not itself complete physical deployment/recovery."
  - decision: redesign-deployables-one-identity-and-shared-custody
    core:
      status: accepted
      confidence: confirmed
      title: Carried and Deployed State Preserve One Physical Asset
      summary: "One stable actual craft/deployable retains equipment, reserves, condition and lifecycle across carried/launching/deployed/recovering/lost states. Initial storage retains its ordinary entity/continuation owner with explicit nonspatial inactive capability; bay occupancy derives from location, without a parallel mutable blueprint/count."
      rationale:
        - "[ai] Stage actual source/access/readiness/exclusive job/compatible receiving space before the next executable step. Paid work/refusal/recall follows actual job/cursor/flight without teleport, duplicate ID, refill, healed replacement or retroactive refund. Portable EMP/resistance ages against causal time even while stored; emitted rounds retain their actual flight owner."
        - "[ai] Shared 19/20 custody assigns craft/deployment/motion/capacity to 19 and actual people/team identity/condition/location to 20. Passenger views derive from one custody record; existing navigation owns crossings. A delivered team and its shuttle retain distinct exclusive commitments, with later extraction requiring actual transport/travel/capacity. 16 receipts are not physical handoffs."
        - "[ai] First physical probe support is battery-only, engineless and childless with no weapons/passengers. Canonical Carried(parent,bay) or Deployed location retains the actual entity; one actual BayJob alone owns launch/recovery work and derives transitional views. Finite compatible bay allocation is disjoint from cargo/locker space. Handling uses actual installed/source/Operation/access/Power and finite authored stopped-parent speed threshold, with no fake Helm or second integrator."
        - "[ai] Simulation owns sole ProbeCustody, derived Disabled and actual backend presence without renderer features. Presentation reads that same public custody owner with Allow<Disabled> to derive same-entity Hidden/Inherited before extraction; Visibility is never canonical or a Simulation dependency. Headless backend and Presentation visual witnesses remain separate from physical-device/GPU acceptance."
        - "[ai] Stored presence is derived, not another inventory: explicit backend detachment/reinitialization and canonical stored-query participation must be proved on the actual probe. Passive reserve/condition/thermal/absolute EMP aging continues while active work/generation/acquisition stops; existing no-work Broad loss withdraws current support without discarding or refreshing held history. Same identity, reserves and physical state survive recovery/release."
        - "[ai] Actual parent removal transactionally loses actual Carried craft through the same ordinary cleanup/event boundary; Deployed craft survive, and disabled present parents only block handling. No free ejection, clone or hidden orphan is permitted. Bulk restore suppresses gameplay cascades and preflights complete parent/bay/craft/jobs/claims/location/capacity/clock before writes; unsupported contained-craft single-row inverse refuses before creation. Actual removal/backend/passive-aging and fresh JSON 360/no-write tests are probe-consumer evidence, not a general craft/passenger exit."
        - "[ai] First seam uses actual CraftBay(id,power_input,BayConfig), ProbeProfile occupied space, and ordinary LaunchCraft/RecoverCraft/CancelCraftHandling. Own stored ID is legitimate bay knowledge; recovery requires exact current permitted contact. Initial World-row carried_by(parent,bay) resolves within the actual spawn chain before gameplay/publication. Conditional, layered and runtime Carried recipes refuse before materialization initially; no bootstrap operating frame or second identity registry."
        - "[ai] Sensor-only recovery loss pauses the same Job/claim without a destruction inference. Actual bound craft removal settles active work once as Failed through the normal removal hook, with no refund or new remote truth report. The optional positive Bay tree selects the first stable own stored craft from safe local readiness and emits ordinary Launch; default policies Hold."
        - "[ai] Voluntary CancelCraftHandling terminally settles the same Job as Cancelled, retaining performed work in that record, releasing its receiving claim and leaving actual custody unchanged without refund. A later assignment is a new JobId/full requirement. Ordinary condition/motion/access/power interruption instead pauses and resumes the same active work; Cancel never holds a bay hostage."
        - "[ai] First fixed handled probe reuses existing ShipPhysics as its sole captured/digested XYZ/yaw owner, with zero finite forward/lateral/vertical velocity. Actual bay completion writes release pose once alongside the sanctioned Dock mechanical writer; ordinary position sync projects it. No Ship/PhysicsConfig/Helm/propulsion/integrator or duplicate CraftPose is installed, and saved-candidate preflight enforces the fixed-probe boundary."
        - "[ai] Initial custody preserves ordinary ship tags. Carried GameStart craft follows explicit unconditional crew slot rows and cannot be selected/mapped as a crew hull; ambiguous predecessors refuse and actual bootstrap repeats the crew-placement gate before mint. No classification workaround or active bootstrap frame is permitted."
        - "[ai] The same Bay Job advances paid work after Dock motion in Modifiers. Ready work retains actual custody until the next end-Physics CommitCraftHandling boundary, rechecking actual motion/source/Operation/access/recovery contact/range/space before one location/pose transition. Existing Rapier SyncBackend then removes or initializes handles before Damage; blocked ready work is not charged again. No pending queue, extra saved phase or extra physics step is introduced."
        - "[ai] Visible first probe support permits the existing same-entity procedural primitive render path. Descendant-producing GLB/rig/light/celestial profiles remain unsupported and are refused by actual materialization validation; no extra child/presence registry is introduced. Actual visible deployment/stow/release must be proved on this supported path."
  - decision: redesign-deployables-link-loss-and-special-consumers
    core:
      status: accepted
      confidence: confirmed
      title: Onboard Work and Dated Evidence Survive Link Loss Honestly
      summary: "Craft retain ordinary individual System AI and accepted onboard work after link loss. 16 validity/supersession and returned receipts constrain new instructions. 14 sensor owners retain original dated gap history; parent operators receive only legitimately delivered data, not hidden remote progress/pose or another catch-up store."
      rationale:
        - "Mines use actual local trigger/sensing/identification and physical payload, not hidden faction truth or friendly blast immunity. Indiscriminate variants remain possible. 17 decoys are actual short-lived engineless battery/spoofer ships, distinct from apparent report geometry."
        - "S092 standing deliveries use actual cargo, reserve goals, viable jobs and destination capacity without all-future reservations or gifts. S093 work craft repair/deploy carried equipment, not general new-entity fabrication. S094 permits real compatible energy/shield assistance only; component repair remains teams/work craft. 20 supplies actual rescue/Medical/participant continuation and pods retain equipment-backed signalling plus pickup."
  - decision: redesign-deployables-authoring-and-continuation
    core:
      status: accepted
      confidence: confirmed
      title: Deployment and Sorties Are Authorable and Conserved Through Restore
      summary: "Accepted Workshop ordinary profiles/bays/tools/triggers/goals/feeds use existing history/includes/Preview/Test. Full-candidate parent/craft/personnel identity, phase/location, exclusive job/space, profile/order/clock validation precedes writes. Canonical physical and information owners are captured once; foundation commits are not verified craft/passenger exits."
      rationale:
        - "[ai] Human/ordinary AI paid deploy/flight/return/transfer/link-gap checkpoints require at least 360 fresh JSON complete capture/digest comparisons and different-LocalShip peers, plus missing-parent/blocked-space/tampered no-write cases. No reset of resources/condition/identity, no phantom remote knowledge. Shipped content, physical browser/native/Workshop, performance/combat/sortie and 2/4/6/8-human workload acceptance remain separate."

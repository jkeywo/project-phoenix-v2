# Reusable first maintenance domain for actual Cruiser-family equipment.
# Methods describe compatible team capacity, never current damage/stock facts.
[domain]
format=1
id="maintenance"
exports=["maintain"]
requires=["repair_internal","delivery_local"]

[[task]]
kind="compound"
id="maintain"
parameters=[{name="actor",kind="actor"}]
[[task.method]]
id="spare-team"
step=[{id="restore",task="restore-room",arguments={actor={source="parameter",name="actor"},team={source="literal",value={kind="team",value=1}}}},{id="resupply",task="supply-rounds",arguments={actor={source="parameter",name="actor"}}}]
edge=[{from="restore",to="resupply",when={kind="achieved"}}]
[[task.method]]
id="primary-team"
step=[{id="restore",task="restore-room",arguments={actor={source="parameter",name="actor"},team={source="literal",value={kind="team",value=0}}}},{id="resupply",task="supply-rounds",arguments={actor={source="parameter",name="actor"}}}]
edge=[{from="restore",to="resupply",when={kind="achieved"}}]

[[task]]
kind="primitive"
id="restore-room"
parameters=[{name="actor",kind="actor"},{name="team",kind="team"}]
definition="restoration"
[task.request]
kind="repair"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="repair"}}
team={source="parameter",name="team"}
request={source="literal",value={kind="repair_request",value={type="Work",data={kind="compartment",compartment="engineering"}}}}
target={source="literal",value={kind="repair_target",value={kind="compartment",compartment="engineering"}}}
goal={source="literal",value={kind="repair_goal",value="structure"}}

[[task]]
kind="primitive"
id="supply-rounds"
parameters=[{name="actor",kind="actor"}]
definition="delivery"
[task.request]
kind="delivery"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="logistics"}}
source={source="literal",value={kind="store",value="hold-ammunition"}}
destination={source="literal",value={kind="store",value="magazine"}}
commodity={source="literal",value={kind="commodity",value="torpedoes"}}
amount={source="literal",value={kind="quantity",value=4}}

[[situation_definition]]
id="restoration"
initial="useful"
[[situation_definition.state]]
id="useful"
when={kind="achieved"}
next="returned"
[[situation_definition.state]]
id="returned"
when={kind="settled",outcome="cancelled"}

[[situation_definition]]
id="delivery"
initial="received"
[[situation_definition.state]]
id="received"
when={kind="received"}

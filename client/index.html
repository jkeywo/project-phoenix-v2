        const bezel0 = $('phone-bezel');
        if (bezel0) bezel0.setAttribute('aria-hidden', 'true');
        renderScenarioPicker();
        return;
      }

      // Phase ? section visibility (pure JS module, gui/phase-toggle.js).
      // Falls back to a local check if the module hasn't loaded yet so the
      // first paint isn't blank — module load races init on slow networks.
      const vis = (typeof window.sectionVisibility === 'function')
        ? window.sectionVisibility(s.phase)
        : { lobby: s.phase !== 'InProgress' && s.phase !== 'GameOver',
            game: s.phase === 'InProgress' || s.phase === 'GameOver',
            bezel: s.phase === 'InProgress' || s.phase === 'GameOver' };
      const mine = myConsoles(s);
      // An explicit Spectator (issue #1105) gets the crew-public summary surface
      // instead of the station-select lobby OR the game shell. Checked first so
      // it wins over the mid-game-claimant lobby override below.
      const spectating = spectatingInGame(s);
      // Pending mid-game claimants (and stationless non-spectators) stay in the
      // lobby. Ready is the point where the server hands the station over from AI.
      if (spectating) {
        vis.lobby = false; vis.game = false; vis.bezel = false;
      } else if (showingLobbyDuringGame(s)) {
        vis.lobby = true; vis.game = false; vis.bezel = false;
      }
      const specSection = $('spectator-ui');
      if (specSection) {
        specSection.className = spectating ? 'active' : '';
        specSection.setAttribute('aria-hidden', spectating ? 'false' : 'true');
      }
      const inGame = vis.game;
      $('lobby-ui').className = vis.lobby ? 'active' : '';
      // Phone bezel (issue #439) is part of the game shell only — the lobby
      // is borderless. Toggle visibility via aria-hidden so the CSS
      // [aria-hidden="true"] { display: none } rule drives the cascade.
      const bezel = $('phone-bezel');
      if (bezel) bezel.setAttribute('aria-hidden', vis.bezel ? 'false' : 'true');

      // Reconcile activeConsole with current consoles list (port of the
      // deleted Bevy reconcile_active_console — see gui/lobby-state.js).
      if (inGame) {
        const hero = (typeof window.heroBarModel === 'function')
          ? window.heroBarModel({
              directStation: playerStation(s),
              stations: (s.shipStations && s.shipStations.stations) || [],
              stationSystems: window.simState && window.simState.stationSystems,
              blackboards: window.simState && window.simState.blackboards,
              stationHosts: window.simState && window.simState.stationHosts,
              stationHealth: window.simState && window.simState.stationHealth,
              stationImportance: window.simState && window.simState.stationImportance,
              stationRatings: window.simState && window.simState.stationRatings,
              activeStation: activeConsole,
            }) : { tabs: mine.map(id => ({ id })), selected: mine[0] || null };
        const available = hero.tabs.map(tab => tab.id);
        const next = (typeof window.reconcileActiveConsole === 'function')
          ? window.reconcileActiveConsole(activeConsole, available)
          : ((activeConsole && available.includes(activeConsole)) ? activeConsole : (available[0] || null));
        if (next !== activeConsole) setActiveConsole(next);
      } else {
        setActiveConsole(null);
      }
      renderStationHero(s, inGame);

      // Console sections: map activeConsole → HTML section id via
      // gui/content-switcher.js, over the sections this ship actually mounts
      // (issue #827). Only the matching section gets `.active`. Sections that
      // don't exist on this ship are simply absent from the DOM; the $() call
      // returns null and is silently skipped.
      const stationIds = ((s.shipStations && s.shipStations.stations) || [])
        .map(st => st.id).filter(Boolean);
      if (typeof window.applyConsoleVisibility === 'function') {
        // The tab-switch seam (gui/console-mount.js): a pure `.active` toggle
        // over the mounted sections. It never touches iframe nodes, so session-
        // local console state survives a switch away and back (issue #1099 AC1).
        window.applyConsoleVisibility(document, activeConsole, inGame, stationIds);
      } else {
        // Boot-race fallback: canonical `${id}-ui` scheme + the one tactical →
        // weapons alias (single home: gui/mount-plan.js).
        const sections = Object.fromEntries(stationIds.map(id => {
          const base = id === 'tactical' ? 'weapons' : id;
          return [base + '-ui', inGame && activeConsole === id];
        }));
        for (const [sectionId, visible] of Object.entries(sections)) {
          const el = $(sectionId);
          if (el) el.className = visible ? 'console-section active' : 'console-section';
        }
      }

      // Orientation is CSS's business (issue #1370): the media queries in this
      // page and in gui/console.css read the viewport directly, so render()
      // no longer computes one and no longer writes it onto the container.

      // Link state (PRD #1023 module 4): the console dims and stops taking
      // taps when the host is gone, and reads as LOADING rather than broken
      // before the first state lands. Game shell only — the lobby has its own
      // status line and ready pill for the same information.
      renderLinkState(inGame);

      // Game-over overlay: covers the game shell when phase is GameOver.
      // Framed with the scenario's name and the run's outcome (PRD #1023
      // module 4, user story 17) rather than a bare line of text.
      const gameOverEl = document.getElementById('game-over-overlay');
      const gameOverMsgEl = document.getElementById('game-over-message');
      // Reset first: the overlay is a full-viewport surface the cog has to
      // stack above (issue #1372), and a stale `true` from the previous run
      // would strand the chrome in the page body for the whole next mission.
      gameOverVisible = false;
      if (gameOverEl && gameOverMsgEl && typeof window.gameOverView === 'function') {
        const ls = window.lobbyState;
        const gv = window.gameOverView({
          phase: s.phase,
          shipDestroyed: s.shipDestroyed,
          reason: s.gameOverReason,
          // Authored per world, and published on `ServerMessage::GameOver`
          // since the #1023 wire pass; lobby-state parks it here. Null for an
          // ending that declared no side, which the view frames as ENDED.
          outcome: ls ? ls.gameOverOutcome : null,
          scenarioTitle: ls ? ls.scenarioTitle : '',
          // The post-mission report (issue #1344). Empty for every scenario
          // that has not authored one, which is what keeps their endings
          // exactly as they were.
          report: ls ? ls.gameOverReport : [],
        });
        gameOverVisible = !!gv.visible;
        if (gv.visible) {
          gameOverEl.dataset.outcome = gv.outcome;
          const scenarioEl = document.getElementById('game-over-scenario');
          if (scenarioEl) scenarioEl.textContent = wireText(gv.scenarioName);
          const headlineEl = document.getElementById('game-over-headline');
          if (headlineEl) headlineEl.textContent = t(gv.headlineId);
          gameOverMsgEl.textContent = gv.bodyId ? t(gv.bodyId) : wireText(gv.bodyText);
          // The report rows, in the author's order. Rebuilt rather than diffed:
          // this runs once, on an overlay that has just appeared. The row's
          // state rides a data attribute so the accent is CSS's decision and
          // not a second vocabulary in here.
          //
          // `wireText` and NOT `t`, for the same reason the scenario name and
          // the closing line above it use it: these are wire-borne fields, and
          // a phone resolves the whole decoded `ServerMessage` through
          // `localiseTree` at ingress (gui/rendezvous-transport.js), so by the
          // time a row reaches here its two ids are already the prose they name.
          // `t()` on already-resolved prose is a table MISS, which renders
          // ⟨Lyra Ascending⟩ and warns once per row. `wireText` passes a
          // resolved value through and still resolves an id that arrived raw,
          // so a host that never learned the ids — or any future ingress that
          // stops resolving them — still renders prose here.
          //
          // The Viewscreens (server.html, and the native host's
          // gui/viewscreen-hud.html) draw the same overlay from the HUD payload,
          // whose ids `localiseHostPayload` resolves before they get there. All
          // three surfaces run the same `gameOverView` and paint through the
          // same gui/game-over.css, so what the ending says and how it looks
          // are each decided once.
          const reportEl = document.getElementById('game-over-report');
          if (reportEl) {
            reportEl.replaceChildren();
            for (const row of gv.rows) {
              const heading = document.createElement('dt');
              heading.textContent = wireText(row.headingId);
              const outcome = document.createElement('dd');
              outcome.textContent = wireText(row.outcomeId);
              if (row.state) {
                heading.dataset.state = row.state;
                outcome.dataset.state = row.state;
              }
              reportEl.append(heading, outcome);
            }
            reportEl.style.display = gv.rows.length ? 'grid' : 'none';
          }
          gameOverEl.style.display = 'flex';
        } else {
          gameOverEl.style.display = 'none';
        }
      }

      // The waiting-for-scenario overlay used to be toggled here, below a
      // branch that had already returned whenever the picker was up — which is
      // how both came to be displayed at once. It is decided with the rest of
      // the pre-play surfaces at the top of this function now (issue #1359).

      if (spectating) {
        renderSpectator(s);
      } else {
        // A successful claim (issue #1106) seats the ex-Spectator and clears the
        // role, so we drop off the spectator surface; forget any pending claim
        // so a later re-spectate never shows a stale "seat taken" notice.
        pendingSpectatorClaim = null;
        if (inGame) renderGame(s);
        else if (!(window.lobbyState && window.lobbyState.waitingForScenario)) renderLobby(s);
      }

      // Last, because it is the only point in the frame where all three facts
      // it weighs — bar visible, pre-play surface, game-over overlay — have
      // been settled (issue #1372).
      placeShellChrome();
    }

    // Render the crew-public Spectator summary surface (issue #1105) from the
    // already-held simState. A Spectator receives only Audience::All broadcasts,
    // so this shows exactly the crew-public set — objectives, red-alert,
    // ship-wide hull, per-Station health — and no per-station private feed.
    function renderSpectator(s) {
      if (typeof window.spectatorSummaryModel !== 'function'
          || typeof window.renderSpectatorDom !== 'function') return;
      const sim = window.simState || {};
      const model = window.spectatorSummaryModel({
        redAlert: sim.redAlert,
        hullAggregate: sim.hullAggregate,
        hullDestroyed: sim.hullDestroyed,
        stations: (s.shipStations && s.shipStations.stations) || [],
        stationHealth: sim.stationHealth,
        stationImportance: sim.stationImportance,
        objectives: sim.objectives,
      });
      window.renderSpectatorDom({
        alertEl: $('spectator-alert'),
        hullEl: $('spectator-hull'),
        stationsEl: $('spectator-stations'),
        objectivesEl: $('spectator-objectives'),
        model,
        translate: (id, params) => t(id, params),
        // Objective text is a wire string id (may carry text_params); resolve it
        // the same way the rest of the shell resolves wire copy.
        objectiveText: (o) => (window.phStrings && window.phStrings.has(o.text))
          ? t(o.text, o.textParams || {}) : (o.text || ''),
      });
      renderSpectatorClaims(s);
    }

    // Render the "claim an open Station" list on the Spectator surface (issue
    // #1106). A Spectator may enter play by taking any currently-open, eligible
    // seat — through the SAME authoritative SelectStation message an ordinary
    // lobby claim sends (AC2). Open∩eligible seats get a live claim button;
    // ineligible open seats are shown disabled with the private #1103 reason
    // (AC1); a lost race / stale seat leaves a neutral notice and keeps the
    // participant here (AC3). The roster is live because StationAssigned is
    // broadcast to all, so a race lost to another player repaints as taken.
    function renderSpectatorClaims(s) {
      const listEl = $('spectator-claims');
      const statusEl = $('spectator-claim-status');
      if (!listEl || typeof window.spectatorClaimModel !== 'function') return;
      const roster = s.stations || [];

      // Neutral stale/lost-race notice (AC3): the seat we tapped came back
      // taken. Keep the Spectator on the surface; leak no other-player identity.
      if (statusEl) {
        const stale = typeof window.spectatorClaimStale === 'function'
          && window.spectatorClaimStale(roster, pendingSpectatorClaim, myToken);
        if (stale) {
          statusEl.textContent = t('client.spectator.claim_taken');
          statusEl.dataset.state = 'taken';
          pendingSpectatorClaim = null;
        } else if (!pendingSpectatorClaim) {
          statusEl.textContent = '';
          statusEl.removeAttribute('data-state');
        }
      }

      const rows = window.spectatorClaimModel(roster, stationEligibility);
      listEl.innerHTML = '';
      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'spectator-claims-empty';
        empty.textContent = t('client.spectator.claim_none');
        listEl.appendChild(empty);
        return;
      }
      for (const row of rows) {
        const rowEl = document.createElement('div');
        // Reuse the lobby row visuals (issue #1106): the claim/ineligible
        // buttons and inline reason are styled under `.station-row`.
        rowEl.className = 'station-row spectator-claim-row'
          + (row.button === 'ineligible' ? ' ineligible' : '');
        rowEl.dataset.station = row.id;

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = stationLabel(row);
        info.appendChild(nameEl);
        if (row.rank) {
          const meta = document.createElement('div');
          meta.className = 'meta';
          const rankEl = document.createElement('span');
          rankEl.textContent = row.rank;
          meta.appendChild(rankEl);
          info.appendChild(meta);
        }
        // A free seat this player is INELIGIBLE for (issue #1103 AC1): the
        // private functional reason, local-only, mirroring the lobby roster.
        if (row.button === 'ineligible' && row.ineligibleReason) {
          const why = document.createElement('div');
          why.className = 'ineligible-reason';
          const fns = (row.ineligibleReason.functions || [])
            .map(f => t('client.assist_function.' + f))
            .join(', ');
          why.textContent = t('client.station_ineligible_reason', { functions: fns });
          info.appendChild(why);
        }
        rowEl.appendChild(info);

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (row.button === 'ineligible') {
          // Blocked claim: the disabled control never sends SelectStation.
          btn.className = 'ineligible-btn';
          btn.textContent = t('client.station_ineligible');
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = t('client.claim');
          btn.addEventListener('click', () => {
            // Remember the seat so a lost race can render its neutral notice,
            // then send the SAME authoritative message the lobby roster uses.
            pendingSpectatorClaim = row.id;
            send('SelectStation', { station: row.name });
            scheduleRender();
          });
        }
        action.appendChild(btn);
        rowEl.appendChild(action);
        listEl.appendChild(rowEl);
      }
    }

    // "Mods active" lobby list (issue #990): render the packs the host applied
    // from lobbyState.activePacks. Nothing renders (and the row is hidden) when
    // no packs are applied, so the base game shows no empty banner. Separate
    // from the station list so it survives the boot-race guard below — a mid-
    // round spectator still sees what mods the session is running.
    function renderActiveMods() {
      const render = window.clientLobbyRender;
      if (!render) return;   // boot race: the next server message repaints
      const rows = (typeof window.activePacksView === 'function')
        ? window.activePacksView(window.lobbyState && window.lobbyState.activePacks)
        : [];
      render.renderClientMods(document, rows, t);
    }

    // ── Anonymous accessibility eligibility (issue #1103) ─────────────────
    // The client evaluates the complete station surface at its required rating
    // against its PRIVATE profile (gui/accessibility-profile.js), blocks and
    // privately explains an ineligible direct claim (AC1), and reports ONLY the
    // anonymous ineligible station-id set to the host (AC2). The profile and the
    // functional reasons never leave the device.

    /** The required rating for a station: the in-game visiting rating when the
     *  human-seeking resolver has placed it, else the direct-claim rating, else
     *  the station's authored base rating. */
    function requiredRatingForStation(id, ratings) {
      const sim = window.simState;
      const host = sim && sim.stationHosts && sim.stationHosts[id];
      if (host && host.rating) return host.rating;
      const direct = sim && sim.stationRatings && sim.stationRatings[id];
      if (direct) return direct;
      return (ratings && ratings[0]) || '';
    }

    /** Eligibility for one lobby roster station — { eligible, reason }. The
     *  `reason` is the PRIVATE functional explanation, shown only to this
     *  player; it is never sent anywhere. */
    function stationEligibility(st) {
      const sim = window.simState;
      if (!sim || typeof window.deriveStationEligibility !== 'function') {
        return { eligible: true, reason: null };
      }
      const rating = requiredRatingForStation(st.id, st.ratings);
      const gaps = (sim.stationAssistGaps || {})[st.id];
      return window.deriveStationEligibility(sim.accessibilityProfile, gaps, rating);
    }

    /** Recompute the anonymous ineligible-station set and report it to the host.
     *  Only station ids cross the wire — no reason, no setting. */
    function computeAndSendEligibility() {
      const sim = window.simState;
      if (!sim || typeof window.deriveStationEligibility !== 'function') return;
      const gaps = sim.stationAssistGaps || {};
      const profile = sim.accessibilityProfile;
      const ineligible = [];
      const seen = new Set();
      const evalStation = (id, ratings) => {
        if (seen.has(id)) return;
        seen.add(id);
        const rating = requiredRatingForStation(id, ratings);
        const r = window.deriveStationEligibility(profile, gaps[id], rating);
        if (!r.eligible) ineligible.push(id);
      };
      // Claimable seats carry their authored ratings in the roster; any other
      // station the projection knows (auxiliary / human-seeking) is evaluated at
      // its in-game visiting rating when present, permissively otherwise.
      for (const st of (uiState.stations || [])) evalStation(st.id, st.ratings);
      for (const id of Object.keys(gaps)) evalStation(id, null);
      ineligible.sort();
      send('ReportStationEligibility', { ineligible });
    }

    // Re-report whenever the private assistance profile changes (the hook is
    // fired by gui/accessibility-profile.js after it persists the change).
    window.onAccessibilityAssistanceChanged = computeAndSendEligibility;

    /**
     * Paint the lobby.
     *
     * Two pure modules and one renderer, and what is left here is what could
     * not move (issue #1369): the projection this page splices together, and
     * the six actions that mutate page-local state or reach the live transport.
     * `gui/lobby-view.js` decides everything the lobby SAYS — including the
     * string ids the arm→confirm swap and the ready button's four modes used
     * to pick inline — and `gui/client-lobby-render.js` writes it.
     */
    function renderLobby(s) {
      renderActiveMods();
      // Boot race: both modules load as ES modules in <head> while the page
      // may already be painting. Skip until they land — the next server
      // message re-renders.
      if (typeof window.lobbyViewModel !== 'function') return;
      const render = window.clientLobbyRender;
      if (!render) return;

      // The reducer owns the public GM list. It is deliberately not duplicated
      // into the legacy shell mirror, so splice the current authoritative list
      // into the pure view input at render time.
      const lobbyProjection = window.lobbyState
        ? { ...s, gms: window.lobbyState.gms }
        : s;

      // #771 AC3/AC4: the armed-release confirm only exists in-progress; leaving
      // InProgress (or never being in it) disarms so lobby release is immediate.
      if (s.phase !== 'InProgress') releaseArmed = false;

      const vm = window.lobbyViewModel(lobbyProjection, myToken, lobbyConsole, {
        labelFor: stationLabel,
        describeFor: stationDescription,
        consoleLabelFor: consoleLabel,
        ratingLabelFor: (r) => wireText('station.rating.' + r.toLowerCase() + '.name', r.toUpperCase()),
        stationRatings: window.simState ? window.simState.stationRatings : null,
        // Anonymous accessibility eligibility per row (issue #1103 AC1).
        eligibilityFor: stationEligibility,
        // Which label the release controls wear. The latch itself stays here:
        // it is page state the handler below mutates.
        releaseArmed,
        assignedStation: window.__PHOENIX_ASSIGNED_STATION__ || null,
        helpActions: window.currentGamepadHelpActions?.() || [],
        gamepadConnected: window.currentGamepadState?.().connected === true,
        gamepadContext: window.currentGamepadState?.().context || null,
      });
      // Detail-panel console auto-select (and clear on release) is part of
      // the view model.
      lobbyConsole = vm.selectedConsole;

      render.renderClientLobby(document, vm, t, {
        // Shared by the row RELEASE and detail LEAVE controls. In-progress:
        // first click arms (the re-render swaps to the confirm label), second
        // click sends. Lobby: immediate send. Preserves the
        // pendingMidGameClaim reset either way.
        release: () => {
          const step = window.releaseConfirmStep(s.phase, releaseArmed);
          releaseArmed = step.armed;
          if (!step.send) {
            scheduleRender();
            return;
          }
          pendingMidGameClaim = false;
          send('ReleaseStation');
        },
        claim: (row) => {
          if (uiState.phase === 'InProgress') pendingMidGameClaim = true;
          send('SelectStation', { station: row.name });
          scheduleRender();
        },
        selectConsole: (id) => {
          lobbyConsole = id;
          scheduleRender();
        },
        selectRating: (rating) => send('SetStationRating', { rating_name: rating }),
        setReady: (ready) => send('SetReady', { ready }),
        // Spectate toggle (issue #1105): 'spectate' sends SetSpectator{true}
        // (vacate seat + unready on the server); 'join' sends false to rejoin
        // the crew. Which way round is the view model's call.
        setSpectator: (spectator) => send('SetSpectator', { spectator }),
      });
    }

    function rebuildStations() {
      // Pure fold in gui/station-roster.js (issue #827): players + station
      // defs → roster rows + lobby aggregates. Boot race: leave the previous
      // roster in place until the module loads.
      if (typeof window.buildStationRoster === 'function') {
        const defs = (uiState.shipStations && uiState.shipStations.stations) || [];
        const roster = window.buildStationRoster(uiState.players, defs);
        uiState.stations   = roster.stations;
        uiState.maxPlayers = roster.maxPlayers;
        uiState.allFilled  = roster.allFilled;
        uiState.allReady   = roster.allReady;
      }
      uiState.countdownSecs = window.lobbyState ? window.lobbyState.countdownSecs : 0;
      scheduleRender();
    }

    window.refreshClaimedStationHelp = () => renderLobby(uiState);

    // Repair UI (issue #462): the full repair affordance is owned by the
    // Repair console iframe (gui/repair-console.html), which renders the hull
    // readout + per-team dispatch buttons and sends `dispatch_repair_team`
    // itself. The pure shell-button logic ported from the old Bevy
    // `handle_repair_button_press` / `refresh_repair_button` lives in
    // gui/repair-button.js (all-busy guard, message shape, refresh states).
    // The earlier `renderRepair` / `renderRepairButtons` shell stubs targeted
    // HTML ids that were never added (orphaned Bevy-era remnants) and were
    // removed here; the iframe supersedes them.

    // -- iframe state-push helper (wraps gui/iframe-bridge.js) ----------------
    function _pushIframe(iframeEl, consoleName, stateJson) {
      // Module not loaded yet (boot race): drop the push — pushes are idempotent
      // snapshots and the next tick repeats them.
      if (typeof window.iframeBridgePush !== 'function') return;
      window.iframeBridgePush(iframeEl, consoleName, stateJson);
    }

    // -- Generic console state push (ship-agnostic) --------------------------
    // Every station id (including the aggregate cruiser/destroyer consoles like
    // `engineering` = power+repair and `science` = sensors+shields) is handled
    // generically by window.buildConsoleState(name, window.simState), which nests the
    // sub-panel payloads. Iframe ids resolve through gui/mount-plan.js (the
    // single home of the `${id}-iframe` scheme + the tactical → weapons
    // alias) so whatever iframe the current ship actually mounted is fed.
    // This is the ONLY push path (#823): handleMessage fans out through
    // pushDirtyConsoles below, and renderGame / iframe-load listeners push
    // the active console directly.
    function consoleIframeId(name) {
      return (typeof window.iframeIdFor === 'function')
        ? window.iframeIdFor(name) : (name + '-iframe');
    }

    function actionFeedbackRouter() {
      if (_actionFeedbackRouter) return _actionFeedbackRouter;
      if (typeof window.ActionFeedbackRouter !== 'function') return null;
      _actionFeedbackRouter = new window.ActionFeedbackRouter({
        deliver: (value) => {
          const iframe = $(consoleIframeId(value.console));
          try {
            const update = iframe && iframe.contentWindow
              && iframe.contentWindow.__updateActionFeedback;
            if (typeof update === 'function') update(value);
          } catch (_) { /* cross-origin/not-yet-loaded: the terminal state is safely dropped */ }
          const meter = latencyMeter();
          if (meter) {
            if (value.state === 'TimedOut') meter.noteCorrelatedTimeout(value.correlation);
            else meter.noteCorrelatedAck(value.correlation);
          }
        },
      });
      return _actionFeedbackRouter;
    }

    // ── Console input-to-feedback latency (issue #1169, PRD #1144) ───────────
    // The phone measures its OWN round trip: `console-core.sendAction` stamps
    // the input event inside the console document, the dispatch below stamps the
    // hand-off to the transport, and a SERVER-CAUSED push of the issuing
    // console's payload is the acknowledgement. All three stamps are on this
    // device, so nothing here subtracts a host clock from a phone clock, and
    // only durations are reported — never a timestamp, and never a surface name
    // (the host assigns that, so a client cannot claim a series it does not own).
    //
    // WHICH push counts is the whole correctness question (issue #1169 review,
    // finding B1). `pushConsoleStateFor` is also called by a local re-render, by
    // a freshly loaded iframe, and by client-local tutorial progress; acking on
    // those records a plausible 40 ms "response" for a command a stalled data
    // channel never delivered. So every call site names its cause and
    // `ackEligible` (gui/console-latency.js, unit-tested) decides — the decision
    // deliberately does not live in this inline script.
    //
    // The meter is created lazily and tolerates its module not having executed
    // yet, exactly as `pushDirtyConsoles` tolerates `dirtyConsolesFor` missing:
    // this is diagnostic, and a dropped early sample costs nothing.
    let _latencyMeter = null;
    function latencyMeter() {
      if (_latencyMeter) return _latencyMeter;
      if (typeof window.ConsoleLatencyMeter !== 'function') return null;
      _latencyMeter = new window.ConsoleLatencyMeter();
      return _latencyMeter;
    }

    /** The `PUSH_CAUSE` vocabulary, or a safe stand-in before the module loads. */
    function pushCause() {
      return window.CONSOLE_PUSH_CAUSE || {};
    }

    /** Follow the host's flag and ship whatever has finished measuring. */
    let _latencyFlushedAt = 0;
    const LATENCY_FLUSH_MS = 2000;
    function maybeReportConsoleLatency(force) {
      const meter = latencyMeter();
      if (!meter || typeof window.isConsoleLatencyEnabled !== 'function') return;
      // The host owns the switch; a client never measures on its own initiative.
      const on = window.isConsoleLatencyEnabled(window.simState && window.simState.debugFlags);
      if (on !== meter.enabled) meter.setEnabled(on);
      if (!on) return;
      // The batching decision itself lives in gui/console-latency.js
      // (`shouldFlush`, unit-tested) rather than in this inline script: batching
      // is why measuring does not change what is measured, and `force` is the
      // teardown path where there is no next chance.
      const now = window.consoleLatencyNowMs ? window.consoleLatencyNowMs() : Date.now();
      if (typeof window.consoleLatencyShouldFlush !== 'function') return;
      const go = window.consoleLatencyShouldFlush({
        enabled: on,
        hasPayload: meter.hasPayload(),
        now,
        lastFlushedAt: _latencyFlushedAt,
        force: !!force,
        intervalMs: LATENCY_FLUSH_MS,
      });
      if (!go) return;
      const batch = meter.drain();
      _latencyFlushedAt = now;
      const msg = window.consoleLatencyMessage(batch.samples, batch.expired);
      send(msg.type, msg.data);
    }

    // Ship what has been measured before the page goes away (issue #1169 review).
    // `pagehide` is the reliable teardown signal on mobile Safari, where `unload`
    // never fires; `visibilitychange` to hidden covers a backgrounded tab the OS
    // may never resume. Without these, up to a flush interval of real
    // measurements is lost exactly when a player puts the phone down.
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pagehide', () => maybeReportConsoleLatency(true));
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') maybeReportConsoleLatency(true);
      });
    }

    /**
     * Push one console's payload to its iframe.
     *
     * `cause` is a `PUSH_CAUSE` value naming WHY (issue #1169): only
     * `SERVER_MESSAGE` — an inbound host message that carried or dirtied state
     * for this console — may acknowledge a pending action. Omitting it is
     * treated as non-acknowledging, so a future call site that forgets
     * under-reports rather than fabricating samples.
     */
    function pushConsoleStateFor(name, cause) {
      if (!name) return;
      const json = (typeof window.buildConsoleState === 'function' && window.simState)
        ? window.buildConsoleState(name, window.simState)
        : '{}';
      _pushIframe($(consoleIframeId(name)), name, json);
      const meter = latencyMeter();
      if (meter) meter.noteAck(name, cause);
    }

    function pushActiveConsoleState(cause) {
      pushConsoleStateFor(activeConsole, cause);
    }

    // Resolve the active console's iframe the same way pushConsoleStateFor
    // does, so the relay always follows whatever iframe this ship mounted.
    function activeConsoleIframe() {
      if (!activeConsole) return null;
      return $(consoleIframeId(activeConsole));
    }

    function pushSemanticBindingsToIframe(iframeEl) {
      if (!iframeEl || !semanticActionRegistry) return;
      try {
        const target = iframeEl.contentWindow;
        const update = target
          && iframeEl.contentWindow.__updateSemanticActionBindings;
        if (typeof update === 'function') {
          update(semanticActionRegistry.bindingProfile());
        }
        const updateFeedback = target && target.__updateActionFeedbackPreferences;
        if (typeof updateFeedback === 'function') {
          updateFeedback(activeFeedbackPreferences);
        }
      } catch (_) { /* a cross-origin or not-yet-loaded frame is retried on load */ }
      refreshGamepadPresentation();
    }

    function pushSemanticBindingsToConsoles() {
      const stations = (uiState.shipStations && uiState.shipStations.stations) || [];
      for (const station of stations) {
        if (station && station.id) {
          pushSemanticBindingsToIframe($(consoleIframeId(station.id)));
        }
      }
    }

    function operatorProfileStorage() {
      if (window.PhoenixOperatorStorage) return window.PhoenixOperatorStorage;
      try { return window.localStorage; } catch (_) { return null; }
    }

    function snapshotOperatorProfile() {
      const api = window.OperatorProfile;
      if (!api || typeof api.createOperatorProfileSnapshot !== 'function') return null;
      operatorProfile = api.createOperatorProfileSnapshot({
        accessibility: window.simState ? window.simState.accessibilityProfile : null,
        bindings: semanticActionRegistry ? semanticActionRegistry.bindingProfile() : {},
        preferredGamepadSlot,
        preferredGamepadDevice: gamepadInputRuntime?.state().preferredDevice
          ?? operatorProfile?.gamepad?.preferredDevice,
        hideTouchControls: operatorProfile?.gamepad?.hideTouchControls,
        tuning: semanticActionRegistry ? semanticActionRegistry.tuningProfile() : {},
        feedback: operatorProfile && operatorProfile.feedback,
        gmConfirmations: operatorProfile && operatorProfile.gmConfirmations,
      });
      return operatorProfile;
    }

    function persistOperatorProfile() {
      const api = window.OperatorProfile;
      const profile = snapshotOperatorProfile();
      if (!api || !profile || typeof api.saveOperatorProfile !== 'function') {
        return { status: 'rejected', code: 'profile-storage-write' };
      }
      return api.saveOperatorProfile(operatorProfileStorage(), profile);
    }

    // accessibility-profile.js calls this after either Accessibility reducer.
    // Keeping the hook local avoids turning a private choice into a wire path.
    window.persistOperatorProfile = persistOperatorProfile;

    window.currentGamepadState = () => gamepadInputRuntime?.state() || { connected: false };
    window.currentGamepadHelpActions = () => semanticActionRegistry?.list() || [];
    function refreshGamepadPresentation(state = window.currentGamepadState()) {
      const api = window.GamepadPresentation;
      if (api && semanticActionRegistry) {
        const visibility = api.helmTouchVisibility(semanticActionRegistry.list('helm'), state,
          operatorProfile?.gamepad?.hideTouchControls !== false);
        for (const iframe of document.querySelectorAll('iframe')) {
          try { api.applyHelmTouchVisibility(iframe.contentDocument, visibility); } catch (_) {}
        }
      }
      window.refreshClaimedStationHelp?.();
    }
    window.addEventListener('phoenix-operator-profile-loaded', () => {
      if (!semanticActionRegistry || !window.OperatorProfile) return;
      applyPreparedOperatorProfile(window.OperatorProfile.loadOperatorProfile(
        operatorProfileStorage(), { registry: semanticActionRegistry }));
      settingsPanel?.rebuildContent?.();
      refreshGamepadPresentation();
    });
    function updateNativeProfileStatus() {
      const message = $('native-operator-profile-error');
      if (!message) return;
      message.hidden = !window.PhoenixOperatorStorageStatus;
      message.textContent = message.hidden ? '' : t('settings.controls.profile.native_storage_error');
    }
    window.addEventListener('phoenix-operator-storage-status', updateNativeProfileStatus);

    function applyPreparedOperatorProfile(prepared) {
      const api = window.OperatorProfile;
      const adapter = window.OperatorSurfaceAdapter;
      if (!api || !adapter || !prepared || !prepared.profile || !semanticActionRegistry) {
        return { status: 'rejected', code: 'profile-registry-unavailable' };
      }
      const applied = adapter.applyOperatorProfileToSurface(
        prepared.profile,
        semanticActionRegistry,
        { root: window },
      );
      if (!applied || applied.status !== 'applied') return applied;
      operatorProfile = applied.portableProfile;
      operatorSurfaceCapabilities = applied.capabilities;
      activeFeedbackPreferences = applied.active.feedback;
      preferredGamepadSlot = operatorProfile.gamepad.preferredSlot;
      if (window.simState && applied.active.accessibility) {
        window.simState.accessibilityProfile = applied.active.accessibility;
      }
      if (gamepadInputRuntime
          && typeof gamepadInputRuntime.restorePreferred === 'function') {
        gamepadInputRuntime.restoreDevice(operatorProfile.gamepad.preferredDevice);
      }
      pushSemanticBindingsToConsoles();
      if (gamepadInputRuntime) gamepadInputRuntime.neutralize();
      if (typeof window.applyAccessibilityProfile === 'function') {
        window.applyAccessibilityProfile();
      }
      if (typeof window.onAccessibilityAssistanceChanged === 'function') {
        try { window.onAccessibilityAssistanceChanged(); } catch (_) { /* best-effort */ }

    }

    function importOperatorProfileJson(text) {
      const api = window.OperatorProfile;
      if (!api || !semanticActionRegistry) {
        return { status: 'rejected', code: 'profile-registry-unavailable' };
      }
      const prepared = api.prepareOperatorProfileImport(text, {
        registry: semanticActionRegistry,
      });
      if (prepared.status === 'rejected') return prepared;
      // Persist first. A quota/privacy-mode refusal leaves every live setting
      // untouched rather than applying a profile that a reload immediately
      // forgets.
      const saved = api.saveOperatorProfile(operatorProfileStorage(), prepared.profile);
      if (saved.status !== 'saved') return saved;
      return applyPreparedOperatorProfile(prepared);
    }

    function exportOperatorProfileJson() {
      const api = window.OperatorProfile;
      const profile = snapshotOperatorProfile();
      return api && profile ? api.serializeOperatorProfile(profile) : null;
    }

    function updateSemanticBinding(actionId, slot, binding, options) {
      if (!semanticActionRegistry) return { status: 'unavailable' };
      const result = semanticActionRegistry.setBinding(actionId, slot, binding, options);
      if (result.status === 'applied') {
        pushSemanticBindingsToConsoles();
        if (gamepadInputRuntime) gamepadInputRuntime.neutralize();
        persistOperatorProfile();
      }
      return result;
    }

    function resetSemanticAction(actionId) {
      if (!semanticActionRegistry) return { status: 'unavailable' };
      const result = semanticActionRegistry.resetAction(actionId);
      if (result.status === 'applied') {
        pushSemanticBindingsToConsoles();
        if (gamepadInputRuntime) gamepadInputRuntime.neutralize();
        persistOperatorProfile();
      }
      return result;
    }

    function resetAllSemanticActions() {
      if (!semanticActionRegistry) return { status: 'unavailable' };
      const result = semanticActionRegistry.resetAllBindings();
      if (result.status === 'applied') {
        pushSemanticBindingsToConsoles();
        if (gamepadInputRuntime) gamepadInputRuntime.neutralize();
        persistOperatorProfile();
      }
      return result;
    }

    function updateSemanticTuning(actionId, tuning) {
      if (!semanticActionRegistry) return { status: 'unavailable' };
      const result = semanticActionRegistry.setTuning(actionId, tuning);
      if (result.status === 'applied' && gamepadInputRuntime) {
        gamepadInputRuntime.neutralize();
      }
      if (result.status === 'applied') persistOperatorProfile();
      return result;
    }

    function updateGamepadClientWarning(state) {
      const warning = $('gamepad-input-alert');
      if (!warning) return;
      const disconnected = state && state.status === 'disconnected';
      warning.textContent = disconnected
        ? t('client.gamepad.disconnect_warning')
        : '';
      warning.hidden = !disconnected;
    }

    // Send the host's key events to the active console, so helm's WASD/arrows,
    // Ctrl impulse and Shift boost keep working after a click on the tab bar or
    // any other host chrome moved focus out of the console iframe. Called from
    // the DOMContentLoaded gate below, once the deferred modules have run.
    function installConsoleKeyRelay() {
      if (typeof window.installKeyRelay !== 'function') return;
      window.installKeyRelay(document, () => {
        const el = activeConsoleIframe();
        try { return el && el.contentDocument; } catch (_) { return null; }
      });
    }

    // -- Semantic-change console refresh (issues #823 / #1260) ----------------
    // The per-console build*/push*ConsoleState wrapper pairs that used to live
    // here were deleted: reducers now report semantic changes and
    // gui/dirty-consoles.js resolves those through authoritative topology,
    // then pushes each through the generic pushConsoleStateFor above. Pushes
    // are gated on
    // the console being active, except Stations projected from the
    // unconditional Console Families in dirty-consoles.js
    // (captain — its push was always unconditional).
    function pushDirtyConsoles(changes) {

      // fan-out; pushes are idempotent snapshots and the next message repeats
      // them (same tolerance as _pushIframe / pushConsoleStateFor).
      if (typeof window.dirtyConsolesFor !== 'function') return;
      const stationSystems = window.simState ? window.simState.stationSystems : null;
      const systemConsoleFamilies = window.simState ? window.simState.systemConsoleFamilies : null;
      const blackboardConsoleFamilies = window.simState ? window.simState.blackboardConsoleFamilies : null;
      const alwaysPush = window.alwaysPushConsoles
        ? window.alwaysPushConsoles(stationSystems, systemConsoleFamilies)
        : new Set();

        changes,
        stationSystems,
        systemConsoleFamilies,
        blackboardConsoleFamilies,

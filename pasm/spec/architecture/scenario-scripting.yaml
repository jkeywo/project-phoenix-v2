  - component: mission-deadline-vocabulary
    core:
      status: implemented
      confidence: confirmed
      title: Named Mission Deadlines — Authoring, Script API and Readout
      summary: "Issue #1024 (parent #851, Falling Skyway). A scenario declares deadlines that are NAMED THINGS IN THE WORLD rather than anonymous timers: a `[[deadline]]` block carries `id` / `label` (a strings.csv id) / `due_secs` / `visible`, and a `[script]` block names the fn each one runs with a loading-engine `on_deadline(\"id\", \"handler\")` — the same declaration shape `on_timer` uses, following M7's direction that TOML declares DATA and script registers BEHAVIOUR. At runtime `ctx.deadlines` is the first genuinely read/write `ctx` handle: `remaining(id)` returns whole seconds (`0` once fired, `-1` once cancelled or unknown), `state(id)` returns `pending`/`fired`/`cancelled`/`unknown`, and `slip(id, secs)` / `cancel(id)` mutate. Visible deadlines reach `CaptainBlackboard.deadlines` with `remaining_secs` computed SERVER-SIDE against `SimTick`, and `<ph-deadline-list>` on the destroyer captain console formats that number without running a clock of its own."
      rationale:
        - "A deadline is authored in TOML but NAMED by script, so the two halves can disagree in two directions. Both are load-time errors on the existing authoring-validation channel, so the atomic activation gate blocks the world: `on_deadline` naming a block that does not exist, and a `[[deadline]]` block no `on_deadline` claims. The second is an error rather than a shrug because a deadline without a handler cannot be ARMED — arming it means queuing the call it runs — and the failure would otherwise surface mid-mission as a countdown reaching zero and nothing happening, which no runtime check can report. An author who wants a pure countdown writes an empty handler, which says so."
        - "Duplicate ids are refused by `parse_world` itself, naming both entries with their due times. The id is the only handle script has on a deadline, so a duplicate is not a cosmetic clash — it is two records competing for every `slip`/`cancel`."
        - "`Deadlines` follows `Flags`' snapshot-plus-overlay shape rather than inventing one: a per-call snapshot of the live table, mutated in place so a `remaining` read AFTER a `slip` in the same call sees the new time, with the mutations recorded separately for the host to apply for real. Read verbs are plain fns rather than an indexer because a deadline has two readable properties (remaining and state) that answer different questions, and an indexer could only serve one."
        - "Mutations drain as a FIFTH `CallEffects` field for the reason `comms_opens` is a fourth: a deadline mutation edits `WorldScriptRuntime::pending_callbacks`, a queue the generic action applier holds no handle on. Buffered, never deferred — the four sites that consume a call's effects (trigger pipeline, callback drain, and both comms answer paths) replay them in the same tick at the same point as the call's other effects, and the buffer is dropped whole on the failure path so a raising handler slips nothing."
        - "Arming happens on the first simulation tick of the MISSION, chained straight after `anchor_mission_clock` — #960's fix applied to this vocabulary from the outset. A ninety-second lobby must not retire a mission's deadlines before the crew has the con."
        - "The countdown is computed server-side and re-published every tick rather than interpolated by the client. A client-side clock would drift away from the tick the deadline actually fires on, and would show two players different numbers off the same mission."

# ΓöÇΓöÇ TRIGGERS ΓÇö CHOICE PRESENTATION (flag-gated) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
#
# Four on_load triggers, one per flag state, push the appropriate strategy
# choice comms. Each choice comms presents two responses: containment (always)
# and broadcast (only when a path was completed, with path-specific framing).

[[trigger]]
condition = "on_load"
flag_is_set = "path_a_chosen"
actions = [{ push_comms = "strategy_choice_path_a" }]

[[trigger]]
condition = "on_load"
flag_is_set = "path_b_chosen"
actions = [{ push_comms = "strategy_choice_path_b" }]

[[trigger]]
condition = "on_load"
flag_is_set = "path_c_chosen"
actions = [{ push_comms = "strategy_choice_path_c" }]

[[trigger]]
condition = "on_load"
flag_not_set = "path_chosen"
actions = [{ push_comms = "strategy_choice_no_path" }]

# Strategy choice ΓÇö no path completed (containment only)
[[comms]]
id = "strategy_choice_no_path"
from = "Captain's Chair"
subject = "Your Move"
message = "One option: shield the station with our hull. Engineering to shields. Helm, intercept position."

[[comms.responses]]
text = "Shield containment. Engineering, all power to shields."
actions = [
    { set_flag = "containment_active" },
    { push_comms = "containment_briefing" },
    { add_objective = "containment_position" },
    { add_objective = "containment_shields" },
    { add_objective = "containment_tuning" },
]

# Strategy choice ΓÇö Path A (Dr. Sol's broadcast)

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.captain.doc_title">Project Phoenix - Captain Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .controls-row { display: flex; gap: 12px; }
    .controls-row > * { flex: 1; min-width: 0; }
    ph-objective-list { flex: 1; min-height: 0; }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .controls-row { gap: 8px; }
    }
  </style>
</head>
<body>
  <div id="objectives" hidden></div>
  <div id="dir" hidden></div>
  <div id="alert" hidden></div>
  <div class="frame" data-screen-label="Captain Console" data-i18n-attr="data-screen-label:console.captain.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat, and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. What the footer said
           that the bar cannot — the battlespace contact count — is this
           readout, at the head of the command group it describes. -->
      <div class="console-body">
        <div class="readout">
          <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
          <span class="spacer"></span>
          <span class="auto-badge" id="captain-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
        </div>
        <div class="controls-row">
          <ph-camera-select id="camera-select"></ph-camera-select>
          <ph-red-alert id="red-alert"></ph-red-alert>
        </div>
        <ph-objective-list id="objective-list"></ph-objective-list>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-camera-select.js';
    import '../components/ph-red-alert.js';
    import '../components/ph-objective-list.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/battleship/captain.console.js (issue #1235):
    // one shared Captain renderer, this hull's variant. The battleship's
    // Captain station does not own a sensors system (Sensors is its own
    // dedicated station), so it reads a flat CaptainConsolePayload — see the
    // @typedef in gui/console-state.js. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './captain.console.js';
    initConsole({ name: 'captain', render: renderStation });
  </script>
</body>
</html>

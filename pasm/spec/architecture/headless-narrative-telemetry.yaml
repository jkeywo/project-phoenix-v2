entities:
  - component: narrative-event-emitter
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Event Emitter
      summary: Emits a NarrativeEvent for every authored mission-timeline moment — Objective posted/completed/failed, named deadline fired, authored beat fired, Comms thread opened, Comms response answered, a MARKED entity spawning or being destroyed on either removal path, and a ship's-computer message shown/superseded/expired — unconditionally on every runtime, so the after-action timeline exists whether or not anyone is collecting it.
      rationale:
        - "The ship's-computer message (issue #1342) is its own producer, tick_computer_message, rather than an arm of emit_scenario_narrative: unlike an Objective/deadline it has no other authoritative owner to log through, so the one system that mutates ActiveComputerMessage also reports the shown/superseded pair honestly at the moment it changes. Expiry is a SimTick comparison, not a scheduled callback — the same freeze-for-free-under-pause property mission deadlines get, without a queued Rhai dispatch this state machine has no handler to fire. A show_message(..) request is buffered onto EffectQueue<ComputerMessageRequest> by the shared dispatch applier for the same #1223 reason narrative_beat is: the applier holds no message writer."
        - "Kept a SEPARATE message from BalanceEvent (PRD #1337). The combat ledger is a fold of the balance stream alone and must stay so: a story beat that also happens to be a kill produces one event in each stream, and nothing narrative can move a damage total."
        - "Authored, never inferred. An Objective/deadline/Comms transition is authored by construction; a beat is an explicit ctx.effects.narrative_beat call; an entity outcome requires the scenario to have set narrative = true on the [[entity]], which attaches a NarrativeMark. An unmarked hull produces no timeline entry however violently it dies — that gate is what keeps the timeline readable instead of a second copy of the damage log."
        - "The mark is attached at BOTH declared spawn timings — spawn_immediate_entities_internal for spawn_on = immediate, spawn_game_start_entities for spawn_on = game_start — because narrative = true says nothing about WHEN the hull enters the world. Only a NAMED row can be marked (the mark's payload IS the authored name), and world::validate raises a narrative-mark-needs-name warning on the nameless combination rather than dropping the flag in silence: a silently-ignored authoring flag is the one failure the authored-never-inferred rule cannot absorb, because the author believes they marked the hull. A hull a SCRIPT spawns has no [[entity]] row to carry the flag and records its story through ctx.effects.narrative_outcome instead."
        - "ONE hull, ONE uuid, whichever timing spawned it. A marked entity reaches the timeline twice under different resolutions — marked_entity_spawned reads the uuid off the spawned entity, while ctx.effects.narrative_outcome resolves the authored NAME through name_to_uuid — so the two are only the same actor if the spawner used the registered uuid. spawn_game_start_entities therefore reads WorldConfig.name_to_uuid for named rows exactly as the immediate path does, and mints only for anonymous ones (the player-ship placeholder). The assign pass registers every named row with no spawn_on filter, so a minted game_start hull was addressable by nobody: the name resolved to a uuid belonging to no entity in the world. That split predates the timeline — it broke comms from, trigger targets and set_target too — and the timeline is where it became visible."
        - "A comms_answered beat points the OTHER WAY from the comms_opened it answers. source is who produced the moment, and a choice is produced by the crew: the answering hull, the station that station_for_system resolved for the comms system, and the comms system itself — the one narrative kind whose actor is a station-side decision, and so the only place NarrativeActor's station/system axes are live. The hailing entity is the target, which is the opened event's source, so opened-source == answered-target pairs the exchange without crediting the counterparty with the crew's decision. An axis that cannot be resolved stays null rather than being string-cast from the system id."
        - "Objective transitions are recorded by the MANAGER, not by the call sites. An Objective can be completed from a trigger action, a Rhai effect, a comms response, or the Helm AI satisfying its own directive; the systems owning those sites are at Bevy's 16-parameter limit already. Every one of them goes through ObjectiveManager's four mutators, so each mutator appends an ObjectiveTransition and emit_scenario_narrative drains that log once a tick — no site can be missed by the next one added, and the log is what makes intra-tick fidelity possible: an objective posted and completed inside ONE fixed tick is one status field but two beats, and a snapshot diff can only ever report the state the tick ended in. The diff survives as a backstop for state that moves outside the manager's API, and for deadlines, which have no API to log through and cannot fire twice in a tick. The per-system Local each diff keeps is deliberately NOT a resource: derived, non-authoritative, and therefore out of the #894 census and out of the snapshot; the transition log itself is drained every tick and read by nothing authoritative."
        - "Authored beats and authored entity outcomes DO have one true chokepoint — the script boundary — so they ride the #1223 effect-queue pattern: apply_dispatch_result buffers a NarrativeRequest::Authored and emit_authored_and_marked_entity_narrative turns it into an event, because the applier holds no message writers."
        - "A marked hull cannot vanish silently. The engine has TWO removal paths and only one of them is a kill: ActionCmd::DestroyEntity (ctx.effects.destroy_entity, and its deferred schedule form) despawns without writing a BalanceEvent, and it must keep doing so — an authorial removal in the combat ledger would make a rescue-by-despawn count as a destruction in the AAR, which is exactly what PRD #1337's supplements-never-changes rule forbids. So the applier queues a NarrativeRequest::ScriptedRemoval instead, and the emitter turns it into marked_entity_destroyed ONLY when the run's timeline holds no authored outcome for that entity. An author who despawns a marked hull to mean rescued/escaped/abandoned records that outcome before, or on the same tick as, the destroy; recording it a tick later is too late. The signal is queued for every scripted removal because the applier is lent plain &mut Vec sinks and no component query, so the NarrativeMark gate lives in the emitter, which already remembers every marked uuid it has seen."
        - "String Ids, never localized prose: an Objective's text, a Comms body, a deadline's label all pass through verbatim, so the timeline is byte-stable across locales and downstream analysis can localize or narrate it consistently."
    architecture:
      kind: telemetry-emitter
      authority: observational
      reads: [objective-runtime-state, mission-deadline-state, balance-event-stream, comms-inbox-state]
      produces: [narrative-event-stream]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/narrative.rs, src/narrative.rs, src/objectives.rs, src/world/dispatch.rs, src/world/server.rs, src/world/script/effects.rs, src/world/config.rs, src/world/validate.rs, src/console/comms/server.rs, src/server_app/registration.rs, src/server_app/world_setup.rs, src/core/computer_message.rs]
      symbols: [NarrativeEvent, NarrativeKind, NarrativeActor, NarrativeValue, NarrativeMark, NarrativeRequest, ObjectiveTransition, emit_scenario_narrative, emit_authored_and_marked_entity_narrative, tick_computer_message, ActiveComputerMessage, ComputerMessageRequest]
      tests: [cargo test, tests/narrative_timeline.rs]

  - state: narrative-event-stream
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Event Stream
      summary: The NarrativeEvent message stream and the authored NarrativeMark component that gates its entity half — one event per authored mission-timeline moment, carrying an event kind, an authored semantic identifier or String Id, an optional source Station/System/entity, an optional target, and structured outcome data.
      rationale:
        - "NarrativeMark is Presentation-class for the #894 digest boundary: the fixed tick never reads it, nothing branches on it, and neither sim_digest nor snapshot walks it. It decides only what the after-action surface SHOWS."
        - "The event itself carries no timestamp. The monotonic sequence, the fixed sim tick and the derived sim time are stamped at COLLECTION, so a chokepoint only has to know what it knows and the sequence is a total order across every emitter."
    architecture:
      classification: observational
      owner: narrative-event-emitter
      writers: [narrative-event-emitter]
      readers: [narrative-telemetry-collector]
    implementation:
      status: declared
      paths: [src/core/narrative.rs]
      symbols: [NarrativeEvent, NarrativeKind, NarrativeMark]
      tests: [cargo test]

  - component: narrative-telemetry-collector
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Telemetry Collector
      summary: Headless-only system that drains the NarrativeEvent stream each tick, assigning each event its run-scoped monotonic sequence and stamping it with the fixed SimTick and derived sim time, into the run telemetry buffer's narrative vector — and, under --format ndjson, pushing the timeline-eligible ones onto the inline stream.
      rationale:
        - "A SECOND collector beside collect_balance_events rather than an extra arm of it, chained after it in Last so an ndjson tick reads traffic-then-combat-then-story and the sequence is a fixed function of the tick rather than of executor order."
        - "Always folds, filters only the stream — the same split the balance collector makes. NarrativeKind::in_timeline_stream holds ReportRowUpdated out of the ndjson flow because a re-scored report row is a rate, not a beat; its final value arrives in the folded timeline and in ReportFinalized."
    architecture:
      kind: telemetry-collector
      authority: observational
      reads: [narrative-event-stream]
      produces: [run-telemetry-state]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/headless/report.rs, src/headless/app.rs, src/core/telemetry.rs]
      symbols: [collect_narrative_events, StampedNarrativeEvent, RunTelemetry]
      tests: [cargo test, tests/narrative_timeline.rs]

  - component: narrative-timeline-projector
    core:
      status: implemented
      confidence: confirmed
      title: Narrative Timeline Projector
      summary: Pure fold over the stamped narrative log producing the run report's mission timeline — every event in monotonic sequence order plus a per-kind census — hand-encoded into the report JSON beside the combat ledgers.
      rationale:
        - "Pure, with no ECS access, so the projection is unit-testable without booting an app — the same shape combat-ledger-aggregator has, and deliberately NOT folded into the ledgers or the outcome classification: PRD #1337 keeps the story surface beside the combat ledger, never inside it."
        - "Present in EVERY report with no debug flag, like damage_by_ship and station_activity. A run with nothing authored reports count: 0, which says the scenario told no story without a reader having to know whether a flag was on. Only the inline ndjson stream is format-gated."
        - "Determinism: nothing in sim_digest.rs or snapshot.rs reads a narrative event, and no fold stage walks RunTelemetry's narrative vector, so recording is inert to the authoritative digest by construction. tests/narrative_timeline.rs A/Bs the JSON and NDJSON formats of the same seeded run and requires every digest-relevant report field to match byte for byte."
    architecture:
      kind: pure-aggregator
      authority: observational
      reads: [run-telemetry-state]
      produces: [run-report-artifact]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/core/narrative.rs, src/headless/report.rs]
      symbols: [fold_narrative, NarrativeTimeline, RunReport]
      tests: [cargo test, tests/narrative_timeline.rs]

short_code = "HLM"
console = "gui/battleship/helm.html"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.ship_harrow_cruiser.station.tactical.description"
rank = "Lt. Cmdr."
short_code = "TAC"
console = "gui/battleship/tactical.html"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "engineering"
name = "Engineering"
description = "entity.ship_harrow_cruiser.station.engineering.description"
rank = "Ltn."
short_code = "ENG"
console = "gui/battleship/power.html"

[[station.rating]]
name = "Std"
automated_systems = []

# ── Systems ───────────────────────────────────────────────────────────────────
#
# Red Alert authored explicitly (issue #871) rather than left to the #749
# ownerless provision, so the Captain seat owns it. Control source is unchanged:
# Backfill automates it.
[[system]]
id = "red-alert"
kind = "red_alert"
station = "captain"

[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "helm"

[[system]]
id = "helm-steering"
kind = "helm_steering"
station = "helm"

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
station = "helm"

# Declared for hull-uniformity with every other ship: no state in this doctrine
# engages boost (and there is no `[helm_console.boost]` block), so the
# declaration only gives the axis the standard damage/repair surface.
[[system]]
id = "helm-boost"
kind = "helm_boost"
station = "helm"

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
station = "helm"

# The Tactical radar (issue #871) — the system every player hull declares and no
# NPC hull did, which is what blocked #887 from routing AI target selection
# through admission.
[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"

# Fine Tactical systems (issue #512): one per phaser bank, following the
# `phaser-<bank_id>` naming convention. Without these entries neither bank is
# registered as AI-operable and the hull would never fire at all.
[[system]]
id = "phaser-fore"
kind = "phaser_bank"
station = "tactical"

[[system]]
id = "phaser-aft"
kind = "phaser_bank"
station = "tactical"

# Ship-wide phaser settings: firing mode + emitter frequency. One declared system
# (NOT per-bank) so SetPhaserMode/SetPhaserFrequency admission gates on a real
# system.
[[system]]
id = "phaser-control"
kind = "phaser_control"
station = "tactical"

# Fine torpedo systems (issue #791): one per tube, following the
# `torpedo-tube-<tube_id>` convention (underscores folded to hyphens), plus the
# shared magazine. Without the magazine entry NEITHER the loader nor the launcher
# runs at all — both gate on it before they look at a tube — and without a tube's
# own entry that tube is never AI-operable, so the salvo could never be full.
[[system]]

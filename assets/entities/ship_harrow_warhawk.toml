# Harrow Battleship (Warhawk class)
#
# Heavy capital ship. Two long-range phaser banks (port + starboard),
# heavy shielding, slow but devastating. (#474) Rebalanced for the
# combat-test scenario (#475) — gained a full behaviour tree (previously
# only had `initial_state = "idle"` and a stub `attacking` state with
# no transitions, so the ship spawned and sat there), gained weapons
# (no `[weapons_console]` block before), gained shields, slowed down.

name = "Harrow Battleship"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "high"
description = "Harrow Battleship"

[hull]
hull_integrity = 280.0

# Single omni shield arc (issue #514). NPCs have no `[shields]` station so
# the auto-generated `[[system]]` entry is `ai_only = true` and ownerless.
[[shield_arc]]
id = "all"
label = "All"
center_deg = 0
width_deg = 360
max_hp = 120
regen_per_sec = 1.5

[collider]
shape = "Capsule"
radius = 5.0
length = 12.0

[radar_appearance]
colour = [0.9, 0.2, 0.05]
size = 12.0
icon = "battleship"

[mesh]
model = "assets/models/dynasty_battleship.glb"
shape = "cuboid"
size = [10.0, 3.0, 16.0]
colour = [0.9, 0.2, 0.05]

# Slower than the cruiser; the battleship is a deliberate threat the
# player must engage, not a kiteable nuisance.
[helm_console]
max_speed = 9.0
max_reverse_speed = 4.5
acceleration = 3.0
deceleration = 9.0
max_yaw_rate = 0.12
max_bank_deg = 5.0

[helm_console.engine_pfx]
color = [ 1.0, 0.22, 0.08, 0.68 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.65

[weapons_console]

# Port heavy bank.
[[weapons_console.phaser_banks]]
id = "port"
facing_deg = -90.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 75.0
beam_damage_per_sec = 12.0
beam_duration_secs = 8.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.15, 0.05, 1.0]

# Starboard heavy bank.
[[weapons_console.phaser_banks]]
id = "starboard"
facing_deg = 90.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 75.0
beam_damage_per_sec = 12.0
beam_duration_secs = 8.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.15, 0.05, 1.0]

[comms]
range = 800.0

[ai_profile]
aggression = 0.9
sensor_range = 150.0

# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# (#572) Doctrine-based behaviour (FSM dissolved). Destroy always outscores
# Patrol so the battleship immediately engages any hostile it detects.

[behaviour]

[[behaviour.doctrine]]
id            = "patrol-warhawk"
text          = "Patrol the sector"
directive_kind    = "Patrol"
directive_anchors = ["warhawk_patrol_a", "warhawk_patrol_b"]
directive_loop    = true
base_priority     = 20.0
target_speed      = 0.5

[[behaviour.doctrine]]
id            = "destroy-hostiles"
text          = "Engage and destroy hostile ships"
directive_kind = "Destroy"
base_priority  = 35.0
target_speed   = 0.9
maintain_range = 60.0

# Ship systems (all AI-controlled - no human consoles)
# Per-axis helm systems (issues #701/#703, declared in #800 and #704). This hull
# has no stations, so they are ownerless and `ai_only`. The NPC spawn path sets every declared system to
# ControlSource::Ai, so these come up on AI precisely when the coarse helm does.
#
# #800 declared thrust + steering. #704 adds impulse + lateral-thrust, which the
# deleted `operate_helm_ai` monolith used to drive on this hull's behalf: an
# undeclared system resolves to ControlSource::Human (`operate_ai = false`), so
# the monolith never stood down from those two axes here. Declaring them hands
# both to `ai_helm_impulse` / `ai_helm_lateral_thrust` on exactly the ticks the
# monolith drove them, which is what makes the delete behaviour-preserving.
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
ai_only = true

[[system]]
id = "helm-steering"
kind = "helm_steering"
ai_only = true

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
ai_only = true

# Boost drive axis (issue #801), declared for hull-uniformity with the player
# ships: every helm axis is a declared system on every hull. No AI drives
# boost, so on this stationless hull the declaration only gives the axis the
# standard damage/repair surface.
[[system]]
id = "helm-boost"
kind = "helm_boost"
ai_only = true

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
ai_only = true

# Fine Tactical systems (issue #512): port + starboard phaser banks. No torpedoes.
[[system]]
id = "phaser-port"
kind = "phaser_bank"
ai_only = true

# Ship-wide phaser settings (issue #801): firing mode + emitter frequency.
# One declared system (NOT per-bank) so SetPhaserMode/SetPhaserFrequency
# admission gates on a real system instead of the deleted coarse `tactical`.
[[system]]
id = "phaser-control"
kind = "phaser_control"
ai_only = true

[[system]]
id = "phaser-starboard"
kind = "phaser_bank"
ai_only = true

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
ai_only = true

[[system]]
id = "power-battery"
kind = "power_battery"
ai_only = true

# Same actual execution owners; a report is not permission or physical repair.
[domain]
format=1
id="committed-assistance"
exports=["restore-after-report"]
requires=["communication_report_status","repair_internal"]
[[task]]
kind="compound"
id="restore-after-report"
parameters=[{name="actor",kind="actor"}]
[[task.method]]
id="report-before-work"
step=[{id="status",task="request-status",arguments={actor={source="parameter",name="actor"}}},{id="repair",task="restore-engineering",arguments={actor={source="parameter",name="actor"}}}]
edge=[{from="status",to="repair",when={kind="communication_reported"}}]
[[task]]
kind="primitive"
id="request-status"
parameters=[{name="actor",kind="actor"}]
definition="status"
[task.request]
kind="communication"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="comms"}}
recipient={source="literal",value={kind="actor",value="status-reporter"}}
channel="public"
request="report_status"
[[task]]
kind="primitive"
id="restore-engineering"
parameters=[{name="actor",kind="actor"}]
definition="restoration"
[task.request]
kind="repair"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="repair"}}
team={source="literal",value={kind="team",value=0}}
request={source="literal",value={kind="repair_request",value={type="Work",data={kind="compartment",compartment="engineering"}}}}
target={source="literal",value={kind="repair_target",value={kind="compartment",compartment="engineering"}}}
goal={source="literal",value={kind="repair_goal",value="structure"}}
[[situation_definition]]
id="status"
initial="reported"
[[situation_definition.state]]
id="reported"
when={kind="communication_reported"}
call={script="tests/fixtures/committed-assistance-world.toml#script.setup",function="credit_report"}
[[situation_definition]]
id="restoration"
initial="achieved"
[[situation_definition.state]]
id="achieved"
when={kind="achieved"}

call={script="tests/fixtures/committed-assistance-world.toml#script.setup",function="complete_assistance"}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.courier_tactical.doc_title">Project Phoenix — Courier Tactical</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }.frame { height: 100%; }
    .panel-inner { height: 100%; box-sizing: border-box; padding: 18px 32px; display: flex; flex-direction: column; gap: 10px; }
    .body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .col { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--edge); background: rgba(var(--rgb-panel), .6); }
    h2 { margin: 0; padding-bottom:5px; border-bottom:1px solid var(--edge); color:var(--ink-dim); font:600 var(--text-xs) "Chakra Petch",sans-serif; letter-spacing:.24em; text-transform:uppercase; }
    ph-tactical-radar, ph-sensor-radar { width: 100%; aspect-ratio: 1 / 1; flex-shrink: 0; }
    .sticks { display:grid; grid-template-columns:1fr 1fr; gap:8px; }.buttons { display:flex; gap:8px; }.buttons > * { flex:1; }
    @media (orientation: portrait) { .panel-inner { padding:10px; }.body { grid-template-columns:1fr; overflow:auto; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Courier Tactical" data-i18n-attr="data-screen-label:console.courier_tactical.screen_label">
    <div class="panel"></div><div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. -->
      <div class="body">
        <div class="col" role="region" tabindex="0" aria-labelledby="courier-tactical-heading" data-semantic-action-context="tactical"><h2 id="courier-tactical-heading" data-i18n="console.tactical.weapons">Weapons</h2><ph-tactical-radar id="tactical-radar"></ph-tactical-radar><ph-blasters-controls id="blasters"></ph-blasters-controls><h2 data-i18n="console.tactical.sensors">Sensors</h2><ph-sensor-radar id="sensor-radar"></ph-sensor-radar><ph-sensor-panel id="sensor-panel"></ph-sensor-panel></div>
        <div class="col" role="region" tabindex="0" aria-labelledby="courier-helm-heading" data-semantic-action-context="helm"><h2 id="courier-helm-heading" data-i18n="console.tactical.helm">Helm</h2><div class="sticks"><ph-helm-joystick id="helm"></ph-helm-joystick><ph-lateral-thrust-joystick id="lateral"></ph-lateral-thrust-joystick></div><div class="buttons"><ph-impulse-btn id="impulse"></ph-impulse-btn><ph-boost-btn id="boost"></ph-boost-btn></div></div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-tactical-radar.js';
    import '../components/ph-blasters-controls.js';
    import '../components/ph-sensor-radar.js';
    import '../components/ph-sensor-panel.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-lateral-thrust-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import { initConsole } from '../console-core.js';
    import { createSemanticSubcontextController } from '../composite-action-routing.js';
    // The render lives in gui/courier/tactical.console.js (issue #1234): the
    // shared Tactical renderer + this hull's variant (sensors + helm tail). s is
    // a system-id-keyed SystemStationConsolePayload. The vitest suite imports the
    // same renderStation.
    import { renderStation, supportsCourierTacticalAction } from './tactical.console.js';
    const actionSubcontext = createSemanticSubcontextController(document, {
      defaultContext: 'tactical',
    });
    const runtime = initConsole({
      name: 'tactical',
      render: renderStation,
      actionFamilies: ['helm'],
      getActionContext: actionSubcontext.getContext,
      supportsSemanticAction: (actionId, context) => (
        supportsCourierTacticalAction(actionId, context, document)
      ),
    });
    window.addEventListener('pagehide', () => {
      actionSubcontext.dispose();
      runtime.disposeSemanticActions();
    }, { once: true });
  </script>
</body>
</html>

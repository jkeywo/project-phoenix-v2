      symbols: [tick_radio, PaidRadioWork, CurrentPaidEndpoints]
  - state: current-paid-radio-work
    core:
      status: implemented
      confidence: confirmed
      title: Ephemeral Current Radio Paid Fraction
      summary: "Exactly PaidRadioWork: actual owning System, original payment tick and bounded raw paid fraction. Rust StateClass::Cache; this derived receipt is not canonical energy or another payment owner, is excluded from capture/digest, and resets on restore. Missing, wrong-owner or stale-tick receipts read zero. Current endpoints are local call values, not an additional registered state type."
    architecture:
      classification: derived
      owner: current-paid-radio-work-producer
      writers: [current-paid-radio-work-producer]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/comms/radio.rs, crates/phoenix-simulation/src/comms/paid_radio.rs, crates/phoenix-simulation/src/snapshot/application.rs]
      symbols: [PaidRadioWork]

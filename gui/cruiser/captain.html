<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.captain.doc_title">Project Phoenix — Captain Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    /* Camera cross + Red Alert (issue #1392). Landscape/desktop is the
       default: the Command column is one of two narrow side-by-side columns,
       so the cross needs the column's full width and Red Alert stacks UNDER
       it. Portrait stacks Command/Mission full-width top-to-bottom, so the
       Command column is wide enough to put the cross and the circle side by
       side instead — the direction flips in the portrait media block below.
       `align-items: stretch` (the flex default) does the rest: it makes both
       controls full-width when stacked, and full-height-of-row when side by
       side, with no extra sizing CSS needed. */
    .controls-row { display: flex; flex-direction: column; gap: 12px; }
    .controls-row ph-camera-select { flex: 1; min-height: 0; }
    .controls-row ph-red-alert { flex-shrink: 0; }
    ph-objective-list { flex: 1; min-height: 0; }
    ph-deadline-list { flex-shrink: 0; padding-top: 4px; border-top: 1px solid var(--line-soft); }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .console-body { grid-template-columns: 1fr; gap: 8px; }
      .console-body .col { padding: 8px; }
      .controls-row { flex-direction: row; }
    }
    @media (orientation: landscape) { .console-body .col:first-child { border-right: none; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Captain Console" data-i18n-attr="data-screen-label:console.captain.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The battlespace
           contact count heads the command column it describes. -->
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.captain.command">Command</h2>
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
          </div>
          <div class="controls-row">
            <ph-camera-select id="camera-select"></ph-camera-select>
            <ph-red-alert id="red-alert"></ph-red-alert>
          </div>
        </div>
        <div class="col">
          <h2 data-i18n="console.captain.mission">Mission</h2>
          <ph-objective-list id="objective-list"></ph-objective-list>
          <ph-deadline-list id="deadline-list"></ph-deadline-list>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-camera-select.js';
    import '../components/ph-red-alert.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-deadline-list.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/cruiser/captain.console.js (issue #1235): the
    // shared Captain renderer + this hull's variant. s is a flat
    // CaptainConsolePayload. The vitest suite imports the same renderStation.
    import { renderStation } from './captain.console.js';
    initConsole({ name: 'captain', render: renderStation });
  </script>
</body>
</html>

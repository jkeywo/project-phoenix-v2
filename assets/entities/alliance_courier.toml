# [ai] Increment 10 mechanical access gate; ordinary System authority and AI.
[[system]]
id = "weapons-access"
kind = "access-gate"
console = "captain"

[[system.component]]
kind = "access_boundary"
id = "hatch"
sealed_channel = "sealed"
transition_secs = 1

[[system.channel]]
name = "sealed"
kind = "boolean"

[system.config.ai]
root = "access-gate"

[[system.config.ai.tree]]
id = "access-gate"
initial = "follow-order"

[[system.config.ai.tree.state]]
id = "follow-order"

[[system.config.ai.tree.state.task]]
id = "respect-seal"

[system.config.ai.tree.state.task.action]
kind = "write"
channel = "sealed"

[system.config.ai.tree.state.task.action.value]
source = "fact"
name = "seal_requested"
[[system.damage_component]]
id = "hatch"
binding = "operation"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true

[system.damage_component.susceptibility]
physical = 1
laser = 1


  - component: system-kind-registry
    core:
      status: implemented
      confidence: confirmed
      title: System Kind Descriptor Registry
      summary: Code-backed authoritative descriptors that validate ship-authored System kinds and require Console Family metadata for every shipped kind. A separate descriptor table assigns presentation families to reserved/aggregate blackboard keys without registering them as Systems. Issue #1253 adds command capability to the System descriptor rather than creating a parallel registry.
      rationale:
        - "One id, one meaning (#801). Identifiers live in exactly one of three namespaces: system ids (declared [[system]] instances that get a ControlSource, gate admission, and can be damaged), station ids (crew stations that key console-level blackboards and channel-3 coordination routing), and wire targets (the target of a ControlSystem envelope, always a system id)."
        - "The coarse helm and tactical systems were deleted by #801: \"helm\" and \"tactical\" are now station ids only, carried inside SystemId-typed maps via the helm_station_key / tactical_station_key helpers. No [[system]] block declares them, no ControlSource is registered for them, and no ControlSystem message may target them."
        - "Console Family is presentation metadata, not an authority source: every instance projects by kind regardless of its authored instance or owning Station id, while the authored id remains command authority."
        - "Reserved and aggregate blackboard keys declare their affected Console Family in a separate map because those channels are not Systems and must not acquire control-source, damage, ownership or command semantics."
    architecture:
      kind: registry
      authority: authoritative
      owns: [system-console-family-projection-state, blackboard-console-family-projection-state]
      reads: [ship-station-system-topology-state]
      produces: [system-console-family-projection-state, blackboard-console-family-projection-state]
      validates: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/system_registry.rs, src/entities/spawner.rs, src/dock/server.rs, src/lobby/server.rs, src/core/messages.rs]
      symbols: [SystemKindRegistry, SystemKindDescriptor, BlackboardKeyDescriptor, ConsoleFamily, ShipClientConfig]
      tests: [cargo test]

  - state: system-console-family-projection-state
    core:
      status: implemented
      confidence: confirmed
      title: System Console Family Projection State
      summary: Complete selected-ship System instance id to Console Family metadata derived from authoritative kind descriptors and replicated in Welcome. Every shipped hull and System kind is covered; instance ids may be arbitrary without changing presentation selection.
    architecture:

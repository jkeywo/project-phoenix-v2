[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_common_4
# Known stubborn mesh: plain regeneration comes out larger than the adopted
# baseline below and the growth gate refuses it. Reach for the Blender voxel
# pre-pass (remesh_voxel_size + --remesh, scripts/blender-voxel-remesh.py)
# before --force.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_common_4.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_common_4_lod1.glb"

[lod.generate]
source = "assets/models/asteroid_common_4.glb"
ratio = 0.25
error = 0.01
texture_size = 512

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_common_4_lod2.glb"

[lod.generate]
source = "assets/models/asteroid_common_4.glb"
ratio = 0.05
error = 0.01
texture_size = 256

[[lod]]
shape = "sphere"
colour = [ 0.2814, 0.2592, 0.2343 ]
radius = 1.9354
scale = [ 1.0, 0.6707, 1.0315 ]

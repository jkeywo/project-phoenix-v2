name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  # Compiles the server WASM and assembles dist/.  Uploads it as an artifact
  # so the smoke job doesn't recompile.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-smoke-${{ hashFiles('Cargo.lock') }}

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build server page (WASM + JS)
        run: trunk build --release

      - name: Copy client page
        run: mkdir -p dist/client && cp client.html dist/client/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Smoke tests ──────────────────────────────────────────────────────────────
  # Downloads the pre-built dist/, starts a static server, and runs Playwright.
  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/smoke/package.json

      - name: Install Node dependencies
        working-directory: tests/smoke
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests/smoke
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests/smoke
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: target/playwright-results.json
          retention-days: 7

      - name: Publish results to job summary
        if: always()
        working-directory: tests/smoke
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          npx playwright test --reporter=list 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

# Reusable real Security acquisition. No clocks/stock/ownership are forecast facts.
[domain]
format=1
id="security-acquisition"
exports=["acquire"]
requires=["acquire_vessel"]

[[task]]
kind="primitive"
id="acquire"
parameters=[{name="actor",kind="actor"},{name="target",kind="vessel"},{name="team",kind="team"}]
definition="acquisition"
[task.request]
kind="acquire_vessel"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="security"}}
team={source="parameter",name="team"}
target={source="parameter",name="target"}

[[situation_definition]]
id="acquisition"
initial="acquired"
[[situation_definition.state]]
id="acquired"
when={kind="achieved"}
next="home"
[[situation_definition.state]]
id="home"
when={kind="settled",outcome="completed"}

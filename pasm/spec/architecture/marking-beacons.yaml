      confidence: confirmed
      title: Derived Accepted Marking Equipment Profile
      summary: "Exactly MarkingBeaconProfile, declared Rust StateClass::Derived. Its immutable configured sensor/radio/channel values are regenerated by the accepted entity installer and checked against the frozen recipe during continuation. It is excluded from snapshots and the state fold as duplicate accepted content."

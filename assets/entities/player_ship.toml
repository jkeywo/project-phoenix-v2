display_name = "Power Battery"
max_hp = 10
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.15

# Coarse `Shields` hull entry retired (issue #514). Per-arc hull HP lives on
# the `[[shield_arc]] hull_max_hp` fields below; total preserved at 25 HP
# (7 + 6 + 6 + 6 = 25).

[[hull.system_hull]]
system_id = "core"
display_name = "Core"
max_hp = 20
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25

# Committed mod-pack fixture (issue #991): the manifest names a root world the
# pack does NOT carry and no base content provides, so it cannot be resolved at
# all. The host rejects it with `missing-scenario-world`. (The pack is
# manifest-only — there is no world file to carry.)
#
# Regenerate the .zip with `node scripts/build-mod-pack-fixtures.mjs`
# (byte-reproducible; gated by `--check`). The SAME .zip bytes are validated
# from both Rust (src/world/mod_pack.rs) and the browser smoke spec
# (tests/smoke/mod-pack.spec.js).

[pack]
format = 1
id = "unresolved-manifest-world"
version = "1.0.0"
name = "Unresolved Manifest World"

[pack.requires]
content_id = "phoenix-base"
content_epoch = 1

[[scenario]]
id = "ghost"
world = "assets/worlds/ghost_world.toml"

  - component: roadmap-broken-tithe-foundation
    core:
      status: accepted
      confidence: confirmed
      title: Broken Tithe Foundation — Unified Resource Network and Control Tiers
      summary: "Release D. Generalise the #858 infrastructure-network model into one producer/conduit/buffer/consumer graph ruling power, coolant, containment and life-support load, ship-side and external alike. Power becomes full per-component supply/demand with ship-wide hard battery exhaustion and a separate per-system heat/overpower axis. Life-support failure creates authored survival clocks and crewed-system pressure without individual biological simulation. Engineering/Power detail adds the network graph, load-shedding and one-tap presets from hull defaults plus a small run-local custom set. Repair detail adds diagnostics, triage, repair material and symptom-to-order procedures: the local station reports a symptom, Engineering issues the mapped order, and a wrong order costs time only; lower complexity or accessibility assistance may reveal/automate the mapping after a delay. Shields gains detailed frequency/modulation and arc management. Add named bulk resources, main-drive propellant and repair material, plus docked repair, replenishment and resource transfer."
      rationale:
        - "Binding invariants on the power redesign: no reactor-side floors (the 2026-08-10 revert's lesson stands), Backfill/NPC min_reserve guards kept and re-expressed over network state, and the three-group vocabulary [helm, weapons, shields] kept as the group-level control tier. The exhaustion-lock mechanism alone is open: it is the incumbent a network-native alternative must beat with playtest evidence, and it survives in network terms by default."
        - "The group-level tier's limited AI is the fine-system policy runtime with authority scoped to power allocation — the same machinery as Backfill doctrine, so AI/human symmetry holds and no second control intelligence exists."
        - "2026-08-17 customisation grill: the supply/demand redesign is FORCED by roadmap-ship-customisation, not chosen for its own sake — soft-budget loadout customisation is impossible on a boost model where power is a group-wide amplifier and a stronger component costs nothing extra to run. The redesign deliberately KEEPS the exhaustion lock on the energy side (John: 'battery then hard lock while it recharges') and RE-HOMES the boost model as the per-system overpower band rather than deleting it, so the net churn is the demand input and the new heat axis, not the failure model. Consequence: D's foundation PRD is materially larger than the pre-grill 'network + load-shedding' scope, and the estimate should be revised UP now rather than when the band opens. Three derived calls await ratification: ops-as-aux-bucket, coolant-at-detail-tier, and the not-upgrade balance contract (a maxed loadout's baseline demand exceeds sustainable generation; the #835 duel harness enforces no dominant loadout)."
        - "Consumables pass the test 'can another bridge officer make a consequential decision about this resource within a 30-90 minute mission': main-drive propellant is the currency of #860's long-duration operational budgets, repair material turns repair-team work into triage. RCS propellant is excluded (no thruster-level flight), reactor fuel stays scenario-infinite, and bodily needs stay out."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, spawned-entity-state, world-snapshot-artifact]

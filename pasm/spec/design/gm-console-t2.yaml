entities:
  - decision: gm-t2-peer-and-admission-contract
    core:
      status: accepted
      confidence: confirmed
      title: T2 GM Peer, Admission, and Readiness Contract
      summary: "A browser GM runs the same headless authoritative simulation as every other host-class peer and joins through T1's Phoenix transport. The privileged server code admits either an open player-ship slot or the GM role after rendezvous; a GM consumes no ship slot and a crew code cannot request GM. Connected GMs are mechanically equal, each has a ready state, and each counts toward collective autostart; spectators do not. Any GM may force-start past readiness only, never past validation. A GM-only roster starts when all connected GMs are ready or one force-starts."
      rationale:
        - "This keeps one deterministic simulation and command protocol instead of building a privileged state-streaming server for the GM surface."
        - "Role presets filter presentation only. They never create permission tiers, locks, a leader, or ownership of GM actions."
        - "The native-local-gm-workspace contract adds a distinct local operator to the existing native ship simulation. Its private embedded screen uses the same projections and typed actions without adding a browser GM-only boot profile, another simulation or another fleet peer. Browser GM admission and transport remain as specified here."
        - "T2 is designed against the final T1 host-admission, deterministic multi-host, record-transfer, and divergence-recovery contracts; it does not ship a temporary single-host compatibility topology."
        - "PRD #930 was decomposed on 2026-08-29 into tracer-bullet issues #1289-#1320. M1 is #1289-#1300, M2 is #1301-#1316 (including shared confirmation tracer #1315 under PRD #1273), and M3 is #1317-#1320. The exits are evidence-producing issues #1300 (AFK), #1316 (AFK), and #1320 (HITL), not horizontal milestone trackers."
        - "[ai] #1316 prepares one opt-in real Combat Test browser recording in tests/smoke/gm-m2.spec.js, with two equal GMs and fixed initial crew ratings. tests/smoke/gm-m2-evidence.js observes actual submissions, private confirmation decisions and outgoing crew traffic; the normal origin export and final GameOver autosave define the exact replay boundaries. Ordinary saves omit human-command history, so this proof refuses crew input or seat/rating changes and makes no general attended replay claim. Combat Test adds optional GM palettes and exposes existing wave controls; Skip is offered only on a report, preserving the wave-count victory guard. docs/acceptance/1316-m2-combat-test.md describes invocation, retained evidence and the completed local milestone. The native verifier checks the exact restored origin, applied results and final digest; collector evidence separately establishes the absence of omitted crew input."
        - "[ai] The #1316 recorded browser proof is bounded to GM-only input and immutable crew. The native recorded_gm replay helper restores an ordinary manual StoredRun with the saved authored UUIDs and full frozen fleet, seeds local Sessions from that fleet without clearing crew, and requires the exact initial digest before appending the recorded GM request suffix through the ordinary journal. It drives the final tick and applied frontier, deriving and comparing actual outcomes and final digest rather than installing the final snapshot. Versions/content/scenario/seed/topology, prefix ordering and unchanged recovery history gate the pair. Ordinary save exports omit crew command and seat/rating history, so the browser collector must separately witness that none occurred; this is not general attended-session replay. The final ordinary GameOver autosave is a supported boundary."
        - "[ai] The #1316 content boundary binds ordinary browser and native records to the declared available hulls and compiled root scripts. Native eager recording includes the uncurated available_ships set alongside static, palette and compiled-spawn paths. HostPreloaded defers its one-time freeze until Startup has recorded the root-script digest, before setup_world and spawn_world_entities; FromReader retains its ingest-time freeze. Existing incompatible browser records are refused, never rewritten or admitted by relaxing the content gate. This does not claim curated-manifest or root-sibling preload parity beyond the covered browser path."
    architecture:
      kind: session-policy
      authority: authoritative
      coordinates: [gm-milestone-peer-tracer, roadmap-band-a2-native-network-foundation]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: gm-operator-admission-and-presence
    core:
      status: implemented
      confidence: confirmed
      title: Reconnectable Equal-GM Admission and Presence
      summary: "The privileged fleet-host path admits either its existing player-ship role or a GM role. Each GM receives a stable public gm-N identity and a private reconnect capability, consumes no ship capacity, has no Station or leader bit, and remains visible in a separately projected roster. Crew admission has no GM request surface. Rust validates and full-replaces the bounded public {id, name, connected, ready} roster, then publishes it through Welcome, GmRosterChanged, and the host lobby projection without changing player ship-slot policy. A Lobby reconnect retains identity and clears readiness. After freeze, only the correct private capability for the exact disconnected operator and departed technical slot auto-pends a divergence-safe paused restore; matching-digest Commit preserves that row and rejoins its existing wait-set slot."
      rationale:
        - "The host-mesh technical slot still authenticates deterministic peer traffic, but it is deliberately absent from the public GM row and grants no operator precedence."
        - "Keeping reconnect capability and rendezvous peer identity out of the authoritative public roster prevents transport bookkeeping from becoming simulation identity or crew-visible authority."
        - "The nullable role preset placeholder is private browser identity metadata only; it never enters GmOperator, the frozen roster, snapshots, or digests."
    architecture:
      kind: session-identity-registry
      authority: authoritative
      coordinates: [gm-t2-peer-and-admission-contract, gm-milestone-peer-tracer]
      runs_in: [host-browser-runtime, phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/host-mesh.js, gui/fleet-session.js, src/gm_roster.rs, src/gm_join.rs, src/lockstep/mod.rs, src/lockstep/session.rs, src/core/messages.rs, src/lobby/server.rs, src/server/bridge.rs, gui/lobby-state.js, gui/host-lobby-view.js, gui/lobby-view.js, server.html, client.html]

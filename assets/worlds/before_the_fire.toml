# Before the Fire — Axiom System scenario
#
# The player arrives in the Axiom System to investigate a distress signal.
# Ashrender (a Harrow Warhawk-class warship) is dormant near the nebula until
# activated by a world trigger. The Requiem Courier carries a cryptic warning.

[global]
seed = 399
title = "world.before_the_fire.global.title"
description = "world.before_the_fire.global.description"

[ambient_light]
color      = [0.55, 0.55, 0.65]
brightness = 280.0

# Red-alert audio. `siren` is a one-shot on the false→true edge; `music` loops
# underneath for as long as the alert is active. Every other sound is
# configured on the ship entity instead.
[audio.red_alert]
siren_file   = "assets/sounds/red_alert_siren.ogg"
siren_volume = 0.7
music_file   = "assets/sounds/last_stand_in_space_looped.ogg"
music_volume = 0.35

[anchors]
ship_start         = [200.0, 0.0, 150.0]
axiom_station      = [350.0, 0.0,  50.0]
research_outpost   = [-100.0, 0.0, 450.0]
requiem_courier    = [-230.0, 0.0, -80.0]
ironveil_patrol_a  = [180.0, 0.0, -160.0]
ironveil_patrol_b  = [320.0, 0.0, -280.0]
ashrender_start    = [620.0, 0.0, -380.0]
nebula_center      = [680.0, 0.0, -440.0]
escape_pod_spawn   = [200.0, 0.0, -100.0]

# ── Static map entities ───────────────────────────────────────────────────────

[[entity]]
template_path = "assets/entities/star_sun.toml"
transform = { position = [0.0, 0.0, 0.0] }

[[entity]]
template_path = "assets/entities/asteroid_belt_axiom.toml"
transform = { position = [0.0, 0.0, 0.0] }

[[entity]]
template_path = "assets/entities/planet_earth.toml"
transform = { position = [250.0, 0.0, 300.0] }

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "player-ship"
transform = { anchor = "ship_start" }
spawn_on = "game_start"

# ── Named entities (trigger / comms-eligible) ────────────────────────────────

[[entity]]
template_path = "assets/entities/station_axiom.toml"
name = "world.entity.axiom_station.name"
transform = { anchor = "axiom_station" }

[[entity]]
template_path = "assets/entities/region_axiom_station_dock.toml"
name          = "world.entity.axiom_station_dock.name"
transform     = { anchor = "axiom_station" }

[[entity]]
template_path = "assets/entities/station_research_outpost.toml"
name = "world.entity.research_outpost.name"
transform = { anchor = "research_outpost" }

[[entity]]
template_path = "assets/entities/ship_requiem_courier.toml"
name = "world.entity.requiem_courier.name"
transform = { anchor = "requiem_courier" }

[[entity]]
template_path = "assets/entities/ship_harrow_patrol.toml"
name = "world.entity.ironveil.name"
transform = { anchor = "ironveil_patrol_a" }

[[entity]]
template_path = "assets/entities/ship_harrow_warhawk.toml"
name = "world.entity.ashrender.name"
transform = { anchor = "ashrender_start" }

[[entity]]
template_path = "assets/entities/region_kaleth_nebula.toml"
name = "world.entity.kaleth_nebula.name"
transform = { anchor = "nebula_center" }

# Invisible nav beacons — mark the two waypoints of Ironveil's patrol route.
# Used by btf_path_a objectives to put a gold ring on the nav chart.

[[entity]]
template_path = "assets/entities/nav_beacon.toml"
name = "world.entity.ironveil_patrol_zone_a.name"
transform = { anchor = "ironveil_patrol_a" }

[[entity]]
template_path = "assets/entities/nav_beacon.toml"
name = "world.entity.ironveil_patrol_zone_b.name"
transform = { anchor = "ironveil_patrol_b" }

# ── Triggers ──────────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-investigate"
  text      = "world.before_the_fire.trigger.action.obj_investigate.text"
  mandatory = true
  targets   = ["world.entity.axiom_station.name"]

[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-hail-briefing"
  text      = "world.before_the_fire.trigger.action.obj_hail_briefing.text"
  mandatory = false
  targets   = ["world.entity.axiom_station.name", "world.entity.research_outpost.name"]

# ── Opening twin comms (on_world_loaded) ─────────────────────────────────────

[[comms]]
thread_id = "starcorp-command"
from = "world.before_the_fire.comms.starcorp_command.from"
trigger = "on_world_loaded"
message = "world.before_the_fire.comms.starcorp_command.message"

[[comms]]
from = "world.entity.axiom_station.name"
trigger = "on_world_loaded"
entity = "world.entity.axiom_station.name"
urgent = true
message = "world.before_the_fire.comms.0.message"

  [[comms.response]]
  text = "world.before_the_fire.comms.response.0.text"

    # Follow-up gated on entering the docking region — fires immediately if
    # the ship is already inside. Lets Axiom Station acknowledge the rendezvous
    # at the moment the player physically arrives, even though the same
    # boundary crossing also loads the Diplomat branch (`btf_path_a.toml`).
    [comms.response.follow_up]
    trigger = "on_entered_region"
    entity  = "world.entity.axiom_station_dock.name"
    message = "world.before_the_fire.comms.response.follow_up.message"

  [[comms.response]]
  text = "world.before_the_fire.comms.response.1.text"
    [comms.response.follow_up]
    message = "world.before_the_fire.comms.response.follow_up.message_2"

# ── Comms templates ──────────────────────────────────────────────────────────

[[comms]]
thread_id = "research-scholar"
from    = "world.entity.research_outpost.name"
trigger = "on_hailed"
entity  = "world.entity.research_outpost.name"
urgent  = true
message = "world.before_the_fire.comms.research_scholar.message"

  # Auto-chained follow-up: 3 seconds after the operator hails, Dr. Myst
  # comes on the line. The chained node carries its own response tree, so
  # the operator can engage a multi-turn conversation without crossing a
  # sub-world boundary. Inherits `thread_id = "research-scholar"` and
  # `urgent = true` from the parent template.
  [comms.follow_up]
  speaker    = "world.before_the_fire.comms.follow_up.speaker"
  trigger    = "on_timer"
  after_secs = 3.0
  message    = "world.before_the_fire.comms.follow_up.message"

    [[comms.follow_up.response]]
    text = "world.before_the_fire.comms.follow_up.response.0.text"

      [comms.follow_up.response.follow_up]
      speaker    = "world.before_the_fire.comms.follow_up.response.follow_up.speaker"
      trigger    = "on_timer"
      after_secs = 2.0
      message    = "world.before_the_fire.comms.follow_up.response.follow_up.message"

        [[comms.follow_up.response.follow_up.response]]
        text = "world.before_the_fire.comms.follow_up.response.follow_up.response.0.text"

          [[comms.follow_up.response.follow_up.response.action]]
          type      = "add_objective"
          id        = "obj-locate-ashrender"
          text      = "world.before_the_fire.comms.follow_up.response.follow_up.response.action.obj_locate_ashrender.text"
          mandatory = false

    [[comms.follow_up.response]]
    text = "world.before_the_fire.comms.follow_up.response.1.text"

      [comms.follow_up.response.follow_up]
      speaker    = "world.before_the_fire.comms.follow_up.response.follow_up.speaker_2"
      trigger    = "on_timer"
      after_secs = 2.0
      message    = "world.before_the_fire.comms.follow_up.response.follow_up.message_2"

        [[comms.follow_up.response.follow_up.response]]
        text = "world.before_the_fire.comms.follow_up.response.follow_up.response.1.text"

[[comms]]
thread_id = "requiem-override"
from    = "world.entity.requiem_courier.name"
trigger = "on_hailed"
entity  = "world.entity.requiem_courier.name"
message = "world.before_the_fire.comms.requiem_override.message"

# ── Branch loading triggers (single-shot, fired on first hail or arrival) ─────

# Fires when the player hails Axiom Station from range.
[[trigger]]
condition = "on_hailed"
entity    = "world.entity.axiom_station.name"

  [[trigger.action]]
  type      = "complete_objective"
  id        = "obj-hail-briefing"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/btf_path_a.toml"

# Fires when the player physically arrives at Axiom Station (proximity 60 u).
# Matches the "proceeding to your location" dialogue response.
[[trigger]]
condition = "on_entered_region"
entity    = "world.entity.axiom_station_dock.name"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/btf_path_a.toml"

[[trigger]]
condition = "on_hailed"
entity = "world.entity.research_outpost.name"

  [[trigger.action]]
  type      = "complete_objective"
  id        = "obj-hail-briefing"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/btf_path_b.toml"

[[trigger]]
condition = "on_attacked"
entity = "world.entity.ironveil.name"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/btf_path_c.toml"

# ── Aphelion Protocol arming — OR-composition (issue #404) ───────────────────
#
# The weapon arms when EITHER:
#   A) Ironveil is destroyed (Ashrender executes contingency immediately), OR
#   B) 600 seconds elapse without Ironveil being destroyed (Ashrender proceeds
#      on schedule).
#
# Both triggers attempt to set_flag aphelion_armed. FlagStore.set_flag is
# idempotent: the false→true transition fires only once, so the on_flag_set
# trigger below fires exactly once regardless of which path arms the weapon.

[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.ironveil.name"

  [[trigger.action]]
  type = "set_flag"
  name = "ironveil_destroyed"

  [[trigger.action]]
  type = "set_flag"
  name = "aphelion_armed"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-ironveil-destroyed"
  text      = "world.before_the_fire.trigger.action.obj_ironveil_destroyed.text"
  mandatory = false

# 600-second fallback: only fires if Ironveil was not already destroyed.
[[trigger]]
condition  = "on_timer"
after_secs = 600.0
when       = "not flag(aphelion_armed)"

  [[trigger.action]]
  type = "set_flag"
  name = "aphelion_armed"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-protocol-timer"
  text      = "world.before_the_fire.trigger.action.obj_protocol_timer.text"
  mandatory = false

# React to aphelion_armed being set (from either path above).
[[trigger]]
condition = "on_flag_set"
name      = "aphelion_armed"

  [[trigger.action]]
  type  = "set_ai_state"
  entity = "world.entity.ashrender.name"
  state = "attacking"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/btf_aphelion_protocol.toml"

# Issue #410 — Save checkpoint intent (no-op until PRD #116 save/load is implemented).
# When PRD #116 lands, insert a `save_checkpoint` action here (on_flag_set aphelion_armed)
# so the game auto-saves before the finale. No TOML schema change needed now.

# Default scenario: Starbase Alpha
#
# Spawns Starbase Alpha near the alpha_point anchor.  The station is hailable
# from the Comms console; hailing triggers a greeting with two response
# branches.  Choosing "We are on a survey mission" adds an optional objective;
# choosing "We require docking clearance" adds a mandatory docking objective.

[[spawn]]
name        = "raider"
entity_path = "assets/entities/pirate_raider.toml"
anchor      = "patrol_alpha"

[[trigger]]
condition = "on_destroyed"
entity    = "raider"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-raider-destroyed"
  text      = "Pirate raider eliminated."
  mandatory = false

# ── Static entities ────────────────────────────────────────────────────────

[[spawn]]
name       = "Starbase Alpha"
entity_path = "assets/entities/station_outpost.toml"
anchor     = "starbase_alpha"

# ── Comms templates ────────────────────────────────────────────────────────

[[comms]]
from    = "Starbase Alpha"
trigger = "on_hailed"
entity  = "Starbase Alpha"
message = "USS Phoenix, this is Starbase Alpha. Please state your business."

  [[comms.response]]
  text = "We are on a survey mission."
    [[comms.response.action]]
    type = "add_objective"
    id   = "obj-survey"
    text = "Complete the survey in this sector."

  [[comms.response]]
  text = "We require docking clearance."
    [[comms.response.action]]
    type      = "add_objective"
    id        = "obj-dock"
    text      = "Dock at Starbase Alpha."
    mandatory = true

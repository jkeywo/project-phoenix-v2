channel = "begin"

[system.config.ai.tree.state.task.action.value]
source = "literal"
value = true

[[station]]
id = "helm"
name = "Helm"
description = "entity.alliance_cruiser.station.helm.description"
rank = "Ltn."
short_code = "HLM"
manual_overview = "You fly the ship. Throttle and steering set your heading and speed; lateral thrust slides you sideways to line up firing arcs or dodge incoming fire; boost and impulse give you short bursts of speed. Watch the short-range radar for hazards. When a berth comes into range a Dock control appears; press it to mate the ship to a structure or tender, and press it again to back clear. Three stars retains every flight control; two stars delegates lateral thrust; one star delegates flight while you keep radar and docking."

[[station.rating]]
name = "Std"
automated_systems = []
detailed_systems = [ "helm-thrust", "helm-steering", "helm-joystick", "helm-engine-port", "helm-engine-starboard", "helm-radar", "helm-impulse", "helm-boost", "helm-lateral-thrust", "dock", "local-jump" ]

[[station.rating]]

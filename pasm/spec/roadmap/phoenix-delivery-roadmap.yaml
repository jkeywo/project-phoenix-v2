  - component: roadmap-planned-not-scheduled
    core:
      status: accepted
      confidence: confirmed
      title: Planned but Not Scheduled — Accepted Dependency Clusters
      summary: "Accepted future work still lacking a release promise after the C1-C9/T1-T6 plan. Human media remains one-to-one simulated Comms calls with consent, private/viewscreen routing, typed text, transient captions and the Discord adapter. Tactical/ship extensions still unscheduled are persistent mines, post-C5 cloaking, expanded EWar and multi-interlock self-destruct. Custom peripherals and external show systems also remain unscheduled. Source-level Rhai debugging beyond M6's diagnostics/traces/state breakpoints is accepted but unscheduled. Structured text/list alternatives for the canvas displays (radar, navigation map, viewscreen) and full screen-reader support are accepted as direction but unscheduled after the 2026-08-21 platform-stream grill. Personnel/Operations, surrender, Pursuit and authored War move to C7; Patrol/War PCG and Orbital Mode move to C8; Sandbox, trade, standing, sector/fleet state and advanced spectator participation move to C9; accessibility assistance is distributed from T1 through C9."
      rationale:
        - "Human media is a Comms capability, not an out-of-fiction voice room. Calls require a known reachable human ship, hail and acceptance; simulated loss interrupts both media tracks and retries for a short grace period. Calls are one-to-one in the first delivery."
        - "Each ship independently routes the accepted call through the device presenting private Comms or promotes audio and video together to the viewscreen endpoint. Existing viewscreen arbitration controls promotion; displacement hands the call back privately without ending it. Media is not recorded, while deliberate typed messages enter the Comms record."
        - "The Discord bot ships with this feature because Discord is the first test environment, but remains an adapter under the same simulated consent/reachability rules. The T1 native/network PRD supplies RTC media capability and per-surface device routing without scheduling this call feature."
        - "The accepted Duty Team/Officer, Operations, Away Mission, boarding, surrender and Medical contracts are now the Band C7 personnel vertical; their detailed design remains authoritative even though this catch-all cluster no longer schedules them."
        - "The station-database framework is shared with Band C6: one evidence/reference model, Intelligence as primary cross-domain correlation, and focused station projections including Engineering procedures, Medical records and Operations history."
        - "C7-C9 preserve the ratified generated-play contracts: exact/evidence-reported Pursuit, one decisive War destination, autonomous allies ordered through Comms, one shared generator/Director, discrete cargo lots, layered standing and discrete warp."
        - "Accessibility profiles remain private and describe effects rather than diagnoses. Their T1-through-C9 increments preserve the guarantee of one compatible station/rating on the base hull at full supported player count for a simple scenario, not solo completion of every complex scenario."
        - "The unscheduled Rhai debugger adds source-expression stepping plus local-variable and stack-frame inspection to M6 Test. M6 already owns compile/runtime source diagnostics, deterministic simulation stepping, host-call/flag/callback traces and scenario-state breakpoints."
        - "Moving a cluster into a band requires a proving scenario or mode, bounded authoritative state, persistence classification, information/accessibility behavior and a vertical acceptance test; moving one cluster schedules none of the others."
    architecture:

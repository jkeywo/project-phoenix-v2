      status: accepted
      confidence: confirmed
      title: Borrowed Sun — Thin Margin Mission 2
      summary: "Add evidence confidence/provenance, networked infrastructure capacity and priority, and dynamic debris hazards around failing orbital mirrors (#858)."
    architecture:

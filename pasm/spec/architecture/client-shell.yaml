  - component: client-station-damage-popup
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Station Damage Popup and Console Chrome
      summary: One header for the whole fleet. No console document draws a title row, a footer strip or a station-damage bar of its own, and the shared console stylesheet reserves no settings-cog gutter; the shell's Station Bar names the seat, and tapping the tab that is ALREADY selected opens a popup listing that Station's individual systems, fed by the own-Station rows the console already posts. Readouts the footer carried that the bar cannot say — a locked target, an active hail, a battery percentage, a team count — move inside the console group that owns them; the AUTO badge moves beside the controls whose automation it reports. Presentation only, on the client, reading rows that already crossed the iframe seam.
      rationale:
        - "[ai] The footer was saying what the bar says. Every console ended in a strip carrying the Station's name, a status dot and a summed hull bar, directly under a bar that already named the Station and drew its health — two bands of a phone screen spent on one fact, in twenty-two slightly different spellings of the same markup."
        - "[ai] The popup opens from the SELECTED tab rather than a control of its own because the seat has already said which Station it means by selecting it. A second tap is the cheapest gesture on the surface that already carries the Station's identity, and it costs no pixels at all."
        - "[ai] 'Already selected' is this seat's own tab with NO overlay covering it. While an overlay is open the bar's selection is the overlay, so the same tap keeps its older meaning — come back to the console — and the popup stays out of the way of a player leaving a panel."
        - "[ai] Opening the popup ADDS to what that tap did; it does not replace it. The tap on your own tab is also the StationVisited report that clears an unread importance cue, and unread is edge-triggered host-side on whichever Station an objective ends on — including the one the seat is already sitting at. A branch that opened the popup and returned would leave that cue lit until the player switched Station and came back."
        - "[ai] The rows are not new state and no new message carries them. The console posts its own_hull rows as console_hull for the overlay-tab seam; the popup is a second reader of that same declaration, so a hull that changes under fire repaints an open popup in place."
        - "[ai] The popup is a modal layer and takes the shared focus contract rather than hand-rolling one: it declares role=dialog beside its createFocusTrap call, so the declaration and the trap that makes it true cannot drift apart."
        - "[ai] The cog gutter went with the cog. Issue 940 reserved 44px down the left of every console because the settings cog floated over the iframe; issue 1372 made the cog a child of the bar, after which the gutter was keeping a strip of every phone screen clear for a control that had left."
        - "[ai] No console authors an overlay TOGGLE any more either. The bar offers those panels as tabs, and two affordances for one choice is how a tab and a button end up disagreeing about which panel is open; the panel's own Back button remains the in-console way out."
        - "[ai] A two-way segment control lands in the shared console stylesheet unused, as a tablist with aria-selected rather than an active class, so the surfaces that need one next reach for the same thing instead of each inventing it — which is exactly how twenty-two different footers happened."
        - "[ai] What a console posts is filed under the STATION whose iframe posted it, resolved from the sending window against the mount plan — never under the name the document gave itself. A console document is not a Station: the cruiser mounts gui/cruiser/comms.html at both its Comms and its Navigation seats, and both frames call themselves comms while carrying different own_hull rows. Keying on the claim collapses the two seats into one slot, so the Navigation tab's popup is permanently empty and the Comms tab's lists the wrong systems. The shell mounted each frame against a Station id, so it already holds the answer and has no reason to ask."
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [console-overlay-declaration-state, client-presentation-state, session-station-ownership-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/station-damage-popup.js, gui/console-mount.js, gui/console.css, gui/components/ph-damage-detail.js, gui/command-console.html, gui/battleship/, gui/courier/, gui/cruiser/, gui/destroyer/, client.html, assets/strings/strings.csv]
      symbols: [stationDamagePopupModel, renderStationDamagePopup, openStationDamagePopup, closeStationDamagePopup, isStationDamagePopupOpen, stationIdForSource]
      tests: [npx vitest run, tests/smoke]

  - component: client-scope-cell-layout
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Square Scope Cell and the Four Dead Corners
      summary: One rule for every scope in the fleet. A scope is a square whose side is the smaller of the free width and the free height its console's controls leave, so it fills the width in portrait and the height in landscape; the circle touches the square's edges, which makes the four corners the only part of the cell the picture never reaches. Three of them hold the position, bearing and speed readouts and the fourth holds ON SCREEN where a Station has one; the scale readout stays on the outer ring between them. The shared console stylesheet owns the square and the row a scope sits in, parameterised by the two side-column widths and the floor those columns shrink to; no console document declares an aspect ratio, a track list or a per-orientation variant of either. Presentation only, on the client, over payloads that already crossed the iframe seam.
      rationale:
        - "[ai] Eight console documents had each worked out their own spelling of one idea — width 100% with an aspect ratio here, height 100% with width auto inside a landscape media query there, a wrapper column with a third arrangement — and each carried a comment explaining why THAT hull's arithmetic had to change when the chrome above the scope did. Eight copies of one rule is eight chances for a hull's scope to stop being square, and two of them already had: the Cruiser's Science scope was a stretched letterbox, and the Destroyer's Helm scope in landscape was 240 by 337 because a max-width clamp broke the ratio the moment the height became definite."
        - "[ai] The rule is expressed as the sentence it is. The cell is a size container and the scope inside it is min(100cqw, 100cqh) — literally the smaller of the free width and the free height — rather than an aspect-ratio box relying on a max-height being transferred back into a width. Both produce the same square; only one of them can be read back as the design rule."
        - "[ai] The cell's own aspect ratio is not the square: the CHILD is. The ratio is the cell's preferred height where nothing else supplies one, which is what a scope stacked above its controls in a scrolling column needs. Given a definite height — a flex track, a grid row — that height wins instead. Portrait filling the width and landscape filling the height then fall out of one declaration rather than out of a media query per hull."
        - "[ai] The row is FLEX, not a three-track grid, and that is what lets the two rail widths be optional. A grid still has its first track when the start rail is zero wide, so a console with one rail auto-places its scope into the empty track and its controls into the scope's; a flex line contains only the children that exist, and its gap falls only between them. The rails are matched by where they sit relative to the scope rather than by a per-hull class name."
        - "[ai] The fourth corner had to be invented because the third one had already been. Two scopes carried a byte-identical copy of the ON SCREEN button — its rules and its markup, pinned to the same offsets — in the same components a shared fragment already existed to keep the other three corners identical in. It is one of the four slots, so it is declared with them."
        - "[ai] A scope with no ON SCREEN leaves that corner EMPTY rather than filling it for symmetry. A weapons officer does not choose the viewscreen, and the rules for a button that is not in the document are not shipped into its shadow root either."
        - "[ai] The scale readout moved from the aft-starboard ring diagonal to the aft-port one. Naming the outer ring is the one piece of chrome that belongs ON the picture rather than in a corner, and the corner it used to lean against is the one the fourth slot now occupies — a near-opaque control wide enough to cover it completely. Aft-port shares its corner with the shortest of the three readouts, and the two clear each other at every scope size a phone renders."
        - "[ai] The scope's shadow-DOM ON SCREEN button and the light-DOM chart button a Navigation console writes keep deliberately different ids. The Navigation adapter resolves whether a Station supports a chart from the light-DOM one; collapsing the two would make every console with a scope claim a chart it does not have."
        - "[ai] A row too narrow for its rails PLUS a square takes the shortfall from both, not from the picture alone. Flex shrinking is weighted by base size, so a scope cell with a base size of zero has no shrink weight at all: it takes only the free space left after every rail has claimed its full width, and reaches nothing before a rail yields a pixel. The cell's base size is therefore the square it wants — the row's definite height, transferred through the cell's aspect ratio — which is what makes a rail and a scope shrink together. A rail whose content has a size of its own stops at a declared floor, so that shrinking makes a smaller control rather than a control drawn over the scope beside it; the two Helm joystick widgets size themselves to their rail for the same reason, keeping their fixed dimensions as a maximum rather than as a width."
        - "[ai] Rails shrink beside the square and STAND at their content's height beneath it. In landscape they share a shortfall with the scope, because a narrower rail is a smaller control; stacked in portrait there is no such thing as a shorter joystick, so a rail that gave way there would simply end above the widgets inside it and let them paint on past its border and off the bottom of the page. A portrait rail is therefore un-shrinkable, and a console whose stack of square-plus-rails is taller than a phone's page says so by making its own console body a scroller — the overflow is honest and reachable rather than hidden under a page that cannot scroll. The scope keeps the full width either way: shrinking the square to make the controls fit would be the one thing this rule exists to prevent."
        - "[ai] The rule is asserted in a BROWSER, not only as stylesheet text. The unit suite can pin the declarations, the mounting and the absence of per-console variants, and every one of those assertions passes while a hull renders a scope small enough to be useless — which is exactly what happened. A viewport-driven smoke spec measures each of the ten scope documents at a phone held both ways, a small landscape window and a desktop, asserting the box is square, that it is at least a third of the smaller viewport edge, and that nothing a rail contains is painted over it."
        - "[ai] The same spec asserts what the square DISPLACED, because none of the measurements of the scope move when it pushes a control off the page. Every visible control must end on the page or inside something that scrolls, and every column of a scope row must hold its own content unless it is a scroller itself. Both were added after a round of this slice shipped ten green documents over a Helm console whose IMPULSE and BOOST were half below a 812px screen with nothing to scroll them into view."
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/console.css, gui/components/ph-scope-chrome.js, gui/components/ph-radar.js, gui/components/ph-helm-radar.js, gui/components/ph-tactical-radar.js, gui/components/ph-sensor-radar.js, gui/components/ph-courier-radar.js, gui/components/continuous-helm-input.js, gui/components/ph-helm-joystick.js, gui/components/ph-lateral-thrust-joystick.js, gui/battleship/, gui/courier/, gui/cruiser/, gui/destroyer/]
      symbols: [SCOPE_CORNER_CSS, SCOPE_CHROME_CSS, SCOPE_ON_SCREEN_CSS, scopeChromeMarkup, scopeOnScreenMarkup, updateScopeChrome, setScopeOnScreen]
      tests: [npx vitest run, tests/smoke]


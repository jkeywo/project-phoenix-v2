name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Unit tests (native, fast — fail-fast before expensive WASM build) ─────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native

      - name: Run unit tests
        run: cargo test

  # ── WASM build ────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Build server page (WASM + JS)
        run: trunk build --release

      - name: Build client page (WASM + JS)
        run: trunk build --release --config client-trunk.toml

      - name: Verify dist contents
        run: find dist/ -type f | sort

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Smoke tests ───────────────────────────────────────────────────────────────
  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Install Node dependencies
        working-directory: tests/smoke
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/smoke/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: tests/smoke
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests/smoke
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/smoke/playwright-report/
          retention-days: 7

      - name: Publish results to job summary
        if: always()
        working-directory: tests/smoke
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          npx playwright test --reporter=list 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY || true

  # ── Deploy (main branch only, requires both test + smoke to pass) ─────────────
  deploy:
    needs: [test, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

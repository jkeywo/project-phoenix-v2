  - component: roadmap-gm-console
    core:
      status: accepted
      confidence: confirmed
      title: Game Master Console
      summary: "Deliver #930's host-class GM peer across four technical bands, per gm-console-milestones.yaml, deliberately resequenced ahead of the multi-ship host mesh (T5) by the 2026-08-20 track split. T2 keeps the accepted MVP scope: M1 peer tracer, M2 directing and M3 performing. T3 keeps M4 facilitation assistance and M5 operations/safety. T4 delivers M6 Integrated Workshop and Live Inspector, which retires the HTML editor and model viewer after native/browser Authoring/Test parity while reusing constrained M1-M5 Live actions; M7 Information Control and M8 In-sim Presentation follow. T6 closes with M9 Campaign Continuity and Deep Pacing alongside the authored C6 Patrol continuing-run shell."
      rationale:
        - "The GM is a host-class peer running the full simulation with no ship. Its hard transport gates live under T1 PRD #1093: host admission #1114, deterministic multi-host play #1116 and portable-record transfer #1117, with divergence recovery #1118 for robust drop-in. #854's PeerJS plan is superseded. The T5 mesh no longer gates the console's start; any GM milestone needing true multi-ship observation waits on T5."
        - "World and mission mutation goes through the trigger-action dispatch pipeline and station puppeting through a gm: admission tier, so the GM adds no authority path that authored content cannot also use."
        - "M1-M5 retain their settled feature scope but are written with M6 in mind: reusable inspectors, role-preset panels, validation descriptors and action adapters rather than disposable pages."
        - "Live exists only in a connected GM session and never writes source; standalone Workshop owns Authoring/Test. Native may edit project roots or one mod workspace, while browser Workshop edits exactly one in-memory mod overlay and downloads a ZIP. Rhai source and model/rig data are fixed during Live runs."
        - "M4-M9 each get their own PRD when their band is due; only M1-M3 are broken into issues once the T1 #1093 transport gates near completion."
        - "The M6 Live Inspector builds on T1's roadmap-debug-observability substrate — the structured state-inspection payloads — adding GM authorization and presentation rather than a second inspection pipeline."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-snapshot-artifact, world-configuration-state, spawned-entity-state]
      coordinates: [roadmap-band-a2-native-network-foundation, roadmap-p2p-multiship-delivery, roadmap-authoritative-snapshots, roadmap-debug-observability]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime, node-tooling-runtime]

  - component: roadmap-release-polish
    core:
      status: accepted
      confidence: confirmed
      title: Per-Release Visual, UX, and Accessibility Delivery
      summary: "Every band on BOTH tracks carries its own scoped visual/UX polish pass and accessibility increment, written in detail just before that band starts. Content-track passes (C1-C9) follow the new player surfaces, viewscreen/effects, onboarding and session flow; technical-track passes (T1-T6) cover the operator- and setup-facing surfaces that band ships. Accessibility is one continuous programme. Content ladder: C2 complexity composition; C3 alternative motion/docking/multi-ship paths; C4 mastery-task assistance; C5 dense tactical information; C6 continuing-mode maps/summary/return; C7 strategy; C8 generation constraints; C9 alternative participation and completion audit. Technical ladder — each band pairs its band-surface pass with ONE platform-wide, non-content improvement stream (2026-08-21 grill over the accessibility and polish reports): T1 the programme's opening seams (settings/profile/presentation/eligibility) plus native bridge and pane setup, PLUS interaction foundations — keyboard operability of every console, focus integrity (modal traps, Escape, visible focus styling), accessible names across the shadow-DOM components, and completing #1102's inert seams (wire data-contrast and data-reduced-motion into console CSS, make viewscreen shake/flash/vignette honour reduced motion). T2 GM MVP surfaces, Workshop/mod editing and save-slot UX, PLUS the shared input and feedback layer — a keybinding registry above action-map.js, player-facing action remapping, and one state-driven UI microinteraction system. T3 GM facilitation and safety tooling, PLUS presentation and comfort — colour-independent state coding, larger-target/density mode, viewscreen comfort toggles to zero, photosensitivity review of flash effects. T4 the integrated Workshop/Live Inspector and dense GM information, PLUS audio — bus hierarchy with per-channel volumes, ducking, cue variation, and captions/visual equivalents for meaningful audio cues. T5 multi-ship join flow and session diagnostics, PLUS localisation robustness — plural support, pseudoloc and overflow passes, font coverage, promoting the untranslated-literal check from warning to error. T6 campaign continuity summaries and recap."
      rationale:
        - "Polish is written per band rather than as one standing backlog so each pass can answer real feedback: content passes answer public playtests of the build that just shipped, technical passes answer facilitator, authoring, and bridge-setup use of the surfaces that band delivers."
        - "2026-08-20/21 track split: technical bands carry their OWN polish/accessibility PRDs rather than deferring their surfaces to the next content release's pass — GM, Workshop, and native-setup UX are operator-facing products in their own right, and their a11y obligations (e.g. #1092/#1093's seams, M6's Workshop profile requirements) land with the band that builds the surface."
        - "Scope is visual and UX only: defects are fixed as they arise and never occupy a polish slot."
        - "The console visual system is worked hull by hull in the same order as the catalogue rollout, so a hull's look lands with its tutorials and balance rather than later."
        - "Accessibility increments may align naturally with a band's systems but are not required to be fictionally or mechanically tied to that band's content. Low-cost seams land when their owning UI/authority layer is already changing."
        - "T1's platform-stream PRD published as #1168 (interaction foundations), broken into issues #1170-#1178: keyboard tracer #1170, then floors #1175 gate the three family sweeps #1176-#1178, with modal contract #1174, high-contrast #1171 and reduced-motion #1172/#1173 alongside. Latency instrumentation filed as #1169 under #1144. T2-T5 platform-stream PRDs are written just-in-time as each band opens."
        - "2026-08-21 platform-stream decisions: the bar is WCAG-INFORMED engineering (keyboard operability, name/role hygiene, focus integrity, contrast, no colour-only or drag-only paths), explicitly NOT WCAG conformance, evaluation methodology, or legal mappings. Structured text alternatives for the canvas displays and full screen-reader support are deliberately unscheduled (see roadmap-planned-not-scheduled). The T1 pass uses per-component keyboard handlers; the binding registry and remapping deliberately wait for T2 so T1 stays thin, accepting some rework. Input-to-feedback latency instrumentation is #1144's scope (debug observability feeding #868 budgets), not a polish stream. New floors are gated the #1023 way: structural tests over source (control-floors.test.js pattern) for focusability, accessible names, and keyboard reachability — not an external audit tool."
    architecture:
      kind: roadmap-milestone
      authority: non-authoritative
      reads: [world-content-pack-state]
      coordinates: [post-demo-release-bands]
      runs_in: [host-browser-runtime]


        - "[ai] Snapshotted as a PROJECTION rather than whole, which is where this differs from the condition track. The hull's authored capability table rides on the same component and is re-derived from the template on spawn; writing it into a save would put content into the one artefact content_digest is answerable for. The three fields that are carried travel together: restore the hold without next_id and the next operation reuses an id the console has already shown; restore next_id without the hold and a resumed mission forgets it was two-thirds through stabilising a skyhook."

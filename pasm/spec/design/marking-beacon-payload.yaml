entities:
  - decision: layered-combat-physical-marking-consumer
    core:
      status: proposed
      confidence: tentative
      title: Marking Delivers Finite Subject-Relative Observation Equipment
      summary: "S012A's physical marking equipment is a bounded opt-in guided-payload consumer. Normal finite loading/launch/interception, actual configured entities, shared physical constraints, paid observations and compatible Radio reports remain their existing owners. Exact joins await Root/Craft/Comms review before runtime."
      rationale:
        - "The draft contract is docs/gameplay-redesign/implementation/increment-15-marking.md. Selected physical beacons are required; exact contact, observations, endurance and countermeasures were open. No tracking bonus, free identification, hidden interior, universal penetration or broad mine/terrain/recovery mechanic is selected by this slice."
        - "A mark-only guided round freezes its accepted child recipe and launch faction. Only a surviving actual supported unshielded hull contact consumes the round into one equipped body. Zero damaging/EMP payload and zero proximity radius prevent an explosive near-miss masquerading as contact; PDC, shield-up, expiry and unsupported contact create no beacon. Exact supported collision geometry must be reviewed."
        - "Use actual accepted configured equipment and extend the existing runtime spawn provenance/content closure, with deterministic round-child identity and complete accepted-loader regression. No private JSON merge, runtime file fallback, second ammunition inventory or source-only lookup after launcher loss."
        - "An explicit canonical Attached/Detached relation drives the same physical synchronization owner's rigid-constraint projection before Rapier and after later Dock/Tractor corrections, without a second integrator or independent pose intent. Attached equipment has no competing motion/actuator writer. Exact phase/API and writer census must be reviewed by Root/Craft before adoption; Carried/Disabled is not attachment."
        - "The first paid SensorRadar measures only the actual attached subject's position/observed motion with existing cadence, uncertainty, provenance and history. No identity/assessment/private route is exposed. Actual subject removal detaches at the last physical pose and ends subject-only measurement; broken observation/link does not imply physical loss."
        - "Optional report delivery requires actual current-tick once-paid Radio endpoints, current compatible route/condition/channel/keys/coverage and real discrete source transmission work after the new measurement. It reuses original radar sample export/receipt into existing same-faction recipient owners. Legacy range-only sharing remains unchanged. Exact paid-endpoint/report timing must be reviewed by Root/Comms before adoption."
        - "Finite battery and ordinary component/compartment damage govern endurance and vulnerability. Actual exhaustion leaves inert hardware; jamming/destruction interrupt supported reporting. Existing per-System controllers and System-addressed authority remain; general recovery/cleaning/mines and broad craft modes are outside this consumer."
        - "Canonical attachment, runtime recipe and successful-report frontier join existing snapshot/fold/preflight with complete candidate validation before writes. Derived poses/paid routes never become new saved owners. Workshop payload reference and equipment closure use existing accepted document/history/Preview/Test. Source preparation is not native execution or an increment15 exit."

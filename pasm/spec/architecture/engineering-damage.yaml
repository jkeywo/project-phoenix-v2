        - "[ai] The two arms take different routes on the host, which is the whole reason this is worth writing down. host-repair-router applies a station or core order through RepairTeams::dispatch and SKIPS External without a second verdict; external-repair-dispatcher’s handle_external_repair_commands, in SimSet::Input, has already answered it and reported it on the feedback seam. One answer per command; see named-external-repair-claim in world-files.yaml."

entities:
  - component: shield-arc-system
    core:
      status: implemented
      confidence: confirmed
      title: Shield Arc System
      summary: Per-ship variable arc shield system with authored geometry, priority, health, regeneration, offline recovery, and per-arc fine-system availability; every Ship entity (player and NPC alike) publishes its own aggregate and per-arc blackboards.
      rationale:
        - "Issue #788 CHANGED THE POST-COLLAPSE MECHANIC for every hull. A facing whose HP reaches 0 collapses and goes offline for the authored offline_duration, absorbing nothing while any hit passes straight to the hull — that part is unchanged. What changed is what happens when the timer expires: the facing used to snap straight back to max_hp, and now comes back ONLINE AT ZERO and climbs from there at its authored regen_per_sec. offline_duration is therefore a no-damage DELAY, not a free recharge. This runs through the one shared ShieldFacing::tick with no branch on who owns the hull (AGENTS.md #6), so the player's ship and every NPC collapse and recover identically."
        - "Why the change was needed, not merely tidier: under the snap there was NO INSTANT at which a recovering shield was partially recovered, so any fractional threshold was either already met or unreachable and 'wait until shields are back to 75%' was an unanswerable question. The #788 destroyer's re-entry gate is exactly that question, and ShieldSystem::fraction (total current over total capacity, 0.0 for a hull with no arcs or no capacity — the safe answer for a gate that must not open on a missing system) genuinely traverses the interval now instead of jumping 1.0 to 0.0 to 1.0."
        - "[ai] Two consequences worth stating because they are easy to reintroduce as bugs. (1) A facing hit while still ramping is knocked back to 0 and collapses again for a fresh offline_duration, so sustained fire keeps a shield down rather than letting it flicker back. (2) A facing may now legitimately sit at 0 HP while ONLINE — the first tick of its regen ramp — so the re-arm check is hp == 0 AND effective_damage > 0; without the second conjunct a zero-damage hit on a just-recovered facing would re-arm the offline timer."
    architecture:
      kind: defense-system
      authority: authoritative
      owns: [shield-arc-state]
      reads: [ship-station-system-topology-state, system-control-source-state]
      produces: [shield-status-blackboard-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/weapons/shield.rs, src/entities/config.rs]
      symbols: [tick_shields, ShieldSystem, ShieldArcConfig, ShieldFacing, fraction]
      tests: [cargo test, tests/smoke/shields-console.spec.js]

  - state: shield-arc-state
    core:
      status: implemented
      confidence: confirmed
      title: Shield Arc State
      summary: Authoritative current shield arcs including geometry, priority, health, focused state, damage multiplier, offline timer, and availability.
    architecture:
      classification: authoritative
      owner: shield-arc-system
      writers: [shield-arc-system]
      replicas: [shield-status-blackboard-state]
    implementation:
      status: declared
      paths: [src/weapons/shield.rs, src/core/messages.rs]
      symbols: [ShieldSystem]

  - component: shield-focus-controller
    core:
      status: implemented
      confidence: confirmed
      title: Shield Focus Controller
      summary: Admitted Shields command handler that focuses one authored shield arc or clears the active focus for human and AI commands alike, applying configured protection and trade-off multipliers.
      rationale:
        - "Issue #826: the single applier for both origins — the AI's ai_shield_focus emits admitted SetShieldArcFocus payloads through validate_and_admit, so no shields intent component or separate AI adapter exists. The handler runs in SimSet::Physics (moved from Input) ordered after ai_shield_focus: admission clears AdmittedCommands before Input each tick, so the applier must consume same-tick after the AI emit or AI commands would be silently lost."
    architecture:
      kind: control-handler
      authority: authoritative
      reads: [shield-arc-state, system-control-source-state]
      writes: [shield-arc-state]
      consumes: [set-shield-arc-focus-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/core/messages.rs, gui/action-map.js]
      symbols: [handle_shields_messages]
      messages: [SetShieldArcFocus]
      tests: [cargo test, tests/client/ph-shield-facings.test.js]

  - message: set-shield-arc-focus-command
    core:
      status: implemented
      confidence: confirmed
      title: Set Shield Arc Focus Command
      summary: Request to set or clear the focused authored shield arc, produced by the Shields console (human) or by the Shields AI's admitted emission.
    architecture:
      authority: request
      producer: [client-network-interface, shields-recent-damage-ai]
      consumer: [shield-focus-controller]
      validator: [system-command-admission-policy]
      trust_boundary: client-to-host
      payload: SetShieldArcFocus
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/action-map.js]
      messages: [SetShieldArcFocus]

  - component: shield-damage-router
    core:
      status: implemented
      confidence: confirmed
      title: Shield Damage Router
      summary: Routes incoming collision, weapon, and region damage through matching online arcs by geometry and priority before leaking remaining damage to system hull.
    architecture:
      kind: damage-router
      authority: authoritative
      reads: [shield-arc-state]
      writes: [shield-arc-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/weapons/shield.rs, src/console/weapons/mod.rs, src/regions/server.rs, src/server_app.rs]
      symbols: [ShieldSystem]
      tests: [cargo test]

  - state: shield-status-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Shield Status Blackboard State
      summary: Replicated aggregate and per-arc shield snapshot published into every Ship entity's own blackboards (player and NPC), read by the Shields console and other ship systems.
    architecture:
      classification: replicated
      owner: shield-arc-system
      derived_from: [shield-arc-state]
    implementation:
      status: declared
      paths: [src/ship/shields.rs, src/core/messages.rs, gui/components/ph-shield-panel.js]
      symbols: [ShieldsBlackboard]
      tests: [cargo test, tests/client/ph-shield-panel.test.js]

  - component: shields-recent-damage-ai
    core:
      status: implemented
      confidence: confirmed
      title: Shields Recent Damage AI
      summary: AI-controlled Shields records real per-arc incoming damage against a per-arc previous-health snapshot and focuses concentrated damage over the authored damage window, falling back to a configured health-imbalance rule only when damage is not concentrated.
      rationale:
        - "Issue #826 (admission symmetry, following the #824 helm precedent): ai_shield_focus keeps the #692 decision logic (damage tracking, health imbalance, threat-bearing override via tick_shield_focus_ai) but no longer writes an intent component. It emits SetShieldArcFocus payloads through the shared command_admission::ai_emit::emit_ai_command seam (issue #738 collapsed the seven per-operator emit_*_ai_command copies into it) using its ship's own ai:<uuid> token, validated against that entity's own ControlSourceResolver (operate_ai must hold on the targeted arc). The write into the per-entity AdmittedCommands is direct and same-tick; shield-focus-controller (handle_shields_messages, SimSet::Physics, ordered after the emit) applies it. The paired integrate_shield_state adapter and the ShieldArcIntents transport are deleted."
        - "Issue #747 corrected the recent-damage focus signal. (1) ShieldsDamageHistory.last_hp holds a per-arc previous-health snapshot observed every tick, so real incoming damage is measured as prev_hp - current_hp rather than misreading a stored delta as prior health (the original defect). (2) Damage concentration is now measured over the AUTHORED damage_window_secs (floored at min_damage_window_secs), not a fixed last-min_damage_window_secs slice, so 'concentrated damage over authored windows' is honoured; the pruning window and the concentration window agree. (3) A focus-decay guard skips HP drops on a non-focused arc still at or above its reduced effective max_hp (ShieldSystem::tick decay bleeding toward the cap), so a focus side effect is never recorded as incoming fire. (4) ai_shield_focus now emits through the single-owner console_ai::shields_emit::emit_shields_ai_command wrapper (mirroring src/ship/helm_ai_emit.rs), making this operator's dependency on host-command-admission an observed per-entity code edge."
        - "Issue #783 converted the Shields Backfill behaviour to an inline stateless policy on the #775 channel/verb spine (NOT the #776 selector: shield arcs are a fixed 4-set of in-ship indices, not UUID entities, so there is nothing for a candidate-source selector to union). The retained arc-ranking kernel tick_shield_focus_ai (damage-concentration primary, health-imbalance fallback — already tested and correct) is kept as the 4-way argmax; the AUTHORED windows/thresholds moved out of the typed ai_cfg.* reads and into the policy `param` map (damage_window_secs, min_damage_window_secs, damage_pct_threshold, health_ratio_threshold), and a value-less focus_shield_arc verb on the shield_focus channel gates WHETHER the kernel acts this tick (None → idle/hold, emit nothing). Per-arc BOUNDED recent incoming-damage is exposed to policy guards as facts via seed_shields_focus_facts (recent_damage_<arc-id>, recent_damage_total, recent_damage_fraction_max/recent_damage_pct_max concentration, health_fraction_min_ratio fallback), computed from the already-pruned window only. At #783 an omitted [shields_console.ai_policy] was filled by a canonical synthesiser (a priority-10 damage rule plus a priority-0 unconditional imbalance fallback, params seeded from the retained typed default_shields_ai_* values) that reproduced the pre-#783 decisions bit-for-bit. Human control still prevents AI focus via the operate_ai admission gate (no second write path); there is no policy memory to reset — the only per-arc state is ShieldsDamageHistory, whose records self-expire via prune_old and whose last_hp baseline resets when a facing comes back online."
        - "Issue #885 (8555e336) deleted that synthesiser. default_shields_focus_ai_config is gone along with every call site, strict AI-declaration mode is the default in EntityConfig::from_toml, and a hull that declares no [shields_console.ai_policy] fails the entity load rather than having a policy invented for it — so on any hull that loads, the focus policy is authored content. The authored blocks were proved byte-equivalent to what the synthesiser produced, through the real spawner on every shipped hull."
        - "Issue #1211 deleted the single-owner console_ai::shields_emit::emit_shields_ai_command shim the #747 bullet describes (superseding that bullet's 'observed per-entity code edge' claim). ai_shield_focus now emits both SetShieldArcFocus decisions through the AI host spine's AiHostEnv::emitter() (ai-policy-host-spine, issue #1205) — the same command_admission::ai_emit::emit_ai_command seam, unchanged payloads/token/admission gate/same-tick guarantee — so depends_on swaps host-command-admission → ai-policy-host-spine. OBSERVABILITY NOTE: the admission edge is now carried unambiguously by the spine's single-owner src/ai/host.rs, but this operator's only single-owner file WAS that shim; its remaining files (console_ai/server.rs, ship/shields.rs, …) are co-owned, so PASM can no longer attribute a per-entity edge and reports depends_on ai-policy-host-spine as missing-observed — the same shape helm-ai-operator/impulse/boost and the sensors AI hosts already carry. The edge itself is observed at the spine; the per-host attribution is the co-ownership limit PASM's observed-edge rule (validation.py) imposes, not a lost dependency."
    architecture:
      kind: ai-operator
      authority: authoritative
      owns: [shields-damage-history-state]
      reads: [shield-arc-state, system-control-source-state]
      writes: [shields-damage-history-state]
      produces: [set-shield-arc-focus-command]
      # Issue #1211 deleted the single-owner console_ai::shields_emit shim;
      # ai_shield_focus now emits through the AI host spine's AiHostEnv::emitter()
      # and so depends on ai-policy-host-spine, which carries the single-owner
      # observed command_admission::ai_emit edge in src/ai/host.rs.
      depends_on: [ai-policy-host-spine]
      runs_in: [host-browser-runtime]
    implementation:
      status: observed
      paths: [src/ship/shields.rs, src/console_ai/core.rs, src/console_ai/server.rs, src/entities/config.rs, src/entities/spawner.rs, src/server_app.rs, src/ai/policy.rs]
      symbols: [ai_shield_focus, tick_shield_focus_ai, ShieldsDamageHistory, ShieldsAiConfigToml, ShieldsFocusAiPolicy, seed_shields_focus_facts, SHIELD_FOCUS_CHANNEL, SHIELD_FOCUS_VERB]
      tests: [cargo test]

  - state: shields-damage-history-state
    core:
      status: implemented
      confidence: confirmed
      title: Shields Damage History State
      summary: Per-ship, per-arc timestamped damage data used by Shields AI over authored time windows, with a per-arc previous-health snapshot (last_hp) that supplies the damage-detection baseline each tick. Since #783 the same already-pruned window also feeds the Shields focus policy's bounded per-arc recent-damage facts (seed_shields_focus_facts) — no new accumulator is added; the facts read only this window.
    architecture:
      classification: authoritative
      owner: shields-recent-damage-ai
      writers: [shields-recent-damage-ai]
    implementation:
      status: observed
      paths: [src/ship/shields.rs]
      symbols: [ShieldsDamageHistory, DamageRecord]

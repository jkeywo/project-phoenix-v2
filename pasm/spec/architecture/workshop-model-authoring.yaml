entities:
  - component: workshop-model-source-authoring
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Workshop Model Source Authoring
      summary: "The shared offline Authoring surface groups existing rig, marker, target-point, LOD, bounds and build fields through the Workshop runtime inspector. Model variants clone exact source into the same draft and chronological history."
      rationale:
        - "[ai] Browser and native surfaces use their existing source providers. The panel has no project filesystem API, Live action route, model serializer or separate undo stack. Model and variant selection are local presentation."
        - "[ai] A grouped edit prepares each changed scalar through the source-span patch API. It writes one draft edit only after every patch succeeds and exact source, selected variant, draft identity and context remain current. A refusal or late response changes no source."
        - "[ai] Variant creation refuses overwriting an existing path and copies comments, line endings and unknown fields byte-for-byte. A model without a sidecar starts with the runtime's empty identity rig. Normal runtime validation remains the gate for Test, save and export."
        - "[ai] Test holds these controls and hides the Authoring panel. Controls retain labels, keyboard access, visible non-colour status and wrapping layouts. External generation and structural metadata parity remain separate work."
        - "[ai] Model preview uses the explicit modelPreview provider and the shared disposable preview owner. Refresh captures source deliberately; edits and selection changes mark the retained picture stale. Test, draft replacement and exit retire the preview. Camera, distance, gizmos, lighting and LOD controls affect only this renderer, with statistics measured by ViewerPlugin."
        - "[ai] Issue #1470 supplies the browser producer behind that provider. workshop-preview.html is a THIRD Trunk target built with no default features plus viewer, so the preview renders through the same ViewerPlugin the standalone viewer runs rather than a Workshop-only approximation; adding the viewer feature to the server bundle was rejected because it would ship viewer code to every player for a surface only an author opens. The page declares no asset copy and no proxy, and register_snapshot binds its App to exactly the captured bytes before AssetPlugin, so an uncaptured project file is absent rather than merely slower to reach."
        - "[ai] The preview reuses the disposable Test's iframe, private MessagePort, transferable-snapshot guards and dependency merger, and captures a draft with the identical path/byte rule. A second capture path would be a second definition of captured content, which is precisely how an uncaptured file gets read. Its child accepts only local renderer commands over its own connect type, so a Test port cannot drive a preview or the reverse."
        - "[ai] The native producer materialises the same validated draft and immutable dependencies inside the source worker, then publishes each member at a nonce-scoped loopback-only immutable route. Its JSON bridge carries only the compact authored references, selection, revision, logical path list and route capability; it never serialises the merged asset bytes. A retired or unknown capture prefix returns Not Found before static bundle resolution, so a missing member cannot fall through to project or delivery files."
        - "[ai] One native capture generation owns those routes. Refresh replaces it only after validation; Test entry, draft replacement, explicit Stop, pane epoch failure/replacement and host exit withdraw it. Capture ids make a late release harmless. The embedded page fetches the frozen members and then uses the same preview child, ViewerPlugin, controls and measured statistics as browser Workshop."

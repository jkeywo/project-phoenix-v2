  - component: roadmap-planned-not-scheduled
    core:
      status: accepted
      confidence: confirmed
      title: Planned but Not Scheduled — Accepted Dependency Clusters
      summary: "Accepted future work with no release promise, grouped by dependency rather than priority. Personnel and operations: typed anonymous Duty Teams with named Duty Officer leaders, system officer slots, discrete assigned-officer casualties, multiple tagged/capacity-limited Operations systems, exact-odds off-screen Away Missions, shuttle/transporter/carried-craft deployment, boarding, internal Security tasks and Medical. Tactical/ship extensions: persistent mines, post-E cloaking, expanded EWar, authored surrender and multi-interlock self-destruct. Access: personal effect-named accessibility assistance through limited AI and richer authorised spectator monitors. Generated play: a reusable epistemic Pursuit system, then bridge-first War Mode after the Patrol MVP, then open-ended Sandbox with the shared generator/Director, coarse event-driven economy, layered standing and GM support. Planetary interaction: a coarse wrapping global Orbital Mode using normal planar controls, surface points of interest, disabled impulse and an authored maximum-thrust escape hold."
      rationale:
        - "Duty Teams are fixed anonymous units by type and consume one whole team per internal task. A named leader adds bonuses but is not required for base function. Away Mission slots may take teams with leaders, individual officers or both; personnel assignment authority is authored locally on an Operations system or left remote with the relevant station."
        - "Duty Officers may be assigned to compatible ship-system slots. Only assigned officers face fatigue, injury, disappearance or death, and casualty checks happen on discrete significant events rather than every damage tick. Medical owns treatment capacity and asks Science for specialist scans while reading medical results itself."
        - "The station-database framework is shared with Band F: one evidence/reference model, Intelligence as primary cross-domain correlation, and focused station projections including Engineering procedures, Medical records and Operations history."
        - "Pursuit is exact in authoritative state but reported through Intelligence as an evidence-based countdown, uncertainty interval and graded interception risk. It is abstract between systems and materialises ordinary entities on contact."
        - "War Mode generates a route to one decisive mission; intervening play gathers allies/supplies and weakens enemies. Sector fronts and fleets stay coarse, and allied assignments travel through Comms to autonomous actors who may accept or refuse. Sandbox follows War, lets players choose work, and gives the shared Director wider latitude; it is also the base for GM-led sessions."
        - "Later trade adds discrete cargo lots over D's bulk resources rather than a slot grid. Reputation remains separate actor, faction and institutional standing. Warp stays discrete and uses its own normally abundant fuel."
        - "Accessibility profiles remain private and describe effects rather than diagnoses. Validation guarantees one compatible station/rating on the base hull at full supported player count for a simple scenario, not solo completion of every complex scenario."
        - "Moving a cluster into a band requires a proving scenario or mode, bounded authoritative state, persistence classification, information/accessibility behavior and a vertical acceptance test; moving one cluster schedules none of the others."

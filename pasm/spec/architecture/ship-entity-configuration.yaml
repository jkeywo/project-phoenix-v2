entities:
  - component: entity-template-cache
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Cache
      summary: Host-side cache of parsed entity TOML templates used by world loading and spawning.
    architecture:
      kind: configuration-cache
      authority: authoritative
      owns: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs, src/entities/config_cache.rs]
      symbols: [EntityConfig, ConfigCachePlugin]
      tests: [cargo test]

  - state: entity-template-state
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template State
      summary: Parsed entity-template configuration for tags, mesh, collider, hull, behaviour, weapons, systems, presentation, and authored capability settings.
    architecture:
      classification: authoritative
      owner: entity-template-cache
      writers: [entity-template-cache]
    implementation:
      status: declared
      paths: [src/entities/config.rs, assets/entities]
      symbols: [EntityConfig]

  - component: entity-template-composition-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Composition Resolver
      summary: Resolves ordered relative entity-TOML includes depth-first, merges fragments and declaring-template overrides through the established entity merge contract, and returns one fully resolved template with source provenance before validation or spawning.
      rationale:
        - "[ai] Reusable entity and fine-system behaviour fragments must be authoring-time composition rather than a second runtime inheritance or policy-lookup model."
        - Deterministic merge order, include-chain diagnostics, and cycle rejection prevent content composition from becoming hidden behaviour.
        - "Issue #869 (e1898df7) built it. Entity TOML gains an ordered `includes` key (INCLUDES_KEY), resolved depth-first in declared order with each fragment merged into the accumulator and the DECLARING template merged LAST, so the includer always wins: a template including [a, b] resolves as ((a closure) then (b closure)) then self. The result is ONE fully resolved TOML document, parsed exactly once, BEFORE validation and spawning. Includes do not exist at runtime — no lookup, no inheritance, no second control path."
        - "Issue #869 put resolution deliberately UPSTREAM of the per-instance override path rather than folding the two together, and the reasoning is not preference. (1) EntityConfig is deny_unknown_fields, so an `includes` key cannot survive parsing; folding resolution into entity_loader::apply_overrides — which starts from an already-parsed EntityConfig — would have meant adding an includes field to EntityConfig purely to carry authoring metadata into the runtime and then scrubbing it there, which is exactly what this issue forbids. This resolver operates on raw TOML text and the key never reaches the struct. (2) CARDINALITY: includes resolve once per TEMPLATE (cached), overrides once per INSTANCE, and apply_overrides pays a serialise-merge-render-reparse round trip because its input is already a struct — fusing them would multiply that round trip by every spawn. Both layers nonetheless call the SAME merge (entity_override::merge_entity_config_toml), so there is still exactly one set of merge rules."
        - "Issue #869 merge semantics, SUPERSEDED by #911 and kept only as the starting point that issue moved from. #869 reconciled exactly two arrays by key — behaviour.state by `name` and behaviour.doctrine by `id` — and EVERY OTHER ARRAY REPLACED WHOLESALE, including tags, [[station]], [[system]], [[shield_arc]] and [[weapons_console.phaser_banks]]. A hull that included a systems fragment and then declared its own [[system]] blocks replaced the fragment whole suite rather than adding to it. Widening that rule would have changed instance-override semantics too, because both layers called the same two-argument merge, so #869 put it out of scope. The empty-array-clears lever and the omitted-key-leaves-it-alone rule both survive #911 unchanged."
        - "Issue #911 generalised the key-based reconciliation and SCOPED it, which is the whole design. The merge grew a MergePolicy parameter: ComposeFragments for include resolution, InstanceOverride for a world [[entity]].overrides. merge_entity_config_toml keeps its two-argument shape and defaults to InstanceOverride, so its three callers — entity_loader::apply_overrides, the direct call in world::dispatch step 2b, and world::validate::doctrine_anchor_refs through apply_overrides — all keep the pre-#911 semantics, and only include_resolve opts into the other policy. That is the smallest blast radius available. Those callers did each need one edit after all: the merge is now FALLIBLE (see the tombstone bullet), so each threads a Result. Under ComposeFragments an array whose dotted, index-free path is in COMPOSE_KEYED_ARRAYS reconciles element-wise: system / station / shield_arc / weapons_console.phaser_banks / weapons_console.blaster_banks / torpedoes.tubes / behaviour.doctrine by `id`, and station.rating by `name`. Every key is an identity the loader already enforces as unique (DuplicateSystemId and its siblings); `kind` is deliberately NOT an identity because it repeats in 8 of the 11 shipped files that declare systems. A matched entry deep-merges AT ITS ORIGINAL POSITION and only genuinely new entries append — that is a stated guarantee, not an accident, because [[shield_arc]] order is load-bearing (ShieldSystem::from_arcs maps arcs positionally, focused_facing is a positional index, and the first arc frequency seeds the ship-wide shield frequency)."
        - "Issue #911 authoring vocabulary, the AC3 record of what a fragment author writes to get each behaviour. EXTEND: declare an entry with a new id (or, for station.rating, a new name) and it is appended — no marker, no new syntax, which is the point, since a marker-per-array would make the common case (the library systems plus two of my own) require new syntax. REPLACE ONE ENTRY: declare an entry whose key matches an inherited one; it deep-merges in place and fields it does not mention survive. REMOVE ONE ENTRY: declare an entry carrying _remove = true beside its id; the inherited entry is dropped and the tombstone never reaches the resolved document, stripped exactly where `includes` is stripped, because EntityConfig is deny_unknown_fields. A tombstone matching nothing is a no-op, since fragments compose in any order; a later fragment re-adding the id wins whole rather than inheriting the marker. CLEAR THE WHOLE LIST: author an empty array, unchanged and still beating the element-wise rules. LEAVE IT ALONE: omit the key. Tombstones are a COMPOSE-layer marker only, and a world override that writes one is REJECTED BY THE MERGE ITSELF — merge_entity_config_toml_with returns Result and reject_unhonoured_removals fails on any _remove key anywhere in an InstanceOverride document. A world subtractive levers stay the empty array and restating the list."
        - "Issue #911 made the merge FALLIBLE so the tombstone guarantee is true where it matters. The first cut asserted that a _remove reaching a world override would be caught by EntityConfig deny_unknown_fields. Measured against the real ship_harrow_patrol hull, it was not: behaviour.doctrine is the one array that reconciles at the InstanceOverride layer, so a tombstone written there deep-merges INTO the matching template entry, and DoctrineObjective is not deny_unknown_fields — apply_overrides returned Ok, the doctrine came back unchanged as patrol-ironveil plus destroy-hostiles, and no warning was raised. src/ship/config.rs carries no deny_unknown_fields either, so [[system]], [[station]] and [[station.rating]] are no safer; only ShieldArcConfig, PhaserBankConfig and TorpedoTubeConfig actually reject an unknown key. That is precisely the silent-no-op failure mode #838 existed to end, behind a marker whose docs promised the opposite. merge_entity_config_toml_with now returns Result and reject_unhonoured_removals rejects any _remove key — true or false, at any depth — under InstanceOverride. Pinned END TO END by a_tombstone_in_a_world_override_fails_against_the_real_hull, which loads the shipped hull, asserts apply_overrides is Err, and asserts the doctrine = [] lever still works on the same hull."
        - "Issue #911 kept several arrays REPLACING deliberately, and this is a granularity decision rather than a gap. *.ai.rule and *_ai.state[].transition have only the composite (channel, priority) as a candidate key, so an author bumping a priority would silently rename the entry and get an append instead of an edit; equal-priority collisions are already rejected at load, so no stable key exists. *.selector.score entries carry no identity at all. hull.system_hull is positional. mesh.lod was too until issue #914 moved the LOD ladder into the model rig sidecar, so entity TOML no longer carries the array at all and the merge table no longer names it. A FRAGMENT CONTRIBUTING AN AI POLICY CONTRIBUTES IT WHOLE. Nested arrays inside a reconciled entry are judged by their own path, so behaviour.doctrine.directive_anchors — the empty-array idiom world::dispatch documents as the way through a directive-kind flip — keeps replacing wholesale at BOTH layers."
        - "Issue #911 handled `tags` as the one array with no possible key, and it is the reason the policy seam exists at all rather than a flag on the merge. tags is an array of bare strings, so set-union and replace are the only two options. It UNIONS at the compose layer, because a fragment library adding tags is what composition is for, and it REPLACES at the instance layer, because replacing is the only way a world can take a tag AWAY — assets/worlds/default.toml, patrol.toml and reinforcements.toml all override ship_harrow_patrol tags precisely to drop comms_contact, and tags are behaviourally live (entities/tags.rs, gui/radar.rs). One rule could not serve both layers; the test pinning the instance-layer half was written FIRST, because nothing asserted it before."
        - "Issue #911 RETIRED the behaviour.state special case rather than generalising it. BehaviourConfig is deny_unknown_fields and has had no `state` field since #572 dissolved the FSM, so a resolved document carrying [[behaviour.state]] does not parse and no shipped hull or fragment has one; its path and the by-name merger were exercised only by unit tests on raw toml::Value. The by-`name` MECHANISM is not retired — station.rating uses it — so the pre-existing tests were re-pointed at it rather than deleted. The old public helpers collapsed into one merge_keyed_array_at(path, template, overrides, key, policy); merge_named_array survives only as a test-only wrapper and merge_id_array, which had no caller left at all, went with the FSM."
        - "Issue #911 AC6, stated with its shortfall rather than as met verbatim. The behaviour.doctrine by-`id` half is preserved and live at BOTH layers, and its relationship to the new rule is explicit: it is one row of COMPOSE_KEYED_ARRAYS and the only row of INSTANCE_KEYED_ARRAYS. The behaviour.state by-`name` half was RETIRED, not preserved — see the bullet above — so AC6 is met for doctrine and deliberately not met for state. The by-`name` MECHANISM is still live through station.rating, and the test that covers it through the public merge is compose_reconciles_a_nested_array_inside_a_matched_entry; keyed_merge_by_name_replaces_matching_entry now calls the element-wise merger directly on a synthetic [[item]] array, so it pins the algorithm and does NOT prove the `name` path is reachable through the public entry point."
        - "Issue #911 drove PROVENANCE from the same table as the merge, which was the non-obvious hazard. Provenance::record_leaves carried its OWN copy of the keyed-array knowledge (behaviour.state to name, behaviour.doctrine to id, everything else none). Had the merge started reconciling [[system]] by id while provenance did not, a merged-in [[system]] would be recorded as a wholesale leaf and insert_leaf retain would prune every field an earlier fragment contributed to that array — provenance confidently reporting a system suite as authored by whichever fragment touched it last. record_leaves now carries TWO paths, the provenance address and the index-free merge path, and reads MergePolicy::array_rule for the second. A removal PRUNES the recorded entry rather than claiming it."
        - "Issue #911 BYTE-IDENTITY evidence, per AC4, proved by walks rather than by inspection. Templates: include_resolve shipped_tree every_shipped_template_resolves_to_its_own_bytes, unchanged and still green. Instance overrides: entity_loader every_shipped_world_override_merges_identically_to_the_pre_911_algorithm walks every (template, overrides) pair the shipped worlds author — from [[entity]].overrides and from [[trigger]] spawn_entity actions alike — and asserts the new merge and a verbatim reproduction of the pre-#911 algorithm render identical TOML. Measured mutation sensitivity, stated honestly: letting tags union at the instance layer makes that walk fail on default.toml, patrol.toml and reinforcements.toml, but NO shipped world override touches [[system]], [[station]], [[shield_arc]] or a weapon bank, so widening the instance layer to those arrays passes the walk untouched — that case is pinned separately by a table test over both policies. The two are complementary, not redundant."
        - "Issue #911 recorded a PRE-EXISTING divergence it did not fix: editor/override-editor.js deepMerge is a hand-rolled JS reimplementation of the merge with no by-id casing at all, so the browser override editor has been divergent from Rust for behaviour.doctrine since 68bda1be, independently of #911. Larger than this issue and tracked as #910. Recorded because it was written down nowhere."
        - "Issue #869 PATHS are resolved relative to the declaring template and canonicalised LEXICALLY (backslash to slash, . and .. collapsed) rather than through std::fs::canonicalize, because the key must be identical on WASM (no filesystem) and natively — the same keys double as config-cache keys and as the cycle-detection identity. Cycles, missing files and invalid resolved templates are load errors naming the include chain."
        - "Issue #869 extended BOTH preload paths rather than duplicating them, and the browser one needed a new idea: a delivered file may be a FRAGMENT, which never enters the config cache, so cache membership alone could not stop a fragment shared by five hulls being refetched for ever. PreloadStep expresses the browser walk (Ready / AwaitingIncludes). A test drives the same fixtures through the native and browser walks and asserts byte-identical output and identical provenance."
        - "SCOPE, updated by issue #875: THE FIRST SHIPPED HULL IS NOW COMPOSED. assets/entities/alliance_destroyer.toml declares includes = [fragments/ai/fleet_baseline.toml, fragments/ai/captain_alliance.toml, fragments/ai/movement_attack_pass.toml] and takes FIFTEEN ship-level declarations through the merge, specialising them by `param` alone: eleven of fleet_baseline's fourteen (its nine AI policies and five target selectors, less the three travel axes), the Alliance Captain policy from captain_alliance.toml, and the three travel axes movement_attack_pass.toml replaces them with. Every other comment quoting a count in this tree quotes the same fourteen. Everything else in the fragment tree is still a #869 fixture (composed_escort.toml, npc_escort_core.toml, ai/captain_red_alert_aggressive.toml) and the REST of the fleet is still uncomposed — that migration remains issue #878. Two #906 guards fired on purpose and were re-pointed rather than weakened: every_shipped_template_resolves_to_its_own_bytes is now a PARTITION (an uncomposed template still resolves byte-identically; a composed one must resolve to a document that PARSES, which byte-identity never asserted, and must differ from its own file or its includes contributed nothing), and include_str_baked_hulls_are_all_uncomposed named the five sites baking this hull, all of which moved to entity_includes::load_entity_config. The measured cost was far below #869 estimate: five baked sites, not ninety."
        - "Issue #875 proved the presence-gate hazard list AS PROVENANCE rather than as prose. include_resolve shipped_tree the_composed_destroyer_takes_only_ai_policy_from_its_fragments asserts that every authoring surface the spawner gates a capability on — tags, [[system]], [[station]], [[shield_arc]], hull.system_hull, mesh, collider, comms, [torpedoes], the weapon-bank arrays, shields_console.base, repair.repair_team_count, and the three reactor scalars — is attributed by Provenance::origin to the HULL and to no fragment. That is what makes the provenance half of #869 load-bearing rather than diagnostic: tags UNIONS at the compose layer, so a fragment carrying npc would flip a player hull out of marker_validate::is_player_flyable with nothing about the resolved document looking wrong, and a bare [torpedoes.ai] in a shared fragment would give every includer a torpedo system with zero tubes. The hazard list is a module-level HULL_OWNED and the check a shared helper, so the COMPOSED ARM of every_shipped_template_resolves_to_its_own_bytes applies it to every composed hull — the next hull to declare includes inherits the pin on the day it composes rather than the day someone writes it a test, which is what stops that arm degrading to 'parses and differs'. BOTH callers assert a non-zero coverage count, because a hull whose provenance keys changed shape would otherwise iterate nothing and pass vacuously — the destroyer pins its own measured >100, the walk a low per-hull floor a small composed hull still clears. The reactor scalars are in the shared list on purpose: fleet_baseline.toml really does carry capacity/rates/emergency_threshold (at other values) so its [power.ai_policy] has a table to sit in, and none of the three has a parse-time default, so a future hull that includes it and authors no [power] would silently inherit a 90-capacity reactor. They are pinned per PREFIX, never as a bare power, because power.ai_policy is exactly what a hull is meant to take from the library. What stays in the destroyer's own test is what is true of one hull: the reactor VALUES and player-flyability."
        - "SCOPE, updated by issue #876: THREE shipped hulls are composed, and they are the three player hulls. alliance_destroyer.toml (#875) takes fleet_baseline + captain_alliance + movement_attack_pass; alliance_battleship.toml takes fleet_baseline + captain_alliance + movement_artillery; alliance_cruiser.toml takes fleet_baseline + captain_alliance and NO movement fragment (see data-driven-fine-system-ai.yaml for the measured reason). The remaining hulls — every Harrow, the two couriers — are still uncomposed and remain issue #878. The byte-identity walk's pass-through arm is therefore still a large majority of the tree, which is the ratio it asserts on rather than a file count. The composed arm's provenance pin (HULL_OWNED) applied to both new hulls on the day they declared `includes`, exactly as #875 intended it to: neither needed a test written for it, and both cleared the coverage floor."
        - "Issue #876 measured the second cost of composing a hull, and it is bigger than #875's five sites: ELEVEN `include_str!` sites baked the cruiser or the battleship, against the destroyer's five, and include_str_baked_hulls_are_all_uncomposed named every one. Nine were tests and moved to entity_includes::load_entity_config (or resolve_from_disk where the test mutates the hull's TEXT — ai_flag_hosts and authored_ai_pins both substitute a guard string, and the resolved document is now the only text that carries the Captain and Power blocks AND the only text EntityConfig::from_toml accepts, since the raw file now holds an `includes` key the parser rejects). Two mutation constants had to be re-spelled against the RESOLVED rendering, because a composed template is re-serialised through toml::to_string and that orders a table's keys alphabetically; without_block asserts its target appears exactly once, so a rendering change fails loudly instead of deleting nothing. The ELEVENTH site is PRODUCTION: ship::components::load_ship_config_from_disk baked the battleship's bytes for the lobby's no-selection fallback, and now resolves through entity_includes::HostFragmentSource — the one fragment source that compiles on both targets."
    architecture:
      kind: configuration-transform
      authority: authoritative
      owns: [resolved-entity-template-state]
      reads: [entity-template-state]
      produces: [resolved-entity-template-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/entities/include_resolve.rs, src/entities/entity_override.rs, src/entities/config_cache.rs, src/entities/loader.rs]
      symbols: [resolve_template, resolve_from_disk, load_entity_config, preload_step, PreloadStep, ResolvedTemplate, Provenance, FieldOrigin, MergeStep, IncludeError, IncludeErrorDetail, FsFragmentSource, INCLUDES_KEY, MergePolicy, ArrayRule, merge_entity_config_toml_with, reject_unhonoured_removals, find_removal_marker, strip_removals, REMOVE_KEY]
      tests: [cargo test]

  - state: resolved-entity-template-state
    core:
      status: implemented
      confidence: confirmed
      title: Resolved Entity Template State
      summary: One validated EntityConfig plus include-chain provenance, after all declared entity-TOML fragments and declaring-template overrides have been deterministically composed.
      rationale:
        - "Issue #869 realises the provenance half. Provenance records which fragment set each field and the include chain that reached it. Merge-reconciled arrays are addressed BY KEY rather than by index, because positions are not stable across a merge, and a leaf write PRUNES its former subtree so a cleared list stops reporting fields that no longer exist. The provenance types are deliberately kept free of project types so the module stays liftable."
        - "Issue #911 widened the addressed set from two arrays to the whole identity table and made it read that table rather than a private copy: system[id=helm-thrust].ai_only and station[id=bridge].rating[name=tactical].level are now addressable alongside behaviour.doctrine[id=destroy-hostiles].base_priority. A _remove tombstone is authoring metadata, never an authored field, and prunes the entry it removes."
    architecture:
      classification: authoritative
      owner: entity-template-composition-resolver
      writers: [entity-template-composition-resolver]
      readers: [ship-config-loader, entity-spawn-orchestrator, entity-template-schema-validator]
    implementation:
      status: declared
      paths: [src/entities/include_resolve.rs]
      symbols: [ResolvedTemplate, Provenance, FieldOrigin, MergeStep]
      tests: [cargo test]

  - component: ship-config-loader
    core:
      status: implemented
      confidence: confirmed
      title: Ship Configuration Loader
      summary: Extracts and validates station/system topology, ratings, power groups, and per-system configuration from a ship entity template.
    architecture:
      kind: configuration-validator
      authority: authoritative
      writes: [ship-station-system-topology-state]
      reads: [entity-template-state]
      validates: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/config.rs, src/entities/config.rs, src/ship/system_registry.rs]
      symbols: [parse_and_validate, ShipConfig]
      tests: [cargo test]

  - component: entity-spawn-orchestrator
    core:
      status: implemented
      confidence: confirmed
      title: Entity Spawn Orchestrator
      summary: Instantiates world and runtime entities with authored transform, collider, hull, ship, behaviour, faction, system, and presentation components.
    architecture:
      kind: lifecycle-service
      authority: authoritative
      owns: [spawned-entity-state]
      reads: [entity-template-state, world-configuration-state, ship-station-system-topology-state]
      produces: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/world/server.rs]
      symbols: [spawn_entity]
      tests: [cargo test]

  - state: spawned-entity-state
    core:
      status: implemented
      confidence: confirmed
      title: Spawned Entity State
      summary: Authoritative live ECS entities and their stable world/runtime identity after template and world configuration are resolved.
    architecture:
      classification: authoritative
      owner: entity-spawn-orchestrator
      writers: [entity-spawn-orchestrator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/core/messages.rs]
      # The stable world/runtime identity components; the live ECS Entity
      # handle itself is deliberately NOT a symbol here — it is exactly the
      # unstable-across-instances handle #894 and this slice name as the
      # thing fold order must never key on.
      symbols: [EntityUuid, EntityId, EntityName]
      messages: [EntitySpawned, EntityDespawned]

  - component: model-marker-contract
    core:
      status: implemented
      confidence: confirmed
      title: Model Marker Contract
      summary: Connects authored model rigs and named marker points to ship systems, weapon origins, engine effects, cameras, and other presentation/runtime attachments. Every reference is validated against the selected rig at authoring time in the editor, in CI over the shipped templates, and at native/headless startup before any entity spawns; the browser host does not yet run the gate because its rig sidecars arrive asynchronously.
    architecture:
      kind: configuration-contract
      authority: authoritative
      reads: [entity-template-state, ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: confirmed
      paths:
        - src/entities/model_rig.rs
        - src/entities/marker_validate.rs
        - src/entities/config.rs
        - src/server/pfx.rs
        - src/headless/app.rs
      symbols: [ModelRig, MarkerFinding, MarkerRole, validate_entity_markers, duplicate_marker_findings]
      tests: [cargo test]
    exceptions:
      - rule: every-marker-reference-is-validated-before-attachment
        scope:
          - host-browser-runtime
        rationale: >-
          The gate runs at authoring time in the editor, in CI over every shipped template, and at
          native/headless startup before App::new. It does not run in the browser host: there rig
          sidecars are fetched asynchronously by JS (wasm_push_sidecar_toml) some frames after the
          entity template is parsed, so no point in the boot sequence knows the full set of rigs
          before glb_visual attaches. A hand-edited template that bypassed both the editor and CI
          would therefore still fall back silently in the browser.
        temporary: true
        removal_condition:
          - browser-host-validates-marker-references-once-sidecar-fetches-settle
        approval_status: accepted
    evidence:
      - kind: test
        reference: phaser_bank_missing_marker_is_located_error
        summary: An unresolved weapon marker is a source-located error finding rather than a silent fall back to the ship centre.
      - kind: test
        reference: weapon_referencing_camera_marker_is_incompatible
        summary: The reserved camera_ marker namespace is enforced in both directions, so a weapon cannot claim a viewpoint.
      - kind: test
        reference: duplicate_marker_declaration_is_located
        summary: A rig that declares the same marker twice is reported with its line rather than being silently deduplicated.
      - kind: test
        reference: every_shipped_entity_marker_reference_resolves
        summary: Every marker reference in the shipped entity templates resolves against the rig its mesh selects.

  - component: entity-override-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Entity Override Resolver
      summary: Applies world-authored entity overrides to template defaults before spawn without changing the template's shared definition.
    architecture:
      kind: configuration-transform
      authority: authoritative
      reads: [entity-template-state, world-configuration-state]
      transforms: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/entity_override.rs, src/entities/spawner.rs]
      tests: [cargo test]

  - component: world-available-ship-catalog
    core:
      status: implemented
      confidence: confirmed
      title: World Available Ship Catalog
      summary: Exposes the template paths and labels offered for player-ship selection. Reads a loaded world's available ship entries, and — before any world is loaded — builds the catalog from the base scenario manifest so each selectable scenario's ships are available pre-load.
    architecture:
      kind: catalog-provider
      authority: authoritative
      owns: [scenario-ship-catalog-state]
      produces: [scenario-ship-catalog-state]
      reads: [world-configuration-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/manifest.rs, src/world/config.rs, src/server/bridge.rs, server.html]
      symbols: [AvailableShipEntry, ScenarioCatalog, build_catalog]
      tests: [cargo test]

  - component: entity-template-schema-validator
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Schema Validator
      summary: Parses and validates the authored entity configuration surface, including mesh and LOD, collider, region, hull, systems, stations, weapons, Helm, Power, Shields, Sensors, Navigation, Comms, behaviour, faction, and presentation sections.
    architecture:
      kind: configuration-validator
      authority: authoritative
      reads: [entity-template-state]
      validates: [entity-template-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs, src/ship/config.rs]
      tests: [cargo test]

  - component: entity-component-composition
    core:
      status: implemented
      confidence: confirmed
      title: Entity Component Composition
      summary: Applies each present validated template section as the matching runtime component set, including stable IDs/names, transform, physics, ship systems, faction/behaviour, combat, regions, and visual configuration.
    architecture:
      kind: entity-composer
      authority: authoritative
      reads: [entity-template-state, ship-station-system-topology-state]
      writes: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/entities/loader.rs, src/ship/config.rs]
      tests: [cargo test]

  - component: entity-template-capability-contract
    core:
      status: implemented
      confidence: confirmed
      title: Entity Template Capability Contract
      summary: Treats ship systems and station topology as authored capabilities rather than fixed categories, so templates may omit engines or any console system while the runtime composes only declared components.
    architecture:
      kind: configuration-contract

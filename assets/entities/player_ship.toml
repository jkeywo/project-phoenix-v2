name = "Player Ship"
tags = ["player", "ship"]
faction = "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa"

[collider]
shape = "Capsule"
radius = 1.5
length = 4.0

[hull]
repair_team_count = 2

[repair]
travel_duration_secs = 5.0
repair_rate_hp_per_sec = 0.5

[[hull.console_hull]]
console = "Helm"
max_hp = 25.0

[[hull.console_hull]]
console = "Tactical"
max_hp = 25.0

[[hull.console_hull]]
console = "Power"
max_hp = 25.0

[[hull.console_hull]]
console = "Shields"
max_hp = 25.0

[weapons_console]
power_multipliers = [-0.5, 0.0, 0.25, 0.5]
beam_range = 100.0
beam_damage_per_sec = 5.0
beam_duration_secs = 6.0
cooldown_secs = 6.0
beam_color = [1.0, 0.4, 0.1, 1.0]
torpedo_arc_color = [1.0, 0.55, 0.2, 0.15]

[weapons_console.radar]
range = 300.0
shows = ["player", "ship", "asteroid", "station", "missile", "torpedo", "region"]

# Port phaser bank: covers the port hemisphere (forward arc to aft arc).
# Auto-fire window is narrower than the manual fire arc.
[[weapons_console.phaser_banks]]
id = "port"
facing_deg = -90.0
fire_arc_deg = 135.0
auto_arc_deg = 90.0

# Starboard phaser bank: mirror of port.
[[weapons_console.phaser_banks]]
id = "starboard"
facing_deg = 90.0
fire_arc_deg = 135.0
auto_arc_deg = 90.0

[torpedoes]
count = 10
damage_hull = 50
damage_shields = 5
speed = 30.0
turn_rate_deg_per_sec = 45.0
lifespan = 20.0
load_time = 10.0
detonation_radius = 5.0

# Forward tube A
[[torpedoes.tubes]]
id = "fore_port"
facing_deg = 0.0
fire_arc_deg = 90.0

# Forward tube B
[[torpedoes.tubes]]
id = "fore_starboard"
facing_deg = 0.0
fire_arc_deg = 90.0

# Aft tube: rear-facing torpedo launcher.
[[torpedoes.tubes]]
id = "aft"
facing_deg = 180.0
fire_arc_deg = 90.0

[sensors_console]
power_multipliers = [-0.5, 0.0, 0.25, 0.5]

[sensors_console.long_range_radar]
range = 400.0
shows = ["player", "asteroid", "ship", "station", "planet", "star"]

[power]
capacity = 100.0
rates = [6.0, 5.0, 4.0, 2.0, -2.0, -6.0]
emergency_threshold = 25.0

[captain_console]

[helm_console]
max_speed = 25.0
max_reverse_speed = 10.0
acceleration = 10.0
deceleration = 25.0
max_yaw_rate = 0.5
impulse_charge_duration = 3.0
impulse_speed_multiplier = 10.0
impulse_acceleration_multiplier = 5.0

[helm_console.radar]
range = 250.0
shows = ["player", "asteroid", "ship", "station", "planet", "star"]

[navigation_console]

[navigation_console.system_chart]
range = 800.0
shows = ["region", "asteroid_field", "star", "planet", "station", "player"]

# Comms range — within this radius the player ship can hail / be hailed.
# Scale matches helm radar / system chart so default-world entities are
# generally reachable but distant contacts drop offline.
[comms]
range = 1200.0

[shields_console]
focus_bonus_max_hp = 50
focus_bonus_regen = 5.0
focus_penalty_max_hp = 25
focus_penalty_regen = 2.5
focus_decay_rate = 10.0

[shields_console.base]
# UI assumes 4; other values will break the client Shields panel.
num_facings = 4
max_hp = 100
regen_per_sec = 5.0
offline_duration = 10.0

[engineering_console]

[radar_appearance]
colour = [0.6, 0.8, 1.0]
radius = 6.0
icon = "player_ship"

[stations]
min_players = 1
max_players = 6

# 1P: solo crew — captain handles everything including comms.
[[stations.1]]
name = "Captain"
description = "Solo crew: pilot, fight, command, and hail contacts."
consoles = ["CaptainChair", "Helm", "Tactical", "Repair", "Power", "Sensors", "Shields", "Navigation", "Comms"]
rank = "Cpt."
next = "Helm"

# 2P: command bridge + tactical ops.
[[stations.2]]
name = "Helm"
description = "Pilot the ship, command the bridge, shields and manage comms."
consoles = ["CaptainChair", "Helm", "Shields", "Comms"]
rank = "Cpt."
next = "Helm"
previous = "Captain"

[[stations.2]]
name = "Tactical"
description = "Weapons, damage control, power, and science operations."
consoles = ["Tactical", "Repair", "Power", "Sensors", "Navigation"]
rank = "Ltn."
next = "Tactical"

# 3P: bridge, weapons, and engineering. Science ops split.
[[stations.3]]
name = "Helm"
description = "Pilot the ship, command the bridge."
consoles = ["CaptainChair", "Helm"]
rank = "Cpt."
previous = "Helm"
next = "Helm"

[[stations.3]]
name = "Tactical"
description = "Manage weapons, sensors, shields, and navigation."
consoles = ["Tactical", "Sensors", "Navigation"]
rank = "Ltn."
previous = "Tactical"
next = "Tactical"

[[stations.3]]
name = "Engineering"
description = "Maintain and repair ship systems, manage power, shields, and manage comms."
consoles = ["Repair", "Power", "Shields", "Comms"]
rank = "Ltn."
next = "Engineering"


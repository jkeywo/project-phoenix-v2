  - migration: helm-shared-motion-planner-rollout
    core:
      status: implemented
      confidence: confirmed
      title: Helm Shared Motion Planner Rollout
      summary: Completed migration (issue #745) from direct-write helm avoidance helpers to a shared desired-motion and hazard-assessment planning surface — both legacy doctrine symbols (operate_helm, operate_lateral_thrust) are retired and the shared planner is the sole doctrine consumer.
      rationale:
        - "Helm AI used to compute steering and lateral avoidance inside separate per-axis operators, each calling the legacy operate_helm / operate_lateral_thrust doctrine directly."
        - "The shipped helm design centralises planning — helm_motion_planner (via helm_ai_decision) is now the single caller of the pure travel doctrine, renamed plan_helm_travel in #745, and the per-axis fine systems decode their own actuator scalar from the shared desired-motion contract."
        - "Repository observation is file-level and several PASM entities share src/ship_plugin.rs, so this migration used explicit symbol-does-not-exist removal conditions rather than an imprecise caller allowlist; both conditions now hold."
    migration_plan:
      legacy_entities:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      target_entities:
        - helm-motion-planner
        - helm-vertical-thrust-ai-operator
      temporary_adapters:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      target_symbols:
        - desired-motion-state
        - hazard-assessment-state
      removal_conditions:
        - predicate: symbol-does-not-exist
          subject: operate_helm
        - predicate: symbol-does-not-exist
          subject: operate_lateral_thrust
    implementation:
      status: observed
      paths:
        - src/ship/helm_planner.rs
        - src/ai/core.rs
      symbols:
        - helm_motion_planner
        - plan_helm_travel
        - DesiredMotion
        - HazardAssessment
      tests:
        - cargo test


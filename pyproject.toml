# Development tooling for project-phoenix-v2. Ships no Python of its own;
# exists to pull PASM.
#
# PASM used to be vendored here. It is the fleet's tool, kept in vellum and
# consumed as a git subdirectory pinned to a rev, so this repo cannot drift
# from the version the rest of the fleet validates against. The spec itself
# (pasm/spec/) stays here — that is this game's model, not the tool.
[project]
name = "project-phoenix-tooling"
version = "0.1.0"
description = "Development tooling for project-phoenix-v2. Ships no Python; exists to pull PASM."
requires-python = ">=3.11"
dependencies = [
  "pasm @ git+https://github.com/jkeywo/vellum@172c388bc53697c80869b4a7a6e4c47eaa868bfd#subdirectory=pasm",
]

[tool.uv]
package = false

# Local override against a sibling vellum checkout — uncomment for local work,
# re-comment before committing. The committed state always resolves the pin.
# [tool.uv.sources]
# pasm = { path = "../vellum/pasm", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
]

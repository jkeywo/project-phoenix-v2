<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.comms.doc_title">Project Phoenix - Comms Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    /* The readout stays INSIDE the console body (issue #1374's rule: no
       readout loose in the frame), so the body is a column and the two
       list/thread tracks are the grid below it. `.comms-body` is positioned
       because in portrait the thread panel covers exactly that box — the
       readout above it stays on screen (see the media query). */
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .comms-body { position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
    .list-col { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
    .panel-col { min-height: 0; display: flex; flex-direction: column; gap: 8px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; overflow: hidden; }
    .panel-col h2 { margin: 0; flex-shrink: 0; font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; }
    /* HAILS | CONTACTS share one list area at EVERY width (issue #1380), so
       the unread count on the HAILS tab means the same thing on a phone as it
       does on a desk. The unselected panel is really `hidden`; there is no
       layout in which both are on screen. */
    .seg-panel { flex: 1; }
    /* `.panel-col`'s own `display:flex` (an author rule) otherwise beats the
       browser's default `[hidden]{display:none}` (a user-agent rule) on
       cascade origin alone — the same trap the cruiser's `.view[hidden]`
       comment records — so the unselected tab's panel would stay on screen. */
    .seg-panel[hidden] { display: none; }
    .seg-count { font-size: var(--text-xs); font-weight: 700; color: var(--bg-deep); background: var(--science); border-radius: 999px; padding: 0.05rem 0.4rem; }
    .seg-count[hidden] { display: none; }
    ph-comms-contact-list, ph-comms-hail-list { flex: 1; min-height: 0; overflow-y: auto; }
    ph-comms-current-message { flex: 1; min-height: 0; }
    /* The open thread. An ordinary second column here; a local overlay over
       the list in portrait (below). It declares NO `data-tab-code`, so the
       shell's Station Bar never offers it as a tab — it belongs to the row
       that was tapped, not to the seat. */
    .overlay-back { display: none; }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .console-body { gap: 8px; }
      .comms-body { display: block; }
      .list-col { height: 100%; }
      .panel-col { padding: 8px; }
      /* OPAQUE, unlike the destroyer Tactical overlays' 0.97: this panel
         covers the list area only, so a translucent ground would print the
         selected HAILS tab and the row underneath straight through the
         conversation's first lines. */
      .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; display: none; background: rgb(var(--rgb-deep)); }
      .overlay-panel.open { display: flex; }
      .overlay-back { display: inline-flex; align-items: center; align-self: flex-start; flex-shrink: 0; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; min-height: var(--control-hit-min); }
      .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Comms Console" data-i18n-attr="data-screen-label:console.comms.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup. The active hail the footer carried is the readout below,
           at the head of the traffic it describes. -->
      <div class="console-body">
        <div class="readout">
          <span id="footer-target" data-i18n="console.common.no_active_hail">NO ACTIVE HAIL</span>
          <span class="spacer"></span>
          <span class="auto-badge" id="comms-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
        </div>
        <div class="comms-body">
          <div class="list-col">
            <div class="seg" id="comms-seg" role="tablist" data-i18n-attr="aria-label:console.comms.seg.label">
              <button type="button" class="seg-btn" id="comms-seg-hails" role="tab" aria-selected="true" aria-controls="comms-panel-hails"><span data-i18n="console.comms.seg.hails">HAILS</span><span class="seg-count" id="comms-hails-unread" hidden></span></button>
              <button type="button" class="seg-btn" id="comms-seg-contacts" role="tab" aria-selected="false" aria-controls="comms-panel-contacts" tabindex="-1" data-i18n="console.comms.seg.contacts">CONTACTS</button>
            </div>
            <div class="panel-col seg-panel" id="comms-panel-hails">
              <ph-comms-hail-list id="comms-hail-list"></ph-comms-hail-list>
            </div>
            <div class="panel-col seg-panel" id="comms-panel-contacts" hidden>
              <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
            </div>
          </div>
          <div class="panel-col overlay-panel" id="comms-thread-panel">
            <button class="overlay-back" id="comms-thread-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
            <h2 data-i18n="console.comms.current_thread">Current Thread</h2>
            <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-hail-list.js';
    import '../components/ph-comms-current-message.js';
    import { initConsole } from '../console-core.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    import { installRovingTabindex, syncRovingTabindex } from '../roving-tabindex.js';
    // The render lives in gui/battleship/comms.console.js (issue #1235): one
    // shared Comms renderer, this hull's variant. s is a flat
    // CommsConsolePayload. The vitest suite imports the same renderStation.
    import { renderStation } from './comms.console.js';

    // One delegated listener drives the thread panel's ← Back button. The
    // panel has no toggle of its own — a HAILS row IS the toggle, and the
    // renderer opens the panel when that row's thread is selected.
    initConsoleOverlays(document);

    initConsole({ name: 'comms', render: renderStation });

    // HAILS | CONTACTS (issue #1380): presentation-only local selection — no
    // host command, just which list is on screen. Same shape as the phone
    // segments on Navigation, Captain and Engineering; duplicated per document
    // like the rest of this document's own wiring.
    var commsSeg = document.getElementById('comms-seg');
    var commsSegButtons = [
      document.getElementById('comms-seg-hails'),
      document.getElementById('comms-seg-contacts'),
    ];
    var commsSegPanels = {
      hails: document.getElementById('comms-panel-hails'),
      contacts: document.getElementById('comms-panel-contacts'),
    };
    function selectCommsSeg(key) {
      commsSegButtons.forEach(function(btn, i) {
        btn.setAttribute('aria-selected', (i === 0) === (key === 'hails') ? 'true' : 'false');
      });
      commsSegPanels.hails.hidden = key !== 'hails';
      commsSegPanels.contacts.hidden = key !== 'contacts';
      syncRovingTabindex(commsSegButtons, key === 'hails' ? 0 : 1);
    }
    commsSeg.addEventListener('click', function(e) {
      var btn = e.target.closest('.seg-btn');
      if (!btn) return;
      selectCommsSeg(btn === commsSegButtons[1] ? 'contacts' : 'hails');
    });
    commsSeg.addEventListener('focusin', function(e) {
      var btn = e.target.closest('.seg-btn');
      if (!btn) return;
      selectCommsSeg(btn === commsSegButtons[1] ? 'contacts' : 'hails');
    });
    installRovingTabindex(commsSeg, { getItems: function() { return commsSegButtons; }, orientation: 'horizontal' });
  </script>
</body>
</html>

  - component: gm-t2-map-feed-and-inspector-shell
    core:
      status: accepted
      confidence: confirmed
      title: Omniscient Map, Activity Feed, and Reusable Inspector Shell
      summary: "M1 shows every player ship, NPC, structure, authored hazard and authored Region with stable identity, position, faction, broad health/status, and current target. Asteroid fields render as aggregate Regions, never as individual asteroids unless authored as named selectable entities. Selection opens a minimal reusable inspector shell. One bounded tick-stamped activity stream now carries Damage, Destruction, Objective lifecycle changes, actual trigger fires, Red Alert edges, safe public connection changes, and attributed terminal GM actions/results through a common {tick, category, ships, links, detail} contract. Category and semantic-ship filters compose as a strict AND, global rows appear only under All ships, and links return to live map selection. Detailed doctrine, damage, Comms, knowledge, and attention scoring wait for the milestones that own them."
      rationale:
        - "The map, selection, inspector, panels, capability adapters, and action adapters are T2 components designed for M6 reuse, not a disposable GM page."
        - "The local projection classifies ships before structure substrate, treats StaticPointDefence as a structure, and projects authored RegionShape geometry plus narrowed radar appearance. Streamed Asteroid/AsteroidUuid lifecycle entities have no EntityUuid and therefore never become contacts; only asteroids named in the authored world identity table are selectable points, while each asteroid-field section is one aggregate torus Region."
        - "Inspect mode partitions geometry rows from point blips, gives an overlapping point priority and then resolves by stable UUID, and lets touch and keyboard traverse only explicitly selectable Regions. Absolute removal clears selection and same-UUID layer reappearance does not resurrect it; ordinary Navigation remains point-selecting."
        - "The feed consumes unconditional structured source facts rather than creating a parallel GM-only event bus. Fixed facts collect before SimTick advances; Objective changes emit only at actual Active/Completed/Failed transitions from the shared dispatcher and independent Helm-AI path, trigger facts emit at the real evaluator fire seam with authored id or stable script-path/function fallback, and Red Alert consumes actual edges. PostUpdate adds safe public presence and terminal operational results while paused, before the existing host bridge drains Force Start results. Canonical category order is Damage, Destruction, Objective, Trigger, Red Alert, Connection, GM Action; category-specific keys retain exact repeats in the authored global.gm_activity_history_depth ring (default 128)."
        - "A presentation-only EntityUuid/AsteroidUuid name-and-Ship directory is captured before combat, then pruned to live identities plus those referenced by the bounded feed; Lobby clears it completely. Ship scope comes only from an actual Ship marker, never VictimKind or arbitrary EntityUuid. Removed identities therefore stay readable only while a retained row needs them, streamed asteroid UUID churn cannot grow metadata without bound, and a removed identity cannot become a stale map selection. Category and ship filters are strict AND; clearing resets both and a disappearing selected ship resets to All. Known String Table name ids localise at render time while literal mod-authored names remain literal."
        - "Connection rows expose only public id, name, role, state, and optional ship. Session tokens, peer ids, mesh slots, and reconnect capabilities never enter the DTO. Pause/Resume and Force Start rows carry public operator identity, durable correlation, exact Applied/No-op/Refused outcome, reason, and canonical action order when one exists; restore/join rebases the observed action cursor. Fictional consequences remain ordinary world rows. M1 adds no attention score, priority, severity, workload, or ranking."
    architecture:
      kind: gm-presentation
      authority: non-authoritative
      coordinates: [gm-milestone-peer-tracer, gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime]

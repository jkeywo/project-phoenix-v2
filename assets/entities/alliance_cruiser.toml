# clamp — `PowerSystem` floors every group at `GROUP_LEVEL_MIN` (= 1) whatever a
# hull authors, and nothing else server-side reads this number. It reads 1
# because a human Power officer can command this group down to 1 to free spare
# points in the 8-point budget, and a row starting at 2 would hide the rung they
# are allowed to reach. NOMINAL — the rung whose multiplier is 1.0 — is 2, and
# that is `default_level`, where the group boots.
default_level = 2
min_level = 1
max_level = 4

[power_groups.weapons]
label = "entity.alliance_cruiser.power_groups.weapons.label"
# `min_level = 1`: the DISPLAY floor, as on Helm above — the bottom pip of the
# console's row, not a clamp on what can be ordered. NOMINAL (×1.0) is 2, which
# is where this group boots; dropping it to 1 is a legal order that spends the
# freed point elsewhere, so rung 1 has to be drawn.
default_level = 2
min_level = 1
max_level = 4

[power_groups.shields]
label = "entity.alliance_cruiser.power_groups.shields.label"
# Nominal at 2 alongside Helm and Weapons: those three groups make the
# sustainable resting total of 6. Higher levels buy shield regeneration.
# `min_level = 1` is the DISPLAY floor (see Helm above), the bottom of the pip
# row rather than a clamp.
default_level = 2
min_level = 1
max_level = 4


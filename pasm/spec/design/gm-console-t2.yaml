  - mechanic: gm-t2-event-control-contract
    core:
      status: accepted
      confidence: confirmed
      title: Explicit Fire, Pause, and Skip-Next Event Controls
      summary: "An automatic authored event is GM-controllable only when it declares gm_controls metadata with a stable qualified id, String Table label/description, and any explicit subset of fire, pause, and skip. Missing controls are invisible and unavailable. Pause is a persistent manual toggle: while paused the automatic condition is not evaluated and no missed edge is captured; unpause resumes ordinary evaluation, so a GM must use Fire if the opportunity passed. Fire bypasses condition and pause and executes the ordinary handler/lifecycle. Skip arms only the next matching occurrence and advances lifecycle as if it fired: a repeating event enters cooldown and a once-only event is spent. An armed skip survives Pause; Fire does not consume it."
      rationale:
        - "gm_event(id, label, handler) is the manual-only shorthand and implies Fire without a redundant gm_controls declaration. It is one-shot by default; repeatable() makes it a reusable quick tool."
        - "A scenario can therefore expose a pure GM control with only a Fire trigger, while authors retain complete control over which automatic events are operable."
        - "Trigger identity and control state are layer-qualified and represented in snapshots, deterministic digests, history, and the command log."
        - "[ai] Qualification is `<origin layer>::<authored id>`, with `base-world` for the base world, DERIVED at read time from the trigger state's origin_layer rather than baked into the control set at compile time: the same authored unit can be merged as a base world in one run and as a layer in another, and only one of those two facts is authored. Authored ids may not contain `::` or whitespace, so the join is unambiguous, and two ids that collide within one compiled set are a load-time error — deliberately stricter than ResetTrigger's tolerant Trigger::id lookup, which re-arms EVERY trigger sharing an id on purpose, because a GM action names exactly one event and must get exactly one handler run."
        - "[ai] Fire ARMS the event rather than calling its handler: the typed action's PreUpdate reducer records the qualified id on WorldContentRuntime::pending_gm_event_fires, and the ordinary FixedUpdate trigger pipeline consumes the arm and runs the ordinary handler in table order. A second call path into the Rhai runtime from the action reducer is the one shape that would make a GM fire differ from an automatic one, and it would have to duplicate tick_trigger_pipeline's whole parameter set. Everything that decides the RESULT is still revalidated at the agreed apply tick, so equal GMs commit the same Applied/No-op/Refused on every peer."
        - "[ai] A `when` predicate that reads false suppresses a manual firing WITHOUT consuming the arm, exactly as it suppresses an automatic firing without consuming the trigger — so a Fire during a suppressed moment lands when the predicate holds instead of being silently lost. An arm is dropped only when it is consumed by an actual firing, when the event is a spent once-only, or when the layer that authored it has unloaded."
        - "[ai] The armed set is folded into the deterministic digest and captured in the snapshot only when it is non-empty, so no world that authors no GM event moved its digest when this landed. The durable LoggedGmAction gained an optional target so the activity feed and the mission panel can say WHICH event a logged Fire fired without re-reading the journal."
        - "[ai] A REFUSAL carries that stable target too, on both lanes that can produce one before a grant exists: the local browser ingress builds its fact from the request itself (LoggedGmAction::refused_request) and the owner's canonical decision from the proposal (refusal_for), so a refused Fire still names the event the operator pressed. validate_fleet_frame refuses a replicated refusal whose target does not match its family — an event-control refusal must name an event and no other family may — because a targetless one could only be published as a fire of the empty id on every GM's feed."
        - "[ai] The browser carries the same action vocabulary Rust publishes: gm-activity-feed.js normalises fire_gm_event and renders its own sentence. Its parse is deliberately payload-wide and strict, so a variant known to only one side does not drop one row, it freezes the whole feed until the entry rotates out."
        - "[ai] The run boundary resets the mission projection's de-duplication cache beside the session twin's. The authored trigger table is built once at Startup, so a lobby round-trip in which no Fire was taken leaves round two's projection byte-identical to round one's; the GM page clears its panel on the Lobby transition, so a surviving cache would suppress the only push that could fill it again."
        - "[ai] The ARMED SET is cleared at that same boundary, with the journal, log, refusals and both projections. WorldContentRuntime is Startup-built and so survives the round-trip, and a `when` predicate or an unelapsed cooldown can legitimately hold an arm for many ticks: a surviving one would run its authored handler in the NEXT run with no grant, no LoggedGmAction, no activity-feed row and nobody attributed, while the panel reported it armed against an empty result feed and a fresh Fire returned an unexplained No-op. The arm is a GM command's pending effect, so it belongs to the run whose grant authorised it, not to the world content it names."
        - "[ai] Issue #1302 (Fire on one automatic event) implemented 2026-09-06 as an AUTHORING surface and nothing else: `<registration>.gm_controls(id, label)` is a third TriggerHandle modifier beside `.when(…)` and `.repeat()`, so GM operability is orthogonal to all thirteen conditions instead of thirteen `_gm` overloads. It builds the SAME GmEventControls struct `gm_event` implies — the constructor was renamed manual_fire -> fire_only, because a name for one of its two callers reads as a claim about the condition that is not true. NOT ONE runtime seam changed: state_event_id, controllable_events, find_event, fireable_index, the FireGmEvent admission and apply-tick revalidation, manual_fire_is_still_live and every eligibility gate in fire_manual_trigger key off Trigger::gm_controls and the once/repeat/when/cooldown lifecycle fields, never Trigger::condition, which is what makes 'Fire bypasses the condition and runs the ordinary handler and lifecycle' true by construction rather than by a second code path that could drift. The mission-panel payload carries no condition either, so no JS, no codec and no snapshot format moved. The ONE deliberate condition read on the manual path is fire_manual_trigger naming the condition's SUBJECT on the FiredTrigger it returns (entity_name_from_condition), so a GM fire of on_destroyed('courier', …) is recorded against the courier exactly as the real occurrence would have been: 'bypasses the condition' is a claim about what may CAUSE a firing, never about what the firing then says happened, and nothing downstream may be able to tell GM-caused history from the world's own. Three consequences only an automatic event can have are now pinned by tests: the authored once/repeat lifecycle is ONE latch shared by both causes (a GM Fire spends the automatic occurrence that would have followed, and an occurrence that already fired makes a later Fire a No-op), a trigger declaring no controls stays unlisted and Refused UnknownGmEvent while its ordinary condition keeps working, and a GM fire's BalanceEvent::TriggerFired carries the condition's own subject uuid."
        - "[ai] One trigger carries at most ONE control set: a second `.gm_controls(…)`, and `gm_event(…).gm_controls(…)` (whose shorthand already implied Fire under a DIFFERENT authored id), are load-time errors rather than a last-writer-wins overwrite that would publish a mission-panel row under an id the author did not choose and leave the other id unaddressable. The id space is one space across both surfaces, so validate_gm_events refuses a manual and an automatic event that collide exactly as it refuses two manual ones. Pause (#1303) and Skip (#1304) will arrive as sibling modifiers on the same handle rather than by widening `.gm_controls()`, so neither issue is a breaking edit to a world that already declares a control set."
        - "[ai] Issue #1303 (Pause) implemented 2026-09-06 exactly as that sentence promised: `.pauseable()` is a fourth TriggerHandle modifier that turns on the Pause lever of a control set either surface already declared, so no world that authors `gm_event`/`gm_controls` changed a character. It requires that control set to exist (nothing to address, label or render a row for otherwise) and is idempotent when repeated, unlike a second `gm_controls` — a second `.pauseable()` sets one bool to the same value, while a second control set silently re-identifies the event."
        - "[ai] The gate is on EVALUATION, not on firing, and that distinction is the whole issue. `tick_trigger_pipeline` skips a paused trigger BEFORE `evaluate_single_trigger`, so `trigger_fires_for_events` is never called — which is what leaves `seen_destroyed` un-accumulated, the `fired` latch unset and the cooldown unstamped. A gate that merely suppressed the firing would still BANK an `on_all_destroyed` occurrence and fire it on the first tick after the Resume, which is precisely the captured missed edge the contract forbids. Resuming restores ordinary evaluation against whatever THAT tick's events say, so a level condition still true (an `on_timer` past its threshold) fires then: a fresh true reading, not a banked edge. Only the automatic pass is gated — an armed Fire is honoured while paused, because Fire is the lever a GM reaches for exactly when the automatic opportunity has gone."
        - "[ai] `WorldContentRuntime::paused_gm_events` is a `BTreeSet` beside `pending_gm_event_fires`, snapshotted, folded behind the same emptiness check (so no existing world's digest moved) and cleared at the run boundary with the journal that authorised it. It is pruned when a layer UNLOADS rather than in the pipeline the way an arm is: the two facts go stale at different moments, an arm is re-examined every tick the pipeline already runs, and a paused event costs nothing per tick — waking the pipeline solely to notice an unaddressable id would be worse than pruning at the one seam where the qualified id stops being live. `pausable_index` revalidates at the agreed apply tick like `fireable_index`, but deliberately does NOT consult the once/repeat latch: a spent one-shot is still pausable, because Pause decides whether the condition is EVALUATED and a toggle that silently stopped answering once the event had fired is indistinguishable from a broken control."
        - "[ai] The durable result gained a VERB (`LoggedGmAction::verb`, `GmActionRefusal::verb`, `GmEventVerb::{Fire,Pause}`) rather than Pause getting a second `GmActionKind`. The kind is a ROUTING family — it decides which surface a result is projected onto, and Fire, Pause and Skip all belong to the mission panel — while the verb decides which SENTENCE the mission panel and the activity feed say. Collapsing the two questions forces a choice between a feed that cannot say `paused` and a panel subscribed to a growing list of kinds; `requested_active` cannot stand in either, being a constant `true` for a Fire and a real absolute state for a Pause, so an `active: true` Pause and a Fire are indistinguishable through it. Before this, `gm_activity`'s fold matched on the kind alone and would have published every Pause and Resume as `fired {event}`. `validate_fleet_frame` now refuses an event-control refusal without a verb on the same rule it already refuses one without a target: republished verbless, it could only appear as a refused Fire on every other GM's feed. The browser parse is strict about the verb where it is lenient about the target, and the asymmetry is deliberate — a target is a name INSIDE a sentence, a verb decides WHICH sentence, and there is no honest neutral wording for `a GM did something to this event`."
        - "[ai] The absolute set-state shape is `SetSessionPaused`'s, not a toggle: `SetEventPaused { event, active }` carries what the operator wants to be true, so two GMs pressing at one apply boundary commit the same answer on every peer whatever the arrival order, and a request for the state the event is already in reduces to a deterministic No-op. The mission panel renders ONE button reading Pause or Resume from the projection rather than two, because there is one lever with two positions; its requested state is read from the authoritative row rather than the button, so a stale row can only ask for something the server then No-ops. Pending presses are tracked per LEVER, not per event: a Fire waiting on its answer is no reason to refuse a Pause of the same event, which is the `hold this back, then run it when I say` gesture the whole pairing is for."
        - "[ai] Issue #1304 (Skip-next) implemented 2026-09-06 as a THIRD lever on the same control set, not a second action family: `.skip()` is a sibling TriggerHandle modifier after `.gm_controls(id, label)`, and its typed action ArmGmEventSkip shares GmActionKind::EventControl with FireGmEvent so both levers reach the ONE mission-panel result feed the contract describes. WHICH lever a durable result reports rides the result itself as LoggedGmAction::lever (GmEventLever), absent for a Fire — the shape every pre-#1304 fact already has on the wire, so no world that only ever fired moved its digest. GmActionRefusal carries the same field for LoggedGmAction::target's reason, on both refusal lanes, and validate_fleet_frame refuses a lever outside the event family: reporting a refused Skip as a refused Fire would be the opposite sentence about the same button."
        - "[ai] Consuming a Skip is exactly DROPPING THE FIRED RECORD BEFORE DISPATCH. `evaluate_single_trigger` has already advanced the ordinary lifecycle by the time the interception runs — the once/repeat latch is set and last_fired_elapsed is stamped — so a skipped once-only event is spent and a skipped repeating one enters its ordinary cooldown with no second lifecycle path that could drift from the automatic one. It also means a skipped occurrence reaches NO history seam: no BalanceEvent::TriggerFired, because in the fiction nothing happened, and what a GM did is recorded on the GM's own feed instead."
        - "[ai] The interception sits inside the AUTOMATIC per-trigger loop and runs in EVERY chaining pass, unlike the manual Fire pass which is pass-1-only: a Fire is one authored occurrence a GM caused, while a Skip must stand in front of whichever pass actually produces the occurrence. Only an occurrence that would genuinely have fired consumes an arm — a false `when` or an unelapsed cooldown returns None before the interception — so a suppressed moment does not spend a Skip, exactly as it does not consume a Fire."
        - "[ai] The two arms are two BTreeSets (pending_gm_event_fires, pending_gm_event_skips) read and consumed independently, which is what makes 'Fire does not consume an armed Skip' true by construction rather than by a rule someone has to remember: the manual pass touches only the Fire set and the automatic loop only the Skip set. Both are folded under their OWN digest label and captured in their own snapshot field, so two peers that arm the same event on different levers disagree in the digest — they are about to run opposite futures for one event, not to hold one fact. Both are cleared at the run boundary, and the Skip more urgently: it is waiting on the world, so one that outlived the run would swallow the next mission's first occurrence with nobody attributed for the silence. SNAPSHOT_FORMAT 25."
        - "[ai] `.skip()` is refused at load in two shapes rather than shipped inert: with no preceding `.gm_controls(…)` (a lever with no event identity to belong to — the one ordering constraint among the trigger modifiers) and on a TriggerCondition::Manual `gm_event` (which has no automatic occurrence, so the lever could never be consumed). The condition rule lives in GmEventControls::validate_skip_condition, shared by the host fn and validate_gm_events so the two cannot drift — validate_authored's arrangement, for its reason."
        - "[ai] 'An armed skip survives Pause' is now testable on both halves: #1303's per-event Pause landed first on this batch, and the per-event Pause/Resume cycle leaves an armed Skip untouched (no evaluation runs while paused, so nothing can consume the arm), exactly as the session Pause does through apply_due_actions. The durable half survives capture/restore and replays to the same arm."

entities:
  - component: physical-marking-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Finite Physical Marking Runtime
      summary: "The existing guided lifecycle consumes an actual supported endpoint hull contact into ordinary finite sensor/radio equipment. One physical projection owner follows the attached parent, and the same actual removal transaction detaches at the last pose. Exact mechanical-pair exclusion grants no third-body or weapon immunity. The late report pass pays one normal discrete emission for a fresh original limited sample independently of receiver presence, then uses current paid Radio routes to willing same-faction SensorRadar owners. Source implementation and independent review precede native acceptance; this is not a playable-exit claim."
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [marking-attachment]
      reads: [marking-accepted-equipment, current-paid-radio-work]
      writes: [marking-attachment]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console/weapons/marking.rs, crates/phoenix-simulation/src/console/weapons/torpedo.rs, crates/phoenix-sim-gameplay/src/ship/physics_systems.rs, crates/phoenix-simulation/src/entities/craft.rs, crates/phoenix-simulation/src/server_app/collision.rs, crates/phoenix-simulation/src/science/broad.rs, crates/phoenix-simulation/src/console/weapons/marking_reports.rs, crates/phoenix-simulation/src/snapshot/marking.rs, crates/phoenix-simulation/src/snapshot/application.rs]
      symbols: [MarkingRuntime, MarkingContacts, MarkingPhysicsHooks, MechanicalPairs, project_marking_attachments, detach_marking_subject, validate_report_frontier]
      tests: [crates/phoenix-sim-gameplay/src/ship/marking_projection_tests.rs, crates/phoenix-simulation/src/console/weapons/marking_tests.rs, crates/phoenix-simulation/src/console/weapons/marking_report_tests.rs, crates/phoenix-simulation/src/snapshot/marking_tests.rs]
  - state: marking-attachment
    core:
      status: implemented
      confidence: confirmed
      title: Canonical Consumed Marker Relation and Emission Frontier
      summary: "Exactly ShipMarkingAttachment: consumed original round and source, frozen recipe/launch faction, contact tick, Attached subject/local offset or Detached tick, and last successful original report sample/ticks. Rust StateClass::Folded; all fields participate in the optional Some-only marking-attachment digest stage, capture and both guarded restore doors. Attached ShipPhysics is a checked parent projection, not a second pose intent. Carry-capable subjects are excluded in this first slice."
    architecture:
      classification: authoritative
      owner: physical-marking-runtime
      writers: [physical-marking-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-sim-gameplay/src/weapons/marking.rs, crates/phoenix-model/src/marking.rs, crates/phoenix-simulation/src/console/weapons/marking.rs, crates/phoenix-simulation/src/console/weapons/marking_reports.rs, crates/phoenix-sim-gameplay/src/ship/physics_systems.rs, crates/phoenix-simulation/src/snapshot/schema.rs, crates/phoenix-simulation/src/snapshot/capture.rs, crates/phoenix-simulation/src/snapshot/marking.rs, crates/phoenix-simulation/src/snapshot/application.rs, crates/phoenix-simulation/src/sim_digest.rs]
      symbols: [ShipMarkingAttachment, MarkingAttachment, MarkingLocation, MarkingReportFrontier]

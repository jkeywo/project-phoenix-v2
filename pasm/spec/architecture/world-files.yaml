  - component: tractor-beam-coupler
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Tractor Beam Coupler
      summary: Runs the engineering-owned tractor beam - the linchpin of PRD #1143's coupling family. Takes the engage/release commands, decides each tick whether the coupling holds from the ship's Tactical lock, the separation to the locked target, the tractor power group's level and the tractor system's damage tier, holds the coupled derelict on the operator's rig from the authored offset, and publishes the beam's blackboard. The umbilical, dock and external repair-dispatch slices copy this shape.
      rationale:
        - "[ai] A NEW SYSTEM BESIDE THE TOW, NOT A CHANGE TO IT. The operations tow (external-operation-runner) stays live and untouched; the tractor lifts and GENERALISES the tow's rig geometry into a pure Bevy-free module both could call, and shares nothing else. The tractor is a first-class engineering `[[system]]` where an operation is not a system at all: it declares its own power group, carries a damage entry, is admission-gated, registers as an admitted consumer and publishes under its own system id."
        - "[ai] THE COUPLING-POSITION MODULE TAKES TRANSFORMS AND THE AUTHORED OFFSET ONLY. Given the operator's translation, its rotation and the coupling offset in the operator's OWN frame, it answers where the held target sits - the offset is rotated by the operator's rotation, so a tug that turns swings its load round with it. Mass is deliberately NOT in this signature: a heavier tow is a helm-penalty concern that reads the #1154 entity mass in a later slice (#1157), never the geometry of where the load rides."
        - "[ai] THE HOLD VERDICT IS PURE. The adapter reads the live world into scalars - the lock, the separation, the range, the power level and its minimum, the disabled flag - and the pure `hold_status` answers Ok or the one refusal the console shows. Checks run most-actionable-first: a knocked-out or unpowered beam is reported before target acquisition, and there is no range to a target that was never locked, so NoLock precedes OutOfRange. The same function decides engage-time refusal and every tick's re-evaluation, so an engage that cannot hold is refused within its own tick and each interruption drops the hold the same way."
        - "[ai] EACH INTERRUPTION ENDS THE HOLD. Releasing, losing the lock, drifting past the authored range, dropping below the authored min_power_level, or damaging the tractor to Disabled all clear the engage intent and the coupled target together, and the crew watch the hulk stop following them. Engage is the operator's standing INTENT; the coupled target is what is actually held this tick, present only while the hold is eligible, so the two agree by construction."
        - "[ai] HUMAN AND AI ISSUE THE SAME COMMANDS. EngageTractor and ReleaseTractor target the real, station-owned tractor system, so they take the ordinary station-tenure admission path - the engineering holder from the network gate, the tractor AI (#1162) through the same validate_and_admit seam - and admission strips source identity before the handler sees it. Nothing downstream asks who sent them. This slice makes the commands admissible from the engineering console; the AI policy host that drives them is #1162."
        - "[ai] THE RIG WRITES THE TARGET'S POSITION DIRECTLY, a sixth row in the ShipPhysics writer-policy table and the exact shape of the tow rig: a correction layered on top of the helm integration in SimSet::Modifiers, after sync_ship_position, not a second integrator. It writes ShipPhysics where the target has one (a demoted craft) and the Transform too so the two agree within the tick; a derelict with no ShipPhysics is moved by the transform write alone. The three speed fields are zeroed for the tow's reason turned around - a craft released from the rig must not shoot off at a velocity its helm accumulated against a position it was never allowed to reach. Operators are walked in UUID order so two hosts place the load identically."
        - "[ai] EVERYTHING IS AUTHORED (rule 11). The range, the coupling offset and the minimum power level are the hull's `[tractor]` table; the power group, station and damage entry are the tractor `[[system]]` block, validated as a pair at load. A hull that authors neither carries no TractorBeam component and is unchanged in every way, which is why the demo destroyer is untouched by this slice and the probe fields a dedicated tug."
        - "[ai] THE TARGET DECIDES WHAT BEING HELD MEANS (#1158). One tractor serves several verbs because the consequence is authored on the TARGET, in its own `[held_response]` table, and the coupler never branches on which it is: it feeds the offset the held target declares (held_offset - a formation-kept target rides its OWN authored slot, distinct from station-keeping it on the operator's rig) to the same generic coupled_position, and queues the condition the held target declares (condition_delta - an arrest-decline target's decline is arrested and it recovers at an authored rate) onto that target's own infrastructure condition track. arrest_held_declines runs before tick_infrastructure_condition so the adjustment lands the same tick it arrests, and stops queuing the moment the beam lets go, so the ordinary decline resumes on the next tick. A target that authors nothing is merely held in place - the station-keep default - so every derelict and structure before this slice is unchanged."

[base]
offset = [ 0, -1.0997405989377627, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 2.10425860738178, 2.10425860738178, 2.10425860738178 ]

[extents]
min = [ -2, -1.1035441779734987, -1.2102568399125948 ]
max = [ 1.9981764664713906, 1.0997405989377627, 1.2120329633253908 ]
size = [ 3.9981764664713904, 2.2032847769112616, 2.4222898032379856 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_uncommon_2
# Same bands and ratios as the four common asteroids, so every rock in a
# field switches level at the same distance. No `remesh_voxel_size` here:
# the import already brought this mesh down to the commons' density with a
# UV-preserving Blender collapse (scripts/blender-decimate.py), which is
# what the voxel pre-pass was standing in for on the stubborn commons.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_uncommon_2.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_uncommon_2_lod1.glb"

[lod.generate]
source = "assets/models/asteroid_uncommon_2.glb"
ratio = 0.35
error = 0.01
texture_size = 512

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_uncommon_2_lod2.glb"

[lod.generate]
source = "assets/models/asteroid_uncommon_2.glb"
ratio = 0.05
error = 0.01
texture_size = 256

[[lod]]
billboard = "assets/models/asteroid_uncommon_2_lod3.png"
scale = [ 3.9798, 2.1803, 1.0 ]

[lod.capture]
source = "assets/models/asteroid_uncommon_2.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

        // consoles an INBOUND host message dirtied, which is exactly the
        // causality `send_to_ack` claims.
        if (alwaysPush.has(name) || activeConsole === name) {
          pushConsoleStateFor(name, pushCause().SERVER_MESSAGE);
        }
      }
    }

    // Attach on-load listener for an iframe that was created dynamically by
    // mountConsoles(). Each iframe re-pushes its console state on load so it
    // receives the current snapshot even after a reload or late mount.
    // consoleName must be the lowercase station id.
    function _attachIframeLoadListener(iframeEl, consoleName) {
      if (!iframeEl) return;
      iframeEl.addEventListener('load', () => {
        // Push the freshly-loaded iframe its current snapshot. Generic so it
        // covers every station id the ship mounts (including engineering /
        // science aggregates the old per-name switch never handled).
        // NOT an acknowledgement (issue #1169): a reloaded iframe is handed a
        // snapshot that may be seconds old and owes nothing to the host having
        // answered anything.
        pushConsoleStateFor(consoleName, pushCause().IFRAME_LOAD);
        // A reloaded document has every panel closed and re-posts its
        // `console_tabs` from `initConsole`, so the shell drops the selection
        // it was holding for this console rather than showing a tab as
        // selected over a panel that is no longer open (issue #1373).
        if (openConsoleOverlay.console === consoleName) setConsoleOverlay(null, null);
        // Re-apply the private Accessibility profile to this same-origin console
        // now that its document has (re)loaded — a reload otherwise resets the
        // iframe :root, losing the text-scale var until the next apply (#1102).
        if (typeof window.applyAccessibilityProfile === 'function') {
          window.applyAccessibilityProfile({ iframes: [iframeEl] });
        }
        pushSemanticBindingsToIframe(iframeEl);
      });
    }

    function renderGame(s) {
      // Refresh whichever console is currently visible. This is ship-agnostic:
      // it covers the aggregate cruiser/destroyer consoles (engineering,
      // science, …) as well as the standalone ones — all resolve to their
      // iframe via the registry.
      // NOT an acknowledgement (issue #1169): a render fires on rotation,
      // resize and tab switches, none of which mean the host answered.
      pushActiveConsoleState(pushCause().RENDER);
    }

    function placeShellChrome() {
      // `document.getElementById` rather than the `$` shorthand: the first call
      // arrives from setConnectionStatus() -> applyPrePlaySurfaces() while this
      // script is still evaluating, which is before `$` itself is defined.
      const bar = document.getElementById('station-hero');
      const tabsEl = document.getElementById('station-hero-tabs');
      const help = document.getElementById('help-btn');
      const slot = (typeof window.heroChromeSlot === 'function')
        ? window.heroChromeSlot({ heroVisible: heroBarVisible, prePlaySurface, gameOverVisible })
        : 'body';
      const inBar = slot === 'bar' && !!bar;
      // The cog is the overlay shell's node, so the shell moves it — the page
      // never reaches for #settings-btn itself.
      if (settingsPanel && typeof settingsPanel.setButtonContainer === 'function') {
        settingsPanel.setButtonContainer(inBar ? bar : null, inBar ? tabsEl : null);
      }
      if (help) {
        const host = inBar ? bar : document.body;
        // Last item in the bar, so the tabs keep the middle; ordinary body
        // child otherwise. Skipped when it is already there — re-parenting a
        // node blurs it, and this runs on every render.
        if (help.parentNode !== host) host.appendChild(help);
        else if (inBar && help.nextSibling) host.appendChild(help);
      }
    }

    // Rotating the phone, or dragging a desktop window across the threshold,
    // changes how much room the bar has and therefore whether its tabs read as
    // short codes or full names. Watched through the media query itself rather
    // than a `resize` listener: it fires once per crossing instead of once per
    // pixel, and it is the very query the stylesheet resizes the bar with.
    (function watchBarWidth() {
      // Deferred to DOMContentLoaded: this classic script runs BEFORE the
      // `type="module"` gui/ island that publishes the query, and the query
      // string lives there so the stylesheet and the label decision cannot
      // drift apart. Module scripts have all executed by the time this fires.
      const install = () => {
        const query = (typeof window.matchMedia === 'function' && window.HERO_BAR_CODE_QUERY)
          ? window.matchMedia(window.HERO_BAR_CODE_QUERY) : null;
        if (!query) return;
        const onChange = () => scheduleRender();
        if (typeof query.addEventListener === 'function') query.addEventListener('change', onChange);
        else if (typeof query.addListener === 'function') query.addListener(onChange);
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', install, { once: true });
      } else install();
    })();

    function renderStationHero(s, inGame) {
      const root = $('station-hero');
      const tabsEl = $('station-hero-tabs');
      if (!root || !tabsEl || typeof window.heroBarModel !== 'function'
          || typeof window.renderHeroBarDom !== 'function') return;
      const model = window.heroBarModel({
        directStation: playerStation(s),
        stations: (s.shipStations && s.shipStations.stations) || [],
        stationSystems: window.simState && window.simState.stationSystems,
        blackboards: window.simState && window.simState.blackboards,
        stationHosts: window.simState && window.simState.stationHosts,
        stationHealth: window.simState && window.simState.stationHealth,
        stationImportance: window.simState && window.simState.stationImportance,
        stationRatings: window.simState && window.simState.stationRatings,
        activeStation: activeConsole,
        // The active console's own overlay panels (issue #1373). The console
        // posted string IDS for the two labels — the same convention the wire
        // uses for a Station's name — so they are resolved here, at the render
        // site, exactly where `stationLabel` resolves the Station names beside
        // them. `wireText` substitutes only what the table actually holds, so a
        // console that authored literal text still shows it.
        consoleTabs: (consoleTabsByConsole[activeConsole] || []).map(tab => ({
          id: tab.id,
          code: wireText(tab.code, tab.code || ''),
          name: wireText(tab.name, tab.name || tab.id),
          badge: tab.badge,
        })),
        activeOverlay: activeConsoleOverlay(),
      });
      const heroVisible = !!(inGame && model.tabs.length);
      heroBarVisible = heroVisible;
      root.setAttribute('aria-hidden', heroVisible ? 'false' : 'true');
      root.parentElement?.classList.toggle('station-hero-visible', heroVisible);
      if (!inGame || !model.tabs.length) return;
      window.renderHeroBarDom({
        tabsEl,
        titleEl: $('station-hero-title'),
        ratingEl: $('station-hero-rating'),
        aiEl: $('station-hero-ai'),
        model,
        translate: t,
        // Short codes on a phone-sized bar, full names anywhere with room
        // (issue #1372). Read from the viewport through the same media query
        // the stylesheet narrows the bar with, so the label and the width it
        // has to fit into are always the same decision. One label per tab, not
        // two hidden twins — see gui/hero-bar.js.
        labelMode: (typeof window.heroBarLabelMode === 'function')
          ? window.heroBarLabelMode(window) : 'name',
        onActivate: (tabId, kind) => {
          // An overlay tab opens its panel inside the console that declared it
          // and changes nothing else — same seat, same iframe, a surface in
          // front of it (issue #1373).
          if (kind === 'overlay') {
            setConsoleOverlay(activeConsole, tabId);
            scheduleRender();
            return;
          }
          // Tapping the tab that is ALREADY SELECTED opens that Station's
          // per-system damage popup (issue #1374) — the surface the console
          // footers' `ph-station-damage` bar used to be. "Already selected" is
          // this seat's own tab with no overlay covering it: while an overlay
          // IS open the bar's selection is the overlay, so the same tap means
          // "come back to the console" and keeps doing that.
          if (tabId === activeConsole && activeConsoleOverlay() === null) {
            // The visit is still reported on this path. `unread` is edge-
            // triggered host-side (src/station_importance.rs) whenever an
            // objective attributed to a Station reaches a terminal status —
            // including the Station this seat is already sitting at — and the
            // bar draws that cue on every tab. Tapping your own tab was the
            // gesture that cleared it before the popup existed, so it has to
            // stay that as well, or the badge sticks until you leave the
            // Station and come back.
            send('StationVisited', { station: tabId });
            showStationDamagePopup();
            scheduleRender();
            return;
          }
          // A Station tab closes whatever overlay is open, which is what
          // "selecting a station tab closes it" means even when the Station
          // selected is the one already active.
          setConsoleOverlay(null, null);
          setActiveConsole(tabId);
          // Tell the host this Station's tab was visited (issue #1101), so it
          // clears the one-off `unread` importance flag authoritatively through
          // the next SimState — NOT an optimistic local clear. In-game only:
          // renderStationHero returns early outside a live game, so onActivate
          // never fires in the lobby. A continuing `critical` condition is
          // immune host-side, so this cannot lower an alert.
          send('StationVisited', { station: tabId });
          scheduleRender();
        },
      });
    }

    // -- Station damage popup (issue #1374) ------------------------------------
    //
    // The shell half of the surface the console footers used to carry. The
    // popup itself — what it says, the focus contract around it, the scrim and
    // close wiring — is gui/station-damage-popup.js; what stays here is only
    // what the shell knows: which Station is selected and the rows that
    // Station's console last posted.

    /// The popup's input for whichever Station is selected right now.
    function stationDamagePopupState() {
      const station = ((uiState.shipStations && uiState.shipStations.stations) || [])
        .find(st => st && st.id === activeConsole) || null;
      return {
        station: stationLabel(station) || activeConsole || '',
        // A console posts these only when they CHANGE (gui/console-core.js), so
        // an absent entry means "this console has not published a hull yet" —
        // which the popup shows as the neutral no-damage-model state.
        entries: consoleHullByConsole[activeConsole] || [],
      };
    }

    function showStationDamagePopup() {
      if (typeof window.openStationDamagePopup !== 'function') return;
      window.openStationDamagePopup(document, stationDamagePopupState());
    }

    function dismissStationDamagePopup() {
      if (typeof window.closeStationDamagePopup !== 'function') return;
      window.closeStationDamagePopup(document);
    }

    // -- Coordination popup (issue #494) ---------------------------------------
    let coordinationPopupTimer = null;
    function showCoordinationPopup(presentation, sender_label, target_label) {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      // Producers own the words; this shared renderer knows only the generic
      // route and the phone's route/title/body layout (issue #1255).
      if (typeof window.renderCoordinationPopup !== 'function') return;
      if (!window.renderCoordinationPopup(
        document, presentation, sender_label, target_label,
      )) return;
      el.style.display = 'block';
      if (coordinationPopupTimer) clearTimeout(coordinationPopupTimer);
      coordinationPopupTimer = setTimeout(dismissCoordinationPopup, 8000);
    }
    function dismissCoordinationPopup() {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      el.style.display = 'none';
      if (coordinationPopupTimer) {
        clearTimeout(coordinationPopupTimer);
        coordinationPopupTimer = null;
      }
    }

    // -- Dynamic console mounting (Module H / issues #621, #827) ---------------
    // Called after a Welcome message updates uiState.shipStations.
    // gui/mount-plan.js decides WHAT to mount (station id → section/iframe
    // ids + URL, tactical alias included); this loop only creates the DOM.
    // Stations not present on this ship have no DOM elements, keeping the DOM
    // minimal and matching only what the current ship configuration provides.
    function mountConsoles(shipStations) {
      const container = $('console-container');
      if (!container) return;
      // The mount seam lives in gui/console-mount.js (issues #827, #1099): it
      // owns node creation (via gui/mount-plan.js planMounts) so the iframe
      // nodes it creates are the persistent ones a tab switch must preserve.
      // We attach the per-iframe load listener here so the iframe re-pushes
      // state after load/reload.
      if (typeof window.mountConsolesDom === 'function') {
        window.mountConsolesDom(document, container, shipStations,
          (iframe, mount) => _attachIframeLoadListener(iframe, mount.stationId));
      }
    }

    /// Which STATION a console message came from (issue #1374). Resolved from
    /// the sending frame via gui/console-mount.js, never from the name the
    /// document gave itself: one console document can be mounted at two
    /// Stations (`gui/cruiser/comms.html` serves the cruiser's `comms` and
    /// `navigation` seats and both call themselves 'comms'), so the claim is
    /// not a key. The shell mounted each iframe against a Station id, so it
    /// knows; the claim is kept only as the fallback for the paths with no
    /// iframe behind them.
    function senderStationId(event) {
      const claimed = (event.data && typeof event.data.console === 'string')
        ? event.data.console : '';
      if (typeof window.consoleStationIdForSource !== 'function') return claimed;
      return window.consoleStationIdForSource(
        document, uiState.shipStations, event.source, claimed);
    }

    // -- Console action postMessage bridge (issue #422) ------------------------
    // All iframe consoles send {type:'console_action', payload:json} via
    // postMessage.  Dispatch is table-driven via gui/action-map.js (issue #455).
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      // A console declaring its overlay panels, and the own-Station system
      // rows behind the bar's damage popup (issue #1373). Both are keyed by
      // the STATION the shell mounted the sending frame at — every mounted
      // iframe posts its own, so storing them in one slot would let a
      // background console's declaration win the bar.
      if (event.data.type === 'console_tabs') {
        const name = senderStationId(event);
        if (name === '') return;
        consoleTabsByConsole[name] = Array.isArray(event.data.tabs) ? event.data.tabs : [];
        // The console's own document is the truth about which of its panels is
        // covering it, so its declaration settles the selection this shell only
        // set optimistically on the tap — and reports a panel closed from
        // inside (the panel's Back button) rather than leaving a tab lit over
        // nothing. A console reporting no open panel clears only ITS OWN
        // selection; it says nothing about another console's.
        const open = event.data.open || null;
        if (open) openConsoleOverlay = { console: name, id: open };
        else if (openConsoleOverlay.console === name) {
          openConsoleOverlay = { console: null, id: null };
        }
        if (name === activeConsole) scheduleRender();
        return;
      }
      if (event.data.type === 'console_hull') {
        const name = senderStationId(event);
        if (name === '') return;
        consoleHullByConsole[name] = Array.isArray(event.data.entries) ? event.data.entries : [];
        // A console only re-posts when its rows CHANGE, and a change while the
        // popup is open is exactly the moment a player is watching for — a
        // system dropping under fire. Repaint in place rather than making them
        // close and reopen it (issue #1374).
        const popup = document.getElementById('station-damage-popup');
        if (name === activeConsole && popup && !popup.hidden
            && typeof window.renderStationDamagePopup === 'function') {
          window.renderStationDamagePopup(document, stationDamagePopupState());
        }
        return;
      }
      if (event.data.type !== 'console_action') return;
      let action;
      try { action = JSON.parse(event.data.payload); } catch (_) { return; }
      if (!action || !action.action) return;
      // Contextual tutorial progress (issue #916): every console action feeds
      // the client-local progress store — using a control completes its
      // `control_unused` overlays — and `tutorial_dismiss` is handled
      // entirely client-side (presentation state, never forwarded to the
      // host). On change, re-push the acting console so the overlay advances
      // immediately rather than waiting for the next server message.
      if (window.simState && typeof window.applyTutorialAction === 'function') {
        let tutStorage = null;
        try { tutStorage = window.localStorage; } catch (_) { /* privacy mode */ }
        const tut = window.applyTutorialAction(window.simState, action, tutStorage);
        // NOT an acknowledgement (issue #1169): tutorial progress is entirely
        // client-local and never leaves the device.
        if (tut.changed) pushConsoleStateFor(action.console || activeConsole, pushCause().TUTORIAL);
        if (tut.handled) return;
      }
      if (typeof window.dispatchConsoleAction === 'function') {
        // Console-latency dispatch stamp (issue #1169), taken immediately before
        // the envelope reaches the transport so `input_to_send` covers exactly
        // the client-local hop — the console's postMessage plus the action-map
        // lookup — and nothing else. `action.__input_ms` is the console
        // document's own stamp and stops here; the action map builds its
        // outbound `ClientMessage` from named fields, so it never crosses the
        // wire.
        const meter = latencyMeter();
        const feedback = actionFeedbackRouter();
        const correlated = feedback && feedback.track({
          correlation: action.correlation,
          actionId: action.semantic_action,
          console: action.console || activeConsole,
          inputMs: action.__input_ms,
        });
        if (meter) {
          if (correlated) {
            meter.noteCorrelatedDispatch(action.correlation, action.action, action.__input_ms);
          } else {
            meter.noteDispatch(action.action, action.console || activeConsole, action.__input_ms);
          }
        }
        // Target selection is authoritative: neither Tactical nor Sensors
        // paints optimistic gameplay state before the host projects it back.
        window.dispatchConsoleAction(action, send, (patch) => {
          if (window.simState) Object.assign(window.simState, patch);
        });
        return;
      }
      // Fallback for the rare race window before module scripts load.
      // Semantic actions deliberately have no direct-wire fallback: bypassing
      // action-map would discard their correlation and feedback lifecycle.
      // Console iframes mount after DOMContentLoaded, when deferred modules are
      // ready; a synthetic pre-module semantic message is therefore ignored.
      // These two older Navigation actions remain until their own migration.
      if (action.action === 'set_navigation_waypoint'
          && Number.isFinite(action.x)
          && Number.isFinite(action.z)) {
        const correlation = typeof action.correlation === 'string' && action.correlation;
        send(correlation ? 'ControlSystemCorrelated' : 'ControlSystem', {
          ...(correlation ? { correlation: action.correlation } : {}),
          target: 'navigation',
          payload: { type: 'SetNavigationWaypoint', data: { x: action.x, z: action.z } },
        });
      } else if (action.action === 'clear_navigation_waypoint') {
        const correlation = typeof action.correlation === 'string' && action.correlation;
        send(correlation ? 'ControlSystemCorrelated' : 'ControlSystem', {
          ...(correlation ? { correlation: action.correlation } : {}),
          target: 'navigation',
          payload: { type: 'ClearNavigationWaypoint' },
        });
      }
    });

    // -- Event wiring --------------------------------------------

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        sessionStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    // Engage button, view selector, Red Alert button, and helm joystick all
    // live in the per-console iframe pages (gui/*-console.html); the old
    // Bevy WASM client console UIs (#47–#49) were retired with the pure-JS
    // client migration.

    // Nothing watches orientation any more (issue #1370). The page used to
    // recompute a singleton on resize/orientationchange and re-render so
    // "console CSS re-flows" — but CSS re-flows on its own, and the attribute
    // that repaint existed to update had no rule reading it.

    // -- Incoming message handler --------------------------------

    function handleMessage(msg) {
      // The host has said something, so the console's panels are showing real
      // numbers rather than their empty shape — it may leave CONNECTING (PRD
      // #1023 user story 15). Any message counts: the point is that the link
      // is carrying traffic, not which traffic.
      if (msg && !linkHasData) { linkHasData = true; scheduleRender(); }
      // Targeted authoritative feedback settles only the exact originating
      // correlation.  It is presentation/measurement, not simulation state,
      // so it bypasses the reducers and never mutates Red Alert optimistically.
      if (msg && msg.type === 'ActionFeedback') {
        const router = actionFeedbackRouter();
        if (router && msg.data) router.resolve(msg.data);
        maybeReportConsoleLatency();
        return;
      }
      // JS state modules (issue #460) — every inbound ServerMessage is applied
      // to the pure state modules first. window.simState is the ONLY sim
      // store (issue #819): the console builders read it directly. Guards
      // cover the brief window before the module scripts have executed.
      const reducerResults = [];
      if (window.lobbyState) reducerResults.push(window.lobbyState.apply(msg));
      if (window.simState) reducerResults.push(window.simState.apply(msg));
      if (window.commsState) reducerResults.push(window.commsState.apply(msg));
      const changes = typeof window.mergeReducerResults === 'function'
        ? window.mergeReducerResults(...reducerResults)
        : reducerResults.find(Boolean);
      // Semantic iframe fan-out (#1260): gui/dirty-consoles.js maps the merged
      // reducer result to console names without receiving the wire message.
      // Runs after state applies so every push carries fresh data. On Welcome
      // the consoles are
      // (re)mounted AFTER this fan-out — that is fine: each iframe's load
      // listener re-pushes its snapshot once it actually loads.
      pushDirtyConsoles(changes);
      // Reducer-result routing (#1261) happens only after dirty iframe
      // publication. The router receives no wire message: reducers already own
      // its meaning and report ordered lifecycle/presentation effects. Boot
      // race: modules run before DOMContentLoaded and the connection waits for
      // it, so the router is present for every real message.
      if (typeof window.routeReducerResult !== 'function') return;
      const result = window.routeReducerResult(changes, {
        uiState,
        myToken,
        pendingMidGameClaim,
        bezelAlertOn,
        lobbyState: window.lobbyState || null,
      });
      pendingMidGameClaim = result.pendingMidGameClaim;
      bezelAlertOn = result.bezelAlertOn;
      if (result.myName !== undefined) myName = result.myName;
      for (const fx of result.sideEffects) applySideEffect(fx);
      // Console input-to-feedback latency (issue #1169), on the same "report a
      // locally-derived minimum" footing as the eligibility effect: only
      // durations this device measured for itself leave the phone, batched.
      // Driven off inbound traffic rather than a timer so a disconnected phone
      // stops reporting by itself.
      maybeReportConsoleLatency();
    }

    // Presentation effects named by the reducers and admitted by the pure
    // router. This is execution only: no ServerMessage variant is interpreted
    // in the HTML shell.
    function applySideEffect(fx) {
      switch (fx.effect) {
        case 'mount-consoles':
          mountConsoles(fx.shipStations);
          break;
        case 'ship-theme': {
          // Inject ship theme CSS from Welcome ship_css (Fix: Module F).
          let linkEl = document.getElementById('ship-theme-css');
          if (!linkEl) {
            linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.id = 'ship-theme-css';
            document.head.appendChild(linkEl);
          }
          linkEl.href = fx.href;
          break;
        }
        case 'ship-info': {
          const nameEl2 = document.getElementById('ship-name');
          const missionEl = document.getElementById('ship-mission');
          if (nameEl2) nameEl2.textContent = fx.title;
          if (missionEl) missionEl.textContent = fx.description;
          break;
        }
        case 'status':
          setStatus(t(fx.id));
          break;
        // The two preload effects record the fraction and let the one pre-play
        // decision raise or drop the overlay (issue #1359) — this is the only
        // input of the three that carries a measurable quantity, and the only
        // surface allowed to put a number on the screen.
        case 'hide-loading':
          preloadFraction = null;
          applyPrePlaySurfaces();
          break;
        case 'show-loading':
          preloadFraction = fx.pct / 100;
          applyPrePlaySurfaces();
          break;
        case 'bezel-alert':
          applyBezelAlert(fx.on);
          break;
        case 'vibrate':
          if (navigator.vibrate) navigator.vibrate(fx.duration);
          break;
        case 'coordination-popup':
          showCoordinationPopup(fx.presentation, fx.senderLabel, fx.targetLabel);
          break;
        case 'settle-scenario-pick':
          settleScenarioPick();
          break;
        case 'refresh-settings':
          // Authoritative debug/session read-back only repaints an OPEN panel;
          // the normal render loop deliberately leaves its controls alone.
          if (settingsPanel) settingsPanel.rebuildContent();
          break;
        case 'rebuild-stations':
          rebuildStations();
          break;
        case 'report-eligibility':
          // Re-derive and report anonymous eligibility AFTER the authoritative
          // roster/projection/ratings fold (issue #1103). Only the ineligible
          // station-id set — no reason, no setting — goes back to the host.
          computeAndSendEligibility();
          break;
        case 'request-render':
          scheduleRender();
          break;
        default:
          break;
      }
    }

    // -- Connection (Phoenix transport: gui/rendezvous-transport.js, #1111/#1112;
    //                ICE + timing policy: gui/connection-manager.js, #603/#1226) --

    (async () => {
      // Gate on DOMContentLoaded before touching any module-dependent state.
      // See the comment above the original gate for the full rationale.
      if (document.readyState === 'loading') {
        await new Promise(resolve =>
          document.addEventListener('DOMContentLoaded', resolve, { once: true }));
      }

      // Which route this page load is on is one pure decision (tested in
      // tests/client/rendezvous-transport.test.js), not two ifs here:
      //   'rendezvous'  something in the fragment — a QR link, a pasted full
      //                 code, or a stale bookmark: join with it straight away
      //   'entry'       nothing in the fragment: ask for the code
      // There is no third route since #1112 retired PeerJS, and no route flag:
      // a fragment that is not a valid code still comes here and gets a stated
      // reason in front of the entry field, because gui/join-code.js is the one
      // place that decides what a typed string is.
      // Asked here rather than at script scope: every gui/ module is deferred,
      // so window.rendezvousTransport does not exist until this gate clears.
      // The 'none' fallback is for the module genuinely failing to load, which
      // leaves this page with no way to reach any host at all.
      const joinRoute = (window.rendezvousTransport
        ? window.rendezvousTransport.joinRouteFromLocation(location.search, location.hash)
        : { route: 'none' });

      // Which transport path(s) this load may use (issue #1113). Read once,
      // here, and handed to the joiner and the diagnostics readout from the
      // same value, so a pinned link cannot restrict the transport without the
      // readout saying it did. `auto` — the whole ladder — is the default and
      // what an ordinary QR scan gets.
      const transportLevers = window.transportLevers
        ? window.transportLevers.transportLeversFromLocation(location.search)
        : { mode: 'auto', iceTransportPolicy: 'all', useIceServers: true, wsRelay: 'auto', pinned: false };

      if (joinRoute.route === 'none') {
        // Not "no host id in the URL" — there are no host ids any more, and
        // the QR would only reload this same page. The one thing that can help
        // is a fresh load of a page whose modules all arrive.
        console.error('[client] transport module failed to load — cannot join');
        setStatus(t('client.status_transport_unavailable'));
        return;
      }

      // Resolve this tab's session token now that all deferred modules have
      // run. Each tab gets its own token, which is what lets several clients
      // on one desktop connect as distinct players. The inline branch is a
      // last-ditch fallback for the rare case the module genuinely failed to
      // load.
      myToken = (typeof window.installSessionToken === 'function')
        ? window.installSessionToken()
        : (() => {
            let t = sessionStorage.getItem('session-token');
            if (!t) {
              t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                .map(b => b.toString(16).padStart(2, '0')).join('');
              sessionStorage.setItem('session-token', t);
            }
            return t;
          })();
      console.log(`[client] session token ${myToken.slice(0, 8)}`);

      semanticActionRegistry = typeof window.createClientSemanticActionRegistry === 'function'
        ? window.createClientSemanticActionRegistry()
        : null;

      if (window.OperatorProfile && semanticActionRegistry) {
        updateNativeProfileStatus();
        const loadedProfile = window.OperatorProfile.loadOperatorProfile(
          operatorProfileStorage(),
          { registry: semanticActionRegistry },
        );
        // Even a refused stored record supplies a fresh authored-default
        // profile. Applying that result is safe and, critically, never falls
        // back to a stale Accessibility-only record behind a corrupt current
        // key.
        applyPreparedOperatorProfile(loadedProfile);
      }

      gamepadInputRuntime = (!operatorSurfaceCapabilities || operatorSurfaceCapabilities.gamepad)
        && typeof window.createGamepadInputRuntime === 'function'
        ? window.createGamepadInputRuntime({
            requestSelection: (index) => window.PhoenixNativeGamepad?.select(index),
            getContext: () => window.CompositeActionRouting
              ? window.CompositeActionRouting.semanticContextForIframe(
                  activeConsoleIframe(), activeConsole,
                )
              : activeConsole,
            getActions: (context) => {
              const actions = semanticActionRegistry
                ? semanticActionRegistry.list(context)
                : [];
              return window.CompositeActionRouting
                ? window.CompositeActionRouting.semanticActionsForIframe(
                    actions,
                    activeConsoleIframe(),
                    context,
                  )
                : actions;
            },
            isTransportLive: () => !!(activeLink && activeLink.connected),
            activate: (actionId, options) => {
              // A safety neutral belongs to the context that emitted the last
              // nonzero value, even when the operator has already switched
              // tabs. Never redirect it into whichever iframe is active now.
              const context = options && options.context;
              const activeIframe = activeConsoleIframe();
              const iframe = context && window.CompositeActionRouting
                ? window.CompositeActionRouting.iframeForSemanticContext(
                    context,
                    activeIframe,
                    (value) => $(consoleIframeId(value)),
                  )
                : context ? $(consoleIframeId(context)) : activeIframe;
              try {
                const activate = iframe && iframe.contentWindow
                  && iframe.contentWindow.activateSemanticAction;
                return typeof activate === 'function'
                  ? activate(actionId, options)
                  : false;
              } catch (_) { return false; }
            },
            onCapture: (target, binding) => {
              if (settingsPanel && typeof settingsPanel.proposeSemanticBinding === 'function') {
                settingsPanel.proposeSemanticBinding(target.actionId, target.slot, binding);
              } else {
                updateSemanticBinding(target.actionId, target.slot, binding);
              }
            },
            onStateChange: (state) => {
              updateGamepadClientWarning(state);
              refreshGamepadPresentation(state);
              if (settingsPanel
                  && typeof settingsPanel.updateGamepadState === 'function') {
                settingsPanel.updateGamepadState(state);
              }
            },
          })
        : null;
      if (gamepadInputRuntime
          && typeof gamepadInputRuntime.restorePreferred === 'function') {
        gamepadInputRuntime.restoreDevice(operatorProfile?.gamepad?.preferredDevice);
      }

      installConsoleKeyRelay();

      // Mount the settings panel (gear button + overlay) once state is ready.
      // Provide send, a getState closure, and the UI click audio element.
      if (typeof window.mountSettings === 'function') {
        settingsPanel = window.mountSettings({
          send: (type, data) => send(type, data),
          // Station roster from the lobby mirror; the active rating and the
          // host's debug read-back (issue #940) live in the sim store,
          // composed here so the panel sees one object.
          getState: () => ({
            ...uiState,
            stationRatings: window.simState ? window.simState.stationRatings : {},
            debugFlags: window.simState ? window.simState.debugFlags : null,
            // Private Accessibility profile (issue #1102); the tab paints the
            // player's explicit choices from it. Client-local, never on the wire.
            accessibilityProfile: window.simState ? window.simState.accessibilityProfile : null,
          }),
          // The Accessibility tab's write path (issue #1102): update the
          // client-local profile, persist it privately, and re-apply to the
          // shell + every mounted console iframe. Deliberately NOT `send` —
          // no accessibility setting ever becomes a ClientMessage (AC5).
          onAccessibility: (effect, value) => {
            if (typeof window.setAccessibilityPresentation === 'function') {
              window.setAccessibilityPresentation(effect, value);
            }
          },
          getSemanticActions: () => semanticActionRegistry
            ? (typeof window.clientSettingsSemanticActions === 'function'
                ? window.clientSettingsSemanticActions(semanticActionRegistry)
                : semanticActionRegistry.list())
            : [],
          onSemanticBinding: (actionId, slot, binding, options) => {
            return updateSemanticBinding(actionId, slot, binding, options);
          },
          onSemanticResetAction: (actionId) => resetSemanticAction(actionId),
          onSemanticResetAll: () => resetAllSemanticActions(),
          onSemanticTuning: (actionId, tuning) => {
            return updateSemanticTuning(actionId, tuning);
          },
          getOperatorCapabilities: () => operatorSurfaceCapabilities,
          getGamepadState: () => gamepadInputRuntime
            ? gamepadInputRuntime.state()
            : {
                devices: [], selectedIndex: null,
                retainedIndex: preferredGamepadSlot,
                status: operatorSurfaceCapabilities
                  && !operatorSurfaceCapabilities.gamepad ? 'unavailable' : 'none',
                capturing: null,
              },
          onGamepadSelection: (index) => gamepadInputRuntime
            ? (() => {
                const result = gamepadInputRuntime.select(index);
                if (result.status === 'selected' || result.status === 'none') {
                  preferredGamepadSlot = result.status === 'selected' ? result.index : null;
                  operatorProfile.gamepad.preferredDevice = gamepadInputRuntime.state().preferredDevice;
                  persistOperatorProfile();
                }
                return result;
              })()
            : { status: 'unavailable' },
          onSemanticCapture: (actionId, slot, active) => {
            if (!gamepadInputRuntime) return;
            if (active) gamepadInputRuntime.beginCapture(actionId, slot);
            else gamepadInputRuntime.endCapture(actionId, slot);
          },
          getHideTouchControls: () => operatorProfile?.gamepad?.hideTouchControls !== false,
          onHideTouchControls: (hide) => {
            operatorProfile.gamepad.hideTouchControls = hide;
            persistOperatorProfile();
            refreshGamepadPresentation();
          },
          onOperatorProfileExport: () => exportOperatorProfileJson(),
          onOperatorProfileImport: (json) => importOperatorProfileJson(json),
          // Every audio channel this page owns. Master volume scales each
          // element's own authored level rather than replacing it, so adding
          // a channel here needs no other change (issue #940).
          audioEls: [document.getElementById('ui-click')],
          getManual: () => (window.simState ? window.simState.shipManual : null),
          myToken: myToken,
        });
        // The help button is the cog's twin (issue #1372): the same Settings
        // dialog, opened straight onto its Station Help tab, so the phone has
        // one help surface rather than a second that would drift from it.
        // stopPropagation for the same reason the cog does it — both sit over
        // consoles that have their own click handling.
        const helpBtn = document.getElementById('help-btn');
        if (helpBtn) {
          helpBtn.addEventListener('click', (e) => {
            if (e && typeof e.preventDefault === 'function') e.preventDefault();
            if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
            if (settingsPanel && typeof settingsPanel.openTab === 'function') {
              settingsPanel.openTab('station-help');
            }
          });
        }
        // The cog is born in the page body; put both where this frame wants
        // them without waiting for the next state push.
        placeShellChrome();
      }

      if (gamepadInputRuntime) {
        disposeGamepadInput = gamepadInputRuntime.start(window) || null;
        window.addEventListener('pagehide', () => {
          if (!disposeGamepadInput) return;
          const dispose = disposeGamepadInput;
          disposeGamepadInput = null;
          dispose();
        }, { once: true });
      }

      // Apply the private Accessibility profile to the shell at boot (issue
      // #1102). Console iframes are (re)covered as they mount and on every
      // iframe load — see mountConsoles / _attachIframeLoadListener.
      if (typeof window.applyAccessibilityProfile === 'function') {
        window.applyAccessibilityProfile();
      }

      console.log('[client] fetching ICE servers');
      const { servers: iceServers, relayAvailable, relaySource } = await window.fetchIceServers();
      console.log('[client] ICE config:', iceServers.map(s => s.urls));

      // Connection diagnostics readout (#conn-diag). A phone stuck behind
      // CGNAT shows "connecting…" forever with the real story buried in an
      // unreachable console — this mirrors the relay + ICE stage on screen.
      //
      // writeDiagLines is the shared mechanical half from gui/page-chrome.js
      // (issue #1227) — guard for a missing #conn-diag, join, set
      // textContent. The line-building logic here (this device's own relay
      // probe + ICE attempt history) is client-specific and stays local;
      // see that module's doc comment for why it isn't unified with
      // server.html's own renderConnDiag. diagEl itself is still looked up
      // directly below for the show/hide toggle, which isn't part of the
      // shared renderer's job.
      const diagEl = document.getElementById('conn-diag');
      // _pageChrome can still be null here: this async function resumes
      // after the fetchIceServers() await, and nothing guarantees the
      // page-chrome module island has mounted (fired
      // window.__pageChromeReady) by then — the other three bridge calls
      // above all guard the same race. mountConnDiag returns a value
      // rather than firing a queueable side effect, so a no-op fallback
      // (not the queue) is the guard here.
      const writeDiagLines = _pageChrome ? _pageChrome.mountConnDiag('conn-diag') : () => {};
      // The line-building logic itself moved to gui/connection-diagnostics.js
      // in #1113: it grew enough to be worth testing (which rung of the
      // transport ladder, which relay actually carried the traffic, whether
      // the link is shedding snapshots), and it now has a second reader — the
      // copy-pasteable dump below, which must not be able to disagree with
      // what is on screen. What stays here is the wiring.
      // Guarded like window.rendezvousTransport and window.transportLevers
      // above, and for the same stated reason: every gui/ module is deferred,
      // and one genuinely failing to load must cost this page its diagnostics
      // readout and nothing else. Unguarded, the next line threw a TypeError
      // partway through the join wiring.
      const diagnostics = window.connectionDiagnostics;
      const diag = diagnostics
        ? diagnostics.createClientDiagnostics({
          relayAvailable,
          relaySource,
          lever: transportLevers,
        })
        : { relayAvailable, relaySource, probe: null, lever: transportLevers };
      function renderDiag() {
        if (!diagnostics) return;
        writeDiagLines(diagnostics.clientDiagnosticsLines(diag, t));
      }
      renderDiag();

      // The copy control the acceptance kit asks a tester to use
      // (docs/acceptance/1113-networks.md): one tap puts the whole state in
      // the clipboard for pasting into the issue thread. Hidden when the
      // browser has no clipboard to write to — an inert button that silently
      // does nothing is worse than no button.
      const diagCopyBtn = document.getElementById('conn-diag-copy');
      const diagRow = document.getElementById('conn-diag-row');
      if (diagRow) {
        new ResizeObserver(() => {
          document.documentElement.style.setProperty(
            '--connection-diagnostics-height', `${diagRow.getBoundingClientRect().height}px`,
          );
        }).observe(diagRow);
      }
      if (diagnostics && diagCopyBtn && navigator.clipboard && navigator.clipboard.writeText) {
        diagCopyBtn.style.display = '';
        diagCopyBtn.textContent = t('client.diag_copy');
        diagCopyBtn.onclick = () => {
          const stamp = document.querySelector('meta[name="phoenix-client-stamp"]');
          navigator.clipboard.writeText(diagnostics.diagnosticsDump(diag, {
            page: 'client',
            service: joinRoute.base,
            build: stamp ? stamp.getAttribute('content') : null,
          })).then(() => {
            diagCopyBtn.textContent = t('client.diag_copied');
            setTimeout(() => { diagCopyBtn.textContent = t('client.diag_copy'); }, 2000);
          }).catch(() => {});
        };
      }
      if (relayAvailable && typeof window.probeTurnRelay === 'function') {
        window.probeTurnRelay(iceServers).then(verdict => {
          console.log('[ICE] relay probe:', verdict);
          diag.probe = verdict;
          renderDiag();
        });
      }

      // Everything the transport needs to drive this page: identity, the
      // inbound message sink, and the four status/diagnostic callbacks that
      // paint the status line, the console's live/dead treatment and the
      // #conn-diag readout. `onError` is supplied by startPhoenixJoin below,
      // because a refusal belongs in front of the entry field with its own
      // sentence rather than on a status line the guest cannot act on.
      const connectOptions = {
        iceServers,
        // Which rung(s) of the transport ladder this load may use. `auto` — the
        // whole ladder — unless the URL pinned one (gui/transport-levers.js).
        levers: transportLevers,
        getIdent: () => ({ token: myToken, name: myName }),
        onData: handleMessage,
        onStatus: (state) => {
          setConnectionStatus(state);
          // The console's live/connecting/dead treatment is part of render()
          // (PRD #1023 module 4); a status change has to repaint it.
          scheduleRender();
          // Diagnostics only matter while the link is down; hide them once
          // the DataChannel is up so they don't sit under the lobby.
          if (diagEl) diagEl.style.display = state === 'ready' ? 'none' : '';
          if (state === 'ready') {
            acquireWakeLock();
            setStatus(t('client.status_waiting_server'));
          } else if (state === 'connecting') {
            setStatus(t('client.status_connecting_host'));
          } else if (state === 'disconnected') {
            releaseWakeLock();
            setStatus(t('client.status_disconnected'));
          } else if (state === 'error') {
            releaseWakeLock();
            setStatus(t('client.status_unreachable'));
          }
        },
        onLog: (msg) => console.log(msg),
        onDiag: (e) => {
          if (!diagnostics) return;
          diagnostics.applyClientDiagEvent(diag, e);
          renderDiag();
        },
      };

      await startPhoenixJoin(joinRoute, connectOptions);
    })();

    // -- Phoenix join (issues #1111 / #1112) --------------------------------
    //
    // Either the code arrived in the fragment (a QR link, or a pasted full
    // code) and we join at once, or nothing did and the guest types the five
    // letters they can read off the viewscreen. Both land in the same
    // attempt() below, because gui/join-code.js decides what was typed rather
    // than the form offering two boxes to get wrong.
    //
    // attempt() is only ever a NEW code being tried. Keeping an accepted link
    // alive across a dropped radio is the joiner's own job — it re-resolves the
    // same code on a backoff and re-sends Identify with the same session token
    // (#1112 AC3) — so nothing here re-asks for the code the guest already
    // typed.
    async function startPhoenixJoin(route, connectOptions) {
      const codes = window.joinCode;
      const transport = window.rendezvousTransport;
      if (!codes || !transport) {
        // Same condition as the route:'none' branch above, reached by the
        // other door: a module this page needs never evaluated, so there is no
        // join path at all and only a reload can produce one.
        console.error('[client] join-code or transport module missing — cannot join');
        setStatus(t('client.status_transport_unavailable'));
        return;
      }

      let data = codes.getJoinCodeData();
      if (!data) {
        try {
          data = await codes.loadJoinCodeData();
        } catch (err) {
          console.error('[join] could not load the join-code format', err);
          setStatus(t('client.status_unreachable'));
          return;
        }
      }

      // This bundle's own identity, presented to the host's compatibility
      // handshake. Empty only in an un-built checkout, which the host refuses
      // since #1112 — `scripts/build-client.mjs` writes the field on every
      // build, so a shipped page always carries one.
      const stampMeta = document.querySelector('meta[name="phoenix-client-stamp"]');
      const stamp = (stampMeta && stampMeta.content) || '';

      const input = document.getElementById('join-code-input');
      const submit = document.getElementById('join-submit-btn');
      const errorEl = document.getElementById('join-entry-error');
      let lastTyped = '';
      // The joiner from the attempt in flight, if any. Mistyping the code
      // and retrying is the ordinary path through this screen, so each attempt
      // has to close the one before it: an orphaned joiner keeps its socket,
      // its registry connection and its RTCPeerConnection, and stays wired to
      // these same page callbacks — a late failure on a stale one would pop
      // this overlay back over a session that had since connected.
      let joiner = null;

      // The page's stable handle on whatever joiner is current. Created ONCE,
      // so a reference taken before a reconnect still drives the live link
      // afterwards; `retryNow` prefers the joiner's own immediate re-attempt
      // (same code, same token) and only falls back to re-running the typed
      // attempt when there is no joiner to ask.
      activeLink = {
        get connected() { return !!joiner && joiner.connected; },
        send: (type, payload, deliveryClass) => {
          if (joiner) joiner.send(type, payload, deliveryClass);
        },
        retryNow: () => {
          if (joiner) joiner.retryNow();
          else attempt(lastTyped);
        },
      };
      window.phoenixLink = activeLink;

      // The panel is no longer opened and closed from here (issue #1359):
      // these two record whether the page is asking for a code, and the one
      // pre-play decision puts the field on the screen — so a refusal can no
      // longer open it underneath an overlay the guest cannot dismiss.
      function showEntry(reason) {
        if (errorEl) errorEl.textContent = reason ? t(codes.reasonStringId(reason)) : '';
        joinPromptOpen = true;
        applyPrePlaySurfaces();
        if (input) { input.focus(); input.select(); }
      }

      function attempt(typed) {
        lastTyped = typed;
        if (joiner) { joiner.close(); joiner = null; }
        const parsed = codes.parseJoinCode(typed, codes.NAMESPACE_CLIENT, data);
        if (!parsed.ok) { showEntry(parsed.reason); return; }
        if (errorEl) errorEl.textContent = '';
        joinPromptOpen = false;
        applyPrePlaySurfaces();
        setStatus(t('client.status_connecting_host'));

        joiner = transport.createRendezvousJoiner({
          base: route.base,
          data,
          code: parsed.full,
          stamp,
          iceServers: connectOptions.iceServers,
          // The transport levers, and forwarding them is load-bearing rather
          // than tidy: without this line the phone READ `?transport=` /
          // `?forceRelay=` for its diagnostics readout and then joined on the
          // defaults regardless, so every pin worked on the host and on nothing
          // else. docs/acceptance/1113-networks.md tells a tester to pin both
          // ends and says pinning only the phone proves nothing — it was the
          // other way round.
          levers: connectOptions.levers,
          getIdent: connectOptions.getIdent,
          onData: connectOptions.onData,
          onStatus: connectOptions.onStatus,
          onLog: connectOptions.onLog,
          onDiag: connectOptions.onDiag,
          // Unknown, wrong-type and version-mismatch are three different
          // sentences here — that is the whole point of the typed namespaces —
          // and every one of them puts the guest back in front of the field
          // rather than leaving them on a status line they cannot act on.
          // Only a refusal a retry cannot fix reaches this callback at all;
          // an unreachable service on an established link is the joiner's own
          // backoff loop, and the guest sees "reconnecting", not the field.
          onError: (reason, detail) => {
            console.warn(`[join] ${reason}${detail ? `: ${detail}` : ''}`);
            showEntry(reason);
          },
        });
      }

      if (submit) submit.addEventListener('click', () => attempt(input ? input.value : ''));
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') attempt(input.value);
        });
      }

      if (route.route === 'rendezvous') attempt(route.code);
      else showEntry(null);
    }</script>
</body>
</html>

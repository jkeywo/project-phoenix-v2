# Side Quest ΓÇö Asteroid Belt Rescue
#
# Loaded when the crew enters the asteroid_belt_zone region (before
# aphelion_triggered). A Requiem-registered engineering crew has struck
# an asteroid; their life support is failing. The crew must navigate the
# belt manually (impulse is blocked) and reach them before the timer expires.
#
# Reward: if rescued before on_timer fires, crew gains a 4th repair team
# aboard the Phoenix for the remainder of the scenario. This provides one
# additional shape-match repair action per wave (broadcast path) or extended
# battery life for the containment option.
#
# Flags set here:
#   engineers_rescued   set on successful rescue

# ΓöÇΓöÇ OBJECTIVES ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[objective]]
id = "reach_stranded_crew"
text = "Reach the stranded Requiem engineering crew before their life support fails."
auto_add = true

[[objective]]
id = "engineers_aboard"
text = "Engineers recovered. 4th repair team active."

# ΓöÇΓöÇ OPENING COMMS ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[comms]]
id = "rescue_distress"
from = "Unknown Vessel ΓÇö Automated Beacon"
subject = "DISTRESS ΓÇö Life Support Critical"
message = "MAYDAY. Engineering vessel Bright Shore, grid 14-Delta. Hull breach. Life support at eleven percent. Crew of four. Please respond."
trigger = "on_load"

[[comms.responses]]
text = "Bright Shore, this is Ardent. We're coming. Hold on."
follow_up = "rescue_ack"

[[comms]]
id = "rescue_ack"
from = "Bright Shore ΓÇö Engineer Vasque"
subject = "Re: Distress"
message = "Ardent ΓÇö thank you. Impulse is out, we can't manoeuvre. Watch the rocks. We'll keep the beacon on."

# ΓöÇΓöÇ TIMER ΓÇö LIFE SUPPORT COUNTDOWN ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[trigger]]
condition = "on_timer"
duration_secs = 180
flag_not_set = "engineers_rescued"
actions = [
    { fail_objective = "reach_stranded_crew" },
    { push_comms = "rescue_too_late" },
]

[[comms]]
id = "rescue_too_late"
from = "Bright Shore ΓÇö Automated Beacon"
subject = "Signal Lost"
message = "Bright Shore beacon has ceased transmission. [SIGNAL LOST]"

# ΓöÇΓöÇ TRIGGER ΓÇö RESCUE COMPLETE ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
#
# Fires when the player ship reaches within docking range of the Bright Shore.
# Requires: on_docked or on_in_range trigger type (new per PRD #119).

[[trigger]]
condition = "on_in_range"
entity = "bright_shore"
radius = 20.0
flag_not_set = "engineers_rescued"
actions = [
    { set_flag = "engineers_rescued" },
    { complete_objective = "reach_stranded_crew" },
    { add_objective = "engineers_aboard" },
    { complete_objective = "engineers_aboard" },
    { push_comms = "rescue_success" },
]

[[comms]]
id = "rescue_success"
from = "Engineer Vasque"
subject = "Aboard Ardent"
message = "Vasque here, four crew aboard. We owe you our lives. Point us at whatever needs fixing ΓÇö we know our way around an engine room."

# ΓöÇΓöÇ SPAWN ΓÇö BRIGHT SHORE ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
#
# Small stationary vessel inside the belt. No behaviour (drifting, unpowered).

[[spawn]]
entity = "assets/entities/ship_requiem_courier.toml"
position = [-120.0, 0.0, 280.0]
name = "bright_shore"

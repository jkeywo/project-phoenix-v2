<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Project Phoenix — Comms Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: 16px; }

    /* ── Layout ─────────────────────────────────────────────────── */
    .panel-inner {
      padding: 20px 48px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .panel-mid {
      flex: 1; min-height: 0;
      display: flex; flex-direction: row; gap: 24px;
    }

    .primary-col {
      flex: 0 0 340px;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0;
    }

    .secondary-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0;
    }

    /* ── Hero ───────────────────────────────────────────────────── */
    .hero h1 { font-size: 40px; letter-spacing: 0.28em; }
    .hero h1 .sub { font-size: 12px; margin-top: 2px; }
    .hero .bar { width: 6px; }
    .hero { gap: 16px; }

    /* ── Contacts strip ─────────────────────────────────────────── */
    .contacts-strip {
      flex-shrink: 0;
      display: flex; flex-direction: row; gap: 6px;
      overflow-x: auto; overflow-y: hidden;
      padding: 6px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--line-soft) transparent;
    }

    .contact-pill {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px;
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 2px;
      font-family: "Chakra Petch", sans-serif;
      font-size: 11px; letter-spacing: 0.15em;
      color: var(--ink-dim);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .contact-pill:hover { border-color: var(--line); color: var(--ink); }
    .contact-pill.urgent { border-color: var(--reloading); color: var(--reloading); }
    .contact-pill.out-of-range { opacity: 0.4; cursor: default; }

    /* ── Inbox header ───────────────────────────────────────────── */
    .inbox-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 4px 8px;
      background: var(--bg-up);
      border-bottom: 1px solid var(--line-faint);
    }
    .inbox-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.3em;
      color: var(--ink-faint);
    }
    .clear-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--ink-faint);
      background: transparent;
      border: 1px solid var(--line-faint);
      padding: 2px 8px; border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .clear-btn:hover { border-color: var(--line); color: var(--ink-dim); }

    /* ── Inbox list ─────────────────────────────────────────────── */
    .inbox-list {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--line-soft) transparent;
    }

    .msg-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-faint);
      cursor: pointer;
      transition: background 0.12s;
    }
    .msg-row:hover { background: var(--bg-card); }
    .msg-row.selected { background: var(--bg-card-up); border-left: 3px solid var(--line); }
    .msg-row.unread { border-left: 3px solid var(--ink-dim); }
    .msg-row.urgent  { border-left: 3px solid var(--reloading); }
    .msg-row.orphaned { opacity: 0.45; }

    .msg-sender {
      font-family: "Chakra Petch", sans-serif;
      font-size: 12px; letter-spacing: 0.12em;
      color: var(--ink-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1;
    }
    .msg-row.unread .msg-sender { color: var(--ink); }
    .msg-row.urgent .msg-sender { color: var(--reloading); }

    .msg-subject {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      color: var(--ink-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 2;
    }

    .msg-tag {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px; letter-spacing: 0.1em;
      padding: 1px 5px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .msg-tag.unread-tag { background: var(--bg-up); color: var(--ink-dim); }
    .msg-tag.urgent-tag { background: var(--reloading-dim); color: var(--reloading); }
    .msg-tag.read-tag   { background: transparent; color: var(--ink-faint); }

    .no-msgs {
      padding: 32px 16px;
      text-align: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 12px; letter-spacing: 0.2em;
      color: var(--ink-faint);
    }

    /* ── Chat panel ─────────────────────────────────────────────── */
    .chat-panel {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; gap: 8px;
    }

    .chat-header {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
    }

    .chat-sender {
      font-family: "Chakra Petch", sans-serif;
      font-size: 16px; letter-spacing: 0.15em;
      color: var(--ink);
    }

    .chat-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 0.12em;
      padding: 2px 8px;
      border: 1px solid var(--line-soft);
      color: var(--ink-faint);
    }

    .chat-body {
      flex: 1; min-height: 0;
      overflow-y: auto;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--line-faint);
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-dim);
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: var(--line-soft) transparent;
    }

    .chat-actions {
      flex-shrink: 0;
      display: flex; flex-direction: column; gap: 6px;
    }

    .response-btn {
      width: 100%;
      font-family: "Chakra Petch", sans-serif;
      font-size: 13px; letter-spacing: 0.12em;
      color: var(--ink-dim);
      background: var(--bg-card);
      border: 1px solid var(--line-soft);
      padding: 8px 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .response-btn:hover { border-color: var(--line); color: var(--ink); background: var(--bg-card-up); }
    .response-btn:disabled { opacity: 0.35; cursor: default; }
    .response-btn.selected-response { border-color: var(--loaded-dim); color: var(--loaded); background: var(--bg-card); }

    .chat-footer-row {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }

    .on-screen-btn {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.15em;
      padding: 5px 14px;
      background: transparent;
      border: 1px solid var(--line-soft);
      color: var(--ink-faint);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .on-screen-btn:hover { border-color: var(--line); color: var(--ink-dim); }

    .out-of-range-note {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--fire-dim);
    }

    .orphaned-note {
      font-family: "JetBrains Mono", monospace;
      font-size: 10px; letter-spacing: 0.15em;
      color: var(--ink-faint);
    }

    .chat-placeholder {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px; letter-spacing: 0.2em;
      color: var(--ink-faint);
    }

    /* ── Portrait (mobile) ──────────────────────────────────────── */
    @media (max-aspect-ratio: 1/1) {
      .panel-inner { padding: 12px 16px 10px; gap: 8px; }
      .panel-mid { flex-direction: column; gap: 8px; }
      .primary-col { flex: 0 0 auto; }
      .secondary-col { flex: 1; }
      .hero h1 { font-size: 1.2rem; letter-spacing: 0.15em; }
      .hero .bar { display: none; }
      .hero .sub { display: none; }
    }
  </style>
</head>
<body style="background:#000; margin:0; overflow:hidden;">

  <!-- Hidden data containers for Playwright smoke tests -->
  <div id="messages-data"  aria-hidden="true"></div>
  <div id="contacts-data"  aria-hidden="true"></div>
  <div id="selected-msg"   aria-hidden="true"></div>

  <div class="frame landscape" data-screen-label="Comms Console">
    <div class="panel">
      <div class="panel-inner">

        <!-- ── Hero header ──────────────────────────────────────── -->
        <header class="hero">
          <div class="bar"></div>
          <h1>COMMS <span class="sub">COMMUNICATIONS · OFFICER</span></h1>
          <div style="flex:1"></div>
        </header>

        <!-- ── Main split: inbox (left) + chat (right) ──────────── -->
        <div class="panel-mid">

          <!-- ── LEFT: Contacts + Inbox ──────────────────────────── -->
          <section class="primary-col">

            <!-- Contacts strip -->
            <div class="contacts-strip" id="contacts-strip">
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.2em;color:var(--ink-faint);padding:4px 0;">NO CONTACTS</span>
            </div>

            <!-- Inbox header -->
            <div class="inbox-header">
              <span class="inbox-label">INBOX <span id="inbox-count">0</span></span>
              <button class="clear-btn" id="clear-btn" type="button">CLEAR</button>
            </div>

            <!-- Message list -->
            <div class="inbox-list" id="inbox-list">
              <div class="no-msgs" id="no-msgs-placeholder">— NO MESSAGES —</div>
            </div>

          </section>

          <!-- ── RIGHT: Chat panel ───────────────────────────────── -->
          <section class="secondary-col">
            <div class="chat-panel" id="chat-panel">
              <div class="chat-placeholder" id="chat-placeholder">
                SELECT A MESSAGE
              </div>
            </div>
          </section>

        </div>
        <!-- /panel-mid -->

        <footer class="console-footer footer-bar">
          <span class="dot"></span>
          <span id="footer-status">COMMS ONLINE</span>
          <span class="sep">·</span>
          <span id="footer-inbox-count" style="color:var(--ink-faint);">0 MESSAGES</span>
          <span style="flex:1"></span>
          <span id="footer-contacts" style="color:var(--ink-faint);">0 CONTACTS</span>
        </footer>

      </div>
    </div>
  </div>

  <script>
    // ── State ─────────────────────────────────────────────────────────────
    var _state        = null;
    var _selectedId   = null;  // currently open message id

    // ── Inbound state push (ADR-0001 §2) ──────────────────────────────────
    window.__updateConsole = function(name, stateJson) {
      var s;
      try { s = JSON.parse(stateJson); } catch(e) { return; }
      _state = s;
      _render(s);
    };

    // ── Render ─────────────────────────────────────────────────────────────
    function _render(s) {
      if (!s) return;

      _renderDataContainers(s);
      _renderContacts(s.contacts || []);
      _renderInbox(s.messages || []);
      _renderChat(s.messages || []);
      _renderFooter(s);
    }

    function _renderDataContainers(s) {
      // Playwright-readable hidden containers
      var msgsEl = document.getElementById('messages-data');
      msgsEl.innerHTML = '';
      (s.messages || []).forEach(function(m) {
        var row = document.createElement('div');
        row.className = 'msg-data';
        row.dataset.id              = m.id;
        row.dataset.sender          = m.sender_name;
        row.dataset.subject         = m.subject;
        row.dataset.isRead          = String(!!m.is_read);
        row.dataset.isUrgent        = String(!!m.is_urgent);
        row.dataset.isOrphaned      = String(!!m.is_orphaned);
        row.dataset.senderInRange   = String(m.sender_in_range !== false);
        row.dataset.responseCount   = String((m.responses || []).length);
        row.dataset.selectedResponse = m.selected_response != null ? String(m.selected_response) : '';
        msgsEl.appendChild(row);
      });

      var contsEl = document.getElementById('contacts-data');
      contsEl.innerHTML = '';
      (s.contacts || []).forEach(function(c) {
        var row = document.createElement('div');
        row.className = 'contact-data';
        row.dataset.uuid     = c.uuid;
        row.dataset.name     = c.name;
        row.dataset.inRange  = String(c.in_range !== false);
        row.dataset.isUrgent = String(!!c.is_urgent);
        contsEl.appendChild(row);
      });

      var selEl = document.getElementById('selected-msg');
      selEl.dataset.id = _selectedId || '';
    }

    function _renderContacts(contacts) {
      var strip = document.getElementById('contacts-strip');
      if (contacts.length === 0) {
        strip.innerHTML = '';
        var ph = document.createElement('span');
        ph.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.2em;color:var(--ink-faint);padding:4px 0;';
        ph.textContent = 'NO CONTACTS';
        strip.appendChild(ph);
        return;
      }
      var existing = {};
      for (var i = 0; i < strip.children.length; i++) {
        var ch = strip.children[i];
        if (ch.dataset && ch.dataset.uuid) existing[ch.dataset.uuid] = ch;
      }
      var seen = {};
      contacts.forEach(function(c) {
        seen[c.uuid] = true;
        var pill = existing[c.uuid];
        if (!pill) {
          pill = document.createElement('button');
          pill.type = 'button';
          pill.dataset.uuid = c.uuid;
          strip.appendChild(pill);
        }
        pill.className = 'contact-pill' +
          (c.is_urgent ? ' urgent' : '') +
          (c.in_range === false ? ' out-of-range' : '');
        pill.textContent = c.name.toUpperCase();
        pill.disabled = (c.in_range === false);
        // Wire click once; preserve on re-render.
        if (!pill._hailWired) {
          pill.addEventListener('click', function() {
            if (typeof window._sendCommsAction === 'function') {
              window._sendCommsAction('hail', { target_uuid: pill.dataset.uuid });
            }
          });
          pill._hailWired = true;
        }
      });
      for (var key in existing) {
        if (!seen[key]) existing[key].remove();
      }
    }

    function _renderInbox(messages) {
      var list  = document.getElementById('inbox-list');
      var count = document.getElementById('inbox-count');

      count.textContent = String(messages.length);

      if (messages.length === 0) {
        list.innerHTML = '';
        var p = document.createElement('div');
        p.className = 'no-msgs';
        p.id = 'no-msgs-placeholder';
        p.textContent = '— NO MESSAGES —';
        list.appendChild(p);
        return;
      }

      var existing = {};
      for (var i = 0; i < list.children.length; i++) {
        var ch = list.children[i];
        if (ch.dataset && ch.dataset.id) existing[ch.dataset.id] = ch;
      }
      var seen = {};
      messages.forEach(function(m) {
        seen[m.id] = true;
        var row = existing[m.id];
        if (!row) {
          row = document.createElement('div');
          row.dataset.id = m.id;
          row.addEventListener('click', function() {
            _selectedId = row.dataset.id;
            if (typeof window._sendCommsAction === 'function') {
              window._sendCommsAction('select_comms_message', { message_id: row.dataset.id });
            }
            if (_state) _render(_state);
          });
          var sender = document.createElement('span');
          sender.className = 'msg-sender';
          var subject = document.createElement('span');
          subject.className = 'msg-subject';
          var tag = document.createElement('span');
          tag.className = 'msg-tag';
          row.appendChild(sender);
          row.appendChild(subject);
          row.appendChild(tag);
          list.appendChild(row);
        }
        row.className = 'msg-row' +
          (m.id === _selectedId ? ' selected' : '') +
          (!m.is_read ? ' unread' : '') +
          (m.is_urgent && !m.is_read ? ' urgent' : '') +
          (m.is_orphaned ? ' orphaned' : '');
        row.children[0].textContent = m.sender_name.toUpperCase();
        row.children[1].textContent = m.subject;
        row.children[2].className = 'msg-tag ' +
          (m.is_urgent && !m.is_read ? 'urgent-tag' : m.is_read ? 'read-tag' : 'unread-tag');
        row.children[2].textContent = m.is_urgent && !m.is_read ? '!' : m.is_read ? '✓' : '●';
      });
      for (var key in existing) {
        if (!seen[key]) existing[key].remove();
      }
    }

    var _prevChatMsgId = null;

    function _renderChat(messages) {
      var panel = document.getElementById('chat-panel');
      var msg = messages.find(function(m) { return m.id === _selectedId; });

      if (!msg) {
        panel.innerHTML = '';
        var ph = document.createElement('div');
        ph.className = 'chat-placeholder';
        ph.id = 'chat-placeholder';
        ph.textContent = 'SELECT A MESSAGE';
        panel.appendChild(ph);
        _prevChatMsgId = null;
        return;
      }

      var sameMsg = (msg.id === _prevChatMsgId);
      _prevChatMsgId = msg.id;

      if (sameMsg) {
        // In-place update: update text/classes on existing elements.
        var badge = panel.querySelector('.chat-badge');
        if (badge) badge.textContent = msg.is_orphaned ? 'TRANSMISSION ENDED' :
          msg.sender_in_range === false ? 'OUT OF RANGE' :
          msg.is_read ? 'READ' : 'UNREAD';
        var bodyEl = panel.querySelector('.chat-body');
        if (bodyEl) bodyEl.textContent = msg.body;
        var subjEl = panel.querySelector('.chat-subject-line');
        if (subjEl) subjEl.textContent = msg.subject.toUpperCase();
        // Update response buttons in-place.
        var actions = panel.querySelector('#response-buttons');
        if (actions) _syncResponseBtns(actions, msg);
        // Update footer row.
        var footerRow = panel.querySelector('.chat-footer-row');
        if (footerRow) _syncChatFooter(footerRow, msg);
        return;
      }

      // New message: full build.
      panel.innerHTML = '';

      var hdr = document.createElement('div');
      hdr.className = 'chat-header';
      var senderEl = document.createElement('span');
      senderEl.className = 'chat-sender';
      senderEl.textContent = msg.sender_name.toUpperCase();
      hdr.appendChild(senderEl);
      var badge = document.createElement('span');
      badge.className = 'chat-badge';
      badge.textContent = msg.is_orphaned ? 'TRANSMISSION ENDED' :
        msg.sender_in_range === false ? 'OUT OF RANGE' :
        msg.is_read ? 'READ' : 'UNREAD';
      hdr.appendChild(badge);
      panel.appendChild(hdr);

      var subj = document.createElement('div');
      subj.className = 'chat-subject-line';
      subj.style.cssText = 'font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.2em;color:var(--ink-faint);flex-shrink:0;';
      subj.textContent = msg.subject.toUpperCase();
      panel.appendChild(subj);

      var body = document.createElement('div');
      body.className = 'chat-body';
      body.id = 'chat-body';
      body.textContent = msg.body;
      panel.appendChild(body);

      var actions = document.createElement('div');
      actions.className = 'chat-actions';
      actions.id = 'response-buttons';
      _rebuildResponseBtns(actions, msg);
      panel.appendChild(actions);

      var footerRow = document.createElement('div');
      footerRow.className = 'chat-footer-row';
      _rebuildChatFooter(footerRow, msg);
      panel.appendChild(footerRow);
    }

    function _syncResponseBtns(actions, msg) {
      var canRespond = !msg.is_orphaned && msg.sender_in_range !== false;
      var existing = {};
      for (var i = 0; i < actions.children.length; i++) {
        var ch = actions.children[i];
        existing[ch.dataset.responseIndex] = ch;
      }
      var seen = {};
      (msg.responses || []).forEach(function(resp, idx) {
        var key = String(idx);
        seen[key] = true;
        var btn = existing[key];
        if (!btn) {
          btn = document.createElement('button');
          btn.type = 'button';
          btn.dataset.responseIndex = key;
          btn.dataset.msgId = msg.id;
          btn.addEventListener('click', function() {
            if (typeof window._sendCommsAction === 'function') {
              window._sendCommsAction('respond_to_message', {
                message_id: btn.dataset.msgId,
                response_index: parseInt(btn.dataset.responseIndex),
              });
            }
          });
          actions.appendChild(btn);
        }
        btn.dataset.msgId = msg.id;
        btn.className = 'response-btn' +
          (msg.selected_response === idx ? ' selected-response' : '');
        btn.textContent = resp;
        btn.disabled = !canRespond || msg.selected_response != null;
      });
      for (var key in existing) {
        if (!seen[key]) existing[key].remove();
      }
    }

    function _rebuildResponseBtns(actions, msg) {
      var canRespond = !msg.is_orphaned && msg.sender_in_range !== false;
      (msg.responses || []).forEach(function(resp, idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'response-btn' +
          (msg.selected_response === idx ? ' selected-response' : '');
        btn.textContent = resp;
        btn.disabled = !canRespond || msg.selected_response != null;
        btn.dataset.responseIndex = String(idx);
        if (canRespond && msg.selected_response == null) {
          btn.addEventListener('click', (function(i) {
            return function() {
              if (typeof window._sendCommsAction === 'function') {
                window._sendCommsAction('respond_to_message', {
                  message_id: msg.id,
                  response_index: i,
                });
              }
            };
          })(idx));
        }
        actions.appendChild(btn);
      });
    }

    function _syncChatFooter(footerRow, msg) {
      // Update the ON SCREEN button in-place to avoid destroying it on every tick
      // (which would reset :hover state and make the button flicker/unresponsive).
      var existingBtn = footerRow.querySelector('.on-screen-btn');
      if (!msg.is_orphaned) {
        if (!existingBtn) {
          var onScreenBtn = document.createElement('button');
          onScreenBtn.type = 'button';
          onScreenBtn.className = 'on-screen-btn';
          onScreenBtn.id = 'on-screen-btn';
          onScreenBtn.textContent = 'ON SCREEN';
          onScreenBtn.dataset.msgId = msg.id;
          onScreenBtn.addEventListener('click', function() {
            if (typeof window._sendCommsAction === 'function') {
              window._sendCommsAction('show_on_screen', { message_id: msg.id });
            }
          });
          footerRow.insertBefore(onScreenBtn, footerRow.firstChild);
        } else if (existingBtn.dataset.msgId !== msg.id) {
          // Selected message changed — rebind click without destroying the element.
          existingBtn.dataset.msgId = msg.id;
          var oldBtn = existingBtn;
          var newBtn = oldBtn.cloneNode(true);
          newBtn.addEventListener('click', function() {
            if (typeof window._sendCommsAction === 'function') {
              window._sendCommsAction('show_on_screen', { message_id: msg.id });
            }
          });
          footerRow.replaceChild(newBtn, oldBtn);
        }
      } else if (existingBtn) {
        existingBtn.remove();
      }

      var existingNote = footerRow.querySelector('.out-of-range-note, .orphaned-note');
      if (msg.sender_in_range === false) {
        if (!existingNote || !existingNote.classList.contains('out-of-range-note')) {
          if (existingNote) existingNote.remove();
          var note = document.createElement('span');
          note.className = 'out-of-range-note';
          note.textContent = 'OUT OF RANGE';
          footerRow.appendChild(note);
        }
      } else if (msg.is_orphaned) {
        if (!existingNote || !existingNote.classList.contains('orphaned-note')) {
          if (existingNote) existingNote.remove();
          var note2 = document.createElement('span');
          note2.className = 'orphaned-note';
          note2.textContent = 'TRANSMISSION ENDED';
          footerRow.appendChild(note2);
        }
      } else if (existingNote) {
        existingNote.remove();
      }
    }

    function _rebuildChatFooter(footerRow, msg) {
      if (!msg.is_orphaned) {
        var onScreenBtn = document.createElement('button');
        onScreenBtn.type = 'button';
        onScreenBtn.className = 'on-screen-btn';
        onScreenBtn.id = 'on-screen-btn';
        onScreenBtn.textContent = 'ON SCREEN';
        onScreenBtn.addEventListener('click', function() {
          if (typeof window._sendCommsAction === 'function') {
            window._sendCommsAction('show_on_screen', { message_id: msg.id });
          }
        });
        footerRow.appendChild(onScreenBtn);
      }
      if (msg.sender_in_range === false) {
        var note = document.createElement('span');
        note.className = 'out-of-range-note';
        note.textContent = 'OUT OF RANGE';
        footerRow.appendChild(note);
      } else if (msg.is_orphaned) {
        var note2 = document.createElement('span');
        note2.className = 'orphaned-note';
        note2.textContent = 'TRANSMISSION ENDED';
        footerRow.appendChild(note2);
      }
    }

    function _renderFooter(s) {
      var msgs  = s.messages  || [];
      var conts = s.contacts  || [];
      var inbox = document.getElementById('footer-inbox-count');
      var cont  = document.getElementById('footer-contacts');
      if (inbox) inbox.textContent = msgs.length + ' MESSAGE' + (msgs.length === 1 ? '' : 'S');
      if (cont)  cont.textContent  = conts.length + ' CONTACT' + (conts.length === 1 ? '' : 'S');
    }

    // ── Clear button ──────────────────────────────────────────────────────
    document.getElementById('clear-btn').addEventListener('click', function() {
      if (typeof window._sendCommsAction === 'function') {
        window._sendCommsAction('clear_comms', {});
      }
    });

  </script>

    var _c = initConsole({ name: 'Comms', render: function(s) { _state = s; _render(s); } });

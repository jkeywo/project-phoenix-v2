<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Prevent the entry HTML from being cached so users always pick up the
       latest Trunk-hashed JS/WASM filenames after a deploy. The hashed
       assets themselves remain cacheable forever via their content hash. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Project Phoenix — Console</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Pure-function helpers shared with Vitest unit tests (issue #439). -->
  <script type="module" src="gui/phone-bezel.js"></script>
  <style>
    /* ── CSS variables (lobby + shared) ──────────────────────────────── */
    :root {
      --signal-cyan: #5fd8e8;
      --alert-red: #ff3344;
      --bg: #07080c;
      --surface: #0e1117;
      --surface2: #161a22;
      --edge: #282c38;
      --dim: #6a7178;
      --amber: #f0a030;
    }
    html, body { margin: 0; padding: 0; background: transparent; color: #cce; font-family: monospace; }
    body { box-sizing: border-box; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; }
    input[type="text"] { display: block; width: 100%; box-sizing: border-box;
      background: #111; color: #eef; border: 1px solid #446; padding: 0.5rem; margin-top: 0.25rem; }
    button { display: block; width: 100%; background: #224; color: #eef;
      border: 1px solid #446; padding: 0.75rem; margin: 0.4rem 0; cursor: pointer;
      font-family: monospace; font-size: 1rem; text-align: left; }
    button:active { background: #336; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.mine { border-color: #8af; color: #8af; }
    /* Status line: bottom-left, above canvas. z-index 25 keeps it above the
       phone bezel (15) so connection status isn't obscured by the corner. */
    #status { position: fixed; bottom: 0.5rem; left: 0.75rem; color: #778; font-size: 0.75rem; z-index: 25; }
    section { display: none; }
    section.active { display: block; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem; font-family: monospace;
    }
    #conn-label { font-size: 0.75rem; color: #f44; }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #4c4; flex-shrink: 0; }
    #fullscreen-btn {
      display: inline; width: auto; background: none; border: none; color: #cce;
      font-size: 1.1rem; cursor: pointer; padding: 0; margin: 0; line-height: 1;
    }
    /* View selector cross and Red Alert button moved to Bevy WASM (#48). */
    /* Red Alert border overlay on console container */
    #console-container {
      position: fixed;
      bottom: 2rem;
      left: 0; right: 0;
      border: 4px solid transparent;
      padding: 0.5rem 0.75rem;
      transition: border-color 0.15s;
      z-index: 1;
      pointer-events: none;
    }
    #console-container > *, #console-container section.active > * {
      pointer-events: auto;
    }
    /* In lobby phase the name input sits at the bottom; don't give it a
       background so the Bevy canvas shows through on either side. */
    /* Console tabs removed - Bevy renders the tab bar in src/client/app.rs */
    /* Helm console UI moved to Bevy WASM (#49). */
    /* Weapons console: full-viewport iframe overlay when active (issue #422).
       Padding leaves room for the phone bezel (issue #439); see --bezel-inset
       further down. */
    #weapons-ui.active {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 10;
      margin: 0;
    }
    #weapons-ui iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Bevy WASM canvas — full-viewport, behind the JS overlays so the
       lobby UI rendered by Bevy is visible while the name input,
       connection status, and fullscreen button stay clickable on top. */
    #wasm-host { position: fixed; inset: 0; z-index: 0; background: #0a0a1a; }
    /* touch-action: none lets Bevy receive all touch events without the
       browser intercepting them for scroll/pan gestures. width/height are
       managed by Bevy's fit_canvas_to_parent ResizeObserver; no !important
       so Bevy can set inline styles freely. */
    #wasm-host canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #wasm-spinner {
      position: fixed; inset: 0; z-index: 200;
      background: #0a0a1a url('assets/logo.png') center 40% / min(55vw, 55vh) auto no-repeat;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #8af; font-family: monospace; font-size: 0.9rem;
      gap: 1rem;
      padding-bottom: 15vh;
    }
    .spinner-ring {
      width: 48px; height: 48px;
      border: 4px solid #223;
      border-top-color: #8af;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Phone bezel frame (issue #439) ────────────────────────────────────
       Eight fixed-position pieces (4 corners + 4 edges) overlay the canvas /
       weapons iframe and form the diegetic phone-console border. Corners are
       <img>; edges are <div> with a repeating background. Red alert toggles
       the `.alert-on` class on #phone-bezel which swaps every -alert variant
       via CSS (and JS re-sets the four <img> srcs via bezelSrc()).

       z-index: 15 — above the weapons iframe (10) and canvas (0), below the
       top-bar status overlay (20) and the loading spinner (200). The bezel
       is purely cosmetic; pointer-events: none lets clicks through. */
    :root { --bezel-inset: 22px; }
    #phone-bezel {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 15;
      /* Hidden by default — the lobby is borderless. render() flips display
         to '' once state.phase === 'InProgress'. */
      display: none;
    }
    .bezel-corner, .bezel-edge {
      position: absolute;
      pointer-events: none;
      image-rendering: pixelated;
    }
    .bezel-corner { width: 120px; height: 72px; display: block; }
    .bezel-corner.tl { top: 0;    left: 0; }
    .bezel-corner.tr { top: 0;    right: 0; }
    .bezel-corner.bl { bottom: 0; left: 0; }
    .bezel-corner.br { bottom: 0; right: 0; }
    .bezel-edge.top {
      top: 0; left: 120px; right: 120px;
      height: var(--bezel-inset);
      background-image: url("gui/borders/phone-edge-top.png");
      background-size: 48px 22px;
      background-repeat: repeat-x;
    }
    .bezel-edge.bottom {
      bottom: 0; left: 120px; right: 120px;
      height: var(--bezel-inset);
      background-image: url("gui/borders/phone-edge-bottom.png");
      background-size: 48px 22px;
      background-repeat: repeat-x;
    }
    .bezel-edge.left {
      left: 0; top: 72px; bottom: 72px;
      width: var(--bezel-inset);
      background-image: url("gui/borders/phone-edge-left.png");
      background-size: 22px 48px;
      background-repeat: repeat-y;
    }
    .bezel-edge.right {
      right: 0; top: 72px; bottom: 72px;
      width: var(--bezel-inset);
      background-image: url("gui/borders/phone-edge-right.png");
      background-size: 22px 48px;
      background-repeat: repeat-y;
    }
    #phone-bezel.alert-on .bezel-edge.top    { background-image: url("gui/borders/phone-edge-top-alert.png"); }
    #phone-bezel.alert-on .bezel-edge.bottom { background-image: url("gui/borders/phone-edge-bottom-alert.png"); }
    #phone-bezel.alert-on .bezel-edge.left   { background-image: url("gui/borders/phone-edge-left-alert.png"); }
    #phone-bezel.alert-on .bezel-edge.right  { background-image: url("gui/borders/phone-edge-right-alert.png"); }

    /* Weapons iframe content sits inside the bezel safe zone. */
    #weapons-ui.active { padding: var(--bezel-inset); }

    /* ── Lobby section: full-viewport when active ──────────────────────── */
    #lobby-ui.active {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      padding: 28px 12px 6px;
      background: var(--bg);
      color: #d8dde2;
      font-family: 'Chakra Petch', system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    /* Ship header */
    #lobby-header { display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0 8px; border-bottom: 1px solid var(--edge); flex-shrink: 0; }
    #ship-info { display: flex; flex-direction: column; gap: 1px; }
    #ship-name { font-size: 1rem; font-weight: 600; color: #eef; letter-spacing: .06em; }
    #ship-mission { font-size: 0.6rem; color: var(--dim); letter-spacing: .04em; }
    #crew-ready { display: flex; align-items: center; gap: 8px; }
    #crew-display { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--dim); }
    #ready-pill { padding: 2px 10px; border-radius: 10px; font-size: 0.6rem;
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      background: #221e10; color: var(--amber); border: 1px solid var(--amber);
      transition: all .3s ease; }
    #ready-pill.go { background: #0a2830; color: var(--signal-cyan); border-color: var(--signal-cyan);
      animation: pill-pulse 1.5s ease-in-out infinite; }
    @keyframes pill-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(95,216,232,0.2); }
      50%       { box-shadow: 0 0 12px rgba(95,216,232,0.5); }
    }
    /* Name input row */
    #lobby-name-row { flex-shrink: 0; padding: 6px 0 2px; }
    #lobby-name-row label { font-size: 0.7rem; color: var(--dim); margin: 0;
      display: flex; align-items: center; gap: 8px; }
    #lobby-name-row input { flex: 1; background: var(--surface); color: #d8dde2;
      border: 1px solid var(--edge); padding: 4px 8px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.8rem;
      display: inline; width: auto; margin: 0; }
    /* Station list */
    #station-list { flex: 1; overflow-y: auto; padding: 8px 0; display: flex;
      flex-direction: column; gap: 6px; }
    .station-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 6px; background: var(--surface); border: 1px solid var(--edge);
      transition: border-color .2s, background .2s; }
    .station-row.mine { border-color: var(--signal-cyan); background: #0a1a24; }
    .station-row.taken { opacity: 0.7; }
    .station-row .glyph { width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
      background: var(--surface2); color: var(--dim); border: 1px solid var(--edge); }
    .station-row.mine .glyph { border-color: var(--signal-cyan); color: var(--signal-cyan); }
    .station-row .info { flex: 1; min-width: 0; }
    .station-row .info .name { font-size: 0.85rem; font-weight: 600; }
    .station-row .info .meta { font-size: 0.6rem; color: var(--dim);
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .station-row .info .meta .cons { padding: 1px 5px; border-radius: 2px;
      background: var(--surface2); font-size: 0.55rem; color: #7aa; }
    .station-row .info .occupant { font-size: 0.7rem; color: var(--signal-cyan); }
    .station-row .action { flex-shrink: 0; }
    .station-row .action button { padding: 4px 12px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.7rem;
      font-weight: 600; letter-spacing: .06em; cursor: pointer; border: 1px solid;
      transition: background .15s; display: block; width: auto; margin: 0; text-align: center; }
    .station-row .action .claim-btn { background: #0a2830; color: var(--signal-cyan);
      border-color: var(--signal-cyan); }
    .station-row .action .claim-btn:hover { background: #1a3848; }
    .station-row .action .mine-btn { background: #0a1a24; color: var(--signal-cyan);
      border-color: var(--signal-cyan); }
    .station-row .action .taken-btn { background: #111; color: var(--dim);
      border-color: var(--edge); cursor: default; }
    /* Detail panel */
    #detail-panel { flex-shrink: 0; border-top: 1px solid var(--edge);
      padding: 8px 0 4px; margin-top: 4px; transition: opacity .3s ease; }
    #detail-panel.idle { opacity: 0.4; }
    #detail-panel .detail-header { display: flex; align-items: center; justify-content: space-between; }
    #detail-panel .detail-station-name { font-size: 0.85rem; font-weight: 600; color: var(--dim); }
    #detail-panel.active .detail-station-name { color: var(--signal-cyan); }
    #detail-panel .detail-consoles { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    #detail-panel .detail-consoles .chip { padding: 2px 8px; border-radius: 3px;
      font-size: 0.6rem; background: var(--surface2); color: #7aa; border: 1px solid var(--edge); }
    #detail-panel .complexity-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
    #detail-panel .complexity-row label { font-size: 0.6rem; color: var(--dim);
      display: inline; width: auto; margin: 0; }
    #detail-panel .segmented { display: flex; gap: 2px; }
    #detail-panel .segmented button { padding: 2px 10px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.6rem;
      font-weight: 500; cursor: pointer; border: 1px solid var(--edge);
      background: var(--surface); color: var(--dim); display: block; width: auto; margin: 0;
      transition: background .15s, border-color .15s; }
    #detail-panel .segmented button.active { background: #0a2830;
      border-color: var(--signal-cyan); color: var(--signal-cyan); }
    /* Lobby footer */
    #lobby-footer { flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 6px 0 4px;
      border-top: 1px solid var(--edge); margin-top: auto; }
    #status-line { font-size: 0.65rem; color: var(--dim); }
    #engage-btn { padding: 6px 16px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.75rem;
      font-weight: 700; letter-spacing: .12em; cursor: pointer;
      border: 1px solid var(--edge); background: var(--surface); color: var(--dim);
      transition: all .3s ease; display: none; width: auto; margin: 0; }
    #engage-btn.armed { display: block; background: #0a2830;
      border-color: var(--signal-cyan); color: var(--signal-cyan); }
    #engage-btn.armed:hover { background: #1a3848; }
    #engage-btn.armed.glow { animation: engage-pulse 1s ease-in-out infinite; }
    @keyframes engage-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(95,216,232,0.3); }
      50%       { box-shadow: 0 0 18px rgba(95,216,232,0.7); }
    }
    #engage-btn:disabled { opacity: 0.4; cursor: default; animation: none !important; }
  </style>
</head>
<body>
  <!-- UI click sound (Bevy 0.18 WASM audio is broken; played from JS instead) -->
  <audio id="ui-click" src="assets/sounds/ui_click.ogg"></audio>

  <!-- Trunk replaces this with the compiled WASM bundle (client feature).
       It fires TrunkApplicationStarted and sets window.wasmBindings when ready. -->
  <link data-trunk rel="rust" data-wasm-opt="z" data-cargo-no-default-features data-cargo-features="client" />
  <link data-trunk rel="copy-dir" href="assets/phone_border" data-target-path="assets/phone_border" />
  <link data-trunk rel="copy-dir" href="assets/fonts" data-target-path="assets/fonts" />
  <link data-trunk rel="copy-dir" href="assets/shaders" data-target-path="assets/shaders" />
  <link data-trunk rel="copy-dir" href="assets/gui" data-target-path="assets/gui" />
  <link data-trunk rel="copy-dir" href="assets/helm_console" data-target-path="assets/helm_console" />
  <link data-trunk rel="copy-dir" href="assets/captain_console" data-target-path="assets/captain_console" />
  <link data-trunk rel="copy-dir" href="assets/radar_icons" data-target-path="assets/radar_icons" />
  <link data-trunk rel="copy-dir" href="assets/sounds" data-target-path="assets/sounds" />
  <link data-trunk rel="copy-dir" href="gui" />
  <link data-trunk rel="copy-file" href="assets/logo.png" />

  <!-- Loading spinner shown until WASM is ready -->
  <div id="wasm-spinner">
    <div class="spinner-ring"></div>
    <span>Loading…</span>
  </div>

  <!-- Full-viewport host for the Bevy canvas; the WASM lobby UI renders
       here, with JS overlays (name input, connection dot, fullscreen
       button) positioned above via z-index. -->
  <div id="wasm-host"><canvas id="canvas"></canvas></div>

  <!-- Console tab bar removed - Bevy renders the tab bar in src/client/app.rs -->

  <div id="console-container">
    <section id="lobby-ui">
      <!-- Ship header -->
      <div id="lobby-header">
        <div id="ship-info">
          <div id="ship-name">Phoenix</div>
          <div id="ship-mission">Standing by</div>
        </div>
        <div id="crew-ready">
          <span id="crew-display">0/0</span>
          <span id="ready-pill">CONNECTING</span>
        </div>
      </div>

      <!-- Name input -->
      <div id="lobby-name-row">
        <label>Name
          <input id="name-input" type="text" placeholder="Your name" autocomplete="off" />
        </label>
      </div>

      <!-- Station list -->
      <div id="station-list"></div>

      <!-- At-your-station detail panel -->
      <div id="detail-panel" class="idle">
        <div class="detail-header">
          <span class="detail-station-name">No station assigned</span>
        </div>
        <div id="detail-console-area">
          <div class="detail-consoles"></div>
          <div class="complexity-row">
            <label>Complexity</label>
            <div class="segmented">
              <button data-complexity="Low">Low</button>
              <button data-complexity="Std" class="active">Normal</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div id="lobby-footer">
        <span id="status-line">Connecting to host…</span>
        <button id="engage-btn">ENGAGE</button>
      </div>
    </section>

    <section id="game-ui">
      <!-- View selector cross and Red Alert button are rendered by the
           Bevy WASM captain UI; see src/client_app.rs (#48). -->
      <p id="game-status"></p>
      <button id="captain-repair-btn"
        style="margin-top:1rem;padding:0.6rem 2rem;font-size:1rem;font-weight:bold;
               letter-spacing:.15em;background:#063;color:#5f5;border:2px solid #5f5;border-radius:6px;
               cursor:pointer;width:80%;display:block;margin-left:auto;margin-right:auto"
        onclick="send('Repair', { console: 'CaptainChair' })">REPAIR</button>
    </section>

    <!-- Weapons console: full-viewport polished HTML UI (issue #422).
         Driven by __updateConsole via postMessage bridge.
         Tap-to-lock, fire phaser, fire torpedo actions forwarded to server via PeerJS. -->
    <section id="weapons-ui">
      <iframe id="weapons-iframe" src="gui/weapons-console.html"
        title="Tactical Console" allowfullscreen></iframe>
    </section>

    <section id="repair-ui">
      <h2 style="margin:0 0 1rem;font-size:1.1rem;letter-spacing:.1em;color:#8af">REPAIR</h2>
      <p style="margin:0 0 0.5rem;font-size:0.85rem;color:#aaa">HULL INTEGRITY</p>
      <p id="eng-hp-text" style="font-size:2.5rem;font-weight:bold;margin:0 0 1rem;color:#4cf">100 / 100</p>
      <div id="eng-hp-bar" style="display:flex;gap:4px" aria-label="Hull integrity bar"></div>
      <div id="eng-repair-target" style="margin-top:1.5rem;padding:0.75rem 1rem;border-radius:6px;background:#111;display:none">
        <p style="margin:0 0 0.25rem;font-size:0.8rem;color:#aaa;letter-spacing:.05em">ACTIVE REPAIR TARGET</p>
        <p id="eng-repair-console" style="margin:0;font-size:1.4rem;font-weight:bold;color:#fa0;letter-spacing:.08em"></p>
      </div>
      <button id="eng-repair-btn"
        style="margin-top:1.5rem;padding:0.75rem 2rem;font-size:1.1rem;font-weight:bold;
               letter-spacing:.15em;background:#063;color:#5f5;border:2px solid #5f5;border-radius:6px;
               cursor:pointer;width:100%"
        onclick="send('Repair', { console: 'Repair' })">REPAIR</button>
    </section>

    <!-- Helm joystick is rendered by the Bevy WASM helm UI; see
         src/client_app.rs (#49). -->
  </div>

  <div id="status">Connecting…</div>

  <div id="top-bar">
    <span id="phase-title" style="font-size:0.9rem;color:#8af;display:none"></span>
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
  </div>

  <!-- Phone bezel frame (issue #439). Eight fixed-position pieces overlay
       the content area. The `.alert-on` class on this root, plus JS-driven
       <img> src swaps, drives the red-alert visual swap. -->
  <div id="phone-bezel" aria-hidden="true">
    <img class="bezel-corner tl" data-slot="corner-tl" src="gui/borders/phone-corner-tl.png" alt="">
    <img class="bezel-corner tr" data-slot="corner-tr" src="gui/borders/phone-corner-tr.png" alt="">
    <img class="bezel-corner bl" data-slot="corner-bl" src="gui/borders/phone-corner-bl.png" alt="">
    <img class="bezel-corner br" data-slot="corner-br" src="gui/borders/phone-corner-br.png" alt="">
    <div class="bezel-edge top"></div>
    <div class="bezel-edge bottom"></div>
    <div class="bezel-edge left"></div>
    <div class="bezel-edge right"></div>
  </div>

  <script>
    // ── Click sound ────────────────────────────────────────────────────────
    // Message types that should NOT trigger a click (continuous / connection
    // setup messages that are not the result of a deliberate button press).
    const NO_CLICK = new Set(['HelmInput', 'Identify', 'SetName']);

    function playClick() {
      const el = document.getElementById('ui-click');
      if (!el) return;
      el.currentTime = 0;
      el.play().catch(() => {});
    }

    // ── Phone bezel red-alert swap (issue #439) ───────────────────────────
    // Drives the .alert-on class on #phone-bezel (which CSS uses to swap
    // edge background-images) and re-sets the <img> src for each corner via
    // the bezelSrc() pure function exported by gui/phone-bezel.js.
    let _bezelSrcMissingWarned = false;
    function applyBezelAlert(alert) {
      const root = document.getElementById('phone-bezel');
      if (!root) return;
      root.classList.toggle('alert-on', !!alert);
      const corners = root.querySelectorAll('img.bezel-corner');
      if (typeof window.bezelSrc !== 'function') {
        if (!_bezelSrcMissingWarned) {
          console.warn('[phone-bezel] window.bezelSrc not loaded; corner <img> srcs will not swap on red alert');
          _bezelSrcMissingWarned = true;
        }
        return;
      }
      for (const el of corners) {
        const slot = el.dataset.slot;
        if (slot) el.src = window.bezelSrc(slot, !!alert);
      }
    }

    // ── Connection status ──────────────────────────────────────────────────

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = 'Disconnected — reconnecting…';
      } else if (state === 'error') {
        dot.style.background = '#f44';
        label.textContent = 'Error — refresh to retry';
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
      }
    }

    // ── Screen Wake Lock (keep screen on when active) ─────────────────
    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      try {
        if (wakeLockSentinel) return;
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLockSentinel) { wakeLockSentinel.release(); wakeLockSentinel = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });

    // ── Fullscreen controller ──────────────────────────────────────────────

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    // ── Canvas resize ──────────────────────────────────────────────────
    // Bevy's fit_canvas_to_parent uses a ResizeObserver as the primary
    // mechanism. This handler is a belt-and-braces fallback: it sets the
    // canvas buffer dimensions to physical pixels (CSS size × dPR) whenever
    // the window resizes, so the WebGL surface stays crisp and correctly
    // sized even if Bevy's observer fires late or is overridden.
    (function initCanvasResize() {
      const canvas = document.getElementById('canvas');
      function syncCanvasSize() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(window.innerWidth  * dpr);
        const h = Math.round(window.innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width  = w;
          canvas.height = h;
        }
      }
      window.addEventListener('resize', syncCanvasSize);
      // Also fire once at startup in case the initial DPR != 1.
      syncCanvasSize();
    })();

    setConnectionStatus('connecting');

    // ── Persistence ─────────────────────────────────────────────

    const NAMES = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return NAMES[Math.floor(Math.random() * NAMES.length)];
    }

    let myToken = localStorage.getItem('session-token');
    if (!myToken) {
      myToken = Array.from(crypto.getRandomValues(new Uint8Array(16)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('session-token', myToken);
    }

    let myName = localStorage.getItem('player-name') || randomName();
    localStorage.setItem('player-name', myName);

    // ── Complexity preset persistence ──────────────────────────
    // JSON map of console name → preset name, persisted from previous sessions.
    let savedComplexity = {};
    try { savedComplexity = JSON.parse(localStorage.getItem('complexity-presets')) || {}; } catch (_) {}

    // ── State ───────────────────────────────────────────────────

    const state = { players: [], phase: 'Lobby', redAlert: false, currentView: 'Fore', hullIntegrity: 100,
      shipX: 0, shipZ: 0, shipYaw: 0, asteroids: [], weaponsTarget: null, weaponsLocked: false, weaponsFireReady: false, weaponsOnCooldown: false, weaponsFiring: false, weaponsReadyBankId: null,
      repairCooldownSecs: 0, repairInProgress: false, repairPenalty: false,
      stations: [], maxPlayers: 0, complexity: {}, allFilled: false,
      // Weapons console iframe state (issue #422)
      weaponsBanks: [], weaponsTubes: [], weaponsTorpedoCount: 0, weaponsPhaserMode: 'Auto' };
    let conn = null;
    // Station configs from server Welcome message (keyed by player count).
    let stationConfigs = {};
    /// Currently-active console tab during InProgress. Null until set.
    let activeConsole = null;

    // ── Helpers ─────────────────────────────────────────────────

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function myConsoles(s) {
      const m = me(s);
      return (m && Array.isArray(m.consoles)) ? m.consoles : [];
    }
    function hasConsole(s, c) { return myConsoles(s).includes(c); }
    function isCaptain(s)     { return hasConsole(s, 'CaptainChair'); }
    function isHelm(s)        { return hasConsole(s, 'Helm'); }

    /// Returns the consoles list for any player, normalising old single-console field.
    function consolesOf(p) {
      if (Array.isArray(p.consoles)) return p.consoles;
      return p.console ? [p.console] : [];
    }

    function send(type, data) {
      if (!conn || !conn.open) return;
      if (!NO_CLICK.has(type)) playClick();
      const msg = data !== undefined ? { type, data } : { type };
      conn.send(JSON.stringify(msg));
    }

    function setStatus(text) { $('status').textContent = text; }

    // ── Rendering ───────────────────────────────────────────────

    const CONSOLES = ['CaptainChair', 'Helm', 'Tactical', 'Repair', 'Sensors', 'Shields', 'Navigation', 'Power', 'Comms'];
    const CONSOLE_LABEL = {
      CaptainChair: "Captain's Chair",
      Helm: 'Helm',
      Tactical: 'Tactical',
      Repair: 'Repair',
      Sensors: 'Sensors',
      Shields: 'Shields',
      Navigation: 'Navigation',
      Power: 'Power',
      Comms: 'Comms',
    };
    const CONSOLE_INITIAL = {
      CaptainChair: 'CC',
      Helm: 'H',
      Tactical: 'T',
      Repair: 'R',
      Sensors: 'S',
      Shields: 'SH',
      Navigation: 'N',
      Power: 'P',
      Comms: 'C',
    };

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(state);
      });
    }

    function render(s) {
      const inGame = s.phase === 'InProgress';
      // Show the active console name in the top-bar during game phase.
      // In lobby the Bevy canvas renders its own "Lobby" heading.
      const titleEl = $('phase-title');
      if (!inGame) {
        titleEl.style.display = 'none';
      } else if (activeConsole) {
        titleEl.style.display = '';
        titleEl.textContent = CONSOLE_LABEL[activeConsole] || activeConsole;
      } else {
        titleEl.style.display = '';
        titleEl.textContent = 'Bridge';
      }
      $('lobby-ui').className = inGame ? '' : 'active';
      // Phone bezel (issue #439) is part of the game shell only — the lobby
      // is borderless. Toggle visibility on every phase change.
      const bezel = $('phone-bezel');
      if (bezel) bezel.style.display = inGame ? '' : 'none';

      // Reconcile activeConsole with current consoles list.
      const mine = myConsoles(s);
      if (inGame) {
        if (!activeConsole || !mine.includes(activeConsole)) {
          activeConsole = mine[0] || null;
          if (typeof wasm_client_set_active_console === 'function') {
            wasm_client_set_active_console(activeConsole || '');
          }
        }
      } else {
        if (activeConsole !== null) {
          activeConsole = null;
          if (typeof wasm_client_set_active_console === 'function') {
            wasm_client_set_active_console('');
          }
        }
      }

      // Console sections: only the active one is visible while in-game.
      $('game-ui').className = (inGame && activeConsole === 'CaptainChair') ? 'active' : '';
      $('weapons-ui').className = (inGame && activeConsole === 'Tactical') ? 'active' : '';
      $('repair-ui').className = (inGame && activeConsole === 'Repair') ? 'active' : '';
      // Helm console UI is rendered by Bevy WASM (#49).

      if (inGame) renderGame(s);
      else renderLobby(s);
    }

    function renderLobby(s) {
      const list = document.getElementById('station-list');
      if (!list) return;
      list.innerHTML = '';
      const myPlayer = me(s);
      const myPlayerName = myPlayer ? myPlayer.name : myName;
      for (const st of (s.stations || [])) {
        const isMine = st.holder_name && myPlayer && st.holder_name === myPlayerName;
        const row = document.createElement('div');
        row.className = 'station-row'
          + (isMine ? ' mine' : '')
          + (st.holder_name && !isMine ? ' taken' : '');

        const glyph = document.createElement('div');
        glyph.className = 'glyph';
        glyph.textContent = st.short_code ? st.short_code.substring(0, 2).toUpperCase() : '--';
        row.appendChild(glyph);

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = st.name || '';
        info.appendChild(nameEl);
        const meta = document.createElement('div');
        meta.className = 'meta';
        if (st.rank) {
          const rankEl = document.createElement('span');
          rankEl.textContent = st.rank;
          meta.appendChild(rankEl);
        }
        for (const c of (st.consoles || [])) {
          const chip = document.createElement('span');
          chip.className = 'cons';
          chip.textContent = CONSOLE_LABEL[c] || c;
          meta.appendChild(chip);
        }
        info.appendChild(meta);
        if (st.holder_name && !isMine) {
          const occ = document.createElement('div');
          occ.className = 'occupant';
          occ.textContent = st.holder_name;
          info.appendChild(occ);
        }
        row.appendChild(info);

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (isMine) {
          btn.className = 'mine-btn';
          btn.textContent = 'RELEASE';
          btn.addEventListener('click', () => send('ReleaseStation'));
        } else if (st.holder_name) {
          btn.className = 'taken-btn';
          btn.textContent = 'TAKEN';
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = 'CLAIM';
          btn.addEventListener('click', () => send('SelectStation', { station: st.name }));
        }
        action.appendChild(btn);
        row.appendChild(action);
        list.appendChild(row);
      }

      // Detail panel
      const detail = document.getElementById('detail-panel');
      if (detail) {
        const myStation = myPlayer && myPlayer.consoles && myPlayer.consoles.length > 0
          ? s.stations.find(st => st.holder_name === myPlayerName) : null;
        if (myStation) {
          detail.className = 'active';
          detail.querySelector('.detail-station-name').textContent = myStation.name;
          const consolesArea = detail.querySelector('.detail-consoles');
          consolesArea.innerHTML = '';
          for (const c of (myStation.consoles || [])) {
            const chip = document.createElement('span');
            chip.className = 'chip';
            chip.textContent = CONSOLE_LABEL[c] || c;
            consolesArea.appendChild(chip);
          }
          const seg = detail.querySelector('.segmented');
          if (seg) {
            seg.querySelectorAll('button').forEach(segBtn => {
              segBtn.classList.remove('active');
              const preset = savedComplexity[myStation.consoles[0]] || 'Std';
              if (segBtn.dataset.complexity === preset) segBtn.classList.add('active');
              segBtn.onclick = () => {
                const consoleName = myStation.consoles[0];
                const presetName = segBtn.dataset.complexity;
                savedComplexity[consoleName] = presetName;
                localStorage.setItem('complexity-presets', JSON.stringify(savedComplexity));
                seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                segBtn.classList.add('active');
                send('SetComplexity', { console: consoleName, preset_name: presetName });
              };
            });
          }
        } else {
          detail.className = 'idle';
          detail.querySelector('.detail-station-name').textContent = 'No station assigned';
          detail.querySelector('.detail-consoles').innerHTML = '';
        }
      }

      // Header
      const crewEl = document.getElementById('crew-display');
      if (crewEl) crewEl.textContent = (s.stations.filter(st => st.holder_name).length) + '/' + (s.maxPlayers || 0);
      const pill = document.getElementById('ready-pill');
      if (pill) {
        if (s.allFilled) { pill.textContent = 'READY TO LAUNCH'; pill.className = 'go'; }
        else { pill.textContent = 'AWAITING CREW'; pill.className = ''; }
      }

      // Engage button (captain only)
      const engageBtn = document.getElementById('engage-btn');
      if (engageBtn) {
        if (isCaptain(s)) {
          engageBtn.style.display = 'block';
          if (s.allFilled) {
            engageBtn.textContent = 'ENGAGE';
            engageBtn.className = 'armed glow';
            engageBtn.disabled = false;
            engageBtn.onclick = () => {
              engageBtn.disabled = true;
              engageBtn.textContent = 'LAUNCHING…';
              engageBtn.className = 'armed';
              send('StartGame');
            };
          } else {
            engageBtn.textContent = 'ENGAGE';
            engageBtn.className = 'armed';
            engageBtn.disabled = true;
          }
        } else {
          engageBtn.style.display = 'none';
        }
      }

      // Status line
      const statusLine = document.getElementById('status-line');
      if (statusLine) {
        if (!myPlayer) {
          statusLine.textContent = 'Select a station to join the crew';
        } else if (isCaptain(s) && s.allFilled) {
          statusLine.textContent = 'All stations filled — press Engage!';
        } else if (isCaptain(s)) {
          statusLine.textContent = 'Waiting for crew to claim stations…';
        } else {
          const myStation = s.stations.find(st => st.holder_name === myPlayerName);
          statusLine.textContent = myStation
            ? 'Standing by at ' + myStation.name
            : 'Select a station to join the crew';
        }
      }
    }

    function rebuildStations() {
      const count = Math.max(1, Math.min(state.players.length || 1, state.maxPlayers || 1));
      const defs = stationConfigs[count] || stationConfigs[String(count)] || [];
      state.stations = defs.map(def => {
        const holder = state.players.find(p =>
          p.consoles && p.consoles.length > 0
          && def.consoles && def.consoles.every(c => p.consoles.includes(c))
        );
        return {
          name: def.name || '',
          short_code: def.short_code || '',
          rank: def.rank || '',
          consoles: def.consoles || [],
          holder_name: holder ? holder.name : null,
        };
      });
      state.allFilled = state.stations.length > 0 && state.stations.every(st => st.holder_name);
      scheduleRender();
    }

    function renderRepair(hp, repairTarget) {
      const clamped = Math.max(0, Math.min(100, hp));
      const text = $('eng-hp-text');
      const bar = $('eng-hp-bar');
      if (!text || !bar) return;
      text.textContent = clamped + ' / 100';
      const filled = Math.ceil(clamped / 10);
      const color = clamped > 60 ? '#4cf' : clamped > 30 ? '#fa0' : '#f44';
      text.style.color = color;
      // Rebuild segments only when count changes; otherwise update colours.
      const segs = bar.querySelectorAll('div');
      if (segs.length !== 10) {
        bar.innerHTML = '';
        for (let i = 0; i < 10; i++) {
          const seg = document.createElement('div');
          seg.style.cssText = 'flex:1;height:28px;border-radius:3px;transition:background .2s';
          bar.appendChild(seg);
        }
      }
      bar.querySelectorAll('div').forEach((seg, i) => {
        seg.style.background = i < filled ? color : '#333';
      });
      // Repair target display
      const targetBox = $('eng-repair-target');
      const targetLabel = $('eng-repair-console');
      if (targetBox && targetLabel) {
        if (repairTarget) {
          const names = {
            CaptainChair: "CAPTAIN'S CHAIR",
            Helm: 'HELM',
            Tactical: 'TACTICAL',
            Repair: 'REPAIR',
            Power: 'POWER',
          };
          targetLabel.textContent = names[repairTarget] || repairTarget;
          targetBox.style.display = '';
        } else {
          targetBox.style.display = 'none';
        }
      }
    }

    const REPAIR_BTN_MAP = {
      CaptainChair: 'captain-repair-btn',
      Tactical: 'weapons-repair-btn',
      Repair: 'eng-repair-btn',
    };

    function renderRepairButtons(s) {
      for (const [console, id] of Object.entries(REPAIR_BTN_MAP)) {
        const btn = $(id);
        if (!btn) continue;
        if (console !== activeConsole) {
          // Reset non-active buttons to ready state so they don't show stale state.
          btn.textContent = 'REPAIR';
          btn.style.background = '#063';
          btn.style.color = '#5f5';
          btn.style.borderColor = '#5f5';
          btn.disabled = false;
          continue;
        }
        // Active console's button reflects current repair state.
        if (s.repairPenalty) {
          const flash = Math.floor(Date.now() / 333) % 2 === 0;
          btn.textContent = 'COOLDOWN ' + Math.ceil(s.repairCooldownSecs) + 's';
          btn.style.background = flash ? '#800' : '#400';
          btn.style.color = '#f66';
          btn.style.borderColor = '#f44';
          btn.disabled = true;
        } else if (s.repairInProgress) {
          btn.textContent = 'REPAIRING ' + Math.ceil(s.repairCooldownSecs) + 's';
          btn.style.background = '#030';
          btn.style.color = '#5f5';
          btn.style.borderColor = '#4a4';
          btn.disabled = true;
        } else {
          btn.textContent = 'REPAIR';
          btn.style.background = '#063';
          btn.style.color = '#5f5';
          btn.style.borderColor = '#5f5';
          btn.disabled = false;
        }
      }
    }

    // EntitySnapshot position helpers (position: [x, y, z])
    function entityX(e) { return e.x !== undefined ? e.x : (e.position ? e.position[0] : 0); }
    function entityZ(e) { return e.z !== undefined ? e.z : (e.position ? e.position[2] : 0); }
    function entityRadius(e) { return (e.radius !== undefined && e.radius !== null) ? e.radius : 4; }

    // ── Weapons console iframe bridge (issue #422) ──────────────────────────
    // Builds a WeaponsConsoleState JSON from client state and pushes it to the
    // gui/weapons-console.html iframe via its window.__updateConsole function.
    // The iframe's __sendAction postMessages back; we forward those to the server.

    const RADAR_RANGE = 60.0;

    function buildWeaponsConsoleState() {
      const cosY = Math.cos(state.shipYaw), sinY = Math.sin(state.shipYaw);
      const blips = (state.asteroids || []).map(a => {
        const ax = entityX(a), az = entityZ(a);
        const dx = ax - state.shipX, dz = az - state.shipZ;
        if (dx * dx + dz * dz > RADAR_RANGE * RADAR_RANGE) return null;
        const radar_x = (dx * cosY + dz * sinY) / RADAR_RANGE;
        const radar_y = (dx * sinY - dz * cosY) / RADAR_RANGE;
        const radius   = entityRadius(a);
        const tags     = (a.tags || a.entity_tags || []).map(t => String(t).toLowerCase());
        const kind     = tags.includes('ship') ? 'ship'
                       : tags.includes('station') ? 'station' : 'asteroid';
        return { uuid: a.uuid, radar_x, radar_y, scaled_radius: radius / RADAR_RANGE, kind };
      }).filter(Boolean);

      return JSON.stringify({
        target_uuid:   state.weaponsTarget || null,
        banks:         state.weaponsBanks  || [],
        tubes:         state.weaponsTubes  || [],
        torpedo_count: state.weaponsTorpedoCount || 0,
        phaser_mode:   state.weaponsPhaserMode   || 'Auto',
        blips,
        phaser_arcs:   [],   // server-side arcs not forwarded; UI gracefully handles []
        torpedo_arcs:  [],
      });
    }

    function pushWeaponsConsoleState() {
      if (activeConsole !== 'Tactical') return;
      const iframe = $('weapons-iframe');
      if (!iframe || !iframe.contentWindow) return;
      try {
        const fn = iframe.contentWindow.__updateConsole;
        if (typeof fn === 'function') fn('Tactical', buildWeaponsConsoleState());
      } catch (_) {}
    }

    // Re-push when the iframe finishes loading so it receives current state.
    (function wireWeaponsIframe() {
      const iframe = $('weapons-iframe');
      if (!iframe) return;
      iframe.addEventListener('load', () => { pushWeaponsConsoleState(); });
    })();

    function renderGame(s) {
      const showCap = activeConsole === 'CaptainChair';

      // View selector cross and Red Alert button moved to Bevy WASM (#48).
      if (showCap) {
        $('game-status').textContent = 'You are the captain. Issue orders.';
      } else if (!activeConsole) {
        $('game-status').textContent = 'Stand by. Select a console in the lobby.';
      } else {
        $('game-status').textContent = '';
      }
    }

    // ── Weapons console iframe → PeerJS action bridge (issue #422) ──────────
    // The weapons-console.html iframe sends {type:'console_action', payload:json}
    // via postMessage when the player fires or taps a target. We translate
    // the action JSON to the appropriate ClientMessage and send via PeerJS.
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'console_action') return;
      let action;
      try { action = JSON.parse(event.data.payload); } catch (_) { return; }
      if (!action || !action.action) return;
      switch (action.action) {
        case 'fire_phaser':
          if (action.bank) send('FirePhaser', { bank: action.bank });
          break;
        case 'fire_torpedo':
          send('FireTorpedo', { tube: action.tube || 'fore', target_uuid: action.target_uuid || null });
          break;
        case 'set_target':
          if (action.uuid) send('SetTarget', { uuid: action.uuid });
          break;
        default:
          break;
      }
    });

    // ── Event wiring ────────────────────────────────────────────

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      // Forward immediately to the WASM bridge (queued until ready).
      callWasmSetName(myName);
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        localStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    // Engage button moved to Bevy WASM lobby UI (#47).
    // View selector and Red Alert button moved to Bevy WASM captain UI (#48).
    // Helm joystick moved to Bevy WASM helm UI (#49).

    // ── Swipe to switch console tabs (when 2+ consoles assigned) ───────
    (function initSwipe() {
      const root = document.body;
      let startX = 0, startY = 0, startT = 0, swiping = false, swipeCommitted = false;

      root.addEventListener('touchstart', e => {
        // Block swipe from buttons (tab bar, lobby buttons, etc.) so a
        // tap-to-press isn't misinterpreted as the start of a gesture.
        if (e.target.closest('button, [role="button"]')) return;
        // Block swipe from the bottom portion of the screen where the
        // virtual thumbstick joystick lives (~200px pad at the bottom).
        const touchY = e.touches[0].clientY;
        const viewportH = window.innerHeight;
        if (touchY > viewportH * 0.65) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startT = performance.now();
        swiping = true;
        swipeCommitted = false;
      }, { passive: true });

      // Non-passive so we can preventDefault() once the gesture is clearly
      // horizontal, preventing the browser from treating it as a scroll.
      root.addEventListener('touchmove', e => {
        if (!swiping) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
          swipeCommitted = true;
          e.preventDefault();
        }
      }, { passive: false });

      root.addEventListener('touchend', e => {
        if (!swiping) return;
        swiping = false;
        if (!swipeCommitted) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = performance.now() - startT;
        if (dt > 600) return;
        if (Math.abs(dx) < 60) return;
        if (Math.abs(dy) > Math.abs(dx) * 0.6) return;
        const mine = myConsoles(state);
        if (mine.length < 2 || state.phase !== 'InProgress') return;
        const idx = Math.max(0, mine.indexOf(activeConsole));
        const next = (dx < 0)
          ? (idx + 1) % mine.length
          : (idx - 1 + mine.length) % mine.length;
        activeConsole = mine[next];
        if (typeof wasm_client_set_active_console === 'function') {
          wasm_client_set_active_console(mine[next]);
        }
        render(state);
      }, { passive: true });
    })();

    // ── Incoming message handler ────────────────────────────────

    function handleMessage(msg) {
      switch (msg.type) {
        case 'Welcome':
          state.phase   = msg.data.state.phase;
          state.players = msg.data.state.players.map(p => ({
            ...p,
            consoles: consolesOf(p),
          }));
          state.complexity = msg.data.state.complexity || {};
          if (msg.data.ship_stations) {
            state.maxPlayers = msg.data.ship_stations.max_players || 0;
            stationConfigs = msg.data.ship_stations.configs || {};
          }
          if (msg.data.state.world) {
            const nameEl2 = document.getElementById('ship-name');
            const missionEl = document.getElementById('ship-mission');
            if (nameEl2) nameEl2.textContent = msg.data.state.world.scenario_title || 'Phoenix';
            if (missionEl) missionEl.textContent = msg.data.state.world.scenario_description || '';
          }
          setStatus('Connected');
          // Sync complexity presets: send SetComplexity for any console the
          // local player holds whose stored preference differs from the server.
          if (msg.data.state.complexity) {
            const serverComplexity = msg.data.state.complexity;
            const mine = myConsoles(state);
            for (const c of mine) {
              const stored = savedComplexity[c];
              const current = serverComplexity[c];
              if (stored && stored !== current) {
                send('SetComplexity', { console: c, preset_name: stored });
              }
            }
          }
          rebuildStations();
          break;
        case 'PlayerJoined': {
          const p = msg.data.player;
          const existing = state.players.findIndex(x => x.token === p.token);
          if (existing >= 0) state.players[existing] = { ...p, consoles: consolesOf(p) };
          else state.players.push({ ...p, consoles: consolesOf(p) });
          rebuildStations();
          break;
        }
        case 'PlayerLeft':
          state.players = state.players.filter(p => p.token !== msg.data.token);
          rebuildStations();
          break;
        case 'StationAssigned': {
          const { token, consoles } = msg.data;
          // Clear these consoles from any other player who held them.
          for (const c of (consoles || [])) {
            for (const p of state.players) {
              if (p.token !== token && p.consoles) {
                p.consoles = p.consoles.filter(x => x !== c);
              }
            }
          }
          const target = state.players.find(p => p.token === token);
          if (target) target.consoles = consoles || [];
          rebuildStations();
          break;
        }
        case 'NameChanged': {
          const p = state.players.find(p => p.token === msg.data.token);
          if (p) p.name = msg.data.name;
          if (msg.data.token === myToken) myName = msg.data.name;
          rebuildStations();
          break;
        }
        case 'GameStarted':
          state.phase = 'InProgress';
          break;
        case 'SimState': {
          const snap = msg.data.snapshot;
          const vd = snap.view_direction;
          const hp = snap.hull_integrity;
          const repairTarget = snap.authorized_repair_console || null;
          state.shipX = snap.ship_x || 0;
          state.shipZ = snap.ship_z || 0;
          state.shipYaw = snap.ship_yaw || 0;
          if (vd) state.currentView = vd;
          // Red alert visual (issue #439): drives the phone bezel image swap.
          // `snap.red_alert` is a snake-cased serde field on SimSnapshot.
          const nextAlert = !!snap.red_alert;
          if (state.redAlert !== nextAlert) {
            state.redAlert = nextAlert;
            applyBezelAlert(nextAlert);
          }
          // Update entity positions from per-tick entity state snapshots
          if (snap.entity_states) {
            for (const es of snap.entity_states) {
              const match = state.asteroids.find(a => a.uuid === es.uuid);
              if (match && es.position) {
                match.position = es.position;
              }
            }
          }
          if (typeof hp === 'number' && (state.hullIntegrity !== hp || state.repairTarget !== repairTarget)) {
            state.hullIntegrity = hp;
            state.repairTarget = repairTarget;
            renderRepair(hp, repairTarget);
          }
          pushWeaponsConsoleState();
          // View-direction highlighting is handled by the Bevy WASM UI (#48).
          return;
        }
        case 'WorldSetup': {
          state.asteroids = (msg.data.world && msg.data.world.entities) || [];
          pushWeaponsConsoleState();
          return;
        }
        case 'TargetLock': {
          const { uuid, locked } = msg.data;
          if (locked) {
            state.weaponsTarget = uuid;
            state.weaponsLocked = true;
          } else {
            state.weaponsTarget = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          return;
        }
        case 'WeaponsUpdate': {
          // Save full bank/tube/torpedo/mode state for the iframe console.
          const { target_uuid, banks, tubes, torpedo_count, phaser_mode } = msg.data;
          const bankList = Array.isArray(banks) ? banks : [];
          const fire_ready  = bankList.some(b => b.fire_ready);
          const on_cooldown = bankList.length > 0 && bankList.every(b => b.on_cooldown);
          const readyBank   = bankList.find(b => b.fire_ready) || bankList[0] || null;
          state.weaponsReadyBankId   = readyBank ? readyBank.id : null;
          state.weaponsFireReady     = fire_ready;
          state.weaponsOnCooldown    = on_cooldown;
          state.weaponsBanks         = bankList;
          state.weaponsTubes         = Array.isArray(tubes) ? tubes : [];
          state.weaponsTorpedoCount  = typeof torpedo_count === 'number' ? torpedo_count : 0;
          state.weaponsPhaserMode    = phaser_mode || 'Auto';
          if (target_uuid) {
            state.weaponsTarget = target_uuid;
            state.weaponsLocked = true;
          } else {
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          return;
        }
        case 'BeamStarted': {
          state.weaponsFiring = true;
          pushWeaponsConsoleState();
          return;
        }
        case 'BeamEnded': {
          state.weaponsFiring = false;
          pushWeaponsConsoleState();
          return;
        }
        case 'RepairState': {
          const { remaining_cooldown_secs, in_progress, penalty } = msg.data;
          state.repairCooldownSecs = remaining_cooldown_secs || 0;
          state.repairInProgress = !!in_progress;
          state.repairPenalty = !!penalty;
          renderRepairButtons(state);
          return;
        }
        case 'AsteroidDestroyed': {
          const { uuid } = msg.data;
          state.asteroids = state.asteroids.filter(a => a.uuid !== uuid);
          if (state.weaponsTarget === uuid) {
            state.weaponsTarget = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          return;
        }
        case 'DamageTaken': {
          const { hull } = msg.data;
          if (hull > 0) {
            const clamped = Math.min(hull, 30);
            const duration = Math.round(50 + (clamped / 30) * 250); // 50–300 ms
            if (navigator.vibrate) navigator.vibrate(duration);
          }
          return;
        }
        case 'ComplexityChanged': {
          const { console: consoleName, preset_name } = msg.data;
          state.complexity[consoleName] = preset_name;
          savedComplexity[consoleName] = preset_name;
          localStorage.setItem('complexity-presets', JSON.stringify(savedComplexity));
          rebuildStations();
          return;
        }
        default:
          return; // unknown — skip re-render
      }
      scheduleRender();
    }

    // ── WASM client bridge (Trunk) ──────────────────────────────
    //
    // The page hosts a Bevy WASM bundle compiled with --features client.
    // The renderer is currently an empty placeholder; we wire the JS
    // surface now so later issues can migrate UI into Bevy without
    // touching the PeerJS plumbing.

    // Inbound ServerMessage JSON payloads queued until WASM is ready.
    const wasmInboundQueue = [];
    // Pending name updates queued until WASM is ready.
    let pendingName = null;
    // Resolved once Trunk fires TrunkApplicationStarted.
    let wasmReady = false;

    function callWasmReceive(json) {
      if (wasmReady && typeof wasm_client_receive === 'function') {
        wasm_client_receive(json);
      } else {
        wasmInboundQueue.push(json);
      }
    }

    function callWasmSetName(name) {
      if (wasmReady && typeof wasm_client_set_name === 'function') {
        wasm_client_set_name(name);
      } else {
        pendingName = name;
      }
    }

    // Outbound callback the WASM uses to send ClientMessage JSON to the host.
    function clientSendCallback(payload) {
      if (conn && conn.open) conn.send(payload);
      try {
        const msg = JSON.parse(payload);
        if (!NO_CLICK.has(msg.type)) playClick();
      } catch (_) {}
    }

    function startClientWasm() {
      window.wasm_client_init                 = wasmBindings.wasm_client_init;
      window.wasm_client_receive              = wasmBindings.wasm_client_receive;
      window.wasm_client_set_name             = wasmBindings.wasm_client_set_name;
      window.wasm_client_set_token            = wasmBindings.wasm_client_set_token;
      window.wasm_client_set_active_console   = wasmBindings.wasm_client_set_active_console;
      window.wasm_client_set_complexity_presets = wasmBindings.wasm_client_set_complexity_presets;
      window.set_client_send_callback         = wasmBindings.set_client_send_callback;
      set_client_send_callback(clientSendCallback);
      // The local player's session token is needed by the lobby UI to
      // highlight "my" console selection.
      wasm_client_set_token(myToken);
      if (pendingName !== null) wasm_client_set_name(pendingName);
      // Inject stored complexity presets so WASM can decide pop-up/dropdown state.
      wasm_client_set_complexity_presets(JSON.stringify(savedComplexity));
      // Flush queued inbound messages before wasm_client_init: in WASM
      // App::run() unwinds the JS stack via throw, so anything after it
      // never executes.
      for (const json of wasmInboundQueue.splice(0)) wasm_client_receive(json);
      wasmReady = true;
      const spinner = document.getElementById('wasm-spinner');
      if (spinner) spinner.style.display = 'none';
      try { wasm_client_init(); } catch (_) {}
    }

    window.addEventListener('TrunkApplicationStarted', startClientWasm);

    // ── PeerJS connection ───────────────────────────────────────

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus('No host ID in URL. Scan the QR code on the view screen.');
    } else {
      const clientPeer = new Peer({ config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject', transport: 'tcp' },
      ] } });

      clientPeer.on('open', () => {
        let connectTimeout;

        function startConnect() {
          setStatus('Connecting to host…');
          conn = clientPeer.connect(hostPeerId, { reliable: true });

          // If the DataConnection doesn't open within 8 s, retry — PeerJS
          // can silently stall when NAT traversal fails or the host is
          // temporarily unreachable.
          connectTimeout = setTimeout(() => {
            if (conn && !conn.open) {
              conn.close();
              conn = null;
              startConnect();
            }
          }, 8000);

          conn.on('open', () => {
            clearTimeout(connectTimeout);
            setConnectionStatus('ready');
            acquireWakeLock();
            send('Identify', { token: myToken, name: myName });
            setStatus('Waiting for server…');
          });

          conn.on('data', raw => {
            try {
              const str = typeof raw === 'string' ? raw : new TextDecoder().decode(raw);
              // Forward to the WASM client bridge (queued until ready) so
              // future Bevy systems can react alongside the existing JS UI.
              callWasmReceive(str);
              handleMessage(JSON.parse(str));
            } catch (e) { console.error('[client] bad message', e, raw); }
          });

          conn.on('close', () => { clearTimeout(connectTimeout); setConnectionStatus('disconnected'); setStatus('Disconnected'); conn = null; releaseWakeLock(); });
          conn.on('error', e  => { clearTimeout(connectTimeout); setStatus('Connection error: ' + e.type); });
        }

        startConnect();
      });

      clientPeer.on('disconnected', () => {
        setConnectionStatus('disconnected');
        clientPeer.reconnect();
      });

      clientPeer.on('error', e => { setConnectionStatus('error'); setStatus('Peer error: ' + e.type); });
    }
  </script>
</body>
</html>

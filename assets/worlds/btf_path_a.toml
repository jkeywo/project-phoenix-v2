# btf_path_a.toml — Diplomat branch: Administrator Chen + Dr. Varen's escape pod
# Loaded when the crew hails Axiom Station (root world trigger: on_hailed Axiom Station).

# ── Triggers ──────────────────────────────────────────────────────────────────

# Case A: path_a loaded AFTER Ironveil was already destroyed.
# The root world sets parent:ironveil_destroyed; on_world_loaded fires immediately
# with the current flag value.
[[trigger]]
condition = "on_world_loaded"
when      = "flag(parent:ironveil_destroyed)"

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/station_outpost.toml"
  name          = "Varen Escape Pod"
  position      = [200.0, 0.0, -100.0]

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-rescue-varen"
  text      = "world.btf_path_a.trigger.action.obj_rescue_varen.text"
  mandatory = false
  targets   = ["Varen Escape Pod"]

# Case B: path_a loaded BEFORE Ironveil is destroyed.
# on_flag_set fires in the tick when the root world sets ironveil_destroyed.
[[trigger]]
condition = "on_flag_set"
name      = "parent:ironveil_destroyed"

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/station_outpost.toml"
  name          = "Varen Escape Pod"
  position      = [200.0, 0.0, -100.0]

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-rescue-varen"
  text      = "world.btf_path_a.trigger.action.obj_rescue_varen.text_2"
  mandatory = false
  targets   = ["Varen Escape Pod"]

# ── Comms templates ───────────────────────────────────────────────────────────

[[comms]]
thread_id = "axiom-diplomat"
from    = "world.entity.axiom_station.name"
trigger = "on_world_loaded"
entity  = "world.entity.axiom_station.name"
message = "world.btf_path_a.comms.axiom_diplomat.message"

  [[comms.response]]
  text = "world.btf_path_a.comms.response.0.text"

    [[comms.response.action]]
    type      = "add_objective"
    id        = "obj-investigate-ironveil"
    text      = "world.btf_path_a.comms.response.action.obj_investigate_ironveil.text"
    mandatory = false
    targets   = ["world.entity.ironveil_patrol_zone_a.name", "world.entity.ironveil_patrol_zone_b.name"]

  [[comms.response]]
  text = "world.btf_path_a.comms.response.1.text"

    [comms.response.follow_up]
    message = "world.btf_path_a.comms.response.follow_up.message"

      [[comms.response.follow_up.response]]
      text = "world.btf_path_a.comms.response.follow_up.response.0.text"

        [[comms.response.follow_up.response.action]]
        type      = "add_objective"
        id        = "obj-investigate-ironveil"
        text      = "world.btf_path_a.comms.response.follow_up.response.action.obj_investigate_ironveil.text"
        mandatory = false
        targets   = ["world.entity.ironveil_patrol_zone_a.name", "world.entity.ironveil_patrol_zone_b.name"]

[[comms]]
thread_id = "axiom-diplomat"
from    = "world.entity.axiom_station.name"
trigger = "on_destroyed"
entity  = "world.entity.ironveil.name"
urgent  = true
message = "world.btf_path_a.comms.axiom_diplomat.message_2"

  [[comms.response]]
  text = "world.btf_path_a.comms.response.2.text"


entities:
  - component: viewscreen-arbiter
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen Arbiter
      summary: Resolves captain camera selection, cinematic mode, and competing channel-2 system requests into one active viewscreen owner and mode; overlay conflicts are resolved by latest-valid-command recency, not a fixed source ranking.
    architecture:
      kind: arbitration-service
      authority: authoritative
      owns: [viewscreen-resolution-state]
      reads: [inter-system-message-state]
      produces: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/viewscreen.rs, src/core/messages.rs]
      tests: [cargo test]

  - state: viewscreen-resolution-state
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen Resolution State
      summary: The resolved owner and mode for the shared host display, including Captain cameras, Helm and Sensors radar, navigation, Comms, and cinematic presentation.
    architecture:
      classification: authoritative
      owner: viewscreen-arbiter
      writers: [viewscreen-arbiter]
    implementation:
      status: declared
      paths: [src/ship/viewscreen.rs, src/core/messages.rs, src/server/renderer.rs]
      symbols: [ViewscreenResolution, ViewscreenArbiter]

  - component: viewscreen-source-registry
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen Source Registry
      summary: "Maps each viewscreen mode to its owning system for admission authority (Captain camera/cinematic, Helm radar, Sensors radar, Navigation chart, or Comms). It assigns ownership only; it does not rank sources — the arbiter resolves conflicts by recency."
    architecture:
      kind: routing-policy
      authority: authoritative
      reads: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/viewscreen.rs, src/ship/system_registry.rs]
      tests: [cargo test]

  - component: viewscreen-latest-command-policy
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen Latest Command Policy
      summary: Arbiter policy that resolves competing admitted viewscreen requests strictly by recency, regardless of source system, replacing the former fixed source-priority ordering. Each valid request bumps a monotonic sequence and always replaces the active view; toggle-off and captain-camera return are preserved. SetView and ShowOnScreen route through one arbiter method, and comms ShowOnScreen is scheduled after captain SetView so same-tick ordering is deterministic.
    architecture:
      kind: arbitration-policy
      authority: authoritative
      reads: [inter-system-message-state]
      writes: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths:
        - src/ship/viewscreen.rs
        - src/ship/state.rs
        - src/console/captain/server.rs
        - src/console/comms/server.rs
        - src/comms/server.rs
      symbols:
        - apply_channel_2
        - request_view_mode_from
        - show_view_mode
        - handle_set_view
        - handle_show_on_screen
      tests:
        - cargo test

  - component: host-camera-renderer
    core:
      status: implemented
      confidence: confirmed
      title: Host Camera and Viewscreen Renderer
      summary: Renders the resolved camera or system surface, camera markers, cinematic state, world presentation, HUD text, and viewscreen effects on the authoritative host page.
    architecture:
      kind: renderer
      authority: authoritative
      reads: [viewscreen-resolution-state, ship-system-blackboards-state, world-configuration-state]
      renders: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/renderer.rs, src/server/radar.rs, src/server/viewscreen_border.rs]
      tests: [cargo test]

  - component: model-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Model Presentation — HDR, LOD Cross-Fade, Billboard Blending, Arrival
      summary: "How a model reaches the viewscreen and how it leaves it: the camera's high-dynamic-range intermediate target and display transform, the cross-fade window that replaces an LOD tier's same-frame swap, the two-pose blend that replaces a billboard's yaw quantisation, and the arrival effect that covers a mid-mission spawn's asynchronous GLB resolve. Authored in a world's [render] block; registered only under SimPluginOptions::render, so it is digest-neutral by construction."
      rationale:
        - "PRD #1023 module 5. Weapon fire and engine glow are authored at emissive multipliers between 2.5 and 9.0 (src/server/pfx.rs), every one of them above screen white. The viewscreen camera rendered to a low-dynamic-range target, which clips at exactly 1.0, so a torpedo core authored nine times brighter than white was drawn the same flat white as a value of one. HDR is what stops the clamp, and it is the half of the calibration that ships on."
        - "[ai] The display transform is named rather than inherited: tony_mc_mapface, which is both Bevy's own default and the transform its bloom documentation recommends pairing bloom with. It desaturates brights across the spectrum, so an over-white core reads as hot with its colour intact at the edges rather than as a white disc. Pending designer ratification."
        - "[ai] BLOOM IS AUTHORED AND SHIPS OFF, and the reason is a platform fact rather than a taste judgement. Bevy 0.18.1's bloom cannot run on WebGL2, which is what the browser host is (Key Constraint 9). Its downsample chain binds individual mip LEVELS of one texture for sampling, which WebGL2 does not support; bevy_post_process carries a separate-texture-per-mip fallback behind its own `webgl` feature, but bevy_internal's `webgl` feature forwards to eight sub-crates and bevy_post_process is not among them — and enabling that feature directly does not compile, because prepare_bloom_bind_groups reads `bloom_texture.texture.texture.id()` for its bind-group cache key with no cfg while the fallback makes `texture` a Vec. Both facts were read out of the vendored 0.18.1 sources, not inferred. The full calibration is therefore authored, tested and one key away — `[render.bloom] enabled = true` — for a Bevy release that closes the gap, a move to WebGPU, or a native host."
        - "[ai] The bloom prefilter thresholds at exactly 1.0 — screen white, the same number the old target clamped at — with a softness of 0.4 and additive compositing. That is the calibration in one value: what would glow is precisely what the low-dynamic-range pipeline used to throw away, so adopting bloom cannot quietly restyle the hulls, the skybox or the dust. Bevy's own guidance is that a non-zero prefilter wants additive rather than energy-conserving compositing, and the intensity of 0.15 is three times its additive preset's because that preset thresholds well below white and passes far more of the image."
        - "[ai] LOD tiers cross-fade over 0.25 s, and mid-mission arrivals materialise over 0.6 s from a quarter of full size. A cross-fade is meant to be unnoticed; an arrival is meant to be SEEN, since the PRD's complaint is that reinforcements read as a glitch — hence the longer window. Each is disabled by authoring 0, independently of the other. Pending designer ratification against a play session: none of the five effects has been seen by eye, only asserted structurally."
        - "The arrival is gated on the mission already being in progress. At mission start every visual is an entity's first visual, and materialising the whole map at once would be a light show rather than an announcement — the effect exists to cover a REINFORCEMENT's asynchronous GLB resolve. A cross-fade is deliberately not gated: an LOD switch during loading should dissolve exactly as one later will."
        - "A fade drives alpha on a per-visual COPY of each material it touches, never on the material asset. A GLB's materials are shared by every entity drawing that GLB — all 32 rocks of a size class hold the same handles — so writing into them would fade the whole field. An opaque copy fades through AlphaMode::AlphaToCoverage rather than Blend, which keeps the mesh in the opaque pass with depth writes intact so a half-faded hull does not show its own far side through itself; where MSAA is off, coverage degrades to a cutoff and the swap looks like the hard cut it replaced, which is the right way for this to fail."
        - "The outgoing tier of a cross-fade is rescaled by the ratio of the two tiers' parent scales. Both tiers are on screen for the window and the tier scale lives on the ENTITY transform they both hang from, which the incoming tier claims — so an uncorrected outgoing tier would change size while it faded. This preserves the new-scale-lands-with-the-tier invariant the LOD flash fix established rather than reopening it."
        - "Billboards draw TWO coplanar pose quads and dissolve between them. Every shipped atlas packs an eight-view yaw ring, so snapping to the nearest capture is a 45-degree jump in apparent yaw taken in a single frame every time a hull drifts across a tile boundary. The bracketing pair and the weight between them are one pure function, swept round the ring by test so no angle leaves the billboard faded out, doubled up, or indexing past its atlas."
        - "The billboard's quad size, its ring size, and the system that turns it are shared with the standalone model viewer rather than restated there — the viewer showing a size or a pose the game does not is the exact failure the tier-scale repairs had to fix once already. The viewer previewing a billboard tier at all is new: it used to fall back to the full-detail model for a level it could not build, which is why billboard pose snapping and per-level atlas quality shipped unreviewed."
    architecture:
      kind: presentation-layer
      authority: derived
      reads: [world-configuration-state]
      renders: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/render_setup.rs, src/entities/visual_fade.rs, src/entities/billboard.rs, src/server_app.rs, src/server/renderer.rs, src/world/config.rs, src/viewer/lod.rs, src/viewer/subject.rs]
      symbols: [RenderConfig, BloomConfig, RenderTuning, apply_render_config, VisualFade, drive_visual_fades, retire_lod_visual, yaw_blend, billboard_quad_size, orient_lod_billboards]
      # The viewer half of this runs under `--features viewer`, which NO CI job
      # executes: `cargo test` and the test job's `--all-features` clippy both
      # COMPILE it, but the viewer's own tests are run only by a developer
      # typing the second command below. That gap is why the billboard-preview
      # test in src/viewer/lod.rs went stale rather than red for a whole
      # release — it asserted a far level was a procedural sphere long after
      # the imposter atlases replaced it.
      tests: [cargo test, cargo test --features viewer]

  - component: viewscreen-hud-effects
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen HUD and Alert Effects
      summary: Presents shield flash, camera shake, lobby state, compass labels, and Red Alert visual treatment around the host viewscreen.
    architecture:
      kind: presentation-layer
      authority: derived
      reads: [viewscreen-resolution-state, shield-status-blackboard-state]
      renders: [viewscreen-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/viewscreen_border.rs, src/core/messages.rs]

  - component: debug-overlay-controller
    core:
      status: implemented
      confidence: confirmed
      title: Debug Overlay Controller
      summary: Maintains host-local diagnostic toggles for regions, modifier overlay, damage, entities, and entity inspection, plus the bounded damage log used by diagnostics.
    architecture:
      kind: diagnostic-service
      authority: host-local
      owns: [debug-overlay-state]
      produces: [debug-overlay-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/debug_overlay.rs]
      tests: [cargo test]

  - state: debug-overlay-state
    core:
      status: implemented
      confidence: confirmed
      title: Debug Overlay State
      summary: Host-local diagnostic-toggle and damage-log state. It is not replicated to phone clients and does not itself alter gameplay.
    architecture:
      classification: local
      owner: debug-overlay-controller
      writers: [debug-overlay-controller]
    implementation:
      status: declared
      paths: [src/debug_overlay.rs]

  - component: host-debug-simulation-controls
    core:
      status: implemented
      confidence: confirmed
      title: Host Debug Simulation Controls
      summary: Server-page controls that pause the simulation, make the local ship invulnerable, or apply instagib damage. They remain available in normal builds. Since issue #940 a connected phone reaches the same pause and god mode through client-debug-control-route, under its own session identity rather than under host authority.
    architecture:
      kind: host-debug-control
      authority: authoritative
      owns: [host-debug-simulation-override-state]
      writes: [game-phase-state, authoritative-damage-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [server.html, gui/server-settings.js, src/server/bridge.rs, src/server_app.rs]
      # Since issue #939 these are driven from the host settings cog's
      # Debug/Cheat tab, not a loose toolbar in the debug dock. Pause is the
      # odd one out: it moved to the cog's Gameplay tab, which is NOT gated on
      # PHOENIX_DEMO_BUILD, hence the un-prefixed `wasm_toggle_pause`.
      symbols: [wasm_toggle_pause, wasm_toggle_god_mode, wasm_toggle_instagib]
      tests: [cargo test, npx vitest run tests/client/server-settings.test.js]

  - state: host-debug-simulation-override-state
    core:
      status: implemented
      confidence: confirmed
      title: Host Debug Simulation Override State
      summary: Host-owned active pause, god-mode, and instagib settings that directly affect the current authoritative simulation without client replication.
    architecture:
      classification: authoritative
      owner: host-debug-simulation-controls
      writers: [host-debug-simulation-controls]
    implementation:
      status: declared
      paths: [src/server/bridge.rs, src/debug_overlay.rs, src/server_app.rs]
      # Instagib has no typed resource: INSTAGIB is a raw `thread_local!<bool>`
      # in src/server/bridge.rs, read by is_instagib(). Pause and god mode are
      # real Bevy resources; recorded together with an honest note on the
      # third.
      #
      # Pause is `SimulationPaused` (renamed from `DebugPaused` in issue #939):
      # the host settings menu exposes it on the NOT-build-gated Gameplay tab,
      # so it outlives the Debug/Cheat tab in the demo build and is no longer
      # a debug-only concept.
      symbols: [SimulationPaused, GodMode, is_instagib]

  - component: client-debug-control-route
    core:
      status: implemented
      confidence: confirmed
      title: Client Debug Control Route
      summary: The host-side gate that lets a connected phone's settings menu reach the debug overlays, pause, and god mode. It admits a remote session token in its own right rather than by claiming the reserved local-console token, and all three of its routes are compiled out of a demo build.
      rationale:
        - "A phone has no wasm_* exports to call, and neither path it does have would let it through: cheats are admitted only for the reserved local-console token, and god-mode is declared by no ship TOML so ordinary station tenure resolves no owning station."
        - "God mode and the overlay flags split deliberately. God mode changes damage outcomes, so it stays a ControlSystem on the command-admission path where it is tick-stamped, logged and replayable (issue #900); the overlay flags are presentation and take the frame-driven PreUpdate route instead."
        - "[ai] Pause is a third route, not a fourth overlay flag. It is authoritative state rather than presentation, it cannot cross command admission at all because pausing starves the FixedUpdate schedule admission runs in, and it needs a build gate independent of the diagnostics because a demo player freezing everyone's mission is an authority problem rather than a diagnostics one."
        - "Build-gated with #[cfg], not an if: a hidden control is a UI fact and UI facts are forgeable, so the demo build contains no route to reach. The two session messages are gated at the variant, so a demo host cannot decode the frame; god mode is gated at the admission branch, because its message exists in every build. build.rs derives the phoenix_demo_build cfg from the same PHOENIX_DEMO_BUILD that build_flags reads back through option_env!, and the two answers are pinned to each other."
        - "[ai] The read-back is deliberately NOT gated. DebugState reports the flags, the pause and god mode in every build, because reporting grants no authority - a demo phone may learn that the host paused the mission and still have no way to pause it itself."
    architecture:
      kind: admission-policy
      authority: authoritative
      validates: [system-control-command]
      writes: [host-debug-simulation-override-state, debug-overlay-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/command_admission/debug_route.rs, src/command_admission/policy.rs, src/debug_overlay.rs, src/build_flags.rs, src/demo_build_value.rs, build.rs, gui/settings-panel.js]
      symbols: [admits_debug_command, is_demo_build, admitted_flag_toggles, admitted_pause_toggles, drain_client_pause]
      tests: [cargo test, npx vitest run tests/client/settings-panel.test.js]

  - component: host-debug-waypoint-teleport
    core:
      status: implemented
      confidence: confirmed
      title: Host Debug Waypoint Teleport
      summary: Server-page Debug action that is enabled only when the authoritative shared Navigation waypoint exists and immediately places the local ship at that waypoint.
    architecture:
      kind: host-debug-control
      authority: authoritative
      reads: [navigation-waypoint-state]
      writes: [authoritative-ship-motion-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [server.html, src/server/bridge.rs, src/console/navigation/mod.rs, src/ship/state.rs]
      symbols: [wasm_teleport_to_waypoint, wasm_has_navigation_waypoint, drain_teleport_to_waypoint]
      tests: [cargo test]

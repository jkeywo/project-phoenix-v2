  - component: gm-t3-typed-inverse-actions
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Typed Inverse GM Actions for Doctrine and Faction Relations
      summary: "A GM may reverse another operator's eligible action through a typed UndoGmAction, admitted, ordered and recorded by the ONE canonical journal like any other GM action. Two families are reversible: authored NPC doctrine, and faction hostility through a new narrowly typed attributed adapter (SetFactionHostility) over the existing add_enemy/remove_enemy vocabulary. An Applied action of either family records the EXACT affected field with its before and after values on its own LoggedGmAction. The inverse carries the original's public identity plus those recorded facts; at the canonical apply tick the reducer re-checks the identity, the recorded pair, whether an inverse already exists, and the LIVE value of that one field, refusing an intervening conflicting change while allowing every unrelated change. Both operators appear on one saved history: the undoing GM as the inverse row's operator, the original GM on its undo_of reference. The original entry is never rewritten — it is reported as inverted."
      rationale:
        - "[ai] Issue #1442 (PRD #1420 M5 stories 2, 3 and 6), carrying PRD #1418's usability contract. An inverse is an ordinary journal grant rather than a local edit, so idempotency, ordering, cross-peer agreement, snapshot capture and replay all fall out of the existing GmActionJournal contract instead of needing a second mechanism."
        - "[ai] The affected fact is per-FIELD, not a state blob: revalidation must refuse a conflicting change to that one field while allowing every unrelated change to the same entity, and a blob comparison could not tell those apart. It is recorded only on an Applied fact of a reversible family, because that is the only case in which a true pair exists — a No-op changed nothing and a Refusal never ran."
        - "[ai] The request echoes the recorded pair back verbatim. Comparing it against the canonical fact is what refuses a request built on a stale or rewound reading, and the surface never rebuilds the value."
        - "[ai] Refusals are separately named — unknown-gm-action, inverse-unsupported, inverse-facts-mismatch, affected-state-changed, already-inverted, unknown-faction — because \"undo failed\" is not an answer a live GM can act on. Two GMs racing to undo one action get one undo and one truthful refusal; an exact retry of one inverse is the same canonical grant, not a second one."
        - "[ai] Faction relations needed a GM adapter, not raw editing: SetFactionHostility names two authored faction reference names, resolves them against the live FactionRegistry at the apply tick, and runs the same add_enemy/remove_enemy calls the add_faction_enemy trigger action does. GmFactionOverrides records which pairs a GM moved and what each held before any GM touched it — the registry is rebuilt from assets/factions on load, so without that record a save would restore a world the journal still calls Applied. It is folded into the digest ONLY once a GM has moved a relation, so a run that never uses the surface keeps its previous digest, and trigger-driven changes stay unrecorded content."
        - "[ai] SNAPSHOT_FORMAT bumped 33 -> 34. Unlike the additive fields that argue their way out of a bump, no content-digest argument rescues this one: a GM faction decision moves the world without moving any authored file."
        - "[ai] Withdrawing a hostility strands AI tactical locks, because ai_target_selection's retention tier never re-asks whether its target is still an enemy. The canonical reducer runs in PreUpdate and already borrows components that conflict with the lock query, so it arms GmFactionOverrides::revalidation_pending and revalidate_gm_faction_locks — ordered immediately before ai_target_selection, the other writer of that lock — consumes it. The flag is durable so a capture taken between the two schedules does not restore a stranded lock."
        - "[ai] The identity of an original is (operator, correlation, sequence) at EVERY site that names one: the precheck that finds it, the already-inverted guard, and the derived inverted flag the journal panel hides its Undo control on. A correlation is scoped to the operator that minted it, so matching on the bare string would let one GM's undo mark another operator's same-named action as reversed — hiding a control over an action nothing had touched."
        - "[ai] An undo is not itself reversible. The surface already declines to offer the control over an action-undo row, and the reducer refuses the request with inverse-unsupported so a stale page or a replaying peer cannot walk a chain of reversals no GM was ever offered. Append-only discipline: to put back what an undo undid, ask for the change again as its own attributed action, leaving both steps on the one saved journal."
        - "[ai] The two families name themselves in the SHARED activity feed as well as the journal: GmActivityAction::SetFactionHostility and ::UndoGmAction, with the undo naming the operator whose action it reversed beside its own. Without their own arms in the projection they fell through to the session-pause sentence, and the shared feed is exactly where an attributed sentence about a colleague has to be true."
        - "[ai] Per PRD #1418 stories 29 and 30: the Undo control is hidden rather than disabled when no inverse can run, the eligibility sentence says why, and the before/after/technical/already-witnessed sentences render in the journal detail region under EVERY confirmation policy — including immediate — so configuring the step away never removes inspectable consequences. action.undo defaults to confirm-preview and faction.relation to confirm; both are centrally registered categories."
    architecture:
      kind: gm-authoritative-action
      authority: authoritative
      coordinates: [gm-milestone-operations-safety, gm-t3-saved-action-history]
      reads: [world-snapshot-artifact]
      writes: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/gm_faction.rs, src/gm_action.rs, src/gm_npc.rs, src/gm_journal.rs, src/gm_activity.rs, src/snapshot.rs, src/sim_digest.rs, src/ship_plugin.rs, src/sim_sets/order.rs, src/core/codec.rs, gui/gm-faction-panel.js, gui/gm-journal-panel.js, gui/gm-inverse-preview.js, gui/gm-confirmation.js, gui/gm-action-reasons.js, gui/gm-workspace.js, gui/gm-activity-feed.js, server.html, assets/strings/strings.csv]
      symbols: [UndoGmAction, SetFactionHostility, GmAffectedField, GmUndoReference, undo_precheck, GmFactionOverrides, GmFactionRelationOverride, GmFactionControl, revalidate_gm_faction_locks, restore_overrides, faction_rows, NpcDoctrineControl::revert, applied_doctrine, createGmFactionPanel, gmJournalEntryIsUndoable, gmAffectedFieldText, GM_UNDO_CONFIRMATION, GM_FACTION_CONFIRMATION]

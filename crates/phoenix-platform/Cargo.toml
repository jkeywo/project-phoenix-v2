[package]
name = "phoenix-platform"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
ultralight = ["surface", "vellum-ultralight/ultralight"]
surface = ["dep:vellum-ultralight"]
render = ["surface", "dep:bevy"]
audio = ["dep:symphonia"]

[dependencies]
vellum-ultralight = { workspace = true, optional = true }
bevy = { version = "0.18.1", optional = true, default-features = false, features = ["std", "bevy_render", "bevy_image", "bevy_asset", "bevy_log"] }
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1.0.149"

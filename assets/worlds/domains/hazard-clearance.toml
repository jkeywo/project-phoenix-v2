# Actual independent hazard and clearance, using the existing physical/radio owners.
# All duration/attention values are provisional author estimates.
[domain]
format=1
id="hazard-clearance"
exports=["stabilise-and-clear"]
requires=["communication_report_status","repair_internal"]
[[task]]
kind="compound"
id="stabilise-and-clear"
parameters=[{name="actor",kind="actor"}]
[[task.method]]
id="hazard-and-clearance"
step=[{id="hazard",task="restore-engineering",arguments={actor={source="parameter",name="actor"}}},{id="permission",task="request-status",arguments={actor={source="parameter",name="actor"}}}]
[[task]]
kind="primitive"
id="request-status"
parameters=[{name="actor",kind="actor"}]
definition="status"
[task.forecast]
min_secs=2
max_secs=10
recovery_secs=1
phase=[{kind="active",offset_secs=0,duration_secs=4,attention_permille=1000},{kind="monitor",offset_secs=4,duration_secs=6,attention_permille=250}]
[task.request]
kind="communication"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="comms"}}
recipient={source="literal",value={kind="actor",value="status-reporter"}}
channel="public"
request="report_status"
[[task]]
kind="primitive"
id="restore-engineering"
parameters=[{name="actor",kind="actor"}]
definition="restoration"
[task.forecast]
min_secs=6
max_secs=12
recovery_secs=1
phase=[{kind="active",offset_secs=0,duration_secs=4,attention_permille=1000},{kind="monitor",offset_secs=4,duration_secs=8,attention_permille=250}]
[task.request]
kind="repair"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="repair"}}
team={source="literal",value={kind="team",value=0}}
request={source="literal",value={kind="repair_request",value={type="Work",data={kind="compartment",compartment="engineering"}}}}
target={source="literal",value={kind="repair_target",value={kind="compartment",compartment="engineering"}}}
goal={source="literal",value={kind="repair_goal",value="structure"}}
[[situation_definition]]
id="status"
initial="reported"
[[situation_definition.state]]
id="reported"
when={kind="communication_reported"}
call={script="tests/fixtures/hazard-clearance-world.toml#script.setup",function="grant_clearance"}
next="clearance"
[[situation_definition.state]]
id="clearance"
when={kind="scenario_applied",state="reported"}
call={script="tests/fixtures/hazard-clearance-world.toml#script.setup",function="credit_clearance"}
[[situation_definition]]
id="restoration"
initial="achieved"
[[situation_definition.state]]
id="achieved"
when={kind="achieved"}

call={script="tests/fixtures/hazard-clearance-world.toml#script.setup",function="credit_hazard"}

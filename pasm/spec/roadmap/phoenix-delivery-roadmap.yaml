entities:
  - component: phoenix-delivery-sequence
    core:
      status: accepted
      confidence: confirmed
      title: Phoenix Demo and Post-Demo Delivery
      summary: "The demo critical path front-loads deterministic simulation (#849), completed composable entity templates (#869), and Backfill combat symmetry (#870) before Combat Test doctrine closure (#774), measured readiness (#868 and #850), the snapshot tracer (#848/#862), and the deliberately narrow limited release (#853/#931): Combat Test only, Alliance Destroyer only. Post-demo delivery runs through release A and then two parallel tracks (2026-08-20 restructure of the former A2/B-I ladder): a CONTENT track C1-C9 of scenarios, ships and the features they need, and a TECHNICAL track T1-T6 of networking, GM console, Workshop/modding, architecture and debug work. A ships Falling Skyway and delivery/content foundations. C1 pairs the cruiser with the Falling Skyway AI-backfill completion; C2-C5 deliver the Thin Margin campaign and progressively deeper simulation; C6 adds an authored Patrol MVP; C7 adds an authored War MVP and personnel operations; C8 procedurally generates Patrol and War and adds Orbital Mode; C9 adds Sandbox and persistent sector/economy state. T1 carries the Bridge Foundations pair (crew control, Phoenix networking/native Windows), debug observability and the defect backlog; T2-T4 pull the GM console and Workshop/modding investment ahead of the multi-ship host mesh (T5), with GM campaign continuity closing in T6. Accessibility and polish advance with every content release."
      rationale:
        - Completed work already supplies the balance harness (#835), baseline player Backfill doctrine (#842), scenario catalogue and QR flow (#754-#756), legacy save/load tracer bullets (#431-#435), native scenario hosting (#420), and mod-pack export/overlay plumbing (#759-#760).
        - Determinism, authored composition, and player/NPC Backfill symmetry are foundational game contracts; settling them before Combat Test balance avoids tuning a model that will immediately change.
        - Snapshot and performance contracts start before the demo so later scenario work does not create incompatible state or unmeasured release risk, but their complete product surfaces do not block the first public release.
        - "Falling Skyway moved after the demo by the 2026-07-31 scope decision recorded on #853: the first public build is Combat Test and one hull, so the scenario is release A's content rather than a release gate."
    architecture:
      kind: roadmap-sequence
      authority: non-authoritative
      coordinates:
        - roadmap-completed-demo-baseline
        - roadmap-deterministic-simulation-foundation
        - roadmap-composable-entity-templates
        - roadmap-backfill-combat-symmetry
        - roadmap-current-combat-doctrine
        - roadmap-demo-readiness
        - roadmap-snapshot-contract-tracer
        - roadmap-demo-release
        - post-demo-release-bands
        - roadmap-band-a2-crew-control
        - roadmap-band-a2-native-network-foundation
        - roadmap-band-a2-falling-skyway-ai-backfill
        - roadmap-debug-observability
        - roadmap-scenario-scripting
        - roadmap-falling-skyway-foundation
        - roadmap-falling-skyway-content
        - roadmap-native-and-cloud-delivery
        - roadmap-mod-content-packs
        - roadmap-authoritative-snapshots
        - roadmap-post-demo-readiness
        - roadmap-p2p-multiship-delivery
        - roadmap-borrowed-sun-foundation
        - roadmap-borrowed-sun-content
        - roadmap-gm-console
        - roadmap-narrow-season-foundation
        - roadmap-narrow-season-content
        - roadmap-broken-tithe-foundation
        - roadmap-broken-tithe-content
        - roadmap-silent-corridor-content
        - roadmap-patrol-mode
        - roadmap-war-mode-mvp
        - roadmap-patrol-war-pcg

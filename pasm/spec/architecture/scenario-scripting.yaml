  - component: commitment-vocabulary
    core:
      status: implemented
      confidence: confirmed
      title: Commitments — Recording a Promise, Settling It, and Gating on It
      summary: "Issue #1029 (parent #851, Falling Skyway). The captain makes promises, and a promise is a RUNTIME artifact: there is no `[[commitment]]` block, because whether one exists at all depends on what the player chose to say. Script records and settles them through `ctx.commitments` — `record(#{id, made_to, terms, resolves_when})`, `keep(id)`, `break_promise(id)`, and `state(id)` returning `open`/`kept`/`broken`/`unknown`. Resolution writes a campaign flag (`commitment.<id>.kept` / `.broken`) as an ordinary `MutateFlag` on the call's shared effect sink, so an `on_flag_set` trigger authored against it chains through the trigger pipeline that already existed. The LIVE CONSUMER shipped in the same slice is a dialogue option: a node fn's `responses` array is built with an ordinary `if` over `ctx.commitments.state(…)`, so an option can exist only because a promise was made — and stop existing once it is spent."
      rationale:
        - "Gating is ordinary control flow, and no `when:` field is added to a dialogue response. A `ScriptDialogueResponse` is a `text` and an `on_pick`, and a node fn is a FUNCTION — so 'this option appears only if the captain promised' is an `if` around a `push`, in the language the author is already writing. A declarative predicate would need its own expression grammar, its own evaluator and its own load-time lint to say what Rhai already says in one line, and it would say it for dialogue options only."
        - "`record` takes a map rather than four positional strings, matching `ctx.effects.open_comms(#{…})`: the fields are named at the call site, which is what stops `made_to` and `terms` being silently swapped by an author reading their own scenario rather than the host source."
        - "Duplicate ids RAISE rather than overwrite or no-op, per AC1. Overwriting discards terms the crew were actually given; ignoring the second record leaves the mission believing it made a promise whose terms are somebody else's. Raising is what makes the refusal honest, because settled decision 10 drops the call's whole buffer rather than leaving half a negotiation applied. A scenario that can reach the same promise twice guards it with `state(id) == \"unknown\"`, which is one line and is one line the author has to have thought about."
        - "`break_promise`, not `break`: the latter is a Rhai keyword (`(\"break\", Token::Break)` in `rhai::tokenizer`), so `ctx.commitments.break(\"x\")` is a parse error rather than a method call. The asymmetry with `keep` is preferred to renaming BOTH halves away from the `kept`/`broken` words the ledger itself uses."
        - "`Commitments` follows `Deadlines`' snapshot-plus-buffer shape rather than inventing one: a per-call snapshot of the live ledger, mutated in place so a `state` read AFTER a `keep` in the same call sees the promise settled, with the mutations recorded separately for the host to replay. The snapshot's answer is also what decides whether a campaign flag is emitted, so a second `keep` of an already-kept promise writes nothing — the same no-op the live ledger reaches when the adapter replays it."
        - "Mutations drain as a SIXTH `CallEffects` field for `deadline_changes`' reason: the generic action applier holds no handle on the ledger, and a promise is not an `ActionCmd`. The campaign flag is the deliberate exception — THAT half IS an `ActionCmd`, pushed onto the same ordered sink `ctx.flags.x = 1` uses, so it lands where the author put it and needs no new applier at all. `apply_commitment_changes` is correspondingly smaller than its deadline twin: no queue to edit, nothing to retract."
        - "A commitment carries no due time and no `deadline_id`. A promise-by-time is authored as a `[[deadline]]` whose handler settles it — four lines of ordinary script over the table that already owns the one queued call. See `commitment-ledger-state` for why that composition is a rule rather than a convenience."
    architecture:
      kind: domain-model
      authority: authoritative
      owns: [commitment-ledger-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: observed
      paths:
        - src/world/commitments.rs
        - src/world/script/commitments.rs
        - src/world/script/engine.rs
        - src/world/script/schedule.rs
        - src/world/script/comms.rs
        - src/world/server.rs
        - src/comms/scripted.rs
        - src/console/comms/server.rs
        - assets/worlds/probe_commitments.toml
      symbols:
        - Commitments
        - register_commitments
        - apply_commitment_changes
        - CommitmentChange
        - CommitmentMutation
        - CommitmentOutcome
        - kept_flag
        - broken_flag
      tests: [cargo test, "cargo test --features headless --test headless_runner a_promise_gates"]
    evidence:
      - kind: test
        reference: "tests/headless_runner.rs::a_promise_gates_a_dialogue_option_and_its_resolution_writes_a_campaign_flag"
        summary: "`probe_commitments.toml` driven for fifteen mission seconds. ONE authored dialogue node fn is opened TWICE through the real `open_comms` pipeline: while `safe_passage` is owed it offers the response that exists only because the captain gave their word, and once it is kept that response is gone — asserted against `CommsRuntime::active_dialogues`, the node the comms pipeline actually built, rather than against anything the script says about itself. Keeping the promise writes `commitment.safe_passage.kept` and an `on_flag_set` trigger fires off it a tick later; the promise nobody kept is broken by a `[[deadline]]` handler."
      - kind: test
        reference: "src/comms/scripted.rs::a_player_pick_records_a_promise_that_unlocks_a_later_dialogue_option"
        summary: "The player-driven half the probe cannot reach: four real `RespondToMessage` picks through the live Input chain, where the promise is recorded by a player's choice and the option it unlocks is offered by a node fn running on a LATER tick against the LIVE ledger — not against the snapshot the recording handler mutated."

  - state: commitment-ledger-state
    core:
      status: implemented
      confidence: confirmed
      title: Commitment Ledger State
      summary: "Every promise a run has made, oldest first: a stable id, the party it was made to, a strings.csv id for the terms, a strings.csv id stating what would count as keeping it, open/kept/broken, and the `SimTick` at both ends. Held as a `CommitmentLedger` FIELD on `WorldContentRuntime`, beside the deadline table — so the slice registers no new component or resource. See the `RawWorldSource`/`WorldScriptRuntime` baseline note in tests/authoritative_state_enumeration.rs, which accounts for it."
      rationale:
        - "IT IS NOT A SCHEDULER AND IT IS NOT AN EVALUATOR, and both halves are rules rather than omissions. A commitment stores no due time: a promise-by-time is a `[[deadline]]` whose handler calls `break_promise`, so the deadline table owns the queued call and the ledger owns the record. A private `due_tick` would be a third deferred-work queue in a codebase that has decided it will have exactly two, and it would need a per-tick scan to notice its own expiry — precisely what #1024 refused to add. There is deliberately not even a `deadline_id` cross-reference: the pairing is stated once, in the handler, and a field here would invite a reader to believe the ledger enforces something it does not."
        - "`resolves_when` is DECLARED, never evaluated. Nothing polls it and no system this slice adds scans the ledger for promises that have quietly come good. It exists so the bargain is data — the half a UI shows under the terms, and the half an author writes down so the scenario's intent survives a later editor — while script resolves at the beat where the fiction says the promise was tested."
        - "THREE STATES, NEVER TWO. `Open` and `Broken` are separate because 'not yet' and 'failed' are different facts about the captain, and a mission that folds them together cannot tell an unfinished errand from a betrayal. `state_of` adds a fourth answer, `unknown`, for a promise that was never made — which is not a curiosity but the load-bearing guard: it is what a scenario tests before recording a duplicate, and in the probe world it is what offers the word in the first place."
        - "`made_to` is stored as the script wrote it and is NOT resolved to a UUID. A promise is made to a PARTY, not to an entity handle: the ship you gave your word to can be destroyed, jump out, or never have been a single hull at all (`skyway_strike_committee`), and the promise outlives all three. A resolved handle would make the ledger's memory shorter than the fiction's — and it is what would force a record to be buffered through a name-resolving applier, which a pure module cannot be."
        - "WHAT THE LEDGER HOLDS IS THE ACCOUNT. Every field is something that was actually promised; there is no 'real terms versus stated terms' pair and no hidden field. A scenario in which the crew are misled about what they agreed to authors the misleading line as its own dialogue content, exactly as `InfrastructureSnapshot` refuses a reported-versus-actual pair. That is what makes the whole record safe to hand to a later UI: inspecting it cannot reveal anything the crew were not already told, which is issue #1029's AC6."
        - "Records are an ordered `Vec` rather than a map, for the reason `PendingCallbacks` is: the order is the order the captain gave their word, it is the order a debrief reads them in, and a `HashMap`'s iteration order must never reach a payload or a fold."
        - "Duplicate ids are refused in the pure module (`DuplicateCommitment`) and re-resolution is a no-op. The first resolution is the one that happened; re-writing it would let a late-firing handler quietly convert a kept promise into a broken one."
        - "AUTHORITATIVE BUT NOT FOLDED, exactly like `FlagStore`, `ObjectiveManager` and `DeadlineTable`: `state_digest` does not walk it. It is a record over script state that is itself unfolded, and folding one member of that family would give the digest a partial view of scenario state while moving no existing world's digest in a way that means anything. The property that matters — two peers reaching the same promise on the same tick — is already carried by the tick-keyed script calls that write it."
    architecture:
      classification: authoritative
      owner: commitment-vocabulary
      writers: [commitment-vocabulary]
    implementation:
      status: observed
      # `src/snapshot.rs` is deliberately NOT listed, for the reason
      # `mission-deadline-state` omits it: it is a whole-payload module whose own
      # imports the scanner would attribute wholesale to this entity. The
      # persistence (`ScenarioState::commitments`, and the 5 → 6 `SNAPSHOT_FORMAT`
      # bump the evidence below records) is traced through the evidence instead.
      paths:
        - src/world/commitments.rs
        - src/world/server.rs
      symbols:
        - CommitmentLedger
        - Commitment
        - CommitmentState
        - DuplicateCommitment
        - WorldContentRuntime
      tests: [cargo test, "cargo test --features headless --test snapshot_resume a_kept_promise"]
    evidence:
      - kind: test
        reference: "src/world/commitments.rs tests; tests/snapshot_resume.rs"
        summary: "The pure ledger's record/query/resolve-kept/resolve-broken behaviour without Bevy, including the duplicate refusal, the re-resolution no-op, and open/kept/broken/unknown never collapsing into each other; plus the save round-trip. `SNAPSHOT_FORMAT` moved 5 → 6, and here the content digest could NOT stand in for it: a promise is a runtime artifact, so an older save of the SAME world file carries the same content digest and nothing else would refuse it. Restoring it resumes a captain who has promised nothing — a plausible state rather than an obviously missing one, which is what would let a resumed scenario re-offer a word already given."

  - component: workforce-vocabulary
    core:
      status: implemented
      confidence: confirmed
      title: The Workforce — Who Staffs a Structure, and What a Stoppage Does to the Work
      summary: "Issue #1035 (parent #852, Falling Skyway). A skyhook is not a machine that runs itself: somebody authorises the pump and somebody rides the climber down with a torch. A world declares the sides of a labour dispute in `[[workforce]]` blocks (id, `strings.csv` label, `on_strike`, `disposition` on an authored 0..=100 scale); a structure names the side that staffs it on its own `[infrastructure] workforce = \"…\"`; and script moves a side through `ctx.effects.call_strike(id)` / `settle_strike(id)` / `set_workforce_disposition(id, n)`. What a stoppage DOES to a piece of work is authored per verb on the operating hull's `[[operations.capability.interrupt]]` with `cause = \"work_stoppage\"` — `response = \"fail\"` refuses a transfer nobody will sign off, `response = \"slow\"` with a `rate_percent` stretches a repair the local crews have walked away from — so the same authored cause produces a refusal for one verb and a slower job for another with neither meaning anywhere in Rust."
      rationale:
        - "IT IS NOT A FACTION AND IT IS NOT A SECOND ONE. `FactionConfig` answers who shoots whom; a workforce answers who turns up for work. The Skyway workers and the operator that employs them are both Federation, neither will ever fire on the other, and the whole crisis is between them — folding a strike into the enemies list would have made 'the line is down' mean 'the depot is hostile' on every console that reads a faction. A party that is both (the strike committee is a hull with a faction AND a side in the dispute) carries one of each."
        - "THE STOPPAGE JOINS THE #1027 INTERRUPT VOCABULARY RATHER THAN THE ELIGIBILITY LADDER, and that is the whole reason both bites are authorable. Eligibility is uniform across verbs: a stoppage placed there would have forced ONE answer on transfers and repairs alike. As an `InterruptCause` it is the first that is a fact about the far end rather than about the operator, and the capability says what it means — which is a designer's judgement about the fiction, not a property of the word strike."
        - "REVERSIBILITY IS FREE BECAUSE NOTHING LATCHES. Settling a side stops the rule firing on the next tick: the repair rate returns to full and the depot takes a delivery, with no restoration path anywhere to write, to test, or to forget. The register holds the fact; the capability holds the consequence; and there is no third place holding a memory of the consequence."
        - "Three verbs rather than one setter, for the reason `repair_infrastructure`/`damage_infrastructure` are two: the direction lives in the name, so a scenario cannot end a strike by getting a boolean the wrong way round. Each pushes TWO commands on the call's shared ordered buffer — the register move, then the mirror flag — so the flag gets its `FlagSet`/`FlagCleared` transition from the one path that emits them and an `on_flag_cleared` trigger chains off a settlement without this vocabulary knowing triggers exist."
        - "A settlement is an ordinary `ActionCmd` (`SetWorkforceState`) rather than a seventh `CallEffects` field, which is where it differs from `commitment_changes`. The applier already holds the runtime the register lives on and a workforce is a PARTY rather than an entity, so there is nothing to resolve and nothing to queue — no buffered-change plumbing was needed and none was added."
        - "The `workforce` a structure names is deliberately NOT cross-checked against the world's `[[workforce]]` table at load. The same depot template ships in five scenarios and only one of them has a strike, so 'this world has never heard of those people' honestly means work there carries on — and a template that could not name a side it might one day be in dispute with would have to be forked per mission."
        - "The refusal reaches the crew as `operation.refused.work_stopped` on the operations blackboard — the SAME field a `TargetGone` or a `CapacityUnavailable` travels on, resolved through `t()` by the panel that already existed. No parallel channel, no new wire field, and the console renders it because it renders every refusal."
    architecture:
      kind: domain-model
      authority: authoritative
      owns: [workforce-register-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: observed
      paths:
        - src/world/workforce.rs
        - src/world/config.rs
        - src/world/dispatch.rs
        - src/world/server.rs
        - src/world/script/effects.rs
        - src/infrastructure/condition.rs
        - src/operations/hold.rs
        - src/operations/server.rs
        - assets/worlds/probe_strike_min.toml
        - assets/worlds/falling_skyway.toml
        - assets/entities/alliance_destroyer.toml
      symbols:
        - Workforce
        - WorkforceMutation
        - FlagMirror
        - strike_flag
        - disposition_flag
        - arm_mission_workforces
        - InterruptCause
        - Ineligibility
        - OperationConditions
        - InfrastructureConfig
      tests: [cargo test, "cargo test --features headless --test snapshot_resume a_settled_strike_stays_settled"]
    evidence:
      - kind: test
        reference: "tests/snapshot_resume.rs::a_settled_strike_stays_settled_across_a_resume"
        summary: "`probe_strike_min.toml` (the operations-free #1164 successor to `probe_strike`): a workforce register arms two sides from `[[workforce]]` - `probe_workers` OUT at a low disposition, `probe_operator` at work - and mirrors each into the ordinary flag store. At t=10 s a handler sets a world flag, `on_flag_set` chains, `ctx.effects.settle_strike` runs and moves the disposition, and the settlement survives a capture-and-resume unchanged. The `work_stopped`/`slow` operation consequences the register used to drive are the per-system slices ground now, plus Falling Skyway own strike test."
      - kind: test
        reference: "tests/headless_runner.rs::the_strike_no_longer_throttles_the_crews_external_work"
        summary: "The same two bites in the scenario rather than in a probe, met by the crew's own hull. A transfer stood up alongside Ladder Depot B — in range, powered, eligible on every count — comes back `Failed(WorkStopped)` with its `strings.csv` reason; a field-repair on the head runs at the 35% the destroyer's capability authors; and the identical repair on Ladder Depot A, staffed by people who did not walk out, runs at full rate on the same tick. Falling Skyway's digest is UNCHANGED by the slice (0x14d6dc5dcf05a3c1), which is the claim that the register, the authored `workforce` and an unused capability table are all outside the fold."

  - state: workforce-register-state
    core:
      status: implemented
      confidence: confirmed
      title: Workforce Register State
      summary: "Every side of a world's labour dispute, in authored order: a stable id, a `strings.csv` label, whether they are out right now, and what they make of the crew on an authored 0..=100 scale — plus an `armed` latch. Held as a `WorkforceRegister` FIELD on `WorldContentRuntime`, beside the commitments ledger and the deadline table, so the slice registers no new component or resource. Armed once by `arm_mission_workforces` from the world's `[[workforce]]` blocks, on the same tick the deadline table is armed; after that it moves only when a script says so."
      rationale:
        - "THE OPENING STATE IS AUTHORED, NOT SCRIPTED ON TICK ONE, for the reason a skyhook's 48 starting points are: the crew arrive INTO a situation that was already happening, and a world that had to script its own opening state would be describing a change nobody was there for. `arm_mission_workforces` therefore writes the mirror flags straight into the store rather than through the trigger pipeline — a transition event on tick one would announce 'the strike just started' for a strike the crew flew into, and fire every trigger authored to watch for its opposite. The same reading `InfrastructureState::from_config` takes when it level-evaluates a degraded structure's thresholds."
        - "IT IS A RECORD AND IT DECIDES NOTHING. Nothing in the module knows what a transfer is, what a repair rate is, or that operations exist; it holds two facts per side and hands them to whoever asks. `apply` returns the mirror-flag write its caller must make rather than performing it, because a pure record that reached for the world's flags would be the second thing that owns them and flag transitions are the trigger pipeline's to emit."
        - "An unknown id reads as AT WORK rather than as an error. That is the load-bearing default: an entity template may name a workforce a given world has no dispute about, and the honest reading of 'this world has never heard of those people' is that work there carries on."
        - "Status and disposition move independently, through separate mutations. A side can go back to work still resenting the crew, and can walk out while thinking well of them; folding the two into one number would make both unsayable, and the negotiation (#1036) needs to be able to say each."
        - "Disposition is an absolute set, clamped, rather than a delta: a negotiation's outcome is a POSITION — 'they will work with you now' — and two beats that each nudged by five would compose into a number no author chose."
        - "Records are an ordered `Vec` rather than a map, for `CommitmentLedger`'s reason: the order is the world file's, it is the order a debrief reads them in, and a `HashMap`'s iteration order must never reach a payload or a fold."
        - "AUTHORITATIVE BUT NOT FOLDED, exactly like `FlagStore`, `ObjectiveManager`, `DeadlineTable` and `CommitmentLedger`: `state_digest` does not walk it. What the digest DOES catch is everything a stoppage causes — a hold's state and reason, its banked ticks, its rate, and a depot's capacity level — so two peers that disagreed about whether a strike was on would disagree about a transfer's outcome on the tick it mattered. Falling Skyway's own digest is unchanged by the slice, which is that claim measured."
    architecture:
      classification: authoritative
      owner: workforce-vocabulary
      writers: [workforce-vocabulary]
    implementation:
      status: observed
      # `src/snapshot.rs` is deliberately NOT listed, for the reason
      # `mission-deadline-state` and `commitment-ledger-state` omit it: it is a
      # whole-payload module whose own imports the scanner would attribute
      # wholesale to this entity. The persistence (`ScenarioState::workforce`,
      # and the 6 → 7 `SNAPSHOT_FORMAT` bump the evidence below records) is
      # traced through the evidence instead.
      paths:
        - src/world/workforce.rs
        - src/world/server.rs
      symbols:
        - WorkforceRegister
        - WorkforceRecord
        - Workforce
        - DISPOSITION_MIN
        - DISPOSITION_MAX
        - WorldContentRuntime
      tests: [cargo test, "cargo test --features headless --test snapshot_resume a_settled_strike"]
    evidence:
      - kind: test
        reference: "src/world/workforce.rs tests; tests/snapshot_resume.rs"
        summary: "The pure register's arm/read/settle/re-strike/disposition behaviour without Bevy, including the arm-twice no-op that stops a resumed mission re-arming, the unknown-side-is-at-work default, and the two facts moving independently. Plus the save round-trip: `SNAPSHOT_FORMAT` moved 6 → 7 because the content digest could NOT stand in even though a strike IS authored — `RawWorld` sets no `deny_unknown_fields`, so an older build loads a `[[workforce]]`-authoring world, drops the table, and writes a save of the same files with the same content digest and no dispute in it. Restoring that arms an empty register and every structure the strike was gating reads as worked."

entities:
  - component: objective-directive-contract
    core:
      status: implemented
      confidence: confirmed
      title: Objective Directive Contract
      summary: Typed objective directives that express Patrol, Destroy, Reach, Retreat, Hail, or no AI action and declare their relevant system affinities.
    architecture:
      kind: domain-model
      authority: authoritative
      owns: [objective-directive-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/ai/core.rs]
      symbols: [directive_relevance]
      tests: [cargo test]

  - state: objective-directive-state
    core:
      status: implemented
      confidence: confirmed
      title: Objective Directive State
      summary: Authoritative directive and target data attached to each active objective for system-affinity-aware AI consumption.
    architecture:
      classification: authoritative
      owner: objective-directive-contract
      writers: [objective-directive-contract]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/core/messages.rs]
      symbols: [AiDirective, ScoredObjective]

  - component: objective-doctrine-score-policy
    core:
      status: implemented
      confidence: confirmed
      title: Objective Doctrine Score Policy
      summary: Scores active mission and doctrine objectives from mandatory priority, world conditions, zero gates, condition modifiers, and an optional Captain boost.
    architecture:
      kind: scoring-policy
      authority: authoritative
      reads: [objective-runtime-state, objective-directive-state, captain-objective-priority-state]
      produces: [scored-objective-pool-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/ship/viewscreen.rs]
      symbols: [UtilityConfig, WorldConditions]
      tests: [cargo test]

  - component: objective-target-name-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Objective Target Name Resolver
      summary: Resolves objective target names through the active world name-to-UUID table and ignores unresolved targets rather than substituting arbitrary entities.
    architecture:
      kind: reference-resolver
      authority: authoritative
      reads: [objective-directive-state, world-name-binding-state]
      produces: [objective-target-resolution-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ai/core.rs, src/world/server.rs, src/objectives.rs]
      symbols: [resolve_objective_target]
      tests: [cargo test]

  - state: objective-target-resolution-state
    core:
      status: implemented
      confidence: confirmed
      title: Objective Target Resolution State
      summary: Derived per-objective result identifying resolved targets, unresolved directives that fall through to the next objective, and intentional hold-station outcomes that do not fall through.
    architecture:
      classification: derived
      owner: objective-target-name-resolver
      derived_from: [objective-directive-state, world-name-binding-state]
    implementation:
      status: declared
      paths: [src/ai/core.rs, src/world/server.rs]
      symbols: [plan_helm_travel, resolve_objective_target]

  - component: objective-outcome-controller
    core:
      status: implemented
      confidence: confirmed
      title: Objective Outcome Controller
      summary: Transitions objectives between Active, Completed, and Failed from authored trigger, Comms, and entity-destruction outcomes and feeds the resulting game flow.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      writes: [objective-runtime-state, game-over-reason-state]
      reads: [world-content-lifecycle-state, spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/world/server.rs, src/console/comms/server.rs]
      symbols: [ObjectiveManager]
      tests: [cargo test]

  - component: objective-authoring-actions
    core:
      status: implemented
      confidence: confirmed
      title: World Objective Authoring Actions
      summary: World triggers and comms responses add, complete, or fail named mission objectives, with optional AI directives and utility configuration.
      rationale:
        - "Mission objectives can author every first-class directive: Patrol, Destroy, Reach, Retreat (requires a directive_anchor, same shape as Reach), and Hail. Retreat had been authorable only from hull doctrine until the post-#801 loose-ends fix added it to mission-objective parsing."
    architecture:
      kind: configuration-action
      authority: authoritative
      produces: [objective-runtime-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/world/server.rs, src/console/comms/server.rs]
      symbols: [TriggerAction, tick_trigger_pipeline]
      tests: [cargo test]

  - component: objective-manager
    core:
      status: implemented
      confidence: confirmed
      title: Objective Manager
      summary: Owns objective lifecycle, unique IDs, status transitions, snapshots, and active directive utility scoring.
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [objective-runtime-state, scored-objective-pool-state]
      produces: [objective-runtime-state, scored-objective-pool-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/world/server.rs]
      symbols: [ObjectiveManager, ObjectiveManagerRes, scored_pool_with_boost]
      tests: [cargo test]

  - state: objective-runtime-state
    core:
      status: implemented
      confidence: confirmed
      title: Objective Runtime State
      summary: Session-lifetime objectives keyed by unique ID, retaining active, completed, and failed records with player text, targets, source, directive, and utility data.
    architecture:
      classification: authoritative
      owner: objective-manager
      writers: [objective-manager, objective-authoring-actions]
    implementation:
      status: declared
      paths: [src/objectives.rs]
      symbols: [ObjectiveManager]
      tests: [cargo test]

  - state: scored-objective-pool-state
    core:
      status: implemented
      confidence: confirmed
      title: Scored Objective Pool
      summary: Active objectives ranked by base priority, mandatory bonus, satisfied condition modifiers, zero gates, and optional Captain boost; only active objectives enter the pool.
    architecture:
      classification: derived
      owner: objective-manager
      writers: [objective-manager]
    implementation:
      status: declared
      paths: [src/objectives.rs]
      symbols: [WorldConditions, UtilityConfig]
      tests: [cargo test]

  - component: objective-ai-projection
    core:
      status: implemented
      confidence: confirmed
      title: Objective AI Projection
      summary: Publishes the shared scored objective pool to current Backfill Helm and Tactical AI, which select directives relevant to their system affinity.
    architecture:
      kind: projection
      authority: authoritative
      reads: [scored-objective-pool-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ai/core.rs, src/ai/server.rs, src/objectives.rs]
      symbols: [score_doctrine_pool, plan_helm_travel, directive_relevance]
      tests: [cargo test]

  - component: captain-objective-priority
    core:
      status: implemented
      confidence: confirmed
      title: Captain Objective Priority Boost
      summary: Captain can toggle one objective ID as a global score boost; it affects the shared scored pool and Captain projection, including otherwise zero-gated doctrine objectives.
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [captain-objective-priority-state]
      reads: [objective-runtime-state]
      produces: [captain-objective-priority-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, gui/action-map.js]
      symbols: [handle_set_objective_priority]
      tests: [cargo test]

  - state: captain-objective-priority-state
    core:
      status: implemented
      confidence: confirmed
      title: Captain Objective Priority State
      summary: Boosted objective ID keyed by the captain's own ship scope (issue #752). A boost only reorders that ship's own objective consumers; see scoped-objective-priority-state.
    architecture:
      classification: authoritative
      owner: captain-objective-priority
      writers: [captain-objective-priority]
    implementation:
      status: declared
      paths: [src/server_app.rs]
      symbols: [CaptainPriorityBoost]
      tests: [cargo test]

  - component: objective-player-projection
    core:
      status: implemented
      confidence: confirmed
      title: Objective Player Projection
      summary: Projects objective snapshots into console blackboards and GUI objective lists. Captain sees mission objectives regardless of score and doctrine objectives only when score is positive; Comms receives the complete snapshot list.
      rationale:
        - "Issue #830 made publish_captain_blackboard per-Ship: ship-wide fields (red_alert, auto flags, hull integrity, game_status) are computed for every ship from its own per-entity components, while the player-only fields — the objectives list + boost, camera views, and view mode — are gated on Has<LocalShip>. NPCs get empty objective lists (nothing reads an NPC captain blackboard; the wire broadcaster is LocalShip-filtered). The objective projection itself is therefore the local ship's."
        - "Issue #831 made publish_comms_blackboard per-Ship the same way: comms is fundamentally a player channel, so the shared content (messages, objectives, contacts from the singleton inbox/runtime/objective managers) is gated on Has<LocalShip> and written to the local ship, while every NPC ship receives an empty Comms blackboard entry for architectural consistency."
    architecture:
      kind: projection
      authority: authoritative
      reads: [objective-runtime-state, scored-objective-pool-state, captain-objective-priority-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/console/comms/server.rs, gui/components/ph-objective-list.js]
      symbols: [publish_captain_blackboard, publish_comms_blackboard]
      tests: [cargo test, npx vitest run]

  - component: scoped-objective-priority
    core:
      status: implemented
      confidence: confirmed
      title: Scoped Objective Priority
      summary: Captain priority selection applies only to the captain's own ship scope, never every objective consumer in the session. The command handler derives the scope from the captain's own ship and toggles the boost within that scope alone.
    architecture:
      kind: control-policy
      authority: authoritative
      owns: [scoped-objective-priority-state]
      reads: [objective-runtime-state]
      produces: [scoped-objective-priority-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/server_app.rs]
      symbols: [handle_set_objective_priority, CaptainPriorityBoost]
      tests: [cargo test]

  - state: scoped-objective-priority-state
    core:
      status: implemented
      confidence: confirmed
      title: Scoped Objective Priority State
      summary: Objective boost selections keyed by their declared local scope (the captain's own ship) rather than one global objective ID; a boost in one scope is invisible to every other scope and to another ship's consumers.
    architecture:
      classification: authoritative
      owner: scoped-objective-priority
      writers: [scoped-objective-priority]
    implementation:
      status: declared
      paths: [src/server_app.rs]
      symbols: [CaptainPriorityBoost]
      tests: [cargo test]

  - component: objective-visibility-policy
    core:
      status: implemented
      confidence: confirmed
      title: Objective Visibility Policy
      summary: Comms and Captain both hide doctrine objectives whose current utility score is zero, while mission objectives remain visible. Both projections apply the one shared visibility filter over the scored pool.
    architecture:
      kind: projection-policy
      authority: authoritative
      reads: [objective-runtime-state, scored-objective-pool-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/console/captain/server.rs, src/console/comms/server.rs]
      symbols: [is_visible_objective, publish_captain_blackboard, publish_comms_blackboard]
      tests: [cargo test]

  - component: objective-authoring-validation
    core:
      status: implemented
      confidence: confirmed
      title: Objective Authoring Validation
      summary: World composition validation rejects duplicate objective declarations within a single action list and complete/fail references to objectives no add_objective declares, before the root world activates. Both activation gates run it.
    architecture:
      kind: configuration-validator
      authority: authoritative
      reads: [world-authoring-validation-state, world-composition-state]
      coordinates: [objective-manager]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/validate.rs, src/headless/app.rs, src/world/server.rs]
      symbols: [validate_objectives, validate_composition]
      tests: [cargo test]

  - component: objective-world-lifecycle
    core:
      status: implemented
      confidence: confirmed
      title: Objective World Lifecycle
      summary: Objectives are owned by their authoring world layer and are removed when that layer unloads, along with the runtime state that referenced them — a captain priority boost pointing at a removed objective and any per-ship route cursor keyed to it.
    architecture:
      kind: lifecycle-policy
      authority: authoritative
      reads: [world-content-lifecycle-state, objective-runtime-state]
      coordinates: [objective-manager]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/objectives.rs]
      symbols: [apply_world_layer_changes]
      tests: [cargo test]

  - component: comms-objective-ai
    core:
      status: implemented
      confidence: confirmed
      title: Comms Objective AI
      summary: Backfill Comms consumes relevant Hail directives from its local scored objective pool and issues the same Comms actions as a player.
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [scored-objective-pool-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/objectives.rs]
      symbols: [operate_comms_ai, directive_relevance]
      tests: [cargo test]

  - component: objective-comms-consequence-router
    core:
      status: implemented
      confidence: confirmed
      title: Objective Comms Consequence Router
      summary: Applies the same authored objective add, complete, and fail actions from Comms responses as from world triggers, then allows their actions to drive world flags, entities, layer changes, and terminal outcomes.
    architecture:
      kind: consequence-router
      authority: authoritative
      reads: [comms-dialogue-state, objective-runtime-state]
      writes: [objective-runtime-state, world-flag-state, world-layer-runtime-state]
      coordinates: [comms-dialogue-controller, world-trigger-action-dispatcher, terminal-round-outcome-router]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/comms/server.rs, src/world/config.rs, src/world/server.rs]
      tests: [cargo test]

  - component: objective-player-ai-divergence-contract
    core:
      status: implemented
      confidence: confirmed
      title: Objective Player and AI Divergence Contract
      summary: "Current player projections and AI consumption intentionally diverge: Captain and Comms render different objective subsets while Helm, Tactical, and Navigation consume scored affinity-relevant directives rather than player-facing text."
    architecture:
      kind: projection-contract
      authority: authoritative
      reads: [objective-runtime-state, scored-objective-pool-state]
      coordinates: [objective-player-projection, objective-ai-projection]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/console/comms/server.rs, src/ai/core.rs, src/console/navigation/mod.rs]
      tests: [cargo test]

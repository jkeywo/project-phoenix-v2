<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.engineering.doc_title">Project Phoenix — Engineering Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    ph-shield-facings, ph-power-controls, ph-repair-teams, ph-hull-integrity { flex: 1; min-height: 0; }
    /* The Power column lays its controls and battery side by side: the battery
       is a vertical gauge on the right edge, so the controls' buttons never
       run under it. The controls scroll internally when the column is short. */
    .power-row { flex: 1; min-height: 0; display: flex; flex-direction: row; gap: 10px; align-items: stretch; }
    .power-row ph-power-controls { flex: 1; min-width: 0; overflow-y: auto; }
    .power-row ph-battery-bar { flex: 0 0 auto; }
    /* Compact threat-bearing readout (issue #926) — same standing fact the
       battleship's dedicated Shields console shows, condensed to one line
       for this column's tighter layout. Hidden when Sensors holds no threat. */
    .threat-readout { display: flex; justify-content: space-between; gap: 8px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); padding: 0 0 8px; flex-shrink: 0; visibility: hidden; }
    .threat-readout.active { visibility: visible; }
    .threat-readout strong { color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-md); }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    /* Visiting consoles (issue #984). Same toggle/panel shape the destroyer's
       Tactical console has carried since #1036 — Engineering is second in this
       hull's authored seek order, so it is the seat most likely to be handed
       Comms while Tactical is empty. */
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    .overlay-toggle { background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; min-height: var(--control-hit-min); }
    .overlay-toggle:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-toggle[hidden] { display: none; }
    .overlay-toggle.active { background: rgba(var(--rgb-cyan-dim), 0.9); border-color: var(--cyan); color: var(--cyan); }
    .overlay-toggle .unread-badge { display: none; margin-left: 6px; background: var(--fire-bright); color: var(--surface-void); font-size: var(--text-xs); font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 1.4; }
    .overlay-toggle .unread-badge.show { display: inline-block; }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-navigation-map, .overlay-panel ph-comms-contact-list, .overlay-panel ph-comms-current-message { flex: 1; min-height: 0; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .col { padding: 8px; } .overlay-toggle { font-size: var(--text-xs); padding: 6px 12px; } .overlay-panel { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Engineering Console" data-i18n-attr="data-screen-label:console.engineering.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.engineering.title">ENGINEERING</span><span class="sub" data-i18n="console.destroyer_engineering.subtitle">SHIELDS &middot; POWER &middot; REPAIR</span></h1>
        <div class="hero-controls">
          <span class="auto-badge" id="engineering-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          <!-- Human-seeking systems (issue #984): hidden until the seek parks
               Navigation or Comms on this station, and hidden again the moment
               it moves on. -->
          <button class="overlay-toggle" id="nav-toggle" data-overlay="nav-overlay" data-active="false" hidden data-i18n="console.common.nav_toggle">Nav</button>
          <button class="overlay-toggle" id="comms-toggle" data-overlay="comms-overlay" data-active="false" hidden><span data-i18n="console.common.comms_toggle">Comms</span><span class="unread-badge" id="comms-unread">!</span></button>
        </div>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.engineering.shields">Shields</h2>
          <div class="threat-readout" id="threat-row"><span data-i18n="console.shields.threat_bearing">Threat Bearing</span><strong id="threat-bearing">—</strong></div>
          <ph-shield-facings id="shield-facings"></ph-shield-facings>
        </div>
        <div class="col">
          <h2 data-i18n="console.engineering.power">Power</h2>
          <div class="power-row">
            <ph-power-controls id="power-controls"></ph-power-controls>
            <ph-battery-bar id="battery-bar" orientation="vertical"></ph-battery-bar>
          </div>
        </div>
        <div class="col">
          <h2 data-i18n="console.engineering.repair">Repair</h2>
          <ph-hull-integrity id="hull-integrity"></ph-hull-integrity>
          <ph-station-damage id="core-damage" label="Core" data-i18n-attr="label:console.repair.core"></ph-station-damage>
          <ph-repair-teams id="repair-teams"></ph-repair-teams>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.engineering.station_footer">ENGINEERING STATION</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <!-- Visiting consoles (issue #984). Present in the markup always, opened
         only through toggles that appear while the seek holds the system here.
         Same ids as the destroyer's Tactical console — gui/visiting-systems.js
         renders all four seats through one code path. -->
    <div class="overlay-panel" id="nav-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.navigation_panel">Navigation</h2>
      <ph-navigation-map id="navigation-map"></ph-navigation-map>
      <ph-civilian-traffic id="civilian-traffic"></ph-civilian-traffic>
    </div>
    <div class="overlay-panel" id="comms-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.comms_panel">Comms</h2>
      <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
      <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
    </div>
  </div>
  <script type="module">
    import '../components/ph-shield-facings.js';
    import '../components/ph-power-controls.js';
    import '../components/ph-battery-bar.js';
    import '../components/ph-repair-teams.js';
    import '../components/ph-hull-integrity.js';
    import '../components/ph-station-damage.js';
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-current-message.js';
    import '../components/ph-navigation-map.js';
    import '../components/ph-civilian-traffic.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    import { setAutoState } from '../console-ui.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    import { renderVisitingSystems } from '../visiting-systems.js';

    // Delegated, because the toggles these panels hang off start `hidden` and
    // only become controls when the seek hands this station the system.
    initConsoleOverlays();

    // Generic system-id-keyed payload (issue #825): resolve each panel's view
    // from the fine system ids this station owns.
    function system(s, ...ids) { for (const id of ids) if (s.systems && s.systems[id]) return s.systems[id]; return {}; }
    initConsole({
      name: 'engineering',
      // s is a SystemStationConsolePayload — see the @typedef in gui/console-state.js.
      render: function(s) {
        var shieldEl = document.getElementById('shield-facings');
        var powerEl = document.getElementById('power-controls');
        var batteryEl = document.getElementById('battery-bar');
        var repairTeamsEl = document.getElementById('repair-teams');
        var hullEl = document.getElementById('hull-integrity');
        // Comms and Navigation follow the crew (issue #984). Engineering is
        // SECOND in this hull's authored seek order, so an empty Tactical hands
        // them here before it hands them to the Captain.
        renderVisitingSystems(s);
        var sh = system(s, 'shields-system');
        var p = system(s, 'power-reactor', 'power-battery');
        var r = system(s, 'repair');
        shieldEl.state = { facings: sh.facings || [], focused_facing: sh.focused_facing || null, auto: !!sh.shields_auto };
        var threatRow = document.getElementById('threat-row');
        if (sh.threat_bearing != null) {
          threatRow.classList.add('active');
          document.getElementById('threat-bearing').textContent = Math.round(sh.threat_bearing) + '°M';
        } else {
          threatRow.classList.remove('active');
          document.getElementById('threat-bearing').textContent = '—';
        }
        powerEl.state = { groups: p.consoles || [], auto: !!p.power_auto };
        batteryEl.state = { level_pct: (p.battery_max > 0 ? (p.battery_charge / p.battery_max * 100) : 0), charging: !!p.battery_online && !!p.charging, emergency_threshold_pct: 20 };
        // Overall ship-wide hull (every damageable system), not just this
        // station's own systems.
        var oh = r.overall_hull || {};
        hullEl.state = { total_pct: oh.pct != null ? oh.pct : 1, destroyed_pct: oh.destroyed_pct };
        // Ownerless "core" systems get their own click-to-expand bar that
        // hides itself entirely when there are none (issue #12).
        document.getElementById('core-damage').state = { entries: r.core_systems || [] };
        repairTeamsEl.state = { teams: r.teams || [], auto: !!r.repair_auto, targets: r.dispatch_targets || [], damaged: r.damaged_systems || [] };
        document.getElementById('station-damage').state = s.own_hull || null;
        // Station badge: the retired composite's engineering_auto meant
        // "station is Backfill-rated". The per-system equivalent is every
        // owned system AI-run — the conjunction of the resolved views' *_auto
        // flags (controlSources can lag a rating change by one tick).
        setAutoState(null, document.getElementById('engineering-auto-badge'), !!(sh.shields_auto && p.power_auto && r.repair_auto));
      }
    });
  </script>
</body>
</html>

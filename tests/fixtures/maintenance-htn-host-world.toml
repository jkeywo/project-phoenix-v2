# Quiet runtime proof. No threats/deadlines or stock grants. Only magazine demand starts at zero; normal Gunner demand later enables actual Logistics AI work.
[global]
seed = 156223

[player_spawn]
position = [ 0, 0, 0 ]

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "maintenance-ship"
name = "maintenance-ship"

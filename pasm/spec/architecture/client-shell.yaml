entities:
  - component: client-string-catalogue-composer
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Client String Catalogue Composer
      summary: Composes the shipped String Table with partial catalogues projected from the authoritative host's ordinary active mod stack. Values resolve per String Id and locale under later-pack-wins precedence; missing, blank, placeholder-invalid, metadata-invalid, or stale translations retain their authored value plus conflict, winner, effective-English source and provenance diagnostics while players render the effective English source without a marker. Locale choice and composed presentation remain client-local and never enter simulation state or identifiers.
      rationale:
        - "[ai] GM NPC, contact, despawn, journal undo and Comms panels share GmActionFeedback request and timer ownership. Panel adapters retain typed result matching, confirmation, capacity refusal and history presentation; resetting requests makes old timer callbacks inert."
        - "[ai] Session, Mission, Direct Effect and Spawn share operator/refusal presentation, common result identity validation and ordered log construction through gm-feedback-presentation. Their typed result fields and completion policies remain panel-owned. Mission, Direct Effect and Spawn track before transport submission through GmActionFeedback.submit; Session retains semantic-registry Pending and deferred local refusal ordering."
        - "[ai] A translation-only pack is an ordinary mod member at assets/strings/strings.csv, not a second package protocol. Welcome carries the ordered partial sources because remote phones cannot read the host's private ZIP overlay."
        - "[ai] Freshness records the exact effective English source in <locale>_source. Comparing values is deterministic across browsers and needs neither timestamps nor a runtime hash implementation; ordinary English edits never regenerate translation text."
        - "[ai] The locale preference is private device presentation: browser-derived until explicitly selected, stored locally, and copied with the ordered catalogue stack into every Console iframe realm before component registration and again on reload/reconnect. A live choice now installs into mounted realms without reloading them, repaints template-authored text in place, and re-localises retained Objective/Comms snapshots from their raw semantic ids and params without replaying reducer effects or altering Station authority."
        - "[ai] Browser GM and standalone Workshop use separate private locale keys and the shared composed catalogue. GM repaints retained typed action and activity projections from semantic ids, and Workshop repaints its mounted draft and findings without remounting or changing source bytes. Workshop preview is temporary; only explicit selection persists, and neither route sends language to simulation authority."
        - "[ai] Native Station panes keep language in their host-backed operator profile, independently per pane. Native GM and Workshop use the same private language contract in their own operator scopes. The Viewscreen keeps a separate host-backed language file; its lobby and HUD repaint retained semantic snapshots on selection, and both are reseeded after view recreation. An available OS locale seeds an unset choice, with English fallback. Language records never enter Station tenure, sessions, commands or simulation state."
        - "[ai] Workshop consumes the retained composition report. Its Localisation panel is registered in the persisted dock layout and migrated into older arrangements, searches effective String Ids and context, edits locale values and plural variants with the same resolver's parameter/freshness checks, and shows missing/invalid/stale/conflict counts plus per-id winner/source/provenance and English/locale preview. Edits enter ordinary undo and Save/Export. A changed value records effective English; an unchanged stale value requires explicit Refresh source metadata. A translation-only mod can add its first locale/table from this panel."
        - "[ai] Invalid and stale values remain in the author report while the player lookup uses English. Diagnostics therefore do not leak into Console copy and translators do not lose the work they must refresh."
        - "[ai] The shipped first-party German catalogue is an offline machine draft with de_source equal to each exact English cell and de_provenance recording machine origin. English approval brackets remain on the English side; German production does not claim editorial review or load a runtime translator. A later English edit or third-party English-only String Id keeps the ordinary English fallback."
        - "[ai] Numeric presentation parameters are formatted in the viewer's private locale from JSON numbers, while explicit typed ISO date/time envelopes format in UTC. Counted String Id families select a locale plural category before interpolation, and incomplete or invalid translated forms keep author diagnostics plus effective-English fallback. This changes presentation only: protocol identities, gameplay quantities and simulation state retain their original values."
        - "[ai] Browser host setup, save and restore diagnostics use semantic outcome kinds from the local Rust bridge. The host resolves String Ids at its display edge; technical browser storage and version details remain explicit parameters. This presentation bridge does not change snapshot admission or captured state."
        - "[ai] GM intervention results, history, journal and inspection tree are retained semantic projections. A private locale switch repaints their String Id names and numeric parameters from that projection while keeping draft input, focus, selection, authoritative outcome and event order. Narrative reports resolve semantic lines at presentation without translating literal authored text or exposing private ship fields."
    architecture:
      kind: client-presentation-service
      authority: non-authoritative
      reads: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [assets/strings/strings.csv, gui/csv.js, gui/string-catalogue.js, gui/strings.js, gui/strings-boot.js, gui/locale-preference.js, gui/native-gm-workspace.js, gui/native-workshop.js, gui/viewscreen-hud.html, src/native_host/viewscreen_locale.rs, src/native_host/panes/operator_storage.js, gui/locale-edit-context.js, gui/surface-language.js, gui/gm-language.js, gui/gm-workspace.js, gui/gm-action-feedback.js, gui/gm-feedback-presentation.js, gui/gm-session-controls.js, gui/gm-mission-panel.js, gui/gm-direct-effect-panel.js, gui/gm-spawn-panel.js, gui/workshop-authoring.js, gui/workshop-boot.js, gui/rendezvous-transport.js, gui/workshop-localisation-panel.js, gui/snapshot-status.js, server.html, src/server/bridge.rs, editor/workshop-localisation.js, crates/phoenix-model/src/messages.rs, crates/phoenix-simulation/src/lobby/handler.rs, crates/phoenix-simulation/src/world/mod_pack.rs, editor/mod-pack-export.js, editor/mod-pack-workspace.js, scripts/extract-strings.mjs, scripts/generate-german.py, scripts/german-domain-draft.json, scripts/german-dynasty-draft.json, docs/strings-authoring-guide.md]

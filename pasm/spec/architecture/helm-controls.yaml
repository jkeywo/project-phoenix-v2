        - gui/components/ph-lateral-thrust-joystick.js
        - gui/components/ph-impulse-btn.js
        - gui/components/ph-boost-btn.js
      symbols:
        - buildHelmConsoleState
        - PhHelmJoystick
        - PhLateralThrustJoystick
        - PhImpulseBtn
        - PhBoostBtn
      tests:
        - tests/client/console-state.test.js
        - tests/client/action-map.test.js
        - tests/client/ph-helm-joystick.test.js
        - tests/client/ph-lateral-thrust-joystick.test.js
        - tests/client/ph-impulse-btn.test.js
        - tests/client/ph-boost-btn.test.js

  - state: helm-ui-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm UI State
      summary: Client-local assembled helm presentation state derived from replicated blackboards and view-model helpers.
    architecture:
      classification: local-view
      owner: helm-console-interface
    implementation:
      status: declared
      paths:

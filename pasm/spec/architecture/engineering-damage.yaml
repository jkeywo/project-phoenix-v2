        summary: >-
          Host-only module. Names the authoritative damage store with a
          line-start `use crate::damage::SystemHull;` and the repair-team state
          machine with `use crate::modifiers::repair_teams::RepairTeams;`, so
          both reads are real code edges rather than prose claims.
      - kind: test
        reference: live_broadcast_gives_engineering_core_only_with_no_team_on_site
        summary: >-
          Engineering's `SystemHullUpdate` carries core detail and its own
          station's systems, and no other station's rows.
      - kind: test
        reference: live_broadcast_gives_a_station_owner_only_its_own_systems
        summary: A station holder receives exact detail for its own systems only.
      - kind: test
        reference: registered_reconnect_honours_off_site_visibility_without_mutating_caches
        summary: >-
          The registered reconnect payload for Engineering and a station owner
          is byte-identical in row set and aggregates to live publication while
          leaving every recipient's live Hull cache unchanged.
      - kind: test
        reference: registered_reconnect_honours_on_site_visibility_without_mutating_caches
        summary: >-

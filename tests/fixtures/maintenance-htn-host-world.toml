[planning.arguments.actor]
kind = "actor"
value = "maintenance-ship"

[[planning.import]]
path = "tests/fixtures/maintenance-htn-host-domain.toml"
as = "maintenance"
names = [ "restore-and-resupply" ]

[script]
setup = "fn credit_repair(ctx) { ctx.flags.increment(\"htn_repair_credit\", 1); }\nfn credit_return(ctx) { ctx.flags.increment(\"htn_return_credit\", 1); }\nfn credit_delivery(ctx) { ctx.flags.increment(\"htn_delivery_credit\", 1); }"

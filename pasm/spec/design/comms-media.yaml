entities:
  - decision: redesign-comms-human-media-packet-boundary
    core:
      status: accepted
      confidence: confirmed
      origin: ai
      title: Selected Human Media Uses Bounded Ephemeral Packets
      summary: "Human audio and video use the existing Phoenix links and Snapshot delivery class through an explicit drop-only send. Ordinary call requests, Human acceptance and actually returned receipts establish the selected conversation. Current operator consent, stream leases and bytes are ephemeral and never restored."
      rationale:
        - "[ai] Coordinated increment-16 contract, 2026-10-15: no new peer, broker, delivery class, AI voice or media journal. Existing generic sends keep their compatibility behaviour; the optional Snapshot-only path never falls back to Reliable when absent, overloaded or failed. Technical byte/rate limits are validation and do not create simulated message capacity."
        - "[ai] First supported packet encodings are independently decodable PCM16 little-endian mono at 16000 samples/second in exactly 80 ms blocks (1280 samples, 2560 bytes), and independent JPEG stills of at most 12288 bytes at at most two frames/second. JPEG dimensions are checked before decoding: width at most 320, height at most 180 and at most 57600 pixels; capture uses the same bounded canvas. The full encoded JSON packet is at most 20480 bytes. Playback retains at most 200 ms of audio and one pending video frame. These are bounded implementation proof values, not a universal codec promise."
        - "[ai] Canonical call intent changes use existing admitted System commands and fixed processing. Ordinary enabled Comms equipment pays its current-tick carrier work exactly once. Media callbacks read genuinely current paid route eligibility and never mutate canonical Comms/power or request nondeterministic per-packet payment. Call acceptance does not grant machinery authority or a permanent stream."
        - "[ai] Source and destination independently enforce current System-to-Console-to-Station operation and actual selected call lineage. Cross-host frames use authenticated existing frozen host slots; the destination resolves its own current local Session. Claimed remote tokens are not routing authority. Raw media never enters command history, lockstep continuation streams, saves, snapshots or digests."
        - "[ai] Consent and capture require explicit local activation. Stop, operator or call changes, disconnect, reconnect and continuation clear ephemeral starts and device capture. Unsupported or insecure-origin capture and native embedded media remain visibly unavailable. Restoring accepted text does not restore device permission or resume capture. Lossy arbitrary MediaRecorder container fragments are excluded."
        - "[ai] Bound ingress before general browser/native staging; bound egress against actual physical send backlog. Media must not replace unrelated gameplay data or consume an unbounded reliable queue. Validate direct, fallback and native relay paths with simultaneous commands and snapshots; device and cross-host acceptance remain separately recorded until actually exercised."

        - "[ai] Additive negotiated relay policy: limits.snapshot_drop_only is false when absent. Existing Snapshot envelopes may then opt into drop_only; full mailboxes drop optional incoming work, ordinary snapshots evict optional work first and drain before it across senders. Same two classes and same opaque relay protocol; no media-aware service. Deployment advertises support before new clients enable relayed media. Native bounded actual queues and generation-scoped bridge ready/receipt obey the same refusal contract."
        - "[ai] Native fleet forwarding advertises drop-only capability from the actual generation-scoped native socket, including a checked sequence floor. The embedded bridge reports unknown backlog, never an invented zero. A separate bounded non-evicting staging slot admits at most one outstanding packet per socket generation until its native attempt receipt or a 250 ms local monotonic expiry; expiry permits a new packet and never retries the lost one. Admission promises no delivery. Ordinary bridge records and network sends precede ephemeral work. Actual typed host-media payloads are scoped before native socket and bridge staging regardless caller flags; invalid media is refused. Old or unadvertised bridges refuse this optional path."

  - component: workshop-composition-authoring
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Workshop World Composition and Scenario Entry Points
      summary: "The Workshop composition panel authors world composition and the selectable mod entry points: the manifest's [[scenario]] roots (id, world, label, curated ships) and each world's extra_worlds, over the exact source of a browser mod draft or a native selected workspace. The runtime reads the draft's text members plus its immutable dependencies into a composition catalog with 1-based lines and an origin (draft, base or pack:<id>) on every reference, lists script-driven load_world/unload_world references read-only, and refuses a composition edit at edit time — the source untouched — when it would introduce a missing, cyclic, duplicate or disallowed reference. The same rules are findings with lines in validate_pack and validate_project, and one Rust function builds the scenario catalogue both validators would publish, so native save and browser ZIP export agree on what Test and the lobby list."
      rationale:
        - "[ai] Composition is authored in three places and this issue edits two: the manifest (roots and, for a pack, the [pack] header) and each world's extra_worlds. Script-driven load_world/unload_world references — Rhai host calls in inline [script] bodies and the sibling .rhai a world declares, and TOML actions of type load_world/unload_world wherever the schema nests them — are LISTED with their origin and validated, never edited, because editing Rhai is #1478's. The scan is best effort (one string literal per call, comment lines skipped) and the catalog's doc comment says so."
        - "[ai] Criterion 3 says REFUSE, so unlike the definition forms a composition edit is checked cross-file in Rust at edit time against candidate ∪ dependencies (candidate winning by path) and a refused request returns the untouched source with `<rule>: <detail>`, the rule being the finding category the same violation reports as; the panel maps that prefix to a workshop.composition.refused.* string and shows the runtime's sentence as the detail. Only rules the edit INTRODUCES are refused (a before/after diff of the edited member's violations), so a hand-broken draft can be repaired one edit at a time; everything the member already carried, and every rule about other members, stays a finding with a line in validate_pack and validate_project."
        - "[ai] 'The same validated catalogue' is one function: composition::scenario_catalogue builds world::manifest::build_catalog over the candidate manifest resolving worlds through candidate ∪ beneath, and a test asserts entry-for-entry equality between the pack path (members in a store zip plus a dependency bundle) and the project path (the same members as files, nothing beneath). The panel's Catalogue section shows that list as what Test and the lobby would offer; catalogue origin is the faithful ScenarioCatalogEntry mirror, which build_catalog leaves unset."
        - "[ai] Manifest members are the draft's member list: each is shown with its origin, whether a mod pack may carry it (is_allowed_content_path) and which manifest or world references it. Members are created through the existing add controls; the one new creation is a world skeleton the runtime serialises (new_world_source: a [global] table with the title, built through toml_edit because serialising GlobalConfig would pin every tuning default into the file, and asserted through parse_world)."
        - "[ai] The composition panel is Workshop layout v7 and joins the files column beside changes on both sides (gui/workshop-layout-model.js and src/native_host/panes/operator.rs migrate a stored v6 layout by placing it in the group holding files), because it reads the draft's member set the way the changes view does."
        - "[ai] A reorder of roots is expressed as `set` edits on the swapped slots' scalar fields and ships rather than remove-and-append: the edit vocabulary cannot insert mid-array, and the manifest's comments and blank lines stay with their positions — which is also the residue: a comment authored beside one root ends up beside the root that moved into its slot, and the alternative would drop a moved root to the end of a list whose order IS the lobby's. Removals follow by descending index and new roots are appended last, so no edit shifts the slot a later one names."
        - "[ai] member-disallowed is a WARNING for a project workspace only (decided by the absence of a root scenarios.toml), because a pack already refuses such a member through the archive gate's disallowed-path finding, AND only for a member the manifest or a world names: a project legitimately carries audio catalogues, string tables and join codes a pack never could, every member's allowed flag is already on the Members section, and a warning on each would be noise on every Check of the shipped project. extra-worlds-cycle is reported at the entry that closes the cycle with the cycle listed; the loader reads extra_worlds ONE level deep, so a cycle is never an infinite load, and it is still refused because the authored graph and the runtime's flat list have parted. Recorded residue: a child's own extra_worlds are ignored by the loader; a dangling reference in a read-only base or pack script is listed with a null origin but not reported as a finding, since nothing the author can edit carries it."
        - "[ai] The Test gate applies the composition rules too: test_source::validate_selection runs composition::selection_findings over the selected root's own scope, so a Test no longer starts on a cyclic or dangling-reference composition that native save and browser export would refuse, while a rule another world breaks still only reaches Check because a Test runs one root."
        - "[ai] The catalog's manifest view is nullable and the content epoch is optional, because a draft can carry no manifest member at all and a [content] table can omit the integer: a phantom manifest view would have offered editable Roots whose every Apply was refused as a missing world. The panel says a draft carries no manifest instead."
        - "[ai] What the catalogue-equality test proves, stated exactly: one pure function is called by both gates and reports the same entries for candidates that differ only in manifest path and header, with the pack case carrying a dependency bundle the resolution never needs. Resolution THROUGH a dependency is covered separately (scenario_catalogue_curates_ships_and_resolves_worlds_beneath). It is a guard on header and path independence, not a comparison of two independent resolvers."
    architecture:
      kind: authoring-presentation
      authority: non-authoritative
      depends_on: [workshop-definition-authoring]

entities:
  - component: world-file-parser
    core:
      status: implemented
      confidence: confirmed
      title: World File Parser
      summary: Parses authoritative world TOML into WorldConfig - entities, anchors, visual settings and predicates. Since issue #985 it parses no scenario logic at all: the `[[trigger]]` and `[[comms]]` arrays are gone and a world that still authors either is refused by name, while the `[script]` block is lifted and compiled separately.
    architecture:
      kind: configuration-loader
      authority: authoritative
      owns: [world-configuration-state]
      produces:
        - world-configuration-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/world/config.rs]
      symbols: [parse_world, WorldConfig, WorldEntity]
      tests: [cargo test]

  - state: world-configuration-state
    core:
      status: implemented
      confidence: confirmed
      title: World Configuration State
      summary: Parsed authoritative world content, including entity declarations and name-to-UUID bindings.
    architecture:
      classification: authoritative
      owner: world-file-parser
      writers: [world-file-parser]
    implementation:
      status: declared
      paths: [src/world/config.rs]
      symbols: [WorldConfig]

  - component: world-entity-spawner
    core:
      status: implemented
      confidence: confirmed

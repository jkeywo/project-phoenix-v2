# Alliance Cruiser balance ratification (issue #1082).
#
# The fixed seed matrix is intentionally parallel to the established destroyer
# report: the player slot is the selected cruiser and every station is Backfill
# operated by the same composed #876 doctrine used in a normal unmanned game.
# Keep seeds and duration stable; any retune must re-run this exact command and
# update the evidence plus thresholds together.
#
#   cargo build --release --features headless --bin phoenix-headless
#   node scripts/balance-runs.mjs scripts/balance-runs.cruiser.toml --out .balance-out

seeds       = [1, 2, 3, 4, 5]
sim_seconds = 120
world       = "assets/worlds/duel.toml"

# RE-RATIFIED 2026-09-06 (issue #1388) against the report produced by the
# command above: 5/5 cruiser wins in every row, with medians
# 4.78 / 13.82 / 8.58 / 15.70 seconds and mean damage margins
# +163.0 / +283.8 / +310.2 / +49.0. These retain deliberate headroom while
# preserving the intended all-class sweep. The runner writes the full source
# AARs into the CI balance-report artifact.
#
# WHAT MOVED, AND WHY. #1388 gave this hull a Dock system, and with it its
# first OPERATIONAL `[[hull.system_hull]]` row — 30 HP, mirroring the
# destroyer's. Every row above it belongs to the 500-point combat durability
# ladder the #915 pass pegged; the dock sits outside that ladder in intent, but
# `SystemHull::apply_damage` still spreads incoming hull damage across the wider
# pool, so the cruiser now absorbs more before it wins.
#
# That shows up in exactly one place, and it was measured rather than assumed:
# the same five seeds run against the warhawk with the dock row removed give a
# median of 15.4 s and a margin of +92.8, and with it 15.70 s and +49.0. The
# warhawk is the longest and closest of the four fights, the only one that runs
# long enough for 6% more system pool to matter; the other three margins
# (+163.0 / +283.8 / +310.2) are the ratified figures unchanged. The residual
# +90.9 -> +92.8 on that same dock-free control is the rest of this branch
# (#1396's cold weapons group), well inside the row's headroom and not what
# moved the threshold.
#
# So `cruiser_vs_harrow_warhawk`'s `min_damage_margin` drops 50 -> 25. The
# floor is re-pegged at roughly half the measured margin, which is the headroom
# ratio the other three rows carry (100/163, 200/284, 200/310) and the ratio the
# old 50 carried against the old +90.9. It is a re-peg of the SAME claim — this
# hull beats a warhawk convincingly, with room to spare — against a hull that
# now carries docking gear, NOT a relaxation of what the row asserts. The
# cruiser still wins 5/5 with a comfortably positive margin; nothing here says
# the classes are tuned differently. `max_ttk_median` is untouched: 15.70 s is
# nowhere near its 25 s limit.
enforce_thresholds = true

[thresholds]
max_failures = 0

[[matchup]]
name   = "cruiser_vs_harrow_destroyer"
side_a = ["cruiser"]
side_b = ["ship_harrow_destroyer"]
  [matchup.thresholds]
  min_win_rate      = 1.0
  max_ttk_median    = 10.0
  min_damage_margin = 100.0

[[matchup]]
name   = "cruiser_vs_harrow_cruiser"
side_a = ["cruiser"]
side_b = ["ship_harrow_cruiser"]
  [matchup.thresholds]
  min_win_rate      = 1.0
  max_ttk_median    = 25.0
  min_damage_margin = 200.0

[[matchup]]
name   = "cruiser_vs_harrow_patrol"
side_a = ["cruiser"]
side_b = ["ship_harrow_patrol"]
  [matchup.thresholds]
  min_win_rate      = 1.0
  max_ttk_median    = 20.0
  min_damage_margin = 200.0

[[matchup]]
name   = "cruiser_vs_harrow_warhawk"
side_a = ["cruiser"]
side_b = ["ship_harrow_warhawk"]
  [matchup.thresholds]
  min_win_rate      = 1.0
  max_ttk_median    = 25.0
  # Re-pegged 50 -> 25 by #1388's dock hull row; see the evidence block above
  # for the measured with/without figures and why this row alone moved.
  min_damage_margin = 25.0

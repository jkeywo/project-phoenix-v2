entities:
  - component: navigation-waypoint-controller
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Waypoint Controller
      summary: Owns each ship's free or entity-anchored navigation waypoint, accepting admitted set and clear commands and issuing the same Channel-3 NavigateTo clearance to the Helm station that the Navigation AI issues.
      rationale:
        - "A waypoint reaches the AI Helm identically no matter who set it (AGENTS.md rule 6): both writers — the admitted human SetNavigationWaypoint path and operate_navigation_ai — enqueue the clearance through one shared helper, so the message, the delivery lag, and the HelmWaypointClearance latch are the same. Previously only the AI path sent the clearance, so a human-set waypoint sat on the shared component unfollowed."
        - The sender origin is derived from the navigation system's resolved control source, like every other post-admission enqueuer, not assumed from the wire path. Clearing needs no clearance message because a cleared waypoint leaves the Helm nothing to follow.
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [navigation-waypoint-state]
      reads: [system-control-source-state]
      writes: [navigation-waypoint-state]
      consumes: [system-control-command]
      coordinates: [coordination-lag-router]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs, gui/components/ph-navigation-map.js]
      symbols: [enqueue_navigate_to_clearance]
      tests: [cargo test, npx vitest run]

  - state: navigation-waypoint-state
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Waypoint State
      summary: "Per-ship current waypoint: a fixed X/Z position or an entity UUID whose live position is followed until that entity despawns."
    architecture:
      classification: authoritative
      owner: navigation-waypoint-controller
      writers: [navigation-waypoint-controller, navigation-ai-operator]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs]

  - component: navigation-anchor-refresher
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Anchor Refresher
      summary: Refreshes anchored waypoint coordinates from the live target transform and automatically clears the waypoint when its target no longer exists.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      reads: [navigation-waypoint-state, spawned-entity-state]
      writes: [navigation-waypoint-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs]
      tests: [cargo test]

  - component: navigation-chart-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Chart Publisher
      summary: Publishes the authored chart range, show/select filters, and current waypoint for the local ship's navigation surface.
    architecture:
      kind: blackboard-publisher
      authority: authoritative
      reads: [navigation-waypoint-state]
      writes: [ship-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs, gui/components/ph-navigation-map.js]

  - component: navigation-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Navigation AI Operator
      summary: Selects a positive Helm-relevant objective within navigation range, writes the resulting free or anchored waypoint, and sends Helm a NavigateTo coordination message through the same shared clearance helper the human waypoint path uses.
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, scored-objective-pool-state, radar-contact-projection-state]
      writes: [navigation-waypoint-state]
      sends: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs]
      tests: [cargo test]

  - component: helm-shared-waypoint-consumer
    core:
      status: proposed
      confidence: confirmed
      title: Helm Shared Waypoint Consumer
      summary: Future Helm AI destination input that reads the authoritative shared waypoint no matter whether a human Navigation operator or Navigation AI wrote it.
    architecture:
      kind: ai-input-adapter
      authority: authoritative
      reads: [navigation-waypoint-state, system-control-source-state]
      writes: [desired-motion-state]
      runs_in: [host-browser-runtime]

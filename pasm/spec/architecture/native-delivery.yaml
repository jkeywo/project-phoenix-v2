  - component: native-pane-recovery
    core:
      status: implemented
      confidence: confirmed
      title: Native Pane and Display Recovery
      summary: A failed local pane or a display lost mid-mission is a recoverable participant disconnect, never a fatal native-host error. The affected Station uses ordinary Backfill, the mission and every other pane keep running, and a recreated pane returns through the same local Session identity. Three failure triggers route into the existing disconnect → Backfill → reconnect machinery; nothing in the simulation gains a pane-shaped branch.
      rationale:
        - "[ai] The whole design is that a pane failure REUSES the network disconnect machinery rather than forking it. A local pane is just another logical client (the #1122 doctrine), so its failure must behave exactly like a phone dropping: PaneBus::close owes the lobby one PlayerDisconnected, which flips the station to Backfill through the same control_source/rating rules, and the sim sees only that message. The pane's fault path from #1122 (inbox overflow → close) is one trigger; a view crash and a lost display are the two #1125 adds. There is deliberately NO special-case pane-failure path in the sim."
        - "[ai] View-crash detection is a per-pane consecutive-frame-copy-failure counter in drive_panes, faulting at VIEW_CRASH_COPY_FAILURES. A single copy_frame error is an ordinary transient (a repaint mid-flight); a view that has genuinely died — a lost surface, a renderer that stopped answering — fails every frame, so a short run of consecutive failures is the honest crash signal and a one-off is not. The pre-existing overflow trigger becomes PaneFault::ReliableOverflow and the crash PaneFault::ViewCrashed; recovery::service_faults closes every faulted pane and, for a crash only, recreates it."
        - "[ai] A crash RECREATES and an overflow does not, and that split is deliberate. Both close the pane (the disconnect, the Backfill — identical). A view crash is a transient the display can be rebuilt from, so the faithful analogue of a network drop is to rebuild the view and let the page rejoin on the same token — the in-process analogue of the browser client's automatic redial. A reliable overflow is a page that stopped draining; recreating it blindly risks a rebuild loop against a page that wedges again, so it closes and stays closed and the operator decides. Auto-recreate is scoped to the crash case for exactly this reason."
        - "[ai] Recreation re-identifies on the SAME session token, which is the entire point: PaneBus::recreate opens a fresh pane carrying the closed pane's identity (a new PaneId — ids are never reissued — with the same token), republishes an identical document at a fresh nonce, and enqueues the new (id, url) for the Ultralight host to build a view for next frame. The reloaded page's Identify is then a RECONNECT, which handle_identify answers with reconnect-yield: the held station (still Backfill, still unclaimed because holder_for_station gates on connected) is restored to the human and the current projection is pushed. A pane's reconnect is in-process and needs NO #1112 transport, which is what retire_closed_panes' old 'reopening is out of scope' note deferred to it — that note is now wrong and updated."
        - "[ai] No surviving pane inherits a failed pane's projection, and this needs no new mechanism. Audience projection resolves through SessionManager::holder_for_station, which gates on connected, so the instant the failed token disconnects nothing resolves to it; routing::pane_receives is a whole-token comparison, so a neighbouring pane with a different token is never an addressee. The recreated pane carries the SAME token and legitimately receives that token's projection again — that is the reconnect, not a leak. The leak this rules out is a bystander or the closed handle receiving the failed pane's private projection; both receive nothing."
        - "[ai] Runtime display loss is the RUNTIME companion to #1123's setup-time missing-display report (ProfileProblem::MonitorMissing, found when a host boots). watch_runtime_displays diffs the live Monitor entity set frame to frame — bevy_winit despawns a Monitor entity when its display disconnects — and the pure runtime_display_losses names each configured monitor that was present and is now gone (a RuntimeDisplayLoss, an authored string). A lost STATION's panes are failed by participant name through PaneBus::open_pane_for_name and closed (→ Backfill); a lost VIEWSCREEN is named but fails no pane, because nobody sits there and the shared 3-D view simply has nowhere to draw until it returns. The pure detection is CI-tested; the watcher itself is CI-tested by spawning and despawning FAKE Monitor entities, which is exactly what winit does on hot-plug, so no display is needed."
        - "[ai] A display loss does NOT recreate — that would be a silent re-home, which #1123's doctrine forbids. The display is gone; there is nowhere to rebuild the view. Bringing a returned display back into use is an EXPLICIT repair: runtime_display_returns reports it and re-applying the profile is the deliberate act that places a surface. The applied-once guard (BridgeDisplayApplied) means nothing silently moves a pane onto reappeared hardware. This is why the watcher CLOSES a display-lost pane directly rather than faulting it — a fault would ask the pane host to rebuild the view — and the two paths (fault → maybe-recreate, display-loss → close) stay distinct."
        - "[ai] The fault-injection tests split along the SDK line, as the acceptance criteria intend. The view-crash injection at the seam (PaneBus::fault(ViewCrashed)), the close → Backfill, the no-projection-leak, and recreate → same-identity reconnect all run in CI without the SDK, because a pane's PaneBus is the whole of how it talks to the simulation and is drivable from a test with no view. The runtime watcher is CI-tested with fake Monitor entities. Only injecting a crash into a REAL Ultralight view needs the SDK and a GPU, and that is #[ignore]d and run once locally, exactly as #1121's and #1122's GPU proofs are."

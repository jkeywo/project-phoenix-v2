name: Deploy Demo

# Manual only (issue #931). Never runs on push — the demo build overwrites
# the scenario manifest and repoints the TURN credential endpoint, and doing
# either of those on every push to main would be a silent behaviour change
# for the dev site's own build (which .github/workflows/ci.yml owns).
on:
  workflow_dispatch:
    inputs:
      turn_worker_url:
        description: >
          URL of the deployed demo TURN-credentials worker
          (phoenix-turn-credentials-demo). Defaults to the projected
          workers.dev URL for this account; the deploy-worker step below
          prints the actual URL wrangler reports — pass that back in on a
          re-run if it differs (e.g. a different Cloudflare account/zone).
        required: false
        default: 'https://phoenix-turn-credentials-demo.project-phoenix.workers.dev'

jobs:
  deploy-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Steps below mirror ci.yml's `build` job exactly (toolchain, caching,
      # trunk, wasm-bindgen, node) so the demo bundle is built the same way
      # the dev bundle is — the only differences are the dist/ mutations
      # after this point.
      - name: Install Rust and cache
        uses: jkeywo/vellum/actions/setup-fleet-rust@582a61206d39c13d051d2e73bf463bb5d167d484
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: v0.21.14

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.120

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      # Two flags, two jobs. TRUNK_BUILD_RELEASE is the wasm-opt size switch
      # (Trunk.toml -> scripts/wasm-opt-fixup.mjs) and ci.yml sets it too.
      # PHOENIX_DEMO_BUILD is set ONLY here: `crate::build_flags` bakes it in
      # with option_env! and the settings cog hides its Debug/Cheat tab when it
      # is true (issue #939). Keeping them separate is what lets the GitHub
      # Pages dev host stay size-optimised while keeping its debug tooling.
      - name: Build server page (WASM + JS)
        run: TRUNK_BUILD_RELEASE=true PHOENIX_DEMO_BUILD=true trunk build --release

      - name: Build client page (pure JS — copies client.html + gui/assets, no WASM)
        run: node scripts/build-client.mjs

      # ── Demo mutations on dist/ (issue #931) ──────────────────────────────
      # Everything above this line is identical to ci.yml's `build` job.

      - name: Swap in the curated demo scenario manifest
        run: cp assets/scenarios.demo.toml dist/assets/scenarios.toml

      # The compiled-in PHOENIX_DEMO_BUILD above is only readable once WASM has
      # instantiated, and the settings cog can be opened before then — so the
      # answer also has to be in the HTML itself. server.html ships the tag with
      # content="false"; flip it here. gui/build-flags.js treats EITHER source
      # saying true as the demo build, so neither silence reads as "dev".
      - name: Stamp the demo build flag into the served HTML
        run: |
          set -euo pipefail
          # Tolerant of attribute order, in case trunk rewrites the tag on its
          # way into dist/. The verify step below fails the run if neither form
          # landed, so a layout change is loud rather than a silently un-gated
          # demo.
          for f in dist/index.html dist/client/index.html; do
            [ -f "$f" ] || continue
            sed -i -E -e 's|(<meta[^>]*name="phoenix-build-demo"[^>]*)content="false"|\1content="true"|' -e 's|(<meta[^>]*)content="false"([^>]*name="phoenix-build-demo")|\1content="true"\2|' "$f"
            echo "  stamped $f"
          done

      # The dev worker URL is a literal in two built files: the inline script
      # in server.html (trunk renames the build target to dist/index.html)
      # and the copied gui/connection-manager.js (client.html's module,
      # copied verbatim by scripts/build-client.mjs to dist/client/gui/).
      # worker/wrangler.toml (the dev worker) and its github.io
      # ALLOWED_ORIGIN are never touched by this workflow.
      - name: Patch TURN credential endpoint to the demo worker
        env:
          DEV_TURN_URL: https://phoenix-turn-credentials.project-phoenix.workers.dev
          DEMO_TURN_URL: ${{ inputs.turn_worker_url }}
        run: |
          set -euo pipefail
          echo "patching ${DEV_TURN_URL} -> ${DEMO_TURN_URL}"
          # Sweep every built copy rather than naming files: trunk bundles
          # gui/ for the host page too (dist/gui/), and build-client.mjs
          # copies it again for the client (dist/client/gui/), so the dev
          # URL appears in three-plus places. The guard step below still
          # backstops any miss.
          mapfile -t hits < <(grep -rlF "${DEV_TURN_URL}" dist/)
          if [ "${#hits[@]}" -eq 0 ]; then
            echo "no occurrences of the dev worker URL found in dist/ — build layout changed?" >&2
            exit 1
          fi
          for f in "${hits[@]}"; do
            echo "  patching $f"
            sed -i "s|${DEV_TURN_URL}|${DEMO_TURN_URL}|g" "$f"
          done

      # Sanity guard: fail the run rather than silently ship a demo build
      # that still points at the dev worker, or one that never got the
      # curated manifest.
      - name: Verify demo mutations landed
        env:
          DEV_TURN_URL: https://phoenix-turn-credentials.project-phoenix.workers.dev
        run: |
          set -euo pipefail

          if grep -rF "${DEV_TURN_URL}" dist/ > /tmp/dev-url-hits.txt; then
            echo "dev worker URL still present in dist/ after patching:" >&2
            cat /tmp/dev-url-hits.txt >&2
            exit 1
          fi
          echo "ok: no occurrences of the dev worker URL in dist/"

          if ! grep -qF 'ships = ["assets/entities/alliance_destroyer.toml"]' dist/assets/scenarios.toml; then
            echo "dist/assets/scenarios.toml does not look like the demo manifest (issue #917 curated entry not found)" >&2
            exit 1
          fi
          echo "ok: demo scenario manifest is in place"

          # Both pages. The host page also compiles the flag in, so its tag is
          # belt-and-braces covering the WASM boot window (issue #939). The
          # phone page has NO WASM at all and no compile step to bake anything
          # into, so its tag is the ONLY thing that tells it — an unstamped
          # client page ships a Debug/Cheat tab a demo player can drive (#940).
          for page in dist/index.html dist/client/index.html; do
            if ! grep -qE '<meta[^>]*name="phoenix-build-demo"[^>]*content="true"|<meta[^>]*content="true"[^>]*name="phoenix-build-demo"' "$page"; then
              echo "$page is not stamped as a demo build — the settings cog would offer its Debug/Cheat tab" >&2
              grep -n 'phoenix-build-demo' "$page" >&2 || echo "  (the tag is not present at all)" >&2
              exit 1
            fi
            echo "ok: the demo build flag is stamped into $page"
          done

      # Cloudflare Pages refuses any file over 25 MiB, and the release WASM
      # is ~38 MiB even after the -Oz pass (run 30847968215). Models are all
      # under the cap — the binary is the only offender — so it ships
      # gzipped (~11-13 MiB) and the host page decompresses it in the
      # browser via DecompressionStream before instantiation. Pages serves
      # a .gz asset verbatim (Content-Type: application/gzip, no
      # Content-Encoding), so the stream reaching the page really is gzip.
      # Deploy-only: the dev build on GitHub Pages (100 MiB cap) is untouched.
      - name: Compress the WASM under the Pages file cap
        run: |
          set -euo pipefail
          WASM=$(ls dist/*_bg.wasm)
          BASE=$(basename "$WASM")
          gzip -9 "$WASM"
          echo "compressed ${BASE}: $(stat -c%s "${WASM}.gz") bytes"

          # The loader: init() accepts a Promise<Response>, and wasm-bindgen
          # falls through to instantiateStreaming on it, so the swap is one
          # expression around the original URL.
          LOADER="fetch('./${BASE}.gz').then((r) => new Response(r.body.pipeThrough(new DecompressionStream('gzip')), { headers: { 'Content-Type': 'application/wasm' } }))"
          grep -qF "module_or_path: './${BASE}'" dist/index.html
          sed -i "s|module_or_path: './${BASE}'|module_or_path: ${LOADER//&/\\&}|" dist/index.html

          # The preload link: repoint at the .gz with a recomputed integrity
          # hash so the browser's early fetch is the same bytes the loader
          # asks for.
          INTEGRITY="sha384-$(openssl dgst -sha384 -binary "${WASM}.gz" | base64 -w0)"
          sed -i "s|href=\"./${BASE}\" crossorigin=\"anonymous\" integrity=\"sha384-[A-Za-z0-9+/=]*\" as=\"fetch\" type=\"application/wasm\"|href=\"./${BASE}.gz\" crossorigin=\"anonymous\" integrity=\"${INTEGRITY}\" as=\"fetch\" type=\"application/gzip\"|" dist/index.html

          # Nothing may still reference the uncompressed name, and nothing
          # in dist may exceed the Pages cap.
          if grep -rF "${BASE}'" dist/index.html | grep -v "${BASE}.gz"; then
            echo "index.html still references the uncompressed wasm" >&2
            exit 1
          fi
          if find dist -type f -size +25M | grep .; then
            echo "files over the 25 MiB Pages cap remain in dist/" >&2
            exit 1
          fi
          echo "ok: no file in dist/ exceeds 25 MiB"

      - name: Deploy demo TURN worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.demo.toml

      # First-run bootstrap: the deploy fails with "Project not found"
      # (code 8000007) until the Pages project exists. Creating it is
      # idempotent-by-guard here, so the workflow needs no owner-side setup.
      - name: Create the Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # wrangler@3's project-create endpoint is stale and returns the
          # generic 8000000 error; use the current major, matching what the
          # wrangler-action deploy steps run.
          if ! npx wrangler@4 pages project list | grep -q "project-phoenix-demo"; then
            npx wrangler@4 pages project create project-phoenix-demo --production-branch=main
            echo "created Pages project project-phoenix-demo"
          else
            echo "Pages project already exists"
          fi

      - name: Deploy demo Pages site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name project-phoenix-demo

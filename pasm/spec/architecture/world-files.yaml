      summary: Runs the repair console's external field-repair — field-repair as people crossing over, not a beam (PRD #1143). Takes the dispatch/recall commands, decides at dispatch time whether a team may be sent to the ship's designated target from the authored reach and the team-availability answer, brings a team home when it drifts out of range, and pays the target's own condition track at the authored rate while a team works there. Sits beside the operations field-repair (external-operation-runner), which stays live and untouched until #1166.

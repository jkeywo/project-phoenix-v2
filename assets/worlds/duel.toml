after_secs = 0.0

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/alliance_destroyer.toml"
  name          = "side_b_5"
  anchor        = "side_b_5"
  groups        = ["side_b"]
  overrides = { faction = "cccccccc-3333-4333-8333-cccccccccccc", behaviour = { doctrine = [
    { id = "kill", directive_kind = "Destroy",
      base_priority = 80.0, target_speed = 0.9, maintain_range = 25.0 },
  ] } }

# ── Victory (side A annihilates side B) ───────────────────────────────────────
# Deleted by the transform when `--side-b` is empty (empty group = instant
# fire). Defeat is the built-in player-death latch — deliberately no side_a
# on_all_destroyed here. `message` omitted (optional), so no strings.csv entry.
[[trigger]]
condition = "on_all_destroyed"
group     = "side_b"

  [[trigger.action]]
  type    = "game_over"
  outcome = "victory"

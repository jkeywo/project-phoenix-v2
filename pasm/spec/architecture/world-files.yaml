      title: External Operation State
      summary: "Per-ship: the verbs the hull authored, the operation it is running (or the last one it ran, retained so a console can still report how it ended), how far through it is including the fraction of a tick a hazard band left it part-way through, the rate it is being held at, why the last start was refused, and the id counter. Authoritative - a host that thought a skyhook had been stabilised, or was two seconds from it, disagrees about whether the mission is winnable."

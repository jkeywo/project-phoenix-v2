# Probe world for issue #1033 — scripted entity REMOVAL, end to end.
#
# `spawn_entity` had no counterpart: a scenario could put something in the world
# and never take it out again. Falling Skyway needs removal twice over — the
# skyhook's mid-mission collapse, and retiring a radiation-storm band once its
# sweep is done — so this world is both of those, run past every consequence a
# removal has.
#
# The point of the world is that a scripted destruction is INDISTINGUISHABLE
# from a combat kill downstream. It chains the same `WorldEvent::Destroyed`, so
# the same `on_destroyed` and `on_all_destroyed` triggers fire off it; it ends a
# mid-flight operation through the same eligibility spine a hull shot out from
# under a tug would; and it leaves the same nothing behind in a snapshot.
#
# The authored timeline, in mission seconds:
#
#   t=0    `on_start` spawns TWO storm bands into the `storm_band` group and
#          posts both objectives. The bands are spawned rather than authored as
#          `[[entity]]` blocks because group membership only registers through
#          `SpawnEntity` dispatch — an `on_all_destroyed` group has no other way
#          to learn who is in it.
#   t=1    `on_begin_stabilise` sends the tender to stabilise the skyhook. The
#          capability is authored at 20 seconds, far longer than the run needs,
#          so the hold is unambiguously MID-FLIGHT when the skyhook goes.
#   t=5    the `skyhook_collapse` deadline fires and the script destroys the
#          skyhook. Three things must follow from that one call:
#            - `on_skyhook_lost` (a chained `on_destroyed`) FAILS its objective,
#            - the tender's hold settles `Failed(TargetGone)` — waiting cannot
#              bring a skyhook back, and a failed operation pays nothing,
#            - `AiEntityDestroyed` reaches the ordinary external consumers.
#   t=6    `on_sweep` schedules the first band's retirement two seconds out,
#          through `ctx.schedule.in_seconds(2).destroy_entity(…)`. The DEFERRED
#          form, deliberately: it is the same `TriggerAction` on the same queue,
#          and this is where that claim is run rather than asserted.
#   t=8    band A is retired by that deferred call. The group must stay SILENT —
#          one of two is not all of them, and a group that fired here would
#          satisfy a fires-at-the-end assertion just as well as the real thing.
#   t=10   `on_sweep_last` retires band B immediately. NOW `on_all_destroyed`
#          fires and completes the band objective.
#
# Every handler writes a counter flag, so the headless test reads fire ORDER and
# fire COUNT out of the flag store rather than out of a log line.
#
# BASELINE (this world is new in #1033, so this is its first recorded digest):
# `--seed 42 --ticks 900` gives final digest 0xcb84eaa232a41b11
# (14665104268980394769), and 9365114570161849778 at tick 0. Measured on a clean
# tree at the commit that added this line. It is a NEW number, not a preserved
# one — nothing to compare it against yet — so it is written down here to be the
# thing a later change is A/B'd against, the way the shipped worlds' digests
# already are.
#
# The two SHIPPED worlds are unmoved (combat_test 14942520827746055774, patrol
# 11531679067393217131). Neither destroys anything from script, and a destroy
# mints nothing — the entity namespace's counter does not advance on a removal —
# so neither world's mint sequence or fold can have shifted.
#
# STILL 0xcb84eaa232a41b11 AFTER THE RADAR-DAMPENING SIGN FIX (found in #1037),
# and this world is one of the two that spawn the template that changed, so the
# hold is a claim rather than an oversight. `region_storm_band.toml`'s
# `[effects.radar_dampening] range_modifier` went from `0.5` to `-1.0` — from a
# radar-range multiplier of 1.5 to one of 0.5, which is to say from a storm that
# made the radar reach further to one that halves it.
#
# THE MECHANISM IS THAT RADAR RANGE IS NOT FOLDED, and this was measured rather
# than reasoned. `ShipModifiers` is not in `sim_digest`'s fold at all — the
# entity namespace folds `ShipPhysics`, `SystemHull` and `ShipRedAlert` — so a
# radar horizon only ever moves a digest by changing BEHAVIOUR that reaches
# physics, hull, or one of the other folded namespaces. Nothing in this world
# reads one: the bands exist to be destroyed by name on a script timer, both
# cruisers are parked, and there is no combat for an acquisition horizon to
# change. Re-authoring the same field to `-999.0` (radar effectively dark) and
# to `+999.0` (radar effectively unbounded) BOTH reproduce
# 14665104268980394769 exactly, and so does deleting the band's `slow_zone`
# outright — which is the sharper half of the evidence, because in
# `probe_operations` that same deletion DOES move the number. Nothing here is
# inside a band.
#
# STILL 0xcb84eaa232a41b11 AFTER THE SLOW-ZONE SIGN FIX as well, the sister
# defect on the neighbouring field pair of the same block:
# `region_storm_band.toml`'s `thrust_modifier` and `yaw_rate_modifier` went
# from `0.5` / `0.6` to `-1.0` / `-0.6666667`, from a band that made ships half
# again as fast to one that halves their speed. This world holds for the
# BLUNTEST of the available reasons and it is the same one as last time:
# nothing is inside a band. The bands are here to be destroyed by name on a
# script timer, and both cruisers are parked well clear of them.
#
# That makes this the weakest of the four attributions and it is worth saying
# so. `MaxSpeed` is genuinely folded — it reaches `ShipPhysics` before the helm
# integrates, unlike radar range, which is folded nowhere — so this world's
# hold proves only that its own ships never enter a band. The claim that the
# NUMBERS fold nothing even for a ship standing in one is made where there is a
# ship standing in one, in `probe_operations` and `probe_storm`. Measured here
# anyway, for completeness: `-999.0` and `+999.0` on both fields each reproduce
# 14665104268980394769 exactly.

[global]
seed = 1033
ai_helm_tick_hz = 30.0

[player_spawn]
position = [0.0, 0.0, 0.0]

# The player ship, present because a world needs one. It does no work here.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "player-ship"
transform = { position = [0.0, 0.0, 0.0] }
spawn_on = "game_start"

# The operating ship. Same faction as the player, so nothing in this world
# shoots at anything — every destruction in the run is a scripted one, which is
# what makes the assertions about scripted destruction mean something.
#
# `duration_secs = 20` is the load-bearing number: the operation must still be
# running when its target is destroyed at t=5.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
name = "world.probe_destroy.entity.tender.name"
transform = { position = [200.0, 0.0, 0.0] }
overrides = { operations = { capability = [{ verb = "stabilise", range = 2000.0, duration_secs = 20, power_group = "helm", min_power_level = 2, condition_on_complete = 25.0 }] } }

# The structure that collapses. Degraded on spawn so the operation has real work
# to do, and so a run where the stabilise somehow COMPLETED would be visible.
[[entity]]
template_path = "assets/entities/depot_transfer.toml"
name = "world.probe_destroy.entity.skyhook.name"
transform = { position = [400.0, 0.0, 0.0] }
overrides = { infrastructure = { condition = 30.0 } }

# The collapse, as a named thing in the world rather than an anonymous timer —
# the crew can watch it coming.
[[deadline]]
id = "skyhook_collapse"
label = "world.probe_destroy.deadline.skyhook_collapse.label"
due_secs = 5
visible = true

[script]
setup = """
on_timer(0, "on_start");
on_timer(1, "on_begin_stabilise");
on_timer(6, "on_sweep");
on_timer(10, "on_sweep_last");

on_deadline("skyhook_collapse", "on_collapse");

// The two chained triggers. Neither is armed by anything this world shoots at;
// only a scripted destruction can make either fire.
on_destroyed("world.probe_destroy.entity.skyhook.name", "on_skyhook_lost");
on_all_destroyed("storm_band", "on_band_cleared");

fn on_start(ctx) {
    // Two bands of the same storm, spawned into one group so retiring the
    // storm means retiring all of it.
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/region_storm_band.toml",
        name: "storm_band_a",
        position: [1200, 0, 0],
        groups: ["storm_band"],
    });
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/region_storm_band.toml",
        name: "storm_band_b",
        position: [1200, 0, 900],
        groups: ["storm_band"],
    });

    ctx.effects.add_objective(#{
        id: "obj-hold-skyhook",
        text: "world.probe_destroy.objective.hold_skyhook.text",
        mandatory: true,
        targets: ["world.probe_destroy.entity.skyhook.name"],
    });
    ctx.effects.add_objective(#{
        id: "obj-clear-band",
        text: "world.probe_destroy.objective.clear_band.text",
    });
}

fn on_begin_stabilise(ctx) {
    ctx.effects.stabilise(
        "world.probe_destroy.entity.tender.name",
        "world.probe_destroy.entity.skyhook.name",
    );
    ctx.flags.increment("op_started", 1);
}

// The collapse itself: one call, and everything below follows from it.
fn on_collapse(ctx) {
    ctx.effects.destroy_entity("world.probe_destroy.entity.skyhook.name");
    ctx.flags.increment("collapse_fired", 1);
}

// Chained off the collapse's own Destroyed event, in the same tick.
fn on_skyhook_lost(ctx) {
    ctx.effects.fail_objective("obj-hold-skyhook");
    ctx.flags.increment("skyhook_lost", 1);
}

// The DEFERRED destroy: same action, same queue, two seconds later.
fn on_sweep(ctx) {
    ctx.schedule.in_seconds(2).destroy_entity("storm_band_a");
    ctx.flags.increment("sweep_scheduled", 1);
}

fn on_sweep_last(ctx) {
    ctx.effects.destroy_entity("storm_band_b");
    ctx.flags.increment("sweep_last", 1);
}

fn on_band_cleared(ctx) {
    ctx.effects.complete_objective("obj-clear-band");
    ctx.flags.increment("band_cleared", 1);
}
"""

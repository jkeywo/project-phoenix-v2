  - component: helm-vertical-thrust-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Vertical Thrust AI Operator
      summary: Non-player-facing per-axis fine-system operator that reads the shared hazard assessment's moving-hazard threat, weights it by the hull's authored vertical sensitivity, and emits an admitted VerticalThrustInput command that climbs to avoid moving hazards (bounded within an authored offset, unbounded in full-3D) and eases back to the cruise plane once the threat clears.
      rationale:
        - Vertical thrust is a separate fine system even though it is not player-facing yet.
        - In bounded mode it should support AI-only above-below avoidance and then return toward the authored cruise plane when urgency falls.
        - This operator should react to moving hazards only, leaving static-obstacle responses to other helm actuators.
        - "Issue #780 moved the ACTUATION DECISION onto the authored #775 policy spine: HelmVerticalAiPolicy (attached at spawn from [helm_console.vertical_ai]) resolves the vertical channel to the actuate_vertical_thrust mode verb over a fact snapshot seeded from the shared moving-hazard threat and the ship's current vertical offset (seed_helm_actuator_facts). The authored VerticalMovementMode still gates the magnitude host-side, so a Planar hull takes no Y component regardless of the verb (planar-facing contract preserved). A hold resolution emits nothing."
        - "Issue #885 (8555e336) deleted the default_vertical_ai_config synthesiser that used to fill an unauthored block (an unconditional actuate rule). Strict AI-declaration mode is now the default in EntityConfig::from_toml, so an undeclared block is a LOAD ERROR rather than an invented policy, and every shipped hull authors the block explicitly."
    architecture:
      kind: service
      authority: authoritative

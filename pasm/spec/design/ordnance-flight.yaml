      paths: [crates/phoenix-sim-gameplay/src/weapons/illumination.rs, crates/phoenix-simulation/src/console/weapons/illumination.rs]
      symbols: [IlluminationConfig, ShipIllumination]
      tests: [crates/phoenix-sim-gameplay/src/weapons/illumination_tests.rs, crates/phoenix-simulation/src/console/weapons/illumination_tests.rs]


  - mechanic: gm-t2-directed-world-actions
    core:
      status: accepted
      confidence: confirmed
      title: Bounded Directing Vocabulary
      summary: "M2 exposes typed scenario-authorable actions for palette spawn, safe despawn, authored doctrine/directive changes, authored Objective activation and active Objective completion/failure, reveal/conceal/normal knowledge overrides, direct damage, healing, System disable/restore, and Station puppeting. Spawn uses only scenario/mod palette templates; the GM always picks position on the map and drags for heading, and the command carries resolved world coordinates and heading rather than pixels. Safe despawn covers removable NPCs, structures, and spawned hazards while excluding player ships, GM peers, and foundational entities and clearing references."
      rationale:
        - "Objective activation can select only authored palette entries with String Table text, directive, scoring, and targets. T2 has no free-text Objective authoring, arbitrary score editing, deletion, or reopen."
        - "Reveal and conceal are persistent per observing player ship and target. Reveal guarantees a basic contact but not protected classification; conceal suppresses normal sensors; Normal clears the override. Overrides survive reconnect/snapshot and disappear with either referenced entity. False contacts, delay, and degradation wait for M7."
        - "[ai] #1309 stores canonical Reveal/Conceal overrides by observing player ship and target in WorldContentRuntime; Normal removes the pair. The observer's Sensors blackboard carries only its own map. The shared Sensors console and GM Crew Knowledge builders preserve ordinary visible and independently earned knowledge under Reveal, adding only a position-only contact when ordinary sensors would omit it; that added basic contact never rehydrates hull or classification from the raw replica. Conceal removes sensor contacts, selection detail, scan readings and sensor warnings; independent Comms and Objective knowledge is unchanged. Snapshot and digest include the pair state, and lifecycle pruning removes either vanished identity before fixed-step checkpoint sampling."
        - "Damage and healing accept arbitrary absolute HP amounts scoped to an Entity, Station, or System. They are direct/internal and bypass shields: Entity uses the existing deterministic weighted hull distribution (or an NPC scalar path), Station restricts that distribution to its owned damageable Systems, and System targets one System. Healing mirrors scope, clamps at maxima, and reports discarded overflow. Normal damage tiers, destruction, repair, events, and triggers still apply."
        - "System disable is an explicit GM-disabled latch independent of HP. Restore removes only the latch and does not heal, so an otherwise damaged or destroyed System may remain offline."
        - "[ai] #1312 carries absolute SetSystemDisabled requests through canonical GM admission and apply-tick System validation. The independent ControlSourceResolver latch blocks ordinary operation and admission while leaving damage and rating state untouched. Sorted latch identities are captured, restored before continuation admission and folded into the digest. The entity inspector projects configured Systems and both latch and effective availability, retaining target/System attribution on applied, no-op and refused results; system.disable and system.restore supply confirmation categories to the shared confirmation controller."
        - "[ai] Issue #1310 (Entity damage and healing) implemented 2026-09-06, as ONE `GmAction::ApplyDirectEffect` carrying `{target, scope, effect, amount_milli_hp}` rather than four verbs. Scope and kind are their own append-only enums, so #1311 adds Station/System by appending a `GmDirectEffectScope` variant instead of forking a second action family for the same mechanic. There is no separate NPC scalar path in code to write: `entities::spawner` converts a legacy scalar `hull_integrity` into a one-entry `SystemHull` at spawn, so the ordinary weighted distribution IS the scalar path applied to a hull of one."
        - "[ai] Amounts are absolute THOUSANDTHS of a hull point, everywhere from the browser input to the digest. `GmAction` derives `Eq` (the journal, the grant, the mesh frame and the durable result all compare), which an `f32` field would take away from all of them; an integer is also the honest shape for a number a human types into a box, and it keeps the lethality preview and the authoritative result from disagreeing by a rounding step."
        - "[ai] The effect is RESOLVED in the `PreUpdate` reducer at the agreed apply tick — target lookup, clamp, discarded overflow, lethality — and ARMS `PendingGmDirectEffects`; `gm_effect::apply_gm_direct_effects` lands exactly that resolved amount in the ordinary `SimSet::Damage` phase. Same division as a manual Fire and for the same reason: the reducer holds none of the destruction lifecycle's parameters, and a second damage path in PreUpdate is the one shape that would make a GM hit differ from a beam hit. Because the arm carries an already-clamped amount, the durable result's numbers cannot drift from what the world does."
        - "[ai] Nothing to change is a No-op, not a refusal: a full hull asked to heal and a wreck asked to take more damage both report zero applied and the whole request discarded. An unknown uuid and a hull-less entity are canonical refusals (`UnknownEntity`, `TargetNotDamageable`), appended to `GmActionRefusalReason` because the journal is postcard-encoded into the digest by variant index."
        - "[ai] The distribution draws from `sim_rng::with_event_generator` keyed on the grant's canonical `GmActionOrder` sequence, NOT from a ninth `SimStream`. A stream is a running position, which is the right model for a site that fires per landing tick; a GM effect is a discrete grant with a total order of its own, so keying on that ordinal is a stronger isolation — two effects cannot reorder each other and neither can move a weapon's sequence by existing. It also costs nothing: `SimRngState` serialises one generator per stream and the digest folds the whole state, so a ninth stream would move every world's tick-0 digest and reject every recorded snapshot."
        - "[ai] Healing mirrors damage exactly: `SystemHull::restore_distributed` is the same walk, the same `unit_f32` draw against a running weight total and the same spill loop, weighted by `max - current` instead of `current`. A system at 0 HP therefore has the largest headroom and is the most likely to be revived, which is `restore`'s already-documented route out of `Destroyed` applied to the whole hull."
        - "[ai] The crew see only the fictional consequence because the applier emits the SAME unconditional `BalanceEvent::DamageApplied`/`EntityDestroyed` a beam hit emits, under a `gm.direct` weapon sentinel a balancer can exclude. Destruction follows the region/beam fleet-versus-NPC branch keyed on `FleetSlotOf`, never `LocalShip` (#1116) — sharper here than anywhere else, because the GM peer that pressed the button has no local ship at all. God Mode is deliberately NOT consulted: it is a local debug toggle, and a peer whose overlay swallowed another peer's replicated grant would fold a different hull from everyone else."
        - "[ai] The armed queue is captured in the snapshot (format 22) and folded into the digest ONLY when non-empty, so no world that never uses the surface moved its digest and no cross-target ledger needed re-blessing. `LoggedGmAction` gained an optional `effect` for the same reason it gained `target` in #1301: the activity feed and the entity panel read the bounded RESULT surface, not the journal, and a restored feed must still be able to say how much a logged hit landed and discarded."
        - "[ai] Results ride the existing `gm_entity` Host Channel rather than a channel of their own: the panel that submits an effect is the entity inspector, which picks its target out of that exact payload, so the answer belongs beside the thing it was aimed at. `GmEntityStatus` gained absolute hull totals for the same surface — a percentage cannot answer \"would 40 points kill this\", which is the one question a GM about to press Damage needs answered. The full confirmation/preview platform remains #1315's; this slice carries only the metadata its own warning needs."
        - "[ai] \"Flow through existing damage behaviour\" is taken literally at two further points. (1) The applied amount is mirrored into `EntityShipArcHull` (issue #514) from inside the SAME keyed generator, exactly as the damage zone, beam, torpedo and collision sites mirror it — the arc pool tracks TOTAL hull damage and `sync_console_damage_tiers` derives the `shield-arc-<id>` offline entries from it, so a GM hit that moved `SystemHull` alone would be the only hull hit in the game after which the arc tiers stopped following the hull. Healing is deliberately NOT mirrored: `ShipArcHull` has no distributed restore and no repair path the crew can reach refills it, so GM healing behaves like every other repair rather than inventing a distribution. #1311's Station/System scopes inherit both rules. (2) A hit on the crew's own hull emits the ordinary `ServerMessage::DamageTaken` (all hull, zero shield — a direct effect bypasses shields), which is what drives the haptic pulse and the forcefield audio spike; without it a GM hit would be the one hull hit that lands in silence. That outbox push is the ONE `LocalShip` read in the applier and nothing folded reads the marker, which `tests/local_ship_neutrality.rs` guards."
        - "[ai] `UnknownEntity` and `TargetNotDamageable` are told apart by holding the hull as `Option<&EntitySystemHull>` in the reducer's lookup rather than filtering on it. `HullSpawn` attaches `EntitySystemHull` only for a template with a `[hull]` section, so every shipped nav beacon and planet is a live selectable thing with no hull component at all; a query that required the component would tell their operator that nothing in the world answers to the identity they just clicked. Both undamageable shapes — no component, and an authored `[hull]` declaring no systems — return the same refusal, and the fixture spawns both."
        - "[ai] Issue #1307 adds a separate scenario-authored gm_objective_palette, parsed through the ordinary AddObjective directive and utility adapter. It exposes only authored ids, text, targets, scoring and immutable recipient scope. Dynamic layers contribute rows with their origin and withdraw them on unload; colliding ids refuse the incoming layer before mutation. Empty targets remain empty, since a GM action has no fictional triggering contact."
        - "[ai] Recipient scope is separate from subject targets. An Objective keeps one global status and its authored recipient ships receive it together; legacy empty scope remains all ships. Complete and fail must name the exact retained scope and an Active record at the agreed tick. No independent per-ship progression, partial resolution, free text, score editing, delete or reopen is introduced. Live ship resolution and prior actions at the same tick are authoritative, and unavailable authored recipients never broaden to global scope."
        - "[ai] Palette ids and recipient names obey the canonical action's nonempty, control-free, 128-byte identity bound and 32-recipient limit. Resolved aliases and retained Objective records cross the same vocabulary check before a projection advertises availability; a live identity that cannot be submitted never enables a control."
        - "[ai] Native radar rendering and auto-fit read only bridge sources owned by the current widget, including its centre. A hidden widget may keep its prior sources but cannot reintroduce resolved or removed Objective markers, regions, labels or rings into the active projection."
        - "[ai] Shared WorldData retains host-independent lifecycle metadata. Its cached objective_target flag grants no crew visibility: viewscreen, Tactical, GM authentic Station replicas and shared JavaScript radar builders replace that flag from the recipient ship's current Objective list, including when the list is empty or the Objective is terminal. Synthetic objective_marker regions obey that same recipient rule."
        - "[ai] GM actions and ordinary script actions share the same Objective mutation helper, BalanceEvent facts, layer ownership and fictional transition log. The GM reducer applies this bounded mutation directly at its agreed PreUpdate boundary, before normal FixedUpdate script evaluation, so there is no deferred result/queue gap. Typed results retain verb, recipient scope, operator, correlation and outcome; terminal action previews use those same immutable facts."
        - "[ai] Objective records now travel in snapshot format 28 and contribute to the deterministic digest, including directive, utility, text parameters, command stance and recipients, in insertion order. Restore replaces the complete record set without synthesizing story events. Empty Objective state preserves the old digest walk. Captain, Comms, AI scoring, Command stances and GM crew knowledge share recipient filtering; global scenario and narrative observers still see the one global lifecycle."
        - "[ai] Format 28 also retains each active layer's ordered owned_objective_ids beside its flags and folds nonempty ownership lists. A restored layer therefore retracts the same Objectives, directives and stances on unload as uninterrupted execution; recreating the palette never substitutes for restoring the already-applied ownership. Canonical Objective activity facts carry their recorded recipient UUIDs as semantic ship references and Ship links, with cached names or UUID fallbacks, so ship filtering retains scoped history even after a recipient disappears. Only an empty recorded scope is global."
        - "[ai] Issue #1305 implements the SPAWN half. The palette is a scenario/mod `[[gm_palette]]` table of {id, String Table label, one template_path, optional name_prefix/groups, and a CLOSED list of authored variants}; the variants ARE the 'allowed overrides', each a stable id, label and authored `overrides` document merged exactly as a scripted `spawn_entity`'s is. `GmAction::SpawnPaletteEntity` carries a palette id, at most one variant id, and a resolved placement - it has no field an asset path, a component or a free-text override could occupy, so 'arbitrary loaded asset paths are never accepted' is a property of the wire shape rather than a rule to enforce. Palette template paths join `entity_template_paths` (preload) and `eager_record_world_entities` (the frozen content set), so a placement resolves a template the run already bound rather than tripping `note_uncovered_spawn`."
        - "[ai] The placement crosses the wire, the journal, the snapshot and the digest as FIXED POINT - `position_mm: [i64;3]` and `heading_mdeg: i32` - never floats. A GmAction is compared for equality by the journal's idempotency checks and folded through postcard, and a float has neither a total equality nor one spelling (NaN != NaN, 0.0 == -0.0 with different bits); fixed point also turns an out-of-range placement into a bounds check rather than an is_finite dance, refused identically at the browser ingress and at `GmActionGrant::validate` (so the canonical journal never holds one, and no peer's apply boundary ever sees one)."
        - "[ai] Applying a placement ARMS it, exactly as a Fire arms an event and for the same reason: `apply_due_actions` is a PreUpdate system (Pause must be consumable while FixedUpdate is starved) and holds none of the template loader, uuid mint, anchor tables or layer map a spawn needs. The reducer revalidates everything that decides the RESULT - the palette entry and its variant, which a layer load/unload moves - then pushes a `PendingGmSpawn`; `tick_trigger_pipeline` drains that queue through the ordinary `TriggerAction::SpawnEntity` dispatch, so a GM spawn and a scripted spawn are one spawn with one override merge, one WorldIdMint draw and one EntitySpawnOrigin."
        - "[ai] Unlike a Fire, a placement is NOT idempotent against world state: two presses of one palette entry are two hulls. The spawned entity's scenario name is therefore derived from the canonical grant SEQUENCE (name_prefix-or-id plus the sequence), which is globally unique and identical on every peer including one that restored mid-run - never from a live counter. The pending queue is a Vec in grant order and its order is folded, because the order decides which placement draws which mint id."
        - "[ai] An armed placement whose palette entry has gone (its layer unloaded between the apply tick and the drain) is DROPPED, where an armed Fire held by a false `when` is retained: nothing about a placement can become possible later, so retaining it would be authoritative state accumulating with no future."
        - "[ai] A hull's pose is ShipPhysics, not its Transform - the spawner seeds yaw 0.0 and integrate_ship_physics rewrites the Transform from it every tick - so the shared `ActionCmd::SpawnEntity` applier now seeds that yaw from an authored rotation. Without it a dragged heading (and a scripted spawn's authored rotation) survived exactly until the first fixed step. No shipped world passes a rotation to a scripted spawn, so no existing digest moved."
        - "[ai] The map gesture lives on ph-navigation-map rather than in a GM-only surface: press/tap picks the position, drag picks the heading, and the chart's existing keyboard cursor plus the bracket keys and Enter do both without a pointer - one #placementWorldAt conversion behind all three, which is why mouse, touch and keyboard resolve the same world point. The chart emits one navplace carrying world metres and degrees; the panel owns the command and converts to fixed point once. The typed coordinate form beside the map runs the identical place()."
        - "[ai] Round-1 review (#1305): the only whole-path browser evidence -- the spec that boots an authored `[[gm_palette]]` world, places one hull by real map press-and-drag and a second by keyboard alone, and reads both back as attributed Applied results -- was untagged, so it ran on the nightly/`smoke-full` tier only and a PR or a main push could leave the whole feature broken unnoticed. Palette placement IS a new feature area (a new `gm_spawn` Host Channel, a new `WorldSpawn` action family, a new panel, a new chart gesture), so the spec now carries `{ tag: '@core' }` and sits in the breadth pass alongside the other GM @core specs."
        - "[ai] Round-2 review (#1305): `gm_spawn` joins `gm_entity`, `gm_activity` and `gm_mission` as a raw-DTO exception on the Host Channel localisation boundary (gui/host-channel.js). Every authored `[[gm_palette]]` row REQUIRES a String Table label id, and the sibling palette/variant `id` is what the typed `SpawnPaletteEntity` carries on the wire, so `localiseTree` would have resolved the label a first time (the panel's own t() then missing and rendering the bracketed placeholder) and rewritten any id that happened to equal a table key. Separately the chart draws the armed placement with the chart's own world-absolute projection -- `(0, 0, 0)`, like the grid, the ship glyph and every blip, and like the `#placementWorldAt` inversion -- rather than through `ship_pos`/`ship_heading`, which exist only to place and rotate the ship glyph; the crew nav charts do supply them, and projecting the ring through them would have shown the operator a position the `navplace` event does not carry."
        - "[ai] Round-3 review (#1305): arming the gesture now REVEALS the chart -- navigationBeginPlacement scrolls itself into view, takes the focus and toasts what it is waiting for. The GM console is one long scrolling page whose placement panel sits above the workspace, so on an ordinary 1280x720 viewport the whole chart was below the fold at the moment PLACE armed it: a real press-and-drag landed on whatever else was on screen and the placement reported nothing at all, not even a refusal, and the keyboard path needed the operator to Tab to a chart they could not see. #beginPick already took the focus for the waypoint gesture for the same reason. A gesture that resolves no world point now dispatches navplacecancel rather than disarming in silence, so the panel can never stay armed against a chart that is not."
        - "[ai] Issue #1311 (Station and System scope) implemented 2026-09-06 by APPENDING `GmDirectEffectScope::Station(StationId)` and `::System(SystemId)`, exactly as #1310 said it would. Nothing forked: one action, one reducer arm, one applier, one arm queue, one snapshot field. The scope becomes a System allow-list in ONE function, `gm_effect::scope_systems`, which the reducer calls to pick the refusal and measure the totals and the damage phase calls again to restrict the distribution — two derivations of \"which Systems does this Station own\" is exactly the drift that would let a durable result promise what the world does not do. Ids are ship-local authoring keys resolved against the TARGET's own hull and ShipConfig at the agreed apply tick, never a global registry."
        - "[ai] The restriction lives in the DISTRIBUTION, not in a caller that clamps afterwards: `SystemHull::apply_damage_within` / `restore_distributed_within` take an allow-list, and a System outside it contributes no weight, cannot be chosen, cannot be the float-precision fallback and cannot absorb spill. `None` is the whole hull and is byte-for-byte the pre-#1311 walk, so a Station-scoped GM hit and a beam hit still choose their systems by one rule. System scope is the same walk with an allow-list of one, which is why there is no separate single-System path to keep in step."
        - "[ai] The clamp measures the SCOPE and lethality measures the WHOLE HULL — `resolve_direct_effect_within`, with `resolve_direct_effect` now defined as that function given one total. Emptying a Station is not sinking a ship, and a result that reported `destroyed` because its scope reached zero would put a kill in the activity feed and the command log that the world never performed. The applier already asked the whole hull (`is_destroyed`), so this is the same question asked one phase earlier rather than a new rule."
        - "[ai] Refusals reuse the existing vocabulary wherever the fact already had a name: a Station this target does not author is `UnknownStation` (including every target carrying no ShipConfig at all — a structure, an asteroid, a bare `[behaviour]` hull — which is refused rather than silently widened to the whole hull), and a Station whose owned Systems this hull tracks none of is `TargetNotDamageable`, the scoped spelling of the answer a beacon already gets. Only \"no such damageable System\" had no name, so exactly one variant — `UnknownSystem` — was APPENDED after `WorldUnavailable`. Asked of the HULL rather than the ship config on purpose: an authored `[[system]]` with no `[[hull.system_hull]]` entry (every Alliance radar) exists but can never be damaged, and \"nothing damageable answers to that name\" is the honest answer for both."
        - "[ai] Simultaneity across scopes: `PendingGmDirectEffects::project_totals` takes the press's scope AND its kind, and skips an armed effect whose scope cannot overlap it, so two GMs pressing disjoint Stations on one boundary do not resolve against each other. Of the arms that do overlap, one CONTAINED by the press's scope (`gm_effect::scope_contains`, with the whole hull containing everything) lands every point it carries inside that scope whichever System absorbs it, so it is projected WHOLE and is exact. An arm that is WIDER, or only partly overlapping, lands an unknown fraction here — only the damage phase's keyed generator decides how much, and drawing that in the reducer would both consume the generator twice and make the answer depend on a draw the applier has not made — so it is projected only when it moves the press's headroom the SAFE way, which is exactly when its kind matches. A Damage press's headroom is the projected current (a damage arm shrinks it, a heal arm would grow it); a Heal press's is `max - current` (a heal arm shrinks it, a damage arm would grow it). Round-1 review (#1311) found the unmatched direction being taken: a whole-hull heal armed before a Station damage press raised that press's headroom on points the heal may deliver entirely to another Station, and the durable result the feed, the command log and a restored feed re-render promised hull the world never landed — chained, it could even report `destroyed` for a kill the applier never performs. Both directions are now conservative: the narrow press can resolve to less than it might have got, never to more than the hull will honour. The whole-hull lethality projection is untouched, because every arm is contained by the whole hull."
        - "[ai] Snapshot format 26 carries the scope of an armed effect and `LoggedGmAction` gained an optional `effect_scope`. Both are `Option`/`Entity`-shaped so a run that only ever aims at whole hulls serialises byte-identically to its #1310 shape and no recorded world's digest moved; no cross-target ledger needed re-blessing. The format gate refuses a format-25 record rather than defaulting the scope, because a resumed feed that read a Station hit as a whole-hull one would say a GM emptied a ship when they emptied one console."
        - "[ai] The browser needed new plumbing, not a new panel: `GmEntityStatus` gained a `systems` breakdown (System id, authored owner Station, display name, live milli-HP totals) on the omniscient `gm_entity` channel, omitted from the wire when empty so a beacon or region row is unchanged. The scope of a directed effect is a ship-local authoring key, and a browser that invented one would be composing an identity the simulation never published — the rule the map selection already follows for the target itself. `gui/gm-effect-scope.js` is the one browser vocabulary for the enum, read by the panel and by the activity feed, for `gm-action-reasons.js`'s reason."
        - "[ai] The scope crosses INBOUND as serde external tagging and OUTBOUND as a flat `{scope, scope_id}` pair the typed ingress guards with its exact-field-count discipline (now eight, both fields always present, `scope_id` null for the whole entity). The asymmetry is deliberate: a flat pair has one spelling a browser can send, where a nested object would give a client a second place to put a field nobody validated."
        - "[ai] Round-2 review (#1311): each `GmSystemHullStatus` row now also carries `station_name`, the owning Station's authored display name -- the exact value the sibling `GmStationInterfaceProjection` already publishes for the same Stations on the same ship. Without it the picker had only the raw `station_id` for the Station half, so one `<select>` read \"Station: tactical\" directly above \"System: Impulse Drive\": two naming conventions in one control, and the Station half untranslatable even though `[[station]] name` is a REQUIRED authored field on every shipped hull. Both halves now follow one rule -- render the authored display name the projection published, fall back to the authoring key only when nothing named it -- and both pass through the same `wireText` seam, so a String Table id resolves and literal authored prose reads as authored. The field is `Option` and omitted when absent, so an entity with no ship config keeps its wire shape."

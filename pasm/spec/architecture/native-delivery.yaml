entities:
  - runtime: native-host-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Native Host Runtime
      summary: The native phoenix-host binary. One executable, two modes. With no --world it serves a built client bundle, the content manifest, the scenario catalogue and the delivery version stamp over HTTP, so a Phoenix host is not required to be an open browser tab. With --world (issue #1121) the SAME process is authoritative: it runs the ordinary simulation and plugin graph through the shared boot seam and draws the shared viewscreen with native Bevy/wgpu through winit, while the delivery half moves to a worker thread because winit owns the main one.
      rationale:
        - "[ai] Authority is a property of the invocation, not of a second binary, and the entity is marked authoritative because that is the stronger of the two modes it can be in. Issue #1121 asked for the delivered host to be EVOLVED rather than duplicated, so PRD #855's bundle serving, catalogue restriction and startup version pin are the same code either way — a parallel binary would have had to fork them or link them anyway."
        - "[ai] What it does NOT yet do is accept browser crew clients: PeerJS is browser JavaScript and cannot run in a native process, which is why #1121 is filed as blocked by the Phoenix transport (#1112). src/native_host/transport.rs is the seam that transport plugs into, and --solo is currently the only mode that reaches a running mission."
    architecture:
      kind: runtime
      authority: authoritative

  - component: delivery-catalogue-payload
    core:
      status: implemented
      confidence: confirmed
      title: Delivery Catalogue Payload
      summary: The single ordered field list for a published scenario/ship catalogue entry, walked by the wasm bridge's JS object construction and by the JSON encoder alike, so the browser host and the native host publish the same document by construction rather than by agreement.
      rationale:
        - "[ai] PRD #855's first implementation decision is that native and browser hosts consume the same content manifest and protocol contracts. That is only true if one place says what a catalogue field is called; before this, wasm_get_scenario_catalog and ship_entry_to_js named every field themselves, so a second publisher would necessarily have been a second field list."
        - "[ai] The payload holds (key, value) pairs rather than a serde struct because the wasm surface is a JS object built with Reflect::set and the native surface is JSON: a shared serde type would still have left the JS side spelling out keys. Neither surface carries a field name of its own now."
        - "[ai] The enrichment fields (class, hull_id, power_rating, name) read config_cache::get_cached_entity_config, whose signature is identical on both targets — the browser fills that cache by fetch, the native host by insert_native_config — so this is genuinely the same code path and not a target-conditional twin."
    architecture:
      kind: contract
      authority: authoritative
      reads: [world-content-pack-state]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/delivery/payload.rs, src/core/codec.rs, src/server/bridge.rs]
      symbols:
        [
          ShipPayload,
          ScenarioPayload,
          ship_payload,
          scenario_payload,
          catalog_payload,
          encode_delivery_manifest,
          encode_delivery_stamp,
          wasm_get_scenario_catalog,
          wasm_delivery_stamp,
        ]
      tests: [cargo test, tests/native_host.rs]

  - component: delivery-version-pin
    core:
      status: implemented
      confidence: confirmed
      title: Delivery Version Pin
      summary: The three-number stamp — wire protocol revision plus the scenario manifest's content id and epoch — that a host publishes and checks, refusing an incompatible client with a machine-readable code, prose naming both sides, and the host's own stamp.
      rationale:
        - "[ai] Two of the three numbers already existed: the manifest [content] identity is the same one the mod-pack contract (issue #986) gates uploads on. Only PROTOCOL_VERSION is new, and it is a version OF the existing wire vocabulary, declared beside the types it versions in core/messages.rs so bumping it is part of changing them."
        - "[ai] Enforced at two moments because the two halves are knowable at different ones. The client bundle on disk states its content identity in its own assets/scenarios.toml, so that half is checked at startup and refuses the port; a built bundle cannot state which protocol its WASM holds, so that half is checked per request."
        - "[ai] An unstamped caller is refused rather than assumed compatible, and a manifest with no [content] block stamps the empty identity no real client can match. Both follow #986's existing default: unidentified content refuses rather than silently accepts."
        - "[ai] Protocol is compared before content: a protocol mismatch makes every other field's meaning uncertain, so reporting a content difference first would send an operator after the wrong thing."
    architecture:
      kind: contract
      authority: authoritative
      reads: [world-content-pack-state]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/delivery/stamp.rs, src/core/messages.rs, src/delivery/mod.rs]
      symbols:
        [
          PROTOCOL_VERSION,
          DeliveryStamp,
          StampMismatch,
          check_client_stamp,
          check_bundle_content,
          client_stamp_from_request,
        ]
      tests: [cargo test, tests/native_host.rs]

  - component: delivery-http-contract
    core:
      status: implemented
      confidence: confirmed
      title: Delivery HTTP and Caching Contract
      summary: The transport contract a Phoenix client is served under — path resolution and its traversal guard, the MIME table, and the caching policy that makes content-addressed bundles immutable while entry points and authored manifests always revalidate. Served by the native host and, as Cloudflare Pages header rules, by the public deployment.
      rationale:
        - "[ai] Stated as pure functions over strings so the contract is testable without binding a port, and asserted a second time against a deployed URL by scripts/check-deploy-headers.mjs. Two implementations, one contract — the deployed half cannot be checked at build time and the native half cannot be checked by a CDN."
        - "[ai] deploy/cloudflare/_headers is written so no two patterns set the same header: Pages applies every matching rule and this repository has no way to test precedence, so /* carries only security headers and the media directories are named individually rather than as /assets/* (which would overlap assets/scenarios.toml, the one file under there that must never be held). Everything unnamed keeps Pages' revalidating default, which is correct for the entry points and merely conservative elsewhere."
        - "[ai] Cross-origin isolation is deliberately NOT required: the shipped build is single-threaded and COOP/COEP would break the cross-origin rendezvous socket and TURN fetches. COEP set WITHOUT COOP is an error, because that combination isolates nothing and blocks them anyway. The checker's --require-isolation is the switch for the day PRD #855's worker-thread benchmark spike says yes."
        - "[ai] .wasm is served as application/wasm because streaming instantiation refuses anything else, and the demo's gzipped .wasm.gz must arrive WITHOUT Content-Encoding or the browser unwraps what the page means to decompress itself."
    architecture:
      kind: contract
      authority: non-authoritative
      runs_in: [native-host-runtime, node-tooling-runtime]
    implementation:
      status: declared
      paths:
        [
          src/delivery/http.rs,
          deploy/cloudflare/_headers,
          scripts/deploy-headers.mjs,
          scripts/check-deploy-headers.mjs,
          .github/workflows/check-deploy-headers.yml,
        ]
      symbols: [CachePolicy, cache_policy_for, content_type_for, resolve_static_path, checkProbe, checkAll]
      tests: [cargo test, npx vitest run]

  - component: native-delivery-host
    core:
      status: implemented
      confidence: confirmed
      title: Native Host
      summary: The phoenix-host binary — one process, two modes. Its delivery half loads the manifest and worlds off disk, builds the catalogue through the shared payload, runs the startup bundle pin, and serves the stamp, manifest and client bundle, choosing its public catalogue by which manifest file it is pointed at (the same lever the browser page pulls with ?manifest=). Its authoritative half, added by issue #1121, composes the ordinary simulation through boot's fourth profile and draws the shared viewscreen natively; the two halves share the process with Bevy on the main thread and the socket loop on a worker with a shutdown path.
      rationale:
        - "[ai] The catalogue restriction needed no new mechanism: issue #917's curated assets/scenarios.demo.toml already filters the catalogue built from a world without editing that world, so --manifest is the whole of the native host's half. Since #1121 the same allowlist also narrows the DEFAULT HULL the process flies, so one host cannot publish a curated catalogue and simultaneously run something outside it; an explicit --ship still wins, exactly as ?ship= does in the browser."
        - "[ai] Hand-rolled HTTP over std::net rather than a framework, for the reason headless::args is hand-rolled rather than clap: this crate's primary target is wasm32 under lto = true, so any dependency is paid for by the browser build unless target-gated, and what is needed is a static file server and two JSON endpoints."
        - "[ai] crate::delivery is unconditional on both targets and only the BINARY is behind the host feature. A feature-gated delivery module would have been exactly the fork the PRD forbids, and would also have left its tests out of the plain cargo test CI already runs. The host feature now DEPENDS on server, because #1121's authoritative half draws the viewscreen through crate::native_host, which names the presentation plugins."
        - "[ai] The authoritative half is a fourth BootProfile rather than a fourth hand-rolled App, so the four inventories cannot drift on what the renderer owes the simulation. It refuses to compose when the composed world's declared templates, or the selected hull, are missing from the native config cache: the cache-only readers have no filesystem fallback and answer Default on a miss, which would run a plausible mission with the wrong numbers and a clean log."
        - "[ai] Superseded in issue #1121: this component previously recorded that the native host served delivery only and did not run a world. It does now. The transport clause moved with #1112: the browser route runs on the Phoenix rendezvous transport, but that transport is not yet wired into the native process, so browser crew clients still cannot join a native host."
    architecture:
      kind: service
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [delivery-catalogue-payload, delivery-version-pin, delivery-http-contract, base-scenario-manifest]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          src/delivery/serve.rs,
          src/delivery/args.rs,
          src/bin/phoenix_host.rs,
          src/native_host/mod.rs,
          src/native_host/app.rs,
          src/native_host/transport.rs,
          src/boot/mod.rs,
          src/entities/template_preload.rs,
          assets/scenarios.demo.toml,
        ]
      symbols:
        [
          HostServer,
          HostArgs,
          SimArgs,
          load_content,
          preload_templates,
          route,
          Route,
          ShutdownSignal,
          serve_until,
          enable_shutdown_polling,
          BootProfile,
          NativeRenderSurface,
          build_native_host_app,
          NativeHostConfig,
          curated_hulls_for_world,
          preload_content_templates,
          pin_content_root,
          NativeTransport,
          NativeTransportPlugin,
          preload_entity_templates,
        ]
      tests:
        [
          cargo test,
          tests/native_host.rs,
          tests/native_host_sim.rs,
          tests/native_headless_digest.rs,
          tests/native_host_snapshot.rs,
          tests/native_viewscreen_render.rs,
        ]

  - component: curated-public-catalogue-gate
    core:
      status: implemented
      confidence: confirmed
      title: Curated Public Catalogue Gate
      summary: The public build's catalogue restriction and the removal of the one control that could widen it at runtime — the host mod-pack upload, whose wasm export is compiled out of a demo build and whose button is removed from the page.
      rationale:
        - "[ai] The curated manifest decides what the demo OFFERS; a mod-pack upload adds whatever scenarios and hulls an uploaded archive carries, so leaving it enabled handed any player at the public host page the restriction's own undo. Found while verifying that the native host and the Cloudflare path both honour issue #931's curation."
        - "[ai] Gated by #[cfg] rather than a runtime refusal, following command_admission::debug_route's doctrine (issue #940): a hidden button is a UI fact and UI facts are forgeable. With no export to call, the hidden control and the closed route cannot come apart."
        - "[ai] The overlay READERS are deliberately not gated — server.html calls them unconditionally and, with nothing able to enter the stack, they answer emptily. Gating them would convert a no-op into a TypeError."
        - "[ai] The rule is stated natively as build_flags::accepts_mod_pack_uploads() so ci.yml's existing demo-build gate step, which already filters on build_flags, exercises it with PHOENIX_DEMO_BUILD genuinely set; deploy-demo.yml asserts the export's absence from the glue it is about to ship, which is the only place a wasm32-only cfg can be observed."
    architecture:
      kind: policy
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [native-delivery-host, world-content-pack-catalog]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          assets/scenarios.demo.toml,
          src/build_flags.rs,
          src/server/bridge.rs,
          gui/build-flags.js,
          server.html,
          .github/workflows/deploy-demo.yml,
        ]
      symbols: [accepts_mod_pack_uploads, offersModPackUpload, wasm_add_mod_pack]
      tests: [cargo test, npx vitest run, tests/native_host.rs]

  - component: native-station-pane
    core:
      status: implemented
      confidence: confirmed
      title: Native Station Pane
      summary: A local bridge Station operated from inside the native host process — one isolated Ultralight view showing the ordinary HTML/CSS/JS console surface, with its own document, its own minted session token, its own input queue and its own lifecycle. It joins, claims a Station, readies and plays through exactly the contracts a phone uses; in-process delivery skips network serialisation and nothing else.
      rationale:
        - "[ai] A pane must NOT use console_bridge::LOCAL_CONSOLE_TOKEN, even though that token exists, is reserved, and names a native host in its own doc comment. It takes the second branch of is_command_authorized — policy.accept_human_input with no station-tenure check at all — and carries ReturnToLobbyAuthority::Host, which can abort a running mission. It stays the host operator's own bypass; a pane mints an ordinary UUIDv4 and is a phone."
        - "[ai] Three gates keep that true, and they are not redundant: PaneIdentity::adopt refuses a reserved token so a pane cannot be CONFIGURED with host authority; PaneBus::submit refuses an Identify whose BODY token is not the pane's own, which is the only gate covering impersonation of another participant's perfectly ordinary token (handle_identify uses the body token, not the envelope's); and the issue #1121 seam refuses reserved tokens at ingress as server.html does at its PeerJS one."
        - "[ai] Audience projection needed no new mechanism. Every Audience variant resolves through SessionManager::holder_for_station into a Target before an OutboundMessage exists, so routing::pane_receives is a four-line token comparison. The failure it rules out is real and tempting: an in-process transport that broadcast every dispatch to every pane, on the reasoning that they share a process, would hand every Station's private projection to every pane and would do it silently."
        - "[ai] The pane loads the BUILT bundle's own client/index.html with two scripts injected, published in memory by this process's delivery server at the client directory's own depth. The three rejected alternatives: a native reimplementation of the shell is a second client forever behind the first; an include_str! document has no base URL, so every relative script, iframe and fetch in it fails (fetch silently), and a base tag fixes URL resolution but not the unique security origin; and the unmodified page offers no way in at all, because its transport is a rendezvous WebSocket and then a browser-to-browser DataChannel and the injection points that would supply one are inside the document. Serving at the client's own depth is what makes every relative URL resolve exactly as it does for a phone, same origin, nothing rewritten."
        - "[ai] A PANE IS AN ORDINARY JOINER IN THE PAGE'S OWN EYES, and attaches through the ONE seam gui/rendezvous-transport.js documents for it: defaultFactories() reads window.PhoenixTransportFactories on every call and names 'a native in-process host' as an intended user. pane_link.js installs an in-process socket (answers ready, then joined, relays nothing) and peer connection (the reliable channel opens at once and answers the compatibility handshake itself — one process, one bundle, nothing to disagree about), and client.html's startPhoenixJoin then runs unchanged: it resolves the code, creates the joiner, sends Identify from its own getIdent(), and publishes the activeLink façade every console command and the retry control go through. Publishing a link object of the pane's own is not an option and should not be wanted: currentLink() reads a closure only startPhoenixJoin assigns, so it would mean editing the page a phone loads. Going through the front door is also what keeps localiseTree, the status line, the #conn-diag readout and window.phoenixLink (which gui/command-gateway.js resolves against) the page's own rather than a second implementation. THIS IS A CORRECTION, not a description: the first pane_link.js published window.connectionManager, a global issue #1112 retired with PeerJS, so link.connect() was never called, Identify was never sent, pane.deliver was never installed and every send was dropped — with the page-side unit tests passing, because they called that global themselves. tests/client/pane-scripts.test.js now drives the repository's own createRendezvousJoiner over the factories instead."
        - "[ai] The pane's URL fragment carries a JOIN CODE as well as the identity, and that is deliberate rather than incidental. The fragment is the client page's one join input: joinRouteFromLocation reads any non-empty fragment as the rendezvous route and hands it to parseJoinCode, which refuses `token=…&name=…` and drops the join-entry overlay over a console that is otherwise perfectly alive. So pane_url leads with document::PANE_JOIN_CODE — a five-letter suffix assets/join/join-codes.toml accepts — and pane_boot.js consumes the identity and rewrites location.hash down to just that code before any page code reads it. Two consequences: the page's URL is then indistinguishable from a phone's that scanned a QR, and the pane's session token stops being readable out of its own location.hash. The code resolves to nothing and is meant to; the pane's socket stand-in answers joined to whatever it is handed. The literal lives in Rust and is checked against the authored table by tests/client/pane-scripts.test.js, because a value only Rust declares and only JavaScript validates is a value nothing checks."
        - "[ai] A pane's requestAnimationFrame is a TIMER, installed by pane_boot.js before gui/bg-raf-keepalive.js captures the one it will delegate to. An offscreen Ultralight view services rAF inside a rendering update and only runs one when the page is dirty, and the client page's entire render loop is a single outstanding rAF behind scheduleRender's _renderFrame guard — so a pane reaching a quiet moment deadlocks against itself: no rendering update, so the callback never fires; the callback never fires, so nothing mutates the DOM; nothing mutates the DOM, so there is no rendering update. _renderFrame stays non-null, every later scheduleRender() returns at its first line, and the console is frozen at its last paint while its transport goes on delivering correct state. Measured at 5 failures in 13 runs of tests/native_host_pane_ultralight.rs before the override and 14 consecutive passes after it; the diagnostic that found it reports _renderFrame and is kept in that test. Timers are not starved this way — Renderer::update() runs them whether or not anything painted, which is why the page's own 500 ms name-field debounce fired in exactly the runs whose rAF never did. Same class of thing as the <audio> strip below: an engine trait the pane's shim absorbs, rather than a change to the page a phone loads."
        - "[ai] The pane document also drops every <audio> element, and that one is not cosmetic. Ultralight ships no media backend — HTMLMediaElement.play is undefined and calling it throws — and client.html's send() plays the UI click BEFORE handing the message to the link, so the exception propagated out of the console_action listener and the command never reached the transport. The page's NO_CLICK set exempts SetThrust, SetSteering, Identify and SetName, so a pane joined, renamed itself and flew with the joystick while every deliberate console command, every ControlSystem, was silently dropped with a clean log on both sides. With the element gone, playClick's own `if (!el) return` is the path, and gui/settings-panel.js already filters its audioEls. Fixing it in client.html would mean changing the page a phone loads to suit a pane."
        - "[ai] A PANE'S IDENTITY IS IN THE URL FRAGMENT, NEVER IN THE DOCUMENT. phoenix-host binds 0.0.0.0:8080 with no TLS and no authentication, because its job is handing a bundle to phones on a LAN, so a session token in a served body would be a seat on the bridge available to anyone on the network. A fragment is the one part of a URL a browser never transmits, so pane_url carries it there and pane_boot.js reads location.hash at parse time; build_pane_document takes no identity at all, and every pane's document is byte-identical. Three further defences, because one is a single point of failure: the document path carries a per-pane random nonce, so it cannot be enumerated the way /client/pane-0.html could; delivery::serve::route serves a hosted document only to a LOOPBACK peer, while the bundle and manifest routes stay LAN-open because that is their job; and PaneBus::close withdraws the document, so a closed pane's path stops resolving. fragment_encode escapes everything outside RFC 3986's unreserved set, which is what keeps the fragment's own &/=/% grammar out of a participant's name; it no longer singles the underscore out, because that escape existed to keep a name like ada_lovelace off the rendezvous route and since #1112 every non-empty fragment is that route."
        - "[ai] The outbound queue is capped per delivery class rather than as a ring buffer. Snapshot messages are superseded by the next one and may be dropped; Welcome, StationAssigned and GameStarted are one-shot transitions, and a pane that missed its Welcome sits in the lobby forever with a completely clean log. A pane whose page stops draining and overflows its RELIABLE budget is closed, which hands the lobby the same disconnect a dropped phone produces — and reaching that state takes BOTH caps: this queue holds only what the host has not handed over, so a wedged page that kept accepting pushes would never fill it. pane_boot.js therefore caps the page's own inbox and THROWS past it, which pump_pane requeues as an ordinary failed push. A closed or faulted pane loses its view, its canvas node and its document at the top of the next frame; reopening is out of scope, because a PaneId is never reissued and the station is already held on Backfill."
        - "[ai] The per-frame loop runs on the Bevy MAIN thread, which is the thread FixedUpdate runs SimSet on, and every push into a page is a synchronous evaluate_script — so page JavaScript time is simulation time for every participant on the ship. pump_pane therefore pushes at most a bounded number of messages per pane per frame and requeues the rest. It matters most on the first frame after a document loads, when the whole load-time backlog is waiting at once."
        - "[ai] Each pane's view is created in its OWN Ultralight Session, named after the pane and never written to disk. Ultralight keys cookies, localStorage and IndexedDB on the Session rather than on the view, and a view created without one lands in the renderer's single persistent default session — so, since every pane document is served from this host's one origin, panes would otherwise share a localStorage including gui/session-token.js's session-token key, which is the single value deciding which participant a page is."
        - "[ai] Everything about what a pane may say and hear compiles and is tested with the SDK feature OFF, which is how every CI job builds — an arrangement rather than a fact, because --all-features enables the feature regardless. ci.yml's clippy step therefore names its features explicitly (every one declared except ultralight) and vellum's engine job excludes the crate. That split is where the acceptance criteria live: a claim checkable only on a Windows machine with a GPU is a claim nobody checks. Only the drawing and the input translation are behind --features ultralight."
        - "[ai] Deferred, and the deferral is issue #1121's own: a real BROWSER participant beside a pane needs the Phoenix transport (#1112), so acceptance criterion 5's concurrency claim is proved against a LoopbackTransport participant — literally the seam that transport plugs into. THE CRITERION STAYS UNTICKED ON #1122 and is carried as an acceptance item on #1112, where the same test swaps LoopbackTransport for the real network transport and changes nothing else, which is what PairedTransport was built for. Display profiles are #1123's and independent input routing is #1124's; panes are currently tiled evenly across one window with one pointer and one focused view."
    architecture:
      kind: service
      authority: non-authoritative
      coordinates: [native-delivery-host, system-command-admission-policy]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          src/native_host/panes/mod.rs,
          src/native_host/panes/identity.rs,
          src/native_host/panes/registry.rs,
          src/native_host/panes/routing.rs,
          src/native_host/panes/transport.rs,
          src/native_host/panes/surface.rs,
          src/native_host/panes/document.rs,
          src/native_host/panes/ultralight.rs,
          src/native_host/panes/pane_boot.js,
          src/native_host/panes/pane_link.js,
          src/delivery/serve.rs,
          src/delivery/args.rs,
          src/bin/phoenix_host.rs,
        ]
      symbols:
        [
          PaneIdentity,
          IdentityRefusal,
          PaneRegistry,
          PaneLifecycle,
          OutboundVerdict,
          pane_receives,
          PaneBus,
          PaneTransport,
          PaneInputRefusal,
          PairedTransport,
          PaneSurface,
          pump_pane,
          build_pane_document,
          pane_document_path,
          pane_url,
          mint_document_nonce,
          fragment_encode,
          connectable_host_addr,
          MAX_PUSHES_PER_FRAME,
          LocalPanes,
          HostedDocuments,
          PeerOrigin,
          peer_origin,
          PaneDisplayPlugin,
          stage_sdk,
        ]
      tests:
        [
          cargo test,
          tests/native_host_panes.rs,
          tests/native_host_pane_ultralight.rs,
        ]

  - component: ultralight-sdk-handling
    core:
      status: implemented
      confidence: confirmed
      title: Ultralight SDK, Licence and Redistributables
      summary: How the proprietary Ultralight SDK is obtained, linked, staged at runtime and kept out of every build that does not want it. Acquired by ul-next-sys's build script from a public unauthenticated URL into its own OUT_DIR, never vendored into any repository, and reachable only through the default-off ultralight cargo feature.
      rationale:
        - "[ai] The feature gate is the load-bearing part. ul-next-sys DOWNLOADS a ~100 MB proprietary archive at build time; every job in ci.yml is ubuntu-latest, the wasm build has no use for any of it, and a plain cargo test must not pay a download to run four thousand unit tests. Nothing in default, server, host, headless, capture or viewer may ever imply ultralight."
        - "[ai] DEFAULT-OFF IS NOT SUFFICIENT, and assuming it was is how the feature reached CI on the very commit that introduced it: --all-features enables everything declared regardless of what implies what, and the test job's clippy step asked for exactly that. That step now names its features explicitly — every one Cargo.toml declares except ultralight — with the same list mirrored in AGENTS.md's local gate command, so a new feature has to be added to both or it goes unlinted. Vellum solves the same problem the other way: its engine job selects the workspace with --exclude vellum-ultralight and lints that crate separately at its defaults, with a manual, non-required job type-checking the SDK half."
        - "[ai] No credential exists and none is checked in — the download URL is public and unauthenticated — so 'reproducible in development without private credentials' is satisfied by construction rather than by a secret-management story."
        - "[ai] Cargo LINKS the SDK and stages nothing, which is a runtime failure with no message: on Windows a missing DLL is a process that exits with an OS error code and nothing on screen. stage_sdk therefore runs at startup, finds the extracted SDK under the cargo build tree, copies the four shared libraries beside the executable and the SDK's resources directory (CA bundle, ICU table) into the working directory, and names them and the licence files in the operator log. That path only exists in a BUILD TREE — a packaged archive must carry them itself, which is an open decision in docs/delivery-checklist.md."
        - "[ai] The licence is the Ultralight Free License Agreement V1, shipped inside the download under the SDK's own license directory. It governs redistributing the libraries with a packaged build and nothing in either repository can answer it for a shipper, so the crate NAMES the files rather than summarising the terms."
        - "[ai] The shared plumbing was extracted to vellum's new vellum-ultralight crate rather than copied: void-and-thunder had already built the same SDK staging, the same surface-to-RGBA copy and the same evaluate_script push/poll bridge, and two independent arrivals at one mechanism is the fleet's test for a shared crate. ul-next is consequently no longer a per-game exception in vellum's dependency handbook. Pane registries, input policy, session identity and the payload schema stayed in phoenix, because void-and-thunder has no version of any of them."
    architecture:
      kind: policy
      authority: non-authoritative
      coordinates: [native-station-pane]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          Cargo.toml,
          src/native_host/panes/ultralight.rs,
          docs/delivery-checklist.md,
          .github/workflows/ci.yml,
          AGENTS.md,
          .gitignore,

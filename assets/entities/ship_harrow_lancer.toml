kind = "lateral_thrust"
station = "helm"

# The Tactical radar (issue #871) — the system every player hull declares and no
# NPC hull did, which is what blocked #887 from routing AI target selection
# through admission.
[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"

[[system]]
id = "phaser-lash"
kind = "phaser_bank"
station = "tactical"

[[system]]
id = "phaser-control"
kind = "phaser_control"
station = "tactical"

[[system]]

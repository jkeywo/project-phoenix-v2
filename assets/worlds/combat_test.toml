# ── Endings ──────────────────────────────────────────────────────────────────

# Victory: all waves destroyed. Three variants gated by ship_power so that the
# on_all_destroyed list matches exactly the entities that were spawned this
# session — an unregistered name in the list permanently blocks the trigger.
#
#   ship_power < 90  (destroyer, power_rating=70): base 8 only
#   ship_power >= 90 and < 100  (cruiser, power_rating=90): base 8 + odd-wave destroyers
#   ship_power >= 100  (battleship, power_rating=100): base 8 + all b-ships

[[trigger]]
condition = "on_all_destroyed"
entities  = ["wave_1", "wave_2", "wave_3", "wave_4", "wave_5", "wave_6", "wave_7", "wave_8"]
when      = "counter(ship_power) < 90"

  [[trigger.action]]
  type    = "game_over"
  message = "VICTORY: Harrow strike fleet eliminated. Starbase Alpha holds."

[[trigger]]
condition = "on_all_destroyed"
entities  = ["wave_1", "wave_1b", "wave_2", "wave_3", "wave_3b", "wave_4", "wave_5", "wave_5b", "wave_6", "wave_7", "wave_7b", "wave_8"]
when      = "counter(ship_power) >= 90 and counter(ship_power) < 100"

  [[trigger.action]]
  type    = "game_over"
  message = "VICTORY: Harrow strike fleet eliminated. Starbase Alpha holds."

[[trigger]]
condition = "on_all_destroyed"
entities  = ["wave_1", "wave_1b", "wave_2", "wave_2b", "wave_3", "wave_3b", "wave_4", "wave_4b", "wave_5", "wave_5b", "wave_6", "wave_6b", "wave_7", "wave_7b", "wave_8", "wave_8b"]
when      = "counter(ship_power) >= 100"

  [[trigger.action]]
  type    = "game_over"
  message = "VICTORY: Harrow strike fleet eliminated. Starbase Alpha holds."

# Defeat: Starbase Alpha destroyed.

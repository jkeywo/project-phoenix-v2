# Harrow Destroyer (formerly Pirate Raider)
#
# A small, fast attack ship. The destroyer-class core of the Harrow
# strike fleet. Re-balanced for the combat-test scenario (#474):
# hull/shield split kept the total HP budget the same as pre-#474, added
# a 0.1 shield_pierce on the main phaser bank, removed flee/warp-out so
# the destroyer fights to the death.
#
# Filename intentionally kept as `pirate_raider.toml` so existing world
# TOMLs (`default.toml`, `patrol.toml`, `reinforcements.toml`) continue
# to reference it without cascading renames.

name = "Harrow Destroyer"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "low"
description = "Harrow Destroyer"

[hull]
hull_integrity = 30.0

[shields]
max_hp = 15.0
regen_per_sec = 0.5

[collider]
shape = "Capsule"
radius = 2.0
length = 4.0

[helm_console]
max_speed = 20.0
max_reverse_speed = 0.0
acceleration = 12.5
deceleration = 30.0
max_yaw_rate = 2.0
max_bank_deg = 15.0

[weapons_console]

[[weapons_console.phaser_banks]]
id = "fore"
facing_deg = 0.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 18.75
beam_damage_per_sec = 6.0
beam_duration_secs = 4.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.1, 0.1, 1.0]
# Links this bank to the fore_emitter mount point in the model's rig sidecar
# (assets/models/dynasty_destroyer.model.toml).
marker = "fore_emitter"

[radar_appearance]
colour = [1.0, 0.2, 0.2]
size = 4.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_destroyer.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [1.0, 0.2, 0.2]

# Small ship comms — shorter range than stations or the player ship.
[comms]
range = 400.0

# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# (#474) No flee/warp_out from combat — Harrow destroyers fight to the
# death in the combat-test scenario. `warp_out` retained only for clean
# scenario teardown (on_scenario_unloaded).

[behaviour]
initial_state = "patrol"

[[behaviour.state]]
name = "idle"
kind = "idle"
target_speed = 0.0

[[behaviour.state]]
name = "patrol"
kind = "patrolling"
waypoints = ["patrol_alpha", "patrol_beta", "patrol_gamma"]
loop_path = true
target_speed = 0.4

[[behaviour.state]]
name = "pursue"
kind = "pursuing"
target_speed = 0.9

[[behaviour.state]]
name = "attack"
kind = "attacking"
maintain_range = 25.0
target_speed = 0.8

[[behaviour.state]]
name = "warp_out"
kind = "warping_out"
duration_secs = 8.0
target_speed = 1.0

# ── Transitions ───────────────────────────────────────────────────────────────

# Any state: attacked → pursue attacker immediately.
[[behaviour.transition]]
from = ["patrol", "idle", "pursue", "attack"]
condition = "on_attacked"
to = "pursue"

# Patrolling or idle: enemy comes into detection range → pursue.
# (#475) Radius extended to 5000 so destroyers detect the player from
# anywhere on the map in the combat-test scenario, where they spawn
# 600-1000u away and need to engage immediately.
[[behaviour.transition]]
from = ["patrol", "idle"]
condition = "enemy_in_range"
radius = 5000.0
to = "pursue"

# Pursuing: enemy enters weapons range → attack.
[[behaviour.transition]]
from = "pursue"
condition = "in_weapons_range"
to = "attack"

# Attacking: target destroyed → return to patrol.
[[behaviour.transition]]
from = "attack"
condition = "target_destroyed"
to = "patrol"

# Any active state: scenario unloaded → warp out gracefully.
[[behaviour.transition]]
from = ["patrol", "idle", "pursue", "attack"]
condition = "on_scenario_unloaded"
to = "warp_out"

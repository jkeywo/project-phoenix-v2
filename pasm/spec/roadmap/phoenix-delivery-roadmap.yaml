  - component: roadmap-patrol-mode
    core:
      status: accepted
      confidence: confirmed
      title: Patrol Mode — Generated Assignments (Band F Marker)
      summary: "Band F marker. Patrol is a continuing campaign of coherent generated assignments. One seeded generator produces physical systems, actors, needs, infrastructure, evidence, commitments and cascades; one Director selects assignments and pacing from current world state. A hand-authored first patrol teaches exploration before generation opens. Add discrete system-to-system warp, with separate normally abundant warp fuel made consequential only by authored loss, aid or unusual route cost. Add the shared station-database framework over one evidence/reference model: Intelligence on Comms is the primary cross-domain search and correlation surface, while every station may project its own procedures, readings and scenario facts. Patrol, later War and later Sandbox share this generator/Director under different mode profiles."
      rationale:
        - "This is the stated long-term justification for the B-D physical foundations: they exist so that generated situations, not only authored missions, can use them."
        - "PRD published as #1021 (2026-08-13, superseding the same-day PRD-when-E-nears deferral); its issue breakdown via /to-issues still waits for its band."

entities:
  - component: ship-power-controller
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power Controller
      summary: Owns power-group allocation, reactor availability, battery reserves, brownout behavior, and the authoritative power blackboard. Since issue #831 handle_power_messages is the single applier of admitted SetPowerGroupAllocation commands for the human and AI paths alike (the AI decide system emits admitted commands rather than writing a private intent component).
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [ship-power-state]
      reads: [ship-station-system-topology-state, system-control-source-state, inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/ship/config.rs, src/modifiers/power_system.rs]
      symbols: [handle_power_messages, tick_power_system, authored_power_group_seed, from_authored_groups]
      tests: [cargo test, tests/smoke/power-console.spec.ts]

  - state: ship-power-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power State
      summary: Authoritative per-ship power-group levels, battery charge, reactor/battery availability, and emergency lock state.
    architecture:
      classification: authoritative
      owner: ship-power-controller
      writers: [ship-power-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/core/messages.rs]
      symbols: [PowerBlackboard]

  - component: ship-modifier-cache
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Cache
      summary: Per-ship source-aware cache that combines numeric modifiers and OR-aggregated flags into authoritative gameplay multipliers.
      rationale:
        - Power, impulse, and regions must compose without each feature directly changing every consumer's tuning value.
    architecture:
      kind: modifier-service
      authority: authoritative
      owns: [ship-modifier-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]
      tests: [cargo test]

  - component: authored-power-ai-rule-evaluator
    core:
      status: implemented
      confidence: confirmed
      title: Authored Power AI Rule Evaluator
      summary: Per-ship Power AI that resolves an inline stateless allocation policy for every authored power group. Each power group is a dynamic output channel; the highest-priority matching rule emits the value-carrying set_power_group_allocation verb (an absolute level). Each rule declares its own minimum permitted battery reserve as an authored param referenced by its when guard, so a below-reserve guard never fires and allocation planning avoids avoidable brownouts without a fixed global emergency mode. ai_power_allocation loops the ship's authored power groups and emits an admitted SetPowerGroupAllocation system-control-command rather than mutating power state directly.
      rationale:
        - "Issue #784 reworked this evaluator onto the inline stateless FineSystemAiConfigToml spine, RETIRING the bespoke stateful engine (tick_power_rule, PowerAiRule, PowerRuleTrigger, PowerMovementInput/PowerEngageOutput EngageState hysteresis, ShipPowerAiState, PowerAiConfigResource, PowerAiConfigToml/to_ai_rules — all deleted). ai_power_allocation now reads a per-ship PowerAiPolicy(AiPolicy) and, for each authored power group (power.iter()), resolves that group's DYNAMIC channel via AiPolicy.resolve_channel over a host-seeded fact snapshot (seed_power_facts) plus the read-only WorldContentRuntime.flags scenario chain; the winning rule emits SetPowerGroupAllocation(level) with an absolute level, skipped when level == current. Rules are authored as [[power.ai_policy.rule]] entries; the minimum reserve is an authored param the guard reads (fact(battery_pct) >= param(min_reserve)). At #784 an omitted [power.ai_policy] was filled by default_power_ai_config, which synthesised the retired helm-thrust / weapons-red-alert baseline as reserve-guarded rules so that omitting the block preserved behaviour. Statelessness removes the last per-frame AI EngageState timer (AGENTS.md rule #7)."
        - "Issue #885 (8555e336) deleted that synthesiser. default_power_ai_config is gone along with every call site; strict AI-declaration mode is the default in EntityConfig::from_toml, so a hull that declares no [power.ai_policy] fails the entity load rather than having allocation rules invented for it. Every shipped hull now authors the block, proved byte-equivalent to what the synthesiser produced through the real spawner."
        - "Issue #762 (seeding reconciliation, retained): PowerSystem::from_authored_groups seeds every authored [power_groups.*] group (e.g. ops) at spawn — via authored_power_group_seed in spawner.rs and server_app.rs — so a rule targeting an authored group is allocatable rather than returning UnknownGroup. The four alliance hulls rest their four groups at a sustainable total (<=6) so idle ships recharge and neither the brownout advisory nor the emergency lock fires unprovoked."
        - "Issue #831 (admission symmetry, retained through #784): ai_power_allocation emits an admitted SetPowerGroupAllocation system-control-command through command_admission::validate_and_admit (its ship's own ai:<uuid> token, checked against operate_ai on the reactor), which ship-power-controller's handle_power_messages applies — the single applier for the human and AI paths alike. The evaluator therefore sends a command; it does not mutate power state directly and never branches on control source after admission."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [ship-power-state, system-control-source-state, ship-system-blackboards-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/entities/config.rs, src/ship/power.rs, src/ai/policy.rs, src/modifiers/power_system.rs]
      symbols: [ai_power_allocation, PowerAiPolicy, AiPolicy, resolve_channel, seed_power_facts, POWER_SET_ALLOCATION_VERB, authored_power_group_seed]
      tests: [cargo test]

  - state: ship-modifier-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier State
      summary: Authoritative per-ship modifiers for speed, yaw, radar range, phaser damage, hull damage, repair rate, and repair-team capacity plus Comms-jammed and sensor-blind flags.
    architecture:
      classification: authoritative
      owner: ship-modifier-cache
      writers: [ship-modifier-translator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]

  - component: ship-modifier-translator
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Translator
      summary: Translates power allocation, active impulse, and region entry/exit into source-keyed modifier and flag updates, clearing all region effects on exit. Three power groups drive gameplay multipliers - helm to MaxSpeed/MaxYawRate, weapons to PhaserDamage, and sensors to RadarRange, which scales every phaser bank's authored beam_range as well as the Tactical console's [weapons_console.radar] range. The sensors console's own horizon (SensorRadarRange) and helm's (HelmRadarRange) are separate, damage-driven-only slots that this power translation never touches. Sensors level 2 is the rung whose multiplier is exactly 1.0, so a hull's effective weapon reach equals its authored range only while that group is at nominal or above.
      rationale:
        - "Issue #923 (SENSORS POWER IS WEAPON REACH). apply_power_modifiers_from_read_state drives ModifierSlot::RadarRange off the sensors power group; ShipModifiers::rebuild_cache folds a negative bonus sum as 1/(1+|sum|), so the fleet-standard power_multipliers [-0.5, 0, 0.25, 0.5] map levels 1-4 to x0.667 / x1.000 / x1.25 / x1.5. src/console/weapons/beam.rs multiplies each bank's authored beam_range by that slot, so effective reach IS beam_range x RadarRange. The four Alliance hulls author [power_groups.sensors] default_level = 1 (their four groups have to rest at a total the reactor sustains), and until #923 no authored power policy anywhere carried a channel = \"sensors\" rule - so every AI-crewed Alliance hull fought at two thirds of every range its own file authored, and every doctrine number tuned against those ranges (ring radii, commit ranges, standoff margins, artillery envelopes) was tuned against a reach the hull did not have. Verified empirically before the fix: the cruiser authors beam_range = 40 and its fore bank reported OutOfRange at 26.98."
        - "The resolution is AUTHORED, not a Rust default (AGENTS.md rule #11): assets/entities/fragments/ai/fleet_baseline.toml gained a sensors channel - level 2 at red alert above param(min_reserve_sensors), resting at 1 - and alliance_courier.toml carries the same rules inline because it composes no fragment. The point is paid for by DROPPING the weapons red-alert elevation on the same hulls, because PowerSystem::increase refuses past a total of 8 SILENTLY and an Alliance hull's four groups already spent all eight; a refused level is dropped with no error and ai_power_allocation's emit_level re-emits it every tick, so whichever group yields the point has to be authored rather than arbitrated by the cap. Taking it from helm instead was measured and rejected - a fifth less yaw authority cost the battleship its artillery tracking (1032 damage dealt and a victory per seed became 298 and a timeout, its heavy blaster landing none of eight bolts)."
        - "Effective reach is therefore a documented function of an authored power decision rather than a constant: nominal while the battery holds above min_reserve_sensors (about fourteen seconds of continuous red alert on the cruiser, traced on probe_duel) and x0.667 below it, since no Alliance reactor sustains a total above 6. Doctrine ranges are sized against the LOWER rung - the #923 re-check swept the cruiser's combat_orbit_range from 22 to 38 and every wider ring collapsed the aggressor probe. Ranges DERIVED from a target's reach need no retune: seed_recovery_facts adds safe_range_margin to target_direct_fire_range, which entity_direct_fire_range reads off the target's live banks with that ship's own RadarRange applied. The six NPC hulls are deliberately exempt (authored_ai_pins::BESPOKE_DOCTRINES): they author no [power_groups.*] so their reactor seeds the canonical trio at 2 and their sensors are already nominal, and their banks fire ungated by the alert."
        - "Pinned in both directions so it cannot drift back silently: every_alliance_hull_reaches_its_authored_beam_range_at_combat_stations (src/modifiers/coordination.rs) walks all four shipped hulls through include resolution, the authored [power.ai_policy], set_group_allocation under the real 8-point cap and apply_power_modifiers_from_read_state, then asserts each bank's beam_range x RadarRange equals its authored beam_range; a_backfilled_cruiser_reaches_its_authored_beam_range_while_at_combat_stations (tests/headless_runner.rs) asserts the same through the production schedule in a live 45 s duel. The relationship is documented for authors in docs/toml-authoring-guide.md (Power levels are gameplay numbers) and in the fleet_baseline.toml power header."
    architecture:
      kind: translator
      authority: authoritative
      writes: [ship-modifier-state]
      reads: [ship-power-state, impulse-drive-state, region-membership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/coordination.rs, src/regions/server.rs]
      symbols: [apply_power_modifiers, apply_region_effects, apply_impulse_to]
      tests: [cargo test]

  - component: region-containment-service
    core:
      status: implemented
      confidence: confirmed
      title: Region Containment Service
      summary: Evaluates authored sphere, box, and torus region membership for live ships and emits entry and exit events.
    architecture:
      kind: spatial-service
      authority: authoritative
      owns: [region-membership-state]
      reads: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/shape.rs]
      symbols: [RegionPlugin, RegionShape]
      tests: [cargo test]

  - state: region-membership-state
    core:
      status: implemented
      confidence: confirmed
      title: Region Membership State
      summary: Authoritative transient relation recording which ships currently occupy each authored region and which region effects apply.
    architecture:
      classification: authoritative
      owner: region-containment-service
      writers: [region-containment-service]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/effects.rs]
      symbols: [RegionEffectKind]

  - component: region-effect-resolution
    core:
      status: implemented
      confidence: confirmed
      title: Region Effect Resolution
      summary: Resolves damage zones, slow zones, impulse blockers, radar dampening, Comms jamming, sensor blindness, and nebula fog from active region membership.
    architecture:
      kind: effect-resolver
      authority: authoritative
      reads: [region-membership-state]
      writes: [ship-modifier-state, authoritative-damage-state, impulse-drive-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/effects.rs, src/regions/server.rs, src/modifiers/coordination.rs]
      symbols: [RegionEffectKind]
      tests: [cargo test]

  - decision: gm-t2-join-pause-and-projection-contract
    core:
      status: accepted
      confidence: confirmed
      title: GM Join, Pause, and Local Projection Contract
      summary: "A first-time mid-session GM join requires visible acceptance by an existing host or GM, then schedules one synchronized pause for snapshot/history transfer and roster admission. The session remains paused until an explicit attributed SetSessionPaused { active: false }; reconnecting the same GM may auto-accept but still surfaces the pause. Joining never silently pauses. GM maps, feeds, dossiers, knowledge views, and authentic Station interfaces read local deterministic projections over the Host Channel; only typed GM commands cross lockstep, and there is no privileged omniscient streaming API."
      rationale:
        - "SetSessionPaused is an idempotent state-setting command rather than a toggle, so simultaneous equal GMs converge under deterministic command ordering. It is separate from debug controls and the local host pause surface even when all three present the same authoritative pause state."
        - "A synchronized paused transfer makes drop-in visible and safe without granting a joining browser a special replication path."
        - "The join transaction owns a separate deterministic pause hold: acceptance schedules that hold exactly once, rejection before acceptance changes neither roster nor pause, and terminal admission does not release it. Only a newly applied, attributed SetSessionPaused { active: false } after the transaction's terminal result can resume the session, so protocol sequencing never fabricates a GM action."
        - "The candidate remains a private transport participant until it restores the canonical #1117 run containing the snapshot, complete command history, and snapshotted GM journal and reports the matching digest. Its provisional topology is held only in GmJoinBootstrap: neither FleetRoster nor FleetLockstep exists on the candidate before GmJoinCommit. An authenticated owner-carried host loss received after capture is staged in non-authoritative GmJoinPendingHostLoss, leaving snapshot proof and admission unchanged; Commit drains it exactly once into PendingHostLoss and departs that slot in the newly installed wait-set before Resume. Successful restore engages the candidate's GmJoinPauseHold even when it restored from behind the pause boundary; that technical hold never rewrites the durable GM journal, and every peer adopts the same current-pause baseline when the first real typed grant is replicated. Only a matching digest installs the public GM roster and lockstep wait-set. Accepted disconnects and authenticated transfer/restore failures are owner-sequenced visible refusals; a disconnect racing an existing Commit preserves and re-emits that same terminal proof. Stalled not-ready restore is bounded by authenticated candidate requests and owner grants on the deterministic RestoreBoundary protocol clock; duplicate, stale, and render-only updates cannot advance it. A fresh reconnect Pause only freezes and arms the private receiver. After the canonical record passes its version/content/boot-identity gate, that receiver stages the saved authored-row UUID map through stage_resume_game_start_entity_uuids and then requests InProgress, so the stale process cannot mint competing GameStart identities. Its bounded clock starts only after GameStartEntityUuids proves the exact deferred spawn walked every authored row. Only the terminal authenticated owner grant may then enable the existing authored-row rebuild branch inside the same rollback-safe restore seam; a still-non-rebuildable world deterministically times out. Post-commit transport loss uses ordinary host-loss. The technical owner sequences this transaction but any existing admitted host or GM may visibly accept or reject it."
        - "Issue #1292 makes SetSessionPaused the first complete typed GM action tracer, after shared semantic action and feedback issues #1274/#1276, so M1 does not grow temporary plumbing that M2 later replaces. First-time join #1293 depends on record transfer #1117; known-GM divergence-safe reconnect #1294 separately depends on #1118."

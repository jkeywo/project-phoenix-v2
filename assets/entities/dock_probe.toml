# Dock probe — the helm-docking operator for issue #1159.
#
# A deliberately lean hull that exercises ONE mechanism end to end: a helm-owned
# `[[system]] kind = "dock"`, its own `[power_groups.dock]` power group, a damage
# entry so it can be knocked out, a Dock mating component carrying the approach terms,
# and dock markers declared in its rig sidecar (the `dock_probe` variant). It is
# NOT a shipped combat hull and is flown in no scenario — it is the fixture
# `assets/worlds/probe_dock.toml` puts a dock control on, kept out of
# `alliance_destroyer.toml` on purpose so no shipped hull's folded system-hull
# (and therefore no committed world's digest) moves for this slice. The demo
# destroyer gains docking in a later integration (#1164 S11a), not here.
#
# It flies nothing of its own: the dock manoeuvre moves the own ship onto its
# mate, so the probe needs no helm axes — the helm station exists only to OWN the
# dock system and give the Dock/Undock commands a seat to be admitted against.

includes = ["fragments/ai/dock_state_tree.toml", "fragments/energy/dock_probe.toml"]

tags = ["ship"]
faction = "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa"

[mesh]
# Shares the courier silhouette but reads its DOCK-MARKER rig from the dedicated
# `dock_probe` variant sidecar — a bespoke .glb would buy the probe nothing.
model = "assets/models/alliance_courier.glb"
variant = "dock_probe"
shape = "sphere"
colour = []

[collider]
shape = "Capsule"
radius = 0.6
length = 1.5
# The dock manoeuvre writes the own ship's position directly (it is the own-ship
# analogue of the tractor rig), so like the tug this stays the static-terrain
# default rather than claiming a flyable helm.
movable = false

[radar_appearance]
colour = [0.2, 0.9, 0.6]
size = 5.0
icon = "ship"

# Power: no `[power]` block, so the reactor takes the default profile. The one
# small dock group draws well under it and rests at its nominal level.
[power_groups.dock]
label = "entity.dock_probe.power_groups.dock.label"
default_level = 2
min_level = 1
max_level = 4

# ── The dock's damage entry ──────────────────────────────────────────────────
# So the dock can be damaged to Disabled — the interruption the probe drives by
# knocking this system down.
[[hull.system_hull]]
system_id = "dock"
max_hp = 30
damaged_threshold_pct = 0.5
disabled_threshold_pct = 0.15
debuff_magnitude = 0.15

# ── Helm owns the dock ───────────────────────────────────────────────────────
[[station]]
id = "helm"
name = "Helm"
description = "entity.dock_probe.station.helm.description"
rank = "Ltn."
short_code = "HLM"

[[station.rating]]
name = "Std"
automated_systems = []

# ── The dock system ──────────────────────────────────────────────────────────
# First-class, helm-owned, power-grouped: the admitted target for Dock / Undock,
# admission-gated exactly like any other station-owned system.
[[system]]
id = "dock"
kind = "dock"
console = "helm"
power_group = "energy-dock"

# ── The dock terms ───────────────────────────────────────────────────────────
# All authored (AGENTS.md rule 11): the reach the control appears within and a
# forming/held dock parts past, the distance the close-in manoeuvre engages
# within, the low approach speed, the mate tolerance, how far undock backs clear,
# and the lowest power-group level the dock runs at. The dock MARKERS themselves
# are authored in the rig sidecar, not here.

# Explicit control surfaces and permitted observation publications.

[[system.channel]]
name = "enabled"
kind = "boolean"

[[system.channel]]
name = "target"
kind = "entity_target"

[[system.component]]
id = "power"
kind = "power_input"

[[system.component]]
id = "mating"
kind = "dock_mating"
enabled_channel = "enabled"
target_channel = "target"
power_input = "power"

[system.component.config]
range = 200.0
engage_distance = 400.0
approach_speed = 60.0
mate_tolerance = 4.0
undock_clear_distance = 120.0
min_power_level = 2

[[console]]
id = "helm"
name = "Helm"
home_station = "helm"
screen = "gui/destroyer/helm.html"

[[console.feed]]
source = "dock"
kind = "Dock"

[[console.feed]]
source = "viewscreen"
kind = "Viewscreen"

[[system]]
id = "power-reactor"
kind = "power_reactor"
console = "ai-energy-power"
ai_only = true

[system.config.ai]
root = "power"

[[system.config.ai.tree]]
id = "power"
initial = "balance"

[[system.config.ai.tree.state]]
id = "balance"

[[system.config.ai.tree.state.task]]
id = "output"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "reactor-output"
value = 1.149999976158142

[[system.config.ai.tree.state.task]]
id = "reactor-cooling"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "reactor-cooling"
value = 1

[[system.config.ai.tree.state.task]]
id = "cool-reactor"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "reactor-cooling"
value = 5

[[system.config.ai.tree.state.task.when]]
equals = true

[system.config.ai.tree.state.task.when.value]
source = "number_compare"
name = "reactor_heat_fraction"
comparison = "greater_or_equal"
value = 0.5

[[system.config.ai.tree.state.task]]
id = "flow-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "flow-dock"
value = 1.149999976158142

[[system.config.ai.tree.state.task]]
id = "cooling-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "cooling-dock"
value = 1

[[system.config.ai.tree.state.task]]
id = "fill-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "flow-dock"
value = 2

[[system.config.ai.tree.state.task.when]]
equals = true

[system.config.ai.tree.state.task.when.value]
source = "number_compare"
name = "reserve-dock"
comparison = "less"
value = 0.5

[[system.config.ai.tree.state.task]]
id = "hot-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "cooling-dock"
value = 5

[[system.config.ai.tree.state.task.when]]
equals = true

[system.config.ai.tree.state.task.when.value]
source = "number_compare"
name = "heat-dock"
comparison = "greater_or_equal"
value = 0.5

[[system.config.ai.tree.state.task]]
id = "flow-energy-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "flow-energy-dock"
value = 1.149999976158142

[[system.config.ai.tree.state.task]]
id = "cooling-energy-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "cooling-energy-dock"
value = 1

[[system.config.ai.tree.state.task]]
id = "fill-energy-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "flow-energy-dock"
value = 2

[[system.config.ai.tree.state.task.when]]
equals = true

[system.config.ai.tree.state.task.when.value]
source = "number_compare"
name = "reserve-energy-dock"
comparison = "less"
value = 0.5

[[system.config.ai.tree.state.task]]
id = "hot-energy-dock"

[system.config.ai.tree.state.task.action]
kind = "write_number"
channel = "cooling-energy-dock"
value = 5

[[system.config.ai.tree.state.task.when]]
equals = true

[system.config.ai.tree.state.task.when.value]
source = "number_compare"
name = "heat-energy-dock"
comparison = "greater_or_equal"
value = 0.5




[[system]]
id = "power-battery"
kind = "power_battery"
console = "ai-energy-power"
ai_only = true

[[console]]
id = "ai-energy-power"

[[console.feed]]
source = "power"
kind = "Power"

[[console.feed]]
source = "power-reactor"
kind = "PowerReactor"

[[console.feed]]
source = "power-battery"
kind = "PowerBattery"

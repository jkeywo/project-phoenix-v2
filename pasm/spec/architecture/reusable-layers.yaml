entities:
  - component: reusable-game-layers
    core:
      status: implemented
      confidence: confirmed
      title: Reusable Game Layers
      summary: Cargo and JavaScript package boundaries separate reusable runtime, transport and platform mechanisms from Phoenix data, content, simulation and presentation. Existing host entry points compose those packages through compatibility facades.
      rationale:
        - GM integration is organised into actions, operations, observation and continuity. Producers own their typed change notifications; bridge compatibility exports preserve routing. The canonical journal and existing lockstep/snapshot restore remain the single authority and continuation paths.
        - State continuity retains a snapshot facade over schema, capture, artifact versions, preflight, materialization and ordered state application. Digest and save lifecycle keep their public owners; fleet recovery calls the same capture and restore operations without a second protocol or format change.
        - World execution keeps a stable simulation facade over state, registration, activation, spawning, triggers, ordered effects, layer lifecycle and publication modules. Registration owns one unchanged schedule chain and reviewed symbol aliases preserve historical census comparisons.
        - Content preparation owns offline cross-domain validation and authoring over explicit readers and resolvers. It returns prepared data and ledger plans; simulation retains live cache and installation adapters. Preparation may consume Gameplay and World, which never import it.
        - Runtime orders admitted commands and coordinates readiness, digests and recovery without choosing game rules. Transport owns connection identity and delivery without interpreting Phoenix commands. Platform owns files and surfaces without choosing Station or lobby roles.
        - Model carries shared game vocabulary. Content prepares authored bytes through manifests, includes, overlays, archives and asset validation. Entity and world semantic validation remains beside the simulation registries it validates, consuming the content mechanisms in one direction.
        - Simulation retains Bevy ECS and scheduling but independently builds without rendering, windows or Ultralight. Presentation consumes simulation through explicit readiness and input contracts. Optional platform rendering features are selected only by hosts.
        - A separate grid game consumes only reusable packages, proving native and browser hosts, pure JavaScript consoles, command ordering, digest divergence and recovery without Phoenix game dependencies.
        - Simulation is a parent composition package over three independent branches. Gameplay owns the complete EntityConfig parser, entity mechanics and policy execution; World owns the complete WorldConfig parser, scripts and mission state; Session owns crew, Station tenure, lobby decisions and fleet protocol state. No branch depends on a sibling or its parent, in normal, target, development or build dependencies.
        - Shared simulation contracts own identities, tick and RNG, schedule labels, authority policy and command envelopes. The parent supplies live borrowed mission context, retains synchronous ordered script application, and owns materialization, composed validation, snapshots and recovery. No copied mission-input cache or generic event bus is introduced.
        - Moves preserve system registration slots, deferred flushes, RNG draws, UUID mint order and snapshot fold order. Historical schedule-census names use an explicit reviewed alias table; neither census multiplicity nor determinism goldens are reset.
        - The HTML overview presents the composition tree and separate shared bands. Every actual Cargo and JavaScript edge remains inspectable by selection or in the complete dependency list; the display hierarchy is not a claim that shared dependencies have a single parent.
        - '[ai] Live host composition owns Asteroid, Modifier, Lobby, simulation, RNG and World registration in that order; the Boot Profile owns the presentation axis. Filesystem hull preparation returns parsed configuration and captured ledger records, applied only after host admission checks.'
        - '[ai] Browser fleet staging owns join generations, queued adoptions, absolute control projections and completion. Accepted pack handoff consumes retained semantic validation identity and bytes without host-side reconstruction. Native relay sockets retain ordered lifecycle edges across a complete redial between frame polls. Pane lifecycle configuration replaces its bounded frame pool after successful create or resize.'
        - '[ai] Presentation shares effective tier rigs and binds pending scenes to requested pack-qualified path and variant. Ordinary preview installs immutable capture behavior; legacy mutation, reload and browser capture require explicit opt-in. Accepted-pack changes retire active mote textures and pools; the disabled legacy dust renderer is removed.'
        - '[ai] Contracts owns summary-control permission and Objective visibility; World supplies ship-effective Objective reads; shared hull damage preserves declaration order and RNG draws. Runtime owns guarded continuation completion after adapter-owned roster effects. Readiness and bounded histories validate invariants at deserialization and aggregation boundaries.'
        - '[ai] Browser startup readiness and teardown have one page owner; Workshop operation leases share one admission gate. Transport selects delivery classes and opaque application payload delivery; GUI adapters own Identify preparation. TURN acquisition is bounded per provider and browser request. Grid shares typed admission across native and WASM and verifies real file restart and exact checkpoint continuation.'
    architecture:
      kind: package-boundary
      authority: local
    implementation:
      status: declared
      paths: [Cargo.toml, scripts/check-layers.mjs, src/lib.rs, src/presentation_adapters.rs, crates/phoenix-runtime/src/lib.rs, crates/phoenix-transport/src/lib.rs, crates/phoenix-platform/src/lib.rs, crates/phoenix-model/src/lib.rs, crates/phoenix-content/src/lib.rs, crates/phoenix-simulation/src/lib.rs, crates/phoenix-sim-contracts/src/lib.rs, crates/phoenix-sim-gameplay/src/lib.rs, crates/phoenix-sim-world/src/lib.rs, crates/phoenix-sim-session/src/lib.rs, crates/phoenix-presentation/src/lib.rs, packages/transport/package.json, packages/session/package.json, examples/grid/Cargo.toml]
      tests: [tests/layers/grid-smoke.mjs, examples/grid/src/grid_tests.rs, src/layer_tests/mod.rs, src/headless/determinism_audit/layer_names_tests.rs]

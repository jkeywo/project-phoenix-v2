# Optional ordinary unarmed Full3D utility hull. Not Bay-loadable until the
# moving custody/recovery slice is joined; no probe marker bypasses fixed guards.
# All reserves and geometry are real authored equipment; zero generation.
includes = ["battery_probe.toml"]
name = "entity.utility_shuttle.name"
faction = "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa"
mass = 20

[collider]
shape = "Ball"
radius = 0.5
length = 0
movable = true

[mesh]
shape = "sphere"
colour = [0.4, 0.8, 1.0]
radius = 0.5

[behaviour]
doctrine = []
waypoint_arrival_radius = 1
nav_handoff_speed = 0.5

[helm_console]
max_speed = 12
max_reverse_speed = 4
acceleration = 4
deceleration = 6
max_yaw_rate = 1
max_bank_deg = 0

[helm_console.lateral_thrust]
max_lateral_speed = 4
lateral_acceleration = 4

[helm_capability]
vertical_movement_mode = "full3_d"

[helm_control]
thrust = "helm-thrust"
steering = "helm-steering"
lateral = "helm-lateral-thrust"

[comms]
range = 300
hailable = true

[comms.radio]
system = "comms"
request_reading_ticks = 30

[[comms.radio.channel]]
id = "public"
range = 300
work_units = 1

[[helm_console.engines_ai.rule]]
priority = 0
channel = "longitudinal"
when = "true"
verb = "actuate_desired_travel"

[[helm_console.steering_ai.rule]]
priority = 0
channel = "yaw"
when = "true"
verb = "actuate_desired_facing"

[[helm_console.lateral_ai.rule]]
priority = 0
channel = "lateral"
when = "true"
verb = "actuate_lateral_thrust"

[[helm_console.vertical_ai.rule]]
priority = 0
channel = "vertical"
when = "true"
verb = "actuate_vertical_thrust"

[helm_console.impulse_ai]
idle = true
[helm_console.boost_ai]
idle = true
[captain_console.ai]
idle = true
[weapons_console.ai]
idle = true

[sensors_console.selector]
sources = ["radar-contacts"]
horizon = 1000000
switch_margin = 0
eligibility = "false"

[weapons_console.selector]
sources = ["radar-contacts"]
horizon = 1000000
switch_margin = 0
eligibility = "false"

[navigation_console.selector]
sources = ["navigation-objectives"]
horizon = 1000000
switch_margin = 0
eligibility = "false"

[repair.selector]
sources = ["damaged-stations"]
horizon = 1000000
switch_margin = 0
eligibility = "false"

[comms_console.selector]
sources = ["comms-contacts"]
horizon = 1000000
switch_margin = 0
eligibility = "false"

[[comms_console.ai.rule]]
priority = 0
channel = "comms_respond"
when = "fact(is_read) > 0 and fact(comms_available) > 0"
verb = "respond_to_message"
response_index = 0

[helm_console.radar]
range = 120
shows = ["ship", "station", "asteroid", "missile"]
selects = ["ship", "station", "asteroid", "missile"]

[navigation_console.system_chart]
range = 300
shows = ["ship", "station", "asteroid", "missile"]
selects = ["ship", "station", "asteroid", "missile"]


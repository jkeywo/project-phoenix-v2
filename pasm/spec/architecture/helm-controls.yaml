        - AiTickReady
        - AiSnapshotReady
        - AiSnapshotPhase
        - tick_ai_cadence
        - ai_tick_ready
        - ai_snapshot_ready
        - register_ai_cadence
        - checked_snapshot_every_ticks
        - snapshot_every_ticks
      tests:
        - cargo test


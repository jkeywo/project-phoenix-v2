  - component: ai-helm-tick-cadence
    core:
      status: implemented
      confidence: confirmed
      title: AI Decision Cadence
      summary: The single fixed-rate AI decision cadence (one AiTickTimer plus the AiTickReady latch, with AiSnapshotReady derived from it as an integer multiple) that gates every AI decider — the helm decision-surface assembly, the six per-axis helm systems and the policy state tick on the base latch, together with shield focus, power allocation, torpedo load and launch, frequency hint, phaser and blaster auto-fire and Tactical target selection; Captain, Sensors and the world-snapshot / doctrine-aggregation rebuild ride the derived slower latch. AI decisions therefore run at a TOML-authored rate instead of once per rendered frame.
      rationale:
        - "Issue #803 introduced the first shared latch, for the helm axes only: AI helm decisions were coupled to host frame rate — a 144 Hz host steered on ~4x fresher data than a 60 Hz one — a determinism blocker for P2P lockstep (PRD #620). One shared timer replaced per-frame execution and the private AiLateralThrustTimer."
        - "Issue #889 (3d21957d) made it the ONE cadence for all AI, and moved the machinery into the new src/ai/cadence.rs. Before it the cadence was fragmented three ways: the six helm axes on the authored latch; Captain and Sensors on a HARDCODED 10 Hz AiSnapshotTimer gated inside the system body by an Option<Res<_>> that fell back to evaluating every tick when the resource was absent (which every bare-App fixture in the crate hit, so the shipped cadence was exercised by no test at all); and eight further deciders on no gate whatsoever. Because SimSet is configured in Bevy's Update, no gate means once per rendered frame — see AGENTS.md rule #7, which now states this."
        - "The base rate is authored as [global] ai_tick_hz (serde default 30 Hz). The pre-#889 key ai_helm_tick_hz survives as a serde ALIAS and every shipped world deliberately keeps authoring it, so the alias is exercised on every load rather than only by a test. The timer resource is built at plugin registration, before any WorldConfig exists, so tick_ai_cadence reconciles its period against the loaded config each frame."
        - "The slower cadence is DERIVED, not a second clock. GlobalConfig::checked_snapshot_every_ticks resolves ai_tick_hz / ai_snapshot_hz to a whole number of base ticks, and AiSnapshotPhase counts them; a non-integer relationship (e.g. 25 Hz against 10 Hz) is rejected in world::config::parse_world at load rather than silently rounded, so the two AI clocks can never be commensurate only by luck."
        - "register_ai_cadence is a plain idempotent function rather than a Plugin because several plugins each register gated systems and duplicate registration of tick_ai_cadence would advance the timer more than once per frame. tick_ai_cadence itself is registered in Bevy's Last schedule: every gated system lives in Update, so the latch is guaranteed consumed before it is re-armed without an .after() edge against each gated system — an edge that would silently degrade to an empty constraint in any fixture that does not register them all."
        - "Existing ordering edges between the gated systems are preserved; the latch idiom (a boolean resource written by a tick system and read by a run condition) is unchanged, because run_if conditions must take read-only parameters."
        - "The one decider that needed more than a gate is the Sensors frequency hint: it accumulates Time::delta, so gating it alone would have STRETCHED the authored delay by the frame-to-tick ratio — twice at 60 Hz, nearly five times at 144 — making it more frame-dependent rather than less. It now advances on the authored tick period."
        - "Behaviour was measured, not assumed: a balance A/B over 192 duel runs (sixteen class matchups by twelve seeds) reports identical win rates, 70W/73L/13D/36T on both sides, with time-to-kill moving at most one reporting quantum and always slower — the expected consequence of a bank that becomes ready mid-tick waiting for the next one."
        - "Seventeen fixtures broke because they assumed one app.update() was one decision. Each was fixed by ticking the latch (cadence::arm_ai_tick), never by restoring an every-tick fallback or loosening an assertion."
        - "The authored PER-POLICY multiple is a separate, still-open half — see ai-policy-tick-scheduler, which stays proposed."
    architecture:
      kind: scheduler
      authority: authoritative
      coordinates:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/ai/cadence.rs
        - src/ai/server.rs
        - src/ship/helm_ai.rs
        - src/ship_plugin.rs
        - src/console_ai/server.rs
        - src/console/weapons/mod.rs
        - src/entities/config.rs
        - src/world/config.rs
        - assets/worlds/default.toml

  - mechanic: gm-t2-station-puppeting
    core:
      status: partially-implemented
      confidence: confirmed
      title: Station-Scoped GM Puppeting Alongside Players
      summary: "A GM may open an authentic Station interface and puppet a player or NPC ship when that ship defines the interface and corresponding command consumers. Takeover is Station-scoped: it suppresses AI/Backfill emissions for that Station but does not change seat ownership. Human commands and GM commands remain accepted together and resolve through deterministic Admission ordering. Releasing takeover restores AI only where the Station would ordinarily receive it. Multiple GMs remain equal and every command is attributed."
      rationale:
        - "The GM takes over AI and acts alongside players; puppeting is not exclusive possession of a human Station and does not create a second downstream human-versus-GM authority branch."
        - "[ai] Issue #1314 uses one fail-closed StationCapabilities verdict for NPC offers, authenticated ingress and canonical takeover/command revalidation. The initial audited NPC interface is gui/battleship/helm.html with only its declared Helm axis kinds, exact registered consumer addresses and the per-ship physics/intent/blackboard prerequisites. Captain camera/priority, Power and mixed interfaces remain excluded until their complete producer and consumer paths are per-ship. A known member may release after capability or target loss. Existing fleet player Station authority is unchanged."
        - "[ai] NpcStationConfig is derived content: the normal project_ship_client_config projector runs on the resolved instance config at the common static/runtime NPC spawn, and restore rebuilds it through that same spawn path. It is declared Derived under gm-action-state, not a second mutable config or a new snapshot field. No local selected hull supplies an NPC interface."
        - "[ai] Canonical Station membership (or an accepted command awaiting its first delivery) promotes an NPC through the complete shared high-fidelity component constructor before System Admission. Active membership holds that existing fidelity state against ordinary LOD demotion; the second equal GM never resets it. Last release restores the live authored rating and normal LOD dwell/hysteresis resumes. Existing folded fidelity and membership state cover continuation without a format change. A post-Damage census prunes removed Ship/Station memberships across every destruction path while retaining attributed history; pending delivery still records its ordinary missing-destination refusal. If destruction occurs after delivery, actual consumer feedback settles first, then any unfinished route to the removed Ship/Station receives a terminal refusal."
        - "[ai] The authentic iframe is bound to the full Ship/Station key by replacing its browsing context on selection or target loss, even for identical authored URLs. Old WindowProxy messages and pending feedback cannot act on a replacement Ship. This is private presentation and never changes an equal GM's membership."
        - "[ai] Issue #1313 extends the delivered player-Station tracer to every live human rating: takeover and its exact apply-boundary revalidation never require Backfill or change Player.station. Ordinary human Admission stays enabled alongside canonical equal-GM commands, with humans ordered first and GM commands ordered by the existing owner-assigned key. The last release or agreed GM loss reapplies the CURRENT authored rating, including a mixed human/AI rating selected during takeover; a surviving equal operator keeps the overlay. The shared authored iframe and crew-public attribution require no new simulation state or snapshot shape. The seeded attended fixture replays the complete recorded human command log and GM journal through production Admission under the same deterministic human-seat setup; portable ReplayArtifact still omits human tenure, as documented in headless/replay.rs."

[[torpedoes.tubes]]
id = "fore-centre"
facing_deg = 0
fire_arc_deg = 90
load_time = 3
volley_max = 3
barrels = [ "torpedo_centre_port", "torpedo_centre_starboard" ]

[[torpedoes.tubes.pattern]]

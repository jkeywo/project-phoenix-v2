entities:
  - component: fine-system-ai-policy-schema
    core:
      status: proposed
      confidence: confirmed
      title: Fine-System AI Policy Schema
      summary: Defines inline per-system reactive rules, optional states, explicit priorities, named parameters, typed local memory, targeting, and explicit idle declarations for every AI-capable fine system.
      rationale:
        - AI behaviour belongs to the fine system that owns the operated capability rather than a ship-wide combat controller.
        - Stateless systems should not acquire artificial lifecycle states merely to use the common evaluator.
        - Designer-tunable behaviour values belong in entity TOML rather than Rust branches or hidden runtime defaults.
        - Reusable behaviour fragments may compose into entity TOML before validation, but the runtime receives only the owning system's fully resolved inline policy.
    architecture:
      kind: configuration-schema
      authority: authoritative
      reads: [resolved-entity-template-state, ship-station-system-topology-state]
      produces: [fine-system-ai-policy-state]
      runs_in: [host-browser-runtime]

  - component: ai-policy-expression-runtime
    core:
      status: implemented
      confidence: confirmed
      title: AI Policy Expression Runtime
      summary: Extends the world-trigger predicate grammar with typed AI facts, explicit self/candidate/target contexts, read-only world flags and counters, ship power rating, named parameters, and bounded history operators.
      rationale:
        - AI authoring should mirror the repository's existing predicate syntax instead of introducing a second expression style.
        - Scenario flags and counters are useful doctrine inputs but remain read-only to fine-system policies.
        - Registered typed facts preserve validation without allowing arbitrary scripts or component access.
        - "Issue #776 landed the three explicit contexts and authored ship power rating: bare fact(...) stays SELF for #775 back-compat, self_fact/candidate_fact/target_fact select the self, candidate, and currently-retained-target fact sets, and power_rating is a seeded SELF fact. Bounded-history operators remain proposed — no author needs them yet."
    architecture:
      kind: expression-service
      authority: authoritative
      reads:
        - world-snapshot-state
        - ship-system-blackboards-state
        - scored-objective-pool-state
        - radar-contact-projection-state
        - system-control-source-state
        - authoritative-ship-motion-state
        - hazard-assessment-state
        - recent-combat-activity-state
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/flags.rs]
      symbols: [evaluate_selector, AiFactSet, FactContext, Predicate]
      tests: [cargo test]

  - component: per-system-target-ranking-policy
    core:
      status: implemented
      confidence: confirmed
      title: Per-System Target Ranking Policy
      summary: Unions registered candidate sources, filters candidates with typed policy expressions, applies additive authored utility, retains valid targets within a switch margin, and deterministically replaces invalid targets.
      rationale:
        - Sensors, Tactical, Helm actuators, and other fine systems need different ranking policies over shared authoritative contacts and objectives.
        - Sensors designation remains advisory; another system may favour and copy it only through its own eligibility and ranking policy.
        - Stable UUID tie-breaking and authored switch margins prevent query-order dependence and target oscillation.
        - "Issue #776 landed the reusable selector as a Bevy-free sibling of the #775 channel policy (TargetSelector::select in src/ai/selector.rs): union+dedup by UUID, planar-horizon filter, self/candidate/target eligibility, additive score, switch-margin hysteresis, smallest-UUID tie-break. Sensors is the first host — operate_sensors_ai feeds the combat-lock/objective-destroy/radar-contacts sources and emits the existing admitted SetScienceTarget/ClearScienceTarget, never exceeding Sensors authority."
        - "Issue #777 added Tactical as the second host (ai_target_selection in src/console/weapons/mod.rs, TacticalTargetSelector in src/console/weapons/beam.rs). Its authored sources are sensors-designation/objective-destroy/last-attacker/radar-contacts (combat-lock is excluded — it is Tactical's own output; the ship's current lock is instead surfaced internally as a source_retained retention candidate). The default selector encodes the retired tier order objective>retained>last-attacker>nearest as additive source weights (objective 1000 / sensors_designation 500 (the Sensors-favour bonus, AC2) / retained 200 / last_attacker 100 / radar 1) plus switch_margin(50) hysteresis. Because scores are SUMMED and one entity can carry several source markers at once — the current lock is commonly ALSO the ship's own Sensors designation — the weights obey a precedence invariant: the max non-objective stack (sensors_designation+retained+last_attacker+radar = 500+200+100+1 = 801) stays below objective(1000) by more than switch_margin (801 < 1000-50 = 950). So an in-range named Destroy objective ALWAYS wins the ranking and survives hysteresis retention, even against a lock coinciding with the Sensors designation (the #777 additive-stacking regression: retained must not let sensors+retained overtake an objective). retained still exceeds last_attacker, so an established engagement is not broken off by a fresh attacker. The invariant is asserted in default_tactical_selector_objective_dominates_max_non_objective_stack. Tactical independently revalidates the advisory Sensors pick — re-running faction::is_enemy per candidate for hostility, plus visibility (host-owned damage-scaled radar horizon) and its own eligibility (AC3) — before copying it, and writes the authoritative TacticalRadarSelection DIRECTLY inside ai_target_selection (never through admission). The selector only RANKS; Tactical stays the sole writer (AC4). The direct write, on-change guard, .before(handle_set_target) ordering, and every-tick SimSet::Input cadence are preserved for read-seed-decide-write atomicity against the human SetTarget writer."
    architecture:
      kind: selection-policy
      authority: authoritative
      reads:
        - scored-objective-pool-state
        - objective-target-resolution-state
        - radar-contact-projection-state
        - sensors-target-state
        - weapons-target-state
        - navigation-waypoint-state
        - recent-combat-activity-state
      owns: [fine-system-ai-policy-state]
      writes: [fine-system-ai-policy-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ai/selector.rs, src/world/flags.rs, src/ship/sensors.rs, src/console/weapons/mod.rs, src/console/weapons/beam.rs, src/entities/config.rs]
      symbols: [TargetSelector, select, validate_fine_system_ai_selector, operate_sensors_ai, ai_target_selection, TacticalTargetSelector]
      tests: [cargo test]

  - state: fine-system-ai-policy-state
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy State
      summary: Private per-fine-system active state, typed local memory, deterministic random occurrence counts, selected target, and bounded history required by the inline policy.
      rationale:
        - Policy state is private and cannot become a hidden ship-wide state machine.
        - Cross-system behaviour observes public authoritative simulation facts rather than another policy's state name or memory.
        - Policies reset when AI gains control and when an unavailable system recovers.
        - "Issue #776 realizes the selected-target facet: the Sensors selector's retained pick is the ship's own SensorRadarSelection, recomputed each eligible tick and held through the authored switch margin. Issue #777 extends the same facet to Tactical: its retained pick is the ship's own TacticalRadarSelection, surfaced as the internal source_retained retention candidate and held through the authored switch margin. Typed local memory, deterministic random occurrence counts, and bounded history remain proposed facets for future policy kinds."
    architecture:
      classification: authoritative
      owner: per-system-target-ranking-policy
      writers: [per-system-target-ranking-policy]

  - component: fine-system-ai-policy-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy Runtime
      summary: Evaluates a fine system's inline stateless policy from an immutable per-tick fact snapshot, resolves the highest-priority matching rule per typed output channel, and emits the resulting typed system input.
      rationale:
        - All fine systems must observe one consistent tick snapshot rather than partially applied decisions from earlier systems.
        - Typed verbs restricted by system kind preserve AI and human input symmetry and prevent arbitrary simulation writes.
        - Resolving the highest-priority matching rule per channel keeps each tick's decision a pure function of the snapshot with no retained policy state.
    architecture:
      kind: ai-controller
      authority: authoritative
      reads:
        - system-control-source-state
        - ship-station-system-topology-state
        - ship-system-blackboards-state
        - world-snapshot-state
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/ai/policy.rs, src/world/flags.rs]
      symbols: [operate_captain_ai, resolve_channel, evaluate_with]
      tests: [cargo test]

  - component: ai-policy-tick-scheduler
    core:
      status: proposed
      confidence: confirmed
      title: AI Policy Tick Scheduler
      summary: Runs policy evaluation on a deterministic TOML-authored fixed-rate base cadence with authored per-system integer tick multiples and next-tick visibility for outputs from other fine systems.
      rationale:
        - A shared cadence aligns AI actuation with Helm's established control rhythm.
        - Integer evaluation multiples permit slower Sensors, Power, Repair, or Comms decisions without frame-dependent timers.
        - "The shipped precedent is the shared AI-helm sim tick (#803): one AiHelmTickTimer at [global] ai_helm_tick_hz (default 30 Hz) gates all four per-axis AI helm systems, decoupling AI decisions from host frame rate for P2P lockstep (PRD #620)."
    architecture:
      kind: scheduler
      authority: authoritative
      reads: [system-control-source-state, fine-system-ai-policy-state]
      coordinates: [fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime]

  - component: fine-system-ai-policy-validation
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy Validation
      summary: Rejects structurally invalid or ill-typed inline stateless policies before world activation, checking rule structure, typed predicate expressions, output channels, verbs, and named parameter references.
      rationale:
        - Missing policies, contradictory idle declarations, invalid references, and forbidden outputs are deterministic content errors.
        - Validating expressions, channels, verbs, and parameters up front keeps authored content errors out of the live tick loop.
    architecture:
      kind: configuration-validator
      authority: authoritative
      reads: [ship-station-system-topology-state]
      coordinates: [fine-system-ai-policy-schema, ai-policy-expression-runtime, per-system-target-ranking-policy]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs]
      symbols: [validate_fine_system_ai_policy, validate_fine_system_ai_selector]
      tests: [cargo test]

  - component: legacy-ai-doctrine-retirement
    core:
      status: proposed
      confidence: confirmed
      title: Legacy AI Doctrine Retirement
      summary: Converts every existing NPC and Backfill AI operator to inline fine-system policy, then removes top-level behaviour doctrine parsing and monolithic direct-write AI paths without retaining a permanent compatibility evaluator.
      rationale:
        - Combat Test behaviour must exercise the same authoring model as all other AI rather than becoming a scenario-specific code path.
        - Maintaining two AI policy formats would split authority and make behaviour difficult to audit.
    architecture:
      kind: migration-policy
      authority: authoritative
      reads: [npc-ai-controller-state, system-control-source-state]
      coordinates:
        - fine-system-ai-policy-runtime
        - per-system-ai-operator-suite
        - ai-command-symmetry-migration
      runs_in: [host-browser-runtime]

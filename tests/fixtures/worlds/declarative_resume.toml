# Fixture world for issue #864's compatibility half — a SCRIPT-FREE scenario
# whose progression is captured and resumed.
#
# The sibling of `scripted_resume.toml`, and deliberately its opposite: the same
# one-ship, no-hostiles shape, with no `[script]` block at all. Nothing plays it;
# it exists to be booted by `tests/snapshot_resume.rs`.
#
# ── Why a fixture rather than a shipped world ────────────────────────────────
#
# It used to be `assets/worlds/combat_test.toml`, on the reasonable ground that a
# shipped world is a better subject than an invented one. Issue #984 converted
# every shipped world to `[script]`, so there is no script-free shipped world
# left to point at — and there will not be one again.
#
# ── What the claim is now ────────────────────────────────────────────────────
#
# It carried a `[[trigger]]` block until issue #985 deleted that front-end, and
# the claim was that a world compiling no `WorldScriptRuntime` still captured
# its declarative trigger latches. There are no declarative triggers any more,
# so the surviving claim is the one that does not depend on them: a world with
# NO scenario logic of any kind still captures a running mission clock, leaves
# both script-shaped fields empty, and round-trips through RON — i.e. the
# payload is well-formed for a world that simply has nothing to progress.
#
# A world that still authors `[[trigger]]` is now REFUSED by `parse_world`
# rather than loading with its logic silently absent; `world::layers`' own tests
# pin that refusal.

[global]
seed = 864
ai_helm_tick_hz = 30.0

[player_spawn]
position = [0.0, 0.0, 0.0]

# Player ship — spawned by spawn_game_start_entities when the game starts.
[[entity]]
template_path = "assets/entities/alliance_destroyer.toml"
id = "player-ship"
transform = { position = [0.0, 0.0, 0.0] }
spawn_on = "game_start"

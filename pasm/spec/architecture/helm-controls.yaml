        - src/ai/core.rs
        - src/ship/helm_ai.rs
      symbols:
        - HazardAssessment
        - HazardAssessmentRaw
        - HazardContribution
        - assess_hazards
        - seed_helm_actuator_facts
      tests:
        - cargo test


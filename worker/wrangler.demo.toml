name = "phoenix-turn-credentials-demo"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Same Metered.ca app subdomain as the dev worker (worker/wrangler.toml) — the
# demo build proxies the same Metered.ca account, just from a second worker
# with a demo-scoped CORS origin.
METERED_APP = "projectphoenix"
# The demo Pages origin, used for CORS. The dev worker (wrangler.toml) keeps
# ALLOWED_ORIGIN pointed at https://jkeywo.github.io and is untouched by this
# file (issue #931).
ALLOWED_ORIGIN = "https://project-phoenix-demo.pages.dev"

# METERED_KEY is NOT here — it is a secret, scoped per worker name. Set it
# once, before the first deploy of this worker, with:
#   wrangler secret put METERED_KEY --config wrangler.demo.toml
# (owner action — this repo cannot set secrets from CI)

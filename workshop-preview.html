<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="workshop.models.preview.title"></title>

  <!-- The shared viewer, and nothing else. `--no-default-features` keeps the
       server bridge, lobby and renderer out; `viewer` compiles the plugin the
       standalone model viewer runs, so a previewed model is drawn by the same
       subject dispatch, ladder and lighting the game uses.

       Deliberately NO `rel="copy-dir"` for assets: this page renders only the
       bytes the Workshop captured and handed it. There is nothing for it to
       read from disk, by construction. -->
  <link data-trunk rel="rust" data-wasm-opt="0"
        data-cargo-no-default-features data-cargo-features="viewer" />

  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="../gui/workshop-preview-boot.js"></script>
</body>
</html>

entities:
  - decision: layered-combat-frozen-guided-round-commitment
    core:
      status: accepted
      confidence: confirmed
      title: Guided Rounds Retain Their Physical Launch Profile
      summary: "Increment15 extends the existing TorpedoSystem vectors rather than introducing a second projectile owner. A committed burst freezes its physical flight, impact, durability and emission cadence once; each emitted round carries that profile independently of later equipment or launcher changes. Existing yaw/pitch flight remains full3D."
      rationale:
        - "[ai] The required guided-round profile includes finite speed, turn rate, initial endurance, collision/detonation radius, hull/shield payload, shield pierce, physical impact and durability. Remaining endurance and durability are bounded causal per-round state. Snapshot preflight validates the whole candidate before writes; unsupported old compatibility is refused explicitly."
        - "[ai] Each actual burst emission still pays its own ordinary work and captures its own granted strike_damage_bonus. A later round cannot inherit an earlier paid boost or receive current upgraded equipment payload. A pending burst preserves its original profile, origin/pattern and cadence while ordinary machinery availability can delay emission."
        - "[ai] Interception reuses the actual finite-round bolt, mount, delivery and individual bank controller. Only permitted measured missile returns can support a selection; private physical projectile identity is confined to an authorised actuator/impact route. Relative moving-body collision uses only previous/current actual pose scratch on each existing projectile during the Physics/Damage interval; Damage clears it, and settled snapshots/digests retain only canonical current pose. Unknown allegiance or target intention is not fabricated. Target-domain data, shared actual resource costs and ordinary assignment/Hold rules constrain operation."
        - "Post-launch intent, actual receiver/link limits and independent Science illumination are separate dependent slices. This profile preparation does not claim working interception, guidance, Workshop operation, playable acceptance or a verified increment exit."

  - decision: guided-round-source-removal-continuity
    core:
      status: accepted
      confidence: confirmed
      title: Launched Guided Rounds Outlive Their Launcher
      summary: "Actual source removal or capability replacement drains both existing already-emitted TorpedoSystem and BlasterSystem vectors in one source transaction into the same nonspatial carrier, retaining round identity, attribution, frozen profile and remaining flight. The carrier has no ship, control, AI, launch tube, stock, pending burst or energy consumer."
      rationale:
        - "[ai] The first component replacement/removal hook drains both families; the second sees empty vectors and mints nothing, so ComponentId/archetype registration order cannot swap carrier identities. The ordinary lifecycle and observation producers continue to read those actual vectors; there is no second projectile pool or controller. Snapshot-only ordered bolt bank IDs derive from actual flight-only bank configs and recreate that closed shape without another runtime ID store. Closed carrier continuation is recreated directly, with full-candidate shape and identity checks. After ordinary Physics and Damage, one common settlement prunes empty flight-only bolt banks and removes a carrier only when both actual projectile families are empty; snapshots never park finished empty banks or carriers."
        - "[ai] Exclusive snapshot roster replacement suppresses carrier creation from discarded bootstrap state. Replacement launcher copies cannot duplicate or upgrade already-launched IDs. A body GM inverse whose capture contains launched guided or bolt rounds is refused before spawning, including after those old rounds have hit or expired; deliberate current-flight rejoining is not part of this increment checkpoint."
  - state: weapon-flight-carrier-state
    core:
      status: implemented
      confidence: confirmed
      title: Weapon Flight Carrier Identity
      summary: "A folded zero-sized entity marker distinguishes a nonspatial continued flight owner from an operable ship. Actual physical flight remains in the existing TorpedoSystemResource or BlasterSystemResource."
    architecture:
      classification: authoritative
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console/weapons/flight_carrier.rs, crates/phoenix-simulation/src/snapshot/flight_carriers.rs]
      symbols: [WeaponFlightCarrier]
      tests: [crates/phoenix-simulation/src/console/weapons/flight_carrier_tests.rs]
  - state: weapon-flight-restore-guard
    core:
      status: implemented
      confidence: confirmed
      title: Weapon Flight Restore Write Guard
      summary: "Transient exclusive restore context prevents discarded bootstrap flight vectors from becoming extra carriers. It has no saved or folded value and is restored after the roster replacement."
    architecture:
      classification: derived
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console/weapons/flight_carrier.rs, crates/phoenix-simulation/src/snapshot/restore.rs]
      symbols: [RestoreGuard]
      tests: [crates/phoenix-simulation/src/console/weapons/flight_carrier_tests.rs]

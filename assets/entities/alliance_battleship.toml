[weapon.mount]
facing_deg = 0
fire_arc_deg = 90
range = 300

[weapon.delivery]
kind = "guided"
load_time = 3
volley_max = 3

  [weapon.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_load"
  when = "true"
  verb = "load_torpedo"

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_launch"
  when = "fact(red_alert) >= param(min_alert_to_fire) and fact(target_facing_shields) <= 0"
  verb = "launch_torpedo"

# Patterned spinal launcher (issue #766): twin fore barrels with a timed
# barrel pattern. The pattern orders which barrel each loaded round leaves
# from — alternating port/starboard, then a both-barrel step — while the
# magazine, loaded_count and burst_interval stay the sole authority over how
# many rounds actually fire:
#   round 0 → barrel 0 (port)
#   round 1 → barrel 1 (starboard)
#   round 2 → barrel 0, round 3 → barrel 1 (the [0,1] step's barrels, one
#            per loaded round — a torpedo leaves one barrel per burst tick)

[weapon.impact]
damage_type = "physical"
penetration = 40
[[weapon]]
id = "torpedo-tube-fore-centre"
strategy_id = "fore-centre"
barrels = [ "torpedo_centre_port", "torpedo_centre_starboard" ]



<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Project Phoenix — Shield Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: 16px; }
    .panel-inner {
      padding: 24px 40px 22px;
      display: flex; flex-direction: column; gap: 10px;
      height: 100%;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(80,110,170,0.12) 0%, transparent 58%),
        linear-gradient(180deg, rgba(19,26,58,0.78) 0%, rgba(10,15,40,0.86) 45%, rgba(5,9,24,0.94) 100%),
        url("../assets/gui/panel-bg.png") center / cover no-repeat;
    }

    /* ── Header ──────────────────────────────────────────────── */
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 18px; padding: 4px 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; color: var(--tactical); text-shadow: 0 0 18px rgba(240,132,56,0.4); }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .hero .meta { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.2em; color: var(--ink-dim); text-align: right; line-height: 1.5; white-space: nowrap; }
    .hero .meta .k { color: var(--ink-faint); }
    .hero .meta .v { color: var(--cyan); }

    /* ── Main stage ──────────────────────────────────────────── */
    .shield-stage {
      flex: 1; min-height: 0;
      display: grid;
      grid-template-columns: 340px 1fr 380px;
      gap: 24px;
    }
    .shield-stage .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .shield-stage .col.center { align-items: center; justify-content: center; }

    /* ── Section labels ──────────────────────────────────────── */
    .sec-lbl {
      font-family: "Chakra Petch", sans-serif;
      font-weight: 600; font-size: 14px; letter-spacing: 0.32em;
      color: var(--ink-dim); text-transform: uppercase;
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .sec-lbl::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--line-soft), transparent);
    }
    .sec-lbl .tag {
      font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.2em;
      color: var(--ink-faint); padding: 2px 6px; border: 1px solid var(--line-faint);
    }

    /* ── Hull bar ────────────────────────────────────────────── */
    .hull-section { padding: 8px 0; flex-shrink: 0; }
    .hull-row { display: flex; align-items: center; gap: 14px; }
    .hull-row .lbl { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); white-space: nowrap; }
    .hull-row .bar { flex: 1; height: 14px; background: var(--bg-deep); border: 1px solid var(--line-faint); position: relative; overflow: hidden; }
    .hull-row .bar .fill { position: absolute; top: 0; left: 0; bottom: 0; background: linear-gradient(90deg, var(--loaded-dim), var(--loaded)); box-shadow: 0 0 6px rgba(78,200,112,0.4); }
    .hull-row .bar .fill.low { background: linear-gradient(90deg, var(--fire-dim), var(--fire-bright)); box-shadow: 0 0 6px rgba(255,90,58,0.4); }
    .hull-row .bar .fill.mid { background: linear-gradient(90deg, var(--reloading-dim), var(--reloading)); box-shadow: 0 0 6px rgba(216,160,64,0.4); }
    .hull-row .bar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent 18px, rgba(0,0,0,0.5) 18px, rgba(0,0,0,0.5) 19px); pointer-events: none; }
    .hull-row .val { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 20px; color: var(--loaded); min-width: 60px; text-align: right; }
    .hull-row .val.warn { color: var(--reloading); }
    .hull-row .val.low { color: var(--fire-bright); }

    /* ── Threat indicator ────────────────────────────────────── */
    .threat-section { flex-shrink: 0; min-height: 0; }
    .threat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .threat-row .iconbox { width: 40px; height: 40px; border: 1px solid var(--fire-dim); background: rgba(224,64,44,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .threat-row .iconbox svg { width: 22px; height: 22px; }
    .threat-row .info { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .threat-row .info .k { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.22em; color: var(--ink-faint); }
    .threat-row .info .v { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.14em; color: var(--fire-bright); }
    .threat-row .spacer { flex: 1; }
    .threat-row .bearing { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.16em; color: var(--ink-dim); text-align: right; line-height: 1.5; white-space: nowrap; }
    .threat-row .bearing .v { color: var(--fire-bright); }
    #threat-row { display: none; }
    #threat-row.active { display: flex; }

    /* ── Center: shield diagram ───────────────────────────────── */
    .diagram-wrap {
      position: relative; width: 100%; max-width: 520px; aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 0 22px rgba(108,182,208,0.14));
    }
    .diagram-wrap::before {
      content: "";
      position: absolute;
      inset: 3%;
      border-radius: 50%;
      border: 1px solid rgba(108,182,208,0.14);
      box-shadow:
        0 0 28px rgba(108,182,208,0.10),
        inset 0 0 28px rgba(108,182,208,0.06);
      pointer-events: none;
    }
    .diagram-wrap svg { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }
    .ship-ring,
    .ship-needle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      image-rendering: pixelated;
      z-index: 3;
    }
    .ship-ring {
      width: 68px;
      height: 68px;
      opacity: 0.9;
      filter: drop-shadow(0 0 8px rgba(108,182,208,0.42));
    }
    .ship-needle {
      width: 18px;
      height: 42px;
      opacity: 0.95;
      filter: drop-shadow(0 0 8px rgba(240,132,56,0.55));
    }
    .shield-segment {
      cursor: pointer;
      mix-blend-mode: screen;
      transition: opacity 120ms ease, stroke-width 120ms ease, filter 120ms ease;
    }
    .shield-segment:hover,
    .shield-segment:focus {
      opacity: 0.9;
      filter: drop-shadow(0 0 5px rgba(108,182,208,0.6));
      outline: none;
    }
    .shield-segment.focused {
      filter: drop-shadow(0 0 9px rgba(240,132,56,0.85));
    }
    .diagram-wrap .corner-readout {
      position: absolute; font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.16em; color: var(--ink-dim); line-height: 1.4;
    }
    .diagram-wrap .corner-readout .k { color: var(--ink-faint); font-size: 10px; letter-spacing: 0.2em; display: block; }
    .diagram-wrap .corner-readout .v { color: var(--cyan); font-size: 14px; letter-spacing: 0.1em; }
    .diagram-wrap .corner-readout.tl { top: 12px; left: 16px; }
    .diagram-wrap .corner-readout.tr { top: 12px; right: 16px; text-align: right; }
    .diagram-wrap .corner-readout.bl { bottom: 12px; left: 16px; }
    .diagram-wrap .corner-readout.br { bottom: 12px; right: 16px; text-align: right; }
    .diagram-caption {
      text-align: center; font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: 0.28em; color: var(--ink-faint); text-transform: uppercase; flex-shrink: 0;
    }
    .diagram-caption .focus-name { color: var(--tactical); letter-spacing: 0.32em; }

    /* ── Quadrant cards (right column) ───────────────────────── */
    .quad-card {
      position: relative; --cham: 10px;
      background: linear-gradient(180deg, #2a3568 0%, #14182c 100%);
      clip-path: polygon(var(--cham) 0, calc(100% - var(--cham)) 0, 100% var(--cham), 100% calc(100% - var(--cham)), calc(100% - var(--cham)) 100%, var(--cham) 100%, 0 calc(100% - var(--cham)), 0 var(--cham));
      padding: 1.5px; flex-shrink: 0;
    }
    .quad-card > .qc-body {
      --cham: 9px; background:
        linear-gradient(180deg, rgba(14,22,51,0.86) 0%, rgba(6,11,31,0.94) 100%),
        url("../assets/gui/panel-bg.png") center / cover no-repeat;
      clip-path: polygon(var(--cham) 0, calc(100% - var(--cham)) 0, 100% var(--cham), 100% calc(100% - var(--cham)), calc(100% - var(--cham)) 100%, var(--cham) 100%, 0 calc(100% - var(--cham)), 0 var(--cham));
      width: 100%; height: 100%; padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .quad-card.focused { background: linear-gradient(180deg, var(--tactical) 0%, #6a3a14 60%, #2c1808 100%); box-shadow: 0 0 24px rgba(240,132,56,0.25); }
    .quad-card.focused > .qc-body { background: radial-gradient(ellipse at 50% 0%, rgba(240,132,56,0.22) 0%, transparent 60%), linear-gradient(180deg, #1e1408 0%, #100a04 100%); }
    .qc-head { display: flex; align-items: baseline; justify-content: space-between; }
    .qc-name { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 0.32em; color: var(--ink-dim); }
    .quad-card.focused .qc-name { color: var(--tactical); }
    .qc-pct { font-family: "Chakra Petch", sans-serif; font-weight: 600; font-size: 32px; letter-spacing: 0.04em; color: var(--cyan); font-variant-numeric: tabular-nums; line-height: 1; }
    .qc-pct.mid { color: var(--reloading); }
    .qc-pct.low { color: var(--fire-bright); }
    .qc-pct.down { color: var(--fire-dim); }
    .qc-row1 { display: flex; align-items: baseline; gap: 8px; }
    .qc-row1 .unit { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.18em; color: var(--ink-faint); }
    .qc-row1 .spacer { flex: 1; }
    .qc-row1 .eta { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0.16em; color: var(--ink-dim); text-align: right; line-height: 1.4; }
    .qc-row1 .eta .v { color: var(--loaded); }
    .qc-row1 .eta .v.warn { color: var(--reloading); }
    .qc-row1 .eta .v.down { color: var(--fire-low); }
    .qc-bar { height: 8px; background: var(--bg-deep); border: 1px solid var(--line-faint); position: relative; overflow: hidden; }
    .qc-bar .fill { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(108,182,208,0.15), var(--cyan)); box-shadow: 0 0 6px rgba(108,182,208,0.4); }
    .qc-bar .fill.mid { background: linear-gradient(90deg, rgba(216,160,64,0.15), var(--reloading)); box-shadow: 0 0 6px rgba(216,160,64,0.4); }
    .qc-bar .fill.low { background: linear-gradient(90deg, rgba(224,64,44,0.15), var(--fire-bright)); box-shadow: 0 0 6px rgba(224,64,44,0.4); }
    .qc-bar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0, transparent 10px, rgba(0,0,0,0.5) 10px, rgba(0,0,0,0.5) 11px); pointer-events: none; }
    .qc-meta { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.18em; color: var(--ink-faint); }
    .qc-meta .k { color: var(--ink-faint); }
    .qc-meta .v { color: var(--ink-dim); }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer-bar {
      display: flex; align-items: center; gap: 14px;
      font-family: "JetBrains Mono", monospace; font-size: 11px;
      color: var(--ink-faint); flex-shrink: 0; padding: 6px 0;
    }
    .footer-bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); box-shadow: 0 0 6px var(--loaded); }
    .footer-bar .sep { color: var(--line-soft); }
    .footer-bar .spacer { flex: 1; }

    /* ── Portrait reset ──────────────────────────────────────── */
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 6px; }
      .hero { flex-direction: column; align-items: flex-start; gap: 4px; }
      .hero h1 { font-size: 28px; }
      .hero .meta { text-align: left; font-size: 10px; }
      .shield-stage {
        display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
      }
      .shield-stage .col.left { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .shield-stage .col.center { order: -1; }
      .diagram-wrap { max-width: 280px; }
      .shield-stage .col.right { display: flex; flex-direction: column; gap: 4px; }
      #quad-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .quad-card { min-width: 0; }
      .quad-card > .qc-body { padding: 6px 8px; gap: 3px; }
      .qc-name { font-size: 12px; letter-spacing: 0.2em; }
      .qc-pct { font-size: 20px; }
      .qc-row1 .eta { font-size: 9px; }
      .qc-row1 .unit { font-size: 9px; }
      .qc-meta { font-size: 8px; }
      .hull-row .val { font-size: 16px; }
      .sec-lbl { font-size: 12px; }
      .footer-bar { font-size: 9px; gap: 8px; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="panel"></div>
    <div class="panel-inner">

      <!-- HEADER -->
      <div class="hero">
        <div class="meta">
          <div><span class="k">FOCUS</span> <span class="v" id="focus-display">OMNI</span></div>
          <div><span class="k">STATUS</span> <span class="v" id="grid-status">GRID NOMINAL</span></div>
        </div>
      </div>

      <!-- MAIN STAGE -->
      <div class="shield-stage">
        <!-- LEFT COL -->
        <div class="col left">
          <div class="hull-section">
            <div class="sec-lbl">HULL INTEGRITY<span class="tag" id="hull-tag">100%</span></div>
            <div class="hull-row">
              <div class="lbl">INTEGRITY</div>
              <div class="bar"><div class="fill" id="hull-fill" style="width:100%"></div><div class="ticks"></div></div>
              <div class="val" id="hull-val">100%</div>
            </div>
          </div>

          <div class="threat-section">
            <div class="sec-lbl">THREAT ASSESSMENT</div>
            <div class="threat-row" id="threat-row">
              <div class="iconbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ff5a3a" stroke-width="1.5">
                  <path d="M12 2 L22 20 L2 20 Z"/>
                  <line x1="12" y1="9" x2="12" y2="14"/>
                  <circle cx="12" cy="17" r="0.8" fill="#ff5a3a"/>
                </svg>
              </div>
              <div class="info">
                <div class="k">INCOMING</div>
                <div class="v" id="threat-detail">HOSTILE CONTACT</div>
              </div>
              <div class="spacer"></div>
              <div class="bearing">
                <div>BEARING <span class="v" id="threat-bearing">—</span></div>
              </div>
            </div>
          </div>

        </div>

        <!-- CENTER COL -->
        <div class="col center">
          <div class="diagram-wrap">
            <div class="corner-readout tl"><span class="k">SHIELDS</span><span class="v" id="shields-state">UP</span></div>
            <div class="corner-readout tr"><span class="k">HARMONIC</span><span class="v" id="harmonic-state">NUTATING</span></div>
            <div class="corner-readout bl"><span class="k">DEFLECTOR</span><span class="v" id="deflector-state">ONLINE</span></div>
            <div class="corner-readout br"><span class="k">MODULATION</span><span class="v" id="modulation-state">F-1.247</span></div>
            <img class="ship-ring" src="../assets/phone_border/compass-ring.png" alt="" aria-hidden="true">
            <img class="ship-needle" src="../assets/phone_border/needle.png" alt="" aria-hidden="true">
            <svg viewBox="0 0 200 200">
              <defs>
                <pattern id="shield-hex-fill" patternUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
                  <image href="../assets/shield_console/shield-hex-bg.png" x="0" y="0" width="200" height="200" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
                <radialGradient id="chassisGrad" cx="50%" cy="42%" r="62%">
                  <stop offset="0%"  stop-color="#0c1230"/>
                  <stop offset="55%" stop-color="#070b22"/>
                  <stop offset="100%" stop-color="#03050e"/>
                </radialGradient>
                <filter id="hubGlow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB">
                  <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
                  <feBlend in="SourceGraphic" in2="blur" mode="normal"/>
                </filter>
              </defs>

              <!-- ── Back plate ──────────────────────────── -->
              <!-- Dark bezel ring body (r=83 to r=91) via layered circles -->
              <circle cx="100" cy="100" r="91" fill="#04060f"/>
              <!-- Chassis interior fill -->
              <circle cx="100" cy="100" r="83" fill="url(#chassisGrad)"/>

              <!-- Range rings (25 / 50 / 75 pct of arc span INNER_R=34..MAX=78) -->
              <circle cx="100" cy="100" r="45" fill="none" stroke="#1f2750" stroke-width="0.5" stroke-dasharray="1.5 4" opacity="0.85"/>
              <circle cx="100" cy="100" r="56" fill="none" stroke="#1f2750" stroke-width="0.5" stroke-dasharray="1.5 4" opacity="0.85"/>
              <circle cx="100" cy="100" r="67" fill="none" stroke="#1f2750" stroke-width="0.5" stroke-dasharray="1.5 4" opacity="0.85"/>

              <!-- Ship silhouette (top-down, bow pointing up = Fore) -->
              <g opacity="0.6">
                <ellipse cx="100" cy="97" rx="9" ry="11" fill="#1a2148" stroke="#3a4674" stroke-width="0.5"/>
                <rect x="98.5" y="105.5" width="3" height="5" rx="0.5" fill="#1a2148" stroke="#3a4674" stroke-width="0.4"/>
                <line x1="94" y1="109.5" x2="99.5" y2="106" stroke="#3a4674" stroke-width="0.5"/>
                <line x1="106" y1="109.5" x2="100.5" y2="106" stroke="#3a4674" stroke-width="0.5"/>
                <ellipse cx="93" cy="112" rx="2" ry="4.5" fill="#1a2148" stroke="#3a4674" stroke-width="0.4"/>
                <ellipse cx="107" cy="112" rx="2" ry="4.5" fill="#1a2148" stroke="#3a4674" stroke-width="0.4"/>
              </g>

              <!-- Hub -->
              <circle cx="100" cy="100" r="14" fill="#050918" stroke="#3a4674" stroke-width="0.8"/>
              <circle cx="100" cy="100" r="11" fill="none" stroke="#1f2750" stroke-width="0.5"/>
              <!-- Hub glow dot (rendered below main dot so it blurs outward) -->
              <circle cx="100" cy="100" r="3.5" fill="#6cb6d0" opacity="0.35" filter="url(#hubGlow)"/>
              <circle cx="100" cy="100" r="2.2" fill="#6cb6d0"/>

              <!-- Tick marks and bearing labels (JS-populated on load) -->
              <g id="svg-ticks"></g>

              <!-- ── Quadrant arcs (shield segments) ─────── -->
              <path id="arc-fore" class="shield-segment" data-facing="Fore" tabindex="0" role="button" aria-label="Focus fore shields" fill="var(--cyan)" stroke="var(--cyan)" stroke-width="1.6" opacity="0.38"/>
              <path id="arc-aft" class="shield-segment" data-facing="Aft" tabindex="0" role="button" aria-label="Focus aft shields" fill="var(--cyan)" stroke="var(--cyan)" stroke-width="1.6" opacity="0.38"/>
              <path id="arc-port" class="shield-segment" data-facing="Port" tabindex="0" role="button" aria-label="Focus port shields" fill="var(--cyan)" stroke="var(--cyan)" stroke-width="1.6" opacity="0.38"/>
              <path id="arc-stbd" class="shield-segment" data-facing="Starboard" tabindex="0" role="button" aria-label="Focus starboard shields" fill="var(--cyan)" stroke="var(--cyan)" stroke-width="1.6" opacity="0.38"/>

              <!-- ── Front frame (over arcs) ─────────────── -->
              <!-- Inner chassis ring (soft cyan accent on arc inner boundary) -->
              <circle cx="100" cy="100" r="83" fill="none" stroke="rgba(108,182,208,0.11)" stroke-width="0.9"/>
              <!-- Bright chassis ring (bezel inner edge) -->
              <circle cx="100" cy="100" r="86" fill="none" stroke="#5e6f96" stroke-width="1.0" opacity="0.8"/>
              <!-- Outer bezel accent -->
              <circle cx="100" cy="100" r="89.5" fill="none" stroke="#3a4674" stroke-width="1.4" opacity="0.9"/>
              <!-- Outermost soft ring -->
              <circle cx="100" cy="100" r="91.2" fill="none" stroke="#1f2750" stroke-width="0.5" opacity="0.5"/>

              <!-- Spoke dividers at quadrant gap angles (45°/135°/225°/315° from top) -->
              <!-- Each spoke runs from hub edge (r≈14) to chassis (r=83); sin/cos(PI/4)=0.707 -->
              <!-- NE (45°):  hub=(110,90)  chassis=(159,41) -->
              <line x1="110" y1="90"  x2="159" y2="41"  stroke="#3a4674" stroke-width="0.9" opacity="0.8"/>
              <!-- SE (135°): hub=(110,110) chassis=(159,159) -->
              <line x1="110" y1="110" x2="159" y2="159" stroke="#3a4674" stroke-width="0.9" opacity="0.8"/>
              <!-- SW (225°): hub=(90,110)  chassis=(41,159) -->
              <line x1="90"  y1="110" x2="41"  y2="159" stroke="#3a4674" stroke-width="0.9" opacity="0.8"/>
              <!-- NW (315°): hub=(90,90)   chassis=(41,41) -->
              <line x1="90"  y1="90"  x2="41"  y2="41"  stroke="#3a4674" stroke-width="0.9" opacity="0.8"/>

              <!-- Threat indicator (triangle on perimeter) -->
              <polygon id="threat-arrow" points="0,0 0,0 0,0" fill="var(--fire-bright)" opacity="0.8" display="none"/>
            </svg>
          </div>
          <div class="diagram-caption" id="focus-caption">FOCUS · <span class="focus-name">OMNI</span> · BALANCED</div>
        </div>

        <!-- RIGHT COL -->
        <div class="col right">
          <div class="sec-lbl">QUADRANTS<span class="tag" id="quad-tag">4 UP</span></div>
          <div id="quad-cards"></div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer-bar">
        <span class="dot"></span>
        <span id="footer-grid">GRID NOMINAL</span>
        <span class="sep">/</span>
        <span>FOCUS · <span style="color:var(--tactical)" id="footer-focus">OMNI</span></span>
        <span class="sep">/</span>
        <span>HULL <span id="footer-hull">100%</span></span>
        <span class="sep">/</span>
        <span id="footer-threat"></span>
        <div class="spacer"></div>
        <span>STATION · TACTICAL</span>
        <span class="sep">/</span>
        <span>AEV-074 PHOENIX</span>
      </div>
    </div>
  </div>

  <script>
    var _state = {
      facings: [],
      hull_integrity_pct: 100,
      focused_facing: null,
      target_bearing: null,
      grid_status: 'GRID NOMINAL'
    };

    var QUADRANT_ORDER = ['Fore', 'Port', 'Aft', 'Starboard'];

    function onFocus(facing) {
      var nextFacing = (_state.focused_facing === facing) ? null : facing;
      if (typeof window._sendShieldAction === 'function') {
        window._sendShieldAction('set_shield_focus', { facing: nextFacing });
      }
      _state.focused_facing = nextFacing;
      _rerender();
    }

    function quadRowById(quad) {
      return _state.facings.find(function(f) { return f.label === quad; }) || null;
    }

    function tier(pct) {
      if (pct <= 0) return 'down';
      if (pct < 30) return 'low';
      if (pct < 60) return 'mid';
      return 'high';
    }

    function quadLabel(label) {
      var map = { 'Fore': 'FORE', 'Port': 'PORT', 'Aft': 'AFT', 'Starboard': 'STBD' };
      return map[label] || label.toUpperCase();
    }

    function eta(pct) {
      if (pct >= 100) return { v: 'NOMINAL', cls: '' };
      if (pct <= 0)   return { v: 'EMITTER DOWN', cls: 'down' };
      if (pct < 30)   return { v: Math.round(60 + (100 - pct) * 1.2) + 'S', cls: 'warn' };
      return { v: Math.round(20 + (100 - pct) * 0.8) + 'S', cls: '' };
    }

    function polarPoint(cx, cy, r, angle) {
      return {
        x: cx + r * Math.sin(angle),
        y: cy - r * Math.cos(angle)
      };
    }

    function shieldSegmentPath(cx, cy, innerR, outerR, startAngle, endAngle) {
      var outerStart = polarPoint(cx, cy, outerR, startAngle);
      var outerEnd = polarPoint(cx, cy, outerR, endAngle);
      var innerStart = polarPoint(cx, cy, innerR, startAngle);
      var innerEnd = polarPoint(cx, cy, innerR, endAngle);
      var large = (endAngle - startAngle) > Math.PI ? 1 : 0;
      return [
        'M', outerStart.x, outerStart.y,
        'A', outerR, outerR, 0, large, 1, outerEnd.x, outerEnd.y,
        'L', innerEnd.x, innerEnd.y,
        'A', innerR, innerR, 0, large, 0, innerStart.x, innerStart.y,
        'Z'
      ].join(' ');
    }

    function _buildSvgTicks() {
      var g = document.getElementById('svg-ticks');
      if (!g) return;
      var parts = [];
      var CX = 100, CY = 100;
      for (var deg = 0; deg < 360; deg += 5) {
        var isCardinal = deg % 90 === 0;
        var isMajor    = deg % 30 === 0;
        var rOuter = 83;
        var rInner = isCardinal ? 72 : (isMajor ? 75 : 78);
        var sw     = isCardinal ? 1.3 : (isMajor ? 0.9 : 0.55);
        var op     = isCardinal ? 0.9 : (isMajor ? 0.65 : 0.4);
        var a = (deg - 90) * Math.PI / 180;
        var x1 = (CX + rInner * Math.cos(a)).toFixed(2);
        var y1 = (CY + rInner * Math.sin(a)).toFixed(2);
        var x2 = (CX + rOuter * Math.cos(a)).toFixed(2);
        var y2 = (CY + rOuter * Math.sin(a)).toFixed(2);
        parts.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#3a4674" stroke-width="'+sw+'" opacity="'+op+'"/>');
      }
      // Bearing labels just inside the tick zone (r≈70 from center)
      var labels = [
        { deg: 0,   txt: '000', dx: 0,    dy: -70 },
        { deg: 90,  txt: '090', dx:  70,  dy: 0   },
        { deg: 180, txt: '180', dx: 0,    dy:  70  },
        { deg: 270, txt: '270', dx: -70,  dy: 0   },
      ];
      labels.forEach(function(b) {
        var x = CX + b.dx;
        var y = CY + b.dy + 2;  // +2 for text baseline centering
        parts.push('<text x="'+x+'" y="'+y+'" text-anchor="middle" dominant-baseline="middle" font-family="\'JetBrains Mono\',monospace" font-size="5.5" letter-spacing="1" fill="#5a6694" opacity="0.9">'+b.txt+'</text>');
      });
      g.innerHTML = parts.join('');
    }

    function _rerender() {
      var s = _state;
      var hullPct = s.hull_integrity_pct;
      var hullTier = tier(hullPct);

      // Hull
      var hullFill = document.getElementById('hull-fill');
      var hullVal = document.getElementById('hull-val');
      var hullTag = document.getElementById('hull-tag');
      hullFill.style.width = hullPct + '%';
      hullFill.className = 'fill' + (hullTier === 'low' ? ' low' : hullTier === 'mid' ? ' mid' : '');
      hullVal.textContent = Math.round(hullPct) + '%';
      hullVal.className = 'val' + (hullPct < 30 ? ' low' : hullPct < 60 ? ' warn' : '');
      hullTag.textContent = Math.round(hullPct) + '%';

      // Threat
      var threatRow = document.getElementById('threat-row');
      var threatDetail = document.getElementById('threat-detail');
      var threatBearing = document.getElementById('threat-bearing');
      if (s.target_bearing != null) {
        threatRow.classList.add('active');
        threatDetail.textContent = 'HOSTILE CONTACT';
        threatBearing.textContent = Math.round(s.target_bearing) + '\u00B0M';
      } else {
        threatRow.classList.remove('active');
        threatDetail.textContent = '—';
        threatBearing.textContent = '—';
      }

      // Threat arrow on SVG
      var threatArrow = document.getElementById('threat-arrow');
      if (s.target_bearing != null) {
        var bearingRad = (s.target_bearing - 90) * Math.PI / 180;
        var tipX = 100 + 65 * Math.cos(bearingRad);
        var tipY = 100 + 65 * Math.sin(bearingRad);
        var b1x = tipX + 6 * Math.cos(bearingRad + 2.4);
        var b1y = tipY + 6 * Math.sin(bearingRad + 2.4);
        var b2x = tipX + 6 * Math.cos(bearingRad - 2.4);
        var b2y = tipY + 6 * Math.sin(bearingRad - 2.4);
        threatArrow.setAttribute('points', tipX + ',' + tipY + ' ' + b1x + ',' + b1y + ' ' + b2x + ',' + b2y);
        threatArrow.style.display = 'block';
      } else {
        threatArrow.style.display = 'none';
      }

      // Shield diagram arcs
      var CX = 100, CY = 100, INNER_R = 34, MIN_OUTER_R = 46, MAX_OUTER_R = 78;
      var arcFore = document.getElementById('arc-fore');
      var arcAft = document.getElementById('arc-aft');
      var arcPort = document.getElementById('arc-port');
      var arcStbd = document.getElementById('arc-stbd');

      var foreQ = quadRowById('Fore');
      var aftQ = quadRowById('Aft');
      var portQ = quadRowById('Port');
      var stbdQ = quadRowById('Starboard');

      var forePct = foreQ ? (foreQ.hp / Math.max(foreQ.max_hp, 1)) : 0;
      var aftPct = aftQ ? (aftQ.hp / Math.max(aftQ.max_hp, 1)) : 0;
      var portPct = portQ ? (portQ.hp / Math.max(portQ.max_hp, 1)) : 0;
      var stbdPct = stbdQ ? (stbdQ.hp / Math.max(stbdQ.max_hp, 1)) : 0;

      var foreR = MIN_OUTER_R + (MAX_OUTER_R - MIN_OUTER_R) * forePct;
      var aftR = MIN_OUTER_R + (MAX_OUTER_R - MIN_OUTER_R) * aftPct;
      var portR = MIN_OUTER_R + (MAX_OUTER_R - MIN_OUTER_R) * portPct;
      var stbdR = MIN_OUTER_R + (MAX_OUTER_R - MIN_OUTER_R) * stbdPct;

      arcFore.setAttribute('d', shieldSegmentPath(CX, CY, INNER_R, foreR, -Math.PI/4, Math.PI/4));
      arcAft.setAttribute('d', shieldSegmentPath(CX, CY, INNER_R, aftR, 3*Math.PI/4, 5*Math.PI/4));
      arcPort.setAttribute('d', shieldSegmentPath(CX, CY, INNER_R, portR, 5*Math.PI/4, 7*Math.PI/4));
      arcStbd.setAttribute('d', shieldSegmentPath(CX, CY, INNER_R, stbdR, Math.PI/4, 3*Math.PI/4));

      function arcColor(t) {
        if (t === 'down') return 'var(--fire-dim)';
        if (t === 'low') return 'var(--fire-bright)';
        if (t === 'mid') return 'var(--reloading)';
        return 'var(--cyan)';
      }
      function styleArc(arc, q, pctFraction, label) {
        var pct = Math.round(pctFraction * 100);
        var isFocused = s.focused_facing === label;
        var color = isFocused ? 'var(--tactical)' : arcColor(tier(q && q.online ? pct : 0));
        arc.setAttribute('stroke', color);
        arc.setAttribute('fill', 'url(#shield-hex-fill)');
        arc.setAttribute('stroke-width', isFocused ? '2.5' : '1.6');
        arc.style.opacity = q && q.online ? (isFocused ? '0.72' : '0.42') : '0.16';
        arc.classList.toggle('focused', isFocused);
        arc.setAttribute('aria-pressed', isFocused ? 'true' : 'false');
      }

      styleArc(arcFore, foreQ, forePct, 'Fore');
      styleArc(arcAft, aftQ, aftPct, 'Aft');
      styleArc(arcPort, portQ, portPct, 'Port');
      styleArc(arcStbd, stbdQ, stbdPct, 'Starboard');

      // Focus display
      var focusName = s.focused_facing || 'OMNI';
      document.getElementById('focus-display').textContent = focusName;
      document.getElementById('focus-caption').innerHTML = 'FOCUS · <span class="focus-name">' + focusName + '</span>';
      document.getElementById('footer-focus').textContent = focusName;

      // Grid status
      var statusText = s.grid_status || 'GRID NOMINAL';
      document.getElementById('grid-status').textContent = statusText;
      document.getElementById('footer-grid').textContent = statusText;

      // Footer hull & threat
      document.getElementById('footer-hull').textContent = Math.round(hullPct) + '%';
      var footerThreat = document.getElementById('footer-threat');
      if (s.target_bearing != null) {
        footerThreat.textContent = '\u25CF THREAT BEARING ' + Math.round(s.target_bearing) + '\u00B0M';
        footerThreat.style.color = 'var(--fire-bright)';
      } else {
        footerThreat.textContent = '';
      }

      // Quadrant cards
      var cardsEl = document.getElementById('quad-cards');
      cardsEl.innerHTML = '';
      QUADRANT_ORDER.forEach(function(label) {
        var q = quadRowById(label);
        var pct = q ? q.hp : 0;
        var maxHp = q ? q.max_hp : 1;
        var pctDisplay = q && q.online ? pct : '—';
        var pctNum = q && q.online ? pct : 0;
        var t = tier(pctNum);
        var e = eta(pctNum);
        var isFocused = (s.focused_facing === label);
        var card = document.createElement('div');
        card.className = 'quad-card' + (isFocused ? ' focused' : '');
        card.innerHTML =
          '<div class="qc-body">' +
          '  <div class="qc-head"><div class="qc-name">' + quadLabel(label) + '</div></div>' +
          '  <div class="qc-row1">' +
          '    <div class="qc-pct ' + t + '">' + pctDisplay + '</div>' +
          '    <div class="unit">% SHIELD</div>' +
          '    <div class="spacer"></div>' +
          '    <div class="eta">RECHARGE<div class="v ' + e.cls + '">' + e.v + '</div></div>' +
          '  </div>' +
          '  <div class="qc-bar"><div class="fill ' + t + '" style="width:' + Math.max(0, pctNum) + '%"></div><div class="ticks"></div></div>' +
          '  <div class="qc-meta"><span><span class="k">EMITTER</span> <span class="v">' + label.substring(0, 2).toUpperCase() + '-04</span></span><span><span class="k">PWR</span> <span class="v">' + pctNum + '%</span></span></div>' +
          '</div>';
        cardsEl.appendChild(card);
      });

      // Quad tag
      var upCount = _state.facings.filter(function(f) { return f.online; }).length;
      document.getElementById('quad-tag').textContent = upCount + ' UP';
    }

    // ── State apply + render ────────────────────────────────────
    function _apply(s) {
      if (s.facings) _state.facings = s.facings;
      if (s.hull_integrity_pct != null) _state.hull_integrity_pct = s.hull_integrity_pct;
      if (s.focused_facing !== undefined) _state.focused_facing = s.focused_facing;
      if (s.target_bearing !== undefined) _state.target_bearing = s.target_bearing;
      if (s.grid_status) _state.grid_status = s.grid_status;
      _rerender();
    }

    document.querySelectorAll('.shield-segment').forEach(function(segment) {
      segment.addEventListener('click', function() {
        onFocus(segment.dataset.facing);
      });
      segment.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          onFocus(segment.dataset.facing);
        }
      });
    });
  </script>
  <script type="module">
    import { initConsole } from './console-core.js';
    var _c = initConsole({ name: 'Shields', render: function(s) { _apply(s); } });
    window._sendShieldAction = function(action, payload) { _c.sendAction(action, payload); };
  </script>
  <script>
    function _initDemo() {
      _apply({
        facings: [
          { label: 'Fore', hp: 100, max_hp: 100, online: true, offline_remaining: 0, is_focused: true },
          { label: 'Port', hp: 72, max_hp: 100, online: true, offline_remaining: 0, is_focused: false },
          { label: 'Aft', hp: 45, max_hp: 100, online: true, offline_remaining: 0, is_focused: false },
          { label: 'Starboard', hp: 88, max_hp: 100, online: true, offline_remaining: 0, is_focused: false }
        ],
        hull_integrity_pct: 78,
        focused_facing: 'Fore',
        target_bearing: 272,
        grid_status: 'GRID NOMINAL'
      });
    }

    _buildSvgTicks();
    _initDemo();
  </script>
</body>
</html>

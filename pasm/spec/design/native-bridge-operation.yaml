entities:
  - decision: native-controller-preferences-and-assignment
    core:
      status: accepted
      confidence: confirmed
      title: Persistent Controllers on Browser and Native Consoles
      summary: "Controllers already connected at startup are discovered, including by consoles opened or rebuilt later. The existing private operator profile retains bindings, tuning, preferred device and a default-on hide-touch-controls preference. Native profiles live outside ephemeral pane sessions, keyed by ship class and station or named participant pane, and contain no session credentials. A physical controller operates at most one native console at a time; ambiguous identical devices require explicit selection instead of inheriting a saved slot."
      rationale:
        - "Controller assignment follows a console across monitor moves and recreation, independently of keyboard focus. Disconnect neutralizes input and restores touch controls; reconnect retains preference without transferring authority to another device."
        - "The initial hide option affects only Helm's virtual joystick and lateral-thrust control, independently, and only when the selected connected controller provides usable bindings for that control."
        - "Station help shows current customized controller bindings only while the selected controller is connected and updates with remapping and console tab selection. The semantic action registry remains the source of binding descriptions."
        - "[ai] Native exclusive-assignment bookkeeping is host-local input state, never simulation state or a second command-admission route. Browser permission policies may require interaction before a device is exposed by its Gamepad API."
    implementation:
      status: declared
      paths: [gui/gamepad-input.js, gui/operator-profile.js, gui/help-panel.js, gui/settings-panel.js, src/native_host/panes/gamepad.rs, src/native_host/panes/gamepad_discovery.rs, src/native_host/panes/operator.rs, src/native_host/panes/transport.rs, src/native_host/panes/pane_boot.js, src/native_host/panes/ultralight.rs]
      tests: [tests/client/gamepad-input.test.js, tests/client/gamepad-persistence-presentation.test.js, tests/smoke/semantic-action-helm.spec.js, tests/client/operator-profile.test.js, tests/client/pane-scripts.test.js, docs/acceptance/controllers-native-gm.md]

  - decision: native-assigned-station-reservation
    core:
      status: accepted
      confidence: confirmed
      title: Host-Controlled Assigned Station Screens
      summary: "Claiming a station replaces the client's selection area with its existing console guide. Ordinary clients can change station through release confirmation. A native screen assigned from the host lobby stays tied to that station: it cannot release or switch, and another client cannot claim its reserved station. Host admission enforces these rules, rather than relying on hidden controls. Normal console tabs remain available."
      rationale:
        - "The host lobby moves or closes assigned screens. Moving, losing a monitor or rebuilding a console retains its reservation and identity; Backfill operates during disconnection. Host Off releases the reservation."
        - "Manually opened participant panes and ordinary browser clients keep their existing selection rules."
        - "[ai] A connected phone's existing station is not silently displaced by opening a native screen: the host is told to have it released first. A disconnected screen retains visible host Off and move controls even while its physical monitor is absent."
    implementation:
      status: declared
      paths: [gui/client-lobby-render.js, gui/lobby-view.js, src/lobby/session.rs, src/lobby/handler.rs, src/native_host/bridge_display.rs, src/native_host/console_assignment.rs, src/native_host/layout_store_systems.rs]
      tests: [tests/client/client-lobby-render.test.js, tests/client/lobby-view.test.js, tests/native_host_panes.rs, docs/acceptance/controllers-native-gm.md]

  - decision: native-local-gm-workspace
    core:
      status: accepted
      confidence: confirmed
      title: One Native Simulation with Ship and Local GM
      summary: "A native ship host can enable one full local GM workspace on a dedicated monitor before launch, alongside its viewscreen and station consoles. The GM is a distinct operator using the existing typed GM validation, ordering, attribution, journal and readiness policy. A private local presentation bridge supplies the existing GM projections and tools from the same simulation; it creates neither another simulation nor another lockstep peer."
      rationale:
        - "The host lobby's GM row provides monitor and Off buttons. Its monitor is exclusive and placement is retained in the bridge layout. The role can only be enabled or disabled before launch; an enabled GM screen may move to another free monitor during the mission."
        - "GM screen failure or monitor loss pauses the simulation once and preserves operator identity. Bounded recovery and monitor reassignment restore the surface, but only explicit GM Resume releases the pause after recovery."
        - "The local GM participates in existing Ready and Force Start rules. Browser GM tools remain shared; remote GM connectivity and new GM powers are outside this change."
        - "[ai] GM projection eligibility is separate from the browser GM-only boot profile so that a native ship and its local operator can coexist without removing the local ship. Crew transport and ordinary pane documents cannot access the private GM bridge."
    implementation:
      status: declared
      paths: [gui/gm-workspace.js, gui/native-gm-workspace.js, gui/host-lobby-view.js, gui/host-lobby-render.js, src/gm_action.rs, src/gm_roster.rs, src/native_host/bridge_layout.rs, src/native_host/native_gm/mod.rs, src/native_host/native_gm/start.rs, src/native_host/native_gm/bridge.rs, src/native_host/native_gm/recovery.rs]
      tests: [tests/native_host_gm.rs, tests/client/native-gm-workspace.test.js, tests/client/native-gm-bridge.test.js, tests/client/gm-monitor-row.test.js, docs/acceptance/controllers-native-gm.md]

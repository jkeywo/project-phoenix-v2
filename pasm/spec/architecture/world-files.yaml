        - "[ai] THE MANOEUVRE IS A THIN ADAPTER OVER docking_close_manoeuvre. The pure module answers the mate pose; the adapter asks the existing close-in manoeuvre for the ship-local intent onto it, rotates that back to world, and advances the own ship at the authored approach speed - not a new flight controller. On mate it snaps to the pose and holds; undock backs the ship straight out along its heading and returns ordinary flight. Each interruption - drifting past the authored range, dropping below min_power_level, damaging the dock to Disabled, or the berth being destroyed - ends the dock cleanly, checked most-actionable-first like the tractor's verdict."

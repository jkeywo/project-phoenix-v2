# Layer-fixture world for the `src/world/server.rs` layer tests.
#
# The ENTITY half of the layer contract: a loaded layer's entities spawn and
# register their names, and unload despawns exactly them. It was a deliberately
# DECLARATIVE `[[trigger]]` world until issue #985 deleted that front-end, and
# stayed logic-free through the gap that left.
#
# The SCENARIO-LOGIC half came back through script-in-layers (issue #1045) and
# is pinned by `layer_scripted_a.toml` / `layer_scripted_b.toml` beside this
# file. It is deliberately NOT folded in here: keeping this fixture script-free
# keeps the entity assertions reading exactly what they claim to.

[global]
seed = 7

[[entity]]
template_path = "assets/entities/ship_harrow_destroyer.toml"
name = "test.layer_fixture.raider"
transform = { position = [400.0, 0.0, 0.0] }

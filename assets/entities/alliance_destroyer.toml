# Per-axis helm systems (issue #701; thrust/steering declared in #800,
# impulse/boost/lateral in #703/#704/#801 — no coarse `helm` system remains).
# This hull declares five axes: helm-thrust, helm-steering, helm-impulse,
# helm-boost and helm-lateral-thrust, all owned by the helm station and power
# group. None appear in the `Std` rating's `automated_systems`, and an unmanned
# Helm gets the `Backfill` rating, which automates every station-owned system —
# so all five axes come up on AI together, and a manned Helm on `Std` keeps
# them all on the human. The `Simplified` rating automates only
# `helm-lateral-thrust`.
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "helm"
power_group = "helm"

[[system]]
id = "helm-steering"
kind = "helm_steering"
station = "helm"
power_group = "helm"

[[system]]
id = "helm-joystick"
kind = "helm_joystick"
station = "helm"
power_group = "helm"

[[system]]
id = "helm-engine-port"
kind = "helm_engine"
station = "helm"
power_group = "helm"

[[system]]
id = "helm-engine-starboard"
kind = "helm_engine"
station = "helm"
power_group = "helm"

[[system]]
id = "helm-radar"
kind = "helm_radar"
station = "helm"
power_group = "helm"

[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"
power_group = "weapons"

# Ship-wide phaser settings (issue #801): firing mode + emitter frequency.
# One declared system (NOT per-bank) so SetPhaserMode/SetPhaserFrequency
# admission gates on a real system instead of the deleted coarse `tactical`.
[[system]]
id = "phaser-control"
kind = "phaser_control"
station = "tactical"
power_group = "weapons"

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
station = "helm"
power_group = "helm"


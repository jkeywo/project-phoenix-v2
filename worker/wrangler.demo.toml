name = "phoenix-turn-credentials-demo"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
# Same Metered.ca app subdomain as the dev worker (worker/wrangler.toml) — the
# demo build proxies the same Metered.ca account, just from a second worker
# with a demo-scoped CORS origin.
METERED_APP = "projectphoenix"
# The canonical public demo origin, used for CORS. Cloudflare Pages serves
# this site behind its pp-demo.kiwigamedesign.co.uk custom domain. The dev
# worker (wrangler.toml) has its own origin and is untouched by this file.
ALLOWED_ORIGIN = "https://pp-demo.kiwigamedesign.co.uk"

# Secrets are NOT here — they are scoped per worker name, so set them for
# this worker separately (owner action — this repo cannot set secrets from CI):
#   wrangler secret put METERED_KEY --config wrangler.demo.toml
#   wrangler secret put CF_TURN_KEY_ID --config wrangler.demo.toml
#   wrangler secret put CF_TURN_API_TOKEN --config wrangler.demo.toml
# Either source (Metered / Cloudflare TURN) alone is enough.

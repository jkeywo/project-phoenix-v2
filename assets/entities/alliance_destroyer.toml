manual_overview = "You fly the destroyer — a fast, agile hull that rewards aggressive flying. Throttle and steering set your line; lateral thrust slides you across a target's arc; boost and impulse close or break range in a hurry. Keep the omni phaser on target for Tactical. Simplified rating lets the AI hold lateral thrust."

[[station.rating]]

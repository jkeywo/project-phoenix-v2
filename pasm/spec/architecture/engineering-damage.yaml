  - component: host-command-admission
    core:
      status: implemented
      confidence: confirmed
      title: Host Command Admission
      summary: Admission layer that validates incoming system commands before simulation handlers run.
      rationale:
        - "Issue #738: the seam owns the AI side of the typed input path too. Every console/system AI operator used to carry its own byte-identical emit_*_ai_command helper (helm #824, shields #826, sensors #828, navigation/repair #830, power #831, captain) that built an ai:<uuid> token, fabricated an empty ShipConfig for entities with no ShipConfigComponent, and called validate_and_admit. Those seven copies collapsed into command_admission::ai_emit::emit_ai_command, so the token shape and the unconfigured-ship admission context are decided in exactly one place."
        - "Issue #898 makes this seam the place a run's inputs are WRITTEN DOWN, and settles what that means. PRD #849 described a log carrying 'human and AI commands both stamped for a future tick', which cannot be built as written: AI decisions never cross a network boundary — emit_ai_command writes them in-process, mid-tick, straight into the target ship's AdmittedCommands. OPTION A IS THE DECISION: the log records the network boundary, and nothing a replaying instance can re-derive for itself. Every command admit_system_commands accepts is recorded in acceptance order, stamped with the logical tick it applies on; every emit_ai_command emission is absent and keeps its same-tick guarantee untouched. What makes the omission safe is that replaying the log from the same master seed regenerates identical AI behaviour, so recording AI decisions too would DOUBLE-COUNT them — the replay would apply each order once from the log and once from the decider that re-derived it. That is what makes AI determinism load-bearing, and why #895 put the AI cadence on the logical tick and #897 seeded the RNG per call site first. The recorder does not ask whether a command came from a human or an AI: it records at a SEAM, not by origin, which is the only reading compatible with the human/AI symmetry constraint. If #854 later has a peer send an NPC's orders over the wire those are logged too — correctly, because a remote peer's decisions are not something this instance re-derives."
        - "Issue #898 leaves 'commands apply the tick they are admitted' INTACT, and names the one place a future slice may amend it. CommandDelay is the lockstep input delay in logical ticks: a logged command's apply tick is SimTick at admission plus CommandDelay, and CommandDelay is 0 for a local host, so the apply tick IS the admission tick and the command lands in AdmittedCommands in the same run of the same system, in the same order, as it did before the log existed. What changed is that the tick is written down rather than implied, and that admission drains from an ordered (apply tick, arrival) queue keyed on it — a pass-through today BY CONFIGURATION rather than by construction. A non-zero CommandDelay is P2P lockstep's (#854) to negotiate once there is a second peer to agree one with, and setting one is therefore the DELIBERATE amendment point for that rule, not something the plumbing can do by accident. CommandDelay is a resource rather than TOML gameplay data precisely because no designer tunes it and a wrong value is a desync, not a balance change."
        - "Issue #898 review: a LoggedCommand carries a non-secret routing key, never the sender's session token. A session token is a bearer credential — it is the whole of a client's identity — and the log's destinations are exactly the two places such a string must not reach: a save file on disk and a peer over the wire. So a log entry is the non-secret PROJECTION of an AdmittedCommand: same target and payload, but response_token replaced by a ShipKey, the routed ship's EntityUuid. That key is deterministic (the seeded simulation mints it) and is already the vocabulary snapshots, balance events and damage ledgers name ships in, so a replay resolves it with machinery that exists. It suffices because routing is a DESTINATION, not an identity — admission resolves a token to one ship's AdmittedCommands, and the key names that ship directly. The raw token stays on the in-process AdmittedCommand, which is deliberately NOT Serialize. Two further review points: registration of the log resources and of admit_system_commands is folded into one register_admission_seam call, because a half-wired seam fails silently three ways (the system alone fails Bevy parameter validation and skips admission entirely; the resources alone leave an always-empty log that reads as 'this run had no input'; either half twice double-counts). And reset_command_log clears the log and the pending queue in OnEnter(GamePhase::InProgress), because a second round reached through ReturnToLobby would otherwise append to round one's log — silently, since SimTick keeps counting and the merged log stays monotonic."
    architecture:
      kind: service
      authority: authoritative
      validates:
        - dispatch-repair-team-command
      consumes:
        - dispatch-repair-team-command
      depends_on:
        - system-command-admission-policy
        - admitted-command-router
        # src/command_admission/mod.rs declares `pub mod debug_route` — the
        # phone client's Debug/Cheat gate (issue #940), which the seam's
        # policy consults for the one command ordinary station tenure cannot
        # authorise.
        - client-debug-control-route
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/command_admission/mod.rs
        - src/command_admission/ai_emit.rs
        - src/command_admission/log.rs
      symbols:
        - AdmissionPlugin
        - AdmissionSet
        - admit_system_commands
        - validate_and_admit
        - emit_ai_command
        - ai_token_for
        - register_admission_seam
        - CommandLog
        - CommandDelay
        - PendingCommands
        - LoggedCommand
        - ShipKey
        - stamp_accepted_command
        - reset_command_log
      messages:
        - ControlSystem
      tests:
        - cargo test
    evidence:
      - kind: test
        reference: dispatch_to_an_ai_controlled_system_rejects_humans_and_admits_ai
        summary: >-
          The admission seam is its own module. Unauthorised tokens, offline
          ratings, damage-driven offline systems, and AI-controlled systems are
          all rejected by is_command_authorized before any router runs.
      - kind: test
        reference: a_seed_and_its_command_log_reproduce_the_run
        summary: >-
          Option A's claim at run scale. A seeded headless run takes commands
          across the production boundary and keeps the log; the same seed
          replayed with only that log re-injected, each entry on its recorded
          tick, produces a byte-identical build_report. A third run with no
          commands reaches a different report, so the equality is a replay
          rather than a tautology.
      - kind: test
        reference: an_ai_crewed_run_records_no_commands
        summary: >-
          The other half of Option A. An AI-crewed run issues orders on every
          tick (accumulated by a FixedLast probe) and records none of them,
          because none crossed the network boundary.
      - kind: test
        reference: the_log_round_trips_through_ron_without_the_token
        summary: >-
          The log serialises to RON carrying the routed ship's key and no
          session token — asserted at the exact point the log would become a
          file on disk or a frame on the wire.
      - kind: test
        reference: a_second_round_starts_a_fresh_command_log
        summary: >-
          Driving GameOver then Lobby then InProgress through the real
          add_simulation_plugins_with wiring leaves an empty log and an empty
          pending queue, so a second round's seed plus log still describes one
          run.

  - component: host-repair-router
    core:
      status: implemented
      confidence: confirmed
      title: Host Repair Router
      summary: Per-entity server-side repair handler that applies each ship's own admitted station-level repair-team dispatches to that ship's own repair-team state, resolving the station to its most-damaged repairable fine system.
      rationale:
        - "Issue #830: the router iterates every Ship (player + NPC) and writes each ship's own per-entity ShipRepairTeams component — the global ShipRepairTeams Resource and the dispatch's dual-write to it are gone. A same-source admitted DispatchRepairTeam lands on exactly the ship that owns it, whether a human Engineering console or an AI operator's ai:<uuid> emission produced it."
        - "It moved from SimSet::Input into SimSet::Physics `.after(operate_repair_ai)`: admission clears AdmittedCommands once per tick before Input, so the AI operator's same-tick emission is only visible when the applier runs after it in Physics. Human dispatches admitted before Input survive to Physics unchanged."
        - "Issue #785: the AI-side dispatch now ORIGINATES from an authored per-system target selector ([repair.selector] / RepairTargetSelector, ranked in operate_repair_ai) instead of a hardcoded (tier desc, deficit desc) comparator — but the router is untouched. The payload is the same station-granular DispatchRepairTeam (plus RepairTarget::Core for the ownerless bucket), admitted through the same validate_and_admit seam, and resolve_repair_target still owns the fine-system choice identically for human and AI dispatch. No RepairTarget variant was added, precisely so the AI cannot express anything the human wire cannot send: the §2 symmetry established here is preserved unchanged."
        - "The admitted DispatchRepairTeam is station-granular, so resolve_repair_target — the router's single fine-system resolver — decides which repairable fine system in the station heals first, IDENTICALLY for human and AI dispatch (§2 admission symmetry). The AI operator no longer carries a private per-system choice: its retired inline heuristic ranked by absolute HP deficit, whereas resolve_repair_target ranks by damage fraction, so for a station owning multiple simultaneously-damaged systems of differing max HP the healed-first system can differ from the pre-#830 choice. That is the intended dissolution of the AI's bespoke resolution into the shared seam, not a regression."
    architecture:
      kind: subsystem
      authority: authoritative
      reads:
        - authoritative-damage-state
        - repair-team-state
      consumes:
        - dispatch-repair-team-command
        - onsite-repair-priority-command
      depends_on:
        - host-command-admission
      must_not_depend_on:
        - repair-console-interface
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/console/repair/dispatch.rs
      symbols:
        - handle_dispatch_repair_team
        - handle_set_repair_priority
        - register_repair_dispatch
      messages:
        - DispatchRepairTeam
        - SetRepairPriority
      tests:
        - cargo test
    evidence:
      - kind: test
        reference: non_repair_sender_is_ignored
        summary: >-
          src/console/repair/dispatch.rs names the admission seam with a
          top-level `use crate::command_admission::AdmissionSet;` and pins the
          router `.after(AdmissionSet)`, so it can only ever read commands that
          admission already validated.

  - component: repair-visibility-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Repair Visibility Publisher
      summary: Host publisher that derives the different damage views for Engineering and owning stations.
      rationale:
        - Aggregate hull, core detail, owner-local detail, and on-site team detail are different information surfaces.
        - Team arrival is an information gate for non-core engineering detail.
        - >-
          Issue #737: the four views must be decided on the host. Before it, the
          publisher's paths spanned host AND client and every connected client
          received exact per-system detail for the whole ship at `Target::All`,
          so the separation was presentation-only and the hidden rows were
          already on every phone. The entity is now host-only.
        - >-
          One projection serves both the live broadcast and the reconnect
          resync, so reconnecting cannot be used to obtain withheld detail.
        - >-
          The boundary needs two gates, not one. Filtering `system_hull` alone
          left `RepairBlackboard.queue_depth` — every *damaged* system's exact
          tier and HP deficit — and `teams` — each team's destination system —
          riding through a `..bb.clone()` spread to every connected token, which
          made the row filter cosmetic in exactly the case that matters. The
          repair blackboard is now (1) sent only to the Engineering holder, and
          (2) projected field by field with no struct-update spread, so a newly
          added field cannot silently ride through unprojected.
        - >-
          [ai] Restricting the audience is safe because nothing but the Engineering
          console reads this payload: `buildRepairConsoleState` is reached only
          from a station that owns the `repair` system (battleship `repair`,
          cruiser/destroyer `engineering`, courier `captain`). A viewer who is
          not entitled receives an *empty* blackboard rather than no message, so
          a player who has just moved off Engineering cannot keep a stale copy.
    architecture:
      kind: adapter
      authority: authoritative
      reads:
        - authoritative-damage-state
        - repair-team-state
      produces:
        - engineering-aggregate-hull-state
        - core-damage-detail-state
        - station-owner-local-damage-state
        - onsite-repair-detail-state
      depends_on:
        # The projection pushes finished per-token payloads straight into the
        # broadcaster's outbox: there is no per-recipient fan-out primitive in
        # the `SimBroadcaster` Audience model, which resolves one producer to
        # one Target.
        - host-state-broadcaster
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      # `src/console/repair/server.rs` is genuinely part of this entity's
      # surface — `publish_repair_blackboard` constructs the unprojected
      # blackboard, `queue_depth` included. It is deliberately NOT listed: five
      # other entities already claim that file (repair-team-cycle-policy,
      # authoritative-damage-state, host-repair-team-state, repair-team-state,
      # and the NPC-AI console router), so it is already multi-owned and
      # dropped from attribution. Adding a sixth claim would not restore
      # attribution, only obscure the ownership. The projection seam this entity
      # is actually observed at is `visibility.rs`, which owns the decision.
      paths:
        - src/console/repair/visibility.rs
      symbols:
        - HullVisibility
        - push_hull_updates
        - project_repair_blackboards
        - hull_update_for_token
        - may_receive_repair_blackboard
        - project_repair_blackboard
      tests:
        - cargo test
    evidence:
      - kind: code
        reference: src/console/repair/visibility.rs
        summary: >-
          Host-only module. Names the authoritative damage store with a
          line-start `use crate::damage::SystemHull;` and the repair-team state
          machine with `use crate::modifiers::repair_teams::RepairTeams;`, so
          both reads are real code edges rather than prose claims.
      - kind: test
        reference: live_broadcast_gives_engineering_core_only_with_no_team_on_site
        summary: >-
          Engineering's `SystemHullUpdate` carries core detail and its own
          station's systems, and no other station's rows.
      - kind: test
        reference: live_broadcast_gives_a_station_owner_only_its_own_systems
        summary: A station holder receives exact detail for its own systems only.
      - kind: test
        reference: reconnect_resync_honours_the_same_gating_as_the_live_broadcast
        summary: >-
          The reconnect payload for a token is byte-identical in row set to what
          the live broadcaster sent it.
      - kind: test
        reference: repair_blackboard_fans_out_per_token_while_others_stay_broadcast
        summary: >-
          The repair blackboard (the other carrier of exact hull detail) is
          targeted per token and never reaches `Target::All`. A non-Engineering
          recipient receives the empty blackboard, not a filtered one.
      - kind: test
        reference: only_the_engineering_holder_receives_the_repair_blackboard
        summary: >-
          The audience gate: `may_receive_repair_blackboard` admits the station
          that owns the `repair` system and nobody else, including an unassigned
          viewer.
      - kind: test
        reference: a_station_owner_gets_no_queue_entry_for_a_station_it_does_not_own
        summary: >-
          `queue_depth` carries exact tier and HP deficit scoped to damaged
          systems, and is filtered on the same rule as the hull rows.
      - kind: test
        reference: the_projection_names_every_field_so_none_can_ride_through_unprojected
        summary: >-
          Pins which fields are projected and which are deliberately whole, so
          reintroducing a `..bb.clone()` spread fails a test rather than
          silently widening the boundary.
      - kind: test
        reference: a_station_change_invalidates_the_cached_projection
        summary: >-
          A recipient's station is an input to their projection, so the
          per-token cache tracks it: changing station mid-game re-projects even
          when the internal blackboard is unchanged, which on an idle undamaged
          ship would otherwise never happen.


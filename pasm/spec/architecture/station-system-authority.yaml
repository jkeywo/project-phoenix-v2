  - component: system-kind-registry
    core:
      status: implemented
      confidence: confirmed
      title: System Kind Descriptor Registry
      summary: Code-backed authoritative descriptors that validate ship-authored System kinds and require both Console Family metadata and authoritative command-capability metadata for every shipped kind. A separate descriptor table assigns presentation families to reserved/aggregate blackboard keys without registering them as Systems.
      rationale:
        - "One id, one meaning (#801, #1254). System ids name declared [[system]] instances that get a ControlSource, gate admission, and may be damaged. Station ids name authored crew surfaces and console-level blackboards. ControlSystem wire targets are always System ids; Coordination uses its separate explicit Station-or-Ship address type."
        - "The coarse helm and tactical systems were deleted by #801: \"helm\" and \"tactical\" are Station ids, not declared Systems. Legacy helm_station_key / tactical_station_key helpers remain only where aggregate blackboards still use SystemId-typed keys pending their owning migration; no [[system]] block declares them, no ControlSource is registered for them, and neither commands nor Coordination disguise them as System targets."
        - "Console Family is presentation metadata, not an authority source: every instance projects by kind regardless of its authored instance or owning Station id, while the authored id remains command authority."
        - "Reserved and aggregate blackboard keys declare their affected Console Family in a separate map because those channels are not Systems and must not acquire control-source, damage, ownership or command semantics."
        - "Admitted-command capability is authoritative descriptor metadata, independent of Console Family. Passive kinds such as power_battery remain valid topology without manufacturing a consumer requirement; commandable kinds drive the production consumer-coverage guard without a second expected-SystemId fixture."
    architecture:
      kind: registry
      authority: authoritative
      owns: [system-console-family-projection-state, blackboard-console-family-projection-state]
      reads: [ship-station-system-topology-state]
      produces: [system-console-family-projection-state, blackboard-console-family-projection-state]
      validates: [ship-station-system-topology-state]

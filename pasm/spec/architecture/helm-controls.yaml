  - component: helm-engines-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Engines AI Operator
      summary: Data-authored #775 fine system whose stateless policy resolves a longitudinal-channel mode verb (actuate_desired_travel) to decide whether to actuate this tick; when it fires, the host emits SetThrust with the continuous magnitude decoded from the shared DesiredMotion planner fact, slowing for arrival and collision avoidance according to ship capability.
      rationale:
        - "Issue #779 (AC1): Engines is the first continuous fine actuator moved onto the authored #775 policy spine. The DECISION to actuate flows through HelmEnginesAiPolicy (attached at spawn from [helm_console.engines_ai]) resolving the longitudinal channel to the actuate_desired_travel mode verb, replacing the pre-#779 unconditional hardcoded branch in ai_helm_thrust."
        - "Issue #885 (8555e336) deleted the default_engines_ai_config synthesiser that used to fill an unauthored block (an unconditional actuate rule). Strict AI-declaration mode is now the default in EntityConfig::from_toml, so an undeclared block is a LOAD ERROR rather than an invented policy, and every shipped hull authors the block explicitly."
        - "Continuous value vs fixed verb (AGENTS.md #11): the mode verb carries no scalar. The forward/reverse magnitude stays sourced from DesiredMotion.desired_velocity_local, decoded by decode_thrust_from_velocity, so no geometry lives in the Bevy-free policy. A 'hold' resolution (no rule fires / explicit idle) emits nothing and the throttle coasts."
        - "Human/AI symmetry (AGENTS.md #6, AC3/AC6): terminates in the same admitted SetThrust a human sets, through emit_helm_ai_command; the per-axis operate_ai gate preserves human-takeover / backfill authority. Policy is stateless, so reacquisition needs no lifecycle reset."
        - "Issue #883 (AC5) CLOSED the #779 empty-facts gap on this axis. ai_helm_thrust constructed AiFacts::new() literally — an EMPTY snapshot — so any fact(...) guard on the longitudinal channel validated at load and was then false for ever. It now seeds the same hazard/availability snapshot #780 gave the secondary axes PLUS the new target-relative travel facts (seed_helm_travel_facts: target_valid, range_to_target, closing_rate, bearing_to_target, speed_fraction), computed host-side from the frame merged view and ShipPhysics so policy.rs stays Bevy-free. Engines may now also declare a #882 STATE MACHINE (HelmEnginesAiPolicyState, resolved through the shared resolve_helm_channel seam); every shipped hull remains stateless and unchanged."
        - "Issue #883 also seeds this host's AVAILABILITY facts honestly. ai_helm_thrust used to pass a hardcoded false for impulse_available and boost_available while ai_policy_state_tick and ai_helm_boost read them from the ship's own ImpulseConfigResource / BoostConfigResource — the #779 empty-facts trap one fact narrower, since a longitudinal guard on fact(boost_available) validated at load and then read 0 for ever. Both are now taken from those resources, because an absent fact and a fact pinned to 0 are equally silently-wrong to a guard."
        - "Issue #883 also gave this axis a second travel arm. When the ship publishes an active HelmPassSurface, helm_motion_planner sources desired motion from the pure plan_fly_through_pass instead of plan_helm_travel: a flat authored approach/escape throttle with NO decel ramp. Only the INBOUND leg of that arm is gated on a resolvable target; the ESCAPE leg reads no target at all and runs on the frozen heading even after the target dies or leaves radar. helm_destroy was not reused or mode-flagged for this — it brakes at stop_dist and re-faces, which is a station-keeping orbit, the opposite of a pass."
        - "Issues #788/#790/#791/#792 grew that second arm from one leg set to four, all sourced the same way. The surface now also carries the shield-recovery standoff and its re-engage pivot (#788, plan_recovery_orbit), the shields-independent combat broadside orbit (#790, the same pure orbit arm at an authored radius), the bow-on torpedo bearing (#791) and the predictive artillery station-keep (#792, plan_artillery_position). Each leg supplies its own flat authored throttle — there is still no decel ramp on any of them — and each has #780's hazard contribution summed onto its facing before the shared clamp, so avoidance bends a ring or a hold and never changes a leg."
        - "Issue #790 widened the arm's ENTRY gate, which had been a latent content trap. HelmPassSurface.active used to mean 'the fly-through pass is authored' and the recovery legs rode along on it because the destroyer authors both; a hull that circles and makes no pass authors no approach_speed or escape_speed and would have flown ordinary doctrine travel for ever, silently. active now means 'at least one complete leg set is authored', and the pass's own two throttles gate only the inbound and re-engage legs through the separate pass_legs flag — kept separate because those two are the planner's FALLBACK leg, and a fallback flown on an unauthored throttle is a ship coasting at zero into a fight."
        - "Runs on the one shared AI decision cadence (AGENTS.md #7; ai_tick_ready — see ai-helm-tick-cadence); full removal of the hardcoded plan_helm_travel planner branch is the coordinated tail #794 (see legacy-ai-doctrine-retirement)."
    architecture:
      kind: service
      authority: authoritative
      reads:
        - helm-actuator-input-state
        - hazard-assessment-state
        - impulse-manoeuvre-policy-state
        - desired-motion-state
      writes:

entities:
  - component: phoenix-delivery-sequence
    core:
      status: accepted
      confidence: confirmed
      title: Phoenix Demo and Post-Demo Delivery
      summary: "The demo critical path front-loads deterministic simulation (#849), completed composable entity templates (#869), and Backfill combat symmetry (#870) before Combat Test doctrine closure (#774), measured readiness (#868 and #850), the snapshot tracer (#848/#862), and the deliberately narrow limited release (#853/#931): Combat Test only, Alliance Destroyer only. Post-demo delivery runs through A, inserted crew-control Band A2, campaign bands B-E and the Band F Patrol marker. A ships Falling Skyway and delivery/content foundations; A2 adds Command, spectators and AFK; B adds Borrowed Sun, fields/epistemics and P2P; C adds Narrow Season, physical-world/vessel deltas and GM MVP; D adds The Broken Tithe, resource networks and GM facilitation; E adds The Silent Corridor, deep station systems and complete GM tools; F adds Patrol, generated-world direction and database/customisation breadth."
      rationale:
        - Completed work already supplies the balance harness (#835), baseline player Backfill doctrine (#842), scenario catalogue and QR flow (#754-#756), legacy save/load tracer bullets (#431-#435), native scenario hosting (#420), and mod-pack export/overlay plumbing (#759-#760).
        - Determinism, authored composition, and player/NPC Backfill symmetry are foundational game contracts; settling them before Combat Test balance avoids tuning a model that will immediately change.
        - Snapshot and performance contracts start before the demo so later scenario work does not create incompatible state or unmeasured release risk, but their complete product surfaces do not block the first public release.
        - "Falling Skyway moved after the demo by the 2026-07-31 scope decision recorded on #853: the first public build is Combat Test and one hull, so the scenario is release A's content rather than a release gate."
    architecture:
      kind: roadmap-sequence
      authority: non-authoritative
      coordinates:
        - roadmap-completed-demo-baseline
        - roadmap-deterministic-simulation-foundation
        - roadmap-composable-entity-templates
        - roadmap-backfill-combat-symmetry
        - roadmap-current-combat-doctrine
        - roadmap-demo-readiness
        - roadmap-snapshot-contract-tracer
        - roadmap-demo-release
        - post-demo-release-bands
        - roadmap-scenario-scripting
        - roadmap-falling-skyway-foundation
        - roadmap-falling-skyway-content
        - roadmap-native-and-cloud-delivery
        - roadmap-mod-content-packs
        - roadmap-authoritative-snapshots
        - roadmap-post-demo-readiness
        - roadmap-p2p-multiship-delivery
        - roadmap-borrowed-sun-foundation
        - roadmap-borrowed-sun-content
        - roadmap-gm-console
        - roadmap-narrow-season-foundation
        - roadmap-narrow-season-content
        - roadmap-broken-tithe-foundation
        - roadmap-broken-tithe-content
        - roadmap-silent-corridor-content
        - roadmap-patrol-mode
        - roadmap-ship-customisation
        - roadmap-release-polish

  - component: roadmap-completed-demo-baseline
    core:
      status: accepted
      confidence: confirmed
      title: Completed Demo Baseline
      summary: "Completed work provides seeded headless balance and after-action reports (#835), baseline player-ship Backfill doctrine (#842), scenario catalogue, QR-first selection, and game-over return (#754-#756), legacy save/load tracer bullets (#431-#435), native scenario hosting (#420), and mod-pack export and host overlay resolution (#759-#760)."
      rationale:
        - These are assets of the next release, not new gates to rebuild.
        - The remaining roadmap must close their gaps rather than duplicate their scope.
    architecture:
      kind: roadmap-baseline
      authority: observational
      runs_in: [host-browser-runtime, headless-runtime, node-tooling-runtime]

  - component: roadmap-current-combat-doctrine
    core:
      status: accepted
      confidence: confirmed
      title: Combat Test Doctrine Completion
      summary: "Close #774 by completing the in-flight Harrow cruiser and remaining destroyer/battleship doctrine slices (#788-#794), removing legacy doctrine paths, and proving every NPC and Backfill fine system uses the same authored policy runtime."
      rationale:
        - The generic fine-system policy runtime and all core system policies (#776-#786) are complete; the demo risk is now combat content and migration closure, not AI architecture discovery.
        - Combat Test needs all three enemy classes to demonstrate distinct, readable tactical behaviour before it can serve as demo content.
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-demo-readiness
    core:
      status: accepted
      confidence: confirmed
      title: Measured Demo Combat, Asset, Terrain, and Onboarding Readiness
      summary: "After #849, #869, #870, and Combat Test doctrine closure, use completed #835 reports to rebalance Combat Test, establish representative performance baselines (#868), replace overlapping asteroid spawners with one weighted deterministic density field, move mesh LOD ownership to model sidecars with a repeatable asset workflow, and add contextual station tutorials (#850)."
      rationale:
        - Performance evidence, terrain readability, asset budgets, and onboarding are demo-quality concerns and must be resolved alongside tactical balance.
        - "#868 begins with non-blocking reproducible baselines; only the agreed demo budgets and regressions become release evidence."
        - "#868's measurement contract is the fleet's vellum-perf crate, which was written to this PRD's shape; phoenix adopts it and builds only the collectors, baseline files, asset-budget extraction, and reporting that the crate excludes by charter. This roadmap has no separate performance-workflow component: baselines belong to demo readiness."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [asteroid-field-lifecycle, entity-template-schema-validator]
      runs_in: [host-browser-runtime, headless-runtime, node-tooling-runtime]

  - component: roadmap-snapshot-contract-tracer
    core:
      status: accepted
      confidence: confirmed
      title: Snapshot Contract and Demo Tracer Bullet
      summary: "Pre-demo. Define the versioned authoritative snapshot boundary and deliver the bounded Combat Test capture/restore tracer (#848/#862) while the demo is still one scenario. The consequence, scenario, slot, export, and campaign adapters follow in release bands A-C, before any of them carries campaign content."
      rationale:
        - The snapshot contract now builds on #849's logical tick and command log, informing scenario data and later P2P without making save UX a first-demo release gate.
        - Stable content IDs and an authoritative-only boundary prevent browser, renderer, and session state leaking into future persistence.
        - "The envelope, the version gate, and the storage abstraction come from the fleet's vellum-save crate rather than a phoenix format; phoenix owns the snapshot payload and the host wiring. #849 now precedes this tracer, so captured world state can be tied to the established logical tick and command-log boundary."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      produces: [world-snapshot-artifact]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: post-demo-release-bands
    core:
      status: accepted
      confidence: confirmed
      title: Post-Demo Release Bands A, A2, and B-F
      summary: "Post-demo work proceeds through the campaign bands plus one inserted crew-control foundation. A: Rhai scenario scripting, Falling Skyway, native/cloud delivery, campaign adapters, mod packs and destroyer readiness. A2: Command stances, spectator MVP, manual open-station claims and AFK delegation before mission complexity grows in B. B: Borrowed Sun, environmental fields, sensor-derived observations, the complexity ladder, P2P multi-ship, portable export and the cruiser. C: Narrow Season, physical-world and relative-motion foundations, basic docking, GM-console MVP, campaign projection and the courier. D: The Broken Tithe, unified ship resources, life support, detailed Engineering/Repair/Power, docked services, consumables, GM facilitation and the battleship. E: The Silent Corridor plus Tactical payloads, intrusive scan, EWar MVP, signature management, GM-console completion, full-matrix balance and the ship-customisation MVP. F: Patrol Mode, shared generator/Director, discrete warp, station databases, docking refit/rewards and customisation flesh-out."
      rationale:
        - Each band is a shippable public build, not a paper milestone, so every band pairs one campaign mission with one platform capability, one more playable hull, and one visual/UX polish pass.
        - "The hull rollout is deliberately one at a time — destroyer, cruiser, courier, battleship — so tutorials, doctrine, and balance evidence land together per hull instead of as a single catalogue-wide push."
        - "The #848 adapters split across A, B, and C by what needs them: Falling Skyway needs consequence and scripted-progression resume, P2P join and recovery ride on the portable record, and campaign continuity only becomes real once three missions exist."
        - Defects are fixed as they arise outside these bands and are deliberately not scheduled into them.
        - "2026-08-13 decision (Starship Simulator Genesis review): missions 2-4 each gain a paired foundation PRD mirroring the #851/#852 pattern, threading a physical-world simulation layer through B-D rather than deferring it past the campaign. Platform capabilities stay in their bands; the bands get longer. Foundation PRDs are written just-in-time as each band starts. Scope guard: pasm/spec/design/simulation-differentiation.yaml."
    architecture:
      kind: roadmap-release-bands
      authority: non-authoritative
      reads: [world-content-pack-state]
      runs_in: [host-browser-runtime]

  - component: roadmap-band-a2-crew-control
    core:
      status: accepted
      confidence: confirmed
      title: "Band A2 — Crew Control Foundation"
      summary: "Scheduled immediately after release A and before Band B. Add a human-seeking Command system, normally hosted by Captain through hull data, that lists AI-controlled stations and selects an authored stance for each at station rather than fine-system scale. Stations author standard stances plus normal-alert and high-alert neutral fallbacks; objectives may contribute temporary stances. Stances feed the existing AI policy hosts rather than applying buffs. Existing Red Alert behavior that expresses station posture migrates onto the neutral stances. Also add an explicit Spectator role with one crew-public summary screen, readiness exclusion and manual claiming of eligible open stations, plus an AFK setting that delegates all systems on a retained player station and relocates human-seeking systems until the player returns."
      rationale:
        - "Command must land before the more elaborate B-E missions because a small crew needs to direct aggregate AI station behavior without operating every fine system. It is data-authored and human-seeking, not hard-coded to Captain."
        - "Every stance declares whether it persists behind human control or resets to the alert-appropriate neutral stance. An objective stance disappears and falls back immediately when its objective becomes invalid. Alert changes switch neutral-to-neutral only and never overwrite an explicit stance."
        - "When no human controls Command, its AI operator selects from the same stance catalogue using current knowledge and authored policy. Human-held stations see intent but are not constrained by it."
        - "AFK changes control source without relinquishing ownership. An AFK player is temporarily ineligible for human-seeking placement; returning restores the prior local control configuration and recomputes visiting-system placement."
        - "The spectator MVP is deliberately one summary surface. Selectable authorised system monitors remain accepted but unscheduled."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [ship-station-system-topology-state, system-control-source-state, session-station-ownership-state, fine-system-ai-policy-state]
      coordinates: [fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-scenario-scripting
    core:
      status: accepted
      confidence: confirmed
      title: Rhai Scenario Scripting
      summary: "Release A, ahead of Falling Skyway. Embed the fleet's deterministic Rhai sandbox (vellum-script) so scenario logic is authored as script while TOML keeps the declarative spine: registered host functions push onto a per-call effect buffer that drains into the existing ActionCmd boundary, FlagStore stays the only mutable state behind a sugared `flags` type, script registrations build the same Trigger structs the TOML front-end builds, and comms dialogue trees become named functions instead of nested tables. Surviving worlds convert; test-infrastructure worlds convert last as a control group, after which the declarative trigger evaluator is deleted. DELIVERY (2026-08): milestones M0-M5 shipped as a DORMANT host seam under `src/world/script/` (recorded as delivered architecture in architecture/scenario-scripting.yaml) — the engines, effect/flag boundary, trigger and comms front-ends, scheduling, loader, cross-reference validation, and editor authoring registry all exist and are validated. M6 (content conversion and activation wiring, #984) landed within release A rather than slipping to band B: every world — the 13 test-infrastructure worlds, `default`, and `combat_test` — is `[script]`-authored, with the effects API, the `flt()` fractional-data marker and live comms dispatch. M7 (#985) then deleted the declarative front-end: the `[[trigger]]` and `[[comms]]` parsers, `Trigger`'s action payload and the pipeline arm that dispatched it, the comms template/follow-up runtime, the layer trigger-merge, and the parallel `handle_respond_to_message` arm. There is one scenario front-end and one applier; a world that still authors a declarative block is refused at load by name."
      rationale:
        - "Authoring has outgrown the format: a 35-field stringly-typed RawActionEntry, three hand-maintained dispatch surfaces (world/dispatch.rs, the parallel match in console/comms/server.rs, and editor/action-schema.js), triplicated triggers because there is no elif, and comms nesting that reaches eight-segment table paths and localization keys."
        - "It runs early in release A because Falling Skyway is the first real content authored post-demo: landing scripting after it would author mission 1 in a departing format and pay the conversion twice, setting the crisis-world toolkit's authoring patterns on the wrong base."
        - "It also precedes mod content packs (#856), which would carry executable script — vellum-script's deny-by-default profile (no eval, no imports, no module resolver, no wall clock, bounded operations) becomes the pack trust boundary, and defining the pack format once with it included beats widening it afterwards."
        - "The split follows vellum's charter: the sandbox and call seam come from vellum-script unchanged, and the vocabulary — host functions, effect buffer, loader, span mapping, cross-reference validation — stays in phoenix. The one contribution back is a wasm32 build job in vellum's CI, which proves the sandbox on phoenix's target without widening its API."
        - "Determinism constraints are inherited, not negotiated: integer-only arithmetic (no_float), operation limits rather than timeouts, fixed per-call and per-tick budgets so every peer fails on the same tick, and deferred work represented as serializable (tick, fn_name) pairs rather than live closures."
        - "The editor becomes a script editor and action-schema.js is deleted (done at M7); sequencing against template-aware editing (#910) is deliberate, since both touch the editor shell in the same band. If release A gets tight, the content conversion and evaluator teardown slip to band B — the host seam, trigger front-end, scheduling, and comms work do not, because Falling Skyway depends on them."
        - "DELIVERED as planned, and then some: the split held and the fallback was not needed. M0-M5 shipped as a dormant seam; M6 (#984) activated it and converted every world; M7 (#985) deleted the declarative front-end it replaced. The parallel-dispatch mandate in architecture/trigger-pipeline.yaml is retired with it — there is one applier now, reached from one call site per consumer, so per-variant equivalence is structural rather than a contract a test can protect. Each step was gated on the six-world headless digest sweep, byte-identical throughout."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, world-content-pack-state]
      coordinates: [roadmap-falling-skyway-foundation, roadmap-mod-content-packs]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-falling-skyway-foundation
    core:
      status: accepted
      confidence: confirmed
      title: Falling Skyway Scenario Foundation
      summary: "Release A. Add the smallest reusable crisis-world toolkit needed by Falling Skyway: schedules, civilian routes/orders, external operations, infrastructure condition, basic commitments, and player-known Comms dossiers (#851)."
      rationale:
        - The scenario must use reusable world capabilities and existing ship systems, not bespoke station minigames.
        - Falling Skyway deliberately introduces only the campaign's early simulation layers; later evidence, network, authority, and cascade systems arrive with missions 2-5.
        - "This runs after the demo, not before it: #863 and #864 land first so the toolkit's persistent state is authored against adapters that already exist."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, spawned-entity-state, world-snapshot-artifact]
      runs_in: [host-browser-runtime]

  - component: roadmap-falling-skyway-content
    core:
      status: accepted
      confidence: confirmed
      title: Falling Skyway — First Thin Margin Scenario
      summary: "Release A. Author the first 30–60 minute Thin Margin mission: damaged skyhook and fuel depots, worker strike, corporate security, radiation storm, civilian traffic, constrained transfer window, altered-record evidence, and a consequential safe-passage decision (#852)."
      rationale:
        - This is release A's narrative scenario, the first content the public build gains after the Combat Test demo. It is not #398, Before the Fire.
        - Its outcomes are self-contained while remaining compatible with the campaign continuity projected in release C.
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-content-pack-state, world-configuration-state]
      coordinates: [roadmap-falling-skyway-foundation, world-content-pack-catalog]
      runs_in: [host-browser-runtime]

  - component: roadmap-demo-release
    core:
      status: accepted
      confidence: confirmed
      title: Limited Browser Demo Release
      summary: "Publish Combat Test only, with the Alliance Destroyer as the only playable hull, through a manual Cloudflare Pages deploy of the curated catalogue (#931), with production-build and smoke gates, performance evidence, and documented multi-device/multi-role playtests (#853)."
      rationale:
        - The demo validates the core bridge experience before Cloudflare caching, native distribution, P2P, and campaign breadth broaden the support surface.
        - "Scope narrowed on 2026-07-31 and recorded on #853: Falling Skyway and the other three hulls move to the post-demo release bands so the first public build ships on one proven scenario."
    architecture:
      kind: roadmap-milestone
      authority: non-authoritative
      reads: [world-content-pack-state]
      runs_in: [host-browser-runtime]

  - component: roadmap-authoritative-snapshots
    core:
      status: accepted
      confidence: confirmed
      title: Full Authoritative Snapshots and Persistence
      summary: "After the tracer, complete the #848 snapshot adapters, split across the first three release bands: dynamic combat consequences (#863) and scripted progression (#864) in A because Falling Skyway's persistent state depends on them, save-slot UX (#865) and portable import/export (#866) in B because P2P join and recovery ride on the portable record, and campaign-continuity projection (#867) in C once three missions make cross-mission facts real."
      rationale:
        - One portable snapshot must serve persistence, campaign continuity, native hosting, and P2P transfer rather than each surface serialising its own world.
        - "The adapters are split by their consumer rather than shipped as one block: each half-PRD lands in the band whose feature would otherwise be built on a missing adapter."
        - "Phoenix is the fleet's world-snapshot consumer for vellum-save: slot storage is that crate's Store under its browser backend, portable export (#866) is the same record through its file backend, and compatibility reporting renders its version gate. Only the campaign-continuity projection (#867) is phoenix-owned, because cross-mission facts are game vocabulary."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      owns: [world-snapshot-artifact]
      reads: [world-configuration-state, spawned-entity-state, asteroid-window-state]
      produces: [world-snapshot-artifact]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-deterministic-simulation-foundation
    core:
      status: accepted
      confidence: confirmed
      title: Deterministic Simulation and Lockstep Foundation
      summary: "Build #849's fixed logical tick, future-tick command log, canonical state hash, replay harness, deterministic schedule checks, and multi-instance verification before combat balance and demo content depend on the simulation contract."
      rationale:
        - "#835's seeded RNG and headless telemetry are already delivered; this phase hardens the remaining cross-instance guarantees before transport is introduced."
        - "The command log, the replay driver, the determinism contract tests, and the hash primitives come from the fleet's vellum-replay and vellum-digest crates, with the tick carried inside the logged command rather than scheduled by the driver. The logical tick itself, command ordering, schedule checks, and multi-instance verification stay phoenix's, because vellum excludes schedulers by charter."
        - "#849 also migrates sim-rng-state onto the fleet's unified Pcg32. Phoenix is re-blessable tier, so its determinism fixtures and recorded balance runs are deliberately re-blessed in the adopting PR; the payoff is that the shared RNG type serialises and can therefore enter the snapshot."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [sim-rng-state, spawned-entity-state, world-configuration-state, world-snapshot-artifact]
      produces: [world-snapshot-artifact]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-native-and-cloud-delivery
    core:
      status: accepted
      confidence: confirmed
      title: Native Host and Cloud Delivery Expansion
      summary: "Release A. Extend the delivered native scenario host (#420) into #855's compatible native host/client serving and Cloudflare-cached curated deployment, superseding the demo's manual Pages deploy (#931). Worker-thread adoption remains a benchmarked option, not an assumed requirement. The code half is delivered (see native-delivery.yaml); what remains is credentialed and manual, tracked in docs/delivery-checklist.md."
      rationale:
        - Public demo feedback and #868 measurements should determine caching and worker-thread investment.
        - Release A is where the deploy path stops being manual, because it is the first band that adds a scenario to the public catalogue.
        - "[ai] Shipped in code: the phoenix-host binary (delivery only — it serves the bundle, manifest, catalogue and version stamp; the authoritative simulation and PeerJS signalling stay where they were), the shared catalogue payload that makes native and browser hosts publish the same document by construction, the two-moment version pin, the Cloudflare caching rules with an offline rule-check and a dispatch-only deployed check, and the removal of the mod-pack upload from a demo build."
        - "[ai] NOT shipped, and deliberately: worker threads and cross-origin isolation, which PRD #855 puts behind a benchmark spike, and every step needing an account — Pages custom domain, both TURN workers' ALLOWED_ORIGIN redeploys and the demo worker's 401, and the native-host release packaging and signing decisions. Those are docs/delivery-checklist.md's, not this milestone's remaining code."
        - "[ai] The status stays `accepted` rather than `implemented` because the milestone's own acceptance is a deployed, verified public build, and no deploy has been run against this work. The components it delivered are `implemented` in native-delivery.yaml; the milestone closes when the checklist does."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-snapshot-artifact, world-content-pack-state]
      coordinates: [native-delivery-host, delivery-catalogue-payload, delivery-version-pin, delivery-http-contract, curated-public-catalogue-gate]
      runs_in: [host-browser-runtime, headless-runtime, native-host-runtime]

  - component: roadmap-p2p-multiship-delivery
    core:
      status: accepted
      confidence: confirmed
      title: P2P Multi-Ship Multiplayer Delivery
      summary: "Release B. Complete #854's PeerJS host mesh, delayed lockstep exchange, leader handling, snapshot join/recovery, hash diagnostics, and distributed NPC ownership on top of the completed snapshot and determinism foundations."
      rationale:
        - P2P is a new product surface, not a prerequisite for the browser demo.
        - "It runs after #865/#866 within the band: join and recovery are the portable snapshot record with a transport around it, so the record ships first."
        - It also gates the GM console, which is a host-class peer on this mesh and cannot start until the mesh exists.
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]

  - component: roadmap-composable-entity-templates
    core:
      status: implemented
      confidence: confirmed
      title: Composable Entity TOML Templates
      summary: "#869 delivers ordered, deterministic pre-runtime entity-template includes so reusable hull and generic fine-system behaviour fragments resolve into one validated configuration before spawning."
      rationale:
        - This is the completed authoring and modding foundation for #870's shared doctrine fragments; do not rebuild it while balancing Combat Test.
        - "Deliberately not adopted onto the fleet's vellum-compose crate: phoenix merges deep over TOML values with by-name and by-id array reconciliation, and that crate is shallow over RON values and refuses deep merge by charter. Phoenix remains the fleet's design source for the composition scheme. The include resolver's source provenance is the piece vellum lacks entirely, so it is built to be extractable later."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [entity-template-state]
      runs_in: [host-browser-runtime, headless-runtime]


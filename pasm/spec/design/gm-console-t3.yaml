entities:
  - component: gm-t3-attention-queue
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: GM Attention Queue and Personal Triage
      summary: "One peer-local advisory projection answers 'what is waiting for a Game Master'. Occurrences carry a stable identity derived from the waiting thing itself, a category, one of exactly three bands (Urgent/Attention/Background), the simulation tick they were first observed at, a real-time age basis, a short String Table reason with parameters, and a target naming surfaces that already exist on the desk. It publishes on the page-local gm_attention Host Channel only: never a peer frame, never a snapshot field, never a digest fold. The first producer is pending Comms — a live inbox message that is unanswered, unwithdrawn and actually offering the crew a response — defaulting to Attention, with a per-route authored override. Filters, one-click sixty-real-second snoozes, reading holds and Return to live are private browser presentation and never cross back into the simulation."
      rationale:
        - "[ai] Issue #1433 (PRD #1419 M4, presentation contract PRD #1418). Occurrence identity is the CommsMessage id the world already minted, which buys both lifecycle rules without a second registry: the row keeps one identity while the condition holds, and a recurrence is a different message and therefore an occurrence no stale snooze can hide. Resolution needs no explicit retirement path either — answered, orphaned, cleared and 'no responses offered' are all just the predicate ceasing to hold."
        - "[ai] The band vocabulary is closed and authored as a string on [[gm_comms_route]].attention_band, validated in the existing route loader so an invented band fails the world load naming the section and id rather than silently defaulting. A serde enum was rejected for exactly that: it would name a TOML path instead of the authored section. The band is GM triage only and never touches CommsPriority, delivery, routing, recipients or anything a crew console renders."
        - "[ai] Two clocks, deliberately. Ordering uses first_seen_tick with a stable-id tie-break so every peer and every repaint agrees; age uses Time<Real> because a facilitator who pauses the world has not stopped waiting, and the same real basis is what makes the snooze exactly sixty seconds including while paused. The page takes each occurrence's first-seen wall clock ONCE from the first payload carrying its id, so later samples cannot make a row's age jitter."
        - "[ai] The projection republishes only when membership, order, band, reason or target changes — never on age alone, which advances every frame and would make a held list meaningless."
        - "[ai] Reading stability is a two-mode panel: live, or held because focus is inside the list or a row has been opened for reading. A held list keeps its rows in place, still tells the truth about a row's own band and age, counts what it is holding, says it is held, and applies the backlog only on Return to live. Return to live ends the READING SESSION, not merely this one hold: the opened row stops being the selected one, because a selection that outlives the catch-up would make every later projection re-enter held mode with nobody reading — a queue that silently stops updating after the first Open. Holding is presentation: it never pauses the simulation and never delays a projection."
        - "[ai] A held row whose occurrence resolves under the operator keeps its place but stops pretending: its age freezes at the wait it ended on (re-deriving it would restart the clock at 0:00 and read as a brand new arrival), it carries a sentence saying it is no longer waiting so the state survives forced colours, and both of its verbs are disabled — a control that quietly does nothing is worse than one that is visibly spent. Focus sitting on such a control moves to that sentence, so the change is announced and the list keeps the focus that holds it."
        - "[ai] Filters and snoozes live in one reusable controller (gui/gm-attention-filters.js) so #1442's authored filtered-attention and workload widgets reuse this exact private state instead of growing a divergent copy. They persist under a scope key of session id plus operator id, so a reconnect to the same session restores remaining real-time expiry and a new session simply has no stored scope — the reset needs no explicit clear. Two operators sharing one browser profile never inherit each other's snoozes, and nothing here reaches GmOperator, a GmAction, a snapshot or the digest. The controller reports its own changes back through an onChange hook and the desk repaints the queue from state it already holds: a restored session (or, later, a sibling widget's snooze) must not leave the operator reading yesterday's filters until the world happens to publish again. That repaint is for changes made ELSEWHERE: a change the queue makes to its own controller renders once, deliberately, from the handler that made it, because a repaint arriving mid-click would rebuild the list out from under a handler still reading the screen it is acting on — which is precisely how a keyboard operator would lose focus to the document on every snooze."
        - "[ai] Escalation to Urgent breaks a snooze; a row that was already Urgent when snoozed waits out its minute. Both rules are decided from the band recorded AT snooze time, which is why the snooze record stores it."
        - "[ai] Technical banners (issue #1437) are not occurrences and do not pass through the filter, snooze or hold path at all: #gm-attention-banners is rendered verbatim from its own entry point so a GM cannot hide a connection or recovery failure from themselves. #gm-attention-panel is deliberately absent from GM_ROLE_PRESET_PANEL_IDS for the same reason — a role preset must not be able to hide the banner region."
        - "[ai] A row explains itself with one of two sentences, chosen by whether the waiting conversation names a recipient ship. Only a GM's own TransmitComms addresses a dialogue at named hulls; world-authored open_comms and crew hails carry no recipient ship, so those rows use the fleet-wide reason id with the speaker as their only parameter. One sentence with an optional parameter was rejected: it renders the ordinary scripted case as 'X is waiting on .' on the desk."
        - "[ai] Opening a row is navigation, not a new action surface: it selects the occurrence's ship on the existing map projection and brings the authored Comms route that already speaks as that sender to hand. No GmAction, no dialog, no automatic panel switch."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-milestone-facilitation-assistance, gm-t2-map-feed-and-inspector-shell, gm-t2-role-presets]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_attention.rs, src/gm_comms.rs, src/console_bridge.rs, src/core/codec.rs, src/server/bridge.rs, src/native_host/native_gm/mod.rs, gui/gm-attention-panel.js, gui/gm-attention-filters.js, gui/gm-workspace.js, gui/gm-workspace-shell.js, gui/gm-workspace.css, gui/host-channel.js, gui/gm-comms-panel.js, server.html, assets/worlds/probe_gm_attention.toml, assets/worlds/probe_gm_attention_fleet.toml]
      symbols: [GmAttentionBand, GmAttentionCategory, GmAttentionOccurrence, GmAttentionProjection, GmAttentionState, GmAttentionPlugin, publish_attention_projection, GmAttentionChanged, encode_gm_attention_projection, attention_band, createGmAttentionPanel, createGmAttentionFilters, GM_ATTENTION_SNOOZE_MS, focusRoute]
      tests: ["cargo test --features headless --test gm_attention", "cargo test --features headless --lib -- gm_attention::", "npx vitest run tests/client/gm-attention-panel.test.js", "npx vitest run tests/client/gm-workspace-shell.test.js", "tests/smoke/gm-layout.spec.js"]

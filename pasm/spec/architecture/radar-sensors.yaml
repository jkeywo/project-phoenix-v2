entities:
  - component: radar-projection-service
    core:
      status: implemented
      confidence: confirmed
      title: Shared Radar Projection Service
      summary: Builds range-, visibility-, and presentation-filtered radar contact projections for Helm, Tactical, Sensors, navigation, and the viewscreen.
    architecture:
      kind: projection-service
      authority: authoritative
      owns: [radar-contact-projection-state]
      reads: [authoritative-ship-motion-state, ship-modifier-state]
      produces: [radar-contact-projection-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/radar.rs, src/radar_config.rs, src/gui/radar.rs, src/server/radar.rs, gui/components/ph-radar.js, gui/components/ph-scope-chrome.js]
      tests: [cargo test, npx vitest run]

  - state: radar-contact-projection-state
    core:
      status: implemented
      confidence: confirmed
      title: Radar Contact Projection State
      summary: Derived contact positions, appearance, range and selection eligibility for each consuming radar surface; it is not a second authoritative entity store.
    architecture:
      classification: replicated
      owner: radar-projection-service
      derived_from: [authoritative-ship-motion-state, ship-modifier-state]
    implementation:
      status: declared
      paths: [src/radar.rs, src/radar_config.rs, src/core/messages.rs, gui/console-state.js]

  - component: sensors-target-controller
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Controller
      summary: Applies admitted SetScienceTarget/ClearScienceTarget commands for human and AI origins alike, storing each ship's selected Sensors contact and emitting a channel-3 target designation for Tactical on every set (never on a clear).
      rationale:
        - "Issue #828: the single applier for both origins — the Sensors AI (operate_sensors_ai) emits admitted payloads through validate_and_admit, so no direct AI write into sensors-target-state exists. The handler (handle_sensors_messages) runs in SimSet::Physics (moved from Input) ordered after the AI emit: admission clears AdmittedCommands before Input each tick, so the applier must consume same-tick after the emit or AI commands would be silently lost."
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [sensors-target-state]
      reads: [system-control-source-state, radar-contact-projection-state]
      writes: [sensors-target-state]
      sends: [sensors-target-designation]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, gui/components/ph-sensor-radar.js]
      tests: [cargo test, npx vitest run]

  - state: sensors-target-state
    core:
      status: implemented
      confidence: confirmed
      title: Sensor Radar Selection State
      summary: Per-ship Science Target UUID owned by the sensor radar, written only through Admission (issue #828) and read only by the sensor-radar publisher (issue #829) — no other module imports the component. The sensor-radar blackboard replicates it as selected_target, and the viewscreen aggregator lifts it to science_target.
      rationale:
        - "Issue #829 renamed SensorsTarget to SensorRadarSelection and made it radar-owned: cross-system consumers read the viewscreen Science Target fact, never this live selection (spec §3)."
    architecture:
      classification: authoritative
      owner: sensors-target-controller
      writers: [sensors-target-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]
      symbols: [SensorRadarSelection]

  - state: tactical-radar-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Radar Blackboard State
      summary: Per-ship tactical-radar blackboard carrying the Combat Lock (selected_target) plus the tactical radar blips and region overlays, which moved off the Weapons blackboard (issue #829).
      rationale:
        - "Issue #829: publish_tactical_radar_blackboard (SimSet::Publish) writes selected_target for every ship from that ship's TacticalRadarSelection component; blips/regions are computed for the LocalShip only. This system is the tactical radar authority and is the only reader of the live selection besides its writers (handle_set_target, ai_target_selection, kill-clears, revalidation, comms RemoveFactionEnemy) and debug_overlay."
        - "Spec-compliance follow-up: publish_weapons_core_blackboard, publish_phaser_bank_blackboards and compute_current_weapons_update were missed by #829 and still read the live TacticalRadarSelection. All three now read ViewscreenBlackboard.combat_lock, closing the last §3 breach. The two SimSet::Publish publishers therefore see last tick's lock (spec §1 one-tick lag); compute_current_weapons_update runs in SimSet::Broadcast, after the PublishAggregate aggregator, so it sees the current tick's."
        - "Issue #957: each blip carries RadarBlip.torpedo_armed, the host's answer to whether this contact is a HOSTILE whose hull has torpedo tubes. Read off the contact's own live TorpedoSystemResource joined with crate::faction::is_enemy against the observing ship — the same faction predicate the helm hostile-arc overlay (#874) uses — so the client never infers weapon capability from a hull name, icon or model. It is CAPABILITY, not readiness: true with every tube unloaded and the magazine empty, and it does not promise a launch, which the world-scoped conservation gate (#943) can still refuse. Not scan-gated: the only gates are the ones the blip already passed (the radar's shows tag filter and its effective-range cull), which is the posture RadarBlip.threat_level, RadarBlip.description and RadarBlip.target_tags already take — they are authored hostile intel on the same struct, through the same two gates, with no third. Nor is it red-alert gated, unlike its nearest wire sibling HelmBlackboard.hostile_weapon_arcs (#874): arcs are live per-contact firing geometry carried as an extra channel, so gating them costs nothing until the crew is already fighting, whereas torpedo_armed is one static bit on a contact the radar has already drawn and is exactly the fact a crew needs BEFORE red alert. The wire carries the boolean only; gui/console-state.js foldTorpedoBadges resolves the console.radar.torpedo_armed string id into the badge text and gui/components/ph-tactical-radar.js draws it, because the copy is the client's and never crosses the localiseTree ingress boundary."
    architecture:
      classification: derived
      owner: tactical-weapons-controls
      derived_from: [weapons-target-state, radar-contact-projection-state]
    implementation:
      status: declared
      paths: [src/console/weapons/blackboard.rs, src/core/messages.rs, gui/console-state.js, gui/components/ph-tactical-radar.js]
      symbols: [TacticalRadarBlackboard]
      tests: [cargo test, npx vitest run]

  - state: sensor-radar-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Sensor Radar Blackboard State
      summary: Per-ship sensor-radar blackboard carrying the Science Target (selected_target), mirrored from SensorRadarSelection and lifted by the viewscreen aggregator into science_target (issue #829). Also carries selected_target_alert, an optional replica of the selected target's authoritative Red Alert state, present only when that target is a Red-Alert-capable ship (issue #749).
    architecture:
      classification: derived
      owner: sensors-target-controller
      derived_from: [sensors-target-state]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, gui/console-state.js]
      symbols: [SensorRadarBlackboard]

  - message: sensors-target-designation
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Designation
      summary: Channel-3 coordination payload carrying the Sensors-selected contact UUID and label to Tactical; it advises and does not replace Tactical target authority.
    architecture:
      authority: request
      producer: [sensors-target-controller]
      consumer: [inter-system-message-router]
      payload: TargetDesignation
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs, src/ship_plugin.rs]

  - component: sensors-frequency-advisor
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Frequency Advisor
      summary: Immediate frequency advisory for hulls WITHOUT AiHighFidelity — demoted/low-LOD NPCs only, never the player ship. Observes the frozen viewscreen combat lock and sends Tactical a shield-frequency hint when the target or observed frequency changes, whoever holds Sensors.
      rationale:
        - "Issue #692 scoped this immediate readout to skip ships that carry AiHighFidelity AND had Sensors under AI control (operate_ai policy)."
        - "Issue #873 removed the operate_ai half of that condition. The skip is now a level-of-detail split and nothing else: a hull without AiHighFidelity is served here, a hull with it is served by sensors-frequency-advisor-ai-delayed, and every ship emits through exactly one of the two. The old conjunct made the hint's existence, timing and (across the delivery lag) content depend on who was holding the console, which is the human-vs-AI branch downstream of admission that AGENTS.md rule 6 forbids — and it is why a human on Sensors could not feed a backfilled Tactical. sender_origin is read from the live control source and used only as the delivery-time routing tag."
        - "[ai] WHO THIS SERVES, precisely, because the phrase \"whoever holds Sensors\" invites the wrong reading: the PLAYER ship never reaches this system. server_app::spawn_game_start_entities gives LocalShip ai_high_fidelity_components() at spawn and lod_ai_ships never evaluates LocalShip, so the player hull is permanently high-fidelity. This immediate variant therefore serves demoted / low-LOD NPC hulls only. A human Sensors officer on the player ship is served by sensors-frequency-advisor-ai-delayed and their advisory carries the authored frequency_hint_delay_secs reaction delay (3s by default) — human and AI alike."
        - "That reaction delay for a human sender is DELIBERATE, not a regression #873 overlooked. Two reasons. (1) Rule 6: an advisory that arrives instantly for a human sender and 3s later for an AI one is a human-vs-AI branch on a coordination fact derived from authoritative state; one model per hull fidelity, shared by both origins, is the only shape that is not. (2) The path it replaced delivered nothing anyway: the immediate emission was addressed to the Tactical STATION key, which has no registered [[system]] behind it and so resolved to the Human policy default on every hull, making a human-origin hint route Human→Human = Suppress. Before #873 a human Sensors officer's immediate advisory reached nobody at all. Trading an advisory that was silently dropped for one that lands 3s later is a strict gain."
        - "Issue #889 changed HOW the delayed variant measures its delay, because gating it alone would have broken it. It accumulates Time::delta, so putting it under the shared tick latch without further change would have STRETCHED the authored delay by the frame-to-tick ratio — twice at 60 Hz, nearly five times at 144 — making it more frame-dependent rather than less. It now advances on the authored tick PERIOD, so the authored delay means the same wall-clock span at any frame rate."
    architecture:
      kind: coordination-producer
      authority: authoritative
      reads: [weapons-target-state, shield-arc-state]
      sends: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]
      symbols: [tick_sensors_frequency_hint]
      tests: [cargo test]

  - component: sensors-frequency-advisor-ai-delayed
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Frequency Advisor (High-Fidelity Delayed Variant)
      summary: High-fidelity companion to sensors-frequency-advisor that replicates a Sensors operator's reaction delay before sending Tactical a shield-frequency hint, for every ship carrying AiHighFidelity regardless of who holds Sensors — which includes the permanently-high-fidelity PLAYER ship, so this is the variant a human Sensors officer's advisory goes through.
      rationale:
        - "Issue #692 wires the previously-orphaned console_ai::core::tick_frequency_hint pure function into this Bevy system; it previously had no caller anywhere in the codebase."
        - "Issue #873 renamed the system ai_frequency_hint to tick_frequency_hint_high_fidelity and reduced its gating to the AiHighFidelity query filter alone. It previously also required policy_for(sensors).operate_ai, and — when a session held the ship's Sensors station — that holder's active rating to declare the auto_hint ai_tuning rule. No shipped hull authors auto_hint, so a human sitting down at Sensors on a high-fidelity hull silenced the ship's frequency advisory outright. Both gates were the same human-vs-AI branch on a coordination fact derived from authoritative state; the AI_RULE_AUTO_HINT key and ShipConfig::sensors_station's production caller went with them. It stays registered under the shared AI tick cadence because its reaction-delay model advances by the authored tick period, not because it is an AI-operator decider."
    architecture:
      kind: coordination-producer
      authority: authoritative
      reads: [weapons-target-state, shield-arc-state]
      sends: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/console_ai/core.rs]
      symbols: [tick_frequency_hint_high_fidelity, tick_frequency_hint, ShipFrequencyHintState]
      tests: [cargo test]

  - component: sensors-radar-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Radar Publisher
      summary: Publishes every Ship entity's own Sensors blackboard (player and NPC alike) — its own damage-scaled radar range and selected target — with the player-only authored show/select filters gated on the local ship.
      rationale:
        - "Issue #828 (per-Ship publish, following the #824 helm / #826 shields precedent): split on Has<LocalShip>. The local ship's base range stays the console config; an NPC's base follows effective_sensor_range's preference order (its own AiProfile.sensor_range, console config only as fallback), each scaled by that ship's own SensorRadarRange modifier. radar_shows/radar_selects come from ShipClientConfigResource, which describes the local player's hull only, so NPCs get empty filters — they don't render a radar."
    architecture:
      kind: blackboard-publisher
      authority: authoritative
      reads: [sensors-target-state, ship-modifier-state]
      writes: [ship-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/core/messages.rs]

  - component: sensors-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Sensors AI Operator
      summary: Per-ship decide-and-emit Sensors AI that serves positive Sensors-affined Scan objectives and independently ranks the ordinary science target — combat lock, named Destroy objective, or nearest faction-hostile — emitting both kinds of decision through shared command admission rather than writing either authoritative state directly.
      rationale:
        - "Issue #828 (admission symmetry, following the #824 helm / #826 shields precedent): operate_sensors_ai keeps its selection logic but no longer writes sensors-target-state directly. It emits through the shared command_admission::validate_and_admit seam using its ship's own ai:<uuid> token, validated against that entity's own ControlSourceResolver (operate_ai must hold); sensors-target-controller applies it later the same tick. Emit-on-change means an AI selection now produces exactly one channel-3 target designation per change — previously the AI bypassed the applier and produced none."
        - "Issue #746 added the independent horizon-limited hostile-selection tier (priority 3, the fallback below the combat-lock mirror and Destroy-objective tiers). When neither higher tier yields a detectable target, operate_sensors_ai builds a WorldView over the ship's own faction/position snapshot and calls ai::core::find_nearest_hostile, gating the result on the same damage-scaled effective_sensor_range as the other tiers. The pick is advisory only — it flows through the same SetScienceTarget path a human uses and never mutates weapons-target-state, so Tactical keeps firing-target authority. A selected hostile that leaves the (possibly damage-shrunken) horizon or despawns yields no tier and is dropped via ClearScienceTarget."
        - "This entity absorbs the formerly separate sensors-target-selection-ai proposal: gating, horizon, selection, and emission are all one system (operate_sensors_ai)."
        - "Issue #776 generalized the three hardcoded priority tiers into the data-driven per-system-target-ranking-policy: operate_sensors_ai now feeds combat-lock / objective-destroy / radar-contacts as registered candidate sources into a per-ship SensorsTargetSelector and emits its pick as the same admitted SetScienceTarget/ClearScienceTarget. Sensors target AUTHORITY is unchanged — the selection stays advisory to Tactical (channel-3 TargetDesignation) and never writes weapons-target-state."
        - "Issue #885 (411ace37 authored the block, 8555e336 deleted the fallback) removed the 'or the canonical default' half of that sentence. [sensors_console.selector] is authored on every shipped hull, default_sensors_target_selector_config is deleted, and strict AI-declaration mode makes an omitted block a load error. #885 also deleted the three inert params that synthesiser declared — combat_lock_weight, objective_weight and radar_weight — because no guard read them: each tier's magnitude is its own score term's authored weight field, so the param was a second indirection that could only disagree with the weight beside it."
        - "Issue #889 moved this host off the hardcoded 10 Hz AiSnapshotTimer and onto run_if(ai_snapshot_ready) at registration. The RATE is unchanged — the slower cadence derived from [global] ai_tick_hz / ai_snapshot_hz — but the gate is no longer an Option<Res<_>> check inside the system body, which fell back to evaluating EVERY tick whenever the resource was absent. That is every bare-App fixture in the crate, so before #889 the shipped cadence was exercised by no unit test at all (AGENTS.md rule #7)."
        - "Issue #1186 deleted the single-owner emit_sensors_ai_command trampoline (sensors.rs); operate_sensors_ai now calls the shared command_admission::ai_emit::emit_ai_command seam directly, binding sensors_system_id() at the call site. Behaviour-preserving: the emitted command, admission edge and digest are byte-identical — one fewer thin wrapper over the shared seam, matching the #1211 helm/shields shim deletions."
        - "Issue #1139 extends the existing operate_sensors_ai host rather than adding a second Sensors decider. After the same AI-control and authored SensorsTargetSelector capability gates, it takes the first positive Sensors-affined Scan directive from the frozen scored pool, resolves its authored target through WorldContentRuntime.name_to_uuid with raw UUID/EntityName fallback, and emits the ordinary admitted ScanTarget payload. It deliberately performs no range check, scan-state write or attempted latch: science::server::tick_scans remains the sole capability/range applier, and a refusal is retried on the next deterministic snapshot. The scan operation and ordinary SetScienceTarget designation are independent outputs and may both be admitted in one tick."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, ship-system-blackboards-state, weapons-target-state, sensors-target-state, scored-objective-pool-state, world-name-binding-state]
      depends_on: [host-command-admission, science-scan-deriver]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/ai/core.rs, src/ai/selector.rs]
      symbols: [operate_sensors_ai, effective_sensor_range, find_nearest_hostile, SensorsTargetSelector]
      tests: [cargo test]

  - component: sensors-target-selection-ai
    core:
      status: implemented
      confidence: confirmed
      title: Sensors Target Selection AI
      summary: Per-ship AI selection policy that chooses an appropriate hostile within the Sensors system's own damage-scaled horizon and lets the existing advisory paths inform Tactical; realized by the same operate_sensors_ai system as sensors-ai-operator.
      rationale:
        - "Issue #828 folded this proposal into sensors-ai-operator: one system (operate_sensors_ai) carries the gating, the horizon, and the selection, and it emits admitted commands through host-command-admission rather than writing sensors-target-state directly — sensors-target-controller performs the write and sends the target designation when the admitted set applies. Kept as a named entity because design-slice links (sensors.yaml roles/decisions) reference it."
        - "Issue #746 realized the independent selection this policy names: the operate_sensors_ai priority-3 tier calls ai::core::find_nearest_hostile over the ship's own faction/position snapshot and gates the winner on effective_sensor_range, so the ship picks its own nearest in-horizon enemy rather than only echoing Tactical's lock or an objective name. The choice is designated to Tactical as advisory intelligence and never becomes a firing lock (weapons-target-state is untouched). Tests cover horizon damage scaling, hostility, target loss, and per-ship isolation."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, radar-contact-projection-state, ship-system-blackboards-state]
      depends_on: [host-command-admission]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, src/ai/core.rs]
      symbols: [operate_sensors_ai, find_nearest_hostile]
      tests: [cargo test]

  - decision: gm-t2-join-pause-and-projection-contract
    core:
      status: accepted
      confidence: confirmed
      title: GM Join, Pause, and Local Projection Contract
      summary: "A first-time mid-session GM join requires visible acceptance by an existing host or GM, then schedules one synchronized pause for snapshot/history transfer and roster admission. The session remains paused until an explicit attributed SetSessionPaused { active: false }; reconnecting the same GM may auto-accept but still surfaces the pause. Joining never silently pauses. GM maps, feeds, dossiers, knowledge views, and authentic Station interfaces read local deterministic projections over the Host Channel; only typed GM commands cross lockstep, and there is no privileged omniscient streaming API."
      rationale:
        - "SetSessionPaused is an idempotent state-setting command rather than a toggle, so simultaneous equal GMs converge under deterministic command ordering. It is separate from debug controls and the local host pause surface even when all three present the same authoritative pause state."
        - "A synchronized paused transfer makes drop-in visible and safe without granting a joining browser a special replication path."
        - "Issue #1292 makes SetSessionPaused the first complete typed GM action tracer, after shared semantic action and feedback issues #1274/#1276, so M1 does not grow temporary plumbing that M2 later replaces. First-time join #1293 depends on record transfer #1117; known-GM divergence-safe reconnect #1294 separately depends on #1118."
    architecture:
      kind: session-policy
      authority: authoritative
      coordinates: [gm-milestone-peer-tracer]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_action.rs, src/core/codec.rs, src/lockstep/frame.rs, src/lockstep/mod.rs, src/lockstep/recovery.rs, src/server/bridge.rs, src/server_app/registration.rs, src/console_bridge.rs, src/snapshot.rs, src/sim_digest.rs, src/headless/replay.rs, gui/host-mesh.js, gui/host-actions.js, gui/semantic-action-registry.js, gui/semantic-controls-remapper.js, gui/gamepad-input.js, gui/server-settings.js, gui/action-feedback.js, gui/gm-session-actions.js, gui/gm-session-controls.js, assets/strings/strings.csv, server.html]

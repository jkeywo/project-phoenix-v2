# Fixture world for issue #864's compatibility half — a SCRIPT-FREE scenario
# whose progression is captured and resumed.
#
# The sibling of `scripted_resume.toml`, and deliberately its opposite: the same
# one-ship, no-hostiles shape and the same single timer, authored as a
# `[[trigger]]` instead of a Rhai registration. Nothing plays it; it exists to be
# booted by `tests/snapshot_resume.rs`.
#
# ── Why a fixture rather than a shipped world ────────────────────────────────
#
# It used to be `assets/worlds/combat_test.toml`, on the reasonable ground that a
# shipped world is a better subject than an invented one. Issue #984 converted
# every shipped world to `[script]`, so there is no script-free shipped world
# left to point at — and there will not be one again. The claim under test
# ("a world that compiles no `WorldScriptRuntime` still captures its declarative
# trigger latches and its mission clock, and its payload is shaped exactly as it
# was before scripting existed") is about the DECLARATIVE front-end, which is
# still live for mod packs and hand-authored worlds. A fixture is what keeps that
# claim testable without the test's subject being hostage to a content decision.
#
# ── What the timing is for ───────────────────────────────────────────────────
#
# `after_secs = 1.0` fires ~1 s (~tick 60) into the mission, so a capture taken
# at ~tick 120 sits AFTER it: the trigger is latched, which is the state the
# resume has to preserve, and `scenario.triggers` is therefore non-empty in the
# payload. `increment_flag` is what makes a re-armed latch visible — the counter
# would read 2.

[global]
seed = 864
ai_helm_tick_hz = 30.0

[player_spawn]
position = [0.0, 0.0, 0.0]

# Player ship — spawned by spawn_game_start_entities when the game starts.
[[entity]]
template_path = "assets/entities/alliance_destroyer.toml"
id = "player-ship"
transform = { position = [0.0, 0.0, 0.0] }
spawn_on = "game_start"

[[trigger]]
condition = "on_timer"
after_secs = 1.0

  [[trigger.action]]
  type = "increment_flag"
  name = "beacon_pulses"
  by   = 1

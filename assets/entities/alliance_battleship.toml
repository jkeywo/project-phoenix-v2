power_group = "helm"

# Boost drive commands (issue #801). Split out of the deleted coarse `helm`
# system so ToggleBoost/SetBoost admission gates on its own declared system,
# like every other helm axis. Listed in no rating's `automated_systems` —
# Backfill automates it with the rest of the station.
[[system]]
id = "helm-boost"
kind = "helm_boost"
station = "helm"
power_group = "helm"

# Declared in #704. The deleted `operate_helm_ai` monolith drove this hull's
# lateral avoidance dodge on its behalf: an undeclared system resolves to
# ControlSource::Human (`operate_ai = false`), so the monolith never stood down
# from the lateral axis here. Declaring it hands the axis to
# `ai_helm_lateral_thrust` (which since #803 decides on the shared AI-helm sim
# tick — `[global] ai_helm_tick_hz`, default 30 Hz). Unlike the
# cruiser and destroyer, this hull has no `Simplified` Helm rating, so — matching
# the monolith, which only ran with the coarse helm on AI — lateral thrust is not

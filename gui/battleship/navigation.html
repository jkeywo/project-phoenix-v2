<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.navigation.doc_title">Project Phoenix - Navigation Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; align-self: flex-start; }
    .hero h1 { margin: 0; font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); }
    .hero h1 .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); color: var(--ink-faint); }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    .map-col { min-height: 0; display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; gap: 10px; }
    .map-wrap { flex: 1; min-height: 0; }
    #map-canvas { width: 100%; height: 100%; display: block; min-height: 280px; }
    .side-col { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
    .side-panel { min-height: 0; display: flex; flex-direction: column; gap: 10px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    .metric { display: flex; justify-content: space-between; gap: 12px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    .metric strong { color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-lg); }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { flex: 1; margin: 0; min-height: var(--control-hit-min); }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; overflow-y: auto; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Navigation Console" data-i18n-attr="data-screen-label:console.navigation.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.navigation.title">NAVIGATION</span><span class="sub" data-i18n="console.navigation.subtitle">COURSE &amp; WAYPOINTS</span></h1>
        <span class="auto-badge" id="navigation-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
      </div>
      <div class="console-body">
        <div class="map-col">
          <div class="btn-row">
            <button class="btn" id="btn-on-screen" type="button"><span class="btn-bg"></span><span class="label" data-i18n="console.navigation.on_screen">On Screen</span></button>
          </div>
          <div class="map-wrap" id="map-canvas">
            <ph-navigation-map id="navigation-map"></ph-navigation-map>
          </div>
        </div>
        <div class="side-col">
          <div class="side-panel">
            <div class="metric"><span data-i18n="console.navigation.selected">Selected</span><strong id="ent-name" data-i18n="console.navigation.none">NONE</strong></div>
            <div class="metric"><span data-i18n="console.navigation.waypoint">Waypoint</span><strong id="waypoint-name" data-i18n="console.navigation.not_set">NOT SET</strong></div>
            <div class="metric"><span data-i18n="console.navigation.contacts">Contacts</span><strong id="nav-contact-count">0</strong></div>
          </div>
          <div class="side-panel">
            <ph-civilian-traffic id="civilian-traffic"></ph-civilian-traffic>
          </div>
          <div class="side-panel" style="flex:1">
            <ph-objective-list id="objective-list"></ph-objective-list>
          </div>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span data-i18n="console.navigation.station_footer">NAVIGATION STATION</span>
        <span class="spacer"></span>
        <span id="footer-target" data-i18n="console.common.no_waypoint">NO WAYPOINT</span>
        <ph-station-damage id="station-damage"></ph-station-damage>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-navigation-map.js';
    import '../components/ph-civilian-traffic.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    // The render lives in gui/battleship/navigation.console.js (issue
    // #1235): the shared Navigation renderer + this hull's variant. s is a
    // NavigationConsolePayload — see the @typedef in gui/console-state.js.
    // The vitest suite imports the same renderStation.
    import { renderStation } from './navigation.console.js';

    var consoleApi = initConsole({ name: 'navigation', family: 'navigation', render: renderStation });

    var navMap = document.getElementById('navigation-map');
    // The map selects a chart contact on tap (navselect event); it does not set
    // the waypoint itself — that is the map's own Set Waypoint / Set as
    // Waypoint / Clear Waypoint bar, which round-trips through the same action
    // map (set_navigation_waypoint / clear_navigation_waypoint).
    navMap.addEventListener('navselect', function(e) {
      var b = e.detail || null;
      document.getElementById('ent-name').textContent = b && b.name ? b.name : t('console.navigation.none');
    });

    document.getElementById('btn-on-screen').addEventListener('click', function() {
      consoleApi.sendAction('set_navigation_chart', {});
    });
  </script>
</body>
</html>

  - component: host-helm-control-router
    core:
      status: implemented
      confidence: confirmed
      title: Host Helm Control Router
      summary: Authoritative per-entity applier that turns every ship's own admitted thrust, steering, lateral-thrust, impulse, and boost commands into that ship's intent components; a separate shared integrator applies that intent to ship physics and drive state.
      rationale:
        - "Issue #824 (admission symmetry, pasm/spec/RADAR_TARGET_AUTHORITY_AND_ADMISSION.md section 2): process_helm_inputs is per-entity — it loops every ship carrying AdmittedCommands and the intent bundle and applies admitted helm payloads to that ship's intents. An admitted command applies regardless of source: the per-axis operate_ai gates the router used to carry are deleted, because authority is checked once at admission (human tokens at the network gate, the per-axis helm AI's emissions through the shared validate_and_admit seam). Nothing downstream of admission branches on human-vs-AI."
        - "Issue #801 split the helm wire per axis: SetThrust targets the helm-thrust system and SetSteering targets helm-steering, replacing the combined HelmInput payload that targeted a coarse helm system. Admission is therefore per-axis, which fixes the #701 mismatch where a coarse-admitted human HelmInput fought a per-axis AI thrust write. The coarse helm and tactical systems were deleted; every wire target now names a declared system."
        - "Impulse and boost are separate host-owned drive states with their own declared systems since #801: impulse commands target helm-impulse and boost commands target the new helm-boost system. Since #824 the admitted StartImpulseCharge/CancelImpulse loop lives in process_helm_inputs for every ship (with the same BlocksImpulse region gate the human path always had); handle_impulse_messages retains only the LocalShip hull-damage auto-cancel, ordered earlier in the tick so an admitted command can still override it."
        - "Issue #881 completed the same retirement for boost: handle_boost_messages was deleted and its admitted SetBoost/ToggleBoost loop folded into process_helm_inputs, so boost now applies for EVERY AI ship through this shared input arbiter rather than only the LocalShip. The old applier was filtered With<LocalShip> and read a single entity, so the admitted SetBoost that the helm-boost AI operator (#780) emits for a non-local AiHighFidelity NPC was admitted and then silently dropped. BoostCommand now has exactly one writer, the enabled BoostConfigResource guard is unchanged (a hull authoring no boost ignores the payload), and ToggleBoost's read-modify-write against the ship's own ShipBoost is identical for human and AI origins — nothing downstream of admission branches on origin (AGENTS.md #6). Same-tick ordering is preserved: ai_helm_boost is .before(process_helm_inputs) like its four siblings, and apply_helm_commands is .after(process_helm_inputs) and .before(tick_boost)."
        - "Issue #695 split admission from physics integration: the router only writes ThrustInput/SteeringInput/LateralThrustInput/ImpulseCommand/BoostCommand intent components instead of mutating ShipPhysics/ShipImpulse/ShipBoost directly. The shared integrate_ship_physics and apply_helm_commands systems in src/ship_plugin.rs perform the actual integration for any AiHighFidelity ship (the LocalShip and promoted NPCs alike), so the same intent surface serves both the human and helm-ai-operator paths."
        - "The 30 Hz HelmInputTimer sampling gate was deleted by #824: AdmittedCommands is cleared every tick at admission, so a sampling gate would silently drop AI commands emitted on frames the timer skipped. Commands apply the tick they are admitted."
    architecture:
      kind: subsystem
      authority: authoritative
      owns:
        - last-helm-input-state
        - authoritative-ship-motion-state
        - impulse-drive-state
        - boost-drive-state
      reads:
        - last-helm-input-state
        - impulse-drive-state
        - boost-drive-state
      writes:
        - last-helm-input-state
        - authoritative-ship-motion-state
        - impulse-drive-state
        - boost-drive-state
      consumes:
        - helm-input-command
        - lateral-thrust-command
        - start-impulse-charge-command
        - cancel-impulse-command
        - toggle-boost-command
        - set-boost-command
      depends_on:
        - host-command-admission
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/console/helm/dispatch.rs
        - src/ship_plugin.rs
        - src/ship/helm_admission.rs
        - src/ship/impulse_boost_systems.rs
        - src/ship/physics_systems.rs
        - src/ship/physics.rs
        - src/ship/helm.rs
      symbols:
        - register_helm_dispatch
        - process_helm_inputs
        - handle_impulse_messages
        - integrate_ship_physics
        - apply_helm_commands
        - compute_physics
        - ThrustInput
        - SteeringInput
        - LateralThrustInput
        - ImpulseCommand
        - BoostCommand
      messages:
        - SetThrust
        - SetSteering
        - LateralThrustInput
        - StartImpulseCharge
        - CancelImpulse
        - ToggleBoost
        - SetBoost
      tests:
        - cargo test

  - state: last-helm-input-state
    core:

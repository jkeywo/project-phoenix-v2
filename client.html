    // Engage button, view selector, Red Alert button, and helm joystick all
    // live in the per-console iframe pages (gui/*-console.html); the old
    // Bevy WASM client console UIs (#47–#49) were retired with the pure-JS
    // client migration.

    // Orientation watching (resize + orientationchange → recompute the
    // singleton and rerender so the tab bar flips) lives in
    // gui/device-orientation.js, which owns window.currentOrientation().

    // ── Swipe to switch console tabs (when 2+ consoles assigned) ───────
    (function initSwipe() {
      const root = document.body;
      let startX = 0, startY = 0, startT = 0, swiping = false, swipeCommitted = false;

      root.addEventListener('touchstart', e => {
        // Block swipe from buttons (tab bar, lobby buttons, etc.) so a
        // tap-to-press isn't misinterpreted as the start of a gesture.
        if (e.target.closest('button, [role="button"]')) return;
        // Block swipe from the bottom portion of the screen where the
        // virtual thumbstick joystick lives (~200px pad at the bottom).
        const touchY = e.touches[0].clientY;
        const viewportH = window.innerHeight;
        if (touchY > viewportH * 0.65) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startT = performance.now();
        swiping = true;
        swipeCommitted = false;
      }, { passive: true });

      // Non-passive so we can preventDefault() once the gesture is clearly
      // horizontal, preventing the browser from treating it as a scroll.
      root.addEventListener('touchmove', e => {
        if (!swiping) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
          swipeCommitted = true;
          e.preventDefault();
        }
      }, { passive: false });

      root.addEventListener('touchend', e => {
        if (!swiping) return;
        swiping = false;
        if (!swipeCommitted) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = performance.now() - startT;
        if (dt > 600) return;
        if (Math.abs(dx) < 60) return;
        if (Math.abs(dy) > Math.abs(dx) * 0.6) return;
        const mine = myConsoles(state);
        if (mine.length < 2 || state.phase !== 'InProgress') return;
        const idx = Math.max(0, mine.indexOf(activeConsole));
        const next = (dx < 0)
          ? (idx - 1 + mine.length) % mine.length
          : (idx + 1) % mine.length;
        // setActiveConsole() is the single source of truth — also called by
        // the tab-bar onPress handler (issue #441) and the render() reconciler.
        setActiveConsole(mine[next]);
        scheduleRender();
      }, { passive: true });
    })();

    // ── Swipe relay for console iframes ──────────────────────────
    // Console UIs run in iframes; touch events inside them don't reach the
    // body-level listeners above. After each iframe loads we inject a tiny
    // detector that posts SwipeConsole messages back to this window.
    const SWIPE_RELAY_CODE = `(function(){
      if(window.__swipeRelayInstalled)return;
      window.__swipeRelayInstalled=true;
      var sx,sy,st,sw=false,sc=false;
      document.addEventListener('touchstart',function(e){
        if(e.target.closest('button,[role="button"],input,select,textarea'))return;
        var t=e.touches[0];
        if(t.clientY>window.innerHeight*0.65)return;
        sx=t.clientX;sy=t.clientY;st=performance.now();sw=true;sc=false;
      },{passive:true});
      document.addEventListener('touchmove',function(e){
        if(!sw)return;
        var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
        if(Math.abs(dx)>20&&Math.abs(dx)>Math.abs(dy)){sc=true;e.preventDefault();}
      },{passive:false});
      document.addEventListener('touchend',function(e){
        if(!sw)return;sw=false;if(!sc)return;
        var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
        if(performance.now()-st>600||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6)return;
        window.parent.postMessage({type:'SwipeConsole',direction:dx<0?'left':'right'},'*');
      },{passive:true});
    })();`;

    function injectSwipeRelay(iframeEl) {
      try {
        const doc = iframeEl && iframeEl.contentDocument;
        if (!doc || iframeEl.contentWindow.__swipeRelayInstalled) return;
        const s = doc.createElement('script');
        s.textContent = SWIPE_RELAY_CODE;
        (doc.head || doc.body || doc.documentElement).appendChild(s);
      } catch (_) {}
    }

    // Handle SwipeConsole messages posted by the injected relay.
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'SwipeConsole') return;
      const mine = myConsoles(state);
      if (mine.length < 2 || state.phase !== 'InProgress') return;
      const idx = Math.max(0, mine.indexOf(activeConsole));
      const next = (e.data.direction === 'left')
        ? (idx - 1 + mine.length) % mine.length
        : (idx + 1) % mine.length;
      setActiveConsole(mine[next]);
      scheduleRender();
    });

    // ── Incoming message handler ────────────────────────────────

    function handleMessage(msg) {
      // JS state modules (issue #460) — every inbound ServerMessage is applied
      // to the pure state modules first; they are the source of truth that the
      // inline `state` object mirrors below. Guards cover the brief window
      // before the module scripts have executed.
      if (window.lobbyState)      window.lobbyState.apply(msg);
      if (window.simState)        window.simState.apply(msg);
      if (window.commsState)      window.commsState.apply(msg);
      if (window.complexityStore) window.complexityStore.apply(msg);
      // Mirror objectives from simState (handles ObjectiveSummary / CommsState internally).
      if (window.simState) state.objectives = window.simState.objectives || [];
      switch (msg.type) {
        case 'Welcome':
          if (window.lobbyState) {
            state.phase      = window.lobbyState.phase;
            state.players    = window.lobbyState.players;
            state.complexity = window.lobbyState.complexity;
          } else {
            state.phase   = msg.data.state.phase;
            state.players = msg.data.state.players.map(p => ({
              ...p,
              consoles: consolesOf(p),
            }));
            state.complexity = msg.data.state.complexity || {};
          }
          if (window.simState) {
            // Share the module's entity array so in-place SimState position
            // updates and Entity/AsteroidSpawned appends flow through, and
            // pick up the Welcome repair-team pre-seed.
            state.asteroids   = window.simState.world.entities;
            state.repairTeams = window.simState.repairTeams;
            state.consoleHull = window.simState.consoleHull;
            // Radar ranges + arc configs from server ship_config (data-driven).
            state.weaponsRadarRange = window.simState.weaponsRadarRange;
            state.helmRadarRange    = window.simState.helmRadarRange;
            state.sensorsRadarRange = window.simState.sensorsRadarRange;
            state.tacticalRadarShows   = window.simState.tacticalRadarShows;
            state.tacticalRadarSelects = window.simState.tacticalRadarSelects;
            state.sensorsRadarShows    = window.simState.sensorsRadarShows;
            state.sensorsRadarSelects  = window.simState.sensorsRadarSelects;
            // Navigation chart filter inputs — the Navigation builder has a
            // two-stage filter (outer entity filter on `navChartShows`, then
            // the inner `buildBlips` filter), so omitting these silently
            // drops every non-objective entity from the nav chart.
            state.navChartShows        = window.simState.navChartShows;
            state.navChartSelects      = window.simState.navChartSelects;
            state.navChartRange        = window.simState.navChartRange;
            state.phaserArcConfigs  = window.simState.phaserArcConfigs;
            state.torpedoArcConfigs = window.simState.torpedoArcConfigs;
            state.navigationWaypoint = window.simState.navigationWaypoint;
            // Push the pre-seeded repair teams so the Repair console renders its
            // rows immediately on (re)connect, before the first RepairState
            // broadcast (no-op unless Repair is the active console).
            pushRepairConsoleState();
          }
          if (msg.data.ship_stations) {
            state.maxPlayers = msg.data.ship_stations.max_players || 0;
            stationConfigs = msg.data.ship_stations.configs || {};
          }
          if (msg.data.state.world) {
            const nameEl2 = document.getElementById('ship-name');
            const missionEl = document.getElementById('ship-mission');
            if (nameEl2) nameEl2.textContent = msg.data.state.world.scenario_title || 'Phoenix';
            if (missionEl) missionEl.textContent = msg.data.state.world.scenario_description || '';
          }
          setStatus('Connected');
          // Sync complexity presets: send SetComplexity for any console the
          // local player holds whose stored preference differs from the server.
          if (msg.data.state.complexity) {
            const serverComplexity = msg.data.state.complexity;
            const mine = myConsoles(state);
            for (const c of mine) {
              const stored = savedComplexity[c];
              const current = serverComplexity[c];
              if (stored && stored !== current) {
                send('SetComplexity', { console: c, preset_name: stored });
              }
            }
          }
          rebuildStations();
          break;
        case 'PlayerJoined': {
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const p = msg.data.player;
            const existing = state.players.findIndex(x => x.token === p.token);
            if (existing >= 0) state.players[existing] = { ...p, consoles: consolesOf(p) };
            else state.players.push({ ...p, consoles: consolesOf(p) });
          }
          rebuildStations();
          break;
        }
        case 'PlayerLeft':
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            state.players = state.players.filter(p => p.token !== msg.data.token);
          }
          rebuildStations();
          break;
        case 'StationAssigned': {
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const { token, consoles } = msg.data;
            // Clear these consoles from any other player who held them.
            for (const c of (consoles || [])) {
              for (const p of state.players) {
                if (p.token !== token && p.consoles) {
                  p.consoles = p.consoles.filter(x => x !== c);
                }
              }
            }
            const target = state.players.find(p => p.token === token);
            if (target) target.consoles = consoles || [];
          }
          rebuildStations();
          break;
        }
        case 'NameChanged': {
          if (window.lobbyState) {
            state.players = window.lobbyState.players;
          } else {
            const p = state.players.find(p => p.token === msg.data.token);
            if (p) p.name = msg.data.name;
          }
          if (msg.data.token === myToken) myName = msg.data.name;
          rebuildStations();
          break;
        }
        case 'GameStarted':
          state.phase = 'InProgress';
          const loadingEl = document.getElementById('asset-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          break;
        case 'LoadingProgress': {
          const frac = msg.data?.fraction ?? 0;
          const pct = Math.round(frac * 100);
          const pctEl = document.getElementById('asset-loading-pct');
          const assetEl = document.getElementById('asset-loading');
          if (assetEl) assetEl.style.display = 'flex';
          if (pctEl) pctEl.textContent = String(pct);
          break;
        }
        case 'SimState': {
          const snap = msg.data.snapshot;
          // SimSnapshot has view_mode: ViewMode (tagged enum), not view_direction.
          const vm = snap.view_mode;
          const vd = vm && vm.kind === 'Camera' ? vm.data : null;
          const hp = snap.hull_integrity;
          const repairTarget = snap.authorized_repair_console || null;
          state.shipX = snap.ship_x || 0;
          state.shipZ = snap.ship_z || 0;
          state.shipYaw = snap.ship_yaw || 0;
          state.forwardSpeed = snap.forward_speed || 0;
          state.impulseChargeProgress = snap.impulse_charge_progress || 0;
          state.boostEnabled = !!snap.boost_enabled;
          state.boostBattery = snap.boost_battery || 0;
          state.boostActive  = !!snap.boost_active;
            state.navigationWaypoint = window.simState
              ? window.simState.navigationWaypoint
              : (snap.navigation_waypoint || null);
          state.currentView = vd || (vm && vm.kind) || state.currentView;
          // Red alert visual (issue #439): drives the phone bezel image swap.
          // `snap.red_alert` is a snake-cased serde field on SimSnapshot.
          const nextAlert = !!snap.red_alert;
          if (state.redAlert !== nextAlert) {
            state.redAlert = nextAlert;
            applyBezelAlert(nextAlert);
          }
          // Update entity positions from per-tick entity state snapshots.
          // When window.simState is present it already applied these in place
          // to the shared entities array (state.asteroids is aliased to it in
          // the Welcome handler), so this loop runs only as the no-module
          // fallback to avoid a redundant second pass.
          if (!window.simState && snap.entity_states) {
            for (const es of snap.entity_states) {
              const match = state.asteroids.find(a => a.uuid === es.uuid);
              if (match && es.position) {
                match.position = es.position;
              }
            }
          }
          // Hull integrity + authorized repair target are mirrored into the
          // inline state for any shell reader; the Repair console iframe owns
          // the actual hull readout via pushRepairConsoleState (issue #462).
          if (typeof hp === 'number') {
            state.hullIntegrity = hp;
            state.repairTarget = repairTarget;
          }
          if (snap.console_hull) state.consoleHull = snap.console_hull;
          // Refresh every radar-bearing console each tick. The tactical radar
          // blips are built client-side from ship_x/z/yaw + the entity array
          // (same as sensors), so the weapons console must be pushed here too —
          // otherwise it only refreshes on the sparse WeaponsUpdate/TargetLock
          // events and the radar appears to crawl at ~1 Hz while sensors is
          // smooth at the 10 Hz SimState cadence.
          pushWeaponsConsoleState();
          pushRepairConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          // Fall through to scheduleRender() so the helm + captain iframes
          // receive updated state.
          break;
        }
        case 'WorldSetup': {
          // Share the sim-state module's entity array (in-place updates and
          // spawn/despawn flow through automatically).
          state.asteroids = window.simState
            ? window.simState.world.entities
            : ((msg.data.world && msg.data.world.entities) || []);
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          return;
        }
        case 'EntitySpawned':
        case 'AsteroidSpawned': {
          // Handled by the sim-state module (idempotent append); re-mirror the
          // entity array and refresh the radar-bearing consoles.
          if (!window.simState) return;
          state.asteroids = window.simState.world.entities;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          pushNavigationConsoleState();
          return;
        }
        case 'TargetLock': {
          const { uuid, locked } = msg.data;
          if (locked) {
            state.weaponsTarget = uuid;
            state.weaponsLocked = true;
          } else {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          return;
        }
        case 'WeaponsUpdate': {
          // Save full bank/tube/torpedo/mode state for the iframe console.
          const { target_uuid, target_name, banks, tubes, torpedo_count, phaser_mode, blips } = msg.data;
          const previousTarget = state.weaponsTarget;
          const bankList = Array.isArray(banks) ? banks : [];
          const fire_ready  = bankList.some(b => b.fire_ready);
          const on_cooldown = bankList.length > 0 && bankList.every(b => b.on_cooldown);
          const readyBank   = bankList.find(b => b.fire_ready) || bankList[0] || null;
          state.weaponsReadyBankId   = readyBank ? readyBank.id : null;
          state.weaponsFireReady     = fire_ready;
          state.weaponsOnCooldown    = on_cooldown;
          state.weaponsBanks         = bankList;
          state.weaponsTubes         = Array.isArray(tubes) ? tubes : [];
          state.weaponsTorpedoCount  = typeof torpedo_count === 'number' ? torpedo_count : 0;
          state.weaponsPhaserMode    = phaser_mode || 'Auto';
          state.weaponsBlips         = Array.isArray(blips) ? blips : state.weaponsBlips;
          if (target_uuid) {
            state.weaponsTarget = target_uuid;
            state.weaponsTargetName = target_name || (previousTarget === target_uuid ? state.weaponsTargetName : null);
            state.weaponsLocked = true;
          } else {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          pushWeaponsConsoleState();
          return;
        }
        case 'BeamStarted': {
          state.weaponsFiring = true;
          pushWeaponsConsoleState();
          return;
        }
        case 'BeamEnded': {
          state.weaponsFiring = false;
          pushWeaponsConsoleState();
          return;
        }
        case 'ConsoleHullUpdate': {
          state.consoleHull = window.simState
            ? window.simState.consoleHull
            : (msg.data.entries || []);
          pushRepairConsoleState();
          return;
        }
        case 'RepairState': {
          state.repairTeams = window.simState
            ? window.simState.repairTeams
            : (msg.data.teams || []);
          pushRepairConsoleState();
          return;
        }
        case 'PowerState': {
          const { helm, weapons, sensors, battery_charge, locked } = msg.data;
          if (typeof helm           === 'number') state.powerHelm    = helm;
          if (typeof weapons        === 'number') state.powerWeapons = weapons;
          if (typeof sensors        === 'number') state.powerSensors = sensors;
          if (typeof battery_charge === 'number') state.powerBattery = battery_charge;
          state.powerLocked = !!locked;
          pushPowerConsoleState();
          return;
        }
        case 'ShieldStatus': {
          state.shieldFacings = (msg.data.facings || []).map(f => ({
            label: f.label,
            hp: f.hp,
            max_hp: f.max_hp,
            online: f.online,
            offline_remaining: f.offline_remaining || 0,
            is_focused: !!f.is_focused,
          }));
          // Derive focused facing from facings list.
          const focused = state.shieldFacings.find(f => f.is_focused);
          state.shieldFocusedFacing = focused ? focused.label : null;
          pushShieldsConsoleState();
          return;
        }
        case 'AsteroidDestroyed': {
          const { uuid } = msg.data;
          // Removal already done in place by the sim-state module when loaded.
          state.asteroids = window.simState
            ? window.simState.world.entities
            : state.asteroids.filter(a => a.uuid !== uuid);
          if (state.weaponsTarget === uuid) {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          if (state.sensorsTarget === uuid) state.sensorsTarget = null;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          return;
        }
        case 'EntityDespawned': {
          const { uuid } = msg.data;
          // Removal already done in place by the sim-state module when loaded.
          state.asteroids = window.simState
            ? window.simState.world.entities
            : state.asteroids.filter(a => a.uuid !== uuid);
          if (state.weaponsTarget === uuid) {
            state.weaponsTarget = null;
            state.weaponsTargetName = null;
            state.weaponsLocked = false;
            state.weaponsFireReady = false;
          }
          if (state.sensorsTarget === uuid) state.sensorsTarget = null;
          pushWeaponsConsoleState();
          pushHelmConsoleState();
          pushSensorsConsoleState();
          return;
        }
        case 'DamageTaken': {
          const { hull } = msg.data;
          if (hull > 0) {
            const clamped = Math.min(hull, 30);
            const duration = Math.round(50 + (clamped / 30) * 250); // 50–300 ms
            if (navigator.vibrate) navigator.vibrate(duration);
          }
          return;
        }
        case 'ComplexityChanged': {
          // window.complexityStore (gui/complexity-store.js) was already
          // updated + persisted by the apply() pass above (own consoles
          // only); mirror server truth for the lobby segmented buttons.
          // Persist only consoles the local player holds — recording another
          // player's broadcast as a local preference would suppress that
          // console's first-use popup on this device.
          const { console: consoleName, preset_name } = msg.data;
          state.complexity[consoleName] = preset_name;
          if (myConsoles(state).includes(consoleName)) {
            // window.complexityStore is the sole writer of the
            // 'complexity-presets' localStorage key; select() materialises the
            // choice, validates the preset and persists. savedComplexity stays
            // an in-memory mirror for the lobby segmented buttons.
            window.complexityStore?.select(consoleName, preset_name);
            savedComplexity[consoleName] = preset_name;
          }
          rebuildStations();
          return;
        }
        case 'CoordinationPopup': {
          const { target, payload, sender_label } = msg.data;
          showCoordinationPopup(payload, sender_label);
          return;
        }
        case 'CommsState': {
          // Handled by the comms-state module (gui/comms-state.js); mirror its
          // messages/contacts for buildCommsConsoleState. Previously only the
          // (now deleted) Bevy drain consumed this message.
          if (window.commsState) {
            state.commsMessages = window.commsState.messages;
            state.commsContacts = window.commsState.contacts;
          } else {
            state.commsMessages = msg.data.messages || [];
            state.commsContacts = msg.data.contacts || [];
          }
          pushCommsConsoleState();
          return;
        }
        case 'GameOver':
          state.phase = 'GameOver';
          break;
        case 'ObjectiveSummary':
          break; // fall through to scheduleRender
        default:
          return; // unknown — skip re-render
      }
      scheduleRender();
    }

    // ── PeerJS connection ───────────────────────────────────────

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus('No host ID in URL. Scan the QR code on the view screen.');
    } else {
      (async () => {
        async function getIceServers() {
          const base = [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject', transport: 'tcp' },
          ];
          try {
            const r = await fetch('https://phoenix-turn-credentials.project-phoenix.workers.dev');
            if (r.ok) {
              const extra = await r.json();
              console.log(`[ICE] Metered.ca returned ${extra.length} server(s) — appending to base list`);
              return [...base, ...extra];
            }
            console.warn('[ICE] Metered.ca fetch returned', r.status, '— using OpenRelay only');
          } catch (e) {
            console.warn('[ICE] Metered.ca fetch failed (placeholder or network error) — using OpenRelay only:', e.message);
          }
          return base;
        }

        // Resolve this tab's session token now that gui/session-token.js has
        // loaded (it is deferred, so it was not available at parse time). Each
        // tab gets its own token — this is what allows several console tabs on
        // one desktop to connect as distinct players. The inline branch is a
        // last-ditch fallback for the rare case the module failed to load.
        myToken = (typeof window.installSessionToken === 'function')
          ? window.installSessionToken()
          : (() => {
              let t = sessionStorage.getItem('session-token');
              if (!t) {
                t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                  .map(b => b.toString(16).padStart(2, '0')).join('');
                sessionStorage.setItem('session-token', t);
              }
              return t;
            })();

        console.log('[PeerJS] fetching ICE servers…');
        const iceServers = await getIceServers();
        console.log('[PeerJS] ICE config:', iceServers.map(s => s.urls));
        console.log(`[PeerJS] connecting to host peer ID: ${hostPeerId}`);
        const clientPeer = new Peer({ config: { iceServers } });

        clientPeer.on('open', () => {
          console.log('[PeerJS] client peer open — starting DataChannel connect');
          let connectTimeout;
          let connectAttempts = 0;

          function startConnect() {
            console.log(`[PeerJS] connect attempt ${connectAttempts + 1}…`);
            setStatus('Connecting to host…');
            conn = clientPeer.connect(hostPeerId, { reliable: true });

            // Hook ICE state immediately so we see gathering/checking/connected
            const pc = conn.peerConnection;
            if (pc) {
              pc.addEventListener('iceconnectionstatechange', () =>
                console.log(`[ICE] state → ${pc.iceConnectionState}`));
              pc.addEventListener('icegatheringstatechange', () =>
                console.log(`[ICE] gathering → ${pc.iceGatheringState}`));
            }

            // If the DataConnection doesn't open within 8 s, retry — PeerJS
            // can silently stall when NAT traversal fails or the host is
            // temporarily unreachable.
            connectTimeout = setTimeout(() => {
              if (conn && !conn.open) {
                console.warn(`[PeerJS] ICE timed out on attempt ${connectAttempts + 1} — closing and retrying`);
                conn.close();
                conn = null;
                connectAttempts++;
                if (connectAttempts >= 3) {
                  console.error('[PeerJS] giving up after 3 failed ICE attempts');
                  setConnectionStatus('error');
                  setStatus('Cannot reach host after 3 attempts — the network may be blocking WebRTC relay traffic. Try a different network.');
                  return;
                }
                startConnect();
              }
            }, 8000);

            conn.on('open', () => {
              clearTimeout(connectTimeout);
              console.log('[PeerJS] DataChannel open');
              // Report the winning ICE candidate type so it's clear whether
              // traffic is direct (host), STUN-reflexive (srflx), or relayed (relay/TURN)
              const pc = conn.peerConnection;
              if (pc) {
                setTimeout(() => {
                  pc.getStats().then(stats => {
                    const vals = [...stats.values()];
                    const pair = vals.find(r => r.type === 'candidate-pair' && r.nominated);
                    if (pair) {
                      const loc = vals.find(r => r.id === pair.localCandidateId);
                      const rem = vals.find(r => r.id === pair.remoteCandidateId);
                      console.log(`[ICE] active path: local=${loc?.candidateType} remote=${rem?.candidateType}`);
                      if (loc?.candidateType === 'relay' || rem?.candidateType === 'relay') {
                        console.log('[ICE] traffic is being relayed through a TURN server');
                      }
                    }
                  }).catch(() => {});
                }, 1500);
              }
              setConnectionStatus('ready');
              acquireWakeLock();
              send('Identify', { token: myToken, name: myName });
              setStatus('Waiting for server…');
            });

            conn.on('data', raw => {
              try {
                const str = typeof raw === 'string' ? raw : new TextDecoder().decode(raw);
                handleMessage(JSON.parse(str));
              } catch (e) { console.error('[client] bad message', e, raw); }
            });

            conn.on('close', () => {
              clearTimeout(connectTimeout);
              console.log('[PeerJS] DataChannel closed');
              setConnectionStatus('disconnected');
              setStatus('Disconnected');
              conn = null;
              releaseWakeLock();
            });
            conn.on('error', e => {
              clearTimeout(connectTimeout);
              console.error(`[PeerJS] connection error (type: ${e.type})`, e);
              setStatus('Connection error: ' + e.type);
            });
          }

          startConnect();
        });

        clientPeer.on('disconnected', () => {
          console.warn('[PeerJS] signaling disconnected — reconnecting…');
          setConnectionStatus('disconnected');
          clientPeer.reconnect();
        });

        clientPeer.on('error', e => {
          console.error(`[PeerJS] client error (type: ${e.type})`, e);
          setConnectionStatus('error');
          if (e.type === 'peer-unavailable') {
            setStatus('Host not found — rescan the QR code on the view screen.');
          } else {
            setStatus('Peer error: ' + e.type);
          }
        });
      })();
    }
  </script>
</body>
</html>

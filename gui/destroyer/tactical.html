<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.cruiser_tactical.doc_title">Project Phoenix — Tactical Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; position: relative; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .command-advice { flex-shrink: 0; display: flex; align-items: baseline; gap: 12px; padding: 6px 12px; border: 1px dashed var(--edge); background: rgba(var(--rgb-panel), 0.4); font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); }
    .command-advice[hidden] { display: none; }
    .command-advice .advice-heading { font-family: "Chakra Petch", sans-serif; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; }
    .command-advice .advice-stance { color: var(--ink); font-weight: 700; letter-spacing: 0.08em; }
    .command-advice .advice-hint { color: var(--ink-faint); margin-left: auto; font-style: italic; }
    .console-body { flex: 1; min-height: 0; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; height: 100%; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    ph-tactical-radar, ph-phasers-controls, ph-blasters-controls, ph-torpedo-controls { flex-shrink: 0; }
    ph-tactical-radar { width: 100%; aspect-ratio: 1 / 1; }
    @media (orientation: landscape) { ph-tactical-radar { height: 100%; width: auto; } }
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    .overlay-toggle { background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; min-height: var(--control-hit-min); }
    .overlay-toggle:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-toggle[hidden] { display: none; }
    .overlay-toggle.active { background: rgba(var(--rgb-cyan-dim), 0.9); border-color: var(--cyan); color: var(--cyan); }
    .overlay-toggle .unread-badge { display: none; margin-left: 6px; background: var(--fire-bright); color: var(--surface-void); font-size: var(--text-xs); font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 1.4; }
    .overlay-toggle .unread-badge.show { display: inline-block; }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-dossier-panel { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body .col { padding: 8px; } .overlay-toggle { font-size: var(--text-xs); padding: 6px 12px; } .overlay-panel { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Tactical Console" data-i18n-attr="data-screen-label:console.tactical.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.tactical.title">TACTICAL</span><span class="sub" data-i18n="console.cruiser_tactical.subtitle">WEAPONS</span></h1>
        <div class="hero-controls">
          <span class="auto-badge" id="tactical-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          <!-- Navigation and Comms are both complete hero-bar Stations now
               (issues #1097, #1098) and no longer visit Tactical as overlays.
               Intel is not a system and never moves — it stays here regardless
               of which station is currently hosting Comms. -->
          <button class="overlay-toggle" id="intel-toggle" data-overlay="intel-overlay" data-active="false" data-i18n="console.common.intel_toggle">Intel</button>
        </div>
      </div>
      <!-- Non-binding Command intent advice (issue #1108). Shown only while
           Command directs this Station and a human holds it: advisory, never a
           control. Populated from `s.command_advice` in render(). -->
      <div class="command-advice" id="command-advice" hidden>
        <span class="advice-heading" data-i18n="console.command.advice_heading">COMMAND INTENT</span>
        <span class="advice-stance" id="command-advice-stance">—</span>
        <span class="advice-hint" data-i18n="console.command.advice_hint">Advisory — you retain control</span>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.tactical.weapons">Weapons</h2>
          <ph-tactical-radar id="tactical-radar"></ph-tactical-radar>
          <ph-phasers-controls id="phasers-controls"></ph-phasers-controls>
          <ph-blasters-controls id="blasters-controls"></ph-blasters-controls>
          <ph-torpedo-controls id="torpedo-controls"></ph-torpedo-controls>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.tactical.station_footer">TACTICAL STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_target">NO TARGET</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <!-- Intelligence files (issue #1030). Independent of Comms, which is now
         its own hero-bar console (issue #1098) rather than a toggle here. -->
    <div class="overlay-panel" id="intel-overlay">
      <button class="overlay-back" id="intel-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.tactical.intel">Intel</h2>
      <ph-dossier-panel id="dossier-panel"></ph-dossier-panel>
    </div>
  </div>
  <script type="module">
    import '../components/ph-tactical-radar.js';
    import '../components/ph-phasers-controls.js';
    import '../components/ph-blasters-controls.js';
    import '../components/ph-torpedo-controls.js';
    import '../components/ph-dossier-panel.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    import { setAutoState } from '../console-ui.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    import { systemView } from '../console-payload.js';

    // One delegated listener drives every `data-overlay` toggle and every
    // `data-overlay-back` button on the page (gui/console-overlays.js). Only
    // the Intel toggle uses this pattern now — Navigation and Comms are both
    // complete hero-bar Stations (issues #1097, #1098).
    initConsoleOverlays();

    initConsole({
      name: 'tactical',
      // s is a SystemStationConsolePayload — see the @typedef in gui/console-state.js.
      render: function(s) {
        var radarEl = document.getElementById('tactical-radar');
        var phasersEl = document.getElementById('phasers-controls');
        var blastersEl = document.getElementById('blasters-controls');
        var torpedoEl = document.getElementById('torpedo-controls');
        var dossierEl = document.getElementById('dossier-panel');
        var w = systemView(s, 'tactical-radar', 'phaser-control', 'phaser-omni', 'blaster-port', 'blaster-starboard');
        radarEl.state = { blips: w.blips || [], x: w.ship_x || 0, z: w.ship_z || 0, speed: w.ship_speed || 0, ship_heading: w.ship_heading || 0, phaser_arcs: w.phaser_arcs || [], torpedo_arcs: w.torpedo_arcs || [], selected_target_uuid: w.target_uuid || null };
        phasersEl.state = { banks: w.banks || [], target_valid: !!w.target_uuid, mode: w.phaser_mode || 'Auto' };
        blastersEl.state = { banks: w.blasters || [] };
        torpedoEl.state = { tubes: w.tubes || [], magazine: { current: w.torpedo_count || 0, max: w.torpedo_max || w.torpedo_count || 0 }, target_uuid: w.target_uuid || null };
        // Intelligence files (issue #1030). Server-projected: which facts the
        // crew may see is decided by src/dossier/projection.rs, which has no
        // field for hidden truth — there is nothing to filter here. `s.dossiers`
        // is independent of who currently hosts Comms (issue #1098).
        dossierEl.state = { dossiers: s.dossiers || [] };
        var targetName = w.target_name || w.target_uuid || null;
        document.getElementById('footer-target').textContent = targetName ? '\u25C9 ' + targetName : t('console.common.no_target');
        document.getElementById('footer-target').style.color = targetName ? 'var(--fire-bright)' : 'var(--ink-faint)';
        // Station badge: keep the weapons view's per-system tactical_auto
        // (every owned weapon system AI-run, from controlSources \u2014 may lag a
        // rating change by one tick). The composite already forwarded this flag.
        setAutoState(null, document.getElementById('tactical-auto-badge'), !!w.tactical_auto);
        document.getElementById('station-damage').state = s.own_hull || null;
        // Non-binding Command intent advice (issue #1108): present only while
        // Command directs this Station and a human holds it. The label is a
        // strings id resolved here; falls back to the raw stance id.
        var adviceEl = document.getElementById('command-advice');
        var advice = s.command_advice || null;
        if (advice) {
          document.getElementById('command-advice-stance').textContent =
            advice.stance_label ? t(advice.stance_label) : (advice.stance_id || '');
          adviceEl.hidden = false;
        } else {
          adviceEl.hidden = true;
        }
      }
    });
  </script>
</body>
</html>

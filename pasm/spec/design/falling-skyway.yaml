# The Falling Skyway scenario as a causal design model.
#
# Drafted with `pasm design bootstrap` from assets/worlds/falling_skyway.toml
# and filled in from the world file's own design commentary, the GDD page
# (docs/gdd/content/scenarios/falling-skyway.md) and the AI-backfill survey
# (docs/falling-skyway-ai-backfill.md). Every entity is origin: ai and
# proposed until a human ratifies it via `pasm review`.
#
# The world file stays authoritative: no number below is copied — anchors
# name where each value lives and what the design intends of it, and
# `pasm validate` reads the file live. `pasm design digest` renders this
# model with the live values as the entry point for design work.
entities:
  - scenario_model: falling-skyway
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Falling Skyway Scenario Model
      summary: >
        [ai] Closed-world design model for the first Thin Margin scenario.
        Three acts on an authored clock; every authored deadline below maps
        to a gate stating what its landing causes, or declares itself benign.
    game_design:
      world_file: assets/worlds/falling_skyway.toml

  # ── Roles and the verbs the causal chain hangs on ──────────────────────────
  - role: fs-captain
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Captain (Falling Skyway)
      summary: "[ai] Owns the calls that trade people against time: the strike vote, the force order and its warning, and the window triage."
    game_design:
      player_verbs: [fs-call-the-vote, fs-order-the-clearance, fs-book-the-window]
      responsibilities:
        - decide how the strike ends
        - decide who receives scarce passage
  - role: fs-tactical
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Tactical (Falling Skyway)
      summary: "[ai] Carries both Act 2 negotiation channels on this hull's comms overlay."
    game_design:
      player_verbs: [fs-settle-the-strike]
  - role: fs-operations
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Operations (Falling Skyway)
      summary: "[ai] Runs the external operations the storm and the collapse demand: tow, stabilise, transfer."
    game_design:
      player_verbs: [fs-order-the-tow, fs-order-the-stabilise]
  - role: fs-science
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Science (Falling Skyway)
      summary: "[ai] Reads the place: survey scans, the scan-vs-record diff, the rung."
    game_design:
      player_verbs: [fs-compile-the-survey]

  - verb: fs-compile-the-survey
    core: {status: proposed, confidence: provisional, origin: ai, title: Compile the Survey, summary: "[ai] Scan the head, the depots and the lane so the assessment Control receives is the crew's, not the placeholder."}
    game_design:
      architecture_links: [scenario-script-host-seam]
      owner_role: fs-science
      produces_facts: [survey-compiled]
  - verb: fs-settle-the-strike
    core: {status: proposed, confidence: provisional, origin: ai, title: Settle the Strike, summary: "[ai] Negotiate the committee's two-of-three ground; both promises land on the commitments ledger and stay open."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-tactical
      produces_facts: [strike-settled]
  - verb: fs-call-the-vote
    core: {status: proposed, confidence: provisional, origin: ai, title: Call the Vote, summary: "[ai] Close the negotiation. The backfill survey notes this is gated on ground held, not on evidence shown."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      produces_facts: [strike-settled]
  - verb: fs-order-the-clearance
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Order the Clearance
      summary: "[ai] Have Havelock clear the picket. Faster than talking, and it costs people; ten minutes' warning is the captain's lever over how many."
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      protected: true
      must_not_be: [resolved-by-ai-backfill-or-automation]
      on_success: [fs-worker-casualties]
  - verb: fs-order-the-tow
    core: {status: proposed, confidence: provisional, origin: ai, title: Order the Tow, summary: "[ai] Tow the stricken Lyra clear of the lane before the second band arrives."}
    game_design:
      architecture_links: [external-operation-runner]
      owner_role: fs-operations
      produces_facts: [lyra-under-control]
  - verb: fs-order-the-stabilise
    core: {status: proposed, confidence: provisional, origin: ai, title: Order the Stabilise, summary: "[ai] Stabilise the head at any of the three warnings — including the last."}
    game_design:
      architecture_links: [external-operation-runner]
      owner_role: fs-operations
      produces_facts: [skyhook-stabilised]
  - verb: fs-book-the-window
    core: {status: proposed, confidence: provisional, origin: ai, title: Book the Window, summary: "[ai] Allocate the computed lift among the three claims. There is no state of the world in which all three fit."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      protected: true
      must_not_be: [resolved-by-ai-backfill-or-automation]

  # ── Act 1 (0–90s): read the place ──────────────────────────────────────────
  - gate: fs-tether-slip
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Tether Slips
      summary: >
        [ai] t=40: the head loses six condition points, 48 falls to 42, under
        the authored 45% lift line — the skyhook_lift_capable flag drops and
        the triage priority names itself. Scripted, not preventable.
    game_design:
      self_resolving: true
      deadline_id: tether_slip
      on_failure: [fs-head-uncertified]
      enables: [fs-survey-closes-act-one]
      anchors:
        - name: tether-slip-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=tether_slip"
          key: due_secs
          min: "30"
          max: "120"
  - gate: fs-survey-closes-act-one
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Survey Falls Due
      summary: >
        [ai] t=90: Control wants the assessment. Whatever the crew have by
        then is what they send; anything still pending is FAILED at the act
        boundary, which is what makes partial success readable. The act ends
        on the clock by design — but the backfill survey found a fully silent
        crew gets all three Act 1 objectives green, so the survey itself is
        not yet the crew's work. requires_player_action is declared and the
        zero-input warning on fs-act-one-objectives records the hole.
    game_design:
      self_resolving: true
      deadline_id: skyway_survey_due
      requires: [fs-tether-slip]
      on_failure: [fs-act-two-opens]
      anchors:
        - name: survey-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=skyway_survey_due"
          key: due_secs
          min: "60"
          max: "240"
  - gate: fs-act-one-objectives
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Act 1 Objectives Prove Nothing Yet
      summary: >
        [ai] The backfill survey's finding, promoted into the model: all
        three Act 1 objectives resolve from scripted events and thresholds,
        so a silent crew completes the act. This gate deliberately declares
        no player action and does not claim to be self-resolving, so the
        zero-input warning stands in CI until the survey becomes the crew's
        work (fs-compile-the-survey) and this gate names it.
    game_design:
      requires: [fs-tether-slip]
      enables: [fs-survey-closes-act-one]

  # ── Act 2 (90–268s): the strike, then the storm ────────────────────────────
  - gate: fs-storm-front
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Control's Forecast Lands
      summary: "[ai] t=100: the corridor is cleared ahead of the weather and the Lyra's situation becomes the crew's problem."
    game_design:
      self_resolving: true
      deadline_id: storm_front_due
      requires: [fs-survey-closes-act-one]
      on_failure: [fs-corridor-cleared]
      anchors:
        - name: storm-front-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=storm_front_due"
          key: due_secs
          min: "95"
          max: "260"
  - gate: fs-storm-band-one
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: First Band, North Corridor
      summary: >
        [ai] t=145. Forty-five seconds after the forecast, which is not
        generosity — it is arithmetic: a bulk hauler makes twelve units a
        second and needs about thirty-five of them once its authored
        acknowledge-and-decide delay has run.
    game_design:
      self_resolving: true
      deadline_id: storm_band_one_due
      requires: [fs-storm-front]
      on_failure: [fs-storm-exposure]
  - gate: fs-storm-band-two
    core: {status: proposed, confidence: provisional, origin: ai, title: Second Band, summary: "[ai] t=185, over the upper gate. The band the Lyra must be clear of."}
    game_design:
      self_resolving: true
      deadline_id: storm_band_two_due
      requires: [fs-storm-band-one]
      on_failure: [fs-storm-exposure]
  - gate: fs-lyra-clear
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Rescue's Clock
      summary: >
        [ai] t=192: she is under control by now or the band has her. The
        flagship causal gate of the storm — it names the player work (the
        tow) and what failing it costs (the Lyra and her crew). The backfill
        survey notes AI backfill cannot emit StartOperation, so this gate is
        unwinnable-by-AI until that gap closes.
    game_design:
      requires_player_action: [fs-order-the-tow]
      deadline_id: lyra_clear_due
      requires: [fs-storm-front]
      on_failure: [fs-lyra-lost]
      anchors:
        - name: lyra-clear-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=lyra_clear_due"
          key: due_secs
          min: "150"
          max: "260"
  - gate: fs-storm-band-three
    core: {status: proposed, confidence: provisional, origin: ai, title: Third Band, summary: "[ai] t=225, over the head itself. Retires at t=265."}
    game_design:
      self_resolving: true
      deadline_id: storm_band_three_due
      requires: [fs-storm-band-two]
      on_failure: [fs-storm-exposure]
  - gate: fs-storm-passes
    core: {status: proposed, confidence: provisional, origin: ai, title: The Storm Passes, summary: "[ai] t=268: the corridor is clear, traffic goes back on the lane, the act closes on the flag Act 3 opens on."}
    game_design:
      self_resolving: true
      deadline_id: storm_passed_due
      requires: [fs-storm-band-three]
      on_failure: [fs-act-three-opens]

  # ── Act 3 (268–470s): the head, and the window ─────────────────────────────
  - gate: fs-skyhook-holds-or-falls
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Skyhook Can Fall
      summary: >
        [ai] t=382: Act 3 puts the head back under the corridor's load and
        walks its condition toward the structural floor skyhook.toml authors.
        Three escalating warnings come first; a crew who stabilise at any of
        them keep the structure. A crew who do not watch destroy_entity take
        it out of the world mid-mission, and the mission branches into the
        survivor-rescue epilogue.
    game_design:
      requires_player_action: [fs-order-the-stabilise]
      deadline_id: skyhook_failure_due
      requires: [fs-storm-passes]
      on_failure: [fs-skyhook-collapse]
      anchors:
        - name: skyhook-failure-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=skyhook_failure_due"
          key: due_secs
          min: "300"
          max: "600"
  - gate: fs-window-opens
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Transfer Window Opens
      summary: >
        [ai] t=400: the deadline the crew have watched since the first tick.
        Demand is authored — three labelled capacity rows on Control's
        manifest, filed before the crew arrived — and supply is computed at
        this moment from the head's certification, each rung's line, and
        whether the people who staff it are at work. Nobody arrives with
        enough.
    game_design:
      self_resolving: true
      deadline_id: skyway_transfer_window
      requires: [fs-storm-passes]
      on_failure: [fs-window-opens-short]
  - gate: fs-window-closes
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Window Closes
      summary: "[ai] t=470: the window shuts for good. Claims not lifted have lapsed, and the six campaign flag families record what the crew chose."
    game_design:
      self_resolving: true
      deadline_id: skyway_window_closes
      requires: [fs-window-opens]
      requires_player_action: [fs-book-the-window]
      on_failure: [fs-claims-lapse]
      anchors:
        - name: window-closes-due
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=skyway_window_closes"
          key: due_secs
          min: "430"
          max: "900"

  # ── Consequences ────────────────────────────────────────────────────────────
  - consequence: fs-head-uncertified
    core: {status: proposed, confidence: provisional, origin: ai, title: The Head Loses Certification, summary: "[ai] 42/100 is under the 45% lift line; the lift-capable flag falls and every later supply computation starts from here."}
    game_design:
      handler: on_tether_slip
      depends_on_state: []
  - consequence: fs-act-two-opens
    core: {status: proposed, confidence: provisional, origin: ai, title: Act Two Opens, summary: "[ai] The survey lands at Control as-sent; pending objectives fail readable; both negotiation channels open on Tactical."}
    game_design:
      handler: on_survey_due
  - consequence: fs-corridor-cleared
    core: {status: proposed, confidence: provisional, origin: ai, title: The Corridor Clears, summary: "[ai] Civilian traffic is ordered off the lane ahead of the weather; the Lyra cannot comply."}
    game_design:
      handler: on_storm_front
  - consequence: fs-storm-exposure
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: A Band Sweeps the Corridor
      summary: >
        [ai] The destroyer survives crossing a band and does not survive
        living in one; a 60-point civilian hauler cannot cross one at all.
        Whatever is in the band when it arrives takes that arithmetic.
    game_design:
      handler: on_storm_band_one
  - consequence: fs-lyra-lost
    core: {status: proposed, confidence: provisional, origin: ai, title: The Lyra Is Lost, summary: "[ai] The band takes her and her crew; the loss report objective opens and the campaign remembers."}
    game_design:
      handler: on_lyra_lost
  - consequence: fs-worker-casualties
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Clearing the Picket Costs People
      summary: >
        [ai] The casualty count is READ, not rolled: no RNG in script, so the
        number comes off the workers' mirrored disposition at the moment the
        order is given, with ten minutes' warning as the captain's lever over
        it. Deterministic per seed by construction, surfaced on a console
        four ways.
    game_design:
      handler: on_force_now
      magnitude_source: workers' mirrored disposition at the moment the order is given
      depends_on_state: [fs-worker-disposition]
  - consequence: fs-act-three-opens
    core: {status: proposed, confidence: provisional, origin: ai, title: Act Three Opens, summary: "[ai] The storm's close writes the flag Act 3 opens on; the head goes back under load."}
    game_design:
      handler: on_storm_passed
  - consequence: fs-skyhook-collapse
    core: {status: proposed, confidence: provisional, origin: ai, title: The Skyhook Falls, summary: "[ai] destroy_entity takes the head out of the world mid-mission; one berth remains, Control asks for a name, and the mission branches into the survivor-rescue epilogue."}
    game_design:
      handler: on_head_lost
  - consequence: fs-window-opens-short
    core: {status: proposed, confidence: provisional, origin: ai, title: The Window Opens Short, summary: "[ai] Supply is computed, demand is read, and the shortfall is stated in mission copy when the window opens — the choice scene enforces two-of-three by reading the numbers, not by hard-coding 'pick two'."}
    game_design:
      handler: on_transfer_window_opens
      magnitude_source: computed lift at window open, from head certification, rung lines, and staffing
      depends_on_state: [fs-ladder-supply-picture]
  - consequence: fs-claims-lapse
    core: {status: proposed, confidence: provisional, origin: ai, title: Unlifted Claims Lapse, summary: "[ai] The window shuts for good; what was not lifted was chosen against, and the six campaign flag families carry it forward."}
    game_design:
      handler: on_the_window_shuts_for_good

  # ── State the consequences read ─────────────────────────────────────────────
  - information: fs-worker-disposition
    core: {status: proposed, confidence: provisional, origin: ai, title: Worker Disposition, summary: "[ai] The workers' mirrored disposition — the number the casualty count is read from. Surfaced on a console four ways, so the captain can weigh the order they are giving."}
    game_design:
      visibility: team-visible
      enforcement_links: [scenario-script-host-seam]
  - information: fs-ladder-supply-picture
    core: {status: proposed, confidence: provisional, origin: ai, title: The Ladder's Supply Picture, summary: "[ai] Head certification, rung operational lines, staffing — the inputs the window's computed supply is read from, all visible from the first tick."}
    game_design:
      visibility: team-visible
      enforcement_links: [scenario-script-host-seam]

  # ── The structural scarcity ─────────────────────────────────────────────────
  - design_invariant: fs-window-structural-scarcity
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Window Cannot Carry Every Claim
      summary: >
        [ai] 40 from Ladder A plus 12 from Ladder B is 52; the three claims
        total 66; any two claims fit and all three never do. Nothing in this
        mission can raise either capacity, so a crew who did everything still
        arrive short — the window is a choice, not a disaster. The headless
        test asserts this from the authored numbers rather than from a run,
        because it is a claim about every run.
    game_design:
      relation: >
        claim_committee + claim_havelock + claim_convoy (66) exceeds
        depot_a_fuel_lift + depot_b_fuel_lift (52), and the sum of any two
        claims does not.
      asserted_by: [a_crew_who_did_everything_still_reach_the_window_short]
      anchors:
        - name: claim-committee
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_committee"
          key: amount
          expect: "18"
        - name: claim-havelock
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_havelock"
          key: amount
          expect: "22"
        - name: claim-convoy
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_convoy"
          key: amount
          expect: "26"
        - name: depot-a-lift
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=depot_a_fuel_lift"
          key: amount
          expect: "40"
        - name: depot-b-lift
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=depot_b_fuel_lift"
          key: amount
          expect: "12"
    implementation:
      status: declared
      paths: [tests/headless_runner.rs]

  # ── The pacing budget (unratified — issue #1044's tuning surface) ──────────
  - pacing: fs-mission-clock
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Falling Skyway Pacing Budget
      summary: >
        [ai] Three acts over 470 authored seconds. These windows are
        hypotheses pending the #1044 tuning pass; the deadline anchors above
        carry generous bounds for exactly that reason, and this budget will
        flag any deadline the tuning moves out of its act.
    game_design:
      clock_source: mission first tick; lobby time costs the mission none of its clock
      human_calibration: >
        An authored clock must include the real time needed to read, speak,
        navigate console depth, reconnect, and recover from an understandable
        mistake. Headless completion time is not human completion time.
      phases:
        - phase_id: act-one-read-the-place
          from: "0s"
          to: "95s"
          intensity_intent: setup
          engaged_roles: [fs-science, fs-captain]
          covers_deadlines: [tether_slip, skyway_survey_due]
        - phase_id: act-two-strike-and-storm
          from: "95s"
          to: "290s"
          intensity_intent: rising-to-peak
          engaged_roles: [fs-tactical, fs-operations, fs-captain, fs-science]
          covers_deadlines: [storm_front_due, storm_band_one_due, storm_band_two_due, lyra_clear_due, storm_band_three_due, storm_passed_due]
        - phase_id: act-three-the-window
          from: "290s"
          to: "480s"
          intensity_intent: release-under-scarcity
          engaged_roles: [fs-operations, fs-captain]
          covers_deadlines: [skyhook_failure_due, skyway_transfer_window, skyway_window_closes]

  # ── Principles: falsifiable, measured, honest about counter-evidence ───────
  - design_principle: fs-scarcity-reads-as-choice
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Shortfall Reads as a Choice, Not a Punishment
      summary: "[ai] Crews should experience the Act 3 window as a hard triage decision they were equipped to make, not a fail state they were ambushed by."
    game_design:
      strength: soft
      context: Act 3 window, crews who completed the survey and settled the strike
      construction: [fs-window-structural-scarcity, fs-window-opens, fs-ladder-supply-picture]
      expected_dynamic: crews debate which two claims to honour before the window opens, using numbers they have watched since the first tick
      experience_hypothesis: post-mission, crews describe the window as their decision rather than the game's
      measured_by: [fs-window-choice-claim]
      counter_evidence:
        - "docs/falling-skyway-ai-backfill.md: AI crews reach the window without engaging the claims, so nothing yet demonstrates the choice reads as theirs"
  - design_principle: fs-warning-is-arithmetic
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Storm Warnings Are Arithmetic, Not Generosity
      summary: "[ai] The 45 seconds between forecast and first band is derived from hauler speed, lane length, and the authored acknowledge-and-decide delay — enough to comply, never enough to idle."
    game_design:
      strength: soft
      context: Act 2 storm sweep, civilian traffic on authored lanes
      construction: [fs-storm-front, fs-storm-band-one]
      expected_dynamic: compliant traffic escapes each band with seconds to spare; the Lyra, who cannot comply, becomes the crew's problem instead
      experience_hypothesis: the storm reads as lethal weather with fair warning, not as scripted punishment
      measured_by: [traffic_clears_before_each_band_headless_check]
  - playtest-claim: fs-window-choice-claim
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Window Choice Playtest Claim
      summary: "[ai] In moderated playtests, crews articulate the two-of-three trade before the window closes, unprompted."
    game_design:
      claim: crews state which two claims they will honour, unprompted, before skyway_window_closes fires
      supports: [fs-scarcity-reads-as-choice]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.captain.doc_title">Project Phoenix - Captain Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .hero h1 { margin: 0; font-size: 26px; letter-spacing: 0.22em; color: var(--ink); }
    .hero h1 .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--ink-faint); }
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .controls-row { display: flex; gap: 12px; }
    .controls-row > * { flex: 1; min-width: 0; }
    ph-objective-list { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-faint); padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .hero h1 { font-size: 20px; }
      .hero h1 .sub { font-size: 10px; }
      .controls-row { gap: 8px; }
    }
  </style>
</head>
<body>
  <div id="objectives" hidden></div>
  <div id="dir" hidden></div>
  <div id="alert" hidden></div>
  <div class="frame" data-screen-label="Captain Console" data-i18n-attr="data-screen-label:console.captain.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.captain.title">CAPTAIN</span><span class="sub" data-i18n="console.battleship_captain.subtitle">COMMAND &amp; BATTLESPACE</span></h1>
        <span class="auto-badge" id="captain-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
      </div>
      <div class="console-body">
        <div class="controls-row">
          <ph-camera-select id="camera-select"></ph-camera-select>
          <ph-red-alert id="red-alert"></ph-red-alert>
        </div>
        <ph-objective-list id="objective-list"></ph-objective-list>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span data-i18n="console.captain.station_footer">CAPTAIN STATION</span>
        <span class="spacer"></span>
        <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
        <ph-station-damage id="station-damage"></ph-station-damage>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-camera-select.js';
    import '../components/ph-red-alert.js';
    import '../components/ph-objective-list.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    import { setAutoState } from '../console-ui.js';

    initConsole({
      name: 'captain',
      // s is a CaptainConsolePayload — see the @typedef in gui/console-state.js.
      render: function(s) {
        // The battleship's Captain station does not own a sensors system
        // (Sensors is its own dedicated station) — buildCaptainConsoleState
        // returns its fields flat, not nested under `s.captain`/`s.sensors`
        // (that nesting only applies to the Destroyer's combined
        // captain+sensors console). Read flat, matching gui/cruiser/captain.html.
        document.getElementById('camera-select').state = { views: s.camera_views || [], current_view: s.view_direction || '', auto: !!s.viewscreen_auto };
        document.getElementById('red-alert').state = { active: !!s.red_alert, auto: !!s.red_alert_auto };
        document.getElementById('objective-list').state = { objectives: s.objectives || [], boosted_objective_id: s.boosted_objective_id ?? null };
        document.getElementById('station-damage').state = s.own_hull || null;
        var contacts = (s.blips && s.blips.length) || 0;
        document.getElementById('footer-target').textContent = contacts > 0
          ? (contacts === 1 ? t('console.common.contacts.one', { n: 1 }) : t('console.common.contacts.other', { n: contacts }))
          : t('console.common.no_target');
        setAutoState(null, document.getElementById('captain-auto-badge'), !!s.captain_auto);

        var objectivesEl = document.getElementById('objectives');
        objectivesEl.replaceChildren();
        (s.objectives || []).forEach(function(o) {
          var row = document.createElement('div');
          row.className = 'objective-data';
          row.dataset.id = o.id || '';
          row.dataset.text = o.text || '';
          row.dataset.status = o.status || '';
          objectivesEl.appendChild(row);
        });
        document.getElementById('dir').dataset.direction = s.view_direction || '';
        document.getElementById('alert').dataset.redAlert = String(!!s.red_alert);
      }
    });
  </script>
</body>
</html>

        - "[ai] THE ONE AVAILABILITY ANSWER (rule 6). A dispatched team is unavailable to this hull's internal damage-control sweep, in the console readout and to the repair AI alike, because both add the SAME committed_repair_teams to the same free_team_indices — neither can undercut the other. Dispatch and recall are the ordinary station-tenure admitted commands (DispatchExternalRepair / RecallExternalRepair targeting the real engineering-owned repair system): the engineering holder may send them, an AI operating repair may emit them (#1162 is the policy host proper), and admission strips source identity before the handler sees it. This slice makes them admissible and reads the availability answer the AI dispatcher does."
        - "[ai] THE WORK GOES THROUGH #1025's CONDITION QUEUE. A dispatched team raises the target's OWN infrastructure condition track at the authored rate by queuing a ConditionAdjustment, ordered before tick_infrastructure_condition so the adjustment lands the same tick it is earned — the exact ordering arrest_held_declines keeps. The delta is purely additive (the team is repairing, not arresting a decline), so it COMPOSES with a tractor's arrest on the same target: both push onto the one queue and the infra tick sums them. Going through the queue rather than onto the component is what keeps the repaired condition crossing the target's own authored thresholds, by the one system that owns the flag edges."
        - "[ai] RECALL, OR DRIFTING OUT OF RANGE, BRINGS THE TEAM HOME AND STOPS THE WORK. The free-team gate is a dispatch-time check — once a team is over there it is a resource claim, not re-evaluated against the hull's other jobs — so the per-tick maintenance re-runs only the range check and drops the dispatch when the target drifts past the authored reach or vanishes. Recall clears the dispatched target the instant it is issued, and the condition the team already banked stays on the target, so helping an ally is a real, reversible trade against fixing your own shields."

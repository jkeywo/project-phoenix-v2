name = "Requiem Courier"
tags = ["ship", "npc", "comms_contact"]
faction = "dddddddd-4444-4444-8444-dddddddddddd"

[target]
tags = ["ship"]
threat_level = "low"
description = "Requiem Courier"

[hull]
hull_integrity = 40.0

[collider]
shape = "Capsule"
radius = 1.5
length = 4.0

[radar_appearance]
colour = [0.2, 0.6, 0.9]
size = 4.0
icon = "ship"

[mesh]
model = "assets/models/dynasty_courier.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [0.2, 0.6, 0.9]

[helm_console]
max_speed = 12.5
max_reverse_speed = 6.25
acceleration = 4.1665
deceleration = 12.5
max_yaw_rate = 0.196
max_bank_deg = 15.0

[helm_console.engine_pfx]
color = [ 0.25, 0.75, 1.0, 0.65 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.5

[comms]
range = 800.0

# ── Behaviour ────────────────────────────────────────────────────────────────
#
# (#572) Doctrine-based AI. Courier is non-combat — only objective is to
# reach its destination. No Destroy doctrine.

[behaviour]

[[behaviour.doctrine]]
id         = "reach-destination"
text       = "Proceed to destination"
directive_kind = "Reach"
directive_anchors = ["destination"]
base_priority    = 30.0
target_speed     = 0.8


# Ship systems (helm only - courier has no weapons)
[[system]]
id = "helm"
kind = "helm"
ai_only = true

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
ai_only = true

[[system]]
id = "power-battery"
kind = "power_battery"
ai_only = true

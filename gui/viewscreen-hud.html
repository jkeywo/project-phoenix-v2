<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="server.hud_doc_title">Phoenix Viewscreen HUD</title>
  <!--
    The native host's viewscreen HUD overlay (issue #422's HTML overlay, ported
    to the native path). server.html renders this same #hud-overlay above its
    <canvas>; the native host has no HTML canvas, so this page is composited by a
    TRANSPARENT Ultralight surface over the 3-D viewscreen (panes/ultralight.rs).
    The frame pieces, the readout and the red-alert vignette are lifted verbatim
    from server.html so the native viewscreen frames the same as the web one.
    Border assets are served from /gui/borders/ — this page lives at
    /gui/viewscreen-hud.html, so it references them relative as "borders/…".
    Driven from Rust by window.__updateHud(stateJson) and, since issue #1428,
    by window.__phoenixSetHudEffects({shake, flash, decorativeMotion}) — this
    display's three resolved visual-effect intensities, which land as the same
    `data-shake` / `data-flash` / `data-decorative-motion` bands and
    `--a11y-*-scale` properties the private profile stamps on every other root.
    Both arrive in ONE retained command (see the HUD-state push in
    src/native_host/panes/ultralight.rs), because this surface has no other way
    to hear about them: it is not the lobby document, so the presentation script
    injected into that document's head never reaches it, and an Ultralight view
    answers no `prefers-reduced-motion` query.

    The String Table reaches it the same way the border art does. This page is
    SERVED by the host's own delivery server (host_lobby::document's
    VIEWSCREEN_HUD_PATH), so it can import gui/ modules over http:// exactly as
    the native lobby document does — see the module island at the bottom of
    <body>, and src/native_host/host_lobby/host_lobby_link.js for the surface
    that established the pattern.

    Every display string this page writes of its own is a String Id resolved
    from assets/strings/strings.csv: the six in the static markup (the document
    title, the designation and the four slot labels) and the four runtime
    status-slot values — server.hud_heading, server.hud_weapons_hot,
    server.hud_clear and server.hud_hull. All ten are ids server.html's copy of
    this overlay already renders through the same t(), so the two Viewscreens
    read the same words: this one used to draw "HDG 090" and "HULL 84%" where
    the web one drew the table's own "HEADING 090" and "HULL 84", and now both
    draw the table's. What arrives FROM the host instead — ship_name,
    condition, game_over_message — crosses localiseTree once at the wire
    boundary, which resolves the ids among them and passes a scenario's
    authored prose through untouched.

    One thing server.html's viewscreen draws is simply absent here, and this
    page carries neither the markup nor the ids for it: the ship's-computer
    banner it renders from `computer_message` (server.html:1946-1951, 2710-2745,
    issue #1342). Adding it changes what the shared Viewscreen SHOWS, which is
    a different change from wiring the table in.
  -->
  <!--
    No external font stylesheet: the native host is offline/LAN, and a
    `<link rel="stylesheet">` to fonts.googleapis.com is RENDER-BLOCKING — the
    Ultralight view would stall waiting for a sheet it can never fetch, so the
    frame never lays out or paints. The type below falls back to the system
    faces, which is the right call for an offline viewscreen anyway; server.html
    keeps the web font because it is online.

    The two sheets below are LOCAL — served by this same process from /gui/,
    so they cost no network round trip: the vocabulary, and the game-over
    treatment the phone and the web Viewscreen draw the ending with.
  -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="game-over.css">
  <style>
    /* The page itself paints nothing — only the frame pieces below do, so the
       3-D viewscreen shows through everywhere else (the surface is transparent). */
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
    }

    /* ── HTML viewscreen HUD overlay (issue #422) ───────────────────────── */
    #hud-overlay {
      position: absolute; inset: 0; z-index: 15;
      pointer-events: none;
      --signal: #5fd8e8;
      --alert: #ff3344;
      --t: 44px;
      --vs-signal: #5fd8e8;
      --vs-alert: #ff3344;
      --vs-text: #b8c0c8;
    }
    /* Red-alert inner glow — full-screen vignette, pulsing. */
    #hud-vignette {
      position: absolute; inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px var(--alert),
                  inset 0 0 32px 4px rgba(255, 51, 68, 0.55),
                  inset 0 0 80px 0 rgba(255, 51, 68, 0.18);
      opacity: 0;
      transition: opacity .25s ease;
      /* This loop's authored period and its RESOLVED one, exactly as server.html
         declares them beside its own copy of this vignette (issue #1428). Named
         once so both rules that need the answer — the declaration below, and the
         flash re-assertion in gui/tokens.css that holds this loop against the
         decorative-motion sweep — read the same number rather than each writing
         the division out and drifting. */
      --a11y-flash-period: 1.3s;
      --a11y-flash-duration: calc(var(--a11y-flash-period) / max(var(--a11y-flash-scale, 1), 0.05));
    }
    #hud-overlay.alert-on #hud-vignette {
      opacity: 1;
      animation: hud-pulse 1.3s ease-in-out infinite;
      /* A gentler flash pulses SLOWER as well as less often: the period divides
         by the resolved `--a11y-flash-scale` the host stamps on this document's
         root (`window.__phoenixSetHudEffects`, in the prelude below). Floored at
         0.05 so an intensity of 0 — which the band rule below stops outright —
         cannot divide by zero. Unstamped the var is 1 and this is the 1.3s it
         has always been. */
      animation-duration: var(--a11y-flash-duration);
    }
    /* The FLASH preference, on the one document the room is actually looking at
       when this host runs native (issue #1428).

       This page is not the lobby document, so the head injection that seeds
       `window.PhoenixViewscreenPresentation` never reaches it, and an Ultralight
       view answers no `prefers-reduced-motion` query (issue #1127) — so the
       `@media` block below, which was this overlay's only motion handle, is dead
       on the native Viewscreen. The band arrives from the host instead, over the
       same channel the readout does, and is stamped on this root by the prelude.

       Off holds the glow at FULL opacity rather than hiding it: a room reading a
       ship at red alert off this screen reads it exactly as before, minus the
       movement. That is the zero-effect state PRD #1418 requires, and it is the
       same pair of rules server.html carries over its own copy of this overlay. */
    :root[data-flash="off"] #hud-overlay.alert-on #hud-vignette {
      animation: none;
      opacity: 1;
    }
    /* The pre-stamp fallback, gated on the band being ABSENT so that once the
       host has spoken the endpoint's own record is the authority — including
       when it says to KEEP a flash this machine's OS asked to reduce. Kept for
       the engines that DO answer the query: this same file is served to anything
       that opens /gui/viewscreen-hud.html. */
    @media (prefers-reduced-motion: reduce) {
      :root:not([data-flash]) #hud-overlay.alert-on #hud-vignette {
        animation: none;
        opacity: 1;
      }
    }
    @keyframes hud-pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    /* ─── Viewscreen border frame (raw/gui/borders/demo.html) ──────────────── */
    /* All frame pieces are absolute children of #hud-overlay (inset:0) */
    .vs-piece, .vs-edge {
      position: absolute;
      pointer-events: none;
    }
    /* Tiled edges */
    .vs-edge { background-repeat: repeat; image-rendering: pixelated; }
    .vs-edge.top {
      top: 0; left: 240px; right: 240px;
      height: var(--t);
      background-image: url("borders/edge-top.png");
      background-size: 64px 44px;
    }
    .vs-edge.bottom {
      bottom: 0; left: 240px; right: 240px;
      height: var(--t);
      background-image: url("borders/edge-bottom.png");
      background-size: 64px 44px;
    }
    .vs-edge.left {
      left: 0; top: 140px; bottom: 140px;
      width: var(--t);
      background-image: url("borders/edge-left.png");
      background-size: 44px 64px;
    }
    .vs-edge.right {
      right: 0; top: 140px; bottom: 140px;
      width: var(--t);
      background-image: url("borders/edge-right.png");
      background-size: 44px 64px;
    }
    /* Corners (240×140 px) */
    .vs-corner {
      width: 240px; height: 140px;
      background-repeat: no-repeat; background-size: contain;
      image-rendering: pixelated;
    }
    .vs-corner.tl { top: 0; left: 0;     background-image: url("borders/corner-tl.png"); }
    .vs-corner.tr { top: 0; right: 0;    background-image: url("borders/corner-tr.png"); }
    .vs-corner.bl { bottom: 0; left: 0;  background-image: url("borders/corner-bl.png"); }
    .vs-corner.br { bottom: 0; right: 0; background-image: url("borders/corner-br.png"); }
    /* Caps (centred top/bottom) */
    .vs-cap {
      background-repeat: no-repeat; background-size: contain;
      image-rendering: pixelated;
    }
    .vs-cap.top {
      top: 0; left: 50%; transform: translateX(-50%);
      width: 320px; height: 56px;
      background-image: url("borders/cap-top.png");
    }
    .vs-cap.bottom {
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 520px; height: 56px;
      background-image: url("borders/cap-bottom.png");
    }
    /* Red alert — swap PNG assets */
    #hud-overlay.alert-on .vs-edge.top    { background-image: url("borders/edge-top-alert.png"); }
    #hud-overlay.alert-on .vs-edge.bottom { background-image: url("borders/edge-bottom-alert.png"); }
    #hud-overlay.alert-on .vs-edge.left   { background-image: url("borders/edge-left-alert.png"); }
    #hud-overlay.alert-on .vs-edge.right  { background-image: url("borders/edge-right-alert.png"); }
    #hud-overlay.alert-on .vs-corner.tl   { background-image: url("borders/corner-tl-alert.png"); }
    #hud-overlay.alert-on .vs-corner.tr   { background-image: url("borders/corner-tr-alert.png"); }
    #hud-overlay.alert-on .vs-corner.bl   { background-image: url("borders/corner-bl-alert.png"); }
    #hud-overlay.alert-on .vs-corner.br   { background-image: url("borders/corner-br-alert.png"); }
    #hud-overlay.alert-on .vs-cap.top     { background-image: url("borders/cap-top-alert.png"); }
    #hud-overlay.alert-on .vs-cap.bottom  { background-image: url("borders/cap-bottom-alert.png"); }
    /* Ship designation text (top-centre, over cap-top) */
    .vs-designation {
      position: absolute;
      top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5;
      font-family: "Chakra Petch", system-ui, sans-serif;
      font-size: 9px; font-weight: 600;
      letter-spacing: 0.5em;
      color: var(--vs-signal);
      pointer-events: none;
      white-space: nowrap;
    }
    #hud-overlay.alert-on .vs-designation { color: var(--vs-alert); }
    /* 4-slot status strip (bottom-centre, over cap-bottom) */
    .vs-status-strip {
      position: absolute;
      bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 408px; height: 36px;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 0 12px;
      pointer-events: none;
    }
    .vs-status-slot {
      display: flex; flex-direction: column;
      justify-content: center;
      padding-left: 18px;
    }
    .vs-slot-label {
      font-family: "Chakra Petch", system-ui, sans-serif; font-weight: 600;
      font-size: 8px; letter-spacing: 0.32em;
      color: var(--vs-text);
      text-transform: uppercase;
    }
    .vs-slot-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 9px; color: var(--vs-signal);
      margin-top: 2px; letter-spacing: 0.06em;
    }
    #hud-overlay.alert-on .vs-slot-value { color: var(--vs-alert); }
  </style>
</head>
<body>
  <div id="hud-overlay">
    <!-- `data-effect="flash"` claims this loop for the FLASH preference rather
         than the decorative sweep, which is what gui/tokens.css's re-assertion
         rule matches on; server.html's copy of this vignette carries the same
         marker for the same reason (issue #1428). -->
    <div id="hud-vignette" data-effect="flash"></div>

    <!-- Viewscreen border frame (tiled edges) -->
    <div class="vs-edge top"></div>
    <div class="vs-edge bottom"></div>
    <div class="vs-edge left"></div>
    <div class="vs-edge right"></div>
    <!-- Corners -->
    <div class="vs-piece vs-corner tl"></div>
    <div class="vs-piece vs-corner tr"></div>
    <div class="vs-piece vs-corner bl"></div>
    <div class="vs-piece vs-corner br"></div>
    <!-- Caps (centred top/bottom) -->
    <div class="vs-piece vs-cap top"></div>
    <div class="vs-piece vs-cap bottom"></div>
    <!-- Ship designation (top-centre, above cap) -->
    <div class="vs-designation" id="hud-designation" data-i18n="server.hud_designation">PHOENIX</div>
    <!-- 4-slot status strip (bottom-centre, inside cap-bottom) -->
    <div class="vs-status-strip">
      <div class="vs-status-slot"><div class="vs-slot-label" data-i18n="server.hud_nav">Nav</div><div class="vs-slot-value" id="v-nav">—</div></div>
      <div class="vs-status-slot"><div class="vs-slot-label" data-i18n="server.hud_tac">Tac</div><div class="vs-slot-value" id="v-tac">—</div></div>
      <div class="vs-status-slot"><div class="vs-slot-label" data-i18n="server.hud_eng">Eng</div><div class="vs-slot-value" id="v-eng">—</div></div>
      <div class="vs-status-slot"><div class="vs-slot-label" data-i18n="server.hud_sys">Sys</div><div class="vs-slot-value" id="v-sys">—</div></div>
    </div>
  </div>

  <!--
    Game-over screen (issue #422): shown over the frame when a mission ends —
    the SAME markup server.html's viewscreen and client.html's phone overlay
    carry, drawn by gui/game-over.css and framed by gui/game-over-view.js, so
    the room and the consoles see one ending. `__updateHud` reveals it when the
    host enters GamePhase::GameOver (the HUD state carries `game_over_message`
    only then), with the scenario's name, the headline the declared outcome
    picks, the closing message and the post-mission report rows in the author's
    order (issue #1344; no score, total or grade — the payload carries none).
    The web host's return-to-lobby button is left out here: this passive
    overlay takes no input, so the operator consoles own return-to-lobby.
    `display:none` stays inline so the overlay is hidden before the sheet
    lands, and the z-index keeps it above the frame pieces.
  -->
  <div id="game-over-overlay" style="display:none;z-index:85">
    <div class="game-over-frame">
      <div class="game-over-scan"></div>
      <span class="game-over-tick tl"></span><span class="game-over-tick tr"></span>
      <span class="game-over-tick bl"></span><span class="game-over-tick br"></span>
      <div class="game-over-body">
        <div class="game-over-scenario" id="game-over-scenario"></div>
        <div class="game-over-headline" id="game-over-headline"></div>
        <div class="game-over-message" id="game-over-message"></div>
        <dl class="game-over-report" id="game-over-report"></dl>
      </div>
    </div>
  </div>

  <!--
    TWO scripts, in this order, for the reason the native lobby document's
    host_lobby_boot.js / host_lobby_link.js pair records: the second imports
    from gui/, so it must be a MODULE, and a module is DEFERRED — it evaluates
    after the document is parsed, which is not before the host starts pushing.
    The first is therefore a classic script that installs `window.__updateHud`
    at parse time and holds the newest state, so a push landing in that gap is
    painted rather than thrown away.

    The split between them is deliberate, and it is not "state here, drawing
    there": the classic script owns the DOM plumbing AND a renderer that needs
    no String Table, so the Viewscreen still shows its heading, its hull, its
    red alert and its ending if the module never evaluates at all — an import
    that 404s in a trimmed --client-dir, or an engine that refuses the module.
    The module owns exactly one thing: choosing text through the table.
    tests/client/viewscreen-hud.test.js runs both halves the way this document
    does, including with the second one missing.
  -->
  <script>
    (function () {
      // The newest HUD state the host pushed, and the localising renderer the
      // module island installs over it — null until the island evaluates, and
      // null for good if it cannot, which is what `renderRaw` below is for.
      // State, not a queue: every push is a whole snapshot of the overlay, so
      // an older one says nothing the newest one does not — which is also why
      // the host side collapses to latest-wins (ViewscreenHudLatest in
      // panes/ultralight.rs).
      var hud = { json: null, render: null };
      window.__phoenixHud = hud;

      // ── The DOM plumbing, shared by both renderers ──────────────────────
      // Kept here rather than in the module so the fallback below and the
      // localising renderer write the overlay through exactly the same calls;
      // what differs between them is only which text they choose. Lifecycle
      // refreshes may repeat the same state; avoid dirtying unchanged DOM.
      hud.setText = function (id, value) {
        var el = document.getElementById(id);
        var text = value == null ? '' : String(value);
        if (el && el.textContent !== text) el.textContent = text;
      };

      hud.setAlert = function (on) {
        var overlay = document.getElementById('hud-overlay');
        if (overlay && overlay.classList.contains('alert-on') !== !!on) {
          overlay.classList.toggle('alert-on', !!on);
        }
      };

      // ── The three visual-effect bands (issue #1428) ─────────────────────
      // What this display's settings resolved to — shake, flash and decorative
      // motion, each a number in 0..=1 where 0 is off — stamped on the ROOT in
      // the two forms the sheets above read: a band attribute for the rules
      // that switch whole blocks (`gui/tokens.css`'s decorative sweep, the
      // vignette's `[data-flash="off"]` hold) and the raw number for the loop
      // that divides its own period by it.
      //
      // Why the STAMPING lives here and not in the module island, where
      // `gui/visual-effects.js`'s `applyEffectIntensitiesToRoot` is the same
      // three lines: a module whose import fails never evaluates, and the one
      // thing that must not survive an import failure is a red-alert glow still
      // throbbing at an operator who set Flashes = Off. The island's subject is
      // which WORDS to show, and words degrade to the English in the markup; a
      // flash degrades to nothing. `tests/client/viewscreen-hud.test.js` pins
      // this stamper against the shared function for every stop the controls
      // offer and for the values between them, so the two cannot drift.
      hud.effects = null;

      /** The band a rule reads, by the same thresholds `effectBand` uses. */
      hud.effectBand = function (value) {
        if (!(value > 0)) return 'off';
        return value >= 1 ? 'full' : 'reduced';
      };

      // effect key → [band attribute, custom property]. The same three pairs
      // `EFFECT_ATTRIBUTES` and `EFFECT_VARS` name.
      hud.effectBands = [
        ['shake', 'data-shake', '--a11y-shake-scale'],
        ['flash', 'data-flash', '--a11y-flash-scale'],
        ['decorativeMotion', 'data-decorative-motion', '--a11y-decorative-scale'],
      ];

      hud.applyEffects = function (intensities) {
        if (!intensities || typeof intensities !== 'object') return;
        hud.effects = intensities;
        var root = document.documentElement;
        if (!root) return;
        for (var i = 0; i < hud.effectBands.length; i++) {
          var pair = hud.effectBands[i];
          // An unreadable intensity is FULL, not off: a broken push must never
          // silently take an effect away, and `clampEffectIntensity` answers
          // the same way.
          var value = Number(intensities[pair[0]]);
          if (!isFinite(value)) value = 1;
          value = Math.min(1, Math.max(0, value));
          root.setAttribute(pair[1], hud.effectBand(value));
          root.style.setProperty(pair[2], String(value));
        }
      };

      // The game-over screen: revealed when the host enters GamePhase::GameOver.
      // `game_over_message` is null in every other phase, so a null ending both
      // clears the screen and clears it on a new run. The ending arrives as ONE
      // object with the words already chosen — `{scenario, headline, message,
      // outcome, rows}` — so the localising renderer and the raw fallback write
      // it through the same calls; only which text they chose differs. Every
      // write is guarded, because a lifecycle refresh may repeat a state and
      // an unchanged push must not dirty the DOM.
      hud.rowsKey = '';
      hud.showGameOver = function (view) {
        var overlay = document.getElementById('game-over-overlay');
        var report = document.getElementById('game-over-report');
        if (!overlay) return;
        if (view == null) {
          if (overlay.style.display !== 'none') overlay.style.display = 'none';
          return;
        }
        var outcome = view.outcome == null ? '' : String(view.outcome);
        if (overlay.dataset.outcome !== outcome) overlay.dataset.outcome = outcome;
        hud.setText('game-over-scenario', view.scenario);
        hud.setText('game-over-headline', view.headline);
        hud.setText('game-over-message', view.message);
        var rows = Array.isArray(view.rows) ? view.rows : [];
        var key = JSON.stringify(rows);
        if (report && hud.rowsKey !== key) {
          hud.rowsKey = key;
          while (report.firstChild) report.removeChild(report.firstChild);
          for (var i = 0; i < rows.length; i++) {
            var dt = document.createElement('dt');
            dt.textContent = rows[i].heading == null ? '' : String(rows[i].heading);
            var dd = document.createElement('dd');
            dd.textContent = rows[i].outcome == null ? '' : String(rows[i].outcome);
            if (rows[i].state) {
              dt.dataset.state = rows[i].state;
              dd.dataset.state = rows[i].state;
            }
            report.appendChild(dt);
            report.appendChild(dd);
          }
          var want = rows.length ? 'grid' : 'none';
          if (report.style.display !== want) report.style.display = want;
        }
        if (overlay.style.display !== 'flex') overlay.style.display = 'flex';
      };

      // The raw ending: the host's own strings written through untouched and
      // the rows' two ids as they arrived. No headline — it is a String Id this
      // renderer cannot resolve, and the sheet hides an empty one — and no
      // normalisation: that is gui/game-over-view.js's, which the module owns.
      hud.rawEnding = function (s) {
        var rows = [];
        var wire = Array.isArray(s.game_over_report) ? s.game_over_report : [];
        for (var i = 0; i < wire.length; i++) {
          var r = wire[i];
          if (r && typeof r === 'object') {
            rows.push({ heading: r.heading, outcome: r.outcome, state: r.state });
          }
        }
        return {
          scenario: s.scenario_title,
          headline: '',
          message: s.game_over_message,
          outcome: s.game_over_outcome,
          rows: rows,
        };
      };

      // ── The fallback renderer ───────────────────────────────────────────
      // Why a second renderer exists at all: the localising one lives in a
      // MODULE with three imports, and a module whose import fails never
      // evaluates. A --client-dir missing gui/strings.js or gui/host-channel.js,
      // or an engine that refuses the module, would otherwise leave `render`
      // null and every push a silent no-op — no heading, no hull, no red-alert
      // vignette and no GAME-OVER SCREEN, on the one surface the whole room is
      // watching. This is a classic script with no dependencies, so it cannot
      // fail that way. The module island takes over the moment its imports
      // resolve, which in the ordinary case is before the host's first push.
      //
      // It also stands in when the table itself failed to load, for the reason
      // the module's applyToDom guard states: without a table t() renders every
      // id as ⟨angle brackets⟩, and digits under the existing NAV/ENG labels
      // beat a frame full of those.
      //
      // It draws only what needs no String Table — the alert state, the
      // numbers, and the host's own strings written through raw. It carries no
      // English of its own on purpose: a hardcoded fallback string here is
      // precisely what AGENTS.md rule 11 forbids, and an unresolved id shown
      // raw ("server.hud_nominal") is legibly broken in the same way ⟨…⟩ is.
      hud.renderRaw = function (json) {
        var s;
        try { s = JSON.parse(json); } catch (e) { return; }
        hud.setAlert(s.red_alert);
        if (typeof s.heading === 'number') {
          hud.setText('v-nav', String(s.heading).padStart(3, '0'));
        }
        // `v-tac` is skipped: its two values are words, and red alert is
        // already shouted by the vignette and the swapped border art.
        if (typeof s.hull_pct === 'number') {
          hud.setText('v-eng', String(s.hull_pct));
        }
        if (typeof s.condition === 'string') hud.setText('v-sys', s.condition);
        if (s.ship_name) hud.setText('hud-designation', s.ship_name);
        hud.showGameOver(s.game_over_message == null ? null : hud.rawEnding(s));
      };

      hud.paint = function () {
        if (hud.json === null) return;
        try {
          (hud.render || hud.renderRaw)(hud.json);
        } catch (e) {
          // A throw here would propagate out of the host's evaluate_script and
          // be read as a failed push, which the host would retry with the same
          // payload every frame, forever. Report and keep the surface alive —
          // the same rule host_lobby_boot.js's paint() states.
          console.error('[viewscreen-hud] render failed', e);
        }
      };

      // The two entry points Rust drives (see the HUD-state push in
      // panes/ultralight.rs): a JSON ViewscreenHudState string, and this
      // display's three resolved effect intensities.
      window.__updateHud = function (json) {
        hud.json = json;
        hud.paint();
      };

      // The effects half (issue #1428). Pushed in the SAME retained command as
      // the state above and ahead of it, so the bands are in force before the
      // alert class flips and the vignette never gets a frame of unstamped
      // pulse. Retained rather than fired once, because the host re-applies the
      // whole command to a view that was reloaded or re-created.
      window.__phoenixSetHudEffects = function (intensities) {
        hud.applyEffects(intensities);
      };
    })();
  </script>

  <script type="module">
    // The module island. It imports the SHARED client modules over the host's
    // own HTTP surface — this page is served at /gui/viewscreen-hud.html, so
    // './strings-boot.js' is /gui/strings-boot.js and the table it loads is
    // /assets/strings/strings.csv, published by this same process. Nothing
    // here reaches the internet: a bridge machine with no route out still
    // localises, exactly as the native lobby surface does.
    import './strings-boot.js';
    import { applyToDom, getTable, localiseTree, t } from './strings.js';
    import { localiseHostPayload } from './host-channel.js';
    import { gameOverView } from './game-over-view.js';

    // ONE guard for the whole page: with a table, this island localises the
    // markup and installs the localising renderer; without one it does neither
    // and the classic prelude's raw renderer stays in charge.
    //
    // The rule behind it, and this page is the one that needs it: `applyToDom`
    // REPLACES each tagged element's textContent with `t(id)`, `t()` renders an
    // id it cannot find as ⟨server.hud_nav⟩, and the same is true of the four
    // status-slot values below. The English in the markup is this overlay's
    // documented fallback for a table that would not load, so the substitution
    // happens only when there is a table to substitute from. With one, this is
    // server.html's own call over server.html's own ids; without one, the frame
    // reads as it always did instead of filling with angle brackets.
    const hasTable = getTable().size > 0;
    if (hasTable) applyToDom(document);

    // The wire boundary, in the same place and through the same module the web
    // host puts it: server.html crosses `localiseHostPayload` once as the "hud"
    // channel payload enters the page (gui/host-channel.js), and so does this.
    // That is what retires the two hand-transcribed id maps this file used to
    // carry beside the readout — `condition` arrives as a String Id
    // (viewscreen_border.rs sends server.hud_nominal / server.hud_alert, never
    // the English word) and `game_over_message` as either the built-in
    // server.game_over.ship_destroyed or a scenario's own authored prose.
    // `localiseTree` substitutes only what the table actually holds, so the
    // prose passes through untouched and an id the table has lost shows raw
    // rather than being dropped.
    const strings = { localiseTree };
    const hud = window.__phoenixHud;

    // The four runtime status-slot values, through the same four ids
    // server.html's `__updateHud` resolves (server.html:2688-2702). Their
    // wording AND their number formatting live in the table's own values, so a
    // copy edit moves both Viewscreens at once and neither page spells any of
    // it out; tests/client/viewscreen-hud.test.js pins that by driving this
    // renderer with an empty table and finding digits, not English.
    //
    // Everything else it writes came off the wire already localised, and the
    // DOM plumbing is the prelude's, so this function is only the choice of
    // text.
    function renderLocalised(json) {
      let s;
      try { s = JSON.parse(localiseHostPayload(json, strings)); } catch (e) { return; }
      hud.setAlert(s.red_alert);
      if (typeof s.heading === 'number') {
        hud.setText('v-nav', t('server.hud_heading', { deg: String(s.heading).padStart(3, '0') }));
      }
      hud.setText('v-tac', s.red_alert ? t('server.hud_weapons_hot') : t('server.hud_clear'));
      if (typeof s.hull_pct === 'number') {
        hud.setText('v-eng', t('server.hud_hull', { pct: s.hull_pct }));
      }
      if (typeof s.condition === 'string') {
        hud.setText('v-sys', s.condition);
      }
      if (s.ship_name) {
        hud.setText('hud-designation', s.ship_name);
      }
      hud.showGameOver(s.game_over_message == null ? null : localisedEnding(s));
    }

    // The ending, framed by the SAME decision client.html's overlay runs
    // (gui/game-over-view.js): which headline the declared outcome picks,
    // whether the rows are the result (a `reported` ending wears no verdict),
    // and which rows survive — one missing either text is dropped, `state` is
    // lower-cased before the sheet styles on it. The payload crossed
    // localiseHostPayload above, so the message, the title and the rows' two
    // ids are already prose; the headline is this page's own String Id.
    function localisedEnding(s) {
      const gv = gameOverView({
        phase: 'GameOver',
        reason: s.game_over_message,
        outcome: s.game_over_outcome,
        scenarioTitle: s.scenario_title,
        report: s.game_over_report,
      });
      return {
        scenario: gv.scenarioName,
        headline: t(gv.headlineId),
        message: gv.bodyId ? t(gv.bodyId) : gv.bodyText,
        outcome: gv.outcome,
        rows: gv.rows.map((row) => ({ heading: row.headingId, outcome: row.outcomeId, state: row.state })),
      };
    }

    if (hasTable) hud.render = renderLocalised;

    // Paint whatever landed while this module was still being fetched — with
    // the localising renderer if this island installed one, and otherwise
    // repainting through the prelude's, which is idempotent.
    hud.paint();
  </script>
</body>
</html>

  - component: gm-t3-station-workload
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Station Workload From Distinct Human Demands
      summary: "A second peer-local GM advisory, beside the attention queue: one row per Station saying in words how much its human operator is being asked for, and expanding to the exact source demands behind the number. A demand is live owner state that a Station's human has to act on and that stops existing when they do. Three producers, each declaring a source, a canonical stable key, an owning ship/System/Station, a human-action-needed predicate and a terminal: pending Comms (the attention queue's own predicate over the same inbox), the two already-supported typed Coordination decisions (an unflown Navigation clearance and a queued Repair dispatch request), and task activations (every shipped verb documented as never counted). Zero demands is Underused, one or two Engaged, and the threshold held continuously for the authored duration is Overloaded; falling below ends the overload and resets its timer. A Station whose authored Systems are all AI-operated reads Backfill rather than a count, one whose authored Systems are all damage-disabled or explicitly offline reads Offline, a mixed Station counts only the subset whose own System is human-operated, and a Station every one of whose authored Systems is currently hosted at another Station (human-seeking migration) is omitted from the summary entirely rather than levelled. Authors tune a positive count, a positive finite duration and a separate disable in the existing [gm_attention] table. Published on the page-local gm_workload Host Channel; never a peer frame or a digest fold."
      rationale:
        - "[ai] Issue #1438 (PRD #1419 M4 stories 11/12/14, presentation contract PRD #1418). The complete producer inventory, with each predicate and each explicit never-count case, is docs/gm-station-workload-inventory.md. It is a documented TABLE rather than prose because the acceptance criterion is that every counted demand can be named and audited; an advisory whose sources cannot be enumerated is the opaque score PRD #1419 refuses."
        - "[ai] Every producer reads OWNER STATE, never a notification, a popup or any text. That is what makes deduplication fall out instead of being implemented: a Coordination popup and the repair-queue entry behind it are one piece of state, and a second worsening RepairRequest for a Station already queued is merged by the ship's own queue before this advisory ever looks. Demands are still keyed and stored in a per-Station map by canonical key, so two independent demands count twice and one demand seen twice counts once."
        - "[ai] Station ownership is command_admission::station_for_system with the live human-seeking hosts — the same resolution admission uses — so a human-seeking System's demand is attributed to the seat that is presenting it, not the seat that authored it. Whether a demand needs a person is the LIVE control policy of its own System, which is exactly what makes a mixed Station count only its human half; whether the Station is a workload at all is ship::coordination::seat_control_source over the Systems it AUTHORS, shared with the Coordination router so the two cannot disagree about whether a person is sitting there."
        - "[ai] Two different questions are asked of the same hull and they have two different answers, and conflating them was a real defect. Where a System is being operated from right now is station_for_system with the live hosts, and that attributes a DEMAND. Which Systems a Station owns is ShipConfig::systems_for_station — the authored [[system]] station blocks, the same set the lobby projects into the roster pill station_systems and the same set the router's own generic branch station_delivery_policy reduces — and that decides what the STATION IS. Filtering by live ownership gave a Station whose Systems had all migrated to a human-seeking host the empty set, which seat_control_source answers Offline for: on the stock Alliance Cruiser navigation, command and comms each own exactly one System, so each read 'No System here can be operated' the moment anybody sat down, contradicting the roster pill on the same row and the meaning of Offline itself."
        - "[ai] A Station every one of whose authored Systems is hosted at ANOTHER Station is not a seat anybody holds this tick, so it is omitted from the published summary entirely rather than given a fifth word. It is not Offline (its Systems work), not Backfill (no AI holds it) and not Underused (nobody is there to be under-used); the honest presentation of 'nobody sits here' is no row. Its demands are already attributed to and counted at the host Station by station_for_system, so the omission loses nothing and naming the Station a second time would double the fleet's apparent workload. The Station that HOSTS migrated Systems keeps counting their human-required demands, which is what makes the Captain's row carry the Comms traffic while the Comms seat is empty."
        - "[ai] A Navigation clearance counts only when it actually REACHED a person. The exactly-once issuer latches NavClearanceIssueState::issued_generation whatever the helm's control state, so the frontier alone cannot be the demand: the same latch covers an AI Helm consuming the order and a human Navigation whose clearance the router SUPPRESSED because the two of them are sitting at the same table. The producer therefore asks the router's own question — ship::coordination::route_coordination(navigation's live source, the Helm seat's delivery control) == Popup — and reads it live, so a Navigation seat a human takes over stops asking the Helm for something they can settle by talking. On the shipped hulls this is the common case, not a corner: navigation is a human-seeking Station whose host order reaches the Helm."
        - "[ai] The clearance is a task-style demand that AUTO-COMPLETES ON ARRIVAL: the hull inside the waypoint's existing tolerance, which is the hull's authored [behaviour] waypoint_arrival_radius falling back to ai::WAYPOINT_ARRIVAL_RADIUS — the same radius the AI helm's patrol cursor advances on and helm_ai's Reach completion fires on, read rather than reinvented. A human Helm that has flown the course has answered the clearance by arriving; adding an acknowledge action would be inventing work in order to measure it. Completion is latched per generation so a hull flying onward does not have the demand come back at it, and the ACTUAL waypoint is never auto-cleared — arrival completes the demand, not the course, and Navigation keeps sole ownership of setting and clearing it. It ends equally on replacement (a new generation, hence a new key) and on withdrawal. The completion is a fixed-loop owner-state check in the producer rather than a core::task_lifecycle activation: activations are authoritative state opened by the console that owns the work from a real admitted command, this advisory is peer-local presentation that must write none, and a clearance is a Channel-3 message with no console verb behind it. The per-generation latch rides in GmWorkloadWatch beside the stopwatch, because an arrival is history a restored world cannot recompute."
        - "[ai] The Repair-dispatch demand is the ship's own RepairRequestQueue on BOTH delivery arms. Before this, only the AI arm wrote it, so a request delivered to a human Repair seat lived solely as a popup — a thing that has been shown, not a thing that is still owed — and nothing could answer whether the crew were still being asked to send a team. The write rides a peer-identical CoordinationDelivery::HumanRouted the router emits alongside the popup, never the popup delivery itself: the Popup DECISION is a function of live control sources every peer holds, but the popup is raised on the presenting peer alone (LocalShip plus a seated session), so hanging ship state off it would leave two hosts of one fleet carrying different queues from identical input."
        - "[ai] Ending a repair request is a statement about DAMAGE, not about who is reading the queue. The stale-entry prune used to sit inside operate_repair_ai, after that system's control-source gate, so an entry only ever ended on a hull whose Repair seat was AI-operated — invisible while only the AI arm wrote the queue, and a stranded entry the moment the human arm did. It now runs seat-independently every fixed step in prune_repair_request_queue, ordered immediately before operate_repair_ai in the same Physics phase, so the AI still decides against an already-pruned queue exactly as before and a Backfill-to-Human flip mid-repair no longer carries its old entries for the rest of the mission."
        - "[ai] BEHAVIOUR CHANGE, accepted deliberately: writing the queue on the human arm switches on AI repair auto-dispatch in a SHIPPED configuration. operate_repair_ai is gated on the fine repair System being AI-operated, not on the seat, and assets/entities/alliance_cruiser.toml authors exactly that mix — the engineering Station's Simplified rating declares automated_systems = [\"repair\"], so ship::rating::apply_rating sets repair to Ai and every other Engineering System to Human, seat_control_source answers Human because the power Systems accept human input, and the router routes the RepairRequest Popup. Before #1438 that produced a popup and an empty queue, so the AI the rating had just created had nothing to dispatch and the hull went unswept — while the rating's own manual copy promises 'Simplified rating lets the AI run the repair teams so you concentrate on power allocation'. The silence was the pre-existing bug; the code now keeps the authored promise. RepairRequestQueue is folded into no digest, but the hull HP downstream of a dispatched team is authoritative, so this changes mission outcomes on a stock cruiser and the ratified cruiser balance matchups were re-run against it. The advisory is unaffected: collect_repairs asks needs_human about the repair System, which is Ai here, so the request is never counted as the person's workload while the AI acts on it. Because the dispatched team's hull HP is authoritative, this bumps SIMULATION_RULES to \"0.7\" in src/snapshot.rs — that write plus the now seat-independent every-step prune are both rule changes over a queue no digest folds, so a pre-#1438 save restores intact with an empty queue and then diverges at its next damage-tier crossing; SNAPSHOT_FORMAT is unchanged because the payload's shape is not. The same write also makes queue_depth non-empty on a fully human Repair console, where it was always zero: intended, and the same change rather than a second one."
        - "[ai] Not one shipped task verb is a demand. That is the finding, not a gap: a scan returns a reading, a coupling holds, a dispatched team crosses and comes home, and none of them stops until a person decides something. PRD #1419 says running tasks are not demands merely because a human started them, so the rule table records a reason per verb and a lib test reads task_lifecycle.rs and fails if a new TASK_VERB_* has no entry — the decision has to be made rather than defaulted. An unknown verb is excluded as unattributed source state for the same reason."
        - "[ai] Overloaded needs the count AND the duration; while the duration runs the Station reads Engaged and says how far through it is. The count alone would tell a facilitator a seat is drowning because three things landed in the same second. Elapsed time is counted one fixed step at a time in a peer-local watch — so a paused world banks nothing and the boundary is exact rather than frame-paced — and falling below the count DROPS the entry, which is what makes 'resets the timer' a consequence of the data rather than a second rule."
        - "[ai] The watch travels in the snapshot for gm-t3-idle-npc-advisory's reason: elapsed overload is history a restored world cannot recompute, and a save taken twenty-nine seconds in would otherwise resume forgiving the seat. It is a serde-defaulted presentation-class field folded into no digest, so an older save simply restores an empty stopwatch and the Station earns its label again."
        - "[ai] Backfill and Offline are separate answers and neither carries a count: '0 demands' about an AI-operated seat is an observation about nobody, and a seat nothing can operate is not the same as a seat an AI is running. Both are words, not colours, so forced colours cannot erase the one thing the row is for."
        - "[ai] Authored count and duration are refused at load when non-positive, naming workload_disabled as the switch that actually means off. Zero is not a sentinel: a zero count fires before anything has happened and a zero duration deletes the 'continuously for' half of the rule while still looking like a setting somebody chose. The disable silences this advisory alone — the pending-Comms queue, the idle advisory and the technical banners are untouched — which is PRD #1419 story 14."
        - "[ai] The panel submits nothing: there is no verb on it, because workload is advice and the operator acts through the surfaces the demands already live on. It keeps two pieces of private state across repaints — which Stations are expanded and where the keyboard was — and rows arrive in a fixed ship-then-Station order so nothing reorders under a reading operator as counts change. Expansion is recorded from the summary's click as well as the details toggle, because the toggle event is queued as a task and a projection arriving in the same turn would otherwise repaint the row shut under the operator."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-t3-idle-npc-advisory, gm-milestone-facilitation-assistance]

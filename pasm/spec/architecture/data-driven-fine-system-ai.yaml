      tests: [cargo test]

  - component: per-system-target-ranking-policy
    core:
      status: implemented
      confidence: confirmed
      title: Per-System Target Ranking Policy
      summary: Unions registered candidate sources, filters candidates with typed policy expressions, applies additive authored utility, retains valid targets within a switch margin, and deterministically replaces invalid targets.
      rationale:
        - Sensors, Tactical, Helm actuators, and other fine systems need different ranking policies over shared authoritative contacts and objectives.
        - Sensors designation remains advisory; another system may favour and copy it only through its own eligibility and ranking policy.
        - Stable UUID tie-breaking and authored switch margins prevent query-order dependence and target oscillation.
        - "Issue #776 landed the reusable selector as a Bevy-free sibling of the #775 channel policy (TargetSelector::select in src/ai/selector.rs): union+dedup by UUID, planar-horizon filter, self/candidate/target eligibility, additive score, switch-margin hysteresis, smallest-UUID tie-break. Sensors is the first host — operate_sensors_ai feeds the combat-lock/objective-destroy/radar-contacts sources and emits the existing admitted SetScienceTarget/ClearScienceTarget, never exceeding Sensors authority."
        - "Issue #777 added Tactical as the second host (ai_target_selection in src/console/weapons/mod.rs, TacticalTargetSelector in src/console/weapons/beam.rs). Its authored sources are sensors-designation/objective-destroy/last-attacker/radar-contacts (combat-lock is excluded — it is Tactical's own output; the ship's current lock is instead surfaced internally as a source_retained retention candidate). The default selector encodes the retired tier order objective>retained>last-attacker>nearest as additive source weights (objective 1000 / sensors_designation 500 (the Sensors-favour bonus, AC2) / retained 200 / last_attacker 100 / radar 1) plus switch_margin(50) hysteresis. Because scores are SUMMED and one entity can carry several source markers at once — the current lock is commonly ALSO the ship's own Sensors designation — the weights obey a precedence invariant: the max non-objective stack (sensors_designation+retained+last_attacker+radar = 500+200+100+1 = 801) stays below objective(1000) by more than switch_margin (801 < 1000-50 = 950). So an in-range named Destroy objective ALWAYS wins the ranking and survives hysteresis retention, even against a lock coinciding with the Sensors designation (the #777 additive-stacking regression: retained must not let sensors+retained overtake an objective). retained still exceeds last_attacker, so an established engagement is not broken off by a fresh attacker. The invariant is asserted in default_tactical_selector_objective_dominates_max_non_objective_stack. Tactical independently revalidates the advisory Sensors pick — re-running faction::is_enemy per candidate for hostility, plus visibility (host-owned damage-scaled radar horizon) and its own eligibility (AC3) — before copying it, and writes the authoritative TacticalRadarSelection DIRECTLY inside ai_target_selection (never through admission). The selector only RANKS; Tactical stays the sole writer (AC4). The direct write, on-change guard, .before(handle_set_target) ordering, and every-tick SimSet::Input cadence are preserved for read-seed-decide-write atomicity against the human SetTarget writer."
        - "Issue #778 added Navigation as the third host (operate_navigation_ai in src/console/navigation/mod.rs, NavigationTargetSelector alongside). Navigation differs from Sensors/Tactical: the selector returns one entity UUID but Navigation needs a Waypoint (a fixed Free anchor OR a live Anchored entity), so the host builds a parallel uuid→WaypointMode side-table while assembling candidates and looks the winning UUID back up through it — the entity-UUID selector spine is reused UNCHANGED. Its authored sources are navigation-objectives and chart-contacts. The host ranks the scored objective pool by score (the retired top-positive-Helm-relevant filter) and resolves the winner's directive to its destination: a Destroy target is an entity-anchored candidate keyed on the resolved entity UUID (→ Anchored), while Reach/Retreat/Patrol resolve to fixed world anchors surfaced as candidates keyed on a stable position-derived synthetic UUID (anchor:x:z, reconstructable from the ship's current Free waypoint so hysteresis retains it). Objective destinations are the sole `reachable` candidates; the default eligibility keys on candidate_fact(reachable)>0 so the canonical policy drives the waypoint from objectives alone (the retired contract), with the objective score term's authored weight (100) dominating the chart-contact term's (1) and switch_margin(0) — the objective_weight / chart_contact_weight params the #778 synthesiser declared merely restated those weights, were read by no guard, and were deleted in #885. Chart contacts (every live chart entity) are surfaced carrying only source_chart_contact — NOT reachable — so by default they merge their marker into a coincident objective destination rather than independently steering; an author may widen eligibility to admit them as live entity-anchored destinations. The selector only RANKS; the host emits the SAME admitted SetNavigationWaypoint/ClearNavigationWaypoint through the shared validate_and_admit seam that a human console uses (AGENTS.md rule 6), so navigation-waypoint-controller stays the sole writer and human-/AI-authored waypoints get identical ownership, refresh, replication, and despawn-clearing (refresh_anchored_waypoint is origin-blind). Publishing a waypoint is NavigateTo-independent: the shared origin-agnostic issue_navigate_to_clearance is unchanged and untouched by #778."
        - "Issue #785 added Repair as the FOURTH host (operate_repair_ai in src/console/repair/server.rs, RepairTargetSelector alongside) and RETIRED the hardcoded (tier desc, deficit desc) comparator outright. Two firsts. FIRST — CANDIDATE IDENTITY IS NOT AN ENTITY UUID: SelectorCandidate.uuid is a plain String, so Repair keys candidates on the STATION ID and the winning key IS the RepairTarget, needing no side-table at all (contrast #778 Navigation's uuid→WaypointMode map, whose synthesised anchor:x:z keys were the precedent for non-UUID identity). REPAIR_CORE_BUCKET_KEY (\"core\") is the one key that maps to RepairTarget::Core instead of RepairTarget::Station(..). SECOND — SEQUENTIAL MULTI-PICK: one select() call per FREE TEAM in ascending slot index, each over a candidate set rebuilt with the `assigned` fact set for every station already committed to plus every station an earlier team took this same tick, so the authored eligibility (not host code) is what makes N teams pick N DISTINCT stations. Determinism by construction: ascending team order, candidates built in sorted station-id order, exclusion in a BTreeSet (never HashSet iteration), residual ties falling through to the selector's smallest-key rule. It is deliberately greedy-with-exclusion, not an optimal assignment — that matches the retired behaviour. Ranking stays at STATION granularity because the typed DispatchRepairTeam input only addresses stations and the core bucket; per-system damage is exposed as candidate FACTS (tier_ordinal, deficit, damage_fraction, worst_system_damage_fraction, system_count, is_core, source_repair_request, assigned — seeded by seed_repair_facts, with free_team_count/total_hull_health_fraction/power_rating/red_alert seeded SELF-side by seed_repair_self_facts — the SELF fact is named for HEALTH because it is total_current/total_max, the INVERSE sense of the candidate-side damage_fraction) rather than as a new RepairTarget variant the human wire could not send. Which fine system inside the winning station heals first remains the shared resolve_repair_target's call, unchanged from #830 (§2 symmetry). The authored sources are damaged-stations (the coordination-delivered RepairRequestQueue — #830 removed the raw hull poll and #785 does not bring it back) and core-bucket (surfaced but carrying no repair request of its own, so under the canonical eligibility it enriches rather than independently steers, exactly like Navigation's chart-contacts). The core bucket is the one candidate that owns NO station in ShipConfig (validation forbids a station with that id), so it is read off the hull's own core entry rather than the station scan — both for its damage aggregates when a RepairRequest already names it (the aggregates are merged onto the request, which keeps its reported tier/deficit) and for the request-queue prune, which would otherwise evict every core request for owning zero station systems. Repair used the SELECTOR and not the #775 channel/verb model because 'eligibility + additive utility over a VARIABLE candidate set' is selector vocabulary; #783 Shields stayed on channel/verb precisely because its arcs are a fixed 4-set of in-ship indices."
        - "Issue #786 added Comms hail targeting as the FIFTH host (operate_comms_ai in src/console/comms/server.rs, CommsTargetSelector alongside) and RETIRED the hardcoded filter+find_map argmax outright. It is the CLEANEST identity fit of any host so far: hail targets are contacts with REAL entity UUIDs, so SelectorCandidate.uuid is genuine entity identity and the winning uuid drops straight into SystemControlPayload::Hail { target_uuid } — no side-table at all, contrasting #778 Navigation's synthesised anchor:x:z keys and #785 Repair's station ids. It is also the FIRST selector host to pass the READ-ONLY scenario flag chain to select() — #776 through #785 all passed &[] — so an authored eligibility/score guard may gate hails on scenario flags and counters (the read-only guarantee is structural: select takes &[&FlagStore] and every FlagStore mutator needs &mut self). switch_margin is 0 and `current` is None: a hail is a ONE-SHOT event, not a retained target, so there is nothing for hysteresis to hold. The authored sources are hail-objectives (positive, Comms-relevant Hail directives whose authored target NAME resolves through the unchanged resolve_hail_target) and comms-contacts (the authoritative CommsRuntime.contacts roster, which carries no source_hail_objective marker and so ENRICHES a coincident directive rather than independently hailing — the #778 chart-contacts pattern). Candidate facts (seed_comms_hail_facts): source_hail_objective, source_comms_contact, objective_score, in_range, is_urgent, has_open_hail_thread, has_unread_from_sender, mandatory; SELF facts (seed_comms_self_facts): power_rating, comms_available, red_alert, contact_count. The three AC2 gates are all authored over authoritative readings, and all three are NAMED in the canonical eligibility rather than merely seeded — contact resolution via resolve_hail_target, comms RANGE via candidate_fact(in_range) seeded from CommsRuntime.range_flags honouring range_active exactly as current_sender_in_range does (handle_hail KEEPS its own hard server-side range gate: defence in depth, not relocation), and system availability via self_fact(comms_available) read off EntitySystemHull. Because the selector has no multiplicative term, the continuous objective score enters the ranking as a BANDED ladder (params score_band_low/mid/high = 25/45/75, each rung's magnitude the score term's own authored weight of 100 — the score_band_weight param the #786 synthesiser declared was read by no guard and was deleted in #885) placed where the shipped content actually authors base_priority (20/30/35/40/45/50/80/100), splitting that population four ways; bands outside that range would fire for all or none and collapse the ranking onto the smallest-UUID tie-break — the #785 band-placement lesson applied."
        - "[ai] Issue #1013 CHANGED the shipped Repair eligibility, dropping the `and candidate_fact(tier_ordinal) < 3` clause from all three authoring sites (assets/entities/fragments/ai/fleet_baseline.toml, alliance_courier.toml, ship_requiem_courier.toml). #785 authored that clause because a repair team could not then lift the Destroyed latch, so dispatching one would have wasted it indefinitely — the guard refused the worst-damaged candidate the ranking could produce. #1013 makes an on-site team SWEEP its station and repair destroyed systems (SystemHull::restore has never had a tier gate, and tier_for tests current == 0.0 before any ratio, so the first restored HP un-latches the system), which turns that guard from a protection into the thing that strands a station nothing else in the game can clear. The tier-3 rung is now REACHABLE and the only excluded tier is Operational (0), which has nothing to repair. This is an eligibility change, not a ranking change: the tier and deficit ladders are untouched, and a destroyed station's damage_fraction of 1.0 already sorted it to the front. The change is coupled to the host half in the SAME slice — damage_sync's tier-crossing detector now files a RepairRequest on a crossing INTO Destroyed instead of raising the captain Alert and returning — because either half alone is a regression: an eligible Destroyed candidate that no request ever names is never a candidate at all, and a request the eligibility refuses leaves a free team idle beside the one station only it can fix. authored_ai_pins::repair_eligibility_clauses_each_gate_independently keeps the per-clause gating property with the tier-3 row INVERTED to a positive case, the Operational row still proving the tier clause can read false."
    architecture:
      kind: selection-policy
      authority: authoritative
      reads:
        - scored-objective-pool-state
        - objective-target-resolution-state
        - radar-contact-projection-state
        - sensors-target-state
        - weapons-target-state
        - navigation-waypoint-state
        - spawned-entity-state
        - recent-combat-activity-state
        - repair-team-state
        - authoritative-damage-state
      # Ownership of fine-system-ai-policy-state moved to
      # fine-system-ai-policy-runtime with issue #882 (real private state now
      # exists); the selector remains a WRITER of its selected-target facet.
      writes: [fine-system-ai-policy-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ai/selector.rs, src/world/flags.rs, src/ship/sensors.rs, src/console/weapons/mod.rs, src/console/weapons/beam.rs, src/console/navigation/mod.rs, src/console/repair/server.rs, src/console/comms/server.rs, src/entities/config.rs]
      symbols: [TargetSelector, select, validate_fine_system_ai_selector, operate_sensors_ai, ai_target_selection, TacticalTargetSelector, operate_navigation_ai, NavigationTargetSelector, operate_repair_ai, RepairTargetSelector, seed_repair_facts, seed_repair_self_facts, operate_comms_ai, CommsTargetSelector, seed_comms_hail_facts, seed_comms_self_facts]
      tests: [cargo test]

  - state: fine-system-ai-policy-state
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy State
      summary: Private per-fine-system active state, typed local memory, deterministic random occurrence counts, selected target, and bounded history required by the inline policy.
      rationale:
        - Policy state is private and cannot become a hidden ship-wide state machine.
        - "[ai] Cross-system behaviour observes public authoritative simulation facts rather than another policy's state name or memory."
        - "Policies reset when AI gains control and when an unavailable system recovers. Issue #882 makes this concrete for real retained state: AiPolicyRuntimeState::reset returns the machine to its authored initial state and authored memory; the host applies it when the system is not AI-operated, when its capability is absent/disabled, and on LOD demote/promote (the state component is inserted/removed with AiHighFidelity in lod_ai_ships, so a re-promoted ship never resumes a stale mid-manoeuvre state). The marker and every per-ship AI component that travels with it are named ONCE, as ai::server::AiHighFidelityComponents / ai_high_fidelity_components, and inserted from that one definition by BOTH spawn paths — lod_ai_ships for NPCs and server_app::spawn_game_start_entities for the player ship, which does not go through entities::spawner. That is structural: a per-ship AI component added to one path but not the other used to fail silently (the non-optional query simply skipped the ship), which had already happened three times."
        - "Issue #882 REALIZES the active-state and typed-local-memory facets, which were the two clauses of this state that had no implementation through twelve stateless hosts. Runtime state lives in a per-FINE-SYSTEM component (HelmBoostAiPolicyState is the first) holding AiPolicyRuntimeState { current, entered_at_secs, memory: AiPolicyMemory }, sibling to — never inside — the immutable authored policy component, so ticking a machine does not dirty change detection on authored data. There is deliberately NO ship-wide ShipAiState: that absence, plus the fact that the memory(...)/state_time bag handed to an evaluation is seeded from the owning system's OWN component and from nothing else, is the STRUCTURAL enforcement of 'cannot become a hidden ship-wide state machine' — a sibling system's evaluation call simply never populates another's bag. State time is (tick clock - entered_at_secs), derived from the shared AI tick cadence (AiPolicyTickClock advanced one authored ai_helm_tick_hz period per gated run), never Time::delta and never a policy-owned Timer. TYPED LOCAL MEMORY IS WRITTEN BY THE HOST, NEVER BY AUTHORED CONTENT: there is no authored write verb, and a policy can only READ its own slots through memory(name). ai_policy_state_tick is the writer for the Boost demonstrator — it folds a running maximum of the hazard the ship has faced into memory(peak_hazard_urgency) every gated tick, and increments memory(engagements) whenever it commits a transition into a state whose own rules engage boost (the host asks the policy what the entered state does on its channel, so the counter needs no knowledge of authored state names). That host-writes / policy-reads split is the same one #779/#780 use for continuous magnitudes, and it is what makes memory different from param: the values are retained across ticks, survive the transitions that follow them, and are restored to their authored declarations ONLY by AiPolicyRuntimeState::reset. The demonstrator reads them back — cruise re-enters surge only while memory(engagements) < param(max_engagements) — so the write/read loop is closed end to end (host_written_memory_persists_across_ticks, host_written_memory_survives_a_transition, authored_guard_reads_the_host_written_memory, host_written_memory_is_cleared_by_the_reset). This is the retention #883's closest-approach detector needs (memory(min_range_seen), memory(prev_closing_rate))."
        - "Issue #883 generalised host-written memory off the Boost demonstrator and onto all three travel-relevant axes, with TWO slots that are host-named and doctrine-agnostic rather than specific to this hull. memory(min_range_seen) is a running MINIMUM of fact(range_to_target), SCOPED TO THE CURRENT STATE — tick_policy_machine folds it every gated tick and RESETS it to the current range on every committed transition. That scoping is what lets a machine cycle through repeated attack runs with the host knowing no authored state name: the minimum a state's guards compare against is always the minimum seen in that state. memory(escape_heading_rad) is the ship's yaw captured at the instant a transition commits, so any state may be authored to fly a heading frozen at the moment it was entered rather than one re-solved every tick. Both are written by ai_policy_state_tick and only READ by authored guards / by the host — there is still no authored write verb. Because the predicate grammar compares ONE atom to a literal or a param (deliberately, so guards stay a flat readable table), the range-versus-minimum comparison is exposed as a host-DERIVED fact, fact(range_above_min_seen) = range_to_target - memory(min_range_seen), seeded per fine system from that system's OWN bag by seed_memory_derived_facts — two siblings looking at the same world can legitimately hold different minima and must not see each other's."
        - "Issues #788/#789/#790 REALIZE the last two facets of this state — deterministic random occurrence counts and bounded history — which had stood proposed since the component was written. (1) OCCURRENCE COUNTS. memory(orbit_occurrences) (ORBIT_OCCURRENCES_MEMORY) is a host-written counter in the memory(engagements) / memory(peak_hazard_urgency) family: it counts how many times this machine has entered an ORBITING state since its last reset, and it is the occurrence field of a composite seed key. memory(orbit_direction) (ORBIT_DIRECTION_MEMORY) holds the +1.0/-1.0 the host drew from crate::composite_rng::signed_choice over a (world, ship, system, transition, occurrence) key on the tick that state was entered. The determinism contract is the key, not a sequence: there is no RNG cursor and no per-policy stream, so the same seeded scenario reproduces the same choice while two ships entering an orbit on the same tick do not both break the same way, and one ship orbiting twice against the same target does not pick the same direction twice. STEERING_SEED_SYSTEM_NAME pins the system component of the key as a stable STRING rather than a SystemId, so the derived value cannot move when an unrelated registry detail changes. ONE direction slot serves both orbit legs (recovery and combat) because a ship circles one way at a time and a state resolves exactly one yaw verb; what differs between the legs is the RADIUS, which has its own field. No authored guard reads either slot — the host writes them and the host reads them back when it builds the pass surface, so the host-writes/policy-reads split is unbroken. (2) BOUNDED HISTORY. crate::bounded_history::BoundedHistory is a plain bounded window of f64 with authored capacity, re-applied every tick so memory is constant and 'recently' always means the same span of shared AI ticks. It is deliberately NOT a memory slot: private memory is a bag of scalars that can carry a running aggregate but not a window, and a running minimum never recovers once one bad sample folds into it — a destroyer that dipped inside its ring once could then never satisfy a re-entry gate built on one. It is also deliberately HOST-side and per-SHIP (HelmRecoveryHistory) rather than per-fine-system, in the same family as the derived pass surface: it is a reading of the world rather than a private belief, and all three of a hull's machines must agree about it or they would reach different legs. The host reduces each window to a single scalar fact — fact(safe_distance_held) from the level window and fact(separation_progress) from the trend window — so the policy still reads scalars and never a window. Both modules (crates/phoenix-math/src/composite_rng.rs, crates/phoenix-math/src/bounded_history.rs) are pure, Bevy-free and domain-neutral, with plain scalar signatures so they stay extractable."
        - "Issue #789 established that ONE bounded-history type does not mean one window. HelmRecoveryHistory carries TWO windows over the SAME range reading with INDEPENDENT authored capacities, because they answer different questions: `ranges` (safe_distance_window_ticks) is a LEVEL question — has every sample stayed past the safe ring — and `separation` (pressed_window_ticks) is a TREND question — is the gap actually growing, which only the two ends of a window can answer. Sharing one window would have silently coupled the two tunings, so lengthening the re-entry standoff would have made the hull slower to notice it was pinned; that is not a trade a designer asked for. Both windows share the fold site and the target scope: a target switch clears BOTH, because distance held against a ship that is no longer the threat says nothing about the one that is, and neither does distance opened from it. fact(separation_progress) is deliberately ABSENT rather than zero until its window is full and on a hull that does not author the complete pressed parameter set, so a `fact(separation_progress) < …` guard reads false instead of firing permanently on a freshly cleared window — the reading a zero would give, at the worst possible moment to act on it."
        - "Issue #789 also pins the SCOPE the bounded-history facts are available in, which is narrower than the travel facts around them. safe_distance_held, separation_progress and inside_threat_range are seeded only by ai_policy_state_tick (seed_pressed_facts and its siblings), so they reach TRANSITION guards and NOT a state's continuous rule guards. That is structural rather than incidental: a window must be folded exactly ONCE per shared tick, and four per-axis actuator hosts each folding it would advance it four times as fast, making the window mean a quarter of the span the designer authored. The shipped destroyer doctrine authors these names in transitions only."
        - "Issue #890 (59ce639f) moved bounded history INSIDE this state, alongside the typed memory and state time it already held. AiPolicyMemory now carries an AiHistory of capacity-bounded windows keyed by (fact, capacity), folded by the single fold_history entry point that tick_policy_machine calls once per fine system per shared AI tick. This does NOT retire the #788/#789 host-side HelmRecoveryHistory: that one is per-SHIP and reduced to ordinary scalar facts, and the bullets above still describe it accurately. What changed is that a designer can now author a window directly in a guard instead of needing a bespoke Rust fact invented per question. The private-state contract is unchanged and is what made this placement work: a system seeds its own bag from its own component, so one fine system can never observe another's window, and AiPolicyRuntimeState::reset rebuilds the windows from scratch when AI (re)gains control — a window carried across a control flip would answer for a span the ship was not being flown by this policy."
        - "Issue #776 realizes the selected-target facet: the Sensors selector's retained pick is the ship's own SensorRadarSelection, recomputed each eligible tick and held through the authored switch margin. Issue #777 extends the same facet to Tactical: its retained pick is the ship's own TacticalRadarSelection, surfaced as the internal source_retained retention candidate and held through the authored switch margin. (Typed local memory was realized by #882; deterministic random occurrence counts and bounded history by #788/#789/#790 — see the bullets above. This bullet is retained for the selected-target facet's provenance.)"
        - "Issue #785 makes the 'policy state is never private' rule concrete for Repair: its retained pick is the AUTHORITATIVE TeamSlot, not AI-owned memory. operate_repair_ai derives the selector's `current` argument per tick from the slot via committed_station_for_slot and #785 adds NO new AI state component. That is the whole AC5 reset story — a completed repair returns the slot to Idle, so `current` is None and the next selection starts from initial policy state, while the other carrier of retained state (RepairRequestQueue.entries) is pruned the moment EVERY system in the request's group is Operational — the station's own systems, or every ownerless hull row for the `core` bucket. (The predicate read non-Operational/non-Destroyed until issue #1013 retired the Destroyed exclusion, so a destroyed system now counts as work remaining rather than as a reason to evict the request; see the #1013 bullet on per-system-target-ranking-policy.) Human takeover needs no reset either: the operate_ai gate stops emission and admission independently rejects an ai: emission on a human-held Repair system."
    architecture:
      classification: authoritative
      # Ownership returns to the policy runtime with issue #882: the #775/#776
      # reassignment to per-system-target-ranking-policy was correct only while
      # the selector's retained pick was the ONLY facet of this state that
      # existed. Now that real private state (active state, typed local memory,
      # state time) is written by the policy runtime's state tick, the runtime
      # owns it and the selector remains a writer of the selected-target facet.
      owner: fine-system-ai-policy-runtime
      writers: [fine-system-ai-policy-runtime, per-system-target-ranking-policy]
    implementation:
      status: declared
      paths: [src/ai/policy.rs, src/world/flags.rs, crates/phoenix-math/src/bounded_history.rs, crates/phoenix-math/src/composite_rng.rs]
      # Per-fine-system component (e.g. HelmBoostAiPolicyState) holding
      # AiPolicyRuntimeState { current, entered_at_secs, memory }; memory is
      # AiPolicyMemory, which since #890 also carries the capacity-bounded
      # AiHistory windows. The selected-target facet is carried by the
      # selector's own retained pick (SensorRadarSelection,
      # TacticalRadarSelection), not by this component.
      symbols: [AiPolicyRuntimeState, AiPolicyMemory, AiHistory]

  - component: fine-system-ai-policy-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy Runtime
      summary: Evaluates a fine system's inline policy from an immutable per-tick fact snapshot, resolves the highest-priority matching rule per typed output channel, and emits the resulting typed system input; a policy may optionally opt into a private state machine.
      rationale:
        - "[ai] All fine systems must observe one consistent tick snapshot rather than partially applied decisions from earlier systems."
        - "AMENDMENT to that first clause, and to PRD #774's implementation decision 'every policy reads the same immutable SNAPSHOT': the guarantee is real but there is no snapshot OBJECT and none is planned. It comes from SimSet ordering — every system writes its own blackboard exactly once per tick in SimSet::Publish, ship-wide aggregators run strictly after in SimSet::PublishAggregate, and any consumer ordered earlier (Input/Physics/Damage/Modifiers) therefore reads the values written on the PREVIOUS tick. src/sim_sets.rs:9-15 states this in the set's own doc comment: 'the frozen-snapshot guarantee comes from this set ordering, not from a separate snapshot type.' Introducing a literal per-tick snapshot type would be a rewrite of every host's fact seeding for zero behavioural gain, so the spec (§9) now names the Publish/PublishAggregate discipline as the mechanism and keeps only the requirement that matters — all policies evaluate from state frozen at the same point in the tick. The deliberate departure is #791's torpedo count, where the SAME-tick reading is the correct one and the host pins .after(handle_fire_torpedo)/.after(tick_torpedo_lifecycle) rather than take the one-tick-stale blackboard copy. The CADENCE half of the same PRD decision was a different matter and was genuinely unmet until #889, which put every AI decider on one authored latch; what remains unmet there is the authored PER-SYSTEM multiple — see ai-policy-tick-scheduler, which stays proposed for that reason alone."
        - Typed verbs restricted by system kind preserve AI and human input symmetry and prevent arbitrary simulation writes.
        - "Resolving the highest-priority matching rule per channel keeps each tick's decision a pure function of the snapshot with no retained policy state. AMENDED BY #882: this is now conditionally false — a policy that OPTS IN to a state machine also reads its own retained state, state time and private memory. The unconditional part that survives is the invariant below."
        - "Issue #882 INVARIANT (the spine rule this runtime is now held to): stateless resolution is unchanged and the machine is strictly opt-in. AiPolicy::resolve_channel keeps its signature AND behaviour — its only edit was factoring its scan loop into the shared best_in helper, which the per-state path also calls, so priority/tie-break semantics are uniform. AiPolicy gains ONE field, machine: Option<AiPolicyMachine>; machine == None means no state, no memory, no transition scan is ever entered, and all twelve shipped Group A hosts are exactly that shape (pinned by stateless_policy_resolution_is_unchanged_by_the_optional_machine and, at a host, stateless_boost_policy_never_enters_the_state_machine_path). AC2's 'at most one transition per eligible tick' is enforced by the EVALUATOR, not by host discipline: resolve_transition returns Option<&AiPolicyTransition>, so no host can chain two. The one host system ai_policy_state_tick COMMITS the entered state before any output resolves, so the new state's continuous rules supply outputs in the same tick and every fine system observes the same committed state."
        - "Issue #882's demonstrator host is Helm BOOST — deliberately the smallest credible one, since its shipped default policy is idle so nothing that ships today changes behaviour. ai_helm_boost resolves resolve_channel_in_state against HelmBoostAiPolicyState when the policy declares a machine, and the frozen stateless resolve_channel otherwise. The destroyer doctrine this spine exists for is issue #883, deliberately NOT built here."
        - "Issue #883 built the doctrine #882's spine existed for, and in doing so CLOSED THE #779 EMPTY-FACTS GAP ON THE TRAVEL AXES — the last two hosts still constructing AiFacts::new(). seed_helm_travel_facts is the sibling of #780's seed_helm_actuator_facts: from the frame's MERGED view (the same surface the travel solution steers by, so a guard can never fire on a target the travel decision cannot see) and ShipPhysics it seeds target_valid, range_to_target, closing_rate, bearing_to_target and speed_fraction into ai_helm_thrust, ai_helm_steering, ai_helm_boost and the state tick alike. AiWorldEntity carries NO velocity field, so the closing rate's relative velocity is RECONSTRUCTED from (yaw, forward_speed) for both parties inside the pure crate::ai::target_relative_motion — the same reconstruction avoidance_steering already performs; policy.rs and the geometry stay Bevy-free. ai_policy_state_tick is generalised from Boost-only to all three axes through tick_policy_machine (one machine per gated tick, with an optional per-axis extra memory fold, so Boost's peak_hazard_urgency / engagements stay Boost's). The host-folded min_range_seen is scoped to the STATE and to the TARGET'S IDENTITY: seed_helm_travel_facts returns the uuid it seeded the geometry from, tick_policy_machine stores its fingerprint in MIN_RANGE_TARGET_MEMORY beside the minimum, and a change restarts the fold at this tick's range. Scoping it to the state alone let a mid-inbound target switch inherit a stranger's minimum, so range_above_min_seen (range_to_target - memory(min_range_seen)) could read as a huge re-opening the moment a further contact took over the bogey role and fire a closest approach on a run that had not begun. The frozen escape heading is expressed as a DESIRED FACING through the shared motion planner, not as a raw SteeringInput override: build_pass_surface publishes the derived HelmPassSurface (active / escape / escape_heading_rad + the four authored manoeuvre scalars, the leg read off the AUTHORED yaw verb so the host learns no state name), and helm_motion_planner selects the pure crate::ai::plan_fly_through_pass arm from it. Consequently #780's hazard contribution still composes onto the escape — it is a steering force folded before the same clamp — and bending the escape changes no pass state at all. The planner consumes the surface published on the PREVIOUS AI tick (the state tick runs .after it, per #882's hazard-freshness ordering); that delays the heading FREEZE by one gated tick and nothing else, and is frame-rate-independent because both run on the shared latch. On the Harrow the delay costs 1.05 deg of extra yaw (0.74 world units of lateral offset) against a 6-unit closest_approach_hysteresis and a 260-unit commit_range, so it can neither delay nor mis-fire the transition — but it does NOT wash out afterwards, and that is the honest half of the disclosure: 1.05 deg is 0.018 rad, just INSIDE the hull's authored tracking_deadband_rad of 0.02, so steer_toward reads the residual as zero error and commands no correction. The escape flies with a standing offset of up to 1.05 deg from the frozen heading rather than converging onto it. That is inside the hull's own authored tolerance for 'on heading' by definition (the deadband IS that tolerance); a hull authoring a deadband tighter than its one-tick yaw rate would instead have the planner steer the residual back out. The ESCAPE leg is target-FREE in the planner as well as in the pure arm: plan_fly_through_pass never reads target_pos on it, so helm_motion_planner gates only the INBOUND leg on a resolvable target and lets the escape run whether or not the target still exists or is still visible. Gating both would have made the commitment silently depend on the thing the pass exists to destroy — the common combat case is that the run KILLS the target — and the ship would drop to the doctrine arm with no objective geometry, brake to a standstill mid-escape, and stop holding the frozen heading while the independent Boost machine kept the drive lit for the rest of the dwell. Neither escape state carries a target_valid < 1 transition (only inbound does), which is the authored half of the same statement. helm_destroy was deliberately NOT reused or mode-flagged: it brakes through a decel zone and parks at stop_dist re-facing the target, which is a station-keeping orbit and the exact opposite of a pass."
        - "Issues #788/#790/#791/#792 extended the #883 pass surface from ONE host-flown leg set to four, without teaching the planner a single authored state name. build_pass_surface still reads the leg off the AUTHORED yaw verb, so each new verb adds a boolean to HelmPassSurface (recover / reengage for #788, orbit for #790, torpedo_bearing for #791, artillery for #792) and helm_motion_planner selects the matching pure arm in crate::ai — plan_fly_through_pass (#883), plan_recovery_orbit (#788, reused by #790 at a different radius and gate) and plan_artillery_position (#792). Every arm returns the same (facing, throttle) pair and every one of them has #780's hazard contribution summed onto its facing before the shared clamp, so avoidance still composes onto a ring, a bow-on hold and a station-keep exactly as it composed onto the escape leg — a detour bends a leg and never changes a state. #792's arm shares predict_intercept_heading with the weapons layer (src/weapons/blaster.rs) rather than re-deriving a lead: the bow's aim and the bolt's aim come from one solver, so the hull points where the round will actually go."
        - "Issue #790 fixed a latent gate in that surface. HelmPassSurface.active used to mean exactly 'the fly-through pass is authored', because the pass was the only host-flown leg set and the destroyer happens to author both it and the recovery legs. It now means 'at least ONE complete leg set is authored', with the pass's own two throttles split out into a separate pass_legs flag that gates only the INBOUND and RE-ENGAGE legs. Without the split, a hull that circles and never makes a pass — the cruiser — would have flown ordinary doctrine travel for ever, silently, because it authors no approach_speed or escape_speed to satisfy the old gate and every other assertion about it would still have held. pass_legs stays separate rather than folded into active because those two legs are the planner's FALLBACK when no other leg is selected, and a fallback flown on an unauthored throttle is a ship coasting at zero into a fight."
        - "Issue #791 pinned the state tick's ORDERING against the torpedo pipeline, because the cruiser's torpedo_run leg reads a count that two other systems write in the same set. ai_policy_state_tick seeds fact(torpedoes_in_flight) from the ship's LIVE TorpedoSystemResource and NOT from the blackboard copy, which is written a set later and is one tick stale; both writers of in_flight also run in SimSet::Physics, so the reading would otherwise be run-order-dependent. Two edges pin it: .after(handle_fire_torpedo), so a salvo launched THIS tick is already visible and the doctrine cannot read 'no salvo in flight' on the very tick it launched one and let go of its target a tick early; and .after(tick_torpedo_lifecycle), so a round that hit, missed or expired this tick is already gone. The count a transition guard sees is therefore the settled one for this tick in both directions. Both edges are absent from the ShipPlugin-only test fixtures, where an ordering edge against an unregistered system type is simply an empty constraint."
        - "Issue #883 also hardened the #882 fallback that had been silently degrading. resolve_helm_channel is now the single stateless/stateful resolution seam for all three helm mode hosts, and its (Some(machine), None) arm — content declares a machine but the ship carries no runtime-state component — carries a debug_assert! naming ai_high_fidelity_components as the fix. That case is the exact failure mode of #882's blocking bug and had already recurred three times; release builds still degrade rather than kill a live scenario, but development can no longer miss it."
        - "Issue #882 says 'no state machine' is no longer unconditionally true of this runtime — but private memory and state time remain unreadable outside their owning fine system, by construction rather than convention (see fine-system-ai-policy-state)."
        - "Issue #775 landed the runtime with Captain Red Alert as the first host (operate_captain_ai resolving the boolean red_alert channel to the set_red_alert verb)."
        - "Issue #779 added the Helm travel axes as the first CONTINUOUS-actuator hosts. Engines (ai_helm_thrust, longitudinal channel, actuate_desired_travel verb) and Steering (ai_helm_steering, yaw channel, actuate_desired_facing verb) are authored independently via HelmEnginesAiPolicy / HelmSteeringAiPolicy. Because thrust/yaw are continuous geometry values, not fixed payloads, the policy verbs are value-less MODE verbs: resolve_channel selects whether to actuate this tick, and the host reads the continuous magnitude from the shared DesiredMotion planner fact (decode_thrust_from_velocity / decode_steering_from_facing). A None resolution means 'hold' — no command emitted. This keeps src/ai/policy.rs Bevy-free with no geometry and no state machine. They run on the shared ai_helm_tick cadence (see ai-policy-tick-scheduler)."
        - "Issue #780 completed the fine-actuator surface: Lateral Thrust (ai_helm_lateral_thrust, lateral channel, actuate_lateral_thrust verb), Vertical Thrust (ai_helm_vertical_thrust, vertical channel, actuate_vertical_thrust verb), Impulse (ai_helm_impulse, impulse channel, engage_impulse verb), and the NEW Boost host (ai_helm_boost, boost channel, engage_boost verb) all resolve their own value-less MODE verb via HelmLateralAiPolicy / HelmVerticalAiPolicy / HelmImpulseAiPolicy / HelmBoostAiPolicy. CRITICALLY, #780 resolves the #779 empty-facts sharp edge: the travel-axis hosts pass an empty AiFacts, so a fact(...)-referencing guard could validate but never fire; each secondary host now seeds hazard + capability/availability facts host-side (seed_helm_actuator_facts — hazard_urgency, moving_hazard_threat, hazard_present, impulse_available, boost_available, vertical_offset) from the shared HazardAssessment before the gate, so AC5/AC6 guards actually evaluate. Facts are seeded on the Bevy side; policy.rs stays Bevy-free. Defaults preserve the pre-#780 baseline (lateral/vertical unconditional actuate, impulse unconditional permit, boost idle). Boost emits SetBoost through the same admission seam a human uses; process_helm_inputs applies it in Physics same-tick (issue #881 retired the LocalShip-only handle_boost_messages into that shared per-entity applier, so an NPC's boost policy actually engages)."
        - "Issue #781 added the weapon BANKS as action-verb hosts. Phaser banks (ai_phaser_auto_fire, phaser_fire channel, fire_phaser verb) and blaster banks (tick_blaster_auto_fire, blaster_fire channel, fire_blaster verb) each resolve their OWN per-bank policy from PhaserBankAiPolicies / BlasterBankAiPolicies before firing. The host first resolves the bank's live readiness (target lock, off-cooldown, in range, in arc) and seeds a per-bank fact snapshot (seed_phaser_bank_facts / seed_blaster_bank_facts — target_valid, on_cooldown, cooldown_remaining, in_range, in_arc, and frequency for phasers) so a fact(...) guard actually evaluates (the #779 empty-facts edge, closed host-side; policy.rs stays Bevy-free). Only a bank whose policy fires is selected, and it emits the SAME typed input a human does — FirePhaser (phasers, already admitted since #846) / ChargeBlasterStart (blasters) — via emit_ai_command, never spawning attacks or mutating damage (AC5). Per-bank independence (AC7): one idle bank does not disarm another because each bank's policy is resolved separately. AC3 phaser frequency/sustained-lock and AC4 blaster fixed-launch non-homing are preserved: the bank policy governs only WHETHER to open fire, not beam sustain or projectile intercept."
        - "Issue #782 added the torpedo TUBES and shared MAGAZINE as action-verb hosts across a two-stage pipeline owned by different fine systems. ai_torpedo_load resolves each tube's torpedo_load channel (load_torpedo verb) over a seeded snapshot (seed_torpedo_tube_load_facts — loaded_count, target_count, ai_target_count, magazine, operates_ai) and emits the SAME admitted SetTorpedoVolleyTarget a human does; ai_torpedo_auto_fire resolves each tube's torpedo_launch channel (launch_torpedo verb) over seed_torpedo_tube_launch_facts (loaded, target_valid, in_range, in_arc, target_facing_shields) and emits the SAME admitted FireTorpedo. Both read TorpedoTubeAiPolicies. The shared magazine's grant policy (TorpedoMagazineAiPolicy) is resolved INSIDE the single consumer handle_torpedo_magazine_inter_system over seed_torpedo_magazine_facts (magazine, in_flight) right before the authoritative claim_magazine_round — so torpedoes_remaining keeps exactly ONE writer and same-tick queue-order contention stays deterministic (AC6). The #779 empty-facts edge is closed host-side (facts seeded before every gate; policy.rs stays Bevy-free). AC3 reserve-at-load is unchanged: LOAD flows through ClaimTorpedoRound, LAUNCH consumes already-reserved loaded_count and never touches the counter. AC5: in-flight torpedo counts are published on the TorpedoMagazine blackboard (torpedoes_in_flight) in SimSet::Publish, readable by other policies next tick."
        - "Issue #783 converted the Shields Backfill focus onto this spine while RETAINING its arc-ranking kernel. ai_shield_focus attaches a per-ship ShieldsFocusAiPolicy(AiPolicy) and resolves the shield_focus channel to the value-less focus_shield_arc verb (a gate: act vs idle/hold), then — when it fires — runs the unchanged tick_shield_focus_ai kernel to pick WHICH of the four arcs to focus (damage-concentration primary, health-imbalance fallback) and emits the SAME admitted SetShieldArcFocus a human does. Unlike #781/#782 the arc set is a fixed 4-set of in-ship indices, not UUID entities, so this used the channel/verb model and NOT the #776 target selector. The authored windows/thresholds (damage_window_secs, min_damage_window_secs, damage_pct_threshold, health_ratio_threshold) moved out of the typed ai_cfg.* reads into the policy `param` map, read host-side and passed into the kernel input. seed_shields_focus_facts seeds the #779 fact snapshot from the already-pruned per-arc damage window (recent_damage_<arc-id>, recent_damage_total, recent_damage_fraction_max/recent_damage_pct_max, health_fraction_min_ratio) so a fact(...) guard actually fires; the default policy (default_shields_focus_ai_config) seeds params from the retained typed default_shields_ai_* values and keeps an unconditional imbalance fallback, so omitting [shields_console.ai_policy] reproduces today's decisions exactly. policy.rs stays Bevy-free (facts seeded host-side)."
        - "Issue #784 moved Power allocation onto this spine and RETIRED the bespoke stateful engine (PowerRuleTrigger + EngageState hysteresis + ShipPowerAiState + PowerAiConfigResource + tick_power_rule) — the last per-frame AI timer, so the decision is now a pure function of the per-tick snapshot (AGENTS.md rule #7). ai_power_allocation reads a per-ship PowerAiPolicy(AiPolicy) — at #784 an omitted [power.ai_policy] was filled by default_power_ai_config, but issue #885 deleted that synthesiser, so default_power_ai_config is gone and strict AI-declaration mode is the default in EntityConfig::from_toml: a hull that declares no [power.ai_policy] fails the entity load rather than having allocation rules invented for it — and, for EACH of the ship's authored power groups (power.iter()), resolves that group's DYNAMIC channel via AiPolicy.resolve_channel over a host-seeded fact snapshot (seed_power_facts — SHIP: battery_pct/thrust/red_alert/per-group power_<group>/total_allocation; THREAT: secs_since_combat/nearest_enemy_dist; OBJECTIVE: has_destroy_objective; SYSTEM: offline_system_count) PLUS the read-only scenario flag chain (WorldContentRuntime.flags passed as the resolve_channel `flags` arg — the new read surface #784 adds over prior hosts, AC3). The highest-priority matching rule (AC4) emits its SetPowerGroupAllocation(level) verb's ABSOLUTE level as an admitted SetPowerGroupAllocation targeting the reactor (the same admitted seam a human uses, AGENTS.md rule #6), skipping the emit when level == current so admission is not spammed. (Since issue #959 that per-group emit described here — resolve one channel, emit its absolute level, skip if unchanged — is no longer the whole decision: each group's resolution still happens, but its result becomes an AllocationBid and power_system::plan_allocation spends the reactor's ship-wide budget across every bid in one budget-aware pass, the host then emitting an admitted SetPowerGroupAllocation only for the groups whose commanded level changes.) The applier re-clamps to [1,4] and total<=8. The #779 empty-facts edge is closed host-side (facts seeded before the gate; policy.rs stays Bevy-free)."
        - "Issue #872 gated OFFENSIVE FIRE on an authored red-alert predicate, and did it by adding one fact rather than one rule. ai_phaser_auto_fire, tick_blaster_auto_fire and ai_torpedo_auto_fire now read the ship's own ShipRedAlert and seed it as fact(red_alert) (POWER_RED_ALERT_FACT, the name Power/Repair/Comms already seed) into seed_phaser_bank_facts / seed_blaster_bank_facts / seed_torpedo_tube_launch_facts. It is seeded UNCONDITIONALLY — a ship with no component reads 0.0, not absent — so an authored guard can read it in both directions instead of only failing closed. No Rust host tests it: every armed hull authors the SAME guard, when = \"fact(red_alert) >= param(min_alert_to_fire)\", and the hulls differ only in that one param. An Alliance hull authors 1 (hold fire, even under attack, until the captain — human or AI backfill — calls red alert); a Harrow authors 0 (always armed, because it has no bridge crew to call one and its captain policy stands the alert down out of combat, so a Harrow that waited would never open the engagement). Designation is untouched: ai_target_selection emits SetTarget independently and the fire hosts only READ the frozen viewscreen combat_lock, so a held bank keeps tracking and fires on the next shared AI tick after the alert goes up. Torpedo LOAD and magazine GRANT are not offensive fire and stay unconditional — a tube kept full between engagements is what makes the instant response possible. That the gate is CONTENT is proved by removing it: ai_flag_hosts::removing_the_authored_fire_gate_removes_the_gate substitutes the guard out of the shipped alliance_cruiser through the real load path and the same banks fire on the same alert-down snapshot, with no_weapons_host_decides_fire_from_red_alert_in_rust scanning the four hosts so no Rust branch can quietly reimpose it."
        - "Issue #912 closed the loop #872 left. The Captain host seeded exactly ONE fact, secs_since_combat, whose timer starts only on damage taken, hostile fire taken, or own weapon fired — and #872 gates a crewed hull's own weapons on the alert — so between two backfilled Alliance hulls nobody ever shot: the hull could only ever RETURN fire, and the authoring surface could not express first contact at all. That made the red-alert half of every class doctrine (#875/#876/#877) unreachable without a human captain, and it was invisible to CI, because tests/headless_runner.rs is #![cfg(feature = \"headless\")] and the workflow ran no headless test target; ten of its thirty-two tests had been red since #872 and no job noticed. operate_captain_ai now also seeds CAPTAIN_HOSTILE_CONTACT_FACT (fact(hostile_contact), 1/0) and CAPTAIN_HOSTILE_RANGE_FACT (fact(hostile_range), planar world units), BOTH UNCONDITIONALLY — an absent fact makes every comparison read false, which is indistinguishable from 'clear' and is exactly how a guard ships dead (the #779 shape). hostile_range reads 0.0 when there is no contact, so the presence clause in the authored guard is load-bearing rather than decoration and the truth table pins that row. The readings come from the SHARED WorldSnapshot via the existing pure helpers find_nearest_hostile and target_relative_motion (the nearest_hostile_range host helper), NOT from a new scan — the same producer the Helm world view and Tactical's nearest-hostile tier read, so the captain's verdict agrees with the consoles that act on it by construction. The host runs in SimSet::Input and build_world_snapshot in SimSet::Physics, so it reads the PREVIOUS tick's frame: the frozen-snapshot doctrine, a one-tick lag on a decision whose threshold is tens of world units, not a missing edge. There is deliberately NO radar gate in Rust — the captain owns no radar and a reach pinned in code would violate rule #11; the horizon is the authored param the guard compares against. The DECISION stays entirely in content: the four Alliance hulls author one extra priority-5 rule, when = \"fact(hostile_contact) > 0 and fact(hostile_range) < param(alert_on_hostile_within)\", over a new param alert_on_hostile_within = 150.0. The five Harrow hulls and the unarmed Requiem courier author NO such rule and are listed in BESPOKE_DOCTRINES for it: a Harrow is always armed (min_alert_to_fire = 0) and stands its alert down out of combat on purpose, so giving it this rule would move its red-alert STATE — and every comms/repair/power fact and #874 arc overlay keyed on it — while changing nothing about when it fires. removing_the_authored_first_contact_rule_restores_return_fire_only deletes the rule from the shipped alliance_cruiser through the real load path and shows the same contact at the same range no longer raising the alert, which is the data-not-code proof. The CI gap is closed in the same change: the test job now runs cargo test --features headless --test headless_runner."
        - "Issue #786 added the Comms dialogue-response host (operate_comms_response_ai in src/console/comms/server.rs, CommsResponseAiPolicy alongside), which RETIRED a live AGENTS.md §6 violation rather than a decision kernel. The previous AI answer was three lines inside handle_comms_channel2 — if policy.operate_ai && !responses.is_empty() { inbox.record_response(&id, 0) } — a direct write to the authoritative inbox that bypassed admission AND bypassed handle_respond_to_message entirely, so an AI response fired NO trigger actions and advanced NO follow-up. The new host runs in SimSet::Input .before(handle_respond_to_message): for each inbox message with an OPEN dialogue awaiting an answer it resolves the comms_respond channel over a seeded snapshot (seed_comms_response_facts — response_count, available_response_count, important_response_count, is_urgent, is_read, is_orphaned, sender_in_range, red_alert, comms_available, power_rating) PLUS the read-only scenario flag chain, and emits the winning RespondToMessage(index) verb's index as an admitted SystemControlPayload::RespondToMessage { message_id, response_index } through emit_ai_command — so the EXISTING router runs UNCHANGED for AI and human alike and dispatch_action/apply_dispatch_result fire identically. WHICH message is answered comes from host context; only the INDEX rides the verb. A None resolution means hold (leave the dialogue open). The #779 empty-facts edge is closed host-side; policy.rs stays Bevy-free."

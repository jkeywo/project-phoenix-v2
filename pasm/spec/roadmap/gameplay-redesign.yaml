entities:
  - migration: gameplay-redesign-incremental-rollout
    core:
      status: accepted
      confidence: confirmed
      title: Incremental Gameplay Redesign Rollout
      summary: >-
        Implement the user-approved 0–24 sequence one playable increment at a time.
        Preserve shipped hulls, scenarios and tools, existing networking and individual
        knowledge-limited System AI. Each capability includes authoring, human controls,
        AI, deterministic state and continuation integration. Structural migration
        preserves observable behaviour before intentional gameplay changes.
      rationale:
        - "Approved 2026-10-13. Older saves and external packs may require conversion or their original compatible build; incompatible state must be refused explicitly."
        - "The canonical catalogue ledger and playable exits live in docs/gameplay-redesign/implementation/migration-ledger.json. GitHub PRD #1562 retains execution-issue status."
        - "Future design contracts are adopted per increment; this roadmap does not claim implementation of later capabilities."
    implementation:
      target_paths:
        - docs/gameplay-redesign/implementation/migration-ledger.json
        - docs/gameplay-redesign/implementation/index.html
        - scripts/redesign-ledger.mjs
        - scripts/redesign-baseline.mjs
        - scripts/redesign-balance-baseline.mjs

  - component: gameplay-redesign-increment-00
    core:
      status: accepted
      confidence: confirmed
      title: "0 — Baseline and migration ledger"
      summary: "All catalogue entries mapped; current gameplay, performance and determinism evidence recorded; superseded future PASM choices identified."
      rationale:
        - "Record pre-migration evidence before changing runtime behaviour. Headless timing does not establish native/browser rendering or human acceptance."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gameplay-redesign-incremental-rollout]

  - component: gameplay-redesign-increment-01
    core:
      status: accepted
      confidence: confirmed
      title: "1 — Explicit Consoles and ownership"
      summary: "Explicit Console identities and bindings preserve existing screens, joining, ratings, human seeking, Backfill and reconnect."
      rationale:
        - "Starts after increment 0 has a verified playable exit; completion requires human/AI operation, shipped content, authority/knowledge, continuation, authoring and appropriate gameplay evidence."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gameplay-redesign-incremental-rollout]


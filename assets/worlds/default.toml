# Default World: Starbase Alpha + initial raider patrol
#
# A "world" file unifies what was previously split between a `map` (anchors,
# global config, entity instances) and a `scenario` (named spawns, triggers,
# comms templates). One file, one fetch, one parse.
#
# Sections:
#   [global]    — seed, world-level constants
#   [anchors]   — named positions for [[entity]] entries to reference
#   [[entity]]  — direct entity instances (Immediate or GameStart spawn);
#                 named entries are trigger / comms eligible
#   [[trigger]] — world event reactions (on_destroyed, on_attacked, on_timer)
#   [[comms]]   — comms dialogue templates keyed by trigger condition

[global]
seed = 42
title = "Starbase Alpha"
description = "Defend the Federation outpost against an incoming raider patrol."

[ambient_light]
color      = [0.6, 0.55, 0.5]
brightness = 300.0

[anchors]
starbase_alpha = [1000.0, 0.0, 0.0]
patrol_alpha   = [600.0, 0.0, -600.0]
patrol_beta    = [500.0, 0.0, -300.0]
patrol_gamma   = [200.0, 0.0, -600.0]

# ── Static map entities ───────────────────────────────────────────────────────

[[entity]]
template_path = "assets/entities/star_sun.toml"
transform = { position = [0.0, 0.0, 0.0] }

[[entity]]
template_path = "assets/entities/planet_earth.toml"
id = "earth"
name = "earth"
transform = { position = [400.0, 0.0, 400.0] }

[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
transform = { position = [0.0, 0.0, 0.0] }

[[entity]]
template_path = "assets/entities/player_ship.toml"
id = "player-ship"
transform = { position = [280.0, 0.0, 0.0] }
spawn_on = "game_start"

[[entity]]
template_path = "assets/entities/region_nebula.toml"
id = "nebula-1"
transform = { position = [600.0, 0.0, -600.0] }

# ── Named entities (trigger / comms-eligible) ────────────────────────────────
#
# `[[entity]] name = "..."` is the unified spawn surface (PRD #337). The
# pipeline assigns a UUID at spawn time and registers it in
# `WorldConfig.name_to_uuid` so triggers, comms, and `relative_to` lookups
# can resolve the name. Positioning lives under `[entity.transform]` and may
# use inline `position`, `anchor = "..."` (resolved from `[anchors]`), or
# `relative_to = "..." + offset = [x,y,z]` (relative to another named entity).

[[entity]]
template_path = "assets/entities/station_axiom.toml"
name = "Starbase Alpha"
transform = { anchor = "starbase_alpha" }

# ── Named NPC entities (trigger-eligible) ─────────────────────────────────────
#
# The patrol raider is positioned at the `patrol_alpha` anchor;
# `spawn_world_entities` wires the AI components (BehaviourSection,
# FactionComponent) via the shared `spawn_entity` helper.

[[entity]]
template_path = "assets/entities/pirate_raider.toml"
name          = "raider_alpha"
transform     = { anchor = "patrol_alpha" }

# ── Triggers ──────────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity    = "raider_alpha"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-raider-destroyed"
  text      = "Pirate raider eliminated."
  mandatory = false

[[trigger]]
condition = "on_attacked"
entity    = "raider_alpha"

  [[trigger.action]]
  type = "load_world"
  path = "assets/worlds/reinforcements.toml"

[[available_ships]]
template_path = "assets/entities/alliance_cruiser.toml"
label = "Alliance Cruiser"

[[available_ships]]
template_path = "assets/entities/alliance_destroyer.toml"
label = "Alliance Destroyer"

# ── Comms templates ──────────────────────────────────────────────────────────

# Automatic distress call broadcast when the raider is first attacked.
[[comms]]
from    = "raider_alpha"
trigger = "on_attacked"
entity  = "raider_alpha"
message = "MAYDAY MAYDAY — Pirate raider calling for backup. USS Phoenix has engaged. All units converge on our position!"

# Automatic distress call broadcast from Starbase Alpha when the station is first attacked.
[[comms]]
from    = "Starbase Alpha"
trigger = "on_attacked"
entity  = "Starbase Alpha"
message = "Starbase Alpha to all vessels — we are under attack! Requesting immediate assistance!"

[[comms]]
from    = "Starbase Alpha"
trigger = "on_hailed"
entity  = "Starbase Alpha"
message = "USS Phoenix, this is Starbase Alpha. Please state your business."

  [[comms.response]]
  text = "We are on a survey mission."
    [[comms.response.action]]
    type = "add_objective"
    id   = "obj-survey"
    text = "Complete the survey in this sector."

  [[comms.response]]
  text = "We require docking clearance."
    [[comms.response.action]]
    type      = "add_objective"
    id        = "obj-dock"
    text      = "Dock at Starbase Alpha."
    mandatory = true

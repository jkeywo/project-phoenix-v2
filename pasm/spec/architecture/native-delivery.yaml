  - component: bridge-input-routing
    core:
      status: implemented
      confidence: confirmed
      title: Bridge Input Routing
      summary: How native mouse, keyboard and independent touchscreen input reaches the right console pane across a configured multi-monitor bridge (issue #1124). One mouse traverses every surface, keyboard focus is explicit and shown by a visible non-colour indicator, and each touch contact is captured by the pane where its gesture began. The routing MODEL is pure and Bevy-free — the coordinate transforms, the pane-boundary hit test, the keyboard-focus order and the touch contact-capture map — and is CI-tested with no hardware; the winit/Ultralight adapter that feeds it real per-window events and injects them into the views is behind --features ultralight. This is also where #1123's deferred pane→Station-window compositing landed.
      rationale:
        - "[ai] The routing logic is a PURE model (input_routing.rs) apart from the Bevy adapter, for the same reason the bridge-display profile is: that is where every acceptance criterion with arithmetic or a rule in it lives — a physical point mapping to a pane-local logical coordinate through the monitor origin and scale, the shared seam between two tiled panes belonging to exactly one of them, focus cycling and clearing, a touch pinned to its starting pane through a drift. All of it runs under the ordinary cargo test; only injecting a resolved event into a real Ultralight view needs the SDK, a GPU and the displays, which is the #[ignore]d integration test and the human acceptance kit."
        - "[ai] Coordinates are physical on the input side and logical (page CSS) on the output side, because those are the two the rest of the stack already speaks: PaneRect and MonitorGeometry are physical, and a pane's Ultralight view is created with a device scale equal to its window's, so a pane-local logical coordinate is (physical − pane_origin) / scale. That one division is the whole of 'display scaling' in acceptance criterion 3, kept in the pure model rather than smeared across the adapter."
        - "[ai] Keyboard focus between panes is Ctrl+Tab / Ctrl+Shift+Tab, NOT plain Tab: a console has real form fields and plain Tab must stay the page's own field-to-field traversal. Ctrl+Tab is the long-standing convention for moving between panes and no console page binds it, so inter-pane and in-pane focus never fight over a key. The adapter forwards a bare Tab to the page as text and consumes Ctrl+Tab as a focus command."
        - "[ai] The focus indicator is a ring PLUS four corner brackets drawn on exactly the focused pane, so focus is conveyed by the PRESENCE of that shape and not by a colour change — an accessibility requirement (WCAG 1.4.1). An unfocused pane has no ring at all, so no colour discrimination is needed to tell focused from unfocused; a colour-blind operator or a washed-out bridge display still reads it. Its geometry is documented FOCUS_RING_* constants, not tunables, because it is chrome and an accessibility affordance rather than gameplay data."
        - "[ai] A touch contact is PINNED to the pane its first point resolved to and routed there until it lifts, however far the finger drifts (ContactCaptureMap); simultaneous contacts are independent because each is one entry keyed by its own id. Ultralight has no multi-touch surface, so each contact is expressed as pointer events on its pinned pane's view — two contacts on DIFFERENT panes are genuinely independent, two on the SAME pane share the one pointer. That last is the honest limit of the mapping and is why the kit's simultaneous-touch part is the hardware acceptance; the dev box has no touch, so criterion 6 stays parked on the kit, verified-when-touch-hardware-exists."
        - "[ai] The pane→Station-window compositing #1123 deferred landed here: BridgeStationSurface now carries the monitor's MonitorGeometry, and the pane host renders each seated pane on its Station window through a per-Station 2-D camera (RenderTarget is its own component in Bevy 0.18, not a Camera field) and routes that window's input to it. The honest MVP the issue sanctioned: the compositing works and the pure model handles arbitrary multi-monitor geometry, but multi-monitor and multi-touch are unverified in code on the one-monitor, no-touch dev box — carried by the pure tests and the acceptance kit."
    architecture:
      kind: service
      authority: non-authoritative
      coordinates: [native-station-pane, bridge-display-profile]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          src/native_host/input_routing.rs,
          src/native_host/input_routing_tests.rs,
          src/native_host/panes/ultralight.rs,
          src/native_host/bridge_display.rs,
          src/native_host/panes/mod.rs,
          src/native_host/app.rs,
          docs/acceptance/1124-input.md,
        ]
      symbols:
        [
          PaneRouter,
          PanePlacement,
          PaneHit,
          WindowKey,
          FocusRing,
          ContactCaptureMap,
          PaneDisplayPlugin,
          PaneDisplayConfig,
          PaneDisplayEntry,
          BridgeStationSurface,
        ]
      tests: [cargo test, tests/native_host_input.rs]

  - component: ultralight-sdk-handling
    core:
      status: implemented
      confidence: confirmed
      title: Ultralight SDK, Licence and Redistributables
      summary: How the proprietary Ultralight SDK is obtained, linked, staged at runtime and kept out of every build that does not want it. Acquired by ul-next-sys's build script from a public unauthenticated URL into its own OUT_DIR, never vendored into any repository, and reachable only through the default-off ultralight cargo feature.
      rationale:
        - "[ai] The feature gate is the load-bearing part. ul-next-sys DOWNLOADS a ~100 MB proprietary archive at build time; every job in ci.yml is ubuntu-latest, the wasm build has no use for any of it, and a plain cargo test must not pay a download to run four thousand unit tests. Nothing in default, server, host, headless, capture or viewer may ever imply ultralight."
        - "[ai] DEFAULT-OFF IS NOT SUFFICIENT, and assuming it was is how the feature reached CI on the very commit that introduced it: --all-features enables everything declared regardless of what implies what, and the test job's clippy step asked for exactly that. That step now names its features explicitly — every one Cargo.toml declares except ultralight — with the same list mirrored in AGENTS.md's local gate command, so a new feature has to be added to both or it goes unlinted. Vellum solves the same problem the other way: its engine job selects the workspace with --exclude vellum-ultralight and lints that crate separately at its defaults, with a manual, non-required job type-checking the SDK half."
        - "[ai] No credential exists and none is checked in — the download URL is public and unauthenticated — so 'reproducible in development without private credentials' is satisfied by construction rather than by a secret-management story."
        - "[ai] Cargo LINKS the SDK and stages nothing, which is a runtime failure with no message: on Windows a missing DLL is a process that exits with an OS error code and nothing on screen. stage_sdk therefore runs at startup, finds the extracted SDK under the cargo build tree, copies the four shared libraries beside the executable and the SDK's resources directory (CA bundle, ICU table) into the working directory, and names them and the licence files in the operator log. That path only exists in a BUILD TREE — a packaged archive must carry them itself, which is an open decision in docs/delivery-checklist.md."
        - "[ai] The licence is the Ultralight Free License Agreement V1, shipped inside the download under the SDK's own license directory. It governs redistributing the libraries with a packaged build and nothing in either repository can answer it for a shipper, so the crate NAMES the files rather than summarising the terms."
        - "[ai] The shared plumbing was extracted to vellum's new vellum-ultralight crate rather than copied: void-and-thunder had already built the same SDK staging, the same surface-to-RGBA copy and the same evaluate_script push/poll bridge, and two independent arrivals at one mechanism is the fleet's test for a shared crate. ul-next is consequently no longer a per-game exception in vellum's dependency handbook. Pane registries, input policy, session identity and the payload schema stayed in phoenix, because void-and-thunder has no version of any of them."
    architecture:
      kind: policy
      authority: non-authoritative
      coordinates: [native-station-pane]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths:
        [
          Cargo.toml,
          src/native_host/panes/ultralight.rs,
          docs/delivery-checklist.md,
          .github/workflows/ci.yml,
          AGENTS.md,
          .gitignore,
        ]
      symbols: [stage_sdk]
      tests: [cargo test, tests/native_host_pane_ultralight.rs]

  - component: native-host-lobby-surface
    core:
      status: implemented
      confidence: confirmed
      title: Native Host Lobby Surface
      summary: The crew lobby the browser host shows, composited onto the native host's viewscreen window as a permanent embedded web view. It renders through the SAME pure view models and the SAME DOM renderers server.html renders through, from the same LobbyStatePayload bytes, over a bridge of its own. Since issue #1328 it carries the scenario/hull picker and the AI-launch control, so the operator standing in front of a --lobby host chooses the world and starts the mission on the viewscreen rather than from a phone or the command line; since issue #1330 it also CARRIES THE MONITOR ROW — one button per connected display, the current viewscreen marked, pressing another moving the viewscreen there live through the bridge layout law. Since #1331 every station card also carries a SCREEN ROW — one button per eligible monitor plus an off state — and pressing one opens that station's console on that monitor at runtime, as an ordinary participant that joins and claims like a phone. All six presses ride ONE page->host queue in ONE HostLobbyRecord vocabulary, drained by ONE system.
      rationale:
        - "[ai] THE POINT IS THAT THERE IS ONE RENDERING PATH, and getting it took an extraction rather than a reimplementation. The lobby's decisions were already pure (gui/host-lobby-view.js, issue #1229); its DOM writes and its stylesheet were still inline in server.html. Both moved out — gui/host-lobby-render.js and gui/host-lobby.css — and server.html now links what it used to contain. A native reimplementation of those thirteen element ids would have started identical and then rendered a new lobby row nowhere, with nothing failing, which is the exact failure mode #1122 refused for the console shell."
        - "[ai] What stayed inline in server.html is what was never lobby render: the audio graph, the shared qrVisible flag, the fleet freeze, the mesh pump, and the three overlays that are VIEWSCREEN chrome rather than lobby chrome (asset-loading, QR, game-over). Each is coupled to page-lifetime state that page owns, and the native surface has none of them. The extraction is behaviour-preserving by construction: the renderer is the original block verbatim including its early return when #station-grid is absent, and the stylesheet was linked BEFORE the inline style block it came out of, where nothing earlier targets a lobby element and the one later rule that did (the ready badge under prefers-reduced-motion) moved with it."
        - "[ai] The DOCUMENT is the pane-document trick applied to the other page. It is assembled in memory and published by this process's own delivery server at the HOST page's depth (/host-lobby-nonce.html), not the client's, because it borrows the host page's markup and modules — so gui/host-lobby-render.js and ../assets/strings/strings.csv resolve exactly as they do for dist/index.html, same origin, nothing rewritten. Its markup is SLICED OUT of the served page's own lobby panel by a depth-counted scan (comments skipped, or a comment mentioning a div would truncate the lobby at a place that still looked like valid markup) rather than authored in Rust, for the drift reason above. Issue #1328 took the same slice of the page's #scenario-panel, minus its two host-tooling blocks (a mod-pack upload and a save importer, both file inputs with page-lifetime handlers this document does not carry) and starting display:none, because a --world host never publishes a picker and a panel covering ITS lobby would be a viewscreen that never moves. The one edit that reversed is the AI-launch button: #1325 stripped it because the surface was read-only and a control that silently does nothing is worse than no control, and #1328 keeps it because the force-start path stopped being wasm-only, so it does something."
        - "[ai] THE SURFACE IS NOT A PARTICIPANT, and is deliberately not on the pane bus. A pane has a minted session token, sends Identify, claims a Station and crosses command admission; this renders what the host is ALREADY broadcasting to every phone in the room. Putting it on the bus would have meant a token to be refused for, a registry entry whose Welcome nobody wants, and asking the Session connection registry which participant the viewscreen is — a question with no honest answer. It therefore also carries no identity at all, which is a stronger property than the pane document's careful URL fragment: there is nothing to leak, and its URL has no fragment. That survived #1328 and #1330 giving it something to SAY: what it sends is a HostLobbyRecord, a closed four-tag vocabulary that is deliberately not a ClientMessage, on a page->host namespace deliberately distinct from the pane bus's — so a participant's message arriving on this queue is unrepresentable rather than merely wrong."
        - "[ai] The bridge is the pane bridge's shape (evaluate_script push and drain on each dedicated pane-thread iteration, over the same PaneSurface trait so it is testable with no SDK) with ONE deliberate difference: latest-wins slots instead of a backlog. Nothing here is one-shot — a LobbyStatePayload is a snapshot of the whole lobby — so an older one has nothing to say the newest does not. viewscreen_border::push_lobby_state writes a LobbyStateChanged every Bevy Update whether or not anything moved, independently of the pane thread's cadence. An identical payload is dropped outright and the reveal flag is pushed only when it changes, bounding the bridge and avoiding repeated JavaScript work on the pane thread. A failed push is still not lost — it goes back in its slot unless something newer has taken it. The main world consumes the drained operator records through the existing host-lobby bridge."
        - "[ai] THE SURFACE IS PERMANENT, and that is a contract later slices depend on rather than an implementation detail. On mission start it is not torn down: the chrome YIELDS — the page renders nothing (the shared view model already hides the panel outside GamePhase::Lobby), the Bevy node's display goes to None, and the placement leaves the #1124 router so a click over it reaches the viewscreen. F9 reveals and hides it in play. The view is never touched, so a reveal is a display flip rather than a page load, which is what the QR overlay, settings and layout rows that later land on this same surface are entitled to assume."
        - "[ai] Every phase change clears the manual reveal latch, in BOTH directions. Leaving the lobby is the chrome yielding to the mission; returning to it is the chrome coming back on its own terms. The rule exists for the trap in between: in the lobby phase the key looks inert, because the chrome is already on — and without the clear, an idle keypress there would blank nothing at the time and then spring the lobby open over the viewscreen the moment the crew launched. The whole decision is the pure RevealState, answering three separate questions (composite, route input, force the page's chrome) so that none of them becomes a boolean scattered through a frame loop no CI job compiles."
        - "[ai] It shares the ONE Ultralight runtime a process may have, so it is driven by PaneHost rather than by a second host of its own, and takes a RESERVED PaneId (u32 MAX) to appear in the #1124 router, focus ring and touch-capture map — the acceptance criterion is that a mouse and a keyboard operate it exactly as they operate a pane. PaneRegistry mints ids from 0 upward and never reuses one, so the reserved value is unreachable; unlike a high-water mark it also cannot collide with a pane RECREATED later in the run (#1125). Everything that treats a PaneId as a participant — the pump, the fault path, the close-and-retire sweep — checks for it and skips, and a copy failure never faults it: it holds no station to fall back to AI control, and faulting a permanent surface is the one thing later slices are told never happens. Its canvas draws beneath every pane on the same window and it is placed LAST in the router, so where a tiled pane overlaps it the pane both draws on top and wins the hit test. Taken to its conclusion: tiled --pane consoles divide the WHOLE primary window between them and therefore cover the surface completely, so the lobby is visible only with no --pane at all or with a --profile that seats every pane on a Station window; in the tiled case it is still composited and still pushed to, merely occluded."
        - "[ai] It is in the focus ORDER but is NEVER the SEEDED focus. FocusRing::focused_on_first_pane seeds the first PANE and skips this handle, and a reveal does not re-seed it either. The reticle #1128 draws is a promise that the next keystroke lands somewhere, and this surface carries no TYPEABLE control — its buttons (the QR toggle since #1329, the scenario/hull picker and the AI launch since #1328) are all activate-on-press, not text fields. Seeding the first router ENTRY meant that a host with no --pane, where the surface is the ONLY entry, booted with a whole-primary-window focus frame and corner brackets framing chrome that accepts nothing, and redrew it on every F9. Such a host now seeds no focus and draws no reticle, which is the honest state. Excluding it from the SEED is not excluding it from the CYCLE: Ctrl+Tab still reaches it deliberately, which is what #1124's keyboard-operability criterion asks for. #1329 then added the first control the surface has — the QR toggle — and the seeding still skips it, as a decision rather than an oversight: one activatable control is not worth booting every no-pane host with corner brackets around its chrome, and one Ctrl+Tab reaches it. A typing target, not the next button, is what would reopen this."
        - "[ai] No flag turns it on: it is what a windowed authoritative host has in front of it before a mission, and a native host had nothing there between #1121 and this. It needs a build with --features ultralight and a --client-dir bundle whose index.html is a Phoenix host page, and it REPORTS and carries on when either is missing rather than refusing to boot — a host that flies the mission with a blank surface is far better than one that refuses to start over its chrome. The SDK staging consequently moved out of the --pane block, since both embedded surfaces need it, but is still GATED on one of them being possible — a --pane, or a --client-dir the lobby could be built from. A host with neither can never open an embedded view, and copying SDK libraries and a resources/ tree into its content directory for a surface it will never show is a side effect it did not ask for. Staging still exits for a pane, which cannot work without it, and merely reports for the lobby."
        - "[ai] THE MONITOR ROW IS THE SURFACE'S FIRST CONTROL (issue #1330), and it is drawn by the SHARED renderer rather than by native glue. server.html carries the #monitor-row markup the native document is sliced out of, and hostLobbyMonitorRow answers null unless something reported a monitor — so \"absent on the web host\" is a rule about DATA, not a check on which page is asking, and the browser host reaches it by simply calling the view model with two arguments. The row is a map over the payload exactly as the layout law intended: the model already answers what each monitor is holding and why a button would be refused, and the page re-derives none of it."
        - "[ai] The row crosses on a bridge slot OF ITS OWN rather than as a field of LobbyStatePayload. That payload is the shared Rust wire type the BROWSER host also consumes, and a browser host has no monitors: growing it a monitor list would put a native-only concern on the one shape whose whole point is that both surfaces read the same bytes. The slot is latest-wins and identical-push-deduped like its siblings, because a monitor row changes about once a session and repeated synchronous evaluate_script calls would waste the dedicated pane thread's time. Host->page splits per concern this way freely, because a slot costs one push per pane-thread iteration at most; the page->host direction does NOT, because it is a drain — see the one-vocabulary bullet below."
        - "[ai] It is serde through core::codec, not a hand-formatted JSON string. panes::os_prefs is allowed to hand-format because every field it emits is a bool or a clamped number and none can carry a quote, a backslash or a </script; this payload carries a string the OS chose — a display's own name — which is precisely the case that note rules out. The parameter map is a BTreeMap so the encoded object is byte-stable, which is what makes the dedupe above actually fire."
        - "[ai] A refusal is SHOWN, not merely logged, and it crosses as a strings.csv id plus parameters rather than as a sentence. LayoutRefusal and LayoutAdoption already composed English for the operator log; a lobby surface is a screen a player reads, so AGENTS.md rule 11 applies and each variant now also names an id the page resolves through t(). An adoption note carrying a refusal reports it as its OWN line via cause() rather than as a {reason} parameter — t() substitutes values, and a translator handed a second localised sentence cannot see what grammar is about to land in it. A press this build cannot parse is the one thing NOT rendered as feedback: a page/host mismatch is an operator's problem, and showing it would tell the crew their button is broken when what is broken is the bundle."
        - "[ai] The surface finally drains its OWN queue. #1325 installed phoenixHostLobbyOut on the page and left UltralightPaneSurface evaluating window.__phoenixPaneOutDrain for every view it wrapped — a function the lobby document never defines, so the first record it queued would have been swallowed with a completely clean log. The drain script is now per surface (new vs for_host_lobby), which keeps the two namespaces doing the job they were separated for: a record that arrived on the wrong one is unrepresentable rather than merely wrong. REVERT HAZARD: that fix is a #1325 bug fixed inside #1330 — it lives in commit cfbff20b, not in any #1325 commit — so reverting #1330 to back out the monitor row silently re-breaks the lobby surface's outbound queue, with a completely clean log. Take the drain script (UltralightPaneSurface::new vs ::for_host_lobby) out of any such revert."
        - "[ai] Accessibility is the row's, not the framework's, and three decisions are load-bearing. Real <button> elements, so a keyboard operates the row with nothing added. Which display shows the viewscreen said in WORDS and in aria-pressed as well as in colour (WCAG 1.4.1) — the border is the third telling, never the only one. And focus drawn for plain :focus as well as :focus-visible, because the embedded WebKit view decides for itself what counts as keyboard focus and an operator who cannot see where the next keystroke lands is worse served by a clean row than by an always-present ring. Nothing in the row animates, so prefers-reduced-motion has nothing to switch off."
        - "[ai] EVERY STATION CARD CARRIES A SCREEN ROW (issue #1331), and it is the same map-over-the-law the monitor row is. BridgeLayoutPayload grew a stations list beside monitors — one row per claimable station, each entry the law's own MonitorChoice (selected / eligible / excluded) with is-viewscreen or full as the reason — and HostLobbyRecord grew assign-station and unassign-station beside its set-viewscreen. There is no move-station verb, because the law has no move action. The page makes exactly ONE judgement about those entries and it is acting on the law's reason rather than re-deriving it: is-viewscreen is DROPPED (a console never covers the shared view, so a button for it could only come back as a refusal — which is the acceptance criterion's \"exactly the non-viewscreen monitors\"), and full is KEPT, disabled, with its reason beside it, because \"free a slot here\" is a different fact from \"this screen is not offered\" and a button that vanished would read as a monitor that had gone. A row left with no button at all IS the single-monitor bridge, and says so."
        - "[ai] A card is joined to its row by STATION ID, so LobbyStatePayload::StationPayload gained one. The card's name is display text that crosses localiseHostPayload; matching on it would have worked in English and silently stopped the first time somebody translated a station name. The id is never shown, is defaulted for a payload written before the field existed (such a card gets no row, which is the honest state for a host with no monitors), and is the same key the layout law and the pane namespace already share."
        - "[ai] A station screen button carries data-station and data-screen and deliberately NOT data-monitor. The viewscreen row's delegated listener matches on that attribute, so a station button that answered to it would move the shared view instead of opening a console — a bug that would look like the right button doing the wrong thing. The off state is data-screen=\"\" rather than an absent attribute: absent and empty are the same to closest() and different to getAttribute, and \"off\" has to be a value the listener acts on rather than a hole it guesses the meaning of."
        - "[ai] The accessibility rules are the monitor row's, restated for a control that is now inside a card: real <button> elements so a keyboard operates the row with nothing added, aria-pressed as well as a border so which screen is chosen is not carried by colour alone (WCAG 1.4.1), :focus drawn as well as :focus-visible because the embedded WebKit view decides for itself what counts as keyboard focus, and nothing animating so prefers-reduced-motion has nothing to switch off. The row's own addition is disabled: a FULL screen stays visible and greyed with its reason, so a keyboard skips it rather than reaching a press that can only be refused."
        - "[ai] The split along the SDK line is #1122's, unchanged: the document assembly, the bridge's rules and the reveal state machine are feature-OFF and run by the ordinary cargo test, together with the renderer's jsdom suite driven against server.html's own lobby markup. Only the compositing itself — the Bevy node, its display, the router placement — needs a window and a GPU, and the real-window proof (tests/native_host_lobby_ultralight.rs) is ignored-by-default and run deliberately, needing a trunk-built dist/ rather than the pane test's build-client.mjs bundle."
        - "[ai] THE JOIN QR IS ON THIS SURFACE (issue #1329), and the extraction that put it there is the same one #1325 made for the lobby panel, applied to the panel that floats over it: gui/host-qr.js is the only place the QR is drawn and the only place its visibility is decided, gui/host-qr.css the only place it is styled, and server.html now links and calls what it used to contain — including losing its qrVisible flag, because the state is #overlay itself and two documents in two engines cannot share a module-level boolean. The visibility law is unchanged and now stated once: shown in the Lobby phase, hidden at mission start and at game over, and LEFT ALONE in play. That null is what lets an operator open the code for a late arrival and have it stay open, since the phase pushes arrive every frame the lobby changes. The extraction also FIXED a real pre-existing bug, which is the strongest justification on record for having made it rather than reimplementing: the deleted qrVisible flag was flipped by the cog handler but NOT by mission start, which set display:none on its own — so after every launch the flag disagreed with the screen and the first cog press was a no-op the operator had to press twice. With the panel's own display as the single state, that is unrepresentable rather than merely tidier."
        - "[ai] The ENCODER IS VENDORED (gui/vendor/qrcode.js, qrcode@1.5.1's own browser build, MIT, byte-identical to what jsdelivr was serving) and loaded from whichever process is serving the page. It had been a CDN script tag, which made the one thing a crew cannot start without depend on the room having internet — and a native host is the case that breaks: a bridge machine is not assumed to have a network, so the alternative was a viewscreen lobby that could show a crew everything except how to join it. Version 1.5.1 is deliberate, not stale: every release after it drops the browser bundle from the published tarball, so 'upgrade to latest' here means 'add a bundler step'."
        - "[ai] WHERE THE QR POINTS is the one genuinely native decision, and it is the defect a naive implementation ships. The surface loads over loopback, because that is what an embedded view on this machine can dial — and it is the one address in the building no phone can open, so a QR built from the document's own location.href would look perfectly correct on the viewscreen and be unscannable. native_host::host_lobby::join therefore decides the page base from what the LISTENER bound: a specific --addr is the operator's own answer and is used as given; the documented 0.0.0.0 wildcard takes the interface the machine would route out of (a UDP connect to TEST-NET-3 — a routing-table lookup, no packet, no DNS, nothing that could be mistaken for a call home); no route falls back to loopback and says so at the prompt. The URL itself is still assembled by gui/join-url.js, extracted out of the crew transport for this, so both hosts build a join link the same way and the rule about naming a non-default rendezvous service lives in one place. Every way that answer can still be wrong is REPORTED at the prompt rather than found with a phone. join_addr_reach classifies the address the QR names — loopback, carrier-grade NAT (a Tailscale 100.64/10 interface, which the default route prefers precisely because it is a tunnel), link-local (nothing answered DHCP), or simply not private — and says why no phone in the room can open it, with --addr as the recourse in every case; only loopback was warned about before, and the rest looked exactly like success. The other half is not about the address at all: the client's ?rendezvous= gate reads the PARAMETER's own host, not the page's origin, so a loopback override IS honoured from a LAN page (and then resolves on the phone, where nothing is listening) while a non-loopback one — a deployed worker — is silently swapped for the bundle's built-in service, sending every scanned phone somewhere this host never registered. phoenix-host now says so; the gate itself is #1112's security posture and a follow-up issue's to revisit."
        - "[ai] Two states, not three: a code, or joining is OFF. --solo (or no --rendezvous) means there will never be a code, so the panel says that in words from the string table rather than framing an empty QR — 'the code has not arrived yet' and 'there will never be a code' look identical on a wall. The waiting window itself is deliberately unmodelled: nothing is pushed until the service answers, which leaves the same empty framed panel a browser host shows for the same second. A transient service loss likewise leaves the code up, because a reclaim (#1115) usually returns the very same letters and blanking the wall for a reconnection that succeeds seconds later costs the room more than it tells them."
        - "[ai] A phone's ToggleQrCode reaches a native host at last. That button predates the native host and had never worked against one: server.html intercepts the frame in its own per-connection handler, so the message had no Rust variant and arrived at the codec as undecodable. It is now ClientMessage::ToggleQrCode — a unit variant, TogglePause's shape, in EVERY build unlike its two toggle neighbours, because showing the code that lets somebody else join is what the panel is for rather than a lever a stranger can pull — drained frame-driven and never through command admission. It is the one EDGE on this bridge (a count, not a state: two presses are two flips), and the page owns the resulting visibility, so no boolean crosses to be a second opinion about what is on screen."
        - "[ai] THE PICKER IS THE HOST PAGE'S PICKER (issue #1328), by the third application of the same extraction: gui/host-scenario-render.js now holds every DOM write renderScenarioLockState made inside #world-list and gui/host-scenarios.css holds its rules, over the gui/host-scenarios.js view model #1230 had already lifted out. What crosses the bridge is exactly scenarioCatalogView's three arguments — the catalogue, the arbiter's lock state, and whether a world has landed — so the viewscreen cannot be deciding a stage the browser would not. The two side effects that genuinely differ between the surfaces are hooks rather than branches: which arbiter a pick reaches (server.html holds one in its own page, the native surface's host holds one in src/lobby/scenario_arbiter.rs), and whether the panel's show/hide is this render's business (on the page it is lifecycle — driveWorldLoad hides it — and on the viewscreen there is no lifecycle, so an opt-in option gives the renderer the panel, exactly as revealChrome gives it the lobby's). server.html passes neither and behaves as it did."
        - "[ai] A pick from the viewscreen enters the arbiter as a ClientMessage under LOCAL_CONSOLE_TOKEN — the token server.html's OWN picker submits under through __localConsoleSend. That is not the surface acquiring an identity: the token means 'the host operator acting on the host's own window', it is reserved so no network peer may claim it, and both selection variants are explicit no-ops in the lobby handler, so nothing but the arbiter acts on them. The arbiter then treats the viewscreen as one participant among the phones under first-valid-wins, with no priority — which is the rule the browser host has always applied to its own page."
        - "[ai] A REFUSED pick repaints nothing, and that is parity rather than an omission: arbiterSelectScenario returns before its render on any non-accepted outcome, so on both hosts the panel goes on showing the stage that is actually true. Nothing is lost by it, because the surface makes no optimistic local move to be rolled back — every render comes from the host's authoritative answer. The refusal is not silent either: drain_scenario_selection logs it at warn level, on both hosts, through the same log_outcome."
        - "[ai] FORCE-START STOPPED BEING BROWSER GLUE. PendingForceStart and apply_force_start were behind cfg(wasm32), so the only route to a mission with nobody at a console was the host page's button — and a native lobby whose crew are all on phones had no way to launch at all. Both are de-gated and native_host::app registers apply_force_start on the same two edges wasm_init gives it (.before(SimSet::Input) for #907's tick-scoped transition, and .after(NativeWorldLoadSet) so a press on the tick a runtime world lands sees that world). Only drain_force_start_input stays wasm-only, because a thread-local JavaScript sets is the one part that really is glue. The rule gains one guard — refuse with no WorldConfig, the same one solo_auto_start carries — which is inert in the browser, where the world is loaded before wasm_init composes the App, and a request that arrives with no world is DROPPED rather than held, because remembering it would start the mission the instant somebody else's scenario pick landed."
        - "[ai] ONE VOCABULARY, ONE DRAIN, ONE READER, and it is a correctness constraint rather than tidiness. #1328 (the picker, the hull, the AI launch) and #1330 (the monitor row) were built in parallel and each gave this surface a page->host control; #1330 landed first and #1328 rebased onto it. Both had shaped their own record type and their own reader, and the two merge with ZERO textual conflicts into a build where the monitor row silently stops working: HostLobbyBridge::take_records is records.drain(..), so whichever system runs first (drain_surface_records, in PreUpdate) takes every record including the other's, warns 'the surface sent something this bridge does not speak', and the second (apply_lobby_layout_actions, in Update) sees an empty queue for the rest of the run — with a clean log at BOTH ends. The merge therefore folded LobbyLayoutRecord::SetViewscreen into HostLobbyRecord as a fourth variant, deleted apply_lobby_layout_actions, and left drain_surface_records dispatching on the tag. #1331 was branched before that fold and had extended the OLD machinery — two more LobbyLayoutRecord variants through apply_lobby_layout_actions — so its rebase applied the SAME ruling a second time: assign-station and unassign-station became the fifth and sixth HostLobbyRecord variants with their page-side kebab tags untouched, the drain grew ONE layout arm all three verbs fall through to (what differs between them is only the LayoutAction they name), and #1331's own copy of apply_lobby_layout_actions was deleted rather than restored. Its round-3 notice semantics survived the fold intact: every writer APPENDS to BridgeLayoutResource::notices and publish_bridge_layout drains what it pushed through bypass_change_detection, with the two-writer race test re-expressed against drain_surface_records. What each verb DOES still belongs to its own module — layout::set_viewscreen_action is the layout half — and publish_bridge_layout stays in Update so a press applied in PreUpdate and the row that answers it are one frame and one repaint. RULE for the slices that follow (the settings rows), now applied twice and load-bearing both times: a new page->host control is a variant here, never a second record type and never a second take_records caller — and a branch that predates the fold pours its content into this shape rather than reviving its own."
        - "[ai] The three LAYOUT tags stay KEBAB (set-viewscreen, assign-station, unassign-station) where the three picks beside them are snake_case, kept by an explicit serde(rename) each against the enum's rename_all. set-viewscreen shipped that way in #1330 and #1331's two were written to match it, gui/host-lobby-view.js and host_lobby_link.js write them by hand, and the page is assembled from a bundle that may be older than the host — so folding the two vocabularies together was not worth a wire break. A test pins both directions for all three: the kebab spellings decode and the snake_case ones do NOT, so a bundle drifting to the 'consistent' spelling fails here rather than on a viewscreen."
        - "[ai] THE WHOLE FEATURE'S HUMAN HALF IS ONE KIT, NOT SIX (issue #1335, docs/acceptance/1335-native-lobby.md). Each of #1325-#1334 left a residue only a room with monitors in it can settle, and splitting that residue per issue would have produced six scripts an operator runs in six sittings, each re-booting the same host and re-picking the same hull to reach the two minutes that were actually theirs. So the kit is ordered the way a game night is — boot, pick, invite, arrange, crew, fly, break something, come back — and every step names the run-native.bat line it needs rather than a hand-typed flag soup, because a kit whose first instruction is a forty-character command is a kit that gets paraphrased. It deliberately collects THREE NUMBERS rather than three yes/nos, and they are exactly the claims tests/native_bridge_displays.rs names and declines: how long the viewscreen takes to arrive on another monitor, how long the re-tile blink leaves a neighbour's console blank (and whether the operator's notice beats the crew member's question), and whether a 2-up split is legible from where a person actually stands. MAX_PANES_PER_STATION = 2 exists to bound that last one and it is a judgement about a room, not about a number."
        - "[ai] THE KIT PARKS WHAT THIS RIG CANNOT SETTLE, EXPLICITLY, in a table with what unparks each — the #1124-touch pattern, because a criterion silently skipped reads later as one that passed. Three of them. TOUCH operation of the lobby: no touch hardware, out of scope in PRD #1324 by name, parked WITH #1124's Part B so one display unparks both. PREFERS-CONTRAST AND REDUCED MOTION reaching the surface: gui/host-lobby.css carries the full high-contrast block for both rows and FocusReticleStyle::for_os_prefs carries the host-drawn half, and NEITHER can be driven from Windows today, for two stacked reasons — Ultralight ships no OS-backed matchMedia, so a CSS preference query inside the embedded view answers 'no preference' whatever the machine is set to, and panes::os_prefs::query_os_accessibility_prefs is a documented stub returning OsAccessibilityPrefs::default() on every target because a live read needs unsafe FFI this crate forbids. So the kit asks the operator to CONFIRM THE HONEST STATE ONCE (turn high contrast on; the rows look the same) and leave the criterion unticked, rather than writing a step that asserts behaviour the batch does not have. An OBSERVED VIEW CRASH: not constructible by hand — the fault is internal to the renderer and a borderless-fullscreen Station window has nothing an operator can close — so the placement rule stays proved against a real running bridge with an injected failure, and the kit asks only that a spontaneous one be recorded WITH WHICH MONITOR THE CONSOLE CAME BACK ON."
        - "[ai] The QR's phone leg is stated as a PREREQUISITE rather than a park, because it is a worker deploy rather than missing hardware — and the prerequisite is one this feature is the first to meet. A phone scanning a NATIVE host's QR loads the client bundle from the BRIDGE MACHINE'S OWN LAN ADDRESS, so its page origin is http://192.168.x.y:8080 and the rendezvous service's ALLOWED_ORIGIN has to carry THAT as well as whatever the host passes as --origin. A browser-hosted game never meets it, because its phones load the same public page the operator is standing on, which is why docs/delivery-checklist.md §3a does not mention it. The kit says so up front, with the check-rendezvous.mjs run as the gate, so an operator does not spend a session rediscovering an origin allowlist from the far side of a phone camera."
        - "[ai] In play the QR is visible only while the surface is revealed, and that is the shape of the native answer rather than a gap. The view composites into an OPAQUE texture, so there is no floating a QR alone over a running viewscreen the way a browser host does — showing the code means showing the surface. F9 is therefore the in-play 'show the join code' gesture; a phone's press sets what the operator finds when they make it, and deliberately does NOT uncover the surface itself, because a phone in a player's pocket must not be able to drop a black sheet over a running mission. On the surface, the toggle is a control of the document's own (this window has no settings cog), named from the same string id the host page's cog menu uses, and it acts on the document's DOM without a round trip: a click is not something the host needs to be told about."

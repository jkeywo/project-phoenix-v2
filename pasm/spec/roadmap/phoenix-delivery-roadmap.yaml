    core:
      status: accepted
      confidence: confirmed
      title: Backfill Combat Symmetry and Crew-in-the-Loop Comms
      summary: "Build #870 after completed composable templates and before Combat Test balance: player/NPC station symmetry, shared class-mirror doctrine fragments, red-alert posture and fire gates, crew advisories, and an audited human-visible counterpart for every Backfill fact."
      rationale:
        - Basic player-ship Backfill doctrine is already delivered (#842); this is the follow-on that makes mixed human/AI crews transparent, symmetric, and content-reusable.
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [entity-template-state]
      coordinates: [roadmap-composable-entity-templates, fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-mod-content-packs
    core:
      status: accepted
      confidence: confirmed
      title: Mod Content Packs Baseline
      summary: "Release A. Validated TOML pack export and host overlay resolution are delivered (#759/#760). Close #856, together with template-aware editing (#910), only after confirming its acceptance criteria against the now-stable entity-template, model-sidecar, and snapshot manifest contracts."
      rationale:
        - Mod-pack work should be verified and integrated with post-demo authoring foundations, not reimplemented as a second system.
        - "Release A is the earliest honest slot: the entity-template, sidecar, and manifest contracts it must be checked against are all freshly stable at that point, and Falling Skyway is the first real content to author through them."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [entity-template-state, world-content-pack-state]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-borrowed-sun-foundation
    core:
      status: accepted
      confidence: confirmed
      title: Borrowed Sun Foundation — Environmental Fields, Shared Epistemics, and the Complexity Ladder
      summary: "Release B. Add generic environmental fields — scenario-authored moving volumes with shape, velocity, intensity, and falloff, covering debris density, radiation, and sensor/comms interference — and sensor-derived observations whose confidence narrows with repeat observation. The authored scan ladder covers detection (location/category), identification (transponder/faction/declared identity), classification (class/role/known capabilities), and tactical assessment (observable shields, damage, emissions, active systems); intrusive protected detail waits for Band E. Retrofit Falling Skyway's radiation storm onto the field system with identical observable behaviour. Also ship the console complexity-ladder framework: star-rung station ratings, the generalised per-system detail overlay host, the scenario detail-floor vocabulary, and human-seeking comms/nav systems — with Sensors as the first detailed console and the Comms evidence/dossier browser as its detail surface."
      rationale:
        - "Fields are authored volumes in this band; cause-derived emission from physical sources arrives with the Narrow Season foundation. Consumers (sensors, helm hazard checks, damage application) only ever read field state, so that upgrade is non-breaking."
        - "There is ONE evidence contract: physical sensor readings, third-party data obtained via Comms, and derived estimates all carry confidence and provenance through the #858 dossier surface. No second epistemics system is built for physical measurement."
        - "The Skyway retrofit lands here, before campaign-continuity projection (#867) freezes expectations against mission 1's state, so the toolkit never carries two hazard representations."
        - "The complexity-ladder framework debuts here rather than with the band-D power network (superseding the earlier engineering-only timing) because its first real content is band B's sensor depth: the detail screen ships with genuine epistemics gameplay, not an empty frame, and D's power detail then lands as deeper rungs of an established ladder."
        - "PRDs published 2026-08-13: #1016 (fields and epistemics) and #1017 (complexity-ladder framework); the later bands' foundation PRDs are #1018 (Narrow Season), #1019 (Broken Tithe), #1020 (Silent Corridor ladder content), #1021 (Patrol Mode)."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, spawned-entity-state, world-snapshot-artifact]
      coordinates: [roadmap-falling-skyway-foundation]

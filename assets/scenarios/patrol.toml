# Patrol Scenario
#
# A Pirate Raider patrols three waypoints around the sector. When the player
# approaches, the raider engages. Destroying the raider completes a mission
# objective. Uses anchors declared in assets/maps/default.toml.

[[spawn]]
name        = "raider"
entity_path = "assets/entities/pirate_raider.toml"
anchor      = "patrol_alpha"

# ── Triggers ──────────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity    = "raider"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-raider-destroyed"
  text      = "Pirate raider eliminated."
  mandatory = false

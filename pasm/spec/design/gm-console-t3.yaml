entities:
  - component: gm-t3-attention-queue
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: GM Attention Queue and Personal Triage
      summary: "One peer-local advisory projection answers 'what is waiting for a Game Master'. Occurrences carry a stable identity derived from the waiting thing itself, a category, one of exactly three bands (Urgent/Attention/Background), the simulation tick they were first observed at, a real-time age basis, a short String Table reason with parameters, and a target naming surfaces that already exist on the desk. It publishes on the page-local gm_attention Host Channel only: never a peer frame, never a snapshot field, never a digest fold. The first producer is pending Comms — a live inbox message that is unanswered, unwithdrawn and actually offering the crew a response — defaulting to Attention, with a per-route authored override. Filters, one-click sixty-real-second snoozes, reading holds and Return to live are private browser presentation and never cross back into the simulation."
      rationale:
        - "[ai] Issue #1433 (PRD #1419 M4, presentation contract PRD #1418). Occurrence identity is the CommsMessage id the world already minted, which buys both lifecycle rules without a second registry: the row keeps one identity while the condition holds, and a recurrence is a different message and therefore an occurrence no stale snooze can hide. Resolution needs no explicit retirement path either — answered, orphaned, cleared and 'no responses offered' are all just the predicate ceasing to hold."
        - "[ai] The band vocabulary is closed and authored as a string on [[gm_comms_route]].attention_band, validated in the existing route loader so an invented band fails the world load naming the section and id rather than silently defaulting. A serde enum was rejected for exactly that: it would name a TOML path instead of the authored section. The band is GM triage only and never touches CommsPriority, delivery, routing, recipients or anything a crew console renders."
        - "[ai] Two clocks, deliberately. Ordering uses first_seen_tick with a stable-id tie-break so every peer and every repaint agrees; age uses Time<Real> because a facilitator who pauses the world has not stopped waiting, and the same real basis is what makes the snooze exactly sixty seconds including while paused. The page takes each occurrence's first-seen wall clock ONCE from the first payload carrying its id, so later samples cannot make a row's age jitter."
        - "[ai] The projection republishes only when membership, order, band, reason or target changes — never on age alone, which advances every frame and would make a held list meaningless."
        - "[ai] Reading stability is a two-mode panel: live, or held because focus is inside the list or a row has been opened for reading. A held list keeps its rows in place, still tells the truth about a row's own band and age, counts what it is holding, says it is held, and applies the backlog only on Return to live. Return to live ends the READING SESSION, not merely this one hold: the opened row stops being the selected one, because a selection that outlives the catch-up would make every later projection re-enter held mode with nobody reading — a queue that silently stops updating after the first Open. Holding is presentation: it never pauses the simulation and never delays a projection."
        - "[ai] A held row whose occurrence resolves under the operator keeps its place but stops pretending: its age freezes at the wait it ended on (re-deriving it would restart the clock at 0:00 and read as a brand new arrival), it carries a sentence saying it is no longer waiting so the state survives forced colours, and both of its verbs are disabled — a control that quietly does nothing is worse than one that is visibly spent. Focus sitting on such a control moves to that sentence, so the change is announced and the list keeps the focus that holds it."
        - "[ai] Filters and snoozes live in one reusable controller (gui/gm-attention-filters.js) so #1442's authored filtered-attention and workload widgets reuse this exact private state instead of growing a divergent copy. They persist under a scope key of session id plus operator id, so a reconnect to the same session restores remaining real-time expiry and a new session simply has no stored scope — the reset needs no explicit clear. Two operators sharing one browser profile never inherit each other's snoozes, and nothing here reaches GmOperator, a GmAction, a snapshot or the digest. The controller reports its own changes back through an onChange hook and the desk repaints the queue from state it already holds: a restored session (or, later, a sibling widget's snooze) must not leave the operator reading yesterday's filters until the world happens to publish again. That repaint is for changes made ELSEWHERE: a change the queue makes to its own controller renders once, deliberately, from the handler that made it, because a repaint arriving mid-click would rebuild the list out from under a handler still reading the screen it is acting on — which is precisely how a keyboard operator would lose focus to the document on every snooze."
        - "[ai] Escalation to Urgent breaks a snooze; a row that was already Urgent when snoozed waits out its minute. Both rules are decided from the band recorded AT snooze time, which is why the snooze record stores it."
        - "[ai] Technical banners (issue #1437) are not occurrences and do not pass through the filter, snooze or hold path at all: #gm-attention-banners is rendered verbatim from its own entry point so a GM cannot hide a connection or recovery failure from themselves. #gm-attention-panel is deliberately absent from GM_ROLE_PRESET_PANEL_IDS for the same reason — a role preset must not be able to hide the banner region."
        - "[ai] A row explains itself with one of two sentences, chosen by whether the waiting conversation names a recipient ship. Only a GM's own TransmitComms addresses a dialogue at named hulls; world-authored open_comms and crew hails carry no recipient ship, so those rows use the fleet-wide reason id with the speaker as their only parameter. One sentence with an optional parameter was rejected: it renders the ordinary scripted case as 'X is waiting on .' on the desk."
        - "[ai] Opening a row is navigation, not a new action surface: it selects the occurrence's ship on the existing map projection and brings the authored Comms route that already speaks as that sender to hand. No GmAction, no dialog, no automatic panel switch."
        - "[ai] The 'never a snapshot field' rule above is about the PROJECTION and its reading state, and it still holds: occurrences are recomputed from live facts every publish and filters, snoozes and holds live in a browser. The idle-NPC producer (gm-t3-idle-npc-advisory) does carry one captured field — how long each NPC has been without orders — because that is elapsed history rather than a repaint, and no restored world can recompute it. It is still folded into no digest."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-milestone-facilitation-assistance, gm-t2-map-feed-and-inspector-shell, gm-t2-role-presets]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_attention.rs, src/gm_comms.rs, src/console_bridge.rs, src/core/codec.rs, src/server/bridge.rs, src/native_host/native_gm/mod.rs, gui/gm-attention-panel.js, gui/gm-attention-filters.js, gui/gm-workspace.js, gui/gm-workspace-shell.js, gui/gm-workspace.css, gui/host-channel.js, gui/gm-comms-panel.js, server.html, assets/worlds/probe_gm_attention.toml, assets/worlds/probe_gm_attention_fleet.toml]
      symbols: [GmAttentionBand, GmAttentionCategory, GmAttentionOccurrence, GmAttentionProjection, GmAttentionState, GmAttentionPlugin, publish_attention_projection, GmAttentionChanged, encode_gm_attention_projection, attention_band, createGmAttentionPanel, createGmAttentionFilters, GM_ATTENTION_SNOOZE_MS, focusRoute]
      tests: ["cargo test --features headless --test gm_attention", "cargo test --features headless --lib -- gm_attention::", "npx vitest run tests/client/gm-attention-panel.test.js", "npx vitest run tests/client/gm-workspace-shell.test.js", "tests/smoke/gm-layout.spec.js"]
  - component: gm-t3-eligible-beats
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Eligible Authored Beats in the GM Attention Queue
      summary: "An authored GM-operable event whose Fire would land right now appears in the existing GM attention queue as an eligible-beat occurrence: default band Attention, an authored override among the same three bands on the beat's own control set, a short String Table reason, and a target naming the qualified event id and the levers the author declared. Eligibility is READ from the ordinary trigger evaluator's own decision function and the existing GM control state; no condition is matched a second time, no Rhai runs and no handler is dispatched. Auto-fired, completed, skipped, paused and ineligible are all resolutions or withholdings that fall out of that state. Activating a row is navigation to the mission panel's existing Fire/Pause/Skip for that beat, which keep their admission check and their apply-tick revalidation."
      rationale:
        - "[ai] Issue #1434 (PRD #1419 M4 story 7, presentation contract PRD #1418). 'Eligible' is defined as exactly one thing — would a manual Fire of this beat land right now — and answered by world::content::manual_fire_would_land, which is fire_manual_trigger's own three gates (spent one-shot, `when` predicate, cooldown) extracted with none of its mutation. Sharing the predicate rather than restating it is what makes 'read from the ordinary evaluator' mechanically true instead of a claim that happens to hold today."
        - "[ai] A beat is a second CATEGORY in the one attention queue, not a second list: same projection, same three bands, same oldest-first stable-id ordering, same filters, snooze, hold and Return to live. A parallel panel would have had to re-implement every one of those and would still leave a facilitator reading two lists."
        - "[ai] The withholding rules are all somebody else's state, never a new judgement here: paused (a GM's standing decision — Fire still works while paused, deliberately, but a standing decision is not something to keep asking about), an armed Fire (the GM acted and the handler has not run yet), an armed Skip (the GM decided how the next occurrence goes), and no declared Fire lever (Pause and Skip are levers on an occurrence the world will produce, not ways to produce one)."
        - "[ai] Occurrence identity is the layer-qualified event id plus a per-peer occurrence ordinal, because a beat — unlike a Comms message — has no per-occurrence identity of its own to borrow. The ordinal advances when the PREVIOUS occurrence ended: the beat's own (fired, last_fired_elapsed) stamp moved, or it stopped being eligible and came back. Deriving it from the stamp rather than only from observed transitions matters because a repeatable beat can fire and become ready again between two frames; deriving it only from the stamp would miss an authored gate closing and reopening. Both endings mean the same thing to an operator: a snooze, a focus ring or a reading position taken against the old occurrence must not be inherited by the new one."
        - "[ai] The authored band rides GmEventControls.attention_band, declared by a .attention_band(\"…\") sibling modifier next to .pauseable() and .skip(), and validated in two places that share one rule (GmEventControls::validate_attention_band): the authoring host fn and the load-time validate_gm_events pass. An invented word blocks activation naming the three bands rather than landing the beat silently in the default. It is stored as the authored spelling for the same reason the Comms route override is — the band vocabulary belongs to the attention projection, not to world config."
        - "[ai] Two reason sentences, chosen by whether the trigger's condition is Manual. A gm_event beat has no other cause, so it is 'yours to start'; a condition-bearing beat would also arrive on its own, so Fire only releases it early. Saying 'yours to start' about a wave already on a timer would be false, and the distinction is the one a facilitator actually acts on."
        - "[ai] The row's verb NAVIGATES and never fires: it hands the occurrence's existing target to the desk, which marks the beat's mission-panel row and focuses the first lever that is pressable right now (Fire first — it is the lever the beat is queued for). Nothing about the attention queue can submit a GmAction, so the ordinary admission check and the apply-tick revalidation in gm_event::fireable_index and its twins remain the only path to a firing."
        - "[ai] Inspecting the queue is proven not to advance the world: publishing it repeatedly over a real authored world leaves every trigger latch, cooldown clock, authored flag and the authoritative world digest unchanged."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-milestone-facilitation-assistance, gm-t2-event-control-contract]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_attention.rs, src/world/content.rs, src/world/config.rs, src/world/script/triggers.rs, src/world/script/authoring.rs, src/world/script/validate.rs, gui/gm-attention-panel.js, gui/gm-mission-panel.js, gui/gm-workspace.js, server.html, assets/worlds/probe_gm_beats.toml]
      symbols: [GmAttentionCategory, GmAttentionEventTarget, ELIGIBLE_BEAT_REASON, ELIGIBLE_BEAT_MANUAL_REASON, ELIGIBLE_BEAT_ID_PREFIX, publish_attention_projection, manual_fire_would_land, validate_attention_band, validate_gm_events, focusEvent]
      tests: ["cargo test --features headless --test gm_attention_beats", "cargo test --features headless --lib -- world::script::validate::tests", "npx vitest run tests/client/gm-attention-panel.test.js", "npx vitest run tests/client/gm-mission-panel.test.js", "tests/smoke/gm-layout.spec.js"]
  - component: gm-t3-idle-npc-advisory
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Idle-NPC Advisory
      summary: "A third producer for the one attention queue. An NPC ship that has been given nothing to do for an authored grace of SIMULATION time — thirty seconds by default — becomes one Background occurrence naming that hull, the observed condition and its age. Idleness is read from the ship's own scored-objective pool through the same positive-score, real-directive filter the helm and weapons act on, plus any Objective explicitly scoped to that hull; a standing Patrol, Reach or Escort is an order and keeps the hull out of the queue, while movement and gunnery are not consulted at all. The grace is counted one fixed step at a time in a peer-local watch, so a paused world ages nothing, an order or a removal ends the spell outright, and a later spell is a new occurrence a stale snooze cannot hide. Authors tune it in a typed [gm_attention] table: a positive finite grace, a band from the closed three-word vocabulary, and an off switch that silences this advisory alone."
      rationale:
        - "[ai] Issue #1435 (PRD #1419 M4, presentation contract PRD #1418). 'No valid order' is deliberately not a new predicate: it is `ai::decision_trace::top_directive` over the ship's `ViewscreenBlackboard::scored_objectives`, the same pool and the same `score > 0` / not-`AiDirective::None` filter the helm and the weapons consume. So a doctrine that has gated itself to zero counts as nothing to do, an authored standing directive counts as an order, and the advisory cannot drift away from what the ship is actually flying."
        - "[ai] Elapsed idleness is COUNTED one fixed step at a time rather than differenced against SimTick. A difference would advance across a pause if it were ever sampled outside the fixed loop, and would take its answer from whichever frame read the counter; counting makes the boundary exact and makes pause need no special case at all, because a stalled or paused world withholds the tick and the system does not run."
        - "[ai] The occurrence id carries the spell's own start tick (`idle:<uuid>:<tick>`), which is what makes a later idle spell a different occurrence — the same rule the pending-Comms producer gets for free from a fresh CommsMessage id. An order, an Objective or a removal resolves the row by the predicate ceasing to hold, and the next spell starts from zero."
        - "[ai] The watch is the ONE part of the attention queue that travels in the snapshot. The occurrences are recomputed from live facts every publish and their reading state is private to a browser, so neither is captured; but how long a hull has been standing about is history no restored world can recompute, and dropping it would forgive a ship twenty-nine seconds into its grace and make the advisory a function of when somebody saved. It is captured and restored, and still folded into no digest — nothing in the fixed tick reads it."
        - "[ai] Only an Objective whose recipients NAME the hull counts. An unscoped record is the mission's, addressed to everyone and therefore to no NPC in particular, so counting it would silence the advisory for every NPC in the world the moment a scenario posted its first objective. `ObjectiveManager::has_active_for_ship` is deliberately stricter than `is_for_ship`, which stays right for a display."
        - "[ai] NPC-ness is `Ship` without `FleetSlotOf` and without `StaticPointDefence` — the same split `gm_projection`'s GmEntityKind draws, and deliberately not anything gated on `LocalShip`, which would make the advisory disagree between two peers of one fleet."
        - "[ai] Default band is Background, not Attention: an idle hull is worth noticing, not worth dropping a conversation for. Grace, band and the off switch are three separate authored knobs because a scenario whose hulls are meant to be parked must be able to silence this advisory without giving up the pending-Comms queue."
        - "[ai] Opening the row selects that hull on the map the desk already draws, which is what renders its inspector and the actions it allows. The occurrence carries no route and no conversation, so there is nothing for the row to do except take the operator to the ship — no order is chosen, offered or issued on their behalf."
        - "[ai] Authored values are refused at world load naming the section and key, never clamped: a non-positive or non-finite grace is not a slow advisory but one with no boundary at all, and guessing a threshold for the author is how a scenario ships with one nobody chose. Same argument as the closed band vocabulary."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-t3-eligible-beats, gm-milestone-facilitation-assistance]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_attention.rs, src/objectives.rs, src/world/config.rs, src/snapshot.rs, gui/gm-attention-panel.js, gui/gm-workspace.js, assets/worlds/probe_gm_idle_npc.toml, assets/worlds/probe_gm_idle_npc_authored.toml, assets/worlds/probe_gm_idle_npc_quiet.toml]
      symbols: [GmAttentionSettings, GmIdleSpell, GmIdleNpcWatch, observe_idle_npcs, idle_rows, without_orders, format_sim_clock, IDLE_NPC_REASON, DEFAULT_IDLE_NPC_GRACE_SECS, has_active_for_ship]
      tests: ["cargo test --features headless --test gm_idle_npc", "cargo test --features headless --lib -- gm_attention::", "npx vitest run tests/client/gm-attention-panel.test.js"]
  - component: gm-t3-peer-health
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: GM Public Peer, Station and Tick Health
      summary: "One peer-local advisory projection answers 'is the fleet actually healthy'. It reports every technical participant named by the hull it flies or the public operator bound to it, every Station assignment and whether a human is on it, and how far behind each peer's declared lockstep watermark is — with four DISTINCT states (Paused, Stale, Recovering, Disconnected) rather than one fault light. Persistent technical failures are published as self-describing alert rows, and those rows drive both treatments at once: an unfilterable banner region on the GM desk, and Urgent Station occurrences in the M4 attention queue. It publishes on the page-local gm_health Host Channel only, carries no session token, reconnect credential, transport id or fleet slot, and changes nothing: membership and recovery are observed, never driven."
      rationale:
        - "[ai] Issue #1437 (PRD #1419 story 10, presentation contract PRD #1418). The four states are the whole point of the feature. A deliberate pause and a lagging peer are indistinguishable if you only watch a tick counter, and reporting a pause as a fault is how a facilitator learns to ignore a health panel. Paused reads SimulationPaused, Recovering reads RecoveryState, Disconnected reads LockstepSession::has_departed / GmOperator.connected / Player.connected, and each of the three outranks the pause so a hold can never mask a real loss."
        - "[ai] 'Stale' uses the barrier's own threshold rather than an invented one: a peer is behind when its declared watermark is more than the agreed input delay below this host's ready_through — exactly the question LockstepSession::stall_at asks before gate_lockstep_ticks withholds a tick. Freshness is therefore reported in ticks against a stated tolerance, never as a wall-clock latency the page has no way to measure and never as a zero-lag guarantee."
        - "[ai] The technical fleet slot (HostSlot) is deliberately NOT on the wire, holding the line src/gm_journal.rs already holds for the action journal. A peer row is identified by the hull it flies (ship:<uuid>) or the crew-public operator bound to it (gm:<id>); a participant with neither gets a display ordinal that is explicitly a position in the rendered list. Session tokens, reconnect credentials and ConnectionId legs/incarnations never enter the type at all, and the test asserts their absence against the encoded JSON rather than against the Rust struct."
        - "[ai] One alert list drives both treatments, so the banner and the Urgent queue row can never disagree about whether something is wrong: the queue row's id is derived from the alert's, and both resolve when the predicate stops holding. Only ship/Station-scoped alerts become queue rows — an operator disconnect and a recovery have no Station to open, and a banner is the right and only treatment for them."
        - "[ai] The technical band is system-fixed at Urgent and reachable by no authored key. [[gm_comms_route]].attention_band moves that route's advisory Comms rows and nothing else; GmHealthAlertKind is not authorable; and neither #gm-attention-panel nor #gm-health-panel appears in GM_ROLE_PRESET_PANEL_IDS, so an authored [[gm_role_preset]] cannot hide either region. Filtering the queue narrows the list and never the banner: the guarantee is held by one region outside the filter/snooze/hold path, not by making one row type un-narrowable inside a triage tool."
        - "[ai] An outage that resolves and recurs mints a NEW occurrence: the alert key carries a generation the projection bumps whenever a key stops holding and starts again, so a sixty-second snooze taken against the previous outage cannot hide the next one."
        - "[ai] The projection republishes on what a Game Master reads — membership, states, alerts, recovery — and never on the tick advancing. A role=alert region that re-announced itself every frame would be a screen reader shouting at somebody who already knows. The announced SENTENCES obey the same rule independently, because a projection that republishes for a real reason (a peer watermark moving inside tolerance) must still not produce new speech: the health panel's live region carries only the worst state, the peer count and the warning count, and the sample tick — which changes on every republish by construction — is rendered in a sibling element outside the live region, with a guarded write so an unchanged sentence never re-fires."
        - "[ai] RecoveryStatus is an enum (InProgress / Failed), not a struct with a failed flag, so the unfilterable banner cannot quote a tick nobody recorded. The terminal variant carries the divergence tick it is about and an optional boundary — absent when no safe leader was ever elected, because nothing was ever held at one — and both come from the recovery this host actually tracked. A placeholder zero here would render the divergence at tick 0 could not be repaired on the one region a facilitator cannot filter, snooze or hold away, and the failure is terminal, so that sentence would stand for the rest of the session."
        - "[ai] gui/gm-health-banner.js is the reusable half and renders into ANY container, which is the seam the M5 live-restore surfaces (#1446/#1447) take: a restore adds a GmHealthAlertKind variant and a String Table sentence, and both treatments pick it up with no further wiring. The queue panel keeps ownership of the desk's banner REGION and takes the drawing as an injected renderBanners hook, so 'no filter, snooze or hold reaches this' stays a property of one place."
        - "[ai] Banners are reconciled by id rather than rebuilt, because a banner carries a button: replacing the region on every projection would throw that button away under a keyboard operator mid-press. The readable panel has no controls at all — this issue observes membership and introduces no removal policy, so there is nothing on a row to press and nothing for a repaint to move."
        - "[ai] Every state is rendered as a translated WORD beside the sentence, with colour and data-state as decoration on top, so forced colours and a monochrome display lose the emphasis and keep the meaning (PRD #1418 story 27)."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-milestone-facilitation-assistance, gm-milestone-operations-safety, gm-t3-attention-queue]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_health.rs, src/gm_attention.rs, src/lockstep/recovery.rs, src/console_bridge.rs, src/core/codec.rs, src/server/bridge.rs, src/native_host/native_gm/mod.rs, gui/gm-health-banner.js, gui/gm-health-panel.js, gui/gm-attention-panel.js, gui/gm-workspace.js, gui/gm-workspace-shell.js, gui/gm-workspace.css, gui/host-channel.js, server.html]
      symbols: [GmHealthState, GmHealthAlertKind, GmHealthAlert, GmHealthReason, GmStationHealth, GmOperatorHealth, GmPeerHealth, GmRecoveryHealth, GmHealthProjection, GmHealthWatch, GmHealthPlugin, publish_health_projection, GmHealthChanged, encode_gm_health_projection, RecoveryStatus, GmAttentionCategory, createGmHealthBanner, createGmHealthPanel, parseGmHealthProjection, worstHealthState, defaultRenderBanners]
      tests: ["cargo test --features headless --test gm_health", "cargo test --features headless --test lockstep_recovery", "cargo test --features headless --lib -- gm_health:: lockstep::recovery::tests", "npx vitest run tests/client/gm-health-panel.test.js", "npx vitest run tests/client/gm-attention-panel.test.js", "npx vitest run tests/client/gm-workspace-shell.test.js", "tests/smoke/gm-layout.spec.js"]
  - component: gm-t3-quiet-time-advisory
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Quiet-Time Advisory and the Crew-Activity Adapter
      summary: "After an authored interval of SIMULATION time — 120 seconds unless a world says otherwise — with no meaningful crew activity, the GM attention queue carries one Background occurrence saying so. It never escalates by age. Meaningful activity resolves it and restarts the interval; the next lull is a fresh occurrence with its own identity. Activity is read from three sources the simulation already keeps: a semantic operator action its owning System settled Applied (which is also how a completed Comms response counts), a control a seat worked that has no terminal result to settle (the helm axes and their uncorrelated siblings, read from AdmittedCommands), and BalanceEvent::ObjectiveChanged. A world authors a positive finite quiet_time_secs and an independent quiet_time_disabled on the same typed [gm_attention] table the idle-NPC advisory uses; neither is expressed through the other and neither can reach the technical-banner seam."
      rationale:
        - "[ai] Issue #1436 (PRD #1419 M4 stories 9 and 14, presentation contract PRD #1418). The advisory answers one question — has the session gone quiet — and answers it from facts the simulation recorded for its own reasons. There is no keystroke telemetry, no per-operator input counter and nothing inferred about who is at a console or how fast they work; the published sentence names the INTERVAL and carries no other parameter."
        - "[ai] Simulation seconds, not real ones: the interval is SimTick steps, compared against the exact tick count GmAttentionSettings::quiet_time_ticks rounds the authored seconds to. Pause stops Time<Virtual>, which starves the fixed schedule, which stops SimTick — so a paused session's quiet clock freezes because the simulation it measures froze, not because anything reads SimulationPaused. The row's AGE stays on real time like every other occurrence, because age is how long the GM has had it on the desk and is the basis a personal snooze expires on."
        - "[ai] Source 1 is ServerMessage::ActionFeedback with outcome Applied. Its other arm is Refused, so a refused or rejected press is excluded by reading the outcome rather than by a second rule, and AI traffic mints no feedback_correlation at all so no AI decision can reach it. A completed Comms response is exactly this case: RespondToMessage is on the correlated allowlist and handle_respond_to_message settles it Applied only when the answer lands."
        - "[ai] Source 2 is each ship's AdmittedCommands, for the controls that have no terminal result to settle — the helm axes the story names, and their uncorrelated siblings. Admission has already checked Station tenure and the System's control source, so a command that is there is one a seat was entitled to give and a refused one never arrives, and a hand held on the stick admits a command every tick, which is what 'sustained effective controls count' means. Three exclusions, each structural: an AI decision by its ai: token (the same discriminator admission routes on), a payload that CAN settle a correlated result (counted in source 1 instead, so one press is never counted twice and a refused one never at all), and the two things that are not a seat working — an axis at exactly neutral, and the host's own AssignStationRating replication."
        - "[ai] Everything the story excludes falls out of that list rather than being filtered out of it: browsing a panel issues no command, a passive tick produces no result, and routine AI-to-AI Coordination is not a command, not a correlated action and not an objective transition."
        - "[ai] Reading response_token here is bounded and deliberate. Its contract is that a HANDLER must not branch on it for a behavioral decision; this is a peer-local advisory read of who spoke, on the same convention admission itself routes on, and is named as command_admission::ai_emit::is_ai_token so there is one place that decides it."
        - "[ai] The band is Background and is NOT authorable — unlike the Comms route, beat and idle-NPC bands an author does choose. That is how 'age alone never escalates it' is made true by construction rather than by a rule somebody could later relax."
        - "[ai] Occurrence identity is a per-peer ordinal minted as the condition STARTS holding, so the row is stable for as long as one lull lasts (a reading position, a focus ring and a snooze all survive) and a second lull is a genuinely new occurrence no stale snooze can hide."
        - "[ai] The row carries no target, so the desk draws it with its Snooze verb and no Open. A disabled Open a keyboard operator must walk past on every row is not kinder than an absent one, and a live control that does nothing is worse than both. The panel decides this structurally — a row whose target names nothing has no destination — so a later advisory category gets the right verb without teaching the page about it."
        - "[ai] A snapshot restore rebases the clock onto the restored tick. Unlike an idle-NPC spell, which is elapsed history the watch carries in the snapshot, a session's last meaningful crew activity is not recoverable from presentation state at all: a continuation therefore neither opens on a lull that belongs to the captured session nor carries the pre-restore occurrence forward under its old identity."
        - "[ai] Known boundary: a command relayed from another host carries no feedback_correlation, so on a peer that is not the crew's own host a remote seat's semantic actions produce no terminal result to observe. Their sustained and uncorrelated controls and the mission's objective progress still count, and the browser Game Master this milestone supports is the crew's host. Native/multi-host GM integration is M6 and inherits the gap."
    architecture:
      kind: gm-presentation-projection
      authority: non-authoritative
      coordinates: [gm-t3-attention-queue, gm-t3-eligible-beats, gm-t3-idle-npc-advisory, gm-milestone-facilitation-assistance]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:

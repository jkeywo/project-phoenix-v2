[base]
offset = [ 0, -0.5465979384290465, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 2.106112455441677, 2.106112455441677, 2.106112455441677 ]

[extents]
min = [ -2, -0.5482557335839627, -0.6511914314450832 ]

  - component: helm-steering-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Steering AI Operator
      summary: Data-authored #775 fine system whose policy resolves one of the yaw channel's mode verbs to decide whether — and against which host-flown leg — to actuate this tick; when it fires, the host emits SetSteering with the continuous magnitude decoded from the shared DesiredMotion desired-facing fact, constrained to yaw until a full-3D ship capability enables additional rotational degrees of freedom.
      rationale:
        - "Issue #779 (AC1): Steering is authored independently of Engines. The DECISION to actuate flows through HelmSteeringAiPolicy (attached at spawn from [helm_console.steering_ai]) resolving the yaw channel to the actuate_desired_facing mode verb, replacing the pre-#779 unconditional branch in ai_helm_steering. Arc-bearing remains a facing override this axis owns on top."
        - "Issue #885 (8555e336) deleted the default_steering_ai_config synthesiser that used to fill an unauthored block (an unconditional actuate rule). Strict AI-declaration mode is now the default in EntityConfig::from_toml, so an undeclared block is a LOAD ERROR rather than an invented policy, and every shipped hull authors the block explicitly."
        - "Continuous value vs fixed verb (AGENTS.md #11): the mode verb carries no scalar; the yaw magnitude stays sourced from DesiredMotion.desired_facing_local, decoded by decode_steering_from_facing. desired_facing_local stays a distinct public fact from desired_velocity_local (AC5). A 'hold' resolution emits nothing and yaw coasts."
        - "Human/AI symmetry (AGENTS.md #6, AC3/AC6): terminates in the same admitted SetSteering a human sets; the per-axis operate_ai gate preserves human-takeover / backfill authority with no lifecycle reset (stateless policy)."
        - "Issue #883 (AC5) closed the same empty-facts gap here: ai_helm_steering seeds the hazard/availability snapshot plus the target-relative travel facts before resolving, so a yaw guard actually evaluates."
        - "Issue #883 seeds this host's availability facts (impulse_available / boost_available) from the ship's own config resources rather than the hardcoded false ai_helm_steering used to pass — see the same note on ai_helm_thrust."
        - "Issues #788-#792 took the yaw channel to SEVEN legal verbs, one per host-flown leg, all still value-less MODE verbs and all resolved the same way: hold_recovery_orbit and pivot_to_reengage (#788), hold_combat_orbit (#790), hold_torpedo_bearing (#791), hold_artillery_position (#792). Verify the membership against HELM_STEERING_VERBS in src/entities/config.rs. This axis is where the leg is DECIDED, and build_pass_surface reads the leg off the authored verb the current state resolves — so the planner learns which arm to fly without ever learning a state name. The host still emits the planner-decoded yaw for EVERY verb, exactly as it does for the two below: the difference between them was already resolved upstream in which pure arm the planner ran, and overriding SteeringInput per-verb here would bypass the planner and stop #780 hazard avoidance composing onto any of these legs. Geometrically overlapping verbs are deliberately not merged, because each names the authored parameter set its leg requires — see the fine-system-ai-policy-schema rationale in data-driven-fine-system-ai.yaml."
        - "Issue #883 gave the yaw channel a SECOND mode verb, hold_committed_heading — at the time, the first channel in the schema with more than one legal verb (validated via HELM_STEERING_VERBS, then a pair). actuate_desired_facing means re-solve the facing against the world this tick; hold_committed_heading means the facing solution is CLOSED and the ship flies the heading the host froze in memory(escape_heading_rad) at the last committed transition. This is deliberately NOT the same as a None resolution: a hold holds the last admitted steering COMMAND, so a non-zero yaw at the moment of commitment would keep the ship turning for ever. The host still emits the planner-decoded yaw for BOTH verbs, because the difference was already resolved upstream — the planner solved the facing against the frozen heading rather than the moving target. Overriding SteeringInput here instead would bypass the planner and stop #780 hazard avoidance composing onto the committed heading."
        - "Runs on the one shared AI decision cadence (AGENTS.md #7; ai_tick_ready — see ai-helm-tick-cadence); full removal of the hardcoded plan_helm_travel planner branch is the coordinated tail #794."
    architecture:
      kind: service
      authority: authoritative
      reads:
        - helm-actuator-input-state
        - desired-motion-state
        - impulse-manoeuvre-policy-state
      writes:
        - authoritative-ship-motion-state
      runs_in:
        - host-browser-runtime

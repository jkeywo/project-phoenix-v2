# authors folds nothing at all: three comms trees, seven objectives' worth of
# posting and resolution, the booking and berth seams, the commitments settled at
# the close, the casualty arithmetic, the debrief and all six campaign flag
# families. That is the same authoritative-but-unfolded bucket #1039, #1040,
# #1041 and #1042 each put a script band in, and this slice is the largest test
# of the claim so far.
#
# The anchors were re-measured on the same clean tree and are UNMOVED:
# combat_test 14942520827746055774, patrol 11531679067393217131, probe_evidence
# 5001167740764356580, probe_scan 7851858877582205234, probe_strike
# (--ticks 1800) 535291289754814419, probe_storm (--ticks 6480)
# 11434311098359716284, probe_scandiff 2488189563210329022, probe_corroborate
# 6231558379626882143, probe_restraint 1078282553163286478, probe_collapse
# (--ticks 3600) 5992449400465842350, probe_window (--ticks 2400)
# 8563713307821982951, and probe_destroy 14665104268980394769. None of them
# fields a moored civilian with nothing to do, and the shelter berth is authored
# per instance on a depot only this world spawns.
#
# What legitimately moves it: any edit to this file's entity list, positions,
# routes, condition/capacity numbers or deadline times; any change to the hulls
# it fields; and any engine change to what the authoritative digest folds. What
# must NOT move with it are the two shipped worlds — combat_test
# 14942520827746055774 and patrol 11531679067393217131 — because a world that
# adds entities of its own has no business touching a simulation it never
# enters.
#
# STILL 12497900250050242030 AFTER the AI-thrust-burst fix, and that is a claim
# rather than an oversight: this world fields two of the eight banded hulls
# (`ship_requiem_courier` and `ship_harrow_patrol`) as well as the player
# cruiser's inherited `fragments/ai/fleet_baseline.toml`. MEASURED: 0 helm power
# changes across the 900-tick window, banded or not. The band changes WHEN a helm
# channel gives its point back, and `ai_power_allocation` is
# `With<AiHighFidelity>`; the civilian traffic and the Havelock picket here are
# either low-LOD or under a doctrine throttle that never reaches the band, so the
# rule whose text changed never resolves. Every scenario assertion this world
# owns — the civilian arrivals, the tow completion, the storm crossings — is
# likewise unmoved, because none of them is timed off a helm power level.
#
# STILL 12497900250050242030 AFTER THE SLOW-ZONE SIGN FIX, and this world
# spawns three of the template that changed, so once again the hold is a claim.
# `region_radiation_band.toml`'s `[effects.slow_zone]` went from
# `thrust_modifier = 0.6` / `yaw_rate_modifier = 0.7` to `-0.6666667` /
# `-0.4285714`, from a radiation front that made ships 60% faster and 70% more
# agile to one that slows them to three fifths and seven tenths.
#
# THE MECHANISM HERE IS THE CLOCK, and it is the simplest of the four. The
# digest window is 900 ticks — fifteen mission seconds — and the first band
# does not exist until `storm_band_one_due` at t=145. There is no band in this
# world for the whole of the measured run, so no ship can be standing in one.
# The `-999.0` / `+999.0` A/B was run here as well and both reproduce
# 12497900250050242030 exactly, which is what that argument predicts.
#
# WHAT THE FIX DOES CHANGE HERE, past the digest window, is the corridor
# arithmetic this file's Act-2 prose is written against: a destroyer inside a
# band now makes 10.8 u/s rather than 28.8, so a 520-unit crossing costs 48
# seconds and 120 hull points instead of 18 and 45.
# `region_radiation_band.toml` carries the corrected table. The short form this
# file states — the destroyer survives crossing a band and does not survive
# living in one, and a 60-point hauler cannot cross one at all — is unchanged
# and, on the hauler, is now true by a factor of three rather than by three
# seconds. The full headless suite was re-run across the fix and every
# assertion this world owns still holds, including the Act-3 save margin
# (#1040) and the civilian divert.
#
# MOVED BY THE STATION-COLLIDER CORRECTION, to 0x97143e605be31a1d
# (10886394782840723997). John asked for the station colliders to match the
# hulls they are drawn as, and four templates were authored against sizes their
# meshes do not have. This world fields three of them.
#
# THE MECHANISM IS ONE TEMPLATE, and the A/B says so rather than the prose
# guessing. Reverting each correction alone, on this world, at this seed:
#
#   all four corrected                        0x97143e605be31a1d
#   `station_axiom` alone reverted to 12      0x97143e605be31a1d  ← no effect
#   `skyhook` alone reverted to 26            0x97143e605be31a1d  ← no effect
#   `depot_transfer` alone reverted to 10     0xad71760f8a82a5ee  ← #1043's, exactly
#
# So the whole delta is the two ladder depots, and the reason is the geometry
# this file already authors: `depot_ladder_a` and `depot_ladder_b` sit ON
# `depot_a_berth` and `depot_b_berth`, and `ladder_run`'s first and third legs
# fly a hauler to those same two anchors. A civilian on that route is commanded
# to the depot's own centre, so it spends the run inside the depot's collider,
# and the size of that collider is the size of the contact it resolves against.
# `alliance_research_outpost.glb` draws 7.56 x 3.37 x 7.59 at its `[base].scale`
# of [4, 4, 4] — a max half-extent of 3.80 against the 10 that was authored — so
# the hauler now settles against a ball a little over a third of the width it
# used to. The other two structures moved nothing because nothing in this world's
# 900-tick window goes near them: `skyway_control` sits at [-320, 0, -120], some
# 349 units off the nearest corridor anchor, and the skyhook's correction is a
# SHRINK from 26 to 17.04, which can only ever remove contacts.
#
# TICK 0 IS UNCHANGED at 3135162069797578640, and that is the shape of the
# claim: a collider radius is not spawn state, so the fold at load is identical
# and the divergence is entirely what the haulers do once they reach their
# berths.
#
# THE OTHER SIXTEEN ANCHORS ALL HOLD, measured twice on each side of the change:
# combat_test 14942520827746055774, patrol 11531679067393217131, probe_evidence
# 5001167740764356580, probe_strike (--ticks 1800) 535291289754814419,
# probe_scan 7851858877582205234, probe_storm (--ticks 6480)
# 13908044596492949404, probe_scandiff 2488189563210329022, probe_corroborate
# 6231558379626882143, probe_restraint 1078282553163286478, probe_collapse
# (--ticks 3600) 5992449400465842350, probe_window (--ticks 2400)
# 8563713307821982951, probe_destroy 14665104268980394769, probe_operations
# 14238567263822110364, duel 95852357729946676, rng_coverage
# 8393867315677906854 and probe_reinforce 9446242647445422197. Eleven of those
# sixteen DO field one of the corrected structures — every probe world with a
# depot or a skyhook in it — and they hold anyway, because a station collider
# only folds into a digest when something is touching it. This world is the one
# that parks traffic on top of one.
#
# NOT re-authored, and flagged instead: the berth anchors ARE the depot
# positions, so `ladder_run` steers civilians into a structure rather than
# alongside it. That was survivable while the collider was a phantom the model
# never filled and is survivable now that it is smaller still, but a berth that
# means "dock here" wants an offset from the hull it docks at, and moving one is
# a design call rather than a collider fix.
#
# ── STILL 0x97143e605be31a1d OVER PARAMETERISED TEXT, and why ────────────────
#
# The parameterised-strings slice edits THIS FILE's script band — `window_opens_
# short` gains a `params` map reading the three window flags — and edits the
# `strings.csv` row it names. The digest does not move, and that is a claim with
# two separate legs rather than an oversight.
#
# THE FIRST LEG IS THE ONE THIS HEADER ALREADY ESTABLISHED, four times over: a
# script band folds NOTHING. #1042's own paragraph records the A/B — delete the
# whole Act-3 script block and the number stays put — and #1043's four-corner
# matrix found deleting its entire band identical to deleting two mooring
# orders. Objectives, comms threads and dialogue bodies are authoritative but
# unfolded; `sim_digest.rs`'s module docs list them among the deferred surfaces
# by name. A `params` map on a node fn is more of exactly that.
#
# THE SECOND LEG IS THE ONE WORTH WRITING DOWN, because a reader who knows about
# issue #864's script binding will expect the opposite. Editing script text DOES
# move a digest — the CONTENT digest. `load_world_scripts` records
# `CompiledScripts::content_hash` into the content ledger under
# `<world path>#scripts`, and an inline `[script]` block rides in the world
# TOML's own recorded text besides, so this edit moves that number twice over.
# But `snapshot::content_digest` is the SAVE-COMPATIBILITY dimension —
# `Versions::check` refusing a save whose scripts have since moved — and it is
# NOT what this header blesses. The blessed number is `state_digest`, which
# `ReplayLedger::seal` computes from `world_digest` alone: run scope, entities,
# infrastructure, operations, civilians, weapons holds, asteroids, collisions.
# No script hash is in that fold, and no content-ledger entry reaches it. So a
# save recorded before this slice is correctly refused afterwards, and the run
# digest is correctly unmoved — the two answers differ because they are answers
# to different questions.
#
# The `strings.csv` half cannot reach either number: the fold sees a comms body
# as the id it is, and the id did not change. Only the English behind it did.
#
# MEASURED, on the committed tree, all three anchors this slice was asked to
# check: falling_skyway 10886394782840723997 (0x97143e605be31a1d), combat_test
# 14942520827746055774 and patrol 11531679067393217131 — every one unmoved, with
# the headless binary rebuilt from the changed tree rather than reused from
# before it.
#
# UNMOVED BY THE CYLINDER COLLIDER, which is worth recording because it is the
# only entry in this history that changed a station's shape and did not change
# this number. `station_axiom`, `skyhook`, `depot_transfer` and
# `station_outpost` became Y-axis cylinders — same radii, half-heights measured
# off their rig sidecars (7.16 and 1.68) — and every one of the seventeen
# anchors held, including this one. Varying the shipped depot cylinder one field
# at a time, here, at this seed:
#
#   r3.8   h1.68  (shipped)   0x97143e605be31a1d
#   r3.8   h0.01              0x97143e605be31a1d  ← no effect
#   r3.8   h17.04             0x97143e605be31a1d  ← no effect
#   r10.0  h1.68              0xad71760f8a82a5ee  ← #1043's, exactly
#
# Three orders of magnitude of half-height change nothing and the radius alone
# reproduces the pre-correction number, because EVERYTHING IN EVERY SHIPPED
# WORLD FLIES AT Y = 0 — the only non-zero Y authored anywhere in
# `assets/worlds/` is the ecumenopolis at -900 — and a hull centred on the plane
# is inside a disc centred there whatever its thickness. The vertical extent is
# the one dimension no shipped traffic tests, which is why the Ball's error was
# survivable and why removing it costs nothing here.
#
# MOVED BY THE BERTH OFFSETS, to 0x1fa0f17dd3285616 (2279086934165313046) — the
# design call the paragraph above declined to make, made. `depot_a_berth` and
# `depot_b_berth` were doing two jobs at once: they were the depots' own spawn
# positions AND `ladder_run`'s first and third legs, so the shuttle was
# commanded to the centre of a structure and told to hold there for six seconds.
# The anchors are now split — `depot_a_hull` / `depot_b_hull` carry the
# structures' positions unchanged, and the two berths stand twelve units off
# along the ladder's X axis, toward `ladder_transit`, which is the side the
# shuttle arrives from on both rungs. See the `[anchors]` table for why twelve.
#
# WHAT MOVED THE NUMBER IS THE AIM POINT, NOT A CONTACT, and the A/B is explicit
# about that because the obvious story is the wrong one. Shrinking the depot's
# collider from 3.8 to 0.01 moves this digest by nothing, on EITHER side of the
# offset — so the shuttle was not touching the depot before and is not touching
# it now. It never got that close: a hauler's 20-unit `waypoint_arrival_radius`
# ends the leg well short and `cruise_speed` returns 0.0 for the dwell, so it
# coasts to a stop some fifteen units out. The digest moves because the shuttle
# is steering at a point twelve units further along its own route, so it arrives
# on a different tick having flown a slightly different curve. The authoring bug
# was real and is fixed; the contact it would eventually have caused had not
# happened yet.
#
# THE MECHANISM IS ONE BERTH IN THIS WINDOW, and the A/B says so rather than the
# prose guessing:
#
#   both berths offset                        0x1fa0f17dd3285616
#   `depot_b_berth` alone offset              0x97143e605be31a1d  ← no effect
#   `depot_a_berth` alone offset              0x1fa0f17dd3285616  ← the whole of it
#
# Depot B is not reachable inside 900 ticks. `shuttle_wick` starts at
# [700, 0, -120], a hundred units from Depot A, and flies leg 0 at 0.7 of a
# hauler's 12 u/s — so it makes its first berth around twelve seconds in and is
# still holding there when the window closes. Depot B is another seven hundred
# units of route beyond that. Both berths are authored anyway: a mission runs
# for far longer than a digest window, and offsetting the rung the harness
# happens to reach while leaving the other would be authoring for the harness.
#
# TICK 0 IS UNCHANGED at 3135162069797578640, and that is the shape of the
# claim: the depots did not move. The `_hull` anchors carry their old
# coordinates to the metre, so the fold at load is identical and the divergence
# is entirely what the shuttle does once it flies its route.
#
# THE OTHER SIXTEEN ANCHORS ALL HOLD, measured twice on each side of the change,
# at the values listed two paragraphs above. None of them authors a route leg
# that lands on a structure: `probe_window` and the six probe worlds that field
# a depot author no `[anchors]` table at all and place every spawn literally;
# `probe_civilian_traffic`'s `depot_berth` does sit on its depot, but nothing
# routes to it — the one order that calls there targets the entity by name, and
# where a `dock` order puts a hull is `docking_engage_distance`'s business
# rather than an anchor's. In this world the two remaining candidates clear
# easily: `station_keeping` is 247.6 units off the skyhook and
# `head_debris_field` 184.4, against a 17.04 collider.

[global]
seed = 1034
title = "world.falling_skyway.global.title"
description = "world.falling_skyway.global.description"

# ── The dispute (issue #1035) ────────────────────────────────────────────────
#
# THE STRIKE IS ALREADY HAPPENING WHEN THE CREW ARRIVE. It is authored here
# rather than scripted on tick one for the reason the skyhook's 48 points are
# authored: the situation was under way before anybody sent a destroyer, and a
# world that had to script its own opening state would be describing a change
# nobody was there for.
#
# Two sides, and they are NOT factions. Both parties are Federation, neither
# will ever fire on the other, and the whole crisis is between them — folding a
# strike into the enemies list would have made "the line is down" mean "the
# depot is hostile" on every console that reads a faction.
#
# `disposition` is what each side makes of the crew, 0..=100. Nothing in Act 1
# branches on it; it is the state the negotiation (#1036) moves and the acts
# after it read. [ai] Both numbers unratified — the workers arrive suspicious
# and the operator arrives correct-but-cold, which is the opening the
# negotiation is written against.

[[workforce]]
id = "skyway_workers"
label = "world.falling_skyway.workforce.skyway_workers.label"
on_strike = true
disposition = 25

[[workforce]]
id = "havelock_operations"
label = "world.falling_skyway.workforce.havelock_operations.label"
disposition = 55

# ── Anchors ──────────────────────────────────────────────────────────────────
#
# The corridor runs north-south past the skyhook; the depot ladder runs out to
# the east of it. Everything a hull steers to is declared here — a doctrine or a
# route leg naming an anchor the composition does not declare is a load error,
# and rightly: an anchor has no runtime source, so a lookup that misses at load
# misses forever.

[anchors]
# The head of the tether, and the origin everything else is placed around.
skyway_head = [0.0, 0.0, 0.0]

# Where the destroyer holds station to work the skyway: off the head, out of the
# lane, close enough to hail everything in the corridor.
station_keeping = [180.0, 0.0, 170.0]

# The corridor, north to south. `corridor_gate` is the throat beside the head —
# the point every craft in the lane has to pass, which is why it is the one the
# scenario asks a question about.
corridor_north = [0.0, 0.0, -1100.0]
corridor_gate = [0.0, 0.0, -260.0]
corridor_south = [0.0, 0.0, 1000.0]

# The fuel-depot ladder, and the transit leg between its two rungs.
#
# FOUR anchors for two rungs, because a berth and a hull are not the same place
# and this file used to say they were. `depot_a_berth` and `depot_b_berth` were
# BOTH the depots' spawn positions AND `ladder_run`'s first and third legs, so
# the shuttle was commanded to fly to the exact centre of a structure and hold
# there for six seconds.
#
# WHAT SAVED IT WAS NOT THE AUTHORING, and that is the whole reason to fix it.
# A hauler declares `waypoint_arrival_radius = 20`, so `advance_cursor` calls
# the leg reached twenty units out; `TrafficState::cruise_speed` then returns
# 0.0 for the dwell, so the craft coasts down on its own 8.0 deceleration from
# leg 0's 8.4 u/s — about 4.4 units of run-out — and settles some fifteen units
# short of the anchor. Measured rather than reasoned: shrinking the depot's
# collider from 3.8 to 0.01 does not move this world's digest by a bit, so
# nothing was ever in contact. At the depot's PREVIOUS 10-unit collider it was,
# which is why #1043's number moved when that was corrected.
#
# So the bug was latent, not active: three separate accidents of tuning stood
# between a commanded course into a solid object and a craft inside one. Tighten
# an arrival radius, raise a leg speed, grow a collider back, or hand the rung
# to a hull with less drag, and a hauler parks in a depot. A berth that means
# "dock here" should not be relying on the craft being bad at arriving.
#
# So the `_hull` anchors are where the structures ARE, unmoved to the metre, and
# the `_berth` anchors are where a craft ties up alongside one.
depot_a_hull = [620.0, 0.0, -180.0]
depot_b_hull = [1180.0, 0.0, 240.0]

# TWELVE UNITS, along the ladder's own axis, on the side the run comes from.
#
# The number is the clearance the two hulls need, plus room to arrive in. A
# depot's collider is 3.8, a hauler's is 2.0, and `handle_collisions` separates
# to `r + r + 0.05` — so 5.85 is the closest a hauler can sit to a depot centre
# without being pushed off it. Twelve leaves 6.15 on top of that, more than the
# hauler's own four-unit beam, so a craft that overshoots its berth still stops
# clear instead of in contact.
#
# Not larger, because a berth still has to read as "at the depot". Twelve is
# inside the hauler's own 20-unit `waypoint_arrival_radius`, so the leg
# completes where it always did; inside the destroyer's 500-unit `transfer` and
# 300-unit `tow` ranges by two orders of magnitude; and under a tenth of the
# 130-unit gap from Depot B to the nearest mooring (`worker_mooring`, at
# sqrt(70^2 + 110^2) = 130.4), so nothing on that rung has moved relative to
# anything else.
#
# Along X because X is the ladder's axis — the run spans 560 of X against 420 of
# Z — and toward `ladder_transit` because that is the side the shuttle both
# arrives from and departs to on each rung. A berth on the far side would have
# it pass the depot, turn, and come back. [ai] Unratified, like every other
# coordinate in this table.
depot_a_berth = [632.0, 0.0, -180.0]
ladder_transit = [900.0, 0.0, 40.0]
depot_b_berth = [1168.0, 0.0, 240.0]

# Where the two parties sitting on Depot B are moored. Separate anchors rather
# than one, because "they are both at the depot" is the situation and "they are
# alongside each other" is not.
worker_mooring = [1110.0, 0.0, 350.0]
corporate_mooring = [1260.0, 0.0, 360.0]

# Where Havelock's hired picket sits (#1041). Its own anchor rather than the
# mooring beside it, because a picket parked on top of the boat it is guarding
# is not a picket.
corporate_picket = [1330.0, 0.0, 250.0]

# Where traffic gets held when the corridor cannot take it. Nothing in Act 1
# sends anyone here; the storm slice (#1037) does.
holding_arc = [-640.0, 0.0, 520.0]

# ── Act 2's places (issue #1037) ─────────────────────────────────────────────
#
# Where the radiation storm goes, and where everything that has to get out of
# its way goes instead. Every one of these was checked against the band radius
# `region_radiation_band.toml` authors (260 units): the three band centres are
# ON the corridor, and the three refuges are all more than a radius clear of
# every one of them. A shelter inside a band would be an authoring bug that
# nothing in Rust could catch.

# The three band centres, stepping down the corridor from the north end to the
# skyhook head. 340 units apart against a 260-unit radius, so consecutive bands
# OVERLAP: the storm reads as one front moving south rather than as three
# separate weather events.
storm_band_north = [0.0, 0.0, -760.0]
storm_band_gate = [0.0, 0.0, -420.0]
storm_band_head = [0.0, 0.0, -80.0]

# Where the Lyra Ascending is adrift — in the corridor, under the first two
# bands and clear of the third. She has been there since before the crew
# arrived, which is why she is an authored `[[entity]]` and not a spawn.
lyra_drift = [60.0, 0.0, -560.0]

# The lee of the storm: west of the corridor, clear of all three bands, and
# where the rescue objective points a helm — human or backfilled.
storm_lee = [-560.0, 0.0, -300.0]

# The traffic's way out. West FIRST, then south to the holding arc: a craft sent
# straight to the arc from the north end of the corridor would fly diagonally
# down the lane and through the sweep, which is the exact mistake the shelter
# run exists to stop.
shelter_west = [-880.0, 0.0, -300.0]

# ── The witness's place (issue #1039) ────────────────────────────────────────
#
# Where the rigger's own skiff is tied up: on the picket, with the committee,
# and NOT alongside them — she is one of the people the committee speak for, not
# one of the people speaking. Inside the destroyer's authored 1000-unit comms
# range from the ladder transit leg that #1036's line objective already sends
# helm to, so a crew who did that act's work can answer her without moving
# again. [ai] Unratified, like every other coordinate in this table.
rigger_mooring = [1050.0, 0.0, 430.0]

# ── Act 3's places (issue #1040) ─────────────────────────────────────────────
#
# Where the head's own craft end up when it comes apart. Off the head rather than
# at it, because the wreck is where the ribbon was and nobody survives sitting in
# it; and inside the destroyer's authored 300-unit `tow` range of
# `station_keeping`, so a crew who were doing their job in Act 3 are already
# close enough to start pulling people out.
head_debris_field = [120.0, 0.0, 140.0]

# The second craft, about a hundred and forty units further out — one tow's
# reposition away, which is what makes the epilogue a triage rather than a queue.
head_debris_drift = [220.0, 0.0, 240.0]

# ── Lanes ────────────────────────────────────────────────────────────────────

# The corridor run. Loops, so a craft left alone flies it for the whole mission
# — which is what makes "the lane stopped" an observable event later rather than
# the end of a script.
#
# `corridor_gate` is leg 0 deliberately: it is the waypoint the scenario asks
# about, and a lane that made the crew wait a full circuit before anything
# reached it would be authoring a countdown, not traffic.
[[route]]
id = "skyway_lane"
on_complete = "loop"

[[route.leg]]
anchor = "corridor_gate"
speed = 0.9
# They slow through the throat and hold briefly for clearance. Texture, and a
# reason for the gate to be a place rather than a coordinate.
hold_secs = 4

[[route.leg]]
anchor = "corridor_south"
speed = 0.9

[[route.leg]]
anchor = "corridor_north"
speed = 0.9

# The ladder run: the shuttle working between the two depot rungs. It keeps
# calling at Depot B even though Depot B is not pumping, which is exactly the
# kind of thing a crew notices and asks about.
[[route]]
id = "ladder_run"
on_complete = "loop"

[[route.leg]]
anchor = "depot_a_berth"
speed = 0.7
hold_secs = 6

[[route.leg]]
anchor = "ladder_transit"
speed = 0.8

[[route.leg]]
anchor = "depot_b_berth"
speed = 0.7
hold_secs = 6

# ── The player ship ──────────────────────────────────────────────────────────
#
# One hull: the Alliance Destroyer, which is the band-A crew hull and the one
# whose four stations (Captain, Helm, Tactical, Engineering) are the small-crew
# set this mission is tuned for. The `[[entity]]` row below is not replaced by
# this list — `spawn_game_start_entities` still needs a game-start "ship" entity
# to anchor position, uuid and tags on, and takes its loadout from the lobby
# selection — so its `template_path` is kept in step with `available_ships[0]`,
# the same rule `combat_test.toml` records at length.

[[available_ships]]

      rationale:
        - "Issue #830 dropped the legacy global ShipRepairTeams Resource: player and NPC ships alike read and write their own per-entity component, so there is no ship-wide singleton. The AI repair operator (operate_repair_ai) no longer writes team state directly — it emits an admitted system-control-command (DispatchRepairTeam) that host-repair-router applies."

  - state: campaign-flag-handoff-state
    core:
      status: implemented
      confidence: confirmed
      title: The Campaign Flag Handoff — What One Mission Leaves for the Next
      summary: "Issue #1043 (parent #852, Falling Skyway). The facts a finished mission hands forward to the missions after it, written as ordinary named counters in the base-world `FlagStore` under a `campaign.<mission>.<family>.<fact>` prefix. Falling Skyway writes six families at its close - who was carried in the transfer window and who was left on the rock, how the strike ended, how deep the evidence went and what was done with it, the casualties each beat cost, whether the skyhook held, and how many promises were kept and broken. FOUR of the six are EXCLUSIVE and exactly one member of each is always written, so a later mission reads a fact rather than inferring one from an absence. It is not a new record: it is a naming convention over state that is already authoritative, already censused and already snapshotted."
      rationale:
        - "[ai] IT REGISTERS NO NEW STATE, and that is the whole architectural claim rather than a convenience. A CampaignRecord resource or a per-mission component would be a second authoritative copy of facts the flag store already holds - needing its own census classification, its own snapshot field, its own fold decision and its own restore path - to answer questions a counter answers. `FlagStore` is a field on `WorldContentRuntime`, is accounted for in tests/authoritative_state_enumeration.rs, and rides `ScenarioState` in a save already. This is the same reading #1038 recorded for `scan.<id>.taken` and #1035 for `workforce.<id>.on_strike`: the one bit a later reader needs, written by the code that knows it, into the store that already carries that class of bit."
        - "[ai] THE PREFIX IS THE CONTRACT, not a type. There is no schema, no registry of family names and no validator, because a campaign flag has exactly one consumer shape - a `counter(name)` read from another world's script or predicate - and a table of legal names would be a second place to keep in step with the scenario that writes them. What replaces a schema is the EXCLUSIVITY INVARIANT: for a family with N mutually exclusive outcomes the writing mission writes exactly one, always, on every path that reaches the close. That is #1037's rule for `skyway_lyra_lost`/`recovered` and #1040's for `skyhook_lost`/`held`, generalised, and it is asserted from the run rather than from the code (`assert_the_campaign_record_is_complete`, applied to all four end-to-end paths)."
        - "[ai] WRITTEN AT ONE BEAT, FROM STATE, rather than accumulated as the mission goes. `write_the_campaign_record` runs once at the mission's close and derives every family from what the run actually left behind - the window's own served flags, the ledger's settled promises, the two casualty counters earlier beats banked. A record composed incrementally would have to be corrected whenever a later beat changed an earlier answer (a promise broken in Act 2 and a claimant lifted in Act 3 are both about the same captain), and the correction is the thing that goes wrong."
        - "[ai] IT IS AUTHORITATIVE BUT NOT FOLDED, exactly like `FlagStore` itself, `ObjectiveManager`, `DeadlineTable`, `CommitmentLedger` and `WorkforceRegister`: `state_digest` does not walk it. Falling Skyway's own baseline A/B measures that claim rather than asserting it - deleting the entire #1043 script band, six flag families and all, gives the identical digest to deleting the two civilian mooring orders inside it, so the record folds nothing and the two hulls that stopped drifting fold everything the slice moved."
        - "[ai] THE COMMITMENT HALF IS COUNTED OFF THE LEDGER, not tallied separately. `commitment.<id>.kept` / `.broken` are already emitted by the commitments vocabulary as ordinary flag writes, so the campaign family is a COUNT derived from `ctx.commitments.state(id)` at the close - which means a promise broken in Act 2 by a force-open and a promise broken in Act 3 by a refusal arrive in the same number without either beat knowing about the other."
        - "[ai] Casualties are itemised AND summed, because the two readings answer different questions: which beat of this mission hurt people is what a debrief needs, and how many it came to is what a later mission's opening disposition reads. The sum is derived at the same beat rather than maintained, so the two cannot drift."
    architecture:
      classification: authoritative
      owner: world-flag-store
      writers: [world-flag-store]
    implementation:
      status: declared
      # `src/snapshot.rs` is deliberately NOT listed, for the reason
      # `mission-deadline-state` and `commitment-ledger-state` omit it: it is a
      # whole-payload module whose own imports the scanner would attribute
      # wholesale to this entity. The persistence is `ScenarioState`'s existing
      # flag payload and needed no `SNAPSHOT_FORMAT` move, because this slice
      # adds no field - it writes names into a map that was already saved.
      paths:
        - src/world/flags.rs
        - src/world/server.rs
        - src/world/commitments.rs
      symbols:
        - FlagStore
        - Predicate
        - WorldContentRuntime
        - CommitmentLedger
        - CommitmentState
      tests: [cargo test, "cargo test --features headless --test headless_runner falling_skyway"]
    evidence:
      - kind: test
        reference: "tests/headless_runner.rs::falling_skyway_carries_the_workers_and_the_convoy_and_keeps_the_captains_word; ::a_captain_who_leaves_the_workers_behind_hears_the_promise_read_back; ::the_lift_runs_out_and_the_third_claimant_is_never_offered_one; ::the_early_collapse_leaves_one_berth_and_control_asks_for_a_name"
        summary: "Four whole runs of `falling_skyway.toml` from the lobby to the debrief, each taking a different road and each asserting all six families plus the exclusivity invariant. Between them they cover both strike resolutions, all three evidence depths, both skyhook fates, every pairing the window can carry and the early-collapse variant where it carries none; the casualty families differ per run and the same claimant costs 3 on one road and 4 on another. The commitments family is exercised at every value it can take: two kept and none broken, none kept and one broken, one of each, and a run where nothing was ever promised."

  - component: campaign-projection
    core:
      status: implemented
      confidence: confirmed
      title: The Campaign Projection — What Survives a Mission Boundary
      summary: "Issue #867 (parent #848). The pure fold from a finished mission's `vellum-save` snapshot to the facts the next mission may open on: the mission and its outcome, #1043's `campaign.*` handoff counters carried verbatim, the promises the run settled, what the crew found out, where they stand with each declared party, the named things still on the board, and what was done to the structures. `seed_flags` is the other end — the same facts back as the counters a later mission's script reads. Owns no state, registers no component or resource, and runs in no schedule: it is a function of a save."
      rationale:
        - "[ai] THE OUTPUT IS THE DECLARATION, because the input cannot be. `dossier-projection` excludes hidden truth by narrowing its input PORT — a fact with no field to arrive through cannot leak — and this fold cannot do that: its acceptance criteria fix the input as a whole authoritative snapshot, because that is the artifact a finished mission produces. So the gate moves to the far end. `CampaignFacts` has a field per declared family and no field for anything else, so a hull fraction, a beam's remaining seconds, a tube's load timer, an asteroid or an RNG position has nowhere to go; carrying one is a new field in a diff, next to the paragraph forbidding it."
        - "[ai] THE EXCLUSION TEST NAMES NOTHING IT EXCLUDES, and that is what keeps it true. It varies the transient state — mauls the hulls, arms the weapons, moves the ships, fills the belt, moves the tick and drops the generators — and asserts the facts are byte-identical. A list of excluded FIELDS goes stale the first time a component is added; a claim that nothing but the declared families can move the output does not. The end-to-end test repeats it on a real payload by serialising the facts and asserting no combat vocabulary appears in the text."
        - "[ai] IT IS A CONSUMER OF #1043's VOCABULARY, NOT A SECOND DECLARATION. `campaign-flag-handoff-state` says the prefix is the contract and there is deliberately no registry of family names; this module honours that by FILTERING on the prefix and carrying the counters verbatim, sorted, under the names the writing mission wrote. It knows no mission names and no family names. What it adds is the rest of the handoff — promises, findings, standing, assets, structures — which are already authoritative RECORDS rather than counters, and which a later mission would otherwise have to re-derive from a flag somebody remembered to write."
        - "[ai] SEEDING WRITES ONLY NAMES THAT ALREADY HAD OWNERS, for the same reason. `seed_flags` puts back the `campaign.*` tallies and `commitment.<id>.kept`/`.broken` through `commitments::kept_flag`/`broken_flag` — the two functions a mission writes with while it is running — and seeds standing, assets and structures NOWHERE, because no declared flag name owns them and minting one here would be the parallel registry #1043 refuses. Those travel as data for a later world's `[[entity]] overrides`, which is a different consumption shape and not a flag. A test asserts every seeded name starts with one of the two owned prefixes."
        - "[ai] IDENTITY IS THE AUTHORED NAME, NEVER THE UUID. A uuid is minted per run, so the skyhook in the mission that ends is not the skyhook in the mission that follows even where the fiction says it is. Every identity that leaves is `name_to_uuid`'s key, resolved backwards; a fact about an entity no name answers to is DROPPED rather than carried under a number the next mission cannot match. Proved by re-projecting the same payload with every uuid rewritten and asserting the facts are unchanged."
        - "[ai] A `campaign.` NAME IS SCRIPT-READABLE, NOT PREDICATE-READABLE, and this was measured rather than assumed. The predicate lexer's identifiers are `[A-Za-z_][A-Za-z0-9_:-]*` (`world::flags`), so a DOTTED name cannot appear inside `counter(...)`/`flag(...)` in a `when` clause at all — it is a parse error, not a false. The read that works is a script's `ctx.flags[\"campaign.skyway.strike.negotiated\"]`, which is what `falling_skyway` already does with its own record. Both families `seed_flags` writes are dotted, so both are script reads."
        - "[ai] NO I/O AND NO OPINION ABOUT THE BACKEND. `project` takes `&Run` and returns a value: it opens nothing, reads no clock, and cannot tell whether the save came from `LocalStorage`, a file, or the `TransferStore` an import travelled through (#866). A campaign is continuity between missions, not between storage backends."
        - "[ai] `FlagStore` gained one read-only accessor — `iter()` over the SET `(name, counter)` pairs — because the store had no enumeration at all and the prefix filter needs one. `set_flag_value(name, 0)` removes the entry rather than storing a zero, so an unset name and a cleared one are the same thing to every reader; that is what makes #1043's exclusivity invariant legible, since a family's answer is the member that is PRESENT."
    architecture:
      kind: subsystem
      authority: derived
      reads: [campaign-flag-handoff-state, world-flag-state, infrastructure-condition-state, dossier-evidence-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths:
        - src/campaign/projection.rs
        - src/world/flags.rs
      symbols:
        - CampaignFacts
        - CampaignPromise
        - CampaignFinding
        - CampaignStanding
        - CampaignAsset
        - CampaignStructure
        - CAMPAIGN_FACTS_VERSION
        - CAMPAIGN_FLAG_PREFIX
        - project
        - seed_flags
      tests:
        - cargo test
        - "cargo test --features headless --test headless_runner the_next_mission_opens"
    evidence:
      - kind: test
        reference: "tests/headless_runner.rs::the_next_mission_opens_on_what_this_one_left_behind"
        summary: "A whole run of `falling_skyway.toml` down its early-collapse road — the head comes down before the transfer window opens, Control offers one berth on the rung, the convoy takes it and two claimants are left on the rock — then the save a host would have taken, projected. Every `campaign.` counter the mission actually wrote is asserted present at its written value (read off the live store rather than from an expectation list, so a dropped family is caught even where the test does not presume which member answered), all six families are represented by prefix, the structures travel under their authored names, and the serialised facts are asserted to contain no combat vocabulary. It then does the two things a later mission would: seeds a flag store and reads the counters its script would read, and maps the structures onto the condition an `[[entity]] overrides` would carry."

  - component: infrastructure-condition-tracker
    core:
      status: implemented
      confidence: confirmed
      title: Infrastructure Condition Tracker
      summary: Advances the condition track on every entity that authored `[infrastructure]`, folding in authored decay, the hull the entity lost since the previous tick, and any condition adjustment a script queued this tick; mirrors each resulting operational-flag crossing into the world flag store and queues the matching FlagSet/FlagCleared world event.
      rationale:
        - "[ai] ONE write site. Condition moves for three reasons - authored decay, damage, and a scripted repair or hit - and a threshold crossing is only observable if the code that crosses it is also the code that mirrors the resulting flag. Scripted adjustments are therefore QUEUED on the world runtime and drained here rather than applied where they are authored; an effect writing the component directly would cross a threshold with nobody listening."
        - "[ai] Damage arrives as a LEVEL observation of the entity's aggregate hull, not as a hook on each damage site. Beam, torpedo and blaster already damage non-ship entities, region zones and collisions are ship-gated today, and further hazards are still to come; watching the level catches all of them without editing any damage site, present or future. It is the same shape collect_world_events already uses to derive HullDroppedBelow."
        - "[ai] Hysteresis is structural, not advisory: a threshold is edge-triggered against the STORED flag, and its restore point defaults to fails_below plus the authored hysteresis band, so a condition parked on the boundary sits in a dead band and reports no transition. Authoring an equal restore point opts out; a restore point BELOW the failure point is refused at load."
        - "[ai] The crossing reaches a script hook one tick later, via the same pending_world_events queue WaypointReached rides: this runs in SimSet::Modifiers, after collect_world_events has already run for the tick."
        - "[ai] Issue #1027 put CAPACITY moves through the same one-write-site rule, and for a sharper version of the same reason. A capacity is mirrored onto a world-flag counter that a scenario predicate reads, so a transfer writing the component itself would move the goods and leave every counter() test reading the figure the depot was authored with. Moves are queued on the runtime and drained here, and the counter is re-published whenever the structure did any work rather than only on its first tick."
        - "[ai] A capacity move returns NO flag changes, where a condition move returns the thresholds it crossed. A capacity is a published QUANTITY rather than an operational state: 'this depot has berths' was never an event, and 'it now has twelve fewer' is not one either. The level is clamped to 0..=ceiling as a backstop, not as the check - the operations module has already asked whether both ends can take part."
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [infrastructure-condition-state]
      reads: [world-configuration-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths:
        - src/infrastructure/condition.rs
        - src/infrastructure/server.rs
      symbols:
        - InfrastructureConfig
        - InfrastructureState
        - InfrastructureCondition
        - InfrastructurePlugin
        - tick_infrastructure_condition
        - CapacityAdjustment
      tests: [cargo test]

  - state: infrastructure-condition-state
    core:
      status: implemented
      confidence: confirmed
      title: Infrastructure Condition And Capacity State
      summary: "Per-entity structural condition, the authored degradation thresholds over it and the named operational flags they hold (transfer_capable, docking_capable, whatever a scenario declares), plus the entity's named capacities and how much of each it currently holds. Authoritative: it decides whether a structure can still transfer, dock or hold, so two hosts that disagreed about it would disagree about whether a mission is winnable."
      rationale:
        - "[ai] FOLDED into the authoritative-state digest, in a namespace of its own, keyed on the minted entity id. Condition, ceiling, every operational flag and - since #1027 - every capacity LEVEL are in. The capacity CEILING is not: it never moves, so a divergence in it is a content divergence that content_digest is the thing to catch. The level was in the same bucket until #1027, when the transfer verb made it movable; leaving it out after that would let two hosts disagree about how many berths a depot has left, which is a disagreement about whether the mission can be finished."
        - "[ai] A capacity is a LEVEL with a CEILING, resolved at load the way a threshold is - the authored table says what a structure starts with and the live one says what it has now. An unauthored ceiling IS the starting amount, which is what keeps every capacity written before transfers existed meaning exactly what it meant: this is what the depot holds, and it can be emptied and refilled to there and no further."
        - "[ai] That namespace folds NOTHING when it is empty, unlike every other walk in the fold, which folds its row count first. No world authors an infrastructure table today, and folding a zero for all of them would have moved every committed world digest over state none of them carry. A world with no structures and a world built before the feature existed are the same authoritative state, so they fold to the same number; as soon as one structure exists the count is in the accumulator like everyone else's."
        - "[ai] Snapshotted WHOLE rather than as a scalar projection, because the track carries which flags are currently down alongside the number and the two have to come back together - restoring the condition alone would re-detect, and re-fire, every crossing the mission already spent."
        - "[ai] Nothing here is a hidden-truth field. The published condition IS the truth; a maintenance dossier that contradicts it is authored as its own content. The only authored control is publish, which keeps a structure off the wire entirely."
    architecture:
      classification: authoritative
      owner: infrastructure-condition-tracker
      writers: [infrastructure-condition-tracker]
      replicas: [infrastructure-published-state]
    implementation:
      status: declared
      paths: [src/infrastructure/condition.rs]
      symbols:
        - InfrastructureState
        - ConditionAdjustment
        - ResolvedThreshold
        - ResolvedCapacity
        - CapacityConfig
        - CapacityAdjustment
        - ThresholdConfig
      tests: [cargo test]

  - state: infrastructure-published-state
    core:
      status: implemented
      confidence: confirmed
      title: Published Infrastructure State
      summary: The client-visible projection of a structure's condition fraction, operational flags and capacities, carried on the entity wire snapshot wherever one is minted and only when the scenario authored publish = true.
    architecture:
      classification: client-projection
      owner: infrastructure-condition-tracker
      writers: [infrastructure-condition-tracker]
    implementation:
      status: declared
      paths: [src/core/messages.rs]
      symbols: [InfrastructureSnapshot]
      tests: [cargo test]


  - component: external-operation-runner
    core:
      status: implemented
      confidence: confirmed
      title: External Operation Runner
      summary: Runs the external operations a crewed ship performs on things outside its own hull - stabilise, tow, escort, transfer and field-repair, all on one spine. Decides eligibility from proximity, the hull's authored capability, available power, free repair teams and both ends' capacities; applies the authored interrupt rules for fire and hazard-band membership; advances a timed hold at the resulting rate; holds a towed craft on the operator's rig; and pays what the operation earned into the infrastructure condition and capacity queues.
      rationale:
        - "[ai] NO MINIGAMES, per PRD #851. An operation is eligibility plus a timed hold the crew maintain through the consoles they already have - helm holds station inside the authored range, engineering keeps the power group allocated. Nothing new is asked of the crew; the operation counts the ticks during which they managed it."
        - "[ai] Ops slices split by VERB, not by layer. Stabilise shipped through every layer - entity TOML vocabulary, pure module, ECS adapter, script effect, admitted player command, wire, console, probe world - so the verbs after it are authoring rather than architecture. #1027 tested that prediction and it held: the four remaining verbs are one enum variant, one script host fn and one capability block each, and the five script effects are registered from a LOOP over the (name, verb) pairs because they differ only in the constant they push."
        - "[ai] VERBS ARE DATA. There is exactly one match on the verb that decides anything - OperationVerb::default_requirement, which says what a target has to BE for the word to mean anything, and which a capability can override in TOML. Everything else that separates a tow from a field-repair is an authored field on the capability block: what it pays on completion, what it pays per second, how many repair teams it commits, where a towed load rides, how far an escortee may stray, what a transfer moves and which way, and what interrupts it. One eligibility function reads all of them and has no verb-specific arm in it."
        - "[ai] INTERRUPTS ARE IMPLEMENTED ONCE, for every verb, as authored rules naming a cause (attack, region membership) and a response (slow, pause, fail). TERMINALITY IS AUTHORED, which is the whole point: the same under_attack cause pauses a tow and fails a field-repair on the same hull in the same mission, because whether a crew may keep working through fire is a designer's judgement about the job and not a property of the word 'attack'. Two rules that both fire take the STRICTER response and two slows take the lower rate, so a capability carrying both cannot get a different answer depending on which line the designer typed first."
        - "[ai] Power loss is deliberately NOT an interrupt cause even though the issue lists it as one. It was already an eligibility condition tested against the live grid every tick, and a second spelling would let one capability author two different answers to the same question. Eligibility is asked BEFORE the interrupts for the same reason a console reports the most actionable refusal first: an operation that is out of range is not running at a reduced rate, and must not be FAILED by a rule it was never close enough to meet."
        - "[ai] SLOW STRETCHES, IT DOES NOT CANCEL - the storm's shape. The rate is whole percent and the hold banks a sub-tick remainder, so four ticks at 25 per cent are worth exactly one tick of hold with the fraction carrying rather than rounding away. At the full rate the remainder fills and empties within the tick, which is what keeps every pre-#1027 tick-count assertion reading the same number. A slowed tick is not a stalled one, so a slow never spends the authored stall budget however long the band lasts - where a pause does, because a pause IS a stall."
        - "[ai] FIELD-REPAIR PAYS PER TICK where stabilise pays a lump, and the two are separate authored fields rather than one with a flag so an author cannot get both by accident. A repair party is doing good the whole time they are there and a crew pulled off two thirds through keep two thirds of it; a half-finished STABILISE leaving half the points behind would make abandoning one a strategy. The per-tick payout is scaled by the tick's rate, because a payout that ignored the rate would make parking in a storm a way of farming condition points."
        - "[ai] CAPACITY AS COST for field-repair (the decided model, reusing #1013's repair teams rather than inventing a second notion of availability). The authored team count is unavailable to the ship's own repair work while the hold runs. Derived from the live hold rather than stored, so 'released on completion or abort' is true by construction - there is no release step to forget and nothing extra for a save to carry. The teams never leave the hull and are still Idle in every readout; they are spoken for, not dispatched. BOTH dispatch paths read it, the AI sweep and the console's manual dispatch, because humans and AI issue the same command and a commitment one path honoured would be a trade a player could opt out of by tapping the console."
        - "[ai] THE TOW WRITES THE TARGET'S POSITION DIRECTLY, and that is a considered call. Nothing in this codebase attaches one entity to another - no dock, no parent, no carried marker, no orbit mover - and the only sanctioned precedent for overriding a ship's authoritative position is the ShipPhysics writer-policy table: collision de-overlap, blaster recoil, the low-LOD substitute. A tow is that exact shape, a correction layered on top of the helm integration rather than a second integrator, so it is a fifth row in that table and the test that pins the table's size moves with it. The rig is STATELESS - the load sits at the authored offset in the operator's own frame, so a tug that turns swings it round - which is what keeps the tow out of the save and out of the digest beyond the hold that is already there."
        - "[ai] A TOW IS A PHYSICAL OVERRIDE, NOT AN ORDER. A towed civilian goes on publishing whatever route directive #1028 gave it and goes on complying or refusing exactly as before, because the compliance state machine is about orders. What the tow does take away is the motion - the three speed fields are zeroed - so a craft released from the rig does not shoot off at a velocity its helm accumulated against a position it was never allowed to reach. A tow that STALLS lets go, because only a hold that is actually holding drags anything."
        - "[ai] ESCORT needed almost nothing, which is the spine working: the distance is already recomputed each tick against wherever the escortee has got to. Its one addition is a separation limit, tested BEFORE the range because it is the TERMINAL one - checking range first would report a recoverable out-of-range for a convoy that has already gone, and the hold would stall forever waiting for it."
        - "[ai] TRANSFER asks BOTH ends every tick, whichever way the load is going: the source must hold the authored amount and the destination must have room for it. A transfer that checked only the source would overfill the depot; one that checked only the destination would move goods that were never there. A full depot STALLS - a crew waiting for a berth to clear is playing the game - while a target that carries no such capacity at all is INAPPLICABLE, because 'no room' would send them away to wait for a berth that is never coming. Both ends move on completion, source first, so two hosts queue the pair identically."
        - "[ai] The interrupt signals come from the real world rather than from flags something else set: RecentCombatActivity folded through the same landed-hits reading the doctrine gates take, so firing your own guns is not being interrupted, and RegionMembership, which is recomputed one SimSet earlier. The region-effect vocabulary is a TOTAL match on the live effect kind, so a new hazard band will not compile until it is authorable - a hazard nobody can write a rule for is a hazard operations cannot be told about."
        - "[ai] The eligibility verdict and the progress arithmetic are PURE and Bevy-free; the adapter gathers the live inputs and applies what comes back, and decides nothing itself. Proximity reads Transform on both ends rather than ShipPhysics, so something that is not a ship can perform an operation and so the target end never had a choice."

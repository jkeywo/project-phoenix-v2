      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      background: var(--surface-card); color: var(--ink-faint);
      /* --edge-strong: the ladder's --surface-card rung, 3.90:1. Unarmed is
         not disabled — the bar is the surface's primary control and has to be
         findable before it lights — and --edge-control is 2.94 on the card. */
      border: 1px solid var(--edge-strong); border-radius: 0;
      transition: color .3s ease, background .3s ease, border-color .3s ease;
      clip-path: polygon(
        var(--control-cham-lg) 0, 100% 0,
        100% calc(100% - var(--control-cham-lg)),
        calc(100% - var(--control-cham-lg)) 100%, 0 100%, 0 var(--control-cham-lg)); }
    #ready-btn.armed { display: block; background: var(--cyan-deep);
      border-color: var(--cyan); color: var(--signal); }
    #ready-btn.armed:hover { background: var(--cyan-dim); }
    #ready-btn.armed.glow { animation: ready-pulse 1s ease-in-out infinite; }
    /* Inset, like #ready-pill's: the bar's chamfer is a clip-path, and a
       clip-path clips an OUTER glow away to nothing (issue #1369's note). */
    @keyframes ready-pulse {
      0%, 100% { box-shadow: inset 0 0 6px rgba(var(--rgb-signal), 0.3); }
      50%       { box-shadow: inset 0 0 18px rgba(var(--rgb-signal), 0.7); }
    }
    #ready-btn:disabled { opacity: 0.4; cursor: default; animation: none !important; }
    #spectate-btn { flex: 0 0 auto;
      min-height: var(--control-hit-min); padding: 0 var(--space-5);
      display: none; align-items: center; justify-content: center;
      width: auto; margin: 0; text-align: center; cursor: pointer;
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      background: var(--surface-panel-up); color: var(--ink);
      /* --edge-bright, the rung the ladder in gui/tokens.css gives a control
         filled --surface-panel-up: 3.46:1. --edge-control is the GROUND rung
         and measures 2.20 against this fill, under 1.4.11's 3:1. */
      border: 1px solid var(--edge-bright); border-radius: 0;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md)); }

    /* Every control above is chamfer-clipped, and a clip-path clips an OUTSET
       focus ring away with it — so they draw the ring INSET, exactly the way
       gui/components/ph-console-styles.js does for the .btn family. The ring's
       colour and thickness come from the focus tokens, so the high-contrast
       swap under data-contrast="more" reaches the lobby too. */
    #lobby-ui .station-row .action button:focus-visible,
    #lobby-ui #detail-panel .chip:focus-visible,
    #lobby-ui #detail-panel .rating-btn:focus-visible,
    #lobby-ui #detail-panel .detail-release-btn:focus-visible,
    #lobby-ui #spectate-btn:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 var(--focus-ring-width) var(--focus-ring);
    }
    /* The Ready bar's pulse animates the same property the ring is drawn in,
       and an animation outranks it — so focusing the bar holds the glow still
       and shows the ring. Focus is transient; an invisible ring is not. */
    #lobby-ui #ready-btn:focus-visible {
      outline: none; animation: none;
      box-shadow: inset 0 0 0 var(--focus-ring-width) var(--focus-ring);
    }

    /* ── Orientation ─────────────────────────────────────────────────────
       The one place the lobby's layout changes, and it is a media query: the
       document is the same in both frames and the VIEWPORT chooses, so
       rotating a phone re-lays out one screen rather than swapping between
       two. Portrait is everything above; landscape stands #lobby-side up as a
       rail beside the roster and compacts the rows to a thumb. The per-seat
       job line SURVIVES that: dropping it is a short-viewport measure and has
       its own query below.

       Scoped to #lobby-ui wherever it names `.station-row`, because the
       spectator claim list (#spectator-claims, issue #1106) reuses that class
       and is not the surface any of this was drawn for. */
    @media (orientation: landscape) {
      #lobby-body { flex-direction: row; align-items: stretch; }
      #station-list { flex: 1 1 auto; min-width: 0; }
      #lobby-side {
        display: flex; flex-direction: column; gap: var(--space-4);
        flex: 0 0 clamp(200px, 30vw, 260px); min-height: 0; overflow-y: auto;
      }
      /* The card takes the rail's slack and scrolls INSIDE itself, so the
         command row below it stays on screen: Ready is the primary control of
         the whole surface and must never be the thing pushed off the bottom.
         It stops shrinking at a floor of one header plus a line, and past that
         the rail itself scrolls (the 320px-tall landscape case) rather than
         crushing the card to a sliver that crops LEAVE in half. */
      #detail-panel { flex: 1 1 auto; overflow-y: auto;
        min-height: calc(var(--control-hit-min) + var(--space-7)); }
      #lobby-ui .station-row { min-height: var(--control-hit-min);
        padding: var(--space-3) var(--space-4); gap: var(--space-4); }
      #lobby-footer { flex-direction: column; align-items: stretch;
        margin-top: auto; }
      #ready-btn, #spectate-btn { flex: 0 0 auto; width: auto; }
      #ready-btn { height: calc(var(--control-hit-min) + var(--space-4));
        font-size: var(--text-md); }
      #status-line { flex: 0 0 auto; }
    }

    /* The one thing the landscape layout REMOVES rather than moves, gated on
       the height that actually motivates it. AC1 asks every row for what the
       seat does and PRD #1355's user story 47 is reading that BEFORE claiming,
       so a landscape desktop — hundreds of spare pixels — has to keep it. A
       phone held sideways is ~390px tall and genuinely has none, and there the
       seat the player holds still carries its description in #detail-panel.
       Orientation AND height, then; never orientation alone. */
    @media (orientation: landscape) and (max-height: 500px) {
      #lobby-ui .station-row .info .desc { display: none; }
    }

    /* ── Settings panel ──────────────────────────────────────────
       Gear button fixed at top-left, overlay modal centered.
       Mounted by gui/settings-panel.js.

       Top-left rather than the pre-#940 bottom-left: it mirrors the host
       page's cog, and bottom-left is already #status's corner.

       z-index 195, not 60. Issue #939 hit exactly this trap on the host page —
       a cog buried under full-viewport panels is unreachable in most of the
       states you want it in. On this page those panels are #coordination-popup
       (180), #waiting-overlay (185), #scenario-picker-overlay (186) and
       #game-over-overlay (190), so the gear has to clear all four. It stays
       BELOW #asset-loading (200), which is a genuine "nothing is ready yet"
       screen. The overlay it opens is 1000, above everything.

       This rule is the PAGE-BODY home, which the cog and the help button keep
       for the lobby and for the four full-viewport surfaces they must stack
       above. In game both are re-parented into #station-hero and the rule above
       that one turns the fixed corner off (issue #1372).

       40px of INK, 44px of TARGET. The drawn box is 40 wide so two of them plus
       the tabs fit across a 390px phone; the pseudo-element below widens the
       hit area back to the platform floor without widening the picture — the
       same escape gui/components/ph-console-styles.js documents for the power
       pips. The 4px inset keeps the pair inside the clearances the lobby and
       gui/console.css already reserve. */
    .settings-btn {
      position: fixed;
      top: 4px;
      left: 4px;
      z-index: 195;
      width: 40px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-lg);
      line-height: 1;
      color: var(--ink-faint);
      background: rgba(var(--rgb-panel), 0.7);
      border: 1px solid var(--edge);
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      /* Both zeroed explicitly. The page's shared `button` rule carries a
         vertical margin, and this box's whole job is to be exactly the
         rectangle its top/left/width/height declare — the lobby's clearance and
         the bar's 52px strip are both computed from those four numbers. */
      padding: 0; margin: 0; min-height: var(--control-hit-min);
    }
    /* The touch target, centred on the ink and never smaller than it. */
    .settings-btn::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: max(100%, var(--control-hit-min));
      height: max(100%, var(--control-hit-min));
    }
    /* The help button sits beside the cog in the body corner (and last in the
       bar). 48px = the cog's 4px inset + its 40px of ink + a 4px gap, which is
       exactly the width the two 44px targets need to stop overlapping — an
       expanded target that laps its neighbour's steals taps that belonged to
       the neighbour. */
    .help-btn { left: 48px; }
    .settings-btn:hover { color: var(--ink); border-color: var(--loaded); }
    .settings-btn:active { background: rgba(var(--rgb-panel-up), 0.85); }
    .settings-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(var(--rgb-deep), 0.88);
      cursor: pointer;
    }
    .settings-overlay[hidden] { display: none; }
    .settings-overlay .settings-popup {
      cursor: auto;
      background: var(--surface-panel);
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      min-width: 260px;
      max-width: 340px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    /* The client has two documentation tabs in addition to the host's controls. */
    .settings-tabs {
      display: flex; gap: 0.3rem; flex-wrap: wrap;
      border-bottom: 1px solid var(--edge);
      padding-bottom: 0.5rem;
    }
    .settings-tab {
      display: block; width: auto; margin: 0; flex: 1;
      padding: 0.35rem 0.4rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      text-align: center;
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-tab.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .settings-body {
      display: flex; flex-direction: column; gap: 1rem;
      max-height: 60vh; overflow-y: auto;
    }
    .settings-documentation { display: flex; flex-direction: column; gap: 0.7rem; }
    .station-help-group { display: flex; flex-direction: column; gap: 0.65rem; }
    .station-help-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.12em;
      color: var(--signal); text-transform: uppercase;
    }
    .station-help-sections { display: flex; flex-direction: column; gap: 0.65rem; }
    .station-help-section-title {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.08em; color: var(--ink);
    }
    .station-help-section-body {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); line-height: 1.45; color: var(--ink-faint); margin-top: 0.15rem;
    }
    .settings-section { display: flex; flex-direction: column; gap: 0.4rem; }
    .settings-section-hint {
      font-size: var(--text-sm); color: var(--ink-faint); line-height: 1.35;
    }
    .settings-section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--signal);
      text-transform: uppercase;
    }
    .settings-rating-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .settings-rating-btn {
      display: block; width: auto; margin: 0;
      padding: 0.35rem 0.7rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-rating-btn.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .settings-rating-btn:active { background: var(--cyan-dim); }
    .settings-binding-row { display: flex; gap: 0.5rem; }
    .settings-binding-label {
      display: grid; grid-template-columns: minmax(4.5rem, auto) minmax(8rem, 1fr);
      align-items: center; gap: 0.6rem; width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); color: var(--ink-faint);
    }
    /* The gamepad <select> otherwise falls to the UA default, which on a dark
       page renders the chosen device as dark text on a dark field — invisible.
       Paint it from the panel tokens so the selection is legible, and colour
       the drop-down list too (some engines need the option colours spelled
       out or they inherit the OS default rather than the control's). */
    .settings-binding-label select {
      min-height: var(--control-hit-min); width: 100%; box-sizing: border-box;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink);
      font: inherit; padding: 0.3rem 0.4rem; cursor: pointer;
    }
    .settings-binding-label select:focus {
      border-color: var(--signal); outline: 2px solid var(--signal); outline-offset: 2px;
    }
    .settings-binding-label select:disabled { opacity: 0.6; cursor: default; }
    .settings-binding-label select option {
      background: var(--surface-panel-up); color: var(--ink);
    }
    .settings-binding-capture {
      min-height: var(--control-hit-min); width: 100%; box-sizing: border-box;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink);
      font: inherit; text-align: center; cursor: pointer;
    }
    .settings-binding-capture:focus {
      border-color: var(--signal); outline: 2px solid var(--signal); outline-offset: 2px;
    }
    .settings-binding-feedback,
    .settings-binding-conflict {
      display: flex; flex-direction: column; gap: 0.45rem;
      padding: 0.65rem; border: 1px solid var(--warning);
      background: var(--surface-panel-up); color: var(--warning);
      font-family: 'JetBrains Mono', monospace; font-size: var(--text-sm);
    }
    .settings-binding-conflict-heading {
      font-family: 'Chakra Petch', sans-serif; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .settings-binding-conflict-item { color: var(--ink); }
    .settings-binding-conflict-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .settings-vol-row {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .settings-vol-row input[type="range"] {
      flex: 1; height: 4px;
      -webkit-appearance: none; appearance: none;
      background: var(--edge); border-radius: 2px;
      outline: none; margin: 0;
    }
    .settings-vol-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 1rem; height: 1rem; border-radius: 50%;
      background: var(--signal); cursor: pointer; border: none;
    }
    .settings-vol-row input[type="range"]::-moz-range-thumb {
      width: 1rem; height: 1rem; border-radius: 50%;
      background: var(--signal); cursor: pointer; border: none;
    }
    .settings-vol-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); color: var(--ink-faint);
      min-width: 2.5rem; text-align: right;
    }
    .settings-action-btn {
      display: block; width: 100%; margin: 0;
      padding: 0.5rem 0.75rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink);
      text-align: center;
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .settings-action-btn:active { background: var(--cyan-dim); }
    .settings-leave-btn {
      border-color: var(--fire-hot); color: var(--fire-hot);
    }
    .settings-leave-btn:active { background: rgba(var(--rgb-fire), 0.1); }

    /* ── Ship manual content in the Settings menu ──────────────── */
    .manual-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .manual-tab {
      padding: 0.3rem 0.6rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-xs); font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;
      background: var(--surface-panel-up); color: var(--ink-faint);
      touch-action: manipulation; min-height: var(--control-hit-min);
    }
    .manual-tab.active {
      background: var(--surface-panel-up); border-color: var(--signal);
      color: var(--signal);
    }
    .manual-panel-host { overflow-y: auto; }
    .manual-station-panel { display: flex; flex-direction: column; gap: 0.7rem; }
    .manual-overview {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); line-height: 1.5; color: var(--ink);
      white-space: pre-wrap;
    }
    .manual-section {
      display: flex; flex-direction: column; gap: 0.25rem;
      border-top: 1px solid var(--edge); padding-top: 0.5rem;
    }
    .manual-section-heading {
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--signal);
    }
    .manual-metric {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm); color: var(--ink-faint);
    }
    .manual-automation-heading {
      margin-top: 0.35rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-xs); font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    .manual-automation-row {
      display: flex; gap: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-xs); color: var(--ink-faint);
    }
    .manual-rating-name { color: var(--signal); min-width: 5rem; }
    .manual-rating-systems { flex: 1; word-break: break-word; }

    /* ── Reduced motion, continued ──────────────────────────────
       These loops hold a BRIGHTER frame than their base while the global layer
       in gui/tokens.css (issue #1172) collapses the motion off both the OS
       media query and the stamped `data-reduced-motion` attribute.

       Attribute-driven, matching the bezel above: they land when the profile
       stamps `reduce` and step aside for an explicit OFF, so the tri-state
       resolves both ways. And an attribute selector adds specificity where a
       bare `@media` override did not: `@media (prefers-reduced-motion)
       { #ready-pill.go { animation: none } }` weighs exactly as much as the
       `#ready-pill.go` that starts the pulse, so it had to be written LATER to
       win — the reason these once lived last in the file. The
       `:root[data-reduced-motion="reduce"]` prefix outweighs the loop rule
       outright, so they now win wherever they sit. */
    /* The two spinners. A spinner says "still working", and a ring with one
       arc in a different colour still reads as a progress indicator that has
       stopped moving — which is honest, because the work IS proceeding.
       Removing it would leave a blank panel reading as broken, which is a
       defect this same PRD fixes elsewhere. */
    :root[data-reduced-motion="reduce"] #asset-loading .spinner-ring,
    :root[data-reduced-motion="reduce"] #waiting-overlay .spinner-ring {
      animation: none;
    }
    /* The indeterminate progress bar (issue #1368), by the same reasoning one
       step on: the sweep stops, and the sliver it was sweeping becomes the
       whole track at reduced opacity. What the movement was carrying -- "this
       is working, and there is nothing here to count" -- survives it, which is
       the rule the whole layer is written to: still the motion, keep the
       information. It has to outrank `.ld-bar.indet .ld-fill`'s own 34%, and
       the `:root[...]` prefix is what buys that; the width is in the
       stylesheet rather than written from script precisely so this can win. */
    :root[data-reduced-motion="reduce"] .ld-bar.indet .ld-fill {
      animation: none;
      width: 100%;
      opacity: 0.4;
    }
    /* The two "you are good to go" glows, held at the peak of their own pulse
       so the ready state is still the brightest thing in the footer. */
    :root[data-reduced-motion="reduce"] #ready-pill.go {
      animation: none;
      /* Inset, like the loop it holds: the badge's chamfer (issue #1369) is a
         clip-path, and a clip-path clips an outer glow away to nothing. */
      box-shadow: inset 0 0 12px rgba(var(--rgb-signal), 0.5);
    }
    :root[data-reduced-motion="reduce"] #ready-btn.armed.glow {
      animation: none;
      /* Inset, like the loop it holds: the bar's chamfer (issue #1370) is a
         clip-path, and a clip-path clips an outer glow away to nothing. */
      box-shadow: inset 0 0 18px rgba(var(--rgb-signal), 0.7);
    }
  </style>
</head>
<body>
  <!-- UI click sound (played from JS). -->
  <audio id="ui-click" src="assets/sounds/ui_click.ogg"></audio>

  <!-- This is a pure-JS console (issue #463): no client-side WASM. The page
       and its assets are shipped to dist/client/ by scripts/build-client.mjs
       (npm run build:client) — a plain file copy, NOT a Trunk build, because
       Trunk would implicitly compile the crate's default (server) lib into a
       WASM bundle and inject a loader even with no `rel="rust"` link.
       All client state lives in the gui/*.js modules loaded in <head>. -->

  <!-- Console container: full-screen flex layout host for all in-game
       console sections. Portrait (column) vs landscape (row) is decided by
       `@media (orientation: …)` — in this page's own stylesheet and in
       gui/console.css — and by nothing else. It used to carry a
       `data-orientation` attribute that render() recomputed on every paint
       from gui/device-orientation.js; no stylesheet ever selected it, so it
       was a second answer to a question the browser already answers, and
       issue #1370 removed the attribute, the writer and the module. -->
  <div id="console-container">

    <section id="lobby-ui">
      <!-- Ship header -->
      <div id="lobby-header">
        <div id="ship-info">
          <div id="ship-name" data-i18n="client.default_ship_name">Phoenix</div>
          <div id="ship-mission" data-i18n="client.standing_by">Standing by</div>
        </div>
        <div id="crew-ready">
          <span id="crew-display">0/0</span>
          <span id="ready-pill" data-i18n="client.pill_connecting">CONNECTING</span>
        </div>
      </div>

      <!-- Active mod packs the host applied (issue #990). Populated by
           renderActiveMods() from lobbyState.activePacks; empty (and hidden)
           when no packs are applied, so nothing extra renders in the base game. -->
      <div id="lobby-mods" aria-hidden="true"></div>

      <!-- Name input -->
      <div id="lobby-name-row">
        <label><span data-i18n="client.name_label">Name</span>
          <input id="name-input" type="text" placeholder="Your name" data-i18n-attr="placeholder:client.name_placeholder" autocomplete="off" />
        </label>
      </div>

      <!-- Public Game Master presence, separate from every crew and Station
           count. The heading labels the region for assistive technology. -->
      <section id="gm-presence" role="region" aria-labelledby="gm-presence-heading" aria-hidden="true">
        <h2 id="gm-presence-heading" data-i18n="lobby.gms.heading"></h2>
        <div id="gm-presence-list" role="list"></div>
      </section>

      <!-- The lobby body (issue #1370). Two boxes rather than three loose
           siblings, because the orientations differ in how these GROUP, not in
           what they contain: portrait stacks the roster over the seat detail
           and a full-width Ready bar; landscape stands #lobby-side up as a rail
           beside a compacted roster. One document, one set of controls, and CSS
           alone picks the arrangement — nothing here is decided in script. -->
      <div id="lobby-body">
        <!-- Station list -->
        <div id="station-list"></div>
        <section id="claimed-station-help" class="settings-documentation" hidden></section>

        <div id="lobby-side">
          <!-- At-your-station detail panel -->
          <div id="detail-panel" class="idle">
            <div class="detail-header">
              <span class="detail-station-name" data-i18n="client.no_station">No station assigned</span>
            </div>
            <div class="detail-station-desc"></div>
            <div id="detail-console-area">
              <div class="detail-consoles"></div>
              <div class="detail-ratings"></div>
            </div>
          </div>

          <!-- Footer -->
          <div id="lobby-footer">
            <!-- #status-line comes FIRST so a screen reader hears the
                 connection state before the control it gates; CSS paints it
                 last. The two buttons are in the order they are painted, left
                 to right, so Tab follows the eye (WCAG 2.4.3). -->
            <span id="status-line" data-i18n="client.connecting_host">Connecting to host…</span>
            <button id="ready-btn" data-i18n="client.ready">READY</button>
            <!-- Spectate toggle (issue #1105): opt out of a station into the
                 explicit Spectator role, or (when spectating) opt back into the
                 crew. Label + handler are set by renderLobby from the view model. -->
            <button id="spectate-btn" data-i18n="client.spectator.spectate" style="display:none">Spectate</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Spectator summary surface (issue #1105): the one crew-public read-only
         view a Spectator sees during an in-progress mission, instead of the
         station-select lobby. It shows only Audience::All crew-public data —
         objectives, red-alert, ship-wide hull, per-Station health — never any
         per-station private feed (a seatless client never receives one). -->
    <section id="spectator-ui" aria-hidden="true">
      <div id="spectator-header" data-i18n="client.spectator.title">Spectating</div>
      <div id="spectator-alert" role="status" aria-live="polite"></div>
      <div id="spectator-hull" role="status" aria-live="polite"></div>
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.stations_heading">Crew stations</div>
        <div id="spectator-stations"></div>
      </div>
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.objectives_heading">Objectives</div>
        <div id="spectator-objectives"></div>
      </div>
      <!-- Claim an open Station (issue #1106): a Spectator may enter play by
           taking any currently-open seat it is eligible for, through the SAME
           authoritative SelectStation path an ordinary lobby claim uses. Only
           OPEN∩ELIGIBLE seats offer a live button; an ineligible open seat is
           shown disabled with a private reason; a lost race / stale seat leaves
           the participant here with a neutral notice. -->
      <div class="spectator-section">
        <div class="spectator-heading" data-i18n="client.spectator.claim_heading">Open stations</div>
        <div id="spectator-claim-status" role="status" aria-live="polite"></div>
        <div id="spectator-claims"></div>
      </div>
    </section>

    <nav id="station-hero" aria-hidden="true" aria-label="" data-i18n-attr="aria-label:client.hero.label">
      <div id="station-hero-tabs" role="tablist"></div>
      <div id="station-hero-details">
        <div id="station-hero-title"></div>
        <div id="station-hero-rating"></div>
        <div id="station-hero-ai" role="status" aria-live="polite"></div>
      </div>
    </nav>

    <!-- Console sections are mounted dynamically by mountConsoles() when a
         Welcome message arrives with ship_stations. Each section is created
         with the same id/iframe-id conventions as the static originals
         (e.g. #captain-ui / #captain-iframe) so all downstream $() references
         continue to resolve. -->
  </div>

  <!-- Client-level controller ownership warning. It remains outside Settings
       so a lost selected pad is visible and announced while the modal is shut. -->
  <div id="gamepad-input-alert" role="alert" aria-live="assertive"
       aria-atomic="true" hidden></div>
  <div id="native-operator-profile-error" role="alert" aria-live="assertive" hidden></div>
  <div id="status" data-i18n="client.connecting">Connecting…</div>
  <!-- The readout and the control that copies it, in one left-anchored row so
       neither can reach the corner the lobby's READY button lives in. -->
  <div id="conn-diag-row">
    <div id="conn-diag"></div>
    <!-- Copies the readout beside it, plus everything behind it, for pasting
         into an issue thread (issue #1113, docs/acceptance/1113-networks.md).
         Hidden until the script confirms the browser has a clipboard to write
         to. -->
    <button id="conn-diag-copy" type="button" style="display:none"></button>
  </div>

  <!-- Typed join entry (issue #1111). Hidden while a join from the fragment is
       in flight; shown when there is nothing to join with, or when an attempt
       came back with a reason. One field takes either the code a guest
       reads off the viewscreen or a whole pasted/QR'd PROJECT_VERSION_CODE —
       gui/join-code.js decides which it is, so there is no second control and
       no wrong box to type into. -->
  <div id="join-entry">
    <div id="join-entry-title" data-i18n="client.join.title">Enter the join code</div>
    <input id="join-code-input" type="text" autocomplete="off" autocapitalize="characters"
           autocorrect="off" spellcheck="false" maxlength="96"
           data-i18n-attr="placeholder:client.join.code_placeholder,aria-label:client.join.code_label" />
    <button id="join-submit-btn" data-i18n="client.join.submit">Join</button>
    <div id="join-entry-hint" data-i18n="client.join.hint">Eight letters from the viewscreen.</div>
    <div id="join-entry-error"></div>
  </div>

  <div id="top-bar">
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="retry-now-btn" title="Retry connection now" data-i18n="client.retry_now" data-i18n-attr="title:client.retry_now_tip">Retry now</button>
    <button id="fullscreen-btn" title="Toggle fullscreen" data-i18n-attr="title:client.fullscreen_tip">⛶</button>
  </div>

  <!-- Station help (issue #1372). The cog's twin: one node, born here in the
       page body beside it, re-parented into #station-hero as the bar's LAST
       item for the duration of play and back here for the lobby and the
       full-viewport surfaces. It opens the same Settings dialog the cog does,
       straight onto its Station Help tab, so there is one help surface on the
       phone rather than a second one that would drift from it. -->
  <button id="help-btn" class="settings-btn help-btn" type="button"
          aria-haspopup="dialog"
          data-i18n-attr="title:client.hero.help.label,aria-label:client.hero.help.label">?</button>

  <!-- Asset loading overlay: shown during GamePhase::Loading while the
       server pre-caches GLB models, radar icons, and rig sidecars. -->
  <div id="asset-loading">
    <div class="ld-mark" role="img" data-i18n-attr="aria-label:client.logo_alt"></div>
    <div class="ld-stack">
      <div class="spinner-ring"></div>
      <span class="ld-label" data-i18n="client.preparing_scenario">Preparing scenario&hellip;</span>
      <span class="ld-pct" id="asset-loading-pct-row"><span id="asset-loading-pct">0</span><span class="ld-pct-unit">%</span></span>
      <span class="ld-bar" id="asset-loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Preparing scenario" data-i18n-attr="aria-label:client.preparing_scenario"><i class="ld-fill" id="asset-loading-fill"></i></span>
      <span class="ld-ticks"><span id="asset-loading-tick-left"></span><span id="asset-loading-tick-right"></span></span>
      <span class="ld-ctx" id="asset-loading-ctx" hidden><b id="asset-loading-scenario"></b><span class="ld-ship" id="asset-loading-ship"></span></span>
      <span class="ld-status" id="asset-loading-status"></span>
    </div>
  </div>

  <!-- Game-over overlay: shown when GamePhase::GameOver. Displays either
       "Ship Destroyed" (hull death) or the scenario's game_over message, and —
       when the scenario authored one (issue #1344) — the post-mission report
       rows underneath it, in the order the author wrote them. The rows carry no
       score, no total and no grade: see gui/game-over-view.js. -->
  <div id="game-over-overlay">
    <div class="game-over-frame">
      <div class="game-over-scan"></div>
      <span class="game-over-tick tl"></span><span class="game-over-tick tr"></span>
      <span class="game-over-tick bl"></span><span class="game-over-tick br"></span>
      <div class="game-over-body">
        <div class="game-over-scenario" id="game-over-scenario"></div>
        <div class="game-over-headline" id="game-over-headline"></div>
        <div class="game-over-message" id="game-over-message"></div>
        <dl class="game-over-report" id="game-over-report"></dl>
        <button id="return-to-lobby-btn" class="game-over-return-btn" data-i18n="client.return_to_lobby">Return to Lobby</button>
      </div>
    </div>
  </div>

  <!-- Link banner (PRD #1023 module 4): says out loud what the dimmed console
       behind it means — either the host is gone, or its first state has not
       landed yet. Hidden whenever the link is live. -->
  <div id="link-banner" aria-hidden="true" role="status">
    <div class="link-banner-title"></div>
    <div class="link-banner-detail"></div>
  </div>

  <!-- Waiting-for-scenario overlay: shown after ReturnToLobby while the
       host picks a scenario from the server's scenario-selection panel. -->
  <div id="waiting-overlay">
    <div class="ld-mark" role="img" data-i18n-attr="aria-label:client.logo_alt"></div>
    <div class="ld-stack">
      <div class="spinner-ring"></div>
      <span class="ld-label" data-i18n="client.waiting_scenario">Waiting for host to select a scenario&hellip;</span>
      <span class="ld-bar" id="waiting-overlay-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Waiting for host to select a scenario" data-i18n-attr="aria-label:client.waiting_scenario"><i class="ld-fill" id="waiting-overlay-fill"></i></span>
      <span class="ld-ticks"><span id="waiting-overlay-tick-left"></span><span id="waiting-overlay-tick-right"></span></span>
      <span class="ld-ctx" id="waiting-overlay-ctx" hidden><b id="waiting-overlay-scenario"></b><span class="ld-ship" id="waiting-overlay-ship"></span></span>
      <span class="ld-status" id="waiting-overlay-status"></span>
    </div>
  </div>

  <!-- QR-first scenario/ship picker overlay (issue #755): before any world is
       loaded, the host broadcasts the pre-load catalog and any connected phone
       can make the first valid selection (first-valid-wins, no voting). -->
  <div id="scenario-picker-overlay">
    <div id="scenario-picker-heading" data-i18n="client.select_scenario">Select a scenario</div>
    <div id="scenario-picker-body"></div>
  </div>

  <!-- Top-centre coordination popup overlay (issue #494). Shown for AI-to-human
       coordination messages. Click-to-dismiss, auto-dismiss after 8s. -->
  <div id="coordination-popup" onclick="dismissCoordinationPopup()">
    <div class="popup-sender"><span id="popup-from"></span><span id="popup-arrow"></span><span id="popup-to"></span><span id="popup-colon"></span></div>
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>

  <!-- The per-system damage popup the Station Bar's selected tab opens
       (issue #1374), replacing the `ph-station-damage` bar every console
       footer used to carry. The rows come from the active console's own
       `console_hull` post (issue #1373); gui/station-damage-popup.js decides
       what it says and ph-damage-detail draws the rows. -->
  <div id="station-damage-popup" hidden>
    <!-- The dialog role and aria-modal are set by that module beside its
         `createFocusTrap` call, not here: a surface that declares itself a
         modal owes the focus contract (issue #1174,
         tests/client/modal-contract.test.js), and declaring it next to the
         trap is what keeps the two from drifting apart. -->
    <div class="popup-card" aria-labelledby="station-damage-popup-title">
      <div class="popup-head">
        <span id="station-damage-popup-title"></span>
        <button type="button" id="station-damage-popup-close"
                data-i18n-attr="title:client.station_damage.close,aria-label:client.station_damage.close">✕</button>
      </div>
      <ph-damage-detail id="station-damage-popup-detail"></ph-damage-detail>
      <div id="station-damage-popup-empty" data-i18n="client.hero.health.none" hidden>No damage model</div>
    </div>
  </div>

  <!-- Phone bezel frame (issue #439). CSS-only red alert glow; no images.
       The .alert-on class drives the keyframe animation (see <style>).
       Hidden by default; render() flips aria-hidden once in-game. -->
  <div id="phone-bezel" aria-hidden="true"></div>



  <script type="module">
    // Localisation bridge: the big inline script below is a classic script,
    // so it cannot import gui/strings.js. Publish the API on window and
    // substitute the static data-i18n markup once the table is loaded.
    import './gui/strings-boot.js';
    import { t, has, applyToDom, wireText } from './gui/strings.js';
    window.phStrings = { t, has, applyToDom, wireText };
    applyToDom(document);
  </script>

  <!-- Page chrome (issue #1227): connection-status dot, Screen Wake Lock,
       fullscreen toggle, and the mechanical half of the #conn-diag
       renderer — gui/page-chrome.js is the single source server.html and
       client.html both used to carry as verbatim copies. The classic
       script below can't `import` a module directly; early calls made
       before this island has mounted go through the
       window.__pageChromeReady queue defined near that script's own
       #1227 bridge block. -->
  <script type="module">
    import { mountPageChrome } from './gui/page-chrome.js';
    import { t } from './gui/strings.js';
    const chrome = mountPageChrome({
      doc: document,
      t,
      statusColors: { active: 'var(--loaded)', trouble: 'var(--fire-hot)' },
      statusLabels: { disconnected: 'client.reconnecting', error: 'client.conn_error' },
    });
    window.__pageChromeReady(chrome);
  </script>

  <script>
    // Resolve a string id via the module bridge. Safe before modules load —
    // falls back to the raw id, and every call site re-resolves on render.
    function t(id, params) {
      return window.phStrings ? window.phStrings.t(id, params) : id;
    }

    // Resolve a value that MAY be a string id, via the same module bridge —
    // gui/strings.js's wireText() encodes the has(value) ? t(value) : fallback
    // rule once; this just forwards to it (or reproduces its default before the
    // module bridge has mounted, same shape as `t` above).
    function wireText(value, fallback) {
      if (window.phStrings) return window.phStrings.wireText(value, fallback);
      if (fallback !== undefined) return fallback;
      return value === null || value === undefined ? '' : String(value);
    }

    // ── Page chrome bridge (issue #1227) ────────────────────────────────────
    // The status dot/label/retry-button, the Screen Wake Lock and the
    // fullscreen toggle now live in gui/page-chrome.js (shared with
    // server.html). This classic script can't `import` a module directly
    // (this page's bulk logic is a classic script too, despite the
    // `type="module"` islands elsewhere on it), so calls made before the
    // page-chrome island below has mounted — setConnectionStatus('connecting')
    // runs synchronously at the bottom of this same script, well before any
    // deferred module — are queued and replayed in order once it calls
    // window.__pageChromeReady(chrome). Same shape as server.html's #1227
    // bridge (itself modelled on the #1224 host-channel queue).
    window.__pageChromeQueue = [];
    let _pageChrome = null;
    function chromeSetConnectionStatus(state) {
      if (_pageChrome) _pageChrome.setConnectionStatus(state);
      else window.__pageChromeQueue.push(['setConnectionStatus', state]);
    }
    function acquireWakeLock() {
      if (_pageChrome) return _pageChrome.acquireWakeLock();
      window.__pageChromeQueue.push(['acquireWakeLock', undefined]);
    }
    function releaseWakeLock() {
      if (_pageChrome) _pageChrome.releaseWakeLock();
      else window.__pageChromeQueue.push(['releaseWakeLock', undefined]);
    }
    window.__pageChromeReady = function(chrome) {
      _pageChrome = chrome;
      window.__pageChromeQueue.splice(0).forEach(function(c) { chrome[c[0]](c[1]); });
    };

    // Station names in ShipStations are lookup identifiers; display them via
    // the derived station.<id>.name string when the table has one.
    function stationLabel(st) {
      if (!st) return '';
      return wireText('station.' + st.id + '.name', st.name || st.id || '');
    }
    // What a station DOES, shown on its lobby row before the claim tap (PRD
    // #1023 module 4). The copy is already authored per hull as
    // `entity.<hull>.station.<id>.description` and rides the wire in
    // StationDef.description — this reuses those ids rather than minting a
    // second, diverging set. A phone's copy came through localiseTree and is
    // already resolved text; a mod pack's literal prose never was an id —
    // wireText() substitutes only what the table actually holds.
    function stationDescription(st) {
      return st ? wireText(st.description, '') : '';
    }

    // -- Click sound --------------------------------------------------------
    // Message types that should NOT trigger a click (continuous / connection
    // setup messages that are not the result of a deliberate button press).
    // `ReportConsoleLatency` (issue #1169) belongs here for a reason sharper than
    // "not a button press": it is a diagnostic report sent WHILE latency is being
    // measured, so a click on it would put an audio decode on the very path whose
    // timing is the subject.
    const NO_CLICK = new Set(['SetThrust', 'SetSteering', 'LateralThrustInput', 'Identify', 'SetName', 'ReportStationEligibility', 'ReportConsoleLatency']);

    const CLICK_PITCH_VARIANCE = 0.08; // +/- 8% playback-rate jitter so repeated clicks don't sound identical

    function playClick() {
      const el = document.getElementById('ui-click');
      if (!el) return;
      el.currentTime = 0;
      // preservesPitch defaults to true in modern browsers, which normalizes
      // pitch back out of playbackRate changes — disable it so the rate
      // jitter below actually varies the pitch.
      el.preservesPitch = false;
      el.webkitPreservesPitch = false;
      el.mozPreservesPitch = false;
      el.playbackRate = 1 + (Math.random() * 2 - 1) * CLICK_PITCH_VARIANCE;
      el.play().catch(() => {});
    }

    // -- Connection status --------------------------------------------------

    /// The connection-manager status verbatim, and whether the host has said
    /// anything at all since the link came up. Together they decide whether a
    /// console is live, still loading, or dead (gui/link-state.js).
    let linkStatus = 'connecting';
    let linkHasData = false;

    /// Dim + disable the console, or mark it as still loading, per
    /// gui/link-state.js. Game shell only: in the lobby the status line and
    /// the ready pill already carry this, and dimming the roster the player is
    /// trying to claim from would be worse than useless.
    function renderLinkState(inGame) {
      const container = document.getElementById('console-container');
      const banner = document.getElementById('link-banner');
      if (!container || typeof window.linkView !== 'function') return;
      const lv = window.linkView(linkStatus, linkHasData);
      const mode = inGame ? lv.mode : 'live';
      container.dataset.link = mode;
      // aria-disabled rather than the disabled attribute: the controls live
      // inside console iframes and shadow roots this page does not own, so the
      // container's own pointer-events is what actually stops the taps.
      container.setAttribute('aria-disabled', (inGame && lv.disable) ? 'true' : 'false');
      if (banner) {
        const showBanner = inGame && lv.bannerId;
        banner.setAttribute('aria-hidden', showBanner ? 'false' : 'true');
        banner.dataset.mode = mode;
        if (showBanner) {
          const title = banner.querySelector('.link-banner-title');
          const detail = banner.querySelector('.link-banner-detail');
          if (title) title.textContent = t(lv.mode === 'dead' ? 'client.link_dead' : 'client.link_connecting');
          // The dead case says BOTH that the link is gone and what the client
          // is doing about it; connecting has nothing to add to its own title.
          if (detail) detail.textContent = lv.mode === 'dead' ? t(lv.bannerId) : '';
        }
      }
    }

    // Status dot/label/retry-button, the Screen Wake Lock and the
    // fullscreen toggle now live in gui/page-chrome.js (issue #1227),
    // shared with server.html. chromeSetConnectionStatus/acquireWakeLock/
    // releaseWakeLock (defined near the top of this script, by the
    // window.__pageChromeReady bridge) are this script's calls into it.
    // setConnectionStatus keeps the link-state bookkeeping that is genuinely
    // this page's own concern — page-chrome has no notion of "has the
    // console rendered live data yet".
    function setConnectionStatus(state) {
      linkStatus = state;
      // A link that dropped has to re-earn "has data": whatever the console is
      // showing when it comes back is from before the gap, so the console goes
      // back through CONNECTING rather than straight to live with stale
      // numbers on it (PRD #1023 user story 15).
      //
      // No scheduleRender() here, deliberately: this runs once at boot, ABOVE
      // the scheduler's own `let _renderFrame`, and touching it from here put
      // the whole inline script in a temporal dead zone. The onStatus callback
      // that drives every LATER transition repaints instead.
      if (state !== 'ready') linkHasData = false;
      lastConnectionState = state;
      chromeSetConnectionStatus(state);
      // Which pre-play surface is up STILL does not depend on the link state
      // (issue #1359 — priority is the whole rule), and nothing below changes
      // that: applyPrePlaySurfaces() runs the same decision over the same
      // three inputs and lands on the same surface it would have anyway.
      //
      // What the re-apply is for is the LINE (issue #1368). A loading surface
      // that is already up has to be able to say the link went away and the
      // page is dialling again — a ring still turning over a bar that has
      // stopped moving, with no explanation, is the failure that line closes.
      applyPrePlaySurfaces();
    }

    // -- Pre-play surfaces (issue #1359) -------------------------------------
    // Four full-screen surfaces can precede play — #asset-loading,
    // #scenario-picker-overlay, #waiting-overlay and #join-entry — and each of
    // them used to set its own display from its own call site. Nothing but
    // their z-index order stopped two being displayed at once: a catalogue
    // arriving over the waiting overlay left BOTH up (render() returns early on
    // the picker branch, above the line that hid the waiting overlay), and a
    // refused join opened the code field UNDERNEATH either of them.
    //
    // gui/pre-play-view.js now makes the one decision from whether the page is
    // asking for a join code, the lobby state and the preload fraction, and
    // this is its only consumer: every site below records its input and calls
    // applyPrePlaySurfaces(), which shows exactly one surface and hides the
    // rest. #game-over-overlay is deliberately NOT in the set — it is the
    // post-play surface and gui/game-over-view.js is already the one pure
    // decision behind it.
    //
    // The lead lines are NOT written from here. Every one of these four
    // surfaces carries its own data-i18n, and gui/strings.js's applyToDom()
    // already renders it; the decision's `headline` says what the surface
    // leads with (and the test pins it to the markup) without being a second
    // writer of the same string.
    //
    // These two are the whole of the shell state the decision needs that is
    // not already on window.lobbyState.
    /// Asset preload progress in [0,1] while the host is pre-caching, else null.
    let preloadFraction = null;
    /// True while the page is asking the guest for a join code.
    let joinPromptOpen = false;

    // -- Shell chrome placement (issue #1372) --------------------------------
    // The settings cog and the help button are ONE node each, moved between the
    // Station bar and the page body rather than duplicated. Three facts decide
    // where they belong this frame, and none of them is `inGame` alone: the
    // game shell stays mounted through GameOver, and a pre-play surface can
    // cover a live bar. Each slot is recorded by whichever part of the page
    // already knows the fact, and gui/hero-bar.js's `heroChromeSlot` is the one
    // place the three are weighed up. Declared HERE, above the first
    // applyPrePlaySurfaces() call, because setConnectionStatus() makes that
    // call while this script is still evaluating.
    /// Whether #station-hero is showing tabs this frame.
    let heroBarVisible = false;
    /// Which pre-play surface applyPrePlaySurfaces() last raised, if any.
    let prePlaySurface = null;
    /// Whether the post-play #game-over-overlay is up.
    let gameOverVisible = false;
    /// The mounted settings panel (issue #940), or null before the connection
    /// bootstrap runs. handleMessage repaints it when `DebugState` arrives.
    /// Hoisted up here with the chrome slots above: placeShellChrome() asks it
    /// to move its own cog, and the first call lands while this script is
    /// still evaluating.
    let settingsPanel = null;
    /// The last link state setConnectionStatus() was told about. It decides no
    /// surface — see loadingContext() — only whether a loading surface that is
    /// already up says it is retrying (issue #1368).
    let lastConnectionState = 'connecting';

    // The surfaces, highest z-index first — the same list gui/pre-play-view.js
    // exports, kept here for the module-absent case below. The z-index order
    // in the stylesheet, this list and PRE_PLAY_SURFACES are asserted equal by
    // tests/client/pre-play-view.test.js.
    const PRE_PLAY_SURFACE_IDS = [
      'asset-loading', 'scenario-picker-overlay', 'waiting-overlay', 'join-entry',
    ];

    // The same priority ladder, inline, for the case where the module is not
    // there at all. Nothing here may return early: #join-entry is the page's
    // ONLY input for a join code, and before #1359 showEntry() opened it from
    // this classic script with no dependency on anything. A bail-out would
    // mean a 404 or a parse error on one gui/ module leaving a guest on a
    // permanently blank phone with no way to join — the module race that
    // motivated it is only the first frame, but a load failure is every frame.
    // Same shape as the sectionVisibility fallback in render().
    function localPrePlayView(conn, lob, fraction) {
      const n = Number(fraction);
      const absent = fraction === null || fraction === undefined || fraction === ''
        || !Number.isFinite(n);
      const pct = absent ? null : Math.round(Math.min(1, Math.max(0, n)) * 100);
      const surface = !absent ? 'asset-loading'
        : lob.pickingScenario ? 'scenario-picker-overlay'
        : lob.waitingForScenario ? 'waiting-overlay'
        : conn.joinPrompt ? 'join-entry'
        : null;
      return { surface, headline: null, measurable: !absent, pct };
    }

    /**
     * What the loading surface can say about the Session, gathered in one
     * place: the link state, and the World's scenario and the ship the crew is
     * about to fly. Every field is optional — the surface comes up before
     * `Welcome` has landed, and it names what it has rather than guessing.
     *
     * The link state is read HERE and nowhere in gui/pre-play-view.js's
     * surface decision, which is the line #1359 drew and this keeps: a dropped
     * link cannot raise, suppress or swap a surface. It changes one line of
     * text on the surface that is already up, because a bar that has stopped
     * moving with no explanation is worse than no bar.
     */
    function loadingContext() {
      const ls = window.lobbyState;
      const ship = (ls && ls.shipConfig) || {};
      return {
        connectionState: lastConnectionState,
        scenarioTitle: (ls && ls.scenarioTitle) || '',
        shipClass: ship.class || '',
        hullId: ship.hull_id || '',
      };
    }

    function applyPrePlaySurfaces() {
      const decide = (typeof window.prePlayView === 'function')
        ? window.prePlayView : localPrePlayView;
      const ids = Array.isArray(window.PRE_PLAY_SURFACES)
        ? window.PRE_PLAY_SURFACES : PRE_PLAY_SURFACE_IDS;
      const ls = window.lobbyState;
      const view = decide(
        { joinPrompt: joinPromptOpen },
        {
          pickingScenario: !!(ls && ls.showScenarioPicker()),
          waitingForScenario: !!(ls && ls.waitingForScenario),
        },
        preloadFraction,
      );
      for (const id of ids) {
        const el = document.getElementById(id);
        if (!el) continue;
        const shown = id === view.surface;
        // #join-entry keeps its own `.open` class — both its hidden base rule
        // and the flex it opens into live in the stylesheet. The other three
        // are the plain display toggles they always were.
        if (id === 'join-entry') el.classList.toggle('open', shown);
        else el.style.display = shown ? 'flex' : 'none';
      }
      // The loading surface's own contents (issue #1368): the ring, the bar,
      // the small print and the Session named underneath it. `loadingView()`
      // takes the decision ABOVE as its input rather than re-reading the
      // inputs behind it, so there is no second answer to "is there anything
      // to measure" that could disagree with this one; it returns null for the
      // surfaces that are not loading surfaces, and the renderer no-ops.
      const loading = (typeof window.loadingView === 'function')
        ? window.loadingView(view, loadingContext()) : null;
      if (loading && window.loadingRender) {
        window.loadingRender.renderLoading(document, loading, t);
      } else if (view.measurable) {
        // gui/ never loaded. The percentage is the one thing a waiting player
        // is actually reading, so the page still writes it itself — the same
        // posture as localPrePlayView above, for the same reason.
        const pctEl = document.getElementById('asset-loading-pct');
        if (pctEl) pctEl.textContent = String(view.pct);
      }
      // The cog and the help button stack ABOVE these surfaces, so a raised one
      // sends them back to the page body (issue #1372).
      prePlaySurface = view.surface || null;
      placeShellChrome();
      return view;
    }

    // -- Return to Lobby (GameOver overlay button) ---------------------------
    (function initReturnToLobby() {
      const btn = document.getElementById('return-to-lobby-btn');
      if (!btn) return;
      btn.addEventListener('click', () => send('ReturnToLobby'));
    })();

    setConnectionStatus('connecting');

    // -- Retry-now control (issue #614) --------------------------------------
    // Visible only while disconnected/retrying (see setConnectionStatus).
    // Bypasses the connection manager's current backoff wait and attempts a
    // reconnect immediately.
    (function initRetryNow() {
      const btn = document.getElementById('retry-now-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        const link = currentLink();
        if (link && typeof link.retryNow === 'function') link.retryNow();
      });
    })();

    // -- Persistence ---------------------------------------------

    const NAMES = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return NAMES[Math.floor(Math.random() * NAMES.length)];
    }

    // Session identity is resolved per-tab by gui/session-token.js
    // (installSessionToken) just before we Identify — see the connection block
    // below. It is not resolved here because that module is deferred and has
    // not executed yet at parse time. Resolving per-tab (sessionStorage) rather
    // than per-origin (localStorage) is what lets several console tabs run on
    // one desktop without colliding on a single shared token.
    let myToken = null;

    // Display name is per-tab (sessionStorage), not per-origin (localStorage):
    // several clients on one desktop must not all default to the same name, or
    // they look like one another in the lobby. Falls back to a fresh random
    // name per tab. (Identity is the token, not the name — see myToken.)
    let myName = sessionStorage.getItem('player-name') || randomName();
    sessionStorage.setItem('player-name', myName);

    // -- State ---------------------------------------------------

    // Lobby / lifecycle mirror ONLY (players, phase, station roster, game-over
    // flags). All SIM state lives exclusively in window.simState
    // (gui/sim-state.js) — the console builders read it directly, so do NOT
    // add sim-derived fields here (issue #819 deleted the old hand-maintained
    // mirror and the flat blackboard scalars).
    const uiState = { players: [], phase: 'Lobby',
      shipStations: { stations: [] },
      stations: [], maxPlayers: 0, allFilled: false, allReady: false, countdownSecs: 0,
      shipDestroyed: false, gameOverReason: null };

    /// Currently-active console during InProgress. One human = one station
    /// (issue #827): derived by render() as mine[0] || null via
    /// reconcileActiveConsole — null for spectators and in the lobby.
    let activeConsole = null;

    /// Last red-alert value applied to the phone bezel, so the class toggle
    /// only runs when the captain blackboard's flag actually changes.
    /// (The flag itself lives in window.simState.redAlert — issue #819.)
    let bezelAlertOn = false;

    /// Overlay tabs each mounted console declared (issue #1373), keyed by the
    /// STATION whose iframe posted them (senderStationId, not the name the
    /// document gave itself — one document can serve two Stations). EVERY
    /// mounted console posts its own — one iframe per Station is mounted at
    /// once and they all run `initConsole` — so the bar reads only the active
    /// Station's entry rather than whichever message arrived last. A console
    /// with no overlay panels posts an empty list.
    const consoleTabsByConsole = Object.create(null);
    /// The own-Station system rows each console posted (issue #1373), keyed the
    /// same way. This is what the per-system damage popup draws (issue #1374):
    /// tapping the bar's already-selected Station tab opens the active
    /// console's rows, and a fresh post repaints an open popup in place.
    const consoleHullByConsole = Object.create(null);
    /// Which overlay panel is open, and in which console. One at a time: the
    /// panels cover the console, and the bar is a tablist with one selection.
    /// `console` is carried alongside the id so switching Stations cannot leave
    /// a stale selection pointing at another console's panel.
    let openConsoleOverlay = { console: null, id: null };

    /// Console selected in the lobby detail panel. Null until the player picks one.
    /// Resets when the player releases their station.
    let lobbyConsole = null;
    /// Parent-owned, client-local semantic binding profile. The operator
    /// profile persists it; console iframe module instances are separate
    /// realms, so updates are explicitly copied
    /// through __updateSemanticActionBindings instead of relying on a singleton.
    let semanticActionRegistry = null;
    let operatorProfile = null;
    let preferredGamepadSlot = null;
    let operatorSurfaceCapabilities = null;
    let activeFeedbackPreferences = { vibration: true, semanticCues: true };
    let _actionFeedbackRouter = null;
    /// Parent-only gamepad sampler. Iframes never poll navigator.getGamepads(),
    /// so an inactive or disconnected Station cannot receive controller input.
    let gamepadInputRuntime = null;
    let disposeGamepadInput = null;
    let pendingMidGameClaim = false;
    // #771 AC3: a mid-round station release is a two-step arm→confirm (imitates
    // ph-comms-current-message). First click arms + swaps the button to a
    // confirm string; second click sends ReleaseStation. In-progress only —
    // lobby release stays immediate. Reset whenever we leave InProgress.
    let releaseArmed = false;
    // #1106: the station id a Spectator last tapped "claim" on. A lost race /
    // stale seat is a silent server no-op (no self-addressed message), so the
    // client watches this seat: when it reappears as taken, we show a neutral
    // "that seat was taken" line and keep the participant on the spectator
    // surface. Cleared whenever we are no longer spectating.
    let pendingSpectatorClaim = null;

    // Single source of truth for changing the active console. Called only by
    // the render() reconciler now that the tab bar and swipe gesture are gone
    // (issue #827). No-op if the value is already current. Delegates the
    // null/undefined/"" ? next sentinel mapping to gui/lobby-state.js
    // (nextActiveConsole) so the contract is locked by Vitest.
    function setActiveConsole(name) {
      const step = (typeof window.nextActiveConsole === 'function')
        ? window.nextActiveConsole(activeConsole, name)
        : { changed: (name || null) !== activeConsole, next: name || null };
      if (!step.changed) return;
      activeConsole = step.next;
      // An overlay belongs to the console it is drawn inside. Leaving that
      // console closes it — both here, so the bar stops showing it selected,
      // and in the iframe, so the panel is not still covering the console the
      // next time the player comes back to it.
      setConsoleOverlay(null, null);
      // The damage popup belongs to a Station too (issue #1374): it names one
      // and lists that one's systems, so it cannot outlive a switch away from
      // it — including the switch to `null` that leaving the game makes.
      dismissStationDamagePopup();
    }

    /// Open exactly one console's overlay panel — or, with a null id, none.
    /// The shell half of the seam gui/console-overlays.js owns inside the
    /// iframe: the bar decides, the console obeys (issue #1373).
    function setConsoleOverlay(consoleName, overlayId) {
      const previous = openConsoleOverlay;
      openConsoleOverlay = { console: overlayId ? consoleName : null,
                             id: overlayId || null };
      const setOverlay = window.iframeBridgeSetOverlay;
      if (typeof setOverlay !== 'function') return;
      if (previous.console && previous.console !== openConsoleOverlay.console) {
        setOverlay($(consoleIframeId(previous.console)), null);
      }
      if (consoleName) setOverlay($(consoleIframeId(consoleName)), overlayId || null);
    }

    /// The overlay the ACTIVE console is showing, or null. The bar never
    /// renders another console's selection.
    function activeConsoleOverlay() {
      return openConsoleOverlay.console === activeConsole ? openConsoleOverlay.id : null;
    }

    // -- Helpers -------------------------------------------------

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function playerStation(s) {
      const m = me(s);
      if (!m) return null;
      return typeof m.station === 'string' ? m.station
        : (m.station && typeof m.station.id === 'string' ? m.station.id : null);
    }
    function myConsoles(s) {
      // Post issue #619 a player owns exactly one station id (or none).
      // Callers that historically wanted a "consoles" list (for the tab bar)
      // treat this as a one-element list.
      const sid = playerStation(s);
      return sid ? [sid] : [];
    }

    /// True while the lobby/station-select panel is being shown over an
    /// in-progress game: true spectators, and mid-game claimants who have
    /// picked a station but not yet pressed Ready. Single source of truth for
    /// render()'s vis.lobby override and the SimState/BlackboardUpdate
    /// render guards below — those messages arrive at ~10Hz and must skip the
    /// lobby DOM rebuild in this state, or a click on Ready/Leave can land
    /// between the old button being torn down and the new one's listener
    /// being attached.
    function showingLobbyDuringGame(s) {
      if (s.phase !== 'InProgress') return false;
      const player = me(s);
      // An explicit Spectator (issue #1105) renders the crew-public summary
      // surface, never the station-select lobby — and its read-only surface
      // must re-paint live on each SimState, so it is excluded from this
      // "skip the lobby rebuild" guard.
      if (player && player.spectator) return false;
      return pendingMidGameClaim || !playerStation(s) || !!(player && !player.ready);
    }
    // Explicit Spectator role during an in-progress mission (issue #1105).
    function spectatingInGame(s) {
      return s.phase === 'InProgress' && !!(me(s) && me(s).spectator);
    }
    function isCaptain(s)     { return playerStation(s) === 'captain'; }
    function isHelm(s)        { return playerStation(s) === 'helm'; }

    // The live link this page speaks through: the Phoenix joiner from
    // gui/rendezvous-transport.js, wrapped in a STABLE façade that outlives any
    // one attempt. `connected` / `send(type, data, deliveryClass)` /
    // `retryNow()` is the whole contract, and because the façade object itself
    // is never replaced — only the joiner behind it — a caller (or a smoke
    // spec) that took a reference to it before a reconnect is still holding the
    // live link afterwards. Also published as `window.phoenixLink`, which is
    // what `window.connectionManager` used to be before #1112 retired PeerJS.
    let activeLink = null;
    function currentLink() { return activeLink; }

    function send(type, data) {
      const link = currentLink();
      if (!link || !link.connected) return;
      const clickType = (type === 'ControlSystem' && data && data.payload) ? data.payload.type : type;
      if (!NO_CLICK.has(clickType)) playClick();
      // Client messages (commands, lobby actions) are always reliable
      link.send(type, data, 'reliable');
    }

    function setStatus(text) { $('status').textContent = text; }

    // -- Phone bezel red-alert toggle (issue #439) -------------------------
    // Toggles the .alert-on class on #phone-bezel; CSS keyframes drive the
    // red glow pulse (no PNG swaps needed with the CSS-only implementation).
    function applyBezelAlert(alert) {
      const root = $('phone-bezel');
      if (root) root.classList.toggle('alert-on', !!alert);
    }



    // Console/station display label via the string table (issue #827): the
    // tab-bar CONSOLE_LABEL map is gone; station.<id>.name is the single
    // source. Falls back to the raw id before the string table loads so the
    // first paint never blanks out.
    function consoleLabel(name) {
      if (!name) return '';
      return wireText('station.' + name + '.name', name);
    }

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(uiState);
      });
    }
    // Its one outside caller was gui/device-orientation.js, which coalesced a
    // resize-driven re-render through this scheduler (issue #462). Layout is
    // now a media query and needs no repaint, so the module and this export
    // went with it (issue #1370); `scheduleRender` stays page-local.

    // QR-first scenario/ship picker rendering (issue #755). Keyed on the
    // current stage so the DOM (and the ph-ship-picker web component) is only
    // rebuilt when the stage actually changes — the render loop runs at rAF
    // cadence and must not tear down a half-tapped picker.
    let _pickerStageKey = null;
    /// The request this phone has sent and not yet seen answered, and the
    /// "another phone got there first" record left by the last one that lost
    /// the race. Both are pure-rule state — see gui/scenario-pick.js — kept
    /// here because the arbiter never addresses an acknowledgement to us.
    let _pick = null;
    let _pickNotice = null;

    /// Settle an outstanding pick against a freshly-arrived lock. Called from
    /// handleMessage on every ScenarioCatalog broadcast (PRD #1023 module 4).
    function settleScenarioPick() {
      const ls = window.lobbyState;
      if (!ls || !window.scenarioPick) return;
      const settled = window.scenarioPick.settlePick(_pick, ls.selectionLocked);
      _pick = settled.pending;
      if (settled.state === 'lost') {
        // Name what actually won, not just that we lost. `lostTo` is a
        // scenario id or a template_path; resolve it back to its catalogue
        // label so the message reads as prose.
        _pickNotice = { choice: pickChoiceLabel(settled.lostTo) };
      } else if (settled.state === 'won') {
        _pickNotice = null;
      }
    }

    /// Catalogue label for a locked scenario id or ship template_path.
    function pickChoiceLabel(id) {
      const ls = window.lobbyState;
      const catalog = (ls && ls.scenarioCatalog) || [];
      for (const sc of catalog) {
        if (!sc) continue;
        if (sc.id === id) return wireText(sc.label) || sc.id;
        for (const sh of (sc.ships || [])) {
          if (sh && sh.template_path === id) {
            return wireText(sh.label) || wireText(sh.name) || id;
          }
        }
      }
      return String(id || '');
    }

    function renderScenarioPicker() {
      const ls = window.lobbyState;
      const body = document.getElementById('scenario-picker-body');
      const heading = document.getElementById('scenario-picker-heading');
      if (!ls || !body || !window.scenarioPick) return;
      const catalog = ls.scenarioCatalog || [];
      const activePacks = ls.activePacks || [];
      const locked = ls.selectionLocked || { scenario_id: null, template_path: null };
      const pv = window.scenarioPick.scenarioPickView({
        catalog, locked, pending: _pick, notice: _pickNotice,
      });

      let stage;
      if (locked.scenario_id == null) stage = 'scenario';
      else if (locked.template_path == null) stage = 'ship:' + locked.scenario_id;
      else stage = 'locked';
      // Pack count is in the key so a change to the applied mods re-renders the
      // scenario buttons' mod-origin badges (issue #990), not only a catalog
      // change (the two arrive together, but a later pack edit updates one).
      // The pending id and the race notice are in it too: a tap must repaint
      // the picker WITHOUT waiting for a stage change, since waiting for the
      // stage change is exactly the silence the pending state exists to fill.
      const key = stage + '|' + catalog.length + '|' + activePacks.length
        + '|' + (pv.pendingId || '') + '|' + (pv.noticeParams ? pv.noticeParams.choice : '');
      if (key === _pickerStageKey) return;
      _pickerStageKey = key;

      body.innerHTML = '';
      // "Another phone chose X" — rendered above whichever stage the player
      // was moved to, so the stage change has a stated cause (PRD #1023 user
      // story 16).
      if (pv.noticeId) {
        const notice = document.createElement('div');
        notice.className = 'scenario-race-note';
        notice.setAttribute('role', 'status');
        notice.textContent = t(pv.noticeId, pv.noticeParams);
        body.appendChild(notice);
      }
      if (stage === 'scenario') {
        if (heading) heading.textContent = t('client.select_scenario');
        if (pv.emptyId) {
          const note = document.createElement('div');
          note.className = 'scenario-locked-note';
          // NOT "waiting for the host to select a scenario": the host has
          // already broadcast its catalogue and the catalogue is empty.
          note.textContent = t(pv.emptyId);
          body.appendChild(note);
          return;
        }
        for (const sc of catalog) {
          const btn = document.createElement('button');
          btn.className = 'scenario-btn';
          btn.dataset.scenarioId = sc.id;
          const title = document.createElement('div');
          title.textContent = sc.label || sc.id;
          btn.appendChild(title);
          if (sc.description) {
            const desc = document.createElement('div');
            desc.className = 'scenario-desc';
            desc.textContent = sc.description;
            btn.appendChild(desc);
          }
          // Mod-origin badge (issue #990): only a mod-supplied scenario gets one;
          // a base scenario returns null and stays unmarked.
          const badge = (typeof window.scenarioOriginBadge === 'function')
            ? window.scenarioOriginBadge(sc, activePacks) : null;
          if (badge) {
            const badgeEl = document.createElement('span');
            badgeEl.className = 'scenario-origin';
            badgeEl.textContent = t('client.scenario_mod_origin', { name: badge.name });
            btn.appendChild(badgeEl);
          }
          // Immediate feedback (PRD #1023 user story 16). The arbiter sends no
          // acknowledgement, so between the tap and the next catalogue
          // broadcast the picker used to look untouched — which is how a phone
          // on a slow link ends up tapping twice.
          if (pv.pendingId === sc.id) {
            btn.classList.add('pending');
            btn.setAttribute('aria-busy', 'true');
            const wait = document.createElement('div');
            wait.className = 'scenario-pending';
            wait.textContent = t('client.pick_pending');
            btn.appendChild(wait);
          }
          btn.disabled = !pv.accepting;
          btn.addEventListener('click', () => {
            if (!pv.accepting) return;
            _pick = window.scenarioPick.pendingPick('scenario', sc.id);
            _pickNotice = null;
            scheduleRender();
            // Same action map as the host page — two transports (issue #755).
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_scenario', scenario_id: sc.id }, send);
            } else {
              send('SelectScenario', { scenario_id: sc.id });
            }
          });
          body.appendChild(btn);
        }
      } else if (stage.startsWith('ship:')) {
        if (heading) heading.textContent = t('client.select_ship');
        const entry = catalog.find(s => s && s.id === locked.scenario_id);
        const ships = (entry && entry.ships) || [];
        import('./gui/components/ph-ship-picker.js').then(() => {
          if (_pickerStageKey !== key) return; // stage changed meanwhile
          const picker = document.createElement('ph-ship-picker');
          body.appendChild(picker);
          // The picker greys itself out and marks the tapped card while the
          // request is unacknowledged (PRD #1023 user story 16).
          picker.state = { ships, pendingTemplate: pv.pendingId, accepting: pv.accepting };
          picker.addEventListener('ship-selected', (e) => {
            const tp = e.detail.template_path;
            _pick = window.scenarioPick.pendingPick('ship', tp);
            _pickNotice = null;
            scheduleRender();
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_player_ship', template_path: tp }, send);
            } else {
              send('SelectPlayerShip', { template_path: tp });
            }
          });
        });
      } else {
        if (heading) heading.textContent = t('client.select_ship');
        const note = document.createElement('div');
        note.className = 'scenario-locked-note';
        note.textContent = t('client.scenario_locked');
        body.appendChild(note);
      }
    }

    function render(s) {
      // QR-first pre-scenario picker (issue #755): before any world loads, the
      // host delivers the catalog and this phone can make the first valid
      // selection. Short-circuit the normal lobby/game render while active.
      // Which pre-play surface is up — picker, waiting overlay, asset preload
      // or the join field — is one decision now (issue #1359), taken here for
      // every one of them rather than per surface at four call sites. The
      // short-circuit below still turns on the raw lobby fact: the picker's
      // CONTENT has to be built whenever the catalogue is live, even on the
      // frame an opaque asset-preload overlay is covering it.
      applyPrePlaySurfaces();
      const pickingScenario = !!(window.lobbyState && window.lobbyState.showScenarioPicker());
      if (pickingScenario) {
        $('lobby-ui').className = '';

# Combat Test Scenario (#475)
#
# An 8-wave defence scenario that exercises the full combat stack:
#   - on_all_destroyed trigger condition (#470)
#   - NPC shields backend + Sensors panel rendering (#471, #473)
#   - Rebalanced Harrow fleet + Axiom Station (#474)
#   - Federation-Harrow mutual hostility (#472)
#
# Layout: concentric rings centred on the star at the origin.
#   - Star at [0, 0, 0]
#   - Inner asteroid belt: r=200..300 (cover near the playspace centre)
#   - Clear zone: r=300..800 (planet, starbase, and player live here)
#   - Outer asteroid belt: r=800..1000 (forces attackers to fly through
#     asteroids to reach the starbase)
#   - Spawn anchors beyond the outer belt (r > 1000), biased toward
#     the +X hemisphere.
#   - Gas giant + ice moon beyond the outer belt on the -X side (r ~1237),
#     clear of the spawn anchors.
#
# Starbase Alpha sits at [500, 0, 100] — within the clear zone. Player ship
# spawns at [400, 0, 200] (~140u from the starbase) ready to defend.
#
# Ship selection: four Alliance hulls are available in the lobby.
#   Alliance Courier    power_rating = 25   (single-station, solo)
#   Alliance Destroyer  power_rating = 70
#   Alliance Cruiser    power_rating = 90
#   Alliance Battleship power_rating = 120
#
# Wave schedule (issue #892, the corrected eight-wave table). The waves are
# DEATH-GATED, not timed: wave N+1 is authored on `on_all_destroyed` over wave
# N's group, and its spawn actions carry `delay_secs = 10.0` — a ten-second
# breather between clearing one wave and meeting the next. Only wave 1 is on a
# clock (`on_timer`, t=0).
#
#   1   1x cruiser                  enemy_n_outer
#   2   1x destroyer                enemy_se
#   3   1x cruiser                  enemy_e
#   4   1x destroyer                enemy_ne
#   5   2x cruiser                  enemy_ese  + enemy_ene
#   6   2x destroyer                enemy_s_outer + enemy_n_outer
#   7   1x cruiser + 1x destroyer   enemy_e_far + enemy_e
#   8   1x patrol cruiser           enemy_e_far
#
# Singles alternating classes through wave 4, pairs through wave 7, closing on a
# single patrol cruiser. Patrol cruisers are otherwise the STANDING PICKET
# presence outside the schedule (see the `[anchors]` note and the two
# `on_world_loaded` picket spawns): they hold their stations out past the belt
# while the raid comes to the player.
#
# `OnAllDestroyed { group }` reads live group membership, so the chain is
# self-balancing across power tiers: whatever spawned into `wave_N` — primary
# ships and the tier bonus alike — must all die before wave N+1 is released.
#
# Power-scaled bonus spawns (gated by ship_power counter = player power_rating),
# authored as an extra gated ACTION on the wave's own trigger rather than as a
# parallel trigger, so a bonus ship rides the same group and the same breather:
#   ship_power >= 90 (cruiser or battleship): +1 Harrow destroyer on each odd
#     wave (1, 3, 5, 7).
#   ship_power >= 100 (battleship only): +1 Harrow cruiser on each even wave
#     (2, 4, 6, 8).
#   Bonus ships are named wave_N_bonus. They join `hostiles` and `wave_N`, so
#   they gate both the chain and victory. They carry no separate objective.
#
# The DEMO tier (destroyer, power_rating 70) therefore sees exactly the table
# above and nothing else; the fuller catalogue is what the two higher tiers add.
#
# Targeting model:
#   Harrow ships spawn in their default `initial_state` (patrol/idle).
#   Each ship's `enemy_in_range` transition (radius 5000) detects the
#   player on the first tick and switches to `pursuing` with the player
#   as the target. The starbase, being factionless, is not auto-targeted —
#   enemies pursue and engage the player ship directly. If the player
#   moves to draw fire away from the starbase, the cruiser/destroyer
#   combat at the player's position will incidentally threaten the
#   starbase if it's in their weapons cone.
#
#   `set_ai_state` in the same trigger as `spawn_entity` was attempted
#   but found unworkable: Bevy `Commands` defer the spawn until the
#   next ECS sync, so the AI controller doesn't exist when `set_ai_state`
#   would run. The `enemy_in_range` approach is robust and uses only
#   existing engine mechanisms.
#
#   Harrow defaults to neutral so non-combat worlds (Starbase Alpha,
#   Before the Fire) can reuse the same ship templates as ambient
#   patrols. This scenario flips both directions of the Federation
#   <-> Harrow relationship hostile on `on_world_loaded` via two
#   `add_faction_enemy` actions, *before* the first wave's
#   `enemy_in_range` tick — guaranteeing the first wave engages
#   immediately rather than drifting past the player.
#
# Victory: every hostile destroyed → game_over "VICTORY". ONE trigger, not the
#   three per-tier variants this world used to carry. Those enumerated a fixed
#   name list per tier, and an unregistered name in such a list permanently
#   blocks the trigger — which is exactly what happened: no spawn action in this
#   world ever authored `groups`, so the `waves` group was empty and victory was
#   unreachable at every tier (the all-defeat headless baseline recorded on
#   issue #892). Group membership is dynamic, so a single `on_all_destroyed`
#   over `hostiles` covers all three tiers with no name list at all.
#
#   The guard is `counter(waves_spawned) >= 8` rather than a clock. Waves are
#   death-gated with a ten-second breather, so there are windows in which every
#   REGISTERED hostile is dead and the next wave has not spawned yet; without
#   the counter those windows read as victory. Each wave increments the counter
#   on the same delayed schedule as its own spawn, so the counter can only reach
#   8 in the same dispatch batch that registers wave 8.
# Defeat:  Starbase Alpha destroyed → game_over "DEFEAT".
#          Player ship destroyed → handled by the built-in apply_hull_damage
#          path which sets GamePhase::GameOver directly with reason
#          "All consoles destroyed" — no scenario trigger needed.
#
# Pacing: this world also PUBLISHES how much of itself is still ahead, as the
#   world counter `mission_threat_remaining` (issue #943). It is set to 8 on
#   `on_world_loaded` and decremented beside each wave's `complete_objective`,
#   so at any moment it reads how many waves are still to come. Anything that
#   has to ration a finite resource across the whole run reads it instead of
#   guessing — today that is the torpedo magazine's `torpedo_conservation`
#   doctrine (see `[torpedoes.ai]` on any hull with tubes), which divides the
#   rounds the ship still has ABOARD — magazine plus tubes — by this number and
#   holds fire once the quotient falls under the reserve the hull authors.
#   Without it a ship — player or NPC — meets wave 1 with twelve torpedoes and
#   waves 2-8 with none.
#
#   It is deliberately a SECOND counter rather than arithmetic on
#   `waves_spawned`: that one counts waves RELEASED (and is what victory waits
#   for), this one counts waves REMAINING, and the two move at different
#   moments — a wave is released ten seconds after the previous one dies.

[global]
seed = 475
title = "world.combat_test.global.title"
description = "world.combat_test.global.description"

[ambient_light]
color      = [0.6, 0.55, 0.5]
brightness = 300.0

# Red-alert audio. `siren` is a one-shot on the false→true edge; `music` loops
# underneath for as long as the alert is active. Every other sound is
# configured on the ship entity instead.
[audio.red_alert]
siren_file   = "assets/sounds/red_alert_siren.ogg"
siren_volume = 0.7
music_file   = "assets/sounds/last_stand_in_space_looped.ogg"
music_volume = 0.35

# Denser, closer and brighter than the default world: combat happens at short
# range, so the field is pulled in tight to keep motion readable at low speed
# while manoeuvring. Layers are matched to the built-in near/mid/far set by
# position; omitted fields keep their defaults.
[dust]
enabled = true

[[dust.layer]]
name       = "near"
max_motes  = 32
depth_band = [3.0, 18.0]
brightness = [1.0, 3.5]

[[dust.layer]]
name       = "mid"
max_motes  = 200
depth_band = [8.0, 45.0]
brightness = [0.4, 2.0]

[[dust.layer]]
name       = "far"
max_motes  = 260
depth_band = [30.0, 100.0]

[dust.warp]
enabled = true

# ── Anchors ───────────────────────────────────────────────────────────────────
#
# Starbase at [500, 0, 100]. Spawn anchors are absolute world coords (the
# `spawn_entity` action's `anchor` field resolves against this `[anchors]`
# block). All spawn anchors lie outside the outer asteroid belt (r >= 1000
# from world origin) on the outward-facing +X hemisphere of the starbase.
[anchors]
# Verification: distance from world origin to each anchor, computed as
# sqrt(x^2 + z^2). All should be >= 1000.
enemy_e        = [1200.0, 0.0, 100.0]    # 1204
enemy_ne       = [1000.0, 0.0, -400.0]   # 1077
enemy_se       = [1000.0, 0.0, 600.0]    # 1166
enemy_n_outer  = [900.0, 0.0, -600.0]    # 1081
enemy_s_outer  = [900.0, 0.0, 800.0]     # 1204
enemy_ene      = [1100.0, 0.0, -150.0]   # 1110
enemy_ese      = [1100.0, 0.0, 350.0]    # 1154
enemy_e_far    = [1400.0, 0.0, 100.0]    # 1404
starbase_patrol_north = [500.0, 0.0, -100.0]   # starbase + [  0, 0, -200]
starbase_patrol_east  = [700.0, 0.0, 100.0]   # starbase + [+200, 0,    0]
starbase_patrol_south = [500.0, 0.0, 300.0]   # starbase + [  0, 0, +200]
starbase_patrol_west  = [300.0, 0.0, 100.0]   # starbase + [-200, 0,    0]

# Patrol anchors for enemy ship [[behaviour.doctrine]] routes. These must match
# the `directive_anchors` referenced in the entity TOMLs so that ships have a
# resolvable Patrol route; fielding a hull whose route this world does not
# declare fails the load and names the anchor.
#
# There is no `patrol_alpha`/`_beta`/`_gamma` circuit any more (issue #892):
# those three anchors existed solely for the retired `pirate_raider.toml`.
#
# The Harrow cruiser and destroyer author a Destroy doctrine only and need no
# anchors here. `ship_harrow_patrol.toml` is the one hull in the scenario that
# authors a Patrol entry, and since issue #892 that entry is a PICKET (see the
# hull TOML): station-keeping, not a roving sweep. These two anchors are the
# picket's two stations, out past the outer belt on the +X approach the raid
# waves fly in on — the standing Harrow presence the player has to go and clear,
# as against the waves, which come to the player.
ironveil_patrol_a  = [1000.0, 0.0, -300.0]  # picket station, north approach (1044)
ironveil_patrol_b  = [1000.0, 0.0,  400.0]  # picket station, south approach (1077)

# `warhawk_patrol_a`/`_b` are gone with the Harrow battleship: the corrected
# eight-wave schedule (issue #892) closes on a patrol cruiser, not a Warhawk, so
# no hull in this world reads that route any more.
#
# There is deliberately no `pirate_haven` here either, and since issue #892
# there is nothing left that would read it.
#
# The retired `pirate_raider.toml` carried a `retreat-when-hurt` Retreat
# directive naming that anchor, gated on hull < 30%, and every wave override had
# to clear the entry: victory is `on_all_destroyed`, so a wave that runs for a
# haven at full throttle the moment it is nearly dead turns every ending into a
# stern chase. Neither Harrow hull in the wave list authors a Retreat at all, so
# the clearing entries are gone with the hull — nothing to fall through to, and
# nothing to state.

# ── Static map entities ───────────────────────────────────────────────────────

# Star at world origin. Inner asteroid field rings the star at r=200..300.
[[entity]]
template_path = "assets/entities/star_sun.toml"
transform = { position = [0.0, 0.0, 0.0] }

# Planet in the inter-field gap. The id/name stay "earth" so any existing
# trigger/comms references keep resolving.
[[entity]]
template_path = "assets/entities/planet_ecumenopolis.toml"
id = "earth"
name = "world.entity.earth.name"
transform = { position = [550.0, 0.0, 0.0] }

# Gas giant beyond the outer belt (r ~1237 > 1000), on the -X side away from
# the +X-biased enemy spawn anchors. Its ice moon is placed relative to it.
[[entity]]
template_path = "assets/entities/planet_gas_giant.toml"
id = "gas-giant"
name = "world.entity.gas_giant.name"
transform = { position = [-1200.0, 0.0, 300.0] }

[[entity]]
template_path = "assets/entities/moon_ice.toml"
id = "ice-moon"
name = "world.entity.ice_moon.name"
transform = { relative_to = "gas-giant", offset = [125.0, 0.0, 40.0] }

# The two belts are authored as separate field entities but spawn through
# ONE composed density evaluator (#913): every field contributes its density
# weighted by `weight`, a single streaming window evaluates each world cell
# exactly once, and wherever fields overlap the blend spawns each rock once
# instead of once per field. `shape = "torus"` selects the explicit annulus
# eligibility (cells whose bounding box overlaps the ring).

# Inner asteroid belt around the star, r=200..300. Forms cover near the
# centre of the playspace; the player can hide in or peek out of it.
[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
id = "inner-belt"
transform = { position = [0.0, 0.0, 0.0] }
overrides = { asteroid_field = { inner_radius = 200.0, outer_radius = 300.0, weight = 1.0, shape = "torus" } }

# Outer asteroid belt, r=800..1000. Sits between the starbase and the
# enemy spawn anchors (all at r >= 1000), so attackers must fly through
# asteroids to reach the playspace.
[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
id = "outer-belt"
transform = { position = [0.0, 0.0, 0.0] }
overrides = { asteroid_field = { inner_radius = 800.0, outer_radius = 1000.0, weight = 1.0, shape = "torus" } }

# Player ship — selected from the lobby ship picker. The [[available_ships]]
# entries drive the lobby UI; [player_spawn] sets the spawn position once
# the player enters the game. The [[entity]] + spawn_on = "game_start" block
# below is NOT replaced by this pair — spawn_game_start_entities still needs
# a game-start "ship" entity to anchor position/uuid/tags on, it just discards
# that entity's own EntityConfig in favour of the lobby-selected template
# (server_app.rs spawn_game_start_entities). Its template_path must therefore
# stay a hull this world's own [[available_ships]] always preloads: keep it in
# sync with available_ships[0] (the destroyer) so a curated single-hull
# manifest (issue #917, assets/scenarios.demo.toml) never has to fetch a hull
# outside its curated allowlist just to spawn this placeholder.

[[available_ships]]
template_path = "assets/entities/alliance_destroyer.toml"
label = "world.combat_test.available_ships.0.label"

[[available_ships]]
template_path = "assets/entities/alliance_cruiser.toml"
label = "world.combat_test.available_ships.1.label"

[[available_ships]]
template_path = "assets/entities/alliance_battleship.toml"
label = "world.combat_test.available_ships.2.label"

# Single-station hull: one player flies the whole ship. power_rating = 25 keeps
# it under both bonus-spawn gates below, so a solo pilot faces the base waves.
[[available_ships]]
template_path = "assets/entities/alliance_courier.toml"
label = "world.combat_test.available_ships.3.label"

[player_spawn]
position = [400.0, 0.0, 200.0]

# Player ship entity — spawned by spawn_game_start_entities when the game starts.
# The [player_spawn] section above overrides the position below. The actual ship
# template is determined by the player's lobby selection (PendingShipConfig), which
# is applied to this entity at spawn time. template_path here matters only as a
# fallback (no lobby selection, e.g. the ?scenario=<path> dev bypass) and to give
# spawn_game_start_entities a "ship"-tagged EntityConfig to key off of — kept as
# available_ships[0] (see the comment above [[available_ships]]).
[[entity]]
template_path = "assets/entities/alliance_destroyer.toml"
id = "player-ship"
transform = { position = [400.0, 0.0, 200.0] }
spawn_on = "game_start"

# Defended object. Named "Starbase Alpha" so on_destroyed can reference it.
[[entity]]
template_path = "assets/entities/station_axiom.toml"
name = "world.entity.starbase_alpha.name"
transform = { position = [500.0, 0.0, 100.0] }

# ── Wave spawn triggers ──────────────────────────────────────────────────────

# Make Harrow hostile to the Federation (and vice versa) for the duration
# of this scenario. The faction TOMLs default both sides to neutral so the
# same Harrow ship templates can appear as ambient patrols in non-combat
# worlds (Starbase Alpha, Before the Fire). Two `add_faction_enemy`
# actions flip both directions of the asymmetric `is_enemy` relationship
# at world-load time, *before* any wave's first detection tick —
# guaranteeing the first wave engages on detection rather than drifting
# past as a neutral patrol.
#
# The same trigger puts the two standing PICKETS on station. They are not part
# of the wave schedule and gate nothing in the chain — they join `hostiles`
# (so victory needs them cleared) and `pickets` (so anything that wants to talk
# about the picket line has a group to name), but no wave waits on them. They
# hold `ironveil_patrol_a` / `_b` out past the outer belt and let the raid come
# to the player; clearing them is a trip the player has to choose to make.
#
# Idempotent for the faction half. Re-running the trigger (e.g. via load_world
# layering) is a no-op there. Faction names are case-sensitive and must match
# the `name` field in the corresponding `assets/factions/*.toml`.
[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type    = "add_faction_enemy"
  faction = "Harrow"
  enemy   = "Federation"

  [[trigger.action]]
  type    = "add_faction_enemy"
  faction = "Federation"
  enemy   = "Harrow"

  # How much threat this mission poses, published for anything that has to pace
  # itself against the WHOLE run rather than the fight in front of it (issue
  # #943). Read today by the torpedo magazine's `torpedo_conservation` doctrine
  # — see `[torpedoes.ai]` on any hull with tubes — which divides the rounds the
  # ship still has aboard (magazine plus tubes) by this number and holds fire
  # once the quotient drops below the reserve the hull authors.
  #
  # Eight, because eight waves is what the schedule below releases. It is the
  # same number the victory guard counts up to in `counter(waves_spawned) >= 8`,
  # stated the other way round: that one asks "have all eight been RELEASED",
  # this one says "how many are still to come". Each wave's death trigger
  # decrements it, so while the last wave is alive it reads 1 and the fleet's
  # authored reserve of half a round per remaining wave comes to half a round —
  # a hull that has been holding rounds back can spend every one of them on the
  # ships actually left. It reaches 0 as that wave dies.
  #
  # Worth knowing before lengthening this schedule: this counter is the
  # DENOMINATOR of a ONE-WAY LATCH. It falls only when a wave DIES, and a hull
  # that has already dipped under its reserve is not shooting at the wave whose
  # death would make it fall. Publishing more threat than the fleet's magazines
  # can pace against therefore does not make the ships thriftier — it makes them
  # silent, and the death-gated chain below stops advancing. That is exactly
  # what this world did at the fleet's original reserve of one round per
  # remaining wave: the destroyer met wave 2 holding five rounds it was never
  # cleared to fire, and wave 3 never spawned.
  [[trigger.action]]
  type  = "set_flag_value"
  name  = "mission_threat_remaining"
  value = 8

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_patrol.toml"
  name          = "picket_north"
  anchor        = "ironveil_patrol_a"
  groups        = ["hostiles", "pickets"]

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_patrol.toml"
  name          = "picket_south"
  anchor        = "ironveil_patrol_b"
  groups        = ["hostiles", "pickets"]

# Wave 1 — 1x Harrow cruiser, on the clock at t=0. The only wave that is.
#
# The cruiser waves (1, 3, 5, 7) carry the `assault-starbase` override: they are
# the bombardment element, and the `not_attacked` zero-gate means the moment the
# player shoots one it drops the run on the starbase and turns to fight.
#
# `increment_flag waves_spawned` is what the victory trigger counts. Wave 1's is
# undelayed because wave 1 is undelayed.
[[trigger]]
condition = "on_timer"
after_secs = 0.0

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_cruiser.toml"
  name          = "wave_1"
  anchor        = "enemy_n_outer"
  groups        = ["hostiles", "wave_1"]
  overrides = { behaviour = { doctrine = [
    { id = "assault-starbase", directive_kind = "Destroy", directive_target = "Starbase Alpha",
      base_priority = 50.0, target_speed = 0.9, maintain_range = 25.0,
      zero_gates = [{ condition = "not_attacked" }] },
  ] } }

  # Tier bonus: +1 Harrow destroyer for a cruiser or battleship player.
  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_destroyer.toml"
  name          = "wave_1_bonus"
  position      = [900.0, 0.0, -560.0]
  groups        = ["hostiles", "wave_1"]
  when          = "counter(ship_power) >= 90"

  [[trigger.action]]
  type           = "add_objective"
  id             = "obj-destroy-wave-1"
  text           = "world.combat_test.trigger.action.obj_destroy_wave_1.text"
  mandatory      = true
  targets        = ["wave_1"]
  target         = "wave_1"
  directive_kind = "Destroy"
  base_priority  = 80.0

  [[trigger.action]]
  type = "increment_flag"
  name = "waves_spawned"
  by   = 1

# Waves 2..8 — death-gated. Each trigger fires when the previous wave's GROUP is
# empty of survivors, completes that wave's objective immediately, and releases
# the next wave ten seconds later.
#
# The destroyer waves (2, 4, both halves of 6, the second half of 7) carry NO
# `overrides.behaviour`. That is where issue #883's fly-through demo went: it
# used to be an unconditional extra destroyer at t=20 (`wave_1c`) whose whole
# point was that it came straight for the PLAYER while the scheduled waves ran
# at the starbase. The corrected eight-wave table has no room for an unscheduled
# ninth ship, so the pass is not retired so much as promoted — every destroyer
# wave now flies the hull's own doctrine straight at the player, and the
# manoeuvre `wave_1c` existed to show is the destroyer's identity in this
# scenario rather than a one-off cameo.

# Wave 2 — 1x Harrow destroyer.
[[trigger]]
condition = "on_all_destroyed"
group     = "wave_1"

  [[trigger.action]]
  type = "complete_objective"
  id   = "obj-destroy-wave-1"

  # One less wave still to come (issue #943). Paired with the completion above
  # rather than with the next wave's spawn, so the count falls the moment the
  # threat is actually gone — including for wave 8, which has no successor to
  # carry the action for it.
  [[trigger.action]]
  type = "increment_flag"
  name = "mission_threat_remaining"
  by   = -1

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_destroyer.toml"
  name          = "wave_2"
  anchor        = "enemy_se"
  groups        = ["hostiles", "wave_2"]
  delay_secs    = 10.0

  # Tier bonus: +1 Harrow cruiser for a battleship player.
  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/ship_harrow_cruiser.toml"
  name          = "wave_2_bonus"
  position      = [1000.0, 0.0, 640.0]
  groups        = ["hostiles", "wave_2"]
  when          = "counter(ship_power) >= 100"
  delay_secs    = 10.0
  overrides = { behaviour = { doctrine = [
    { id = "assault-starbase", directive_kind = "Destroy", directive_target = "Starbase Alpha",
      base_priority = 50.0, target_speed = 0.9, maintain_range = 25.0,
      zero_gates = [{ condition = "not_attacked" }] },
  ] } }

  [[trigger.action]]
  type           = "add_objective"
  id             = "obj-destroy-wave-2"
  text           = "world.combat_test.trigger.action.obj_destroy_wave_2.text"
  mandatory      = true
  targets        = ["wave_2"]
  target         = "wave_2"
  directive_kind = "Destroy"
  base_priority  = 80.0
  delay_secs     = 10.0

  [[trigger.action]]
  type       = "increment_flag"
  name       = "waves_spawned"
  by         = 1
  delay_secs = 10.0

# Wave 3 — 1x Harrow cruiser.
[[trigger]]
condition = "on_all_destroyed"
group     = "wave_2"

  [[trigger.action]]
  type = "complete_objective"
  id   = "obj-destroy-wave-2"

  # One less wave still to come (issue #943). Paired with the completion above
  # rather than with the next wave's spawn, so the count falls the moment the
  # threat is actually gone — including for wave 8, which has no successor to
  # carry the action for it.
  [[trigger.action]]
  type = "increment_flag"

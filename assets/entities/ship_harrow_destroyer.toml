# Harrow Destroyer — the fly-through attack pass (issue #883)
#
# The first hull whose HELM BEHAVIOUR is authored rather than inherited. Every
# other NPC flies the shared `plan_helm_travel` doctrine, whose Destroy arm
# (`helm_destroy`) is a brake-and-orbit station-keeper: close, decelerate
# through a decel zone, park at 80% of weapons range and re-face the target so
# the forward arc bears. That is a perfectly good gunship and a terrible
# interceptor.
#
# This hull does the opposite. It runs a three-state machine on the #882
# stateful policy spine — independently on Engines, on Steering and on Boost —
# that flies a classic strafing pass:
#
#   acquire  ──(target inside commit_range)──▶  inbound
#   inbound  ──(closest approach detected)───▶  escape
#   escape   ──(dwell done, shields intact)──▶  acquire
#   escape   ──(dwell done, shields down, escape WORKED)─▶  recover
#   escape   ──(dwell done, shields down, escape FAILED)─▶  pressed_pivot
#   recover  ──(shields back AND distance held)▶ reenter
#   reenter  ──(pivot complete)──────────────▶  acquire
#   pressed_pivot ──(pivot dwell done)───────▶  pressed_pass
#   pressed_pass  ──(closest approach, short)─▶ escape
#
# * INBOUND is flown at a flat, normal approach throttle, with Steering
#   re-solving the facing against the target's CURRENT position every tick — the
#   target moves, so the tracking must too. Nothing brakes.
# * CLOSEST APPROACH is detected from the closing rate crossing from + to −,
#   confirmed against the running minimum range the host folds into private
#   memory. One tick of retention is exactly what a "the gap stopped shrinking"
#   test needs and exactly what no single-tick fact can express.
# * ESCAPE closes the facing solution: Steering switches to the second yaw mode
#   verb, `hold_committed_heading`, and flies the heading the host froze at the
#   merge. Engines stay on full escape throttle and Boost lights for the
#   authored window. The target can turn, run, or die — the escape does not care.
# * RECOVERY (issue #788) is what the escape hands off to when the pass cost the
#   destroyer its shields. Since #788 a collapsed shield comes back EMPTY and
#   climbs at its authored regen rate, so "my shields are down" is now a state
#   with a duration, and flying a second pass through it is how this hull dies.
#   At the end of the escape dwell the machine therefore asks one question — are
#   my shields effectively gone? — and if so breaks off to a standoff ORBIT
#   instead of turning back in.
#
#   The orbit's radius is NOT authored: it is the TARGET's own longest usable
#   direct-fire range plus `safe_range_margin`. A destroyer standing off a
#   short-ranged blaster boat has no business sitting where it would have to sit
#   against a beam cruiser, and neither number is knowable when this file is
#   written. The circulation direction is drawn once per recovery from a seeded
#   (world, ship, system, transition, occurrence) key, so a replayed seed breaks
#   the same way every time while two destroyers breaking off together do not
#   mirror one another.
#
#   The orbit SPIRALS: the host flies a tangent of the ring bent toward or away
#   from the target in proportion to the radial error, so a destroyer inside the
#   ring works its way out while still circling, and one that has over-run works
#   its way back in rather than running to the edge of the map. It never stops
#   and it never simply retreats.
# * RE-ENTRY needs BOTH halves and will not take one: shields back to
#   `reentry_shield_fraction`, AND the safe distance actually HELD across the
#   whole `safe_distance_window_ticks` history window. One tick at range is not a
#   maintained standoff, and full shields while still being shot at is not a
#   recovery. When both are true the destroyer cuts thrust (`reengage_speed = 0`),
#   pivots onto the target with the drive cold, and starts an ordinary
#   normal-speed pass — no boost, because boost is the escape's accelerant and
#   this is an approach.
# * PRESSED (issue #789) is what happens when the recovery above is not on
#   offer, because the player will not let it be. Standing off needs the
#   destroyer to actually GET away first, and against an aggressive opponent who
#   simply follows it out, the escape leg ends with the hull still inside the
#   other ship's guns and no further from them than when it started. Breaking
#   off then is not a recovery, it is a slow death at a fixed range.
#
#   So at the end of every escape the machine asks a second question after the
#   shield one: did that escape actually WORK? The answer is a trend, not a
#   level — the net separation gained across the `pressed_window_ticks` history
#   window — and it is asked only while still inside the target's own
#   direct-fire reach, because distance that does not matter is not distance
#   worth measuring. Gained less than `pressed_min_progress` while still under
#   the guns, and the destroyer stops trying to leave.
#
#   What it does instead is fight at the range it is stuck at. It abandons the
#   standoff ring and the `reentry_shield_fraction` threshold outright — both
#   are things you wait for, and waiting is what is killing it — and instead
#   BOOSTS a thrust-cut pivot (boost multiplies `max_yaw_rate`, so the drive is
#   spent on turning authority rather than on a run it cannot win), then makes a
#   short normal-speed attack pass. The pass breaks off on its own, smaller
#   `pressed_closest_approach_hysteresis`: it is a jab, not a run-in from range.
#
#   Every short pass ends in the ordinary `escape` state, so every one of them is
#   another honest attempt to get out, and the moment one of them opens real
#   distance the machine drops straight back into the recovery doctrine above.
#   The pressed loop is a response to being pinned, not a mode the hull has to be
#   talked out of.
#
# Shared hazard avoidance still bends the escape (it is a steering force folded
# into the same pure arm), and bending it changes no pass state at all. It bends
# the recovery orbit the same way, for the same reason.
#
# ARMAMENT: forward blasters, and deliberately NO torpedoes. A ship that crosses
# the merge at full throttle has a fraction of a second of firing solution;
# fixed forward blasters are the weapon that suits it, and a torpedo magazine it
# could never bring to bear would be dead tonnage. The absence is load-bearing
# content, pinned by a parse test.

name = "entity.ship_harrow_destroyer.name"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "high"
description = "entity.ship_harrow_destroyer.target.description"

# Lighter than the Lancer: this hull trades staying power for the speed and turn
# rate the pass depends on.
[hull]
hull_integrity = 900.0

# Single omni arc, as on every other NPC hull: NPCs have no `[shields]` station,
# so the auto-generated `[[system]]` entry is ownerless and `ai_only`.
#
# `regen_per_sec` is load-bearing for the recovery doctrine since issue #788: a
# collapsed facing now comes back at ZERO and climbs at this rate, so this is
# what sets how long a broken-off destroyer spends on its standoff ring. At 4/s
# a collapsed 40-point arc reaches the authored 75% re-entry threshold about 7.5
# seconds after the offline delay expires.
[[shield_arc]]
id = "all"
label = "entity.ship_harrow_destroyer.shield_arc.all.label"
center_deg = 0
width_deg = 360
max_hp = 40
regen_per_sec = 4.0
offline_duration = 6.0

[collider]
shape = "Capsule"
radius = 3.0
length = 9.0

[radar_appearance]
colour = [0.95, 0.45, 0.1]
size = 9.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_battleship.glb"
shape = "cuboid"
size = [6.0, 2.5, 12.0]
colour = [0.95, 0.45, 0.1]

# Fast and agile. `max_speed` is what the seeded `speed_fraction` fact is
# measured against, and `max_yaw_rate` is what makes continuous target tracking
# on the inbound leg actually converge before the merge.
[helm_console]
max_speed = 26.0
max_reverse_speed = 8.0
acceleration = 9.0
deceleration = 12.0
max_yaw_rate = 0.55
max_bank_deg = 22.0

# MANDATORY for this hull, not decoration: the spawner only inserts an ENABLED
# `BoostConfigResource` when `[helm_console.boost]` is authored, and
# `ai_helm_boost` returns immediately without one. The escape leg's boost is the
# whole back half of the doctrine, so omitting this block would silently produce
# a destroyer that makes the pass and then dawdles away from it.
[helm_console.boost]
multiplier = 2.4
# Above 1.0 since issue #789, and load-bearing: the drive multiplies
# `max_yaw_rate` as well as speed, and the pressed doctrine spends it on a
# thrust-cut pivot rather than on a run. A pinned destroyer's scarcest resource
# is how fast it can bring the bow back round, so `1.8 * 0.55 = 0.99 rad/s`
# roughly halves the time that pivot takes. (It also makes the escape leg's own
# hazard avoidance bite harder, which is free — the escape flies a frozen
# heading inside a deadband, so it commands no yaw of its own to amplify.)
steering_multiplier = 1.8
active_duration = 5.0
# The battery drains partially and recharges whenever the drive is cold, so a
# pressed destroyer that spends `pressed_pivot_secs` of it on each pivot and
# recharges through each short pass runs a progressively tighter boost budget
# the longer it stays pinned. That is intended: being pressed should cost.
recharge_duration = 14.0

# ── Engines (longitudinal) doctrine ───────────────────────────────────────────
#
# The three states differ only in the throttle the host reads for them
# (`approach_speed` while acquiring/inbound, `escape_speed` on the way out) —
# the rule is the same unconditional "actuate the planner's desired travel" in
# all three, because a pass never coasts.
[helm_console.engines_ai]
initial_state = "acquire"

# EVERY manoeuvre threshold this hull flies by is authored here. There is no
# default for any of them anywhere in Rust: a hull that omits them simply never
# flies a pass (the host declines to publish the pass surface) rather than
# falling back to an invented number.
[helm_console.engines_ai.param]
# Throttle fraction flown while closing. "Normal speed" — not flat out, so the
# boosted escape reads as a distinct change of pace.
approach_speed = 0.85
# Throttle fraction flown outbound.
escape_speed = 1.0
# The destroyer only commits to a run once the target is this close; further out
# it is still lining up.
commit_range = 260.0
# Closing rate (world units/s) below which the range counts as OPENING. Slightly
# negative rather than zero so sensor jitter at the merge cannot flip the test.
closing_rate_epsilon = -0.5
# How far (world units) the range must re-open above the minimum seen this state
# before closest approach is called. The confirmation half of the detector: it
# rejects a momentary negative blip that has not actually opened any distance.
closest_approach_hysteresis = 6.0
# How long (seconds) the escape leg runs before the destroyer turns back for
# another pass.
escape_duration_secs = 7.0
# ── Shield-recovery thresholds (issue #788) ───────────────────────────────────
# Own-shield fraction at or below which the pass has cost too much to repeat:
# the escape hands off to the standoff orbit instead of turning back in. Low, so
# a scratched destroyer presses the attack and only a COLLAPSED one breaks off.
recover_shield_fraction = 0.15
# Own-shield fraction the orbit must restore before re-entry is even considered.
# The other half of the gate is `fact(safe_distance_held)`; both are required.
reentry_shield_fraction = 0.75
# How long (seconds) the cut-thrust pivot runs before the next pass begins.
reenter_pivot_secs = 1.5
# ── Pressed thresholds (issue #789) ───────────────────────────────────────────
# World units of separation the escape must have GAINED across the pressed
# history window for it to count as working. Deliberately below what an
# unboosted escape covers in that window (26 u/s over 1.467 s is 38.1 units), so a
# destroyer that is merely coasting still reads as escaping; only one that is
# being MATCHED falls under it.
pressed_min_progress = 30.0
# How long (seconds) the boosted, thrust-cut pivot runs before the short pass.
# Short: the whole point is that this is faster than the ordinary
# `reenter_pivot_secs` turn, because the drive is lit for it.
pressed_pivot_secs = 1.2
# The SHORT pass's own closest-approach hysteresis, in world units of re-opened
# range. A third of the ordinary `closest_approach_hysteresis`, which is what
# makes the pressed pass a jab rather than a second full run-in: the destroyer
# breaks off almost the moment the gap stops shrinking.
pressed_closest_approach_hysteresis = 2.0

# Host-written private memory (issue #882: the host writes, the policy reads —
# there is no authored write verb). `min_range_seen` starts effectively
# infinite so the first folded range always wins the minimum.
[helm_console.engines_ai.memory]
min_range_seen = 1000000.0
escape_heading_rad = 0.0

[[helm_console.engines_ai.state]]
id = "acquire"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  [[helm_console.engines_ai.state.transition]]
  priority = 10
  to = "inbound"
  when = "fact(target_valid) > 0 and fact(range_to_target) <= param(commit_range)"

[[helm_console.engines_ai.state]]
id = "inbound"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  # CLOSEST APPROACH. Three conjuncts, each doing distinct work:
  #   target_valid          — never call a merge against a target we cannot see
  #   closing_rate < eps    — the gap has started opening (the + to − crossing)
  #   range_above_min_seen  — and it has opened far enough to be real, measured
  #                           against the running minimum in private memory
  [[helm_console.engines_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  # Target lost mid-run: abandon the pass rather than merging on a ghost.
  [[helm_console.engines_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"

[[helm_console.engines_ai.state]]
id = "escape"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  # Only the authored dwell ends the escape. Nothing about the target may cut it
  # short — that is what "commits to the outward heading" means. What the dwell
  # ends INTO is a decision: with the shields gone, recovery; otherwise another
  # pass. Checking here rather than mid-escape is deliberate — the escape's
  # commitment is the doctrine's own invariant, and the shields are no more
  # recovered a second earlier.
  #
  # PRESSED (issue #789) takes priority over recovery because it answers a
  # question recovery has already assumed the answer to: recovery is a plan that
  # begins "get away from them", and this conjunct is the check that the getting
  # away is possible at all. It shares the shield conjunct — a destroyer with its
  # shields up has nothing to recover, so being followed is just combat — but
  # deliberately carries no distance-held or shield-threshold conjunct of its
  # own. Both are things the ordinary doctrine WAITS for, and the whole finding
  # here is that waiting is not available.
  [[helm_console.engines_ai.state.transition]]
  priority = 20
  to = "pressed_pivot"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction) and fact(inside_threat_range) > 0 and fact(separation_progress) < param(pressed_min_progress)"

  [[helm_console.engines_ai.state.transition]]
  priority = 10
  to = "recover"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction)"

  [[helm_console.engines_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(escape_duration_secs)"

# The standoff orbit. Engines simply actuate the planner's desired travel here
# as in every other state — the ORBIT throttle (`orbit_speed`) is one of the
# authored scalars the host publishes on the pass surface, so this axis needs no
# knowledge that it is circling rather than closing.
[[helm_console.engines_ai.state]]
id = "recover"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  # BOTH halves, and neither alone (AC6). `safe_distance_held` is the bounded
  # history window's verdict — every sample across the whole window at or beyond
  # the safe ring — not a single-tick range reading.
  [[helm_console.engines_ai.state.transition]]
  priority = 0
  to = "reenter"
  when = "fact(shield_fraction) >= param(reentry_shield_fraction) and fact(safe_distance_held) > 0"

# The cut-thrust pivot. `reengage_speed = 0` on the Steering axis is what makes
# "actuate the planner's desired travel" mean zero throttle here.
[[helm_console.engines_ai.state]]
id = "reenter"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  [[helm_console.engines_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(reenter_pivot_secs)"

# ── The pressed short-pass loop (issue #789) ──────────────────────────────────
#
# Engines actuates the planner's desired travel in both states exactly as it
# does everywhere else; which throttle that resolves to is the Steering axis's
# yaw verb's business (`reengage_speed` for the pivot, `approach_speed` for the
# pass), so this axis needs no knowledge that it is jabbing rather than closing.
[[helm_console.engines_ai.state]]
id = "pressed_pivot"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  [[helm_console.engines_ai.state.transition]]
  priority = 0
  to = "pressed_pass"
  when = "state_time >= param(pressed_pivot_secs)"

[[helm_console.engines_ai.state]]
id = "pressed_pass"

  [[helm_console.engines_ai.state.rule]]
  priority = 0
  channel = "longitudinal"
  when = "true"
  verb = "actuate_desired_travel"

  # The same closest-approach detector the ordinary inbound leg uses, on the
  # same three conjuncts, differing in ONE authored scalar: the shorter
  # `pressed_closest_approach_hysteresis`. That single substitution is what
  # makes this a jab, and it is the reason the pressed pass needed no new host
  # geometry at all.
  #
  # It ends in `escape` — the ordinary one — so every short pass is another real
  # attempt to get out, and the escape's own end-of-dwell question decides
  # whether the next thing is another jab or the recovery doctrine.
  [[helm_console.engines_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(pressed_closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  # Target lost mid-jab: back to the ordinary acquire cycle. There is nothing
  # left to be pressed BY.
  [[helm_console.engines_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"

# ── Steering (yaw) doctrine ───────────────────────────────────────────────────
#
# The axis that carries the actual difference between the two legs. `acquire`
# and `inbound` author `actuate_desired_facing` — re-solve against the moving
# target every tick. `escape` authors `hold_committed_heading` — fly the frozen
# heading and stop looking at the target at all.
#
# Note this is NOT the same as letting the yaw channel resolve to "hold". A hold
# holds the last steering COMMAND; a non-zero yaw at the merge instant would
# keep the destroyer turning through the escape and curl it straight back into
# the target it just passed.
[helm_console.steering_ai]
initial_state = "acquire"

[helm_console.steering_ai.param]
commit_range = 260.0
closing_rate_epsilon = -0.5
closest_approach_hysteresis = 6.0
escape_duration_secs = 7.0
# Steering response. The deadband stops the hull hunting around a solved bearing
# at the merge; the saturation angle is tighter than the shared patrol default so
# the destroyer turns hard onto a tracking solution rather than easing onto it.
tracking_deadband_rad = 0.02
tracking_full_steer_rad = 0.5
# ── Shield-recovery thresholds (issue #788) ───────────────────────────────────
# Restated because this axis's own guards reference them; content validation
# rejects an undeclared `param(...)`.
recover_shield_fraction = 0.15
reentry_shield_fraction = 0.75
reenter_pivot_secs = 1.5
# The six scalars the HOST reads off this axis by name to fly the standoff.
# Steering owns them because Steering's yaw verb is what tells the host which
# leg is being flown; omit any one of them and the host declines the recovery
# arm outright rather than orbiting at an invented radius.
#
# World units added to the TARGET's own longest usable direct-fire range to get
# the ring. The ring is therefore a property of the fight, not of this file: all
# this hull authors is how much daylight it wants beyond the other ship's guns.
safe_range_margin = 120.0
# Throttle fraction flown on the ring. Not zero: a destroyer parked inside a
# hostile's reach is not recovering, it is a target.
orbit_speed = 0.7
# Radians of heading offset per unit of FRACTIONAL radial error. Fractional so
# the same gain behaves identically on an 80-unit ring and an 800-unit one —
# otherwise this would need re-tuning every time a weapon's range changed.
orbit_spiral_gain = 1.2
# World units inside the ring that still count as "at safe distance" when the
# distance history is folded. Absorbs the spiral's own overshoot, so a converging
# orbit is not read as a breach.
safe_ring_tolerance = 25.0
# Length of the bounded distance history, in shared AI ticks. At the default
# 30 Hz helm cadence this is two seconds of held standoff — the "maintained" in
# "maintained safe distance".
safe_distance_window_ticks = 60.0
# Throttle flown on the re-entry pivot. ZERO: the destroyer cuts thrust and
# turns cold before it commits to the next run. The pressed pivot reuses this
# same throttle — a stationary pivot is a stationary pivot — and differs only in
# having the boost drive lit for it.
reengage_speed = 0.0
# ── Pressed thresholds (issue #789) ───────────────────────────────────────────
# Restated on this axis because its own guards reference them; content
# validation rejects an undeclared `param(...)`.
pressed_min_progress = 30.0
pressed_pivot_secs = 1.2
pressed_closest_approach_hysteresis = 2.0
# Length of the separation-PROGRESS history, in shared AI ticks. The trend is
# measured between the two ENDS of the window, so 45 samples span 44 tick
# intervals — 1.467 seconds at the default 30 Hz helm cadence, not 1.5.
# Its own window with its own length, not a reuse
# of `safe_distance_window_ticks`: that one is tuned for "how long counts as a
# maintained standoff before re-entry", this one for "how long a failing escape
# takes to be obvious", and lengthening one has no business slowing the other.
#
# The HOST reads this by name (like the six recovery scalars above) along with
# the three thresholds; omit any one of the four and it declines the pressed arm
# outright and the hull flies the ordinary recovery doctrine.
pressed_window_ticks = 45.0

[helm_console.steering_ai.memory]
min_range_seen = 1000000.0
escape_heading_rad = 0.0
# Host-written on the tick a recovery orbit is entered, from the seeded
# composite key. Declared here so its pre-recovery value is authored rather than
# implicit; no guard reads it — the host does, when it publishes the pass
# surface.
orbit_direction = 1.0

[[helm_console.steering_ai.state]]
id = "acquire"

  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "actuate_desired_facing"

  [[helm_console.steering_ai.state.transition]]
  priority = 10
  to = "inbound"
  when = "fact(target_valid) > 0 and fact(range_to_target) <= param(commit_range)"

[[helm_console.steering_ai.state]]
id = "inbound"

  # Continuous tracking of a MOVING target: the facing is re-solved from the
  # target's current position on every gated tick (AC1).
  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "actuate_desired_facing"

  [[helm_console.steering_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  [[helm_console.steering_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"

[[helm_console.steering_ai.state]]
id = "escape"

  # THE commitment (AC2). The heading was frozen by the host at the instant this
  # transition committed; hazard avoidance may still bend it (AC3), the target
  # may not.
  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "hold_committed_heading"

  # See the Engines copy for why the pressed branch outranks recovery.
  [[helm_console.steering_ai.state.transition]]
  priority = 20
  to = "pressed_pivot"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction) and fact(inside_threat_range) > 0 and fact(separation_progress) < param(pressed_min_progress)"

  [[helm_console.steering_ai.state.transition]]
  priority = 10
  to = "recover"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction)"

  [[helm_console.steering_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(escape_duration_secs)"

# THE recovery leg (issue #788). The THIRD yaw mode verb: neither "track the
# target" nor "fly a frozen heading" but "hold a ring around it". The host reads
# the leg off this verb — never off the state's name — so these states could be
# called anything.
[[helm_console.steering_ai.state]]
id = "recover"

  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "hold_recovery_orbit"

  [[helm_console.steering_ai.state.transition]]
  priority = 0
  to = "reenter"
  when = "fact(shield_fraction) >= param(reentry_shield_fraction) and fact(safe_distance_held) > 0"

# The FOURTH yaw mode verb: track the target like `actuate_desired_facing`, but
# paired host-side with the authored `reengage_speed` throttle instead of the
# approach throttle. That pairing is the whole difference, and it is why this is
# its own verb rather than a reuse.
[[helm_console.steering_ai.state]]
id = "reenter"

  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "pivot_to_reengage"

  [[helm_console.steering_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(reenter_pivot_secs)"

# ── The pressed short-pass loop (issue #789) ──────────────────────────────────
#
# NO fifth yaw verb, and that is the finding rather than a shortcut. The pressed
# pivot is a thrust-cut turn onto the target, which is exactly what
# `pivot_to_reengage` already means — the host pairs it with `reengage_speed`,
# authored at zero — and the short pass is a normal-speed run at a moving
# target, which is exactly what `actuate_desired_facing` already means. What
# makes these states PRESSED is the boost rule on the Boost axis and the shorter
# hysteresis on the way out, not a different way of steering.
[[helm_console.steering_ai.state]]
id = "pressed_pivot"

  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "pivot_to_reengage"

  [[helm_console.steering_ai.state.transition]]
  priority = 0
  to = "pressed_pass"
  when = "state_time >= param(pressed_pivot_secs)"

[[helm_console.steering_ai.state]]
id = "pressed_pass"

  [[helm_console.steering_ai.state.rule]]
  priority = 0
  channel = "yaw"
  when = "true"
  verb = "actuate_desired_facing"

  [[helm_console.steering_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(pressed_closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  [[helm_console.steering_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"

# ── Boost doctrine ────────────────────────────────────────────────────────────
#
# A third independent copy of the same machine. It transitions on the same
# host-seeded facts as the other two, so it reaches `escape` on the same tick —
# by agreeing about the world, not by reading a shared pass state. `acquire` and
# `inbound` author no boost rule at all, so the channel holds and boost stays
# cold for the whole approach.
[helm_console.boost_ai]
initial_state = "acquire"

[helm_console.boost_ai.param]
commit_range = 260.0
closing_rate_epsilon = -0.5
closest_approach_hysteresis = 6.0
escape_duration_secs = 7.0
# How long into the escape leg the boost burns. Shorter than the escape itself,
# so the destroyer coasts the last stretch and the drive is recharging before it
# turns back in.
escape_boost_secs = 4.0
# Do not light the drive from near-standstill (e.g. straight after a collision
# scrub); boost is an escape accelerant, not a launch assist.
boost_min_speed_fraction = 0.3
# ── Shield-recovery thresholds (issue #788) ───────────────────────────────────
# Restated so this axis reaches the same legs from the same facts — it is a
# third independent copy of the machine, not a reader of the other two.
recover_shield_fraction = 0.15
reentry_shield_fraction = 0.75
reenter_pivot_secs = 1.5
# ── Pressed thresholds (issue #789) ───────────────────────────────────────────
pressed_min_progress = 30.0
pressed_pivot_secs = 1.2
pressed_closest_approach_hysteresis = 2.0

[helm_console.boost_ai.memory]
min_range_seen = 1000000.0
escape_heading_rad = 0.0

[[helm_console.boost_ai.state]]
id = "acquire"

  [[helm_console.boost_ai.state.transition]]
  priority = 10
  to = "inbound"
  when = "fact(target_valid) > 0 and fact(range_to_target) <= param(commit_range)"

[[helm_console.boost_ai.state]]
id = "inbound"

  [[helm_console.boost_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  [[helm_console.boost_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"

[[helm_console.boost_ai.state]]
id = "escape"

  [[helm_console.boost_ai.state.rule]]
  priority = 0
  channel = "boost"
  when = "state_time < param(escape_boost_secs) and fact(boost_available) > 0 and fact(speed_fraction) >= param(boost_min_speed_fraction)"
  verb = "engage_boost"

  # See the Engines copy for why the pressed branch outranks recovery. This is a
  # third independent copy of the machine over the same host-seeded facts, so it
  # reaches the same leg on the same tick without reading either sibling.
  [[helm_console.boost_ai.state.transition]]
  priority = 20
  to = "pressed_pivot"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction) and fact(inside_threat_range) > 0 and fact(separation_progress) < param(pressed_min_progress)"

  [[helm_console.boost_ai.state.transition]]
  priority = 10
  to = "recover"
  when = "state_time >= param(escape_duration_secs) and fact(shield_fraction) <= param(recover_shield_fraction)"

  [[helm_console.boost_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(escape_duration_secs)"

# Neither recovery state authors a boost rule at all, so the channel holds and
# the drive stays cold for the whole standoff AND for the pivot — "pivots
# without boost" (AC7) is this absence, plus `ai_helm_boost`'s on-change release
# when the escape's rule stops firing. It also means the drive is recharging
# throughout the orbit, ready for the next escape.
[[helm_console.boost_ai.state]]
id = "recover"

  [[helm_console.boost_ai.state.transition]]
  priority = 0
  to = "reenter"
  when = "fact(shield_fraction) >= param(reentry_shield_fraction) and fact(safe_distance_held) > 0"

[[helm_console.boost_ai.state]]
id = "reenter"

  [[helm_console.boost_ai.state.transition]]
  priority = 0
  to = "acquire"
  when = "state_time >= param(reenter_pivot_secs)"

# ── The pressed short-pass loop (issue #789) ──────────────────────────────────
#
# The ONE state in the whole doctrine that lights the drive for something other
# than running away. Boost multiplies `max_yaw_rate` as well as speed, and this
# pivot is flown on cut thrust, so every drop of it goes into how fast the bow
# comes round — which is the only resource a pinned destroyer is actually short
# of.
[[helm_console.boost_ai.state]]
id = "pressed_pivot"

  # NO `speed_fraction` conjunct, unlike the escape's rule above, and the
  # omission is the point: this pivot is deliberately flown at zero throttle, so
  # the escape's "do not light the drive from a standstill" guard would refuse
  # exactly the case this state exists for. The reason that guard exists —
  # boost as a launch assist is wasted — does not apply when the drive is being
  # spent on yaw rather than on speed.
  [[helm_console.boost_ai.state.rule]]
  priority = 0
  channel = "boost"
  when = "fact(boost_available) > 0"
  verb = "engage_boost"

  [[helm_console.boost_ai.state.transition]]
  priority = 0
  to = "pressed_pass"
  when = "state_time >= param(pressed_pivot_secs)"

# The CANCEL (issue #789, AC4). Like `recover` and `reenter`, this state authors
# no boost rule at all: the channel holds, `ai_helm_boost`'s on-change release
# fires the tick the pivot's rule stops firing, and the short pass runs in at
# normal speed with the drive cold and recharging for the escape at the end of
# it. An absence is exactly the kind of content that gets helpfully filled in,
# so it is pinned by a parse test.
[[helm_console.boost_ai.state]]
id = "pressed_pass"

  [[helm_console.boost_ai.state.transition]]
  priority = 20
  to = "escape"
  when = "fact(target_valid) > 0 and fact(closing_rate) < param(closing_rate_epsilon) and fact(range_above_min_seen) > param(pressed_closest_approach_hysteresis) and memory(min_range_seen) < param(commit_range)"

  [[helm_console.boost_ai.state.transition]]
  priority = 10
  to = "acquire"
  when = "fact(target_valid) < 1"


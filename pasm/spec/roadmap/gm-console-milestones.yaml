entities:
  - component: gm-console-milestone-sequence
    core:
      status: accepted
      confidence: confirmed
      title: GM Console Milestones to Fully-Featured GM Interface
      summary: "The GM console (PRD #930) arrives in three MVP milestones in technical band T2, once the T1 #1093 transport gates land — GM peer tracer, directing, performing — then grows through facilitation assistance and operations/safety (T3) before M6 unifies Live inspection with a standalone Authoring/Test Workshop that retires the HTML editor and model viewer. Information control and in-sim presentation follow M6 in T4; campaign continuity with deep pacing closes in T6, after the T5 host mesh. External show hardware and AI-drafted NPC replies are explicitly not planned, while source-level Rhai debugging is accepted but unscheduled."
      rationale:
        - "Milestone ladder and ordering settled 2026-08-02 in the session that published PRD #930: facilitation assistance is the first post-MVP milestone, then operations and safety before information control, presentation stays in-sim only, and campaign persistence plus pacing heuristics complete the endgame."
        - "The 2026-08-19 Workshop review inserted M6 after Operations and Safety, shifted Information Control, Presentation and Campaign/Pacing to M7-M9, and moved M9 last. The 2026-08-20 track split re-homes the ladder on the technical track — M1-M3 in T2, M4-M5 in T3, M6-M8 in T4, M9 in T6 — deliberately ahead of the T5 multi-ship host mesh; any milestone behaviour needing true multi-ship observation waits on T5. Each post-MVP milestone remains its own PRD only when due."
        - "M1-M5 keep their settled player-facing scope. They must nevertheless use reusable inspector, capability, validation and action components so M6 extends the GM surface instead of replacing another disposable interface."
        - "The transport prerequisites live in T1 PRD #1093, especially #1114, #1116 and #1117; #1118 supplies robust divergence recovery. These supersede #854's PeerJS-specific plan; the T5 host mesh is no longer a gate on the console's start. #900 and #862 still establish the logged-override and snapshot patterns GM work reuses. Live inspection builds on T1's roadmap-debug-observability payload substrate."
        - "[ai] Two issues joined T2 on 2026-09-06 as prerequisites found while validating M1-M3 on the native four-screen rig rather than GM-surface scope of their own: #1405 (the Station console pages' Ultralight raster floor, blocked by the landed #1402) and #1400 (PRD: a deterministic multithreaded sim, whose user story 7 is GM peer digest comparison against a multi-threaded host — a direct M2/M3 concern). Neither changes M1-M3's settled feature scope."
    architecture:
      kind: roadmap-sequence
      authority: non-authoritative
      coordinates:
        - roadmap-deterministic-simulation-foundation
        - roadmap-band-a2-native-network-foundation
        - roadmap-p2p-multiship-delivery
        - gm-milestone-peer-tracer
        - gm-milestone-directing
        - gm-milestone-performing
        - gm-milestone-facilitation-assistance
        - gm-milestone-operations-safety
        - gm-milestone-integrated-workshop
        - gm-milestone-information-control
        - gm-milestone-presentation
        - gm-milestone-campaign-and-pacing

  - component: gm-milestone-peer-tracer
    core:
      status: accepted
      confidence: confirmed
      title: GM Peer Exists (Tracer)
      summary: "Deliver PRD #930 modules 1, 2, and 6 plus a skeletal surface: an equal GM session role with its own ready state, force-start past readiness only, visible paused-snapshot drop-in, privileged Admission, and a browser GM page that joins over the T1 #1093 Phoenix transport as a full deterministic headless-simulation peer. Its complete map shows stable player ships, NPCs, structures, hazards and authored Regions (asteroid fields aggregate as Regions), with a reusable selection/inspector shell; its initial bounded tick-stamped activity feed reuses the unconditional structured damage and destruction balance events. Pause/resume is an explicit attributed SetSessionPaused state command. The GM reads local omniscient projections over the Host Channel; only commands cross lockstep."
      rationale:
        - "A GM-only session running the world end-to-end is the tracer: it proves topology (host-class peer, local omniscient reads), the admission tier, and lobby role in one vertical slice before any directing tools exist."
        - "Exit criteria: a GM-only deterministic session runs the world; a browser GM in a crewed session sees the complete map/feed, pauses/resumes, force-starts, reconnects through a visibly paused snapshot transfer, and puppets an authentic Station interface."
        - "Published slices #1289-#1299 deliver the M1 paths; #1300 is the AFK end-to-end exit validation. Pause #1292 is the first typed GM action tracer, reusing shared action/feedback issues #1274/#1276."
        - "Issue #1299 completes the Station-puppet tracer without cloning a console or widening downstream authority: canonical SetStationPuppet and IssueStationCommand grants carry equal-GM attribution to the payload-aware ordinary System Admission policy, where live Backfill membership and effective-target availability are revalidated in actual action order before the ControlSystem command becomes source-stripped. Applied/No-op/Refused outcomes are persisted with the applied journal; an already-admitted command queue is captured and folded across immediate recovery. Only the selected Backfill Station's AI is suppressed. The local GM projection supplies its exact authored console URL and complete per-ship raw replica (topology, blackboards, pose, absolute live world entities, objectives, waypoint, hull and control state) to the ordinary ClientSimState, radar-region, console-state and action-map paths; its scrollable shell keeps takeover and authentic iframe controls reachable at the standard 1280x720 host viewport. Player.station tenure is never changed, crew SimState names active operators and latest admitted activity, release or last-GM host loss reapplies ordinary Backfill, and surviving equal GMs remain active. Canonical FleetLockstep departure plus the agreed PendingHostLoss boundary durably refuse a departed operator's already-sequenced later takeover and command grants; an action exactly on the still-unapplied boundary preserves action-before-loss ordering, and canonical slot recovery re-admits future work. Canonical membership, outcomes and pending admitted commands are captured, folded and replayed with seeded production evidence."
        - "The Station raw/config boundary reuses the exact complete ShipClientConfig projector used by an ordinary Welcome, so authored Helm/Sensors/Navigation ranges and filters, weapon arcs, hostile-arc colour, tutorials, hull identity and assist gaps cannot drift into a GM-only subset. The authentic iframe's opaque action correlation is preserved on IssueStationCommand. Admission-time refusals settle immediately; an accepted correlated command remains an internal, unprojected Pending fact until its ordinary System consumer reports Applied or Refused. That exact-once terminal fact returns to the same iframe's ordinary feedback lifecycle, including downstream weapon-state refusals."
        - "GM slot recovery advances a canonical generation in the journal. Every grant records its generation, so pre-loss queued work remains durably Refused after loss and rejoin while genuinely post-recovery grants apply; adjacent generations retain deterministic same-boundary ordering, and generation history participates in snapshot, digest and replay."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [roadmap-band-a2-native-network-foundation]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/boot/mod.rs, src/command_admission/policy.rs, src/gm_projection.rs, src/gm_activity.rs, src/gm_puppet.rs, src/gm_action.rs, src/console_bridge.rs, src/core/codec.rs, src/lockstep/host_loss.rs, src/snapshot.rs, src/sim_digest.rs, src/headless/replay.rs, src/server/bridge.rs, src/server_app/broadcast.rs, gui/gm-local-projection.js, gui/gm-activity-feed.js, gui/gm-station-puppet.js, gui/entity-inspector.js, gui/components/ph-navigation-map.js, gui/console-state.js, gui/console-core.js, server.html]
      symbols: [BrowserGameMaster, GmProjectionPlugin, GmEntityProjectionChanged, GmEntityProjectionPayload, GmActivityPlugin, GmActivityFeedPayload, GmStationProjectionChanged, StationPuppets, StationPuppetActivity, SetStationPuppet, IssueStationCommand, wasm_prepare_game_master, createGmLocalProjection, createEntityInspector, PhNavigationMap]
      tests: [src/boot/tests.rs, src/gm_activity_tests.rs, src/gm_puppet.rs, src/gm_action.rs, src/lockstep/host_loss.rs, src/snapshot_tests.rs, src/sim_digest_tests.rs, tests/replay_simulation.rs, tests/client/gm-local-projection.test.js, tests/client/gm-activity-feed.test.js, tests/client/gm-station-puppet.test.js, tests/smoke/gm-page.spec.js]

  - component: gm-milestone-directing
    core:
      status: accepted
      confidence: confirmed
      title: GM Directing
      summary: "Deliver PRD #930 modules 3 and 4 and part of 8: typed attributed idempotent GM commands through the trigger-action pipeline; explicit per-event Fire, persistent manual Pause, and Skip-next controls; manual gm_event Fire tools; map-gesture palette spawn and safe despawn; authored doctrine/directive and Objective controls; reveal/conceal/normal; direct Entity/Station/System damage and healing; System disable/restore; and Station-scoped puppeting of compatible player and NPC ships alongside players. The mission panel, quick actions, dossier, inspectors, validation, and structured result adapters are shared with later M6 rather than exposing raw ECS mutation."
      rationale:
        - "Exit criteria: a GM runs Combat Test end-to-end with event controls, map spawn/despawn, Objective/doctrine/knowledge controls, damage/heal/disable/restore, and compatible player/NPC puppeting, with replay-identical results."
        - "Every new action kind follows the trigger-action extension contract so scenario authors gain the same vocabulary the GM uses."
        - "Published slices #1301-#1314 deliver the directing action families, shared platform issue #1315 delivers configurable confirmation/preview, and #1316 is the AFK Combat Test plus replay exit validation."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-peer-tracer]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: gm-milestone-performing
    core:
      status: accepted
      confidence: confirmed
      title: GM Performing (PRD 930 MVP Complete)
      summary: "Deliver PRD #930 modules 5 and 7 and the rest of 8: a Comms studio for bounded logged free-form send-as-existing-identity messages, authored visibility/recipients, quick templates and scripted hail initiation; per-ship Truth/Crew Knowledge/Difference views over the crew's own contact, Objective, and Comms projections; and reconnectable per-GM role presets that filter the interface but never authority. Role-preset and panel components must also render in M6 Authoring/Test, without adding those later workflows to the MVP."
      rationale:
        - "Exit criteria: a real multi-crew HITL run with at least two equal GMs validates Comms, knowledge comparison, live-switching role presets, simultaneous actions, and reconnect."
        - "Role presets differentiate GM interfaces (filters, quick-action panels, scripts), never permissions — all GMs remain mechanically equal and deterministic Admission ordering resolves simultaneous actions."
        - "Published slices #1317-#1319 deliver Comms, knowledge comparison, and role presets; #1320 is the HITL two-equal-GM live-event exit."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-directing]
      runs_in: [host-browser-runtime]

  - component: gm-milestone-facilitation-assistance
    core:
      status: proposed
      confidence: provisional
      title: GM Facilitation Assistance
      summary: "Advisory attention tooling so one GM can run a large session: a prioritized attention queue (pending comms, eligible beats, idle NPCs, disconnected stations), quiet-time detection, station workload indicators limited to broad states (underused/engaged/overloaded), declarative per-mission GM panels as typed widgets in world TOML extending the role-preset schema, and per-operator attention filtering for multi-GM sessions."
      rationale:
        - "Chosen as the first post-MVP milestone: the MVP gives the GM hands; this gives the GM eyes, which is the binding constraint at real events."
        - "All assistance is advisory, never prescriptive, and avoids false precision — broad workload states only."
        - "Exit criteria: one GM can run a large session without missing important activity."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-performing]
      runs_in: [host-browser-runtime]

  - component: gm-milestone-operations-safety
    core:
      status: proposed
      confidence: provisional
      title: GM Operations and Safety
      summary: "Recoverability for live events: an action log UI over the shared command log, undo for invertible actions (spawn/despawn, faction and doctrine restore) with the UI distinguishing technically from fictionally reversible, checkpoint/bookmark and restore reusing the #862 snapshot machinery, and a peer-health/technical panel (connected peers, station assignments, tick health)."
      rationale:
        - "Sequenced before information control: recoverability protects real events as soon as GMs start running them; false-info drama can wait."
        - "The tick-stamped command log from #849/#854 already carries attribution and replay; this milestone is UI and inverse-action definitions, not new logging infrastructure."
        - "Exit criteria: a live event survives GM mistakes and crashes without stopping the game."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-performing]
      reads: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]

  - component: gm-milestone-integrated-workshop
    core:
      status: proposed
      confidence: confirmed
      title: GM Integrated Workshop and Live Inspector
      summary: "T4 M6, after Operations and Safety, is the first native GM integration. One native simulation instance may carry one fixed player-ship slot alongside local equal GM operator identities, advertise ship plus gm capabilities, and count once for deterministic NPC ownership; browser GM remains GM-only. Unify the GM console, HTML editor and model viewer around shared schema-backed inspectors while keeping two exclusive contexts. Live exists only while connected as a GM peer: it exposes M1-M5 actions plus separately tested safe reconciliation adapters as constrained, attributed, optimistic-concurrency transactions through Operations/Safety; Rhai source is fixed for the run and no arbitrary ECS escape hatch exists. Standalone Workshop switches between Authoring and Test with one chronological undo stack. Native Authoring edits an explicitly selected project root or one mod workspace; Browser Authoring edits exactly one in-memory new/imported/loaded mod pack over read-only base/other-pack dependencies and exports one ZIP. Test validates an unsaved draft, starts a fresh disposable deterministic simulation with every Station on Backfill, and switches between the omniscient GM view and the authentic Viewscreen of any simulated player ship. M6 reaches comment-preserving TOML/Rhai/entity/definition/mod-pack parity, integrates model/rig/marker/variant/LOD preview and native LOD/remesh capability, then deletes the old editor and standalone viewer interfaces while preserving redirecting developer shortcuts."
      rationale:
        - "Live and Workshop never coexist. Leaving Live uses ordinary GM disconnect/reconnect; Workshop is offline and needs no GM credentials or running session. There is no capture-live-state-to-source workflow and no shared undo/draft state across the boundary."
        - "Authoring and Live reuse inspector presentation but not authority: Authoring patches a document-preserving syntax tree and writes only after runtime-equivalent parse/composition/Rhai/reference/mod-pack validation; Live submits named actions or schema-marked safe adapters at agreed ticks. Recreate-required and derived fields remain visible but disabled."
        - "Structured forms are hybrid: runtime-owned descriptors supply types, defaults, validation, source locations and Live mutability, while human-authored panels own grouping and specialised workflows. Unknown fields remain available through a structured/raw fallback without losing comments, ordering or formatting."
        - "Test never hot-patches a running draft. Editing marks the run stale; restart-from-draft creates a clean simulation. It provides deterministic restart, pause/step/accelerate, host-call/flag/callback traces, scenario-state breakpoints and role-preset preview. Source-level Rhai stepping/locals remain unscheduled."
        - "Browser Workshop never receives project filesystem authority. A loaded pack is retained as its exact immutable source bundle and may be cloned after normal Live disconnect; runtime state and GM interventions are never reconstructed into files. Imported Rhai remains inside the ordinary deterministic budgeted sandbox with no DOM, network, filesystem or Workshop APIs."
        - "Model and rig editing is Authoring/Test-only. Browser Workshop can import pack assets, edit rig/marker/variant/LOD metadata and preview/export them, but full external LOD/remesh generation is native-only. The old viewer's fast launch command becomes a deep link into Workshop Model authoring."
        - "The Workshop uses the shared Accessibility profile from first delivery: keyboard/mouse parity, visible focus, non-colour validation/dirty/mode cues, structured alternatives to canvases and Test controls usable without animation/audio. Browser and native surfaces share one JS/HTML UI over explicit capability providers."
        - "Exit criteria are one golden native/browser workflow covering comment-preserving scenario/entity/Rhai/model authoring, role presets, disposable Backfill Test with GM/ship viewscreens, validated save/mod export, constrained Live inspection, crash-draft recovery and deletion of the superseded interfaces."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-operations-safety, roadmap-mod-content-packs, roadmap-scenario-scripting, native-delivery-host]
      reads: [world-snapshot-artifact]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime, node-tooling-runtime]

  - component: gm-milestone-information-control
    core:
      status: proposed
      confidence: provisional
      title: GM Information Control
      summary: "False-information injection through the radar-projection seam: misclassification, ghost contacts, and degraded or delayed intel, extending the knowledge model (truth, sensed, interpreted, presented) that the directing milestone's reveal/conceal deliberately left simple."
      rationale:
        - "Deferred out of the MVP by explicit PRD #930 decision so the radar-projection seam is extended deliberately rather than under MVP pressure."
        - "Exit criteria: a GM can control what a crew believes, not just what it can detect."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: gm-milestone-presentation
    core:
      status: proposed
      confidence: provisional
      title: GM In-Sim Presentation Control
      summary: "GM cue control of the shared host display: forcing viewscreen modes, incoming-communication takeover, title cards, and sound cues, all issued through the same dispatch path as mission actions so scenarios can author the same cues. Strictly in-sim; no external hardware."
      rationale:
        - "Settled 2026-08-02: in-sim presentation survives as its own milestone because the viewscreen is already the shared host display, so cue control is cheap drama with no hardware dependency."
        - "External show hardware (DMX, Hue, OBS, OSC) is explicitly not planned; the cue/event path should simply not preclude a future integration."
        - "Exit criteria: a GM can stage scene transitions and reveals on the viewscreen."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-information-control]
      runs_in: [host-browser-runtime]

  - component: gm-milestone-campaign-and-pacing
    core:
      status: proposed
      confidence: provisional
      title: GM Campaign Continuity and Deep Pacing
      summary: "The endgame pair: campaign persistence (ship, crew, and scenario state carried across sessions on the snapshot and save-load machinery) and the deeper pacing-heuristics tier (pressure dimensions, beat-stacking warnings, suggestions of authored actions during lulls — advisory only)."
      rationale:
        - "Both were explicitly kept in the fully-featured end state on 2026-08-02, while AI-drafted NPC replies were explicitly excluded."
        - "Pacing heuristics build on the facilitation-assistance milestone's attention queue; campaign persistence builds on #848's adapters and the campaign-continuity projection (#867)."
        - "Exit criteria: multi-session campaigns with GM continuity."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [gm-milestone-presentation, gm-milestone-facilitation-assistance, roadmap-authoritative-snapshots]
      reads: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]

  - component: gm-unscheduled-rhai-source-debugger
    core:
      status: proposed
      confidence: confirmed
      title: Source-Level Rhai Debugger — Planned but Unscheduled
      summary: "Extend M6 Test with source-level Rhai stepping, breakpoints inside expressions and inspection of local variables/stack frames. M6 itself stops at compile/runtime source diagnostics, host-call/flag/callback traces, scenario-state breakpoints and deterministic simulation stepping."
      rationale:
        - "Accepted during the 2026-08-19 Workshop design review, but deliberately excluded from M6 because instrumenting Rhai execution is a distinct debugging-runtime project rather than a requirement for replacing the existing editor."
    architecture:
      kind: roadmap-milestone
      authority: non-authoritative
      coordinates: [gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]

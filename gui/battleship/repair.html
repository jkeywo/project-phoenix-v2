<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.repair.doc_title">Project Phoenix - Repair Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; overflow-y: auto; }
    ph-hull-integrity { flex-shrink: 0; }
    ph-station-damage { align-self: flex-start; }
    /* issue #1425: at the tightest supported geometry (the 320px-tall native
       split-pane floor at 200% text) the hull bar, Core damage bar and the
       Field Repair dispatch panel below (all fixed/auto height) can already
       exceed the console's height, and a bare `min-height: 0` lets flexbox
       award this element the ENTIRE deficit — the roster silently renders at
       zero height rather than merely shrinking, with nothing left to scroll
       to. A floor sized to roughly one team-card summary keeps it genuinely
       present; `.console-body`'s own `overflow-y: auto` above then absorbs
       any remaining overflow by scrolling. See the matching fix and longer
       rationale on gui/destroyer/engineering.html's copy of this rule. */
    ph-repair-teams { flex: 1; min-height: 88px; }
    /* External repair-team dispatch (issue #1161). Shown only on a hull that
       authors `[repair.external_dispatch]`. */
    .dispatch-panel { flex-shrink: 0; border-top: 1px solid var(--edge); padding-top: 8px; }
    .dispatch-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; }
    /* issue #1425: `flex-wrap: wrap` — see the matching comment on
       gui/destroyer/helm.html's .dock-row. This row's own button can consume
       its full width at 200% text on a narrow pane, and the status span
       needs to drop to its own line rather than be squeezed to zero width. */
    .dispatch-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .dispatch-btn { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.14em; padding: 6px 14px; background: rgba(var(--rgb-panel), 0.8); color: var(--ink); border: 1px solid var(--edge); cursor: pointer; min-height: var(--control-hit-min); }
    .dispatch-btn.working { background: var(--loaded); color: var(--surface-void); border-color: var(--loaded); }
    /* issue #1425: this row is `display: flex` and a flex item's default
       min-width is `auto`, not `0` — a long external_dispatch target_name (a
       world entity name id, unbounded length) pushed the status text past the
       button instead of wrapping. Matches the fix gui/cruiser/helm.html's
       dock-status already carries for the same class of value, and mirrors
       the equivalent fix on gui/destroyer/engineering.html's own dispatch
       panel, which reuses its Tractor row's class (issue #1425). */
    .dispatch-status { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    .dispatch-refusal { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--reloading); margin-top: 6px; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Repair Console" data-i18n-attr="data-screen-label:console.repair.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The active/total team
           count the footer carried heads the maintenance group it belongs to. -->
      <div class="console-body">
        <div class="readout">
          <span id="footer-right">—</span>
          <span class="spacer"></span>
          <span class="auto-badge" id="repair-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
        </div>
        <ph-hull-integrity id="hull-integrity"></ph-hull-integrity>
        <ph-station-damage id="core-damage" label="Core" data-i18n-attr="label:console.repair.core"></ph-station-damage>
        <ph-repair-teams id="repair-teams"></ph-repair-teams>
        <!-- External repair-team dispatch (issue #1161): shown only on a hull
             that authors `[repair.external_dispatch]`, so a hull without one is
             unchanged. The one button dispatches a team to the ship's designated
             target and recalls it. -->
        <div class="dispatch-panel" id="dispatch-panel" hidden>
          <h2 data-i18n="console.repair.dispatch">Field Repair</h2>
          <div class="dispatch-row">
            <button id="dispatch-btn" class="dispatch-btn" data-i18n="console.repair.dispatch.send">Dispatch</button>
            <span id="dispatch-status" class="dispatch-status">—</span>
          </div>
          <div id="dispatch-refusal" class="dispatch-refusal" hidden></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-hull-integrity.js';
    import '../components/ph-station-damage.js';
    import '../components/ph-repair-teams.js';
    import { initConsole } from '../console-core.js';
    import {
      EXTERNAL_REPAIR_TOGGLE_ACTION_ID,
    } from '../stations/engineering-actions.js';
    import { activateEngineeringAction } from '../stations/engineering-action-control.js';
    // The render lives in gui/battleship/repair.console.js (issue #1235): one
    // shared Repair renderer, this hull's variant. The vitest suite imports the
    // same `renderStation`. `s` is a flat RepairConsolePayload.
    import { renderStation } from './repair.console.js';

    var consoleHandle = initConsole({ name: 'repair', render: renderStation });

    // The one dispatch button toggles dispatch/recall through the action map,
    // which sends the same admitted command a repair AI would (issue #1161).
    // "Which one" is read off the button's own `.working` class —
    // renderStation sets it fresh on every push, so it is never stale.
    document.getElementById('dispatch-btn').addEventListener('click', function() {
      var working = document.getElementById('dispatch-btn').classList.contains('working');
      activateEngineeringAction(
        consoleHandle,
        EXTERNAL_REPAIR_TOGGLE_ACTION_ID,
        null,
        working ? 'recall_external_repair' : 'dispatch_external_repair',
      );
    });
  </script>
</body>
</html>

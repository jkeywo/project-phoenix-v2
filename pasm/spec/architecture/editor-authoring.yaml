entities:
  - component: editor-mode-shell
    core:
      status: implemented
      confidence: confirmed
      title: Editor Mode Shell
      summary: Separate browser-local authoring shell with World, Entity, and Definitions modes, per-file dirty tracking, and undo/redo history.
    architecture:
      kind: authoring-interface
      authority: local
      owns: [editor-draft-state]
      produces: [editor-draft-state]
      depends_on: [editor-file-system-boundary, editor-model-marker-inspector, editor-runtime-reload-boundary]
    implementation:
      status: declared
      paths: [editor.html, editor/app-v2.js, editor/mode-shell.js, editor/undo-controller.js]
      tests: [npm run test:editor]

  - state: editor-draft-state
    core:
      status: implemented
      confidence: confirmed
      title: Editor Draft State
      summary: Browser-local unsaved world, entity, faction, and complexity edits. It does not mutate authoritative game state or communicate through the game wire protocol.
    architecture:
      classification: local
      owner: editor-mode-shell
      writers: [editor-mode-shell]
    implementation:
      status: declared
      paths: [editor/mode-shell.js, editor/undo-stack.js]

  - component: editor-file-system-boundary
    core:
      status: implemented
      confidence: confirmed
      title: Editor File System Boundary
      summary: Chromium File System Access boundary that obtains a user-granted project directory handle, persists it in IndexedDB, and reads or writes only within that selected root.
    architecture:
      kind: local-storage-boundary
      authority: local
      reads: [editor-draft-state]
      persists: [editor-draft-state]
    implementation:
      status: declared
      paths: [editor/project-root.js, editor/save-flow.js]
      tests: [npm run test:editor]

  - component: editor-validation-service
    core:
      status: implemented
      confidence: confirmed
      title: Editor Validation Service
      summary: Runs local TOML, component, station, trigger-action, reference, and behavior checks and surfaces inline errors and warnings. The save gate blocks definite errors while keeping warnings non-blocking.
    architecture:
      kind: authoring-validator
      authority: local
      owns: [editor-validation-state]
      reads: [editor-draft-state]
      produces: [editor-validation-state]
    implementation:
      status: declared
      paths: [editor/validation.js, editor/world-references.js, editor/world-references-indexed.js, editor/validation-badge.js]
      tests: [npm run test:editor]

  - component: editor-save-admission
    core:
      status: implemented
      confidence: confirmed
      title: Editor Save Admission
      summary: Local save gate that prevents writing authored TOML when validation reports definite errors, while allowing warnings and clearly presenting them to the author.
    architecture:
      kind: authoring-validator
      authority: local
      reads: [editor-draft-state, editor-validation-state]
      validates: [editor-draft-state]
    implementation:
      status: declared
      paths: [editor/save-flow.js, editor/validation.js]
      tests: [npm run test:editor]

  - component: editor-mod-pack-exporter
    core:
      status: implemented
      confidence: confirmed
      title: Editor Mod Pack Exporter
      summary: Builds a TOML-only ZIP and required manifest from selected validated authored files for use by a server-page mod upload.
    architecture:
      kind: authoring-exporter
      authority: local
      reads: [editor-draft-state, editor-validation-state]
      # Reuses the save-admission primitive (partitionFindings) at the export
      # chokepoint. That primitive lives in editor/validation.js, a file
      # co-owned by the validation service, admission gate, and validation
      # state, so the edge is not attributable to a single unambiguous file —
      # classified may_depend_on rather than a direct observable depends_on.
      may_depend_on: [editor-save-admission]
    implementation:
      status: confirmed
      paths:
        - editor/mod-pack-export.js
        - editor/tests/mod-pack-export.test.js
      tests: [npm run test:editor]
    evidence:
      - kind: test
        reference: AC1 archive contains only allowed paths plus the required manifest
        summary: The exported store-only ZIP carries only whitelisted authored TOML paths and always includes the generated scenarios.toml manifest.
      - kind: test
        reference: AC3 a definite authoring error blocks the export
        summary: A file with error-severity findings refuses the whole export through the same partitionFindings admission gate a save uses.
      - kind: test
        reference: AC3 warnings do NOT block the export and are surfaced
        summary: Warning-severity findings pass through and are reported, never blocking the export.
      - kind: test
        reference: AC2 manifest root-world validated against selected content — missing world blocks
        summary: A manifest root world absent from the selected files is a blocking finding, mirroring validate_manifest's resolve_world semantics.
      - kind: test
        reference: AC5 the produced archive is a parseable store-only ZIP whose manifest re-parses
        summary: The hand-rolled store-only ZIP round-trips and its manifest re-parses through the shared content-pack schema.

  - component: host-mod-pack-upload
    core:
      status: implemented
      confidence: confirmed
      title: Host Mod Pack Upload
      summary: Server-page pre-scenario control that accepts one TOML-only ZIP with its required scenario manifest for the next selection session and presents validation failures without starting a round.
    architecture:
      kind: host-content-input
      authority: authoritative
      owns: [uploaded-mod-pack-state]
      produces: [uploaded-mod-pack-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: confirmed
      paths:
        - server.html
        - src/server/bridge.rs
      tests: [cargo test]
    evidence:
      - kind: code
        reference: pre-scenario upload control gated to the scenario stage
        summary: server.html adds a file input + button inside #scenario-panel and ignores any pick once _worldLoadStarted latches, so an in-progress round is never affected.
      - kind: code
        reference: wasm_validate_mod_pack bridges the upload to atomic validation
        summary: The button reads the ZIP bytes and calls the wasm_validate_mod_pack export, which validates atomically and installs the session overlay only on acceptance.

  - state: uploaded-mod-pack-state
    core:
      status: implemented
      confidence: confirmed
      title: Uploaded Mod Pack State
      summary: Host-session-scoped uploaded archive, required scenario manifest, and parsed candidate files, discarded when the host session ends and never applied to an in-progress round.
    architecture:
      classification: authoritative
      owner: host-mod-pack-upload
      writers: [host-mod-pack-upload]
    implementation:
      status: confirmed
      paths:
        - src/entities/config_cache.rs
      # No struct owns this: UPLOADED_PACK_TOML / MOD_MANIFEST_TOML are raw
      # `thread_local!` statics (a HashMap<String, String> and an
      # Option<String>), installed by set_mod_pack_overlay and read by
      # mod_pack_overlay_get. Residual granularity honestly recorded — there
      # is no typed carrier to name here.
      symbols: [set_mod_pack_overlay, clear_mod_pack_overlay, mod_pack_overlay_get]
      tests: [cargo test]

  - component: mod-content-overlay-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Mod Content Overlay Resolver
      summary: Validates a TOML-only uploaded archive and required manifest against supported authored paths, composes exact-path replacements and additions over base content, and rejects the entire pack on invalid archive, manifest, path, parse, or reference failure.
    architecture:
      kind: content-composer
      authority: authoritative
      owns: [composed-world-content-pack-state]
      reads: [uploaded-mod-pack-state, world-content-pack-state]
      produces: [composed-world-content-pack-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: confirmed
      paths:
        - src/world/mod_pack.rs
        - src/entities/config_cache.rs
      tests: [cargo test]
    evidence:
      - kind: test
        reference: valid_pack_is_accepted / corrupt_archive_rejects_whole_pack
        summary: validate_mod_pack accepts a well-formed pack and rejects a malformed archive, missing manifest, off-whitelist path, unparseable TOML, or unresolved composition reference — nothing is applied on any failure (AC1).
      - kind: test
        reference: store_zip_round_trips / store_zip_rejects_non_store_method / store_zip_rejects_crc_mismatch
        summary: The hand-rolled store-only ZIP reader mirrors editor/mod-pack-export.js — it round-trips real archive bytes and rejects non-store method and CRC mismatch.
      - kind: test
        reference: mod_pack_overlay_returns_pack_content_for_overridden_path
        summary: Both content channels consult the exact-path overlay first (pack content wins) and fall through to the normal fetch for non-overridden paths (AC2).

  - state: composed-world-content-pack-state
    core:
      status: implemented
      confidence: confirmed
      title: Composed World Content Pack State
      summary: Fully validated base-plus-mod authored TOML view used only for the next selected scenario and its dependent entities, factions, and definitions.
    architecture:
      classification: authoritative
      owner: mod-content-overlay-resolver
      writers: [mod-content-overlay-resolver]
    implementation:
      status: confirmed
      paths:
        - src/entities/config_cache.rs
      # Also no dedicated storage type: the composed view is produced on
      # every read by mod_pack_overlay_get layering the session overlay over
      # the normal fetch path, never materialised as its own struct.
      symbols: [mod_pack_overlay_get]
      tests: [cargo test]

  - component: mod-aware-scenario-catalog
    core:
      status: implemented
      confidence: confirmed
      title: Mod-Aware Scenario Catalog
      summary: Extends the pre-scenario catalog with only the root worlds explicitly named by the validated mod manifest, alongside regular scenarios declared by assets/scenarios.toml.
    architecture:
      kind: content-catalog
      authority: authoritative
      reads: [composed-world-content-pack-state, scenario-ship-catalog-state, world-content-pack-state]
      produces: [scenario-ship-catalog-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: confirmed
      paths:
        - src/world/manifest.rs
        - src/server/bridge.rs
      tests: [cargo test]
    evidence:
      - kind: test
        reference: merged_catalog_contains_only_manifest_listed_scenarios
        summary: build_merged_catalog merges the base manifest with a validated mod manifest; an overlay world named by no manifest never becomes selectable (AC3).
      - kind: test
        reference: merged_catalog_mod_entry_replaces_base_id
        summary: A mod scenario whose id matches a base scenario replaces it in place, matching the overlay's add-or-replace contract.

  - state: editor-validation-state
    core:
      status: implemented
      confidence: confirmed
      title: Editor Validation State
      summary: Local source-oriented validation records for the editor UI. Runtime parser validation remains a separate host-authoritative concern.
    architecture:
      classification: local
      owner: editor-validation-service
      writers: [editor-validation-service]
    implementation:
      status: declared
      paths: [editor/validation.js, editor/validation-badge.js, editor/marker-validate.js]

  - component: editor-model-marker-inspector
    core:
      status: implemented
      confidence: confirmed
      title: Editor Model and Marker Inspector
      summary: Local Models and Entity previews inspect model-rig sidecars, extents, marker points, entity shapes, and component configuration for authored templates, and resolve every authored marker reference against the selected rig before an attachment is created or saved.
    architecture:
      kind: authoring-inspector
      authority: local
      reads: [editor-draft-state]
      produces: [editor-validation-state]
      depends_on: [editor-runtime-reload-boundary]
    implementation:
      status: confirmed
      paths:
        - editor/models-rig.js
        - editor/models-mode-view.js
        - editor/marker-validate.js
        - editor/entity-preview.js
        - editor/entity-preview-view.js
      tests: [npm run test:editor]
    evidence:
      - kind: test
        reference: reports an unresolved marker when a rig index is supplied
        summary: The entity-side marker field resolves cross-file against the rig its mesh selects and reports an unresolved name as an error.
      - kind: test
        reference: blocks an entity save whose marker does not resolve
        summary: An unresolved marker blocks the save through the shared admission gate, so no invalid attachment is written to disk.
      - kind: test
        reference: blocks a Models-mode save whose sidecar redeclares a marker
        summary: Models Mode no longer bypasses validation; a duplicate marker declaration refuses the write.
      - kind: test
        reference: accepts the entity save after the marker is added to the rig IN THE SAME SESSION
        summary: A marker added in Models Mode is visible to the very next entity save, so the cross-file check cannot refuse a legitimate write until the editor is reloaded.
      - kind: test
        reference: a gate-blocked "Save as new variant" does not register the variant
        summary: A rig write the gate refuses is reported as a failure rather than being adopted as a saved variant.

  - component: editor-runtime-reload-boundary
    core:
      status: implemented
      confidence: confirmed
      title: Editor Runtime Reload Boundary
      summary: Saves authored TOML and locally invalidates editor caches, but does not hot-reload an already-running host simulation; a new runtime load consumes the saved authored files.
    architecture:
      kind: authoring-lifecycle
      authority: local
      reads: [editor-draft-state]
      coordinates: [entity-template-cache, world-file-parser]
      depends_on: [editor-file-system-boundary]
    implementation:
      status: declared
      paths: [editor/save-flow.js, editor/invalidation-bus.js, editor/entity-cache.js]
      tests: [npm run test:editor]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Prevent the entry HTML from being cached so users always pick up the
       latest Trunk-hashed JS/WASM filenames after a deploy. The hashed
       assets themselves remain cacheable forever via their content hash. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Which build is this? (issue #940.) The client is pure JS — no WASM to
       bake a flag into, and scripts/build-client.mjs is a deterministic file
       copy with no compile step — so the meta tag IS the answer here, unlike
       server.html where it only covers the WASM boot window. deploy-demo.yml
       flips it to "true" and fails the run if the rewrite did not land.
       gui/build-flags.js resolves it; the settings cog hides its Debug/Cheat
       tab when it is true. -->
  <meta name="phoenix-build-demo" content="false" />
  <!-- This bundle's delivery stamp, `<protocol>/<content_id>/<content_epoch>`
       (issue #1111) — the same field a native host reads off the
       `x-phoenix-client-stamp` header. scripts/build-client.mjs writes it at
       build time, because a pure-JS page has no WASM to compile a version
       into. The phone declares it over the Phoenix join handshake and the host
       answers with `delivery::check_join_stamp`. Since #1112 that check
       REQUIRES the field: an un-built checkout leaves it empty and a host
       refuses the join with `client-stamp-missing` rather than admitting it,
       because every client that can reach a Phoenix host is a built bundle. -->
  <meta name="phoenix-client-stamp" content="4/phoenix-base/1" />
  <title data-i18n="client.doc_title">Project Phoenix — Console</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
<!-- The shared design vocabulary (PRD #1023 module 1): colours, edges, ink,
     accents, space, the type ramp and its legibility floor, and the control
     sizes. Defined once and consumed by this page, the host viewscreen, and
     every console document (which reaches it through gui/console.css). -->
<link rel="stylesheet" href="gui/tokens.css" />
<link rel="stylesheet" href="gui/game-over.css" />
  <!-- Keep rAF-driven UI (scheduleRender, radar sweeps, joystick decay in
       the console iframes) running at full rate even when this tab loses
       focus — see gui/bg-raf-keepalive.js. Must load before any other
       script calls requestAnimationFrame. -->
  <script src="gui/bg-raf-keepalive.js"></script>
  <!-- No transport CDN tag: issue #1112 retired PeerJS and its public broker.
       The crew transport is gui/rendezvous-transport.js, loaded as a module
       island below alongside the join-code table it needs. -->
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Loads assets/strings/strings.csv before anything renders. Its top-level
       await blocks every module that imports gui/strings.js, so t() is ready
       by the time the lobby paints. Keep this first. -->
  <script type="module" src="gui/strings-boot.js"></script>
  <!-- Pure-function helpers shared with Vitest unit tests (issues #439, #440, #827). -->
  <script type="module" src="gui/phase-toggle.js"></script>
  <script type="module" src="gui/console-resolver.js"></script>
  <!-- Extracted shell modules (issue #827): mount plan (station id → DOM ids
       + iframe URLs), section switching, the lobby roster fold, the pure
       per-message router, the lobby view model, and the generic Coordination
       presentation renderer. -->
  <script type="module" src="gui/mount-plan.js"></script>
  <script type="module" src="gui/content-switcher.js"></script>
  <script type="module" src="gui/console-mount.js"></script>
  <script type="module" src="gui/hero-bar.js"></script>
  <script type="module" src="gui/station-roster.js"></script>
  <script type="module" src="gui/client-router.js"></script>
  <script type="module" src="gui/lobby-view.js"></script>
  <!-- The lobby's DOM writer (issue #1369). Pairs with gui/lobby-view.js the
       way gui/host-lobby-render.js pairs with gui/host-lobby-view.js: the view
       model decides, this writes, and the page keeps only the state the
       controls mutate. -->
  <script type="module" src="gui/client-lobby-render.js"></script>
  <!-- Crew-public Spectator summary surface (issue #1105). Depends on
       gui/hero-bar.js for the shared health/importance classifiers. -->
  <script type="module" src="gui/spectator-view.js"></script>
  <!-- Onboarding/session-flow state (PRD #1023 module 4): the in-flight
       scenario/ship pick, the game-over frame, and whether a console's link is
       live, still loading or dead. All three are pure rules the inline script
       renders; none of them touch the DOM themselves. -->
  <script type="module" src="gui/scenario-pick.js"></script>
  <script type="module" src="gui/game-over-view.js"></script>
  <script type="module" src="gui/link-state.js"></script>
  <!-- The ONE decision behind every full-screen surface that can precede play —
       the preload overlay, the scenario picker, the waiting overlay and the
       join field (issue #1359). Before it, the only thing stopping two of them
       showing contradictory things at once was their z-index order. -->
  <script type="module" src="gui/pre-play-view.js"></script>
  <!-- The DOM half of that decision's loading projection (issue #1368). Pairs
       with `loadingView()` in gui/pre-play-view.js the way
       gui/client-lobby-render.js pairs with gui/lobby-view.js. -->
  <script type="module" src="gui/loading-render.js"></script>
  <script type="module" src="gui/coordination-popup.js"></script>
  <!-- The Station Bar's per-system damage popup (issue #1374): the pure
       "what does it say" half, plus the row-drawing component the retired
       console footers used, now mounted once here instead of 22 times. -->
  <script type="module" src="gui/components/ph-damage-detail.js"></script>
  <script type="module" src="gui/station-damage-popup.js"></script>
  <!-- Per-tab session identity (issue: multiple clients on one desktop).
       localStorage is shared across all tabs of an origin, so every console
       tab read the same session-token and the host collapsed them onto one
       player. installSessionToken() gives each tab its own token. -->
  <script type="module" src="gui/session-token.js"></script>
  <script type="module" src="gui/iframe-bridge.js"></script>
  <!-- Key events reach only the focused document and never cross into an
       iframe, so console keybinds died whenever the last click landed on host
       chrome. Relays them to the active console (see gui/key-relay.js). -->
  <script type="module" src="gui/key-relay.js"></script>
  <script type="module" src="gui/console-state.js"></script>
  <!-- Semantic dirty-console routing (issues #823 / #1260): handleMessage()
       merges reducer results, then fans iframe pushes out through
       window.dirtyConsolesFor instead of per-message console wrappers. -->
  <script type="module" src="gui/dirty-consoles.js"></script>
  <!-- Console input-to-feedback measurement (issue #1169, PRD #1144): this
       phone's own round-trip clock. Publishes window.ConsoleLatencyMeter for
       the inline glue below, which stamps each dispatch and resolves it when
       the issuing console's surface is next handed fresh state — both stamps on
       THIS device, so no cross-clock arithmetic is involved. -->
  <script type="module" src="gui/console-latency.js"></script>
  <!-- Correlated Pressed/Pending/Applied-or-refused presentation.  This owns
       only client-local lifecycle state and exact iframe routing; the normal
       Captain blackboard remains the sole Red Alert gameplay state. -->
  <script type="module" src="gui/action-feedback.js"></script>
  <script type="module" src="gui/action-map.js"></script>
  <!-- One explicitly selected standard gamepad is sampled in this parent
       realm. Logical bindings are copied to console iframes, but only the
       action's owning iframe receives semantic activation. -->
  <script type="module" src="gui/gamepad-input.js"></script>
  <script type="module" src="gui/gamepad-presentation.js"></script>
  <script type="module" src="gui/composite-action-routing.js"></script>
  <!-- Parent-realm semantic action metadata + live private binding profile. The
       active console iframe owns its own registry instance and receives this
       profile through an explicit update seam. -->
  <script type="module" src="gui/stations/captain-actions.js"></script>
  <script type="module" src="gui/stations/helm-actions.js"></script>
  <script type="module" src="gui/client-semantic-actions.js"></script>
  <!-- Pure JS client-state modules (issue #460). Each exposes a singleton
       (window.lobbyState / simState / commsState) with an apply(serverMessage)
       method returning a fresh semantic result; handleMessage() feeds every
       inbound message through them, replacing the deleted Bevy message drain. -->
  <script type="module" src="gui/lobby-state.js"></script>
  <script type="module" src="gui/sim-state.js"></script>
  <!-- Contextual tutorials (issue #916): trigger evaluation + client-local
       progress. Script-tag order does NOT matter: the module imports the
       sim-state singleton directly and hydrates simState.tutorialProgress
       from localStorage in the module graph (it is in fact already evaluated
       by the console-state.js tag above; this tag documents the dependency
       and defines window.applyTutorialAction for the inline script). -->
  <script type="module" src="gui/tutorial-state.js"></script>
  <script type="module" src="gui/comms-state.js"></script>
  <!-- ICE/TURN server list, relay probe and the connect/backoff schedules the
       transport is tuned by (issues #603, #1226). -->
  <script type="module" src="gui/connection-manager.js"></script>
  <!-- Typed join codes and the Phoenix crew transport (issues
       #1111/#1112). THE route: every join goes through the rendezvous service,
       whether the code was typed, pasted or opened from a QR link. -->
  <script type="module" src="gui/join-code.js"></script>
  <script type="module" src="gui/rendezvous-transport.js"></script>
  <!-- Which transport rung(s) this load may use, and what the #conn-diag
       readout says about the one it ended up on (issue #1113). Both publish
       onto window for the classic script below. -->
  <script type="module" src="gui/transport-levers.js"></script>
  <script type="module" src="gui/connection-diagnostics.js"></script>
  <!-- Settings panel: client controls plus Station Help and Ship Manual. -->
  <script type="module" src="gui/settings-panel.js"></script>
  <!-- Private per-player Accessibility profile (issue #1102): presentation
       effects + inert assistance schema. Hydrates simState.accessibilityProfile
       from localStorage in the module graph and defines
       window.applyAccessibilityProfile / setAccessibilityPresentation for the
       inline script below. Never sent to the host — client-local. -->
  <script type="module" src="gui/accessibility-profile.js"></script>
  <!-- One portable, private profile now owns Accessibility, semantic bindings,
       gamepad preference/tuning, feedback preferences and future GM
       confirmations. It never enters a ClientMessage or a session save. -->
  <script type="module" src="gui/operator-profile.js"></script>
  <!-- Projects that one unchanged profile onto the APIs this browser or native
       pane actually has. Capability loss suppresses an output, never a saved
       portable choice. -->
  <script type="module" src="gui/operator-surface-adapter.js"></script>
  <style>
    /* The lobby's vocabulary is gui/tokens.css, linked above — it used to keep
       a parallel `:root` here whose `--edge` was a different colour from the
       consoles' and whose `--dim` sat below the contrast floor. Retired into
       the shared ramp; tests/client/console-tokens.test.js keeps it retired. */
    html, body { margin: 0; padding: 0; background: var(--surface-abyss); color: var(--ink); font-family: monospace; }
    body { box-sizing: border-box; }
    label { display: block; margin-bottom: 0.5rem; font-size: var(--text-md); }
    input[type="text"] { display: block; width: 100%; box-sizing: border-box;
      background: var(--surface-panel); color: var(--ink); border: 1px solid var(--edge); padding: 0.5rem; margin-top: 0.25rem; }
    button { display: block; width: 100%; background: var(--surface-lift); color: var(--ink);
      border: 1px solid var(--edge); padding: 0.75rem; margin: 0.4rem 0; cursor: pointer;
      font-family: monospace; font-size: var(--text-lg); text-align: left; min-height: var(--control-hit-min); }
    button:active { background: var(--surface-ridge); }
    button:disabled { opacity: 0.4; cursor: default; }
    button.mine { border-color: var(--sky); color: var(--sky); }
    /* Status line: bottom-left, above canvas. z-index 25 keeps it above the
       phone bezel (15) so connection status isn't obscured by the corner. */
    #status { position: fixed; bottom: 0.5rem; left: 0.75rem; color: var(--edge-bright); font-size: var(--text-sm); z-index: 25; }
    /* Connection diagnostics readout: sits above #status, same corner. Shows
       relay reachability + per-attempt ICE stage so a phone user can report
       why a connection is stuck without opening devtools. */
    /* Readout and its copy control share ONE left-anchored fixed row, sized to
       its contents. The button used to be pinned to the opposite corner "so it
       never overlaps a readout that has grown to several lines" — which solved
       the harmless overlap and created a real one: bottom-right is where the
       lobby footer puts #ready-btn, so a fixed button at z-index 26 sat on top
       of the primary control of the whole screen and swallowed the tap. Four
       smoke specs could not press READY, and neither could a player.
       Bottom-LEFT is already this page's chrome corner (#status lives there),
       and a row that ends where its content ends cannot reach the far side. */
    #conn-diag-row { position: fixed; bottom: 1.6rem; left: 0.75rem; z-index: 25;
      display: flex; align-items: flex-end; gap: 0.5rem; max-width: 85vw;
      pointer-events: none; }
    #conn-diag { color: var(--edge-strong);
      font-size: var(--text-xs); white-space: pre-line; }
    /* Only the button takes pointer events back — the readout beside it is
       text, and a transparent div over the lobby would swallow taps for
       nothing. */
    #conn-diag-copy { pointer-events: auto; flex: 0 0 auto;
      font-size: var(--text-xs); color: var(--edge-strong); background: transparent;
      border: 1px solid var(--edge-strong); border-radius: 3px; padding: 0.1rem 0.4rem; }
    #gamepad-input-alert, #native-operator-profile-error { position: fixed; left: 50%; bottom: 3.5rem;
      transform: translateX(-50%); z-index: 26; max-width: min(32rem, 88vw);
      padding: 0.55rem 0.75rem; border: 1px solid var(--warning);
      border-radius: 3px; background: var(--surface-panel); color: var(--warning);
      font-family: 'JetBrains Mono', monospace; font-size: var(--text-sm);
      line-height: 1.35; text-align: center; }
    #gamepad-input-alert[hidden] { display: none; }
    #native-operator-profile-error { bottom: 6.5rem; }
    #native-operator-profile-error[hidden] { display: none; }
    /* Typed join entry (issue #1111). Shown only when this page was opened
       with no host in its fragment — the case that until now was a dead end
       reading "no host id in URL". The field takes either the code
       read off the viewscreen or a whole pasted PROJECT_VERSION_CODE. */
    #join-entry { position: fixed; inset: 0; z-index: 30; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
      background: var(--surface-abyss); padding: 1.5rem; text-align: center; }
    #join-entry.open { display: flex; }
    #join-entry-title { font-size: var(--text-lg); color: var(--ink); }
    #join-code-input { width: min(14ch, 80vw); padding: 0.6rem 0.4rem; text-align: center;
      font-family: monospace; font-size: var(--text-xl); letter-spacing: 0.35em;
      text-transform: uppercase; background: var(--surface-deep); color: var(--ink);
      border: 1px solid var(--edge-strong); border-radius: 4px; }
    #join-submit-btn { padding: 0.55rem 1.6rem; font-size: var(--text-md);
      background: var(--surface-raised); color: var(--ink);
      border: 1px solid var(--edge-bright); border-radius: 4px; }
    #join-entry-hint { font-size: var(--text-xs); color: var(--ink-faint); max-width: 32ch; }
    #join-entry-error { font-size: var(--text-sm); color: var(--fire); min-height: 1.2em;
      max-width: 34ch; }
    section { display: none; }
    section.active { display: block; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem; font-family: monospace;
    }
    /* This corner and the Station bar must not share pixels (issue #1372).
       In portrait the bar is a full-width strip across the very top and its
       LAST item is the help button, so a corner pinned at `top: 0.75rem` and
       z-index 20 lands square on the help button's ink — above the bar's 16 —
       and swallows the taps meant for it. That is the same "a control buried
       under chrome" failure #939 and #940 fixed for the cog; it went unnoticed
       here only because the bar's right end used to hold nothing but text.
       Dropped BELOW the strip rather than hidden: link state and the fullscreen
       toggle are wanted in game too, and floating over console content at the
       top-right is what this corner already does in landscape. Landscape needs
       no offset at all — there the bar is a rail down the LEFT — so the rule is
       scoped rather than given a second number to keep in step.
       tests/smoke/hero-bar-responsive.spec.js hit-tests the centre of both
       buttons so the collision cannot come back unseen. */
    @media (orientation: portrait) {
      #console-container.station-hero-visible ~ #top-bar {
        /* Written from the strip's CAUSE, not from the 53px it happens to
           measure: the touch floor its tallest child carries, the 4px of
           padding above and below it, its 1px bottom border, and 4px of air.
           Raise the floor and this clears the taller strip on its own. */
        top: calc(var(--control-hit-min) + 4px + 4px + 1px + 4px);
      }
    }
    #conn-label { font-size: var(--text-sm); color: var(--fire-hot); }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--loaded); flex-shrink: 0; }
    #retry-now-btn {
      display: none; width: auto; background: var(--fire-deep); color: var(--tactical-bright);
      border: 1px solid var(--fire); padding: 0.2rem 0.5rem; margin: 0;
      font-size: var(--text-sm); cursor: pointer; min-height: var(--control-hit-min);
    }
    #retry-now-btn.visible { display: inline-block; }
    #retry-now-btn:active { background: var(--reloading-dim); }
    #fullscreen-btn {
      display: inline; width: auto; background: none; border: none; color: var(--ink);
      font-size: var(--text-lg); cursor: pointer; padding: 0; margin: 0; line-height: 1; min-height: var(--control-hit-min);
    }
    /* View selector cross and Red Alert button moved to Bevy WASM (#48). */
    /* Console container: full-screen flex column layout host for all console
        sections. One human = one station (issue #827) — a single console
        section fills the viewport; there is no tab bar. */
    #console-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
      pointer-events: none;
    }
    #console-container > *, #console-container section.active > * {
      pointer-events: auto;
    }
    /* -- Link state (PRD #1023 module 4, user stories 14 and 15) ---------
       A console renders from local state, so it looks the same whether the
       numbers behind it are live, stale or absent. [data-link] is what makes
       that difference visible.

       `connecting` is dimmed but still live to the touch: it is "not yet", and
       it resolves on its own. `dead` is "no longer" — dimmed harder, drained
       of colour, and inert, so a thumb cannot keep firing torpedoes into a
       link that closed thirty seconds ago. pointer-events on the container is
       what actually stops the taps: the controls themselves live inside
       console iframes and shadow roots this page does not own. */
    #console-container[data-link="connecting"] { opacity: 0.55; }
    #console-container[data-link="dead"] {
      opacity: 0.32; filter: grayscale(0.85);
      pointer-events: none;
    }
    #console-container[data-link="dead"] > *,
    #console-container[data-link="dead"] section.active > * {
      pointer-events: none;
    }
    #console-container[data-link] { transition: opacity .25s ease, filter .25s ease; }
    #link-banner[aria-hidden="true"] { display: none; }
    #link-banner {
      position: fixed; z-index: 188;
      top: max(env(safe-area-inset-top), 3.2rem); left: 50%;
      transform: translateX(-50%);
      max-width: min(92vw, 46ch);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 10px 18px; border-radius: 6px;
      font-family: 'Chakra Petch', monospace; text-align: center;
      background: var(--scrim-panel);
      border: 1px solid var(--edge-strong);
      pointer-events: none;
    }
    #link-banner[data-mode="dead"] {
      border-color: var(--fire); background: rgba(var(--rgb-fire), 0.18);
    }
    #link-banner .link-banner-title {
      font-size: var(--text-md); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      color: var(--ink);
    }
    #link-banner[data-mode="dead"] .link-banner-title { color: var(--fire-bright); }
    #link-banner .link-banner-detail { font-size: var(--text-sm); color: var(--ink-dim); }
    #link-banner .link-banner-detail:empty { display: none; }
    /* Helm console UI moved to Bevy WASM (#49). */
    /* Weapons console: full-viewport iframe overlay when active (issue #422).
       Padding leaves room for the phone bezel (issue #439); see --bezel-inset
       further down. */
    /* The active HTML console section fills the container. */
    .console-section.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
      margin: 0;
    }
    .console-section iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      display: block;
    }
    #station-hero[aria-hidden="true"] { display: none; }
    /* The ONE header (PRD #1371). The cog leads it and the help button closes
       it — both re-parented in from the page body by placeShellChrome() — with
       the Station tabs between them. 52px in portrait is not a round number
       picked for looks: it is the 44px touch floor its tallest child carries,
       plus the 4px of padding above and below.

       `box-sizing` is declared HERE rather than left to the page. Only `body`
       sets it and it does not inherit, so a `content-box` bar read `min-height`
       as 52px of CONTENT and drew a 61px strip — the padding and the border
       stacked on top of the number that was supposed to contain them. The
       landscape block below always declared it, which is exactly why the rail
       measured right while the strip did not. Counted properly the strip
       settles at 53px: the 44px tab, 4px above and below it, and the border. */
    #station-hero {
      box-sizing: border-box;
      display: flex; gap: 10px;
      align-items: center; flex: 0 0 auto; padding: 4px 10px;
      min-height: 52px; z-index: 16;
      background: var(--surface-panel); border-bottom: 1px solid var(--edge-strong);
      font-family: 'Chakra Petch', monospace;
    }
    /* The cog and the help button, while they are the bar's children. The
       page-body rule below them is `position: fixed` at the viewport's corner;
       in here they are ordinary flex items, and `relative` is kept so the 44px
       hit-target pseudo-element still has them as its containing block. */
    #station-hero .settings-btn {
      position: relative; top: auto; left: auto; z-index: auto;
      flex: 0 0 auto; background: none; border-color: transparent;
    }
    #station-hero .settings-btn:hover { border-color: var(--loaded); }
    #station-hero-tabs { display: flex; flex: 1 1 auto; gap: 4px; overflow-x: auto; min-width: 0; }
    #station-hero-tabs button {
      position: relative; overflow: hidden;
      width: auto; margin: 0; padding: 3px 9px 8px; min-height: var(--control-hit-min);
      display: flex; flex-direction: column; gap: 1px; white-space: nowrap;
      font-size: var(--text-sm); text-align: center;
    }
    #station-hero-tabs button[aria-selected="true"] {
      border-color: var(--signal); min-height: var(--control-hit-min);
    }
    .station-tab-health {
      position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
      overflow: hidden; background: var(--surface-ridge);
    }
    .station-tab-health-fill {
      display: block; height: 100%;
      background: color-mix(in srgb,
        var(--fire) var(--station-health-loss-pct),
        var(--loaded) var(--station-health-pct));
    }
    .station-tab-health-fill[hidden] { display: none; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    /* Persistent per-tab importance cue (issue #1101): its OWN element and glyph
       token, held apart from the health cue above, so an off-screen event or a
       continuing condition reads on every tab without colour and alongside
       health. Never a sort key — importance never reorders tabs. */
    .station-tab-importance { font-size: var(--text-xs); color: var(--ink-dim); letter-spacing: 0.06em; }
    /* Unread badge on an overlay tab (issue #1373). Pinned to the tab's top
       corner rather than given a row of its own: the tabs are already as short
       as the 44px touch floor allows, and a fourth stacked line would push the
       label out of a phone strip. `hidden` is honoured explicitly because the
       button is a flex container, whose `display` would otherwise win. */
    .station-tab-badge {
      position: absolute; top: 1px; right: 2px;
      min-width: 14px; padding: 0 3px; border-radius: 7px;
      font-size: var(--text-xs); line-height: 14px; text-align: center;
      background: var(--signal); color: var(--surface-void); font-weight: 700;
    }
    .station-tab-badge[hidden] { display: none; }
    /* …and the tab holds a column back for it. Pinning alone is not enough in
       the strip: there the tab is `width: auto`, shrink-wrapped to its label
       with `overflow: hidden`, so the pill lands ON the label's last glyphs —
       "INTL" reading "INT" under a '3', "Comms" reading "Comm". `data-badge`
       is written on every tab unconditionally (gui/hero-bar.js), so this
       selector is exactly the badged ones and costs nothing on the rest; in
       the landscape rail the tab is already full width, so all the reservation
       does there is nudge the centred label a few pixels left. Padding rather
       than an in-flow flex item beside the label, which would reflow the tab's
       column and move the 44px touch floor the strip's height is derived from.
       28px is the pill's own width at two digits (~20px) plus its 2px offset
       and a glyph of clearance — two digits is the ceiling the count can
       realistically reach, since it counts dossier SUBJECTS that grew. The
       touch floor is restated here for the same reason the selected-tab rule
       above restates it: a rule that re-sizes a control states the floor it
       is sized to (tests/client/control-floors.test.js reads them all). */
    #station-hero-tabs button:not([data-badge="0"]) {
      padding-right: 28px; min-height: var(--control-hit-min);
    }
    #station-hero-details { display: flex; flex-direction: column; flex: 0 0 auto; gap: 1px; }
    #station-hero-title { font-size: var(--text-md); font-weight: 700; }
    #station-hero-rating, #station-hero-ai { font-size: var(--text-xs); color: var(--ink-dim); }
    @media (orientation: landscape) {
      #console-container.station-hero-visible { flex-direction: row; }
      #station-hero {
        /* A COLUMN, not the row the strip is: the rail runs cog at the top,
           tabs down the middle, help at the bottom. Before the cog and help
           joined it the bar had two children and could afford to stay a row
           with the details block rotated beside the tabs; four children in a
           96px rail cannot. */
        flex-direction: column;
        width: 132px; height: 100%; min-height: 0;
        align-items: stretch; gap: 4px;
        padding: max(4px, env(safe-area-inset-top)) 4px
          max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
        border-right: 1px solid var(--edge-strong); border-bottom: 0;
      }
      #station-hero-tabs {
        flex-direction: column; overflow-x: hidden; overflow-y: auto;
        min-height: 0; align-items: stretch;
      }
      #station-hero-tabs button { width: 100%; flex: 0 0 auto; }
      /* Ordinary horizontal text at the foot of the rail. It used to be rotated
         because it stood BESIDE a column of tabs with only a sliver of width;
         under the column above it has the rail's full 132px and reads
         normally. Wrapped rather than clipped — a Station name is two words at
         most and the rail is not short of height. */
      #station-hero-details {
        align-items: center; text-align: center; overflow: hidden;
        flex: 0 0 auto; white-space: normal; overflow-wrap: anywhere;
      }
      /* Stretched across the rail rather than a 40px box floating in it. */
      #station-hero .settings-btn { width: auto; align-self: stretch; }
      /* …and the diagnostics row off the rail's foot, for the same reason
         #top-bar is pushed off the strip above. The rail's foot is where the
         help button sits since issue #1372, and #conn-diag-row is anchored to
         that same bottom-left corner at z-index 25 against the bar's 16 — so
         its copy button was taking the tap meant for help. Pushed clear rather
         than hidden: the readout is wanted in game too. Derived from the rail
         width declared four lines up, so the two move together.
         tests/smoke/hero-bar-responsive.spec.js hit-tests both buttons at all
         three sizes, which is what caught it. */
      #console-container.station-hero-visible ~ #conn-diag-row {
        left: calc(132px + 0.75rem);
      }
    }
    /* The narrow bar (issue #1372). Two shapes, one condition each, and the
       SAME pair `gui/hero-bar.js` exports as HERO_BAR_CODE_QUERY — the
       stylesheet narrows the bar and the script switches the tabs to the hull's
       short codes off one answer, so the two can never disagree about whether
       there is room for full Station names.

       The landscape half reuses the 500px height threshold this page already
       draws for the lobby's Station descriptions further down: a phone held
       sideways has no vertical room, a landscape desktop has hundreds of spare
       pixels.

       PADDING is written once per shape and never in the shared block below.
       A `padding` shorthand there matches a phone held sideways too, and — at
       the same specificity, later in the sheet — it flattened the rail's
       `env(safe-area-inset-*)` guards to plain pixels, drawing the cog and the
       tabs under the notch and the home indicator on exactly the devices those
       guards exist for. The two shapes want different insets anyway: a strip
       has no notch beside it, a rail is pressed against one. */
    @media (orientation: landscape) and (max-height: 500px) {
      #station-hero {
        width: 96px; gap: 6px;
        padding: max(4px, env(safe-area-inset-top)) 6px
          max(4px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      }
      #console-container.station-hero-visible ~ #conn-diag-row {
        left: calc(96px + 0.75rem);
      }
    }
    @media (orientation: portrait) and (max-width: 599px) {
      #station-hero { gap: 6px; padding: 4px 6px; }
    }
    @media (orientation: portrait) and (max-width: 599px),
           (orientation: landscape) and (max-height: 500px) {
      /* Tighter than the wide bar: every pixel taken back here is a pixel the
         tabs get, and the tabs are the whole point of the strip. */
      #station-hero-tabs button { padding: 3px 6px 8px; min-width: 0; }
      /* The selected tab already says which Station this is, so the title and
         its rating are a second copy of it in the space the tabs need. Dropped
         outright rather than hidden from sight only — nothing reads them. */
      #station-hero-title, #station-hero-rating { display: none; }
      /* The AI roll-call is NOT dropped with them. It is a live region, and the
         only channel that says which Stations the ship is flying itself, so it
         keeps announcing from off-screen. */
      #station-hero-ai {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
      }
    }
    /* --- Phone-bezel red alert glow animation -----------------------------
       Pure CSS no PNGs. A thin 2px inset border holds the base frame color;
       when .alert-on is toggled we swap `--bezel-frame` to red and kick off
       a continuous pulse so the console rings like an alarm.
         - 0.5s ease ease-out: fade-in / fade-out transition on the ring color.
         - slow, infinite pulse while active (keyframes below).
       z-index: 15 — above the weapons iframe (10) and canvas (0), below the
       top-bar status overlay (20) and the loading spinner (200). The bezel
       is purely cosmetic; pointer-events: none lets clicks through. */

    :root {
      --bezel-frame: rgba(var(--rgb-science), 0.7);
      --bezel-glow-size: 4px;
      --bezel-pulse-intensity: 0.6;
      --bezel-red: var(--fire-hot);
      --bezel-inset: 0px;
    }

    #phone-bezel {
      position: fixed; inset: var(--bezel-inset);
      z-index: 15; pointer-events: none; display: block;
      border: 2px solid transparent;
      transition: border-color 0.5s ease-out, box-shadow 0.5s ease-out;
    }

    #phone-bezel.alert-on {
      border-color: var(--bezel-red);
      box-shadow: 0 0 var(--bezel-glow-size) calc(var(--bezel-glow-size) * 3) var(--bezel-frame);
      /* `infinite`, not `forwards`: the alert is a STATE, and the bezel is how
         the whole crew reads that state off each other's phones across a room.
         With no iteration count the pulse ran exactly once — about three
         seconds of alarm at the moment the captain raised it, and then a
         static red frame for the rest of the engagement. The keyframes were
         always written for a loop (the comment inside says "a steady slow
         pulsing loop"); only the iteration count was missing. */
      animation: bezel-pulse 2.8s ease-in-out infinite;
    }

    #phone-bezel.alert-on::after {
      /* Extra outer ring visible while the slow pulse continues so corners and edges look like an actual
         glowing frame without extra DOM nodes per edge/corner piece. */
      content: ''; position: absolute; inset: -2px;
      border: 1.5px solid rgba(var(--rgb-fire), var(--bezel-pulse-intensity));
      border-radius: inherit; pointer-events: none; opacity: 0.85;
    }

    @keyframes bezel-pulse {
       /* Initial fade-in up to peak intensity, then a steady slow pulsing loop. */
      0%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(var(--rgb-fire), 0.5); opacity: 1; }
     50%   { box-shadow: inset 0 0 8px var(--bezel-red), 0 0 16px calc(var(--bezel-glow-size) * 4) rgba(var(--rgb-fire), 0.9); border-color: var(--fire-hot); opacity: 0.95; }
    100%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(var(--rgb-fire), 0.5); opacity: 1; }
}

    /* Reduced motion: still the pulse, keep the alert.
       A looping red flash across the whole screen edge is exactly the kind of
       thing a player who asks for reduced motion is asking not to be given.
       The answer is to stop the ANIMATION, not to hide the STATE — so the
       bezel holds at the keyframe's peak: full red border and full glow,
       simply not moving. Someone reading the room still sees a ship at red
       alert.

       The global layer in gui/tokens.css (issue #1172) already collapses this
       loop's duration off BOTH the OS media query and the stamped
       `data-reduced-motion` attribute; this rule only holds the BRIGHTER frame.
       It is attribute-driven, not `@media`, so the tri-state resolves cleanly:
       it lands exactly when the profile stamps `reduce` (explicit ON, or OS
       reduce folded through the resolver) and steps aside for an explicit OFF.
       Its `data-reduced-motion` attribute plus the id/class outweigh the bare
       loop rule above, so it wins wherever it sits. */
    :root[data-reduced-motion="reduce"] #phone-bezel.alert-on {
      animation: none;
      border-color: var(--fire-hot);
      box-shadow: inset 0 0 8px var(--bezel-red),
                  0 0 16px calc(var(--bezel-glow-size) * 4) rgba(var(--rgb-fire), 0.9);
    }

     #phone-bezel[aria-hidden="true"] { display: none; }
    #coordination-popup {
      display: none;
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      z-index: 180;
      background: var(--surface-panel-up);
      border: 1px solid var(--science);
      border-radius: 8px;
      padding: 12px 18px;
      max-width: 320px;
      color: var(--ink);
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-xl);
      box-shadow: 0 4px 20px rgba(var(--rgb-void), 0.6);
      cursor: pointer;
      user-select: none;
    }
    #coordination-popup .popup-sender {
      font-size: var(--text-lg);
      color: var(--sky);

      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #coordination-popup .popup-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    #coordination-popup .popup-body {
      font-size: var(--text-xl);
      color: var(--ink-dim);
    }

    /* -- Station damage popup (issue #1374) --------------------------
       Every console used to end in a footer strip carrying a summed hull bar
       you tapped for the Station's individual systems. The footers are gone
       and the popup is here instead, opened by tapping the ALREADY SELECTED
       Station tab on the bar — one surface for the whole fleet rather than
       twenty-two copies of the same widget, and no console spends a row of a
       phone screen on a readout looked at once a minute.

       z-index 196 puts the scrim over the bar that opened it (16) and over the
       cog (195), so a tap anywhere outside the card closes the popup rather
       than landing on chrome behind it — and below the settings overlay
       (1000), which is the one surface that outranks everything. */
    #station-damage-popup {
      position: fixed; inset: 0; z-index: 196;
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-5);
      background: rgba(var(--rgb-deep), 0.82);
    }
    #station-damage-popup[hidden] { display: none; }
    #station-damage-popup .popup-card {
      width: min(22rem, 100%);
      max-height: 70vh;
      overflow-y: auto;
      background: var(--surface-panel);
      border: 1px solid var(--cyan-dim);
      box-shadow: 0 4px 20px rgba(var(--rgb-void), 0.6);
      padding: var(--space-4);
    }
    #station-damage-popup .popup-head {
      display: flex; align-items: center; gap: var(--space-3);
      padding-bottom: var(--space-2);
      margin-bottom: var(--space-3);
      border-bottom: 1px solid var(--line-faint);
    }
    #station-damage-popup-title {
      flex: 1; min-width: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--text-sm);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }
    #station-damage-popup-close {
      flex: 0 0 auto;
      min-width: var(--control-hit-min);
      min-height: var(--control-hit-min);
      padding: 0; margin: 0;
      background: none;
      border: 1px solid var(--edge);
      border-radius: 3px;
      color: var(--ink-faint);
      font-family: 'Chakra Petch', sans-serif;
      font-size: var(--text-lg);
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    #station-damage-popup-close:hover { color: var(--ink); border-color: var(--loaded); }
    #station-damage-popup-empty {

    /* -- The loading surfaces (issue #1368) --------------------------
       #asset-loading and #waiting-overlay are the two pre-play surfaces that
       report progress rather than wait on a person, so they wear one
       treatment: the ring, a lead line, a progress bar, the small print under
       it, and the Session named at the bottom so a player holding the phone
       knows what they are about to play.

       PORTRAIT STACKS; LANDSCAPE PUTS THE MARK BESIDE THE STACK, and the
       switch is `@media (orientation: ...)` and nothing else -- no script runs
       on an orientation change, exactly as the console container below does
       it.

       Which of the two is up is decided once, in gui/pre-play-view.js; what it
       SAYS is decided once, by `loadingView()` in the same file; and
       gui/loading-render.js writes it. The stylesheet owns only what neither
       of those can: the motion, and the layout. */
    #asset-loading {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      background: var(--surface-void);
    }
    #asset-loading, #waiting-overlay {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-7);
      padding: var(--space-6);
      color: var(--ink);
      font-family: 'Chakra Petch', monospace;
      text-align: center;
    }
    /* The ring keeps the anatomy it shipped with -- 40px across, a 3px stroke,
       one arc in the accent -- because that is what a returning player already
       reads as "working". Only the accent moved, onto the surface's own
       --signal. Both loading surfaces draw the same one. */
    #asset-loading .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--surface-lift);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    /* The insignia beside (landscape) or above (portrait) the progress stack.
       A background image rather than an <img>, so the element can carry its
       accessible name from the String Table instead of an alt attribute
       nobody would translate.

       `logo.png`, NOT `assets/logo.png`: scripts/build-client.mjs copies it to
       the CLIENT ROOT beside index.html — the phone bundle has no assets/
       entry for it — which is the same layout the favicon link at the top of
       this page is written against. gui/host-landing.css says the opposite
       thing for the opposite reason: it is a stylesheet one directory down,
       and a URL in a stylesheet resolves against the stylesheet. */
    .ld-mark {
      flex: 0 0 auto;
      width: clamp(72px, 26vw, 150px);
      height: clamp(72px, 26vw, 150px);
      background: url('logo.png') center center / contain no-repeat;
    }
    .ld-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-5);
      width: 100%;
      max-width: 340px;
    }
    /* `hidden` has to be able to win in here. The attribute's own rule is a UA
       `display: none`, and ANY author `display` outranks it — so the two rows
       the renderer withholds (the percentage where nothing is measurable, the
       Session before Welcome lands) stayed on the screen holding placeholder
       text until this said otherwise. */
    .ld-stack [hidden] { display: none; }
    .ld-label {
      font-size: var(--text-md);
      font-weight: 600;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: var(--ink);
    }
    /* The number, and ONLY where there is one to report. The renderer hides
       this row outright on every other state rather than leaving a stale or
       invented figure standing. */
    .ld-pct {
      font-family: var(--font-mono);
      font-size: var(--text-display);
      font-weight: 700;
      letter-spacing: var(--tracking-tight);
      color: var(--signal);
    }
    .ld-pct-unit {
      font-size: var(--text-xl);
      color: var(--ink-faint);
      margin-left: var(--space-1);
    }
    .ld-bar {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 8px;
      background: var(--surface-raised);
      border: 1px solid var(--edge-faint);
    }
    .ld-fill {
      display: block;
      height: 100%;
      /* A block-level fill with no width is width:auto -- the WHOLE track. So
         the resting state of an unrendered bar is FULL, which is the invented
         number in its loudest form, and it is exactly what the page's own
         degraded path paints: gui/ never loads, applyPrePlaySurfaces() writes
         the percentage by hand, and "3" sits beside a completely full bar.
         Zero here makes the empty bar a stylesheet invariant rather than
         something only script can be trusted to establish. Both overrides
         still outrank it -- `.ld-bar.indet .ld-fill` sets 34%, and the
         reduced-motion rule at the foot of this sheet sets 100%. */
      width: 0;
      background: linear-gradient(to right, var(--cyan-dim), var(--signal));
      transition: width 0.3s ease;
    }
    /* Nothing to measure -- a connecting link, a host still choosing. A sweep
       says "working" without claiming progress nobody counted, and it covers a
       THIRD of the track: a full bar that happens to be moving still reads as
       a full bar, which is the invented number in another form. The width is
       here rather than written from script for the same reason -- see the
       reduced-motion counterpart at the foot of this stylesheet, which has to
       be able to outrank it. */
    .ld-bar.indet .ld-fill {
      width: 34%;
      animation: ld-sweep 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    @keyframes ld-sweep {
      0%   { transform: translateX(-105%); }
      100% { transform: translateX(315%); }
    }
    .ld-ticks {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
      width: 100%;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .ld-ctx {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-3);
      width: 100%;
      padding-top: var(--space-5);
      border-top: 1px solid var(--edge-faint);
    }
    .ld-ctx b {
      font-size: var(--text-lg);
      font-weight: 600;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      color: var(--ink);
    }
    .ld-ship {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .ld-status {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      color: var(--signal);
    }
    /* The link went away and the page is dialling again. Amber rather than the
       accent, because a bar that has stopped moving with no explanation is the
       failure this line exists to close. */
    .ld-status.retrying { color: var(--reloading); }
    /* Side by side once the frame is wider than it is tall. */
    @media (orientation: landscape) {
      #asset-loading, #waiting-overlay { flex-direction: row; }
      .ld-mark { width: clamp(72px, 18vw, 160px); height: clamp(72px, 18vw, 160px); }
      .ld-stack { max-width: 380px; }
    }
    /* A short frame cannot spare the vertical rhythm. */
    @media (max-height: 430px) {
      .ld-pct { font-size: var(--text-2xl); }
      .ld-ctx { padding-top: var(--space-4); }
    }

    /* -- Game-over overlay (shown when GamePhase::GameOver) ---------- */
    /* Drawn by gui/game-over.css, the one sheet the phone, the Viewscreen and
       the native HUD share for the ending (linked in <head>, after the
       tokens). This page adds only its stacking: the overlay is a
       full-viewport surface the Station Bar's cog has to sit above (issue
       #1372 — tests/client/settings-panel.test.js reads this z-index), and it
       is FIXED rather than the sheet's absolute because the phone shell
       scrolls. */
    #game-over-overlay {
      position: fixed;
      z-index: 190;
    }

    /* -- Waiting-for-scenario overlay (shown after ReturnToLobby until host picks)
       The second loading surface: it wears the treatment above and differs in
       only two things -- what it sits on (a scrim, because the lobby behind it
       is still the truth) and having no percentage at all, because a host
       still choosing a World is not a quantity anybody can measure. */
    #waiting-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 185;
      background: rgba(var(--rgb-void), 0.92);
    }
    #waiting-overlay .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid var(--surface-lift);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* QR-first scenario/ship picker overlay (issue #755). */
    #scenario-picker-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 186;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      background: rgba(var(--rgb-void), 0.94);
      color: var(--ink-dim);
      font-family: 'Chakra Petch', monospace;
      padding: 24px 18px;
      gap: 16px;
      overflow-y: auto;
    }
    #scenario-picker-heading {
      text-align: center;
      font-size: var(--text-xl);
      letter-spacing: 0.08em;
      color: var(--ink);
      text-transform: uppercase;
    }
    #scenario-picker-body { display: flex; flex-direction: column; gap: 12px; }
    #scenario-picker-body .scenario-btn {
      display: block; width: 100%;
      padding: 16px 18px;
      font-family: 'Chakra Petch', monospace;
      font-size: var(--text-lg); letter-spacing: 0.06em;
      color: var(--ink); text-align: left;
      background: rgba(var(--rgb-cyan), 0.1);
      border: 1px solid var(--edge-control); border-radius: 6px;
      cursor: pointer; min-height: var(--control-hit-min);
    }
    #scenario-picker-body .scenario-btn:active { background: rgba(var(--rgb-cyan), 0.22); }
    /* In-flight pick (PRD #1023 user story 16). The tapped button keeps its
       accent and gains a line saying the request is out; every other button
       recedes, because the arbiter will ignore a second request anyway and a
       picker that keeps taking taps it will not act on is what made the stage
       change feel arbitrary. */
    #scenario-picker-body .scenario-btn:disabled { opacity: 0.45; cursor: default; }
    #scenario-picker-body .scenario-btn.pending:disabled {
      opacity: 1; border-color: var(--signal); background: rgba(var(--rgb-cyan), 0.2);
    }
    #scenario-picker-body .scenario-pending {
      margin-top: 6px; font-size: var(--text-sm); color: var(--signal);
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
    }
    /* Another phone won the race. Stated, and naming what it chose, so the
       stage the player was moved to has a cause. */
    #scenario-picker-body .scenario-race-note {
      padding: 10px 14px; border-radius: 6px; text-align: center;
      font-size: var(--text-md); color: var(--ink);
      background: rgba(var(--rgb-gold), 0.14); border: 1px solid var(--gold);
      letter-spacing: 0.03em;
    }
    #scenario-picker-body .scenario-desc { font-size: var(--text-sm); color: var(--ink-dim); margin-top: 6px; letter-spacing: 0.02em; }
    #scenario-picker-body .scenario-locked-note { text-align: center; color: var(--ink-dim); font-size: var(--text-md); letter-spacing: 0.05em; }
    /* Mod-origin badge on a scenario button (issue #990): a base scenario gets
       none, a mod-supplied one wears the applied pack's name. */
    #scenario-picker-body .scenario-origin {
      display: inline-block; margin-top: 8px;
      padding: 2px 8px; border-radius: 4px;
      font-size: var(--text-xs); letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink); background: rgba(var(--rgb-cyan), 0.22);
      border: 1px solid var(--ink-faint);
    }

    /* -- "Mods active" lobby list (issue #990) --------------------------- */
    #lobby-mods[aria-hidden="true"] { display: none; }
    #lobby-mods {
      display: flex; flex-direction: column; gap: 3px;
      margin: 4px 0 2px;
      font-family: 'Chakra Petch', monospace;
    }
    #lobby-mods .mods-active-heading {
      font-size: var(--text-xs); letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--ink-dim);
    }
    #lobby-mods .mods-active-row {
      font-size: var(--text-md); letter-spacing: 0.03em; color: var(--ink);
    }
    #lobby-mods .mods-active-version { color: var(--ink-dim); margin-left: 6px; }

    /* Crew-public equal GM presence. It is a sibling of the Station roster,
       not a Station row: GMs never enter crew/spectator counts or controls. */
    #gm-presence[aria-hidden="true"] { display: none; }
    #gm-presence {
      flex-shrink: 0; margin-top: 6px; padding: 7px 9px;
      border: 1px solid var(--edge); border-radius: 5px;
      background: var(--surface-panel);
    }
    #gm-presence-heading {
      margin: 0 0 5px; color: var(--ink-dim); font-size: var(--text-xs);
      letter-spacing: .08em; text-transform: uppercase;
    }
    #gm-presence-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .gm-presence-pill {
      padding: 3px 7px; border: 1px solid var(--signal);
      border-radius: 3px; color: var(--signal); font-size: var(--text-sm);
    }
    .gm-presence-pill.disconnected {
      opacity: .6; border-style: dashed; color: var(--ink-dim);
    }


    /* -- Lobby section: full-viewport when active ------------------------ */
    #lobby-ui.active {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 5;
      /* The diagnostics remain usable outside the connection-gated console.
         Reserve their measured height: a phone's READY bar spans the width,
         so anchoring the copy button on the left does not prevent overlap. */
      bottom: calc(1.6rem + var(--connection-diagnostics-height, 0px));
      overflow: hidden;
      /* Top padding clears the settings cog (issue #940): `.settings-btn` is
         40px of ink by 44px tall at a 4px inset, so it reaches 48px down from
         the top and the lobby's first row — #lobby-header, holding #ship-name —
         has to start below that or the gear clips its first characters.
         Cleared on the top rather than the left so the header stays aligned
         with the station list beneath it, and it clears the help button beside
         the cog at the same stroke since the two are the same height.
         Pinned by tests/client/settings-panel.test.js. */
      padding: 48px 12px 6px;
      background: var(--surface-abyss);
      color: var(--ink);
      font-family: 'Chakra Petch', system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      pointer-events: auto;
    }
    /* -- Spectator summary surface (issue #1105) ------------------------- */
    #spectator-ui { display: none; }
    #spectator-ui.active {
      display: flex; flex-direction: column; gap: 12px;
      position: fixed; inset: 0; z-index: 6; overflow: auto;
      padding: 48px 12px 12px;
      background: var(--surface-abyss); color: var(--ink);
      font-family: 'Chakra Petch', system-ui, sans-serif;
    }
    #spectator-header { font-size: var(--text-lg); font-weight: 600; letter-spacing: .06em; }
    #spectator-alert { font-size: var(--text-md); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
    #spectator-alert[data-alert="red"] { color: var(--tactical-bright); font-weight: 700; }
    #spectator-hull { font-size: var(--text-sm); color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
    .spectator-section { display: flex; flex-direction: column; gap: 4px; }
    .spectator-heading { font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
    .spectator-station-row { display: flex; justify-content: space-between; font-size: var(--text-sm); }
    .spectator-station-health { color: var(--ink-dim); font-family: 'JetBrains Mono', monospace; }
    .spectator-objective-row { font-size: var(--text-sm); }
    .spectator-objective-row.done { text-decoration: line-through; color: var(--ink-dim); }
    .spectator-objectives-empty { font-size: var(--text-xs); color: var(--ink-dim); }
    /* Claim-an-open-Station list (issue #1106). Rows reuse the lobby
       .station-row visuals (claim/ineligible buttons, inline reason); only the
       list container and the neutral stale-claim notice are scoped here. */
    #spectator-claims { display: flex; flex-direction: column; gap: 6px; }
    #spectator-claim-status:empty { display: none; }
    #spectator-claim-status { font-size: var(--text-sm); color: var(--ink-dim); }
    #spectator-claim-status[data-state="taken"] { color: var(--reloading); }
    .spectator-claims-empty { font-size: var(--text-xs); color: var(--ink-dim); }

    /* ── Ship header ─────────────────────────────────────────────────────
       The client lobby's command bar, drawn to the "Client lobby — portrait
       frame" artboard (PRD #1355, issue #1369). The artboard is authored in
       raw hex; every value below is the rung issue #1357's mapping table gives
       for the ROLE, not the nearest colour by eye:

         bar fill      linear-gradient(#14171c 92% → #0a0c10 40%)
                       → rgba(--rgb-panel) over rgba(--rgb-base)
         bar rule      #1b1f26 → --edge-faint, a content divider
         ship name     #d8e2ff → --ink (the vocabulary's brightest ink; the
                       artboard's near-white has no rung, and inventing one
                       would be a palette change this slice does not make)
         eyebrow       #6a727b → --ink-faint. NOT --edge-strong, which is what
                       that hex maps to as a STROKE: as 11px text it has to
                       clear the 4.5 floor, and --ink-faint is the rung derived
                       for exactly that (see gui/tokens.css).
         badge rest    border #2a2f38 → --surface-ridge, the chamfer stroke
         badge go      #5fd8e8 on #0a2830 → --signal on --cyan-dim

       Written full-bleed — the negative margin cancels #lobby-ui.active's
       12px gutter, which is --space-5 exactly — because a command bar that
       stops short of the screen edge reads as a card, and the bar is the one
       thing on this surface that is chrome rather than content. It comes
       straight back as the bar's own inset, at the artboard's slightly wider
       --space-6, and that extra 4px is doing a second job: the settings cog is
       40px of ink and 44px of THUMB at a 4px inset (issue #1372 sized it for
       the Station bar it now leads), so it reaches down over the bar's top-left
       corner exactly as the artboard draws it, and the wider inset is what
       keeps it off the ship name's first characters. The TOP padding on
       #lobby-ui.active is that same clearance, raised to 48px with the cog, and
       tests/client/settings-panel.test.js measures it. */
    #lobby-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-5);
      margin: 0 calc(-1 * var(--space-5));
      padding: 0 var(--space-6);
      min-height: 60px;
      border-bottom: 1px solid var(--edge-faint);
      background: linear-gradient(
        to bottom,
        rgba(var(--rgb-panel), 0.92),
        rgba(var(--rgb-base), 0.4));
      flex-shrink: 0;
    }
    #ship-info { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
    #ship-name {
      font-family: var(--font-display);
      font-size: var(--text-lg); font-weight: 700;
      letter-spacing: var(--tracking); text-transform: uppercase;
      color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* The artboard's eyebrow. Its 0.24em sits between --tracking-wide and
       --tracking-widest; the narrower rung is taken because a mission line is
       authored prose of unknown length and this is a 390px-wide bar. */
    #ship-mission {
      font-family: var(--font-mono);
      font-size: var(--text-xs); font-weight: 600;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      color: var(--ink-faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #crew-ready { display: flex; align-items: center; gap: var(--space-4); flex: 0 0 auto; }
    #crew-display {
      font-family: var(--font-mono);
      font-size: var(--text-sm); font-weight: 700;
      letter-spacing: var(--tracking-tight);
      color: var(--ink);
    }
    /* A chamfered badge rather than a rounded pill — the artboard cuts the same
       5px corner on every small status block. `clip-path` clips an OUTER
       box-shadow, so the ready glow below is drawn inset. */
    #ready-pill {
      padding: var(--space-3) var(--space-5);
      font-family: var(--font-mono);
      font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      color: var(--ink-faint); background: transparent;
      border: 1px solid var(--surface-ridge); border-radius: 0;
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px),
        calc(100% - 5px) 100%, 0 100%, 0 5px);
      transition: color .3s ease, background .3s ease, border-color .3s ease;
    }
    #ready-pill.go { background: var(--cyan-dim); color: var(--signal); border-color: var(--signal);
      animation: pill-pulse 1.5s ease-in-out infinite; }
     @keyframes spin { to { transform: rotate(360deg); } }

     @keyframes pill-pulse {
        0%, 100%{ box-shadow: inset 0 0 4px rgba(var(--rgb-signal), 0.2); }
       50%      { box-shadow: inset 0 0 12px rgba(var(--rgb-signal), 0.5); }
    }

    /* Name input row */
    #lobby-name-row { flex-shrink: 0; padding: var(--space-3) 0 var(--space-1); }
    #lobby-name-row label { font-size: var(--text-sm); color: var(--ink-faint); margin: 0;
      display: flex; align-items: center; gap: var(--space-4); }
    #lobby-name-row input { flex: 1; background: var(--surface-panel); color: var(--ink);
      border: 1px solid var(--edge); padding: var(--space-2) var(--space-4); border-radius: 3px;
      font-family: var(--font-display); font-size: var(--text-md);
      display: inline; width: auto; margin: 0; }

    /* ── Lobby body ──────────────────────────────────────────────────────
       The roster and the seat rail, drawn to the "Client lobby — portrait
       frame" and "— landscape frame" artboards (PRD #1355, issue #1370).

       The two artboards are ONE document at two frame sizes, and this is the
       joint that makes that true in the page: `#lobby-side` holds the seat
       detail and the command row, and it is `display: contents` in portrait —
       so the detail card and the Ready bar flow as the column's own children,
       exactly as three stacked siblings would — and a real box in landscape,
       where it stands up as a rail beside the roster. Nothing about which
       arrangement is in force is decided in script; the viewport decides it,
       in the one `@media (orientation: landscape)` block at the end of this
       section. That is why the orientation `render()` used to compute and
       write onto #console-container is gone: a script-written attribute is a
       second answer to a question the browser already answers. */
    #lobby-body {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      gap: var(--space-5); padding-top: var(--space-4);
    }
    #lobby-side { display: contents; }

    /* Station list */
    #station-list { flex: 1; overflow-y: auto; display: flex;
      flex-direction: column; gap: var(--space-3); }
    #claimed-station-help { flex: 1; min-height: 0; min-width: 0; overflow-y: auto;
      padding: var(--space-3); }
    #claimed-station-help[hidden] { display: none; }

    /* ── Station roster ──────────────────────────────────────────────────
       The artboard's `.st` row. Every value is the rung issue #1357's mapping
       table gives for the ROLE the artboard's hex is playing, not the nearest
       colour by eye:

         row fill      #0b0e14 → --surface-card
         row border    #22262d → --edge. That hex's own rung is
                       --surface-lift, which is a SURFACE; a row's boundary is
                       a content divider, and --edge is the divider rung.
         held row      #2a8a96 → --cyan, the accent BOUNDARY, kept distinct
                       from --signal, the accent FOREGROUND (the name, the
                       glyph). The table draws that line explicitly.
         station name  #d8e2ff → --ink, for the reason #1369 gave the ship
                       name: the artboard's near-white has no rung, and
                       inventing one would be a palette change.
         job line      #8f99a4 → --ink-dim
         holder name   #6a727b → --ink-faint, NOT --edge-strong, which is what
                       that hex maps to as a stroke: this is text and has to
                       clear the 4.5 floor. It is somebody ELSE's name, so it
                       is deliberately not accent-coloured any more.
         blocked seat  #d8a040 → --reloading

       The artboard's 8px row chamfer has no rung — the vocabulary's chamfers
       are 0.22/0.34/0.875rem — so the rows and their controls take
       --control-cham-md, the control family's own chamfer, rather than a
       fourth size invented here. Same for the 6px on the row buttons. */
    .station-row {
      display: flex; align-items: center; gap: var(--space-5);
      padding: var(--space-4) var(--space-5);
      /* The list is a flex COLUMN, and a flex item shrinks below its content
         by default — which crops the holder's name and the private reason off
         the bottom of a row rather than scrolling the list. */
      flex-shrink: 0;
      min-height: calc(var(--control-hit-min) + var(--space-7));
      background: var(--surface-card); border: 1px solid var(--edge);
      transition: border-color .2s, background .2s;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md));
    }
    .station-row.mine { border-color: var(--cyan); background: var(--cyan-deep); }
    .station-row.taken { opacity: 0.7; }
    /* A free seat blocked by this player's private accessibility profile
       (issue #1103 AC1). The artboard's blocked ground (#17130a) has no rung,
       so the row keeps its own surface and says "blocked" with the amber
       boundary and the inline reason instead of a fill this file would have
       had to invent. */
    .station-row.ineligible { border-color: var(--reloading-dim); opacity: 0.8; }
    .station-row .glyph {
      width: calc(var(--control-hit-min) - var(--space-3));
      height: calc(var(--control-hit-min) - var(--space-3));
      flex: 0 0 calc(var(--control-hit-min) - var(--space-3));
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-tight);
      background: var(--surface-panel); color: var(--ink-faint);
      border: 1px solid var(--edge);
      clip-path: polygon(
        var(--control-cham-sm) 0, 100% 0,
        100% calc(100% - var(--control-cham-sm)),
        calc(100% - var(--control-cham-sm)) 100%, 0 100%, 0 var(--control-cham-sm));
    }
    .station-row.mine .glyph { border-color: var(--cyan); color: var(--signal); }
    .station-row .info { flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: var(--space-1); }
    .station-row .info .name {
      font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600;
      letter-spacing: var(--tracking); text-transform: uppercase; color: var(--ink);
    }
    .station-row.mine .info .name { color: var(--signal); }
    .station-row .info .meta { font-size: var(--text-xs); color: var(--ink-faint);
      display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
    /* The seat's rank, beside the console chip (issue #1370 AC1). */
    .station-row .info .meta .rank { font-family: var(--font-mono); font-weight: 500;
      letter-spacing: var(--tracking); }
    .station-row .info .meta .cons { padding: var(--space-1) var(--space-3);
      border: 1px solid var(--surface-ridge); white-space: nowrap;
      font-family: var(--font-mono); font-size: var(--text-xs);
      letter-spacing: var(--tracking); text-transform: uppercase; color: var(--ink-dim); }
    /* What the seat does, read before it is claimed (PRD #1023 module 4).
       --ink-dim rather than --ink-faint: this is copy meant to be read at
       arm's length, not a de-emphasised label. */
    .station-row .info .desc { font-size: var(--text-sm); color: var(--ink-dim);
      line-height: 1.4; }
    .station-row .info .occupant { font-family: var(--font-display);
      font-size: var(--text-sm); font-weight: 600;
      letter-spacing: var(--tracking-tight); color: var(--ink-faint); }
    /* The private functional reason. Local-only, and rendered on a FREE seat
       this viewer could otherwise take and on nothing else — the renderer
       decides that (issue #1369); this only paints it. */
    .station-row .info .ineligible-reason { font-size: var(--text-sm);
      color: var(--reloading); line-height: 1.4; font-style: italic; }
    .station-row .action { flex-shrink: 0; }
    .station-row .action button {
      min-height: var(--control-hit-min); padding: 0 var(--space-6);
      display: inline-flex; align-items: center; justify-content: center;
      width: auto; margin: 0; text-align: center; cursor: pointer;
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      border: 1px solid; border-radius: 0; transition: background .15s;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md));
    }
    .station-row .action .claim-btn { background: var(--surface-raised); color: var(--signal);
      border-color: var(--cyan); }
    .station-row .action .claim-btn:hover { background: var(--cyan-dim); }
    .station-row .action .mine-btn { background: var(--cyan-deep); color: var(--signal);
      border-color: var(--cyan); }
    /* --surface-panel, not --surface-card: the ROW is --surface-card, and a
       disarmed control the same colour as the card it sits on stops reading as
       a control at all. One rung up keeps its silhouette. */
    .station-row .action .taken-btn { background: var(--surface-panel); color: var(--ink-faint);
      border-color: var(--edge-control); cursor: default; }
    .station-row .action .ineligible-btn { background: var(--surface-panel); color: var(--ink-faint);
      border-color: var(--reloading-dim); cursor: not-allowed; }

    /* ── At-your-station detail ──────────────────────────────────────────
       The artboard's `.detail` card: a card in BOTH orientations, where the
       artboard hides it in portrait. It is not decoration — it carries the
       console chips, the complexity ladder and the LEAVE control, so hiding
       it on a phone held upright would take three functions away from the
       orientation most players hold. It moves; it does not vanish. */
    #detail-panel {
      flex-shrink: 0; display: flex; flex-direction: column; gap: var(--space-4);
      padding: var(--space-5); background: var(--surface-card);
      border: 1px solid var(--edge); transition: opacity .3s ease;
      clip-path: polygon(
        var(--cham-panel) 0, 100% 0,
        100% calc(100% - var(--cham-panel)),
        calc(100% - var(--cham-panel)) 100%, 0 100%, 0 var(--cham-panel));
    }
    #detail-panel.idle { opacity: 0.4; border-style: dashed; }
    #detail-panel .detail-header { display: flex; align-items: center;
      justify-content: space-between; gap: var(--space-4); }
    #detail-panel .detail-station-name { min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600;
      letter-spacing: var(--tracking); color: var(--ink-faint); }
    #detail-panel.active .detail-station-name { color: var(--signal); }
    #detail-panel .detail-station-desc:empty { display: none; }
    #detail-panel .detail-station-desc { font-size: var(--text-sm); color: var(--ink-dim);
      margin: 0; line-height: 1.4; }
    #detail-panel .detail-consoles { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    #detail-panel .detail-consoles .chip { min-height: var(--control-hit-min);
      padding: 0 var(--space-4); display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer;
      font-family: var(--font-mono); font-size: var(--text-xs);
      letter-spacing: var(--tracking); text-transform: uppercase;
      background: var(--surface-panel); color: var(--ink-dim);
      /* --edge-strong, not the SURFACE rung --surface-ridge (1.57:1 here):
         the chip is a tappable control, so its boundary is on the control
         ladder, and --edge-strong is that ladder's --surface-panel rung
         (3.68:1). Same error the row border above is commented against. */
      border: 1px solid var(--edge-strong); border-radius: 0;
      transition: background .15s, border-color .15s, color .15s;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md)); }
    #detail-panel .detail-consoles .chip:hover { border-color: var(--cyan); color: var(--signal); }
    #detail-panel .detail-consoles .chip.selected { background: var(--cyan-deep);
      border-color: var(--cyan); color: var(--signal); }
    #detail-panel .detail-ratings { display: flex; gap: var(--space-1); flex-wrap: wrap; }
    #detail-panel .detail-ratings .rating-btn { min-height: var(--control-hit-min);
      padding: 0 var(--space-5); display: inline-flex; align-items: center;
      justify-content: center; width: auto; margin: 0; cursor: pointer;
      font-family: var(--font-display); font-size: var(--text-xs); font-weight: 500;
      letter-spacing: var(--tracking-tight);
      background: var(--surface-panel); color: var(--ink-faint);
      /* --edge-strong: the ladder's --surface-panel rung, 3.68:1. The
         inactive rating is an ENABLED control — it is how the ladder is set —
         so 1.4.11 applies, and --edge-control measures 2.77 on this fill. */
      border: 1px solid var(--edge-strong); border-radius: 0;
      transition: background .15s, border-color .15s;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md)); }
    #detail-panel .detail-ratings .rating-btn.active { background: var(--cyan-deep);
      border-color: var(--cyan); color: var(--signal); }
    /* LEAVE: the row's RELEASE under another resting label, sharing its one
       arm→confirm handler (#771 AC3/AC4). --fire, not --fire-hot: the
       artboard's #e14330 is the danger-red RUNG, and --fire-hot is reserved
       for the red-alert bezel. The artboard's #6c1a14 boundary is 1.4:1 and
       would fail WCAG 1.4.11 on a control, so the border takes --fire too. */
    #detail-panel .detail-release-btn { min-height: var(--control-hit-min);
      padding: 0 var(--space-5); display: inline-flex; align-items: center;
      justify-content: center; width: auto; margin: 0; flex-shrink: 0; cursor: pointer;
      font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 700;
      letter-spacing: var(--tracking-wide); text-transform: uppercase;
      border: 1px solid var(--fire); background: transparent; color: var(--fire);
      border-radius: 0; transition: background .15s;
      clip-path: polygon(
        var(--control-cham-md) 0, 100% 0,
        100% calc(100% - var(--control-cham-md)),
        calc(100% - var(--control-cham-md)) 100%, 0 100%, 0 var(--control-cham-md)); }
    #detail-panel .detail-release-btn:hover { background: rgba(var(--rgb-fire), 0.1); }

    /* ── Lobby command row ───────────────────────────────────────────────
       Ready, Spectate and the status line. The artboard puts the status line
       UNDER the Ready bar in both frames, while a screen reader should hear
       the connection state BEFORE the control it gates — so #status-line is
       first in the markup and painted last with `order`.

       That is the only box `order` moves here, and deliberately: the status
       line is a <span> with no tab stop, so repainting it costs no focus
       order. The two BUTTONS take their painted order from the markup instead
       (Ready, then Spectate), because `order` does not carry a tab stop with
       the box it moves — ordering focusable controls against their paint
       order is what WCAG 2.4.3 forbids, and it is what `order: 1` and
       `order: 2` did here. */
    #lobby-footer { flex-shrink: 0; display: flex; flex-wrap: wrap;
      align-items: center; gap: var(--space-4); }
    #status-line { order: 3; flex: 1 0 100%;
      font-size: var(--text-xs); color: var(--ink-faint); }
    #ready-btn { flex: 1 1 auto;
      min-height: var(--control-hit-min);
      height: calc(var(--control-hit-min) + var(--space-5));
      padding: 0 var(--space-6); display: none; width: auto; margin: 0;
      text-align: center; cursor: pointer;
      font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700;

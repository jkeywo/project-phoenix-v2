      tests: [cargo test]

  - component: tactical-ai-weapon-operator
    core:
      status: implemented
      confidence: confirmed
      title: Tactical AI Weapon Operator
      summary: Uses scored Destroy objectives and fine-system availability to select and track targets, and issue arc-bearing coordination when a usable family lacks arc; firing decisions for individual weapon families live in separate decide/apply AI systems that read the resulting target.
      rationale:
        - "Issue #694 removed the torpedo-firing block that used to run inline inside this operator (operate_tactical_ai). Torpedo auto-fire now lives in torpedo-auto-fire-ai (ai_torpedo_auto_fire in src/console_ai/server.rs). Issue #697 then split target selection itself into ai_target_selection (decide, writes WeaponsBlackboard.locked_target) and operate_tactical_ai (apply, writes WeaponsTarget), and issue #698 split phaser firing the same way into phaser-auto-fire-ai. Issue #700 deleted operate_tactical_ai: with every other responsibility rehomed, the remaining glue was folded back into ai_target_selection, which now gates on any_tactical_system_operates_ai (any tactical fine system's own operate_ai policy — the dead coarse tactical fallback was deleted by #801), publishes its choice to WeaponsBlackboard.locked_target as observable intent, and applies the same choice to WeaponsTarget in one system. Selection could not be separated from application by a sim set the way the other AI decide/apply pairs are — every WeaponsTarget reader runs in SimSet::Input — so keeping them in one system is what makes the AI's read-modify-write atomic against handle_set_target, the other Input writer of WeaponsTarget."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [scored-objective-pool-state, weapons-target-state, system-control-source-state, authoritative-damage-state]
      writes: [weapons-target-state]
      coordinates: [coordination-lag-router]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, src/ai/core.rs]
      symbols: [ai_target_selection]
      tests: [cargo test]

  - component: torpedo-auto-fire-ai
    core:
      status: implemented
      confidence: confirmed
      title: Torpedo Auto-Fire AI
      summary: AI decide system that selects loaded, in-arc torpedo tubes to fire and emits the FireTorpedo command through the shared admission seam (issue #846). The paired consumer (handle_fire_torpedo) reads each ship's AdmittedCommands in SimSet::Physics and launches via TorpedoSystem::launch.
      rationale:
        - "Issue #694 replaced the old fused torpedo-firing block formerly inline in operate_tactical_ai. ai_torpedo_auto_fire decides which tubes to fire; issue #846 retired TorpedoIntents and made the AI emit FireTorpedo through emit_ai_command, the same seam human ControlSystem messages travel. The consumer handle_fire_torpedo reads AdmittedCommands over per-ship Query<With<Ship>>."
        - Gated on AiHighFidelity plus a dedicated torpedo_magazine_system_id() operate_ai policy, distinct from the per-fine-system Tactical gate that governs target selection.
        - "Issue #698 promoted this from preliminary to full: the target_locked and target_shields inputs to the pure auto_fire_torpedo decision were hardcoded to true/0, and now read real state — target_locked from the Combat Lock resolving to a live entity, target_shields from the sum of the target's online ShipShields facings. Targets without ShipShields (asteroids, debris) read 0 and stay torpedo-eligible."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [weapons-target-state, torpedo-state, system-control-source-state]
      writes: [torpedo-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/console_ai/core.rs, src/console/weapons/mod.rs]
      symbols: [ai_torpedo_auto_fire, auto_fire_torpedo]
      tests: [cargo test]

  - component: phaser-auto-fire-ai
    core:
      status: implemented
      confidence: confirmed
      title: Phaser Auto-Fire AI
      summary: AI decide system that picks an off-cooldown, in-auto-arc phaser bank to fire and emits FirePhaser through the shared admission seam (issue #846). The paired consumer (handle_fire_phaser) reads each ship's AdmittedCommands in SimSet::Physics and activates ActiveBeam.
      rationale:
        - "Issue #698 split the former fused tick_phaser_auto_fire into ai_phaser_auto_fire (decide) and integrate_weapons_state (apply). Issue #846 retired both PhaserIntents and integrate_weapons_state: the decider now emits FirePhaser through emit_ai_command, and handle_fire_phaser reads AdmittedCommands directly."
        - "Gated on any_bank_operates_ai (per-bank phaser_bank_system_id() operate_ai policy; a ship declaring no fine banks has no bank that can be AI-operated — the dead coarse tactical fallback was deleted by #801), OR the LocalShip's CurrentPhaserMode::Auto toggle. Per-bank policy is re-checked when choosing which bank fires, so one offline bank does not disarm the others."
        - "Deliberately NOT gated on AiHighFidelity, unlike ai_torpedo_auto_fire: low-LOD NPCs must keep firing phasers, and the CurrentPhaserMode::Auto leg is a human console toggle rather than AI at all."
    architecture:
      kind: ai-controller
      authority: authoritative
      reads: [weapons-target-state, system-control-source-state]
      writes: [weapons-target-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs]
      symbols: [ai_phaser_auto_fire]
      tests: [cargo test]
  - component: tactical-weapons-controls
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Weapons Controls
      summary: Tactical player and Backfill controls select a target, fire configured phaser, blaster, and torpedo banks, and manage phaser mode and torpedo tubes through admitted ControlSystem commands.
      rationale:
        - "Every wire target names a declared system since #801: SetTarget targets the tactical-radar system, and SetPhaserMode / SetPhaserFrequency target the new declared phaser-control system (a single system owning the ship-wide firing mode and emitter frequency; the data model is unchanged). The coarse tactical system is deleted — \"tactical\" survives only as a station id keying the Weapons console blackboard and coordination routing."
    architecture:
      kind: control-interface
      authority: authoritative
      owns: [weapons-target-state]
      produces: [weapons-target-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/mod.rs, gui/action-map.js]
      symbols: [handle_set_target, handle_fire_phaser, handle_fire_torpedo]
      tests: [cargo test, npx vitest run]

  - state: weapons-target-state
    core:
      status: implemented
      confidence: confirmed
      title: Tactical Radar Selection State
      summary: Authoritative Combat Lock owned by the tactical radar. Written only by handle_set_target and ai_target_selection (and cleared by beam/torpedo kill-clears + faction-change revalidation); read only by the tactical-radar publisher (issue #829) — no other module imports the component.
      rationale:
        - "Issue #829 renamed WeaponsTarget to TacticalRadarSelection and made target authority radar-owned. Cross-system consumers — including the firing paths (handle_fire_phaser, ai_phaser_auto_fire, ai_torpedo_auto_fire, blaster fire, tick_npc_auto_match_frequency, tick_weapons_arc_request) — read the FROZEN viewscreen combat_lock (viewscreen-target-facts-state), never this live selection (spec §1/§3). One-tick lag at 30Hz is accepted, including for firing."
        - "Spec-compliance follow-up: the Weapons publishers (publish_weapons_core_blackboard, publish_phaser_bank_blackboards) and compute_current_weapons_update were the last live readers and now read combat_lock too. WeaponsBlackboard.target_uuid is therefore the frozen Combat Lock, liveness-filtered. It is deliberately NOT merged with locked_target: target_uuid is applied truth, locked_target is Tactical-AI intent and stays None on a human-operated Tactical, which is how the wire distinguishes an AI lock from a human's."
    architecture:
      classification: authoritative
      owner: tactical-weapons-controls
      writers: [tactical-weapons-controls]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/console/weapons/beam.rs]
      symbols: [TacticalRadarSelection]
      tests: [cargo test]


  - component: roadmap-ship-customisation
    core:
      status: proposed
      confidence: confirmed
      title: Ship Customisation — Per-Station Materiel Loadout
      summary: "Per-station MATERIEL customisation — the crew chooses WHAT systems the ship carries, not how it is operated — spanning bands E (MVP) and F (flesh-out), the two post-demo bands that add no new hull. Customise, not upgrade: every option is a net-neutral sidegrade, the sole sanctioned power increase being a mission-authored starbase reactor reward (band F). The budget is SOFT, denominated in the roadmap-broken-tithe-foundation supply/demand power model — nothing is rejected in the lobby; over-fitting is self-limiting at run time (more per-component demand drains the battery toward the exhaustion lock sooner, and overpowered components overheat offline-to-cool). Every system draws power so every station can customise under one currency; the reactor is itself a customisable component ({generation, battery, recovery, dissipation} profile). Authority: the station's lobby CLAIMANT owns its loadout section, unclaimed/AI-backfilled stations fly the hull's authored default (what the Backfill AI already flies), and the loadout is FROZEN AT SPAWN into one deterministic template that rides the initial-state hash like ship selection, refittable only at a starbase. E MVP: a variant-swap tracer built on the delivered #869/#911 fragment composition (each customisable system ships as N balanced variant fragments; lobby choice = which composes in) — NO new data primitive — for ONE hull on TWO axes (reactor profile + one Tactical combat variant), landing AFTER #922 closes the base hulls, with variants authored net-neutral and proven by the #835 seeded duel harness. F flesh-out: typed+sized MOUNTS (the genuinely new primitive — mount topology plus validator) with empty/optional slots, reactor profiles and variant breadth fleet-wide, and the starbase refit/reward path (needs a mid-sim refit command and campaign persistence #863/#867)."
      rationale:
        - "Settled in a 2026-08-17 grill from ~/Downloads/custom-ship-report.md (EVE/Starsector/Endless Sky/EmptyEpsilon survey). It is the platform capability for E and F specifically because those bands add no new hull, so the 'one capability per band' cadence needs a feature to carry."
        - "It is a HARD CONSUMER of the band-D power redesign, and in fact forced that redesign's scope: soft-budget sidegrades are impossible on the boost/amplifier power model, where a stronger component costs nothing extra to run and is therefore a strict upgrade. See roadmap-broken-tithe-foundation."
        - "The MVP is deliberately a tracer bullet against band E's own purpose: E is the full-matrix balance-closure band (#922), and a fit budget multiplies the matchup matrix, so the MVP is scoped to one hull and layered AFTER base closure, with the duel harness — not playtest — the guard that no variant dominates. Reactor-plus-one-combat-axis is the smallest slice that exercises both the soft-budget mechanic and a player-visible loadout choice."
        - "Staging the mount primitive into F keeps the new-data-model cost out of the balance-heavy band: E reuses fragment composition wholesale and introduces no schema. A non-blocking lobby sustainability meter (sustained vs peak draw vs reactor) belongs in E's polish PRD so the soft budget is legible."
        - "The campaign/skirmish split that protects closed balance is by AUTHORING, not a mode toggle: only campaign scenarios author starbase upgrade rewards, so skirmish and versus stay fixed-budget sidegrade forever."
        - "Recommended tracer hull is the battleship (the band-D power-network hull, biggest reactor, where profiles matter most); the destroyer is the alternative as the most-onboarded hull. Not yet John-confirmed."

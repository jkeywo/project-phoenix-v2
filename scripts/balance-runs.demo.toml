# Demo balance regression harness (issue #915): the Alliance Destroyer
# (Backfill-crewed, side-A slot 1 of the duel harness) versus each combat_test
# enemy class, on fixed seeds. Composes the #835 machinery — duel transform,
# batch runner, AAR reports — into the standing report the tuning pass consumes.
#
#   npm run balance:demo
#     = cargo build --release --features headless --bin phoenix-headless
#       && node scripts/balance-runs.mjs scripts/balance-runs.demo.toml --out .balance-out
#
# Outputs (keep .balance-out/ out of git): merged.json (per-matchup win/loss,
# TTK, damage margins, doctrine-phase occupancy, recorded threshold results),
# summary.md (the same as markdown), and runs/<matchup>-seed<N>.json — each
# run's full AAR report, byte-identical across reruns of the same seed.
#
# CI runs exactly this config in the non-gating `balance` job and uploads the
# output directory as the `balance-report` artifact.
#
# Do not retune seeds/sim_seconds to chase a result — successive reports are
# only comparable while they agree. For exploratory sweeps copy
# scripts/balance-runs.example.toml instead.

seeds       = [1, 2, 3, 4, 5]            # fixed, so every report is replayable run-for-run
sim_seconds = 120                        # long enough for a decision in every pair

world       = "assets/worlds/duel.toml"

# ── Recorded thresholds (non-gating) ─────────────────────────────────────────
# Evaluated against the merged summary and RECORDED in merged.json/summary.md;
# they never fail the run. Promote to a gate only once the numbers have been
# stable across enough reports to mean regression rather than noise.
# Global: a run that crashes or hangs is always worth a look.
[thresholds]
max_failures = 0

# ── The demo matchups: destroyer vs each combat_test enemy class ─────────────
# Side A resolves `destroyer` → assets/entities/alliance_destroyer.toml; the
# LocalShip is Backfill-crewed by the headless runner. Side B names resolve to
# the ship_harrow_* hulls combat_test fields. The per-matchup thresholds record
# the FIRST observed batch (seeds 1-5, sim_seconds 120) with headroom for seed
# noise — re-record them alongside any accepted balance change that moves them.

# Mirror-weight duel: RESOLVES for the first time. 5/5 kills at a 31.8 s TTK,
# margin +186. The deadlock was never a manoeuvring problem — it was the Harrow
# destroyer's 900-point hull, which needed over three times the sim budget to
# burn through. The durability ladder (900 -> 200) fixed it; the turn boost,
# swept 0.5 -> 1.8, had moved nothing.
#
# The margin threshold is unchanged and still the right guard: it is what
# catches the destroyer starting to LOSE a duel it is meant to win.
[[matchup]]
name   = "destroyer_vs_harrow_destroyer"
side_a = ["destroyer"]
side_b = ["ship_harrow_destroyer"]
  [matchup.thresholds]
  min_damage_margin = 100.0

# The destroyer sweeps the cruiser: 5/5 wins, TTK median 14.6 s (the cruiser
# came DOWN 420 -> 300 on the ladder). Historically the binding constraint on
# the destroyer's blaster damage — see the floor note in
# assets/entities/alliance_destroyer.toml — though the ladder has loosened it.
[[matchup]]
name   = "destroyer_vs_harrow_cruiser"
side_a = ["destroyer"]
side_b = ["ship_harrow_cruiser"]
  [matchup.thresholds]
  min_win_rate   = 1.0
  max_ttk_median = 30.0

# THE PATROL DUEL IS A COIN FLIP, AND FIVE SEEDS CANNOT MEASURE IT.
#
# Measured over 25 seeds it sits at a 56% win rate with a +73 margin and a 36.1 s
# median. On these five it lands wherever it lands — the same build has shown
# 3/5 and 4/5 without a single value changing between the runs. Do not read a
# movement in this row as a regression; re-measure with more seeds first.
#
# That is a deliberate design position, not a hull that got away from us: hull
# 120 -> 300 on the ladder plus blaster 20 -> 16 turned a 9.3 s fly-past into a
# near-even engagement, and 16 is the top of the band that stays near-even (17
# is a guaranteed 25/25 sweep — there is nothing in between).
#
# So `min_win_rate` is a REGRESSION FLOOR, not a description: 0.4 is two of five
# and sits far enough below the true 56% to survive seed noise while still
# catching a destroyer that has genuinely stopped competing. `max_ttk_median` 45
# covers the same spread.
[[matchup]]
name   = "destroyer_vs_harrow_patrol"
side_a = ["destroyer"]
side_b = ["ship_harrow_patrol"]
  [matchup.thresholds]
  min_win_rate   = 0.4
  max_ttk_median = 45.0

# The warhawk battleship wins on weight of fire: 0/5, margin -239 after the
# ladder took it 280 -> 400 (it now correctly tops the Dynasty ladder). The floor
# is RE-RECORDED -200 -> -300: the old one was set against a lighter warhawk and
# the loss is deeper by design. A destroyer that starts BEATING it — or getting
# crushed far harder still — is worth a look.
[[matchup]]
name   = "destroyer_vs_harrow_warhawk"
side_a = ["destroyer"]
side_b = ["ship_harrow_warhawk"]
  [matchup.thresholds]
  max_win_rate      = 0.0
  min_damage_margin = -300.0

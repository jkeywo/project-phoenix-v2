entities:
  - component: asset-manifest-discovery
    core:
      status: implemented
      confidence: confirmed
      title: Asset Manifest Discovery
      summary: Discovers renderable models, radar icons, model-rig sidecars, nested entity templates, and loadable sub-world assets from selected world content, in two phases — an initial recursive walk from entity templates, then an incremental expansion of each sidecar's own [[lod]] chain as it lands.
    architecture:
      kind: asset-discovery-service
      authority: authoritative
      owns: [asset-manifest-state]
      reads: [world-configuration-state, entity-template-state]
      produces: [asset-manifest-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/world/config.rs, src/entities/config.rs]
      tests: [cargo test]

  - state: asset-manifest-state
    core:
      status: implemented
      confidence: confirmed
      title: Asset Manifest State
      summary: Host-local discovered GLB model, radar-icon, sidecar, and sub-world paths needed before a selected scenario starts, grown incrementally as each delivered sidecar's own [[lod]] chain is discovered and folded in.
    architecture:
      classification: local
      owner: asset-manifest-discovery
      writers: [asset-manifest-discovery]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs]

  - component: host-asset-preloader
    core:
      status: implemented
      confidence: confirmed
      title: Host Asset Preloader
      summary: Loads the discovered manifest, broadcasts loading start and progress, gates engage through the Loading phase, and automatically transitions to InProgress once all required assets are ready.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      owns: [asset-loading-state]
      reads: [asset-manifest-state, game-phase-state]
      writes: [game-phase-state]
      produces: [asset-loading-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/core/messages.rs]
      tests: [cargo test]

  - state: asset-loading-state
    core:
      status: implemented
      confidence: confirmed
      title: Asset Loading State
      summary: Host asset readiness and client-facing fraction used by the Loading surface; it is presentation readiness rather than gameplay authority.
    architecture:
      classification: authoritative
      owner: host-asset-preloader
      writers: [host-asset-preloader]
      replicas: [client-presentation-state]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/core/messages.rs]
      symbols: [AssetPreloadResource]

  - component: model-rig-and-marker-loader
    core:
      status: implemented
      confidence: confirmed
      title: Model Rig and Marker Loader
      summary: Resolves each spawned entity's primary authored model sidecar into renderer-independent authoritative marker and target geometry. Every authoritative profile preloads those primary sidecars and binds their exact bytes into frozen content identity before mission start; an unresolved live entity holds the fixed clock until an immediate simulation-side sync can attach its canonical state. Entity rendering and active GLB, procedural, or billboard LOD tiers consume it but never replace or remove it.
      rationale:
        - "One exclusive synchronization invocation resolves each exact sidecar path at most once for its candidate batch, reusing marker geometry while applying each entity's own authored transform immediately in the original candidate order. The temporary lookup is discarded on return, including pending and identity-fallback results. Later invocations therefore retry WASM delivery and observe changed native sidecar content for new entities without a persistent cache or invalidation protocol. PreUpdate/FixedLast registration and fixed-clock readiness remain unchanged."
    architecture:
      kind: model-loader
      authority: authoritative
      owns: [model-marker-runtime-state, model-rig-readiness-state]
      reads: [entity-template-state, spawned-entity-state]
      produces: [model-marker-runtime-state, model-rig-readiness-state]
      runs_in: [host-browser-runtime, headless-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/model_rig.rs, src/entities/config_cache.rs, src/entities/loader.rs, src/server_app/registration.rs, src/lockstep/mod.rs, src/lobby/server.rs, src/server/viewscreen_border.rs, src/server/bridge.rs, server.html]
      symbols: [ModelRigReadiness, primary_sidecar_path, sync_authoritative_model_markers, wasm_push_sidecar_toml, gate_lockstep_ticks]
      tests: [cargo test]

  - state: model-rig-readiness-state
    core:
      status: implemented
      confidence: confirmed
      title: Model Rig Readiness State
      summary: Peer-local asynchronous delivery bookkeeping for primary authored rig sidecars and the narrow virtual-clock hold while a live entity lacks resolved canonical geometry. Delivery frame and pending-set order are not simulation state; the frozen sidecar bytes and resulting ModelMarkers are authoritative instead.
    architecture:
      classification: local
      owner: model-rig-and-marker-loader
      writers: [model-rig-and-marker-loader]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/config_cache.rs, src/server_app/registration.rs, src/lockstep/mod.rs]
      symbols: [ModelRigReadiness, sync_authoritative_model_markers, gate_lockstep_ticks]

  - state: model-marker-runtime-state
    core:
      status: implemented
      confidence: confirmed
      title: Model Marker Runtime State
      summary: Resolved per-entity marker and target geometry from the primary authored rig, used for camera placement, authoritative weapon origins and target points, and read-only presentation attachments. Active presentation/LOD state cannot mutate it.
    architecture:
      classification: authoritative
      owner: model-rig-and-marker-loader
      writers: [model-rig-and-marker-loader]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/model_rig.rs]
      symbols: [ModelRig, ModelMarkers]

  - component: host-presentation-effects
    core:
      status: implemented
      confidence: confirmed
      title: Host Presentation Effects
      summary: Renders configured forward-only engine trails (including marker-attached roll and uniform scale), phaser beams, torpedo and blaster effects, explosions, dust, nebula particles, star visuals, and viewscreen alert effects from authoritative events and entities.
    architecture:
      kind: presentation-effects
      authority: derived
      reads: [spawned-entity-state, model-marker-runtime-state, authoritative-ship-motion-state]
      renders: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/pfx.rs, src/server/renderer.rs, src/server/viewscreen_border.rs, src/entities/star.rs]
      tests: [cargo test]

  - component: client-audio-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Client Audio Presentation
      summary: Local browser playback for UI interaction, engine ambience, background hum, and Red Alert siren assets, controlled by local settings rather than simulation authority.
    architecture:
      kind: client-presentation
      authority: local
      reads: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/settings-panel.js, assets/sounds]

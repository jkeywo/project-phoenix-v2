[base]
offset = [ 0, -2.1994811978755253, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 4.20851721476356, 4.20851721476356, 4.20851721476356 ]

[extents]
min = [ -4, -2.2070883559469974, -2.4205136798251896 ]

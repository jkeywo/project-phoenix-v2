<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.science.doc_title">Project Phoenix — Science Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    /* The scope is square by gui/console.css's one `.scope-cell` rule
       (issue #1375). It used to be a `flex: 1` box sharing the column with the
       readouts, which stretched the circle's own square cell into a letterbox
       — the one scope in the fleet that was not square at all.

       A column that holds a square measures what is left over honestly instead
       of handing the panel below it a zero basis. The square no longer shares
       the leftover height: it is `flex-shrink: 0` with an intrinsic side, so at
       812x375 the h2 plus the readout plus the square already fill the 333px
       column and `flex: 1` (a flex-basis of 0) left ph-sensor-panel laid out
       full width and zero tall — invisible, unreachable, and with nothing for
       the column's `overflow-y: auto` to scroll to, since a zero-height element
       adds nothing to scroll past. Content-sized it measures its own ~52px
       and the overflow scrolls, exactly as destroyer/captain's command column
       does for the same reason. The shields column holds no square, so it
       still shares out what is left over. */
    ph-shield-panel, ph-shield-facings { flex: 1; min-height: 0; }
    ph-sensor-panel { flex: 0 0 auto; }
    /* Compact threat-bearing readout (issue #926) — same standing fact the
       battleship's dedicated Shields console shows, condensed to one line
       for this column's tighter layout. Hidden when Sensors holds no threat. */
    .threat-readout { display: flex; justify-content: space-between; gap: 8px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); padding: 0 0 8px; flex-shrink: 0; visibility: hidden; }
    .threat-readout.active { visibility: visible; }
    .threat-readout strong { color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-md); }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .col { padding: 8px; } }
    @media (orientation: landscape) { .console-body .col:first-child { border-right: none; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Science Console" data-i18n-attr="data-screen-label:console.science.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The locked target
           the footer named heads the sensors column it belongs to. -->
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.science.sensors">Sensors</h2>
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="science-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <div class="scope-cell">
            <ph-sensor-radar id="sensor-radar"></ph-sensor-radar>
          </div>
          <ph-sensor-panel id="sensor-panel"></ph-sensor-panel>
        </div>
        <div class="col">
          <h2 data-i18n="console.science.shields">Shields</h2>
          <div class="threat-readout" id="threat-row"><span data-i18n="console.shields.threat_bearing">Threat Bearing</span><strong id="threat-bearing">—</strong></div>
          <ph-shield-panel id="shield-panel"></ph-shield-panel>
          <ph-shield-facings id="shield-facings"></ph-shield-facings>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-sensor-radar.js';
    import '../components/ph-sensor-panel.js';
    import '../components/ph-shield-panel.js';
    import '../components/ph-shield-facings.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/cruiser/science.console.js (issue #1235): the
    // shared Science renderer + this hull's variant (Sensors + Shields, no
    // bespoke tail). s is a SystemStationConsolePayload — see the @typedef
    // in gui/console-state.js. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './science.console.js';
    initConsole({ name: 'science', render: renderStation });
  </script>
</body>
</html>

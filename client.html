<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Project Phoenix — Console</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0a0a1a; color: #cce; font-family: monospace; }
    body { padding: 1rem; box-sizing: border-box; }
    h2 { margin: 0 0 1rem; color: #8af; }
    label { display: block; margin-bottom: 1rem; }
    input[type="text"] { display: block; width: 100%; box-sizing: border-box;
      background: #111; color: #eef; border: 1px solid #446; padding: 0.5rem; margin-top: 0.25rem; }
    button { display: block; width: 100%; background: #224; color: #eef;
      border: 1px solid #446; padding: 0.75rem; margin: 0.4rem 0; cursor: pointer;
      font-family: monospace; font-size: 1rem; text-align: left; }
    button:active { background: #336; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.mine { border-color: #8af; color: #8af; }
    button.alert-on { background: #600; border-color: #f44; color: #faa; }
    #player-list { margin-top: 1rem; font-size: 0.85rem; color: #99b; }
    #player-list div { padding: 0.2rem 0; }
    #status { margin-top: 1.5rem; color: #778; font-size: 0.8rem; }
    section { display: none; }
    section.active { display: block; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem; font-family: monospace;
    }
    #conn-label { font-size: 0.75rem; color: #f44; }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #4c4; flex-shrink: 0; }
    #fullscreen-btn {
      display: inline; width: auto; background: none; border: none; color: #cce;
      font-size: 1.1rem; cursor: pointer; padding: 0; margin: 0; line-height: 1;
    }
    /* Red Alert border overlay on console container */
    #console-container {
      position: relative;
      border: 4px solid transparent;
      padding: 0.5rem;
      transition: border-color 0.15s;
    }
    #console-container.red-alert {
      border-color: #f44;
    }
    /* Console tab bar (only when player has 2+ consoles) */
    #console-tabs {
      display: none;
      gap: 0.4rem;
      margin: 0 0 0.75rem;
      border-bottom: 1px solid #336;
      padding-bottom: 0.5rem;
    }
    #console-tabs.active { display: flex; }
    #console-tabs button {
      flex: 1; margin: 0; padding: 0.6rem 0.4rem; font-size: 0.9rem;
      background: #112; border: 1px solid #336; color: #99b;
      border-radius: 4px 4px 0 0;
    }
    #console-tabs button.active {
      background: #224; border-color: #8af; color: #cce;
    }
    /* Helm console UI */
    #helm-ui { display: none; }
    #helm-ui.active { display: flex; }
    #helm-ui {
      position: fixed;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      pointer-events: none; /* allow non-control area to be inert */
      z-index: 5;
    }
    /* Landscape: right third */
    @media (orientation: landscape) {
      #helm-ui { top: 0; right: 0; width: 33.333vw; height: 100vh; }
    }
    /* Portrait: bottom third */
    @media (orientation: portrait) {
      #helm-ui { left: 0; bottom: 0; width: 100vw; height: 33.333vh; }
    }
    #helm-readout {
      position: absolute; top: 0.5rem; left: 0.5rem; right: 0.5rem;
      font-size: 0.75rem; color: #99b; text-align: center; pointer-events: none;
    }
    #helm-readout span { color: #8af; }
    #joystick-area {
      position: relative;
      background: radial-gradient(circle at center, #112 0%, #001 75%);
      border: 2px solid #336;
      border-radius: 50%;
      touch-action: none;
      pointer-events: auto;
      /* Square circular pad: limited by smaller of width/height of region */
      width: min(80%, 80vmin, 18rem);
      aspect-ratio: 1;
      max-height: 90%;
    }
    #joystick-area::before, #joystick-area::after {
      content: ""; position: absolute; background: rgba(136,170,255,0.15);
    }
    #joystick-area::before { left: 50%; top: 8%; bottom: 8%; width: 1px; transform: translateX(-50%); }
    #joystick-area::after  { top: 50%; left: 8%; right: 8%; height: 1px; transform: translateY(-50%); }
    #joystick-knob {
      width: 22%; height: 22%; background: #448; border: 2px solid #8af;
      border-radius: 50%; position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; transition: background 0.1s;
    }
    #joystick-knob.active { background: #66a; }
  </style>
</head>
<body>
  <h2 id="phase-title">Lobby</h2>

  <div id="console-container">
    <div id="console-tabs"></div>

    <section id="lobby-ui">
      <label>Name
        <input id="name-input" type="text" placeholder="Your name" autocomplete="off" />
      </label>
      <div id="console-list"></div>
      <button id="engage-btn">Engage</button>
      <div id="player-list"></div>
    </section>

    <section id="game-ui">
      <button id="red-alert-btn">Red Alert: OFF</button>
      <p id="game-status"></p>
    </section>

    <section id="helm-ui">
      <div id="joystick-area">
        <div id="helm-readout">
          Thrust <span id="thrust-value">0</span>%
          &nbsp;·&nbsp;
          Steering <span id="steering-value">0</span>%
        </div>
        <div id="joystick-knob"></div>
      </div>
    </section>
  </div>

  <div id="status">Connecting…</div>

  <div id="top-bar">
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
  </div>

  <script>
    // ── Connection status ───────────────────────────────────────

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = 'Disconnected — reconnecting…';
      } else if (state === 'error') {
        dot.style.background = '#f44';
        label.textContent = 'Error — refresh to retry';
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
      }
    }

    // ── Fullscreen controller ───────────────────────────────────

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    // ── Persistence ─────────────────────────────────────────────

    const RANKS = ['Ensign', 'Lieutenant', 'Commander', 'Captain', 'Admiral'];
    const STARS = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return RANKS[Math.floor(Math.random() * RANKS.length)] + ' ' +
             STARS[Math.floor(Math.random() * STARS.length)];
    }

    let myToken = localStorage.getItem('session-token');
    if (!myToken) {
      myToken = Array.from(crypto.getRandomValues(new Uint8Array(16)))
        .map(b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('session-token', myToken);
    }

    let myName = localStorage.getItem('player-name') || randomName();
    localStorage.setItem('player-name', myName);

    // ── State ───────────────────────────────────────────────────

    const state = { players: [], phase: 'Lobby', redAlert: false };
    let conn = null;
    /// Currently-active console tab during InProgress. Null until set.
    let activeConsole = null;

    // ── Helpers ─────────────────────────────────────────────────

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function myConsoles(s) {
      const m = me(s);
      return (m && Array.isArray(m.consoles)) ? m.consoles : [];
    }
    function hasConsole(s, c) { return myConsoles(s).includes(c); }
    function isCaptain(s)     { return hasConsole(s, 'CaptainChair'); }
    function isHelm(s)        { return hasConsole(s, 'Helm'); }

    /// Returns the consoles list for any player, normalising old single-console field.
    function consolesOf(p) {
      if (Array.isArray(p.consoles)) return p.consoles;
      return p.console ? [p.console] : [];
    }

    function send(type, data) {
      if (!conn || !conn.open) return;
      const msg = data !== undefined ? { type, data } : { type };
      conn.send(JSON.stringify(msg));
    }

    function setStatus(text) { $('status').textContent = text; }

    // ── Rendering ───────────────────────────────────────────────

    const CONSOLES = ['CaptainChair', 'Helm'];
    const CONSOLE_LABEL = {
      CaptainChair: 'Captain's Chair',
      Helm: 'Helm',
    };

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(state);
      });
    }

    function render(s) {
      const inGame = s.phase === 'InProgress';
      // Show the active console name in the header, or 'Lobby' / 'Bridge'
      if (!inGame) {
        $('phase-title').textContent = 'Lobby';
      } else if (activeConsole) {
        $('phase-title').textContent = CONSOLE_LABEL[activeConsole] || activeConsole;
      } else {
        $('phase-title').textContent = 'Bridge';
      }
      $('lobby-ui').className = inGame ? '' : 'active';

      // Reconcile activeConsole with current consoles list.
      const mine = myConsoles(s);
      if (inGame) {
        if (!activeConsole || !mine.includes(activeConsole)) {
          activeConsole = mine[0] || null;
        }
      } else {
        activeConsole = null;
      }

      // Console sections: only the active one is visible while in-game.
      $('game-ui').className = (inGame && activeConsole === 'CaptainChair') ? 'active' : '';
      $('helm-ui').className = (inGame && activeConsole === 'Helm') ? 'active' : '';

      // Tabs only appear when in-game with 2+ consoles.
      renderTabs(s, inGame);

      // Red Alert border overlay
      const container = $('console-container');
      if (s.redAlert) container.classList.add('red-alert');
      else container.classList.remove('red-alert');

      if (inGame) renderGame(s); else renderLobby(s);
    }

    function renderTabs(s, inGame) {
      const bar = $('console-tabs');
      const mine = myConsoles(s);
      if (!inGame || mine.length < 2) {
        bar.classList.remove('active');
        bar.innerHTML = '';
        return;
      }
      bar.classList.add('active');

      // Reuse existing buttons instead of recreating every frame.
      // Only rebuild when the console set actually changes.
      const existing = Array.from(bar.querySelectorAll('button'));
      if (existing.length === mine.length) {
        let allMatch = true;
        for (let i = 0; i < mine.length; i++) {
          if (existing[i].dataset.console !== mine[i]) { allMatch = false; break; }
        }
        if (allMatch) {
          // Just update active class
          for (let i = 0; i < mine.length; i++) {
            if (mine[i] === activeConsole) existing[i].classList.add('active');
            else existing[i].classList.remove('active');
          }
          return;
        }
      }

      bar.innerHTML = '';
      for (const c of mine) {
        const btn = document.createElement('button');
        btn.dataset.console = c;
        btn.textContent = CONSOLE_LABEL[c] || c;
        if (c === activeConsole) btn.classList.add('active');
        btn.addEventListener('click', () => { activeConsole = c; scheduleRender(); });
        bar.appendChild(btn);
      }
    }

    function renderLobby(s) {
      const list = $('console-list');
      list.innerHTML = '';
      for (const c of CONSOLES) {
        const holder = s.players.find(p => consolesOf(p).includes(c));
        const btn = document.createElement('button');
        const mineHere = holder && holder.token === myToken;
        if (mineHere) {
          btn.textContent = CONSOLE_LABEL[c] + ': Mine — release';
          btn.className = 'mine';
          // Server's SelectConsole toggles, so re-sending Select removes it.
          btn.onclick = () => send('SelectConsole', { console: c });
        } else if (holder) {
          btn.textContent = CONSOLE_LABEL[c] + ': ' + holder.name;
          btn.disabled = true;
        } else {
          btn.textContent = CONSOLE_LABEL[c] + ': available';
          btn.onclick = () => send('SelectConsole', { console: c });
        }
        list.appendChild(btn);
      }

      $('engage-btn').style.display = isCaptain(s) ? 'block' : 'none';

      const pl = $('player-list');
      pl.innerHTML = '';
      s.players.forEach((p) => {
        const div = document.createElement('div');
        const mark = p.token === myToken ? '▶ ' : '• ';
        const cs = consolesOf(p);
        const con = cs.length ? ' [' + cs.map(c => CONSOLE_LABEL[c] || c).join(', ') + ']' : '';
        div.textContent = mark + p.name + con;
        pl.appendChild(div);
      });
    }

    function renderGame(s) {
      const showCap = activeConsole === 'CaptainChair';
      const btn = $('red-alert-btn');
      btn.style.display = showCap ? 'block' : 'none';
      btn.textContent = 'Red Alert: ' + (s.redAlert ? 'ON' : 'OFF');
      btn.className = s.redAlert ? 'alert-on' : '';

      if (showCap) {
        $('game-status').textContent = 'You are the captain. Issue orders.';
      } else if (!activeConsole) {
        $('game-status').textContent = 'Stand by. Select a console in the lobby.';
      }
    }

    // ── Event wiring ────────────────────────────────────────────

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        localStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    $('engage-btn').addEventListener('click', () => send('StartGame'));

    $('red-alert-btn').addEventListener('click', () => send('ToggleRedAlert'));

    // ── Helm Controls ──────────────────────────────────────────

    function sendHelmInput(thrust, steering) {
      send('HelmInput', { thrust, steering });
    }

    // Joystick: dy<0 (up)   → positive thrust (forward)
    //          dy>0 (down) → negative thrust (reverse)
    //          dx          → steering
    (function initJoystick() {
      const area = $('joystick-area');
      const knob = $('joystick-knob');
      let active = false;
      let pointerId = null;
      let lastThrust = 0;
      let lastSteering = 0;

      // Continuous resend at ~10Hz so the server keeps applying input
      setInterval(() => {
        if (active) sendHelmInput(lastThrust, lastSteering);
      }, 100);

      function setReadout(thrust, steering) {
        $('thrust-value').textContent = Math.round(thrust * 100);
        $('steering-value').textContent = Math.round(steering * 100);
      }

      function updateKnob(localX, localY) {
        const rect = area.getBoundingClientRect();
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const maxRadius = Math.min(cx, cy) - (knob.offsetWidth / 2) - 2;
        let dx = localX - cx;
        let dy = localY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > maxRadius && dist > 0) {
          dx = dx / dist * maxRadius;
          dy = dy / dist * maxRadius;
        }
        knob.style.left = (cx + dx) + 'px';
        knob.style.top  = (cy + dy) + 'px';

        // Signed thrust: up = forward (+), down = reverse (-)
        const thrust   = -dy / maxRadius;
        const steering =  dx / maxRadius;
        const tClamped = Math.max(-1, Math.min(1, thrust));
        const sClamped = Math.max(-1, Math.min(1, steering));
        lastThrust = tClamped;
        lastSteering = sClamped;
        setReadout(tClamped, sClamped);
        sendHelmInput(tClamped, sClamped);
      }

      function resetKnob() {
        knob.style.left = '50%';
        knob.style.top  = '50%';
        knob.classList.remove('active');
        lastThrust = 0;
        lastSteering = 0;
        setReadout(0, 0);
        sendHelmInput(0, 0);
      }

      function localPos(e) {
        const rect = area.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - rect.left, y: p.clientY - rect.top };
      }

      area.addEventListener('pointerdown', e => {
        active = true;
        pointerId = e.pointerId;
        area.setPointerCapture(e.pointerId);
        knob.classList.add('active');
        const p = localPos(e);
        updateKnob(p.x, p.y);
      });

      area.addEventListener('pointermove', e => {
        if (!active || e.pointerId !== pointerId) return;
        e.preventDefault();
        const p = localPos(e);
        updateKnob(p.x, p.y);
      });

      function endPointer(e) {
        if (!active || e.pointerId !== pointerId) return;
        active = false;
        pointerId = null;
        try { area.releasePointerCapture(e.pointerId); } catch (_) {}
        resetKnob();
      }
      area.addEventListener('pointerup', endPointer);
      area.addEventListener('pointercancel', endPointer);
      area.addEventListener('pointerleave', e => { if (active) endPointer(e); });
    })();

    // ── Swipe to switch console tabs (when 2+ consoles assigned) ───────
    (function initSwipe() {
      const root = document.body;
      let startX = 0, startY = 0, startT = 0, swiping = false, swipeCommitted = false;

      root.addEventListener('touchstart', e => {
        if (e.target.closest('#joystick-area')) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startT = performance.now();
        swiping = true;
        swipeCommitted = false;
      }, { passive: true });

      // Non-passive so we can preventDefault() once the gesture is clearly
      // horizontal, preventing the browser from treating it as a scroll.
      root.addEventListener('touchmove', e => {
        if (!swiping) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;
        if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
          swipeCommitted = true;
          e.preventDefault();
        }
      }, { passive: false });

      root.addEventListener('touchend', e => {
        if (!swiping) return;
        swiping = false;
        if (!swipeCommitted) return;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        const dt = performance.now() - startT;
        if (dt > 600) return;
        if (Math.abs(dx) < 60) return;
        if (Math.abs(dy) > Math.abs(dx) * 0.6) return;
        const mine = myConsoles(state);
        if (mine.length < 2 || state.phase !== 'InProgress') return;
        const idx = Math.max(0, mine.indexOf(activeConsole));
        const next = (dx < 0)
          ? (idx + 1) % mine.length
          : (idx - 1 + mine.length) % mine.length;
        activeConsole = mine[next];
        render(state);
      }, { passive: true });
    })();

    // ── Incoming message handler ────────────────────────────────

    function handleMessage(msg) {
      switch (msg.type) {
        case 'Welcome':
          state.phase   = msg.data.state.phase;
          state.players = msg.data.state.players.map(p => ({
            ...p,
            consoles: consolesOf(p),
          }));
          setStatus('Connected');
          break;
        case 'PlayerJoined':
          if (!state.players.find(p => p.token === msg.data.player.token)) {
            const p = msg.data.player;
            state.players.push({ ...p, consoles: consolesOf(p) });
          }
          break;
        case 'PlayerLeft':
          state.players = state.players.filter(p => p.token !== msg.data.token);
          break;
        case 'ConsoleSelected': {
          const p = state.players.find(p => p.token === msg.data.token);
          if (p) p.consoles = msg.data.consoles || [];
          break;
        }
        case 'ConsoleCleared': {
          const p = state.players.find(p => p.token === msg.data.token);
          if (p) p.consoles = [];
          break;
        }
        case 'NameChanged': {
          const p = state.players.find(p => p.token === msg.data.token);
          if (p) p.name = msg.data.name;
          if (msg.data.token === myToken) myName = msg.data.name;
          break;
        }
        case 'GameStarted':
          state.phase = 'InProgress';
          break;
        case 'SimState': {
          const ra = msg.data.snapshot.red_alert;
          // Only update the red-alert overlay class � don't re-render the entire page.
          // SimState is broadcast at 10Hz and would steal pointer events from tab clicks.
          const container = $('console-container');
          if (ra) container.classList.add('red-alert');
          else container.classList.remove('red-alert');
          // De-duplicate: only update state when it actually changes
          if (state.redAlert !== ra) state.redAlert = ra;
          return; // intentional: no scheduleRender() — SimState at 10Hz must not race with tab clicks
        }
        default:
          return; // unknown — skip re-render
      }
      scheduleRender();
    }

    // ── PeerJS connection ───────────────────────────────────────

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus('No host ID in URL. Scan the QR code on the view screen.');
    } else {
      const clientPeer = new Peer();

      clientPeer.on('open', () => {
        setStatus('Connecting to host…');
        conn = clientPeer.connect(hostPeerId, { reliable: true });

        conn.on('open', () => {
          setConnectionStatus('ready');
          send('Identify', { token: myToken, name: myName });
          setStatus('Waiting for server…');
        });

        conn.on('data', raw => {
          try {
            const str = typeof raw === 'string' ? raw : new TextDecoder().decode(raw);
            handleMessage(JSON.parse(str));
          } catch (e) { console.error('[client] bad message', e, raw); }
        });

        conn.on('close', () => { setConnectionStatus('disconnected'); setStatus('Disconnected'); conn = null; });
        conn.on('error', e  => setStatus('Connection error: ' + e.type));
      });

      clientPeer.on('disconnected', () => {
        setConnectionStatus('disconnected');
        clientPeer.reconnect();
      });

      clientPeer.on('error', e => { setConnectionStatus('error'); setStatus('Peer error: ' + e.type); });
    }
  </script>
</body>
</html>

# ── Endings ──────────────────────────────────────────────────────────────────

# Victory: every hostile destroyed — the eight waves, their tier bonuses, and
# the two standing pickets. See the header note for why this is one trigger over
# a dynamic group rather than three name lists, and why the guard counts waves
# instead of seconds.
[[trigger]]
condition  = "on_all_destroyed"
group      = "hostiles"
when       = "counter(waves_spawned) >= 8"

  [[trigger.action]]
  type       = "game_over"
  message    = "world.combat_test.trigger.action.18.message"
  outcome    = "victory"
  delay_secs = 5.0

# Defeat: Starbase Alpha destroyed.
[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.starbase_alpha.name"

  [[trigger.action]]
  type    = "game_over"
  message = "world.combat_test.trigger.action.21.message"
  outcome = "defeat"

# ── Objectives ───────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-defend"
  text      = "world.combat_test.trigger.action.obj_defend.text"
  mandatory = true
  targets   = ["world.entity.starbase_alpha.name"]
  source            = "mission"
  base_priority     = 20.0
  directive_kind    = "Patrol"
  directive_anchors = ["starbase_patrol_north", "starbase_patrol_east", "starbase_patrol_south", "starbase_patrol_west"]
  directive_loop    = true

# ── Comms ────────────────────────────────────────────────────────────────────
#
# Federation Command opens with an urgent flash brief, then calls each wave as
# it is released. Since issue #892 the waves are death-gated, so all but the
# first announcement rides the same `on_all_destroyed` condition its wave's
# spawn trigger does: Command calls the next wave the moment the last one dies,
# which lands ten seconds ahead of the ships themselves — a warning rather than
# a running commentary. Only wave 1's call is still on a clock.

[[comms]]
from    = "world.combat_test.comms.0.from"
trigger = "on_world_loaded"
urgent  = true
message = "world.combat_test.comms.0.message"

[[comms]]
from    = "world.combat_test.comms.1.from"
trigger = "on_timer"
after_secs = 0.5
message = "world.combat_test.comms.1.message"

[[comms]]
from    = "world.combat_test.comms.2.from"
trigger = "on_all_destroyed"
group   = "wave_1"
message = "world.combat_test.comms.2.message"

[[comms]]
from    = "world.combat_test.comms.3.from"
trigger = "on_all_destroyed"
group   = "wave_2"
message = "world.combat_test.comms.3.message"

[[comms]]
from    = "world.combat_test.comms.4.from"
trigger = "on_all_destroyed"
group   = "wave_3"
message = "world.combat_test.comms.4.message"

[[comms]]
from    = "world.combat_test.comms.5.from"
trigger = "on_all_destroyed"
group   = "wave_4"
urgent  = true
message = "world.combat_test.comms.5.message"

[[comms]]

    core:
      status: implemented
      confidence: confirmed
      title: Client Console Mount Plan
      summary: Pure-JavaScript mount plan deriving the phone console panels from the server-supplied ship stations — canonical station-id DOM naming with the single tactical alias, console URL resolution, section switching over the mounted stations, and per-console payload builders whose shapes are documented as typedefs; the static console registry it replaced was deleted in issue 827.
    architecture:
      kind: client-shell
      authority: non-authoritative
      reads: [session-station-ownership-state, ship-station-system-topology-state, client-system-console-family-replica]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/mount-plan.js, gui/content-switcher.js, gui/console-state.js, gui/console-resolver.js]
      tests: [npx vitest run]

  - state: client-system-console-family-replica
    core:
      status: implemented
      confidence: confirmed
      title: Client Console Family Metadata Replica
      summary: Read-only phone-client copies of the selected ship's complete System instance id to Console Family projection and the separate reserved/aggregate blackboard key to Console Family projection. They select presentation and dirty routing only; neither projection is ownership or command authority, and a reserved channel never masquerades as a System.
    architecture:
      classification: replicated
      owner: system-kind-registry
      derived_from: [system-console-family-projection-state, blackboard-console-family-projection-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/lobby/server.rs, gui/sim-state.js]
      tests: [cargo test, npx vitest run]

  - component: client-console-family-router
    core:
      status: implemented
      confidence: confirmed
      title: Client Console Family Router
      summary: Selects every flat or composite console payload builder and routes merged reducer-reported semantic domains, changed Systems and changed blackboards through the host's complete Console Family projections. Typed blackboard discriminants select semantic data, actual Station-owned System ids key and normalize payloads, and one presentation registry contains every family including Command, Tractor and Umbilical. The router receives no ServerMessage and maintains no message-variant census; there is no exact/prefix inference, inverse family-to-System census, iframe family hint, or Station-name boot switch.
      rationale:
        - "A Console Family describes presentation only. Station topology still decides which surface owns a System, and SystemId still targets command authority."
        - "System instance metadata and reserved-channel metadata remain separate because a blackboard channel can affect a console without being commandable, damageable or ownable."
        - "Before Welcome there is no authoritative topology with which to select a builder, so the router emits an empty payload rather than inventing one from a Station name."
        - "Message interpretation stays at the reducer branch that owns each state mutation. The downstream domain-to-family relation describes presentation consumers rather than repeating ServerMessage variants."
    architecture:
      kind: presentation-router
      authority: non-authoritative
      reads: [client-system-console-family-replica, ship-station-system-topology-state, ship-system-blackboards-state, client-semantic-change-result]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/reducer-result.js, gui/sim-state.js, gui/console-state.js, gui/console-payload.js, gui/dirty-consoles.js, gui/action-map.js, gui/stations/, gui/destroyer/, gui/courier/, gui/cruiser/, client.html]
      tests: [npx vitest run]

  - component: client-simulation-state-store
    core:
      status: implemented
      confidence: confirmed
      title: Client Simulation State Store
      summary: Pure-JavaScript simulation, lobby and Comms receivers that fold authoritative server messages into their distinct local presentation stores and return fresh mergeable semantic changes plus ordered lifecycle/presentation effects from the branch that owns each decision. Valid Blackboard entries report changed keys and broader hosting-domain changes; the remaining state-bearing branches report semantic domains. Per-console iframe payload contracts remain documented as JSDoc typedefs beside each builder (issue 827).
    architecture:
      kind: client-state-store
      authority: non-authoritative
      owns: [client-presentation-state, client-semantic-change-result]
      reads: [simulation-state-replica, ship-system-blackboards-state]
      produces: [client-presentation-state, client-semantic-change-result]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [gui/reducer-result.js, gui/sim-state.js, gui/console-state.js, gui/lobby-state.js, gui/comms-state.js, client.html]
      tests: [npx vitest run]

  - state: client-semantic-change-result
    core:
      status: implemented
      confidence: confirmed
      title: Client Semantic Change Result
      summary: Ephemeral reducer output containing mergeable sets of changed semantic domains, System ids and blackboard keys plus an ordered, non-deduplicated effect sequence. Dirty-console routing consumes only the semantic sets plus authoritative topology metadata; the shell-effect router consumes the effects after iframe publication. Neither receives the original ServerMessage. Unknown messages and unaccepted entries produce no output; repeated feedback remains repeated even when its values match.
    architecture:
      classification: derived
      owner: client-simulation-state-store
      writers: [client-simulation-state-store]
    implementation:
      status: declared
      paths: [gui/reducer-result.js, gui/lobby-state.js, gui/sim-state.js, gui/comms-state.js, gui/dirty-consoles.js, client.html]
      symbols: [CHANGE_DOMAINS, REDUCER_EFFECTS, emptyReducerResult, mergeReducerResults, ClientSimState, LobbyState, ClientCommsState]

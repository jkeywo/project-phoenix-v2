manual_overview = "You run the destroyer's weapons: an omni phaser, port and starboard blasters, and a torpedo tube. Lock your target, manage torpedo loading and volley size, and match phaser frequency to break enemy shields. With guns on multiple arcs, work with the Helm to keep something on target at all times. Simplified rating lets the AI auto-fire the omni phaser."


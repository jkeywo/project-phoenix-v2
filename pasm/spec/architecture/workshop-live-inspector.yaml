entities:
  - component: operator-workspace-dock-layouts
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Shared Authoring and Live Dock Layouts
      summary: "Authoring and Live use one pure-JavaScript dock model and renderer for split, tabbed, in-surface floating, closed, reset and narrow single-panel arrangements. Each context registers its own panels and persists a separate versioned placement tree in the private operator profile: Authoring version 4 covers files, source, inspector, add, recovery, findings, correlated feedback, immutable dependency sources, settings, the model/rig field form, the captured model preview and the sound audition; Live version 12 covers roster, readiness, join requests, manual save, mission events, the Comms studio, the activity feed, the saved action journal, the session history, the omniscient map, the attention queue, Station workload, the authored widget region, peer health, the authentic Station takeover controls, the authentic Station console, typed presentation control, private sound audition, the Workshop source handoff, Spawn, the entity inspector, checkpoint records, live restore, contact control, NPC doctrine, System control, entity removal, faction hostility, the authored Objective controls and the misclassification, reported-information, ghost-contact and direct-effect drafts; the four record surfaces and health form one default tab group, and the map and the Station console are the documents the workspace is arranged around. Browser and native profile sanitizers apply matching registries, bounds, deduplication, repair, Authoring v1/v2/v3 migration and Live v1-v11 migration. A generated fixture (scripts/generate-live-layout-fixture.mjs) pins the two Live sanitizers to the same result case for case. Fixed Authoring lifecycle controls and the Live Station/status bar remain outside the dock."
      rationale:
        - "[ai] Moving a node between parents necessarily disconnects and reconnects it, so a panel holding a live resource restores that resource in connectedCallback rather than only at first template. The navigation map does exactly this; before docking reached it, the desk kept it in one grid cell for that reason. Reparenting is now safe and the map is an ordinary document panel."
        - "[ai] The same move re-creates an iframe's document, so the authentic Station puppet treats any load after the one it requested as a remount: the mount generation advances and pending commands are dropped. Feedback belongs to the interface that sent the command, and a dock move ends that interface. Docking adds no command route, no capability and no simulation participant; the console panel exists exactly while the takeover controls do — while the projection carries a Station row — and closing it releases nothing."
        - "[ai] A gesture that owns a surface hides the in-surface floating panels for its duration and disables the switcher, except the panel the gesture is FOR: that one names the control capturing the surface and previews what committing would do, and a hidden subtree is out of the accessibility tree as well as off the screen. It is presentation state — nothing is closed, moved or persisted, and ending it restores the same frames in the same derived z-order."
        - "[ai] A placement with no aim takes a contextual default direction rather than north, and whether the operator aimed is recorded as a fact rather than inferred from the value, so a deliberate due-north aim survives. The preview states the direction in degrees and in a compass word — the chart is world-absolute, so compass rather than relative — and says whether it is the default."
        - "[ai] A panel is a place or a DRAFT. A temporary panel is a complex action the operator opened, filled in and will finish: absent from the default arrangement, opened floating rather than docked, and persisted only as the fact that it was DOCKED — a docked draft is a tool kept to hand and returns empty, a floating one is not restored at all, and no field of either is stored. Finishing is the operator's: Keep open is on the confirm, docking implies it, and only an authoritative success closes an undocked unchecked draft. Losing typed work is always confirmed, including by a layout reset. The lifecycle owns when a draft is on screen and whether it may be discarded; each action keeps its own typed request, admission, feedback and confirmation category."
        - "[ai] Each registered panel declares a class. Documents are the surfaces a context is arranged around — the Authoring source and the captured model preview — and everything else is a tool. The class steers the default arrangement and a renderer hint only; it grants no capability and is never persisted as authority."
        - "[ai] A stored layout is sanitized against the panel vocabulary its own version declared, in both the browser model and the native profile sanitizer. A panel registered later therefore enters only through migration and can never be read back out of an older tree, and a panel the operator explicitly closed under an older version stays closed."
        - "[ai] Layout persistence carries placement only: panel contents, source drafts, recovery records, validation results, dependencies, action state, GM reconnect identity, captured preview sessions, cue selection and audition playback remain with their existing owners and never enter either layout tree."
        - "[ai] Authoring and Live layouts are separate profile fields because they arrange different contexts and confer no authority. Authoring still patches exact source and validates through the runtime gates; Live still invokes existing GM actions and providers. Moving an original DOM node preserves its listeners and live-region ownership instead of creating another command or state path."
        - "[ai] A panel whose own owner has put it away keeps its placement and loses its frame, tab and switcher button. Availability is READ by the dock and written only by that owner — on the Live desk, the role preset — so the two can never race; the panel node stays parked in the surface because that owner finds it by id and is the only thing that can bring it back."
        - "[ai] Presenter-driven reveal may reopen and focus Authoring findings, feedback or source without changing validation outcomes. Role presets remain the sole owner of Live panel visibility, and a native Live surface without a save provider reports manual save unavailable rather than acquiring browser save authority."
        - "[ai] Browser and native sanitize the same persisted vocabulary independently at their storage boundaries. Unknown, duplicate, malformed or over-deep placement is removed or repaired; migration adds newly registered Authoring panels without reopening a legacy panel the operator explicitly closed."
    architecture:
      kind: presentation-adapter
      authority: local
      depends_on: [client-audio-presentation]
      coordinates: [gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [gui/dock-layout-model.js, gui/dock-layout-migration.js, gui/gm-temporary-actions.js, gui/gm-spawn-panel.js, gui/components/ph-navigation-map.js, gui/gm-station-puppet.js, gui/gm-presentation-panel.js, gui/workshop-source-link.js, scripts/generate-live-layout-fixture.mjs, gui/workshop-models-panel.js, gui/workshop-model-preview-panel.js, editor/workshop-sound-cues.js, gui/workshop-layout-model.js, gui/live-layout-model.js, gui/workshop-layout-renderer.js, gui/workshop-authoring.js, gui/gm-workspace-shell.js, gui/operator-profile.js, src/native_host/panes/operator.rs, src/workshop/provider.rs, editor/workshop-provider.js]
      symbols: [createDockLayoutModel, PANEL_KIND, createTemporaryActions, createDockLayoutMigration, workshop_panels_for, live_panels_for, workshopLayoutModel, liveLayoutModel, mountDockLayout, mountWorkshopAuthoring, mountGmWorkspaceShell, sanitize_authoring_layout, sanitize_live_layout]
      tests:
        - tests/smoke/gm-spatial-pick.spec.js
        - npm run live-layout:check
        - npx vitest run tests/client/gm-temporary-actions.test.js tests/client/gm-spawn-panel.test.js
        - npx vitest run tests/client/workshop-layout-model.test.js tests/client/workshop-layout-renderer.test.js tests/client/workshop-authoring.test.js tests/client/live-layout-model.test.js tests/client/gm-workspace-shell.test.js tests/client/operator-profile.test.js tests/client/native-workshop-boot.test.js
        - cargo test --lib native_host::panes::operator workshop::provider
        - tests/smoke/workshop-authoring.spec.js
        - tests/smoke/gm-layout.spec.js

  - component: workshop-live-active-schema-inspector
    core:
      status: partially-implemented
      confidence: confirmed
      title: Broad Active-Content Live Inspection
      summary: "Live Inspector exposes every known schema field for instantiated entities and definitions in loaded layers through five selection-scoped domain panels: world/scenario, entities/AI, hull/Stations/Systems, Regions, and authored presentation/audio. Each reading shows the effective authored baseline and winning provenance beside current runtime state and relevant derived context. Existing typed GM actions are linked through their established panels; checked NPC doctrine remains M6's sole additional field-replacement transaction. Every other authored field is explicitly Derived or Recreate required, and a schema-coverage ratchet rejects unclassified known active fields."
      rationale:
        - "Live writes affect only the selected runtime instance and apply canonically across every fleet peer. Each existing action keeps its own apply-time validation, attribution, result, replay and explicit per-family reversibility rather than gaining a duplicate Inspector action."
        - "Scenario Flags and lower-level operational actions remain reachable only through authored GM-operable events and existing typed actions. Numeric gameplay tuning, transforms, Region shape/effects, source, Rhai, models, rigs and assets are not live-editable."
        - "Unknown extension fields and unloaded or inactive definitions remain standalone Workshop concerns. A known field without an exact retained source span stays visible and reports its location unavailable rather than inferring one."
        - "Current state names a canonical GM or gameplay cause only where retained evidence supports it; otherwise the Inspector reports that the divergence has no retained single cause."
        - "Details are fetched for the selected object and domain at existing bounded projection cadences. A disappeared entity or unloaded layer retains its final reading marked gone and stale with every action disabled; related references use one bounded Back/Forward history and never follow a replacement by authored name."
        - "Every equal GM receives the same complete information. Role presets may filter or arrange panels locally but never alter access. Presentation/audio inspection excludes private operator preferences and physical output assignments."
        - "[ai] Composition provenance is resolved during Authoring and dropped before spawn: config_cache retains the parsed EntityConfig, not the Provenance that produced it. A Live reading therefore cannot name the include layer a field won in and reports its location unavailable, which is the rule above applied rather than an exception to it. Retaining resolution provenance per spawned entity is deliberately not scheduled here."
        - "[ai] 'Layer' in a Live descriptor means the authored sub-world layer the runtime does retain, which is what NpcDoctrinePaletteEntry.origin_layer already means. It never means the include chain; that remains an Authoring concern."
        - "[ai] Issue #1489 delivers the entities/AI domain. Its descriptor table is published once for the whole domain and readings are keyed by entity id, so the per-entity payload carries values rather than a repeated schema. Derived intent and current target are taken from the decisions the surrounding projection has already made rather than recomputed, because two derivations of one fact from the same components are two chances for the Inspector to disagree with the desk beside it. Effective modifiers are read from the existing structured debug payload rather than a second inspection path."
    architecture:
      kind: presentation-adapter
      authority: local
      depends_on: [workshop-inspector-descriptors]
      coordinates: [gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/gm_entity_inspector.rs, src/gm_projection.rs, gui/gm-entity-inspector-panel.js, gui/live-layout-model.js, src/native_host/panes/operator.rs, gui/gm-workspace.js, gui/gm-workspace-shell.js, server.html]
      symbols: [EntityInspectorProjection, EntityInspectorField, EntityFieldGroup, EntityInspection, EntityReadingInputs, fields, reading, createGmEntityInspectorPanel, parseGmEntityInspectorPayload]
      tests:
        - cargo test --lib gm_entity_inspector
        - npx vitest run tests/client/gm-entity-inspector-panel.test.js tests/client/live-layout-model.test.js
        - npm run live-layout:check

  - component: workshop-inspector-descriptors
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Shared Authoring and Live Field Descriptors
      summary: Authoring and Live share runtime field metadata and its accessible presentation. Descriptors declare type, available default, schema path, known source location or layer, validation and explicit Live mutability. They confer no write authority. Authoring retains its exact-source patch owner; Live exposes only a named admitted action. Derived and recreate-required values remain visible as disabled controls. Runtime readings without retained source spans explicitly report the location unavailable.
    architecture:
      kind: presentation-adapter
      authority: local
      depends_on: [gm-t2-authored-npc-doctrine]
    implementation:
      status: declared
      paths: [src/inspector.rs, src/workshop/document.rs, gui/inspector-field.js, gui/workshop-authoring.js, gui/gm-npc-panel.js]
      symbols: [FieldDescriptor, FieldOrigin, LiveMutability, renderInspectorMetadata, renderInspectorReadOnly]
      tests:
        - cargo test --lib workshop::document
        - npx vitest run tests/client/inspector-field.test.js tests/client/workshop-authoring.test.js

  - component: workshop-live-npc-inspector
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Checked Live NPC Doctrine Inspector
      summary: The first constrained M6 Live transaction selects a compatible authored NPC doctrine through the shared browser and native GM panel. Confirmation captures the target, choice and current field fingerprint. Canonical application refuses an intervening field or selected-definition change before reaching the existing doctrine compatibility and reconciliation owner. Admission, attribution, terminal results and the existing M5 inverse remain shared. The panel never optimistically changes the runtime value or edits raw ECS, Rhai or source data.
      rationale:
        - "[ai] The fingerprint includes actual BehaviourSection doctrine, applied profile and original baseline, plus the selected authored entry's identity, contents, eligibility and origin. A same-ID source replacement must stale a reading. Unrelated physics, derived AI scores and other authored choices do not stale it. The bounded opaque token is a comparison value, never an authorization credential or a new authoritative state resource."
        - "[ai] The checked action is appended to the typed action enum to preserve existing variant identities. It reuses the ordinary NPC affected field and inverse; replay records the normal checked request and attributed result. Existing absolute scenario actions retain their established behavior."
        - "[ai] The current doctrine offers only the runtime owner's compatible choices. Current scored intent is derived and disabled; the selected authored definition is recreate-required and disabled. A withdrawn choice remains visibly unavailable until deliberate reselection. This slice does not imply arbitrary Live fields or completion of all M6 Inspector work."
    architecture:
      kind: scenario-action-vocabulary
      authority: authoritative
      depends_on: [gm-t2-authored-npc-doctrine, workshop-inspector-descriptors]
      coordinates: [gm-t2-directed-world-actions]
    implementation:
      status: declared
      paths: [src/gm_npc.rs, src/gm_npc/inspector.rs, src/gm_action.rs, src/core/codec.rs, gui/gm-npc-panel.js, gui/gm-workspace.js, gui/native-gm-workspace.js, server.html, tests/gm_npc.rs]
      symbols: [SetNpcDoctrineChecked, apply_checked, NpcInspector, valid_revision]
      tests:
        - cargo test --features headless --test gm_npc live_inspector_
        - cargo test --features host,headless --lib gm_npc::inspector
        - npx vitest run tests/client/gm-npc-panel.test.js tests/client/native-gm-workspace.test.js
        - tests/smoke/gm-page.spec.js
  - component: workshop-test-observer-views
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Disposable Test Observer Views
      summary: "One disposable Test run can be observed through the omniscient Game Master workspace or the authentic Viewscreen of a simulated player ship. Switching is a presentation-only control on the same running simulation: it never restarts, never moves the clock and never changes what the fixed tick reads. The omniscient view mounts the ordinary GM workspace over the ordinary GM markup, fed by the ordinary gm_* Host Channel projections, and every GM write is installed as an explicit refusal so a Test observes without a credential, a save path or a mutation route."
      rationale:
        - "[ai] Two levers, both already excluded from the authoritative fold: NativeGmPresentation turns the ordinary GM projections on and off (a native host already inserts and removes it beside a running ship), and LocalShip says which hull is drawn. tests/gm_presentation_neutrality.rs runs the same seeded world twice, switching the omniscient view on mid-run and on-then-off, and compares the digest on every tick — what was previously an inference from the projection systems being read-only."
        - "[ai] The GM markup is INJECTED at build time from server.html rather than written again, so the Test mounts the real console. A Workshop-only substitute would be a second surface to keep correct and would stop being evidence about the real one the moment it drifted; the native GM already does the same thing at runtime."
        - "[ai] Every window.__host* GM write is bound to a refusal rather than left undefined. An undefined global crashes a panel on first press and leaves 'can this mutate the run?' answerable only by reading every panel; one list answers it, and a Test that somehow acquired a route fails a test rather than quietly working."
        - "[ai] The surface follows the RUNTIME's reported view, never the request that asked for it, so a refused switch cannot leave the page claiming a view the run is not drawing. The runtime refuses a ship the run does not have."
        - "[ai] A Test today runs ONE player ship, because the disposable boot keeps the default solo roster; multi-ship Test authoring is #1153 on the T5 track. The selector reads whatever player ships the run actually has rather than assuming one, so it needs no change when that lands."
    architecture:
      kind: presentation-adapter
      authority: local
      coordinates: [gm-milestone-integrated-workshop]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths:
        - src/workshop/test_view.rs
        - src/workshop/test_protocol.rs
        - src/workshop/test_browser.rs
        - src/workshop/test_clock.rs
        - gui/workshop-test-gm.js
        - gui/workshop-test-boot.js
        - gui/workshop-test-panel.js
        - editor/workshop-test-runtime.js
        - editor/workshop-test-child.js
        - scripts/gm-console-markup.mjs
        - scripts/build-workshop.mjs
        - workshop-test.html
      symbols: [TestView, TestShip, TestViewState, mountWorkshopTestGm, gmConsoleMarkup, TEST_GM_REFUSED_ACTIONS]
      tests:
        - cargo test --features headless --test gm_presentation_neutrality
        - npx vitest run tests/client/workshop-test-view.test.js
        - npx vitest run editor/tests/workshop-test-child.test.js tests/client/workshop-test-panel.test.js

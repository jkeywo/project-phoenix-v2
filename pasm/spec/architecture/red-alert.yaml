entities:
  - component: red-alert-console-interface
    core:
      status: implemented
      confidence: confirmed
      title: Red Alert Console Interface
      summary: Captain-facing control that displays the ship alert state and requests an explicit target state.
      rationale:
        - A state-setting control is idempotent, unlike a toggle command that can be applied twice or arrive after the displayed state changes.
        - The control remains read-only while the red-alert system is AI-controlled.
    architecture:
      kind: client-interface
      authority: non-authoritative
      reads:
        - red-alert-status-replica
      sends:
        - set-red-alert-command
      runs_in:
        - phone-browser-runtime
    implementation:
      status: declared
      paths: [gui/components/ph-red-alert.js, gui/action-map.js, gui/console-state.js]
      tests: [npx vitest run]

  - state: authoritative-red-alert-state
    core:
      status: implemented
      confidence: confirmed
      title: Authoritative Red Alert State
      summary: Per-ship host-owned boolean alert state, now written with explicit set semantics rather than toggle semantics.
    architecture:
      classification: authoritative
      owner: host-red-alert-control-router
      writers:
        - host-red-alert-control-router
      replicas:
        - red-alert-status-replica
        - selected-target-alert-state
    implementation:
      status: declared
      paths: [src/ship/state.rs, src/console/captain/server.rs]
      symbols: [ShipRedAlert]

  - state: authoritative-weapons-hold-state
    core:
      status: implemented
      confidence: confirmed
      title: Authoritative Weapons Hold State
      summary: Per-ship host-owned boolean restraint lever, layered under the binary alert rather than replacing it, and set with the same explicit-target-state semantics.
      rationale:
        - "Issue #1041 ships the THIN restraint lever rather than graduated rules of engagement. There are no authority tiers and no per-target rules of engagement; that design stays parked under issue #834's out-of-scope list, and a review that finds either here has found scope creep."
        - "The state is independent of the alert rather than a third alert value. A crew that had to stand down to hold fire would be choosing between shields and restraint, and the whole point of proportionate force is that it is not that choice."
        - "[ai] It suppresses fire by composing into the VALUE of the fact the shipped gate already reads, not by adding a fact or a conjunct. Every armed hull authors one predicate — fact(red_alert) >= param(min_alert_to_fire) — differing only in the threshold, so a second fact would mean editing every one of those predicates, which is the new-vocabulary change the acceptance criteria forbid, and a hull whose author forgot it would ignore the captain's order in silence."
        - "[ai] The seeded value is a LADDER, not a boolean with a sentinel. min_alert_to_fire is a floor on how hot the ship must be before a bank opens up, and a weapons hold is a rung below stood-down. Sitting under every authorable floor is what makes the lever work on the always-armed Harrow gun line, which authors a threshold of 0: a hold seeded as a plain 0.0 would have left those hulls firing through the order, because 0 >= 0."
        - "Released, the seeded value is exactly the 1.0/0.0 the fire hosts inlined before this issue, so Red Alert's behaviour is unchanged when the hold is not engaged. The committed world digests are the standing proof, and the weapons-hold digest namespace folds nothing while no ship holds so that they can be."
        - "AI/human symmetry is structural rather than asserted: the NPC fire hosts respect the hold because they seed the same fact and resolve the same authored predicate, with no branch anywhere on who is flying."
        - "It rides the red-alert admitted-command target rather than declaring a system of its own, so every NPC whose Red Alert capability is already provisioned AI-only can be ordered to hold with no second capability to declare and no second consumer to register."
    architecture:
      classification: authoritative
      owner: host-weapons-hold-control-router
      writers:
        - host-weapons-hold-control-router
      replicas:
        - weapons-hold-status-replica
    implementation:
      status: declared
      paths: [src/ship/state.rs, src/console/captain/server.rs, src/console/weapons/mod.rs, src/sim_digest.rs]
      symbols:
        - ShipWeaponsHold
        - WeaponsAlertPosture
        - WEAPONS_HOLD_ALERT_FACT
        - OWN_SHIP_WEAPONS_HOLD_FLAG
      tests: [cargo test, "cargo test --lib a_weapons_hold_closes_every_shipped_fire_gate"]
    evidence:
      - kind: test
        reference: "src/entities/authored_ai_pins.rs::a_weapons_hold_closes_every_shipped_fire_gate"
        summary: "The suppression claim resolved through the REAL shipped predicates on the REAL shipped hulls — the fleet baseline's threshold of 1 and the Harrow gun line's always-armed 0 — with every readiness reading favourable and the alert raised. The released rows in the same test are the byte-identical half."

  - component: host-weapons-hold-control-router
    core:
      status: implemented
      confidence: confirmed
      title: Host Weapons Hold Control Router
      summary: Authoritative handler that validates an admitted SetWeaponsHold command and assigns its held value to the addressed ship.
      rationale:
        - The router assigns rather than inverts, so a retried, duplicated or stale-console order cannot turn a ship's guns back on.
        - It applies to the owning ship entity, so a scenario ordering one hull to hold fire leaves every other hull alone.
        - "[ai] It decides nothing about firing. It writes one boolean; the suppression happens where every other firing decision happens, in the bank's own authored predicate."
    architecture:
      kind: subsystem
      authority: authoritative
      owns:
        - authoritative-weapons-hold-state
      consumes:
        - set-weapons-hold-command
      writes:
        - authoritative-weapons-hold-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/core/messages.rs]
      symbols: [SetWeaponsHold]
      tests: [cargo test]

  - message: set-weapons-hold-command
    core:
      status: implemented
      confidence: confirmed
      title: Set Weapons Hold Command
      summary: Client-to-host request carrying the desired weapons-hold state as held true or false, addressed to the red-alert system.
      rationale:
        - The payload expresses the requested end state, so retries and duplicate delivery cannot invert the order.
        - It targets the red-alert system so one console control source governs the ship's whole firing posture, and so a hull needs no second capability to be orderable.
    architecture:
      authority: request
      producer:
        - red-alert-console-interface
      consumer:
        - host-command-admission
        - host-weapons-hold-control-router
      validator:
        - host-command-admission
      trust_boundary: client-to-host
      payload: set-weapons-hold-held
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/action-map.js]
      tests: [cargo test, npx vitest run]

  - state: weapons-hold-status-replica
    core:
      status: implemented
      confidence: confirmed
      title: Weapons Hold Status Replica
      summary: Non-authoritative captain presentation of the local ship's weapons hold, published on the captain blackboard beside the alert.
    architecture:
      classification: replicated
      derived_from:
        - authoritative-weapons-hold-state
      owner: red-alert-console-interface
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, gui/console-state.js, gui/components/ph-red-alert.js]

  - state: red-alert-status-replica
    core:
      status: implemented
      confidence: confirmed
      title: Red Alert Status Replica
      summary: Non-authoritative captain and viewscreen presentation of the local ship's alert state.
    architecture:
      classification: replicated
      derived_from:
        - authoritative-red-alert-state
      owner: red-alert-console-interface
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, gui/console-state.js]

  - message: set-red-alert-command
    core:
      status: implemented
      confidence: confirmed
      title: Set Red Alert Command
      summary: Client-to-host request carrying the desired Red Alert state as active true or false.
      rationale:
        - The payload expresses the requested end state, so retries and duplicate delivery do not invert the alert state.
        - AI operators use the same command shape after they calculate their desired state.
    architecture:
      authority: request
      producer:
        - red-alert-console-interface
        - red-alert-ai-operator
      consumer:
        - host-command-admission
        - host-red-alert-control-router
      validator:
        - host-command-admission
      trust_boundary: client-to-host
      payload: set-red-alert-active
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/core/codec.rs, gui/action-map.js, gui/sim-state.js]
      tests: [cargo test, npx vitest run]

  - component: host-red-alert-control-router
    core:
      status: implemented
      confidence: confirmed
      title: Host Red Alert Control Router
      summary: Authoritative handler that validates an admitted SetRedAlert command and assigns its active value to the addressed ship.
      rationale:
        - "[ai] The router must assign rather than invert the state."
        - It must apply commands to the owning ship entity so player and AI ships remain independent.
    architecture:
      kind: subsystem
      authority: authoritative
      owns:
        - authoritative-red-alert-state
      consumes:
        - set-red-alert-command
      writes:
        - authoritative-red-alert-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/core/messages.rs]
      tests: [cargo test]

  - component: red-alert-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Red Alert AI Operator
      summary: Per-ship AI operator that seeds a typed fact snapshot about recent combat activity and the nearest hostile contact, resolves the hull's authored red-alert policy over it, and submits the same explicit set command used by the captain interface.
      rationale:
        - "[ai] The operator decides nothing itself. It seeds facts and resolves the hull's authored policy, so which readings become an alert is content rather than code."
        - Recent damage, hostile fire, or own weapon use within the authored combat window is one authored reading; standing down outside it is the unconditional fallback.
        - "Issue #912 added the first-contact half. The combat timer starts only once someone has fired, and issue #872 gates a crewed hull's own weapons on the alert, so a fully backfilled Alliance hull could previously only ever return fire. The operator now also seeds a hostile-contact flag and the planar range to the nearest faction-hostile, both unconditionally, so an authored guard can open an engagement. An absent fact makes every comparison read false, which is why neither reading is seeded conditionally."
        - "[ai] The two contact readings come from the shared per-tick world snapshot rather than a scan of the operator's own, and reuse the same nearest-hostile and relative-motion helpers the Helm and Tactical consoles read, so the captain's verdict cannot disagree with the consoles that act on it. The operator runs in the input phase and the snapshot is built in the physics phase, so it reads the previous tick's frame by the project's frozen-snapshot doctrine."
        - The hulls that author no first-contact rule are the always-armed Harrow gun line and the unarmed Requiem courier; their weapons need no alert, so raising one would move every other reading keyed on alert state for no change in fire behaviour.
        - The operator is enabled by the Red Alert system's own control source, not by the umbrella Captain system.
    architecture:
      kind: service
      authority: authoritative
      reads:
        - authoritative-red-alert-state
      sends:
        - set-red-alert-command
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/ai/core.rs]
      tests: [cargo test]

  - state: selected-target-alert-state
    core:
      status: implemented
      confidence: confirmed
      title: Selected Sensor Target Alert State
      summary: Read-only alert state for the contact selected on the Sensors radar, absent for targets without a Red Alert capability.
      rationale:
        - Sensors should show the selected contact's current alert state without exposing a new detail field for every radar contact.
        - The state is useful for ship contacts and remains absent for asteroids, planets, and other non-ship targets.
    architecture:
      classification: replicated
      derived_from:
        - authoritative-red-alert-state
      owner: sensor-target-alert-publisher
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/ship/sensors.rs]
      tests: [cargo test]

  - component: sensor-target-alert-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Sensor Target Alert Publisher
      summary: Host publication path that resolves the current Sensors target to a ship and replicates only that ship's alert state to the Sensors scan card.
    architecture:
      kind: publisher
      authority: authoritative
      reads:
        - authoritative-red-alert-state
      writes:
        - selected-target-alert-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/ship/sensors.rs, gui/console-state.js, gui/components/ph-sensor-panel.js]
      tests: [cargo test, npx vitest run]

  - component: npc-red-alert-capability-provisioner
    core:
      status: implemented
      confidence: confirmed
      title: NPC Red Alert Capability Provisioner
      summary: NPC ship-spawn rule that ensures every behaviour-driven ship has an AI-only red-alert system, adding it when its authored ship configuration omits one.
      rationale:
        - An NPC can carry alert state today but cannot be operated by Red Alert AI unless its system configuration declares that capability.
        - The capability is mandatory for behaviour-driven ships and must be AI-controlled; authors may still declare it explicitly for clarity.
        - "Issue #871 (3394578e) left this provisioner in place but made it unexercised by shipped content. Every NPC hull now authors its own stations and its own red-alert provision, so the synthesised ownerless system is no longer reached by any shipped template; three existing tests that used shipped hulls to demonstrate it were re-pointed to inline fixtures rather than weakened, because their fixtures had stopped being examples of what they tested. The synthesis path itself is still live for a bare [behaviour] hull that authors none."
        - "Issue #871 also makes the ai_only marker on the synthesised system load-bearing in a new place. It is ownerless by construction, so no station rating can reach it; ship::rating::seed_boot_ratings therefore runs a SECOND pass that sets every ai_only system to Ai after the per-station pass. Without it the system would fall to ControlSourceResolver's Human default and silently stop being AI-operated."
    architecture:
      kind: service
      authority: authoritative
      writes:
        - authoritative-red-alert-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/entities/config.rs]
      tests: [cargo test]

  - component: red-alert-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Red Alert Presentation
      summary: Projects the authoritative alert boolean into Captain client data and host viewscreen visual treatment; the client may play the local Red Alert siren from its replica.
    architecture:
      kind: presentation-layer
      authority: derived
      reads: [authoritative-red-alert-state]
      writes: [ship-system-blackboards-state]
      renders: [authoritative-red-alert-state]
      runs_in: [host-browser-runtime, phone-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/server/viewscreen_border.rs, gui/components/ph-red-alert.js, assets/sounds/red_alert_siren.ogg]

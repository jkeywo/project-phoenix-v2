entities:
  - decision: layered-combat-frozen-guided-round-commitment
    core:
      status: accepted
      confidence: confirmed
      title: Guided Rounds Retain Their Physical Launch Profile
      summary: "Increment15 extends the existing TorpedoSystem vectors rather than introducing a second projectile owner. A committed burst freezes its physical flight, impact, durability and emission cadence once; each emitted round carries that profile independently of later equipment or launcher changes. Existing yaw/pitch flight remains full3D."
      rationale:
        - "[ai] The required guided-round profile includes finite speed, turn rate, initial endurance, collision/detonation radius, hull/shield payload, shield pierce, physical impact and durability. Remaining endurance and durability are bounded causal per-round state. Snapshot preflight validates the whole candidate before writes; unsupported old compatibility is refused explicitly."
        - "[ai] Each actual burst emission still pays its own ordinary work and captures its own granted strike_damage_bonus. A later round cannot inherit an earlier paid boost or receive current upgraded equipment payload. A pending burst preserves its original profile, origin/pattern and cadence while ordinary machinery availability can delay emission."
        - "[ai] Actual guided Physics advancement clips travel to remaining life and keeps its final interval on the same vector through Damage. Physical PDC impacts run before surviving guided endpoint payloads and expiry settle; no saved pending-impact queue exists. Both projectile families expose only paired interval-local previous pose and positive travelled seconds, with common-live-time CCD and no retrospective newborn crossing. Standalone pure tick wrappers retain advance-plus-expiry behavior through the same executor."
        - "[ai] Interception reuses the actual finite-round bolt, mount, delivery and individual bank controller. Only permitted measured missile returns can support a selection; private physical projectile identity is confined to an authorised actuator/impact route. Relative moving-body collision uses only previous/current actual pose scratch on each existing projectile during the Physics/Damage interval; Damage clears it, and settled snapshots/digests retain only canonical current pose. Unknown allegiance or target intention is not fabricated. Target-domain data, shared actual resource costs and ordinary assignment/Hold rules constrain operation."
        - "Post-launch intent, actual receiver/link limits and independent Science illumination are separate dependent slices. This profile preparation does not claim working interception, guidance, Workshop operation, playable acceptance or a verified increment exit."

  - decision: guided-round-source-removal-continuity
    core:
      status: accepted
      confidence: confirmed
      title: Launched Guided Rounds Outlive Their Launcher
      summary: "Actual source removal or capability replacement drains both existing already-emitted TorpedoSystem and BlasterSystem vectors in one source transaction into the same nonspatial carrier, retaining round identity, attribution, frozen profile and remaining flight. The carrier has no ship, control, AI, launch tube, stock, pending burst or energy consumer."
      rationale:
        - "[ai] The first component replacement/removal hook drains both families; the second sees empty vectors and mints nothing, so ComponentId/archetype registration order cannot swap carrier identities. The ordinary lifecycle and observation producers continue to read those actual vectors; there is no second projectile pool or controller. Snapshot-only ordered bolt bank IDs derive from actual flight-only bank configs and recreate that closed shape without another runtime ID store. Closed carrier continuation is recreated directly, with full-candidate shape and identity checks. After ordinary Physics and Damage, one common settlement prunes empty flight-only bolt banks and removes a carrier only when both actual projectile families are empty; snapshots never park finished empty banks or carriers."
        - "[ai] Exclusive snapshot roster replacement suppresses carrier creation from discarded bootstrap state. Replacement launcher copies cannot duplicate or upgrade already-launched IDs. A body GM inverse whose capture contains launched guided or bolt rounds is refused before spawning, including after those old rounds have hit or expired; deliberate current-flight rejoining is not part of this increment checkpoint."
  - state: weapon-flight-carrier-state
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Weapon Flight Carrier Identity
      summary: "A folded zero-sized entity marker distinguishes a nonspatial continued flight owner from an operable ship. Actual physical flight remains in the existing TorpedoSystemResource or BlasterSystemResource."
    architecture:
      classification: authoritative
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console/weapons/flight_carrier.rs, crates/phoenix-simulation/src/snapshot/flight_carriers.rs]
      symbols: [WeaponFlightCarrier]
      tests: [crates/phoenix-simulation/src/console/weapons/flight_carrier_tests.rs]
  - state: weapon-flight-restore-guard
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Weapon Flight Restore Write Guard
      summary: "Transient exclusive restore context prevents discarded bootstrap flight vectors from becoming extra carriers. It has no saved or folded value and is restored after the roster replacement."
    architecture:
      classification: derived
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/console/weapons/flight_carrier.rs, crates/phoenix-simulation/src/snapshot/restore.rs]
      symbols: [RestoreGuard]
      tests: [crates/phoenix-simulation/src/console/weapons/flight_carrier_tests.rs]

  - decision: guided-round-finite-observations-and-links
    core:
      status: accepted
      confidence: confirmed
      title: Guided Flight Uses Its Own Finite Observations
      summary: "Each emitted round freezes optional finite seeker and guidance receiver equipment in its existing launch profile. Its actual vector retains one last accepted guidance observation with original sample tick and provenance. Physical collision truth never becomes an unlimited guidance feed."
      rationale:
        - "[ai] Seeker observations sample only the round's current intended physical route within actual round-local three-dimensional range, forward arc and Sensors path transmission. Missing, out-of-range or occluded subjects provide no new observation. No seeker means no autonomous acquisition; retained observations remain at their original measured point and sample time. Movement, endurance, interception and physical proximity remain the existing owners."
        - "[ai] Remote intent changes address the actual source tube and actual emitted round, require its frozen receiver and the live source equipment's normal ownership, Operation condition and paid work, and traverse a finite Comms path. The target must be a current permitted Console measurement; receipt never renews its original sample tick. Cancelling guidance clears guidance intent without deleting or detonating the actual round, changing payload or replenishing endurance. Independent rounds refuse remote changes."
        - "[ai] Science illumination is independently authored System equipment with its own target/enabled commands, shared mount geometry and paid work. It can provide bounded assistance through explicit observation feeds and supported receiver equipment. It never changes Tactical's selected target, grants launch authority or becomes a universal firing-permission requirement. Human and ordinary per-System AI use the same admission and supported observations."
        - "[ai] Seeker/receiver fields and retained observation provenance/timing are closed, finite, saved and folded on the existing projectile record. Whole-candidate restore rejects malformed or future observations before writes. Reference equipment receives explicit finite authored profiles; unsupported old state is refused rather than given an unlimited legacy seeker. This declaration precedes its runtime, authoring and continuation checkpoints and claims no completed playable exit."

  - decision: guided-source-knowledge-and-paid-links
    core:
      status: accepted
      confidence: confirmed
      title: Source Guidance Controls Retain Own Orders Rather Than Remote Truth
      summary: "A source ship retains its own emitted IDs, tube ownership, known launch endurance, issued orders and actual viable-link acknowledgements. This knowledge is distinct from the one physical projectile intent and never enumerates remote survival, health or pose."
      rationale:
        - "[ai] Human controls and ordinary individual tube AI consume the same source knowledge. Out-of-contact orders remain unresolved; retirement may use known frozen launch endurance, never a hidden death lookup. The ledger survives source capability replacement and hosting changes without granting a transmitter to removed equipment. Technical retention bounds are not simulated message capacity."
        - "[ai] Current owning tube equipment's paired receiver profile, Operation condition and ordinary paid work bound source transmission. The actual emitted round's frozen receiver independently bounds reception. Both finite range/transmission policies and the actual Comms path must pass. Acknowledgement requires a separately viable reverse path; a missing/dead/unreachable round supplies no secret refusal detail."
        - "[ai] A current permitted XYZ target reading requires actual observed elevation and retains the original radar samples and optional report metadata. Link delivery never renews sample age. Stop changes physical guidance intent only when actually received, without destroying the round, payload or endurance. Science illumination is an independently controlled paid observation aid for matching existing intent, never a Tactical retarget authority."
  - state: guided-source-order-knowledge
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Source-Owned Guided Launch and Order Knowledge
      summary: "Own emitted identity/tube/known endurance plus sent order and viable-return acknowledgement history. No remote health, live pose or competing physical intent."
    architecture:
      classification: authoritative
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:
      status: declared
      paths: [crates/phoenix-model/src/guided_orders.rs, crates/phoenix-sim-gameplay/src/weapons/guided_orders.rs, crates/phoenix-simulation/src/console/weapons/guidance_link.rs, crates/phoenix-simulation/src/snapshot/guided_source.rs]
      symbols: [GuidedSourceKnowledge, ShipGuidanceKnowledge]
      tests: [crates/phoenix-sim-gameplay/src/weapons/guided_orders_tests.rs, crates/phoenix-simulation/src/console/weapons/guidance_link_tests.rs, crates/phoenix-simulation/src/snapshot/guided_source_tests.rs]

  - decision: independent-mounted-science-illumination
    core:
      status: accepted
      confidence: confirmed
      origin: ai
      title: Science Emits Paid Matching Guidance Without Retarget Authority
      summary: "An illumination_emitter is a supported composed System with its own Boolean enabled and EntityTarget channels, finite mount and transmission envelope, actual PowerInput and optional shared Turret. It forwards permitted dated XYZ only to receivers explicitly accepting external illumination whose existing physical intent already matches."
      rationale:
        - "[ai] The source must satisfy its own observed target/mount readiness, Operation and actual continuous work. No live foreign target pose is acquired by the emitter. Frozen receiver age, range, path and accept_external_illumination limits independently bound delivery; unsupported receivers receive no assistance. There is no redundant source sample-age tuning field."
        - "[ai] Assistance can refresh a matching round's held measured point beyond its finite own-seeker reach. It never changes its target, payload, endurance or launch authority. Losing work, aim, observations or link withholds new readings; previously accepted points remain original-time memory. The physical receiver census and application result never appear in source feedback."
        - "[ai] Human controls and the one ordinary per-System closed state tree share the exact enabled/target admission. The tree may retain a selected target or service an explicitly permitted mission request; it never receives a global Tactical selection or hidden physical roster. Science and Tactical can act independently. Workshop edits the supported component/channel/mount/tree data through the existing document transaction."
        - "[ai] Illuminate {target} extends the existing closed mission/doctrine Directive vocabulary with Sensors relevance only. It supplies a permitted request to an independently controlled emitter; it neither changes Destroy routing nor reuses Scan as an instruction to spend illumination. Existing text-reading continuation gates newly read requests before selection."
  - state: ship-illumination-intent
    core:
      status: accepted
      confidence: confirmed
      origin: ai
      title: Independent Illumination Command Channels
      summary: "Per authored emitter System, one generic enabled/target channel map. It stores own source intent only, with no receiver list, duplicate projectile intent or measured-world cache."
    architecture:
      classification: authoritative
      owner: shared-weapon-mount-and-delivery
      writers: [shared-weapon-mount-and-delivery]
    implementation:

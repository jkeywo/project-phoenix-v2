          SetRepairTargetPriority names a SYSTEM and the host pins it as that
          team's next job, leaving the ordinal untouched. The console emits only
          the latter, because a rank is not computable from what the console can
          see — the issue #737 projection shows Engineering the core rows, its own
          station's rows, and the single row each team is on site at, and that
          last row is precisely the one the sweep excludes from its candidates,
          so a client-side rank would be a rank over a list with holes in it.
        - >-
          [ai] What host-side resolution does NOT buy is reach. The same
          projection gates the LIST: a row the host did not send cannot be
          rendered and so cannot be tapped, which in practice means the core
          bucket and Engineering's own station. What it buys is that a tap on a
          row the console CAN show stays correct under the projection (the host
          ranks the whole group, not the visible slice), under re-ranking (damage
          landing between the tap and the hand-off moves the ranking but not the
          pinned row, so the console's [NEXT] highlight never labels a
          destination that was quietly reassigned), and as the visible set
          changes. Both payloads stay on the wire; the ordinal one is still the
          right shape for anything that genuinely means "the nth job".
    architecture:
      authority: request
      producer:
        - repair-console-interface
      consumer:
        - host-command-admission
        - host-repair-router
      validator:
        - host-command-admission
      trust_boundary: client-to-host
      payload: onsite-repair-priority
    implementation:
      status: declared
      paths:
        - src/core/messages.rs
        - src/core/codec.rs
        - gui/action-map.js
        - gui/repair-dispatch.js
      messages:
        - SetRepairPriority
        - SetRepairTargetPriority
      tests:
        - tests/client/action-map.test.js
        - tests/client/repair-dispatch.test.js

  - message: ai-repair-request-signal
    core:
      status: accepted
      confidence: confirmed
      title: AI Repair Request Signal
      summary: Advisory repair request whose post-lag outcome is either a projected human popup or an AI Repair queue input.
      rationale:
        - Human stations can ask socially, but AI-owned stations need an explicit in-game request surface.
        - A human recipient treats the request as advisory rather than a forced dispatch; an AI recipient retains it in RepairRequestQueue until its damage group is operational.
    architecture:
      authority: advisory
      producer:
        - station-owner-damage-interface
      consumer:
        - repair-console-interface
      payload: ai-repair-request

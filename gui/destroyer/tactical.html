<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.cruiser_tactical.doc_title">Project Phoenix — Tactical Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; position: relative; }
    .command-advice { flex-shrink: 0; display: flex; align-items: baseline; gap: 12px; padding: 6px 12px; border: 1px dashed var(--edge); background: rgba(var(--rgb-panel), 0.4); font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); }
    .command-advice[hidden] { display: none; }
    .command-advice .advice-heading { font-family: "Chakra Petch", sans-serif; font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; }
    .command-advice .advice-stance { color: var(--ink); font-weight: 700; letter-spacing: 0.08em; }
    .command-advice .advice-hint { color: var(--ink-faint); margin-left: auto; font-style: italic; }
    /* Phasers + blasters left, the scope, torpedoes + the target lock card
       right (issue #1378). `.scope-row`/`.scope-cell` are gui/console.css's
       one shared rule for "a scope with up to two control rails beside it"
       (issue #1375) — the same shape gui/destroyer/helm.html already uses.
       The two rail widths are the only thing this document supplies: wide
       enough for a bank row's label + status + FIRE button on a desktop
       landscape window, narrow enough that a phone's landscape window already
       needs the weapon rows' own wrap (see the three `ph-*-controls`
       components' `flex-wrap`). Portrait stacks scope-then-rails at full
       width, same as every other `.scope-row` console — the scope becomes as
       big a square as the phone's width allows. */
    .console-body { --scope-rail-start: 230px; --scope-rail-end: 230px; --scope-rail-min: 190px; }
    .console-body .ctrl-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; overflow-y: auto; }
    ph-phasers-controls, ph-blasters-controls, ph-torpedo-controls, ph-target-lock-card { flex-shrink: 0; }
    /* The scope is square by gui/console.css's one `.scope-cell` rule
       (issue #1375): side = min(free width, free height), so it fills the
       rail's-worth of remaining width in landscape and the full width in
       portrait. */
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-dossier-panel { flex: 1; min-height: 0; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body .ctrl-col { padding: 8px; } .overlay-panel { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Tactical Console" data-i18n-attr="data-screen-label:console.tactical.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row, no overlay toggles and no footer (issue #1374): the
           shell's Station Bar names this seat, offers Security and Intel as
           tabs of its own (issue #1373 — the panels below declare them), and
           opens the per-system damage popup on its selected tab. The locked
           target the footer named heads the weapons column it belongs to. -->
      <!-- Non-binding Command intent advice (issue #1108). Shown only while
           Command directs this Station and a human holds it: advisory, never a
           control. Populated from `s.command_advice` in render(). -->
      <div class="command-advice" id="command-advice" hidden>
        <span class="advice-heading" data-i18n="console.command.advice_heading">COMMAND INTENT</span>
        <span class="advice-stance" id="command-advice-stance">—</span>
        <span class="advice-hint" data-i18n="console.command.advice_hint">Advisory — you retain control</span>
      </div>
      <!-- Phasers + blasters left, the scope, torpedoes + the target lock
           card right (issue #1378). The target lock card is fed by
           `renderTargetCard` in gui/stations/tactical-console.js, off the SAME
           Tactical lock the radar and weapon panels already read — never the
           Sensors selection. -->
      <div class="console-body scope-row">
        <div class="ctrl-col weapons-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="tactical-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <ph-phasers-controls id="phasers-controls"></ph-phasers-controls>
          <ph-blasters-controls id="blasters-controls"></ph-blasters-controls>
        </div>
        <div class="radar-col scope-cell">
          <ph-tactical-radar id="tactical-radar"></ph-tactical-radar>
        </div>
        <div class="ctrl-col torpedo-col">
          <ph-torpedo-controls id="torpedo-controls"></ph-torpedo-controls>
          <ph-target-lock-card id="target-lock-card"></ph-target-lock-card>
        </div>
      </div>
    </div>
    <!-- Intelligence files (issue #1030). Independent of Comms, which is now
         its own hero-bar console (issue #1098) rather than a toggle here. -->
    <!-- Security teams (issue #1346): the team list, their assignments and
         progress, and the eligible targets/actions to send them to. -->
    <!-- `data-tab-code` is what makes a panel a TAB on the shell's Station Bar
         (issue #1373): the console declares its overlays and the bar renders
         them between this seat and its visitors. Both attributes carry
         strings.csv IDS, not English — the shell resolves them at the render
         site the same way it resolves a Station's own name off the wire. -->
    <div class="overlay-panel" id="security-overlay"
         data-tab-code="console.tactical.security.code"
         data-tab-name="console.tactical.security">
      <button class="overlay-back" id="security-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.tactical.security">Security</h2>
      <ph-security-teams id="security-teams"></ph-security-teams>
    </div>
    <div class="overlay-panel" id="intel-overlay"
         data-tab-code="console.tactical.intel.code"
         data-tab-name="console.tactical.intel">
      <button class="overlay-back" id="intel-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.tactical.intel">Intel</h2>
      <ph-dossier-panel id="dossier-panel"></ph-dossier-panel>
    </div>
  </div>
  <script type="module">
    import '../components/ph-tactical-radar.js';
    import '../components/ph-phasers-controls.js';
    import '../components/ph-blasters-controls.js';
    import '../components/ph-torpedo-controls.js';
    import '../components/ph-target-lock-card.js';
    import '../components/ph-dossier-panel.js';
    import '../components/ph-security-teams.js';
    import { initConsole } from '../console-core.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    // The render lives in gui/destroyer/tactical.console.js (issue #1234): the
    // shared Tactical renderer + this hull's variant (dossier + Command-intent
    // tail). s is a system-id-keyed SystemStationConsolePayload; ship pose comes
    // from the weapons view, like every other hull. The vitest suite imports the
    // same renderStation.
    import { renderStation } from './tactical.console.js';

    // One delegated listener drives every `data-overlay-back` button on the
    // page (gui/console-overlays.js). Since issue #1374 no console authors an
    // in-console `data-overlay` TOGGLE at all: the shell's Station Bar selects
    // an overlay through `__setConsoleOverlay`, and the panel's own Back
    // button is the only in-console way out of it.
    initConsoleOverlays();

    initConsole({ name: 'tactical', render: renderStation });
  </script>
</body>
</html>

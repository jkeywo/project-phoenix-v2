  - state: impulse-manoeuvre-policy-state
    core:
      status: implemented
      confidence: confirmed
      title: Impulse Manoeuvre Policy State
      summary: Ship-authored impulse/boost manoeuvre policy — the harsh in-impulse steering multiplier and boost-during-impulse availability, plus (since #780) the authored inline AI policy blocks that gate whether the impulse and boost fine actuators may engage this tick.
      rationale:
        - Impulse should not force steering fully to zero; the standard steering multiplier is 0.1 so course correction remains possible but severe.
        - Boost is unavailable while impulse is active, regardless of the ship's normal boost capability.
        - The steering multiplier and any ship-specific override belong in authored capability data rather than executable constants.
        - "Issue #780 made this state the AC6 home for authored impulse/boost MANOEUVRE POLICY: the [helm_console.impulse_ai] and [helm_console.boost_ai] blocks (HelmImpulseAiPolicy / HelmBoostAiPolicy) are authored per-hull and resolved by helm-impulse-ai-operator / helm-boost-ai-operator to decide whether each drive may engage this tick, respecting the ship's authored policy AND capability availability. At #780 an omitted block was filled by a Rust synthesiser whose defaults preserved the baseline (impulse unconditional permit, boost idle)."
        - "Issue #885 (8555e336) removed that fallback. The synthesisers default_impulse_ai_config / default_boost_ai_config are DELETED, strict AI-declaration mode is the default in EntityConfig::from_toml, and an AI-capable fine system that declares no block is a LOAD ERROR — so on any hull that loads, both blocks are authored content. There is no longer a Rust-side default to describe."
    architecture:
      classification: authoritative
      owner: ship-capability-model
      readers:
        - helm-input-arbiter
        - host-helm-control-router
        - helm-impulse-ai-operator
        - helm-boost-ai-operator
    implementation:

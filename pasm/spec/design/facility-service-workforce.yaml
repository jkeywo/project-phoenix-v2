entities:
  - decision: facility-port-workforce-uses-actual-visit-scoped-team
    core:
      status: accepted
      confidence: confirmed
      title: Staff One Physical Port Visit With Existing People And Team Jobs
      summary: "Adopted bounded increment 21/20 consumer: an optional actual non-Ship fixed provider uses its actual finite Repair team and named Fit service lead at the Dock compartment; one shared assignment binds one physical visitor/PortVisit while existing PortOrder/flow alone owns paid service work and delivery. Runtime evidence and the broader workforce exit remain required."
      rationale:
        - "Root adopted the independently reviewed source audit, authority limits, ownership joins, authoring and continuation requirements in docs/gameplay-redesign/implementation/increment-21-staffed-port-contract.md. This decision changes no runtime and does not establish workforce or full21 completion. Preserve shipped unmanned ports."
        - "Factor the existing accepted Repair team/CompiledPersonnel/sole PersonnelRoster installation into the capability-bearing fixed-entity path once, then extend only its actual owning Repair consumers beyond Ship filters. Add no Ship marker, propulsion, duplicate team count or surrogate population."
        - "Reuse MechanicalRepair on both finite team and actual named lead. This optional specialist requirement consumes the existing Fit/Minor/Severe condition and WithRepairTeam location through the same cursor; it is not a universal Officer requirement, team-member injury simulation or service-rate bonus. Existing internal-repair multipliers retain their scope."
        - "Append one RepairActivity assignment using the same TeamJobs mint, exclusivity, route, workflow and physical return. Immutable scope binds provider Repair/Dock, actual visitor and PortVisit, team and PersonRef. The same ordinary Repair AI consumes own permitted current visit/officer/team views, emits normal posting(Some) from idle home before later service dispatch, and passes existing admission; revalidate exact intent before claim/mint. Visit end, unfitness or refused willingness produces normal Recall, physical home and posting(None), then actual existing local care when equipped/funded. No pre-posted fixture or unavailable Human provider is required; unrelated jobs are not preempted. No provider service timer, extra queue, location copy, staffing scheduler or second controller."
        - "Join the actual WorldContentRuntime workforce record through existing infrastructure.workforce, with an explicitly authored disposition policy and strike test. Opted-in missing/unknown/unarmed required consent fails closed; do not alter legacy unstaffed-port or unknown-group behaviour. Register facts, not mirror flags, meet actual people/condition/physical readiness at the Simulation join without sibling package imports."
        - "At actual port settlement require the matching live assignment and current physical visit, Fit compatible lead, unpaused on-site team and normal equipment/fitting/energy/access state before any work payment/progress/stock commit. One team cannot serve simultaneous visitors. Existing PortOrder/flow, pay_pair, finite stocks/quota and delivered receipts stay sole owners; passive loss and already delivered goods retain ordinary semantics."
        - "First provider is an ordinary AI-only outside actor, visitor Human or ordinary AI. Current network Human input routes to LocalShip, and non-player GM Station capability is Ship-only with audited Helm interfaces; authored Repair tabs or Comms acceptance grant no fixed-provider authority. Remote Human provider/GM Repair control requires a later real interface audit and is excluded here."
        - "Whole-candidate continuation binds actual team/officer/assignment/route/visit/consent definitions before writes and refuses missing required state. Require actual paid Human-visitor/ordinary-provider work, competing commitments, condition/care/strike/access interruption, finite concurrent visits, physical return, losses and JSON360 full capture/digest/no-write evidence. Root retains adoption, compatibility epochs, central schedule/census, native/gates and integration ownership."

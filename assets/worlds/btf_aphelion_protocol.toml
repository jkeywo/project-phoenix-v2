# btf_aphelion_protocol.toml — Aphelion Protocol finale sub-world
#
# Loaded by before_the_fire.toml when the `aphelion_armed` flag is set.
# Ashrender is already set to attacking by the root-world trigger.
#
# Four endings are available:
#   FIGHT      — destroy Ashrender (on_destroyed Ashrender)
#   EVACUATE   — coordinate evacuation with Axiom Station (three-round dialogue
#                + on_timer at 300 s gated by evacuation_rounds counter)
#   CONTAINMENT — hold position in the Radiation Zone for 30 s
#                (on_entered_region sets flag; on_timer at 30 s checks it)
#   REQUIEM OVERRIDE — hail Requiem Courier and accept the abort code

# ── Entities ──────────────────────────────────────────────────────────────────

[[entity]]
template_path = "assets/entities/region_radiation_zone.toml"
name          = "world.entity.radiation_zone.name"
transform     = { position = [620.0, 0.0, -380.0] }

# ── Triggers ──────────────────────────────────────────────────────────────────

# Issue #405 — finale objective on world load
[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-finale"
  text      = "world.btf_aphelion_protocol.trigger.action.obj_finale.text"
  mandatory = true

# Issue #406 — FIGHT ending: destroy Ashrender
[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.ashrender.name"

  [[trigger.action]]
  type    = "game_over"
  message = "world.btf_aphelion_protocol.trigger.action.0.message"

# Issue #408 — CONTAINMENT: enter the Radiation Zone to begin survival window
[[trigger]]
condition = "on_entered_region"
entity    = "world.entity.radiation_zone.name"

  [[trigger.action]]
  type = "set_flag"
  name = "containment_started"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-containment"
  text      = "world.btf_aphelion_protocol.trigger.action.obj_containment.text"
  mandatory = false

# Issue #408 — CONTAINMENT: 30-second survival window fires game_over
# (crew must enter the zone within the first 30 s of this sub-world loading)
[[trigger]]
condition  = "on_timer"
after_secs = 30.0
when       = "flag(containment_started)"

  [[trigger.action]]
  type    = "game_over"
  message = "world.btf_aphelion_protocol.trigger.action.2.message"

# Issue #407 — EVACUATE: full evacuation game_over (all three rounds complete)
[[trigger]]
condition  = "on_timer"
after_secs = 300.0
when       = "counter(parent:evacuation_rounds) >= 3"

  [[trigger.action]]
  type    = "game_over"
  message = "world.btf_aphelion_protocol.trigger.action.3.message"

# Issue #407 — EVACUATE: partial evacuation game_over (at least one round, fewer than three)
[[trigger]]
condition  = "on_timer"
after_secs = 300.0
when       = "counter(parent:evacuation_rounds) >= 1 and not counter(parent:evacuation_rounds) >= 3"

  [[trigger.action]]
  type    = "game_over"
  message = "world.btf_aphelion_protocol.trigger.action.4.message"

# ── Comms templates ───────────────────────────────────────────────────────────

# Issue #405 — Ashrender's warning transmission (on world load, no responses)
[[comms]]
from    = "world.entity.ashrender.name"
trigger = "on_world_loaded"
entity  = "world.entity.ashrender.name"
urgent  = true
message = "world.btf_aphelion_protocol.comms.0.message"

# Issue #405 — Starcorp Command urgent order (on world load, no responses)
[[comms]]
thread_id = "starcorp-command"
from    = "world.btf_aphelion_protocol.comms.starcorp_command.from"
trigger = "on_world_loaded"
urgent  = true
message = "world.btf_aphelion_protocol.comms.starcorp_command.message"

# Issue #405 — Requiem House encrypted offer (on world load, no responses)
# The actual override exchange is handled by the on_hailed comms below.
[[comms]]
thread_id = "requiem-override"
from    = "world.entity.requiem_courier.name"
trigger = "on_world_loaded"
entity  = "world.entity.requiem_courier.name"
message = "world.btf_aphelion_protocol.comms.requiem_override.message"

# Issue #407 — Axiom Station evacuation: three-round dialogue via nested follow-ups.
# Round 1 fires when the crew hails Axiom Station; rounds 2 and 3 are chained
# as follow-up nodes within the same dialogue session so the evacuation_rounds
# counter can be incremented correctly without requiring schema-level comms gating.
[[comms]]
from    = "world.entity.axiom_station.name"
trigger = "on_hailed"
entity  = "world.entity.axiom_station.name"
message = "world.btf_aphelion_protocol.comms.1.message"

  [[comms.response]]
  text = "world.btf_aphelion_protocol.comms.response.0.text"

    [[comms.response.action]]
    type = "increment_flag"
    name = "evacuation_rounds"
    by   = 1

    [[comms.response.action]]
    type      = "add_objective"
    id        = "obj-evacuate-r1"
    text      = "world.btf_aphelion_protocol.comms.response.action.obj_evacuate_r1.text"
    mandatory = false

    [comms.response.follow_up]
    message = "world.btf_aphelion_protocol.comms.response.follow_up.message"

      [[comms.response.follow_up.response]]
      text = "world.btf_aphelion_protocol.comms.response.follow_up.response.0.text"

        [[comms.response.follow_up.response.action]]
        type = "increment_flag"
        name = "evacuation_rounds"
        by   = 1

        [[comms.response.follow_up.response.action]]
        type      = "add_objective"
        id        = "obj-evacuate-r2"
        text      = "world.btf_aphelion_protocol.comms.response.follow_up.response.action.obj_evacuate_r2.text"
        mandatory = false

        [comms.response.follow_up.response.follow_up]
        message = "world.btf_aphelion_protocol.comms.response.follow_up.response.follow_up.message"

          [[comms.response.follow_up.response.follow_up.response]]
          text = "world.btf_aphelion_protocol.comms.response.follow_up.response.follow_up.response.0.text"

            [[comms.response.follow_up.response.follow_up.response.action]]
            type = "increment_flag"
            name = "evacuation_rounds"
            by   = 1

            [[comms.response.follow_up.response.follow_up.response.action]]
            type      = "add_objective"
            id        = "obj-evacuate-r3"
            text      = "world.btf_aphelion_protocol.comms.response.follow_up.response.follow_up.response.action.obj_evacuate_r3.text"
            mandatory = false

# Issue #409 — Requiem Override: hail the Requiem Courier to accept the abort code
[[comms]]
thread_id = "requiem-override"
from    = "world.entity.requiem_courier.name"
trigger = "on_hailed"
entity  = "world.entity.requiem_courier.name"
message = "world.btf_aphelion_protocol.comms.requiem_override.message_2"

  [[comms.response]]
  text = "world.btf_aphelion_protocol.comms.response.1.text"

    [[comms.response.action]]
    type = "set_flag"
    name = "requiem_override_accepted"

    [[comms.response.action]]
    type   = "destroy_entity"
    entity = "world.entity.requiem_courier.name"

    [[comms.response.action]]
    type    = "game_over"
    message = "world.btf_aphelion_protocol.comms.response.action.3.message"

  [[comms.response]]
  text = "world.btf_aphelion_protocol.comms.response.2.text"

  - state: onsite-repair-detail-state
    core:
      status: implemented
      confidence: confirmed
      title: On-Site Repair Detail State
      summary: Exact non-core damage detail revealed to Engineering only for a station where a repair team is currently on site.
      rationale:
        - Team travel is both a repair delay and an information delay.
        - Recalling a team before arrival should not reveal hidden details.
        - >-
          Issue #737: the on-site predicate is the named
          `RepairTeams::on_site_systems`, which counts only `TeamSlot::Repairing`.
          `Travelling` has not arrived and `Returning` has left, so a team
          recalled before arrival goes `Travelling -> Returning` without ever
          passing through `Repairing` and never reveals anything. The predicate
          is named rather than inlined so the publisher and this entity point at
          one symbol.
        - >-
          The wire projection is not the only door into this state. The
          channel-3 coordination bus carries
          `CoordinationPayload::RepairRequest`, which targets the `repair`
          system and therefore lands on the Engineering holder as a
          `CoordinationPopup`. It was introduced by issue #682 carrying the
          exact HP deficit, which handed Engineering that number on every
          worsening tier crossing of an arbitrary non-Core system, with no team
          dispatched and no travel elapsed. That is a leak, not a designed
          exception: it contradicts the rule this state exists to express, so
          the payload's `deficit` is now `Option<f32>` and is gated through the
          same `HullVisibility::can_see` — and therefore the same
          `on_site_systems()` set — as the hull rows. Core systems and the
          recipient's own systems keep the exact number. Everything else still
          raises the popup and still names the tier; the number is simply
          absent, which is the coarse "needs attention" signal. `deficit` stays
          exact on the host-internal enqueue because the AI repair queue sorts
          by it.
    architecture:
      classification: player-knowledge
      owner: repair-visibility-publisher
      derived_from:
        - authoritative-damage-state
        - repair-team-state
    implementation:
      status: suspected
      paths:
        - src/modifiers/repair_teams.rs
        - gui/console-state.js
      symbols:
        - on_site_systems
    evidence:
      - kind: test
        reference: travelling_team_does_not_reveal_non_core_detail_to_engineering
        summary: A team part-way through its travel leg reveals nothing.
      - kind: test
        reference: arrival_reveals_non_core_detail_to_engineering
        summary: >-
          Once travel completes and the slot becomes `Repairing`, the target
          system's exact detail appears in Engineering's projection.
      - kind: test
        reference: recall_before_arrival_never_reveals_detail
        summary: >-
          Walks the entire return leg of a recalled team and asserts the detail
          never appears at any point.
      - kind: test
        reference: detail_is_withdrawn_again_once_the_team_leaves
        summary: >-
          Recall from `Repairing` withdraws the detail immediately, so the
          reveal tracks presence rather than latching on first arrival.
      - kind: test
        reference: live_broadcast_reveals_non_core_detail_once_a_team_is_on_site
        summary: The reveal is visible end-to-end on the broadcast wire path.
      - kind: test
        reference: engineering_gets_no_non_core_queue_entry_before_a_team_arrives
        summary: >-
          The queue preview obeys the same arrival gate as the hull rows;
          `engineering_gets_the_non_core_queue_entry_once_a_team_is_on_site`
          is the paired positive, and the reveal stays per-station.
      - kind: test
        reference: repair_popup_withholds_exact_non_core_deficit_before_a_team_arrives
        summary: >-
          The channel-3 `RepairRequest` popup reaches the Engineering holder
          with the tier but no exact deficit while the reporting non-Core system
          has no team on site.
      - kind: test
        reference: repair_popup_carries_the_exact_deficit_once_a_team_is_on_site
        summary: >-
          The paired positive: a team on site opens the same gate on the
          coordination bus that it opens on the wire projection.


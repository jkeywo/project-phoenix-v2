entities:
  - decision: layered-combat-equipment-and-engagement-choice
    core:
      status: accepted
      confidence: confirmed
      title: Equipment Creates Several Viable Engagement Styles
      summary: "Increment15 adopts G048–54/S001–16: useful long-range slower missiles, finite dual-purpose PDC interception, sustained/projectile weapon configurations and distinct broadside geometry extend the shared weapon machinery. The missile/PDC/broadside example is not a mandatory sequence, universal transit lock or new combat-load meter."
      rationale:
        - "User authorised increments7–18 and the pinned validation pipeline. docs/gameplay-redesign/implementation/increment-15.md fixes the implementation slices and exit evidence before runtime work; it does not claim completion."
        - "[ai] Extend existing beam/bolt/guided, common mounts/barrels, resources and physical damage owners. Static mounts, fixed active periods and independent loaders remain supported configurations. Shared finite loaders, kinetic rounds/recoil and richer beam operation are real consumers, not competing state or new mandatory crew seats."
        - "[ai] Optional per-weapon target tags are a closed EntityTag selection filter. Omission preserves the caller's established permitted ordinary actuator domain without inventing unknown classification; an explicit empty array has no eligible targets; explicit tags match only held observed tags with OR semantics and no duplicates. Authored targets=false clears an inherited filter back to ordinary policy. Physical collateral is independent of selection filters. Portable beam definitions carry the same immutable capability policy; no additional target/AI owner is introduced."
        - "[ai] Beam operation is closed Fixed or Sustained; Fixed remains the default, Sustained uses real paid work without an infinity timer and ends through the same active-slot stop/loss paths. Sustained has no fixed-cycle jitter. The existing active beam slot freezes launch mode; portable BeamHardware carries the actual mode."
        - "[ai] Finite bolt rounds bind an actual same-compartment Local Capacity store owned by the bank. Reserve exact rounds before staged Power payment, then consume or release that same claim. A due step attempts only listed physical barrels once in authored order; unavailable or unfunded barrels are skipped with no substituted barrel, free projectile ID or ammo count mirror. Recoil follows the actual world projectile bearing in existing impulse units."
        - "[ai] Optional Broadside Cruiser is explicit provisional tuning: sustained aft beam plus a two-barrel side battery, impulse6,22 actual starting kinetic rounds,44 extra authored bay-space units and a finite local energy consumer sharing the existing Weapons parent. Generation/default Cruiser data remain unchanged. Native executor and balance/continuation evidence are integrator-owned; source preparation is not a verified15 exit."
        - "[ai] Actual slower-missile host probes reach real launches but expose Broad's legacy unconditional unselectable ordnance publication. Its existing paid producer must honour the instrument's explicit Missile selection grant and canonical missile classification through normal timed acquisition; instruments without the grant retain unselectable ordnance. Ordinary PDC still needs current measured classified evidence, height/velocity and real geometry. This repairs the actual producer-to-controller join without publishing launcher/guidance/private positions or inventing observations."
        - "[ai] The optional Missile Cruiser explicitly authors each tube's existing barrel marker instead of the shipped legacy ship-centre fallback. Its optional PDC opponent uses Tactical broad position error0.05 and continuous work1.5 rather than2 and1; preserve all other atomic-profile fields, stocks, generation, acquisition times and weapon behaviour. Actual two-tube centre-overlap diagnostics motivate these provisional equipment choices, not private source-key association or weaker saturation assertions. Shipped hull tuning and ordinary measured ambiguity remain unchanged."
        - "[ai] The optional Missile Cruiser uses existing artillery doctrine with both axes at hold80/max100, actual guided speed5/lifetime120/range600 and matching finite seeker/receiver/Tactical radar reach. This explicitly delivers the selected slower/longer-range reference without changing shipped Cruiser stocks, generation, damage, assessment times or its broadside doctrine. Actual PDC producer diagnostics found loaded arc opportunities at tick183 but first shield assessment at361 after that old approach turned away; retain that failed evidence, use the suitable configured opponent, and never invent shield facts or weaken launch/interception/saturation/conservation assertions. Tuning remains provisional pending real comparative evidence."
  - decision: layered-combat-targets-and-support-authority
    core:
      status: accepted
      confidence: confirmed
      title: Tactical Chooses Targets and Science Allocates Assistance
      summary: "G048/G105/S015/S055/S096 retain primary-target play with explicit prepared group/System assignments and persistent individual overrides. Science makes persistent illumination assignments; ordinary System AI maintains tracking. Illumination assists without selecting Tactical targets or granting/vetoing firing permission. Helm retains motion authority."
      rationale:
        - "Unassigned delegated offence prefers the primary; authored doctrine may permit secondary targets or strict concentration. A group command cannot overwrite an active individual override. Group membership is authored/saved rather than a general live regrouping task."
        - "[ai] Prepared group and individual orders remain explicit intent. An ordinary defensive bank can retain an automatic contact through its normal admitted System command channel; this is a fallback only when there is no explicit order and the primary is ineligible for that bank. The same canonical assignment owner stores it and normal Console projection withholds unavailable references. Ordinary bank AI selects only eligible current measured contacts; defensive urgency derives from observed approach, not hidden allegiance, launcher target or future trajectory. This extends the existing controller rather than creating a PDC controller."
        - "[ai] Ordinary paid Broad assessment can record whether shielding obstructed its observing ray, with a one-degree world bearing and original assessment time. This is an acquired up/down observation, not shield HP, frequency, private target yaw or future coverage. Human readouts and individual weapon AI use the same permitted record; changed approach, stale/contradictory evidence and missing records withhold the shield fact rather than imply zero shielding. Optional focused frequency enquiries remain separate."
        - "[ai] Ray compatibility uses that same record's published position/error cone plus the existing one-degree bearing tolerance. Comparing a physical measured bearing to an uncertain point as though the point were exact rejects ordinary valid observations. Use only permitted record geometry; nonfinite/negative error, an observer inside the uncertainty disk, changed approach outside the cone, stale/predicted or contradictory evidence still withhold the fact. No live subject position or shield state enters this check."
        - "[ai] Shared finite-traverse mounts are one physical aim owner reused by weapons/sensors; multiple components do not create independent hidden barrels. Explicit Console feeds convey information only. Closed per-System trees emit normal typed commands and replace each migrated controller rather than run beside it."
        - "[ai] The first finite mechanism is an explicit Turret plus referenced PowerInput component on an actual supported bank, tube or passive receiver. It borrows that System's existing effective target and availability, with no declared unread target/on-off channels, second controller or saved intent copy. Weapon intent is the admitted assignment/primary; passive intent is its canonical enabled state and permitted Science designation. Missing intent returns toward authored home through paid traversal. Only the same Console's current selectable measured point can aim it; actual actor positions and lost/predicted tracks do not."
        - "[ai] One ShipMounts map stores bounded f64 bearing offsets and replay frontiers; immutable MountProfiles derive from accepted composition. Limited sectors travel through their supported sector rather than shortcut across its forbidden back. Actual local work grant and Operation fraction bound movement, disabled/unfunded work freezes, and continuation preflights exact owners/sector/clock before writes. Static no-Turret mounts retain their existing geometry."
        - "[ai] First authored tuning: Cruiser fore beam gains 270-degree mechanical traverse at 45 degrees/sec and 2-degree tolerance; passive receiver gains full mechanical rotation at 90 degrees/sec and 2-degree tolerance, with its former 360-degree instantaneous field of view intentionally narrowed to 120 degrees. Its existing range100, paid receiver reserve and broad radar remain unchanged. Inherited Dynasty uses the same hardware. These are explicit incremental equipment changes, not a claim of unchanged combat balance or completed15 acceptance."
  - decision: layered-combat-observed-ordnance-and-guidance
    core:
      status: accepted
      confidence: confirmed
      title: Finite Ordnance and Interception Use Real Evidence and Links
      summary: "S003/S008/G051 select finite guided flight and ordinary AI interception of observed ordnance, including protection of other assets inside actual reach/coverage. Suitable rounds accept supported post-launch intent over working equipment links; independent/fixed-intent variants remain. Full3D small-ordnance flight preserves planar capital ships."
      rationale:
        - "PDC offence and interception compete for the same tracking, ammunition, local energy and heat. Saturation is an actual shortfall, not guaranteed defence or compulsory manual aiming. Helm projections use observed motion/uncertainty, never future guidance or hidden impact truth."
        - "[ai] Freeze actual payload properties and resources at launch. Link loss follows supported receiver/seeker intent rules; ship upgrades or later targeting messages cannot change payload damage, mint ammunition or provide a perfect global target feed. Expanded channel/relay/security remains increment16 and electronic attack/protection17."
  - decision: layered-combat-physical-payloads-and-temporary-conditions
    core:
      status: accepted
      confidence: confirmed
      title: Common Payload Effects Preserve Physical Consequences
      summary: "S009–12 extend existing impact/condition mechanisms with supported recoil, area exposure, penetration, EMP and limited physical marking observations. Area effects may harm eligible allies/civilians. EMP refresh retains max(remaining, new resistance-adjusted duration); longer-lived resistance stacks and reduces subsequent duration, with automatic expiry and no repair requirement."
      rationale:
        - "[ai] Keep temporary effect/resistance lifetime distinct from physical component condition/HP; apply shared status presentation. Author finite duration/stack/decay parameters and deterministic order when implementing, without inventing universal immunity or assuming a numerical interruption bound from the selected design."
        - "[ai] First EMP payload carries positive duration only and fully disables eligible component bindings while active. The actual frozen DamageProfile follows the existing shield interception, weighted-deck compartment trace and positive deposit; it adds no separate ray, HP pool or random draw. Receiver bindings and finite resistance policy are authored on DamageConfig. Apply duration/(1 + prior effective stacks * resistance_per_stack), round positive duration up to at least one actual fixed tick, retain the later expiry, then add one capped stack in existing deterministic hit order."
        - "[ai] Absolute applied/expiry/decay tick receipts travel with the actual ComponentState. Installed Operation condition and EMP remain solely ShipDamage; removal transfers both into the actual portable assembly and installation restores that assembly. Stowed effects age against the same causal clock, with no inventory timer or repair reset. The clock context is derived, not another saved condition owner. Shared status reports EMP separately from physical destruction. Full-candidate installed/portable receipt validation precedes restore writes."
        - "[ai] Each bounded causal receipt carries the receiver resistance policy that created its episode. Differing or absent EMP policy on a later hull cannot rewrite, reject or cleanse that valid carried effect/resistance. While effective stacks remain, refresh uses the original episode's reduction, cap and decay; after all stacks expire, a new eligible deposit starts an episode under the current receiver policy. Receipt validation binds its own closed policy, actual component binding and fixed clock, not the destination hull's current policy. Derived time is available for every physical owner, including hulls that cannot receive new EMP deposits."
        - "[ai] Explicit provisional first receiver tuning is resistance_per_stack0.5, max_stacks8, decay_secs20, Operation bindings on the shared physical hull profile. Stacks begin decaying one interval after the latest effect expiry and lose one per interval. The separate EMP Destroyer bolt example carries duration6 seconds; normal payloads remain unchanged. This authors a real optional physical consumer and does not establish balance or a complete increment15 exit."
        - "Penetration retains weighted decks and the 2D compartment path/material model. Components have no precise internal coordinates/HP. Scan-derived compartment/angle advice uses delivered findings and neither bypasses intervening structure nor steers Helm."
        - "A marking payload leaves actual finite/vulnerable equipment reporting supported observations while powered and linked, not a permanent tracking/aim flag. Reuse ordinary entity/resource/observation owners. General deploy/recover/mines and carried craft remain increment19; incomplete marking prerequisites must be recorded rather than claimed delivered."
  - decision: layered-combat-optional-investigated-shield-counterplay
    core:
      status: accepted
      confidence: confirmed
      title: Shield Probing Is Optional Equipment-Supported Investigation
      summary: "G050/S005 select optional focused scanner work that can support configured weapon tuning. Benefits are usually modest and more consequential against suitable special shields/penetrating equipment. Findings generally persist for the observed configuration; special equipment may rotate shield/beam configurations. Broad assessment is not unconditional protected weakness intelligence."
      rationale:
        - "This supersedes any interpretation of the older automatic frequency-hint path as a universal free shield answer or compulsory recurring retune. Retain ordinary target designation and explicit finding delivery; migrate frequency consumers to actual acquired permitted evidence before15 closes."
        - "[ai] Human and ordinary delegated probing/tuning share geometry, work, knowledge and consequences. Observable charging/preparation supports inference, not exact enemy intention or target/timer disclosure. Default combat remains viable without investigation."
  - decision: layered-combat-authoring-and-continuation-exit
    core:
      status: accepted
      confidence: confirmed
      title: Each Combat Slice Is Authorable and Continuable
      summary: "Every selected combat slice includes accepted data, actual human/delegated operation, closed AI, Workshop history/validation/Preview/Test and immediate deterministic snapshot/restore integration. Existing networking and System-addressed admission remain intact. Prepared source and initial commits are not verified exits."
      rationale:
        - "[ai] Preflight finite timers, identities/targets, assignments, mounted state, actual stocks/claims, flight/link intent, effects and observations before writes. Test active continuation plus different LocalShip fleet peers and the complete host phase graph. Advance compatibility explicitly and remove temporary data adapters before closing15."
        - "Retain 2/4/6/8 hull rosters and whole-System complexity/delegation. Validate concurrent combat/non-combat activity, communication, resource margin, waiting and overload; browser/native and human acceptance remain separate from automated evidence. The integrator owns final gates and push."

entities:
  - component: gm-t4-contact-classification
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Observer-Specific Reported Contact Classification
      summary: "The first M7 path sets or clears a reported sensor identity for one observing player ship and one real target. SetContactClassification selects an existing scenario/mod GM palette label; its resolved label is retained as interpreted information independently of Reveal/Conceal. It changes the Sensors contact name and selected classification plus the matching Sensors Viewscreen label, never the real entity, faction, physical properties or independently earned scan readings. The same ordinary Sensors builder supplies GM Crew Knowledge, so Truth and Crew Knowledge show the discrepancy without another knowledge evaluator."
      rationale:
        - "[ai] The running world's authored palette supplies the allowed labels. The command accepts a palette key or null to clear; it accepts no arbitrary asset path, ECS field, free-text identity or gameplay tuning. This first path reuses that existing authored vocabulary rather than depending on future per-ship epistemics APIs."
        - "[ai] Misclassification alone creates no contact. Conceal suppresses it; a Reveal-only basic point may carry the intentionally supplied label but still receives no raw protected hull, faction or scan facts. Independently earned scan readings, Comms and Objective knowledge remain separate evidence."
        - "[ai] Browser and native GM controls share the contact panel, confirmation category and typed Admission route. Absolute apply/clear requests wait for their exact attributed correlated result. Classification results appear in the ordinary journal and activity feed; there is no second command or history lane."
        - "[ai] The observing-ship/target map is canonical run state: ordered maps, agreed apply ticks, idempotent requests, snapshot capture/restore and conditional deterministic digest folding. The Sensors blackboard publishes only its observer's resolved labels, not the GM palette selection or another observer's interpretation."
        - "[ai] Entity disappearance prunes the pair; an attributed despawn captures its classification beside the existing visibility override and a despawn undo restores both without overwriting a newer pair. A new run clears the map. Clear classification leaves Reveal/Conceal untouched."
        - "[ai] Ghost and delayed/degraded reports have their own implemented owners below. This delivery does not claim a complete per-ship evidence store or alter crew authority, Backfill targeting, live truth or deterministic physics."
    architecture:
      kind: gm-information-control
      authority: authoritative
      coordinates: [gm-milestone-information-control, gm-t2-directed-world-actions]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_contact.rs, src/gm_action.rs, src/core/codec.rs, src/core/messages.rs, src/gm_projection.rs, src/gm_activity.rs, src/gm_puppet.rs, src/gm_despawn.rs, src/gm_despawn_undo.rs, src/ship/sensors.rs, src/server/radar.rs, src/world/server.rs, src/snapshot.rs, src/sim_digest.rs, gui/console-state.js, gui/gm-contact-panel.js, gui/gm-workspace.js, gui/native-gm-workspace.js, gui/gm-journal-panel.js, gui/gm-activity-feed.js, server.html]
      symbols: [ReportedClassification, ContactClassifications, set_classification, classification_labels, classify_viewscreen_contacts, SetContactClassification, ContactMisclassify, ContactClassificationNormal, createGmContactPanel]
      tests: ["cargo test --features headless --test gm_contact --test gm_despawn_undo", "npx vitest run tests/client/gm-contact.test.js tests/client/gm-knowledge-compare.test.js tests/client/gm-activity-feed.test.js tests/client/native-gm-workspace.test.js"]

  - component: gm-t4-ghost-contacts
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Observer-Specific Ghost Contact Reports
      summary: "SetContactInformation sets or removes one named false Sensors report for a live observing player ship. The report resolves an authored GM palette label and explicit integer world millimetres into a basic point. It has a reserved observer-local identity and never spawns an ECS entity, grants target authority or supplies physical facts. The same per-ship Sensors builder supplies the Crew Knowledge comparison, where the report is crew-only."
      rationale:
        - "[ai] Ghosts extend the accepted M7 radar-projection seam without a future C2 evidence-store or T5 dependency. The ordinary truth entity catalogue, physics, faction, Backfill and combat remain unchanged. Other observers receive none of the report."
        - "[ai] The browser and native GM workspace share the contact panel, palette, confirmation policy, exact correlated canonical result, journal and activity family. Ghost controls require an observer but no real target. Keyboard focus and palette options survive unrelated live entity updates."
        - "[ai] The canonical ordered observer/id map stores the resolved label and integer position. It participates in the deterministic digest and snapshot, clears on new run, and prunes on observing-ship disappearance. Set and remove are absolute and idempotent; a missing observer or palette refuses without mutation."
        - "[ai] Sensors and the Sensors Viewscreen use the existing basic-contact edge floor. The point is untargetable and carries no hull, faction, geometry or independently earned scan data. Crew Knowledge admits the reserved report identity without enriching it from raw entity truth."
        - "[ai] Mission TOML uses set_contact_information with an observing entity and typed contact_information change. Rhai set_ghost_contact and remove_ghost_contact buffer the same TriggerAction; dispatch resolves the observer and calls the same apply owner as GM admission. No second entity spawn or raw mutation path exists."
    architecture:
      kind: gm-information-control
      authority: authoritative
      coordinates: [gm-milestone-information-control, gm-t4-contact-classification]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_information.rs, src/gm_action.rs, src/core/codec.rs, src/core/messages.rs, src/gm_projection.rs, src/gm_activity.rs, src/gm_contact.rs, src/ship/sensors.rs, src/server/radar.rs, src/world/config.rs, src/world/dispatch.rs, src/world/server.rs, src/world/script/effects.rs, src/world/script/authoring.rs, src/snapshot.rs, src/sim_digest.rs, gui/console-state.js, gui/gm-contact-panel.js, gui/gm-knowledge-compare.js, gui/gm-workspace.js, gui/native-gm-workspace.js, server.html]
      symbols: [ContactInformation, ContactInformationChange, GhostContact, SetContactInformation, ghost_snapshots, viewscreen_ghosts, apply_scenario_command]
      tests: ["cargo test --features headless --test gm_contact ghost_", "cargo test --lib gm_information::", "npx vitest run tests/client/gm-contact.test.js tests/client/gm-knowledge-compare.test.js tests/client/native-gm-workspace.test.js tests/client/gm-confirmation.test.js"]

  - component: gm-t4-sensor-report-policy
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Observer-Specific Degraded and Delayed Sensors Reports
      summary: "The typed contact-information owner sets or clears a basic Sensors report policy for one observing fleet ship and one real target. Explicit u32 delay ticks, world-millimetre position grid and identity suppression control a bounded sample-and-hold pipeline over allowed observations. The ordinary Sensors builder, Crew Knowledge comparison and Sensors Viewscreen use the same reported name and position, with visible source, observation tick and age. No current-truth enrichment or pre-enable history is created."
      rationale:
        - "[ai] The accepted M7 scope is implemented without a future C2 evidence-store API. Each fleet hull retains its immutable authored Sensors radar config; capture uses canonical ship physics, current modifiers and allowed tag/range/point detection with recipient-filtered objective markers, or the explicit Reveal floor. Presentation ownership cannot substitute another hull's config."
        - "[ai] Nonzero delay is also the sampling cadence: withhold the initial sample, then release the previous allowed sample and capture the next at each interval. At most one pending and one presented sample exist per observer/target. Missing observation releases absence on the same cadence. Zero delay publishes current allowed samples; grid and identity masking may still degrade them."
        - "[ai] A policy supplies only a basic identity and position. Live hull, faction, motion, target state, regions, anchored waypoints and displayed Scan readings cannot enrich the manipulated Sensors lane. Independently earned scan state remains canonical and reappears when policy clears; Comms, Objectives, combat mechanics and other observers retain their established behavior. Classification is captured with the observation, never looked up from current truth when an old sample is displayed."
        - "[ai] Conceal wins and flushes the pipeline. Identical policy requests are no-ops retaining pending work; changed policies reset samples. A new run clears all records, disappearance prunes pairs, and attributed despawn undo restores the exact captured report pipeline without rewinding global time or overwriting a newer pair. Ordered state participates in the existing snapshot and deterministic digest owner."
        - "[ai] Browser and native GM controls share explicit fields, confirmation and exact correlated canonical results. Mission TOML and Rhai set_contact_report/clear_contact_report resolve observer and target names through the same typed TriggerAction dispatch. There is no direct ECS mutation or filesystem/asset authority."
        - "[ai] The shared live source-and-age renderer shows only the public report and does not announce every tick. It appears on the selected Sensors contact and the effective Sensors Viewscreen, clears when absent or another view is selected, and creates no cue history or audio playback."
        - "[ai] The shared suppresses_spatial_cue predicate suppresses current positional audio from a concealed or report-policy source while the effective Viewscreen is Sensors. Producers consume such events without delayed replay. The ordinary camera retains its existing unnamed public combat geometry; the predicate does not alter physics or create an audio queue."
    architecture:
      kind: gm-information-control
      authority: authoritative
      coordinates: [gm-milestone-information-control, gm-t4-contact-classification, gm-t4-ghost-contacts]
      owns: [sensors-observation-configuration-state]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_information.rs, src/gm_information/reports.rs, src/gm_action.rs, src/gm_contact.rs, src/gm_despawn.rs, src/gm_despawn_undo.rs, src/entities/spawner.rs, src/core/messages.rs, src/ship/sensors.rs, src/server/radar.rs, src/server/viewscreen_border.rs, src/world/dispatch.rs, src/world/script/effects.rs, src/world/script/authoring.rs, src/snapshot.rs, src/sim_digest.rs, gui/console-state.js, gui/gm-contact-panel.js, gui/gm-knowledge-compare.js, gui/sensor-report.js, gui/components/ph-sensor-panel.js, gui/viewscreen-hud.html, server.html]
      symbols: [ReportPolicy, ReportState, ReportSample, SensorReport, SensorsObservationConfig, SetReportPolicy, ClearReportPolicy, suppresses_spatial_cue, sensorReportText, renderSensorReport, mountSensorReport]
      tests: ["cargo test --features headless --test gm_contact report_policy", "cargo test --features headless --test gm_despawn_undo despawn_undo_restores_the_captured_report_pipeline", "cargo test --lib gm_information::", "cargo test --lib contact_report", "cargo test --lib selected_sensor_report_hud", "npx vitest run tests/client/gm-contact.test.js tests/client/gm-knowledge-compare.test.js tests/client/viewscreen-hud.test.js"]

entities:
  - component: legacy-helm-driver
    core:
      status: implemented
      confidence: confirmed
      title: Legacy Helm Driver
      summary: Legacy direct-write helm helper.
    architecture:
      authority: authoritative
      owns:
        - migration-authoritative-state
      writes:
        - migration-authoritative-state
    implementation:
      status: declared
      paths:
        - fixtures/migration_scan/legacy.js
      symbols:
        - oldHelmDriver

  - component: helm-motion-planner-target
    core:
      status: proposed
      confidence: provisional
      title: Helm Motion Planner Target
      summary: Target shared planner.
    architecture:
      authority: authoritative
    implementation:
      status: declared
      paths:
        - fixtures/migration_scan/target.js
      symbols:
        - newHelmPlanner

  - component: temporary-helm-adapter
    core:
      status: partially-implemented
      confidence: confirmed
      title: Temporary Helm Adapter
      summary: Approved bridge caller during migration.
    implementation:
      status: declared
      paths:
        - fixtures/migration_scan/adapter.js
      symbols:
        - bridgeHelmDriver

  - state: migration-authoritative-state
    core:
      status: implemented
      confidence: confirmed
      title: Migration Authoritative State
      summary: Shared authoritative state for migration tests.
    architecture:
      classification: authoritative
      owner: legacy-helm-driver

  - migration: helm-driver-rollout
    core:
      status: proposed
      confidence: provisional
      title: Helm Driver Rollout
      summary: Replace the legacy direct helm driver with a shared motion planner.
    migration_plan:
      legacy_entities:
        - legacy-helm-driver
      target_entities:
        - helm-motion-planner-target
      approved_legacy_callers:
        - temporary-helm-adapter
      temporary_adapters:
        - temporary-helm-adapter
      legacy_symbols:
        - oldHelmDriver
      target_symbols:
        - newHelmPlanner
      removal_conditions:
        - predicate: all-callers-are
          subject: oldHelmDriver
          allowed_callers:
            - temporary-helm-adapter
        - predicate: symbol-does-not-exist
          subject: oldHelmDriver

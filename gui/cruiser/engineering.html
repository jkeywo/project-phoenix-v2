<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.engineering.doc_title">Project Phoenix — Engineering Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    ph-power-controls, ph-repair-teams, ph-hull-integrity { flex: 1; min-height: 0; }
    /* Battery bar sits at the bottom of the Power column, under the (growing) power controls. */
    ph-battery-bar { flex: 0 0 auto; margin-top: 8px; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .col { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Engineering Console" data-i18n-attr="data-screen-label:console.engineering.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.engineering.title">ENGINEERING</span><span class="sub" data-i18n="console.engineering.subtitle">POWER &amp; REPAIR</span></h1>
        <span class="auto-badge" id="engineering-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.engineering.power">Power</h2>
          <ph-power-controls id="power-controls"></ph-power-controls>
          <ph-battery-bar id="battery-bar"></ph-battery-bar>
        </div>
        <div class="col">
          <h2 data-i18n="console.engineering.repair">Repair</h2>
          <ph-hull-integrity id="hull-integrity"></ph-hull-integrity>
          <ph-station-damage id="core-damage" label="Core" data-i18n-attr="label:console.repair.core"></ph-station-damage>
          <ph-repair-teams id="repair-teams"></ph-repair-teams>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.engineering.station_footer">ENGINEERING STATION</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-power-controls.js';
    import '../components/ph-battery-bar.js';
    import '../components/ph-repair-teams.js';
    import '../components/ph-hull-integrity.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/cruiser/engineering.console.js (issue #1235): the
    // shared Engineering renderer + this hull's variant (Power + Repair, no
    // Shields column, no bespoke tail). s is a system-id-keyed
    // SystemStationConsolePayload. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './engineering.console.js';
    initConsole({ name: 'engineering', render: renderStation });
  </script>
</body>
</html>

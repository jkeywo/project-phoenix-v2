name = "entity.planet_earth.name"
tags = ["planet", "habitable"]

[target]
tags = ["planet"]
threat_level = "none"
description = "entity.planet_earth.target.description"

[collider]
shape = "Ball"
radius = 30.0
length = 0.0

[radar_appearance]
colour = [0.0, 0.6, 1.0]
size = 30.0
icon = "planet"

# Procedural fallback for headless/editor contexts; [planet] wins on the
# viewscreen.
[mesh]
shape = "sphere"
radius = 30.0
colour = [0.0, 0.5, 1.0]

[planet]
radius = 30.0
longitude_segments = 128
latitude_segments = 64

[planet.surface]
albedo = "assets/planets/earth/albedo.webp"
normal = "assets/planets/earth/normal.webp"
roughness = "assets/planets/earth/roughness.webp"
# City lights: black where unlit, so no separate mask is needed.
emissive_colour = "assets/planets/earth/emissive_colour.webp"
emissive_night_only = true
emissive_strength = 1.5

[planet.clouds]
albedo = "assets/planets/earth/cloud_albedo.webp"
opacity = "assets/planets/earth/cloud_opacity.webp"
scale = 1.03

[planet.atmosphere]
colour = [0.35, 0.55, 1.0]
strength = 1.0

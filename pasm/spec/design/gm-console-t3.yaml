  - component: gm-t3-post-m5-desk-screen
    core:
      status: implemented
      confidence: confirmed
      origin: human
      title: The Post-M5 Game Master Desk Screen
      summary: "The shared browser/native GM desk is laid out as the design canvas's second artboard, 'After M5 - facilitation + operations' (PRD #930). One bar and three columns over two rows, composed as SIX regions rather than nine grid cells: a region is the artboard's panel frame and the sections inside it are blocks that stack within it. Left carries the M4 attention queue, the roster and the world-authored widget region; centre the omniscient map over a tabbed Comms/Activity/Action-log region; right the inspector over checkpoints-and-restore, with peer health beside the mission panel on the lower row. The bar gains three health pills and each crewed roster row gains its workload word. Presentation only: no Rust, admission, action, projection or wire contract changes, and every pill, word and panel is drawn only from a payload that has actually landed."
      rationale:
        - "[human] John asked for the post-M5 screen from the design canvas directly; it is not a GitHub issue. It follows the After-M3 pass (commit 19f96cb4, docs/acceptance/gm-screen.md) exactly: the artboard is the specification for WHERE things sit, and the live payloads remain the only authority for WHAT can appear. Nothing is fabricated to match an illustrative artboard value."
        - "[ai] Six regions, not nine cells, because the canvas's own note is 'each later screen adds panels rather than moving them': M4's queue, M5's checkpoints and the authored widget region arrive inside a frame that already exists. Each region is one grid child carrying the panel chrome (.gm-desk-region); the sections inside carry none. That is what lets Attention/Roster/widgets read as ONE left-hand panel and Comms/Activity/Action log as one tabbed centre panel without any panel changing column."
        - "[ai] ONE scroll box per region, and the sections inside never open a second. This is a correctness rule. A panel that scrolls inside a region that scrolls inside #gm-console puts four nested scroll boxes between a bounded list (#gm-checkpoint-list, #gm-journal-list) and the page, and a row in the innermost one can then be scrolled into view at every level and still not be at the point a click lands - tests/smoke/gm-checkpoint-200.spec.js caught exactly that at 200% text, as a checkpoint row whose own sibling summary line intercepted every click. The chain is now the same depth the After-M3 desk had, where the column WAS the panel. The inspector's sticky 'back to selection' follows the region rather than the inspector for the same reason."
        - "[ai] The centre tab strip switches views with data-log-view on the region and NEVER with hidden on the panels. hidden on #gm-comms-panel and #gm-activity belongs to gui/gm-role-presets.js (GM_ROLE_PRESET_PANEL_IDS), and two writers on one attribute is precisely the race #gm-widgets is kept out of. A preset that hides a panel therefore hides its TAB, which the shell owns, and an operator standing on a tab that just went away lands on the first view still there."
        - "[ai] A display:none panel has nothing to focus, so the shell exposes showLog(panelId) and the attention queue's authored-Comms-route navigation calls it before gmCommsPanel.focusRoute. The seam takes the PANEL a caller is about to touch rather than a view id the caller would have to learn, and it refuses a panel the effective role preset has put away: a preset hiding a panel is a decision, not something a navigation may override."
        - "[ai] The bar draws a pill only for a fact a live payload carries - the gm_health projection's worst state, the gm_attention quiet-time occurrence's own age, and the highest capture tick in this browser's own checkpoint catalogue. The artboard's '60 Hz' and '2 min ago' are deliberately absent: no rate is published and there is no shared elapsed-time basis to age a checkpoint against, the same gap docs/acceptance/gm-screen.md already records for the session clock. Each pill states its condition as a WORD, with colour and data-state as decoration (PRD #1418 story 6)."
        - "[ai] The roster's workload word is the worst level gm-t3-station-workload already published for that hull's Stations, never a second advisory: a hull whose Stations are all Backfill or all Offline says that instead, and a hull the advisory published no rows for says nothing at all. The workload panel stays below the roster because the evidence behind the word lives there."
        - "[ai] The map panel is never reparented. <ph-navigation-map> cancels its render loop on disconnect, so the regions are inserted AROUND the grid cell the map was authored into and every other panel moves into a region that is already in the document - which also keeps getElementById resolving through the whole composition."
        - "[ai] The lower row is minmax(max(250px, 14em), 0.45fr), not the artboard's flat 250px. `auto` as a maximum would let that row grow to its max-content during grid's maximize step, which runs BEFORE flexible tracks are sized, and leave the map/inspector row at its zero floor; a flexible maximum keeps it in proportion with the artboard height as a hard base, and the base rises with the operator's text size so a 200% mission panel is a panel rather than a heading and a clipped row."

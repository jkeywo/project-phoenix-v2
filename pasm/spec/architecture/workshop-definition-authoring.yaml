entities:
  - component: workshop-definition-authoring
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Workshop Faction and Complexity Definition Authoring
      summary: "The Workshop definitions panel creates and edits faction relationships (assets/factions/*.toml) and the console-complexity ladder ([[station.rating]] rungs and visiting_rating on hull templates) through runtime-derived fields, choices and defaults. The runtime reads the draft's text members into a catalog carrying exact source lines; the panel plans structural edits in a pure module and the runtime applies them all-or-nothing to the toml_edit tree, so every change is one exact-source history entry that preserves comments, unknown keys and line endings. Cross-file references are findings with exact locations that refuse save and export; base and pack definitions are listed read-only under their origin. The faction registry is built from effective content on both targets, so the exact unsaved factions reach a disposable Test without installation."
      rationale:
        - "[ai] Complexity definitions are the console-complexity ladder on hull templates: [[station.rating]] rungs (name, automated_systems, ai_tuning) plus each station's visiting_rating. assets/complexity/*.toml, the old editor's target, no longer exists; StationRatingConfig documents that it replaced them. Station membership, systems and AI remain separate work (#1481)."
        - "[ai] The faction registry was compiled in (include_str! of four files) on both targets, so no pack, native Test or browser Test could change a faction and the exact-unsaved-Test criterion was unmeetable. The registry now reads effective content: native scans assets/factions under the pinned content root (a native host pins it, a disposable Test child pins its stage), wasm takes the faction set the Test captured, and active packs overlay both with the newest winning a shared uuid. The compiled-in four remain the fallback for an absent directory or an empty thread-local set."
        - "[ai] Structural edits (insert or remove an array element, put or remove a key, append a [[station.rating]] entry) are one Rust toml_edit transaction behind wasm_workshop_edit and Operation::Edit — all-or-nothing, expected-source guarded, one history entry — with each value parsed as exactly one TOML value so nothing can be injected. No JS TOML serializer exists; the emitter drops carriage returns, so surviving lines are given their original endings back and new lines follow the document's convention."
        - "[ai] Cross-file validity is a FINDING with a line, never an edit-time refusal, so an author can reference an enemy before the faction exists and Check says what still dangles. A duplicate rung name is the one edit-time refusal, because the runtime treats it as a hard error with no ordering excuse. Value checks at edit time go through the runtime serde types (Uuid, OrderResponse, non-empty rating name)."
        - "[ai] Base and pack definitions are listed read-only with their origin, so the effective set is visible, an enemy choice may name a base faction, and references into dependencies resolve. Only draft members carry controls."
        - "[ai] Choices and defaults are derived from the runtime, not typed twice: order responses from OrderResponse's serde spelling under an exhaustive match, AI rules from the console_ai rule constants, compliance defaults from ComplianceDisposition::default(), and the new-faction skeleton from toml serialisation of FactionConfig."
        - "[ai] Live pack UPLOAD still does not validate faction references (follow-up); Workshop validation does, and an uploaded pack's factions do now reach the registry once the App builds."
        - "[ai] Review round: an ai_tuning rule is always put or removed ONE KEY at a time, never as a whole table — a rung whose last rule was removed keeps an empty [station.rating.ai_tuning] standard table that the catalog reads as no rules and a table-valued put would be refused over, while a per-key put enters both that and a missing table (which Put materialises inline). The findings also mirror HostOrderWithoutHumanSeeking (station-visiting-rating-without-human-seeking, station-host-order-without-human-seeking) at the line that carries the key, and the panel offers a station that seats no human only the clearing of a visiting rating it already has."
        - "[ai] Review round: a uuid declared twice resolves in the catalog the way the runtime registry resolves it — base, then packs in stack order, then the draft, the latest winning — so the choice label and a resolved enemy name are the same faction. Two READ-ONLY files sharing a uuid are a WARNING (dependency-duplicate-uuid, on the last path), never a refusal: the Live host takes the newest pack's while a disposable Test's staged directory takes the last by file name, and that residual divergence is recorded rather than hidden. A Project workspace's Definitions op resolves against nothing beneath, exactly as its Check does."
        - "[ai] Review round: phoenix-headless pins no content root, so it takes its factions from the directory BESIDE its templates (faction_directory_beside, the sibling of --ship's directory) rather than from whatever cwd it was launched in; the compiled-in four remain the fallback when that sibling is absent. The exact-source emitter keeps a document's own final-newline convention and appends to a multi-line array without a trailing comma without disturbing the bracket line."
    architecture:
      kind: authoring-presentation
      authority: non-authoritative
      coordinates: [gm-milestone-integrated-workshop, workshop-runtime-asset-validation]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/workshop/definitions.rs, src/workshop/document.rs, src/workshop/wasm.rs, src/workshop/provider.rs, src/workshop/mod.rs, src/workshop/test_browser.rs, src/core/codec.rs, src/entities/config_cache.rs, src/headless/app.rs, editor/workshop-definitions.js, gui/workshop-definitions-panel.js, editor/workshop-runtime.js, editor/workshop-provider.js, gui/workshop-authoring.js, gui/workshop-layout-model.js, src/native_host/panes/operator.rs]
      symbols: [catalog, findings, new_faction_source, check_value, check_table_fields, edit, EditRequest, Edit, DefinitionCatalog, wasm_workshop_definitions, wasm_workshop_edit, wasm_workshop_new_faction, get_faction_registry, faction_registry_from, faction_directory_beside, replace_faction_registry, planFactionEdits, planRatingEdits, complianceKeys, snapshotIsCurrent, mountWorkshopDefinitions]
      tests:
        - "cargo test --lib -- workshop:: entities::config_cache native_host::panes::operator native_host::workshop"
        - "npx vitest run editor/tests/workshop-definitions.test.js tests/client/workshop-definitions-panel.test.js tests/client/workshop-layout-model.test.js tests/client/workshop-authoring.test.js tests/client/workshop-runtime.test.js editor/tests/workshop-provider.test.js"

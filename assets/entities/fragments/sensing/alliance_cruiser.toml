# [ai] Increment14 first instrument tuning; physical stores/AI remain ordinary.
# Initial focused ladder is provisional instrument tuning. Existing ScanConfig
# derives published physical quantities; timed work is authored separately.
[scan]
power_group = "sensors"
min_power_level = 0
degraded_by = ["nebula_fog", "sensor_blind", "radar_dampening"]
interference_bands = 1

[[scan.band]]
id = "detailed"
label = "sensing.scan.detailed.label"
max_range = 60.0
condition_step = 0.05

[[scan.band]]
id = "coarse"
label = "sensing.scan.coarse.label"
max_range = 100.0
condition_step = 0.25
report_capacities = false

[[sensing.focused]]
reading_ticks = 120
system = "sensors"
work_secs = 2
history_limit = 64
unfinished_retention_secs = 0
# Provisional forecast horizon: conditional on the last observed trend continuing.
forecast = { horizon_secs = 120 }

# [ai] First supported enquiry adapters, provisional relative work tuning.
# General retains its existing work and energy use. Additional questions share
# this same scanner, and only subjects with explicit observation rules answer.
[[sensing.focused.aims]]
aim = "environment"
work_multiplier = 1
resource_multiplier = 1

[[sensing.focused.aims]]
aim = "resources"
work_multiplier = 1
resource_multiplier = 2
intrusive = true

[[sensing.focused.aims]]
aim = "anomaly"
work_multiplier = 2
resource_multiplier = 1

# [ai] Optional shield enquiry uses this same paid slot; General stays default.
[[sensing.focused.aims]]
aim = "shields"
work_multiplier = 2
resource_multiplier = 1

[[sensing.broad]]
reading_ticks = 120
system = "sensor-radar"
sample_interval_secs = 0.5
identity_secs = 1
classification_secs = 3
assessment_secs = 6
position_error = 2
drift_error_per_sec = 0.5
track_retention_secs = 60

[[sensing.passive]]
system = "passive-receiver"
sample_interval_secs = 0.5
min_signal_strength = 0.01
bearing_error_rad = 0.15

# Increment15 directional dish: finite traversal; broad radar remains independent.
[sensing.passive.mount]
facing_deg = 0
arc_deg = 120
range = 100

[[system]]
id = "passive-receiver"
kind = "passive_receiver"
console = "science"
power_group = "energy-passive-receiver"
[[system.component]]
kind = "power_input"
id = "turret-power"
[[system.component]]
kind = "turret"
id = "turret"
power_input = "turret-power"
[system.component.config]
facing_deg = 0
traverse_arc_deg = 360
traverse_deg_per_sec = 90
aim_tolerance_deg = 2

[system.config.ai]
root = "passive"
[[system.config.ai.tree]]
id = "passive"
initial = "receive"
[[system.config.ai.tree.state]]
id = "receive"
[[system.config.ai.tree.state.task]]
id = "operate-capable-receiver"
[system.config.ai.tree.state.task.action]
kind = "write"
channel = "operate"
value = { source = "fact", name = "can_operate" }

[[system.damage_component]]
id = "operation"
binding = "operation"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true
[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "intake"
binding = "intake"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true
[system.damage_component.susceptibility]
physical = 1
laser = 1

[[system.damage_component]]
id = "cooling"
binding = "cooling"
fault_dose_threshold = 20
degraded_factor = 0.5
full_remedy = "machinery-full"
patch_remedy = "machinery-patch"
field_replaceable = true
[system.damage_component.susceptibility]
physical = 1
laser = 1

[[sensing.broad]]
reading_ticks = 120
system = "tactical-radar"
sample_interval_secs = 0.5
identity_secs = 1
classification_secs = 3
assessment_secs = 6
position_error = 2
drift_error_per_sec = 0.5
track_retention_secs = 60

[[sensing.broad]]
reading_ticks = 120
system = "helm-radar"
sample_interval_secs = 0.5
identity_secs = 1
classification_secs = 3
assessment_secs = 6
position_error = 2
drift_error_per_sec = 0.5
track_retention_secs = 60

[sensing.control]
combat_lock = "tactical-radar"
science_target = "sensors"
# Sharing is an explicit operator choice; reception alone does not publish a feed.
[[sensing.sharing]]
system = "sensor-radar"
share_own_faction = false
receive = true

[[sensing.sharing]]
system = "tactical-radar"
share_own_faction = false
receive = true

entities:
  - component: ship-power-controller
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power Controller
      summary: Owns power-group allocation, reactor availability, battery reserves, brownout behavior, and the authoritative power blackboard. The three canonical power groups are helm, weapons and shields since issue #952 (shields replaced sensors). Brownout is a per-group battery-floor ladder, not a lock: each group is held at its authored [power_groups.<id>] min_level while the battery sits under that group's authored [power.battery_floor] percentage of capacity, and released only once the charge climbs back through that percentage plus the authored [power] battery_floor_release_margin. The floor is a TWO-threshold shape and the second threshold is load-bearing: flooring a group lowers the EFFECTIVE total, which is what indexes rates, so on every shipped reactor the cut flips the battery rate positive and a single threshold would release the group on the next tick, chattering at tick rate. A group whose hull declares no [power_groups.*] lands on UNAUTHORED_FLOOR_LEVEL, the level the runtime seeds it at - a brownout takes back what was SPENT rather than inventing a debuff the hull never wrote down. The relation between a floor and the same group's [power.ai_policy.param] min_reserve_* is a per-group tuning choice rather than a rule, and the fleet answers it two ways. weapons 25 against a reserve of 10 opens a band where the reactor has cut and the policy has not, which is the only shape that makes the ladder act on an AI-crewed hull at all: an earlier revision put every floor strictly BELOW its reserve, so the policy had commanded each group down to the floor's own landing level before the floor was reached, the held >= commanded skip fired, and the ladder was inert fleet-wide. helm 40 stays under its reserve of 50 on purpose and that one is measured: raising it to 50 fails the_composed_destroyer_passes_breaks_off_and_passes_again, because holding helm down through a band the crew has already re-authorised leaves an attack-pass hull grinding at contact range instead of breaking off. On helm the crew's guard binds and the reactor is the backstop for an operator who has none, which is a human Power officer. Two further invariants are walked over the shipped files: the ladder must descend helm > weapons > shields, and a hull's fully-floored effective total must land on a strictly positive rates rung or no floor can ever lift. Since issue #831 handle_power_messages is the single applier of admitted SetPowerGroupAllocation commands for the human and AI paths alike (the AI decide system emits admitted commands rather than writing a private intent component).
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [ship-power-state]
      reads: [ship-station-system-topology-state, system-control-source-state, inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/ship/config.rs, src/modifiers/power_system.rs]
      symbols: [handle_power_messages, tick_power_system, authored_power_group_seed, authored_power_group_floors, from_authored_groups, PowerGroupFloor, default_group_floors]
      tests: [cargo test, tests/smoke/power-console.spec.ts]

  - state: ship-power-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Power State
      summary: Authoritative per-ship power-group levels, battery charge, and reactor/battery availability. Levels are held in two layers since issue #952 - the COMMANDED level a human or AI operator last asked for, and the EFFECTIVE level after any battery floor is applied - and every reader (modifiers, blackboards, the PowerState wire message) sees the effective one. The emergency LOCK is gone: PowerBlackboard.locked was replaced by PowerBlackboard.draining plus PowerBlackboard.charging, which say which way the reserve is moving and are deliberately not each other's negation, since a rate of exactly zero means a frozen reserve. PowerGroupEntry carries both levels on the wire - level is the effective one the pips light, commanded_level the standing order the console's +/- step from, because the SetPowerGroupAllocation payload is an ABSOLUTE level the server measures against the command.
    architecture:
      classification: authoritative
      owner: ship-power-controller
      writers: [ship-power-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/power.rs, src/core/messages.rs]
      symbols: [PowerBlackboard]

  - component: ship-modifier-cache
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Cache
      summary: Per-ship source-aware cache that combines numeric modifiers and OR-aggregated flags into authoritative gameplay multipliers.
      rationale:
        - Power, impulse, and regions must compose without each feature directly changing every consumer's tuning value.
    architecture:
      kind: modifier-service
      authority: authoritative
      owns: [ship-modifier-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]
      tests: [cargo test]

  - component: authored-power-ai-rule-evaluator
    core:
      status: implemented
      confidence: confirmed
      title: Authored Power AI Rule Evaluator
      summary: Per-ship Power AI that resolves an inline stateless allocation policy for every authored power group. Each power group is a dynamic output channel; the highest-priority matching rule emits the value-carrying set_power_group_allocation verb (an absolute level). Each rule declares its own minimum permitted battery reserve as an authored param referenced by its when guard, so a below-reserve guard never fires and allocation planning avoids avoidable brownouts without a fixed global emergency mode. ai_power_allocation loops the ship's authored power groups and emits an admitted SetPowerGroupAllocation system-control-command rather than mutating power state directly.
      rationale:
        - "Issue #784 reworked this evaluator onto the inline stateless FineSystemAiConfigToml spine, RETIRING the bespoke stateful engine (tick_power_rule, PowerAiRule, PowerRuleTrigger, PowerMovementInput/PowerEngageOutput EngageState hysteresis, ShipPowerAiState, PowerAiConfigResource, PowerAiConfigToml/to_ai_rules — all deleted). ai_power_allocation now reads a per-ship PowerAiPolicy(AiPolicy) and, for each authored power group (power.iter()), resolves that group's DYNAMIC channel via AiPolicy.resolve_channel over a host-seeded fact snapshot (seed_power_facts) plus the read-only WorldContentRuntime.flags scenario chain; the winning rule emits SetPowerGroupAllocation(level) with an absolute level, skipped when level == current. Rules are authored as [[power.ai_policy.rule]] entries; the minimum reserve is an authored param the guard reads (fact(battery_pct) >= param(min_reserve)). At #784 an omitted [power.ai_policy] was filled by default_power_ai_config, which synthesised the retired helm-thrust / weapons-red-alert baseline as reserve-guarded rules so that omitting the block preserved behaviour. Statelessness removes the last per-frame AI EngageState timer (AGENTS.md rule #7)."
        - "Issue #885 (8555e336) deleted that synthesiser. default_power_ai_config is gone along with every call site; strict AI-declaration mode is the default in EntityConfig::from_toml, so a hull that declares no [power.ai_policy] fails the entity load rather than having allocation rules invented for it. Every shipped hull now authors the block, proved byte-equivalent to what the synthesiser produced through the real spawner."
        - "Issue #762 (seeding reconciliation, retained): PowerSystem::from_authored_groups seeds every authored [power_groups.*] group (e.g. ops) at spawn — via authored_power_group_seed in spawner.rs and server_app.rs — so a rule targeting an authored group is allocatable rather than returning UnknownGroup. The four alliance hulls rest their four groups at a sustainable total (<=6) so idle ships recharge and neither the brownout advisory nor the emergency lock fires unprovoked."
        - "Issue #831 (admission symmetry, retained through #784): ai_power_allocation emits an admitted SetPowerGroupAllocation system-control-command through command_admission::validate_and_admit (its ship's own ai:<uuid> token, checked against operate_ai on the reactor), which ship-power-controller's handle_power_messages applies — the single applier for the human and AI paths alike. The evaluator therefore sends a command; it does not mutate power state directly and never branches on control source after admission."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [ship-power-state, system-control-source-state, ship-system-blackboards-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/server.rs, src/entities/config.rs, src/ship/power.rs, src/ai/policy.rs, src/modifiers/power_system.rs]
      symbols: [ai_power_allocation, PowerAiPolicy, AiPolicy, resolve_channel, seed_power_facts, POWER_SET_ALLOCATION_VERB, authored_power_group_seed]
      tests: [cargo test]

  - state: ship-modifier-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier State
      summary: Authoritative per-ship modifiers for speed, yaw, radar range, phaser damage, shield regeneration, hull damage, repair rate, and repair-team capacity plus Comms-jammed and sensor-blind flags.
    architecture:
      classification: authoritative
      owner: ship-modifier-cache
      writers: [ship-modifier-translator]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/modifiers/cache.rs, src/core/messages.rs]
      symbols: [ShipModifiers]

  - component: ship-modifier-translator
    core:
      status: implemented
      confidence: confirmed
      title: Ship Modifier Translator
      summary: Translates power allocation, active impulse, and region entry/exit into source-keyed modifier and flag updates, clearing all region effects on exit. Three power groups drive gameplay multipliers - helm to MaxSpeed/MaxYawRate, weapons to PhaserDamage, and (since issue #952) shields to ShieldRegen. RadarRange has NO power producer at all: #955 removed weapon reach from it and #952 removed the sensors power group that drove it, leaving radar hull damage (apply_radar_damage_modifiers) and RegionEffectKind::RadarDampening as its only writers. A phaser or blaster reaches exactly the range its own bank authors, at every power level; a hull acquires through the horizon its own [weapons_console.radar] range authors unless its radar is damaged or it is inside a dampening region. The sensors console's own horizon (SensorRadarRange) and helm's (HelmRadarRange) are separate, damage-driven-only slots.
      rationale:
        - "Issue #955 (POWER BUYS DAMAGE, NOT REACH). Every firing and reach-reporting path used to multiply a bank's authored beam_range by ModifierSlot::RadarRange - console/weapons/beam.rs (handle_fire_phaser, ai_phaser_auto_fire, tick_beams), console/weapons/blackboard.rs (build_bank_states and the LocalShip console builder), console/weapons/mod.rs (the arc-request phaser emitters) and ai/server.rs (entity_direct_fire_banks, feeding both the #788 reach fact and the #874 arc sectors). Blaster and torpedo emitters never were scaled, so the families disagreed about the same question. The multiplication is removed from all of them; reach is a property of the gun."
        - "That coupling was the real defect behind issue #923, which read it as a POWER problem instead. ShipModifiers::rebuild_cache folds a negative bonus sum as 1/(1+|sum|), so the fleet-standard power_multipliers [-0.5, 0, 0.25, 0.5] map sensor levels 1-4 to x0.667 / x1.000 / x1.25 / x1.5, and the four Alliance hulls author [power_groups.sensors] default_level = 1 - so every AI-crewed Alliance hull fought at two thirds of every range its own file authored. #923 bought the missing third back with an authored red-alert sensors elevation, paid for by dropping the weapons elevation under the reactor's silent 8-point cap. #955 removes the multiplication instead, so that trade is unwound: the fleet_baseline.toml sensors channel is gone and the red-alert point is back on weapons, where it buys x1.25 PhaserDamage."
        - "ACQUISITION remains a distinct concept in the code rather than a distinction invented here: the surviving RadarRange consumers read [weapons_console.radar] range (beam.rs handle_set_target, console/weapons/mod.rs ai_target_selection) and tactical_radar_range (publish_tactical_radar_blackboard) - radar fields, not gun fields. A hull with its radar down still shoots as far; it just has less warning about what to shoot at. Under #955 acquisition was still POWER-scaled through the sensors group, which was the last thing that group bought; #952 retired the group, so RadarRange now has two producers - apply_radar_damage_modifiers for tactical-radar hull damage and RegionEffectKind::RadarDampening - and, as before, no consumer that decides how far a gun shoots."
        - "Issue #952 (POWER BUYS SHIELD RECOVERY). With reach decoupled, the SENSORS group bought only an acquisition horizon, which is not worth one of a hull's eight reactor points; the group is gone from POWER_GROUP_ORDER and shields sits in its place, driving ModifierSlot::ShieldRegen through ship::shields::tick_shields (ShieldSystem::tick_with_regen_scale scales each facing's authored regen_per_sec; the offline timer and focus decay are deliberately NOT scaled). The per-console curve moved with it, from [sensors_console] power_multipliers to [shields_console] power_multipliers. The four Alliance hulls rest the group at 1 and author a curve whose first rung is 0.0, so resting costs the arcs nothing and spending up is a human Power officer's trade against helm or weapons - the fleet_baseline power policy authors no shields channel at all, because the red-alert allocation already spends the 8-point budget exactly (ops 1 + helm 3 + weapons 3 + shields 1). The acquisition invariant below survives unchanged and is now strictly stronger, since the horizon it walks is no longer reduced by anything the reactor does; every_hulls_acquisition_horizon_clears_its_longest_gun_at_rest additionally asserts RadarRange resolves to x1.0 so a resurrected coupling fails there rather than in a duel."
        - "The invariant that stops acquisition becoming a reach cap by the back door. A lock is a PRECONDITION for firing, so a horizon authored under the hull's own guns caps reach again, as silently as the multiplier #955 deleted. When #955 shipped this was worse than occasional: it removed the sensors channel from every authored power policy, so no AI-crewed hull ever left [power_groups.sensors] default_level = 1 and the live horizon was permanently x0.667 of the authored [weapons_console.radar] range. #952 retired the sensors group altogether, so RadarRange now rests at x1.0 and a hull acquires through exactly the horizon its own file authors - which makes the invariant simpler to reason about, not unnecessary: the authored number is now the whole answer. alliance_battleship.toml shipped exactly the failure (75 x 0.667 = 50.000002, against a heavy-fore blaster at range = 50.0 and an artillery envelope at max_artillery_range = 50.0, whose shadow and reposition legs are entered on range_to_target > max_artillery_range - precisely where make_candidate culls every candidate including the retention one) and is re-authored to 100. Every value stays in TOML; the rule is enforced by modifiers::coordination::every_hulls_acquisition_horizon_clears_its_longest_gun_at_rest, which walks every shipped assets/entities/*.toml, seeds that hull's own reactor and resolves its own policy at rest, asserts the resulting RadarRange is x1.0 (a resurrected coupling fails there rather than in a duel), and demands a fifth of daylight beyond its longest authored direct-fire range and any authored artillery envelope. A hull authoring no [weapons_console.radar] is unbounded (range_bounds_targets reads false) and exempt - every Harrow hull is."
        - "Pinned in both directions so it cannot drift back silently: ai::server::tests::direct_fire_reach_ignores_the_radar_range_slot asserts the published #788 reach fact is the authored longest bank with the slot crushed to x0.667 and doubled, per bank as well as through the scalar max (the max alone cannot see the phaser arm the retired coupling scaled, since the unscaled 320-unit blaster wins it either way); console::weapons::server_tests::phaser_reach_is_the_authored_beam_range_and_ignores_the_radar_range_slot lights a real beam at a target 45 units out against a 50-unit bank with the slot at x0.667 (unreachable at the old scaled 33.3); tests/headless_runner.rs a_cruisers_phaser_reach_never_leaves_its_authored_beam_range_in_a_live_duel asserts every reach the production fact publishes across a 45 s duel is an authored number, with a control requiring the slot to actually move. modifiers::coordination::every_alliance_hull_elevates_its_phaser_damage_at_combat_stations replaces the #923 reach pin and asserts the red-alert point lands on PhaserDamage instead."
    architecture:
      kind: translator
      authority: authoritative
      writes: [ship-modifier-state]
      reads: [ship-power-state, impulse-drive-state, region-membership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/modifiers/coordination.rs, src/regions/server.rs, src/ship/shields.rs, src/weapons/shield.rs]
      symbols: [apply_power_modifiers, apply_region_effects, apply_impulse_to, tick_shields, tick_with_regen_scale]
      tests: [cargo test]

  - component: region-containment-service
    core:
      status: implemented
      confidence: confirmed
      title: Region Containment Service
      summary: Evaluates authored sphere, box, and torus region membership for live ships and emits entry and exit events.
    architecture:
      kind: spatial-service
      authority: authoritative
      owns: [region-membership-state]
      reads: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/shape.rs]
      symbols: [RegionPlugin, RegionShape]
      tests: [cargo test]

  - state: region-membership-state
    core:
      status: implemented
      confidence: confirmed
      title: Region Membership State
      summary: Authoritative transient relation recording which ships currently occupy each authored region and which region effects apply.
    architecture:
      classification: authoritative
      owner: region-containment-service
      writers: [region-containment-service]
    implementation:
      status: declared
      paths: [src/regions/server.rs, src/regions/effects.rs]
      symbols: [RegionEffectKind]

  - component: region-effect-resolution
    core:
      status: implemented
      confidence: confirmed
      title: Region Effect Resolution
      summary: Resolves damage zones, slow zones, impulse blockers, radar dampening, Comms jamming, sensor blindness, and nebula fog from active region membership.
    architecture:
      kind: effect-resolver
      authority: authoritative
      reads: [region-membership-state]
      writes: [ship-modifier-state, authoritative-damage-state, impulse-drive-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/regions/effects.rs, src/regions/server.rs, src/modifiers/coordination.rs]
      symbols: [RegionEffectKind]
      tests: [cargo test]

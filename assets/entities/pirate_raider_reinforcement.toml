# Harrow Destroyer Reinforcement (formerly Pirate Raider Reinforcement)
#
# Variant of pirate_raider.toml used when reinforcements arrive via a
# LoadWorld trigger. Identical to the base destroyer except the
# detection range is effectively global since operate_helm scans all
# WorldView entities rather than using a radius trigger.
#
# (#474) Re-balanced alongside pirate_raider.toml: hull 30 + shield 15
# at 0.5/s regen, phaser pierce 0.1, no flee — fight to the death.
# (#572) FSM dissolved — doctrine-based AI.

name = "Harrow Destroyer"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "high"
description = "Harrow Destroyer"

[hull]
hull_integrity = 30.0

# Single omni shield arc (issue #514). NPCs have no `[shields]` station so
# the auto-generated `[[system]]` entry is `ai_only = true` and ownerless.
[[shield_arc]]
id = "all"
label = "All"
center_deg = 0
width_deg = 360
max_hp = 15
regen_per_sec = 0.5

[collider]
shape = "Capsule"
radius = 2.0
length = 4.0

[helm_console]
max_speed = 20.0
max_reverse_speed = 0.0
acceleration = 12.5
deceleration = 30.0
max_yaw_rate = 2.0
max_bank_deg = 15.0

[helm_console.engine_pfx]
color = [ 1.0, 0.22, 0.08, 0.68 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.45

[weapons_console]

[[weapons_console.phaser_banks]]
id = "fore"
facing_deg = 0.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 37.5
beam_damage_per_sec = 6.0
beam_duration_secs = 4.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.1, 0.1, 1.0]

[radar_appearance]
colour = [1.0, 0.2, 0.2]
size = 4.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_destroyer.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [1.0, 0.2, 0.2]

[comms]
range = 400.0

[ai_profile]
aggression = 0.8
sensor_range = 120.0

# ── Behaviour ────────────────────────────────────────────────────────────────
#
# (#572) Doctrine-based behaviour. Destroy outscores Patrol so the
# reinforcement immediately hunts any hostile it can find.

[behaviour]

[[behaviour.doctrine]]
id        = "patrol-sector"
text      = "Patrol the sector"
directive_kind    = "Patrol"
directive_anchors = ["patrol_alpha", "patrol_beta", "patrol_gamma"]
directive_loop    = true
base_priority     = 20.0
target_speed      = 0.4

[[behaviour.doctrine]]
id            = "destroy-hostiles"
text          = "Engage and destroy hostile ships"
directive_kind = "Destroy"
base_priority  = 35.0
target_speed   = 0.9
maintain_range = 25.0

# Ship systems (all AI-controlled - no human consoles)
# Per-axis helm systems (issues #701/#703, declared in #800 and #704). This hull
# has no stations, so they are ownerless and `ai_only`. The NPC spawn path sets every declared system to
# ControlSource::Ai, so these come up on AI precisely when the coarse helm does.
#
# #800 declared thrust + steering. #704 adds impulse + lateral-thrust, which the
# deleted `operate_helm_ai` monolith used to drive on this hull's behalf: an
# undeclared system resolves to ControlSource::Human (`operate_ai = false`), so
# the monolith never stood down from those two axes here. Declaring them hands
# both to `ai_helm_impulse` / `ai_helm_lateral_thrust`, which was what made the
# delete behaviour-preserving. (Since #803 both systems decide on the shared
# AI-helm sim tick — `[global] ai_helm_tick_hz`, default 30 Hz — rather than
# once per rendered frame as the monolith did.)
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
ai_only = true

[[system]]
id = "helm-steering"
kind = "helm_steering"
ai_only = true

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
ai_only = true

# Boost drive axis (issue #801), declared for hull-uniformity with the player
# ships: every helm axis is a declared system on every hull. No AI drives
# boost, so on this stationless hull the declaration only gives the axis the
# standard damage/repair surface.
[[system]]
id = "helm-boost"
kind = "helm_boost"
ai_only = true

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
ai_only = true

# Fine Tactical systems (issue #512): one phaser bank ("fore"). No torpedoes.
[[system]]
id = "phaser-fore"
kind = "phaser_bank"
ai_only = true

# Ship-wide phaser settings (issue #801): firing mode + emitter frequency.
# One declared system (NOT per-bank) so SetPhaserMode/SetPhaserFrequency
# admission gates on a real system instead of the deleted coarse `tactical`.
[[system]]
id = "phaser-control"
kind = "phaser_control"
ai_only = true

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
ai_only = true

[[system]]
id = "power-battery"
kind = "power_battery"
ai_only = true

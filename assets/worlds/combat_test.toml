# Combat Test Scenario (#475)
#
# An 8-wave defence scenario that exercises the full combat stack:
#   - on_all_destroyed trigger condition (#470)
#   - NPC shields backend + Sensors panel rendering (#471, #473)
#   - Rebalanced Harrow fleet + Axiom Station (#474)
#   - Federation-Harrow mutual hostility (#472)
#
# Layout: concentric rings centred on the star at the origin.
#   - Star at [0, 0, 0]
#   - Inner asteroid belt: r=200..300 (cover near the playspace centre)
#   - Clear zone: r=300..800 (planet, starbase, and player live here)
#   - Outer asteroid belt: r=800..1000 (forces attackers to fly through
#     asteroids to reach the starbase)
#   - Spawn anchors beyond the outer belt (r > 1000), biased toward
#     the +X hemisphere.
#
# Starbase Alpha sits at [500, 0, 100] — within the clear zone. Player ship
# spawns at [400, 0, 200] (~140u from the starbase) ready to defend.
#
# Ship selection: all three Alliance hulls are available in the lobby.
#   Alliance Destroyer  power_rating = 70
#   Alliance Cruiser    power_rating = 90
#   Alliance Battleship power_rating = 100
#
# Wave timeline (locked from the design interview):
#   t=0   destroyer    enemy_n_outer
#   t=45  destroyer    enemy_se
#   t=60  destroyer    enemy_e
#   t=120 cruiser      enemy_ne
#   t=210 destroyer    enemy_ese
#   t=240 cruiser      enemy_ene
#   t=270 destroyer    enemy_s_outer
#   t=300 battleship   enemy_e_far
#
# Power-scaled bonus spawns (gated by ship_power counter = player power_rating):
#   ship_power >= 90 (cruiser or battleship): +1 dynasty destroyer on each odd
#     wave (1, 3, 5, 7), spawned ~40u offset from the primary.
#   ship_power >= 100 (battleship only): +1 dynasty cruiser on each even wave
#     (2, 4, 6, 8), spawned ~40u offset from the primary.
#   Bonus ships are named wave_Nb and are included in the power-tier victory
#   on_all_destroyed trigger. They carry no separate objective.
#
# Targeting model:
#   Harrow ships spawn in their default `initial_state` (patrol/idle).
#   Each ship's `enemy_in_range` transition (radius 5000) detects the
#   player on the first tick and switches to `pursuing` with the player
#   as the target. The starbase, being factionless, is not auto-targeted —
#   enemies pursue and engage the player ship directly. If the player
#   moves to draw fire away from the starbase, the destroyer/cruiser/
#   battleship combat at the player's position will incidentally
#   threaten the starbase if it's in their weapons cone.
#
#   `set_ai_state` in the same trigger as `spawn_entity` was attempted
#   but found unworkable: Bevy `Commands` defer the spawn until the
#   next ECS sync, so the AI controller doesn't exist when `set_ai_state`
#   would run. The `enemy_in_range` approach is robust and uses only
#   existing engine mechanisms.
#
#   Harrow defaults to neutral so non-combat worlds (Starbase Alpha,
#   Before the Fire) can reuse the same ship templates as ambient
#   patrols. This scenario flips both directions of the Federation
#   <-> Harrow relationship hostile on `on_world_loaded` via two
#   `add_faction_enemy` actions, *before* the first wave's
#   `enemy_in_range` tick — guaranteeing the first wave engages
#   immediately rather than drifting past the player.
#
# Victory: all waves for the active power tier destroyed → game_over "VICTORY".
#   Three on_all_destroyed triggers, one per tier, each guarded by a when
#   predicate so only the tier whose b-ships were actually spawned ever fires.
# Defeat:  Starbase Alpha destroyed → game_over "DEFEAT".
#          Player ship destroyed → handled by the built-in apply_hull_damage
#          path which sets GamePhase::GameOver directly with reason
#          "All consoles destroyed" — no scenario trigger needed.

[global]
seed = 475
title = "Combat Test: Defend Starbase Alpha"
description = "Eight waves of Harrow attackers. Hold the line."

[ambient_light]
color      = [0.6, 0.55, 0.5]
brightness = 300.0

# ── Anchors ───────────────────────────────────────────────────────────────────
#
# Starbase at [500, 0, 100]. Spawn anchors are absolute world coords (the
# `spawn_entity` action's `anchor` field resolves against this `[anchors]`
# block). All spawn anchors lie outside the outer asteroid belt (r >= 1000
# from world origin) on the outward-facing +X hemisphere of the starbase.
[anchors]
# Verification: distance from world origin to each anchor, computed as
# sqrt(x^2 + z^2). All should be >= 1000.
enemy_e        = [1200.0, 0.0, 100.0]    # 1204
enemy_ne       = [1000.0, 0.0, -400.0]   # 1077
enemy_se       = [1000.0, 0.0, 600.0]    # 1166
enemy_n_outer  = [900.0, 0.0, -600.0]    # 1081
enemy_s_outer  = [900.0, 0.0, 800.0]     # 1204
enemy_ene      = [1100.0, 0.0, -150.0]   # 1110
enemy_ese      = [1100.0, 0.0, 350.0]    # 1154
enemy_e_far    = [1400.0, 0.0, 100.0]    # 1404
starbase_patrol_north = [500.0, 0.0, -80.0]   # starbase + [  0, 0, -180]
starbase_patrol_east  = [680.0, 0.0, 100.0]   # starbase + [+180, 0,    0]
starbase_patrol_south = [500.0, 0.0, 280.0]   # starbase + [  0, 0, +180]
starbase_patrol_west  = [320.0, 0.0, 100.0]   # starbase + [-180, 0,    0]

# ── Static map entities ───────────────────────────────────────────────────────

# Star at world origin. Inner asteroid field rings the star at r=200..300.
[[entity]]
template_path = "assets/entities/star_sun.toml"
transform = { position = [0.0, 0.0, 0.0] }

# Planet in the inter-field gap.
[[entity]]
template_path = "assets/entities/planet_earth.toml"
id = "earth"
name = "earth"
transform = { position = [550.0, 0.0, 0.0] }

# Inner asteroid belt around the star, r=200..300. Forms cover near the
# centre of the playspace; the player can hide in or peek out of it.
[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
id = "inner-belt"
transform = { position = [0.0, 0.0, 0.0] }
overrides = { asteroid_field = { inner_radius = 200.0, outer_radius = 300.0 } }

# Outer asteroid belt, r=800..1000. Sits between the starbase and the
# enemy spawn anchors (all at r >= 1000), so attackers must fly through
# asteroids to reach the playspace.
[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
id = "outer-belt"
transform = { position = [0.0, 0.0, 0.0] }
overrides = { asteroid_field = { inner_radius = 800.0, outer_radius = 1000.0 } }

# Player ship — selected from the lobby ship picker. The [[available_ships]]
# entries drive the lobby UI; [player_spawn] sets the spawn position once
# the player enters the game. The legacy [[entity]] + spawn_on = "game_start"
# block is replaced by this pair so all three Alliance hulls are accessible.

[[available_ships]]
template_path = "assets/entities/alliance_destroyer.toml"
label = "Alliance Destroyer"

[[available_ships]]
template_path = "assets/entities/alliance_cruiser.toml"
label = "Alliance Cruiser"

[[available_ships]]
template_path = "assets/entities/player_ship.toml"
label = "Alliance Battleship"

[player_spawn]
position = [400.0, 0.0, 200.0]

# Defended object. Named "Starbase Alpha" so on_destroyed can reference it.
[[entity]]
template_path = "assets/entities/station_axiom.toml"
name = "Starbase Alpha"
transform = { position = [500.0, 0.0, 100.0] }

# ── Wave spawn triggers ──────────────────────────────────────────────────────

# Make Harrow hostile to the Federation (and vice versa) for the duration
# of this scenario. The faction TOMLs default both sides to neutral so the
# same Harrow ship templates can appear as ambient patrols in non-combat
# worlds (Starbase Alpha, Before the Fire). Two `add_faction_enemy`
# actions flip both directions of the asymmetric `is_enemy` relationship
# at world-load time, *before* any wave's `enemy_in_range` transition
# ticks — guaranteeing the first wave engages on detection rather than
# drifting past as a neutral patrol.
#
# Idempotent. Re-running the trigger (e.g. via load_world layering) is
# a no-op. Faction names are case-sensitive and must match the `name`
# field in the corresponding `assets/factions/*.toml`.
[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type    = "add_faction_enemy"
  faction = "Harrow"
  enemy   = "Federation"

  [[trigger.action]]
  type    = "add_faction_enemy"
  faction = "Federation"
  enemy   = "Harrow"

# Wave 1: destroyer at t=0
[[trigger]]
condition = "on_timer"
after_secs = 0.0

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/pirate_raider.toml"
  name          = "wave_1"
  anchor        = "enemy_n_outer"

  [[trigger.action]]
  type           = "add_objective"
  id             = "obj-destroy-wave-1"
  text           = "Destroy wave 1: Harrow destroyer."
  mandatory      = true
  targets        = ["wave_1"]
  target         = "wave_1"
  directive_kind = "Destroy"
  base_priority  = 80.0

# Wave 1 extra: +1 dynasty destroyer if ship_power >= 90 (cruiser or battleship)
[[trigger]]
condition  = "on_timer"
after_secs = 0.0
when       = "counter(ship_power) >= 90"

  [[trigger.action]]
  type          = "spawn_entity"
  template_path = "assets/entities/pirate_raider.toml"
  name          = "wave_1b"
  position      = [900.0, 0.0, -560.0]


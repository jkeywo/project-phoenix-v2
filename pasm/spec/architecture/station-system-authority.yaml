entities:
  - component: ship-station-system-topology
    core:
      status: implemented
      confidence: confirmed
      title: Ship Station and System Topology
      summary: Ship-authored station, fine-system, power-group, rating, and console topology that defines who may operate each capability.
      rationale:
        - Station ownership is the authority source for player access; console labels alone must not grant control.
    architecture:
      kind: configuration-model
      authority: authoritative
      owns: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/config.rs, assets/entities]
      symbols: [ShipConfig, StationConfig, SystemInstanceConfig]
      tests: [cargo test]

  - state: ship-station-system-topology-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Station and System Topology State
      summary: Authoritative parsed description of stations, systems, ratings, ownership, power groups, markers, and AI-only capabilities for a ship.
    architecture:
      classification: authoritative
      owner: ship-station-system-topology
      writers: [ship-station-system-topology]
    implementation:
      status: declared
      paths: [src/ship/config.rs]
      symbols: [ShipConfig]

  - component: system-kind-registry
    core:
      status: implemented
      confidence: confirmed
      title: System Kind Registry
      summary: Code-backed registry that validates ship-authored system kinds and names the required AI controller for each kind.
      rationale:
        - "One id, one meaning (#801). Identifiers live in exactly one of three namespaces: system ids (declared [[system]] instances that get a ControlSource, gate admission, and can be damaged), station ids (crew stations that key console-level blackboards and channel-3 coordination routing), and wire targets (the target of a ControlSystem envelope, always a system id)."
        - "The coarse helm and tactical systems were deleted by #801: \"helm\" and \"tactical\" are now station ids only, carried inside SystemId-typed maps via the helm_station_key / tactical_station_key helpers. No [[system]] block declares them, no ControlSource is registered for them, and no ControlSystem message may target them."
    architecture:
      kind: registry
      authority: authoritative
      reads: [ship-station-system-topology-state]
      validates: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/system_registry.rs]
      symbols: [SystemKindRegistry]
      tests: [cargo test]

  - component: system-control-source-resolver
    core:
      status: implemented
      confidence: confirmed
      title: System Control Source Resolver
      summary: Per-ship resolver that maps each system to Human, AI, or Offline policy for the current tick.
      rationale:
        - Human and AI operation share admitted commands and system contracts; only control-source policy decides which input is accepted.
    architecture:
      kind: authority-policy
      authority: authoritative
      owns: [system-control-source-state]
      reads: [ship-station-system-topology-state, active-station-rating-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/control_source.rs, src/ship/rating.rs]
      symbols: [ControlSourceResolver, ControlSource]
      tests: [cargo test]

  - state: system-control-source-state
    core:
      status: implemented
      confidence: confirmed
      title: System Control Source State
      summary: Authoritative per-ship mapping from system id to the current Human, AI, or Offline control source and tick policy.
    architecture:
      classification: authoritative
      owner: system-control-source-resolver
      writers: [system-control-source-resolver]
    implementation:
      status: declared
      paths: [src/ship/control_source.rs]
      symbols: [ControlSourceResolver]

  - component: station-rating-controller
    core:
      status: implemented
      confidence: confirmed
      title: Station Rating Controller
      summary: Applies a station holder's selected rating and its configured automated systems to the authoritative control-source state, including a valid rating change during an active round.
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [active-station-rating-state]
      writes: [system-control-source-state]
      reads: [ship-station-system-topology-state, session-station-ownership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/rating.rs, src/ship_plugin.rs, src/lobby/handler.rs]
      symbols: [ActiveStationRatings]
      messages: [SetStationRating, RatingChanged]
      tests: [cargo test]

  - state: active-station-rating-state
    core:
      status: implemented
      confidence: confirmed
      title: Active Station Rating State
      summary: Authoritative per-ship selected ratings for occupied stations, including pending lobby selections and Backfill after disconnect.
    architecture:
      classification: authoritative
      owner: station-rating-controller
      writers: [station-rating-controller]
      replicas: [station-rating-replica]
    implementation:
      status: declared
      paths: [src/ship/rating.rs, src/lobby/session.rs]

  - component: station-backfill-transition
    core:
      status: implemented
      confidence: confirmed
      title: Station Backfill Transition
      summary: Applies Backfill automation to a disconnected station and restores or yields the prior station on reconnect according to live ownership.
    architecture:
      kind: lifecycle-policy
      authority: authoritative
      writes: [active-station-rating-state, system-control-source-state]
      reads: [session-station-ownership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/lobby/session.rs, src/lobby/server.rs, src/ship_plugin.rs]
      tests: [cargo test, tests/smoke/reconnect.spec.ts]

  - component: admitted-command-router
    core:
      status: implemented
      confidence: confirmed
      title: Admitted Command Router
      summary: Load-time registry naming which module consumes each admitted SystemId, plus an end-of-frame lint that warns when an admitted command has no registered consumer.
      rationale:
        - "One table answers which module handles a payload (#833). Routing itself already landed across #824–#832: admission drains the inbound ControlSystem stream once per tick into the owning ship's per-entity AdmittedCommands, and every consumer reads only its own slice via AdmittedCommands::for_target. There is no central SystemId→module dispatch table (system_target_for_payload_type was deleted in #822) — a runtime dispatcher would re-introduce the chokepoint the per-entity design removed and collapse the consumer scheduling (appliers run in different SimSets: Input/Physics/Modifiers/Broadcast)."
        - "So the router is a registration seam, not a dispatcher: each console/ship plugin registers its consumer(s) at build with one line (RegisterAdmittedConsumer::register_admitted_consumer, keyed by system kind or by prefix for dynamic families like shield-arc-*). Adding a System is one registration; an admitted command whose target matches no registered consumer is warned (pwarn!, LogCat::Admit) by warn_unrouted_admitted_commands rather than silently dropped. The lint keys on the registry (no consumer), not on whether state changed, and mutates nothing — the headless behavioural gate stays bit-identical."
        - "Out of scope: the weapons FIRE/LOAD handlers read MessageReader<InboundMessage> for dedicated top-level ClientMessage variants (FirePhaser, LoadTube, …) that carry no SystemId target — a separate client→host channel outside admitted routing, not routable by a SystemId router (a possible future migration, not #833). The InterSystemQueue is likewise a separate inter-system bus."
    architecture:
      kind: registry
      authority: authoritative
      reads: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/command_admission/router.rs, src/ship/system_registry.rs]
      symbols: [AdmittedConsumerRegistry, ConsumerMatcher, RegisterAdmittedConsumer, warn_unrouted_admitted_commands, unrouted_command_targets]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: every_admitted_consumer_kind_is_registered
        summary: >-
          Builds the full set of consumer plugins and asserts every
          admitted-command-capable system kind (the inverse §2 census) resolves
          to a registered consumer, and that an unrouted id is flagged by the
          lint rather than dropped.

  - component: system-command-admission-policy
    core:
      status: implemented
      confidence: confirmed
      title: System Command Admission Policy
      summary: Host admission checks target system identity, station ownership, availability, and control-source policy before a system handler observes a player command, and routes every command into the target ship's own per-entity AdmittedCommands.
      rationale:
        - A client must not gain authority by naming another station's system or by bypassing a damaged, offline, or AI-controlled system.
        - "Every wire target names a declared system since #801 — there is no coarse helm or tactical target — so admission is inherently per-axis for helm commands and per-bank for tactical commands."
        - "Ship-aware since #824 (pasm/spec/RADAR_TARGET_AUTHORITY_AND_ADMISSION.md section 2): every ship's AdmittedCommands is cleared each tick; human tokens route to the LocalShip as before, while a registered ai: token resolves through AiTokenRegistry to the owning entity and is admitted into that entity's own AdmittedCommands, validated by that entity's ControlSourceResolver. The validate+enqueue step is one shared seam (command_admission::validate_and_admit) also used by the console/system AI decide systems to emit their decisions as admitted commands in the same tick — so human and AI, player and NPC, all flow through one gate and nothing downstream branches on source."
        - "Implemented (was partially-implemented) once #833 formalised routing: the only remaining gap was the 'one table' answering which module consumes each admitted target and the guarantee that an unrouted target is logged rather than silently dropped. That is now the sibling admitted-command-router entity (AdmittedConsumerRegistry + the warn_unrouted_admitted_commands lint); no consumer was moved or re-scheduled — the change is a load-time registration seam plus a warning-only lint."
    architecture:
      kind: command-validator
      authority: authoritative
      reads: [ship-station-system-topology-state, system-control-source-state, authoritative-damage-state]
      validates: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/command_admission/policy.rs]
      symbols: [is_command_authorized, station_for_system]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: dispatch_to_an_ai_controlled_system_rejects_humans_and_admits_ai
        summary: >-
          The policy predicate is its own module: it resolves the owning
          station from the ship config and consults the control-source policy,
          so unauthorised, offline, damaged, and AI-controlled targets are all
          denied before any handler runs.

  - message: system-control-command
    core:
      status: implemented
      confidence: confirmed
      title: System Control Command
      summary: Untrusted client-to-host command addressed to a stable system id with one typed control payload.
    architecture:
      authority: request
      producer: [client-network-interface]
      consumer: [system-command-admission-policy]
      validator: [system-command-admission-policy]
      trust_boundary: client-to-host
      payload: ControlSystem
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/core/codec.rs, gui/action-map.js]
      messages: [ControlSystem]
      tests: [cargo test, tests/client/action-map.test.js]

  - state: station-rating-replica
    core:
      status: implemented
      confidence: confirmed
      title: Station Rating Replica
      summary: Non-authoritative player-facing projection of current station ratings and automatic operation state.
    architecture:
      classification: replicated
      owner: station-rating-controller
      derived_from: [active-station-rating-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/settings-panel.js, gui/sim-state.js]
      messages: [RatingChanged]

# Optional first owned-carrier Personnel consumer. Existing six seats, Bay,
# physical teams, power, damage and ordinary AI are inherited unchanged.
includes = ["probe_carrier.toml"]
name = "entity.personnel_carrier.name"

[[personnel.repair_team]]
id = "repair-alpha"
label = "personnel.team.alpha"
team_idx = 0
competencies = ["mechanical_repair", "personnel_transport"]

[[personnel.repair_team]]
id = "repair-beta"
label = "personnel.team.beta"
team_idx = 1
competencies = ["mechanical_repair", "personnel_transport"]

[[personnel.officer]]
id = "repair-chief"
label = "personnel.officer.repair_chief"
home_compartment = "engineering"
competencies = ["mechanical_repair"]
repair_work_multiplier = 1.25

[[personnel.officer]]
id = "technician"
label = "personnel.officer.technician"
home_compartment = "engineering"
competencies = ["mechanical_repair"]
repair_work_multiplier = 1.1

# Explicit information-only Bay feed. The Engineering Console does not gain
# Bay command ownership; Tactical still operates the actual Bay.
[[console]]
id = "engineering"
name = "Engineering"
screen = "gui/cruiser/engineering.html"
home_station = "engineering"


  - component: ai-policy-host-spine
    core:
      status: implemented
      confidence: confirmed
      title: AI Policy Host Spine
      summary: The single Admission-facing AI host module — a pure gate/declare/resolve decision, a bare-Res world-context SystemParam, and an admission emitter — that every fine-system AI operator is intended to run its spine through.
      rationale:
        - "[ai] The four-step spine every AI host shares — gate on the Control Source being AI, check the fine system declares a policy, resolve the winning verb for a channel, emit it through the shared admission seam — belongs in one module rather than hand-inlined at the top of twenty-one host bodies."
        - "Issue #1205 lands the module ADDITIVELY: no host consumes it yet. src/ai/host.rs::decide is the pure, Bevy-free half — decide(sources, policy, &HostTick) -> HostOutcome (NotAiOperated / Undeclared / Held / Act(&verb)), unit-testable with a hand-built HostTick and no App. The three non-acting outcomes stay distinct because a host and its tests care WHY nothing emitted: a human (or an offline system) holds it, it is AI-run but authors no policy (strict declaration, #885), or it authors one that held this tick. Resolution runs the frozen ai::policy evaluator — resolve_channel for a stateless tick, resolve_channel_in_state when the HostTick carries a HostState — so decide adds a gate and a declaration check around the existing runtime, inventing no second evaluator."
        - "AiHostEnv is the Bevy half: a SystemParam holding BARE Res for WorldContentRuntime, WorldLayerMap and Sessions plus the EntityOriginLayer query, exposing flag_chain(ship) (the entity_flag_chain layered walk every current host runs) and emitter(). Bare Res, not Option<Res<..>>, is the deliberate interface choice — the pre-existing hosts each carry their own Option<Res<..>> copies precisely so a bare App could skip them silently, and consolidating here ends that: a fixture that runs a host through this env must register the same resources production does or fail loudly at Bevy schedule build. register_ai_host_env(app) is the ONE wiring point that registers them (idempotent init_resource for the two Default resources; Sessions inserted only when the lobby plugin has not), called by both the AI host plugin (ConsoleAiPlugin) and ship::test_support so a fixture cannot take a different code path than the shipped app."
        - "The dependency on host-command-admission is the whole reason the emit path re-homes here. PASM's observed-edge attribution discards edges from a file owned by more than one entity, which is why the per-host emit_*_ai_command shims existed. src/ai/host.rs is owned by exactly ONE entity, so its `use crate::command_admission::ai_emit::emit_ai_command` — wrapped as AiEmitter, the AI side of the typed input path — is an UNAMBIGUOUS observed admission edge. Routing an AI decision through the seam (rather than writing authoritative state) is what keeps AI and human commands symmetric (AGENTS.md #6): the spine is non-authoritative, the admission seam it depends on is the authority."
    architecture:
      kind: service
      authority: non-authoritative
      depends_on:
        - host-command-admission
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/ai/host.rs
      symbols:
        - decide
        - HostOutcome
        - HostState
        - HostTick
        - AiHostEnv
        - AiEmitter
        - register_ai_host_env
      tests:
        - cargo test

  - component: per-bank-weapon-policy
    core:
      status: implemented
      confidence: confirmed
      title: Per-Bank Weapon AI Policy
      summary: Attaches each AI-capable phaser and blaster bank's resolved inline open-fire policy to the ship as a bank-id-keyed component, so an individual weapon bank — a Vec entry, not an entity — governs whether it opens fire while the host enforces availability, cooldown, range, arc, and target validity.
      rationale:
        - "[ai] Weapon banks are addressable fine systems (phaser_bank / blaster_bank kinds) but live as Vec entries inside PhaserCombatConfigResource / BlasterSystemResource, so their resolved policies attach as ship-level maps keyed by bank id rather than per-entity components."
        - "Issue #781 introduced PhaserBankAiPolicies(HashMap<PhaserBankId, AiPolicy>) and BlasterBankAiPolicies(HashMap<BlasterBankId, AiPolicy>), built at spawn from each bank's authored ai block (else the unconditional-fire canonical default). ai_phaser_auto_fire / tick_blaster_auto_fire look up each candidate bank's policy by id, seed a per-bank readiness snapshot, and only emit the bank's typed fire input when the policy fires — giving per-bank independence and an explicit per-bank idle opt-out (AC1/AC2/AC7)."
        - "The blaster AI CONVERGED onto admission (AC5/AC7): tick_blaster_auto_fire now emits ChargeBlasterStart through emit_ai_command instead of calling bank.request_charge_start() directly, and handle_fire_blaster reads per-ship AdmittedCommands (registered blaster- consumer) in SimSet::Physics before tick_blaster_system, with the arc check applied identically to human and AI origins. This closes the pre-#781 asymmetry where the human path went through admission-adjacent checks while the AI path mutated the bank directly. Phasers already converged under #846."
        - "Provenance: this binding is produced by the fine-system-ai-policy-runtime hosts (ai_phaser_auto_fire / tick_blaster_auto_fire) reading these ship-level per-bank maps."
        - "Issue #782 applied the same binding to the torpedo two-stage pipeline. TorpedoTubeAiPolicies(HashMap<TorpedoTubeId, AiPolicy>) holds each tube's load+launch policy (torpedo_load / torpedo_launch channels); TorpedoMagazineAiPolicy(AiPolicy) holds the shared magazine's grant policy (torpedo_magazine_grant channel). Built at spawn from [[torpedoes.tubes]].ai / [torpedoes].ai (else default_torpedo_tube_ai_config = unconditional load+launch / default_torpedo_magazine_ai_config = unconditional grant). ai_torpedo_load and ai_torpedo_auto_fire look up each tube's policy by id and only emit the tube's typed input (SetTorpedoVolleyTarget / FireTorpedo) when it fires, giving per-tube independence and a per-tube idle opt-out; the magazine policy is resolved inside the single claim consumer, keeping torpedoes_remaining single-writer and same-tick contention deterministic (AC6)."
        - "Issue #885 (8555e336) deleted the four canonical defaults named above (default_phaser_bank_ai_config / default_blaster_bank_ai_config / default_torpedo_tube_ai_config / default_torpedo_magazine_ai_config) together with every call site. Read the #781/#782 bullets' references to them as what the authored per-bank and per-tube blocks had to reproduce, not as a live fallback: strict AI-declaration mode is now the default, so a bank or tube that declares no ai block fails the entity load."
        - "Issue #885 SURFACED A SHIPPED BUG in this binding while deleting those defaults, and it is worth recording because the failure mode is structural rather than incidental. The PLAYER ship's spawn path (server_app::spawn_game_start_entities, which does not go through entities::spawner) never attached PhaserBankAiPolicies, BlasterBankAiPolicies, TorpedoTubeAiPolicies or TorpedoMagazineAiPolicy at all — so the read-time fallback the hosts kept for bare fixtures WAS the live production path for the player's guns, and removing it blind would silently have stopped the player ship firing. All four are now attached from the ship's own authored content on both paths, and a test re-reads both spawn functions to check every declared kind is attached at every site it claims. That is the same one-path-not-the-other omission that had already shipped three times (#785, #786, #882) and that ai_high_fidelity_components exists to prevent for the LOD-carried components."
    architecture:
      kind: ai-policy-binding
      authority: authoritative
      reads: [resolved-entity-template-state, system-control-source-state]
      produces: [fine-system-ai-policy-state]
      runs_in: [host-browser-runtime]

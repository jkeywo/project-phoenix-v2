  - mechanic: gm-t2-event-control-contract
    core:
      status: accepted
      confidence: confirmed
      title: Explicit Fire, Pause, and Skip-Next Event Controls
      summary: "An automatic authored event is GM-controllable only when it declares gm_controls metadata with a stable qualified id, String Table label/description, and any explicit subset of fire, pause, and skip. Missing controls are invisible and unavailable. Pause is a persistent manual toggle: while paused the automatic condition is not evaluated and no missed edge is captured; unpause resumes ordinary evaluation, so a GM must use Fire if the opportunity passed. Fire bypasses condition and pause and executes the ordinary handler/lifecycle. Skip arms only the next matching occurrence and advances lifecycle as if it fired: a repeating event enters cooldown and a once-only event is spent. An armed skip survives Pause; Fire does not consume it."
      rationale:
        - "gm_event(id, label, handler) is the manual-only shorthand and implies Fire without a redundant gm_controls declaration. It is one-shot by default; repeatable() makes it a reusable quick tool."
        - "A scenario can therefore expose a pure GM control with only a Fire trigger, while authors retain complete control over which automatic events are operable."
        - "Trigger identity and control state are layer-qualified and represented in snapshots, deterministic digests, history, and the command log."
        - "[ai] Qualification is `<origin layer>::<authored id>`, with `base-world` for the base world, DERIVED at read time from the trigger state's origin_layer rather than baked into the control set at compile time: the same authored unit can be merged as a base world in one run and as a layer in another, and only one of those two facts is authored. Authored ids may not contain `::` or whitespace, so the join is unambiguous, and two ids that collide within one compiled set are a load-time error — deliberately stricter than ResetTrigger's tolerant Trigger::id lookup, which re-arms EVERY trigger sharing an id on purpose, because a GM action names exactly one event and must get exactly one handler run."
        - "[ai] Fire ARMS the event rather than calling its handler: the typed action's PreUpdate reducer records the qualified id on WorldContentRuntime::pending_gm_event_fires, and the ordinary FixedUpdate trigger pipeline consumes the arm and runs the ordinary handler in table order. A second call path into the Rhai runtime from the action reducer is the one shape that would make a GM fire differ from an automatic one, and it would have to duplicate tick_trigger_pipeline's whole parameter set. Everything that decides the RESULT is still revalidated at the agreed apply tick, so equal GMs commit the same Applied/No-op/Refused on every peer."
        - "[ai] A `when` predicate that reads false suppresses a manual firing WITHOUT consuming the arm, exactly as it suppresses an automatic firing without consuming the trigger — so a Fire during a suppressed moment lands when the predicate holds instead of being silently lost. An arm is dropped only when it is consumed by an actual firing, when the event is a spent once-only, or when the layer that authored it has unloaded."
        - "[ai] The armed set is folded into the deterministic digest and captured in the snapshot only when it is non-empty, so no world that authors no GM event moved its digest when this landed. The durable LoggedGmAction gained an optional target so the activity feed and the mission panel can say WHICH event a logged Fire fired without re-reading the journal."
        - "[ai] A REFUSAL carries that stable target too, on both lanes that can produce one before a grant exists: the local browser ingress builds its fact from the request itself (LoggedGmAction::refused_request) and the owner's canonical decision from the proposal (refusal_for), so a refused Fire still names the event the operator pressed. validate_fleet_frame refuses a replicated refusal whose target does not match its family — an event-control refusal must name an event and no other family may — because a targetless one could only be published as a fire of the empty id on every GM's feed."
        - "[ai] The browser carries the same action vocabulary Rust publishes: gm-activity-feed.js normalises fire_gm_event and renders its own sentence. Its parse is deliberately payload-wide and strict, so a variant known to only one side does not drop one row, it freezes the whole feed until the entry rotates out."
        - "[ai] The run boundary resets the mission projection's de-duplication cache beside the session twin's. The authored trigger table is built once at Startup, so a lobby round-trip in which no Fire was taken leaves round two's projection byte-identical to round one's; the GM page clears its panel on the Lobby transition, so a surviving cache would suppress the only push that could fill it again."
        - "[ai] The ARMED SET is cleared at that same boundary, with the journal, log, refusals and both projections. WorldContentRuntime is Startup-built and so survives the round-trip, and a `when` predicate or an unelapsed cooldown can legitimately hold an arm for many ticks: a surviving one would run its authored handler in the NEXT run with no grant, no LoggedGmAction, no activity-feed row and nobody attributed, while the panel reported it armed against an empty result feed and a fresh Fire returned an unexplained No-op. The arm is a GM command's pending effect, so it belongs to the run whose grant authorised it, not to the world content it names."
    architecture:

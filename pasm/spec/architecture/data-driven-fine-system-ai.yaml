      status: declared
      paths: [src/console/weapons/beam.rs, src/console/weapons/blaster.rs, src/console/weapons/torpedo.rs, src/console_ai/server.rs, src/entities/spawner.rs, src/entities/config.rs]
      symbols: [PhaserBankAiPolicies, BlasterBankAiPolicies, TorpedoTubeAiPolicies, TorpedoMagazineAiPolicy, seed_torpedo_tube_load_facts, seed_torpedo_tube_launch_facts, seed_torpedo_magazine_facts, handle_fire_blaster, handle_torpedo_magazine_inter_system]
      tests: [cargo test]

  - component: ai-policy-tick-scheduler
    core:
      status: implemented
      confidence: confirmed
      title: AI Policy Tick Scheduler
      summary: Runs policy evaluation on a deterministic TOML-authored fixed-rate base cadence with authored per-system integer tick multiples and next-tick visibility for outputs from other fine systems.
      rationale:
        - A shared cadence aligns AI actuation with Helm's established control rhythm.
        - Integer evaluation multiples permit slower Sensors, Power, Repair, or Comms decisions without frame-dependent timers.
        - "The shipped precedent was the shared AI-helm sim tick (#803): one AiHelmTickTimer at [global] ai_helm_tick_hz (default 30 Hz) gating the per-axis AI helm systems, decoupling those decisions from host frame rate for P2P lockstep (PRD #620). #889 generalised it to every AI decider and renamed it AiTickTimer / [global] ai_tick_hz."
        - "Issue #882 makes POLICY STATE TIME tick-derived on that same cadence. AiPolicyTickClock advances by exactly one authored base period each time ai_policy_state_tick runs, and that system sits under the same shared latch as the per-axis helm systems. (#889 renamed that latch to run_if(ai_tick_ready) and moved its tick system into Bevy's Last schedule, which is what now guarantees the latch is consumed before it is re-armed — the pre-#889 arrangement leaned on a tick_ai_helm_timer ordering edge instead.) state_time is therefore (clock - entered_at_secs): never Time::delta, never a Timer inside a policy — #784 retired the last per-frame AI timer and #882 does not reintroduce one. Ordering: ai_policy_state_tick runs .after(helm_motion_planner) (its transition guards read this tick's hazard surface) and .before every per-axis actuator system, so the state it commits is the state those systems resolve their outputs in."
        - "Issue #889 (first pass) stated the gap plainly rather than leaving 'proposed' to imply merely-unfinished work. PRD #774's implementation decision requires every policy on the deterministic base cadence; before it the shipped cadence was fragmented three ways — the six helm axes on the shared ai_helm_tick_hz latch, Captain and Sensors on a HARDCODED 10 Hz AiSnapshotTimer gated inside the system body by an Option<Res<_>> that fell back to every-tick when absent (which every bare-App fixture in the crate hit, so the shipped cadence was covered by no test at all), and eight further deciders — shields focus, power allocation, torpedo load and auto-fire, frequency hint, phaser and blaster auto-fire, AI target selection — on NO gate whatsoever. Because the sim sets are configured in Bevy's Update, ungated meant ONCE PER RENDERED FRAME. Two consequences were worth keeping visible: a designer-tunable decision rate living as a Rust literal is an AGENTS.md #11 violation in its own right, and the same seed produced a different NPC firing PHASE between the fixed-timestep headless harness and the rAF-driven browser, which is what the #835 balance numbers were measured against."
        - "Issue #889 (3d21957d) landed the BASE-CADENCE half first: one timer (src/ai/cadence.rs, AiTickTimer + AiTickReady), authored as [global] ai_tick_hz with ai_helm_tick_hz kept as a serde alias; the slower cadence DERIVED from it as an integer multiple of base ticks rather than an independent clock, with a non-integer relationship between the two authored rates rejected at world load. See ai-helm-tick-cadence in architecture/helm-controls.yaml for the shipped mechanism."
        - "Issue #889 (second pass) closed the two gaps the first pass left, which is what moves this component from proposed to implemented. FOUR HOSTS THE ORIGINAL PASS NEVER ENUMERATED were still running once per FIXED STEP with no gate at all, because #895's FixedUpdate migration only converted the deciders the first pass already named: operate_navigation_ai (src/console/navigation/mod.rs), operate_repair_ai (src/console/repair/server.rs), and BOTH Comms hosts, operate_comms_ai and operate_comms_response_ai (src/console/comms/server.rs). All four now carry .run_if(crate::ai::cadence::ai_tick_ready), registered in their own plugin's build() (NavigationPlugin, RepairPlugin, CommsConsolePlugin), each of which also now calls register_ai_cadence(app) — idempotent, so the plugin still works standalone in a fixture that never pulls in ConsoleAiPlugin. TORPEDO_MAGAZINE's grant policy carries no run_if of its own and needs none: it is resolved inside the single claim consumer ai_torpedo_load reads before emitting a load command (see per-bank-weapon-policy above), so it is TRANSITIVELY gated by ai_torpedo_load's own run_if(ai_tick_ready) — it cannot evaluate on an ungated tick because nothing calls it on one."
        - "Issue #889 (second pass) also wired the AUTHORED PER-SYSTEM INTEGER TICK MULTIPLE (evaluate_every_ticks) at runtime, closing the gap the first pass left explicitly open: the field was parsed and validated (FineSystemAiConfigToml::evaluate_every_ticks, u32, default 1, 0 rejected at load) but no host read it. The mechanism: AiBaseInterval (src/ai/cadence.rs) is the per_ai sim-tick interval tick_ai_cadence already derives, written alongside the two existing latches; evaluate_every_ticks_ready(tick, base_interval, n) is the ONE pure function — tick % (base_interval * n) == 0 — every caller shares, so a host's own arm is anchored to SimTick 0 exactly like AiTickReady/AiSnapshotReady, and n <= 1 reduces to 'every base arm' with zero behaviour change. The field is deliberately NOT threaded onto the shared ai::policy::AiPolicy struct: ~84 call sites across the crate construct an AiPolicy by literal (tests overwhelmingly), and a new mandatory field there would touch all of them for two hosts' worth of benefit. Instead it rides as a SIBLING component next to the two hosts wired so far — PowerAiCadence beside PowerAiPolicy (src/ship/power.rs), CommsResponseAiCadence beside CommsResponseAiPolicy (src/console/comms/server.rs), both populated from the SAME authored block the AiPolicy itself decodes from, at the one shared spawn seam each host already has (comms_console_ai_components for both Comms spawn paths; the [power.ai_policy] insert at both Power spawn paths). ai_power_allocation and operate_comms_response_ai read the sibling component once per ship, right where they already fetch that ship's policy, and continue (skip this ship this tick) when evaluate_every_ticks_ready reads false — exactly like the existing operate_ai / missing-declaration continues beside it, not a new kind of gate. A shipped-content pin (entities::authored_ai_pins::every_shipped_policy_authors_the_default_evaluate_every_ticks) asserts every authored fine-system policy in the fleet still authors the default 1, and cadence::tests::n_equal_three_decides_on_exactly_every_third_arm proves a fixture authoring n = 3 decides on exactly the 3rd, 6th, 9th, ... arm of the shared latch, never more, never fewer."
        - "[ai] What is HONEST about calling this implemented rather than fully adopted: the mechanism (AiBaseInterval, evaluate_every_ticks_ready, the sibling-component pattern) is generic and proven correct, and two hosts (Power, Comms response) read it in production. The remaining gated hosts — the six helm axes, shields focus, torpedo load/auto-fire, phaser and blaster auto-fire, frequency hint, AI target selection, Captain and Sensors (the latter two on ai_snapshot_ready rather than the base latch) — still decide on every base arm regardless of what evaluate_every_ticks says, because none of them yet carries the equivalent sibling component. That is unobservable today: every shipped hull authors the default 1 everywhere (the pin above proves it), so no shipped behaviour differs from a world where those hosts do not consult the field at all. Adopting it elsewhere is the SAME one-line change per host (attach a *Cadence component at that host's spawn seam; read it and call evaluate_every_ticks_ready before deciding) with no change to the shared function or the latch — the reason 'find the cleanest single seam' mattered was so this next step costs one component and one continue, not a second design."
    architecture:
      kind: scheduler
      authority: authoritative
      reads: [system-control-source-state, fine-system-ai-policy-state]
      coordinates: [fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ai/cadence.rs, src/console/navigation/mod.rs, src/console/repair/server.rs, src/console/comms/server.rs, src/ship/power.rs, src/console_ai/server.rs, src/entities/spawner.rs, src/server_app/world_setup.rs, src/entities/authored_ai_pins.rs]
      symbols: [AiTickReady, AiSnapshotReady, AiBaseInterval, tick_ai_cadence, ai_tick_ready, ai_snapshot_ready, evaluate_every_ticks_ready, register_ai_cadence, arm_ai_tick, operate_navigation_ai, operate_repair_ai, operate_comms_ai, operate_comms_response_ai, PowerAiPolicy, PowerAiCadence, CommsResponseAiPolicy, CommsResponseAiCadence, comms_console_ai_components, ai_power_allocation]
      tests: [cargo test]

  - component: fine-system-ai-policy-validation
    core:
      status: implemented
      confidence: confirmed
      title: Fine-System AI Policy Validation
      summary: Rejects structurally invalid or ill-typed inline stateless policies before world activation, checking rule structure, typed predicate expressions, output channels, verbs, and named parameter references.
      rationale:
        - Missing policies, contradictory idle declarations, invalid references, and forbidden outputs are deterministic content errors.
        - Validating expressions, channels, verbs, and parameters up front keeps authored content errors out of the live tick loop.
        - "The single validate_fine_system_ai_policy(cfg, valid_channels, valid_verbs) checker is reused per host with that host's channel/verb constants: Captain (#775) passes red_alert/set_red_alert; Engines (#779) passes longitudinal/actuate_desired_travel and Steering passes yaw/actuate_desired_facing. Authoring the wrong axis's verb on a channel, or an unknown helm verb, fails the entity load in EntityConfig::from_toml before any live tick."
        - "Issue #780 added the four secondary fine-actuator channel/verb pairs, each validated at entity load with its own constants: Lateral (HELM_LATERAL_CHANNEL/HELM_ACTUATE_LATERAL_THRUST_VERB), Vertical (HELM_VERTICAL_CHANNEL/HELM_ACTUATE_VERTICAL_THRUST_VERB), Impulse (HELM_IMPULSE_CHANNEL/HELM_ENGAGE_IMPULSE_VERB), Boost (HELM_BOOST_CHANNEL/HELM_ENGAGE_BOOST_VERB). Wrong-axis verbs (e.g. actuate_lateral_thrust on the vertical channel) fail the load."
        - "Issue #781 added the weapon-bank channel/verb pairs, validated per authored bank in EntityConfig::from_toml with slices PHASER_BANK_CHANNELS/PHASER_BANK_VERBS (phaser_fire / fire_phaser) and BLASTER_BANK_CHANNELS/BLASTER_BANK_VERBS (blaster_fire / fire_blaster). The from_toml loop iterates [[weapons_console.phaser_banks]] and [[weapons_console.blaster_banks]], calling validate_fine_system_ai_policy on each authored bank ai — so a blaster verb on a phaser bank channel, an unknown channel, an unparseable guard, or an undeclared param reference fails the entity load before any live tick."
        - "Issue #782 added the torpedo tube + magazine channel/verb pairs, validated in EntityConfig::from_toml with slices TORPEDO_TUBE_CHANNELS/TORPEDO_TUBE_VERBS (torpedo_load / load_torpedo and torpedo_launch / launch_torpedo) for each [[torpedoes.tubes]].ai and TORPEDO_MAGAZINE_CHANNELS/TORPEDO_MAGAZINE_VERBS (torpedo_magazine_grant / grant_torpedo_round) for [torpedoes].ai. A grant verb on a tube channel, a launch verb on the magazine channel, an unknown channel, an unparseable guard, or an undeclared param reference fails the entity load before any live tick."
        - "Issue #783 added the Shields focus channel/verb pair, validated in EntityConfig::from_toml with slices SHIELD_FOCUS_CHANNELS/SHIELD_FOCUS_VERBS (shield_focus / focus_shield_arc) for the [shields_console.ai_policy] block (sibling to the retained typed [shields_console.ai] knobs). A fire verb on the shield_focus channel, an unknown channel, an unparseable guard, or an undeclared param reference fails the entity load before any live tick. Shields did NOT use the #776 target selector: its arcs are a fixed 4-set of in-ship indices, not UUID entities, so there is no candidate-source union to validate — only the channel/verb/param policy shape."
        - "Issue #784 validates the Power [power.ai_policy] block with the SAME validate_fine_system_ai_policy checker but a DYNAMICALLY-BUILT valid-channel set: unlike every prior host (which passes a fixed const slice), Power builds valid_channels at load from the ship's authored [power_groups.*] keys and passes valid_verbs = &[POWER_SET_ALLOCATION_VERB]. This is the concrete expression of AC1 'no fixed system catalogue' — a rule targeting a group the ship does not author fails as an unknown channel, alongside the usual unknown-verb, unparseable-guard, and undeclared-param (the min-reserve) failures, before any live tick. The wire-in sits after power_groups are parsed into ship_config in from_toml."
        - "Issue #785 validates the Repair [repair.selector] block with validate_fine_system_ai_selector against the new REPAIR_SELECTOR_SOURCES const slice (SELECTOR_SOURCE_DAMAGED_STATIONS 'damaged-stations' + SELECTOR_SOURCE_CORE_BUCKET 'core-bucket'). The wire-in sits in EntityConfig::from_toml immediately after the Navigation selector wire-in, reading config.repair.selector — the first selector wire-in that does not read a *_console section. An unregistered source (e.g. a Sensors/Tactical radar-contacts id), an unparseable eligibility/score guard, or an undeclared param(...) reference (the deficit_band_* knobs the score guards name — tier_weight / deficit_weight were inert declarations and were deleted in #885) fails the entity load before any live tick evaluates the ranking."
        - "Issue #786 validates BOTH Comms console blocks in EntityConfig::from_toml immediately after the Repair wire-in — the first entity to run both validators for one system. [comms_console.selector] goes through validate_fine_system_ai_selector against COMMS_SELECTOR_SOURCES (SELECTOR_SOURCE_HAIL_OBJECTIVES 'hail-objectives' + SELECTOR_SOURCE_COMMS_CONTACTS 'comms-contacts'), and [comms_console.ai] through validate_fine_system_ai_policy against COMMS_RESPOND_CHANNELS/COMMS_RESPOND_VERBS (comms_respond / respond_to_message). An unregistered candidate source, a non-Comms verb on the comms_respond channel, an unknown channel, an unparseable guard, or an undeclared param(...) reference (the score_band_* knobs) fails the entity load before any live tick. Comms RANGE is deliberately NOT a validated policy constant: it is already authored as [comms].range and reaches the selector as a seeded fact."
        - "Issue #882 EXTENDED (did not fork) validate_fine_system_ai_policy with the state-graph checks. The idle-xor-rules check becomes idle xor (rules or states), and the existing per-rule channel/verb/parse_predicate/referenced_params loop now runs unchanged over each STATE's rules and each TRANSITION's `when` (diagnostics name the site, e.g. \"state 'cruise' rule 0\"). New rejections: an initial_state naming an undeclared state; states declared with no initial_state at all; a transition whose `to` names an undeclared state; duplicate state ids; an unreachable state, computed as a FIXPOINT walk from initial_state that follows transitions only out of states already known reachable (so a self-loop is not an entry AND a disconnected cluster — initial 'a'; 'b' -> 'c'; 'c' -> 'b' — is rejected, which a single pass crediting every transition target regardless of its source would have accepted); and a memory(...) or state_time reference in a STATELESS policy (private state has no owner without a machine, and silently reading false would be a trap). A memory(...) reference to an undeclared slot is rejected in a stateful policy too, mirroring the param(...) contract since #775. The shared checker is check_policy_predicate, backed by new Predicate::referenced_memory / Predicate::references_state_time."
        - "Issue #883 added the MIXED-DECLARATION rejection the #882 review flagged, and widened the Steering verb set. A policy declaring BOTH top-level `rule`s and `state`s is now rejected outright (rule XOR state). It used to validate and then fail twice, silently: a machine resolves exclusively through resolve_channel_in_state, so the top-level rules were dead code that looked live — and because the `stateful` flag is computed from the presence of states, a memory(...) reference inside one of those dead rules PASSED validation and then evaluated false for ever, since the stateless scan hands best_in an empty memory bag. Both honest shapes are untouched: every shipped canonical default is rule-only, and the destroyer's three policies are state-only (a_policy_with_both_top_level_rules_and_states_is_rejected / rule_xor_state_leaves_both_honest_shapes_valid). Separately, [helm_console.steering_ai] is now validated against HELM_STEERING_VERBS rather than the single #779 verb — the first channel in the schema with more than one legal verb — while every other axis keeps its single-verb slice, so a frozen-heading verb on the longitudinal/lateral/vertical/impulse/boost channel still fails the entity load. At #883 that slice held two verbs (actuate_desired_facing OR hold_committed_heading); it holds seven as of #792, and the wire-in is unchanged — the slice widened, the checker did not."
        - "Issue #918 rejects yields_to_arc_requests = false on any policy whose valid channel set does not contain `yaw`. An arc-bearing request is answered on the yaw channel alone, so the declaration authored on a boost or engines machine is one nothing would ever consult — the silent-no-op class this validator exists to turn into a load error. Declaring the DEFAULT anywhere stays legal, which is what keeps every already-authored block loading — and that asymmetry (reject false, accept true, on a channel that can never read either) is a CONSEQUENCE of the field's shape, not a preference for leniency: FineSystemAiStateToml::yields_to_arc_requests is a plain bool with #[serde(default = \"default_yields_to_arc_requests\")] returning true, so an omitted field and an explicitly-authored `true` decode to the identical value and the validator has no way to tell them apart. Rejecting `true` on a non-yaw axis would therefore reject every hull that never mentions the field at all — which is nearly every shipped block on every non-steering axis — not only the ones that typed it by hand. `false` has no such ambiguity: the default is `true`, so a `false` reading can only have come from an author's own keystroke, which is what makes it the one value this checker can safely turn into a load error. A typed Option<bool> would remove the ambiguity and let both directions be checked; nothing currently proposes that change."
        - "Issues #788/#790/#791/#792 each widened HELM_STEERING_VERBS by one entry and changed nothing else about validation: hold_recovery_orbit and pivot_to_reengage (#788), hold_combat_orbit (#790), hold_torpedo_bearing (#791), hold_artillery_position (#792). The one validate_fine_system_ai_policy(cfg, valid_channels, valid_verbs) call site for [helm_console.steering_ai] still passes &[HELM_YAW_CHANNEL] and HELM_STEERING_VERBS, so an unknown yaw verb, a yaw verb authored on another axis's channel, an unparseable guard, an undeclared param(...) or an undeclared memory(...) still fails the entity load in EntityConfig::from_toml before any live tick. What is NOT validated, deliberately, is whether a hull authoring a verb also authors the parameter set that verb's host leg requires — the host degrades to the ordinary travel arm instead (HelmPassSurface.active / pass_legs), because a partially-authored leg is a content-tuning state a designer passes through, not a load failure."
        - "DELIBERATE DIVERGENCE FROM PRD #774 US19, recorded so nobody restores the PRD's wording. US19 asks for 'unreachable states WARNED, so that failures are actionable without forbidding intentional terminal states'. The shipped check (the fixpoint reachability walk near the end of validate_policy_inner in src/entities/config.rs) returns Err — the entity fails to load — and the spec §11 has been amended to match the code rather than the other way round, because the code already draws exactly the distinction US19 cares about. A TERMINAL state (no outgoing transition) is never examined by the reachability walk and passes; only a state NOTHING CAN ENTER is rejected. So intentional terminal states are not forbidden, which was the whole concern behind the softer wording. An unenterable state cannot be an authoring choice — no runtime path reaches it, so nothing an author writes later can give it meaning — and this repository has no warning channel that fails CI, so downgrading would make the check worthless. The cost of a non-failing channel is visible in the same checker: check_policy_predicate validates param(...) and memory(...) references but NOT fact(...) names (facts are seeded host-side per system, with no registry to check against), so a mistyped fact name parses, validates, and reads false for ever."
        - "Issue #885 (8555e336) added the check this validator most conspicuously lacked: a MISSING declaration. Every validate_fine_system_ai_* call in EntityConfig::from_toml used to sit inside an `if let Some(..)` with no `else`, so there was no configuration state distinguishing 'the author forgot this system' from 'the author wants the baseline'. AiDeclarationMode::Strict is now the DEFAULT for from_toml, and ai_declaration_manifest::strict_error turns an undeclared AI-capable fine system into a load error naming each undeclared slot, the block to author, and the runtime component that would otherwise simply not be attached — so the error is that hull's worklist. The manifest is not hand-maintained: FineSystemKey is an enum matched exhaustively so a twentieth fine system cannot be added without the compiler demanding its gating, a test spawns every shipped hull through the real spawn_entity and reconciles the manifest against the components actually attached, and a source scan requires ZERO definitions or call sites of default_*_ai_config / default_*_target_selector_config so a synthesiser cannot come back."
        - "Issue #961 (reconcile) records that the strict rule binds ANY hull a world loads by template_path, INCLUDING a test/coverage-only local hull under assets/entities/test/ — assets/entities/test/rng_coverage_lancer.toml is the live example, and there is NO lenient omitted-→-Idle escape for it. A world names it by template_path, the native WasmTemplateLoader resolves it through entity_includes::resolve_from_disk, and EntityConfig::from_toml parses it — and from_toml's default is AiDeclarationMode::Strict — so include composition and strict validation apply to it exactly as to a shipped hull; tests/rng_determinism.rs spawns it every run, which would fail the load if it declared nothing. It complies the way the rule demands: it pulls the shared fragments/ai/fleet_baseline.toml through includes for its six helm axes, Shields, Comms and five target selectors, AND authors its own per-weapon bank/tube/magazine .ai blocks (a hull with weapons owes one declaration per magazine, bank and tube; the baseline carries none). AiDeclarationMode::Lenient is NOT a content escape hatch: its only callers are inline unit-test fixtures that build bare TOML in-process via from_toml_in_mode(.., Lenient) (BARE_BEHAVIOUR_HULL and kin), and nothing a world can author reaches it — so no authored hull, shipped or test-only, can omit a declaration and fall back to Idle."
        - "Issue #889 added the CADENCE check, run first: evaluate_every_ticks = 0 is rejected, because a policy that never evaluates is an `idle = true` declaration rather than a cadence. A non-integer multiple needs no check — the field is u32, so it is a TOML type error at parse. The field is now honoured at runtime by two hosts (Power, Comms response), with the mechanism generic across the rest; see ai-policy-tick-scheduler for what shipped and what remains to adopt it."
        - "Issues #890 and #891 added the two REACHABILITY rejections, which share a shape: an atom the grammar advertises but the HOST cannot evaluate is a load error rather than a permanently-false reading. src/entities/ai_flag_hosts.rs holds the per-host table and AiHost::check_guard is the one entry point the validator calls per rule guard and per transition guard. #891 rejects flag(...)/counter(...) on the sixteen hosts that pass a literal &[] instead of the world flag chain; #890 rejects history(...) on the sixteen hosts that fold no window, in a stateless policy, in any target selector, and (in world::config::parse_world) in any world trigger, trigger-action or entity `when` guard. #890 also rejects an undeclared, non-integral or zero window capacity param. Both rejections quote the offending atom back verbatim. What is still NOT checked, and is the standing cost of having no non-failing channel, is fact(...) NAMES: facts are seeded host-side per system with no registry to check against, so a mistyped fact name parses, validates and reads false for ever."
    architecture:
      kind: configuration-validator
      authority: authoritative
      reads: [ship-station-system-topology-state]
      coordinates: [fine-system-ai-policy-schema, ai-policy-expression-runtime, per-system-target-ranking-policy]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/config.rs]
      symbols: [validate_fine_system_ai_policy, validate_fine_system_ai_selector, HELM_LONGITUDINAL_CHANNEL, HELM_ACTUATE_DESIRED_TRAVEL_VERB, HELM_YAW_CHANNEL, HELM_ACTUATE_DESIRED_FACING_VERB, HELM_LATERAL_CHANNEL, HELM_ACTUATE_LATERAL_THRUST_VERB, HELM_VERTICAL_CHANNEL, HELM_ACTUATE_VERTICAL_THRUST_VERB, HELM_IMPULSE_CHANNEL, HELM_ENGAGE_IMPULSE_VERB, HELM_HOLD_COMMITTED_HEADING_VERB, HELM_HOLD_RECOVERY_ORBIT_VERB, HELM_PIVOT_TO_REENGAGE_VERB, HELM_HOLD_COMBAT_ORBIT_VERB, HELM_HOLD_TORPEDO_BEARING_VERB, HELM_HOLD_ARTILLERY_POSITION_VERB, HELM_STEERING_VERBS, HELM_BOOST_CHANNEL, HELM_ENGAGE_BOOST_VERB, PHASER_FIRE_CHANNEL, PHASER_FIRE_VERB, PHASER_BANK_CHANNELS, PHASER_BANK_VERBS, BLASTER_FIRE_CHANNEL, BLASTER_FIRE_VERB, BLASTER_BANK_CHANNELS, BLASTER_BANK_VERBS, TORPEDO_LOAD_CHANNEL, TORPEDO_LOAD_VERB, TORPEDO_LAUNCH_CHANNEL, TORPEDO_LAUNCH_VERB, TORPEDO_TUBE_CHANNELS, TORPEDO_TUBE_VERBS, TORPEDO_MAGAZINE_CHANNEL, TORPEDO_MAGAZINE_GRANT_VERB, TORPEDO_MAGAZINE_CHANNELS, TORPEDO_MAGAZINE_VERBS, SHIELD_FOCUS_CHANNEL, SHIELD_FOCUS_VERB, SHIELD_FOCUS_CHANNELS, SHIELD_FOCUS_VERBS, POWER_SET_ALLOCATION_VERB, REPAIR_SELECTOR_SOURCES, SELECTOR_SOURCE_DAMAGED_STATIONS, SELECTOR_SOURCE_CORE_BUCKET, COMMS_SELECTOR_SOURCES, SELECTOR_SOURCE_HAIL_OBJECTIVES, SELECTOR_SOURCE_COMMS_CONTACTS, COMMS_RESPOND_CHANNEL, COMMS_RESPOND_VERB, COMMS_RESPOND_CHANNELS, COMMS_RESPOND_VERBS]
      tests: [cargo test]

  - component: legacy-ai-doctrine-retirement
    core:
      status: proposed
      confidence: confirmed
      title: Legacy AI Doctrine Retirement
      summary: Converts every existing NPC and Backfill AI operator to inline fine-system policy, then removes top-level behaviour doctrine parsing and monolithic direct-write AI paths without retaining a permanent compatibility evaluator.
      rationale:
        - "[ai] Combat Test behaviour must exercise the same authoring model as all other AI rather than becoming a scenario-specific code path."
        - Maintaining two AI policy formats would split authority and make behaviour difficult to audit.
        - "Issue #779 migrated the Helm Engines and Steering travel axes as the first fine systems whose ACTUATION DECISION flows through an authored policy verb (helm-engines-ai-operator / helm-steering-ai-operator). The continuous-value geometry in plan_helm_travel (arrival/avoidance/arc-bearing) is deliberately NOT removed here — the mode verb only decides whether to actuate; the planner remains the single source of the continuous target. Retiring the hardcoded plan_helm_travel decision branch entirely is the coordinated tail #794, so this component stays proposed."
        - "Issue #780 migrated the four secondary fine actuators (lateral/vertical/impulse/boost) onto the same authored-policy spine. As with #779 the host-side geometry/capability is deliberately retained: the mode verb only gates whether the actuator acts, while the shared HazardAssessment, VerticalMovementMode ceiling, decide_impulse geometry, and doctrine use_impulse remain host-side. This component stays proposed until the coordinated #794 tail removes the residual hardcoded decision branches."
        - "Issue #783 moved the Shields Backfill focus behaviour onto the authored-policy spine (shields-recent-damage-ai). As with #779/#780 the host-side decision kernel is deliberately RETAINED: the value-less focus_shield_arc verb only gates whether the system acts, while tick_shield_focus_ai (damage-concentration primary, health-imbalance fallback) remains the host-side arc argmax and the authored windows/thresholds move into the policy param map. This component stays proposed until the coordinated #794 tail removes the residual hardcoded decision branches."
        - "Issue #784 migrated Power allocation — another Backfill operator — fully onto the authored-policy spine, RETIRING the bespoke stateful engine (PowerRuleTrigger + EngageState + ShipPowerAiState + PowerAiConfigResource + tick_power_rule) outright rather than retaining a host-side kernel (unlike shields/helm): the allocation decision is wholly data-authored per power-group channel, so there is no residual hardcoded decision branch for Power. This component nonetheless stays proposed until the coordinated #794 tail removes the remaining hardcoded helm/shields branches and the top-level behaviour-doctrine parsing."
        - "Issue #785 migrated Repair team dispatch — the last Backfill operator with a bespoke priority comparator — fully onto the authored-ranking spine, RETIRING the hardcoded (tier desc, deficit desc) sort outright as #784 did for Power rather than retaining a host-side kernel as #779/#780/#783 did. Repair uses the #776 target selector rather than the #775 channel/verb policy because its candidate set is variable. No residual hardcoded decision branch remains for Repair: the only host-side logic left is candidate ASSEMBLY (which stations coordination reported, and their observable damage aggregates) and the shared resolve_repair_target fine-system resolution that human dispatches already run. This component nonetheless stays proposed until the coordinated #794 tail removes the remaining hardcoded helm/shields branches and the top-level behaviour-doctrine parsing."
        - "Issue #786 migrated Comms — the LAST Group A per-system Backfill policy — fully onto the authored spine, retiring TWO legacy paths outright in the #784/#785 no-residual-kernel style rather than the #779/#780/#783 retained-kernel style. (1) The hardcoded hail filter+find_map argmax is replaced by the authored selector. (2) The handle_comms_channel2 record_response(id, 0) stub — an admission-and-router-bypassing direct inbox write — is deleted, leaving that system inject-only and no longer reading ShipSystemControlSources; the AI answer is now an ordinary admitted RespondToMessage for the unchanged handle_respond_to_message. Comms also retires the LAST piece of AI-OWNED comms state: CommsAiHailState.last_hailed is deleted and its anti-respam job moved to CommsRuntime.open_hails — shared authoritative state that handle_hail writes for human and AI hails alike and handle_clear_comms retires — read back as candidate_fact(has_open_hail_thread). It stays a latch rather than a per-tick inbox derivation because an inbox derivation does not TERMINATE (a hail whose on_hailed template is absent or already fired seats nothing, so the guard never arms and the directive re-emits every tick). The latch re-arms on CANDIDACY loss (operate_comms_ai retires an entry once no Hail directive names the target or it leaves range) rather than only on ClearComms, because ClearComms is a human console action with no scripted path and an unmanned ship would otherwise drop a second, later Hail directive forever; termination survives because a standing directive's target stays a candidate every tick. See the comms.yaml comms-ai-operator rationale for the full re-arm accounting and the provenance split against has_unread_from_sender. Nothing per-AI survives, so nothing needs resetting on an AI/human control flip. No residual hardcoded decision branch remains for Comms: the only host-side logic left is candidate ASSEMBLY and the unchanged resolve_hail_target name resolution. This component nonetheless stays proposed until the coordinated #794 tail removes the remaining hardcoded helm/shields branches and the top-level behaviour-doctrine parsing."
        - "Issue #885 (411ace37, 5c0e6b0e, 8555e336) CLOSED PRD #774 US7 — the authoring migration — and this component STAYS PROPOSED anyway, because US7 is not what it tracks. What #885 delivered: AiDeclarationMode::Strict is the default for EntityConfig::from_toml, a missing declaration on an AI-capable fine system is a load error, and all nineteen synthesisers (fourteen default_*_ai_config plus five default_*_target_selector_config) are DELETED along with every call site. No declaration now means no component, which means that system takes no action — one rule instead of nineteen quiet defaults. The undeclared-slot ledger in src/entities/ai_declaration_manifest.rs reads zero, with a source scan that fails if a synthesiser is ever redefined or called."
        - "What #885 did NOT do, which is precisely this component's remaining scope: (1) it did not remove top-level [[behaviour.doctrine]] parsing — the doctrine list is still authored, still parsed, and is still the argument plan_helm_travel ranks; and (2) it did not retire the three retained host-side decision kernels below. The exceptions block is unchanged and every one of its six removal conditions still reads FALSE against the tree at b208d9aa: plan_helm_travel keeps a production caller in src/ship/helm_ai.rs (the ordinary travel arm helm_motion_planner still selects for any AI-flown hull with no complete authored leg set), decide_impulse and DoctrineObjective::effective_use_impulse keep production callers in the same file, and tick_shield_focus_ai keeps one in src/console_ai/server.rs — while the shield-focus verb is still value-less, so WHICH arc to focus is still a host argmax. The coordinated tail is still #794."
        - "The retained kernels are a smaller share of the decision surface than they were, and that is worth stating so 'proposed' is not read as no-progress. Eleven of the thirteen Group A hosts now carry NO residual kernel at all (Captain, the four secondary helm actuators' gates, the weapon banks, the torpedo tubes and magazine, Power, Repair, Comms hail and Comms response); three do (Helm travel, Helm impulse, Shields focus). Separately #887 removed the last direct authoritative-target write from the AI side — see ai-command-symmetry-migration in architecture/npc-ai-factions.yaml, which moved to partially-implemented on that basis while this component did not, because the two track different things: symmetry of the COMMAND PATH versus retirement of the host-side DECISION."
        - "#794 CLOSE-OUT VERIFICATION (2026-08-03, tree at bb3db6a5, after #878/#889/#891/#893 landed): each of the six removal_condition entries below was re-checked against a fresh grep of src/ for non-test callers, and every one still reads FALSE — nothing has changed since the b208d9aa note above. `plan_helm_travel` (src/ai/core.rs) is still called from `src/ship/helm_ai.rs:686`, the ordinary travel arm inside `helm_motion_planner`. `decide_impulse` (src/ai/core.rs:136) is still called from `src/ship/helm_ai.rs:4186`, and `DoctrineObjective::effective_use_impulse` (src/entities/config.rs:85) still gates that call from `src/ship/helm_ai.rs:4180`. `tick_shield_focus_ai` (src/console_ai/core.rs:394) is still called from `src/console_ai/server.rs:449`. All three kernels therefore STAY; this component stays `proposed` honestly rather than being force-closed. What #794 DID retire in the same pass is a piece of scope the removal conditions never covered: the editor's own legacy-FSM authoring surface (`editor/behaviour-editor.js` initial_state/state[]/transition[] methods, and the matching form UI in `editor/entity-behaviour-view.js`), which predated #572 and had no Rust-side counterpart to keep it honest — `BehaviourConfig` is `#[serde(deny_unknown_fields)]` and carries no such fields (src/entities/entity_override.rs's retired-FSM note), so saving through that UI could write a TOML block current entity load already rejects. That is a documentation-and-editor-hygiene fix, not a removal_condition; it does not change any of the six truth values above. See the GitHub #794 close-out comment for the full AC-by-AC accounting."
    architecture:
      kind: migration-policy
      authority: authoritative
      reads: [npc-ai-controller-state, system-control-source-state]
      coordinates:
        - fine-system-ai-policy-runtime
        - per-system-ai-operator-suite
        - ai-command-symmetry-migration
      runs_in: [host-browser-runtime]
    exceptions:
      - rule: every-fine-system-decision-is-authored-policy-not-host-code
        scope:
          - helm-engines-ai-operator
          - helm-steering-ai-operator
        rationale: >-
          Issue #779 moved the ACTUATION decision onto the authored spine, but not the decision
          it gates. The longitudinal and yaw verbs are value-less MODE verbs — resolve_channel
          decides only WHETHER to actuate this tick — while the continuous target itself is
          still computed by the pure plan_helm_travel (src/ai/core.rs): it ranks the scored
          objective pool, resolves the winning directive, and returns the (thrust, steering)
          pair through helm_motion_planner's ordinary travel arm. Its arrival ramp, avoidance
          bend and arc bearing are geometry an authored guard cannot currently express, and its
          doctrine argument is the legacy [[behaviour.doctrine]] data this component exists to
          retire. It is retained rather than reproduced because #883's authored leg verbs cover
          only the legs a hull explicitly authors: an AI-flown hull with no complete leg set —
          every Backfill player ship, and every NPC hull that has not been migrated — falls back
          to this arm, and deleting it before those hulls author their own travel would leave
          them coasting at zero into a fight.
        temporary: true
        removal_condition:
          - helm-motion-planner-never-selects-the-plan-helm-travel-arm-for-an-ai-flown-hull
          - plan-helm-travel-has-no-non-test-caller
        approval_status: accepted

      - rule: every-fine-system-decision-is-authored-policy-not-host-code
        scope:
          - helm-impulse-ai-operator
        rationale: >-
          Issue #780's engage_impulse verb is an authored PERMIT gate layered on top of a
          host-side decision, not a replacement for it. The engage-versus-cancel call is still
          decide_impulse's geometry (src/ai/core.rs) over range, bearing and ImpulsePhase, and
          the authored doctrine use_impulse veto still sits in front of that, resolved through
          DoctrineObjective::effective_use_impulse — which DEFAULTS TO TRUE for every non-Patrol
          directive. The default is why the veto cannot be treated as already-dead content: it
          is live on every hull whose scenario replaces the doctrine list, which is all of them.
          The removal condition is therefore written against the code path rather than against
          authored data. A grep for use_impulse under assets/ reads as satisfied TODAY — every
          occurrence is comment prose in ship_harrow_warhawk.toml and
          probe_artillery_standoff.toml explaining why the lever was deliberately NOT used —
          while the veto path stays fully live through that default. Issue #792 is the standing
          demonstration that the decision matters: the autopilot hard-overrides commanded
          throttle, so a hull holding station inside impulse_engage_distance is flown through
          its own gun line until its fine-system policy declares idle = true.
        temporary: true
        removal_condition:
          - impulse-engage-and-cancel-geometry-is-readable-as-seeded-facts-in-authored-guards
          - decide-impulse-and-effective-use-impulse-have-no-non-test-caller
        approval_status: accepted

      - rule: every-fine-system-decision-is-authored-policy-not-host-code
        scope:
          - shields-recent-damage-ai
        rationale: >-
          Issue #783 converted the Shields Backfill focus onto the authored spine while keeping
          its ranking kernel. focus_shield_arc is a value-less verb — a gate deciding act versus
          hold — and WHICH of the four arcs to focus is still tick_shield_focus_ai's argmax
          (src/console_ai/core.rs:394): damage concentration over the authored window primary,
          health imbalance fallback, clear otherwise. The authored windows and thresholds did
          move into the policy param map and are read host-side into the kernel input, so the
          tuning is data; the RANKING is not. Shields stayed on the channel/verb model rather
          than the #776 target selector because its arcs are a fixed 4-set of in-ship indices
          rather than UUID entities, so there is no candidate union to author — which is also
          why retiring this kernel needs the channel to carry the arc, not a new selector host.
        temporary: true
        removal_condition:
          - the-shield-focus-arc-is-carried-by-authored-content-not-a-host-argmax
          - tick-shield-focus-ai-has-no-non-test-caller
        approval_status: accepted
    evidence:
      - kind: test
        reference: combat_test_develops_two_sided_combat_and_resolves
        summary: >-
          A seeded headless combat_test run (seed 9, deterministic, 400 sim-second budget)
          reaches two-sided non-zero damage, at least one kill, and a Victory/Defeat outcome —
          the deterministic home for "Combat Test loads and engages", which the Playwright smoke
          suite deliberately does not assert.

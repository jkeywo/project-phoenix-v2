  - component: client-network-interface
    core:
      status: implemented
      confidence: confirmed
      title: Client Network Interface
      summary: PeerJS/WebRTC client transport for console messages and state snapshots.
      rationale:
        - "[ai] Narrowed in issue #1112, which also retired PeerJS itself — the title, summary and evidence[0].summary above are the human's and stand as written pending ratification, but all three now describe this entity's ORIGINAL, wider scope rather than its current one. It used to describe \"the PeerJS/WebRTC client transport\", which duplicated peer-transport-bridge in sessions-replication.yaml — two entities claiming the same thing, which WRITING_PASM §2.6 forbids. The transport now has one owner, rendezvous-transport-bridge, and this slice keeps only the part it actually needed: where a console action turns into a wire envelope. A ratified rename would retitle this \"Client Command Gateway\", rewrite the summary to: \"The phone's outbound command boundary: it builds every ControlSystem envelope and hands it to the live link. It does NOT own the transport — rendezvous-transport-bridge does; this entity resolves that bridge and calls it.\", and rewrite evidence[0].summary's closing clause from \"the live ConnectionManager singleton\" to \"the page's live link\" — tests/client/command-gateway.test.js no longer mentions ConnectionManager at all. The id is unchanged because four other slices reference it; only the claim it makes has narrowed."
    architecture:
      kind: adapter
      authority: non-authoritative
      runs_in:
        - phone-browser-runtime
      sends:
        - dispatch-repair-team-command
    implementation:
      status: observed
      paths:
        - client.html
        - gui/command-gateway.js
      symbols:
        - sendControlSystem
        - controlSystemEnvelope
      tests:
        - tests/client/command-gateway.test.js
    evidence:
      - kind: test
        reference: tests/client/command-gateway.test.js
        summary: >-
          gui/command-gateway.js is the explicit client command gateway: it
          builds every ControlSystem envelope and resolves the transport, either
          an injected send or the live ConnectionManager singleton.

  - component: repair-console-interface
    core:
      status: partially-implemented
      confidence: confirmed
      title: Repair Console Interface
      summary: Player-facing repair console for aggregate hull, core damage, and on-site team repair work.
      rationale:
        - Engineering should not see exact non-core damage details before a team arrives on site.
        - Engineering should still be able to act proactively based on aggregate cues and crew coordination.
        - "[ai] The roster asks WHICH TEAM first (issue #1384). A team card is a summary — name, status, progress — until the seat selects it, and only then does it open onto that team's own verbs: destinations for an idle team, the on-site systems for a team already working. Before this every idle team rendered its whole destination row at once, under a separate always-visible damaged list, so a three-team hull spent most of a phone column on controls for teams nobody was thinking about."
        - "[ai] Only a card with something behind it is a toggle. A team with no verb to offer — a returning team, an idle slot already committed to the field — renders its summary as a disabled readout with no caret, so tapping it cannot rotate a caret, paint a selected border or report an expanded region that stays hidden. A control that does nothing is worse than no control, and that includes a control whose only job is to open an empty box."
        - "[ai] The damaged-systems list is not a panel of its own any more; it belongs to the card whose team can act on it. It was already the host's per-SYSTEM on-site projection (core detail plus whatever a team is standing on), so re-homing it changed which card draws it, not what the seat may see. Nothing filters it per team: the console cannot honestly say which on-site team owns which row, and `prioritisable` remains the host's sole enablement verdict."
        - "[ai] Which card is open is client-local presentation state, not a semantic action. It steers no command and the host has no opinion about it, so routing it through the wire would only make opening a card cost a round trip. It survives state pushes and is dropped when the team it names leaves the roster."
        - "[ai] The field destination is one destination among the stations (issue #1386): it sends the same DispatchRepairTeam they do, naming THIS card’s team and the External target. It was the fieldless external-dispatch command until then, because no commitment model existed that could hold a named team abroad; the card was already asking WHICH TEAM for every other destination, so the field row was the one place a seat chose a destination and got somebody else’s team. It is still never a recall: while ANOTHER team holds the ship’s one claim the row is a disabled readout carrying that refusal’s own strings.csv text, so the crew are told the thing they have to do — recall the other team — instead of watching a live-looking button be refused."
        - "[ai] Issue #1385 gave the internal teams their own RECALL, and it is the card’s verb for a team that is OUT: travelling or on site. It is a separate command from the external recall beside it and NAMES its team, because a hull can have every internal team out on a different job at once while it sends only one abroad. It is offered off the authoritative status alone — the owner still decides whether there is anything to recall and answers on the correlated feedback seam — and a returning team is not offered it at all, which is the one status that now has no card body."
        - "[ai] Recall is a return TRIP, not a teleport, so the card keeps showing the team on its way home rather than snapping it to standby. That is the same meaning a re-dispatch to a team’s own current system has always had, and it keeps travel time the real cost issue #737 made it: an early recall is cheap because the walk back is only as long as the walk out so far."
        - "[ai] An idle card names the field destination generically. The host populates the target name only once a team is working abroad, which is never the moment a seat is choosing where to send one, so the row reads as the field target rather than inventing a name the projection does not carry."
        - "[ai] ABROAD is a CLIENT-DERIVED status (issue #1386). The wire slot of the team abroad reads Idle — it never walked anywhere on this hull — so the card is derived from external_dispatch_team_idx on the repair blackboard, and the wire status is checked as well as the index for the same reason the host’s own is_committed_to_operation checks the slot: a stale claim naming a team since given an internal job must not paint that team ABROAD while it walks. The card shows the target it is working and the TARGET’S OWN condition track as its bar, because a team abroad is already there and has no travel or repair progress of its own worth drawing; a target with no condition track leaves the bar empty rather than inventing a number."
        - "[ai] The abroad card carries the SAME RECALL as a team out on an internal job (issue #1386), because there is now one recall verb for both. Before it, an externally committed slot was the second status with no card body at all — a disabled readout saying its slot was spoken for — which was the honest rendering of a commitment that named nobody. A returning team is the only status left with no body."
    architecture:
      kind: client-interface
      authority: non-authoritative
      owns:
        - repair-ui-state
      reads:
        - engineering-aggregate-hull-state
        - core-damage-detail-state
        - onsite-repair-detail-state
        - repair-team-state
      writes:
        - repair-ui-state
      sends:
        - dispatch-repair-team-command
        - recall-repair-team-command
        - onsite-repair-priority-command
      depends_on:
        - client-network-interface
      must_not_depend_on:
        - host-damage-state
      runs_in:
        - phone-browser-runtime
    implementation:
      status: observed
      paths:
        - gui/battleship/repair.html
        - gui/cruiser/engineering.html
        - gui/destroyer/engineering.html
        - gui/components/ph-repair-teams.js
        - gui/stations/repair-console.js
        - gui/stations/engineering-console.js
        - gui/courier/captain.console.js
        - gui/console-state.js
        - gui/repair-dispatch.js
        - gui/repair-button.js
      symbols:
        - buildRepairConsoleState
        - repairCoreAndTargets
        - dispatchRepairTeam
        - PhRepairTeams
        - makeRepairRender
        - makeEngineeringRender
      tests:
        - tests/client/console-state.test.js
        - tests/client/repair-button.test.js
        - tests/client/repair-dispatch.test.js
        - tests/client/ph-repair-teams.test.js
        - tests/client/repair-console.test.js
        - tests/client/engineering-console.test.js
        - tests/smoke/repair-console.spec.js
    evidence:
      - kind: test
        reference: tests/client/repair-dispatch.test.js
        summary: >-
          gui/repair-dispatch.js imports gui/command-gateway.js at module scope,
          so the console's dependency on the client network interface is an
          observed code edge; the dispatch_repair_team console action is routed
          through it.


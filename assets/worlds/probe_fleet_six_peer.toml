# Test-only six-peer endurance world for issue #1519.
#
# Four authored player hulls give slots 1-4 one ship each. Slots 5-6 are
# stationless GM simulation peers: they run the same complete world and enter
# the same lockstep barrier, but consume no GameStart ship. The hostile is an
# ordinary NPC on every peer; nobody owns or transmits its AI decisions.
#
# There is deliberately no ending condition. The ignored endurance workload in
# tests/lockstep_six_peer.rs can therefore run for an hour without changing the
# ending rules of combat_test, Falling Skyway, or another reference scenario.

[global]
seed = 1519
ai_helm_tick_hz = 30.0
command_delay_ticks = 2

[player_spawn]
position = [0.0, 0.0, 0.0]

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-1"
transform = { position = [-90.0, 0.0, -30.0] }
spawn_on = "game_start"

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-2"
transform = { position = [-30.0, 0.0, -30.0] }
spawn_on = "game_start"

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-3"
transform = { position = [30.0, 0.0, -30.0] }
spawn_on = "game_start"

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-4"
transform = { position = [90.0, 0.0, -30.0] }
spawn_on = "game_start"

[script]
setup = """
on_world_loaded("on_load");
on_timer(0, "on_spawn");

fn on_load(ctx) {
    ctx.effects.add_faction_enemy("Harrow", "Alliance");
    ctx.effects.add_faction_enemy("Alliance", "Harrow");
}

fn on_spawn(ctx) {
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/alliance_cruiser.toml",
        name: "fleet_probe_hostile",
        position: [0, 0, 80],
        overrides: #{ faction: "cccccccc-3333-4333-8333-cccccccccccc" }
    });
}
"""

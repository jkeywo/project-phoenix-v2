      symbols: [process_disconnect_with_stations, apply_rating, apply_host_loss_backfill, PendingHostLoss, agreed_loss_tick]
      tests: [cargo test, tests/smoke/reconnect.spec.js, tests/lockstep_backfill.rs, crates/phoenix-simulation/src/lobby/session_tests.rs, crates/phoenix-simulation/src/lobby/server_tests.rs, crates/phoenix-simulation/src/lockstep/host_loss_tests.rs, crates/phoenix-simulation/src/lockstep/tests.rs]

  - component: admitted-command-router
    core:
      status: implemented
      confidence: confirmed
      title: Admitted Command Router
      summary: Load-time registry naming each admitted System consumer, its address domain and optional terminal-feedback promise; Admission checks a unique installed feedback owner before accepting correlations, while the end-of-frame lint warns for unrouted uncorrelated commands.
      rationale:
        - "One table answers which module handles a payload (#833). Routing itself already landed across #824–#832: admission drains the inbound ControlSystem stream once per tick into the owning ship's per-entity AdmittedCommands, and every consumer reads only its own slice via AdmittedCommands::for_target. There is no central SystemId→module dispatch table (system_target_for_payload_type was deleted in #822) — a runtime dispatcher would re-introduce the chokepoint the per-entity design removed and collapse the consumer scheduling (appliers run in different SimSets: Input/Physics/Modifiers/Broadcast)."
        - "[ai] So the router is a registration seam, not a dispatcher: each console/ship plugin registers its consumer(s) at build with one line (RegisterAdmittedConsumer::register_admitted_consumer), naming the authoritative System kind plus the address domain the real reader accepts. Canonical fixed-id readers use Exact, generated bank/tube/shield-arc families use Prefix, and Kind is reserved for a consumer such as Dock that carries and reads the arbitrary authored instance id. The undeclared host-only God Mode capability retains its own exact-target registration. An admitted command whose resolved instance falls outside that domain is warned (pwarn!, LogCat::Admit) rather than silently dropped. The lint keys on the registry (no consumer), not on whether state changed, and mutates nothing — no handler or schedule moved."
        - "[ai] ConsumerRegistration retains the matcher and optional feedback payload discriminants plus a compatibility address rule: exact/generated matcher spelling, declared kind or canonical alias, or the restricted lowercase Shield arc suffix. Equal metadata is idempotent; conflicting metadata for one matcher fails app construction. Explicit correlations require exactly one installed owner before queue or log insertion. The GM journal derives Pending and puppet delivery uses the same lookup, retains uncorrelated continuous actions with installed owners and refuses missing or ambiguous ownership. A shared envelope builder and admitted-command helper supply reliable origin-targeted feedback through existing message/outbox adapters; owning consumers still decide outcomes on their unchanged schedules."
        - "Issue #1253 derives completeness from SystemKindDescriptor.accepts_admitted_commands and every resolved top-level shipped hull. The test builds consumer claims through add_simulation_plugins_with plus WorldPlugin — the production registration entry points — proves every commandable descriptor has a declared consumer domain, then proves every shipped instance lies inside it. Missing commandable consumers and noncanonical fixed-target instances fail while passive descriptors remain valid."
        - "[ai] A complete owning capability may retain exact KindPayload registrations and explicitly mark their ConsumerRegistration with_capability_ownership. This load-time metadata establishes machinery coverage and GM availability for authored instances of that kind; it never widens per-payload routing, feedback or command authority. GM Station command queueing and delayed delivery check the exact command route when no terminal-feedback owner applies, while capability inventory checks machinery coverage. The actual Concealment, Transit, Jamming, Illumination, Craft Bay, Identity Emitter and Signal Protection owners make this declaration beside their consumers. Shared stock, fitting, reference and other supplementary payload handlers do not establish machinery coverage. Duplicate matcher registrations must agree on both feedback and capability ownership."
        - "Issue #846 retired the last weapons FIRE/LOAD commands outside admission: FirePhaser, FireTorpedo, LoadTube, and UnloadTube now travel as SystemControlPayloads through the ControlSystem envelope, targeting phaser-{bank} or torpedo-tube-{id} SystemIds. The InterSystemQueue remains a separate inter-system bus."
    architecture:
      kind: registry
      authority: authoritative
      reads: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/command_admission/router.rs, crates/phoenix-sim-gameplay/src/command_admission/feedback.rs, crates/phoenix-sim-gameplay/src/ship/system_registry.rs, crates/phoenix-simulation/src/server_app/registration.rs, crates/phoenix-simulation/src/world/server/mod.rs]
      symbols: [AdmittedConsumerRegistry, ConsumerMatcher, ConsumerRegistration, FeedbackAddress, FeedbackSupport, action_feedback, admitted_action_feedback, RegisterAdmittedConsumer, warn_unrouted_admitted_commands, unrouted_command_targets, unrouted_commandable_systems]
      tests: [cargo test, crates/phoenix-simulation/src/command_admission/router_tests.rs, crates/phoenix-simulation/src/command_admission/tests.rs, crates/phoenix-simulation/src/gm/actions/action_tests.rs, crates/phoenix-simulation/src/gm/operations/puppet_tests.rs, crates/phoenix-simulation/src/gm/observation/quiet_tests.rs, crates/phoenix-simulation/src/ship/system_registry_tests.rs, crates/phoenix-simulation/src/server_app/registration_physics_boundary_tests.rs]
    evidence:
      - kind: test
        reference: every_commandable_shipped_system_has_a_production_consumer
        summary: >-
          Resolves every top-level shipped hull, derives its commandable System
          instances from authoritative descriptors, builds the registry through
          production composition, and requires every instance to be routed;
          named coverage includes Command, Tractor, Dock, Umbilical, weapon
          banks, torpedo tubes and shield arcs.
      - kind: test
        reference: missing_commandable_consumer_is_detected_but_passive_kind_is_ignored
        summary: >-
          A synthetic commandable descriptor without a consumer is reported,
          while a passive descriptor with the same absence creates no failure.
      - kind: test
        reference: fixed_target_domain_rejects_noncanonical_instance_but_dock_accepts_arbitrary_id
        summary: >-

# The Falling Skyway scenario as a causal design model — TARGET design per
# PRD #1129 (25-minute interleaved mission), ratified in the 2026-08-20
# grill session:
#
#   - clocks are ORDER-ONLY: no per-deadline numeric bounds; the requires
#     chains carry the order (checked against authored dues by
#     design-content.deadline-order) and one envelope bound holds the whole
#     mission to 20-30 minutes;
#   - terminal failure is WORLD-DRIVEN only: no checkpoint logic. The opening
#     terminal is RATIFIED TARGET DESIGN for #1138, not current runtime: unless
#     the crew sends the scan-backed unsafe response, an uncontrolled Hauler
#     Lark collides in the corridor and causes terminal defeat. Lark narrates
#     its intent; the first hail arrives 30 seconds before `skyway_survey_due`,
#     a second generic authoritative `critical` hail lands at the deadline, and
#     the crew then have a final 20-second response window. The storm and
#     collapse own the later terminal pressure;
#   - the good ending is the clean-ledger benchmark, modelled as a
#     consequence plus an invariant proving even a benchmark run lifts only
#     two of three claims;
#   - pacing is GLOBAL INTENSITY ERAS (threads live in the gate graph).
#
# The world file stays authoritative and now authors the ratified 20-30 minute
# arc, closing its allocation window at the envelope's 1800-second ceiling.
# Entities are origin: ai, awaiting ratification via `pasm review`.
entities:
  - scenario_model: falling-skyway
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Falling Skyway Scenario Model
      summary: >
        [ai] Closed-world design model for the first Thin Margin scenario,
        re-authored to PRD #1129: eight interleaved threads (survey, strike,
        storm, rescue, stabilise, window, traffic, evidence) on their own
        triggers, passively startable from t=0, escalating but never closing
        a crew-initiated path.
    game_design:
      world_file: assets/worlds/falling_skyway.toml

  # ── Roles and verbs ─────────────────────────────────────────────────────────
  - role: fs-captain
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Captain (Falling Skyway)
      summary: "[ai] Owns the calls that trade people against time: the strike vote, the force order and its warning, and the window triage."
    game_design:
      player_verbs: [fs-call-the-vote, fs-order-the-clearance, fs-book-the-window]
      responsibilities:
        - decide how the strike ends
        - decide who receives scarce passage
  - role: fs-tactical
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Tactical (Falling Skyway)
      summary: "[ai] Carries both negotiation channels on this hull's comms overlay; the strike stews while the survey is still in progress."
    game_design:
      player_verbs: [fs-settle-the-strike]
  - role: fs-operations
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Operations (Falling Skyway)
      summary: "[ai] Runs the external operations the storm and the collapse demand: tow, stabilise, transfer."
    game_design:
      player_verbs: [fs-order-the-tow, fs-order-the-stabilise]
  - role: fs-science
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Science (Falling Skyway)
      summary: "[ai] Reads the place: the three survey scans, the scan-vs-record diff, the rung."
    game_design:
      player_verbs: [fs-compile-the-survey, fs-file-the-evidence]
  - role: fs-navigation
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Navigation (Falling Skyway)
      summary: "[ai] Gives one shelter order to each endangered civilian before band one; the authored shelter route then clears all three bands. Nobody should die in the storm without a human (or an AI emitter) at this seat."
    game_design:
      player_verbs: [fs-order-the-traffic]

  - verb: fs-compile-the-survey
    core: {status: proposed, confidence: provisional, origin: ai, title: Compile the Survey, summary: "[ai] Scan all three published structures (skyhook, depot A, depot B) and report to Control on the comms channel; the three scan.<id>.taken flags gate the report pickup, so a partial survey cannot file a full one."}
    game_design:
      architecture_links: [scenario-script-host-seam]
      owner_role: fs-science
      produces_facts: [scan-skyhook-taken, scan-depot-a-taken, scan-depot-b-taken, survey-reported]
  - verb: fs-settle-the-strike
    core: {status: proposed, confidence: provisional, origin: ai, title: Settle the Strike, summary: "[ai] Negotiate the committee's two-of-three ground; both promises land on the commitments ledger and stay open. Timers harden the tree but never close this path."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-tactical
      produces_facts: [strike-settled]
  - verb: fs-call-the-vote
    core: {status: proposed, confidence: provisional, origin: ai, title: Call the Vote, summary: "[ai] Close the negotiation. Gated on ground held; the evidence path is the better close, and the escalation keeps the first-pick accident from being a good ending."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      produces_facts: [strike-settled]
  - verb: fs-order-the-clearance
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Order the Clearance
      summary: "[ai] Have Havelock clear the picket. Faster than talking, and it costs people; ten minutes' warning is the captain's lever over how many."
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      protected: true
      must_not_be: [resolved-by-ai-backfill-or-automation]
      on_success: [fs-worker-casualties]
  - verb: fs-order-the-tow
    core: {status: proposed, confidence: provisional, origin: ai, title: Order the Tow, summary: "[ai] Tow the stricken Lyra clear of the lane before the second band arrives."}
    game_design:
      architecture_links: [tractor-beam-coupler]
      owner_role: fs-operations
      produces_facts: [lyra-under-control]
  - verb: fs-order-the-stabilise
    core: {status: proposed, confidence: provisional, origin: ai, title: Order the Stabilise, summary: "[ai] Stabilise the head at any of the three warnings — including the last."}
    game_design:
      architecture_links: [tractor-beam-coupler]
      owner_role: fs-operations
      produces_facts: [skyhook-stabilised]
  - verb: fs-order-the-traffic
    core: {status: proposed, confidence: provisional, origin: ai, title: Order the Traffic, summary: "[ai] Issue one authored shelter diversion to each endangered craft before band one. A compliant order lands inside the forecast window and the shelter route clears that craft from all three bands."}
    game_design:
      architecture_links: [civilian-traffic-adapter, scenario-script-host-seam]
      owner_role: fs-navigation
      produces_facts: [traffic-ordered-clear]
  - verb: fs-file-the-evidence
    core: {status: proposed, confidence: provisional, origin: ai, title: File the Evidence, summary: "[ai] The scan-vs-record diff plus the rigger's corroboration, onto Control's record. Opens only for a crew who settled the strike by talking and read the rung."}
    game_design:
      architecture_links: [scenario-script-host-seam]
      owner_role: fs-science
      produces_facts: [evidence-filed]
  - verb: fs-book-the-window
    core: {status: proposed, confidence: provisional, origin: ai, title: Book the Window, summary: "[ai] Allocate the computed lift among the three claims. There is no state of the world in which all three fit."}
    game_design:
      architecture_links: [comms-dialogue-controller]
      owner_role: fs-captain
      protected: true
      must_not_be: [resolved-by-ai-backfill-or-automation]

  # ── Opening thread: the survey is the crew's work ──────────────────────────
  - gate: fs-tether-slip
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Tether Slips
      summary: >
        [ai] The head loses six condition points, under the authored 45% lift
        line — the lift-capable flag drops and the triage priority names
        itself. Scripted, not preventable; the opening beat every thread
        reads from.
    game_design:
      self_resolving: true
      deadline_id: tether_slip
      on_failure: [fs-head-uncertified]
  - gate: fs-survey-thread
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Survey Falls Due
      summary: >
        [ai] The survey is crew work: scan the skyhook and both ladder depots,
        then file the report through Control's comms target. All three latched
        scan flags gate the report pickup, so a partial survey cannot pass.
        Whatever is unreported when the clock lands fails loudly and Control
        proceeds on the falsified record; early work is remembered in the flag
        store and auto-resolves the objective when it posts.
    game_design:
      requires_player_action: [fs-compile-the-survey]
      deadline_id: skyway_survey_due
      requires: [fs-tether-slip]
      on_failure: [fs-survey-unfiled]

  # ── Strike thread: stews mid-survey, on its own trigger ────────────────────
  - gate: fs-strike-thread
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Strike Stews
      summary: >
        [ai] Passively startable from t=0, opening while the survey is still
        in progress. Escalation hardens the committee's tree on its timers
        (frustrated committee, costlier options) but never closes the
        talking path.
    game_design:
      requires_player_action: [fs-settle-the-strike, fs-call-the-vote]
      on_success: [fs-strike-settled]
      on_failure: [fs-strike-hardens]

  # ── Storm thread: arrives whatever the crew decided ────────────────────────
  - gate: fs-storm-front
    core: {status: proposed, confidence: provisional, origin: ai, title: Control's Forecast Lands, summary: "[ai] The forecast opens the crew's traffic-clearance and Lyra work mid-negotiation. It orders nobody and waits for no strike or act flag; the weather keeps its own clock."}
    game_design:
      self_resolving: true
      deadline_id: storm_front_due
      on_failure: [fs-traffic-clearance-opens]
  - gate: fs-storm-band-one
    core: {status: proposed, confidence: provisional, origin: ai, title: First Band, summary: "[ai] The forecast-to-first-band gap is arithmetic, not generosity: sized from hauler speed, lane length and the authored acknowledge-and-decide delay, and it scales with the clock."}
    game_design:
      self_resolving: true
      deadline_id: storm_band_one_due
      on_failure: [fs-storm-exposure]
  - gate: fs-storm-band-two
    core: {status: proposed, confidence: provisional, origin: ai, title: Second Band, summary: "[ai] Over the upper gate — the band the Lyra must be clear of."}
    game_design:
      self_resolving: true
      deadline_id: storm_band_two_due
      requires: [fs-storm-band-one]
      on_failure: [fs-storm-exposure]
  - gate: fs-storm-band-three
    core: {status: proposed, confidence: provisional, origin: ai, title: Third Band, summary: "[ai] Over the head itself."}
    game_design:
      self_resolving: true
      deadline_id: storm_band_three_due
      requires: [fs-storm-band-two]
      on_failure: [fs-storm-exposure]
  - gate: fs-storm-passes
    core: {status: proposed, confidence: provisional, origin: ai, title: The Storm Passes, summary: "[ai] The corridor is clear and traffic goes back on the lane; the back half opens on this flag."}
    game_design:
      self_resolving: true
      deadline_id: storm_passed_due
      requires: [fs-storm-band-three]
      on_failure: [fs-back-half-opens]

  # ── Traffic thread: nobody dies without a human (or emitter) at Navigation ─
  - gate: fs-traffic-thread
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Traffic Must Be Ordered Clear
      summary: >
        [ai] The civilian craft were flying before the crew arrived; each
        band that sweeps the lane takes whatever was not ordered off it. The
        world-driven loud failure of the storm era — losses on the ledger,
        and a ship that lives in a band does not survive it.
    game_design:
      requires_player_action: [fs-order-the-traffic]
      requires: [fs-storm-front]
      on_failure: [fs-storm-exposure]

  # ── Rescue thread ───────────────────────────────────────────────────────────
  - gate: fs-lyra-clear
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Rescue's Clock
      summary: >
        [ai] She is under control by the second band or the band has her.
        Names the player work (the tow) and what failing it costs; the AI
        batch's Operate emitter is what makes this reachable by a
        backfilled crew.
    game_design:
      requires_player_action: [fs-order-the-tow]
      deadline_id: lyra_clear_due
      requires: [fs-storm-front]
      on_failure: [fs-lyra-lost]

  # ── Evidence thread ─────────────────────────────────────────────────────────
  - gate: fs-evidence-thread
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Record Can Be Put Right
      summary: >
        [ai] The falsified maintenance file, the scan-vs-record diff and the
        rigger's corroboration. Optional for survival, mandatory for the
        clean ledger; the talking path keeps it open, the force path burns
        it.
    game_design:
      requires_player_action: [fs-file-the-evidence]
      requires: [fs-strike-thread]
      on_success: [fs-evidence-on-record]

  # ── Back half: the head, and the window ────────────────────────────────────
  - gate: fs-skyhook-holds-or-falls
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Skyhook Can Fall
      summary: >
        [ai] The back half puts the head under the corridor's load and walks
        its condition toward the authored structural floor. Three escalating
        warnings; a crew who stabilise at any of them keep the structure; a
        crew who do not watch destroy_entity take it out of the world — the
        back half's world-driven terminal pressure, with the survivor-rescue
        epilogue as its branch.
    game_design:
      requires_player_action: [fs-order-the-stabilise]
      deadline_id: skyhook_failure_due
      requires: [fs-storm-passes]
      on_failure: [fs-skyhook-collapse]
  - gate: fs-window-opens
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Transfer Window Opens
      summary: >
        [ai] The deadline the crew have watched since the first tick. Demand
        is authored — three labelled capacity rows filed before the crew
        arrived — and supply is computed at this moment from the head's
        certification, each rung's line, and whether the people who staff it
        are at work. Nobody arrives with enough.
    game_design:
      self_resolving: true
      deadline_id: skyway_transfer_window
      requires: [fs-storm-passes]
      on_failure: [fs-window-opens-short]
  - gate: fs-window-closes
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Window Closes
      summary: >
        [ai] The window shuts for good; the ledger decides which two of
        three claims lifted, and the seven campaign flag families carry the
        rest forward. The envelope anchor below holds the whole mission to
        20-30 minutes, and the authored 1800s close lands exactly on that
        boundary.
    game_design:
      self_resolving: true
      deadline_id: skyway_window_closes
      requires: [fs-window-opens]
      requires_player_action: [fs-book-the-window]
      on_success: [fs-clean-ledger]
      on_failure: [fs-claims-lapse]
      anchors:
        - name: mission-envelope
          path: assets/worlds/falling_skyway.toml
          table: deadline
          match: "id=skyway_window_closes"
          key: due_secs
          min: "1200"
          max: "1800"

  # ── Consequences ────────────────────────────────────────────────────────────
  - consequence: fs-head-uncertified
    core: {status: proposed, confidence: provisional, origin: ai, title: The Head Loses Certification, summary: "[ai] Under the 45% lift line; the lift-capable flag falls and every later supply computation starts from here."}
    game_design:
      handler: on_tether_slip
  - consequence: fs-survey-unfiled
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Control Acts on the Falsified Record
      summary: >
        [ai] The survey clock lands with scans missing or the report
        unfiled: Control proceeds on the record it already has — the
        falsified one — and the crew's later evidence case starts from
        behind. Loud, and it echoes through the ledger.
    game_design:
      handler: on_survey_due
      magnitude_source: which of the three scan flags and the report were missing when the clock landed
  - consequence: fs-strike-settled
    core: {status: proposed, confidence: provisional, origin: ai, title: The Strike Settles, summary: "[ai] Two pieces of ground out of three; both promises go on the commitments ledger with the workers as the party and stay open."}
    game_design:
      handler: on_settle
  - consequence: fs-strike-hardens
    core: {status: proposed, confidence: provisional, origin: ai, title: The Committee Hardens, summary: "[ai] Escalation on the strike's own timers: a more frustrated committee, costlier options — the tree hardens but the talking path never closes."}
    game_design:
      handler: on_stall
      magnitude_source: how far the escalation timers ran before the crew engaged
  - consequence: fs-traffic-clearance-opens
    core: {status: proposed, confidence: provisional, origin: ai, title: The Corridor Must Be Cleared, summary: "[ai] The forecast posts and signposts the clearance work; each endangered craft's authored shelter control is already in Navigation's traffic picture. Navigation must issue the orders; the Lyra cannot comply."}
    game_design:
      handler: on_storm_front
  - consequence: fs-storm-exposure
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: A Band Takes What Was Left In It
      summary: >
        [ai] The destroyer survives crossing a band and does not survive
        living in one; a 60-point civilian hauler cannot cross one at all.
        The storm era's world-driven terminal: pure silence leaves ships —
        possibly the crew's — in the weather.
    game_design:
      terminal: true
      handler: on_storm_band_one
      magnitude_source: what was still on the lane when the band arrived
  - consequence: fs-lyra-lost
    core: {status: proposed, confidence: provisional, origin: ai, title: The Lyra Is Lost, summary: "[ai] The band takes her and her crew; the loss report objective opens and the campaign remembers."}
    game_design:
      handler: on_lyra_lost
  - consequence: fs-worker-casualties
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Clearing the Picket Costs People
      summary: >
        [ai] The casualty count is READ, not rolled: the number comes off the
        workers' mirrored disposition at the moment the order is given, with
        ten minutes' warning as the captain's lever over it.
    game_design:
      handler: on_force_now
      magnitude_source: workers' mirrored disposition at the moment the order is given
      depends_on_state: [fs-worker-disposition]
  - consequence: fs-back-half-opens
    core: {status: proposed, confidence: provisional, origin: ai, title: The Back Half Opens, summary: "[ai] The storm's close writes the flag; rescue debts, the head's decline and the window now crowd the remaining clock together."}
    game_design:
      handler: on_storm_passed
  - consequence: fs-skyhook-collapse
    core: {status: proposed, confidence: provisional, origin: ai, title: The Skyhook Falls, summary: "[ai] destroy_entity takes the head out of the world mid-mission; one berth remains, Control asks for a name, and the mission branches into the survivor-rescue epilogue."}
    game_design:
      handler: on_head_lost
  - consequence: fs-evidence-on-record
    core: {status: proposed, confidence: provisional, origin: ai, title: The Evidence Is Filed, summary: "[ai] The diff and the corroboration land on Control's record; one of the clean-ledger criteria, and the campaign's memory of who was telling the truth."}
    game_design:
      handler: on_corroboration_filed
  - consequence: fs-window-opens-short
    core: {status: proposed, confidence: provisional, origin: ai, title: The Window Opens Short, summary: "[ai] Supply is computed, demand is read, and the shortfall is stated in mission copy — the choice scene enforces two-of-three by reading the numbers."}
    game_design:
      handler: on_transfer_window_opens
      magnitude_source: computed lift at window open, from head certification, rung lines, and staffing
      depends_on_state: [fs-ladder-supply-picture]
  - consequence: fs-clean-ledger
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Clean Ledger
      summary: >
        [ai] The good ending, computed over the transfer ledger: mandatory
        set complete, no civilian traffic lost, commitments kept, skyhook
        held, evidence filed. It distinguishes a clean run from "completed
        but mid" — and it still lifts only two of three claims.
    game_design:
      handler: on_the_window_shuts_for_good
      magnitude_source: the five clean-ledger criteria over the transfer ledger and campaign flags
      depends_on_state: [fs-ladder-supply-picture]
  - consequence: fs-claims-lapse
    core: {status: proposed, confidence: provisional, origin: ai, title: Unlifted Claims Lapse, summary: "[ai] The window shuts for good; what was not lifted was chosen against, and the seven campaign flag families carry it forward."}
    game_design:
      handler: on_the_window_shuts_for_good

  # ── State the consequences read ─────────────────────────────────────────────
  - information: fs-worker-disposition
    core: {status: proposed, confidence: provisional, origin: ai, title: Worker Disposition, summary: "[ai] The workers' mirrored disposition — the number the casualty count is read from, surfaced on a console four ways."}
    game_design:
      visibility: team-visible
      enforcement_links: [scenario-script-host-seam]
  - information: fs-ladder-supply-picture
    core: {status: proposed, confidence: provisional, origin: ai, title: The Ladder's Supply Picture, summary: "[ai] Head certification, rung operational lines, staffing — the inputs the window's computed supply is read from, all visible from the first tick."}
    game_design:
      visibility: team-visible
      enforcement_links: [scenario-script-host-seam]

  # ── Invariants ──────────────────────────────────────────────────────────────
  - design_invariant: fs-window-structural-scarcity
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Window Cannot Carry Every Claim
      summary: >
        [ai] 40 from Ladder A plus 12 from Ladder B is 52; the three claims
        total 66; any two claims fit and all three never do. Nothing in this
        mission can raise either capacity — and the #1129 re-author must not
        change that: the 25-minute mission keeps the same arithmetic.
    game_design:
      relation: >
        claim_committee + claim_havelock + claim_convoy (66) exceeds
        depot_a_fuel_lift + depot_b_fuel_lift (52), and the sum of any two
        claims does not.
      asserted_by: [a_crew_who_did_everything_still_reach_the_window_short]
      anchors:
        - name: claim-committee
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_committee"
          key: amount
          expect: "18"
        - name: claim-havelock
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_havelock"
          key: amount
          expect: "22"
        - name: claim-convoy
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_convoy"
          key: amount
          expect: "26"
        - name: depot-a-lift
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=depot_a_fuel_lift"
          key: amount
          expect: "40"
        - name: depot-b-lift
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=depot_b_fuel_lift"
          key: amount
          expect: "12"
    implementation:
      status: declared
      paths: [tests/headless_runner.rs]
  - design_invariant: fs-clean-ledger-two-of-three
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Even the Clean Ledger Lifts Two of Three
      summary: >
        [ai] The benchmark run — mandatory set complete, no traffic lost,
        commitments kept, skyhook held, evidence filed — still cannot lift
        all three claims: the benchmark criteria and the scarcity arithmetic
        are independent, so the moral choice survives the best possible run.
    game_design:
      relation: >
        clean-ledger benchmark met implies exactly two of the three claims
        lifted; benchmark criteria never alter claim amounts or lift
        capacity.
      asserted_by: [a_crew_who_did_everything_still_reach_the_window_short]
      anchors:
        # The benchmark criteria never alter the claim amounts; pin one so a
        # scenario edit that couples them breaks here.
        - name: committee-claim-unchanged-by-benchmark
          path: assets/worlds/falling_skyway.toml
          table: entity.overrides.infrastructure.capacity
          match: "id=skyway_claim_committee"
          key: amount
          expect: "18"
    implementation:
      status: declared
      paths: [tests/headless_runner.rs]

  # ── Pacing: global intensity eras over the 20-30 minute envelope ───────────
  - pacing: fs-mission-clock
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Falling Skyway Pacing Budget
      summary: >
        [ai] Three global intensity eras over the target 20-30 minute clock
        (threads live in the gate graph, not here). Era boundaries partition
        the whole envelope, and every authored deadline lands exactly once in
        its half-open era.
    game_design:
      clock_source: mission first tick; lobby time costs the mission none of its clock
      human_calibration: >
        An authored clock must include the real time needed to read, speak,
        navigate console depth, reconnect, and recover from an understandable
        mistake. Headless completion time is not human completion time; the
        80-95% backfill sweeps tune inside these eras.
      phases:
        - phase_id: opening-the-place-reads-back
          from: "0s"
          to: "380s"
          intensity_intent: setup-with-the-strike-stewing

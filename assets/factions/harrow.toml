# Harrow defaults to neutral. Scenarios that need them hostile to the
# Federation (e.g. assets/worlds/combat_test.toml) flip the relationship
# at runtime via the `add_faction_enemy` world trigger action so the same
# Harrow ship templates can also appear as ambient patrols in non-combat
# worlds (Starbase Alpha, Before the Fire).
uuid = "cccccccc-3333-4333-8333-cccccccccccc"
name = "Harrow"
# Crew-facing label (issue #1030). `name` above is the reference key world
# triggers use; this is the only string a player ever sees.
display_name = "faction.harrow.display_name"
enemies = []

    implementation:
      status: declared
      paths: [src/console/captain/server.rs, src/ship/helm_ai.rs, src/ship/helm_planner.rs, src/ai/core.rs, src/ai/policy.rs, src/ai/server.rs, src/world/flags.rs, src/console/weapons/beam.rs, src/console/weapons/blaster.rs, src/console/weapons/torpedo.rs, src/console_ai/server.rs, src/console_ai/core.rs, src/ship/shields.rs, src/ship/power.rs, src/console/comms/server.rs]

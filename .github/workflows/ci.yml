name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── PASM model validation ───────────────────────────────────────────────────
  pasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared step, fleet-standard: uv setup, uv sync, pasm validate, pasm scan.
      # Keeps this repo's invocation from drifting from the rest of the fleet.
      - name: Validate PASM model
        uses: jkeywo/vellum/actions/pasm-validate@a08dca9ca49033307bb6d5e85cb068205c1164b6
        with:
          spec-path: pasm/spec
          scan: gate

      # Not covered by the composite action: traceability is phoenix's own
      # report, and the artifact shape below is consumed by this repo's tooling.
      - name: Generate revision-linked PASM reports
        run: |
          mkdir -p target/pasm
          uv run pasm scan --json > target/pasm/scan.json
          uv run pasm traceability --json > target/pasm/traceability.json

      - name: Upload PASM reports
        uses: actions/upload-artifact@v4
        with:
          name: pasm-reports
          path: target/pasm/
          retention-days: 14

  # ── Unit tests (native — the suite `deploy`, `perf` and `balance` gate on) ────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared step: toolchain + cache. rust-toolchain.toml pins the channel at
      # cargo time, so this installs components and warms the cache. The action
      # exposes no shared-key; rust-cache's default key is per-job, and each of
      # these keys had exactly one job, so the caches stay separate as before.
      - name: Install Rust and cache
        uses: jkeywo/vellum/actions/setup-fleet-rust@a08dca9ca49033307bb6d5e85cb068205c1164b6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # One invocation, one feature set, one compile of the crate and of every
      # integration-test binary. This previously ran as four steps across two
      # feature sets (bare `cargo test`, then `--features headless --test
      # <file>` three times), which built the crate and the test binaries
      # roughly twice.
      #
      # `--features headless` is what makes the headless scenario suite
      # (issue #912), the seeded-RNG determinism guard (#837) and the
      # registration-order determinism guard (#899) non-empty — all three files
      # are `#![cfg(all(feature = "headless", ...))]` and compile to NOTHING
      # without it, which is how they once sat unrun in CI while every job
      # stayed green. The named `--test` allowlist had the same failure mode:
      # every OTHER headless-gated integration file (snapshot_resume,
      # authoritative_state_enumeration, cross_target_probe, ...) was compiled
      # empty by the bare invocation and never named, so none of them had ever
      # run in CI. This runs all of them.
      #
      # The process isolation the old per-file steps guaranteed is UNCHANGED
      # and was never this workflow's to provide: cargo gives every integration
      # test file its own binary and runs them one process at a time.
      # headless_runner.rs's process-global native template cache, and the two
      # determinism files' need to claim Bevy's process-global task pool first,
      # are satisfied exactly as before — see those files' headers.
      #
      # Debug (well, [profile.dev] — deps at opt-level 3) is correct: the
      # runner is deterministic and asserts on end state, never wall-clock.
      - name: Run the native test suite
        run: cargo test --features headless

      # The demo build, actually compiled (issue #940). PHOENIX_DEMO_BUILD is
      # set in exactly one place in this repo — deploy-demo.yml — and that job
      # runs `trunk build` and no tests. So before this step, every
      # `#[cfg(phoenix_demo_build)]` body was source no job had ever built: the
      # deleted client cheat route, the deleted client debug/pause messages, and
      # the demo arms of the tests that pin them. Those tests looked like they
      # covered the gate and did not — with the variable unset both sides of
      # `the_cfg_gate_and_the_runtime_flag_agree` answer `false` whatever they
      # compare against, so the assertion passed vacuously. It found a real bug
      # the first time it was run.
      #
      # Deliberately narrow, and deliberately LAST. Setting the variable
      # changes a cfg on this crate, so rustc rebuilds the crate (not its
      # dependencies — the cache above still serves those); putting it after
      # the steps that want the un-flagged build means it invalidates nothing
      # behind it. `--lib` keeps it to the one target whose answers the flag
      # can change; the filters name the tests that read the gate, while
      # everything in the lib still has to compile, which is most of the value.
      #
      # The filters, and why each earns its place:
      #   build_flags                 — the cfg and the `option_env!` agree.
      #   command_admission::debug_route — the god-mode cheat route is absent.
      #   route_is_absent_from_a_demo_build — the two client messages
      #     (`ToggleDebugFlag`, `TogglePause`) do not DECODE here. That is the
      #     one asked over the wire rather than through a predicate, and it is
      #     the one that catches a variant quietly losing its `#[cfg]`.
      #
      # `debug_overlay::tests::client_route` is deliberately NOT in this list:
      # that module is itself `#[cfg(not(phoenix_demo_build))]`, so naming it
      # here would match zero tests and pass vacuously — the exact trap this
      # step exists to close.
      - name: Run the demo-build gate tests
        env:
          PHOENIX_DEMO_BUILD: 'true'
        run: cargo test --lib -- build_flags command_admission::debug_route route_is_absent_from_a_demo_build

      # `host` and `capture` each gate a binary CI never otherwise builds
      # (native delivery host / offscreen billboard-atlas + LOD-tuning tools —
      # neither ships in the default or wasm feature set, and neither test
      # invocation above passes their feature flags). A debug build is enough
      # to catch a compile break; nothing here needs to RUN, so this rides the
      # same cache as the steps above rather than paying for a release profile.
      - name: Build the host and capture-tooling binaries
        run: |
          cargo build --features host --bin phoenix-host
          cargo build --features capture --bins

  # ── Viewer tests (`--features viewer`) ────────────────────────────────────────
  #
  # The standalone model/shader viewer's own tests, EXECUTED. Until this job
  # existed they were compiled by two steps and run by none: `test`'s
  # `cargo clippy --all-targets --all-features` type-checks them, and nothing
  # else in this workflow ever passes `--features viewer` to `cargo test`. A
  # viewer test could therefore go stale rather than red indefinitely, and one
  # did — the billboard-preview assertion in `src/viewer/lod.rs` claimed a far
  # level was a procedural sphere for a whole release after the imposter atlases
  # replaced it, because the only thing that would have said otherwise was a
  # developer typing the command by hand.
  #
  # A SEPARATE JOB RATHER THAN A STEP IN `test`, and that is the whole point:
  # `viewer` and `headless` are different feature sets, so appending this to
  # `test` would serialise a second full codegen of the crate and its test
  # binaries behind the first and add all of it to that job's wall time. Here it
  # runs concurrently with `test`, `build`, `editor-test`, `pasm` and
  # `native-build`, none of which it needs and none of which need it — so the
  # marginal cost to the workflow's critical path (still `build` → `smoke` →
  # `perf`, where the release WASM build alone is ~20 minutes) is zero, and the
  # marginal cost overall is this job's own runner minutes.
  #
  # Same toolchain action and the same apt packages as every other Rust job, so
  # rust-cache carries bevy/rapier/nalgebra between runs exactly as it does for
  # `test`, `build` and `native-build`. The action exposes no shared-key and
  # rust-cache's default key is per-job, so this job gets its own cache entry —
  # cold once, warm thereafter, which is the same deal the other three have and
  # the reason the steady-state marginal wall time here is the test RUN and not
  # a from-scratch dependency build.
  #
  # No fmt and no clippy: `test` already runs both, and its clippy pass is
  # `--all-features`, which is what type-checks this feature set. Duplicating
  # them here would buy nothing and cost a second lint pass.
  viewer-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and cache
        uses: jkeywo/vellum/actions/setup-fleet-rust@a08dca9ca49033307bb6d5e85cb068205c1164b6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      # `viewer` implies `server` (see Cargo.toml), so this is the default
      # feature set plus the viewer plugin — the same command the viewer's own
      # tests were always meant to be run with, now run by something other than
      # a person remembering to.
      - name: Run the viewer test suite
        run: cargo test --features viewer

  # ── WASM build ────────────────────────────────────────────────────────────────
  #
  # Deliberately NOT gated on `test`: the release WASM build is ~20 minutes and
  # sat serially behind the whole native suite, which put it on the critical
  # path for nothing — `deploy` still needs test+build+editor-test+smoke, so a
  # red suite ships nothing, and the workflow's cancel-in-progress concurrency
  # group truncates superseded runs. The only cost is runner-minutes spent
  # building a page a red `test` then discards.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared step: toolchain + cache. The wasm target is also declared in
      # rust-toolchain.toml; passed here too so the action is self-describing.
      - name: Install Rust and cache
        uses: jkeywo/vellum/actions/setup-fleet-rust@a08dca9ca49033307bb6d5e85cb068205c1164b6
        with:
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.1
        with:
          version: v0.21.14

      # Pre-install wasm-bindgen-cli at the exact version pinned in Cargo.lock.
      # Trunk normally fetches this binary from github.com/rustwasm/wasm-bindgen/releases
      # at build time, which intermittently 504s and fails the whole pipeline.
      # taiki-e/install-action uses cached/mirrored binaries with retry+fallback,
      # and Trunk will detect the pre-installed binary on PATH and skip its own
      # download. The version must match the wasm-bindgen crate version in Cargo.lock.
      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.120

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Needed before the trunk build: its post_build hook (Trunk.toml,
      # scripts/wasm-opt-fixup.mjs) runs `node` and requires the `binaryen`
      # package to do the -Oz size optimization trunk's own wasm-opt can't
      # validate on this toolchain (see script header for why).
      - name: Install Node dependencies
        run: npm install

      - name: Build server page (WASM + JS)
        run: TRUNK_BUILD_RELEASE=true trunk build --release

      - name: Build client page (pure JS — copies client.html + gui/assets, no WASM)
        run: node scripts/build-client.mjs

      - name: Verify dist contents
        run: find dist/ -type f | sort

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Editor tests (Vitest) ─────────────────────────────────────────────────────
  editor-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm install

      - name: Run editor tests
        run: npx vitest run

      # Guards the string table: every t()/data-i18n id resolves to a CSV row,
      # no duplicate ids, every localisable TOML key holds an id rather than
      # prose, and (--strict) no new hardcoded display text sneaks into the
      # client. Without this a renamed id silently leaves a console rendering
      # ⟨some.id⟩, which no other job would catch.
      - name: Check string table
        run: node scripts/check-strings.mjs --strict

      # Guards the generated LOD models against silent drift (issue #919):
      # re-hashes every generated .glb, the source it was decimated from, and
      # the parameters its sidecar declares, and compares all three against
      # scripts/lod-manifest.toml. It deliberately does NOT re-run
      # gltf-transform — the simplifier is not byte-reproducible across CLI
      # versions, so a regenerate-and-diff gate would go red for reasons that
      # are not drift, and the runner would need the whole texture toolchain.
      # Regenerating stays a local command (`npm run lods`); this step only
      # asks whether what is committed is what the sidecars describe.
      - name: Check generated LODs are current
        run: npm run lods:check

      # Guards the committed mod-pack fixture archives against silent drift
      # (issue #986): re-derives each store-only .zip from its source dir in
      # memory and byte-compares to the committed archive, the same way
      # lods:check works. The fixtures are consumed byte-for-byte by both the
      # Rust validate_mod_pack tests and the JS readStoreZip tests, so a stale
      # zip would let the two languages silently diverge. Regenerating stays a
      # local command (`node scripts/build-mod-pack-fixtures.mjs`).
      - name: Check mod-pack fixtures are current
        run: node scripts/build-mod-pack-fixtures.mjs --check

  # ── Smoke tests ───────────────────────────────────────────────────────────────
  smoke:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/smoke/package-lock.json

      - name: Install Node dependencies
        working-directory: tests/smoke
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/smoke/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: tests/smoke
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        working-directory: tests/smoke
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/smoke/playwright-report/
          retention-days: 7

      # Handed to the perf job, which has the Rust toolchain that owns the
      # comparison (issue #868).
      - name: Upload browser perf capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-browser-capture
          path: target/perf/browser-capture.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish results to job summary
        if: always()
        working-directory: tests/smoke
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const path = '../../target/playwright-results.json';

          if (!fs.existsSync(path)) {
            console.log('No Playwright JSON result file was produced.');
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const stats = report.stats || {};
          console.log(`- Expected: ${stats.expected ?? 0}`);
          console.log(`- Failed: ${stats.unexpected ?? 0}`);
          console.log(`- Flaky: ${stats.flaky ?? 0}`);
          console.log(`- Skipped: ${stats.skipped ?? 0}`);

          const failed = [];
          function walkSuite(suite, parents = []) {
            for (const spec of suite.specs || []) {
              const title = [...parents, spec.title].join(' > ');
              for (const test of spec.tests || []) {
                const bad = (test.results || []).find((r) => r.status === 'failed' || r.status === 'timedOut');
                if (bad) {
                  failed.push({
                    title,
                    project: test.projectName,
                    status: bad.status,
                    error: bad.error?.message || '',
                  });
                }
              }
            }
            for (const child of suite.suites || []) {
              walkSuite(child, [...parents, child.title].filter(Boolean));
            }
          }
          for (const suite of report.suites || []) walkSuite(suite);

          if (failed.length) {
            console.log('');
            console.log('### First failures');
            for (const item of failed.slice(0, 20)) {
              const project = item.project ? ` [${item.project}]` : '';
              console.log(`- ${item.status}${project}: ${item.title}`);
              if (item.error) {
                console.log(`  ${item.error.split('\n')[0]}`);
              }
            }
          }
          NODE

  # ── Native release binaries, built once ───────────────────────────────────────
  #
  # `perf` and `balance` each used to build phoenix-headless from scratch in
  # release — 19 of perf's 20 minutes and 10 of balance's 12, for the same two
  # binaries, twice, on the critical path. This job builds them once at t=0 and
  # hands them over as an artifact.
  #
  # The profile is `release`, unchanged and deliberately so. A thinner profile
  # would build faster, but this job is not on the critical path (perf cannot
  # start until smoke finishes anyway) so the speed would buy nothing — while a
  # different profile WOULD move perf/baselines/headless-default.ron's timings
  # and could shift the balance batch's per-run wall-clock. Identical binary,
  # identical numbers, zero baseline churn.
  native-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust and cache
        uses: jkeywo/vellum/actions/setup-fleet-rust@a08dca9ca49033307bb6d5e85cb068205c1164b6

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      # Release, because a debug-build measurement describes a binary nobody
      # ships. The committed timing baseline was recorded the same way.
      - name: Build headless runner and perf tool
        run: |
          cargo build --release --features headless --bin phoenix-headless
          cargo build --release --features perf --bin phoenix-perf

      # Paired with the consumers' post-download sha256sum: a mismatch means the
      # artifact round-trip changed the binary, which invalidates every number
      # measured from it.
      - name: Record binary digests
        run: sha256sum target/release/phoenix-headless target/release/phoenix-perf | tee -a "$GITHUB_STEP_SUMMARY"

      # Both paths share target/release, so the two files land at the artifact
      # root — which is why the consumers can download straight back into
      # target/release/ and every existing `./target/release/...` invocation
      # keeps working. That path is not cosmetic: balance-runs.mjs::binaryPath()
      # hardcodes `<root>/target/release/phoenix-headless` and exits if absent.
      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-bins
          path: |
            target/release/phoenix-headless
            target/release/phoenix-perf
          retention-days: 1

  # ── Performance measurement (issue #868; model revised for the demo phase) ───
  #
  # Runs after smoke so the browser capture that job produces can be compared
  # here, where the perf tooling lives. The comparison has exactly one
  # implementation — `phoenix-perf report` — rather than a second opinion
  # written in whatever language each job happens to have.
  #
  # WARNINGS-ONLY (src/perf/mod.rs carries the rule). This job gates on NOTHING:
  # every scenario is reported, and any metric with adverse baseline drift is filed as a
  # GitHub issue to fix later (see the "File issues" step). Enforcement lives in
  # the manual demo deploy (deploy-demo.yml), which runs `report --gate` on all
  # four scenarios and blocks the demo build on adverse drift. Moving fast in this
  # phase means adverse perf drift is tracked, not a reason to redden main.
  #
  # CI COMMITS MISSING BASELINES. A scenario with no committed baseline yet is
  # bootstrapped here: on a push to main the job adopts it from its own capture
  # and commits it with [skip ci] (so the commit starts no new run). An existing
  # baseline is NEVER moved by CI — that stays a deliberate `adopt` in a diff a
  # human reads (see src/perf/baseline.rs).
  #
  # Still not in `deploy`'s `needs`.
  perf:
    needs: [test, smoke, native-build]
    runs-on: ubuntu-latest
    # contents: write to commit a bootstrapped baseline; issues: write to file
    # the adverse-drift record. Both use the default GITHUB_TOKEN.
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Rust toolchain: the binaries arrive prebuilt from native-build. The
      # apt step stays — they are dynamically linked against libudev, libasound,
      # libxkbcommon and libwayland, and `phoenix-perf mesh` drives Bevy's real
      # asset loader.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: native-bins
          path: target/release/

      # actions/upload-artifact ships a zip and the download does not restore
      # the executable bit; without this every invocation below dies with
      # "Permission denied". The sha256sum must match native-build's summary.
      - name: Restore the executable bit
        run: |
          chmod +x target/release/phoenix-headless target/release/phoenix-perf
          sha256sum target/release/phoenix-headless target/release/phoenix-perf

      - name: Measure the default headless scenario
        run: |
          mkdir -p target/perf
          ./target/release/phoenix-headless \
            --sim-seconds 60 \
            --report target/perf/run-report.json \
            --perf-capture target/perf/capture.json \
            2> target/perf/headless-run.txt
          cat target/perf/headless-run.txt
          # Compare the capture against its committed baseline so a timing drift
          # is reported (and filed as an issue) like every other scenario.
          # Warnings-only — no --gate in regular CI. A missing baseline prints
          # "nothing to compare" and exits 0; only a malformed baseline (a
          # broken contract, not performance drift) fails here.
          ./target/release/phoenix-perf report --capture target/perf/capture.json \
            > target/perf/headless-report.txt
          cat target/perf/headless-report.txt

      # No simulation runs: this reads bytes on disk and counts in authored
      # TOML, so it is machine-independent and its tolerances are tight. Reported
      # here (warnings-only); a drift is filed as an issue and enforced by the
      # demo deploy, not by this job.
      - name: Measure asset budgets
        run: |
          ./target/release/phoenix-perf assets --capture target/perf/assets.json
          ./target/release/phoenix-perf report --capture target/perf/assets.json \
            > target/perf/assets-report.txt
          cat target/perf/assets-report.txt

      # The mesh interior, through Bevy's own asset loader rather than a second
      # glTF reader (issue #905). No window and no renderer — the loader runs
      # and the meshes and images it produced are counted. Models are loaded one
      # at a time, so peak memory is one model rather than 150 MB of decoded
      # texture.
      - name: Measure the mesh interior
        run: |
          ./target/release/phoenix-perf mesh --capture target/perf/mesh.json
          ./target/release/phoenix-perf report --capture target/perf/mesh.json \
            > target/perf/mesh-report.txt
          cat target/perf/mesh-report.txt

      - name: Download browser capture
        uses: actions/download-artifact@v4
        with:
          name: perf-browser-capture
          path: target/perf/
        continue-on-error: true

      # `browser.frame` from CI is the ECS schedule under WebDriver, where the
      # render stack is skipped — see tests/smoke/perf-browser.spec.js. The
      # capture's runtime says so, which is what stops it being read as a
      # rendering number.
      - name: Compare the browser capture
        run: |
          if [ -f target/perf/browser-capture.json ]; then
            ./target/release/phoenix-perf report \
              --capture target/perf/browser-capture.json \
              > target/perf/browser-report.txt
            cat target/perf/browser-report.txt
          else
            echo 'no browser capture produced by the smoke job' \
              > target/perf/browser-report.txt
          fi

      # Bootstrap: commit a baseline for any scenario that has none yet, from
      # this runner's own capture. Push-to-main only, and it never touches an
      # existing baseline — an existing budget moves only through a deliberate
      # `adopt` in a human-read diff. The commit carries [skip ci] so it starts
      # no new run; continue-on-error so a race on main never reddens the build.
      - name: Commit any missing baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          set -uo pipefail
          committed=0
          for capture in target/perf/capture.json target/perf/assets.json \
                         target/perf/mesh.json target/perf/browser-capture.json; do
            [ -f "$capture" ] || continue
            scenario=$(jq -r '.scenario // empty' "$capture")
            [ -n "$scenario" ] || continue
            target="perf/baselines/${scenario}.ron"
            if [ ! -f "$target" ]; then
              echo "bootstrapping missing baseline: $target"
              ./target/release/phoenix-perf adopt --capture "$capture" --out "$target"
              git add "$target"
              committed=1
            fi
          done
          if [ "$committed" -eq 1 ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(perf): bootstrap missing baseline(s) [skip ci]'
            git pull --rebase origin main
            git push
          else
            echo 'no missing baselines to bootstrap'
          fi

      # The warnings record: one GitHub issue per metric with adverse drift (or
      # an incomparable measurement contract), so the finding is tracked rather
      # than lost in a green log. Push
      # to main only (a fork PR has no token, and per-PR issues would be noise).
      # Deduped by a stable title and reopened if it had been closed. `report`
      # renders one line per finding as "<verdict> <metric> ...", so $1 is the
      # verdict and $2 the metric.
      - name: File issues for adverse perf drift
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for pair in "headless-default:headless" "assets:assets" \
                      "assets-mesh:mesh" "browser-automation:browser"; do
            scenario="${pair%%:*}"
            report="target/perf/${pair##*:}-report.txt"
            [ -f "$report" ] || continue
            awk '$1=="warn" || $1=="fail" || $1=="incomparable" {print $1" "$2}' "$report" \
            | while read -r verdict metric; do
                if [ "$verdict" = "incomparable" ]; then
                  title="perf: ${scenario} / ${metric} measurement contract failure"
                  finding="cannot be compared with"
                  action="Restore the measurement contract, or deliberately amend the baseline if its unit or presence changed."
                else
                  title="perf: ${scenario} / ${metric} adverse drift"
                  finding="has **${verdict}** adverse drift from"
                  action="Fix the adverse drift, or if the new number is the intended budget move the baseline with \`phoenix-perf adopt\`."
                fi
                line=$(grep -F " ${metric} " "$report" | head -n1)
                existing=$(gh issue list --state all --search "\"${title}\" in:title" \
                  --json number,title --jq ".[] | select(.title == \"${title}\") | .number" \
                  | head -n1)
                body=$(printf '`%s` %s its committed baseline in scenario `%s`.\n\nSeen on `%s` (run %s). Regular CI is warnings-only during the move-fast demo phase; the demo deploy is what gates on this. %s\n\n```\n%s\n```' \
                  "$metric" "$finding" "$scenario" "${GITHUB_SHA:-unknown}" "${GITHUB_RUN_ID:-local}" "$action" "$line")
                if [ -n "$existing" ]; then
                  echo "updating issue #${existing}: ${title}"
                  gh issue reopen "$existing" 2>/dev/null || true
                  gh issue comment "$existing" --body "$body" || true
                else
                  echo "opening issue: ${title}"
                  gh issue create --title "$title" --body "$body" --label perf 2>/dev/null \
                    || gh issue create --title "$title" --body "$body"
                fi
              done
          done

      - name: Summarise
        if: always()
        run: |
          {
            echo '## Performance'
            for report in headless assets mesh browser; do
              echo
              echo "### ${report}"
              echo '```'
              cat "target/perf/${report}-report.txt" 2>/dev/null || echo 'no report produced'
              echo '```'
            done
            echo
            echo 'Regular CI is warnings-only: any metric with adverse baseline drift is'
            echo 'filed as a GitHub issue to fix later, and a scenario with no'
            echo 'baseline yet is bootstrapped and committed on main. The demo'
            echo 'deploy (`deploy-demo.yml`) is what gates on these budgets. To'
            echo 'move an existing baseline deliberately, `adopt` from the'
            echo '`perf-capture` artifact — see `src/perf/baseline.rs`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-capture
          path: target/perf/
          retention-days: 14

  # ── Demo balance regression report (issue #915, non-gating) ───────────────────
  #
  # Runs the standing destroyer-vs-each-combat_test-enemy matchup batch
  # (scripts/balance-runs.demo.toml) on fixed seeds and uploads the merged
  # summary plus every per-run AAR report as an artifact. Like `perf`, this job
  # REPORTS rather than gates: it is not in `deploy`'s `needs`, and the config's
  # thresholds are recorded in the output, never enforced — the job only goes
  # red on infrastructure failure (binary won't build, runner crashes). Gating
  # starts once the recorded numbers have proven stable across reports.
  balance:
    needs: [test, native-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No Rust toolchain: phoenix-headless arrives prebuilt from native-build.
      # The apt step stays for the runtime .so's the binary links against.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libudev-dev libxkbcommon-dev libasound2-dev

      - name: Download native binaries
        uses: actions/download-artifact@v4
        with:
          name: native-bins
          path: target/release/

      # The zip round-trip drops the executable bit; balance-runs.mjs invokes
      # `<root>/target/release/phoenix-headless` directly.
      - name: Restore the executable bit
        run: |
          chmod +x target/release/phoenix-headless target/release/phoenix-perf
          sha256sum target/release/phoenix-headless

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # balance-runs.mjs imports smol-toml.
      - name: Install Node dependencies
        run: npm install

      - name: Run the demo matchup batch
        run: node scripts/balance-runs.mjs scripts/balance-runs.demo.toml --out target/balance

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Demo balance report (recorded thresholds, non-gating)'
            cat target/balance/summary.md 2>/dev/null || echo 'no summary produced'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: target/balance/
          retention-days: 14

  # ── Deploy (main branch only, requires both test + smoke to pass) ─────────────
  deploy:
    needs: [test, build, editor-test, smoke, viewer-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # `cname` writes a CNAME file into the published branch on every deploy.
      # Without it, peaceiris/actions-gh-pages replaces the whole gh-pages
      # branch with dist/ (which has no CNAME), so GitHub Pages drops the
      # custom domain and the site reverts to *.github.io until it's re-set by
      # hand. Keeping the domain here makes the deploy self-describing and
      # idempotent.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pp-dev.kiwigamedesign.co.uk

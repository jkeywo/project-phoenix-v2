      paths: [src/world/config.rs, src/gm_attention.rs, src/core/codec.rs, gui/gm-widgets-panel.js, gui/gm-role-presets.js, gui/gm-workspace.js, gui/gm-workspace-shell.js, gui/gm-workspace.css, server.html, assets/worlds/probe_gm_widgets.toml, docs/gm-widget-authoring.md, tests/fixtures/gm-widgets-presets.json]
      symbols: [GmRolePresetWidget, GM_WIDGET_TYPES, GM_WIDGET_TYPE_ATTENTION, GM_WIDGET_TYPE_WORKLOAD, GM_WIDGET_TYPE_ACTIONS, GM_WIDGET_TYPE_NOTE, GM_WIDGET_ACTION_IDS, GmAttentionCategory::from_authored, GmAttentionCategory::authored_vocabulary, createGmWidgetsPanel, GM_WIDGET_ATTENTION_ROWS, normaliseWidget, onEffective]

  - mechanic: gm-t2-station-puppeting
    core:
      status: accepted
      confidence: confirmed
      title: Station-Scoped GM Puppeting Alongside Players
      summary: "A GM may open an authentic Station interface and puppet a player or NPC ship when that ship defines the interface and corresponding command consumers. Takeover is Station-scoped: it suppresses AI/Backfill emissions for that Station but does not change seat ownership. Human commands and GM commands remain accepted together and resolve through deterministic Admission ordering. Releasing takeover restores AI only where the Station would ordinarily receive it. Multiple GMs remain equal and every command is attributed."
      rationale:
        - "The GM takes over AI and acts alongside players; puppeting is not exclusive possession of a human Station and does not create a second downstream human-versus-GM authority branch."
    architecture:
      kind: station-control-policy
      authority: authoritative
      coordinates: [gm-milestone-directing]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: gm-t2-performing-surface
    core:
      status: partially-implemented
      confidence: confirmed
      title: Comms Studio, Crew-Knowledge Comparison, and Role Presets
      summary: "M3 lets a GM send bounded free-form in-character text through the normal Comms path using an existing sender identity, selected recipient ships, and authored routing visibility; exact text is logged. Template quick picks and scripted hail initiation are optional accelerators, and T2 neither invents identities nor drafts replies. Per-ship knowledge panes show the contact picture, Objectives, and Comms from the same projections the crew receives, with local Truth, Crew Knowledge, and Difference views; Station-private detail remains protected unless the GM opens its authentic Station interface. Each GM chooses and may live-switch a scenario-authored role preset that filters contacts, panels, quick actions, and later attention, defaults to All, permits duplicates, and persists only with that reconnectable GM identity."
      rationale:
        - "Role presets are personal presentation, not authority. All GMs remain peers and simultaneous actions keep the same attributed deterministic result contract."
        - "[ai] Issue #1318 (Crew-Knowledge Comparison) implemented 2026-09-06: a pure gui/gm-knowledge-compare.js diff/projection module plus a GM page panel compose Truth (the omniscient gm_entity payload), Crew Knowledge (the selected ship's own buildSensorsConsoleState/buildCommsConsoleState/ClientSimState.objectives, fed by the gm_station raw replica through the existing buildGmStationConsoleInput fold), and an identity-keyed Difference — inventing no second knowledge model and reading no Station-private field (console_hull, non-Sensors/Comms blackboards). T2 has no fog-of-war/confidence model yet (issues #1063/#1065/#1070), so Objectives and Comms diff as equal today by construction; only Contacts can differ, via the selected ship's own sensors radar range/tag filters. Comms studio (#1317) and role presets (#1319) remain open."
    architecture:
      kind: gm-presentation
      authority: non-authoritative
      coordinates: [gm-milestone-performing]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [gui/gm-knowledge-compare.js, gui/gm-local-projection.js, gui/gm-station-puppet.js, gui/console-state.js, assets/strings/strings.csv, server.html]
      symbols: [diffByIdentity, truthContactRows, crewContactRows, objectiveRows, commsMessageRows, commsContactRows, buildKnowledgeCompare, createGmKnowledgeCompare]
      tests: [npx vitest run tests/client/gm-knowledge-compare.test.js, tests/smoke/gm-page.spec.js]

  - component: gm-t2-role-presets
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Presentation-Only GM Role Presets
      summary: "A Game Master selects and may live-switch one scenario-authored role preset — a stable id, String Table label, and open panel/quick-action/contact id lists — that filters which panels, quick actions, and contacts THEIR OWN browser shows. It defaults to the built-in All (never authored, always available), permits duplicate selection across independent GMs, and persists only with that GM's own reconnectable identity, restoring it — or falling back safely to All for a missing, invalid, or removed id — on rejoin. It never reaches GmOperator, the crew-public GM roster, a GmAction, a snapshot, or the sim digest, so no GM's choice ever changes action availability, permissions, locks, ordering, or authority."
      rationale:
        - "[ai] Issue #1319's delivered slice of gm-t2-performing-surface, scoped and recorded here rather than in that entity's own (still empty) implementation block, which #1317/#1318/#1320 continue to share."
        - "[ai] panels/quick_actions/contacts are open string-id vocabularies, not a closed enum, so #1317's Comms Studio and #1318's knowledge comparison extend the same schema without a migration — the M6-compatible panel-descriptor shape the acceptance criteria ask for. No shipped panel reads `contacts` yet; the map/inspector/activity feed stay omniscient."
        - "[ai] WorldConfig is authored content, not runtime state (see tests/authoritative_state_enumeration.rs's `[[workforce]]` precedent), so a Vec field on its already-registered Resource adds nothing to census, snapshot, or digest. The reserved id `all` keeps a scenario from ever shadowing the built-in default; parse_world refuses it and a duplicate id by name."
        - "[ai] Round-1 review (#1319): the pure loader/filter and source-string vitest suites had no whole-path browser evidence, and an unconditional restore-on-join call reset a live selection to All on any join with no stored identity (a mistyped code, a different fleet, a crew-role join) even when the join was then refused. Fixed by gating the restore on an actual stored `rolePreset` string, and added tests/smoke/gm-m1-exit.spec.js coverage (an authored preset selected through the real `<select>` before disconnect, round-tripped through reconnect) plus a `tests/smoke/gm-page.spec.js` `@core` spec that boots a preset-authoring fixture world and proves both authored options render with real String Table copy, that live-switching one hides exactly its own unauthored panels/quick actions while an authored one stays visible, and that the untouched quick action still applies its GmAction -- presentation only, never authority."
    architecture:
      kind: gm-presentation
      authority: non-authoritative
      coordinates: [gm-t2-performing-surface, gm-milestone-performing]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/core/codec.rs, src/server/bridge.rs, gui/gm-role-presets.js, server.html, assets/strings/strings.csv, docs/toml-authoring-guide.md]
      symbols: [GmRolePresetEntry, GM_ROLE_PRESET_ALL_ID, encode_gm_role_presets, wasm_get_gm_role_presets, parseGmRolePresets, resolveGmRolePreset, isGmPanelVisible, isGmQuickActionVisible, isGmContactVisible, createGmRolePresets, GM_ALL_ROLE_PRESET]
      tests: [cargo test --features headless --lib gm_role_preset, cargo test --features headless --lib gm_roster_decoder_rejects_duplicates_bounds_and_private_fields, npx vitest run tests/client/gm-role-presets.test.js tests/client/gm-join-page.test.js, tests/smoke/gm-m1-exit.spec.js, tests/smoke/gm-page.spec.js]

  - decision: gm-t2-device-and-milestone-boundaries
    core:
      status: accepted
      confidence: confirmed
      title: T2 Device Floor and T3/T4 Boundary
      summary: "T2 supports desktop keyboard/mouse and large landscape tablets with touch, zoom, scalable text, visible focus, and non-colour state; phone portrait is out of scope. T3 owns M4 attention assistance and M5 safety/recovery, including live-session restore and undo. T4 M6 owns native integration and the integrated Workshop/Live Inspector. At M6 one native simulation instance may carry one fixed player-ship slot alongside local GM operator identities, advertises both ship and gm capabilities, and contributes once to deterministic NPC ownership; browser GM remains GM-only. M7 owns false/ghost/degraded/delayed information and M8 owns in-sim presentation controls."
      rationale:
        - "The combined native instance is one simulation peer with multiple local operator roles, never two duplicate simulations. T2 browser delivery stays focused while its reusable map, selection, inspector, panel, capability, and action components become the M6 foundation."
    architecture:
      kind: scope-boundary
      authority: non-authoritative
      coordinates: [gm-milestone-performing, gm-milestone-integrated-workshop, gm-milestone-information-control, gm-milestone-presentation]

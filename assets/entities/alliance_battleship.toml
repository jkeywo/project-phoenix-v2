  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_load"
  when = "true"
  verb = "load_torpedo"

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_launch"
  when = "fact(red_alert) >= param(min_alert_to_fire) and fact(target_facing_shields) <= 0"
  verb = "launch_torpedo"

[weapon.impact]
damage_type = "physical"
penetration = 40

[[weapon]]
id = "torpedo-tube-aft-starboard"
strategy_id = "aft-starboard"

  # Load + launch policy for this tube (issue #782), AUTHORED rather than
  # synthesised (#885b). Two rules on two DIFFERENT channels, so they never
  # contend: keep the tube loaded, and launch when the alert is up AND the arc
  # the round would strike is down. Loaded state, magazine stock, target
  # validity, range and arc stay host-side gates.
  #
  # `fact(target_facing_shields) <= 0` is the fleet's torpedo doctrine —
  # "phasers strip the shields, torpedoes finish the hull" — and issue #956
  # moved it HERE from `auto_fire_torpedo`, where it was a Rust gate sitting
  # upstream of every policy: no doctrine could authorise a round while the
  # striking arc was up, and none could retune the threshold. It is an HP
  # reading rather than a boolean, resolved per-arc through the target's own arc
  # router, so this gate and the eventual hit agree about which arc is in the
  # way. A hull that wants to spend rounds differently edits this line;
  # `ship_harrow_cruiser.toml` is the worked example of tightening it further,
  # and `idle = true` of declining launches altogether.

[weapon.mount]
facing_deg = 180
fire_arc_deg = 90
range = 300

[weapon.delivery]
kind = "guided"
load_time = 4
volley_max = 3

  [weapon.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_load"
  when = "true"
  verb = "load_torpedo"

  [[weapon.ai.rule]]
  priority = 0
  channel = "torpedo_launch"
  when = "fact(red_alert) >= param(min_alert_to_fire) and fact(target_facing_shields) <= 0"
  verb = "launch_torpedo"

[weapon.impact]
damage_type = "physical"
penetration = 40

[sensors_console]

[sensors_console.long_range_radar]
range = 300
shows = [ "player", "asteroid_field", "ship", "station", "planet", "star" ]
selects = [ "ship", "station", "planet" ]

# Helm stats — Cruiser baseline × 2/3 (battleship is slower/less agile)
[helm_console]
# Red-alert hostile weapon-arc overlay (issue #874): RGBA 0-1, the fourth
# entry being the fill opacity. Deliberately far fainter than the Tactical
# radar's own arc fills (0.30 / 0.25): the overlay paints OVER the blips the
# helm is flying by, so this alpha is the only thing keeping them legible
# through it. It must read as a hint, not as a second radar.
hostile_arc_color = [ 1, 0.3, 0.3, 0.07 ]
max_speed = 10
max_reverse_speed = 2.7
acceleration = 2.7
deceleration = 6.7
max_yaw_rate = 0.27
# Capital hulls do not get the low-speed turn trade. Authored explicitly
# rather than omitted: 0 here is a balance decision, not an oversight.
low_speed_turn_boost = 0.0
max_bank_deg = 8
impulse_charge_duration = 3
impulse_speed_multiplier = 6
impulse_acceleration_multiplier = 4
power_multipliers = [ -0.5, 0, 0.25, 0.5 ]

[helm_console.engine_pfx]
color = [ 0.25, 0.75, 1, 0.72 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.55
trail_spawn_interval_secs = 0.06

[helm_console.boost]
multiplier = 2.5
steering_multiplier = 1.8
active_duration = 3.0
recharge_duration = 20.0

[helm_console.radar]
range = 93.75
shows = [ "player", "asteroid", "asteroid_field", "ship", "station", "planet", "star" ]

[navigation_console]

[navigation_console.system_chart]
range = 800
shows = [ "region", "asteroid_field", "star", "planet", "moon", "station", "player", "objective_marker" ]
selects = [ "station", "planet", "star", "region" ]

[comms]
range = 1000

# Authored first text channels; lower-work public traffic has shorter reach.
[comms.radio]
media = "audio_video"
request_reading_ticks = 30
system = "comms"
keys = ["alliance-fleet"]

[[comms.radio.channel]]
id = "public"
range = 200
work_units = 1

[[comms.radio.channel]]
id = "fleet"
range = 1000
work_units = 4
key = "alliance-fleet"

# Shields — Cruiser baseline × 1.4
# max_hp: 100 × 1.4 = 140; regen_per_sec: 2.5 × 1.4 = 3.5
[shields_console]
# What a reactor point spent on `shields` buys: `ModifierSlot::ShieldRegen`
# (issue #952). Index 0 is 0.0 rather than the fleet default's -0.5 because
# Shields rest at level 2, alongside Helm and Weapons: each `[[shield_arc]]`
# therefore regenerates at its authored rate. The rungs either side trade a
# reactor point for slower or faster shield recovery.
power_multipliers = [ -0.5, 0, 0.25, 0.5 ]
focus_bonus_max_hp = 0
focus_bonus_regen = 5
focus_penalty_max_hp = 0
focus_penalty_regen = 1.0
focus_decay_rate = 10
focus_focused_damage_multiplier = 0.5
focus_unfocused_damage_multiplier = 1.25

[shields_console.base]
max_hp = 140
regen_per_sec = 3.5
offline_duration = 10


tags = ["field", "main", "asteroid_field"]

[radar_appearance]
region_colour = [0.52, 0.32, 0.18]

[asteroid_field]
random_rotation = [30, 30, 180]
inner_radius = 300.0
outer_radius = 350.0
density = 0.005
# Relative contribution to the world's composed density evaluator (#913).
# Fields covering the same cell blend by weight; 1.0 = equal partner.
weight = 1.0
spawn_distance = 250.0
despawn_distance = 300.0
asteroid_type_paths = [
    # common — rarity weight 1.0 (the baseline the others are relative to)
    { path = "assets/entities/asteroid_common_1_small.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_1_large.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_2_small.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_2_large.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_3_small.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_3_large.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_4_small.toml", weight = 1.0 },
    { path = "assets/entities/asteroid_common_4_large.toml", weight = 1.0 },
    # uncommon — rarity weight 0.1 ≈ 1:10 against a common
    { path = "assets/entities/asteroid_uncommon_1_small.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_1_large.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_2_small.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_2_large.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_3_small.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_3_large.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_4_small.toml", weight = 0.1 },
    { path = "assets/entities/asteroid_uncommon_4_large.toml", weight = 0.1 },
    # rare — rarity weight 0.01 ≈ 1:100 against a common
    { path = "assets/entities/asteroid_rare_1_small.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_1_large.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_2_small.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_2_large.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_3_small.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_3_large.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_4_small.toml", weight = 0.01 },
    { path = "assets/entities/asteroid_rare_4_large.toml", weight = 0.01 },
]
cosmetic_type_paths = [
    "assets/entities/asteroid_common_1_cosmetic.toml",
    "assets/entities/asteroid_common_2_cosmetic.toml",
    "assets/entities/asteroid_common_3_cosmetic.toml",
    "assets/entities/asteroid_common_4_cosmetic.toml",
]
tags = ["field", "main", "asteroid_field"]

[asteroid_field.grid]
resolution = 25.0
fill_gameplay = 0.4
fill_cosmetic = 0.2
uniformity = 0.3
noise_freq = 0.02
noise_octaves = 3
density_noise_freq = 0.01
density_noise_octaves = 2
jitter = 20.0
cosmetic_y_offset = 15.0

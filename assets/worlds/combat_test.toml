# ── Wave completions ─────────────────────────────────────────────────────────
#
# One trigger per wave, on that wave's own group being cleared. Each closes the
# player's objective and pays down `mission_threat_remaining` by exactly one.
#
# These used to ride the NEXT wave's spawn trigger, which only worked because
# the chain guaranteed the order. Under the clock they stand alone: waves can be
# cleared out of order, and wave 8 no longer needs a special case for having no
# successor to carry its decrement.

[[trigger]]
condition = "on_all_destroyed"
group     = "wave_1"

  [[trigger.action]]
  type = "complete_objective"
  id   = "obj-destroy-wave-1"

  [[trigger.action]]
  type = "increment_flag"
  name = "mission_threat_remaining"
  by   = -1

[[trigger]]
condition = "on_all_destroyed"

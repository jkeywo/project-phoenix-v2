<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.cruiser_helm.doc_title">Project Phoenix — Helm Console</title>
  <script src="../bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    /* The two rails this scope sits between (issue #1376: every Helm document
       lays out lateral + impulse/boost left, the scope centre, the joystick
       right). Same values as destroyer/helm's — this hull mounts the same
       lateral pad on the left rail — and the same reasoning: 200px is what
       ph-lateral-thrust-joystick's 180px pad wants, 240px is
       ph-helm-joystick's dial at full size, and 160px is where both stop
       shrinking (below it the dial's inset rings and 56px nub stop reading as
       a dial). Both widgets size themselves to their rail, so a shrunk rail is
       a smaller control, never a control drawn over the scope. The square
       between the rails is gui/console.css's one `.scope-cell` rule — no
       aspect-ratio of its own, and no landscape variant of one. */
    .console-body { --scope-rail-start: 200px; --scope-rail-end: 240px; --scope-rail-min: 160px; }
    .console-body .ctrl-col { display: flex; flex-direction: column; justify-content: space-evenly; gap: 12px; min-height: 0; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    /* Wraps because this rail shrinks (issue #1376, same as destroyer's):
       IMPULSE and BOOST side by side want ~216px of type; the rail's floor is
       160px, so on a small landscape screen they go one above the other
       instead of running out past the rail and over the scope. */
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-row > * { flex: 1 1 6rem; }
    /* Contextual dock control (issue #1388) — destroyer/helm's rules verbatim,
       because it is the same control on the same rail: shown only while a berth
       is in range or a dock is held, so the rail is unchanged for the whole of a
       flight that never docks. */
    .dock-panel { flex-shrink: 0; border-top: 1px solid var(--edge); padding-top: 8px; margin-top: 4px; }
    .dock-panel[hidden] { display: none; }
    /* issue #1425: `flex-wrap: wrap` so a long docked_to_name that cannot
       share this row with the button at all (the button's own content can
       consume the row's entire width at 200% text on a narrow pane) drops to
       its own line below the button instead of being squeezed to zero width
       despite this row's status span already carrying min-width:0 +
       overflow-wrap: anywhere — that pair only helps once SOME width remains
       to wrap into. */
    .dock-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .dock-btn { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.14em; padding: 6px 14px; background: rgba(var(--rgb-panel), 0.8); color: var(--ink); border: 1px solid var(--edge); cursor: pointer; min-height: var(--control-hit-min); }
    .dock-btn.docked { background: var(--loaded); color: var(--surface-void); border-color: var(--loaded); }
    .dock-status { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    .dock-refusal { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--reloading); margin-top: 6px; }
    /* Under-tow-load indicator (issue #1157, mounted here by #1390 now that this
       hull mounts a tractor): shown only while this ship's beam holds a target,
       so the rail is unchanged for the whole of a flight that never tows.
       The same banner as Destroyer Helm, compacted here because the Cruiser's
       movement rail can carry Dock and tow status at the same time. */
    .tow-load-panel { flex-shrink: 0; border-top: 1px solid var(--edge); padding-top: 4px; margin-top: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .tow-load-panel[hidden] { display: none; }
    .tow-load-label { flex: 0 0 auto; white-space: nowrap; font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); letter-spacing: 0.14em; color: var(--reloading); }
    .tow-load-target { max-width: 100%; overflow-wrap: anywhere; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); }
    /* Portrait (issue #1376, John's 2026-09-06 decision): nothing scrolls.
       Same fix as destroyer/helm's, for the same measured overflow: stacking
       the scope, the joystick's 240px column and the lateral pad plus
       IMPULSE/BOOST stood taller than an 812px page with only
       `overflow-y: auto` below to reach BOOST. The full-width square scope
       sits on top and the two rails share ONE ROW beneath it instead, each
       shrinking to its half of the width — both widgets are fluid down to it
       (ph-helm-joystick.js's `.well`, ph-lateral-thrust-joystick.js's
       `.track`). `.helm-scope-row` (gui/console.css) is the shared rule this
       document opts into rather than spelling out a grid track list of its
       own. `--scope-rail-start/-end/-min` are the landscape rail's own
       properties; inert here. `overflow-y: auto` stays as the safety net
       #1375 established — proved by screenshot (issue #1376 commit) never to
       trigger at 375x812 or 390x844. */
    /* A phone landscape rail also carries the contextual Dock control.
       Use the mockup's compact frame spacing so it stays above the fold. */
    @media (orientation: landscape) and (max-height: 500px) {
      .panel-inner { padding: 8px; gap: 8px; }
      .console-body .ctrl-col { padding: 8px; gap: 8px; }
      .console-body .movement-col { padding-block: 2px; gap: 2px; }
      /* Dock and tow can coexist; leave room for fallback-font line metrics
         without shrinking the controls or hiding either status. */
      .dock-panel { padding-top: 4px; margin-top: 0; }
      .btn-row { gap: 4px; }
    }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 8px; }
      .console-body { overflow-y: auto; }
      .console-body .ctrl-col { padding: 8px; }
      .console-body .movement-col { gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Helm Console" data-i18n-attr="data-screen-label:console.helm.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The contact count
           the footer carried heads the movement column the AUTO badge belongs
           to. -->
      <div class="console-body scope-row helm-scope-row">
        <div class="ctrl-col movement-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="helm-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <ph-lateral-thrust-joystick id="lateral-thrust-joystick"></ph-lateral-thrust-joystick>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
          <!-- Contextual dock control (issue #1388): this hull's helm owns a
               `dock` system, so it publishes a `dock` blackboard and this panel
               appears exactly while a berth is in range or a dock is held. -->
          <div class="dock-panel" id="dock-panel" hidden>
            <div class="dock-row">
              <button id="dock-btn" class="dock-btn" data-i18n="console.dock.dock">Dock</button>
              <span id="dock-status" class="dock-status">—</span>
            </div>
            <div id="dock-refusal" class="dock-refusal" hidden></div>
          </div>
          <!-- Under-tow-load indicator (issue #1157, mounted here by #1390):
               shown only while this ship's tractor holds a target, so the helm
               can see it is under load and why. The tractor is Engineering's
               control on this hull, but the mass penalty lands on THIS seat, so
               this is where it has to be said. Hidden the rest of the time. -->
          <div class="tow-load-panel" id="tow-load-panel" hidden>
            <span class="tow-load-label" data-i18n="console.helm.under_tow">Under tow load</span>
            <span id="tow-load-target" class="tow-load-target"></span>
          </div>
        </div>
        <div class="radar-col scope-cell">
          <ph-helm-radar id="helm-radar"></ph-helm-radar>
        </div>
        <div class="ctrl-col joystick-col">
          <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-helm-radar.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-lateral-thrust-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import { initConsole } from '../console-core.js';
    import { HELM_ACTION_CONTEXT, HELM_DOCK_ACTION_ID } from '../stations/helm-actions.js';
    // The render lives in gui/cruiser/helm.console.js (issue #1235): the
    // shared Helm renderer + this hull's variant (lateral joystick, glyph +
    // zero-fallback footer, plus a bespoke Dock tail since #1388). s is a
    // HelmConsolePayload — see the @typedef in gui/console-state.js. The
    // vitest suite imports the same renderStation.
    import { renderStation } from './helm.console.js';

    initConsole({ name: 'helm', render: renderStation });

    // The one dock button toggles dock/undock through the action map, which
    // sends the same admitted command a dock AI would (issues #1159, #1251).
    // The semantic adapter reads the current authoritative dock view, so the
    // contextual ship variant cannot dispatch a stale system id or verb.
    document.getElementById('dock-btn').addEventListener('click', function() {
      window.activateSemanticAction(HELM_DOCK_ACTION_ID, {
        context: HELM_ACTION_CONTEXT, source: 'control',
      });
    });
  </script>
</body>
</html>

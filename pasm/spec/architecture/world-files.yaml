entities:
  - component: world-file-parser
    core:
      status: implemented
      confidence: confirmed
      title: World File Parser
      summary: Parses authoritative world TOML into WorldConfig, including entities, triggers, comms, visual settings, and predicates.
    architecture:
      kind: configuration-loader
      authority: authoritative
      owns: [world-configuration-state]
      produces:
        - world-configuration-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths: [src/world/config.rs]
      symbols: [parse_world, WorldConfig, WorldEntity, Trigger]
      tests: [cargo test]

  - state: world-configuration-state
    core:
      status: implemented
      confidence: confirmed
      title: World Configuration State
      summary: Parsed authoritative world content, including entity declarations and name-to-UUID bindings.
    architecture:
      classification: authoritative
      owner: world-file-parser
      writers: [world-file-parser]
    implementation:
      status: declared
      paths: [src/world/config.rs]
      symbols: [WorldConfig]

  - component: world-entity-spawner
    core:
      status: implemented
      confidence: confirmed
      title: World Entity Spawner
      summary: Assigns stable UUIDs to named world entries and spawns immediate entities through the unified entity pipeline.
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [world-name-binding-state]
      reads: [world-configuration-state, world-flag-state]
      produces: [world-name-binding-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/config.rs]
      symbols: [spawn_world_entities, assign_named_entity_uuids, partition_immediate_entities_three_way]
      tests: [cargo test]

  - state: world-name-binding-state
    core:
      status: implemented
      confidence: confirmed
      title: World Name Binding State
      summary: Stable mapping from authored entity names to runtime UUIDs for trigger and comms resolution.
    architecture:
      classification: authoritative
      owner: world-entity-spawner
      writers: [world-entity-spawner]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/config.rs]
      symbols: [assign_named_entity_uuids, WorldConfig]
      tests: [cargo test]

  - component: world-flag-store
    core:
      status: implemented
      confidence: confirmed
      title: World Flag Store
      summary: Host-owned counters with boolean views and layered parent lookup for world predicates.
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [world-flag-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/flags.rs]
      symbols: [FlagStore, Predicate, parse_predicate]
      tests: [cargo test]

  - state: world-flag-state
    core:
      status: implemented
      confidence: confirmed
      title: World Flag State
      summary: Authoritative named flag and counter values used by entity and trigger predicates.
    architecture:
      classification: authoritative
      owner: world-flag-store
      writers: [world-flag-store]
    implementation:
      status: declared
      paths: [src/world/flags.rs]
      symbols: [FlagStore]
      tests: [cargo test]

  - component: world-trigger-evaluator
    core:
      status: implemented
      confidence: confirmed
      title: World Trigger Evaluator
      summary: Evaluates trigger conditions, predicate gates, action predicates, and delayed actions against world runtime state.
    architecture:
      kind: subsystem
      authority: authoritative
      reads: [world-configuration-state, world-flag-state, world-name-binding-state]
      coordinates: [world-objective-manager, world-comms-runtime]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/config.rs, src/world/flags.rs]
      symbols: [Trigger, TriggerAction, Predicate]
      tests: [cargo test]

  - component: world-objective-manager
    core:
      status: implemented
      confidence: confirmed
      title: World Objective Manager
      summary: Server-side objective resource updated by world content actions.
    architecture:
      kind: subsystem
      authority: authoritative
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/objectives.rs]
      symbols: [ObjectiveManagerRes, ObjectiveManager]

  - component: world-comms-runtime
    core:
      status: implemented
      confidence: confirmed
      title: World Comms Runtime
      summary: Evaluates world comms templates, maintains contacts and inbox state, and marks initial content for broadcast on game start.
    architecture:
      kind: subsystem
      authority: authoritative
      reads: [world-configuration-state, world-name-binding-state, world-flag-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/comms/server.rs, src/world/config.rs, src/console/comms/inbox.rs]
      symbols: [CommsInboxRes, mark_comms_dirty_on_game_start]
      tests: [cargo test]

  - component: world-presentation-config
    core:
      status: implemented
      confidence: confirmed
      title: World Presentation Configuration
      summary: Host-side world ambient-light and dust settings consumed by renderer effects.
    architecture:
      kind: configuration
      authority: authoritative
      reads: [world-configuration-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/server/renderer.rs, src/server/pfx.rs]
      symbols: [AmbientLightConfig]
      tests: [cargo test]

  - component: world-authoring-validator
    core:
      status: proposed
      confidence: confirmed
      title: World Authoring Validator
      summary: Resolves every authored world reference before activation and reports source-located errors for missing templates, names, flags, objectives, trigger targets, comms senders, and child-world paths. Also validates the base scenario manifest, reporting source-located findings for missing, unparseable, duplicate, or malformed scenario entries.
    architecture:
      kind: configuration-validator
      authority: authoritative
      owns: [world-authoring-validation-state]
      reads: [world-configuration-state, world-composition-state]
      produces: [world-authoring-validation-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/validate.rs, src/world/manifest.rs, src/headless/app.rs]
      symbols: [validate_composition, validate_entity_identity, validate_manifest, WorldFinding, has_error]
      tests: [cargo test]

  - state: world-authoring-validation-state
    core:
      status: proposed
      confidence: confirmed
      title: World Authoring Validation State
      summary: Source-located errors and warnings for the complete effective world composition; any error blocks activation of the entire root world.
    architecture:
      classification: authoritative
      owner: world-authoring-validator
      writers: [world-authoring-validator]
    implementation:
      status: declared
      paths: [src/world/validate.rs]
      symbols: [WorldFinding, SourceLocation, Severity]

  - component: world-identity-contract
    core:
      status: proposed
      confidence: confirmed
      title: World Entity Identity Contract
      summary: Separates an entity's unique authored name, used only for world references, from its player-facing display_name.
    architecture:
      kind: configuration-schema
      authority: authoritative
      owns: [world-entity-identity-state]
      produces: [world-entity-identity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/world/validate.rs]
      symbols: [WorldEntity, validate_entity_identity]
      tests: [cargo test]

  - state: world-entity-identity-state
    core:
      status: proposed
      confidence: confirmed
      title: World Entity Identity State
      summary: "Effective world entity identity: a unique reference name and independent display text. Duplicate reference names in one effective namespace are authoring errors."
    architecture:
      classification: authoritative
      owner: world-identity-contract
      writers: [world-identity-contract]
    implementation:
      status: declared
      paths: [src/world/config.rs]
      symbols: [WorldEntity]

  - component: world-composition-contract
    core:
      status: proposed
      confidence: confirmed
      title: World Composition Contract
      summary: "Defines hierarchical reference resolution for layered worlds: parent.<name> climbs one layer, repeated parent segments may climb further, and child-world aliases qualify child names as child_world.<name>."
    architecture:
      kind: configuration-schema
      authority: authoritative
      owns: [world-composition-state]
      produces: [world-composition-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/validate.rs]
      symbols: [parse_qualified_reference, QualifiedRef, validate_composition]
      tests: [cargo test]

  - state: world-composition-state
    core:
      status: proposed
      confidence: confirmed
      title: World Composition State
      summary: The root-to-child world tree, its aliases, and its effective reference namespaces. Name collisions are detected across every namespace where an unqualified reference could resolve ambiguously.
    architecture:
      classification: authoritative
      owner: world-composition-contract
      writers: [world-composition-contract]
    implementation:
      status: declared
      paths: [src/world/validate.rs]
      symbols: [WorldSource, QualifiedRef]

  - component: world-load-lifecycle-contract
    core:
      status: proposed
      confidence: confirmed
      title: World Load Lifecycle Contract
      summary: Defines load, deferred activation, unload, cleanup, and reload semantics for base and child worlds, and activates a root world only after its full composition validates. Unload removes each layer's owned runtime content (entities, triggers, comms, objectives) and cancels or resolves its pending delayed actions by authored policy.
    architecture:
      kind: lifecycle-policy
      authority: authoritative
      owns: [world-content-lifecycle-state]
      reads: [world-authoring-validation-state, world-composition-state]
      produces: [world-content-lifecycle-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/headless/app.rs, src/world/server.rs, src/world/validate.rs]
      symbols: [validate_composition, has_error, spawn_immediate_entities_internal, apply_world_layer_changes]
      tests: [cargo test]

  - state: world-content-lifecycle-state
    core:
      status: proposed
      confidence: confirmed
      title: World Content Lifecycle State
      summary: The authoritative activation state of each world layer and its owned runtime content (spawned entities, triggers, comms, objectives, pending delayed actions). Failed validation leaves no partial root-world content active; unload removes exactly the layer's owned content.
    architecture:
      classification: authoritative
      owner: world-load-lifecycle-contract
      writers: [world-load-lifecycle-contract]
    implementation:
      status: declared
      paths: [src/headless/app.rs, src/world/server.rs]
      symbols: [spawn_immediate_entities_internal, WorldRuntime, apply_world_layer_changes]

  - component: world-objective-contract
    core:
      status: implemented
      confidence: confirmed
      title: World Objective Contract
      summary: Defines objective identifiers, display text, ownership, transition rules, and cleanup when the world layer that authored an objective unloads. Layer ownership and unload cleanup (issue #751) plus identifier/reference validation, visibility, and scoped priority (issue #752) are implemented.
    architecture:
      kind: configuration-schema
      authority: authoritative
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/objectives.rs, src/world/dispatch.rs, src/world/server.rs, src/world/validate.rs]
      symbols: [ObjectiveManager, apply_world_layer_changes, validate_objectives]
      tests: [cargo test]

  - component: world-trigger-lifecycle-contract
    core:
      status: implemented
      confidence: confirmed
      title: World Trigger Lifecycle Contract
      summary: Defines whether each authored trigger is once-only (default) or repeatable, its reset and cooldown rules, and whether a world's pending delayed actions are cancelled or resolved when it unloads.
    architecture:
      kind: lifecycle-policy
      authority: authoritative
      reads: [world-content-lifecycle-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/content.rs, src/world/config.rs, src/world/delayed.rs, src/world/server.rs]
      symbols: [Trigger, TriggerState, cooldown_elapsed, reset_triggers_by_id, DelayedUnloadPolicy, partition_delayed_actions_on_unload]
      tests: [cargo test]

  - component: world-comms-identity-contract
    core:
      status: implemented
      confidence: confirmed
      title: World Comms Identity Contract
      summary: Resolves each authored comms sender reference (`from`) to its world entity identity for the sender UUID while carrying separate, independent sender display text. All world comms deliver to the ship Comms system, not role-specific inboxes.
    architecture:
      kind: configuration-schema
      authority: authoritative
      reads: [world-entity-identity-state, world-name-binding-state]
      coordinates: [world-comms-runtime]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/comms/content.rs, src/comms/server.rs]
      symbols: [CommsTemplate, FiredCommsTemplate, inject_comms_templates, merge_world_comms]
      tests: [cargo test]

  - component: world-layer-runtime
    core:
      status: implemented
      confidence: confirmed
      title: World Layer Runtime
      summary: Loads the base world and additive extra worlds, queues runtime layer changes, maintains loaded layer ownership, and applies load and unload transitions.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      owns: [world-layer-runtime-state]
      reads: [world-configuration-state, world-name-binding-state]
      writes: [world-layer-runtime-state, spawned-entity-state]
      produces: [world-layer-runtime-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/config.rs, src/world/layers.rs, src/world/scenario.rs]
      tests: [cargo test]

  - state: world-layer-runtime-state
    core:
      status: implemented
      confidence: confirmed
      title: World Layer Runtime State
      summary: Loaded world layers, pending load/unload changes, and each layer's owned spawned entities and runtime content.
    architecture:
      classification: authoritative
      owner: world-layer-runtime
      writers: [world-layer-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/layers.rs]

  - component: world-trigger-action-dispatcher
    core:
      status: implemented
      confidence: confirmed
      title: World Trigger Action Dispatcher
      summary: "Executes the concrete authored trigger catalogue: objectives, AI state, modifiers and flags, game over, layer changes, world flags, spawning, destruction, and faction relationship changes."
    architecture:
      kind: action-dispatcher
      authority: authoritative
      reads: [world-flag-state, world-name-binding-state, world-layer-runtime-state]
      writes: [objective-runtime-state, ship-modifier-state, spawned-entity-state, world-layer-runtime-state]
      coordinates: [npc-doctrine-evaluator, game-flow-controller]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/world/server.rs, src/world/content.rs]
      tests: [cargo test]

  - component: world-runtime-spawn-resolver
    core:
      status: implemented
      confidence: confirmed
      title: World Runtime Spawn Resolver
      summary: Resolves immediate versus game-start spawn timing and runtime spawn-action anchors, positions, rotations, scales, generated UUID aliases, and groups.
    architecture:
      kind: entity-spawner
      authority: authoritative
      reads: [world-configuration-state, world-name-binding-state, world-layer-runtime-state]
      writes: [world-name-binding-state, spawned-entity-state, world-layer-runtime-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/world/server.rs]
      tests: [cargo test]

  - component: world-unload-cleanup-controller
    core:
      status: implemented
      confidence: confirmed
      title: World Unload Cleanup Controller
      summary: Removes unloaded-layer entities, triggers, comms templates, layer-owned objectives, and generated spawn results, and cancels or resolves the layer's pending delayed actions by authored policy; reloading reconstructs those layer-local contracts.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      reads: [world-layer-runtime-state]
      writes: [world-layer-runtime-state, spawned-entity-state, objective-runtime-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/layers.rs, src/world/delayed.rs, src/objectives.rs]
      symbols: [apply_world_layer_changes, evaluate_layer_unload, partition_delayed_actions_on_unload]
      tests: [cargo test]

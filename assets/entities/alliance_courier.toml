[[shield_arc.ai.tree.state.task]]
id = "restored-0"
when = [{ value = { source = "number_compare", name = "target-strength-shield-arc-aft", comparison = "greater_or_equal", value = 0.8 }, equals = true }]
action = { kind = "write", channel = "recover-shield-arc-aft", value = { source = "literal", value = false } }
[[shield_arc.ai.tree.state.task]]
id = "stop-0-0"
when = [{ value = { source = "fact", name = "target-visible-shield-arc-aft" }, equals = false }]
action = { kind = "write", channel = "recover-shield-arc-aft", value = { source = "literal", value = false } }
[[shield_arc.ai.tree.state.task]]

    core:
      status: implemented
      confidence: confirmed
      title: Accepted Marking Equipment Installation
      summary: "The ordinary accepted entity installer regenerates the immutable marker sensor/radio binding. The first equipment shape is finite battery-only screenless ordinary sensor/radio machinery with actual Operation, interior and damage owners; no new controller or resource copy."
    architecture:
      kind: subsystem
      authority: derived
      owns: [marking-accepted-equipment]
      writes: [marking-accepted-equipment]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]

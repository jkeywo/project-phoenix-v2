<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.cruiser_comms.doc_title">Project Phoenix — Comms Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .console-body .col { display: flex; flex-direction: column; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; min-height: 0; overflow-y: auto; }
    .console-body .col h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    ph-comms-contact-list, ph-comms-hail-list, ph-comms-current-message, ph-navigation-map { flex: 1; min-height: 0; }
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    .overlay-toggle { background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; min-height: var(--control-hit-min); }
    .overlay-toggle:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-toggle.active { background: rgba(var(--rgb-cyan-dim), 0.9); border-color: var(--cyan); color: var(--cyan); }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-navigation-map { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .col { padding: 8px; } .overlay-toggle { font-size: var(--text-xs); padding: 6px 12px; } .overlay-panel { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Comms Console" data-i18n-attr="data-screen-label:console.comms.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.comms.title">COMMS</span><span class="sub" data-i18n="console.cruiser_comms.subtitle">COMMUNICATIONS &amp; NAV</span></h1>
        <div class="hero-controls">
          <span class="auto-badge" id="comms-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          <button class="overlay-toggle" id="nav-toggle" data-active="false" data-i18n="console.common.nav_toggle">Nav</button>
        </div>
      </div>
      <div class="console-body">
        <div class="col">
          <h2 data-i18n="console.comms.navigation">Navigation</h2>
          <ph-navigation-map id="navigation-map"></ph-navigation-map>
        </div>
        <div class="col">
          <h2 data-i18n="console.comms.comms">Comms</h2>
          <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
          <ph-comms-hail-list id="comms-hail-list"></ph-comms-hail-list>
          <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.comms.station_footer">COMMS STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_waypoint">NO WAYPOINT</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <div class="overlay-panel" id="nav-overlay">
      <button class="overlay-back" id="nav-back" data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.comms.navigation">Navigation</h2>
      <ph-navigation-map id="nav-overlay-map"></ph-navigation-map>
    </div>
  </div>
  <script type="module">
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-hail-list.js';
    import '../components/ph-comms-current-message.js';
    import '../components/ph-navigation-map.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/cruiser/comms.console.js (issue #1235): the
    // shared Comms renderer + this hull's variant (Navigation absorbed into
    // the same Station, per issue #825). s is a SystemStationConsolePayload.
    // The vitest suite imports the same renderStation.
    import { renderStation } from './comms.console.js';

    function closeAllOverlays() {
      ['nav-overlay'].forEach(function(oid) {
        var el = document.getElementById(oid);
        if (el) el.classList.remove('open');
      });
      document.querySelectorAll('.overlay-toggle').forEach(function(b) {
        b.dataset.active = 'false';
        b.classList.remove('active');
      });
    }

    function toggleOverlay(id, btnId) {
      var overlay = document.getElementById(id);
      var btn = document.getElementById(btnId);
      var isOpen = btn.dataset.active === 'true';
      closeAllOverlays();
      if (!isOpen) {
        overlay.classList.add('open');
        btn.dataset.active = 'true';
        btn.classList.add('active');
      }
    }

    initConsole({ name: 'comms', render: renderStation });

    document.getElementById('nav-toggle').addEventListener('click', function() { toggleOverlay('nav-overlay', 'nav-toggle'); });
    document.getElementById('nav-back').addEventListener('click', closeAllOverlays);
  </script>
</body>
</html>

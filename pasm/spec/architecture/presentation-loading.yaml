entities:
  - component: asset-manifest-discovery
    core:
      status: implemented
      confidence: confirmed
      title: Asset Manifest Discovery
      summary: Discovers renderable models, radar icons, model-rig sidecars, nested entity templates, and loadable sub-world assets from selected world content, in two phases — an initial recursive walk from entity templates, then an incremental expansion of each sidecar's own [[lod]] chain as it lands.
    architecture:
      kind: asset-discovery-service
      authority: authoritative
      owns: [asset-manifest-state]
      reads: [world-configuration-state, entity-template-state]
      produces: [asset-manifest-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/world/config.rs, src/entities/config.rs]
      tests: [cargo test]

  - state: asset-manifest-state
    core:
      status: implemented
      confidence: confirmed
      title: Asset Manifest State
      summary: Host-local discovered GLB model, radar-icon, sidecar, and sub-world paths needed before a selected scenario starts, grown incrementally as each delivered sidecar's own [[lod]] chain is discovered and folded in.
    architecture:
      classification: local
      owner: asset-manifest-discovery
      writers: [asset-manifest-discovery]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs]

  - component: host-asset-preloader
    core:
      status: implemented
      confidence: confirmed
      title: Host Asset Preloader
      summary: Loads the discovered manifest, broadcasts loading start and progress, gates engage through the Loading phase, and automatically transitions to InProgress once all required assets are ready.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      owns: [asset-loading-state]
      reads: [asset-manifest-state, game-phase-state]
      writes: [game-phase-state]
      produces: [asset-loading-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/core/messages.rs]
      tests: [cargo test]

  - state: asset-loading-state
    core:
      status: implemented
      confidence: confirmed
      title: Asset Loading State
      summary: Host asset readiness and client-facing fraction used by the Loading surface; it is presentation readiness rather than gameplay authority.
    architecture:
      classification: authoritative
      owner: host-asset-preloader
      writers: [host-asset-preloader]
      replicas: [client-presentation-state]
    implementation:
      status: declared
      paths: [src/server/asset_preload.rs, src/core/messages.rs]
      symbols: [AssetPreloadResource]

  - component: model-rig-and-marker-loader
    core:
      status: implemented
      confidence: confirmed
      title: Model Rig and Marker Loader
      summary: Resolves each spawned entity's primary authored model sidecar into renderer-independent authoritative marker and target geometry. Every authoritative profile preloads those primary sidecars and binds their exact bytes into frozen content identity before mission start; an unresolved live entity holds the fixed clock until an immediate simulation-side sync can attach its canonical state. Entity rendering and active GLB, procedural, or billboard LOD tiers consume it but never replace or remove it.
      rationale:
        - "[ai] One exclusive synchronization invocation resolves each exact sidecar path at most once for its candidate batch, reusing marker geometry while applying each entity's own authored transform immediately in the original candidate order. The temporary lookup is discarded on return, including pending and identity-fallback results. Later invocations therefore retry WASM delivery and observe changed native sidecar content for new entities without a persistent cache or invalidation protocol. PreUpdate/FixedLast registration and fixed-clock readiness remain unchanged."
    architecture:
      kind: model-loader
      authority: authoritative
      owns: [model-marker-runtime-state, model-rig-readiness-state]
      reads: [entity-template-state, spawned-entity-state]
      produces: [model-marker-runtime-state, model-rig-readiness-state]
      runs_in: [host-browser-runtime, headless-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/model_rig.rs, src/entities/config_cache.rs, src/entities/loader.rs, src/server_app/registration.rs, src/lockstep/mod.rs, src/lobby/server.rs, src/server/viewscreen_border.rs, src/server/bridge.rs, server.html]
      symbols: [ModelRigReadiness, primary_sidecar_path, sync_authoritative_model_markers, wasm_push_sidecar_toml, gate_lockstep_ticks]
      tests: [cargo test]

  - state: model-rig-readiness-state
    core:
      status: implemented
      confidence: confirmed
      title: Model Rig Readiness State
      summary: Peer-local asynchronous delivery bookkeeping for primary authored rig sidecars and the narrow virtual-clock hold while a live entity lacks resolved canonical geometry. Delivery frame and pending-set order are not simulation state; the frozen sidecar bytes and resulting ModelMarkers are authoritative instead.
    architecture:
      classification: local
      owner: model-rig-and-marker-loader
      writers: [model-rig-and-marker-loader]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/config_cache.rs, src/server_app/registration.rs, src/lockstep/mod.rs]
      symbols: [ModelRigReadiness, sync_authoritative_model_markers, gate_lockstep_ticks]

  - state: model-marker-runtime-state
    core:
      status: implemented
      confidence: confirmed
      title: Model Marker Runtime State
      summary: Resolved per-entity marker and target geometry from the primary authored rig, used for camera placement, authoritative weapon origins and target points, and read-only presentation attachments. Active presentation/LOD state cannot mutate it.
    architecture:
      classification: authoritative
      owner: model-rig-and-marker-loader
      writers: [model-rig-and-marker-loader]
    implementation:
      status: declared
      paths: [src/entities/model_markers.rs, src/entities/model_rig.rs]
      symbols: [ModelRig, ModelMarkers]

  - component: host-presentation-effects
    core:
      status: implemented
      confidence: confirmed
      title: Host Presentation Effects
      summary: Renders configured forward-only engine trails (including marker-attached roll and uniform scale), phaser beams, torpedo and blaster effects, explosions, dust, nebula particles, star visuals, and viewscreen alert effects from authoritative events and entities.
    architecture:
      kind: presentation-effects
      authority: derived
      reads: [spawned-entity-state, model-marker-runtime-state, authoritative-ship-motion-state]
      renders: [spawned-entity-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/server/pfx.rs, src/server/renderer.rs, src/server/viewscreen_border.rs, src/entities/star.rs]
      tests: [cargo test]

  - component: client-audio-presentation
    core:
      status: implemented
      confidence: confirmed
      title: Client Audio Presentation
      summary: "Phone clients play a local UI interaction click controlled by their own master setting. The room's music, engine ambience, combat effects and Red Alert audio are owned by the browser Viewscreen through gui/host-audio.js, not by phone clients. Native game playback and richer private semantic feedback remain T4 work."
    architecture:
      kind: client-presentation
      authority: local
      reads: [client-presentation-state]
      runs_in: [phone-browser-runtime]
    implementation:
      status: declared
      paths: [client.html, gui/settings-panel.js, assets/sounds/ui_click.ogg]

  - component: browser-room-audio
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Browser Viewscreen Audio Mixer
      summary: "Authored room audio uses one decoded Web Audio provider with per-sound, category and Master gains. The Viewscreen cog controls active and future sounds, independent mutes, deliberate output enable/retry and a bounded Music output test. Availability is reported separately from mute. The existing endpoint presentation record stores only local mixer preferences; it migrates the previous Master level and preserves visual preferences. Private GM pages never acquire the room soundtrack."
      rationale:
        - "[ai] Every browser sound uses actual gain nodes rather than relying on HTMLMediaElement.volume. Existing MP3/OGG assets and authored levels are unchanged; unavailable Interface feedback is explained. Computer tones include all four existing severity keys."
        - "[ai] Informative positional weapons and ship impacts have bounded live text equivalents, with current beam firing indicated while active. Existing Red Alert and computer-message text/severity/Station displays remain their equivalents. Sound cues never identify hidden attackers. Repetition replaces current labels instead of accumulating records."
        - "[ai] Suspended/interrupted output discards one-shots and tests. Only current desired loops are eligible to resume. Runtime-owned restore/recovery boundaries reset the envelope and playback before current config/HUD, and drop that boundary frame's one-shots. No cue history, catch-up or simulation mutation is added."
    architecture:
      kind: client-presentation
      authority: local
      reads: [room-audio-lifecycle]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [gui/audio-mix.js, gui/audio-preferences.js, gui/browser-audio-provider.js, gui/host-audio.js, gui/audio-settings-panel.js, gui/audio-live-equivalents.js, gui/audio-settings.css, gui/server-settings.js, gui/viewscreen-presentation.js, server.html]
      symbols: [createHostAudio, createBrowserAudioProvider, createRoomAudioPreferences, renderAudioSettingsPanel, createAudioLiveEquivalents]
      tests: [tests/client/host-audio.test.js, tests/client/audio-preferences.test.js, tests/client/audio-settings-panel.test.js, tests/smoke/audio.spec.js, tests/smoke/audio-mixer.spec.js]

  - state: room-audio-lifecycle
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Room Audio Continuation State
      summary: "Peer-local current generation/running/restore-hold projection derived from GamePhase, accepted live restore, the startup capture gate and mesh restoration. It resets playback/config/envelope at a real continuation boundary. The generation is ephemeral presentation comparison state; it carries no cue records or command backlog, enters neither snapshot nor digest, and leaves existing canonical Admission bookkeeping intact."
    architecture:
      classification: local-view
      owner: browser-room-audio
      writers: [browser-room-audio, native-room-audio-player]
      runs_in: [host-browser-runtime, native-host-runtime]
    implementation:
      status: declared
      paths: [src/server/audio_lifecycle.rs, src/server/audio.rs, src/server/bridge.rs, src/server/viewscreen_border.rs, src/console_bridge.rs, src/core/codec.rs]
      symbols: [RoomAudioLifecycle, AudioLifecycleState, publish_audio_lifecycle, rebase_audio_presentation, rebase_hud_state, encode_audio_lifecycle]
      tests: [tests/gm_restore.rs, cargo test --features headless --lib server::audio, cargo test --features headless --lib restore_rebase]

  - component: native-room-audio-player
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Native Viewscreen Room Audio Player
      summary: "One native process owner decodes shipped MP3 and Vorbis/OGG assets and mixes lobby music, ambient/engine beds, Red Alert siren/music, phaser, positional blaster and forcefield audio through one selected CPAL output. The embedded settings document sends typed local controls and observes current status; document mount, hide and reload never own or restart playback."
      rationale:
        - "[ai] The production decoder and PCM mixer run against a fake device sample sink in ordinary native tests. CPAL callbacks only consume mixed samples; file decoding, enumeration and stream destruction stay on the owner worker. Category and Master gains multiply the existing authored levels, and a bounded Music output test uses this same path."
        - "[ai] Native preferences merge an audio section into the existing Viewscreen endpoint record. Hardware routes persist separately as bridge-media assignments. Launch profiles override saved media only for explicitly named surfaces; display-only profiles preserve saved audio routes. The merged media must still satisfy sharing consent. Missing or ambiguous selected outputs remain silent until deliberate recovery. Room output never follows a private surface assignment."
        - "[ai] Current config/HUD and the runtime-owned continuation state drive playback. Restore holds stop loops/tests immediately; output loss and late decoding discard missed one-shots. A generation-checked commit prevents the worker from recreating old sound after a newer boundary. Only live comparison state is retained: no audio cue history, catch-up, journal or replay. Existing Red Alert text/frame remains visible with sound unavailable or muted."
        - "[ai] Combat uses the same source events, forcefield envelope, authored gain and distance laws as the browser. Equal-power panning preserves mono/stereo input rules; authored HRTF uses the vendored public-domain measured IRCAM/WebKit response data, with convolution prepared outside the device callback. Only a fresh current blaster request may commit."
        - "[ai] The shared Rust blaster producer applies the current canonical forced-or-ordinary Viewscreen mode and the observer's existing M7 conceal/report-policy predicate. Suppressed Sensors shots are consumed silently without delayed synthesis. Unnamed public combat geometry in ordinary camera mode remains eligible. A shared current lifecycle/beam and expiring combat slots feed the one HUD, independent of device success or mute. New, loading, hidden and restored documents seed transient comparison silently; only current lifecycle/beam state retries after a failed push."
        - "[ai] Existing native Display controls forward resolved endpoint text scale and contrast through the same retained HUD command as current content. The lobby and HUD share one saved preference record and OS default layer; no new store is introduced. Audio equivalents remain above a simultaneous presentation card."
        - "[ai] Both Viewscreens render the existing current computer_message payload through one shared banner: text, explicit severity and recognised Station indication. A fresh ComputerMessagePosted occurrence selects only its authored severity tone on the native Alerts bus; absent sections/severities remain silent. One expiring request is consumed on loss, mute, output change or restore without a backlog. Current text is independent of playback, and existing narrative bookkeeping is unchanged."
    architecture:
      kind: client-presentation
      authority: local
      owns: [native-room-audio]
      reads: [room-audio-lifecycle]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths: [src/native_host/audio/mod.rs, src/native_host/audio/decoder.rs, src/native_host/audio/engine.rs, src/native_host/audio/player.rs, src/native_host/audio/device.rs, src/native_host/audio/store.rs, src/native_host/audio/mix.rs, src/native_host/audio/spatial.rs, src/native_host/audio/hrtf.rs, src/native_host/audio/visual.rs, src/native_host/panes/pane_thread.rs, src/native_host/panes/ultralight.rs, src/server/audio.rs, src/native_host/viewscreen_presentation.rs, src/native_host/host_lobby/bridge.rs, src/native_host/host_lobby/scenario.rs, src/native_host/host_lobby/mod.rs, gui/native-audio.js, gui/native-settings.js, gui/audio-settings-panel.js, gui/viewscreen-hud.html, gui/audio-live-equivalents.js]
      symbols: [NativeRoomAudio, NativeRoomAudioPlugin, RoomPlayer, Mixer, HardwareStore, NativeAudioVisual, VisualReader, createNativeAudio, renderNativeAudioOutput]
      tests: [cargo test --features headless --lib native_host::audio, cargo test --features headless --lib audio_hud_delivers, cargo test --features headless --lib blaster_audience, tests/client/native-audio.test.js, tests/client/native-settings.test.js, tests/client/viewscreen-hud.test.js, tests/smoke/native-audio.spec.js, tests/smoke/native-combat-audio.spec.js]

  - state: native-room-audio
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Native Room Audio Endpoint State
      summary: "Process-local current room input, mix, selected output, decoded asset cache, provider status and current visual equivalents. The sole owner discards one-shots at continuation/output boundaries. Per-document visual comparison consumes missed occurrences. Only endpoint preferences and hardware assignments persist in their respective local files; no playback event is saved or enters simulation state."
    architecture:
      classification: local-view
      owner: native-room-audio-player
      writers: [native-room-audio-player]
      runs_in: [native-host-runtime]
    implementation:
      status: declared
      paths: [src/native_host/audio/mod.rs, src/native_host/audio/player.rs, src/native_host/audio/engine.rs, src/native_host/audio/store.rs]
      symbols: [NativeRoomAudio]
      tests: [cargo test --features headless --lib native_host::audio]

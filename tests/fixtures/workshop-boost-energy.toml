# Finite authored hardware for the Workshop composition fixture's boost System.
[power_groups.fixture-energy]
label = "Fixture equipment"
default_level = 2
min_level = 0
max_level = 4

[[infrastructure.capacity]]
id = "fixture-coolant"
amount = 100
ceiling = 100
label = "Fixture coolant"

[resource_services.coolant]
kind = "capacity"
id = "fixture-coolant"

[energy.reactor]
sustainable_output_per_sec = 4
max_output_per_sec = 6
ramp_per_sec = 2
initial_output_per_sec = 4
initial_energy = 50
initial_heat = 0
max_cooling_per_sec = 2
default_cooling_per_sec = 1

[energy.reactor.reserve]
capacity = 100
max_intake_per_sec = 8
passive_loss_at_full_per_sec = 0.1
charge_heat_per_unit = 0.1
discharge_heat_per_unit = 0.1
passive_cooling_per_sec = 0.2
coolant_heat_per_unit = 10
trip_heat = 50
recover_heat = 30

[energy.reactor.coolant]
service = "coolant"

[[energy.consumer]]
system = "boost"
initial_energy = 5
initial_heat = 0
continuous_cost_per_sec = 1
discrete_cost = 0

[energy.consumer.reserve]
capacity = 10
max_intake_per_sec = 4
passive_loss_at_full_per_sec = 0.1
charge_heat_per_unit = 0.1
discharge_heat_per_unit = 0.1
passive_cooling_per_sec = 0.2
coolant_heat_per_unit = 10
trip_heat = 50
recover_heat = 30

[energy.consumer.coolant]
service = "coolant"

[[energy.group]]
id = "fixture-energy"
max_flow_per_sec = 4
default_flow_per_sec = 2
max_cooling_per_sec = 1
default_cooling_per_sec = 0.1
priority = 0
restore_delay_secs = 0.5

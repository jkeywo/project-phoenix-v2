  - state: onsite-repair-detail-state
    core:
      status: implemented
      confidence: confirmed
      title: On-Site Repair Detail State
      summary: Exact non-core damage detail revealed to Engineering only for a station where a repair team is currently on site.
      rationale:
        - Team travel is both a repair delay and an information delay.
        - Recalling a team before arrival should not reveal hidden details.
        - >-
          Issue #737: the on-site predicate is the named
          `RepairTeams::on_site_systems`, which counts only `TeamSlot::Repairing`.
          `Travelling` has not arrived and `Returning` has left, so a team
          recalled before arrival goes `Travelling -> Returning` without ever
          passing through `Repairing` and never reveals anything. The predicate
          is named rather than inlined so the publisher and this entity point at
          one symbol.
        - >-
          The wire projection is not the only door into this state. The
          channel-3 coordination bus carries
          `CoordinationPayload::RepairRequest`, which is explicitly addressed
          to the Station owning the `repair` System and therefore lands on the Engineering holder as a
          `CoordinationPopup`. It was introduced by issue #682 carrying the
          exact HP deficit, which handed Engineering that number on every
          worsening tier crossing of an arbitrary non-Core system, with no team
          dispatched and no travel elapsed. That is a leak, not a designed
          exception: it contradicts the rule this state exists to express, so
          the payload's `deficit` is now `Option<f32>` and is gated through the
          same `HullVisibility::can_see` — and therefore the same
          `on_site_systems()` set — as the hull rows. Core systems and the
          recipient's own systems keep the exact number. Everything else still
          raises the popup and still names the tier; the number is simply
          absent, which is the coarse "needs attention" signal. `deficit` stays
          exact on the host-internal enqueue and AI `DeliveredCoordination`
          because the Repair-owned queue sorts by it. For a human delivery the
          lag router applies this projection before Repair's receiver applies
          its escalation latch and emits the popup to the ordered flush, so the
          ownership move in #1257 cannot expose the protected value between
          those steps.
    architecture:
      classification: player-knowledge
      owner: repair-visibility-publisher
      derived_from:
        - authoritative-damage-state
        - repair-team-state
    implementation:
      status: suspected
      paths:

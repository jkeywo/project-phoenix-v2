  - component: host-helm-control-router
    core:
      status: implemented
      confidence: confirmed
      title: Host Helm Control Router
      summary: Authoritative per-entity applier that turns every ship's own admitted thrust, steering, lateral-thrust, and impulse commands into that ship's intent components; a separate shared integrator applies that intent to ship physics and drive state.
      rationale:
        - "Issue #824 (admission symmetry, pasm/spec/RADAR_TARGET_AUTHORITY_AND_ADMISSION.md section 2): process_helm_inputs is per-entity — it loops every ship carrying AdmittedCommands and the intent bundle and applies admitted helm payloads to that ship's intents. An admitted command applies regardless of source: the per-axis operate_ai gates the router used to carry are deleted, because authority is checked once at admission (human tokens at the network gate, the per-axis helm AI's emissions through the shared validate_and_admit seam). Nothing downstream of admission branches on human-vs-AI."
        - "Issue #801 split the helm wire per axis: SetThrust targets the helm-thrust system and SetSteering targets helm-steering, replacing the combined HelmInput payload that targeted a coarse helm system. Admission is therefore per-axis, which fixes the #701 mismatch where a coarse-admitted human HelmInput fought a per-axis AI thrust write. The coarse helm and tactical systems were deleted; every wire target now names a declared system."
        - "Impulse and boost are separate host-owned drive states with their own declared systems since #801: impulse commands target helm-impulse and boost commands target the new helm-boost system. Since #824 the admitted StartImpulseCharge/CancelImpulse loop lives in process_helm_inputs for every ship (with the same BlocksImpulse region gate the human path always had); handle_impulse_messages retains only the LocalShip hull-damage auto-cancel, ordered earlier in the tick so an admitted command can still override it."
        - "Issue #695 split admission from physics integration: the router only writes ThrustInput/SteeringInput/LateralThrustInput/ImpulseCommand/BoostCommand intent components instead of mutating ShipPhysics/ShipImpulse/ShipBoost directly. The shared integrate_ship_physics and apply_helm_commands systems in src/ship_plugin.rs perform the actual integration for any AiHighFidelity ship (the LocalShip and promoted NPCs alike), so the same intent surface serves both the human and helm-ai-operator paths."
        - "The 30 Hz HelmInputTimer sampling gate was deleted by #824: AdmittedCommands is cleared every tick at admission, so a sampling gate would silently drop AI commands emitted on frames the timer skipped. Commands apply the tick they are admitted."
    architecture:
      kind: subsystem
      authority: authoritative
      owns:
        - last-helm-input-state
        - authoritative-ship-motion-state
        - impulse-drive-state
        - boost-drive-state
      reads:
        - last-helm-input-state
        - impulse-drive-state
        - boost-drive-state
      writes:
        - last-helm-input-state
        - authoritative-ship-motion-state
        - impulse-drive-state
        - boost-drive-state
      consumes:
        - helm-input-command
        - lateral-thrust-command
        - start-impulse-charge-command
        - cancel-impulse-command
        - toggle-boost-command
        - set-boost-command
      depends_on:
        - host-command-admission
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths:
        - src/ship_plugin.rs
        - src/ship/helm_admission.rs
        - src/ship/impulse_boost_systems.rs
        - src/ship/physics_systems.rs
        - src/ship/physics.rs
        - src/ship/helm.rs
      symbols:
        - process_helm_inputs
        - handle_impulse_messages
        - handle_boost_messages
        - integrate_ship_physics
        - apply_helm_commands
        - compute_physics
        - ThrustInput
        - SteeringInput
        - LateralThrustInput
        - ImpulseCommand
        - BoostCommand
      messages:
        - SetThrust
        - SetSteering
        - LateralThrustInput
        - StartImpulseCharge
        - CancelImpulse
        - ToggleBoost
        - SetBoost
      tests:
        - cargo test

  - state: last-helm-input-state
    core:
      status: implemented
      confidence: confirmed
      title: Last Helm Input State
      summary: Authoritative cached helm intent mirror for the LocalShip, used by the host for engine telemetry, boost drain, and the viewscreen HUD.
      rationale:
        - "Single writer since #824: host-helm-control-router (process_helm_inputs) mirrors every helm payload it applies — human-admitted and AI-emitted alike — into the LocalShip's LastHelmInput as it writes the intent components, so the thrust/steering pair can never tear between two writers. NPC LastHelmInput deliberately stays at its spawn default so ai_power_allocation's movement rule observes what it observed before the migration."
        - The host stores the latest thrust, steering, and lateral inputs rather than replaying raw control messages every frame.
    architecture:
      classification: authoritative
      owner: host-helm-control-router
      writers:
        - host-helm-control-router
      replicas:
        - helm-lateral-thrust-blackboard-state
        - helm-engine-blackboard-state
    implementation:
      status: declared
      paths:
        - src/ship_plugin.rs
      symbols:
        - LastHelmInput

  - state: authoritative-ship-motion-state
    core:
      status: implemented
      confidence: confirmed
      title: Authoritative Ship Motion State
      summary: Host-owned X/Z position, yaw, forward speed, lateral speed, and roll for the ship helm path.
    architecture:
      classification: authoritative
      owner: host-helm-control-router
      writers:
        - host-helm-control-router
      replicas:
        - helm-status-blackboard-state
    implementation:
      status: declared
      paths:
        - src/ship/state.rs
        - src/ship_plugin.rs
      symbols:
        - ShipPhysics
        - sync_ship_position

  - state: desired-motion-state
    core:
      status: proposed
      confidence: provisional
      title: Desired Motion State
      summary: Ship-local 3D desired-motion contract with desired_velocity_local and desired_facing_local, formed by adding hazard forces to objective travel intent before fine helm systems choose how to actuate it.
      rationale:
        - The intended helm design separates motion intent from actuation so engines, steering, lateral thrust, and vertical thrust can respond according to ship capability.
        - The shared state must be 3D now even though most current ships move in-plane, to avoid hard-coding planar assumptions before bounded and full-3D craft arrive.
        - Desired facing must be split from desired travel so arc-bearing requests, docking, and future broadside behaviors can influence orientation without hijacking movement.
        - Hazard avoidance is a boids-like vector contribution to desired direction and speed, not a direct order to one particular actuator.
    architecture:
      classification: authoritative
      owner: helm-motion-planner
      writers:
        - helm-motion-planner
      readers:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
        - helm-vertical-thrust-ai-operator
      replicas:
        - helm-motion-blackboard-state

  - state: hazard-assessment-state
    core:
      status: proposed
      confidence: provisional
      title: Hazard Assessment State
      summary: Shared per-ship 3D hazard assessment that publishes capability-style hazard facts, force contributions, and per-actuator sensitivity inputs for helm actuation.
      rationale:
        - Collision avoidance should be computed centrally for the ship rather than separately inside each fine-system AI operator.
        - Different fine systems may filter the same hazard picture differently, such as vertical thrust ignoring static terrain while engines still brake for it.
        - Hazard publication should expose reusable facts and capabilities rather than hard-coded object categories so fine systems can apply their own policies.
        - "A ship ignores hazards with a lower size_rating than its own: large ships do not avoid smaller ships at all."
        - Each fine actuator owns its sensitivity to hazard distance and force weighting; those authored sensitivities implicitly determine response priority instead of one global priority ladder.
        - Vertical separation is evaluated for collision and weapon range even when its present visual effect is negligible.
    architecture:
      classification: authoritative
      owner: helm-motion-planner
      writers:
        - helm-motion-planner
      readers:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
        - helm-vertical-thrust-ai-operator
      replicas:
        - helm-motion-blackboard-state

  - state: impulse-drive-state
    core:
      status: implemented
      confidence: confirmed
      title: Impulse Drive State
      summary: Host-owned impulse charge and active-phase state for long straight-line acceleration.
      rationale:
        - "Human helm and helm AI alike start and cancel charge through admitted commands since #824: the AI emits StartImpulseCharge/CancelImpulse through the shared admission seam, and host-helm-control-router applies both sources with no branching on origin."
        - Helm AI decides engage or cancel from doctrine target geometry and configured distance thresholds.
    architecture:
      classification: authoritative
      owner: host-helm-control-router
      writers:
        - host-helm-control-router
      replicas:
        - helm-status-blackboard-state
    implementation:
      status: declared
      paths:
        - src/server_app.rs
        - src/ship/impulse.rs
        - src/ship_plugin.rs
      symbols:
        - ShipImpulse
        - ImpulseState
        - ImpulsePhase
        - tick_impulse
      tests:
        - cargo test

  - state: impulse-manoeuvre-policy-state
    core:
      status: proposed
      confidence: provisional
      title: Impulse Manoeuvre Policy State
      summary: Ship-authored impulse policy that applies a harsh steering multiplier while impulse is active and disables boost during impulse travel.
      rationale:
        - Impulse should not force steering fully to zero; the standard steering multiplier is 0.1 so course correction remains possible but severe.
        - Boost is unavailable while impulse is active, regardless of the ship's normal boost capability.
        - The steering multiplier and any ship-specific override belong in authored capability data rather than executable constants.
    architecture:
      classification: authoritative
      owner: ship-capability-model
      readers:
        - helm-input-arbiter
        - host-helm-control-router

  - state: boost-drive-state
    core:
      status: implemented
      confidence: confirmed
      title: Boost Drive State
      summary: Host-owned boost battery and active-state resource for short high-power helm bursts.
      rationale:
        - Boost is feature-gated by TOML config and does nothing when the ship omits boost configuration.
        - Drain is based on current helm intent, and impulse-active movement drains as full-forward thrust.
    architecture:
      classification: authoritative
      owner: host-helm-control-router
      writers:
        - host-helm-control-router
      replicas:
        - helm-status-blackboard-state
    implementation:
      status: declared
      paths:
        - src/server_app.rs
        - src/ship/boost.rs
        - src/ship_plugin.rs
      symbols:
        - ShipBoost
        - BoostState
        - tick_boost
      tests:
        - cargo test

  - component: helm-blackboard-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Helm Blackboard Publisher
      summary: Host publisher that derives every ship's helm, lateral-thrust, and engine status blackboards from that ship's own authoritative motion and drive state.
      rationale:
        - "Per-entity over Ship since #824, following the publish_weapons_core_blackboard pattern: ship-state fields (position, yaw, speeds, impulse charge, boost state, damage-scaled radar range, engine and lateral entries) are computed for every ship with the missing-component default idiom; player-resource-derived data stays gated on Has<LocalShip> — the LocalShip's base radar range comes from ShipClientConfigResource and the engine joystick fan-out is read from the InterSystemQueue for the LocalShip only, while an NPC's base range comes from its own HelmConsoleSection. NPC helm AI reads the live radar_range from its own entry (helm_ai_radar_range); broadcast stays LocalShip-filtered so NPC entries add zero bandwidth."
        - "The Helm console blackboard is keyed by the helm station id (\"helm\"), not a system id: since #801 \"helm\" names a crew station only, while per-system blackboards such as helm-lateral-thrust keep system-id keys. The wire key strings are unchanged."
    architecture:
      kind: adapter
      authority: authoritative
      reads:
        - authoritative-ship-motion-state
        - last-helm-input-state
        - impulse-drive-state
        - boost-drive-state
      produces:
        - helm-status-blackboard-state
        - helm-lateral-thrust-blackboard-state
        - helm-engine-blackboard-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths:
        - src/console/helm/server.rs
      symbols:
        - publish_helm_blackboard
      tests:
        - cargo test

  - state: helm-status-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm Status Blackboard State
      summary: Per-ship helm snapshot containing motion, live damage-scaled radar range, impulse progress, and boost status; replicated to the client UI for the LocalShip and read in place by each ship's own helm AI.
    architecture:
      classification: replicated
      owner: helm-blackboard-publisher
      derived_from:
        - authoritative-ship-motion-state
        - impulse-drive-state
        - boost-drive-state
    implementation:
      status: declared
      paths:
        - src/core/messages.rs
        - src/console/helm/server.rs
        - gui/console-state.js
      symbols:
        - HelmBlackboard
        - buildHelmConsoleState

  - state: helm-motion-blackboard-state
    core:
      status: proposed
      confidence: provisional
      title: Helm Motion Blackboard State
      summary: Replicated or ship-local 3D motion-planning surface exposing objective velocity, desired facing, avoidance velocity, combined desired velocity, avoidance urgency, and primary hazard identity.
      rationale:
        - The smallest useful shared interface is a local-space velocity-based contract rather than direct thrust or steering commands.
        - Keeping this blackboard 3D allows bounded and full-3D ships to share the same contract even while current consumer logic remains mostly planar.
        - Desired facing belongs beside desired velocity because some helm requests care more about orientation than translation.
    architecture:
      classification: replicated
      owner: helm-motion-planner
      derived_from:
        - desired-motion-state
        - hazard-assessment-state

  - state: helm-lateral-thrust-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm Lateral Thrust Blackboard State
      summary: Replicated lateral-thrust status showing current lateral input, online state, and AI auto status.
    architecture:
      classification: replicated
      owner: helm-blackboard-publisher
      derived_from:
        - last-helm-input-state
    implementation:
      status: declared
      paths:
        - src/core/messages.rs
        - src/console/helm/server.rs
        - gui/console-state.js
      symbols:
        - HelmLateralThrustBlackboard
        - buildHelmConsoleState

  - state: helm-engine-blackboard-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm Engine Blackboard State
      summary: Replicated per-engine thrust and online-state telemetry derived from fine helm-engine systems and joystick intent.
      rationale:
        - Both helm engines receive the same joystick signal and individually gate on damage or AI ownership.
        - Engine damage scales applied thrust in the authoritative motion step before the telemetry is published.
    architecture:
      classification: replicated
      owner: helm-blackboard-publisher
      derived_from:
        - last-helm-input-state
        - authoritative-ship-motion-state
    implementation:
      status: declared
      paths:
        - src/core/messages.rs
        - src/console/helm/server.rs
        - gui/console-state.js
      symbols:
        - HelmEngineBlackboard
        - buildHelmConsoleState

  - component: helm-motion-planner
    core:
      status: proposed
      confidence: provisional
      title: Helm Motion Planner
      summary: Host-side shared motion planner that turns objectives plus world hazards into a 3D desired-motion and hazard-assessment surface for fine helm systems.
      rationale:
        - The intended architecture replaces separate helm and lateral avoidance calculations with a single ship-level planning pass.
        - Fine systems should interpret a shared desired motion field rather than each generating independent avoidance commands.
    architecture:
      kind: service
      authority: authoritative
      owns:
        - desired-motion-state
        - hazard-assessment-state
        - docking-motion-intent-state
      reads:
        - helm-objective-state
        - world-snapshot-state
        - authoritative-ship-motion-state
      produces:
        - desired-motion-state
        - hazard-assessment-state
        - helm-motion-blackboard-state
      runs_in:
        - host-browser-runtime

  - migration: helm-shared-motion-planner-rollout
    core:
      status: proposed
      confidence: provisional
      title: Helm Shared Motion Planner Rollout
      summary: Planned migration from direct-write helm avoidance helpers toward a shared desired-motion and hazard-assessment planning surface.
      rationale:
        - Current helm AI computes steering and lateral avoidance inside separate operators.
        - Intended helm design centralises planning and lets fine systems consume shared movement and hazard intent.
        - Current repository observation is file-level, and several PASM entities share src/ship_plugin.rs. It cannot truthfully attribute helper references inside that file to a specific architectural entity, so this migration retains explicit removal conditions rather than an imprecise caller allowlist.
    migration_plan:
      legacy_entities:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      target_entities:
        - helm-motion-planner
        - helm-vertical-thrust-ai-operator
      temporary_adapters:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
      target_symbols:
        - desired-motion-state
        - hazard-assessment-state
      removal_conditions:
        - predicate: symbol-does-not-exist
          subject: operate_helm
        - predicate: symbol-does-not-exist
          subject: operate_lateral_thrust

  - component: helm-objective-aggregator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Objective Aggregator
      summary: Host-side doctrine scorer that writes helm-relevant scored objectives into the shared viewscreen blackboard.
      rationale:
        - Helm AI does not invent goals locally; it consumes the scored doctrine pool produced earlier in the server tick.
        - The same pool feeds both player Backfill AI and NPC helm AI.
    architecture:
      kind: service
      authority: authoritative
      produces:
        - helm-objective-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths:
        - src/ai/server.rs
      symbols:
        - aggregate_doctrine_blackboards
      tests:
        - cargo test

  - state: helm-objective-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm Objective State
      summary: Scored objective pool carrying helm-relevant Patrol, Reach, Retreat, and Destroy directives for automated helm decisions.
    architecture:
      classification: replicated
      owner: helm-objective-aggregator
    implementation:
      status: declared
      paths:
        - src/ai/server.rs
        - src/core/messages.rs
      symbols:
        - aggregate_doctrine_blackboards
        - ScoredObjective
        - SystemAffinity

  - component: ai-world-snapshot-builder
    core:
      status: implemented
      confidence: confirmed
      title: AI World Snapshot Builder
      summary: Host-side snapshot builder that gathers visible entity data for helm AI navigation and avoidance.
    architecture:
      kind: service
      authority: authoritative
      owns:
        - world-snapshot-state
      produces:
        - world-snapshot-state
      runs_in:
        - host-browser-runtime
    implementation:
      status: declared
      paths:
        - src/ai/server.rs
      symbols:
        - build_world_snapshot
        - WorldSnapshot
      tests:
        - cargo test

  - state: vertical-movement-mode-state
    core:
      status: proposed
      confidence: provisional
      title: Vertical Movement Mode State
      summary: Ship capability declaring whether the craft supports no vertical motion, bounded AI vertical motion, or full 3D six-degree-of-freedom flight.
      rationale:
        - Vertical movement support is ship-specific rather than universal, just like engines, steering, lateral thrust, and boost.
        - Bounded motion provides AI-only above-below avoidance without turning the current player game into full free 3D flight.
        - In bounded mode the ship should return gradually toward its authored cruise plane once avoidance urgency falls, rather than snapping immediately back.
    architecture:
      classification: authoritative
      owner: ship-capability-model
      readers:
        - helm-motion-planner
        - helm-vertical-thrust-ai-operator
        - helm-ai-operator

  - component: ship-capability-model
    core:
      status: proposed
      confidence: provisional
      title: Ship Capability Model
      summary: Intended ship-authored capability surface for optional helm systems, movement modes, and manoeuvre policy.
      rationale:
        - Ships should declare whether they have engines, steering, lateral thrust, vertical thrust, impulse, and boost instead of relying on universal helm assumptions.
        - A ship without engines is a stationary installation through capability data, not a special code path.
        - Capability data also owns impulse steering behaviour, boost availability during impulse, actuator hazard sensitivities, and vertical movement limits.
    architecture:
      kind: service
      authority: authoritative
      owns:
        - vertical-movement-mode-state
        - impulse-manoeuvre-policy-state
      runs_in:
        - host-browser-runtime

  - state: world-snapshot-state
    core:
      status: implemented
      confidence: confirmed
      title: World Snapshot State
      summary: AI-facing 3D snapshot of nearby entities, positions, radii, factions, and motion used by helm steering, avoidance, collision checks, and range evaluation.
    architecture:
      classification: authoritative
      owner: ai-world-snapshot-builder
    implementation:
      status: declared
      paths:
        - src/ai/server.rs
        - src/ai/core.rs
      symbols:
        - WorldSnapshot
        - WorldView
        - AiWorldEntity
        - visible_entities

  - state: pending-arc-bearing-request-state
    core:
      status: implemented
      confidence: confirmed
      title: Pending Arc Bearing Request State
      summary: Host-owned temporary request that biases helm AI steering toward a target until weapons can bear.
      rationale:
        - This is an internal coordination state, not a player-authored objective.
        - Helm AI clears it when the target leaves visibility or some phaser bank arc can already cover the target.
    architecture:
      classification: authoritative
      owner: helm-ai-operator
      writers:
        - helm-ai-operator
    implementation:
      status: declared
      paths:
        - src/ship_plugin.rs
      symbols:
        - PendingArcBearingRequest

  - state: docking-motion-intent-state
    core:
      status: proposed
      confidence: provisional
      title: Docking Motion Intent State
      summary: Docking-specific desired-motion request that may use controlled reverse and lateral translation for close manoeuvres.
      rationale:
        - Arc-bearing requests affect desired facing only; they must not ask slow lateral or reverse thrust to drift into a better firing arc.
        - Docking is the distinct future concern that may legitimately need low-speed lateral and reverse movement, so it receives its own intent now.
    architecture:
      classification: authoritative
      owner: helm-motion-planner
      readers:
        - helm-input-arbiter
        - helm-lateral-thrust-ai-operator

  - state: helm-ai-surfaces-frame-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm AI Surfaces Frame State
      summary: Derived, read-only per-ship helm decision surface — merged world view, scored-objective slice, resolved destroy target, cleared nav waypoint — rebuilt wholesale on every shared AI-helm sim tick and consumed immutably by the four per-axis helm AI systems.
      rationale:
        - "Issue #824's decision-surface seam: one assembly (build_helm_ai_surfaces_frame) replaces the 3-4x per-axis WorldView rebuild, making the identical-inputs invariant true by construction. It carries decision inputs only, never a cached decision — no HelmDecision, no per-axis output another axis could read — so it does not re-create the mini-monolith the per-axis split removed, and it is not a coarse helm controller (#801: helm is a station id; per-axis decision ownership is preserved)."
    architecture:
      classification: authoritative
      owner: helm-ai-operator
      writers:
        - helm-ai-operator
      readers:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
    implementation:
      status: declared
      paths:
        - src/ship/helm_ai.rs
      symbols:
        - HelmAiSurfacesFrame
        - HelmAiShipFrame
        - build_helm_ai_surfaces_frame

  - component: helm-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm AI Operator
      summary: Per-axis AI helm decide systems (ai_helm_thrust, ai_helm_steering, ai_helm_impulse) plus the shared frame assembly, which consume the once-per-tick helm decision surface and emit their per-axis decisions as admitted SystemControlPayloads into their own ship's AdmittedCommands, for the shared host-helm-control-router to apply.
      rationale:
        - "Issue #824 (admission symmetry): the per-axis systems no longer write intent components directly. Each emits SetThrust / SetSteering / StartImpulseCharge / CancelImpulse through the shared command_admission::validate_and_admit seam using its ship's own ai:<uuid> token (AiTokenRegistry-registered for NPCs; a synthetic ai: token for the backfilled player ship), validated against that entity's own ControlSourceResolver. The write into the per-entity AdmittedCommands is direct and same-tick — not a round-trip through the inbound queue, which would add a one-tick lag to every NPC trajectory. Ship-aware admit_system_commands applies the same seam to network ai: tokens, resolving them through AiTokenRegistry to the owning entity's AdmittedCommands."
        - Helm AI does not synthesize human helm messages in the shipped code path.
        - This is a temporary implementation shape relative to the intended design, where fine helm systems should read a shared desired-motion surface and set the same typed actuator inputs a player can set, according to capability.
        - "Issue #801 completed the per-axis split: each system gates on its own declared helm-thrust / helm-steering / helm-impulse system's operate_ai policy. The dead coarse helm fallbacks and helm_control_policy are deleted; a whole-helm judgement (e.g. arc-bearing) derives from the per-axis declarations via helm_axes_operate_ai, never from a coarse system."
        - "Issue #803 decoupled the decision cadence from the host frame rate: all per-axis AI helm systems run only on the shared AI-helm sim tick (see ai-helm-tick-cadence), a determinism prerequisite for P2P lockstep (PRD #620)."
    architecture:
      kind: service
      authority: authoritative
      owns:
        - pending-arc-bearing-request-state
        - helm-ai-surfaces-frame-state
      reads:
        - helm-objective-state
        - world-snapshot-state
        - authoritative-ship-motion-state
        - impulse-drive-state
        - pending-arc-bearing-request-state
        - helm-ai-surfaces-frame-state
      writes:
        - pending-arc-bearing-request-state
        - helm-ai-surfaces-frame-state
      depends_on:
        - host-command-admission
      runs_in:
        - host-browser-runtime
    implementation:

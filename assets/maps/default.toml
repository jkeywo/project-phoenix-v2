default_scenario = "assets/scenarios/default.toml"
extra_scenarios  = ["assets/scenarios/patrol.toml"]

[global]
seed = 42

[anchors]
starbase_alpha = [500.0, 0.0, 0.0]
# Patrol waypoints used by assets/scenarios/patrol.toml
patrol_alpha   = [300.0, 0.0, -300.0]
patrol_beta    = [-300.0, 0.0, -200.0]
patrol_gamma   = [0.0, 0.0, -500.0]

[[entity]]
template_path = "assets/entities/star_sun.toml"
position = [0.0, 0.0, 0.0]

[[entity]]
template_path = "assets/entities/planet_earth.toml"
id = "earth"
position = [200.0, 0.0, 200.0]

[[entity]]
template_path = "assets/entities/asteroid_field_main.toml"
position = [0.0, 0.0, 0.0]

[[entity]]
template_path = "assets/entities/player_ship.toml"
id = "player-ship"
position = [150.0, 0.0, 0.0]
spawn_on = "game_start"

[[entity]]
template_path = "assets/entities/region_nebula.toml"
id = "nebula-1"
position = [300.0, 0.0, -200.0]

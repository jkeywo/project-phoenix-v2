  - component: roadmap-demo-readiness
    core:
      status: accepted
      confidence: confirmed
      title: Measured Demo Combat, Asset, Terrain, and Onboarding Readiness
      summary: "After #849, #869, #870, and Combat Test doctrine closure, use completed #835 reports to rebalance Combat Test, establish representative performance baselines (#868), replace overlapping asteroid spawners with one weighted deterministic density field, move mesh LOD ownership to model sidecars with a repeatable asset workflow, and add contextual station tutorials (#850)."
      rationale:
        - Performance evidence, terrain readability, asset budgets, and onboarding are demo-quality concerns and must be resolved alongside tactical balance.
        - "#868 begins with non-blocking reproducible baselines; only the agreed demo budgets and regressions become release evidence."
        - "#868's measurement contract is the fleet's vellum-perf crate, which was written to this PRD's shape; phoenix adopts it and builds only the collectors, baseline files, asset-budget extraction, and reporting that the crate excludes by charter. This roadmap has no separate performance-workflow component: baselines belong to demo readiness."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      coordinates: [asteroid-field-lifecycle, entity-template-schema-validator]
      runs_in: [host-browser-runtime, headless-runtime, node-tooling-runtime]

  - component: roadmap-snapshot-contract-tracer
    core:
      status: accepted
      confidence: confirmed
      title: Snapshot Contract and Demo Tracer Bullet
      summary: "Pre-demo. Define the versioned authoritative snapshot boundary and deliver the bounded Combat Test capture/restore tracer (#848/#862) while the demo is still one scenario. The consequence, scenario, slot, export, and campaign adapters follow post-demo (see roadmap-authoritative-snapshots; all but save-slot UX #865 are now delivered), before any of them carries campaign content."
      rationale:
        - The snapshot contract now builds on #849's logical tick and command log, informing scenario data and later P2P without making save UX a first-demo release gate.
        - Stable content IDs and an authoritative-only boundary prevent browser, renderer, and session state leaking into future persistence.
        - "The envelope, the version gate, and the storage abstraction come from the fleet's vellum-save crate rather than a phoenix format; phoenix owns the snapshot payload and the host wiring. #849 now precedes this tracer, so captured world state can be tied to the established logical tick and command-log boundary."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      produces: [world-snapshot-artifact]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: post-demo-release-bands
    core:
      status: accepted
      confidence: confirmed
      title: Post-Demo Content Track C1-C9 and Technical Track T1-T6
      summary: "Post-demo work proceeds through two parallel tracks (2026-08-20 restructure of the former A2/B-I ladder). CONTENT — C1: cruiser readiness (#1080-#1083) and the Falling Skyway AI-backfill completion (#1129: scenario re-author + AI Scan/Operate/Order verbs). C2: Borrowed Sun, fields/epistemics, complexity ladder (#1016/#1017/#858). C3: Narrow Season, physical/relative space, docking, courier readiness (#1018/#859/#877). C4: Broken Tithe, resource networks, deep Engineering, battleship readiness (#1019/#860). C5: Silent Corridor, Tactical/Sensors/EWar depth, ship-customisation MVP (#1020/#861/#1091). C6: an authored Patrol MVP, discrete warp, databases, refit/rewards (#1021). C7: an authored War MVP, Pursuit, allies and the personnel/Operations vertical (#1094). C8: shared Patrol/War PCG, Orbital Mode and accessibility-aware generation (#1095). C9: Sandbox, coarse living economy, standing, sector/fleet state and alternative participation (#1096). TECHNICAL — T1: Bridge Foundations Crew Control (#1092) and Native/Network (#1093), Distributed Ship Operations (#1143), debug observability for scenario/AI state and station activity, and the current defect backlog (#1045-#1049, #929). T2: GM console M1-M3 (#930), mod content packs (#856/#910) and save-slot lifecycle UX (#865). T3: GM console M4-M5. T4: GM console M6-M8 including the integrated Workshop/Live Inspector. T5: the multi-ship host mesh scale-up (#1086 scenario-state digest widening, #1090 many-instance protocol proof, #1153 multi-ship scenario authoring), deliberately resequenced after the GM/Workshop investment; the two-host protocol itself ships with T1's #1093 (#1116-#1120). T6: GM console M9 campaign continuity and deep pacing."
      rationale:
        - Each CONTENT band is a shippable public build, not a paper milestone, pairing playable content with the features it needs, a visual/UX polish pass and an accessibility increment. TECHNICAL bands are not releases; their work merges into whichever content release is next — but each technical band carries its own polish/accessibility PRD for the operator- and setup-facing surfaces it ships (see roadmap-release-polish).
        - "The hull rollout is deliberately one at a time — destroyer (A), cruiser (C1), courier (C3), battleship (C4) — so tutorials, doctrine, and balance evidence land together per hull instead of as a single catalogue-wide push."
        - "The #848 adapters are consumed where needed: Falling Skyway's consequence and scripted-progression resume (#863/#864) landed in A, portable import/export (#866) and campaign-continuity projection (#867) are delivered, and only save-slot lifecycle UX (#865) remains, scheduled in T2."
        - "Defects are normally fixed as they arise outside these bands. One-time exception recorded 2026-08-20: the accumulated backlog (#1045-#1049 script/composition defects, #929 torpedo tick defect) is scheduled into T1 as a cleanup batch; new defects continue to be fixed as they arise."
        - "2026-08-13 decision (Starship Simulator Genesis review): missions 2-4 each gain a paired foundation PRD mirroring the #851/#852 pattern, threading a physical-world simulation layer through C2-C4 rather than deferring it past the campaign. Platform capabilities stay in their bands; the bands get longer. Foundation PRDs are written just-in-time as each band starts. Scope guard: pasm/spec/design/simulation-differentiation.yaml."
        - "2026-08-20 track split: content and technical work no longer gate each other band-by-band. GM console and Workshop/modding (T2-T4) deliberately precede the multi-ship host mesh (T5) — the GM transport gates (#1114, #1116-#1118) live under T1's #1093, not the mesh. Consequence: C2 Borrowed Sun ships what is achievable without the mesh (single-host multi-crew); its multi-ship variant waits on T5."
    architecture:
      kind: roadmap-release-bands
      authority: non-authoritative
      reads: [world-content-pack-state]
      runs_in: [host-browser-runtime]

  - component: roadmap-band-a2-crew-control
    core:
      status: accepted
      confidence: confirmed
      title: "T1 — Crew Control Foundation"
      summary: "The first of two Bridge Foundations PRDs, scheduled in technical band T1 immediately after release A. Add an auxiliary human-seeking Command station, normally hosted by Captain through hull data, that lists AI-controlled stations and selects an authored stance for each at station rather than fine-system scale. Generalise human seeking from individual systems to complete station surfaces with finite compatible fallback lists, authored visiting ratings and a shared Hero Bar presenting stable station tabs, selected-station identity/rating/health, per-tab health and separate off-screen importance alerts. Migrate Comms and Navigation. Also add an explicit Spectator role with one crew-public summary screen, readiness exclusion and manual claiming of eligible open stations, plus an AFK setting that delegates all systems on a retained player station and relocates human-seeking stations until the player returns."
      rationale:
        - "PRD published as #1092; it is the Crew Control sibling of #1093 in T1 — Bridge Foundations (the band formerly named A2). PRD #1143 (Distributed Ship Operations — Crew-Driven Systems) is registered alongside them in T1."
        - "Command must land before the more elaborate C2-C5 missions because a small crew needs to direct aggregate AI station behavior without operating every fine system. It is an auxiliary data-authored human-seeking station, not hard-coded to Captain or required to create another claimable seat."
        - "Every stance declares whether it persists behind human control or resets to the alert-appropriate neutral stance. An objective stance disappears and falls back immediately when its objective becomes invalid. Alert changes switch neutral-to-neutral only and never overwrite an explicit stance."
        - "When no human controls Command, its AI operator selects from the same stance catalogue using current knowledge and authored policy. Human-held stations see intent but are not constrained by it."
        - "AFK changes control source without relinquishing ownership. An AFK or disconnected direct holder is temporarily ineligible for station hosting; their human-seeking station relocates as a complete surface and returns intact when the holder becomes active."
        - "The spectator MVP is deliberately one summary surface. Selectable authorised system monitors remain accepted but unscheduled."
        - "T1 starts the accessibility programme while these seams are already changing: a shared Accessibility settings tab, private effect-named profile, anonymous station/rating eligibility result, per-function assistance schema, keyboard/focus Hero Bar semantics and persistent non-colour health/importance cues. The resolver receives functional eligibility, never the player's settings or reasons."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [ship-station-system-topology-state, system-control-source-state, session-station-ownership-state, fine-system-ai-policy-state]
      coordinates: [fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-band-a2-native-network-foundation
    core:
      status: accepted
      confidence: confirmed
      title: "T1 — Native and Network Foundation"
      summary: "The second Bridge Foundations PRD front-loads typed human-readable client/server join codes, a Phoenix rendezvous service over WebSocket, direct or TURN-relayed WebRTC data transport, synchronised host disconnect/Backfill/recovery and a true Windows native host. The native process runs the authoritative simulation, renders the viewscreen through native Bevy/wgpu and presents isolated Ultralight player panes across full-screen monitors, with one or two stations per station monitor, independently captured touch, reusable bridge profiles and per-surface camera/microphone/output setup."
      rationale:
        - "PRD published as #1093; it is the Native and Network sibling of #1092 in T1 — Bridge Foundations (the band formerly named A2)."
        - "Client and server codes use separate project GUID namespaces, one compatible-release version GUID and five-letter suffixes. Every ship host owns a private client code; the fleet-wide privileged server code admits hosts before mission start and restores disconnected fixed ship slots afterwards."
        - "Mission start freezes player-ship slots and loadouts. A disconnected host's ship transitions at an agreed tick to ordinary Backfill on the remaining peers; a replacement machine may reclaim only a disconnected slot and receives the shared snapshot/history."
        - "Phoenix replaces PeerJS rather than layering more product behavior onto its public broker. Secure WebSocket owns rendezvous/signalling; WebRTC DataChannels retain direct game paths and WebRTC media tracks remain available for the unscheduled one-to-one ship-call feature. Managed TURN and diagnostics are required for public Wi-Fi, hotspots and mobile networks."
        - "Each native pane is an isolated player identity and obeys the same admission and projection contracts as a browser client. The browser route remains complete. T1 proves device enumeration, per-surface assignments and local preview/tests but does not ship inter-ship media."
        - "Accessibility preferences belong to each private player/pane profile rather than the physical bridge profile. Web and native panes share settings, use OS text/contrast/motion preferences as defaults, support explicit overrides, preserve one/two-pane layouts under text scaling and provide keyboard/mouse routes for touch-oriented setup."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-snapshot-artifact, session-station-ownership-state, ship-station-system-topology-state]
      coordinates: [roadmap-p2p-multiship-delivery, native-delivery-host, delivery-version-pin]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]

  - component: roadmap-band-a2-falling-skyway-ai-backfill
    core:
      status: accepted
      confidence: confirmed
      title: "C1 — Falling Skyway AI-Backfill Completion"
      summary: "Make Falling Skyway require real interaction, then give the AI the verbs to complete it semi-reliably. The scenario is re-authored as a 25-minute interleaved mission (survey beat of three scans plus a Control report, strike/storm/rescue/window threads each posting on their own trigger with no act gates, passive availability escalating on timers, a ×4 clock, and the clean-ledger good ending computed over the #1042 transfer ledger; see docs/falling-skyway-ai-backfill.md). The AI-surface batch then extends AiDirective with the Scan/Operate/Order kinds consumed by newly-affined SystemAffinity emitters just as Comms consumes Hail, so a fully-backfilled crew achieves 80-95 % completion on the mandatory objectives across seeds where today's AI manages almost none. Measurement is a per-objective status rollup in the headless report driven through scripts/balance-runs.mjs."
      rationale:
        - "The current scenario passes Act 1 green with an idle crew and settles the strike by first-pick accident, so it proves nothing about Backfill; the FS-3 re-author flips every narrative beat into engaged crew work before the AI-verb batch is justified."
        - "Humans and AI stay symmetric by construction: the new directives ride the existing scored-objective pool, and emitters are objectives-driven so the objective itself names the verb and target each system should serve."
        - "The 80-95 % completion interval is the agreed target on the mandatory set, with today's AI near 0 % as the regression baseline; balance-runs.mjs is the seeded sweep harness that measures it."
        - "Scoped separately from scenario tuning per the FS-4 decision: the scenario edit (issue #1044 suite) and the AI-surface work are independent batches, both landing in content band C1 (moved from the former A2 by the 2026-08-20 track split — this is scenario work, paired with the cruiser). The AI observability it depends on for tuning ships from T1's roadmap-debug-observability."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, world-content-pack-state, fine-system-ai-policy-state, system-control-source-state]
      coordinates: [roadmap-falling-skyway-foundation, roadmap-falling-skyway-content, roadmap-band-a2-crew-control, fine-system-ai-policy-runtime]
      runs_in: [host-browser-runtime, headless-runtime, node-tooling-runtime]

  - component: roadmap-debug-observability
    core:
      status: accepted
      confidence: confirmed
      title: "T1 — Debug Observability for Scenario State, AI State, and Station Activity"
      summary: "Make the running simulation inspectable. Replace the four pre-formatted-text debug overlays with one structured serde-JSON debug payload schema consumed by the host-page debug dock, the headless report/ndjson, and chart tooling, target-agnostic across browser host, headless and the native host, with demo builds continuing to cfg-strip it. Scenario surface: the flags table, the objective table (id/status/score/directive), pending triggers plus a trigger fire history capturing predicate values at fire time, the delayed-action and deadline queues, and the commitments board and comms dossier state; Rhai runtime internals stay out. AI surface: the per-ship ScoredObjective doctrine pool (candidate scores, chosen directive, target resolution) and a per-host fine-system view over the 19-host ai_flag_hosts registry (current policy state, memory, last transition, blocking guard), with LogCat::Ai populated across src/ai/ and src/console_ai/ so --log ai=debug --log-entity produces decision traces; directive changes and target reselections are structured log events from which a timeline is extracted on demand. Station activity: always-on per-station per-bucket command counters (15s default, configurable) split by control source at command admission, charted live in the debug dock and as a per-station table in the balance report."
      rationale:
        - "PRD published as #1144. Scheduled in T1 (2026-08-20 grill), unordered against #1092/#1093. The C1 Falling Skyway AI-backfill tuning is the first consumer of the AI visibility, and every later technical diagnosis benefits."
        - "The payload schema is the shared substrate the GM console M6 Live Inspector (T4) later builds on: the GM adds authorization and presentation, never a second inspection pipeline."
        - "The gap is structural, not incidental: FlagStore, ObjectiveManager, pending triggers and the delayed-action queue have no read path beyond the opaque snapshot and the one-way sim digest; ScoredObjective crosses the wire every tick and is rendered nowhere; LogCat::Ai is a built and tested filter with no emitters; the four existing overlays are wasm+server-only strings that cannot be filtered, charted or diffed."
        - "Station-activity counters are always-on because they are a few integers per station and feed the balance report; rendering stays flag-gated. Counts split human/AI at the admitted-command path both control sources already share, which is what makes the chart read as crew-busyness evidence for Backfill and crew-control tuning."
        - "Capture must not perturb the simulation: payloads are read-only projections off authoritative state on the existing debug cadence, and the bounded-history primitive (crates/phoenix-math/src/bounded_history.rs) backs the fire-history and timeline buffers."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, spawned-entity-state, fine-system-ai-policy-state, system-control-source-state, sim-rng-state]
      coordinates: [fine-system-ai-policy-runtime, roadmap-band-a2-crew-control]
      runs_in: [host-browser-runtime, headless-runtime, native-host-runtime, node-tooling-runtime]

  - component: roadmap-scenario-scripting
    core:
      status: accepted
      confidence: confirmed
      title: Rhai Scenario Scripting
      summary: "Release A, ahead of Falling Skyway. Embed the fleet's deterministic Rhai sandbox (vellum-script) so scenario logic is authored as script while TOML keeps the declarative spine: registered host functions push onto a per-call effect buffer that drains into the existing ActionCmd boundary, FlagStore stays the only mutable state behind a sugared `flags` type, script registrations build the same Trigger structs the TOML front-end builds, and comms dialogue trees become named functions instead of nested tables. Surviving worlds convert; test-infrastructure worlds convert last as a control group, after which the declarative trigger evaluator is deleted. DELIVERY (2026-08): milestones M0-M5 shipped as a DORMANT host seam under `src/world/script/` (recorded as delivered architecture in architecture/scenario-scripting.yaml) — the engines, effect/flag boundary, trigger and comms front-ends, scheduling, loader, cross-reference validation, and editor authoring registry all exist and are validated. M6 (content conversion and activation wiring, #984) landed within release A rather than slipping to band B: every world — the 13 test-infrastructure worlds, `default`, and `combat_test` — is `[script]`-authored, with the effects API, the `flt()` fractional-data marker and live comms dispatch. M7 (#985) then deleted the declarative front-end: the `[[trigger]]` and `[[comms]]` parsers, `Trigger`'s action payload and the pipeline arm that dispatched it, the comms template/follow-up runtime, the layer trigger-merge, and the parallel `handle_respond_to_message` arm. There is one scenario front-end and one applier; a world that still authors a declarative block is refused at load by name."
      rationale:
        - "Authoring has outgrown the format: a 35-field stringly-typed RawActionEntry, three hand-maintained dispatch surfaces (world/dispatch.rs, the parallel match in console/comms/server.rs, and editor/action-schema.js), triplicated triggers because there is no elif, and comms nesting that reaches eight-segment table paths and localization keys."
        - "It runs early in release A because Falling Skyway is the first real content authored post-demo: landing scripting after it would author mission 1 in a departing format and pay the conversion twice, setting the crisis-world toolkit's authoring patterns on the wrong base."
        - "It also precedes mod content packs (#856), which would carry executable script — vellum-script's deny-by-default profile (no eval, no imports, no module resolver, no wall clock, bounded operations) becomes the pack trust boundary, and defining the pack format once with it included beats widening it afterwards."
        - "The split follows vellum's charter: the sandbox and call seam come from vellum-script unchanged, and the vocabulary — host functions, effect buffer, loader, span mapping, cross-reference validation — stays in phoenix. The one contribution back is a wasm32 build job in vellum's CI, which proves the sandbox on phoenix's target without widening its API."
        - "Determinism constraints are inherited, not negotiated: integer-only arithmetic (no_float), operation limits rather than timeouts, fixed per-call and per-tick budgets so every peer fails on the same tick, and deferred work represented as serializable (tick, fn_name) pairs rather than live closures."
        - "The editor becomes a script editor and action-schema.js is deleted (done at M7); sequencing against template-aware editing (#910) is deliberate, since both touch the editor shell in the same band. The fallback (slipping content conversion and evaluator teardown past release A) was authorised but never needed — the host seam, trigger front-end, scheduling, and comms work could not slip regardless, because Falling Skyway depends on them."
        - "DELIVERED as planned, and then some: the split held and the fallback was not needed. M0-M5 shipped as a dormant seam; M6 (#984) activated it and converted every world; M7 (#985) deleted the declarative front-end it replaced. The parallel-dispatch mandate in architecture/trigger-pipeline.yaml is retired with it — there is one applier now, reached from one call site per consumer, so per-variant equivalence is structural rather than a contract a test can protect. Each step was gated on the six-world headless digest sweep, byte-identical throughout."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, world-content-pack-state]
      coordinates: [roadmap-falling-skyway-foundation, roadmap-mod-content-packs]
      runs_in: [host-browser-runtime, headless-runtime]

  - component: roadmap-falling-skyway-foundation
    core:
      status: accepted
      confidence: confirmed
      title: Falling Skyway Scenario Foundation
      summary: "Release A. Add the smallest reusable crisis-world toolkit needed by Falling Skyway: schedules, civilian routes/orders, external operations, infrastructure condition, basic commitments, and player-known Comms dossiers (#851)."
      rationale:
        - The scenario must use reusable world capabilities and existing ship systems, not bespoke station minigames.
        - Falling Skyway deliberately introduces only the campaign's early simulation layers; later evidence, network, authority, and cascade systems arrive with missions 2-5.
        - "This runs after the demo, not before it: #863 and #864 land first so the toolkit's persistent state is authored against adapters that already exist."
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-configuration-state, spawned-entity-state, world-snapshot-artifact]
      runs_in: [host-browser-runtime]

  - component: roadmap-falling-skyway-content
    core:
      status: accepted
      confidence: confirmed
      title: Falling Skyway — First Thin Margin Scenario
      summary: "Release A. Author the first 30–60 minute Thin Margin mission: damaged skyhook and fuel depots, worker strike, corporate security, radiation storm, civilian traffic, constrained transfer window, altered-record evidence, and a consequential safe-passage decision (#852)."
      rationale:
        - This is release A's narrative scenario, the first content the public build gains after the Combat Test demo. It is not #398, Before the Fire.
        - Its outcomes are self-contained while remaining compatible with the delivered campaign-continuity projection (#867).
    architecture:
      kind: roadmap-milestone
      authority: authoritative
      reads: [world-content-pack-state, world-configuration-state]
      coordinates: [roadmap-falling-skyway-foundation, world-content-pack-catalog]
      runs_in: [host-browser-runtime]

  - component: roadmap-demo-release
    core:
      status: accepted
      confidence: confirmed
      title: Limited Browser Demo Release
      summary: "Publish Combat Test only, with the Alliance Destroyer as the only playable hull, through a manual Cloudflare Pages deploy of the curated catalogue (#931), with production-build and smoke gates, performance evidence, and documented multi-device/multi-role playtests (#853)."
      rationale:
        - The demo validates the core bridge experience before Cloudflare caching, native distribution, P2P, and campaign breadth broaden the support surface.
        - "Scope narrowed on 2026-07-31 and recorded on #853: Falling Skyway and the other three hulls move to the post-demo release bands so the first public build ships on one proven scenario."

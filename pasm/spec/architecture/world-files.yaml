        - "[ai] IT COPIES THE TRACTOR'S SHAPE (rule 10). A pure Bevy-free `mating` module owns the geometry - the nearest viable dock-marker pair and the pose that mates it, unit-tested in isolation with plain glam types - and a `server` adapter gathers the live world, calls in, and applies what comes back, deciding nothing itself. The dock is a first-class helm `[[system]]`: it declares a power group, carries a damage entry, is admission-gated, registers as an admitted consumer and publishes under its own system id."

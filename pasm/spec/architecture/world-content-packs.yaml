entities:
  - component: world-content-pack-catalog
    core:
      status: implemented
      confidence: confirmed
      title: World Content Pack Catalog
      summary: Catalogues the authored root scenarios and their loadable supporting world files without treating content identity as a generic world-runtime concern. The selectable root set is declared explicitly in the base scenario manifest (assets/scenarios.toml).
    architecture:
      kind: content-catalog
      authority: authoritative
      owns: [world-content-pack-state]
      reads: [world-configuration-state]
      produces: [world-content-pack-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/scenarios.toml, assets/worlds/default.toml, assets/worlds/combat_test.toml, assets/worlds/before_the_fire.toml]

  - component: base-scenario-manifest
    core:
      status: implemented
      confidence: confirmed
      title: Base Scenario Manifest
      summary: Assets-root scenarios.toml manifest that explicitly lists regular selectable root worlds using the same schema as a mod-pack scenario manifest. Parsed and validated with source-located findings, and used to build the pre-load scenario/ship catalog before any world is activated.
    architecture:
      kind: content-catalog
      authority: authoritative
      produces: [world-content-pack-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/scenarios.toml, src/world/manifest.rs, src/server/bridge.rs]
      symbols: [Manifest, ScenarioEntry, parse_manifest, validate_manifest, ScenarioCatalog, build_catalog]
      tests: [cargo test]

  - state: world-content-pack-state
    core:
      status: implemented
      confidence: confirmed
      title: World Content Pack State
      summary: "The authored catalog: default, combat_test, and before_the_fire are selectable root worlds; patrol, reinforcements, btf_path_a, btf_path_b, btf_path_c, and btf_aphelion_protocol are composition content loaded by worlds or their triggers."
    architecture:
      classification: authoritative
      owner: world-content-pack-catalog
      writers: [world-content-pack-catalog]
    implementation:
      status: declared
      paths: [assets/worlds, src/world/manifest.rs, src/world/config.rs]
      # The catalog listing is Manifest/ScenarioCatalog (see
      # base-scenario-manifest); WorldConfig is the parsed per-world content
      # each catalog entry resolves to once loaded.
      symbols: [Manifest, ScenarioCatalog, WorldConfig]

  - component: default-world-content
    core:
      status: implemented
      confidence: confirmed
      title: Default World Content
      summary: Starbase Alpha defence content with authored celestial terrain, player ship, patrol entities, objectives, triggers, and Comms.
    architecture:
      kind: content-pack
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [world-file-parser, world-layer-runtime]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/worlds/default.toml]

  - component: combat-test-world-content
    core:
      status: implemented
      confidence: confirmed
      title: Combat Test World Content
      summary: Selectable eight-wave Starbase Alpha defence content. Waves spawn on a fixed mission-clock timer (issue #960), not death-gated; every hostile hull commits to attacking the player-faction Starbase Alpha; victory and defeat gate on the field being cleared after all eight waves have spawned, on the Starbase's destruction, or on the player ship's destruction.
      rationale:
        - "Issue #960/#892 (combat-scenario redesign, ratified 2026-08-05): waves are TIMED, not death-gated. Each wave hangs off its own on_timer at authored after_secs (~45s apart, chosen against Harrow transit time), replacing the previous on_all_destroyed chain where wave N+1 spawned on wave N's death — now only game-over is delay-gated. The wave clock measures from mission start through the trigger pipeline's mission-clock anchor (see trigger-pipeline.yaml world-event-collector), so the cadence is authored data with nothing in Rust knowing it."
        - "Every wave hull carries the same two-entry doctrine override on top of its template's own untargeted Destroy: assault-starbase (Destroy @50, target world.entity.starbase_alpha.name) and close-on-starbase (Reach @35, the run-in to the assault anchor) — so a wave that has not yet acquired a target still flies toward the objective rather than drifting at its spawn anchor. Starbase Alpha is a FEDERATION (player-faction) entity since issue #936 (station_axiom.toml authors the faction); it was factionless, which let hostiles ignore it. The world flips the Federation<->Harrow relationship hostile on world-load, before the first wave's first acquisition tick, so wave 1 engages immediately rather than drifting past as a neutral patrol."
        - "The engagement band is authored content, not code. Every Harrow spawn overrides [weapons_console.radar] range = 200 (the hull templates author no radar block, which ai_target_selection reads as an UNBOUNDED horizon), so a hostile engages only what it can see inside 200 units — the Starbase under its assault order, or the player once fire has zeroed that order — and disengages back onto its close-on-starbase run-in beyond 200. The other half of the band is the Alliance captain fragment's alert_on_hostile_within = 150 against every Alliance gun's min_alert_to_fire = 1 (a Harrow authors min_alert_to_fire = 0 and is always armed). So across the 200->150 band the Harrow acquires and fires first while the player's guns stay locked until the captain calls red alert, which the player reaches by closing to 150 or by taking a hit (damage starts secs_since_combat). Both numbers are content — widen the band by raising the 200 here, or make the fleet twitchier by raising the 150 there. The 150-alert half is specced in data-driven-fine-system-ai.yaml (issue #912)."
        - "Victory is one on_all_destroyed over the dynamic hostiles group, guarded by counter(waves_spawned) >= 8 so clearing the field early does not win while waves are still unspawned — replacing the retired per-tier victory group name lists, whose unregistered names had left the waves group empty and victory unreachable. Defeat is Starbase Alpha destroyed -> game_over DEFEAT, or the player ship destroyed via the built-in hull-damage GameOver latch. Authored ship-power tier gates survive only as BONUS reinforcements (extra hulls gated on ship_power >= 90 / >= 100), not as wave gating."
    architecture:
      kind: content-pack
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [world-file-parser, world-trigger-action-dispatcher]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/worlds/combat_test.toml]

  - component: before-the-fire-world-content
    core:
      status: implemented
      confidence: confirmed
      title: Before the Fire World Content
      summary: Selectable Axiom System investigation content whose narrative progression loads the BTF path and protocol sub-worlds.
    architecture:
      kind: content-pack
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [world-file-parser, world-layer-runtime]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/worlds/before_the_fire.toml]

  - component: loadable-world-content-library
    core:
      status: implemented
      confidence: confirmed
      title: Loadable World Content Library
      summary: Supporting patrol, reinforcements, BTF path, and Aphelion Protocol worlds that are loaded additively through extra_worlds or trigger actions instead of becoming selectable roots.
    architecture:
      kind: content-pack
      authority: authoritative
      reads: [world-content-pack-state]
      coordinates: [world-layer-runtime, world-trigger-action-dispatcher]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [assets/worlds/patrol.toml, assets/worlds/reinforcements.toml, assets/worlds/btf_path_a.toml, assets/worlds/btf_path_b.toml, assets/worlds/btf_path_c.toml, assets/worlds/btf_aphelion_protocol.toml]

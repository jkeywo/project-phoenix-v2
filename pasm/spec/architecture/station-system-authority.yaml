  - component: station-rating-controller
    core:
      status: implemented
      confidence: confirmed
      title: Station Rating Controller
      summary: Applies a station holder's selected rating and its configured automated systems to the authoritative control-source state, including a valid rating change during an active round, and seeds every freshly spawned hull's ratings and control sources through one shared boot path.
      rationale:
        - "Issue #871 (3394578e) introduced ship::rating::seed_boot_ratings as the ONE boot path for every hull, player or NPC. It takes a per-station rating chooser: the player game-start path passes the lobby-chosen rating for a manned station and Backfill for an unmanned one, while the generic entity spawner passes Backfill for every station. The blanket loop that used to set every declared system to Ai in entities::spawner is deleted — it worked only while NPC hulls declared no stations, and once they do a system's control source has to come from its station's rating exactly as it does on a player hull, or a human taking an NPC seat could never be admitted."
        - "seed_boot_ratings runs TWO passes and the second is load-bearing: after every station applies its rating, every ai_only system is set to Ai. Those systems are ownerless by construction, so no station rating can reach them, and without the pass they would fall to ControlSourceResolver's Human DEFAULT and silently stop being AI-operated. A hull with no stations at all still comes up fully AI for the same reason."
        - "Behaviour preservation was the governing criterion for #871 and is pinned two ways: a test parses every shipped hull, runs the shared seed with nobody connected, and asserts every system comes up AI-operated and closed to human input — precisely what the old blanket loop produced — and the balance matrix is byte-identical across 192 duel runs (same win rates, same time-to-kill at every quantile, same damage margins)."
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [active-station-rating-state]
      writes: [system-control-source-state]
      reads: [ship-station-system-topology-state, session-station-ownership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/rating.rs, src/ship_plugin.rs, src/lobby/handler.rs, src/entities/spawner.rs, src/server_app/world_setup.rs]
      symbols: [apply_rating, seed_boot_ratings, ai_only_systems, BACKFILL_RATING]
      messages: [SetStationRating, RatingChanged]
      tests: [cargo test]

  - state: active-station-rating-state
    core:

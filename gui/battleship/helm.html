<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.battleship_helm.doc_title">Project Phoenix — Helm Console</title>
  <script src="../bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
    .ctrl-col { min-height: 0; display: flex; flex-direction: column; gap: 12px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    ph-helm-radar, ph-helm-joystick { flex: 1; min-height: 0; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body { grid-template-columns: 1fr; gap: 8px; } .ctrl-col { padding: 8px; } }
    /* Landscape used to float the title row as a bar over the top of the chart
       so the scope kept the panel's whole height, with the control column
       pushed clear of it. Issue #1374 deleted the title row, so the chart has
       that height outright and the column needs no offset: what survives here
       is only the radar's own sizing.

       The radar takes its width from its (definite) height, so a bare `1fr`
       track picks that width up as its automatic minimum and the grid overflows
       its container. `minmax(0, 1fr)` is what lets the track shrink below that;
       the max-width clamp then letterboxes the radar rather than pushing the
       controls out. */
    @media (orientation: landscape) {
      .console-body { grid-template-columns: minmax(0, 1fr) 300px; }
      ph-helm-radar { width: auto; height: 100%; aspect-ratio: 1 / 1; max-width: 100%; max-height: 100%; justify-self: center; isolation: isolate; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Helm Console" data-i18n-attr="data-screen-label:console.helm.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup. The contact count the footer carried is the readout at the
           head of the control column the automation badge belongs to. -->
      <div class="console-body">
        <ph-helm-radar id="helm-radar"></ph-helm-radar>
        <div class="ctrl-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="helm-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-helm-radar.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/battleship/helm.console.js (issue #1235): the
    // shared Helm renderer + this hull's variant (no lateral joystick, plain
    // contact-count footer, no bespoke tail). s is a HelmConsolePayload — see
    // the @typedef in gui/console-state.js. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './helm.console.js';
    initConsole({ name: 'helm', render: renderStation });
  </script>
</body>
</html>

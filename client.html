<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <!-- Prevent the entry HTML from being cached so users always pick up the
       latest Trunk-hashed JS/WASM filenames after a deploy. The hashed
       assets themselves remain cacheable forever via their content hash. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Project Phoenix � Console</title>
  <!-- Keep rAF-driven UI (scheduleRender, radar sweeps, joystick decay in
       the console iframes) running at full rate even when this tab loses
       focus � see gui/bg-raf-keepalive.js. Must load before any other
       script calls requestAnimationFrame. -->
  <script src="gui/bg-raf-keepalive.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Pure-function helpers shared with Vitest unit tests (issue #439, #440, #441). -->
  <script type="module" src="gui/phase-toggle.js"></script>
  <script type="module" src="gui/tab-bar.js"></script>
  <script type="module" src="gui/single-station.js"></script>
  <script type="module" src="gui/help-panel.js"></script>
  <script type="module" src="gui/console-registry.js"></script>
  <script type="module" src="gui/console-resolver.js"></script>
  <script type="module" src="gui/content-switcher.js"></script>
  <script type="module" src="gui/active-console.js"></script>
  <!-- Per-tab session identity (issue: multiple clients on one desktop).
       localStorage is shared across all tabs of an origin, so every console
       tab read the same session-token and the host collapsed them onto one
       player. installSessionToken() gives each tab its own token. -->
  <script type="module" src="gui/session-token.js"></script>
  <script type="module" src="gui/iframe-bridge.js"></script>
  <script type="module" src="gui/console-state.js"></script>
  <script type="module" src="gui/action-map.js"></script>
  <!-- Pure JS client-state modules (issue #460). Each exposes a singleton
       (window.lobbyState / simState / commsState) with an apply(serverMessage)
       method; handleMessage() feeds every inbound message through them,
       replacing the deleted Bevy message drain. -->
  <script type="module" src="gui/lobby-state.js"></script>
  <script type="module" src="gui/sim-state.js"></script>
  <script type="module" src="gui/device-orientation.js"></script>
  <script type="module" src="gui/comms-state.js"></script>
  <!-- Connection manager: PeerJS lifecycle extracted into a tested module (issue #603) -->
  <script type="module" src="gui/connection-manager.js"></script>
  <!-- Settings panel: gear button + overlay with Rating, Volume, QR toggle, Leave Station -->
  <script type="module" src="gui/settings-panel.js"></script>
  <style>
    /* -- CSS variables (lobby + shared) -------------------------------- */
    :root {
      --signal-cyan: #5fd8e8;
      --alert-red: #ff3344;
      --bg: #07080c;
      --surface: #0e1117;
      --surface2: #161a22;
      --edge: #282c38;
      --dim: #6a7178;
      --amber: #f0a030;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: #cce; font-family: monospace; }
    body { box-sizing: border-box; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; }
    input[type="text"] { display: block; width: 100%; box-sizing: border-box;
      background: #111; color: #eef; border: 1px solid #446; padding: 0.5rem; margin-top: 0.25rem; }
    button { display: block; width: 100%; background: #224; color: #eef;
      border: 1px solid #446; padding: 0.75rem; margin: 0.4rem 0; cursor: pointer;
      font-family: monospace; font-size: 1rem; text-align: left; }
    button:active { background: #336; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.mine { border-color: #8af; color: #8af; }
    /* Status line: bottom-left, above canvas. z-index 25 keeps it above the
       phone bezel (15) so connection status isn't obscured by the corner. */
    #status { position: fixed; bottom: 0.5rem; left: 0.75rem; color: #778; font-size: 0.75rem; z-index: 25; }
    section { display: none; }
    section.active { display: block; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; align-items: center; gap: 0.5rem; font-family: monospace;
    }
    #conn-label { font-size: 0.75rem; color: #f44; }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #4c4; flex-shrink: 0; }
    #retry-now-btn {
      display: none; width: auto; background: #422; color: #fbb;
      border: 1px solid #a55; padding: 0.2rem 0.5rem; margin: 0;
      font-size: 0.7rem; cursor: pointer;
    }
    #retry-now-btn.visible { display: inline-block; }
    #retry-now-btn:active { background: #633; }
    #fullscreen-btn {
      display: inline; width: auto; background: none; border: none; color: #cce;
      font-size: 1.1rem; cursor: pointer; padding: 0; margin: 0; line-height: 1;
    }
    /* View selector cross and Red Alert button moved to Bevy WASM (#48). */
    /* Console container: full-screen flex layout host for the tab bar and
        all console sections. Always column layout — tab bar at top,
        console content below. */
    #console-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      z-index: 1;
      pointer-events: none;
    }
    #console-container > *, #console-container section.active > * {
      pointer-events: auto;
    }
    /* Console tab bar now rendered by gui/tab-bar.js (issue #441). See
       the #console-tab-bar rule below for layout. */
    /* Helm console UI moved to Bevy WASM (#49). */
    /* Weapons console: full-viewport iframe overlay when active (issue #422).
       Padding leaves room for the phone bezel (issue #439); see --bezel-inset
       further down. */
    /* Active HTML console sections fill the space below the tab bar. */
    .console-section.active {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      min-width: 0;
      margin: 0;
    }
    .console-section iframe {
      flex: 1;
      min-height: 0;
      width: 100%;
      border: none;
      display: block;
    }
    /* --- Phone-bezel red alert glow animation -----------------------------
       Pure CSS no PNGs. A thin 2px inset border holds the base frame color;
       when .alert-on is toggled we swap `--bezel-frame` to red and kick off
       a continuous pulse so the console rings like an alarm.
         - 0.5s ease ease-out: fade-in / fade-out transition on the ring color.
         - slow, infinite pulse while active (keyframes below).
       z-index: 15 — above the weapons iframe (10) and canvas (0), below the
       top-bar status overlay (20) and the loading spinner (200). The bezel
       is purely cosmetic; pointer-events: none lets clicks through. */

    :root {
      --bezel-frame: rgba(80, 150, 230, 0.7);
      --bezel-glow-size: 4px;
      --bezel-pulse-intensity: 0.6;
      --bezel-red: #ff2a2a;
      --bezel-inset: 0px;
    }

    #phone-bezel {
      position: fixed; inset: var(--bezel-inset);
      z-index: 15; pointer-events: none; display: block;
      border: 2px solid transparent;
      transition: border-color 0.5s ease-out, box-shadow 0.5s ease-out;
    }

    #phone-bezel.alert-on {
      border-color: var(--bezel-red);
      box-shadow: 0 0 var(--bezel-glow-size) calc(var(--bezel-glow-size) * 3) var(--bezel-frame);
      animation: bezel-pulse 2.8s ease-in-out forwards;
    }

    #phone-bezel.alert-on::after {
      /* Extra outer ring visible while the slow pulse continues so corners and edges look like an actual
         glowing frame without extra DOM nodes per edge/corner piece. */
      content: ''; position: absolute; inset: -2px;
      border: 1.5px solid rgba(230, 50, 50, var(--bezel-pulse-intensity));
      border-radius: inherit; pointer-events: none; opacity: 0.85;
    }

    @keyframes bezel-pulse {
       /* Initial fade-in up to peak intensity, then a steady slow pulsing loop. */
      0%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(255,80,60,0.5); opacity: 1; }
     50%   { box-shadow: inset 0 0 8px var(--bezel-red), 0 0 16px calc(var(--bezel-glow-size) * 4) rgba(230,60,30,0.9); border-color: #ff5a44; opacity: 0.95; }
    100%   { box-shadow: inset 0 0 4px transparent; border-color: rgba(255,80,60,0.5); opacity: 1; }
}

     #phone-bezel[aria-hidden="true"] { display: none; }
    #coordination-popup {
      display: none;
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      z-index: 180;
      background: #1a2a3a;
      border: 1px solid #4af;
      border-radius: 8px;
      padding: 12px 18px;
      max-width: 320px;
      color: #d0e4f0;
      font-family: 'Chakra Petch', monospace;
      font-size: 0.85rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      cursor: pointer;
      user-select: none;
    }
    #coordination-popup .popup-sender {
      font-size: 0.7rem;
      color: #8af;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #coordination-popup .popup-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    #coordination-popup .popup-body {
      font-size: 0.8rem;
      color: #a0b8c8;
    }

    /* -- Asset loading overlay (shown during Loading phase) ---------- */
    #asset-loading {
      display: none;
      position: fixed; inset: 0; z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: #8af;
      font-family: 'Chakra Petch', monospace;
      font-size: 1rem;
      text-align: center;
      gap: 16px;
    }
    #asset-loading .spinner-ring {
      width: 40px; height: 40px;
      border: 3px solid #335;
      border-top-color: #8af;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #asset-loading .pct { font-size: 1.4rem; font-weight: 600; }

    /* -- Game-over overlay (shown when GamePhase::GameOver) ---------- */
    #game-over-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 190;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.88);
      color: #cde;
      font-family: 'Chakra Petch', monospace;
      text-align: center;
      padding: 32px;
    }
    #game-over-overlay .game-over-message {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      white-space: pre-wrap;
      line-height: 1.7;
      max-width: 64ch;
      letter-spacing: 0.03em;
    }
    #game-over-overlay .game-over-return-btn {
      margin-top: 32px;
      padding: 12px 32px;
      font-family: 'Chakra Petch', monospace;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #cde;
      background: rgba(140, 180, 220, 0.12);
      border: 1px solid #8ac;
      border-radius: 2px;
      cursor: pointer;
    }

    /* -- Waiting-for-scenario overlay (shown after ReturnToLobby until host picks) */
    #waiting-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 185;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      color: #9ab;
      font-family: 'Chakra Petch', monospace;
      text-align: center;
      padding: 32px;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      letter-spacing: 0.06em;
    }
    #waiting-overlay .spinner-ring {
      display: inline-block;
      width: 32px; height: 32px;
      margin-bottom: 24px;
      border: 2px solid rgba(140, 180, 220, 0.2);
      border-top-color: #8ac;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }


    /* -- Console tab bar (issue #441) ----------------------------------
       First flex child of #console-container. In-flow so it takes up
       space and the console content below it is not obscured.
       pointer-events: auto so taps are received.
       In landscape: single row � buttons left, console title right.
       In portrait: wraps � buttons on first row, title on second row. */
    #console-tab-bar {
      pointer-events: auto;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      flex-shrink: 0;
      gap: 0.25rem;
      padding: 0.25rem clamp(50px, 20vw, 120px);
    }
    /* Visibility driven by aria-hidden, not inline style. renderTabBar()
       toggles the attribute and the cascade does the rest � avoids the
       trap where `style.display = ''` removes the override and the
       stylesheet's `display: none` rule wins. */
    #console-tab-bar[aria-hidden="true"] { display: none; }
    #console-tab-bar .tab-button {
      display: block;
      width: auto;
      margin: 0;
      padding: 0.4rem 0.6rem;
      background: rgba(14, 17, 23, 0.85);
      color: #cce;
      border: 1px solid #446;
      border-radius: 4px;
      font-family: 'Chakra Petch', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
      /* Shrink to fit the row; truncate rather than wrap. */
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      /* Eliminates the 300 ms double-tap-to-zoom delay on mobile so
         buttons feel instant alongside the pointerdown listener. */
      touch-action: manipulation;
    }
    @media (orientation: portrait) {
      #console-tab-bar .tab-button { font-size: 0.7rem; padding: 0.3rem 0.5rem; }
    }
    @media (orientation: landscape) {
      #console-tab-bar { flex-wrap: nowrap; }
      #console-tab-bar .tab-button { font-size: 1rem; padding: 0.5rem 1rem; }
    }
    #console-tab-bar .tab-button:active { background: #1a2230; }
    #console-tab-bar .tab-button.active {
      background: rgba(95, 216, 232, 0.18);
      border-color: var(--signal-cyan);
      color: var(--signal-cyan);
    }
    /* Hull damage bar � slim strip at the bottom of damageable tab buttons. */
    #console-tab-bar .tab-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }
    #console-tab-bar .tab-label {
      display: block;
    }
    #console-tab-bar .tab-hull-bar {
      display: block;
      width: 100%;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(
        to right,
        var(--hull-color, #4caf50) var(--hull-pct, 100%),
        rgba(255,255,255,0.12) var(--hull-pct, 100%)
      );
    }
    /* Inline help area � shows help text for all owned consoles under the
       tab bar when compact mode hides non-selected console buttons. */
    #console-help-area {
      pointer-events: auto;
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem clamp(50px, 20vw, 120px);
      min-height: 0;
    }
    #console-help-area[aria-hidden="true"] { display: none; }
    #console-help-area .help-console-group {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #console-help-area .help-console-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    #console-help-area .help-console-heading {
      font-family: 'Chakra Petch', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--signal-cyan);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }
    #console-help-area .help-sections {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    #console-help-area .help-section-title {
      font-family: 'Chakra Petch', monospace;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #cce;
    }
    #console-help-area .help-section-body {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: #889;
      margin-top: 0.1rem;
    }
    @media (orientation: landscape) {
      #console-help-area .help-console-heading { font-size: 0.95rem; }
      #console-help-area .help-section-title { font-size: 0.85rem; }
      #console-help-area .help-section-body { font-size: 0.8rem; }
    }

    /* Console title label � appended to the tab bar by render() */
    #phase-title {
      font-family: 'Chakra Petch', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--signal-cyan);
      padding: 0.3rem 0.5rem;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1;
      align-self: center;
    }
    @media (orientation: portrait) {
      /* Title wraps to its own full-width row below the buttons */
      #phase-title {
        flex-basis: 100%;
        order: 99;
        font-size: 0.7rem;
      }
    }
    @media (orientation: landscape) {
      /* Title stays inline, pushed to the right of the buttons */
      #phase-title {
        font-size: 1rem;
        padding: 0.5rem 1rem;
        margin-left: auto;
      }
    }

    /* -- Lobby section: full-viewport when active ------------------------ */
    #lobby-ui.active {
      display: flex !important;
      flex-direction: column;
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      padding: 28px 12px 6px;
      background: var(--bg);
      color: #d8dde2;
      font-family: 'Chakra Petch', system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      pointer-events: auto;
    }
    /* Ship header */
    #lobby-header { display: flex; align-items: center; justify-content: space-between;
      padding: 4px 0 8px; border-bottom: 1px solid var(--edge); flex-shrink: 0; }
    #ship-info { display: flex; flex-direction: column; gap: 1px; }
    #ship-name { font-size: 1rem; font-weight: 600; color: #eef; letter-spacing: .06em; }
    #ship-mission { font-size: 0.6rem; color: var(--dim); letter-spacing: .04em; }
    #crew-ready { display: flex; align-items: center; gap: 8px; }
    #crew-display { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--dim); }
    #ready-pill { padding: 2px 10px; border-radius: 10px; font-size: 0.6rem;
      font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      background: #221e10; color: var(--amber); border: 1px solid var(--amber);
      transition: all .3s ease; }
    #ready-pill.go { background: #0a2830; color: var(--signal-cyan); border-color: var(--signal-cyan);
      animation: pill-pulse 1.5s ease-in-out infinite; }
     @keyframes spin { to { transform: rotate(360deg); } }

     @keyframes pill-pulse {
        0%, 100%{ box-shadow: 0 0 4px rgba(95,216,232,0.2); }
       50%      { box-shadow: 0 0 12px rgba(95,216,232,0.5); }
    }

    /* Name input row */
    #lobby-name-row { flex-shrink: 0; padding: 6px 0 2px; }
    #lobby-name-row label { font-size: 0.7rem; color: var(--dim); margin: 0;
      display: flex; align-items: center; gap: 8px; }
    #lobby-name-row input { flex: 1; background: var(--surface); color: #d8dde2;
      border: 1px solid var(--edge); padding: 4px 8px; border-radius: 3px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.8rem;
      display: inline; width: auto; margin: 0; }
    /* Station list */
    #station-list { flex: 1; overflow-y: auto; padding: 8px 0; display: flex;
      flex-direction: column; gap: 6px; }
    /* Tutorial text � replaces station list when player has a station */
    #lobby-tutorial { flex: 1; overflow-y: auto; padding: 8px 0; display: none;
      flex-direction: column; gap: 12px; }
    #lobby-tutorial[aria-hidden="false"] { display: flex; }
    #lobby-tutorial .help-console-group { margin-bottom: 0.5rem; }
    #lobby-tutorial .help-console-heading {
      font-family: 'Chakra Petch', monospace; font-size: 0.85rem;
      font-weight: 600; letter-spacing: 0.08em; color: var(--signal-cyan);
      margin-bottom: 0.4rem; text-transform: uppercase;
    }
    #lobby-tutorial .help-sections { display: flex; flex-direction: column; gap: 0.35rem; }
    #lobby-tutorial .help-section { margin-bottom: 0; }
    #lobby-tutorial .help-section-title {
      font-family: 'Chakra Petch', monospace; font-size: 0.75rem;
      font-weight: 600; color: #cce;
    }
    #lobby-tutorial .help-section-body {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      color: #889; margin-top: 0.1rem;
    }
    .station-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 6px; background: var(--surface); border: 1px solid var(--edge);
      transition: border-color .2s, background .2s; }
    .station-row.mine { border-color: var(--signal-cyan); background: #0a1a24; }
    .station-row.taken { opacity: 0.7; }
    .station-row .glyph { width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
      background: var(--surface2); color: var(--dim); border: 1px solid var(--edge); }
    .station-row.mine .glyph { border-color: var(--signal-cyan); color: var(--signal-cyan); }
    .station-row .info { flex: 1; min-width: 0; }
    .station-row .info .name { font-size: 0.85rem; font-weight: 600; }
    .station-row .info .meta { font-size: 0.6rem; color: var(--dim);
      display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .station-row .info .meta .cons { padding: 1px 5px; border-radius: 2px;
      background: var(--surface2); font-size: 0.55rem; color: #7aa; }
    .station-row .info .occupant { font-size: 0.7rem; color: var(--signal-cyan); }
    .station-row .action { flex-shrink: 0; }
    .station-row .action button { padding: 4px 12px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.7rem;
      font-weight: 600; letter-spacing: .06em; cursor: pointer; border: 1px solid;
      transition: background .15s; display: block; width: auto; margin: 0; text-align: center; }
    .station-row .action .claim-btn { background: #0a2830; color: var(--signal-cyan);
      border-color: var(--signal-cyan); }
    .station-row .action .claim-btn:hover { background: #1a3848; }
    .station-row .action .mine-btn { background: #0a1a24; color: var(--signal-cyan);
      border-color: var(--signal-cyan); }
    .station-row .action .taken-btn { background: #111; color: var(--dim);
      border-color: var(--edge); cursor: default; }
    /* Detail panel */
    #detail-panel { flex-shrink: 0; border-top: 1px solid var(--edge);

    #detail-panel .detail-header { display: flex; align-items: center; justify-content: space-between; }
    #detail-panel .detail-station-name { font-size: 0.85rem; font-weight: 600; color: var(--dim); }

    #detail-panel .detail-consoles { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
    #detail-panel .detail-consoles .chip { padding: 2px 8px; border-radius: 3px;

    #detail-panel .detail-consoles .chip:hover { border-color: var(--signal-cyan); color: var(--signal-cyan); }
    #detail-panel .detail-consoles .chip.selected { background: #0a2830;

    #detail-panel .detail-ratings { display: flex; gap: 2px; margin: 4px 0; }
    #detail-panel .detail-ratings .rating-btn { padding: 2px 10px; border-radius: 3px;

      transition: background .15s, border-color .15s; }
    #detail-panel .detail-ratings .rating-btn.active { background: #0a2830;
      border-color: var(--signal-cyan); color: var(--signal-cyan); }
    #detail-panel .detail-release-btn { padding: 2px 10px; border-radius: 3px;

    #detail-panel .detail-release-btn:hover { background: rgba(255,51,68,0.1); }
    /* Lobby footer */
    #lobby-footer { flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 6px 0 4px;
      border-top: 1px solid var(--edge); margin-top: auto; }
    #status-line { font-size: 0.65rem; color: var(--dim); }
    #ready-btn { padding: 6px 16px; border-radius: 4px;
      font-family: 'Chakra Petch', system-ui, sans-serif; font-size: 0.75rem;
      font-weight: 700; letter-spacing: .12em; cursor: pointer;
      border: 1px solid var(--edge); background: var(--surface); color: var(--dim);

    #ready-btn.armed { display: block; background: #0a2830;

    #ready-btn.armed:hover { background: #1a3848; }
    #ready-btn.armed.glow { animation: ready-pulse 1s ease-in-out infinite; }
    @keyframes ready-pulse {
      0%, 100% { box-shadow: 0 0 6px rgba(95,216,232,0.3); }
      50%       { box-shadow: 0 0 18px rgba(95,216,232,0.7); }
    }
    #ready-btn:disabled { opacity: 0.4; cursor: default; animation: none !important; }

    /* ── Settings panel ──────────────────────────────────────────
       Gear button fixed at bottom-left, overlay modal centered.
       Mounted by gui/settings-panel.js. */
    .settings-btn {
      position: fixed;
      bottom: 0.5rem;
      left: 0.75rem;
      z-index: 60;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.15rem;
      line-height: 1;
      color: var(--dim);
      background: rgba(14, 17, 23, 0.7);
      border: 1px solid var(--edge);
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      padding: 0;
    }

    .settings-btn:active { background: rgba(30, 40, 60, 0.85); }
    .settings-overlay {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;

    }

    .settings-overlay .settings-popup {
      cursor: auto;
      background: var(--surface);
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;

    .settings-section { display: flex; flex-direction: column; gap: 0.4rem; }
    .settings-section-heading {
      font-family: 'Chakra Petch', sans-serif;

    }
    .settings-rating-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .settings-rating-btn {
      display: block; width: auto; margin: 0;
      padding: 0.35rem 0.7rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;

    .settings-vol-row {

    .settings-vol-row input[type="range"] {

    .settings-vol-row input[type="range"]::-moz-range-thumb {

    .settings-action-btn {
      display: block; width: 100%; margin: 0;
      padding: 0.5rem 0.75rem;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--edge); border-radius: 3px;

  </style>
</head>
<body>
  <!-- UI click sound (played from JS). -->
  <audio id="ui-click" src="assets/sounds/ui_click.ogg"></audio>

  <!-- This is a pure-JS console (issue #463): no client-side WASM. The page
       and its assets are shipped to dist/client/ by scripts/build-client.mjs
       (npm run build:client) � a plain file copy, NOT a Trunk build, because
       Trunk would implicitly compile the crate's default (server) lib into a
       WASM bundle and inject a loader even with no `rel="rust"` link.
       All client state lives in the gui/*.js modules loaded in <head>. -->

  <!-- Console container: full-screen flex layout host for the tab bar and
       all in-game console sections. [data-orientation] drives portrait
       (column) vs landscape (row) layout; set by render() on each paint. -->
  <div id="console-container" data-orientation="portrait">

    <!-- Console tab bar (issue #441). First flex child so it takes up space
         above the console content rather than hovering over it. Hidden in
         lobby and for single-console players via aria-hidden. -->
    <div id="console-tab-bar" role="tablist" aria-label="Console tabs" aria-hidden="true"></div>

    <!-- Inline help area: shows help text for all owned consoles when a
         console is selected and non-selected tabs are hidden (issue #462). -->
    <div id="console-help-area" aria-hidden="true"></div>

    <section id="lobby-ui">
      <!-- Ship header -->
      <div id="lobby-header">
        <div id="ship-info">
          <div id="ship-name">Phoenix</div>
          <div id="ship-mission">Standing by</div>
        </div>
        <div id="crew-ready">
          <span id="crew-display">0/0</span>
          <span id="ready-pill">CONNECTING</span>
        </div>
      </div>

      <!-- Name input -->
      <div id="lobby-name-row">
        <label>Name
          <input id="name-input" type="text" placeholder="Your name" autocomplete="off" />
        </label>
      </div>

      <!-- Station list -->
      <div id="station-list"></div>

      <!-- Tutorial text shown when player has selected a station -->
      <div id="lobby-tutorial" aria-hidden="true"></div>

      <!-- At-your-station detail panel -->
      <div id="detail-panel" class="idle">
        <div class="detail-header">
          <span class="detail-station-name">No station assigned</span>
        </div>
        <div id="detail-console-area">
          <div class="detail-consoles"></div>
          <div class="detail-ratings"></div>
        </div>
      </div>

      <!-- Footer -->
      <div id="lobby-footer">
        <span id="status-line">Connecting to host�</span>
        <button id="ready-btn">READY</button>
      </div>
    </section>

    <!-- Console sections are mounted dynamically by mountConsoles() when a
         Welcome message arrives with ship_stations. Each section is created
         with the same id/iframe-id conventions as the static originals
         (e.g. #captain-ui / #captain-iframe) so all downstream $() references
         continue to resolve. -->
  </div>

  <div id="status">Connecting�</div>

  <!-- #phase-title lives outside the DOM flow; render() moves it into the tab bar each frame -->
  <span id="phase-title"></span>

  <div id="top-bar">
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="retry-now-btn" title="Retry connection now">Retry now</button>
    <button id="fullscreen-btn" title="Toggle fullscreen">?</button>
  </div>

  <!-- Asset loading overlay: shown during GamePhase::Loading while the
       server pre-caches GLB models, radar icons, and rig sidecars. -->
  <div id="asset-loading">
    <div class="spinner-ring"></div>
    <span>Preparing scenario&hellip; <span class="pct" id="asset-loading-pct">0</span>%</span>
  </div>

  <!-- Game-over overlay: shown when GamePhase::GameOver. Displays either
       "Ship Destroyed" (hull death) or the scenario's game_over message. -->
  <div id="game-over-overlay">
    <div class="game-over-message" id="game-over-message"></div>
    <button id="return-to-lobby-btn" class="game-over-return-btn">Return to Lobby</button>
  </div>

  <!-- Waiting-for-scenario overlay: shown after ReturnToLobby while the
       host picks a scenario from the server's scenario-selection panel. -->
  <div id="waiting-overlay">
    <div class="spinner-ring"></div>
    <span>Waiting for host to select a scenario&hellip;</span>
  </div>

  <!-- Coordination popup overlay (issue #494). Shown for AI-to-human
       coordination messages. Click-to-dismiss, auto-dismiss after 8s. -->
  <div id="coordination-popup" onclick="dismissCoordinationPopup()">
    <div class="popup-sender" id="popup-sender"></div>
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>

  <!-- Phone bezel frame (issue #439). CSS-only red alert glow; no images.
       The .alert-on class drives the keyframe animation (see <style>).
       Hidden by default; render() flips aria-hidden once in-game. -->
  <div id="phone-bezel" aria-hidden="true"></div>



  <script>
    // -- Click sound --------------------------------------------------------
    // Message types that should NOT trigger a click (continuous / connection
    // setup messages that are not the result of a deliberate button press).
    const NO_CLICK = new Set(['HelmInput', 'LateralThrustInput', 'Identify', 'SetName']);

    function playClick() {
      const el = document.getElementById('ui-click');
      if (!el) return;
      el.currentTime = 0;
      el.play().catch(() => {});
    }

    // -- Connection status --------------------------------------------------

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      const retryBtn = document.getElementById('retry-now-btn');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = 'Disconnected � reconnecting�';
        if (retryBtn) retryBtn.classList.add('visible');
      } else if (state === 'error') {
        // No permanent give-up state anymore — connection-manager keeps
        // retrying with backoff even after an 'error' signal, so this still
        // shows the retry-now affordance rather than telling the user to
        // refresh the page.
        dot.style.background = '#f44';
        label.textContent = 'Connection error � reconnecting�';
        if (retryBtn) retryBtn.classList.add('visible');
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
        if (retryBtn) retryBtn.classList.remove('visible');
      }
    }

    // -- Screen Wake Lock (keep screen on when active) -----------------
    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      try {
        if (wakeLockSentinel) return;
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLockSentinel) { wakeLockSentinel.release(); wakeLockSentinel = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });

    // -- Fullscreen controller ----------------------------------------------

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '?' : '?'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    // -- Return to Lobby (GameOver overlay button) ---------------------------
    (function initReturnToLobby() {
      const btn = document.getElementById('return-to-lobby-btn');
      if (!btn) return;
      btn.addEventListener('click', () => send('ReturnToLobby'));
    })();

    setConnectionStatus('connecting');

    // -- Retry-now control (issue #614) --------------------------------------
    // Visible only while disconnected/retrying (see setConnectionStatus).
    // Bypasses the connection manager's current backoff wait and attempts a
    // reconnect immediately.
    (function initRetryNow() {
      const btn = document.getElementById('retry-now-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (window.connectionManager && typeof window.connectionManager.retryNow === 'function') {
          window.connectionManager.retryNow();
        }
      });
    })();

    // -- Persistence ---------------------------------------------

    const NAMES = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return NAMES[Math.floor(Math.random() * NAMES.length)];
    }

    // Session identity is resolved per-tab by gui/session-token.js
    // (installSessionToken) just before we Identify � see the connection block
    // below. It is not resolved here because that module is deferred and has
    // not executed yet at parse time. Resolving per-tab (sessionStorage) rather
    // than per-origin (localStorage) is what lets several console tabs run on
    // one desktop without colliding on a single shared token.
    let myToken = null;

    // Display name is per-tab (sessionStorage), not per-origin (localStorage):
    // several clients on one desktop must not all default to the same name, or
    // they look like one another in the lobby. Falls back to a fresh random
    // name per tab. (Identity is the token, not the name � see myToken.)
    let myName = sessionStorage.getItem('player-name') || randomName();
    sessionStorage.setItem('player-name', myName);

    // -- State ---------------------------------------------------

    const state = { players: [], phase: 'Lobby', redAlert: false, currentView: 'Fore', cameraViews: [], hullIntegrity: 100,
      shipX: 0, shipZ: 0, shipYaw: 0, forwardSpeed: 0, impulseChargeProgress: 0, boostEnabled: false, boostBattery: 0, boostActive: false, asteroids: [], weaponsTarget: null, weaponsTargetName: null, weaponsLocked: false, weaponsFireReady: false, weaponsOnCooldown: false, weaponsFiring: false, weaponsReadyBankId: null,
      repairCooldownSecs: 0, repairInProgress: false, repairPenalty: false,
      stations: [], maxPlayers: 0, allFilled: false, allReady: false, countdownSecs: 0,
      shipDestroyed: false, gameOverReason: null,
      // Weapons console iframe state (issue #422)
      weaponsBanks: [], weaponsTubes: [], weaponsTorpedoCount: 0, weaponsPhaserMode: 'Auto',
      // Repair console iframe state (issue #425)
      repairTeams: [], consoleHull: [],
      // Power console iframe state (issue #425)
      powerHelm: 2, powerWeapons: 2, powerSensors: 2, powerBattery: 100, powerLocked: false,
      // Shields console iframe state (issue #423)
      shieldFacings: [], shieldFocusedFacing: null,
      // Sensors console iframe state
      sensorsTarget: null,
      // Shared Navigation waypoint from SimState
      navigationWaypoint: null,
      objectives: [] };

    // DIAGNOSTIC: log every click at document level (capture phase) with target info
    document.addEventListener('pointerdown', (e) => {
      console.log('[client] doc pointerdown target:', e.target.tagName, e.target.className, 'id:', e.target.id);
    }, true);
    document.addEventListener('click', (e) => {
      console.log('[client] doc click target:', e.target.tagName, e.target.className, 'id:', e.target.id);
    }, true);

    /// Currently-active console tab during InProgress. Null until set.
    let activeConsole = null;

    /// Console selected in the lobby detail panel. Null until the player picks one.
    /// Resets when the player releases their station.
    let lobbyConsole = null;
    let pendingMidGameClaim = false;

    // Single source of truth for changing the active console. Called by
    // the render() reconciler, the tab-bar onPress handler, and the swipe
    // gesture. No-op if the value is already current. Delegates the
    // null/undefined/"" ? next sentinel mapping to gui/active-console.js so
    // the contract is locked by Vitest.
    function setActiveConsole(name) {
      const step = (typeof window.nextActiveConsole === 'function')
        ? window.nextActiveConsole(activeConsole, name)
        : { changed: (name || null) !== activeConsole, next: name || null };
      if (!step.changed) return;
      activeConsole = step.next;
    }

    // -- Helpers -------------------------------------------------

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function playerStation(s) {
      const m = me(s);
      if (!m) return null;
      return typeof m.station === 'string' ? m.station
        : (m.station && typeof m.station.id === 'string' ? m.station.id : null);
    }
    function myConsoles(s) {
      // Post issue #619 a player owns exactly one station id (or none).
      // Callers that historically wanted a "consoles" list (for the tab bar)
      // treat this as a one-element list.
      const sid = playerStation(s);
      return sid ? [sid] : [];
    }

    /// True while the lobby/station-select panel is being shown over an
    /// in-progress game: true spectators, and mid-game claimants who have
    /// picked a station but not yet pressed Ready. Single source of truth for
    /// render()'s vis.lobby override and the SimState/BlackboardUpdate
    /// render guards below � those messages arrive at ~10Hz and must skip the
    /// lobby DOM rebuild in this state, or a click on Ready/Leave can land
    /// between the old button being torn down and the new one's listener
    /// being attached.
    function showingLobbyDuringGame(s) {
      if (s.phase !== 'InProgress') return false;
      const player = me(s);
      return pendingMidGameClaim || !playerStation(s) || !!(player && !player.ready);
    }
    function isCaptain(s)     { return playerStation(s) === 'captain'; }
    function isHelm(s)        { return playerStation(s) === 'helm'; }

    function send(type, data) {
      if (!window.connectionManager || !window.connectionManager.connected) return;
      const clickType = (type === 'ControlSystem' && data && data.payload) ? data.payload.type : type;
      if (!NO_CLICK.has(clickType)) playClick();
      // Client messages (commands, lobby actions) are always reliable
      window.connectionManager.send(type, data, 'reliable');
    }

    function setStatus(text) { $('status').textContent = text; }

    // -- Phone bezel red-alert toggle (issue #439) -------------------------
    // Toggles the .alert-on class on #phone-bezel; CSS keyframes drive the
    // red glow pulse (no PNG swaps needed with the CSS-only implementation).
    function applyBezelAlert(alert) {
      const root = $('phone-bezel');
      if (root) root.classList.toggle('alert-on', !!alert);
    }



    const CONSOLES = ['captain', 'helm', 'tactical', 'repair', 'sensors', 'science', 'shields', 'navigation', 'power', 'comms'];

    // Console display name ? human label. Reads the single source from
    // gui/tab-bar.js (window.CONSOLE_LABEL, frozen). Falls back to the
    // raw console name when the module hasn't loaded yet so the first
    // paint never blanks out � same race-safety pattern as render()
    // uses for sectionVisibility / consoleSections / tabBarLayout.
    function consoleLabel(name) {
      return (window.CONSOLE_LABEL && window.CONSOLE_LABEL[name]) || name;
    }

    // Persistent reference to the console title label � moved into the tab
    // bar on each render() so it survives renderTabBar's innerHTML clear.
    const _consoleTitleEl = document.getElementById('phase-title');

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(state);
      });
    }
    // Expose so gui/device-orientation.js can coalesce its resize-driven
    // re-render through the same rAF scheduler (issue #462).
    window.scheduleRender = scheduleRender;

    function render(s) {
      // Phase ? section visibility (pure JS module, gui/phase-toggle.js).
      // Falls back to a local check if the module hasn't loaded yet so the
      // first paint isn't blank � module load races init on slow networks.
      const vis = (typeof window.sectionVisibility === 'function')
        ? window.sectionVisibility(s.phase)
        : { lobby: s.phase !== 'InProgress' && s.phase !== 'GameOver',
            game: s.phase === 'InProgress' || s.phase === 'GameOver',
            bezel: s.phase === 'InProgress' || s.phase === 'GameOver' };
      const mine = myConsoles(s);
      const myPlayer = me(s);
      // Spectators and pending mid-game claimants stay in the lobby. Ready is
      // the point where the server actually hands the station over from AI.
      if (showingLobbyDuringGame(s)) {
        vis.lobby = true; vis.game = false; vis.bezel = false;
      }
      const inGame = vis.game;
      $('lobby-ui').className = vis.lobby ? 'active' : '';
      // Phone bezel (issue #439) is part of the game shell only � the lobby
      // is borderless. Toggle visibility via aria-hidden so the CSS
      // [aria-hidden="true"] { display: none } rule drives the cascade.
      const bezel = $('phone-bezel');
      if (bezel) bezel.setAttribute('aria-hidden', vis.bezel ? 'false' : 'true');

      // Reconcile activeConsole with current consoles list (port of the
      // deleted Bevy reconcile_active_console � see gui/lobby-state.js).
      if (inGame) {
        const next = (typeof window.reconcileActiveConsole === 'function')
          ? window.reconcileActiveConsole(activeConsole, mine)
          : ((activeConsole && mine.includes(activeConsole)) ? activeConsole : (mine[0] || null));
        if (next !== activeConsole) setActiveConsole(next);
      } else {
        setActiveConsole(null);
      }

      // Console sections (issue #441): map activeConsole → HTML section id
      // via gui/content-switcher.js. Only the matching section gets `.active`.
      // Every console (including Helm and Navigation) is an HTML iframe with
      // its own section entry like weapons-ui. Sections that don't exist on
      // this ship are simply absent from the DOM; the $() call returns null
      // and is silently skipped.
      const sections = (typeof window.consoleSections === 'function')
        ? window.consoleSections(activeConsole, inGame)
        : { 'captain-ui': inGame && activeConsole === 'captain',
            'helm-ui':   inGame && activeConsole === 'helm',
            'weapons-ui': inGame && activeConsole === 'tactical',
            'repair-ui': inGame && activeConsole === 'repair',
            'power-ui':  inGame && activeConsole === 'power',
             'shields-ui': inGame && activeConsole === 'shields',
             'sensors-ui': inGame && activeConsole === 'sensors',
             'science-ui': inGame && activeConsole === 'science',
              'comms-ui':  inGame && activeConsole === 'comms',
             'navigation-ui': inGame && activeConsole === 'navigation' };
      for (const [sectionId, visible] of Object.entries(sections)) {
        const el = $(sectionId);
        if (el) el.className = visible ? 'console-section active' : 'console-section';
      }

      // Orientation drives both the tab-bar layout and the container's
      // flex-direction (portrait = column, landscape = row). Computed once
      // per render so both consumers see the same value.
      const orientation = (typeof window.currentOrientation === 'function')
        ? window.currentOrientation()
        : (window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait');
      const container = $('console-container');
      if (container) container.dataset.orientation = orientation;

      // Console tab bar (issue #441, #626): render into #console-tab-bar via
      // gui/tab-bar.js. Hidden in lobby and for single-station in-game players;
      // shows tab buttons + title for multi-console players.
      // When a console is selected, compact mode hides non-selected tabs and
      // the freed space shows help text for all owned consoles (issue #462).
      const tabRoot = $('console-tab-bar');
      if (tabRoot && typeof window.tabBarLayout === 'function'
          && typeof window.renderTabBar === 'function') {
        const compactActive = inGame && activeConsole !== null;
        const layout = window.tabBarLayout(mine, activeConsole, orientation, inGame, state.consoleHull, compactActive);
        // Capture title ref before renderTabBar clears the bar's children.
        const titleEl = _consoleTitleEl;
        // Only show title in the tab bar when the bar itself is visible
        // (multi-station in-game). In single-station mode the bar is hidden.
        if (inGame && !layout.hidden) {
          titleEl.textContent = activeConsole ? consoleLabel(activeConsole) : 'Bridge';
        }
        window.renderTabBar(tabRoot, layout, { onPress: (name) => {
          setActiveConsole(name);
          scheduleRender();
        }});
        // Append title into the bar so it sits inline (landscape) or wraps
        // below the buttons (portrait). Only when multi-station (bar is visible).
        if (inGame && !layout.hidden) tabRoot.appendChild(titleEl);
      }

      // Inline help area: shown in lobby when the player has a station
      // selected; hidden in-game (the "?" modal takes over there).
      const helpArea = $('console-help-area');
      if (helpArea) {
        if (!inGame && mine.length > 0) {
          if (typeof window.renderInlineHelp === 'function') {
            window.renderInlineHelp(helpArea, mine);
          }
          helpArea.setAttribute('aria-hidden', 'false');
        } else {
          helpArea.setAttribute('aria-hidden', 'true');
        }
      }

      // Game-over overlay: covers the game shell when phase is GameOver.
      const gameOverEl = document.getElementById('game-over-overlay');
      const gameOverMsgEl = document.getElementById('game-over-message');
      if (gameOverEl && gameOverMsgEl) {
        if (s.phase === 'GameOver') {
          gameOverMsgEl.textContent = s.shipDestroyed ? 'Ship Destroyed' : (s.gameOverReason || '');
          gameOverEl.style.display = 'flex';
        } else {
          gameOverEl.style.display = 'none';
        }
      }

      // Waiting-for-scenario overlay: shown after ReturnToLobby while the
      // host selects a scenario from the server scenario-selection panel.
      const waitingEl = document.getElementById('waiting-overlay');
      if (waitingEl) {
        waitingEl.style.display = (window.lobbyState && window.lobbyState.waitingForScenario) ? 'flex' : 'none';
      }

      if (inGame) renderGame(s);
      else if (!(window.lobbyState && window.lobbyState.waitingForScenario)) renderLobby(s);
    }

    function renderLobby(s) {
      const list = document.getElementById('station-list');
      if (!list) return;
      const myPlayer = me(s);
      const mine = myConsoles(s);
      const myStation = myPlayer ? s.stations.find(st => st.holder_token === myToken) : null;
      const hasStation = !!myStation;

      // Toggle station list vs tutorial
      const tutorial = document.getElementById('lobby-tutorial');
      if (hasStation) {
        list.style.display = 'none';
        if (tutorial) {
          if (typeof window.renderInlineHelp === 'function') {
            window.renderInlineHelp(tutorial, mine);
          }
          tutorial.setAttribute('aria-hidden', 'false');
        }
      } else {
        list.style.display = '';
        if (tutorial) {
          tutorial.setAttribute('aria-hidden', 'true');
        }
      }

      list.innerHTML = '';
      for (const st of (s.stations || [])) {
        const isMine = !!st.holder_token && st.holder_token === myToken;
        const row = document.createElement('div');
        row.className = 'station-row'
          + (isMine ? ' mine' : '')
          + (st.holder_name && !isMine ? ' taken' : '');

        const glyph = document.createElement('div');
        glyph.className = 'glyph';
        glyph.textContent = st.short_code ? st.short_code.substring(0, 2).toUpperCase() : '--';
        row.appendChild(glyph);

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = st.name || '';
        info.appendChild(nameEl);
        const meta = document.createElement('div');
        meta.className = 'meta';
        if (st.rank) {
          const rankEl = document.createElement('span');
          rankEl.textContent = st.rank;
          meta.appendChild(rankEl);
        }
        // Post issue #619 a station carries a single (lowercase) id — the
        // station itself is the "console" for chip-rendering purposes.
        if (st.id) {
          const chip = document.createElement('span');
          chip.className = 'cons';
          chip.textContent = consoleLabel(st.id);
          meta.appendChild(chip);
        }
        info.appendChild(meta);
        if (st.holder_name && !isMine) {
          const occ = document.createElement('div');
          occ.className = 'occupant';
          occ.textContent = st.holder_name;
          info.appendChild(occ);
        }
        row.appendChild(info);

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (isMine) {
          btn.className = 'mine-btn';
          btn.textContent = 'RELEASE';
          btn.addEventListener('click', () => {
            pendingMidGameClaim = false;
            send('ReleaseStation');
          });
        } else if (st.holder_name) {
          btn.className = 'taken-btn';
          btn.textContent = 'TAKEN';
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = 'CLAIM';
          btn.addEventListener('click', () => {
            if (state.phase === 'InProgress') pendingMidGameClaim = true;
            send('SelectStation', { station: st.name });
            scheduleRender();
          });
        }
        action.appendChild(btn);
        row.appendChild(action);
        list.appendChild(row);
      }

      // Detail panel
      const detail = document.getElementById('detail-panel');
      if (detail) {
        const detailHeader = detail.querySelector('.detail-header');
        if (myStation) {
          detail.className = 'active';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = myStation.name;
          detailHeader.appendChild(nameSpan);
          const releaseBtn = document.createElement('button');
          releaseBtn.className = 'detail-release-btn';
          releaseBtn.textContent = 'LEAVE';
          releaseBtn.addEventListener('click', () => {
            pendingMidGameClaim = false;
            send('ReleaseStation');
          });
          detailHeader.appendChild(releaseBtn);
          const consolesArea = detail.querySelector('.detail-consoles');
          consolesArea.innerHTML = '';
          // Post issue #619: one station == one console. Auto-select it.
          const stationConsoles = myStation.id ? [myStation.id] : [];
          if (stationConsoles.length === 1 && lobbyConsole !== stationConsoles[0]) {
            lobbyConsole = stationConsoles[0];
          }
          for (const c of stationConsoles) {
            const chip = document.createElement('span');
            chip.className = 'chip' + (c === lobbyConsole ? ' selected' : '');
            chip.textContent = consoleLabel(c);
            chip.addEventListener('click', () => {
              lobbyConsole = c;
              scheduleRender();
            });
            consolesArea.appendChild(chip);
          }

          // Complexity toggle: purely data-driven off the station's declared
          // ratings (excluding the implicit runtime-only "Backfill") — never
          // hardcode which stations get one here. Hidden entirely when the
          // station only has its base rating.
          const ratingsArea = detail.querySelector('.detail-ratings');
          ratingsArea.innerHTML = '';
          if (myStation.ratings && myStation.ratings.length > 1) {
            const activeRating = (s.stationRatings && s.stationRatings[myStation.id]) || myStation.ratings[0];
            for (const r of myStation.ratings) {
              const btn = document.createElement('button');
              btn.className = 'rating-btn' + (r === activeRating ? ' active' : '');
              btn.textContent = r === 'Std' ? 'STANDARD' : r.toUpperCase();
              btn.addEventListener('click', () => {
                if (r !== activeRating) send('SetStationRating', { rating_name: r });
              });
              ratingsArea.appendChild(btn);
            }
          }
        } else {
          detail.className = 'idle';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = 'No station assigned';
          detailHeader.appendChild(nameSpan);
          detail.querySelector('.detail-consoles').innerHTML = '';
          detail.querySelector('.detail-ratings').innerHTML = '';
          lobbyConsole = null;
        }
      }

      // Header
      const crewEl = document.getElementById('crew-display');
      if (crewEl) crewEl.textContent = (s.stations.filter(st => st.holder_name).length) + '/' + (s.maxPlayers || 0);
      const pill = document.getElementById('ready-pill');
      if (pill) {
        if (s.allReady) { pill.textContent = 'ALL CREW READY'; pill.className = 'go'; }
        else { pill.textContent = 'AWAITING CREW'; pill.className = ''; }
      }

      // Ready button (per-player, replaces captain-only Engage)
      const readyBtn = document.getElementById('ready-btn');
      if (readyBtn) {
        if (myPlayer && hasStation && lobbyConsole) {
          readyBtn.style.display = 'block';
          const isReady = !!myPlayer.ready;
          if (s.countdownSecs > 0) {
            // Countdown active — keep button in ready state, show timer.
            readyBtn.textContent = s.countdownSecs + 's';
            readyBtn.className = 'armed glow';
            readyBtn.disabled = false;
            readyBtn.onclick = () => send('SetReady', { ready: false });
          } else if (isReady) {
            readyBtn.textContent = '? READY';
            readyBtn.className = 'armed glow';
            readyBtn.disabled = false;
            readyBtn.onclick = () => send('SetReady', { ready: false });
          } else {
            readyBtn.textContent = 'READY';
            readyBtn.className = 'armed';
            readyBtn.disabled = false;
            readyBtn.onclick = () => send('SetReady', { ready: true });
          }
        } else {
          readyBtn.style.display = 'none';
        }
      }

      // Status line
      const statusLine = document.getElementById('status-line');
      if (statusLine) {
        if (!myPlayer || !hasStation) {
          statusLine.textContent = 'Select a station to join the crew';
        } else if (!lobbyConsole) {
          statusLine.textContent = 'Select a console at ' + myStation.name + ' to continue';
        } else if (s.countdownSecs > 0) {
          statusLine.textContent = 'Launching in ' + s.countdownSecs + 's  (click READY to cancel)';
        } else if (s.allReady) {
          statusLine.textContent = 'All crew ready — launching!';
        } else if (myPlayer.ready) {
          statusLine.textContent = 'Waiting for the rest of the crew…';
        } else {
          statusLine.textContent = 'Standing by at ' + myStation.name + ' — press READY when ready';
        }
      }
    }

    function rebuildStations() {
      const defs = (state.shipStations && state.shipStations.stations) || [];
      state.maxPlayers = defs.length;
      state.stations = defs.map(def => {
        // Post issue #619 a player holds a lowercase station id directly.
        const holder = state.players.find(p => {
          if (!p.connected) return false;
          const held = typeof p.station === 'string' ? p.station
            : (p.station && typeof p.station.id === 'string' ? p.station.id : null);
          return held === def.id;
        });
        return {
          id: def.id,
          name: def.name || '',
          short_code: def.short_code || '',
          rank: def.rank || '',
          holder_name: holder ? holder.name : null,
          holder_token: holder ? holder.token : null,
          ratings: def.ratings || [],
        };
      });
      state.allFilled = state.stations.length > 0 && state.stations.every(st => st.holder_name);
      state.allReady = state.players.length > 0 && state.players.every(p => p.ready)
        || state.players.length === 0;
      state.countdownSecs = window.lobbyState ? window.lobbyState.countdownSecs : 0;
      scheduleRender();
    }

    // Repair UI (issue #462): the full repair affordance is owned by the
    // Repair console iframe (gui/repair-console.html), which renders the hull
    // readout + per-team dispatch buttons and sends `dispatch_repair_team`
    // itself. The pure shell-button logic ported from the old Bevy
    // `handle_repair_button_press` / `refresh_repair_button` lives in
    // gui/repair-button.js (all-busy guard, message shape, refresh states).
    // The earlier `renderRepair` / `renderRepairButtons` shell stubs targeted
    // HTML ids that were never added (orphaned Bevy-era remnants) and were
    // removed here; the iframe supersedes them.

    // -- iframe state-push helper (wraps gui/iframe-bridge.js) ----------------
    // Delegates to window.iframeBridgePush when the module is loaded; falls back
    // to the same inline logic for the rare race where the module hasn't run yet.
    function _pushIframe(iframeEl, consoleName, stateJson) {
      if (typeof window.iframeBridgePush === 'function') {
        window.iframeBridgePush(iframeEl, consoleName, stateJson);
        return;
      }
      if (!iframeEl || !iframeEl.contentWindow) return;
      try {
        const fn = iframeEl.contentWindow.__updateConsole;
        if (typeof fn === 'function') fn(consoleName, stateJson);
      } catch (_) {}
    }

    // -- Generic console state push (ship-agnostic) --------------------------
    // Every station id (including the aggregate cruiser/destroyer consoles like
    // `engineering` = power+repair and `science` = sensors+shields) is handled
    // generically by window.buildConsoleState(name, state), which nests the
    // sub-panel payloads. The per-console push*ConsoleState helpers below only
    // cover the legacy standalone iframes, so aggregate consoles (engineering,
    // science, …) would otherwise never receive state. Route by the console
    // registry so whatever iframe the current ship actually mounted is fed.
    function pushConsoleStateFor(name) {
      if (!name) return;
      const registry = window.CONSOLE_REGISTRY || {};
      const entry = registry[name];
      const iframeId = entry ? entry.iframeId : (name + '-iframe');
      const json = (typeof window.buildConsoleState === 'function')
        ? window.buildConsoleState(name, state)
        : '{}';
      _pushIframe($(iframeId), name, json);
    }

    function pushActiveConsoleState() {
      pushConsoleStateFor(activeConsole);
    }

    // -- Weapons console iframe bridge (issue #422) --------------------------
    // Builds a WeaponsConsoleState JSON from client state and pushes it to the
    // gui/weapons-console.html iframe via its window.__updateConsole function.
    // The iframe's __sendAction postMessages back; we forward those to the server.
    // State builder extracted to gui/console-state.js (issue #454).

    function buildWeaponsConsoleState() {
      if (typeof window.buildConsoleState === 'function') return window.buildConsoleState('tactical', state);
      return JSON.stringify({ target_uuid: null, target_name: null, banks: [], tubes: [], torpedo_count: 0, phaser_mode: 'Auto', blips: [], phaser_arcs: [], torpedo_arcs: [] });
    }

    function pushWeaponsConsoleState() {
      if (activeConsole !== 'tactical') return;
      _pushIframe($('weapons-iframe'), 'tactical', buildWeaponsConsoleState());
    }

    // Attach on-load listener for an iframe that was created dynamically by
    // mountConsoles(). Each iframe re-pushes its console state on load so it
    // receives the current snapshot even after a reload or late mount, and
    // gets the swipe relay injected so the touch-swipe gesture works inside
    // the frame. consoleName must be the lowercase station id.
    function _attachIframeLoadListener(iframeEl, consoleName) {
      if (!iframeEl) return;
      iframeEl.addEventListener('load', () => {
        // Push the freshly-loaded iframe its current snapshot. Generic so it
        // covers every station id the ship mounts (including engineering /
        // science aggregates the old per-name switch never handled).
        pushConsoleStateFor(consoleName);
        injectSwipeRelay(iframeEl);
      });
    }

      // it covers the aggregate cruiser/destroyer consoles (engineering,
      // science, …) that the per-name push helpers below do not, and the
      // standalone consoles resolve to the same iframe via the registry.
      pushActiveConsoleState();
    }

    // -- Coordination popup (issue #494) ---------------------------------------
    let coordinationPopupTimer = null;
    function showCoordinationPopup(payload, sender_label) {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      const senderEl = document.getElementById('popup-sender');
      const titleEl = document.getElementById('popup-title');
      const bodyEl = document.getElementById('popup-body');
      if (!senderEl || !titleEl || !bodyEl) return;
      const label = sender_label || 'AI';
      if (payload.target) {
        senderEl.textContent = label + ' ? ' + payload.target;
      } else {
        senderEl.textContent = label;
      }

      // Normalise payload variants to { title, body }
      let title, body;
      if (payload.type === 'Advisory') {
        title = label || 'Advisory';
        body = payload.data?.message || payload.message || '';
      } else if (payload.type === 'Alert') {
        title = payload.data?.title || payload.title || 'Alert';
        body = payload.data?.body || payload.body || '';
      } else if (payload.type === 'FrequencyHint') {
        title = 'Frequency Hint';
        body = 'Tune to: ' + (payload.data?.frequency ?? payload.frequency ?? '?');
      } else if (payload.type === 'ShieldFacingDown') {
        title = (payload.data?.label || payload.label || 'Shield') + ' Offline';
        body = '';
      } else if (payload.type === 'ShieldFacingRestored') {
        title = (payload.data?.label || payload.label || 'Shield') + ' Restored';
        body = '';
      } else if (payload.type === 'TargetDesignation') {
        title = 'Sensors designates: ' + (payload.data?.label || payload.label || '?');
        body = '';
      } else {
        title = payload.type || 'Advisory';
        body = '';
      }

      titleEl.textContent = title;
      bodyEl.textContent = body;
      el.style.display = 'block';
      if (coordinationPopupTimer) clearTimeout(coordinationPopupTimer);
      coordinationPopupTimer = setTimeout(dismissCoordinationPopup, 8000);
    }
    function dismissCoordinationPopup() {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      el.style.display = 'none';
      if (coordinationPopupTimer) {
        clearTimeout(coordinationPopupTimer);
        coordinationPopupTimer = null;
      }
    }

      return JSON.stringify({ blips: [], ship_x: 0, ship_z: 0, impulse_charge_progress: 0, cancel_visible: false, on_screen: false, radar_range: 5000 });

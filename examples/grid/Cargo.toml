[package]
name = "phoenix-grid"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
phoenix-runtime = { path = "../../crates/phoenix-runtime" }
phoenix-transport = { path = "../../crates/phoenix-transport" }
phoenix-platform = { path = "../../crates/phoenix-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
phoenix-transport = { path = "../../crates/phoenix-transport", features = ["native"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.120"

[[bin]]
name = "phoenix-grid"
path = "src/main.rs"

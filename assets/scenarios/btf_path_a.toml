# Path A — The Diplomat
#
# Loaded when the crew hails Axiom Station.
# Contact: Administrator Chen. Reveals missing negotiator Dr. Sol Varen is
# detained aboard Ironveil. This path gives political context for the weapon.

# ── OBJECTIVES ────────────────────────────────────────────────────────────────

[[objective]]
id = "locate_sol"
text = "Locate missing Alliance negotiator Dr. Sol Varen."
auto_add = true

[[objective]]
id = "document_incursion"
text = "Transmit evidence of the Harrow incursion to Starcorp Command."

# ── COMMS DIALOGUE ────────────────────────────────────────────────────────────

[[comms]]
id = "chen_intro"
from = "Axiom Station — Adm. Chen"
subject = "Situation Report"
message = "Our lead negotiator, Dr. Sol Varen, has not reported in for six hours. The Harrow patrol refused our docking request and is not responding."
trigger = "on_load"

[[comms.responses]]
text = "We'll scan for Dr. Varen. What was their last known position?"
follow_up = "chen_sol_location"

[[comms.responses]]
text = "What do the Harrow want? Have they made any demands?"
follow_up = "chen_harrow_demands"

[[comms]]
id = "chen_sol_location"
from = "Axiom Station — Adm. Chen"
subject = "Re: Dr. Varen"
message = "Last contact was near grid 18-Kappa — that's where Ironveil is holding. I think they have Sol aboard. We can't prove it, but I know it."

[[comms.responses]]
text = "We'll hail Ironveil and demand Dr. Varen's release."
follow_up = "chen_sol_demand_sent"

[[comms]]
id = "chen_sol_demand_sent"
from = "Axiom Station — Adm. Chen"
subject = "Re: Dr. Varen"
message = "Thank you, Ardent. Whatever happens — the talks needed someone who believed they could work."

[[comms]]
id = "chen_harrow_demands"
from = "Axiom Station — Adm. Chen"
subject = "Re: Harrow Demands"
message = "No demands. That's what worries me. They're not here to negotiate. They're waiting for something."

[[comms.responses]]
text = "We'll find out what they're waiting for."
follow_up = "chen_waiting_ack"

[[comms]]
id = "chen_waiting_ack"
from = "Axiom Station — Adm. Chen"
subject = "Re: Harrow Demands"
message = "Be careful, Ardent. The Imperium doesn't send warhawks to wait."

# ── TRIGGERS — SOL FREED WHEN IRONVEIL IS DESTROYED ──────────────────────────

[[trigger]]
condition = "on_destroyed"
entity = "ironveil"
actions = [
    { complete_objective = "locate_sol" },
    { complete_objective = "document_incursion" },
    { push_comms = "sol_freed" },
]

[[comms]]
id = "sol_freed"
from = "Dr. Sol Varen"
subject = "Rescue Confirmed"
message = "This is Sol Varen — I'm aboard an escape pod. They have a weapon on that second ship. I heard the order. They're going to fire on the station."

[[comms.responses]]
text = "Dr. Varen, get clear. We'll handle Ashrender."

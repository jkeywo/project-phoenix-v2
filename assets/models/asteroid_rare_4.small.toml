[base]
offset = [ 0, -1.6481459288457476, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 2.1031596756133895, 2.1031596756133895, 2.1031596756133895 ]

[extents]
min = [ -1.1487856311553952, -1.6491610770296208, -1.9999999999999998 ]

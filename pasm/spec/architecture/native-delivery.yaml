  - component: native-pane-recovery
    core:
      status: implemented
      confidence: confirmed
      title: Native Pane and Display Recovery
      summary: A failed local pane or a display lost mid-mission is a recoverable participant disconnect, never a fatal native-host error. The affected Station uses ordinary Backfill, the mission and every other pane keep running, and a recreated pane returns through the same local Session identity. Three failure triggers route into the existing disconnect → Backfill → reconnect machinery; nothing in the simulation gains a pane-shaped branch.
      rationale:
        - "[ai] The whole design is that a pane failure REUSES the network disconnect machinery rather than forking it. A local pane is just another logical client (the #1122 doctrine), so its failure must behave exactly like a phone dropping: PaneBus::close owes the lobby one PlayerDisconnected, which flips the station to Backfill through the same control_source/rating rules, and the sim sees only that message. The pane's fault path from #1122 (inbox overflow → close) is one trigger; a view crash and a lost display are the two #1125 adds. There is deliberately NO special-case pane-failure path in the sim."
        - "[ai] View-crash detection is event-driven across the pane-thread boundary: PaneLoop counts consecutive frame-copy failures on the dedicated thread and emits CopyFailed events; drive_pane_host faults a console at VIEW_CRASH_COPY_FAILURES. A single copy error is an ordinary transient and a successful copy clears the count. The overflow trigger is PaneFault::ReliableOverflow and the per-view crash is PaneFault::ViewCrashed; recovery::service_faults closes every faulted pane and, for a view crash only, recreates it. A terminal ThreadFailed event or disconnected pane-thread channel instead invokes close_after_thread_failure, which marks consoles faulted and closes them through the ordinary disconnect path, clears their pending recreation work, and leaves them closed. PaneHostFailed prevents restart: the one Ultralight runtime is never respawned in the same process. Permanent lobby/HUD surfaces are cleared and reported without participant disconnects."
        - "[ai] A crash RECREATES and an overflow does not, and that split is deliberate. Both close the pane (the disconnect, the Backfill — identical). A view crash is a transient the display can be rebuilt from, so the faithful analogue of a network drop is to rebuild the view and let the page rejoin on the same token — the in-process analogue of the browser client's automatic redial. A reliable overflow is a page that stopped draining; recreating it blindly risks a rebuild loop against a page that wedges again, so it closes and stays closed and the operator decides. Auto-recreate is scoped to the crash case for exactly this reason."
        - "[ai] Recreation re-identifies on the SAME session token, which is the entire point: PaneBus::recreate opens a fresh pane carrying the closed pane's identity (a new PaneId — ids are never reissued — with the same token), republishes an identical document at a fresh nonce, and enqueues the new (id, url) for the Ultralight host to build a view for next frame. The reloaded page's Identify is then a RECONNECT, which handle_identify answers with reconnect-yield: the held station (still Backfill, still unclaimed because holder_for_station gates on connected) is restored to the human and the current projection is pushed. A pane's reconnect is in-process and needs NO #1112 transport, which is what retire_closed_panes' old 'reopening is out of scope' note deferred to it — that note is now wrong and updated."
        - "[ai] No surviving pane inherits a failed pane's projection, and this needs no new mechanism. Audience projection resolves through SessionManager::holder_for_station, which gates on connected, so the instant the failed token disconnects nothing resolves to it; session-connection-registry compares whole tokens and routes only to their current physical owners, so a neighbouring pane with a different token is never an addressee. The recreated pane carries the SAME token and legitimately receives that token's projection again — that is the reconnect, not a leak. The leak this rules out is a bystander or the closed handle receiving the failed pane's private projection; both receive nothing."
        - "[ai] Runtime display loss is the RUNTIME companion to #1123's setup-time missing-display report (ProfileProblem::MonitorMissing, found when a host boots). watch_runtime_displays diffs the live Monitor entity set frame to frame — bevy_winit despawns a Monitor entity when its display disconnects — and the pure runtime_display_losses names each configured monitor that was present and is now gone (a RuntimeDisplayLoss, an authored string). A lost STATION's panes are failed by participant name through PaneBus::open_pane_for_name and closed (→ Backfill); a lost VIEWSCREEN is named but fails no pane, because nobody sits there and the shared 3-D view simply has nowhere to draw until it returns. The pure detection is CI-tested; the watcher itself is CI-tested by spawning and despawning FAKE Monitor entities, which is exactly what winit does on hot-plug, so no display is needed."
        - "[ai] A display loss does NOT recreate — that would be a silent re-home, which #1123's doctrine forbids. The display is gone; there is nowhere to rebuild the view. Bringing a returned display back into use is an EXPLICIT repair: runtime_display_returns reports it and re-applying the profile is the deliberate act that places a surface. The applied-once guard (BridgeDisplayApplied) means nothing silently moves a pane onto reappeared hardware. This is why the watcher CLOSES a display-lost pane directly rather than faulting it — a fault would ask the pane host to rebuild the view — and the two paths (fault → maybe-recreate, display-loss → close) stay distinct."
        - "[ai] The fault-injection tests split along the SDK line, as the acceptance criteria intend. The view-crash injection at the seam (PaneBus::fault(ViewCrashed)), the close → Backfill, the no-projection-leak, and recreate → same-identity reconnect all run in CI without the SDK, because a pane's PaneBus is the whole of how it talks to the simulation and is drivable from a test with no view. The runtime watcher is CI-tested with fake Monitor entities. Only injecting a crash into a REAL Ultralight view needs the SDK and a GPU, and that is #[ignore]d and run once locally, exactly as #1121's and #1122's GPU proofs are."
        - "[ai] WHERE A REBUILT VIEW GOES IS A STATED RULE IN A PURE MODULE (issue #1333), not a fallback chain inside the adapter. panes::placement::home_for_pane asks four things in order: the live BridgeStationSurfaces slot wins, so a console the operator put on a wall monitor — a lobby-seated station's, or a --profile's authored participant pane — is rebuilt on that monitor's own window at the rectangle the layout gives it NOW; then, if the LAW seats a station of this pane's name and there is no slot, the answer is NoHome::SeatedButUnplaced and NOTHING is built, because tiling a wall console on the primary window would put it straight over the shared view; then the stored primary tile, which is the legacy --pane-without---profile home, unchanged since #1125; then nowhere, with a reason rather than a guess. The move out of open_pending_views is the substance: that function is behind --features ultralight, which no CI job in this repository compiles, so the one rule this host has about which screen a console lives on was in the half nothing checks — the same objection panes/mod.rs records against every other pane claim. reconcile_seated_consoles is what makes the unbuilt answer safe: it repairs the seat boundedly on the same identity and then surrenders it through the law with the notice the row renders."
        - "[ai] The violation was NOT reachable before #1333, and writing down why is the point. The tile fallback keys on a pane's participant name; PaneHost records tiles only at init_pane_host from the --pane list; and #1331's install_world_selection refuses a --pane label that shadows a station id. So a lobby-seated console had no tile to fall back to and fell through the old continue instead — three facts in three files, none stating the rule and none testing it, while #1332 (a monitor carrying BOTH an authored pane and a station console) is exactly the slice that would have made it reachable. What WAS a live trap is that the geometry record was written for a pane the profile seated on a STATION window as well as for a tiled one, carrying that monitor's rectangle — which on the primary window is an arbitrary strip over the viewscreen. PaneTile is no longer recorded for a seated pane at all, so the trap is removed rather than guarded, and the rule declines to reach for it either way."
        - "[ai] NOT BUILT MUST NOT MEAN FORGOTTEN, so the placement answer carries a RETRY decision and NoHome::should_retry states it in the pure module. take_pending_views has already drained the entry by the time home_for_pane is asked, so a Nowhere the pane host merely skips leaves a pane the bus lists as open with no view and nothing left to rebuild it. For a seated console that is reachable in ONE frame: reconcile_seated_consoles reaches its grace, closes and recreates the console — resetting its own strike counter as it does — the pane host drains that entry later in the same frame with the slot still missing, and the next frame the slot returns, so the health check (pane open AND slot present) reads healthy for ever over a black screen, with no retry and no surrender. SeatedButUnplaced therefore FAULTS (PaneFault::ViewCrashed — the same treatment, for the same written-out reason, a view that fails to BUILD gets) and rides #1125's bounded path to a rebuild that lands or a seat given back with a notice; Unplaced does not, because a retry has nowhere to aim and would only flap to the budget and close a console nobody asked to close. The decision is pure rather than in the adapter precisely because the adapter is behind --features ultralight, which no CI job compiles."
        - "[ai] #1333 ACCEPTS ONE RESIDUE: the authored participant's console. A --profile [[display.pane]] with a label and no station key is a PERSON's console on a Station window; it is placed by rule 1 and records no tile. If its Station surface is dropped (monitor unplugged, window rebuilt) and its view then faults, the rebuild reaches rule 4 — no slot, no seat in the law (the law seats STATIONS), no tile — so it is NoHome::Unplaced, is not retried, and nothing else picks it up, because reconcile_seated_consoles iterates the roster's seated stations only. The pane stays open with no view and no notice is raised. That is a trade taken on purpose: the behaviour it replaced was worse (the same pane was rebuilt on the primary window OVER the shared view, at a rectangle measured on a different monitor), and doing better than leaving it needs a lifecycle for participant panes the layout does not own — the same lifecycle a resizable or re-homable participant pane needs. A fix belongs with that work, not with a placement rule."
        - "[ai] The crash-during-a-move edge resolves through machinery both paths already share, and is now pinned. service_faults closes and recreates (queueing a view); a move landing before the pane host drains that queue closes THAT pane and recreates it again through the same close + recreate. Two queue entries, one console: open_pending_views skips the first because PaneBus::is_open reports its pane closed in the interval — the guard #1125 added for a display loss in the same window — and builds the second against the surfaces the move rewrote. Nothing double-builds, nothing is orphaned, and the session token survives both hops, so whoever claimed that console keeps it across a crash and a move together. The move path deliberately does not spend the per-identity recreation budget; only a fault and the reconciler do."
    architecture:

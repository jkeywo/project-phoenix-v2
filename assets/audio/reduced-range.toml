# Optional listening comfort. Full dynamics remains the endpoint default.
# Browser's compressor includes its own makeup gain; compensation bounds that
# gain. Native uses an explicit quiet gain and linked-channel peak protection.
# These are presentation settings, never simulation inputs or cue storage.
threshold_db = -24.0
knee_db = 12.0
ratio = 4.0
attack_seconds = 0.005
release_seconds = 0.25
browser_compensation = 0.5
native_quiet_gain = 1.3
ceiling = 0.5

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Project Phoenix — Navigation Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { margin: 0; overflow: hidden; background: #000; touch-action: none; }

    #map-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      cursor: grab; touch-action: none;
      display: block;
    }
    #map-canvas.grabbing { cursor: grabbing; }

    .hud-corner {
      position: fixed;
      pointer-events: none;
      font-family: "JetBrains Mono", monospace;
      font-size: 10px;
      letter-spacing: .22em;
      color: var(--ink-faint);
      line-height: 1.85;
    }
    #hud-tl { top: 18px; left: 20px; }
    #hud-tr { top: 18px; right: 20px; text-align: right; }

    #hud-tl::before {
      content: "";
      position: absolute;
      top: -7px; left: -9px;
      width: 20px; height: 20px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }
    #hud-tr::before {
      content: "";
      position: absolute;
      top: -7px; right: -9px;
      width: 20px; height: 20px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .hud-label {
      color: var(--cyan);
      font-size: 8px;
      letter-spacing: .32em;
      margin-bottom: 3px;
      display: block;
    }
    .hud-val { color: var(--ink); }
    .hud-val.ok { color: var(--loaded); }
    .hud-val.tac { color: var(--tactical); }
    .hud-val.cyan { color: var(--cyan); }

    #entity-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 14px 18px 20px;
      background:
        linear-gradient(0deg,
          rgba(5,8,24,0.97) 0%,
          rgba(5,8,24,0.82) 72%,
          transparent 100%);
      border-top: 1px solid var(--line-soft);
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 14px;
    }
    #entity-overlay::before {
      content: "";
      position: absolute;
      top: -1px; left: 0;
      width: 24px; height: 14px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      pointer-events: none;
    }
    #entity-overlay::after {
      content: "";
      position: absolute;
      top: -1px; right: 0;
      width: 24px; height: 14px;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
      pointer-events: none;
    }

    #entity-info { flex: 1 1 0; min-width: 0; }

    .ent-name {
      font-family: "Chakra Petch", sans-serif;
      font-size: 18px; font-weight: 600;
      color: var(--ink); letter-spacing: .06em; line-height: 1.2;
    }
    .ent-name.empty {
      font-size: 11px; letter-spacing: .28em; color: var(--ink-faint);
    }

    .badges {
      display: flex; gap: 5px; flex-wrap: wrap;
      margin-top: 5px; align-items: center;
    }
    .badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 8px; letter-spacing: .18em;
      padding: 2px 6px; border: 1px solid;
    }
    .badge.hostile  { color: var(--fire-bright); border-color: var(--fire-dim);   background: rgba(224,64,44,.09); }
    .badge.friendly { color: var(--loaded);      border-color: var(--loaded-dim); background: rgba(78,200,112,.09); }
    .badge.neutral  { color: var(--cyan);        border-color: var(--cyan-dim);   background: rgba(108,182,208,.09); }
    .badge.type     { color: var(--ink-dim);     border-color: var(--line-faint); }

    .pos-strip {
      display: flex; gap: 12px; margin-top: 8px;
      padding-top: 7px; border-top: 1px solid var(--line-faint);
      align-items: baseline; flex-wrap: wrap;
    }
    .ps-item { display: flex; align-items: baseline; gap: 4px; }
    .ps-k { font-family: "JetBrains Mono", monospace; font-size: 8px; letter-spacing: .2em; color: var(--ink-faint); }
    .ps-v { font-family: "Chakra Petch", sans-serif; font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: .05em; }
    .ps-u { font-family: "JetBrains Mono", monospace; font-size: 8px; color: var(--ink-faint); letter-spacing: .14em; }
    .ps-sep { color: var(--line-soft); font-size: 10px; }

    #ent-wp-row {
      font-family: "JetBrains Mono", monospace;
      font-size: 8px; letter-spacing: .22em;
      color: var(--ink-faint);
      margin-top: 5px;
    }
    #ent-wp-val { color: var(--tactical); }

    #action-btns {
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    #action-btns .btn {
      --h: 50px;
      font-size: 12px; letter-spacing: .2em;
      padding: 0 14px 0 36px;
      cursor: pointer;
    }
    #action-btns .btn:active > .btn-bg { opacity: .7; }
    #action-btns .btn .led { width: 10px; height: 10px; left: 11px; }

    .btn.sensors            { color: var(--cyan); cursor: pointer; }
    .btn.sensors > .btn-bg  { background: linear-gradient(180deg, #0b1d2b 0%, #060e16 100%); }
    .btn.sensors            { background: linear-gradient(180deg, #4d9fbe 0%, #1a4858 55%, #091620 100%); }

    #btn-clear-waypoint, #btn-set-waypoint {
      color: var(--tactical);
      cursor: pointer;
    }

    #wp-toast {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-family: "JetBrains Mono", monospace;
      font-size: 11px; letter-spacing: .3em;
      color: var(--tactical);
      background: rgba(5,8,24,0.92);
      border: 1px solid var(--tactical);
      box-shadow: 0 0 24px rgba(240,132,56,0.25);
      padding: 10px 24px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .22s ease;
    }
    #wp-toast.show { opacity: 1; }
    #map-canvas.picking { cursor: crosshair; }

    #hidden-data {
      position: absolute;
      left: -9999px; visibility: hidden;
    }

    @media (orientation: landscape) {
      #entity-overlay {
        bottom: 0; top: 0;
        left: auto; right: 0; width: 300px;
        flex-direction: column;
        align-items: stretch;
        border-top: none;
        border-left: 1px solid var(--line-soft);
        padding: 22px 18px 22px;
        background: linear-gradient(270deg,
          rgba(5,8,24,0.97) 0%,
          rgba(5,8,24,0.82) 72%,
          transparent 100%);
      }
      #entity-overlay::before {
        top: 0; left: -1px; right: auto;
        bottom: 0; width: 14px; height: 24px;
        border-top: 1px solid var(--line);
        border-right: none;
        border-left: none;
        border-bottom: 1px solid var(--line);
      }
      #entity-overlay::after { display: none; }
      #entity-info { flex: 1; }
      #action-btns { flex-direction: column; }
      .ent-name     { font-size: 15px; }
      .ps-v         { font-size: 17px; }
    }
  </style>
</head>
<body>

  <canvas id="map-canvas"></canvas>

  <div class="hud-corner" id="hud-tl">
    <span class="hud-label">NAVIGATION · HELM</span>
    <div>POS&nbsp;<span class="hud-val" id="hud-pos">0 / 0</span></div>
    <div>HDG&nbsp;<span class="hud-val" id="hud-hdg">0°</span></div>
    <div>SPD&nbsp;<span class="hud-val ok" id="hud-spd">0 kn</span></div>
    <div>IMP&nbsp;<span class="hud-val" id="hud-imp">—</span></div>
  </div>

  <div class="hud-corner" id="hud-tr">
    <span class="hud-label">MAP VIEW</span>
    <div>ZOOM&nbsp;<span class="hud-val cyan" id="hud-zoom">0.15×</span></div>
    <div id="hud-region" class="hud-val tac">—</div>
  </div>

  <div id="entity-overlay">
    <div id="entity-info">
      <div class="ent-name empty" id="ent-name">TAP MAP TO SELECT</div>
      <div class="badges" id="ent-badges"></div>
      <div class="pos-strip">
        <div class="ps-item">
          <span class="ps-k">BRG</span>
          <span class="ps-v" id="ent-brg">—</span>
          <span class="ps-u">°</span>
        </div>
        <span class="ps-sep">·</span>
        <div class="ps-item">
          <span class="ps-k">RNG</span>
          <span class="ps-v" id="ent-rng">—</span>
          <span class="ps-u">AU</span>
        </div>
      </div>
      <div id="ent-wp-row">
        WP&nbsp;<span id="ent-wp-val">NOT SET</span>
      </div>
    </div>
    <div id="action-btns">
      <button class="btn sensors" id="btn-on-screen" type="button">
        <span class="btn-bg"></span>
        <span class="led cyan"></span>
        <span class="label">ON SCREEN</span>
      </button>
      <button class="btn tactical" id="btn-set-waypoint" type="button">
        <span class="btn-bg"></span>
        <span class="led amber"></span>
        <span class="label">SET WAYPOINT</span>
      </button>
      <button class="btn tactical" id="btn-clear-waypoint" type="button">
        <span class="btn-bg"></span>
        <span class="led amber"></span>
        <span class="label">CLEAR WP</span>
      </button>
    </div>
  </div>

  <div id="wp-toast">WAYPOINT SET</div>

  <div id="hidden-data">
    <div id="nav-data"></div>
    <div id="impulse-data"></div>
    <div id="waypoint-data"></div>
  </div>

  <script type="module">
    import { initConsole } from './console-core.js';

    const canvas = document.getElementById('map-canvas');
    const ctx    = canvas.getContext('2d');
    let W = 0, H = 0;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      draw();
    }
    window.addEventListener('resize', resize);

    let panX = 0, panY = 0;
    let zoom = 0.15;
    const ZOOM_MIN = 0.04, ZOOM_MAX = 2.5;

    const toSX = wx => W * 0.5 + (wx - panX) * zoom;
    const toSY = wy => H * 0.5 + (wy - panY) * zoom;
    const toWX = sx => panX + (sx - W * 0.5) / zoom;
    const toWY = sy => panY + (sy - H * 0.5) / zoom;

    let _state       = null;
    let _entities    = [];
    let _regions     = [];
    let _ownX        = 0;
    let _ownY        = 0;
    let _ownHeading  = 0;
    let _ownSpeed    = 0;
    let _waypoint    = null;
    let _onScreen    = false;
    let _impulseCharge = 0;
    let _cancelVisible = false;
    let _selectedId  = null;
    let _sendAction  = null;

    const stars = Array.from({length:320}, () => ({
      x: Math.random(), y: Math.random(),
      r: Math.random() < 0.12 ? 1.3 : 0.55,
      a: 0.25 + Math.random() * 0.55
    }));

    function draw() {
      if (!W || !H) return;
      drawBackground();
      drawStars();
      drawGrid();
      drawWaypointLine();
      drawRegions();
      drawEntities();
      drawOwnShip();
      drawOffscreenIndicator();
      updateHUDLabels();
    }

    function drawBackground() {
      const g = ctx.createRadialGradient(W*.48, H*.38, 0, W*.48, H*.38, Math.max(W,H)*.9);
      g.addColorStop(0, '#07091e');
      g.addColorStop(0.5, '#030610');
      g.addColorStop(1,   '#000000');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    function drawStars() {
      ctx.save();
      stars.forEach(s => {
        const px = ((s.x + panX * 0.00012) % 1 + 1) % 1 * W;
        const py = ((s.y + panY * 0.00012) % 1 + 1) % 1 * H;
        ctx.globalAlpha = s.a;
        ctx.fillStyle = '#b8ceff';
        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function drawGrid() {
      const MAJOR = 200, MINOR = 50;
      const visL = toWX(0),   visR = toWX(W);
      const visT = toWY(0),   visB = toWY(H);
      ctx.save();
      ctx.strokeStyle = 'rgba(40,58,120,0.22)';
      ctx.lineWidth = 0.5;
      for (let gx = Math.floor(visL/MINOR)*MINOR; gx < visR+MINOR; gx+=MINOR) {
        ctx.beginPath(); ctx.moveTo(toSX(gx),0); ctx.lineTo(toSX(gx),H); ctx.stroke();
      }
      for (let gy = Math.floor(visT/MINOR)*MINOR; gy < visB+MINOR; gy+=MINOR) {
        ctx.beginPath(); ctx.moveTo(0,toSY(gy)); ctx.lineTo(W,toSY(gy)); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(70,95,165,0.32)';
      ctx.lineWidth = 0.8;
      for (let gx = Math.floor(visL/MAJOR)*MAJOR; gx < visR+MAJOR; gx+=MAJOR) {
        ctx.beginPath(); ctx.moveTo(toSX(gx),0); ctx.lineTo(toSX(gx),H); ctx.stroke();
      }
      for (let gy = Math.floor(visT/MAJOR)*MAJOR; gy < visB+MAJOR; gy+=MAJOR) {
        ctx.beginPath(); ctx.moveTo(0,toSY(gy)); ctx.lineTo(W,toSY(gy)); ctx.stroke();
      }
      ctx.restore();
    }

    function drawWaypointLine() {
      if (!_waypoint) return;
      ctx.save();
      ctx.strokeStyle = 'rgba(240,132,56,0.55)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([10,8]);
      ctx.beginPath();
      ctx.moveTo(toSX(_ownX), toSY(_ownY));
      ctx.lineTo(toSX(_waypoint.x), toSY(_waypoint.z));
      ctx.stroke();
      ctx.setLineDash([]);
      const px = toSX(_waypoint.x), py = toSY(_waypoint.z);
      const d = 9;
      ctx.fillStyle = 'rgba(240,132,56,0.18)';
      ctx.strokeStyle = '#f08438';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#f08438';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(px, py-d); ctx.lineTo(px+d, py);
      ctx.lineTo(px, py+d); ctx.lineTo(px-d, py);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      if (zoom > 0.1) {
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = '#f08438';
        ctx.textAlign = 'left';
        ctx.fillText('WP', px + d + 5, py + 3);
      }
      ctx.restore();
    }

    const ENT_COL = {
      self:     '#6cb6d0',
      hostile:  '#ff6040',
      friendly: '#4ec870',
      neutral:  '#7a90c0',
    };

    function regionColor(region, alpha) {
      const c = region.color || [0.6, 0.4, 1.0];
      const r = Math.round(c[0] * 255);
      const g = Math.round(c[1] * 255);
      const b = Math.round(c[2] * 255);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    function drawRegions() {
      _regions.forEach(region => {
        const px = toSX(region.x || 0);
        const py = toSY(region.z || 0);
        const stroke = region.objective_target ? '#d4a820' : regionColor(region, 0.95);
        const fill = regionColor(region, 0.16);
        ctx.save();
        ctx.strokeStyle = stroke;
        ctx.fillStyle = fill;
        ctx.lineWidth = region.objective_target ? 2 : 1.4;
        ctx.shadowColor = region.objective_target ? '#d4a820' : 'transparent';
        ctx.shadowBlur = region.objective_target ? 12 : 0;

        if (region.shape === 'box' && region.half_extents) {
          const hw = Math.max(4, (region.half_extents[0] || 0) * zoom);
          const hh = Math.max(4, (region.half_extents[1] || 0) * zoom);
          ctx.fillRect(px - hw, py - hh, hw * 2, hh * 2);
          ctx.strokeRect(px - hw, py - hh, hw * 2, hh * 2);
        } else if (region.shape === 'torus') {
          const outer = Math.max(4, (region.outer_radius || region.radius || 0) * zoom);
          const inner = Math.max(0, (region.inner_radius || 0) * zoom);
          const ringWidth = Math.max(1, outer - inner);
          ctx.beginPath();
          ctx.arc(px, py, (outer + inner) / 2, 0, Math.PI * 2);
          ctx.lineWidth = ringWidth;
          ctx.stroke();
        } else {
          const r = Math.max(4, (region.radius || 0) * zoom);
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        ctx.shadowBlur = 0;
        if (zoom > 0.08 && region.name) {
          ctx.font = '8px "JetBrains Mono", monospace';
          ctx.fillStyle = stroke;
          ctx.textAlign = 'left';
          ctx.fillText(region.name, px + 8, py - 8);
        }
        ctx.restore();
      });
    }

    function drawEntities() {
      _entities.forEach(e => {
        if (e.id === 'own') return;
        const px = toSX(e.x), py = toSY(e.y);
        if (px < -40 || px > W+40 || py < -40 || py > H+40) return;

        const col = ENT_COL[e.stance] || ENT_COL.neutral;
        const sel = e.id === _selectedId;
        const sz  = Math.max(0.7, Math.min(1.6, zoom * 5));
        const r   = 6 * sz;

        ctx.save();
        ctx.translate(px, py);

        if (e.objective_target) {
          ctx.strokeStyle = '#d4a820';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#d4a820';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(0, 0, 16 * sz, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        if (sel) {
          const bk = 15 * sz, bs = 6 * sz;
          ctx.strokeStyle = '#f08438';
          ctx.lineWidth = 1.5;
          ctx.globalAlpha = 0.9;
          [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx2,sy2]) => {
            ctx.beginPath();
            ctx.moveTo(sx2*(bk-bs), sy2*bk);
            ctx.lineTo(sx2*bk,       sy2*bk);
            ctx.lineTo(sx2*bk,       sy2*(bk-bs));
            ctx.stroke();
          });
          ctx.globalAlpha = 1;
        }

        ctx.shadowColor = col;
        ctx.shadowBlur  = sel ? 16 : 7;

        if (e.kind === 'ship' || e.kind === 'waypoint') {
          ctx.fillStyle   = e.kind === 'waypoint' ? '#f08438' : col;
          ctx.strokeStyle = e.kind === 'waypoint' ? '#f08438' : col;
          ctx.lineWidth   = 1;
          ctx.beginPath();
          ctx.moveTo(0,-r); ctx.lineTo(r*.6,0); ctx.lineTo(0,r*.8); ctx.lineTo(-r*.6,0);
          ctx.closePath(); ctx.fill();
        } else if (e.kind === 'station') {
          ctx.fillStyle   = col + '2a';
          ctx.strokeStyle = col;
          ctx.lineWidth   = 1.5;
          ctx.beginPath();
          ctx.moveTo(0,-r*1.2); ctx.lineTo(r*1.2,0); ctx.lineTo(0,r*1.2); ctx.lineTo(-r*1.2,0);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
          ctx.beginPath(); ctx.moveTo(-r*.7,0); ctx.lineTo(r*.7,0); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0,-r*.7); ctx.lineTo(0,r*.7); ctx.stroke();
          ctx.globalAlpha = 1;
        } else if (e.kind === 'planet') {
          ctx.fillStyle   = col + '30';
          ctx.strokeStyle = col;
          ctx.lineWidth   = 1.5;
          ctx.beginPath(); ctx.arc(0,0,r*1.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
        } else if (e.kind === 'star') {
          ctx.strokeStyle = col; ctx.lineWidth = 1.5;
          const s = r * 0.6;
          ctx.beginPath();
          ctx.moveTo(-s,-s); ctx.lineTo(s, s);
          ctx.moveTo(s,-s);  ctx.lineTo(-s, s);
          ctx.stroke();
        } else if (e.kind === 'asteroid') {
          ctx.strokeStyle = col; ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-r*.7,-r*.7); ctx.lineTo(r*.7,r*.7);
          ctx.moveTo(r*.7,-r*.7);  ctx.lineTo(-r*.7,r*.7);
          ctx.stroke();
        }

        ctx.shadowBlur = 0;

        if (zoom > 0.1) {
          ctx.font = Math.round(8*Math.min(sz,1.1)) + 'px "JetBrains Mono", monospace';
          ctx.fillStyle   = sel ? '#f08438' : col;
          ctx.shadowColor = 'transparent';
          ctx.textAlign   = 'left';
          ctx.fillText(e.name, r * 1.6 + 2, 3);
        }

        ctx.restore();
      });
    }

    function drawOwnShip() {
      const px = toSX(_ownX), py = toSY(_ownY);
      if (px < -60 || px > W+60 || py < -60 || py > H+60) return;
      const sz  = Math.max(0.8, Math.min(1.8, zoom * 5));
      const r   = 8 * sz;
      const rad = (_ownHeading - 90) * Math.PI / 180;
      const col = '#6cb6d0';

      ctx.save();
      ctx.translate(px, py);

      ctx.strokeStyle = 'rgba(108,182,208,0.22)';
      ctx.lineWidth   = 1;
      ctx.beginPath(); ctx.arc(0,0,r*2.2,0,Math.PI*2); ctx.stroke();

      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.moveTo(Math.cos(rad)*r*1.7, Math.sin(rad)*r*1.7);
      ctx.lineTo(Math.cos(rad)*r*2.8, Math.sin(rad)*r*2.8);
      ctx.stroke();
      ctx.globalAlpha = 1;

      ctx.rotate(rad + Math.PI/2);
      ctx.shadowColor = col; ctx.shadowBlur = 14;
      ctx.fillStyle   = col;
      ctx.beginPath();
      ctx.moveTo(0, -r);
      ctx.lineTo(r*.65,  r*.45);
      ctx.lineTo(0,      r*.05);
      ctx.lineTo(-r*.65, r*.45);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.restore();

      if (zoom > 0.09) {
        ctx.save();
        ctx.font = '8px "JetBrains Mono", monospace';
        ctx.fillStyle = col; ctx.textAlign = 'center';
        ctx.fillText('OWN', px, py + r * 2.4 + 10);
        ctx.restore();
      }
    }

    function drawOffscreenIndicator() {
      const px = toSX(_ownX), py = toSY(_ownY);
      if (px >= 10 && px <= W-10 && py >= 10 && py <= H-10) return;
      const ang = Math.atan2(py - H*.5, px - W*.5);
      const ar  = Math.min(W,H) * 0.43;
      const ax  = W*.5 + Math.cos(ang)*ar;
      const ay  = H*.5 + Math.sin(ang)*ar;
      ctx.save();
      ctx.translate(ax, ay); ctx.rotate(ang);
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = '#6cb6d0';
      ctx.beginPath();
      ctx.moveTo(10,0); ctx.lineTo(-5,-5); ctx.lineTo(-5,5);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function updateHUDLabels() {
      document.getElementById('hud-pos').textContent  = Math.round(_ownX) + ' / ' + Math.round(_ownY);
      document.getElementById('hud-zoom').textContent = zoom.toFixed(2) + '×';
      document.getElementById('hud-hdg').textContent  = _ownHeading.toFixed(0) + '°';
      document.getElementById('hud-spd').textContent  = _ownSpeed.toFixed(1) + ' kn';

      const impEl = document.getElementById('hud-imp');
      if (impEl) {
        if (_cancelVisible) {
          impEl.textContent = Math.round(_impulseCharge * 100) + '%';
          impEl.className = 'hud-val ok';
        } else {
          impEl.textContent = '—';
          impEl.className = 'hud-val';
        }
      }

      document.getElementById('hud-region').textContent = '—';
    }

    function handleTap(cx, cy) {
      const wx2 = toWX(cx), wy2 = toWY(cy);

      if (_pickingWaypoint) {
        _pickingWaypoint = false;
        canvas.classList.remove('picking');
        if (_sendAction) _sendAction('set_navigation_waypoint', { x: wx2, z: wy2 });
        showToast('WAYPOINT SET');
        return;
      }

      let best = null, bestD = Infinity;
      _entities.forEach(e => {
        if (e.id === 'own') return;
        const d = Math.hypot(e.x-wx2, e.y-wy2);
        const thresh = 55/zoom;
        if (d < thresh && d < bestD) { bestD = d; best = e; }
      });
      _selectedId = best ? best.id : null;
      updateEntityPanel(best);
      draw();
    }

    function updateEntityPanel(e) {
      const nameEl = document.getElementById('ent-name');
      const bdgEl  = document.getElementById('ent-badges');
      const brgEl  = document.getElementById('ent-brg');
      const rngEl  = document.getElementById('ent-rng');

      if (!e || e.id === 'own') {
        nameEl.textContent = 'TAP MAP TO SELECT';
        nameEl.className   = 'ent-name empty';
        bdgEl.innerHTML    = '';
        brgEl.textContent  = '—';
        rngEl.textContent  = '—';
        return;
      }

      nameEl.textContent = e.name;
      nameEl.className   = 'ent-name';

      const SC = { hostile:'hostile', friendly:'friendly', neutral:'neutral' };
      const SL = { hostile:'HOSTILE', friendly:'ALLIED',   neutral:'NEUTRAL' };
      const TL = { ship:'WARSHIP', station:'STARBASE', planet:'PLANET', asteroid:'ASTEROID', star:'STAR' };

      let html = '<span class="badge '+(SC[e.stance]||'neutral')+'">'+(SL[e.stance]||'UNKNOWN')+'</span>';
      html    += '<span class="badge type">'+(TL[e.kind]||e.kind.toUpperCase())+'</span>';
      if (e.faction) html += '<span class="badge neutral">'+e.faction.toUpperCase()+'</span>';
      bdgEl.innerHTML = html;

      const dx = e.x - _ownX;
      const dz = e.y - _ownY;
      const dist = Math.hypot(dx, dz);
      const brg  = ((Math.atan2(dx, -dz)*180/Math.PI)+360)%360;
      brgEl.textContent = brg.toFixed(1);
      rngEl.textContent = Math.round(dist);
    }

    let _pickingWaypoint = false;
    let _wpToastTimer = null;

    function showToast(msg, duration = 1900) {
      const toast = document.getElementById('wp-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(_wpToastTimer);
      _wpToastTimer = setTimeout(() => toast.classList.remove('show'), duration);
    }

    function updateWaypointButtons() {
      const hasWp = !!_waypoint;
      document.getElementById('btn-set-waypoint').style.display   = hasWp ? 'none' : '';
      document.getElementById('btn-clear-waypoint').style.display = hasWp ? '' : 'none';
    }

    let drag = null;

    canvas.addEventListener('mousedown', e => {
      drag = { sx: e.clientX, sy: e.clientY, px: panX, py: panY, picking: _pickingWaypoint };
      if (!_pickingWaypoint) canvas.classList.add('grabbing');
    });
    window.addEventListener('mousemove', e => {
      if (!drag || drag.picking) return;  // don't pan while placing a waypoint
      panX = drag.px - (e.clientX - drag.sx) / zoom;
      panY = drag.py - (e.clientY - drag.sy) / zoom;
      draw();
    });
    window.addEventListener('mouseup', e => {
      if (!drag) return;
      const moved = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy);
      if (drag.picking || moved < 5) handleTap(e.clientX, e.clientY);
      drag = null;
      canvas.classList.remove('grabbing');
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.13 : 0.885;
      const mx = toWX(e.clientX), my = toWY(e.clientY);
      zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom * factor));
      panX = mx - (e.clientX - W*.5) / zoom;
      panY = my - (e.clientY - H*.5) / zoom;
      draw();
    }, { passive: false });

    let touchMap    = {};
    let lastPinch   = null;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const t of e.changedTouches)
        touchMap[t.identifier] = { x: t.clientX, y: t.clientY, ox: t.clientX, oy: t.clientY };
      if (e.touches.length === 1)
        drag = { sx: e.touches[0].clientX, sy: e.touches[0].clientY, px: panX, py: panY, picking: _pickingWaypoint };
      lastPinch = null;
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      if (e.touches.length >= 2) {
        const t0 = e.touches[0], t1 = e.touches[1];
        const dist = Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY);
        if (lastPinch) {
          const factor = dist / lastPinch;
          const mcx = (t0.clientX+t1.clientX)*.5, mcy = (t0.clientY+t1.clientY)*.5;
          const mx = toWX(mcx), my = toWY(mcy);
          zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, zoom*factor));
          panX = mx - (mcx - W*.5)/zoom;
          panY = my - (mcy - H*.5)/zoom;
          draw();
        }
        lastPinch = dist; drag = null;
      } else if (e.touches.length === 1 && drag && !drag.picking) {
        panX = drag.px - (e.touches[0].clientX - drag.sx) / zoom;
        panY = drag.py - (e.touches[0].clientY - drag.sy) / zoom;
        draw();
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      if (e.changedTouches.length === 1 && e.touches.length === 0) {
        const t   = e.changedTouches[0];
        const rec = touchMap[t.identifier];
        if (_pickingWaypoint || (rec && Math.hypot(t.clientX-rec.ox, t.clientY-rec.oy) < 9))
          handleTap(t.clientX, t.clientY);
      }
      for (const t of e.changedTouches) delete touchMap[t.identifier];
      drag = null; lastPinch = null;
    }, { passive: false });

    function _render(s) {
      _state    = s;
      _ownX     = s.ship_x || 0;
      _ownY     = s.ship_z || 0;
      _ownHeading = s.ship_heading || 0;
      _ownSpeed   = s.ship_speed || 0;
      _onScreen   = !!s.on_screen;
      _impulseCharge = s.impulse_charge_progress || 0;
      _cancelVisible = !!s.cancel_visible;
      _regions = s.regions || [];

      const waypointBlip = (s.blips || []).find(b => b.kind === 'waypoint');
      if (s.waypoint && s.waypoint.x !== undefined) {
        _waypoint = s.waypoint;
      } else {
        _waypoint = null;
      }

      const newEntities = [
        { id:'own', name:'OWN SHIP', x: _ownX, y: _ownY, kind:'self', stance:'self' }
      ];
      (s.blips || []).forEach(blip => {
        if (blip.kind === 'waypoint' && blip.uuid === 'navigation-waypoint') return;
        newEntities.push({
          id: blip.uuid,
          name: blip.name || 'UNKNOWN',
          kind: blip.kind || 'asteroid',
          x: blip.world_x !== undefined ? blip.world_x : 0,
          y: blip.world_z !== undefined ? blip.world_z : 0,
          stance: blip.stance || 'neutral',
          faction: blip.faction || null,
          objective_target: !!blip.objective_target,
          colour: blip.colour || null,
          ship_class: blip.ship_class || null,
          hull_pct: blip.hull_pct !== undefined ? blip.hull_pct : null,
        });
      });

      const prevSelected = _entities.find(e => e.id === _selectedId);
      const stillExists  = newEntities.find(e => e.id === _selectedId);
      if (_selectedId && !stillExists) {
        _selectedId = null;
        updateEntityPanel(null);
      }

      _entities = newEntities;

      const wpVal = document.getElementById('ent-wp-val');
      if (wpVal) {
        if (_waypoint) {
          wpVal.textContent = 'SET (' + Math.round(_waypoint.x) + ', ' + Math.round(_waypoint.z) + ')';
          wpVal.style.color = 'var(--tactical)';
        } else {
          wpVal.textContent = 'NOT SET';
          wpVal.style.color = '';
        }
      }

      updateWaypointButtons();
      const onScreenBtn = document.getElementById('btn-on-screen');
      if (onScreenBtn) {
        const led = onScreenBtn.querySelector('.led');
        const label = onScreenBtn.querySelector('.label');
        if (led) led.className = 'led cyan' + (_onScreen ? ' on' : '');
        if (label) label.textContent = _onScreen ? 'CLEAR SCREEN' : 'ON SCREEN';
      }
      updateHiddenData(s);
      draw();
    }

    function updateHiddenData(s) {
      const navData = document.getElementById('nav-data');
      if (navData) navData.textContent = JSON.stringify(s.blips || []);

      const impData = document.getElementById('impulse-data');
      if (impData) impData.textContent = JSON.stringify({
        charge: _impulseCharge,
        cancel_visible: _cancelVisible
      });

      const wpData = document.getElementById('waypoint-data');
      if (wpData) wpData.textContent = JSON.stringify(s.waypoint || null);
    }

    document.getElementById('btn-on-screen').addEventListener('click', () => {
      if (_sendAction) {
        _sendAction('set_navigation_chart');
      }
      if (_selectedId && _selectedId !== 'own') {
        const e = _entities.find(ent => ent.id === _selectedId);
        if (e) { panX = e.x; panY = e.y; draw(); return; }
      }
      panX = _ownX; panY = _ownY; draw();
    });

    document.getElementById('btn-set-waypoint').addEventListener('click', () => {
      const selected = _entities.find(e => e.id === _selectedId);
      if (selected && selected.objective_target) {
        // Set waypoint directly to the selected objective's position.
        if (_sendAction) _sendAction('set_navigation_waypoint', { x: selected.x, z: selected.y });
        _waypoint = { x: selected.x, z: selected.y };
        updateWaypointButtons();
        showToast('WAYPOINT SET');
      } else {
        _pickingWaypoint = true;
        canvas.classList.add('picking');
        showToast('TAP MAP TO PLACE WAYPOINT', 4000);
      }
    });

    document.getElementById('btn-clear-waypoint').addEventListener('click', () => {
      if (_sendAction) _sendAction('clear_navigation_waypoint');
      _waypoint = null;
      const wpVal = document.getElementById('ent-wp-val');
      if (wpVal) { wpVal.textContent = 'NOT SET'; wpVal.style.color = ''; }
      updateWaypointButtons();
      draw();
    });

    const _c = initConsole({ name: 'Navigation', render: _render });
    _sendAction = _c.sendAction;

    updateWaypointButtons();
    resize();
  </script>

</body>

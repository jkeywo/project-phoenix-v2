action = { kind = "write", channel = "recover-shield-arc-aft", value = { source = "fact", name = "recovering-shield-arc-aft" } }
[[shield_arc.ai.tree.state.task]]
id = "recover-0"
when = [{ value = { source = "fact", name = "preferred_protection" }, equals = false }, { value = { source = "fact", name = "target-visible-shield-arc-aft" }, equals = true }, { value = { source = "fact", name = "target-preferred-shield-arc-aft" }, equals = true }, { value = { source = "fact", name = "target-ready-shield-arc-aft" }, equals = true }, { value = { source = "number_compare", name = "strength_fraction", comparison = "greater_or_equal", value = 0.85 }, equals = true }, { value = { source = "number_compare", name = "target-strength-shield-arc-aft", comparison = "less", value = 0.4 }, equals = true }, { value = { source = "number_compare", name = "target-reserve-shield-arc-aft", comparison = "less", value = 0.75 }, equals = true }]
action = { kind = "write", channel = "recover-shield-arc-aft", value = { source = "literal", value = true } }
[[shield_arc.ai.tree.state.task]]
id = "protect-donor-0"
when = [{ value = { source = "number_compare", name = "strength_fraction", comparison = "less_or_equal", value = 0.6 }, equals = true }]

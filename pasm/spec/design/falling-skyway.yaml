  # ── Principles ──────────────────────────────────────────────────────────────
  - design_principle: fs-scarcity-reads-as-choice
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: The Shortfall Reads as a Choice, Not a Punishment
      summary: "[ai] Crews should experience the window as a hard triage decision they were equipped to make, not a fail state they were ambushed by."
    game_design:
      strength: soft
      context: the transfer window, crews who completed the survey and settled the strike
      construction: [fs-window-structural-scarcity, fs-window-opens, fs-ladder-supply-picture]
      expected_dynamic: crews debate which two claims to honour before the window opens, using numbers they have watched since the first tick
      experience_hypothesis: post-mission, crews describe the window as their decision rather than the game's
      measured_by: [fs-window-choice-claim]
      counter_evidence:
        - "docs/falling-skyway-ai-backfill.md: AI crews reach the window without engaging the claims; #1129's re-author and verb surface exist to retire this"
  - design_principle: fs-warning-is-arithmetic
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Storm Warnings Are Arithmetic, Not Generosity
      summary: "[ai] The forecast-to-first-band gap is derived from hauler speed, lane length, and the authored acknowledge-and-decide delay — enough to comply, never enough to idle — and it scales with the clock."
    game_design:
      strength: soft
      context: the storm sweep, civilian traffic on authored lanes
      construction: [fs-storm-front, fs-storm-band-one, fs-traffic-thread]
      expected_dynamic: compliant traffic escapes each band with margin; the Lyra, who cannot comply, becomes the crew's problem instead
      experience_hypothesis: the storm reads as lethal weather with fair warning, not as scripted punishment
      measured_by: [falling_skyway_ordered_traffic_clears_all_three_bands_while_the_idle_rescue_fails]
  - design_principle: fs-backfill-completes-the-set
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: A Fully Backfilled Crew Completes the Mandatory Set
      summary: >
        [ai] With the Scan/Operate/Order verb surface, a fully backfilled
        crew completes the mandatory objective set in 80-95% of seeded runs
        — high enough that AI teammates are real, low enough that humans
        still matter. Today's AI sits near 0%, which is the regression
        baseline.
    game_design:
      strength: hard
      context: fully AI-backfilled crew, seeded balance-runs sweeps over the mandatory set
      construction: [fs-survey-thread, fs-lyra-clear, fs-traffic-thread, fs-skyhook-holds-or-falls]
      expected_dynamic: every mandatory objective is AI-addressable by construction; humans and AI differ only in engagement timing
      experience_hypothesis: a short-handed crew experiences a functioning bridge, not a haunted one
      measured_by: [balance-runs mandatory-objective completion aggregate (80-95% target)]
  - design_principle: fs-silence-fails-loudly
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Silence Fails Loudly in Every Era
      summary: >
        [ai] RATIFIED TARGET DESIGN for #1138, not current runtime: an idle
        opening ends in world-driven terminal defeat when uncontrolled Hauler
        Lark collides in the corridor, unless the crew sends the scan-backed
        unsafe response. Lark narrates its intent; its first hail arrives 30
        seconds before the survey deadline, a second generic authoritative
        `critical` hail lands at the deadline, and a final 20-second response
        window remains. Later, the storm takes what is left in it and the head
        falls without a stabilise.
    game_design:
      strength: hard
      context: fully idle crew, every intensity era
      construction: [fs-survey-thread, fs-storm-exposure, fs-skyhook-holds-or-falls]
      expected_dynamic: each era posts a visible failure an idle crew cannot avoid; nothing completes by accident
      experience_hypothesis: doing nothing is never mistaken for doing fine
      measured_by: [idle_crew_fails_every_era_headless_checks]
  - playtest-claim: fs-window-choice-claim
    core:
      status: proposed
      confidence: provisional
      origin: ai
      title: Window Choice Playtest Claim
      summary: "[ai] In moderated playtests, crews articulate the two-of-three trade before the window closes, unprompted."
    game_design:
      claim: crews state which two claims they will honour, unprompted, before skyway_window_closes fires
      supports: [fs-scarcity-reads-as-choice]

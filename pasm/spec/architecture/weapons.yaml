  - component: three-dimensional-torpedoes
    core:
      status: implemented
      confidence: confirmed
      title: Three-Dimensional Torpedoes
      summary: Torpedoes use full 3D origin, movement, guidance, collision, and detonation now that ship vertical movement (#744) and patterned torpedo origins (#766) are simulation truth.
      rationale:
        - "3D position + vertical steering (issue #768). `Torpedo` gains `y` (altitude) and `pitch` (climb angle). `Torpedo::tick` keeps the unchanged `atan2(-dz)` yaw steering and adds a vertical term: it rotates `pitch` toward the target's elevation `atan2(dy, horizontal)`, rate-limited by the SAME `TorpedoConfig::turn_rate` clamp the yaw uses — no new gameplay constant was introduced. Movement decomposes the constant `speed` by pitch: `x += sin_yaw·cos_pitch·speed·dt`, `z -= cos_yaw·cos_pitch·speed·dt`, `y += sin_pitch·speed·dt`. Homing reads the target Y from the live (frozen combat-lock) snapshot, so vertical ship separation genuinely changes guidance."
        - "3D collision + detonation. `find_detonation_hits` takes `(uuid, x, y, z, radius)` targets and tests `dx²+dy²+dz² <= (det_radius+target_radius)²`, so a torpedo far above a ship at the same XZ does not detonate while one within the 3D radius does. `TorpedoDetonation` carries `impact_y` alongside `impact_x`/`impact_z`. Shield-arc routing stays a horizontal-plane bearing (`attacker_bearing_relative` is XZ), so `impact_y` is not re-plumbed into the Bevy detonation struct — it has no arc-routing consumer."
        - "Planar compatibility (AC3), bit-for-bit. All new vertical fields default to `0.0` in every constructor, the wire (`#[serde(default)]` on `TorpedoLaunched.y`), and test helpers. Ships read `physics.y` (already 0 for Planar hulls, #744) with NO per-hull branching. With ΔY=0, `cos_pitch == 1.0` and `sin_pitch == 0.0` exactly, so the XZ integration is identical to the pre-#768 path and `pitch` never leaves 0; `desired_pitch = atan2(0, h) = 0`. The full pre-existing torpedo suite passes unchanged."
        - "Wire + renderer + client. `ServerMessage::TorpedoLaunched` gains `y` (serde-default, codec round-trip). `handle_fire_torpedo` threads `physics.y` and each barrel marker's `pos.y` (previously dropped) into `launch_with_barrels`, and broadcasts the immediate torpedo's real spawn Y. `sync_torpedo_pfx` renders at the torpedo's real `y` instead of a hardcoded plane. `gui/sim-state.js` stores `y` (defaulting to 0); the client does not dead-reckon flight."
    architecture:
      kind: weapon-system
      authority: authoritative
      replacement: torpedo-system
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths:
        - src/weapons/torpedo.rs
        - src/console/weapons/torpedo.rs
        - src/console/weapons/shared.rs
        - src/core/messages.rs
        - src/core/codec.rs
        - src/server/pfx.rs
        - gui/sim-state.js
      symbols:
        - Torpedo
        - TorpedoDetonation
        - launch_with_barrels
        - find_detonation_hits
        - build_torpedo_target_snapshot
        - tick_torpedo_lifecycle
        - handle_fire_torpedo
        - sync_torpedo_pfx
      tests: [cargo test, npx vitest run]

  - component: weapon-family-arc-bearing-coordination
    core:
      status: implemented
      confidence: confirmed
      title: Weapon-Family Arc-Bearing Coordination
      summary: Tactical requests a Helm bearing when the selected usable phaser, blaster, or torpedo family has a target in range but outside its available firing arcs.
      rationale:
        - "Weapon-family-aware (issue #767). `tick_weapons_arc_request` generalises the pre-#767 phaser-only, family-agnostic request: it evaluates each capable family (phasers/blasters/torpedoes) via the pure `evaluate_family_arc_request`, driven off the shared #764 `WeaponReadiness` classification so emitter and Helm agree on the condition. A family qualifies ONLY when it is capable (≥1 emitter), at least one usable ONLINE emitter is blocked specifically by `OutOfArc` while in range, and NO emitter is `Ready`. Nothing is emitted for an incapable family (no emitters), an unavailable one (all `Offline`), or an out-of-range one (all `OutOfRange` — no bearing helps)."
        - "Family-selection rule (documented, structural — not a gameplay value): a FIXED family priority — phasers, then blasters, then torpedoes. There is no per-family Tactical selector surface (`CurrentPhaserMode` is a phaser sub-mode, not a family selector), so a deterministic priority keeps exactly one `ArcBearingRequest` active at a time, independent of evaluation order. The always-available primary beam is brought to bear first; secondary families are the request only when the primary cannot be the reason."
        - "Per-family arcs on the wire (AC1). The request carries the emitting `WeaponFamily` and the union of that family's usable ONLINE emitter arcs as `Vec<WeaponEmitterArc { facing_deg, arc_deg, range }>` — phaser facing + auto-fire arc × per-bank beam range × radar modifier; blaster facing + fire arc × projectile range; torpedo-tube facing + fire arc × homing reach (speed × lifespan), only loaded tubes usable. Serialize/Deserialize + codec round-trip cover the extended shape."
        - "Helm consumes as facing intent, no drift (AC2). `apply_arc_bearing_request` biases ONLY `steering` (never thrust — the facing-only invariant per helm-controls.yaml). It resolves the target against the carried family arcs via the shared `weapons::phaser::target_geometry`, so Helm and the emitter judge the same geometry rather than a hard-coded phaser arc."
        - "Both sides clear on target/range/arc change (AC4). The emitter debounce (`WeaponsArcRequestState`) keys on family + target + the usable arc set, so a change of family, target, or arc condition re-fires. The Helm self-clear (`PendingArcBearingRequest`) drops the request when the target leaves the merged view, leaves the range of every carried arc, or enters some carried arc (the family can fire)."
        - "Player-facing label is family-aware. The client popup (`gui/coordination-popup.js`) names the emitting family (phasers/blasters/torpedoes), following that file's existing inline-English chatter pattern; server-side AI-to-AI viewscreen chatter (`format_coordination_chatter`) does likewise."
    architecture:
      kind: coordination-policy
      authority: authoritative
      reads: [weapons-target-state]
      coordinates: [tactical-weapons-controls]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths:
        - src/console/weapons/mod.rs
        - src/core/messages.rs
        - src/core/codec.rs
        - src/ship/components.rs
        - src/ship/coordination_systems.rs
        - src/ship/helm_ai.rs
        - gui/coordination-popup.js
      symbols:
        - tick_weapons_arc_request
        - evaluate_family_arc_request
        - WeaponsArcRequestState
        - WeaponFamily
        - WeaponEmitterArc
        - PendingArcBearingRequest
        - apply_arc_bearing_request
      tests: [cargo test, npx vitest run]

      rationale:
        - "Single writer since #824: host-helm-control-router (process_helm_inputs) mirrors every helm payload it applies — human-admitted and AI-emitted alike — into the LocalShip's LastHelmInput as it writes the intent components, so the thrust/steering pair can never tear between two writers. NPC LastHelmInput deliberately stays at its spawn default so ai_power_allocation's movement rule observes what it observed before the migration."
        - The host stores the latest thrust, steering, and lateral inputs rather than replaying raw control messages every frame.
    architecture:
      classification: authoritative
      owner: host-helm-control-router
      writers:

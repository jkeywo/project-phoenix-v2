  - component: phaser-attack-target-lock
    core:
      status: implemented
      confidence: confirmed
      title: Phaser Attack Target Lock
      summary: A phaser attack captures the current weapons target when it begins and keeps that target for the attack while the target remains in the firing arc.
      rationale:
        - "Capture-at-attack-start is authoritative. handle_fire_phaser (and ai_phaser_auto_fire) read the FROZEN viewscreen combat_lock only at beam start and write ActiveBeam.target_uuid + .bank once; both fire entrypoints early-out while beam.target_uuid.is_some(), so a live beam cannot be retargeted by a new selection or a mid-attack FirePhaser. Every tick, tick_beams_prepare re-resolves the CAPTURED beam.target_uuid (never TacticalRadarSelection or combat_lock) and severs the beam only when that uuid leaves the bank arc/range or vanishes."
        - "Bank independence: one ActiveBeam per ship means only one bank fires a beam at a time, so the captured target/bank is a single (uuid, bank) pair. Per-bank cooldowns (PhaserCooldown.per_bank) are independent, so cooldown on one bank never disturbs another bank's live captured beam."
        - "Observability (AC3): attack termination + cooldown are observable via BeamStarted/BeamEnded (both carry the captured target_uuid + bank) and the per-bank PhaserBankBlackboard (on_cooldown, cooldown_remaining). No new wire field was added — the captured target is already surfaced by the beam lifecycle events, and WeaponsBlackboard.target_uuid deliberately mirrors the live combat lock for the reticle."
    architecture:
      kind: weapon-policy
      authority: authoritative
      reads: [weapons-target-state, viewscreen-target-facts-state, phaser-beam-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/weapons/beam.rs]
      symbols: [handle_fire_phaser, ai_phaser_auto_fire, tick_beams_prepare, ActiveBeam]
      tests: [cargo test]

  - component: patterned-barrel-attacks
    core:
      status: implemented
      confidence: confirmed
      title: Patterned Barrel Attacks
      summary: Blaster and torpedo banks declare multiple barrel marker points and a timed attack pattern of offsets and barrel-index arrays, allowing alternating or simultaneous shots.
      rationale:
        - "Shared, reusable schema (issue #765). `BarrelPatternStep { barrels: Vec<u32>, offset_secs: f32 }` and the `BarrelPattern` alias live in the weapon-family-agnostic `src/weapons/pattern.rs` so torpedoes (issue #766) reuse the exact types and validator. A step fires its listed barrel indices SIMULTANEOUSLY at `offset_secs`; successive steps at increasing offsets ALTERNATE. Blasters wire it now; the blaster half of the evidence is covered here."
        - "Backward compatible. A bank with no `barrels` and no `pattern` is one implicit barrel (= the existing `marker`) firing the uniform `volley_count` volley — `BlasterBankConfig::firing_schedule` returns the legacy schedule and `tick` fires at most one step per tick, preserving the pre-#765 one-bolt-per-tick cadence exactly. The four shipped blaster hulls are unchanged; `alliance_battleship` authors a real twin-barrel alternating-then-simultaneous pattern."
        - "Authoring validation, both twins (AC1/AC3). `validate_barrel_pattern` (rejects empty step, barrel index >= barrel count, negative/non-finite offset, multi-barrel-with-no-pattern) is called by `validate_blaster_banks` (Rust) and mirrored by `editor/blaster-validate.js` wired into `validateFile`, so an invalid pattern blocks save via the #757 admission gate. Per-barrel marker references are emitted by `collect_marker_refs` / `collectMarkerRefs`, so a missing barrel marker is rejected by the shipped-asset conformance test and the editor."
        - "Firing carries barrel identity (AC2). `BlasterSystem::tick` takes one world origin per barrel (`barrel_origins`), resolved by `tick_blaster_system` from each barrel's rig marker, and emits one `LaunchEvent { barrel, x, z, heading }` per firing barrel, so simultaneous steps launch multiple bolts from distinct authored points on one tick and alternating steps launch from the right origin each step."
        - "Blackboard + Tactical (AC4). `BlasterBankState` gains `active_barrels`, `pattern_step`, `pattern_len`; `ph-blasters-controls.js` renders a step/barrel indicator (string ids `component.blasters.pattern_step`/`.barrels`). Round-tripped in `codec.rs`."
        - "Torpedo half preserves the ammunition economy (issue #766, AC3). Torpedoes reuse the SAME `src/weapons/pattern.rs` schema and `validate_barrel_pattern` (called by `validate_torpedo_tubes`, mirrored by `editor/torpedo-validate.js`). The pattern maps onto the EXISTING `launch`/`TubeBurstState` burst machinery: `TorpedoTube::barrel_sequence` flattens the offset-ordered steps into a `(barrel, step)` list and each volley round — the immediate `launch_with_barrels` shot plus every burst shot in `tick_torpedo_lifecycle` — draws its origin from the next barrel, cycling. The pattern governs ONLY which barrel a round leaves from and the barrel order; `loaded_count`, the shared `torpedoes_remaining` magazine, and `burst_interval_secs` stay the sole authority over the count. Magazine spend still happens at LOAD time (`start_load`/`claim_magazine_round`), never at launch. Timing rule: `burst_interval_secs` remains the sole cadence between rounds; the pattern's `offset_secs` only orders the barrel sequence. A 2-barrel simultaneous step with 1 round loaded fires exactly 1 torpedo and leaves the magazine untouched (`launch_does_not_change_torpedo_count` still holds). `handle_fire_torpedo` resolves per-barrel world origins from the tube's rig markers (falling back to ship centre for legacy single-marker tubes); `TorpedoTubeState`/`ph-torpedo-controls.js` surface `active_barrels`/`pattern_step`/`pattern_len`. `alliance_battleship`'s fore-centre tube authors a real twin-barrel pattern."
    architecture:
      kind: configuration-schema
      authority: authoritative
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths:
        - src/weapons/pattern.rs
        - src/weapons/blaster.rs
        - src/weapons/torpedo.rs
        - src/entities/config.rs
        - src/entities/marker_validate.rs
        - src/console/weapons/blaster.rs
        - src/console/weapons/torpedo.rs
        - src/core/messages.rs
        - editor/blaster-validate.js
        - editor/torpedo-validate.js
        - editor/marker-validate.js
        - gui/components/ph-blasters-controls.js
        - gui/components/ph-torpedo-controls.js
      symbols:
        - BarrelPatternStep
        - BarrelPattern
        - validate_barrel_pattern
        - validate_blaster_banks
        - validateBlasterBanks
        - validate_torpedo_tubes
        - validateTorpedoTubes
        - launch_with_barrels
        - barrel_sequence
      tests: [cargo test, npx vitest run]

  - component: weapon-readiness-feedback-policy
    core:
      status: implemented
      confidence: confirmed
      title: Weapon Readiness Feedback Policy
      summary: Phaser, blaster, and torpedo projections expose a consistent readiness, target-range, target-arc, and blocking-reason contract to Tactical.
      rationale:
        - "One wire contract for all three families (issue #764). `WeaponReadiness { ready, blocking_reason, target_range, target_arc }` + the `WeaponBlockReason` enum (Ready/NoTarget/OutOfRange/OutOfArc/Cooldown/Loading/NoAmmo/Offline) is embedded in every family's per-instance state — `PhaserBankState`, `TorpedoTubeState`, `BlasterBankState` — so all three publish the SAME contract instead of ad-hoc bools."
        - "Single evaluation path. `WeaponReadiness::evaluate` resolves the blocking reason from a priority order (Offline > Cooldown > Loading > NoAmmo > NoTarget > OutOfRange > OutOfArc > Ready); geometry (`WeaponTargetGeometry`) is computed once by the pure `weapons::phaser::target_geometry` reusing the same sq-dist range test + `in_arc` bearing math the fire paths use, so readiness can never diverge from the authoritative fire gate. `ready == (blocking_reason == Ready)` is an invariant of `evaluate`."
        - "Blaster asymmetry closed (AC3). `BlasterSystem::bank_state` now threads the frozen combat-lock target position + ship physics + per-bank offline state, so blaster range/arc/no-target/cooldown/charge(loading)/offline become observable via the contract — previously computed only inside the fire path and never surfaced."
        - "Client convergence (AC2). One shared JS path — `gui/weapon-readiness.js` maps `blocking_reason` → a string-id label + ready/blocked/unavailable row class — feeds `ph-phasers-controls.js`, `ph-blasters-controls.js`, `ph-torpedo-controls.js`, so each family renders equivalent ready / blocked(reason) / unavailable states. Labels are `console.common.*` string ids, never inline English."
        - "Client and server cover the same observable blocking cases (AC4): the pure `blaster.rs` model tests (ready/no-target/out-of-range/out-of-arc/cooldown/loading/offline), the `server_tests.rs` phaser + torpedo projection tests, the codec round-trip, and the Vitest panel + `buildWeaponsConsoleState` tests all assert on the same reasons."
    architecture:
      kind: projection-policy
      authority: authoritative

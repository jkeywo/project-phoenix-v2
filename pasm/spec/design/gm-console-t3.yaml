  - component: gm-t3-single-peer-live-restore
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Single-Simulation-Peer Live Restore
      summary: "An equal Game Master previews a candidate in the shared #1445 preflight picker and asks, as an ordinary typed attributed GmAction::RequestLiveRestore on the canonical journal, for the live session to be rewound onto it. The bounded first delivery supported exactly ONE simulation peer; gm-t3-multi-peer-live-restore (issue #1447) removed that bound by extending this same operation across every peer, and MultipleSimulationPeers is no longer produced. Any number of phone consoles bound to a peer was, and remains, one peer. Applying the request holds the session and arms a peer-local driver, which captures a recovery checkpoint through the ordinary save write, confirms it by read-back, revalidates the candidate against CURRENT content and CURRENT seating at execution, loads it through #1118's gate/verify/rollback path, re-applies the LIVE crew authority over the restored world, and stamps a fresh slot-recovery generation so pre-restore in-flight work is stale. Success stays held until an explicit GM resume; a failure rolls back to the recovery checkpoint and stays held; a rollback that cannot be read stays honestly failed and held. State is reported through the #1437 gm_health banner, not a second panel."
      rationale:
        - "[ai] Issue #1446 (PRD #1420 stories 8-11, 13, 15, 16; presentation contract PRD #1418). Every part is assembled from machinery that already exists rather than a second recovery protocol: the request is the canonical GM journal, the recovery checkpoint is #1445's ordinary named manual save and its read-back confirmation rule, the load/digest/rollback is lockstep::snapshot_relay::gate_and_restore_rebuilding, the fence is GmActionJournal::record_slot_recovery, and the state surface is the #1437 health banner."
        - "[ai] Only the two answers that must be ORDERED are decided in the reducer: 'this session has more than one simulation peer' and 'a restore is already running'. They are the two a second Game Master pressing at the same tick must get a deterministic answer to, and apply_due_actions runs a whole tick's ordered run in one call, so the first accepted request wins and every concurrent one is refused as LiveRestoreInProgress. Candidate eligibility is deliberately NOT one of them: the PRD requires the candidate to be revalidated against current content and current assignments AT EXECUTION, which is later and needs the catalogue."
        - "[ai] apply_due_actions is at Bevy's parameter ceiling, so the peer count and the live seating are mirrored onto GmLiveRestore each frame by publish_restore_context and read from there. The mirrored seating is LiveSeating::from_roster - the same projection #1445's picker uses - so the advisory verdict a GM read and the authoritative verdict at execution cannot be expressed in two vocabularies."
        - "[ai] The recovery checkpoint is captured SYNCHRONOUSLY by the exclusive driver rather than through the fixed-tick save scheduler. The request has already held the world, and a hold stops FixedUpdate, so a capture scheduled for the next fixed tick could never arrive and the restore would wait forever for its own precondition. A held world is a stable boundary by definition - which is exactly what the fixed-tick rule exists to guarantee - so SaveSlotService::persist is made public and takes the same write the scheduler would have made: same manual routing, same display name, same outcome FIFO, same catalogue row, readable and selectable afterwards rather than an invisible buffer that dies with the tab."
        - "[ai] Confirmation of that checkpoint is kept as its own step, on #1445's unchanged rule: a write the adapter reported as failed, and a write that reported success but left no readable row, are both 'no recovery checkpoint', and either refuses with nothing loaded."
        - "[ai] That recovery row is named with a String Table id, RECOVERY_CHECKPOINT_NAME, because the simulation crate has no locale to write a sentence in - and the row is durable and ORDINARY, so it is listed by the #1445 picker, named in the restore preview and shown in the landing page's Load list every player sees. Each of those surfaces therefore resolves the stored display_name through one shared seam, slotName in gui/save-slots.js, which is gui/strings.js's existing wireText rule for a field that MAY be an id: an engine-authored name renders as its authored sentence, prose a GM typed renders as typed, and there is no per-surface list of engine names to fall out of step. Printing the field verbatim would put the id itself on screen, which is the String Table rule inverted."
        - "[ai] A restore rewinds the WORLD, not the room. gate_and_restore installs the CANDIDATE's recorded crew; this immediately re-applies the LIVE crew from a snapshot::capture taken moments before, so participants keep their current ship and Station rather than the saved seating. That is a declared divergence from the candidate's recorded fold and happens strictly AFTER the digest check has proved the load faithful: 'the load reproduced the save' and 'the room kept its seats' are two different claims, checked in that order."
        - "[ai] The saved world and the saved action log rewind TOGETHER, for free: the candidate's GmActionJournal is part of its snapshot, so entries recorded after the checkpoint are simply not there. There is no abandoned-timeline product, no second save log and no branch history - including the restore request itself, which belonged to the abandoned timeline."
        - "[ai] The fence is #1119's durable slot-recovery generation, stamped at the RESTORED TICK itself rather than one past it. #1119 fences a rejoining slot at a future boundary because that session keeps running and will reach it; a restored session never will, because the restore holds the world exactly there. Since sequence_owner_proposal forces every later grant to at least its slot's current recovery boundary, a boundary at restored + 1 would strand the GM's own explicit Resume - and every action after it - one tick past a stopped clock, which is a session nobody can resume. The boundary tick keeps #1119's own rule that both adjacent incarnations are valid ON the boundary and only the restored one from the next tick. A boundary the candidate already recorded at or after the restored tick would be an INERT repeat that reports a fence without stamping one, so it is refused and rolled back rather than reported. Protocol generations are never exposed as fictional history: the health projection carries a phase, an operator and a tick, and no generation."
        - "[ai] An accepted restore is a LIVE HOLD, and the ordering rule has to see it. The reducer pauses the world without a canonical SetSessionPaused, so two seams say so: the journal projection folds an applied RequestLiveRestore to paused, which puts a concurrent request or a resume pressed underneath one on the boundary the hold stopped instead of a tick it forbids; and the submit seam counts a non-Idle GmLiveRestore alongside the technical join hold and the native screen pause, because after a successful restore the journal is the CANDIDATE's and carries no record of the hold at all. Same argument, same branch, as the join hold that already lived there: a held world cannot reach ready + 1."
        - "[ai] A live rewind asks #863's REBUILDING readiness question (snapshot::ready_to_rebuild, through the new gate_and_restore_rebuilding entry point) rather than the ordinary one. ready_to_restore waits for every captured row to be STANDING, which is right for a bootstrapping receiver that is about to be handed better hulls than restore could build. A rewind is the opposite situation and the feature's central case: an NPC or station destroyed in combat, or removed by a GM, is despawned outright, so the candidate's roster is routinely NOT a subset of the live one - and putting those rows back is precisely what a rewind is for. The hold that makes the rewind safe also stops FixedUpdate, so waiting for such a row is waiting for something that can never arrive. A row that carries no SpawnOrigin still cannot be built, and surfaces as a reported LoadIncomplete that rolls back, rather than as a silent wait. The rollback runs through the same rebuilding entry point, because a committed candidate may have despawned rows the recovery checkpoint holds."
        - "[ai] Behind that, READINESS_FRAME_BUDGET bounds the wait unconditionally: after two seconds of frames in which the world will not accept the candidate, the attempt is reported as LoadRefused and rolled back. The requirement is not that the bound be tuned but that a Game Master can never be stranded, because every in-flight phase refuses SetSessionPaused BY NAME as LiveRestoreInProgress - so an unbounded retry would be a session nobody could leave and a banner that never resolved."
        - "[ai] The rollback is re-run through the DURABLE recovery row even though gate_and_restore has already rolled its own in-memory checkpoint back. A rollback nobody verified is not a rollback, and a recovery checkpoint that cannot be read back is precisely the persistent-failure case the PRD requires to stay honestly failed rather than be papered over: that path reports RollbackFailed and holds, and never resumes."
        - "[ai] GmLiveRestore is peer-local orchestration: not folded into sim_digest, not captured in a PhoenixSnapshot, never on the wire. Issue #1447 EXTENDED this driver across peers rather than promoting the resource: what crosses the mesh is a small GmRestoreFrame carrying liveness and agreement, never this orchestration state."
        - "[ai] The candidate slot id is a key in ONE peer's private catalogue. It rides the action (which must say what to restore) but is deliberately absent from GmActionKind::carries_target, from the durable target field, from the shared activity feed row and from the health projection: a storage key is not a world identity and the crew-facing history owes only that a restore was asked for, by whom, and what came of it."
        - "[ai] PRD #1418: the phase is a SENTENCE as well as a data-phase, a control a GM cannot press says why in the picker's own vocabulary rather than sitting disabled, Restore defaults to confirm-preview because a rewind is the one decision whose consequences a crew cannot un-see (the preview names the technical change AND what was already witnessed), Resume is the ordinary session-pause action under its own category, both buttons hold a --control-hit-min floor and keep their identity across every refresh, and no dialog opens for routine progress."
    architecture:
      kind: gm-operations-driver
      authority: peer-local-orchestration
      coordinates: [gm-milestone-operations-safety, gm-t3-peer-health, gm-t3-named-checkpoints-and-candidate-preflight]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/gm_restore.rs, src/lockstep/snapshot_relay.rs, src/gm_action.rs, src/gm_activity.rs, src/gm_health.rs, src/gm_puppet.rs, src/save_slots_store.rs, src/lockstep/mod.rs, src/core/codec.rs, gui/gm-restore-control.js, gui/gm-checkpoint-panel.js, gui/save-slots.js, gui/gm-health-banner.js, gui/gm-activity-feed.js, gui/gm-confirmation.js, gui/gm-action-reasons.js, gui/gm-journal-panel.js, gui/gm-workspace.js, gui/gm-workspace.css, gui/native-gm-workspace.js, server.html]
      symbols: [GmLiveRestore, GmRestorePhase, GmRestoreFailure, AcceptedRestore, RECOVERY_CHECKPOINT_NAME, READINESS_FRAME_BUDGET, gate_and_restore_rebuilding, revalidate, publish_restore_context, drive_live_restore, GmAction::RequestLiveRestore, GmActionKind::LiveRestore, GmActionRefusalReason::MultipleSimulationPeers, GmActionRefusalReason::LiveRestoreInProgress, GmActivityAction::RequestLiveRestore, GmHealthAlertKind::LiveRestoreInProgress, GmHealthAlertKind::LiveRestoreSettled, GmLiveRestoreHealth, live_restore_health, SaveSlotService::persist, slotName, createGmRestoreControl, parseGmRestoreState, restorePhaseLabelId, GM_RESTORE_CONFIRMATION]
      tests: ["cargo test --features headless --test gm_restore", "cargo test --features headless --lib -- gm_restore:: gm_action:: gm_activity", "cargo test --features headless --test gm_checkpoint", "cargo test --features headless --test gm_health", "npx vitest run tests/client/gm-restore-control.test.js", "npx vitest run tests/client/gm-checkpoint-panel.test.js", "npx vitest run tests/client/save-slots.test.js", "npx vitest run tests/client/gm-journal-panel.test.js", "tests/smoke/gm-restore-200.spec.js"]

  - component: gm-t3-multi-peer-live-restore
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Live Restore Across Every Simulation Peer
      summary: "Issue #1447 removes gm-t3-single-peer-live-restore's single-peer bound by extending the SAME operation across the fleet rather than building a distributed twin. Every peer applies the one canonical GmAction::RequestLiveRestore off the replicated journal, holds, and takes its OWN recovery checkpoint. The peer whose Game Master asked - the peer whose private catalogue holds the candidate - then waits on the room for at most ten REAL seconds with a visible countdown and named waiting peers, disconnects nonresponders through #1119's canonical host loss and carries on with the rest, transfers the candidate as ordinary #1117 chunks over #1118's armed receiver, loads its own copy, and settles. Every remaining peer must have loaded and reported a MATCHING fold before the rewind is committed; one reported failure or mismatch, a silent peer, or the initiating peer vanishing rolls the whole room back to the recovery checkpoints it took on the way in, held and named. On commit each peer stamps the slot-recovery fence for EVERY participant, from the same replicated roster, so no peer's journal can differ. Phone consoles are legs on a peer, not participants: they never answer and are never waited on."
      rationale:
        - "[ai] Issue #1447 (PRD #1420 stories 10-14, 16; presentation contract PRD #1418). Extends gm-t3-single-peer-live-restore in place: same GmLiveRestore driver, same recovery checkpoint, same gate_and_restore_rebuilding load, same #1119 fence, same #1437 health banner, same #1445 picker. The only addition to the host mesh is MeshFrame::GmRestore - ready, loaded, unable, settle - which carries no world state and no catalogue key. The candidate world itself travels as ordinary #1117 snapshot chunks."
        - "[ai] The decisive correctness change: a canonical outcome may NEVER be folded out of peer-local restore PROGRESS. #1446 refused a concurrent request, and a resume pressed underneath a working restore, inside apply_due_actions by reading GmLiveRestore::phase. With one peer that is sound; with more it is not, because one peer can have committed the candidate while another is still loading it, and the two would then record Applied and Refused for the SAME grant and split the digest. Whether anything may be sequenced while a restore runs therefore moves to sequence_owner_proposal - the OWNER's sequencing seam, one machine, before a grant exists - where a refusal is broadcast as GmActionFrame::Refused and never folded."
        - "[ai] Which of two CONCURRENT requests wins stays in the reducer, because it has to. Two Game Masters pressing at the same moment are deterministically scheduled onto the SAME apply tick - the first, unapplied, request already projects the hold, so the second is scheduled at that held boundary - which is behind the owner's in-flight gate, and apply_due_actions runs a whole tick's ordered run in one call. Without an ordered answer the second accept() would clear the first one's recovery slot, live world and attribution mid-flight and the room would run the second Game Master's candidate under the second Game Master's name. The answer is read off the REPLICATED journal - GmActionJournal::live_restore_admitted: this canonical prefix already applied a RequestLiveRestore that no explicit Resume has closed - so every peer folds the same Applied and the same Refused, and no peer-local progress is consulted. The explicit Resume is the closing event because it is the one canonical fact that means the operation is over on every peer; a successful restore needs none, since it installs the candidate's own journal."
        - "[ai] That seam also IS the fence AC4 asks for, at the only place a fence can be complete: while a restore is in flight the owner refuses to sequence ANYTHING. A grant minted during the flight would land on the held boundary and be applied before the rewind on one peer and after it on another - or, on a successful restore, vanish with the journal it was written into. Refusing the whole window is the only answer that is the same everywhere, and it is visible: the GM is told LiveRestoreInProgress by name, in the shared refusal vocabulary."
        - "[ai] The windows are REAL seconds (Time<Real>, PEER_WINDOW_SECONDS = 10), not ticks. A live restore holds the world from the moment the request applies, so the tick count is frozen for the whole operation and a tick-based bound could never expire - a peer that said nothing would hold the room for the rest of the session. Nothing the window produces is folded; like #1118's own boundary-lifting, it decides only when this peer stops waiting for a machine that has gone quiet."
        - "[ai] A peer waits on the COORDINATOR for two windows, not one, and that applies to EVERY wait it keeps on the coordinator - waiting to be sent the candidate, waiting to be told the room agreed, and waiting for an answer after refusing locally. A peer on this side of the protocol cannot know how much of its own window the coordinator still has to run: the coordinator may legitimately be waiting on a third peer for a full window before it can send or decide anything, and then needs a further frame to commit and announce. A single window would expire a frame or two before the decision arrived, and a peer that gave up would roll ITSELF back to its own recovery checkpoint while the room committed - a divergent peer that is still a fleet member and that nobody excluded. Two windows is the exact bound rather than a margin, since the coordinator's own wait is bounded by the same constant, and the wait is refreshed while chunks are actually arriving, because a transfer in progress is proof the coordinator is alive and the window measures SILENCE."
        - "[ai] An answer that arrived before this peer's own copy of the grant is BUFFERED, not dropped. Peers apply the same canonical request at the same TICK, but a tick is not a frame: two peers may legitimately sit a whole lockstep delay apart in wall time, and a follower sends Ready exactly once, a couple of frames after IT applies. If the coordinating peer is the last to reach the apply tick, dropping those answers would make it spend its whole window and then disconnect a peer that answered immediately. The buffer is peer-local, bounded, matched against the accepted order when the request lands, and cleared with the restore - so GmRestoreInbox is still emptied every frame and stays honestly ClearedAtFold."
        - "[ai] Exclusion is #1119's canonical host loss and nothing else: the loss is agreed at the tick derived from that peer's own last watermark, the barrier stops waiting for it, and the normalised report is broadcast so every survivor converges on the same membership. There is no restore-private idea of who is in the room. An excluded peer is never resumed; it returns through the existing #1117/#1118 snapshot recovery onto whatever state the room ended up in, which is the ordinary path and is what AC5 asks for."
        - "[ai] A peer that SAYS it cannot take part is not waited out. Waiting its full window and then disconnecting it would spend ten seconds to reach a worse conclusion: a peer with no recovery checkpoint of its own is a peer the fleet could not roll back, which is the case the operation must abandon rather than route around."
        - "[ai] EVERY peer takes its own recovery checkpoint before the room is asked, into its own private catalogue. The candidate is one Game Master's file, but the way back is every peer's own world, and a fleet that could only roll one machine back is a fleet that cannot roll back at all."
        - "[ai] The receiving half is #1118's verbatim. A peer arms MeshRestoreArm for the initiating peer and only that peer - condition (a) set locally from the canonical request every peer applied, condition (b) naming the slot that request identifies - and the ordinary drain_mesh_restore runs the same gate/checkpoint/restore/verify walk with permit_rebuild, for the reason gm-t3-single-peer-live-restore already records. No second gate entry point and no second receiver."
        - "[ai] The fence is stamped for EVERY participant on every peer, in slot order, from the replicated roster. #1446 stamped the local slot because in a one-peer session that IS every slot; a fleet where each peer fenced only itself would hold different journals - the journal is digest-folded - and split the fold on the next sample. A slot excluded for nonresponse is stamped too: it is out of the room but still in the roster every peer folds, and leaving a hole would make the fold depend on which peers happened to answer."
        - "[ai] Only outcomes that actually WALKED this peer's world are rolled back through the durable recovery row. A gate refusal, a transfer that never completed and a candidate this session refused at revalidation all leave the world byte-identical, and running a whole-world restore over one of those would turn a clean refusal into a second chance to fail. A commit, a fold mismatch and an incomplete restore all touched it, and each goes back through the durable row, because a rollback nobody verified is not a rollback."
        - "[ai] PRD #1418: the two waits are readable, not spinners. The status line carries a countdown in whole seconds and the peers it is waiting for BY NAME, in the vocabulary the health panel already uses; the region carries data-countdown and data-waiting so a 200% layout can style what a sentence cannot; peer rows carry restore_waiting/restore_excluded; a session with nobody to wait for draws no countdown at all, because a countdown with nothing behind it reads as a stall. No dialog opens for routine progress, and a failure stays a persistent readable line. The native disabled attribute is withheld from a button that currently HOLDS focus - aria-disabled still tells the truth and both handlers already refuse - because disabling the focused node drops focus to the body, and a rewind has five working steps in which a GM standing on Resume would silently lose their place."
    architecture:
      kind: gm-operations-driver
      authority: peer-local-orchestration
      coordinates: [gm-milestone-operations-safety, gm-t3-single-peer-live-restore, gm-t3-peer-health, gm-t3-named-checkpoints-and-candidate-preflight]
      runs_in: [host-browser-runtime, headless-runtime]

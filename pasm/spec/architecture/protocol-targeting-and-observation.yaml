entities:
  - component: host-local-console-bridge
    core:
      status: implemented
      confidence: confirmed
      title: Host Local Console Bridge
      summary: Routes host-page HTML console actions through the shared gui/action-map.js dispatch table into full ClientMessage envelopes and injects them via wasm_receive_message under the dedicated local-console identity, allowing only the host's local ship to be controlled without a PeerJS session claim.
    architecture:
      kind: local-command-bridge
      authority: authoritative
      owns: [host-local-console-identity-state]
      consumes: [host-local-ui-action-command]
      produces: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_bridge.rs, src/server/bridge.rs, src/server_app.rs, server.html, gui/action-map.js]
      symbols: [LOCAL_CONSOLE_TOKEN, wasm_receive_message, dispatchConsoleAction]
      tests: [cargo test, npx vitest run]

  - state: host-local-console-identity-state
    core:
      status: implemented
      confidence: confirmed
      title: Host Local Console Identity State
      summary: Fixed trusted local-console token used only by host-page UI actions; it is not a remote player session, station claim, or authority to address a non-local ship.
    architecture:
      classification: local
      owner: host-local-console-bridge
      writers: [host-local-console-bridge]
    implementation:
      status: declared
      paths: [src/console_bridge.rs, src/server/bridge.rs]
      symbols: [LOCAL_CONSOLE_TOKEN]

  - message: host-local-ui-action-command
    core:
      status: implemented
      confidence: confirmed
      title: Host Local UI Action Command
      summary: Browser server-page console action translated by the shared gui/action-map.js table into a full ClientMessage before it is admitted as a local-ship system command; the Rust-side UiAction translation layer was deleted by issue 822.
    architecture:
      authority: request
      producer: [host-camera-renderer, viewscreen-hud-effects]
      consumer: [host-local-console-bridge]
      validator: [host-local-console-bridge]
      trust_boundary: host-page-to-host
      payload: ClientMessage
    implementation:
      status: declared
      paths: [server.html, gui/action-map.js, src/core/codec.rs]
      symbols: [decode_bridge_client_message]
      tests: [cargo test, npx vitest run]

  - component: wire-codec-protocol
    core:
      status: implemented
      confidence: confirmed
      title: Wire Codec Protocol
      summary: Sole JSON codec boundary for remote client and server envelopes and serialized HUD, lobby, chatter, and audio host-channel payloads; every inbound path decodes one full ClientMessage dialect (issue 822 retired the UiAction and short-form vocabularies).
    architecture:
      kind: protocol-codec
      authority: authoritative
      reads: [system-control-command, simulation-state-replica, lobby-session-replica]
      validates: [host-local-ui-action-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/core/codec.rs, src/core/messages.rs]
      symbols: [JsonCodec, decode_bridge_client_message, encode_hud_state, encode_chatter, encode_lobby_state]
      tests: [cargo test]

  - component: host-page-push-bridge
    core:
      status: implemented
      confidence: confirmed
      title: Host Page Push Bridge
      summary: Single named Host Channel seam that drains host HUD, lobby, AI chatter, audio config/cue events plus the per-frame shake and forcefield-level taps and forwards each as (name, payload) to the one server-page JavaScript callback, without making that page authoritative for simulation state.
    architecture:
      kind: host-presentation-bridge
      authority: derived
      reads: [simulation-state-replica, lobby-session-replica]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_bridge.rs, src/server/bridge.rs, src/server/viewscreen_border.rs, src/server/audio.rs]
      symbols: [flush_host_channels, set_host_channel_callback, HudStateChanged, LobbyStateChanged, AiChatterEvent, AudioConfigChanged, AudioCueEvent]
      tests: [cargo test]

  - component: entity-targetability-contract
    core:
      status: implemented
      confidence: confirmed
      title: Entity Targetability Contract
      summary: Parses authored entity tags and target metadata, including selectable tags, cosmetic threat level, and description, then applies OR-based filter matching for radar visibility and Tactical selection eligibility.
    architecture:
      kind: configuration-contract
      authority: authoritative
      reads: [entity-template-state, radar-contact-projection-state]
      produces: [entity-targetability-projection-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/entities/tags.rs, src/entities/target.rs, src/entities/config.rs, src/entities/spawner.rs, src/console/weapons/mod.rs]
      symbols: [EntityTag, TargetSection, parse_tags, matches_any]
      tests: [cargo test]

  - state: entity-targetability-projection-state
    core:
      status: implemented
      confidence: confirmed
      title: Entity Targetability Projection State
      summary: Derived eligible-target metadata used by Radar and Tactical surfaces; empty target tags exclude an entity from selectable target filters while still allowing separately authored radar visibility.
    architecture:
      classification: derived
      owner: entity-targetability-contract
      derived_from: [entity-template-state, radar-contact-projection-state]
    implementation:
      status: declared
      paths: [src/entities/target.rs, src/console/weapons/mod.rs, src/core/messages.rs]
      tests: [cargo test]

  # The authored-toml-observer component and its authored-content-observation-state
  # were removed when phoenix de-vendored PASM. They modelled the TOML scanner
  # inside the tool, not anything this game implements; the tool now lives in
  # vellum and is modelled by vellum's own spec. Keeping declarations here would
  # have meant this repo asserting ownership of code it does not contain.

  - component: console-ai-orchestrator-plugin
    core:
      status: implemented
      confidence: confirmed
      title: Console AI Orchestrator Plugin
      summary: Registers the console AI decide systems that wire previously-orphaned pure helpers in console_ai::core into active Bevy systems for shields focus, power allocation, and torpedo auto-fire; it also hosts the ship's reaction-delayed sensors frequency-hint emitter, which is not an AI-operator decider and runs for every high-fidelity hull whoever holds Sensors.
      rationale:
        - "Issue #873: tick_frequency_hint_high_fidelity (formerly ai_frequency_hint) is registered here for cadence, not category. Its source says so explicitly — \"Not an AI-operator decider despite living in this plugin\" — because it emits the ship's Sensors frequency advisory from authoritative state for every AiHighFidelity hull regardless of who holds Sensors, and stays under ai_tick_ready only because its reaction-delay model advances by the authored tick period rather than Time::delta."
        - "This entity previously modeled a dormant registration seam (\"deprecated-console-ai-plugin\") that installed no systems. Issues #692-#694 wired ai_shield_focus/integrate_shield_state, ai_power_allocation/integrate_power_state, ai_torpedo_auto_fire/ai_torpedo_load, and the frequency-hint emitter into ConsoleAiPlugin's Update schedule. Issue #846 retired the last intent-component transport: ai_torpedo_auto_fire now emits FireTorpedo through emit_ai_command, and ai_torpedo_load already emitted SetTorpedoVolleyTarget through the same seam."
        - "Issue #826 (admission symmetry): ai_shield_focus no longer writes an intent component — it emits admitted SetShieldArcFocus payloads through command_admission::validate_and_admit with its ship's own ai:<uuid> token, and ship::shields::handle_shields_messages (registered by ShipShieldsPlugin, same SimSet::Physics, one explicit before-edge from the emit) is the single applier for human and AI alike; integrate_shield_state and ShieldArcIntents are deleted."
        - "Issue #831 (admission symmetry, power): ai_power_allocation follows the same pattern — it emits admitted SetPowerGroupAllocation payloads targeting POWER_REACTOR_SYSTEM_ID (on-change vs. the current allocation) through validate_and_admit, and ship::power::handle_power_messages (registered by ShipPowerPlugin, moved to SimSet::Physics with one explicit before-edge from the emit) is the single applier for human and AI alike; integrate_power_state, PowerReactorIntents, and PowerReactorCommand are deleted. Issue #846 completed the work: ai_torpedo_auto_fire retired TorpedoIntents and now emits FireTorpedo through emit_ai_command — no intent components survive anywhere."
    architecture:
      kind: service
      authority: authoritative
      may_depend_on:
        # ai_shield_focus (registered here) emits through the shields AI
        # operator's single-owner console_ai::shields_emit module (issue #747),
        # so server.rs — co-owned by this plugin — carries an observed edge into
        # shields-recent-damage-ai. This registration/hosting relationship is
        # incidental, not an authority coupling.
        - shields-recent-damage-ai
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console_ai/core.rs, src/console_ai/server.rs, src/console_ai/mod.rs, src/server_app.rs]
      symbols: [ConsoleAiPlugin, ai_shield_focus, ai_power_allocation, ai_torpedo_auto_fire, tick_frequency_hint_high_fidelity]
      tests: [cargo test]

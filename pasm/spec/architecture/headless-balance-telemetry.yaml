entities:
  - runtime: headless-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Headless Runtime
      summary: The native phoenix-headless binary that runs the authoritative Phoenix simulation with no window, renderer, or connected clients, driving a fixed timestep as fast as the CPU allows and emitting a JSON exit report.
    architecture:
      kind: runtime
      authority: authoritative

  - runtime: node-tooling-runtime
    core:
      status: implemented
      confidence: confirmed
      title: Node Tooling Runtime
      summary: Node.js runtime for offline repo tooling scripts, outside the simulation, that orchestrate and post-process headless runs.
    architecture:
      kind: runtime
      authority: non-authoritative

  - component: balance-event-emitter
    core:
      status: implemented
      confidence: confirmed
      title: Balance Event Emitter
      summary: Emits a structured BalanceEvent at every combat chokepoint (damage applied, weapon fired, shield arc collapsed, system tier crossed, disarmed, entity destroyed, red alert changed, objective completed, phase changed, repair applied), unconditionally for all ships in all builds — the wire-independent combat-telemetry channel a balance pass reads.
      rationale:
        - "Emission is unconditional and sits OUTSIDE the is_local player-only gates that wrap ServerMessage::DamageTaken/ShipDestroyed/GameOver, so NPC-vs-NPC combat is captured. Registered on the simulation app (add_simulation_plugins_with), not behind the headless feature, so the browser host also produces the stream and a future in-game crew-debrief screen needs no re-instrumentation."
    architecture:
      kind: telemetry-emitter
      authority: observational
      reads: [authoritative-damage-state, shield-arc-state, ship-station-system-topology-state]
      produces: [balance-event-stream]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/balance.rs, src/console/weapons/beam.rs, src/console/weapons/blaster.rs, src/console/weapons/torpedo.rs, src/server_app/collision.rs, src/server_app/broadcast.rs, src/regions/server.rs, src/ship/damage_sync.rs, src/console/captain/server.rs, src/console/repair/server.rs, src/world/server.rs, src/ship/helm_ai/mod.rs]
      symbols: [BalanceEvent, VictimKind, Outcome]
      tests: [cargo test]

  - state: balance-event-stream
    core:
      status: implemented
      confidence: confirmed
      title: Balance Event Stream
      summary: The BalanceEvent message stream — one event per combat occurrence, carrying attacker/victim uuids, weapon bank/tube id, shield-absorbed vs hull split, tier transitions, and kill credit.
    architecture:
      classification: observational
      owner: balance-event-emitter
      writers: [balance-event-emitter]
      readers: [headless-telemetry-collector, shared-collision-history-collector]
    implementation:
      status: declared
      paths: [src/core/balance.rs]
      symbols: [BalanceEvent]
      tests: [cargo test]

  - component: shared-collision-history-collector
    core:
      status: implemented
      confidence: confirmed
      title: Shared Collision History Collector
      summary: Commits collision attribution in producer order once per logical tick on browser, native and headless hosts, before peer digests and save capture.
      rationale:
        - "Issue #1316: moving RunTelemetry's type into shared code did not install its headless Last collector on browser hosts. Real browser exports therefore folded an absent marker while native replay folded present-empty report telemetry. CollisionHistory is a separate shared owner; reports and their frame-time collectors remain optional."
        - "The FixedLast collector precedes seal_tick_frame, sample_and_publish_digest and advance_sim_tick. Save capture follows that advance, so all these readers include this tick's collisions even when one rendered frame runs multiple fixed steps. The collector also runs on the terminal fixed step after GameOver transition."
        - "Each reader has its own cursor. Restore replaces the captured records and rebases the collision and optional report cursors past unread bootstrap messages without deleting the shared stream; restored entry events emitted afterward remain available. Ordinary OnEnter(InProgress) resets history and its cursor for a second mission."
        - "The history retains every applied collision for the mission with no silent ring-buffer truncation; storage is proportional to produced collisions, as the previous headless attribution history was, and its allocation is released at the next mission start. This is a #1316 target-neutral capture correction, not a #1400 census exemption or scheduling-debt allowance."
    architecture:
      kind: accumulator
      authority: authoritative
      reads: [balance-event-stream]
      owns: [collision-attribution-history]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/collision_history.rs, src/server_app/registration.rs, src/snapshot.rs]
      symbols: [CollisionHistory, CollisionRecord]
      tests: [cargo test --features headless --lib core::collision_history, cargo test --features headless --test collision_history]

  - state: collision-attribution-history
    core:
      status: implemented
      confidence: confirmed
      title: Collision Attribution History
      summary: Ordered collision victim and damage attribution retained through digests and saved continuations on every simulation host.
      rationale:
        - "DeferredFold: the ordered row count, victim, amount, shield_absorbed and hull_damage use the existing collision fold bytes. Tick, sim_t and victim_is_asteroid are captured attribution metadata; the message cursor is derived and is neither captured nor folded. Optional RunTelemetry is report state and no longer determines this authoritative resource's presence."
        - "PhoenixSnapshot.collisions keeps its existing row schema. Simulation rules advance from 0.4 to 0.5 because old browser records omitted history and headless saves collected it too late; snapshot format remains 32. Old artifacts are refused by the ordinary rules gate and are never rewritten."
    architecture:
      classification: authoritative
      owner: shared-collision-history-collector
      writers: [shared-collision-history-collector]
      readers: [authoritative-state-digest, t2-peer-local-save-slot-lifecycle]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/collision_history.rs, src/sim_digest.rs, src/snapshot.rs]
      symbols: [CollisionHistory, CollisionRecord]

  - component: headless-telemetry-collector
    core:
      status: implemented
      confidence: confirmed
      title: Headless Telemetry Collector
      summary: Headless-only Last collector that reads the BalanceEvent stream each frame, stamping report events with tick and sim-time and snapshotting each referenced ship's display-name key and faction into optional report telemetry.
    architecture:
      kind: telemetry-collector
      authority: observational
      reads: [balance-event-stream]
      produces: [run-telemetry-state]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/headless/report.rs, src/headless/app.rs]
      symbols: [RunTelemetry, StampedBalanceEvent, collect_balance_events]
      tests: [cargo test, tests/headless_runner.rs]

  - state: run-telemetry-state
    core:
      status: implemented
      confidence: confirmed
      title: Run Telemetry State
      summary: Accumulated per-run buffer of stamped balance events plus uuid-to-name and uuid-to-faction snapshots, surviving NPC despawn so destroyed ships still appear in the report.
    architecture:
      classification: observational
      owner: headless-telemetry-collector
      writers: [headless-telemetry-collector]
      readers: [combat-ledger-aggregator, run-outcome-classifier]
    implementation:
      status: declared
      paths: [src/headless/report.rs]
      symbols: [RunTelemetry]
      tests: [cargo test]

  - component: combat-ledger-aggregator
    core:
      status: implemented
      confidence: confirmed
      title: Combat Ledger Aggregator
      summary: Pure fold over the stamped balance-event log producing per-ship ledgers — damage dealt/taken split by weapon and by attacker-victim pair, shield-absorbed vs hull, shots fired, kills, death timestamp, system knockouts with timestamps, and repair HP — keyed by uuid. Asteroid victims are excluded from ship ledgers.
      rationale:
        - "[ai] Aggregation is a pure function over the event log rather than a walk of surviving entities, so ships destroyed mid-run still carry a full ledger, and the report is unit-testable with no ECS app."
    architecture:
      kind: pure-aggregator
      authority: observational
      reads: [run-telemetry-state]
      produces: [run-report-artifact]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/core/balance.rs, src/headless/report.rs]
      symbols: [aggregate_ledgers, aggregate_damage, DamageLedger, ledgers_to_json]
      tests: [cargo test]

  - component: sim-rng
    core:
      status: implemented
      confidence: confirmed
      title: Seeded Simulation RNG
      summary: Sim-wide seeded RNG resource exposing per-subsystem streams derived from the master seed and a stream name, replacing the OS-seeded damage-distribution sites and entity/asteroid uuid generation, so a seeded headless run is byte-identically reproducible on the same binary and machine.
      rationale:
        - "[ai] Each stream is a vellum_rng::Pcg32 built as seeded(master, fnv1a64(stream_name)) — the master seeds the generator, the name-derived hash selects the PCG stream — so streams are disjoint by construction rather than offsets into one sequence, and are keyed by name not discriminant, so adding or reordering consumers never shifts an existing site's sequence. Seed precedence is --seed > world [global] seed > a randomly drawn seed; the resolved seed and its provenance are always echoed in the report, and --seed implies the single-threaded deterministic scheduler."
        - "The generator is the fleet crate rather than rand's SmallRng (#897) because Pcg32 is Serialize: the six stream positions can leave the process, which is what lets a world snapshot resume a run from where it got to instead of replaying it from tick zero. rand remains a dependency for the cosmetic, deliberately unseeded generators outside this boundary."
    architecture:
      kind: determinism-source
      authority: authoritative
      owns: [sim-rng-state]
      produces: [sim-rng-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/sim_rng.rs, src/server_app/registration.rs, src/headless/app.rs, src/headless/args.rs, src/regions/server.rs, src/console/weapons/beam.rs, src/console/weapons/torpedo.rs, src/console/weapons/blaster.rs, src/asteroids/lifecycle.rs, src/world/server.rs]
      symbols: [SimRng, SimStream, SeedSource, assign_uuid_with]
      tests: [cargo test, tests/rng_determinism.rs]

  - state: sim-rng-state
    core:
      status: implemented
      confidence: confirmed
      title: Simulation RNG State
      summary: The resolved master seed, its provenance (cli / world / random), and the per-stream generators. Capturable and restorable as SimRngState, which is what a world snapshot stores so a restored run resumes each stream at its exact position.
      rationale:
        - "[ai] Seven live RNG stream handles and four namespace mint handles are explicit full-type-path physical aliases of the existing SimRng and WorldIdMint canonical owners. StateCensus entries()/len() retain the exact original canonical map; aliases inherit owner classification and PASM identity, require an existing canonical owner, and reject chains, conflicting bindings and shadowing. Exhaustive resource enumeration resolves exact aliases without generic-prefix or short-name exemptions. Actual typed ResMut access remains visible to Bevy; snapshots/digests still capture the shared cells through their original owners. This diagnostic correction passed six registry tests and all four enumeration tests independently from the preserved 69-test runtime PASS."
        - "[ai] Namespace mint ownership likewise uses four physical companion types aliasing the existing world-id-mint-state cells. FixedFirst resets all cells at one boundary; runtime tick parking and snapshot restore replace the aggregate and all handles synchronously. Namespace names, counter saturation, rendered identities, serialized state and digest fold remain unchanged. These four full-path alias bindings add no canonical census entries or authoritative fields. Same-Projectile writers still require evidenced identity-assignment ordering; namespace separation does not claim their commutativity."
        - "[ai] The source-bound pre-split #1400 Projectile fixture observed the same identity order in two default MultiThreaded/pool16 processes and one SingleThreaded/pool1 process: blaster, delayed torpedo, immediate torpedo. The production blaster-before-lifecycle edge preserves this observed assignment and recoil; the existing lifecycle-to-ApplyDeferred-to-fire path remains. A singleton lifecycle instance set avoids ambiguity with the weapons test harness repeated registration, without ordering its extra instance. tests/projectile_ordering.rs retains the unchanged real-command fixture; all three candidate observations equal the stored baseline, including ammo reload, movement, recoil and continuation. This one-shooter evidence does not prove arbitrary multi-ship query traversal or authorize larger debt allowances."
        - "[ai] #1400 stories 6-7 gain three test-only default-pool counterparts through the existing exact fresh-child observer: real two-crew Fleet command/combat agreement, two ship peers versus a stationless GM, and chunked snapshot restore with progressed continuation. The original pinned guards retain their assertions and tick windows. The SDK-enabled native run passed the three parents plus three pinned companions with two, three and two actual App reports, all using 16 compute workers and MultiThreaded FixedUpdate. The Fleet observer checks the authored activation seed independently of the live RNG. No runtime edge, state or allowance changes; the ordinary headless configuration remains a separate final integration gate. docs/default-pool-perturbations.md records the bounded proof."
        - "[ai] The bounded #1400 lobby outbox follow-up replaces exclusive World access with its actual LobbyOutbox and OutboundMessage dependencies. FIFO draining, reliable delivery and the existing countdown/start-grant/reconnect edges are retained. Both source-bound SDK-enabled stages passed empty/single/multiple queue and real lobby lifecycle fixtures, actual graph capture and default/default/pinned full-host traces. All 90 per-tick boundaries and lifecycle messages matched; the graph narrowed from 1,929 to 1,711 rows (247 exclusive rows removed, 29 actual typed vectors added), with all 21 deferred instances and all dependency edges unchanged. The ordinary headless/final combined gate remains separate. This does not enlarge the original allowance or prove the remaining admitted conflicts commute."
        - "[ai] #1400 gives each ordinary ECS draw site mutable access to its actual named stream cell through LiveStream. The aggregate shares those cells solely for unchanged snapshot/digest and standalone APIs; no new stream, draw or serialized field is introduced. install/InstallSimRng replace all live cells synchronously at boot, fleet seed adoption, native runtime load and snapshot restoration including rollback. LiveStream rejects missing/stale seeded handles before drawing. Seed readers and the outside-schedule fingerprint retain their existing behavior. This removes false cross-stream coupling, not other gameplay conflicts or the need to order same-stream writers; the focused candidate suite passes resource/access, first-draw restore/rollback, Fleet/native load, original-allowance graph and default/pinned continuation checks."
    architecture:
      classification: authoritative
      owner: sim-rng
      writers: [sim-rng]
    implementation:
      status: declared
      paths: [src/sim_rng.rs]
      symbols: [SimRng, SimRngState, StreamRng]
      tests: [cargo test, tests/rng_determinism.rs]

  - component: run-outcome-classifier
    core:
      status: implemented
      confidence: confirmed
      title: Run Outcome Classifier
      summary: Pure classifier assigning each run an outcome — victory, defeat, draw, timeout, or reported — with per-side margins (remaining hull fraction, cumulative damage both ways, closing-window damage rate), sides bucketed by faction relative to the player ship.
      rationale:
        - "[ai] Victory vs defeat has no other structured signal, so the game_over trigger action carries an author-declared outcome threaded through GameOverReason; built-in player-ship death latches Defeat, an undeclared scenario game_over defaults to Victory. Budget exhaustion is timeout when damage still flows in the closing window, draw when it has gone silent — a reported heuristic, never adjudicated by the engine."
        - "[ai] An ending holding a non-empty MissionReport classifies `reported`, which OUTRANKS the declared victory/defeat rather than sitting beside it: a report-bearing ending is described by its rows, not by one word, and the declared outcome stays latched on GameOverReason for anything that still wants it. Every consumer of the outcome vocabulary carries a first-class arm for it — the batch runner's merge in scripts/balance-runs.mjs tallies `reported` in its own column and holds it out of the win-rate denominator, because folding it into wins invents a victory and folding it into losses or timeouts invents a failure."
    architecture:
      kind: pure-classifier
      authority: observational
      reads: [run-telemetry-state, ship-station-system-topology-state, game-phase-state]
      produces: [run-report-artifact]
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/core/balance.rs, src/headless/report.rs, src/world/config.rs, src/world/dispatch.rs, src/world/server.rs, src/server_app/components.rs]
      symbols: [classify, closing_damage_rates, RunOutcome, OutcomeReport, SideMargins, GameOverReason]
      tests: [cargo test, tests/headless_runner.rs]

  - state: run-report-artifact
    core:
      status: implemented
      confidence: confirmed
      title: Run Report Artifact
      summary: The headless exit summary — ticks, sim/wall time, resolved seed and provenance, final phase and game-over reason, per-ship combat ledgers, run outcome with per-side margins, and (in ndjson mode) the full stamped event timeline. Report on stdout, logs on stderr, so the JSON is never corrupted.
    architecture:
      classification: derived
      owner: combat-ledger-aggregator
      derived_from: [run-telemetry-state]
      readers: [balance-batch-runner]
    implementation:
      status: declared
      paths: [src/headless/report.rs, src/bin/phoenix_headless.rs]
      symbols: [RunReport]
      tests: [cargo test, tests/headless_runner.rs]

  - component: duel-composition-transform
    core:
      status: implemented
      confidence: confirmed
      title: Duel Composition Transform
      summary: Pure transform over the duel world's RAW TOML that regenerates the slot-driver roster inside its inline [script] block from the CLI side lists (--side-a / --side-b). It truncates the script source at the `// duel:slots` marker and emits, below it, one on_timer(0) registration per filled slot, the side-B annihilation registration when side B is non-empty, and a one-line driver per slot delegating to the world's own authored spawn_slot body. Each ship name resolves through an injected resolver (alliance-prefixed template, then bare template, then literal path); each side's faction is forced onto the spawn. Slots the lists do not reach are simply never generated.
      rationale:
        - "Combatants are spawn_entity effects, not static entities, because on_all_destroyed group membership only registers through SpawnEntity dispatch. Side A slot 1 is the game-start player ship (set from --side-a[0] via --ship); victory is side B annihilation, defeat is the built-in player-death latch — no side_a annihilation trigger is authored, because an empty side_a group would instant-fire and LocalShip death is the real defeat condition."
        - "It edits the raw source string rather than the parsed WorldConfig because a converted world's slots ARE script: trigger registration happens when the loader runs the unit's top level, so there is nothing in WorldConfig.triggers to fill or delete, and a script cannot conditionally skip registering the side-B victory trigger from runtime data. Editing the source before the loader reads it keeps the transform pre-boot and pure, and the build-time script gate then compiles the GENERATED source — so broken generation is a hard BuildError before the app runs and before anything spawns."
        - "It reads and writes the RAW WORLD SOURCE — the unparsed world TOML value that becomes world::server::RawWorldSource and is what the script loader compiles — not world-configuration-state: the parsed WorldConfig has already dropped the [script] key and is not touched by the transform at all. No state entity is declared for the raw source, so it is named here in prose rather than mis-attributed to the parsed world state."
        - "It generates only the one-line drivers, never spawn bodies: the doctrine, anchor convention and override shape are authored ONCE in duel.toml's spawn_slot, so a CLI roster cannot drift from the arena's own doctrine. This rides on a helper fn's effects landing in its caller's buffer (EffectSink is an Arc<Mutex<_>> shared through the copied ctx)."
        - "Determinism: the generated registration order mirrors the declarative file exactly (side-A escorts, side B, then victory), so trigger indices and spawn order are unchanged. Verified by digest A/B against the pre-conversion declarative world — sides-free and --side-a cruiser --side-b destroyer both reproduce their HEAD digests byte for byte."
        - "Every guard answers the same failure shape — a run that produces numbers instead of an error. A missing marker line is NoDuelSlots and two of them is DuplicateSlotMarker; a marked world authoring none of the bodies the generated roster calls (spawn_slot, and on_side_b_destroyed for a non-empty side B) is MissingSlotFn, because it would compile clean and then discard every call into an empty arena; a slot whose anchor the world never declares is UndeclaredSlotAnchor; and a fielded hull whose OWN doctrine steers to an undeclared anchor is UndeclaredDoctrineAnchor — issue #888's load-time check, re-run here through world::validate::template_doctrine_anchors because validate_doctrine_anchors_in walks the declarative config and cannot see a script-authored slot. Hulls a script spawns without the harness remain unguarded: that is the general script-spawn validation gap, open."
        - "Authored ≡ generated is pinned as a test rather than asserted: the harness runs over the shipped assets/worlds/duel.toml with the roster its authored default already states (cruiser + 4 couriers vs 5 destroyers) and the generated block must match the authored text byte for byte, so the un-harnessed default stays a trustworthy control for a harnessed run."
    architecture:
      kind: pure-transform
      authority: authoritative
      runs_in: [headless-runtime]
    implementation:
      status: declared
      paths: [src/headless/duel.rs, src/headless/app.rs, src/headless/args.rs, assets/worlds/duel.toml]
      symbols: [apply_duel_sides, resolve_template, SLOT_MARKER, DuelError, DuelTemplateLoader]
      tests: [cargo test, tests/headless_runner.rs]

  - component: balance-batch-runner
    core:
      status: implemented
      confidence: confirmed
      title: Balance Batch Runner
      summary: Node script that reads a TOML config (class-matrix shorthand, explicit matchups, or a scenario sweep), fans out phoenix-headless processes across a bounded concurrency pool, and merges the per-run report JSON into per-matchup win/loss/draw/timeout rates, time-to-kill distributions, and mean damage margins as a markdown table and optional merged JSON.
      rationale:
        - "[ai] The merge and formatting are pure functions exported for vitest; the CLI entry is guarded so importing never spawns. Failed, unparseable, and hung runs (configurable run_timeout_secs kill) are recorded per-run and never sink the batch."
    architecture:
      kind: offline-tool
      authority: observational
      reads: [run-report-artifact]
      runs_in: [node-tooling-runtime]
    implementation:
      status: declared
      paths: [scripts/balance-runs.mjs, scripts/balance-runs.example.toml]
      symbols: [mergeReports, formatMarkdown, formatMatrix, expandMatchups, buildRunTasks]
      tests: [tests/client/balance-runs.test.js]

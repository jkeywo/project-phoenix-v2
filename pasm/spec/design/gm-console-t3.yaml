      summary: "Issue #1430 (PRD #1418 T3 platform, applied to PRD #930 M1-M3's already-shipped desk, blocked by and reusing #1422-1426's corrected player consoles). The GM map/inspector shell, the mission/spawn/despawn/direct-effect/system/contact/npc-doctrine/objective 'directing' panels and the Comms/knowledge-compare/role-preset 'performing' panels carry the same 200%-text/forced-colours/keyboard contract #1422-1428 already gave every player console, without introducing any M4 attention or M5 recovery mechanic of its own. The authentic Station puppet (#1299) now mirrors the desk's own resolved presentation -- text scale, contrast and effect intensities -- onto the puppeted document's root on every gm_station tick, so the already-corrected Station family contents (#1423-1426) are actually reachable through it rather than sitting at their own 100% default no matter how far the desk is turned up."
      rationale:
        - "[ai] The desk's shared rules (gui/gm-workspace.css, gui/tokens.css) already carry every directing panel: the root text-scale multiplier applies once at the endpoint (#1427's rule, ratcheted by gm-workspace-shell.test.js), every button/input/select floors at the shared hit target and wraps rather than truncates, and #1422's forced-colours block already re-points focus rings and edges at system colours. The directing panels' own row classes (.gm-mission-event*, .gm-spawn-entry*, .gm-effect-log-entry, .gm-objective-row, .gm-session-log-entry) carry no panel-specific CSS because none is needed: plain block/inline DOM with no fixed width or nowrap to defeat enlargement."
        - "[ai] #1421's own DENSE_CONTENT.gmLists fixture names FOUR real long rows, not two: the directing mission log's server.gm.mission.skip_result_timed_out and the directing Objective list's server.gm.objective.preview_complete, PLUS server.gm.knowledge.hint and server.gm.knowledge.summary from the performing Knowledge Compare panel (gui/gm-knowledge-compare.js). The first pass of this issue drove only the first two through their real reducers and its own evidence overstated that as covering the whole directing/performing scope named in 'What to build' (issue #1430 review, fix round 1, blocking finding). All four are now driven: tests/client/gm-directing-performing-dense-content.test.js exercises the mission log and Objective list at twelve-row density (jsdom: full untruncated text, buttons stay enabled) AND the Knowledge Compare panel's hint (the real, untruncated 189-char sentence via the ordinary data-i18n bind) and summary (composed by the real controller from a twelve-contact comparison covering same/changed/truth_only/crew_only, one of each x3); tests/smoke/gm-layout.spec.js adds a dedicated performing-surface case exercising the same Knowledge Compare panel, the Comms panel and role presets together at 200% text."

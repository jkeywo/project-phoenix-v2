<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.destroyer_helm.doc_title">Project Phoenix — Helm Console</title>
  <script src="../bg-raf-keepalive.js"></script>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; align-self: flex-start; }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 280px) 1fr minmax(0, 280px); gap: 16px; }
    .console-body .radar-col { display: flex; flex-direction: column; min-height: 0; }
    .console-body .ctrl-col { display: flex; flex-direction: column; justify-content: space-evenly; gap: 12px; min-height: 0; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; }
    ph-helm-radar { flex: 1; min-height: 0; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row > * { flex: 1; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .sep { color: var(--line-soft); }
    .console-footer .spacer { flex: 1; }
    /* Visiting consoles (issue #984): Comms and Navigation follow the crew, so
       this station carries the same toggle/panel pair the destroyer's Tactical
       console has, shown only while the seek holds a system here. */
    .hero-controls { display: flex; align-items: center; gap: 8px; }
    .overlay-toggle { background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; white-space: nowrap; min-height: var(--control-hit-min); }
    .overlay-toggle:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-toggle.active { background: rgba(var(--rgb-cyan-dim), 0.9); border-color: var(--cyan); color: var(--cyan); }
    .overlay-toggle .unread-badge { display: none; margin-left: 6px; background: var(--fire-bright); color: var(--surface-void); font-size: var(--text-xs); font-weight: 700; padding: 0 4px; border-radius: 2px; line-height: 1.4; }
    .overlay-toggle .unread-badge.show { display: inline-block; }
    .overlay-back { position: absolute; top: 6px; left: 6px; z-index: 6; background: rgba(var(--rgb-panel), 0.85); border: 1px solid var(--edge); color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.2em; padding: 6px 14px; cursor: pointer; text-transform: uppercase; transition: all 0.15s ease; min-height: var(--control-hit-min); }
    .overlay-back:hover { background: rgba(var(--rgb-panel-up), 0.9); border-color: var(--ink-dim); }
    .overlay-panel { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(var(--rgb-deep), 0.97); border: 1px solid var(--edge); display: none; flex-direction: column; padding: 16px; }
    .overlay-panel.open { display: flex; }
    .overlay-panel h2 { font-family: "Chakra Petch", sans-serif; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3em; color: var(--ink-dim); text-transform: uppercase; margin: 0 0 8px; padding: 0; flex-shrink: 0; border-bottom: 1px solid var(--edge); padding-bottom: 6px; }
    .overlay-panel ph-navigation-map, .overlay-panel ph-comms-contact-list, .overlay-panel ph-comms-current-message { flex: 1; min-height: 0; }
    .overlay-toggle[hidden] { display: none; }

    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { grid-template-columns: 1fr; gap: 8px; } .console-body .ctrl-col { padding: 8px; } .console-body .radar-col { order: -2; } .console-body .joystick-col { order: -1; } }
    /* Landscape is height-starved, so the hero stops being an in-flow row and
       becomes a bar floating over the top of the chart: `.console-body` then
       gets the panel's whole content height and the radar grows into it. The
       offsets mirror the landscape `body .panel-inner` padding console.css
       forces (16px top / 20px right / 44px left) so the bar starts exactly at
       the content box — the 44px is the settings cog's gutter, which the bar
       must never cover. `pointer-events: none` keeps the radar draggable
       underneath. Portrait keeps the hero in flow.

       Only the chart runs under the bar; the control columns are pushed clear
       of it — and still end up taller than they were with the hero in flow.

       The track caps shrink here too. A `1fr` middle track was starved because
       both 280px side tracks are maximised before the middle sees anything —
       at 650x450 that left the radar 0px wide. `minmax(0, 1fr)` lets the
       middle shrink-and-grow properly, and the caps are cut to what the
       widgets actually need: 240px for ph-helm-joystick's fixed 240px disc,
       200px for ph-lateral-thrust-joystick's 180px pad. */
    @media (orientation: landscape) {
      /* The floating bar's height: its own floor, and what the control
         columns clear so that only the chart runs underneath it. */
      :root { --hero-bar: 34px; }
      .hero {
        position: absolute; z-index: 3; pointer-events: none;
        top: 16px; left: 44px; right: 20px;
        min-height: var(--hero-bar); align-items: center; padding: 2px 10px;
        background: rgba(var(--rgb-base), 0.92); border: 1px solid var(--line-faint);
      }
      .hero h1 { font-size: var(--text-xl); line-height: 26px; }
      .hero h1 .sub { display: inline; margin-top: 0; margin-left: 14px; }
      /* The bar is `pointer-events: none` so the chart stays draggable
         underneath it. Its CONTROLS are not — Helm is last in the destroyer's
         seek order, so a Nav or Comms toggle appearing here means nobody else
         was left to answer, which is the worst possible moment for a button
         that cannot be pressed. Compacted to fit the 34px bar. */
      .hero-controls { pointer-events: auto; }
      .hero .overlay-toggle { padding: 4px 10px; font-size: var(--text-xs); min-height: 26px; }
      .console-body { grid-template-columns: minmax(0, 200px) minmax(0, 1fr) minmax(0, 240px); }
      /* 8px rather than the 12px of the base rule: ph-helm-joystick's disc is
         a fixed 240px and the column has to fit it inside a phone's landscape
         height, where every pixel of chrome counts. */
      .console-body .ctrl-col { margin-top: calc(var(--hero-bar) + 6px); padding: 8px; }
      .console-body .radar-col { align-items: center; }
      /* `isolation` matters: ph-helm-radar's readouts are `z-index: 10` inside
         its shadow root, and the host is only `position: relative` — with no
         stacking context of its own they escape into the root one and paint
         straight through the bar that is supposed to be above them. */
      ph-helm-radar { flex: none; width: auto; height: 100%; aspect-ratio: 1 / 1; max-width: 100%; max-height: 100%; isolation: isolate; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Helm Console" data-i18n-attr="data-screen-label:console.helm.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.helm.title">HELM</span><span class="sub" data-i18n="console.destroyer_helm.subtitle">PILOTING</span></h1>
        <div class="hero-controls">
          <span class="auto-badge" id="helm-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          <!-- Human-seeking systems (issue #984): hidden until the seek parks
               Navigation or Comms on this station, and hidden again the moment
               it moves on. -->
          <button class="overlay-toggle" id="nav-toggle" data-overlay="nav-overlay" data-active="false" hidden data-i18n="console.common.nav_toggle">Nav</button>
          <button class="overlay-toggle" id="comms-toggle" data-overlay="comms-overlay" data-active="false" hidden><span data-i18n="console.common.comms_toggle">Comms</span><span class="unread-badge" id="comms-unread">!</span></button>
        </div>
      </div>
      <div class="console-body">
        <div class="ctrl-col movement-col">
          <ph-lateral-thrust-joystick id="lateral-thrust-joystick"></ph-lateral-thrust-joystick>
          <div class="btn-row">
            <ph-impulse-btn id="impulse-btn"></ph-impulse-btn>
            <ph-boost-btn id="boost-btn"></ph-boost-btn>
          </div>
        </div>
        <div class="radar-col">
          <ph-helm-radar id="helm-radar"></ph-helm-radar>
        </div>
        <div class="ctrl-col joystick-col">
          <ph-helm-joystick id="helm-joystick"></ph-helm-joystick>
        </div>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status" data-i18n="console.helm.station_footer">HELM STATION</span>
        <span class="sep">·</span>
        <span id="footer-target" style="color:var(--ink-faint)" data-i18n="console.common.no_target">NO TARGET</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
    <!-- Visiting consoles (issue #984). Present in the markup always, opened
         only through toggles that appear while the seek holds the system here.
         Same ids as the destroyer's Tactical console — gui/visiting-systems.js
         renders all four seats through one code path. -->
    <div class="overlay-panel" id="nav-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.navigation_panel">Navigation</h2>
      <ph-navigation-map id="navigation-map"></ph-navigation-map>
      <ph-civilian-traffic id="civilian-traffic"></ph-civilian-traffic>
    </div>
    <div class="overlay-panel" id="comms-overlay">
      <button class="overlay-back" data-overlay-back data-i18n="console.common.back">&#8592; Back</button>
      <h2 data-i18n="console.common.comms_panel">Comms</h2>
      <ph-comms-contact-list id="comms-contact-list"></ph-comms-contact-list>
      <ph-comms-current-message id="comms-current-message"></ph-comms-current-message>
    </div>
  </div>
  <script type="module">
    import '../components/ph-helm-radar.js';
    import '../components/ph-helm-joystick.js';
    import '../components/ph-lateral-thrust-joystick.js';
    import '../components/ph-impulse-btn.js';
    import '../components/ph-boost-btn.js';
    import '../components/ph-station-damage.js';
    import '../components/ph-comms-contact-list.js';
    import '../components/ph-comms-current-message.js';
    import '../components/ph-navigation-map.js';
    import '../components/ph-civilian-traffic.js';
    import { initConsole } from '../console-core.js';
    import { t } from '../strings.js';
    import { setAutoState } from '../console-ui.js';
    import { initConsoleOverlays } from '../console-overlays.js';
    import { renderVisitingSystems } from '../visiting-systems.js';

    // Delegated, because the toggles these panels hang off start `hidden` and
    // only become controls when the seek hands this station the system.
    initConsoleOverlays();

    initConsole({
      name: 'helm',
      // s is a HelmConsolePayload — see the @typedef in gui/console-state.js.
      // Helm is a FLAT payload: it owns one console family, so it has no
      // `systems` map of its own. A visiting system still arrives under
      // `systems` (withVisitingSystems in gui/console-state.js adds the key),
      // which is why the same renderer serves this console and the composed
      // ones without either of them knowing which shape it is looking at.
      render: function(s) {
        // Comms and Navigation follow the crew (issue #984). Helm is LAST in
        // this hull's authored seek order, so these appear only on a bridge
        // with nobody at Tactical, Engineering or the Captain's chair.
        renderVisitingSystems(s);
        var radarEl = document.getElementById('helm-radar');
        var joystickEl = document.getElementById('helm-joystick');
        var lateralEl = document.getElementById('lateral-thrust-joystick');
        var impulseEl = document.getElementById('impulse-btn');
        var boostEl = document.getElementById('boost-btn');
        radarEl.state = { blips: s.blips || [], range: s.range || 500, x: s.x || 0, z: s.z || 0, ship_heading: s.ship_heading || 0, speed: s.speed || 0, on_screen_active: !!s.on_screen, config: {}, engine_port_thrust: s.engine_port_thrust || 0, engine_stbd_thrust: s.engine_stbd_thrust || 0, hostile_arcs: s.hostile_arcs || [], hostile_arc_color: s.hostile_arc_color || null };
        joystickEl.state = { auto: !!s.helm_auto };
        lateralEl.state = { auto: !!s.lateral_auto };
        impulseEl.state = { state: s.impulse_charge_progress > 0 ? 'charging' : 'ready', charge_pct: (s.impulse_charge_progress || 0) * 100, auto: !!s.helm_auto };
        boostEl.state = { available: !!s.boost_enabled, active: !!s.boost_active, recharge_pct: s.boost_battery != null ? s.boost_battery * 100 : 100, auto: !!s.helm_auto };
        setAutoState(null, document.getElementById('helm-auto-badge'), !!s.helm_auto);
        document.getElementById('station-damage').state = s.own_hull || null;
      }
    });
  </script>
</body>
</html>

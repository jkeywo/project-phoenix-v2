# Optional Science support reference: independent request, ordinary backfill.
[global]
seed = 156215
[player_spawn]
position = [0,0,0]
[[entity]]
template_path = "assets/entities/illumination_cruiser.toml"
id = "player-ship"
name = "player-ship"
spawn_on = "game_start"
transform = { position = [0,0,0] }
[[entity]]
template_path = "tests/fixtures/illumination-target.toml"
id = "support-target"
name = "support-target"
spawn_on = "game_start"
transform = { position = [0,3,-90] }
[script]
setup = """
on_world_loaded("request_support");
fn request_support(ctx) {
    ctx.effects.add_objective(#{id:"science-support",text:"illumination.mission.support",
        mandatory:false,source:"mission",base_priority:50,
        directive_kind:"Illuminate",target:"support-target",targets:["support-target"]});
}
"""

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.science.doc_title">Project Phoenix — Science Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    /* The scope at full size with the target card on one side and the
       four-facing shield ring on the other (issue #1394), reusing the shared
       `.scope-row`/`.scope-cell` two-rail pattern (issue #1375) exactly as
       gui/destroyer/tactical.html and gui/battleship/sensors.html already do
       — this document states its two rail widths and says nothing else about
       the scope's size: no aspect-ratio of its own, no per-orientation
       spelling. `ph-sensor-panel` IS the target card (see its own docstring
       and ph-target-lock-card.js's "Deliberately narrower than
       ph-sensor-panel's target card, which this mirrors"), so the start rail
       needs no bespoke card markup.

       `--scope-rail-min` is 140px, well under the two joystick-driven hulls'
       160-190px: neither rail here holds a fixed-size widget with a floor of
       its own to protect. The target-col has ph-sensor-panel's header, which
       wraps (below) rather than breaking mid-phrase; the shield-col's own
       `ph-shield-panel { display: none }` rule further down drops out
       exactly at the narrow-rail pinch point (a landscape window short
       enough to force the floor also has `max-height: 500px`), leaving only
       ph-shield-facings' scaling SVG and a heading behind. At 190px both
       rails held their floor at 650x450 and left the scope 132px square,
       under `tests/smoke/scope-responsive.spec.js`'s 150px floor for that
       viewport; at 140px the same viewport measures 225px square. */
    .console-body { --scope-rail-start: 240px; --scope-rail-end: 240px; --scope-rail-min: 140px; }
    .console-body .ctrl-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; overflow-y: auto; }
    /* Round 3 of the #1375 slice shipped this exact document with
       `ph-sensor-panel#sensor-panel` squeezed to zero height by a `flex: 1`
       rail sharing space with a square that took its basis first (see
       tests/smoke/scope-responsive.spec.js's doc comment). `flex-shrink: 0`
       here is what destroyer/tactical.html's weapon controls and target-lock
       card already carry for the same reason: a rail's fixed-size widgets are
       exactly as tall as what they hold, and a stack too tall for the rail
       overflows the rail's own `overflow-y: auto` above rather than being
       crushed to nothing. */
    ph-sensor-panel, ph-shield-panel, ph-shield-facings { flex-shrink: 0; }
    /* Compact threat-bearing readout (issue #926) — the standing fact the
       battleship's dedicated Shields console shows, condensed to one line
       and set beside the ring it describes. Hidden when Sensors holds no
       threat. */
    .threat-readout { display: flex; justify-content: space-between; gap: 8px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); flex-shrink: 0; visibility: hidden; }
    .threat-readout.active { visibility: visible; }
    .threat-readout strong { color: var(--ink); font-family: "Chakra Petch", sans-serif; font-size: var(--text-md); }
    /* Desktop adds the shield panel rows — grid status, integrity, per-facing
       bars, focus line (issue #1394's AC) — the ring alone is what a phone's
       frame has room for. The threshold mirrors gui/hero-bar.js's own
       phone/desktop split for the Station Bar above this console
       (HERO_BAR_CODE_QUERY) rather than inventing a second one: a phone held
       either way is a phone by the same rule the bar already used. */
    @media (orientation: portrait) and (max-width: 599px), (orientation: landscape) and (max-height: 500px) {
      ph-shield-panel { display: none; }
    }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .console-body .ctrl-col { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Science Console" data-i18n-attr="data-screen-label:console.science.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat and its selected tab opens the per-system damage
           popup the footer's `ph-station-damage` used to. The locked target
           the footer named heads the target-card rail it belongs to. -->
      <div class="console-body scope-row">
        <div class="ctrl-col target-col">
          <div class="readout">
            <span id="footer-target" data-i18n="console.common.no_target">NO TARGET</span>
            <span class="spacer"></span>
            <span class="auto-badge" id="science-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
          </div>
          <ph-sensor-panel id="sensor-panel"></ph-sensor-panel>
        </div>
        <div class="radar-col scope-cell">
          <ph-sensor-radar id="sensor-radar"></ph-sensor-radar>
        </div>
        <div class="ctrl-col shield-col">
          <ph-shield-panel id="shield-panel"></ph-shield-panel>
          <div class="threat-readout" id="threat-row"><span data-i18n="console.shields.threat_bearing">Threat Bearing</span><strong id="threat-bearing">—</strong></div>
          <ph-shield-facings id="shield-facings"></ph-shield-facings>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import '../components/ph-sensor-radar.js';
    import '../components/ph-sensor-panel.js';
    import '../components/ph-shield-panel.js';
    import '../components/ph-shield-facings.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/cruiser/science.console.js (issue #1235): the
    // shared Science renderer + this hull's variant (Sensors + Shields, no
    // bespoke tail). s is a SystemStationConsolePayload — see the @typedef
    // in gui/console-state.js. The vitest suite imports the same
    // renderStation.
    import { renderStation } from './science.console.js';
    initConsole({ name: 'science', render: renderStation });
  </script>
</body>
</html>

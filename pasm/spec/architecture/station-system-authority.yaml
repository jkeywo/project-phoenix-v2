    core:
      status: implemented
      confidence: confirmed
      title: Ship Station and System Topology
      summary: Ship-authored Stations as crew seats, Consoles as hosted screens and knowledge scopes, and Systems as controlled capabilities, with ratings and power groups.
      rationale:
        - "[ai] Increment 1 resolves authority through System -> Console -> current hosting Station -> player. Feeds grant information only; cohosted Consoles do not pool knowledge."
        - "[ai] Every System has an explicit Console, including AI-only equipment. Screenless scopes are AI-only; human-operable equipment requires a screen and hosting route. Legacy ownership fields fail with conversion guidance."
        - "[ai] NPCs retain ordinary per-System AI and explicit Console scopes. Structural migration adds no equipment or balance change."
    architecture:
      kind: configuration-model
      authority: authoritative
      owns: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]

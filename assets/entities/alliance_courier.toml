# Alliance Courier — a compact two-player hull.
#
# Captain owns command, Comms, Navigation, Power, Repair and Shields. Tactical
# owns weapons, helm and Sensors. Every capability remains a fine System; the
# client derives the data for each station from those TOML assignments.

name = "entity.alliance_courier.name"
class = "courier"
hull_id = "NCC-0912"
# Independent of the (absent) [power] block: feeds the lobby card and
# combat_test's ship_power counter. Low enough to stay under that scenario's
# >=90 / >=100 bonus-spawn gates, which is the point of flying solo.
power_rating = 25
# Player identity (the `player` tag + `playerShip` radar icon) is NOT authored
# here — it is injected onto the selected hull at the player game-start spawn
# (see `player_ship_identity` in `src/server_app.rs`). A world-spawned copy of
# this hull is an ordinary NPC ship, so it must not masquerade as the player.
tags = [ "ship" ]
faction = "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa"

[mesh]
model = "assets/models/alliance_courier.glb"
shape = "sphere"
colour = []

[collider]
shape = "Capsule"
radius = 0.6
length = 1.5

# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# Default doctrine for a backfilled/unmanned player courier (#842 — the other half
# of #838's human/AI symmetry). See the fuller note on `alliance_cruiser.toml`;
# authoring `[behaviour]` is what makes `spawn_entity` attach the
# `BehaviourSection` on the player game-start path, so a backfilled courier
# proactively engages instead of only returning fire once hit.
#
#   Destroy (40) — UNTARGETED (no `directive_target`) → licenses the
#                  nearest-hostile scan and proactive engagement. Priority a notch
#                  below the warship hulls: the courier is a lightly-armed scout,
#                  willing to fight but not the fleet's spearhead.
#   Hold    (20) — no directive when no hostile is visible: the helm holds station.
#
# Engage priority stays LOW (40) so scenario `spawn_entity` overrides (Destroy at
# 80) merge by id and dominate (#842 AC3). No Retreat authored. `maintain_range =
# 22` keeps the courier inside its single 35-unit fore blaster's range.
#
# `imminent_collision_facing_threshold = 0.6` (issue #780 AC4): see the fuller
# note on `alliance_cruiser.toml`. Every shipped hull left this at its 1.0
# (effectively off) default, so avoidance only ever bent travel and never
# actually turned the ship's facing away from a closing obstacle — the fix for
# the "AI flies through asteroid fields" report against the backfilled player
# hull.
[behaviour]
imminent_collision_facing_threshold = 0.6

[[behaviour.doctrine]]
id             = "destroy-hostiles"
text           = "entity.alliance_courier.behaviour.doctrine.destroy_hostiles.text"
directive_kind = "Destroy"
base_priority  = 40.0
target_speed   = 0.9
maintain_range = 22.0

[[behaviour.doctrine]]
id            = "hold-station"
text          = "entity.alliance_courier.behaviour.doctrine.hold_station.text"
base_priority = 20.0
target_speed  = 0.0

# ── Per-system hull ──────────────────────────────────────────────────────────
# One entry per damageable system, plus "core" — the ownerless bucket that
# RepairTarget::Core dispatches to. Shield-arc hull comes from
# [[shield_arc]].hull_max_hp, not from here.

# ── Durability ladder (#915 tuning pass) ─────────────────────────────────────
# The whole fleet was re-pegged in one pass, because these numbers only mean
# anything relative to each other. Dynasty hulls carry a monolithic
# `[hull] hull_integrity`; Alliance hulls have none, and their equivalent pool
# is the SUM of the per-system `max_hp` below. Shields sit on top of both.
#
#   Dynasty   destroyer 200 | patrol/cruiser 300 | warhawk 400 | lancer 800
#   Alliance  courier 200 | destroyer 300 | cruiser 500 | battleship 800
#
# The Alliance figures were reached by scaling each hull's authored system HP
# proportionally, so the relative weighting between systems is unchanged.
#
# RADAR SYSTEMS CARRY NO HULL. `helm-radar`, `tactical-radar` and `sensor-radar`
# have no `[[hull.system_hull]]` entry on any Alliance hull, so they cannot be
# damaged, disabled or repaired — their points were redistributed across the
# surviving systems and the totals above are unchanged. The code that reacts to
# a downed radar (weapons-console arc gating, the helm radar overlay, the
# captain's repair targeting) is untouched and still fires for any hull that
# authors those entries; these four simply never trigger it.
[[hull.system_hull]]
system_id = "core"
display_name = "entity.alliance_courier.hull.system_hull.core.display_name"
max_hp = 32
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.10

[[hull.system_hull]]
system_id = "helm-engine-port"
display_name = "entity.alliance_courier.hull.system_hull.helm_engine_port.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

[[hull.system_hull]]
system_id = "helm-engine-starboard"
display_name = "entity.alliance_courier.hull.system_hull.helm_engine_starboard.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

[[hull.system_hull]]
system_id = "helm-lateral-thrust"
display_name = "entity.alliance_courier.hull.system_hull.helm_lateral_thrust.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

[[hull.system_hull]]
system_id = "blaster-fore"
display_name = "entity.alliance_courier.hull.system_hull.blaster_fore.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

[[hull.system_hull]]
system_id = "power-reactor"
display_name = "entity.alliance_courier.hull.system_hull.power_reactor.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

[[hull.system_hull]]
system_id = "power-battery"
display_name = "entity.alliance_courier.hull.system_hull.power_battery.display_name"
max_hp = 28
damaged_threshold_pct = 0.75
disabled_threshold_pct = 0.25
debuff_magnitude = 0.20

# ── Repair ───────────────────────────────────────────────────────────────────
# One team for the whole ship. The Captain dispatches it to either station;
# repair then works through that station's damaged systems in the normal order.

[repair]
repair_team_count = 1
travel_duration_secs = 9
repair_rate_hp_per_sec = 0.25

# ── Weapons ──────────────────────────────────────────────────────────────────

[weapons_console]
torpedo_arc_color = [ 1, 0.55, 0.2, 0.15 ]

# Tactical's combat scope. Sensors receives its separate long-range scope
# below, so each station sees data for its own fine Systems.
# Re-authored by issue #952, which retired the `sensors` power group and with it
# the only thing that ever scaled this number. Every tactical radar range in the
# fleet was tuned against a live horizon of `range x 0.667` — the rung those
# hulls rested `sensors` at — so leaving the authored figures alone would have
# widened every acquisition horizon in the fleet by half, silently, as a side
# effect of a reactor change. The multiplier is folded into the number instead:
# the live horizon is unchanged, and it is now simply what is written here.
[weapons_console.radar]
range = 166.7
shows = [ "player", "ship", "station", "asteroid", "asteroid_field", "planet", "star", "missile", "torpedo", "region" ]
selects = [ "ship", "station", "asteroid", "planet" ]

# Exactly one weapon. No [[weapons_console.phaser_banks]] and no [torpedoes]:
# both spawn paths read `phaser_banks.first()`, so an absent list is a ship
# with no phasers rather than a ship with a default one.
[[weapons_console.blaster_banks]]
id = "fore"
marker = "blaster_fore"
facing_deg = 0
fire_arc_deg = 45
volley_count = 3
volley_interval_secs = 0.5
cooldown_secs = 5
projectile_speed = 50
collision_radius = 0.8
visual_scale = 0.5
damage = 15
shield_pierce = 0.1
range = 35

  # Open-fire policy for this bank (issue #781), AUTHORED rather than
  # synthesised (#885b). Mirror of the phaser banks on the `blaster_fire`
  # channel: unconditional, with the host still enforcing availability,
  # cooldown, range, arc and target validity before the volley starts.
  [weapons_console.blaster_banks.ai]
  # The RED-ALERT fire gate (issue #872). `red_alert` is a host-seeded typed
  # fact — 1 while this ship is at red alert, 0 otherwise — and the guard below
  # is the SAME text on every armed hull in the fleet. Only this threshold
  # differs: 1 means "hold fire until the captain calls red alert", 0 means
  # "always armed". This hull has a captain's console (human, or an AI backfill
  # operating the same system) to call it, so it holds. Delete the param and the
  # guard and the weapon is ungated again — the gate is content, not code.
  param = { min_alert_to_fire = 1.0 }

  [[weapons_console.blaster_banks.ai.rule]]
  priority = 0
  channel = "blaster_fire"
  when = "fact(red_alert) >= param(min_alert_to_fire)"
  verb = "fire_blaster"

# ── Sensors ──────────────────────────────────────────────────────────────────
# Gives Tactical's sensor panel its range and set_sensors_target home.

[sensors_console]

[sensors_console.long_range_radar]
range = 250
shows = [ "player", "asteroid_field", "ship", "station", "planet", "star" ]
selects = [ "ship", "station", "planet" ]

# ── Helm ─────────────────────────────────────────────────────────────────────
# Quicker and twitchier than the destroyer, and much less able to take a hit.
# No [helm_console.radar]: Tactical renders its combat radar separately.

[helm_console]
max_speed = 20
max_reverse_speed = 8
acceleration = 9
deceleration = 18
max_yaw_rate = 0.9
# Lightest hull in the fleet, so it buys the most turn back for throttle:
# a stationary courier comes about 50% faster than one at flank speed.
low_speed_turn_boost = 0.5
max_bank_deg = 18
impulse_charge_duration = 2.0
impulse_speed_multiplier = 14
impulse_acceleration_multiplier = 9

[helm_console.engine_pfx]
color = [ 0.25, 0.75, 1, 0.72 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.45
trail_spawn_interval_secs = 0.05

[helm_console.lateral_thrust]
max_lateral_speed = 22
lateral_acceleration = 16

[helm_console.boost]
multiplier = 3.5
steering_multiplier = 2.0
active_duration = 6.0
recharge_duration = 15.0

# ── Nav / comms / captain ────────────────────────────────────────────────────

[navigation_console]

[navigation_console.system_chart]
range = 800
shows = [ "region", "asteroid_field", "star", "planet", "station", "player", "objective_marker" ]
selects = [ "station", "planet", "star", "region" ]

[comms]
range = 1000

[captain_console]

[radar_appearance]
colour = [ 0, 1, 0.2 ]
size = 4
# Ordinary-ship icon: a world-spawned copy of this hull is an NPC. The player's
# own ship gets the `playerShip` icon injected at spawn (see hull tags note).
icon = "ship"

# The Courier deliberately offers only its Fore hull camera and this Cinematic
# camera on the shared viewscreen.
[cinematic_camera]
position = [0, 6, 12]
default_pitch_deg = 12
entity_look_range = 50
look_ahead_distance = 80
hysteresis_secs = 3
yaw_follow_deg_per_sec = 45

# ── Shields ──────────────────────────────────────────────────────────────────
# Two arcs, fore and aft. Captain controls them through shields-system.

[shields_console]
# What a reactor point spent on `shields` buys: `ModifierSlot::ShieldRegen`
# (issue #952). Index 0 is 0.0 rather than the fleet default's -0.5 because
# this hull RESTS `[power_groups.shields]` at 1 to keep its four groups inside
# the reactor's sustainable total — so level 1 has to mean "the regen every
# `[[shield_arc]]` below authors", not a permanent two-thirds penalty on a
# group nothing ever raises. The rungs above it are what the Power officer buys
# by taking a point off helm or weapons.
power_multipliers = [ 0, 0.25, 0.5, 1 ]
focus_bonus_max_hp = 0
focus_bonus_regen = 4
focus_penalty_max_hp = 0
focus_penalty_regen = 1.0
focus_decay_rate = 10
focus_focused_damage_multiplier = 0.5
focus_unfocused_damage_multiplier = 1.25

[shields_console.base]
max_hp = 40
regen_per_sec = 2.0
offline_duration = 8

[[shield_arc]]
id = "fore"
label = "entity.alliance_courier.shield_arc.fore.label"
center_deg = 0
width_deg = 180
hull_max_hp = 4

[[shield_arc]]
id = "aft"
label = "entity.alliance_courier.shield_arc.aft.label"
center_deg = 180
width_deg = 180
hull_max_hp = 4

# ── Power ────────────────────────────────────────────────────────────────────
# Small-hull values are authored here rather than inferred from ship class.
[power]
capacity = 35
# Index 3 (a ship-wide total of 6) is +1, not the 0 this hull shipped until
# issue #952's review. 6 is exactly where this hull's own battery floors settle
# it — `ops 1 + helm 2 + weapons 2 + shields 1`, every group on its
# `min_level` — and a flat 0 there is a trap with no exit: the reserve neither
# drains nor charges, so no floor can ever lift and the ship is parked at its
# floors for the rest of the encounter. 6 is also this hull's RESTING total, so
# the same 0 meant a courier sitting quietly at anchor never recovered a point
# of charge either. Every hull's fully-floored rung must be strictly positive;
# pinned by `ship::power::tests::every_hulls_fully_floored_total_recharges`.
rates = [ 3, 2, 1, 1, -1, -3 ]
emergency_threshold = 10
# How far above its own floor the reserve has to climb before the reactor lets
# a group back up, in the same percentage-of-`capacity` units. Without this band
# a floor chatters at tick rate: cutting a group lowers the EFFECTIVE total, the
# effective total is what picks the `rates` rung, and on this reactor the rungs
# either side of the resting total have opposite signs — so the cut immediately
# recharges the reserve back through the threshold that made it. Raise it for
# longer, more deliberate brownouts; lower it for a ship that scrabbles back.
battery_floor_release_margin = 5.0

# Battery floors (issue #952): the percentage of `capacity` below which each
# group is held down to its `[power_groups.*] min_level`, released again only
# once the charge climbs back through `battery_floor_release_margin` above it.
# Falling, the ship loses helm first, then its guns, and keeps its screens
# longest. Recovering, the ladder releases from the TOP, not in reverse: a cut
# rung waits for every rung above it, so the reserve climbs on the deep-cut draw
# instead of re-imposing the one that emptied it, and `shields` — the lowest
# rung — is the LAST group back rather than the first. `weapons` sits ABOVE
# this hull's own `min_reserve_weapons`, so the reactor cuts the guns before the
# crew would and the ladder actually bites on an AI-crewed hull; `helm` stays
# UNDER `min_reserve_helm`, so the crew's guard binds first there. See the fuller
# note in `assets/entities/fragments/ai/fleet_baseline.toml` for the measurement
# behind that asymmetry.
[power.battery_floor]
helm = 40.0
weapons = 25.0
shields = 5.0

# Inline stateless power allocation policy (issue #784). Each rule binds a
# priority + power-group channel to a `when` guard and the value-carrying
# `set_power_group_allocation` verb (its `level` the absolute target). Every
# allocation rule declares a MINIMUM BATTERY RESERVE as a `param` its guard
# reads, so a group is elevated only while the trigger holds AND the battery is
# at or above that reserve — allocation never rises past what the reactor can
# sustain (no avoidable brownout), replacing the old global emergency exception.
#
# The `weapons` channel is the fleet's #955 COMBAT-STATIONS allocation,
# transcribed from `fragments/ai/fleet_baseline.toml` — this hull composes no
# fragment, so it owns its copy and a retune there has to be repeated here. The
# full derivation (weapons level → `ModifierSlot::PhaserDamage` → beam
# intensity, not reach) lives in that fragment's header and in
# `docs/toml-authoring-guide.md` §2.2.
#
# This hull mounts no phaser bank, so nothing here changes anything it fires:
# `PhaserDamage` only multiplies a bank's authored `beam_damage_per_sec`
# (`console::weapons::beam::tick_beams`), and this hull's one weapon is a
# blaster bank, whose `damage` field no power group scales at all. The
# red-alert `weapons` elevation is therefore inert on this hull by
# construction — recorded here so the frozen-battery exception below is not
# mistaken for a live damage bug.
#
# ── The frozen-battery exception (issue #923 follow-up; #955 moved the elevated
# channel from `sensors` to `weapons`; #952 fixed the rates that caused it) ───
#
# This hull used to author `rates = [3, 2, 1, 0, -1, -3]`, a flat 0 at total-6 —
# the resting allocation, and also the allocation red alert falls back to once
# the battery has dropped under `min_reserve_helm` and then
# `min_reserve_weapons`: ops 1 + helm 2 + weapons 2 + shields 1 = 6. At that
# total the battery neither drained nor recharged, so it settled there and
# stayed, and weapons could never re-cross `min_reserve_weapons` to climb back
# to 3 for the rest of the encounter. Every other Alliance hull's total-6 entry
# was positive; this was a one-way ladder unique to the courier's own rates.
#
# #952's `[power.battery_floor]` ladder does not rescue that on its own, and it
# is worth being exact about why, because the first draft of this note claimed
# it did. The ladder holds each group at its `[power_groups.*] min_level`, and
# on this hull those levels ARE the resting allocation — helm 2, weapons 2,
# shields 1, ops 1 — so a fully-floored courier sits on total 6, the same rung
# that was flat. The floors could not lift a ship off a rung they land it on.
# The fix is the rate: index 3 is now +1 (see `[power] rates` above), so the
# floored total recharges and the reserve climbs, on that floored draw, all the
# way through `battery_floor_release_margin` above helm's own rung — which
# releases helm and, with it, every rung below.
#
# This note used to end "DO NOT retune the rates to fix it", on the grounds that
# the freeze cost this non-demo hull nothing in practice. #952 makes that no
# longer true: the ladder settles a browned-out ship on its floored total by
# design, so a hull with a dead rung there is stuck at its minimums with a
# working reactor and no path back. The rung is now an invariant, not an
# accepted exception.
#
# What the ladder DOES buy here is the band between the two mechanisms:
# `[power.battery_floor] weapons = 25` against `min_reserve_weapons = 10` means
# the reactor takes the combat-stations point back fifteen points of charge
# before the policy would have, and holds it back until the reserve is a clear
# margin above 25 again.
[power.ai_policy.param]
thrust_threshold = 0.7
min_reserve_helm = 50.0
min_reserve_weapons = 10.0
min_reserve_baseline = 0.0

# helm: elevate to 3 under sustained thrust with a healthy battery, AT RED
# ALERT, else hold 2. The `red_alert` guard keeps ordinary transit (which also
# commands near-max thrust) off the elevated allocation — see the identical
# rule's comment in `fragments/ai/fleet_baseline.toml` for the brownout this
# fixes. Must stay byte-identical to that fragment's `helm` rule: this hull
# composes no fragment and owns its own copy (see the header above).
[[power.ai_policy.rule]]
priority = 10
channel = "helm"
when = "fact(red_alert) > 0 and fact(thrust) >= param(thrust_threshold) and fact(battery_pct) >= param(min_reserve_helm)"
verb = "set_power_group_allocation"
level = 3

[[power.ai_policy.rule]]
priority = 0
channel = "helm"
when = "fact(battery_pct) >= param(min_reserve_baseline)"
verb = "set_power_group_allocation"
level = 2

# weapons: elevate to 3 on red alert with a healthy battery, else hold 2.
[[power.ai_policy.rule]]
priority = 10
channel = "weapons"
when = "fact(red_alert) > 0 and fact(battery_pct) >= param(min_reserve_weapons)"
verb = "set_power_group_allocation"
level = 3

[[power.ai_policy.rule]]
priority = 0
channel = "weapons"
when = "fact(battery_pct) >= param(min_reserve_baseline)"
verb = "set_power_group_allocation"
level = 2

[power_groups.ops]
label = "entity.alliance_courier.power_groups.ops.label"
# Rests at 1 so the four authored groups sum to a sustainable total (<=6): the
# reactor recharges at idle and the AI/human spends up only on demand (#762).
default_level = 1
min_level = 1
max_level = 4

[power_groups.helm]
label = "entity.alliance_courier.power_groups.helm.label"
# `min_level = 2`, and since issue #952 that is a load-bearing number rather
# than a formality: it is where `[power.battery_floor] helm` puts this group when
# the reserve runs low. 2 is NOMINAL — the rung whose multiplier is 1.0 — so the
# floor takes back the combat-stations point and no more.
#
# On an AI-crewed hull it never gets the chance, and that is authored rather
# than accidental: `[power.battery_floor] helm` is 40 while this hull's
# `min_reserve_helm` is 50, so the policy has already given the point back by
# the time the floor is reached. The floor is here for a human Power officer,
# who has no reserve guard at all. It does NOT stop that officer commanding 1:
# the console clamps to [1, 4] and reads this field not at all, so the two spare
# points in the 8-point budget are still theirs to move.
default_level = 2
min_level = 2
max_level = 4

[power_groups.weapons]
label = "entity.alliance_courier.power_groups.weapons.label"
# `min_level = 2`, and since issue #952 that is a load-bearing number rather
# than a formality: it is where `[power.battery_floor] weapons` puts this group when
# the reserve runs low. 2 is NOMINAL — the rung whose multiplier is 1.0 — so a
# brownout takes back the combat-stations point the AI policy spends and no
# more. It does NOT stop a human Power officer commanding 1: the console clamps
# to [1, 4] and reads this field not at all, so the two spare points in the
# 8-point budget are still the officer's to move.
default_level = 2
min_level = 2
max_level = 4

[power_groups.shields]
label = "entity.alliance_courier.power_groups.shields.label"
# Rests at 1 (the seat the retired `sensors` group used to occupy) so the four
# authored groups still sum to a sustainable total. Level 1 is the ×1.0 rung on
# this hull's `[shields_console] power_multipliers`, so resting here costs the
# arcs nothing — spending UP is what buys regen, and it is a human Power
# officer's trade against helm or weapons. `min_level = 1` is also where
# `[power.battery_floor] shields` puts the group on a failing battery, and
# because the group RESTS there the brownout has nothing to take from it: the
# reactor never cuts a group that is already at or below its landing level.
# That is the point of putting shields on the lowest rung of the ladder — the
# last group to be reached, and on this hull's resting allocation the one the
# ladder cannot touch at all. It bites only on a shields level a human Power
# officer has bought, which is exactly the point at which losing it matters.
default_level = 1
min_level = 1
max_level = 4

# ── Stations ─────────────────────────────────────────────────────────────────

[[station]]
id = "captain"
name = "Captain"
description = "entity.alliance_courier.station.captain.description"
rank = "Cmdr."
short_code = "CPT"
console = "gui/courier/captain.html"
manual_overview = "The courier is a two-seat runabout and you are its commander. You fly the ship and run the bridge: set the viewscreen, call Red Alert, plot your course, and manage sensors and shields. On a small crew you wear several hats, so keep the picture in your head and lean on the ship's AI for anything you can't reach."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.alliance_courier.station.tactical.description"
rank = "Ltn."
short_code = "TAC"
console = "gui/courier/tactical.html"
manual_overview = "You run the courier's weapons. Lock a target on the tactical radar and fire the blaster bank as your arc comes to bear. The courier trades a heavy weapons suite for speed, so pick your shots, use the pilot's manoeuvres to keep your arc on target, and don't get drawn into a slugging match."

[[station.rating]]
name = "Std"
automated_systems = []

# ── Systems ──────────────────────────────────────────────────────────────────

[[system]]
id = "captain"
kind = "captain"
station = "captain"
power_group = "ops"

# The wire target of set_view is `viewscreen`, but authorisation resolves
# through source_system_for_view_mode to `captain` for both Camera and
# Cinematic. The Fore/Cinematic buttons need both systems present.
[[system]]
id = "viewscreen"
kind = "viewscreen"
station = "captain"
power_group = "ops"

[[system]]
id = "red-alert"
kind = "red_alert"
station = "captain"
power_group = "ops"

[[system]]
id = "sensors"
kind = "sensors"
station = "tactical"
power_group = "ops"

[[system]]
id = "sensor-radar"
kind = "sensor_radar"
station = "tactical"
power_group = "ops"

# Per-axis helm systems (issue #701; thrust/steering declared in #800,
# impulse/boost/lateral in #703/#704/#801 — no coarse `helm` system remains).
# This hull declares five axes: helm-thrust, helm-steering, helm-impulse,
# helm-boost and helm-lateral-thrust, all owned by Tactical. An unmanned
# Tactical station gets Backfill, which automates every owned System.
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-steering"
kind = "helm_steering"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-joystick"
kind = "helm_joystick"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-engine-port"
kind = "helm_engine"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-engine-starboard"
kind = "helm_engine"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
station = "tactical"
power_group = "helm"

# Boost drive commands (issue #801). Split out of the deleted coarse `helm`
# system so ToggleBoost/SetBoost admission gates on its own declared system,
# like every other helm axis. Listed in no rating's `automated_systems` —
# Backfill automates it with the rest of the station.
[[system]]
id = "helm-boost"
kind = "helm_boost"
station = "tactical"
power_group = "helm"

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
station = "tactical"
power_group = "helm"

# tactical_radar is one of the kinds ShipConfig::weapons_station() uses to
# resolve Tactical as the weapons owner.
[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"
power_group = "weapons"

[[system]]
id = "blaster-fore"
kind = "blaster_bank"
station = "tactical"
power_group = "weapons"

[[system]]
id = "navigation"
kind = "navigation"
station = "captain"
power_group = "ops"

[[system]]
id = "comms"
kind = "comms"
station = "captain"
power_group = "ops"

[[system]]
id = "shields-system"
kind = "shields"
station = "captain"
power_group = "shields"

[[system]]
id = "repair"
kind = "repair"
station = "captain"
power_group = "ops"

[[system]]
id = "power-reactor"
kind = "power_reactor"
station = "captain"
power_group = "ops"

[[system]]
id = "power-battery"
kind = "power_battery"
station = "captain"
power_group = "ops"

# ── Audio ────────────────────────────────────────────────────────────────────
# Every sound this ship makes. Playback is server-side only (the host page's
# JS builds the audio graph from this). Omit a sub-block to silence that
# sound; a sub-block that IS present must specify all of its fields.
# Red-alert siren/music are configured per-world, not here.
#
# No [audio.phaser_loop]: the courier has no phaser bank, so that sound would
# never play — same tuning as the crewed hulls otherwise.

[audio.ambient]
file   = "assets/sounds/Ambient.mp3"
volume = 0.25

[audio.engine]
# volume = idle_volume + thrust_fraction * volume_at_full_thrust
file                  = "assets/sounds/Engine.mp3"
volume_at_full_thrust = 0.15
idle_volume           = 0.0

[audio.blaster]
# Positional one-shot — every rolloff field maps to a Web Audio PannerNode.
file           = "assets/sounds/Blaster.mp3"
volume         = 0.9
ref_distance   = 30.0
max_distance   = 800.0
rolloff_factor = 1.2
distance_model = "inverse"
panning_model  = "equalpower"

[audio.forcefield]
# Continuous bed at base_volume; damage spikes it toward spike_volume, then it
# decays back. Damage below damage_threshold HP is ignored entirely.
file               = "assets/sounds/ForcefieldHit.mp3"
base_volume        = 0.06
spike_volume       = 0.80
damage_threshold   = 1.0
damage_full_spike  = 30.0
decay_rate_per_sec = 1.5
source             = "shield"

# ── AI target selectors (PRD #774 US7, issue #885b) ───────────────────────────
#
# The five per-system target selectors, AUTHORED rather than synthesised. Each
# answers "which entity is this system's target?" for whoever operates the
# station, and each reproduces exactly what the matching
# `default_*_target_selector_config()` in `src/entities/config.rs` used to
# invent at spawn. The reasoning behind every number lives on those functions
# and on the constant blocks above them; `default_ai_policy_pins` spawns every
# shipped hull and compares the two, so a transcription slip fails the build
# rather than quietly changing how this ship picks targets.
#
# All five attach on `[behaviour]` ALONE, not on the console section they name,
# so a hull owes all five whether or not it declares `[sensors_console]`,
# `[navigation_console]`, `[repair]` or `[comms_console]`.
#
# `horizon` is a static outer bound, NOT the live range gate — each host owns
# its own (Sensors' damage-scaled radar reach, Comms' authored `[comms].range`).
# Do not "helpfully" tighten it to look like a range.
#
# A score term's magnitude is its own `weight` field. A `param` entry exists
# only where a `when` guard names one: Repair's `deficit_band_*` and Comms'
# `score_band_*` are the whole set.

# Sensors — rank detectable hostiles by which SOURCE surfaced them:
# combat-lock >> objective >> radar. `switch_margin` is 0 because the gaps
# between the tiers ARE the anti-thrash mechanism.
[sensors_console.selector]
sources = ["combat-lock", "objective-destroy", "radar-contacts"]
horizon = 1e9
switch_margin = 0.0
eligibility = "candidate_fact(detectable) > 0 and candidate_fact(hostile) > 0"

[[sensors_console.selector.score]]
when = "candidate_fact(source_combat_lock) > 0"
weight = 1000.0

[[sensors_console.selector.score]]
when = "candidate_fact(source_objective) > 0"
weight = 100.0

[[sensors_console.selector.score]]
when = "candidate_fact(source_radar) > 0"
weight = 1.0

# Tactical — the ship's firing target. `combat-lock` is deliberately ABSENT from
# the sources: it is Tactical's own output, so unioning it would be circular.
# The current lock reaches the ranking as the host-pushed `source_retained`
# retention candidate, which is why that marker appears in the guards but in no
# source list.
#
# PRECEDENCE INVARIANT — terms are additive and one candidate can carry several
# markers at once, so the weights are sized to beat the maximum non-objective
# stack by more than `switch_margin`: 500 + 200 + 100 + 1 = 801 < 1000 - 50.
# A named Destroy objective therefore always wins AND survives hysteresis
# retention, while `retained` still exceeds `last_attacker` so an established
# engagement is not broken off by a fresh attacker. Retune against that
# inequality, not term by term.
[weapons_console.selector]
sources = ["sensors-designation", "objective-destroy", "last-attacker", "radar-contacts"]
horizon = 1e9
switch_margin = 50.0
# Independent revalidation: `detectable` is required of everything, and beyond
# that a candidate is engageable either because the host already vetted it
# (objective order / last attacker / retained lock) OR because it is
# independently hostile. That disjunction honours a mission naming a factionless
# target while refusing a FRIENDLY Sensors designation, which carries only
# `source_sensors_designation`.
eligibility = "candidate_fact(detectable) > 0 and (candidate_fact(source_objective) > 0 or candidate_fact(source_last_attacker) > 0 or candidate_fact(source_retained) > 0 or candidate_fact(hostile) > 0)"

[[weapons_console.selector.score]]
when = "candidate_fact(source_objective) > 0"
weight = 1000.0

[[weapons_console.selector.score]]
when = "candidate_fact(source_sensors_designation) > 0"
weight = 500.0

[[weapons_console.selector.score]]
when = "candidate_fact(source_retained) > 0"
weight = 200.0

[[weapons_console.selector.score]]
when = "candidate_fact(source_last_attacker) > 0"
weight = 100.0

[[weapons_console.selector.score]]
when = "candidate_fact(source_radar) > 0"
weight = 1.0

# Navigation — rank destinations into the shared Waypoint. Only the objective
# source marks its resolved destination `reachable`, so this policy drives the
# AI waypoint from objectives alone; `chart-contacts` is surfaced so an author
# can widen the eligibility, and by default only ENRICHES a coincident objective
# destination rather than independently steering the ship.
[navigation_console.selector]
sources = ["navigation-objectives", "chart-contacts"]
horizon = 1e9
switch_margin = 0.0
eligibility = "candidate_fact(reachable) > 0"

[[navigation_console.selector.score]]
when = "candidate_fact(source_nav_objective) > 0"
weight = 100.0

[[navigation_console.selector.score]]
when = "candidate_fact(source_chart_contact) > 0"
weight = 1.0

# Repair — rank this ship's damaged stations for the next free team. Two
# additive ladders whose tier rungs STRICTLY dominate the deficit rungs
# (3 x 100 = 300 < 1000), reproducing the retired `(tier desc, deficit desc)`
# comparator. `assigned < 1` is what makes N free teams pick N DISTINCT
# stations. `tier_ordinal` is the DamageTier discriminant (Operational 0,
# Damaged 1, Disabled 2, Destroyed 3) — a structural enum ordinal, which is why
# its bounds are literals rather than params; Destroyed is excluded because a
# repair team alone cannot lift the latch.
#
# Authored on every hull whether or not it crews repair teams: the teams gate
# dispatch, so a ship that gains them later already has its ranking.
[repair.selector]
sources = ["damaged-stations", "core-bucket"]
horizon = 1e9
switch_margin = 0.0
eligibility = "candidate_fact(source_repair_request) > 0 and candidate_fact(assigned) < 1 and candidate_fact(tier_ordinal) > 0 and candidate_fact(tier_ordinal) < 3"

# The bands sit INSIDE the urgent range and deliberately NOT at the DamageTier
# thresholds — because tier strictly dominates, the deficit ladder only ever
# discriminates within one tier, so bands at the tier boundaries would all fire
# together for every Disabled station and discriminate nothing.
[repair.selector.param]
deficit_band_low = 0.80
deficit_band_mid = 0.90
deficit_band_high = 0.95

[[repair.selector.score]]
when = "candidate_fact(tier_ordinal) >= 1"
weight = 1000.0

[[repair.selector.score]]
when = "candidate_fact(tier_ordinal) >= 2"
weight = 1000.0

[[repair.selector.score]]
when = "candidate_fact(tier_ordinal) >= 3"
weight = 1000.0

[[repair.selector.score]]
when = "candidate_fact(damage_fraction) >= param(deficit_band_low)"
weight = 100.0

[[repair.selector.score]]
when = "candidate_fact(damage_fraction) >= param(deficit_band_mid)"
weight = 100.0

[[repair.selector.score]]
when = "candidate_fact(damage_fraction) >= param(deficit_band_high)"
weight = 100.0

# Comms hail — rank who to hail. The most gated of the five, and the only one
# whose eligibility reads a `self_fact`: `comms_available`, so a Disabled or
# Destroyed Comms system stops the ship hailing at all. `source_hail_objective`
# keeps the baseline — only targets an active Hail directive actually names are
# ranked. `has_open_hail_thread < 1` is the anti-respam gate and it TERMINATES:
# a hail arms it even when it fires no `on_hailed` template, and it re-arms on a
# human `ClearComms` or on the target ceasing to be a live candidate, which is
# what an unmanned ship relies on. `switch_margin` is 0 and the host passes no
# current target: a hail is a ONE-SHOT event, so there is nothing to retain.
[comms_console.selector]
sources = ["hail-objectives", "comms-contacts"]
horizon = 1e9
switch_margin = 0.0
eligibility = "candidate_fact(source_hail_objective) > 0 and candidate_fact(in_range) > 0 and candidate_fact(objective_score) > 0 and candidate_fact(has_open_hail_thread) < 1 and self_fact(comms_available) > 0"

# The bands straddle the `base_priority` values the shipped content actually
# authors (20 / 30 / 35 / 40 / 45 / 50 / 80 / 100), splitting them four ways.
# Bands outside that range would fire for all or none and collapse the ranking
# onto the smallest-UUID tie-break.
[comms_console.selector.param]
score_band_low = 25.0
score_band_mid = 45.0
score_band_high = 75.0

[[comms_console.selector.score]]
when = "candidate_fact(objective_score) >= param(score_band_low)"
weight = 100.0

[[comms_console.selector.score]]
when = "candidate_fact(objective_score) >= param(score_band_mid)"
weight = 100.0

[[comms_console.selector.score]]
when = "candidate_fact(objective_score) >= param(score_band_high)"
weight = 100.0

# ── AI fine-system policies (PRD #774 US7, issue #885b) ───────────────────────
#
# The ship-level AI policies, AUTHORED rather than synthesised. Each answers
# "which verb does this fine system emit on which channel?" for whoever operates
# the station, and each reproduces exactly what the matching
# `default_*_ai_config()` in `src/entities/config.rs` used to invent at spawn.
# The reasoning behind every rule lives on those functions;
# `default_ai_policy_pins` spawns every shipped hull and compares the two, so a
# transcription slip fails the build rather than quietly changing how this ship
# behaves.
#
# Like the selectors above, these attach on `[behaviour]` ALONE, not on the
# console section they name — so a hull owes them whether or not it declares
# `[captain_console]`, `[shields_console]` or `[power]`. Authoring them is what
# brings those sections into existence on hulls that carried none.
#
# A rule's `when` is a guard, not a capability check: the host keeps every
# availability, cooldown, range and arc gate it had. `idle = true` (see Boost) is
# a first-class declaration meaning "this system deliberately takes no AI
# action" — it is NOT the same as an empty block, which validation rejects.

# Captain — raise Red Alert while the ship has been in combat within
# `combat_window_secs`, otherwise stand down. The window is a named parameter so
# a designer retunes the ship's nerve without recompiling.
[captain_console.ai]
param = { combat_window_secs = 10.0, alert_on_hostile_within = 150.0 }

[[captain_console.ai.rule]]
priority = 10
channel = "red_alert"
when = "fact(secs_since_combat) < param(combat_window_secs)"
verb = "set_red_alert"
value = true

# First contact (issue #912). `secs_since_combat` starts only on damage taken,
# hostile fire taken, or own weapon fired — and since #872 this hull's guns hold
# until Red Alert — so the rule above ALONE can only ever return fire: a fully
# backfilled Alliance hull could not open an engagement at all. This rule is the
# other half. A faction-hostile inside `alert_on_hostile_within` is enough to
# call the alert, and that range is a named parameter, so a designer authors a
# nervous hull or a patient one without recompiling.
#
# `hostile_range` reads 0.0 when there is NO contact — both readings are ALWAYS
# seeded, so a guard reads "clear" rather than "absent" — which is why this
# guard pairs it with `hostile_contact`. The presence clause is load-bearing,
# not decoration.
#
# A Harrow authors no rule like this. It is always armed
# (`min_alert_to_fire = 0`) and stands its alert down out of combat on purpose,
# so first contact is not its captain's decision to make.
[[captain_console.ai.rule]]
priority = 5
channel = "red_alert"
when = "fact(hostile_contact) > 0 and fact(hostile_range) < param(alert_on_hostile_within)"
verb = "set_red_alert"
value = true

[[captain_console.ai.rule]]
priority = 0
channel = "red_alert"
when = "true"
verb = "set_red_alert"
value = false

# Helm longitudinal — always actuate the planner's desired travel. The
# continuous magnitude comes from `DesiredMotion`, so no thrust number is pinned
# here; this rule is only the DECISION to actuate, which a designer can gate.
[helm_console.engines_ai]

[[helm_console.engines_ai.rule]]
priority = 0
channel = "longitudinal"
when = "true"
verb = "actuate_desired_travel"

# Helm yaw — the mirror of `engines_ai` on the facing axis: always actuate the
# planner's desired facing.
[helm_console.steering_ai]

[[helm_console.steering_ai.rule]]
priority = 0
channel = "yaw"
when = "true"
verb = "actuate_desired_facing"

# Helm lateral — always actuate. The dodge (and the docking translation) run off
# the shared hazard surface, so again only the decision is authored here.
[helm_console.lateral_ai]

[[helm_console.lateral_ai.rule]]
priority = 0
channel = "lateral"
when = "true"
verb = "actuate_lateral_thrust"

# Helm vertical — always actuate. `VerticalMovementMode` stays a host-side
# CAPABILITY gate rather than a policy scalar, so a Planar hull still takes no
# vertical component no matter what this rule says.
[helm_console.vertical_ai]

[[helm_console.vertical_ai.rule]]
priority = 0
channel = "vertical"
when = "true"
verb = "actuate_vertical_thrust"

# Helm impulse — always PERMIT the manoeuvre. The engage-vs-cancel decision is
# still made host-side from the doctrine's `use_impulse` fact and the
# `decide_impulse` geometry; this rule is the authored gate layered over it, and
# `ship_harrow_warhawk.toml` is the worked example of closing it.
[helm_console.impulse_ai]

[[helm_console.impulse_ai.rule]]
priority = 0
channel = "impulse"
when = "true"
verb = "engage_impulse"

# Helm boost — an explicit IDLE declaration, and the only one in the set. No AI
# on this hull engages the boost drive, so the honest declaration is "takes no
# AI boost action" rather than a rule that never fires. `idle = true` is a legal
# declaration distinct from silence; an empty block is rejected at load. A hull
# opts in by replacing this with a rule on the `boost` channel —
# `ship_harrow_destroyer.toml` is the worked example.
[helm_console.boost_ai]
idle = true

# Shields focus — two rules on one channel, both emitting the value-less
# `focus_shield_arc`. WHICH of the four arcs is focused is not in the policy: it
# comes from the retained ranking kernel, which reads the four params below
# directly out of `param`. `damage_window_secs`, `min_damage_window_secs` and
# `health_ratio_threshold` are therefore live tunables even though no `when`
# names them — do not delete them for looking unreferenced.
#
# The priority-10 damage rule and the priority-0 fallback emit the same verb and
# the fallback is unconditional, so today the channel resolves identically
# whatever `recent_damage_pct_max` reads. The rule is transcribed as-is because
# this migration changes no behaviour; the redundancy is recorded on #885.
[shields_console.ai_policy.param]
damage_window_secs = 4.0
min_damage_window_secs = 1.0
damage_pct_threshold = 50.0
health_ratio_threshold = 50.0

[[shields_console.ai_policy.rule]]
priority = 10
channel = "shield_focus"
when = "fact(recent_damage_pct_max) >= param(damage_pct_threshold)"
verb = "focus_shield_arc"

[[shields_console.ai_policy.rule]]
priority = 0
channel = "shield_focus"
when = "true"
verb = "focus_shield_arc"

# Comms dialogue response — answer an open hail with its FIRST response. Guarded
# twice, and both guards matter: an unguarded rule would re-emit a response the
# router refuses, every tick, for as long as the dialogue stays open.
#   * `comms_available` — a Disabled or Destroyed Comms system stops the ship
#     answering as well as hailing.
#   * `sender_in_range` — the router refuses a response whose sender has left
#     comms range, so without this the officer's rejection re-flashes forever.
# WHICH message is being answered comes from the host; only the response INDEX
# rides the verb. A ship that should answer nothing declares `idle = true`.
[comms_console.ai]

[[comms_console.ai.rule]]
priority = 0
channel = "comms_respond"
when = "fact(comms_available) > 0 and fact(sender_in_range) > 0"
verb = "respond_to_message"
response_index = 0

# ── AI sensing horizon ───────────────────────────────────────────────────────
#
# Authored, not defaulted. `AiProfile.sensor_range` is what `ai::lod::evaluate_lod`
# measures an NPC copy of this hull against: a ship further than
# `sensor_range * 1.2` from the player for `LOD_DWELL_SECS` loses
# `AiHighFidelity`, and with it every helm/captain/weapons decider it carries.
# `simulate_low_lod_ships` then dead-reckons it on its LAST heading and speed
# for ever — a hull demoted mid-manoeuvre at speed simply leaves the scenario
# and never comes back.
#
# Every Harrow hull has always authored this (`ship_harrow_destroyer.toml`
# 400, `ship_harrow_cruiser.toml` 350). No Alliance hull did, so an Alliance
# hull spawned as an NPC fell to the 100.0 Rust fallback in
# `entities::spawner` — INSIDE its own authored doctrine envelope, whose
# `commit_range`/`safe_range_margin` legs work out past 120 units. The value
# below is sized to the doctrine this hull flies, so the ship stays decided-for
# across its own manoeuvre.
[ai_profile]
aggression = 0.5
sensor_range = 200.0

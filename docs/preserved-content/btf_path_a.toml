# Path A ΓÇö The Diplomat
#
# Loaded when the crew commits to working with Administrator Chen (gateway in
# before_the_fire.toml). Contact: Administrator Chen. Reveals that Dr. Sol
# Varen is detained aboard Ironveil. This path gives political context for the
# weapon and unlocks the "Dr. Varen broadcasts her peace record" option in the
# Aphelion Protocol finale.
#
# On load: sets path_chosen + path_a_chosen flags, adds working_with_chen
# objective, and pushes lock-out comms to the Research Outpost.

[[trigger]]
condition = "on_load"
actions = [
    { set_flag = "path_chosen" },
    { set_flag = "path_a_chosen" },
    { add_objective = "working_with_chen" },
    { push_comms = "lockout_outpost_from_a" },
    { push_comms = "chen_sol_detail" },
]

[[objective]]
id = "working_with_chen"
text = "Continue working with Administrator Chen."
auto_add = false

[[comms]]
id = "chen_sol_detail"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Dr. Varen ΓÇö What We Know"
message = "Sol was heading to grid 18-Kappa when contact cut out. That's Ironveil's patrol zone. I think they're holding her aboard. I can't prove it."

# Ironveil-specific hail handler for Path A ΓÇö Sol-specific denial dialogue
[[trigger]]
condition = "on_hailed"
entity = "ironveil"
flag_is_set = "path_a_chosen"
actions = [
    { push_comms = "ironveil_denies_sol" },
    { force_ai_state = "ironveil", state = "pursuing", delay_secs = 10 },
]

[[comms]]
id = "ironveil_denies_sol"
from = "I.V. Ironveil"
subject = "Transmission"
message = "There is no Alliance personnel aboard this vessel. You are trespassing. Ten seconds to change your heading."

# ΓöÇΓöÇ OBJECTIVES ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[objective]]
id = "locate_sol"
text = "Locate missing Alliance negotiator Dr. Sol Varen."
auto_add = true

[[objective]]
id = "document_incursion"
text = "Transmit evidence of the Harrow incursion to Starcorp Command."

# ΓöÇΓöÇ COMMS DIALOGUE ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[comms]]
id = "chen_intro"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Situation Report"
message = "Our lead negotiator, Dr. Sol Varen, has not reported in for six hours. The Harrow patrol refused our docking request and is not responding."

[[comms.responses]]
text = "We'll scan for Dr. Varen. What was their last known position?"
follow_up = "chen_sol_location"

[[comms.responses]]
text = "What do the Harrow want? Have they made any demands?"
follow_up = "chen_harrow_demands"

[[comms]]
id = "chen_sol_location"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Re: Dr. Varen"
message = "Last contact was near grid 18-Kappa ΓÇö that's where Ironveil is holding. I think they have Sol aboard. We can't prove it, but I know it."

[[comms.responses]]
text = "We'll hail Ironveil and demand Dr. Varen's release."
follow_up = "chen_sol_demand_sent"

[[comms]]
id = "chen_sol_demand_sent"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Re: Dr. Varen"
message = "Thank you, Ardent. Whatever happens ΓÇö the talks needed someone who believed they could work."

[[comms]]
id = "chen_harrow_demands"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Re: Harrow Demands"
message = "No demands. That's what worries me. They're not here to negotiate. They're waiting for something."

[[comms.responses]]
text = "We'll find out what they're waiting for."
follow_up = "chen_waiting_ack"

[[comms]]
id = "chen_waiting_ack"
from = "Axiom Station ΓÇö Adm. Chen"
subject = "Re: Harrow Demands"
message = "Be careful, Ardent. The Imperium doesn't send warhawks to wait."

# ΓöÇΓöÇ TRIGGERS ΓÇö SOL FREED WHEN IRONVEIL IS DESTROYED ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

[[trigger]]
condition = "on_destroyed"
entity = "ironveil"
actions = [
    { complete_objective = "locate_sol" },
    { complete_objective = "document_incursion" },
    { push_comms = "sol_freed" },
]

[[comms]]
id = "sol_freed"
from = "Dr. Sol Varen"
subject = "Rescue Confirmed"
message = "This is Sol Varen ΓÇö I'm aboard an escape pod. They have a weapon on that second ship. I heard the order. They're going to fire on the station."

[[comms.responses]]
text = "Dr. Varen, get clear. We'll handle Ashrender."
follow_up = "sol_broadcast_offer"

[[comms]]
id = "sol_broadcast_offer"
from = "Dr. Sol Varen"
subject = "Re: Ashrender"
message = "I have thirty years of peace negotiations on this chip. If the worst happens ΓÇö I can get it out. Every relay in range. Just give me time."

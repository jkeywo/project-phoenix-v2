<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.command.doc_title">Project Phoenix — Command Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: var(--text-lg); margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; position: relative; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 14px; height: 100%; box-sizing: border-box; }
    /* One card per directable station (issue #1381) — `stations-list` is the
       scroll container; a card itself never scrolls independently. */
    .stations-list { display: flex; flex-direction: column; gap: 20px; overflow-y: auto; min-height: 0; flex: 1; }
    .command-card { display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; }
    .command-card + .command-card { padding-top: 16px; border-top: 1px solid var(--line-soft); }
    /* A crewed station's card is greyed as a whole; the CREWED cue inside it
       keeps its own full-contrast border/text so the reason stays legible. */
    .command-card.crewed { opacity: 0.6; }
    .directed { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0; }
    .directed .label { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); letter-spacing: 0.18em; color: var(--ink-faint); }
    .directed .name { font-size: var(--text-xl); letter-spacing: 0.12em; color: var(--ink); }
    /* The automation cues are persistent NON-COLOUR badges: a glyph plus text,
       readable without relying on any colour change (issue #1107, accessibility
       direction — non-colour states in the shared Hero Bar). */
    .cue { display: inline-flex; align-items: center; gap: 7px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); letter-spacing: 0.14em; padding: 3px 10px; border: 1px solid var(--line-soft); border-radius: 3px; color: var(--ink-faint); }
    .cue .glyph { font-size: var(--text-sm); }
    .stance-heading { font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); letter-spacing: 0.2em; color: var(--ink-faint); flex-shrink: 0; }
    .stance-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; flex-shrink: 0; margin-top: 4px; }
    .stance-head .spacer { flex: 1 1 0; }
    /* The stance-in-force value is unbounded authored copy (e.g. "Follow Alert
       (Standing By)") — unlike the static "Stance" label beside it, it must be
       allowed to shrink and wrap rather than inheriting `.stance-heading`'s
       `flex-shrink: 0`, or a long label pushes the card into horizontal
       overflow instead of onto a second line. */
    .stance-current { flex-shrink: 1; min-width: 0; text-align: right; }
    .stances { display: flex; flex-direction: column; gap: 8px; }
    .stance-btn { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; background: var(--surface-raised); border: 1px solid var(--line-soft); border-radius: 4px; color: var(--ink); font-size: var(--text-md); letter-spacing: 0.04em; cursor: pointer; }
    .stance-btn:disabled { cursor: not-allowed; opacity: 0.5; }
    .stance-btn .posture { font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); color: var(--ink-faint); width: 2.4em; flex-shrink: 0; }
    .stance-btn .name { flex: 1; min-width: 0; }
    /* Selected: a persistent glyph, not a colour — the mark survives greyscale. */
    .stance-btn[aria-pressed="true"] { border-color: var(--ink-faint); }
    .stance-btn .mark { font-family: "JetBrains Mono", monospace; width: 1.4em; flex-shrink: 0; color: var(--ink); }
    /* The synthesized Default row (issue #1381) sits apart from the authored
       standard stances above it with a dashed rule — its different
       provenance (client-resolved, not catalogue-authored) reads visually. */
    .stance-btn.default-row { border-top: 1px dashed var(--line-soft); margin-top: 4px; padding-top: 12px; }
    @media (orientation: portrait) {
      .panel-inner { padding: 10px 12px; gap: 10px; }
      .stations-list { gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Command Console" data-i18n-attr="data-screen-label:console.command.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <!-- No title row and no footer (issue #1374): the shell's Station Bar
           names this seat. One card per directable station (issue #1381) —
           the singular `command_target` every shipped hull authors today
           renders exactly one card, through the same loop a future hull
           authoring more than one would use unchanged. -->
      <div class="stations-list" id="stations-list"></div>
    </div>
  </div>
  <script type="module">
    import { initConsole } from './console-core.js';
    import { renderStation } from './stations/command-console.js';

    initConsole({ name: 'command', render: renderStation });
  </script>
</body>
</html>

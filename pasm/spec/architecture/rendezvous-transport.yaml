entities:
  - component: join-code-scheme
    core:
      status: implemented
      confidence: confirmed
      title: Typed Join-Code Scheme
      summary: >-
        Pure canonicalisation, composition and parsing of PROJECT_GUID_VERSION_GUID_CODE join
        identifiers, with distinct stable client and server project GUIDs, one compatible-release
        version GUID, five-letter suffixes and an authored deny-list. Normal entry supplies only the
        suffix from local project/version context; the full form is what a QR fragment or a paste
        carries.
      rationale:
        - The alphabet excludes every letter the confusable map folds away, so a minted code always survives the normalisation that makes it typeable.
        - Deny-list entries are authored in ordinary spelling and canonicalised before comparison, so one entry refuses every confusable spelling of the word.
        - Machine reasons map to strings.csv ids in the one module, so the phone and the host page cannot describe the same failure differently.
        - "[ai] That map covers the HOST's own StampMismatch codes too — an unmapped refusal renders as \"no ship is using that code\", which is a lie about a build the host authoritatively refused."
        - "[ai] The designer-facing source is assets/join/join-codes.toml (AGENTS.md rule 11: the deny-list and its per-entry rationale are exactly the tunable data that rule is about, and TOML gives them real comments). assets/join/join-codes.json is a COMMITTED generated artifact, because the three consumers read the table with no parser and no build step — the phone fetches it, vitest reads it from disk, esbuild bundles it into the Worker. scripts/build-client.mjs regenerates it and a vitest drift gate fails when the two disagree."
        - "[ai] The shape of a typed input is decided before canonicalisation, because `_` is both the part separator and an authored strip character: splitting first reported a player's spaced-out five letters as malformed."
    architecture:
      kind: identifier-scheme
      authority: non-authoritative
      runs_in: [host-browser-runtime, phone-browser-runtime, node-tooling-runtime]
    implementation:
      status: declared
      paths:
        - gui/join-code.js
        - assets/join/join-codes.toml
        - assets/join/join-codes.json
        - scripts/join-codes.mjs
      symbols: [canonicaliseSuffix, validateSuffix, parseJoinCode, mintSuffix]
      tests: [tests/client/join-code.test.js, tests/client/join-codes-data.test.js]

  - component: rendezvous-service
    core:
      status: implemented
      confidence: confirmed
      title: Phoenix Rendezvous Service
      summary: >-
        Secure-WebSocket rendezvous and signalling service owning typed join-code lookup, code
        issue and lifecycle, admission state, presence and the WebRTC signalling relay. A sibling
        Cloudflare Worker to the stateless TURN-credential worker, with the live registry in a
        Durable Object and the whole protocol in a transport-free state machine beside it.
      rationale:
        - One registry instance sees both typed namespaces and every active release at once, which is the only way unknown, wrong-type and version-mismatch stay three answers instead of one.
        - The Worker adapter decides nothing, so the contract tests drive the shipped protocol without wrangler, miniflare or a socket.
        - Issue #1111 issues codes in both namespaces but admits joins only to the client one; enabling server-code joining (#1114) adds an entry to joinableNamespaces rather than reshaping the lookup.
        - It replaces the public PeerJS broker for the crew star, per p2p-delta-transport-is-a-star-today; the crew protocol itself is untouched.
        - "[ai] That replacement DID happen, in issue #1112 — see crew-transport-peerjs-to-phoenix in architecture/sessions-replication.yaml. The two bullets above still read as #1111's forward statement of it; nothing about the namespace rule or the untouched crew protocol changed in the doing."
        - "[ai] Since that cutover it is a HARD dependency: there is no second route underneath it, so an undeployed or origin-blocked service means nobody can join at all rather than a degraded connection. docs/delivery-checklist.md §3a says so at the top; it is not deployed yet."
        - "[ai] All registry state is in memory in one Durable Object instance and nothing is written to storage: a code cannot outlive its host socket or a redeploy. That is #1111's whole scope — persistence is what #1115 (rotation) and #1120 (rebinding) would add — and the module doc says so rather than leaving it inferred."
        - "[ai] The service is unauthenticated and its codes are private over a 25^5 space, so the bounds are authored data in join-codes.toml's [limits]: a per-connection lookup cap that cuts the socket off, a record TTL swept lazily, a per-record peer cap, and length/shape validation on anything stored. Cross-socket rate limiting stays Cloudflare's edge to apply."
        - "[ai] Both upgrade endpoints REQUIRE a present, allow-listed Origin; only /v1/health keeps the no-Origin exemption, because the deploy verification recipe is a bare curl. Every legitimate browser upgrade is cross-origin here, so exempting requests without an Origin would exempt only the scripted caller the refusal exists to stop."
        - "[ai] The diagnostics snapshot carries no suffix. The suffix IS the private client code; a view that includes it is one route away from publishing every live session."
    architecture:
      kind: signalling-service
      authority: non-authoritative
      owns: [join-code-registry-state]
      receives: [rendezvous-signalling-frame]
      platforms:
        allowed: [browser]
        forbidden: [host-only]
    implementation:
      status: declared
      paths:
        - worker-rendezvous/src/registry.js
        - worker-rendezvous/src/index.js
        - worker-rendezvous/wrangler.toml
        - worker-rendezvous/wrangler.demo.toml
      symbols: [createRegistry, RendezvousRegistry]
      tests: [tests/client/rendezvous-registry.test.js, tests/client/rendezvous-worker.test.js]

  - state: join-code-registry-state
    core:
      status: implemented
      confidence: confirmed
      title: Join-Code Registry State
      summary: >-
        Live map from a typed (project, version, suffix) identifier to the host socket holding it,
        with its admission state and attached joiner presence. Transport-plane only: it never
        enters simulation state, a snapshot, or another ship host's state.
      rationale:
        - p2p-human-readable-join-namespaces forbids a join code being stored in authoritative simulation state or shared between hosts; keeping the registry outside every host process is what makes that structural rather than a rule to remember.
        - A host's code dies with its socket in #1111. Rotation, stale-record invalidation and rebinding a code to a replacement host are #1115 and #1120.
        - "[ai] The record's suffix leaves the registry in exactly one frame — the `hosted` code issued to the host that minted it. Not in the diagnostics view, not in a joiner's `joined`, and never over the crew channel."
    architecture:
      classification: transport
      owner: rendezvous-service
      writers: [rendezvous-service]
    implementation:
      status: declared
      paths: [worker-rendezvous/src/registry.js]
      symbols: [createRegistry]
      tests: [tests/client/rendezvous-registry.test.js]

  - message: rendezvous-signalling-frame
    core:
      status: implemented
      confidence: confirmed
      title: Rendezvous Signalling Frame
      summary: >-
        The versioned JSON vocabulary between a host or client page and the rendezvous service —
        host-open, host-admission, host-close, resolve, join, signal, leave inbound; hosted,
        resolved, joined, peer-joined, peer-left, signal, closed, error outbound. Every frame
        carries its protocol revision and a frame from another revision is refused rather than
        guessed at.
      rationale:
        - Deliberately NOT a ClientMessage/ServerMessage variant — p2p-delta-transport-is-a-star-today forbids layering transport concerns onto the crew protocol, which is unchanged by this work.
        - Failures are a stable machine reason, never prose, so the service ships no player-visible text and the phone resolves the wording through strings.csv.
        - "[ai] The revision literal is declared once, in gui/rendezvous-protocol.js, which both halves import. Every frame is hard-refused on a mismatch, so two copies held together by a comment would put a total join outage one careless edit away — and #1114/#1115 are both edits to this vocabulary."
        - "[ai] No frame carries a delivery stamp in either direction. The host's compatibility check is in-band on the DataChannel, and relayed copies (resolved.host_stamp, joined.host_stamp, peer-joined.stamp) were read by nobody — dead surface the next extension would have had to keep."
        - "[ai] The `resolve` verb stays as the lookup primitive even though the shipped phone goes straight to `join`: it is the side-effect-free question a launcher or a fleet flow asks, and it is role-gated exactly like `join`."
    architecture:
      authority: request
      producer: [rendezvous-transport-bridge]
      consumer: [rendezvous-service]
      validator: [rendezvous-service]
      trust_boundary: client-to-host
      payload: RendezvousFrame
    implementation:
      status: declared
      paths: [worker-rendezvous/src/registry.js, gui/rendezvous-transport.js]
      tests: [tests/client/rendezvous-registry.test.js, tests/client/rendezvous-transport.test.js]

  - component: rendezvous-transport-bridge
    core:
      status: implemented
      confidence: confirmed
      title: Rendezvous Transport Bridge
      summary: >-
        The browser halves of the Phoenix join path: a host that registers, is issued a code and
        answers offers into the existing Identify gate, and a client that resolves a typed code,
        offers, opens a direct reliable DataChannel and completes the compatibility handshake
        before speaking ordinary crew protocol. Additive in #1111 — the PeerJS bridge remains the
        default route until #1112.
      rationale:
        - "[ai] SUPERSEDES the summary above, which describes #1111's additive state. Issue #1112 delivered it: this is now the ONLY crew transport, there is no PeerJS bridge and no default to fall back to, the joiner opens a lossy channel alongside the reliable one, and it keeps an accepted link alive across drops on its own backoff. The open_questions below are answered by the same work, and `status` moved partially-implemented → implemented for the same reason — the one unmarked field changed rather than annotated, because a partial claim over a shipped-and-only transport is what pasm scan's declared-versus-observed check exists to catch."
        - The host adapter presents the channel with PeerJS's DataConnection shape, so server.html's reserved-token refusal, duplicate-token dance and disconnect guard are reused rather than reimplemented.
        - "[ai] With PeerJS gone the shape is no longer borrowed — the host hands the page one connection object carrying BOTH channels — but the reuse the bullet above is about held: those three server.html code paths were not rewritten."
        - "[ai] An open DataChannel is not admission: the connection reaches the page only after the compatibility verdict is ok. Frames before that are dropped rather than buffered, everything after a refusal is dropped, and the 250ms before the channel closes is a send-flush for the refusal — otherwise a build the host had just refused could still dispatch into the simulation."
        - "[ai] BOTH channels are created by the JOINER, before the offer, so the answering host picks them up by label off one negotiation. The lossy one is opened whether or not anything ends up riding it: negotiating it lazily would run the first minute of every session's snapshots down the reliable channel for no reason."
        - "[ai] Nothing assumes the lossy channel exists. gui/host-peer-routing.js falls back to the reliable channel PER TOKEN, so one phone whose snapshot channel never came up cannot drag the whole bridge onto the reliable path; the joiner's own send applies the same rule upward."
        - "[ai] Reconnect re-resolves the SAME code and re-sends Identify with the SAME session token, so a dropped radio never puts five letters back in front of the guest. Only an answer a retry cannot change ends the loop — one about the code (unknown, wrong-type, version-mismatch, admission-closed, host-gone) or about the build (the host's StampMismatch codes); an unreachable service, a signalling drop or an ICE timeout is retried."
        - "[ai] 'connecting' is not re-reported on each reconnect attempt. Once the host has accepted the build the page is in its reconnect loop, and reporting 'connecting' per attempt flashed the status dot green and hid the retry control several times a second."
        - "[ai] The page holds a STABLE façade over whichever joiner is current (window.phoenixLink), because the joiner behind it is replaced on every reconnect — anything holding the joiner itself would be driving a dead connection immediately after the event it exists to survive."
        - "[ai] A failed attempt tears its own transport down before the next one, and a terminal frame closes the joiner, so an abandoned attempt cannot keep a socket, a registry connection and a peer connection alive and still fire into the page's callbacks."
        - "[ai] A host that loses its record re-registers on a backoff and is issued a FRESH code, and the join panel blanks until it arrives. There is no PeerJS route underneath any more, so a host that merely reported the loss would be unjoinable until someone reloaded the viewscreen; keeping the SAME code across a host drop needs persistence in the service and is #1115's."
        - "[ai] SIGNALLING and MEDIA are independent planes, and this is the invariant the rest of the transport's failure handling hangs off. Losing the rendezvous socket, or being told the RECORD has gone, says nothing about an RTCPeerConnection already carrying the game — the phones cannot even observe it. So the host's lostService() discards only the socket, the code and the peers still mid-signalling, and the joiner logs and ignores closed/error frames while its channel is up. Both halves originally tore live sessions down on a Durable Object eviction or a lazy TTL sweep, which read from the bridge as everybody being disconnected mid-mission for no reason."
        - "[ai] A retryable failure is retried BEFORE the host has accepted the build too, not only after. Retrying only once established meant a first join got exactly one 8s attempt, so connectTimeoutMs's 8/16/30s ladder — added for TURN-over-TCP allocation on cellular, which is a FIRST-join problem — was unreachable by anyone who had not already got in. Bounded at JOIN_ATTEMPTS_BEFORE_ENTRY (4) before acceptance, because a guest who has never got in may be reading the wrong five letters; unbounded after, because the code is then known good."
        - "[ai] 'disconnected' is reported only alongside a scheduled retry. It renders as \"Disconnected — reconnecting…\" with a retry control under it, so reporting it on the give-up path (which it was, for any link that had ever been accepted) left the page claiming a loop that had stopped."
        - "[ai] close() severs BOTH channels and the RTCPeerConnection, and marks the peer refused. It is server.html's only eviction mechanism — the reserved-token refusal and the duplicate-token dance — and closing the reliable channel alone left the lossy one open with its own inbound handler still wired to deliver(), so an evicted device could keep dispatching into the simulation down the other pipe."
        - "[ai] Every send is wrapped, on the host adapter, in routeOutbound and in the joiner. This is a raw RTCDataChannel with no chunking under it (PeerJS provided one), so a payload over the SDP-negotiated max-message-size throws — and routeOutbound runs inside the callback Rust's outbound flush invokes, where one throw aborted delivery to every remaining crew member. Nothing shipped approaches 262144 bytes; the wrapping is about one dead link not taking the bridge with it."
        - "[ai] There is no route flag left. `?rendezvous=<url>` survives as a SERVICE override, and only for a LOOPBACK origin — a local wrangler dev. Under #1111 it was also the route opt-in, so honouring an arbitrary origin only affected somebody deliberately turning the route on; since #1112 it applies on every ordinary client load, and `client/index.html?rendezvous=https://attacker.example#<code>` handed to a guest would route their SDP, ICE candidates, session token and display name through a third party with nothing on screen saying so. The #1111 opt-in spellings are ignored rather than honoured, so an old bookmark opens the game instead of dialling a host called \"on\". A fragment that is not a valid code is not a third route either — it goes through the same parse and gets a stated reason in front of the entry field."
        - Inbound frames go through localiseTree exactly as the PeerJS path does; every console downstream assumes string ids are already resolved.
        - "[ai] With the PeerJS path gone, that boundary is simply the one place: gui/rendezvous-transport.js's deliver(). The rule the bullet above states is unchanged; only the comparison it drew has expired."
        - WebSocket and RTCPeerConnection come from an injectable factory pair, which is what lets the browser smoke suite drive the whole path with no real WebRTC and what a native in-process station pane will supply later.
      open_questions:
        - The lossy unordered snapshot channel, reconnect/backoff and PeerJS retirement are #1112; #1111 opens only the reliable channel.
    architecture:
      kind: transport-adapter
      authority: non-authoritative
      sends: [rendezvous-signalling-frame, session-identify-command]
      runs_in: [host-browser-runtime, phone-browser-runtime]
      platforms:
        allowed: [browser]
        forbidden: [host-only]
    implementation:
      status: declared
      paths:
        - gui/rendezvous-transport.js
        - gui/rendezvous-protocol.js
        - gui/host-peer-routing.js
        - gui/connection-manager.js
        - server.html
        - client.html
      symbols: [createRendezvousHost, createRendezvousJoiner, joinRouteFromLocation, outboundTargets]
      tests:
        - tests/client/rendezvous-transport.test.js
        - tests/client/host-peer-routing.test.js
        - tests/smoke/rendezvous-join.spec.js
        - tests/smoke/multi-client-crew.spec.js
        - tests/smoke/snapshot-channel.spec.js
        - tests/smoke/reconnect-midgame-sever.spec.js
        - tests/smoke/transport-shim.spec.js

  - component: join-compatibility-gate
    core:
      status: implemented
      confidence: confirmed
      title: Host Join Compatibility Gate
      summary: >-
        The host's authoritative protocol/content check on a joining client, run over the direct
        DataChannel before Identify. Reuses the delivery version pin — the same DeliveryStamp and
        check_client_stamp a native host enforces at /host/manifest.json — so a Phoenix host has
        one version authority rather than two.
      rationale:
        - The rendezvous service's version GUID is coarse discovery advice; p2p-human-readable-join-namespaces forbids it replacing the host handshake, so the verdict is computed in Rust and only relayed by JavaScript.
        - An absent stamp is admitted, because the PeerJS route has never stamped anything and #1111 is additive; a garbled stamp is refused, because a broken stamp is not evidence of compatibility.
        - "[ai] SUPERSEDES the bullet above: a stamp is REQUIRED since #1112, and absent and garbled are now both refused as client-stamp-missing. #1111 admitted an absent one because PeerJS was still the default route and had never stamped anything, so refusing the unstamped would have locked out the shipped join path. With PeerJS retired, every client that can reach a host is a built Phoenix bundle carrying the field, so admitting the silent case would leave the only version-skew hole exactly where a stale cached bundle sits."
        - A host that has not yet loaded a manifest binds the protocol half only — a browser host in the lobby has no content identity to compare, and refusing every phone until it does would be a race rather than a safety property.
        - "[ai] The host page still admits when it cannot reach wasm_check_client_stamp at all. A host that cannot ask cannot refuse, and locking out every phone because an export was unreachable is a worse failure than admitting one build the check would have caught."
    architecture:
      kind: version-gate
      authority: authoritative
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths:
        - src/delivery/mod.rs
        - src/delivery/stamp.rs
        - src/server/bridge.rs
        - src/core/codec.rs
        - scripts/client-stamp.mjs
      symbols: [check_join_stamp, parse_stamp_field, wasm_check_client_stamp, encode_join_verdict]
      tests: [cargo test, tests/client/client-stamp.test.js]

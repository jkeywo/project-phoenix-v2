# "Before the Fire" — Axiom System, T−35
#
# Main scenario file. Loaded at map start; never unloaded.
# Owns all spawned entities. Branches load sub-scenarios via load_scenario.
#
# Schema additions used here (new per improved design spec):
#   - trigger condition: flag_is_set = "name" / flag_not_set = "name"
#   - trigger action: { set_flag = "name" } / { clear_flag = "name" }
#   - trigger action: { force_ai_state = "entity", state = "state" }
#   - trigger action: { force_ai_state, delay_secs = N } for delayed state change
#   - trigger condition: on_attacked_by, entity = "name" (player attacked by entity)
#   - comms.responses may carry an actions array (fires on player selection)
#
# Paths A/B/C are mutually exclusive. The first commitment locks the crew in.
# Mechanism: on_hailed pushes a gateway comms with a soft and a commitment
# response. The commitment response carries actions = [load_scenario]. The
# loaded path file sets the path flags and pushes lock-out comms to the other
# factions so the crew feels the world close around their choice.
#
# Flags owned by this file:
#   path_chosen         set by any path file on_load
#   path_a_chosen       set by btf_path_a on_load
#   path_b_chosen       set by btf_path_b on_load
#   path_c_chosen       set by btf_path_c on_load
#   aphelion_triggered  set here when weapon arming begins
#
# Requires: PRD #119 (Scenario Engine, Station entities, Comms console)
#           PRD #142 (AI and Behaviour — already landed)
#           Draft 10 (Region entities — already landed)

preload = [
    "assets/entities/station_axiom.toml",
    "assets/entities/station_research_outpost.toml",
    "assets/entities/ship_harrow_patrol.toml",
    "assets/entities/ship_harrow_warhawk.toml",
    "assets/entities/ship_requiem_courier.toml",
    "assets/entities/region_kaleth_nebula.toml",
    "assets/entities/region_asteroid_belt.toml",
]

# ── SPAWNS ────────────────────────────────────────────────────────────────────

[[spawn]]
entity = "assets/entities/station_axiom.toml"
position = [350.0, 0.0, 50.0]
name = "axiom_station"

[[spawn]]
entity = "assets/entities/station_research_outpost.toml"
position = [-100.0, 0.0, 450.0]
name = "research_outpost"

[[spawn]]
entity = "assets/entities/ship_harrow_patrol.toml"
position = [180.0, 0.0, -160.0]
name = "ironveil"

[[spawn]]
entity = "assets/entities/ship_harrow_warhawk.toml"
position = [620.0, 0.0, -380.0]
name = "ashrender"

[[spawn]]
entity = "assets/entities/ship_requiem_courier.toml"
position = [-230.0, 0.0, -80.0]
name = "requiem_courier"

[[spawn]]
entity = "assets/entities/region_kaleth_nebula.toml"
position = [680.0, 0.0, -440.0]
name = "kaleth_nebula"

[[spawn]]
entity = "assets/entities/region_asteroid_belt.toml"
position = [-60.0, 0.0, 200.0]
name = "asteroid_belt_zone"

# ── OBJECTIVES ────────────────────────────────────────────────────────────────

[[objective]]
id = "reach_the_system"
text = "Investigate the situation in the Axiom system."
auto_add = true

[[objective]]
id = "make_contact"
text = "Establish contact with a force in the system."
auto_add = true

[[objective]]
id = "identify_the_threat"
text = "Identify the source of the hostile activity."

# ── OPENING COMMS ─────────────────────────────────────────────────────────────

[[comms]]
id = "starcorp_orders"
from = "Starcorp Command"
subject = "Deployment Orders — Axiom System"
message = "Ardent, proceed to Axiom. Harrow ships are ignoring docking protocols. The Accord talks are at risk. Find out what's happening."
trigger = "on_load"

[[comms]]
id = "axiom_hail"
from = "Axiom Station"
subject = "Please respond"
message = "A.E.V. Ardent — are you receiving? A Harrow vessel is holding station without clearance. We need you here."
trigger = "on_load"

[[comms.responses]]
text = "Acknowledged. En route to your position."
follow_up = "axiom_hail_ack"

[[comms.responses]]
text = "Hold position. Do not provoke them."
follow_up = "axiom_hail_hold"

[[comms]]
id = "axiom_hail_ack"
from = "Axiom Station"
subject = "Re: Please respond"
message = "Understood. Administrator Chen will meet you on approach. Thank you, Ardent."

[[comms]]
id = "axiom_hail_hold"
from = "Axiom Station"
subject = "Re: Please respond"
message = "Confirmed. We'll maintain protocols. Please hurry — the talks cannot be delayed."

# ── TRIGGERS — PATH A GATEWAY (Axiom Station / Diplomat) ─────────────────────

[[trigger]]
condition = "on_hailed"
entity = "axiom_station"
flag_not_set = "path_chosen"
actions = [
    { complete_objective = "make_contact" },
    { push_comms = "gateway_axiom" },
]

[[trigger]]
condition = "on_hailed"
entity = "axiom_station"
flag_is_set = "path_b_chosen"
actions = [{ push_comms = "lockout_axiom_from_b" }]

[[trigger]]
condition = "on_hailed"
entity = "axiom_station"
flag_is_set = "path_c_chosen"
actions = [{ push_comms = "lockout_axiom_from_c" }]

[[comms]]
id = "gateway_axiom"
from = "Axiom Station — Adm. Chen"
subject = "Situation Report"
message = "Ardent — our lead negotiator, Dr. Sol Varen, hasn't reported in. That Harrow vessel is refusing contact. We need you here."

[[comms.responses]]
text = "Understood. We'll work with you to find Dr. Varen."
actions = [
    { load_scenario = "assets/scenarios/btf_path_a.toml" },
]

[[comms.responses]]
text = "Stand by. We need to assess the full situation first."

[[comms]]
id = "lockout_axiom_from_b"
from = "Axiom Station — Adm. Chen"
subject = "Unable to Assist"
message = "We've been asked to route all contacts through the Research Outpost during the resonance analysis. Dr. Myst has the lead on this."

[[comms]]
id = "lockout_axiom_from_c"
from = "Axiom Station — Adm. Chen"
subject = "Emergency Protocols Active"
message = "All non-essential comms suspended system-wide. Red alert protocols are in effect."

# ── TRIGGERS — PATH B GATEWAY (Research Outpost / Scholar) ───────────────────

[[trigger]]
condition = "on_hailed"
entity = "research_outpost"
flag_not_set = "path_chosen"
actions = [
    { complete_objective = "make_contact" },
    { push_comms = "gateway_outpost" },
]

[[trigger]]
condition = "on_hailed"
entity = "research_outpost"
flag_is_set = "path_a_chosen"
actions = [{ push_comms = "lockout_outpost_from_a" }]

[[trigger]]
condition = "on_hailed"
entity = "research_outpost"
flag_is_set = "path_c_chosen"
actions = [{ push_comms = "lockout_outpost_from_c" }]

[[comms]]
id = "gateway_outpost"
from = "Research Outpost — Dr. Myst"
subject = "Anomalous Readings"
message = "Ardent — I'm tracking an energy signature from the Kaleth Nebula. It matches nothing in the database and it's building. I need your Science console on this."

[[comms.responses]]
text = "We're with you, Doctor. Send us what you have."
actions = [
    { load_scenario = "assets/scenarios/btf_path_b.toml" },
]

[[comms.responses]]
text = "Stand by. We're still assessing the situation."

[[comms]]
id = "lockout_outpost_from_a"
from = "Research Outpost — Dr. Myst"
subject = "Unable to Assist"
message = "Administrator Chen has requested Alliance contacts go through the Station during the talks. I'm sorry, Ardent — her authority here."

[[comms]]
id = "lockout_outpost_from_c"
from = "Research Outpost — Dr. Myst"
subject = "Emergency Protocols Active"
message = "I'm evacuating non-essential personnel. I can't assist right now — good luck out there."

# ── TRIGGERS — PATH C GATEWAY (Combat / Soldier) ──────────────────────────────

[[trigger]]
condition = "on_attacked"
entity = "ironveil"
flag_not_set = "path_chosen"
actions = [
    { complete_objective = "make_contact" },
    { push_comms = "harrow_hostile" },
    { load_scenario = "assets/scenarios/btf_path_c.toml" },
]

[[trigger]]
condition = "on_attacked_by"
entity = "ironveil"
flag_not_set = "path_chosen"
actions = [
    { complete_objective = "make_contact" },
    { push_comms = "harrow_hostile" },
    { load_scenario = "assets/scenarios/btf_path_c.toml" },
]

[[comms]]
id = "harrow_hostile"
from = "I.V. Ironveil"
subject = "Incoming Transmission"
message = "Alliance vessel — you are in restricted Imperium space. Withdraw or be destroyed."

# ── TRIGGERS — IRONVEIL ENCOUNTER ─────────────────────────────────────────────
#
# Ironveil breaks patience and forces pursuit at 90 s if the crew hasn't
# committed to a path. After this the crew is de-facto in combat (Path C
# loads on first hit from either side via the on_attacked triggers above).
#
# If the crew hails Ironveil before the timer (or while on Path A to demand
# Sol's release), Ironveil gives a terse refusal then attacks after 10 s.
# Path A has its own Ironveil hail handler in btf_path_a.toml with
# Sol-specific dialogue; this handler fires for all other states.

[[trigger]]
condition = "on_timer"
duration_secs = 90
flag_not_set = "path_c_chosen"
flag_not_set = "aphelion_triggered"
actions = [
    { push_comms = "ironveil_breaks_patience" },
    { force_ai_state = "ironveil", state = "pursuing" },
]

[[comms]]
id = "ironveil_breaks_patience"
from = "I.V. Ironveil"
subject = "Transmission"
message = "Alliance vessel — your time is up. Withdraw immediately or face the consequences."

[[trigger]]
condition = "on_hailed"
entity = "ironveil"
flag_not_set = "path_c_chosen"
flag_not_set = "path_a_chosen"
actions = [
    { push_comms = "ironveil_hail_response" },
    { force_ai_state = "ironveil", state = "pursuing", delay_secs = 10 },
]

[[comms]]
id = "ironveil_hail_response"
from = "I.V. Ironveil"
subject = "Transmission"
message = "This channel is closed, Alliance. You have ten seconds to change your heading."

# ── TRIGGERS — WEAPON ARMING ─────────────────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity = "ironveil"
actions = [
    { complete_objective = "identify_the_threat" },
    { push_comms = "harrow_escalates" },
    { set_flag = "aphelion_triggered" },
    { load_scenario = "assets/scenarios/btf_aphelion_protocol.toml" },
]

[[comms]]
id = "harrow_escalates"
from = "I.V. Ashrender"
subject = "Incoming Transmission"
message = "Ironveil is gone. Activating contingency. The Accord dies here."

[[trigger]]
condition = "on_timer"
duration_secs = 600
flag_not_set = "aphelion_triggered"
actions = [
    { push_comms = "harrow_timer" },
    { set_flag = "aphelion_triggered" },
    { load_scenario = "assets/scenarios/btf_aphelion_protocol.toml" },
]

[[comms]]
id = "harrow_timer"
from = "I.V. Ashrender"
subject = "Incoming Transmission"
message = "The window for negotiation is closed. Initiating the Protocol."

# ── TRIGGERS — REGION ENTRY ───────────────────────────────────────────────────

[[trigger]]
condition = "on_entered_region"
entity = "kaleth_nebula"
actions = [
    { push_comms = "nebula_warning" },
]

[[comms]]
id = "nebula_warning"
from = "Science"
subject = "Nebula Alert"
message = "Entering the Kaleth Nebula. Radar range reduced. Hull taking environmental damage."

[[trigger]]
condition = "on_entered_region"
entity = "asteroid_belt_zone"
flag_not_set = "aphelion_triggered"
actions = [
    { load_scenario = "assets/scenarios/btf_sidequest_rescue.toml" },
]

# ── TRIGGERS — REQUIEM COURIER ────────────────────────────────────────────────

[[trigger]]
condition = "on_hailed"
entity = "requiem_courier"
flag_not_set = "aphelion_triggered"
actions = [
    { load_scenario = "assets/scenarios/btf_sidequest_courier.toml" },
]

# ── TRIGGERS — AXIOM STATION DESTROYED ───────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity = "axiom_station"
actions = [
    { push_comms = "axiom_lost" },
]

[[comms]]
id = "axiom_lost"
from = "Starcorp Command"
subject = "Loss of Contact"
message = "We've lost contact with Axiom Station. Whatever you did, Ardent — we saw it."

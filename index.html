<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Phoenix — View Screen</title>

  <!-- CDN deps loaded before our script so they're in scope synchronously -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; }
    #overlay { position: absolute; bottom: 1rem; right: 1rem; z-index: 10; }
    #qr { display: none; }
    #top-bar {
      position: fixed; top: 0.75rem; right: 0.75rem; z-index: 20;
      display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; font-family: monospace;
    }
    #top-bar-row { display: flex; align-items: center; gap: 0.5rem; }
    #conn-label { font-size: 0.75rem; color: #f44; }
    #conn-dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #4c4; flex-shrink: 0; }
    #fullscreen-btn {
      background: none; border: none; color: #cce; font-size: 1.1rem;
      cursor: pointer; padding: 0; line-height: 1;
    }
    #wasm-spinner {
      position: fixed; inset: 0; z-index: 100;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #aae; font-family: monospace; font-size: 0.9rem;
      gap: 1rem;
    }
    .spinner-ring {
      width: 48px; height: 48px;
      border: 4px solid #223;
      border-top-color: #aae;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
<link rel="modulepreload" href="./project-phoenix-e5b9075756d3dd3b.js" crossorigin="anonymous" integrity="sha384-JEjPl+evb8AHl3S2oh7WCk2YmALK4JUjP3vdB48rUlwGohAGeLJZN351XZZr0W0w"><link rel="preload" href="./project-phoenix-e5b9075756d3dd3b_bg.wasm" crossorigin="anonymous" integrity="sha384-yW1TASyoAdpe8VPeiiG7PuOYWi6yeomkAR1WLjGMH+6JQO9KqoEMMhb1TSMTmtmR" as="fetch" type="application/wasm"></head>
<body>
  <!-- Loading spinner shown until WASM is ready -->
  <div id="wasm-spinner">
    <div class="spinner-ring"></div>
    <span>Loading…</span>
  </div>

  <!-- Bevy renders into the canvas that DefaultPlugins creates at startup -->
  <canvas id="canvas"></canvas>

  <!-- QR code shown over the canvas during lobby phase -->
  <div id="overlay">
    <a id="qr-link" target="_blank" style="cursor:pointer">
      <canvas id="qr"></canvas>
    </a>
  </div>

  <div id="top-bar">
    <div id="top-bar-row">
      <span id="conn-label"></span>
      <span id="conn-dot"></span>
      <button id="fullscreen-btn" title="Toggle fullscreen">⛶</button>
    </div>
  </div>

  <!-- Trunk replaces this with the compiled WASM bundle. It fires
       TrunkApplicationStarted and sets window.wasmBindings when ready. -->
  
<script type="module">
import init, * as bindings from './project-phoenix-e5b9075756d3dd3b.js';
const wasm = await init({ module_or_path: './project-phoenix-e5b9075756d3dd3b_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
  
  
  
  

  <script>
    // ── Connection status ──────────────────────────────────────────────────

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = 'Disconnected — reconnecting…';
      } else if (state === 'error') {
        dot.style.background = '#f44';
        label.textContent = 'Error — refresh to retry';
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
      }
    }

    // ── Fullscreen controller ──────────────────────────────────────────────

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    setConnectionStatus('connecting');

    // ── PeerJS host peer ───────────────────────────────────────────────────

    // peer connection id → session token (resolved once Identify arrives)
    const peerTokens = new Map();
    // session token → DataConnection (for routing server→client messages)
    const tokenConns = new Map();
    // messages queued before WASM is ready
    const msgQueue = [];

    const hostPeerId = Array.from(crypto.getRandomValues(new Uint8Array(16)))
      .map(b => b.toString(16).padStart(2, '0')).join('');
    const joinUrl = location.href.replace(/[^/]*$/, '') + 'client/#' + hostPeerId;

    const peer = new Peer(hostPeerId, { config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80',  username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject', transport: 'tcp' },
    ] } });

    peer.on('open', () => {
      setConnectionStatus('ready');
      const canvas = document.getElementById('qr');
      canvas.style.display = 'block';
      QRCode.toCanvas(canvas, joinUrl, { width: 200 });
      document.getElementById('qr-link').href = joinUrl;
    });

    peer.on('disconnected', () => {
      setConnectionStatus('disconnected');
      peer.reconnect();
    });

    peer.on('connection', (conn) => {
      conn.on('data', (raw) => {
        const json = typeof raw === 'string' ? raw : JSON.stringify(raw);
        let token = peerTokens.get(conn.peer);

        // First message from this peer must be Identify — extract the token
        if (!token) {
          try {
            const msg = JSON.parse(json);
            if (msg.type === 'Identify') {
              token = msg.data.token;
              peerTokens.set(conn.peer, token);
              tokenConns.set(token, conn);
            }
          } catch (_) { return; }
        }

        if (token) dispatchToWasm(token, json);
      });

      conn.on('close', () => {
        const token = peerTokens.get(conn.peer);
        if (!token) return;
        wasmBindings.wasm_player_disconnected(token);
        peerTokens.delete(conn.peer);
        tokenConns.delete(token);
      });

      conn.on('error', (err) => console.error('[PeerJS conn]', err));
    });

    peer.on('error', (err) => { console.error('[PeerJS host]', err); setConnectionStatus('error'); });

    // ── WASM dispatch ─────────────────────────────────────────────────────

    function dispatchToWasm(token, json) {
      if (typeof wasm_receive_message === 'function') {
        wasm_receive_message(token, json);
      } else {
        msgQueue.push([token, json]);
      }
    }

    // ── Outbound routing ───────────────────────────────────────────────────

    function routeOutbound(target, payload) {
      try {
        const parsed = JSON.parse(payload);
        if (parsed.type === 'GameStarted')
          document.getElementById('overlay').style.display = 'none';
      } catch (_) {}

      if (target === 'all') {
        for (const conn of tokenConns.values()) conn.send(payload);
      } else if (target.startsWith('token:')) {
        tokenConns.get(target.slice(6))?.send(payload);
      } else if (target.startsWith('except:')) {
        const exc = target.slice(7);
        for (const [t, conn] of tokenConns.entries()) {
          if (t !== exc) conn.send(payload);
        }
      }
    }

// ── Config Preload ──────────────────────────────────────────────────────

// Track which entity paths have been requested to prevent duplicate fetches
const fetchedPaths = new Set();

// Preload sequence: fetch map -> load map -> fetch entities -> load entities -> init
async function preloadAndStart() {
  const spinner = document.getElementById('wasm-spinner');
  
  try {
    // Step 1: Set up the config request callback
    window.set_config_request_callback = wasmBindings.set_config_request_callback;
    set_config_request_callback(handleConfigRequest);
    
    // Step 2: Fetch and load the default map
    const mapResponse = await fetch('assets/maps/default.toml');
    if (!mapResponse.ok) {
      console.error('Failed to fetch default map:', mapResponse.status);
      throw new Error('Map fetch failed');
    }
    const mapToml = await mapResponse.text();
    
    // Step 3: Load the map - this will trigger callbacks for entity paths
    window.wasm_load_map = wasmBindings.wasm_load_map;
    window.wasm_load_config = wasmBindings.wasm_load_config;
    window.wasm_is_preload_complete = wasmBindings.wasm_is_preload_complete;
    
    wasm_load_map(mapToml);
    
  } catch (e) {
    console.error('Preload failed:', e);
    if (spinner) spinner.style.display = 'none';
    // Show error to user — use wasm-spinner element so we don't destroy #qr-link
    const errDiv = document.getElementById('wasm-spinner');
    if (errDiv) {
      errDiv.innerHTML = '<div style="color: #f44; padding: 2rem; text-align: center; font-family: monospace;">Failed to load game configuration. See console for details.</div>';
      errDiv.style.display = 'flex';
    }
    return;
  }
}

// Handle config fetch requests from Rust
function handleConfigRequest(path) {
  // Prevent duplicate fetches
  if (fetchedPaths.has(path)) {
    return;
  }
  fetchedPaths.add(path);
  
  // Fetch the entity config
  fetch(path)
    .then(response => response.ok ? response.text() : Promise.reject(new Error(`HTTP ${response.status}`)))
    .then(toml => {
      let complete = false;
      try {
        // wasm_load_config returns true when the last pending config is loaded.
        complete = wasm_load_config(path, toml) === true;
      } catch (e) {
        console.error(`Failed to parse config at ${path}:`, e);
        // Rust already cleaned up in_flight/pending in the Err path.
        // Check if all other paths finished before this one errored.
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    })
    .catch(err => {
      console.error(`Failed to fetch config at ${path}:`, err);
      // Fetch failed — call wasm_load_config with empty string so Rust can
      // remove this path from in_flight/pending and know whether preload is done.
      let complete = false;
      try {
        complete = wasm_load_config(path, '') === true;
      } catch (_) {
        complete = wasm_is_preload_complete();
      }
      if (complete) finishInit();
    });
}

// Finish initialization after preload completes
  let _finishInitCalled = false;
function finishInit() {
  if (_finishInitCalled) return;
  _finishInitCalled = true;
  const spinner = document.getElementById('wasm-spinner');
  
  window.wasm_init = wasmBindings.wasm_init;
  window.wasm_receive_message = wasmBindings.wasm_receive_message;
  window.set_message_callback = wasmBindings.set_message_callback;
  window.wasm_validate_stations = wasmBindings.wasm_validate_stations;

  // Validate station config before starting PeerJS or the Bevy app.
  // A malformed [stations] section must refuse to boot.
  fetch('assets/entities/player_ship.toml')
    .then(r => r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`)))
    .then(toml => {
      try {
        wasm_validate_stations(toml);
      } catch (err) {
        showFatalError('Station config error: ' + (err && err.message ? err.message : String(err)));
        return;
      }
      startServer();
    })
    .catch(err => {
      showFatalError('Failed to load player_ship.toml: ' + String(err));
    });
}

function showFatalError(message) {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) {
    spinner.innerHTML =
      '<div style="color:#f44;padding:2rem;text-align:center;font-family:monospace;max-width:40rem;">' +
      '<strong>Fatal configuration error</strong><br><br>' +
      message.replace(/</g, '&lt;') +
      '<br><br>Fix the TOML and reload the page.</div>';
    spinner.style.display = 'flex';
  }
  // PeerJS is already constructed but we never call startServer(), so it
  // will open its peer but never receive connections that matter.
  console.error('[Phoenix] Fatal:', message);
}

function startServer() {
  const spinner = document.getElementById('wasm-spinner');
  if (spinner) spinner.style.display = 'none';

  set_message_callback(routeOutbound);
  
  // Flush before wasm_init: App::run() in WASM unwinds the JS stack by
  // throwing, so any code after wasm_init() never executes.
  for (const [token, json] of msgQueue.splice(0)) wasm_receive_message(token, json);

  // Signal smoke tests (and any other listeners) that wasm_receive_message is
  // now set and the msgQueue has been flushed.  We dispatch PhoenixReady BEFORE
  // wasm_init() because App::run() in WASM throws (unwinding the JS stack), so
  // code placed after wasm_init() is unreachable.
  window.__phoenixReady = true;
  window.dispatchEvent(new CustomEvent('PhoenixReady'));

  try { wasm_init(); } catch (_) {}
}

// ── WASM startup ───────────────────────────────────────────────────────
// Trunk fires TrunkApplicationStarted once the WASM binary is fully
// instantiated and sets window.wasmBindings to the wasm-bindgen exports.

function startPhoenix() {
  // Start the preload sequence
  preloadAndStart().catch(err => {
    console.error('Failed to start preload:', err);
  });
}

window.addEventListener('TrunkApplicationStarted', startPhoenix);

    // ── Audio context resume on first user gesture ───────────────────────
    // Browsers block AudioContext from playing until a user interacts with
    // the page. Create + resume inside the first click/tap to satisfy the
    // autoplay policy. Bevy's audio plugin can then use this context normally.
    (function initAudio() {
      let resumed = false;
      function ensureAudio() {
        if (resumed) return;
        resumed = true;
        // AudioContext must be created/resumed inside a user gesture.
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        // .resume() is a no-op if already running; suppresses the warning.
        ctx.resume().catch(() => {});
      }
      document.addEventListener('mousedown', ensureAudio);
      document.addEventListener('touchstart', ensureAudio);
      document.addEventListener('keydown', ensureAudio);
    })();
  </script>
</body>
</html>

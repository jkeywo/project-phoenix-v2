id = "strategy_choice_path_a"
from = "Captain's Chair"
subject = "Your Move"
message = "Two options: shield the station with our hull, or give Dr. Varen time to broadcast her record while we hold off Harrow."

[[comms.responses]]
text = "Shield containment. Engineering, all power to shields."
actions = [
    { set_flag = "containment_active" },
    { push_comms = "containment_briefing" },
    { add_objective = "containment_position" },
    { add_objective = "containment_shields" },
    { add_objective = "containment_tuning" },
]

[[comms.responses]]
text = "Get Dr. Varen broadcasting. We hold until she's done."
actions = [
    { set_flag = "broadcast_active" },
    { push_comms = "broadcast_briefing_a" },
    { add_objective = "broadcast_hold" },
    { spawn_entity = "assets/entities/ship_harrow_patrol.toml", position = [400.0, 0.0, -600.0], name = "wave_1_patrol_a" },
]

# Strategy choice ΓÇö Path B (Dr. Myst's resonance data)

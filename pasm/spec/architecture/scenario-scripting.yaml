    evidence:
      - kind: test
        reference: "tests/headless_runner.rs::a_slipped_deadline_fires_at_its_new_tick_and_a_cancelled_one_never_fires"
        summary: "`probe_deadlines.toml` driven for twenty mission seconds: script reads 8 s left two seconds into a ten-second deadline, slips it by five, and cancels another. The slipped deadline is PENDING and unfired across every tick of the span its original due tick falls in, then fires exactly once on its new tick; the cancelled one never fires though its authored tick passes; the untouched control fires on its authored tick; and `pending_callbacks` is EMPTY at the end, which is what proves the retraction was real rather than merely recorded."

  - state: mission-deadline-state
    core:
      status: implemented
      confidence: confirmed
      title: Mission Deadline State
      summary: "The live state of every `[[deadline]]` a world authored: id, crew-facing label id, visibility, the MUTABLE absolute due `SimTick`, pending/fired/cancelled, and the exact `ScheduledCall` currently queued for it. Held as a `DeadlineTable` FIELD on `WorldContentRuntime`, with the `on_deadline` declarations as a `Vec<DeadlineHandler>` field on `WorldScriptRuntime`. Neither is a resource of its own, so the slice registers no new component or resource — see the `RawWorldSource`/`WorldScriptRuntime` baseline note in tests/authoritative_state_enumeration.rs, which accounts for it."
      rationale:
        - "IT IS A RECORD, NOT A SCHEDULER. Issue #1024 forbids a second deferred-work queue, and this is how that is honoured: arming a deadline pushes ONE ordinary `ScheduledCall` onto `WorldScriptRuntime::pending_callbacks` — the existing `SimTick`-keyed queue `tick_script_callbacks` already drains — and remembers it on the record. Firing IS that drain. No system this slice adds walks the table looking for due work; `arm_mission_deadlines` runs its body exactly once per mission, and `note_fired` is a lookup inside a drain that already happens. The record exists to give that queued call the name, label, visibility and mutable due tick the raw `(fire_tick, script_path, fn_name)` key cannot carry."
        - "Slip and cancel are therefore EDITS to that queue, not a second source of truth reconciled against it later. `DeadlineTable::apply` returns a `QueueEdit` naming the exact call to retract and the exact one to push in its place, and `PendingCallbacks::retract` takes the first equal entry out. A slipped deadline is not queued at its old tick at all, so there is nothing left to suppress. `retract` takes the FIRST equal entry rather than all of them because two deadlines may legitimately share a handler fn and a fire tick, producing equal keys."
        - "`note_fired` runs BEFORE dispatch, so a deadline's own handler reads its state as `fired` while it runs — the honest answer at that moment."
        - "Records are an ordered `Vec` rather than a map, for the reason `PendingCallbacks` is: the order is a deterministic function of the world file, it is what the panel renders top to bottom, and a `HashMap`'s iteration order must never reach a payload or a fold."
        - "The table sits on `WorldContentRuntime` rather than becoming its own resource so every site that already borrows the content runtime to apply a call's effects can apply its deadline mutations too — four call sites, one line each, no new `SystemParam` anywhere."
        - "Firing is keyed on `SimTick`, never on `elapsed_secs`: `due_tick` is the arm tick plus `seconds_to_ticks(due_secs, sim_tick_hz)` over values two peers both read from the world file, so both peers fire the same deadline on the same tick. Authoring stays in whole seconds to match the integer-only (`no_float`) script surface; the conversion happens once, at arm/slip time, through the same `seconds_to_ticks` the callback queue uses."
        - "AUTHORITATIVE BUT NOT FOLDED, exactly like `FlagStore` and `ObjectiveManager`: `state_digest` does not walk it. Adding it would move every existing world's digest (an absent-resource marker folds even for a deadline-free world), which is a separate commitment from this slice."
    architecture:
      classification: authoritative
      owner: mission-deadline-vocabulary
      writers: [mission-deadline-vocabulary]
    implementation:

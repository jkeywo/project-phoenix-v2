# ── Endings ──────────────────────────────────────────────────────────────────

# Victory: every hostile destroyed — the eight waves and their tier bonuses.
# See the header note for why this is one trigger over a dynamic group rather
# than three name lists, and why the guard counts waves instead of seconds. The
# `delay_secs` on the action is the game-over WINDOW: the one thing in this
# world still timed off a death rather than off the clock.
[[trigger]]
condition  = "on_all_destroyed"
group      = "hostiles"
when       = "counter(waves_spawned) >= 8"

  [[trigger.action]]
  type       = "game_over"
  message    = "world.combat_test.trigger.action.18.message"
  outcome    = "victory"
  delay_secs = 5.0

# Defeat: Starbase Alpha destroyed.
[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.starbase_alpha.name"

  [[trigger.action]]
  type    = "game_over"
  message = "world.combat_test.trigger.action.21.message"
  outcome = "defeat"

# ── Objectives ───────────────────────────────────────────────────────────────
#
# The standing mission. Its Patrol directive is the PLAYER's defensive circuit
# around the station it is defending — the four `starbase_patrol_*` anchors —
# and it is the only Patrol left in this world now that the enemy picket line is
# gone. It scores 20, under every `obj-destroy-wave-N` at 80, so it is what a
# backfilled player flies between engagements rather than what it does instead
# of fighting.

[[trigger]]
condition = "on_world_loaded"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-defend"
  text      = "world.combat_test.trigger.action.obj_defend.text"
  mandatory = true
  targets   = ["world.entity.starbase_alpha.name"]
  source            = "mission"
  base_priority     = 20.0
  directive_kind    = "Patrol"
  directive_anchors = ["starbase_patrol_north", "starbase_patrol_east", "starbase_patrol_south", "starbase_patrol_west"]
  directive_loop    = true

# ── Comms ────────────────────────────────────────────────────────────────────
#
# Starbase Alpha is the scenario's real, hailable Comms endpoint. It gives the
# opening brief, reports each wave when that wave is released, and sends urgent
# one-way reports when its aggregate hull crosses the authored integrity bands.

[[comms]]
from    = "world.entity.starbase_alpha.name"
trigger = "on_world_loaded"
urgent  = true
message = "world.combat_test.comms.0.message"

[[comms]]
from    = "world.entity.starbase_alpha.name"
trigger = "on_timer"
after_secs = 0.0
message = "world.combat_test.comms.1.message"


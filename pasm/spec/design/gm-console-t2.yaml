  - component: gm-t3-removal-inverse-from-captured-entity-state
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Reversing an Allowed GM Removal from Captured Entity State
      summary: "An allowed GM removal captures the removed entity's COMPLETE restorable state before it stops existing, plus the attributed GM contact overrides the ordinary cleanup clears, and retains both as bounded inverse data. The capture is a snapshot::EntityState taken through snapshot's own capture, and the restore goes through snapshot's own spawn_from_origin and apply_entity_state, so a despawn undo is a one-entity restore rather than a second definition of what an entity is. An entity carrying no runtime spawn recipe (an authored [[entity]] block, which a fresh boot re-creates from the world file) cannot be rebuilt, and the capture records that rather than fabricating one; the journal projection publishes capture_lost so the surface hides the control instead of offering an inverse the reducer would refuse. The inverse restores the SAME uuid and state at the CURRENT tick: no absent time is simulated, no global state is rewound, and the preview says in the same words for every removal that the crew locks, tows, docking, transports and console selections the cleanup released are deliberately not re-made."
      rationale:
        - "[ai] Issue #1444 (PRD #1420 M5 stories 5 and 6), carrying PRD #1418's usability contract. It rides #1442's typed inverse whole: GmAction::UndoGmAction, the same journal, the same undo_precheck, the same both-operators-on-one-history record, the same AlreadyInverted race answer."
        - "[ai] The affected fact is GmAffectedField::EntityPresence — the identity and the two sides, nothing more. A whole hull cannot be echoed through a browser and back on every Undo press, so the heavy capture stays simulation-side in WorldContentRuntime::gm_despawn_captures keyed by the same public action identity, and the small pair travels as the stale-page check every other family uses."
        - "[ai] The capture is snapshot::capture_entity_state and the restore is snapshot::spawn_from_origin plus snapshot::apply_entity_state — the latter lifted unchanged out of restore_entities for this purpose. A private per-entity rebuild would be a second answer to \"what is the state of this ship\", and the two would drift the first time a continuation was added to only one of them. mesh_crew is stripped: live crew authority is who is sitting at a console, and a restore preserves CURRENT seating."
        - "[ai] remove_entity RETURNS the overrides it cleared rather than being mirrored by a read-only walk, so the one walk that clears a reference is the one walk that reports it and a clear added later cannot quietly stop being restored for the GM about to reverse the removal. Ordinary scripted and combat destruction drops the value and pays for no capture."
        - "[ai] Attributed GM contact overrides are restored; every other cleared reference is not. A contact override is a GM decision made through SetContactOverride, and dropping it would silently discard one GM action while claiming to reverse another. A radar selection, a tractor coupling or a torpedo lock is a crew decision that a crew WATCHED end — re-making it would overwrite a newer decision, which PRD #1420 forbids — and the ordinary systems re-establish everything genuinely derived once the hull is live again."
        - "[ai] Those overrides are also the only cleared reference a capture CARRIES, because a capture is folded into the authoritative digest and written into every save. The rest of that cleanup touches state kept outside the #894 digest boundary on purpose: task activations live in the presentation-class TaskLifecycles, which is never snapshotted, so a resumed peer holds none while a peer that ran through holds them; Comms presence is rebuilt from a LocalShip query a shipless GM peer never runs. A capture derived from either would fold and save a per-peer difference and produce a spurious DigestMismatch mid-live-event, and it would buy nothing, because the preview names the released KINDS in one fixed sentence keyed on the affected pair rather than listing what this hull held."
        - "[ai] Every fallible question is asked in restore_precheck at the canonical apply tick, before the first write: the uuid is not live (RestoreIdentityOccupied), no authored name the entity answered to has been re-bound (RestoreReferenceConflict), no restorable reference now holds a newer value, and the recorded template still resolves (InverseUnsupported). That split is what makes the restore atomic — by the time anything is written, nothing can still refuse — and it is why a refused inverse leaves no half-built hull and no half-applied references."
        - "[ai] The captures are BOUNDED at MAX_GM_DESPAWN_CAPTURES, oldest evicted first, because one of them is a whole entity row and the journal's own 4096 cap would put megabytes of removed hulls in every save. They ride WorldContentRuntime for pending_gm_despawns' reason — both arms are cross-tick, armed in PreUpdate and executed by the fixed pipeline — are captured in the snapshot and folded into the digest ONLY once a GM has removed something, so a run that never uses the surface keeps its previous digest. No SNAPSHOT_FORMAT bump: an older save simply holds no captures and is honestly told so, which is the same answer this build gives for an evicted one."
        - "[ai] Per PRD #1418 stories 29-31: the preview states the restored state and the witnessed consequences as two separate sentences under EVERY confirmation policy, the released links are named by kind — locks, tows, docking, transports, console selections — rather than as \"crews remember\", the Undo control is hidden rather than disabled when no capture can rebuild the entity, and the refusals name one thing each because \"undo failed\" is not an answer a live GM can act on."
    architecture:
      kind: gm-authoritative-action
      authority: authoritative
      coordinates: [gm-milestone-operations-safety, gm-t3-typed-inverse-actions, gm-t3-saved-action-history]
      reads: [world-snapshot-artifact]
      writes: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/gm_despawn_undo.rs, src/gm_despawn.rs, src/gm_action.rs, src/gm_journal.rs, src/gm_activity.rs, src/snapshot.rs, src/sim_digest.rs, src/world/server.rs, src/gm_contact.rs, gui/gm-inverse-preview.js, gui/gm-journal-panel.js, gui/gm-action-reasons.js, assets/strings/strings.csv]
      symbols: [GmDespawnCaptures, GmRemovalCapture, GmRemovalReference, digest_facts, ArmedGmRemoval, ArmedGmRestore, restore_precheck, capture_before_removal, record_capture, apply_armed_restores, EntityPresence, RestoreIdentityOccupied, RestoreReferenceConflict, capture_entity_state, apply_entity_state, capture_lost, affectedPresence]
      tests: [cargo test --features headless --test gm_despawn_undo, cargo test --features headless --lib gm_despawn_undo, cargo test --features headless --test gm_despawn, cargo test --features headless --test snapshot_resume, npx vitest run tests/client/gm-journal-panel.test.js tests/client/gm-inverse-preview.test.js]

  - component: gm-t3-named-checkpoints-and-candidate-preflight
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Named GM Checkpoints and the Shared Live-Restore Candidate Preflight
      summary: "Bookmark names a capture on the EXISTING save machinery: the same CaptureSlot::Manual request, the same fixed-tick boundary and the same peer-private Store the save catalogue uses. A capture tick is shown only after the requested slot id comes back from that catalogue carrying its own recorded tick; a storage refusal, a dropped boundary and a write that reported success but left no readable row are three explicit failures. src/gm_checkpoint.rs owns the reusable candidate preflight both the picker and the later live restore share: a peer-local catalogue row can hold this session's seating only when the existing format/rules/content gate passes, the scenario path matches, and every LIVE ship slot exists in the candidate flying the same hull. The candidate's own crew never leaves the model, no peer parameter exists, and nothing here restores."
      rationale:
        - "[ai] Issue #1445 (PRD #1420 M5 stories 7 and 8), carrying PRD #1418's usability contract. A bookmark is a NAME on the ordinary manual capture, not a second storage path: reusing save_slots/save_slots_store/save_slots_lifecycle is what makes a checkpoint carry the ordinary action journal and its derived inverse state, because PhoenixSnapshot::gm_actions is already folded into every capture."
        - "[ai] Confirmation is a catalogue READ-BACK, not a status sentence. wasm_create_save_slot returns a slot id immediately and the fixed boundary is later, so the only honest source of a capture tick is the stored record itself; gm_checkpoint::confirmed_checkpoint returns None for an absent row AND for a present row with no readable record, and the surface then reports an explicit failure rather than painting a success it cannot substantiate."
        - "[ai] Compatibility decomposes into the version gate the catalogue already ran, the scenario path, and per-slot hull identity. A Station is authored by its hull template and the content digest pins that template, so same slot + same hull + same content is the honest derivation of every currently held Station still existing; the saves record no station list, and the model does not invent one. Extra candidate ships do not block representing the live seating, and every applicable block is reported rather than only the first."
        - "[ai] Live seating comes from the replicated FleetRoster, the same structure BootIdentity::fleet carries, so the two sides are directly comparable. CandidateFleet projects slot and hull ONLY: old seat ownership therefore cannot travel out of a preflight into a live assignment, which is PRD #1420 story 9's requirement expressed as a type rather than as a rule to remember."
        - "[ai] FleetShip::ship_path is a per-host PLACEHOLDER meaning 'whatever this host's own lobby selected', so each side must resolve its own local slot's hull BEFORE comparing: live from SelectedShipResource, candidate from BootIdentity::selected_ship, which snapshot::capture writes from that same resource. Comparing the placeholders instead would make the hull check vacuous in exactly the single-simulation-peer topology PRD #1420 ships first, where the default one-ship roster carries None on both sides. Only the roster's own local slot may take the substitution, and an unresolved hull on either side reports HullUnknown rather than a match."
        - "[human] A GM peer derives its identity from the ROSTER, not from a ship selection it does not have. ?gm=1 deliberately inserts no SelectedShipResource, so snapshot::capture now builds BootIdentity from the replicated, peer-identical FleetRoster alone and records an empty selected_ship for a peer that flies nothing; required_boot_identity admits that empty value only from a peer that owns no roster ship. Requiring both resources meant a GM's own bookmark carried no boot identity at all and came straight back out of its own catalogue as Unreadable/NoFleetRecord. No fake SelectedShipResource is inserted on the GM page, the authoritative digest is untouched (BootIdentity is snapshot metadata and is not folded into it), and HullUnknown keeps its narrow meaning of a hull nobody can name rather than becoming the answer to 'a GM took this bookmark'."
        - "[human] The candidate verdict has THREE values, not two. A row whose preflight is absent has not been CHECKED (the pre-boot landing catalogue publishes none), so the row, its accessible name and the detail region all say so in words and carry data-eligible=unknown; such rows are counted in their own sentence instead of being folded into the eligible-of-total denominator, where they would report a shortfall no preflight ever found."
        - "[ai] Candidate rows are created once and repainted in place, keyed by slot id, and they key on data-checkpoint-slot-id rather than the data-slot-id the landing save catalogue already uses for the same ids. Rebuilding the list on every admission refresh destroyed the node an operator was pressing (a real browser could not land a click on a row at all), and the shared attribute made every unscoped save-row selector in the one server.html document ambiguous."
        - "[ai] Privacy is structural. preflight takes one SaveSlotEntry from the caller's own catalogue and the caller's own seating; there is no peer parameter, no catalogue-of-catalogues and no wire type, and the browser Store the rows come from is namespaced to this browser. Nothing in this slice modifies live assignments or restores anything: the restore in #1446 revalidates authoritatively against this same model."
        - "[ai] The verdict crosses wasm-bindgen as a per-row preflight object and is NULL before a world has booted, because the pre-boot landing catalogue has no live seating for a row to be a candidate for. JS presents and never decides: a verdict that disagrees with its own reasons is read as a refusal, and a block kind this build does not know keeps its wire identity instead of reading as eligible."
        - "[ai] The picker that shows those reasons is the GM console's own candidate list, and gui/save-slots.js deliberately does not read the field. The landing catalogue is the only save picker carrying a row list, and it is on screen ONLY before a world is chosen — #save-slots-panel is display:none once the landing has undocked it — so a verdict rendered there could never reach a reader. One reachable surface per fact; the shared gui/gm-checkpoint-preflight.js is what keeps the sentences identical wherever #1446's restore later presents them."
        - "[ai] 'May a capture be admitted now?' has exactly one definition, save-slots.js captureAvailableForPhase, re-exported by the checkpoint panel rather than restated. Both copies would otherwise be live on the real page at once — one behind __setSaveSlotsPhase feeding canCapture, one behind the panel's own setPhase — and any drift would offer a Bookmark control for a capture the catalogue refuses."
        - "[ai] Reading discipline per PRD #1418: verdict and reasons are words as well as data-eligible, candidate rows are buttons with arrow/Home/End movement and a --control-hit-min floor, the selection and a half-typed checkpoint name survive every refresh, the list scrolls inside a bounded box so 200% text wraps and stacks, and no bookmark outcome opens a dialog or moves a panel."
    architecture:
      kind: gm-presentation
      authority: non-authoritative
      coordinates: [gm-milestone-operations-safety, gm-t2-device-and-milestone-boundaries, t2-peer-local-save-slot-lifecycle]
      reads: [world-snapshot-artifact]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/gm_checkpoint.rs, src/snapshot.rs, src/server/bridge.rs, src/server/browser_edge.rs, gui/gm-checkpoint-panel.js, gui/gm-checkpoint-preflight.js, gui/save-slots.js, gui/gm-workspace.js, gui/gm-workspace-shell.js, gui/gm-workspace.css, server.html, assets/strings/strings.csv]
      symbols: [LiveSeating, SeatedShip, CandidateFleet, CandidateShip, CandidateBlock, CandidatePreflight, preflight, confirmed_checkpoint, ConfirmedCheckpoint, publish_live_seating, candidate_preflight_js, createGmCheckpointPanel, confirmedCheckpoint, normalizeCheckpointRow, captureAvailableForPhase, normalizeCandidatePreflight, candidateBlockText, candidateBlockTexts, paintCandidatePreflight]
      tests: [cargo test --features headless --lib gm_checkpoint, cargo test --features headless --lib snapshot, cargo test --features headless --test gm_checkpoint, npx vitest run tests/client/gm-checkpoint-panel.test.js tests/client/save-slots.test.js, npx playwright test tests/smoke/gm-checkpoint-200.spec.js]

  - component: gm-standalone-operator-binding
    core:
      status: implemented
      confidence: confirmed
      title: The Standalone Game Master's Own Bound Operator
      summary: "A peer that booted the landing's Host as GM route IS its own session: one simulation, the hull its operator picked flown by AI backfill, and no fleet. Such a peer binds a one-participant FleetRoster whose single FleetGm names the public operator id gm-1 on its own slot, and seeds the matching connected, unready row into the crew-public GmRoster. Privileged admission is then the ordinary one — gm_action::submit_local resolves gm_operator(local) and checks GmRoster presence exactly as it does for a fleet GM — and the host page reads that same bound row back through wasm_local_gm_operator rather than inventing an identity of its own. A peer that already carries a fleet roster or a lockstep wait-set is never rebound, and a host-page roster replacement that omits a solo peer's own operator leaves that presence standing."
      rationale:
        - "[ai] Defect, 2026-09-11 (John: 'most of the buttons disabled permanently'), against PRD #930's gm-milestone-peer-tracer exit criterion that a GM-only deterministic session runs the world. It did not: every GM panel gates its controls on a local operator, the page derived that only from a fleet handle, and the reducer bound the acting operator only from FleetRoster. A fleetless GM therefore had a console whose every action verb was dead, with no sentence anywhere saying why."
        - "[ai] Two layers had to agree or the fix would be cosmetic. Binding only in the page would have produced controls that submit and are refused NotInFleet/NotGameMaster; binding only in the simulation would have left the controls disabled. So there is ONE bound identity and the page reads it back, which is why wasm_local_gm_operator exists at all — the alternative, a JS-minted id, is the page and the reducer disagreeing about who is acting."
        - "[ai] No second admission rule, no bypass and no LOCAL_CONSOLE_TOKEN-style escape: the bound peer's grant takes the same owner-sequenced path, carries the same attribution into the same journal, and is refused on the same OperatorMismatch and absent-presence checks. A fleet session is byte-identical; its constructor, its admission and its tests are untouched."
        - "[ai] The id is gm-1, the same one gui/host-mesh.js mints for the first game master of a fleet, so a session that starts standalone and later opens a fleet keeps the identity its durable journal already attributes actions to."
        - "[ai] FleetRoster::solo_game_master is separate from with_participants_and_gms because that constructor enforces a MESH rule — a technical slot is either a ship host or a stationless GM, so no ship host can claim an operator id it does not own. A session of one has no sibling to authenticate against and no second slot to be. Anything with more than one participant still goes through the mesh constructor and still obeys the rule."
        - "[ai] The roster row is connected because the operator is present by construction and NOT ready, matching the page's own standalone start controls: readiness is a collective answer and there is nobody to be ready for. That also leaves enforce_fleet_managed_countdown dormant exactly as the native local GM does, so the session starts when this operator presses Start and not before."
        - "[ai] The host page publishes the crew-public roster as the projection of a FLEET and therefore publishes the EMPTY array for a session that has none — at boot and again whenever a fleet closes. preserved_standalone_presence keeps a solo peer's own row across such a replacement, and only when the replacement does not mention that operator at all; anything the page actually says about it, including that it has gone, still wins, and a fleet peer's replacement is applied unchanged."
        - "[ai] The operator's DISPLAY name is the page's, from the String Table (server.gm.operator.standalone): this route asks for a scenario and a hull, never a name, so the simulation holds the empty name GmRoster already documents for that case. Identity is authoritative; presentation is not."
        - "[ai] Controls that remain disabled in a standalone session are the selection- and input-dependent ones a fleet GM sees identically (no entity selected, no text typed, no restore candidate chosen). No control is dead because the session has one peer, so PRD #1418 story 27's never-a-silently-dead-control rule needs no new sentence here."
    architecture:
      kind: session-identity-registry
      authority: authoritative
      coordinates: [gm-t2-peer-and-admission-contract, gm-operator-admission-and-presence, gm-milestone-peer-tracer]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/gm_solo.rs, src/lockstep/mod.rs, src/gm_action.rs, src/core/codec.rs, src/server/bridge.rs, src/server/browser_edge.rs, server.html, assets/strings/strings.csv]
      symbols: [SOLO_GM_OPERATOR_ID, bind_standalone_game_master, local_gm_operator, resolve_local_gm_operator, preserved_standalone_presence, solo_game_master, wasm_prepare_game_master, wasm_local_gm_operator, publish_local_gm_operator, standaloneGm, localGm]
      tests: [cargo test --features headless --lib gm_solo, cargo test --features headless --test gm_standalone, npx vitest run tests/client/gm-standalone-admission.test.js, npx playwright test tests/smoke/gm-standalone-desk.spec.js]

entities:
  - role: scenario-author
    core:
      status: accepted
      confidence: confirmed
      title: Scenario Author
      summary: Local editor user who creates, validates, saves, and exports authored world, entity, faction, and complexity content.
    game_design:
      architecture_links: [editor-mode-shell, editor-validation-service, editor-save-admission, editor-mod-pack-exporter]
      responsibilities: [author content, resolve definite validation errors, export a mod pack]
      player_verbs: [save-authored-content, export-mod-pack]

  - role: host-mod-pack-operator
    core:
      status: accepted
      confidence: confirmed
      title: Host Mod Pack Operator
      summary: "Person at the server page who assembles an ordered stack of mod packs — uploading, removing, and reordering them — before selecting the next scenario from the composed catalog."
    game_design:
      architecture_links: [host-mod-pack-upload, mod-content-overlay-resolver, mod-aware-scenario-catalog]
      responsibilities: [upload mod pack, remove or reorder applied packs, select a scenario from the composed catalog]
      player_verbs: [upload-mod-pack]

  - verb: save-authored-content
    core:
      status: accepted
      confidence: confirmed
      title: Save Authored Content
      summary: Save an edited authored file only when local validation has no definite errors; warnings remain visible but do not prevent deliberate authoring work.
    game_design:
      architecture_links: [editor-validation-service, editor-save-admission]
      owner_role: scenario-author
      inputs: [edited authored TOML]
      resolution: local-validation-gate
      outputs: [saved authored TOML or visible blocking errors]

  - verb: export-mod-pack
    core:
      status: implemented
      confidence: confirmed
      title: Export Mod Pack
      summary: Export selected authored TOML files and a manifest naming selectable root scenarios as a ZIP mod pack suitable for a host to apply before scenario selection.
    game_design:
      architecture_links: [editor-mod-pack-exporter, editor-validation-service]
      owner_role: scenario-author
      inputs: [selected authored TOML files]
      resolution: local-validation-gate
      outputs: [TOML-only ZIP mod pack, selectable scenario manifest]
    implementation:
      status: confirmed
      paths: [editor/mod-pack-export.js, editor/tests/mod-pack-export.test.js]
      tests: [npm run test:editor]

  - verb: upload-mod-pack
    core:
      status: implemented
      confidence: confirmed
      title: Upload Mod Pack
      summary: "Upload a ZIP pack (authored TOML and, since #988, `.rhai` script) and its required scenario manifest to the server page before scenario selection. An accepted pack is PUSHED onto an ordered overlay stack (issue #987); a later pack shadows an earlier one for any authored path they share, and a pack's files may add content or replace files at the same supported authored path. The operator can also remove or reorder applied packs, re-resolving precedence."
    game_design:
      architecture_links: [host-mod-pack-upload, mod-content-overlay-resolver, mod-aware-scenario-catalog]
      owner_role: host-mod-pack-operator
      inputs: [ZIP mod pack]
      resolution: host-authoritative-validation
      outputs: [composed content catalog or visible package errors]
    implementation:
      status: confirmed
      paths:
        - server.html
        - src/server/bridge.rs
        - src/world/mod_pack.rs
      tests: [cargo test]

  - decision: mod-pack-content-composition
    core:
      status: accepted
      confidence: confirmed
      title: Mod Pack Content Composition
      summary: "A validated mod pack overlays base authored content by exact supported path, replacing matching files and adding new files. Packs compose as an ORDERED stack (issue #987): a later-loaded pack wins any authored path an earlier pack also carries, and removing or reordering re-resolves precedence purely from the resulting order. A pack may carry `.rhai` script (issue #988), gated by the deny-by-default sandbox as its trust boundary. Only root worlds explicitly named by a pack manifest appear in the selectable scenario list."
    game_design:
      enforcement_links: [mod-content-overlay-resolver, mod-aware-scenario-catalog, mod-pack-script-trust-boundary]
      owner_role: host-mod-pack-operator
      protected: true
      must_not_be: [partially applied, allowed to escape supported authored paths, allowed to run unsandboxed pack script, allowed to alter a round already in progress]

  - mechanic: blocking-authoring-errors
    core:
      status: accepted
      confidence: confirmed
      title: Blocking Authoring Errors
      summary: The editor distinguishes definite errors from warnings. Errors block save and export; warnings remain non-blocking so an author can work across related files.
    game_design:
      architecture_links: [editor-validation-service, editor-save-admission, editor-mod-pack-exporter]
      participating_roles: [scenario-author]
      resolution: local-validation-gate
      outputs: [blocked invalid save or export, visible warnings]

  - mechanic: mod-pack-scenario-manifest
    core:
      status: implemented
      confidence: confirmed
      title: Mod Pack Scenario Manifest
      summary: A mod pack carries a required manifest that explicitly names the root world files it contributes to scenario selection. Other included world files remain supporting content only.
    game_design:
      architecture_links: [editor-mod-pack-exporter, mod-content-overlay-resolver, mod-aware-scenario-catalog]
      participating_roles: [scenario-author, host-mod-pack-operator]
      resolution: host-authoritative-validation
      outputs: [explicit selectable mod scenario list]
    implementation:
      status: confirmed
      paths: [editor/mod-pack-export.js, editor/tests/mod-pack-export.test.js]
      tests: [npm run test:editor]

  - mechanic: unified-scenario-manifest
    core:
      status: implemented
      confidence: confirmed
      title: Unified Scenario Manifest
      summary: Base content declares selectable regular scenarios in assets/scenarios.toml using the same manifest contract as a mod pack. The composed catalog merges the base manifest with a validated mod manifest.
    game_design:
      architecture_links: [base-scenario-manifest, mod-aware-scenario-catalog]
      participating_roles: [scenario-author, host-mod-pack-operator]
      resolution: host-authoritative-content-catalog
      outputs: [explicit regular scenario list, explicit mod scenario list, composed selectable scenario catalog]
    implementation:
      status: confirmed
      paths:
        - src/world/manifest.rs
        - src/server/bridge.rs
      tests: [cargo test]

  - mechanic: mod-scenario-provenance-visible
    core:
      status: implemented
      confidence: confirmed
      title: Mod Scenario Provenance Is Visible
      summary: "A player can see that a scenario is mod-supplied (issue #990). Each mod-contributed scenario in the composed catalog reports its originating pack id — including a mod scenario that replaces a base id, which reports the pack, not base — while base scenarios report no origin. The applied-pack list survives world load for an already-connected client."
    game_design:
      architecture_links: [mod-pack-scenario-provenance, mod-aware-scenario-catalog]
      participating_roles: [host-mod-pack-operator]
      resolution: host-authoritative-content-catalog
      outputs: [per-scenario pack provenance, visible applied-pack list]
    implementation:
      status: confirmed
      paths:
        - src/world/manifest.rs
        - src/server/bridge.rs
      tests: [cargo test]

  - mechanic: authored-scenario-scripting
    core:
      status: implemented
      confidence: confirmed
      title: Authored Scenario Scripting
      summary: "The editor scenario mode is a `.rhai` script editor (issues #983/#995): the previous declarative card views are gone, and an author edits sibling scripts and inline `[script.*]` blocks with host-fn autocomplete and live compile diagnostics served by the phoenix wasm exports. The script seam itself is delivered but DORMANT — no scenario activation runs authored script yet (roadmap-scenario-scripting, deferred to band B) — so this contract covers AUTHORING, not live execution."
    game_design:
      architecture_links: [editor-scenario-script-authoring, scenario-script-editor-host]
      participating_roles: [scenario-author]
      resolution: local-validation-gate
      outputs: [authored .rhai scenario script, live compile diagnostics]
    implementation:
      status: confirmed
      paths:
        - editor/scenario-mode.js
        - editor/script-wasm.js
      tests: [npm run test:editor]

  - mechanic: editor-mod-assembly
    core:
      status: implemented
      confidence: confirmed
      title: Editor MOD Mode Assembly
      summary: "A dedicated editor MOD mode (issue #989) for assembling and inspecting a mod pack — selecting the authored files it carries and the root scenarios its manifest names — as a first-class workspace that feeds the existing mod-pack exporter."
    game_design:
      architecture_links: [editor-mod-workspace, editor-mod-pack-exporter]
      participating_roles: [scenario-author]
      resolution: local-validation-gate
      outputs: [assembled mod pack, exportable scenario manifest]
    implementation:
      status: confirmed
      paths:
        - editor/mod-mode-view.js
        - editor/mod-pack-workspace.js
      tests: [npm run test:editor]

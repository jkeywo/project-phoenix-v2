# Probe world for issue #1343 — a weighted Backfill Comms decision, taken by a
# FLEET rather than by a single hull.
#
# `probe_fleet_duel.toml` is the class this borrows from (two `game_start` ship
# rows, a hostile close enough to engage, a short `command_delay_ticks`) and the
# one thing it adds is the reason it exists: an `open_comms` conversation whose
# responses author `ai_weight` / `ai_delay_seconds`.
#
# WHY IT HAD TO BE ITS OWN WORLD. `tests/local_ship_neutrality.rs` runs a world
# twice with the `LocalShip` marker on a different fleet hull and compares the
# authoritative fold on every tick. Neither of its two existing probes contains a
# single `open_comms` call, so the comms scope of the digest was never entered
# and the guard could not see the state #1343 added to it — an unmanned Comms
# console's running weighted decisions, which `sim_digest::fold_comms_scope`
# walks. This world enters that scope, holds a wait open across many ticks, and
# then resolves it.
#
# ONE WEIGHTED OPTION, NOT TWO, and that is a property of the HARNESS rather
# than of the mechanism. The neutrality runs are deliberately not lockstep
# sessions (see that file's header): there is no mesh, so a peer's admitted
# `RespondToMessage` is never replicated into the run and only the hull this host
# projects actually submits its answer. Both hulls still DECIDE — that is the
# point of the comparison — but only one of them lands its pick, so a pool of two
# equally-weighted options would let the two runs answer the corridor
# differently and the comparison would then be about the mission's outcome
# rather than about the marker. Falling Skyway is where the two-option shape is
# exercised end to end (`tests/headless_runner.rs`); what this world is for is
# the fold.
#
# The stand-by still sits at index 0 carrying `ai_weight = 0`, because the thing
# worth proving here is that an unmanned bridge does NOT answer with it.

[global]
seed = 1343
ai_helm_tick_hz = 30.0
# Two ticks at 60 Hz, as `probe_fleet_duel.toml` authors and for its reason: a
# probe wants the future-tick path exercised in a handful of ticks.
command_delay_ticks = 2

[player_spawn]
position = [0.0, 0.0, 0.0]

# Fleet slot 1's ship — the fleet owner's. Takes `[player_spawn]`.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-1"
transform = { position = [0.0, 0.0, 0.0] }
spawn_on = "game_start"

# Fleet slot 2's ship, placed by its own transform — far enough not to start
# inside slot 1's collider, close enough that both hulls hold the same contact
# in comms range.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "fleet-ship-2"
transform = { position = [60.0, 0.0, 0.0] }
spawn_on = "game_start"

# The party that calls. A real, hailable hull rather than `_self`: the response
# router range-gates a pick against the SENDER's live range flag, so only a
# reachable sender can be answered — the same authoring rule
# `probe_evidence.toml` records.
[[entity]]
template_path = "assets/entities/ship_civilian_hauler.toml"
id = "corridor_claimant"
name = "world.probe_fleet_comms_choice.entity.claimant.name"
transform = { position = [30.0, 0.0, 20.0] }
overrides = { comms = { hailable = true } }

[script]
setup = """
on_world_loaded("on_load");
on_timer(0, "on_spawn");
on_timer(2, "open_corridor_claim");

fn on_load(ctx) {
    ctx.effects.add_faction_enemy("Harrow", "Federation");
    ctx.effects.add_faction_enemy("Federation", "Harrow");
}

fn on_spawn(ctx) {
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/alliance_cruiser.toml",
        name: "fleet_probe_hostile",
        position: [30, 0, 55],
        overrides: #{ faction: "cccccccc-3333-4333-8333-cccccccccccc" }
    });
}

// The decision. Opened two seconds in, so the fleet is spawned and its comms
// range flags are live before the conversation exists.
fn open_corridor_claim(ctx) {
    ctx.effects.open_comms(#{
        from: "world.probe_fleet_comms_choice.entity.claimant.name",
        node_fn: "corridor_claim",
        thread_id: "probe-fleet-corridor",
    });
}

// Five authored seconds of silence, then the one option an absent officer is
// allowed to take. The hold is index 0 and forbidden outright; the refusal is
// authored but unweighted, which is the other half of "an unmanned console
// reaches only for what the author gave it a weight for".
fn corridor_claim(ctx) {
    #{
        message: "world.probe_fleet_comms_choice.comms.claim",
        responses: [
            #{ text: "world.probe_fleet_comms_choice.comms.stand_by",
               on_pick: "on_corridor_hold",
               ai_weight: 0, ai_delay_seconds: 5 },
            #{ text: "world.probe_fleet_comms_choice.comms.grant",
               on_pick: "on_corridor_grant",
               ai_weight: 1, ai_delay_seconds: 5 },
            #{ text: "world.probe_fleet_comms_choice.comms.refuse",
               on_pick: "on_corridor_refuse",
               ai_delay_seconds: 5 },
        ],
    }
}

fn on_corridor_hold(ctx) { ctx.flags.increment("corridor_held", 1); }
fn on_corridor_grant(ctx) { ctx.flags.increment("corridor_granted", 1); }
fn on_corridor_refuse(ctx) { ctx.flags.increment("corridor_refused", 1); }
"""

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Phoenix — Repair Console</title>
  <link rel="stylesheet" href="console.css">
  <style>
    body { font-size: 16px; margin: 0; background: #000; overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; flex-shrink: 0; gap: 12px; padding: 4px 0; }
    .hero h1 { font-size: 26px; letter-spacing: 0.22em; color: var(--ink); margin: 0; }
    .hero h1 .sub { font-family: "JetBrains Mono", monospace; font-size: 12px; letter-spacing: 0.22em; color: var(--ink-faint); margin-top: 2px; font-weight: 400; }
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; background: rgba(14,17,23,0.6); border: 1px solid var(--edge); padding: 12px; overflow-y: auto; }
    ph-hull-integrity { flex-shrink: 0; }
    ph-station-damage { align-self: flex-start; }
    ph-repair-teams { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: 20px; } .hero h1 .sub { font-size: 10px; } .console-body { padding: 8px; } }
  </style>
</head>
<body>
  <div class="frame" data-screen-label="Repair Console">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1>REPAIR<span class="sub">HULL &amp; SYSTEM MAINTENANCE</span></h1>
        <span class="auto-badge" id="repair-auto-badge" hidden>AUTO</span>
      </div>
      <div class="console-body">
        <ph-hull-integrity id="hull-integrity"></ph-hull-integrity>
        <ph-station-damage id="core-damage" label="Core"></ph-station-damage>
        <ph-repair-teams id="repair-teams"></ph-repair-teams>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span id="footer-status">REPAIR STATION</span>
        <span class="spacer"></span>
        <span id="footer-right" style="color:var(--ink-faint)">—</span>
      </footer>
    </div>
  </div>
  <script type="module">
    import './components/ph-hull-integrity.js';
    import './components/ph-station-damage.js';
    import './components/ph-repair-teams.js';
    import { initConsole } from './console-core.js';
    import { setAutoState } from './console-ui.js';

    initConsole({
      name: 'repair',
      render: function(s) {
        var hullEl   = document.getElementById('hull-integrity');
        var coreEl   = document.getElementById('core-damage');
        var teamsEl  = document.getElementById('repair-teams');

        // Overall ship-wide hull (every damageable system on the ship).
        var oh = s.overall_hull || {};
        hullEl.state = { total_pct: oh.pct != null ? oh.pct : 1 };

        // Ownerless "core" systems get their own click-to-expand bar that
        // hides itself entirely when there are none (issue #12).
        coreEl.state = { entries: s.core_systems || [] };

        teamsEl.state = { teams: s.teams || [], auto: !!s.repair_auto, targets: s.dispatch_targets || [] };

        var active = (s.teams || []).filter(function(t) { return t && t.status && t.status !== 'idle'; }).length;
        var total = (s.teams || []).length;
        document.getElementById('footer-right').textContent = Math.round((oh.pct != null ? oh.pct : 1) * 100) + '% HULL · ' + active + '/' + total + ' ACTIVE';

        setAutoState(null, document.getElementById('repair-auto-badge'), !!s.repair_auto);
      }
    });
  </script>
</body>
</html>

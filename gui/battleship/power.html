<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title data-i18n="console.power.doc_title">Project Phoenix - Power Console</title>
  <link rel="stylesheet" href="../console.css">
  <style>
    body { margin: 0; background: var(--surface-void); overflow: hidden; }
    .frame { height: 100%; }
    .panel-inner { padding: 22px 52px 20px; display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .hero { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; align-self: flex-start; }
    .hero h1 { margin: 0; font-size: var(--text-2xl); letter-spacing: 0.22em; color: var(--ink); }
    .hero h1 .sub { display: block; font-family: "JetBrains Mono", monospace; font-size: var(--text-sm); color: var(--ink-faint); }
    .console-body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; background: rgba(var(--rgb-panel), 0.6); border: 1px solid var(--edge); padding: 12px; overflow-y: auto; }
    ph-power-controls { flex: 1; min-height: 0; }
    .console-footer { display: flex; align-items: center; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: var(--text-xs); color: var(--ink-faint); padding: 6px 0; }
    .console-footer .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--loaded); }
    .console-footer .spacer { flex: 1; }
    @media (orientation: portrait) { .panel-inner { padding: 10px 12px; gap: 8px; } .hero h1 { font-size: var(--text-xl); } .hero h1 .sub { font-size: var(--text-xs); } .console-body { padding: 8px; } }
  </style>
</head>
<body>
  <div id="power-data" hidden></div>
  <div class="frame" data-screen-label="Power Console" data-i18n-attr="data-screen-label:console.power.screen_label">
    <div class="panel"></div>
    <div class="panel-inner">
      <div class="hero">
        <h1><span data-i18n="console.power.title">POWER</span><span class="sub" data-i18n="console.power.subtitle">ALLOCATION &amp; BATTERY</span></h1>
        <span class="auto-badge" id="power-auto-badge" hidden data-i18n="console.common.auto">AUTO</span>
      </div>
      <div class="console-body">
        <ph-power-controls id="power-controls"></ph-power-controls>
        <ph-battery-bar id="battery-bar"></ph-battery-bar>
      </div>
      <footer class="console-footer footer-bar">
        <span class="dot"></span>
        <span data-i18n="console.power.station_footer">POWER STATION</span>
        <span class="spacer"></span>
        <ph-station-damage id="station-damage"></ph-station-damage>
        <span id="bat-val">0%</span>
      </footer>
    </div>
  </div>
  <script type="module">
    import '../components/ph-power-controls.js';
    import '../components/ph-battery-bar.js';
    import '../components/ph-station-damage.js';
    import { initConsole } from '../console-core.js';
    // The render lives in gui/battleship/power.console.js (issue #1235): one
    // shared Power renderer, this hull's variant. The vitest suite imports the
    // same `renderStation`. `s` is a flat PowerConsolePayload.
    import { renderStation } from './power.console.js';
    initConsole({ name: 'power', render: renderStation });
  </script>
</body>
</html>

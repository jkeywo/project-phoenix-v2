  - message: recall-repair-team-command
    core:
      status: implemented
      confidence: confirmed
      origin: ai
      title: Recall Repair Team Command
      summary: Client-to-host request to bring one named repair team back — from an internal job, or from the field target it is working abroad.
      rationale:
        - "[ai] Issue #1385. It NAMES its team, where the fieldless external DispatchExternalRepair/RecallExternalRepair pair names nothing: a ship sends one team abroad at a time, but every internal team can be out on a different job at once, so no server-side lock could resolve which of them a recall meant."
        - "[ai] Internal teams only WHEN #1385 LANDED, and no new state: it drives the SAME Travelling/Repairing → Returning transition RepairTeams::dispatch has always produced for a re-dispatch to the team’s own current system, so the slot shape, its wire projection and the digest fold are untouched. What was new is a verb a caller can use without already knowing where the team is."
        - "[ai] Issue #1386 makes it THE recall: naming the team that holds the ship’s external claim releases that claim instead, which is the same effect RecallExternalRepair has. Naming the team is what allows one control to cover both — the two were different buttons only because the external commitment was a count that named nobody. RecallExternalRepair stays for the AI / operate-directive vocabulary, which names no team because the host picked one."
        - "[ai] host-repair-router’s handle_recall_repair_team is the SINGLE system that answers it, claim or slot. Two would report the correlated feedback twice, and the second would report Refused for a team the first had just brought home. Its SimSet::Physics slot is late enough for the claim: the only same-tick readers downstream are the external tick and its condition payment in SimSet::Modifiers, so a team recalled this tick banks nothing more — exactly what RecallExternalRepair in Input already achieved."
        - "[ai] It takes the ordinary repair-target admission path, so a human at the station and an AI operating it are admitted identically, and a team that is Idle or already Returning is REFUSED on the correlated feedback seam rather than silently reshaped."
    architecture:
      authority: request
      producer:
        - repair-console-interface
      consumer:

# Harrow Destroyer (formerly Pirate Raider)
#
# A small, fast attack ship. The destroyer-class core of the Harrow
# strike fleet. Re-balanced for the combat-test scenario (#474):
# hull/shield split kept the total HP budget the same as pre-#474, added
# a 0.1 shield_pierce on the main phaser bank, removed flee/warp-out so
# the destroyer fights to the death.
#
# Filename intentionally kept as `pirate_raider.toml` so existing world
# TOMLs (`default.toml`, `patrol.toml`, `reinforcements.toml`) continue
# to reference it without cascading renames.

name = "entity.pirate_raider.name"
tags = ["ship", "npc", "enemy"]
faction = "cccccccc-3333-4333-8333-cccccccccccc"

[target]
tags = ["ship"]
threat_level = "low"
description = "entity.pirate_raider.target.description"

[hull]
hull_integrity = 30.0

# Single omni shield arc (issue #514). NPCs have no `[shields]` station so
# the auto-generated `[[system]]` entry is `ai_only = true` and ownerless.
[[shield_arc]]
id = "all"
label = "entity.pirate_raider.shield_arc.all.label"
center_deg = 0
width_deg = 360
max_hp = 15
regen_per_sec = 0.5

[collider]
shape = "Capsule"
radius = 2.0
length = 4.0

[helm_console]
max_speed = 20.0
max_reverse_speed = 0.0
acceleration = 12.5
deceleration = 30.0
max_yaw_rate = 2.0
max_bank_deg = 15.0

[helm_console.engine_pfx]
color = [ 1.0, 0.22, 0.08, 0.68 ]
markers = [ "engine_port", "engine_starboard" ]
trail_lifetime_secs = 0.45

[weapons_console]

[[weapons_console.phaser_banks]]
id = "fore"
facing_deg = 0.0
fire_arc_deg = 180.0
auto_arc_deg = 180.0
beam_range = 37.5
beam_damage_per_sec = 6.0
beam_duration_secs = 4.0
cooldown_secs = 4.0
shield_pierce = 0.1
beam_color = [1.0, 0.1, 0.1, 1.0]
# Links this bank to the fore_emitter mount point in the model's rig sidecar
# (assets/models/dynasty_destroyer.model.toml).
marker = "fore_emitter"

[radar_appearance]
colour = [1.0, 0.2, 0.2]
size = 4.0
icon = "destroyer"

[mesh]
model = "assets/models/dynasty_destroyer.glb"
shape = "cuboid"
size = [4.0, 1.5, 6.0]
colour = [1.0, 0.2, 0.2]

# Small ship comms — shorter range than stations or the player ship.
[comms]
range = 400.0

[ai_profile]
aggression = 0.8
sensor_range = 120.0

# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# (#472/#574) Doctrine-based behaviour (FSM dissolved in issue #572).
# Three standing objectives scored each tick, in priority order:
#
#   Retreat (100) — only scores at all below 30% hull; when it does, it beats
#                   everything and the raider runs for its haven.
#   Destroy  (35) — pursue any hostile Tactical has locked.
#   Patrol   (20) — the default when no hostile is visible.
#
# `zero_gates` is a veto: `retreat-when-hurt` scores 0 — i.e. is not in the
# running at all — until hull drops below the threshold, so its high
# `base_priority` costs nothing while the ship is healthy.

[behaviour]

[[behaviour.doctrine]]
id        = "patrol-sector"
text      = "entity.pirate_raider.behaviour.doctrine.patrol_sector.text"
directive_kind    = "Patrol"
directive_anchors = ["patrol_alpha", "patrol_beta", "patrol_gamma"]
directive_loop    = true
base_priority     = 20.0
target_speed      = 0.4

[[behaviour.doctrine]]
id            = "destroy-hostiles"
text          = "entity.pirate_raider.behaviour.doctrine.destroy_hostiles.text"
directive_kind = "Destroy"
base_priority  = 35.0
target_speed   = 0.9
maintain_range = 25.0

# Break off and run for the haven once badly hurt (issue #702).
#
# This replaces a synthetic Retreat the engine used to inject whenever hull fell
# below a hardcoded-ish `[behaviour] retreat_hull_threshold`. That mechanism was
# inert: it scored 0..1 against doctrine priorities in the tens, so it could
# never win, and its anchor was always empty so it fell back to a "home
# position" production never seeded — i.e. world origin. Authoring it here fixes
# both (a real priority on the right scale, a real anchor) and makes the
# threshold, the destination and the urgency all designer-tunable per hull.
#
# `pirate_haven` is declared by the worlds that fly this template's patrol route
# (patrol.toml, default.toml). In a world that declares no such anchor the
# directive simply resolves to nowhere and the raider fights on — the same
# behaviour it had before this objective existed.
[[behaviour.doctrine]]
id               = "retreat-when-hurt"
text             = "entity.pirate_raider.behaviour.doctrine.retreat_when_hurt.text"
directive_kind   = "Retreat"
directive_anchor = "pirate_haven"
base_priority    = 100.0
zero_gates       = [{ condition = "hull_below", threshold = 0.3 }]
target_speed     = 1.0

# ── Stations ──────────────────────────────────────────────────────────────────
#
# Crew stations (issue #871). This hull used to declare none: every system was
# ownerless + `ai_only`, and the spawner set the lot to `ControlSource::Ai` by
# fiat. That made "NPC" a different SHAPE of ship from a player hull rather than
# the same ship with nobody aboard — a human could never be admitted to any of
# its systems, because admission resolves a human token through the station that
# owns the target system and there was no station to resolve to.
#
# The seats mirror `alliance_destroyer.toml`, the comparable player hull: this
# is a destroyer-class raider. Every seat boots on the implicit `Backfill`
# rating (see `ship::rating::seed_boot_ratings`), which automates every system
# the station owns — so an unmanned raider behaves exactly as it did when the
# systems were `ai_only`.
#
# No `console` key: there is no authored HTML console for this hull yet, so a
# human taking a seat gets admission but no bespoke UI. `manual_overview` is
# likewise omitted — the ship manual is published for the player's own hull.
#
# Only the AUTO-GENERATED systems stay ownerless + `ai_only`: the
# `shield-arc-all` system synthesised from `[[shield_arc]]` above (no shields
# station on this hull), which is the case `ai_only` exists for.

[[station]]
id = "captain"
name = "Captain"
description = "entity.pirate_raider.station.captain.description"
rank = "Cpt."
short_code = "CPT"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "helm"
name = "Helm"
description = "entity.pirate_raider.station.helm.description"
rank = "Ltn."
short_code = "HLM"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.pirate_raider.station.tactical.description"
rank = "Lt. Cmdr."
short_code = "TAC"

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "engineering"
name = "Engineering"
description = "entity.pirate_raider.station.engineering.description"
rank = "Ltn."
short_code = "ENG"

[[station.rating]]
name = "Std"
automated_systems = []

# ── Systems ───────────────────────────────────────────────────────────────────
#
# Red Alert (issue #749 provisioned this as an ownerless `ai_only` system for
# every `[behaviour]` hull that omitted it; #871 authors it explicitly so the
# Captain seat owns it). The synthesis in `entities/config.rs` is idempotent —
# an authored `red_alert` system suppresses it — and the control source is
# unchanged: Backfill automates it, so `operate_captain_ai` still raises Red
# Alert on an unmanned hull exactly as before.
[[system]]
id = "red-alert"
kind = "red_alert"
station = "captain"

# Per-axis helm systems (issues #701/#703, declared in #800 and #704), now owned
# by the Helm seat rather than ownerless.
#
# #800 declared thrust + steering. #704 adds impulse + lateral-thrust, which the
# deleted `operate_helm_ai` monolith used to drive on this hull's behalf: an
# undeclared system resolves to ControlSource::Human (`operate_ai = false`), so
# the monolith never stood down from those two axes here. Declaring them hands
# both to `ai_helm_impulse` / `ai_helm_lateral_thrust`, which was what made the
# delete behaviour-preserving. (Since #803 both systems decide on the shared
# AI-helm sim tick — `[global] ai_helm_tick_hz`, default 30 Hz — rather than
# once per rendered frame as the monolith did.)
[[system]]
id = "helm-thrust"
kind = "helm_thrust"
station = "helm"

[[system]]
id = "helm-steering"
kind = "helm_steering"
station = "helm"

[[system]]
id = "helm-impulse"
kind = "helm_impulse"
station = "helm"

# Boost drive axis (issue #801), declared for hull-uniformity with the player
# ships: every helm axis is a declared system on every hull. No AI drives
# boost, so the declaration only gives the axis the standard damage/repair
# surface plus a lever for a human at the Helm seat.
[[system]]
id = "helm-boost"
kind = "helm_boost"
station = "helm"

[[system]]
id = "helm-lateral-thrust"
kind = "lateral_thrust"
station = "helm"

# The Tactical radar (issue #871). New on this hull: it is the system every
# player hull declares and no NPC hull did, which is what blocked #887 from
# routing AI target selection through admission. Declaring it does not make the
# radar damageable — that needs a `[[hull.system_hull]]` entry, and this hull
# authors none — and `publish_tactical_radar_blackboard` already ran for every
# ship regardless.
[[system]]
id = "tactical-radar"
kind = "tactical_radar"
station = "tactical"

# Fine Tactical systems (issue #512): one phaser bank ("fore"). No torpedoes.
[[system]]
id = "phaser-fore"
kind = "phaser_bank"
station = "tactical"

# Ship-wide phaser settings (issue #801): firing mode + emitter frequency.
# One declared system (NOT per-bank) so SetPhaserMode/SetPhaserFrequency
# admission gates on a real system instead of the deleted coarse `tactical`.
[[system]]
id = "phaser-control"
kind = "phaser_control"
station = "tactical"

# Fine Power systems (issue #513): reactor + battery for per-instance damage.
# NPCs have no `[power_groups.*]` block so `power_group` is omitted.
[[system]]
id = "power-reactor"
kind = "power_reactor"
station = "engineering"

[[system]]
id = "power-battery"
kind = "power_battery"
station = "engineering"

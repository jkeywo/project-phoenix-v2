[[station]]
id = "captain"
name = "Captain"
description = "entity.alliance_battleship.station.captain.description"
rank = "Cpt."
short_code = "CPT"
manual_overview = "You command a capital ship with a full nine-seat bridge crew. Set the viewscreen, call Red Alert, and coordinate the whole crew through a sustained engagement. The battleship is slow but overwhelming — your job is to keep every station pulling in the same direction. Simplified rating hands Red Alert to the ship's AI."

[[station.rating]]
name = "Std"
automated_systems = []

[[station.rating]]
name = "Simplified"
automated_systems = ["red-alert"]

[[station]]
id = "helm"
name = "Helm"
description = "entity.alliance_battleship.station.helm.description"
rank = "Ltn."
short_code = "HLM"
manual_overview = "You fly a heavy warship. It is slow to turn and slow to stop, so plan your manoeuvres well ahead: throttle and steering set your line, lateral thrust helps bring the broadside arcs to bear, and impulse gives you a measured burst. Anticipate where Tactical needs the guns pointed and get there early."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "tactical"
name = "Tactical"
description = "entity.alliance_battleship.station.tactical.description"
rank = "Ltn."
short_code = "TAC"
manual_overview = "You run the battleship's formidable weapons suite: fore and aft phasers, a heavy forward blaster, and a six-tube torpedo battery. Lock targets, manage tube loading and volley patterns, and match phaser frequency to enemy shields. There is a lot of firepower to conduct here — prioritise threats and keep the volume of fire up. Simplified rating auto-fires the phaser banks."

[[station.rating]]
name = "Std"
automated_systems = []

[[station.rating]]
name = "Simplified"
automated_systems = ["phaser-fore", "phaser-aft"]

[[station]]
id = "repair"
name = "Repair"
description = "entity.alliance_battleship.station.repair.description"
rank = "Ltn."
short_code = "ENG"
manual_overview = "You lead damage control. Dispatch repair teams to damaged systems by priority and watch the ship-wide hull picture. On a capital ship there is always something to fix under sustained fire, so triage hard: keep the guns, the drives, and the shields alive before the cosmetic damage."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "sensors"
name = "Sensors"
description = "entity.alliance_battleship.station.sensors.description"
rank = "Ens."
short_code = "SCI"
manual_overview = "You are the ship's eyes. Sweep the long-range radar, identify and classify contacts, and feed target designations to Tactical so the guns are always working the right threat. On a big ship in a big fight, your early warning is what keeps the crew ahead of the enemy."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "shields"
name = "Shields"
description = "entity.alliance_battleship.station.shields.description"
rank = "Ens."
short_code = "SHD"
manual_overview = "You run the shield grid, a dedicated station on a ship this size. Focus an arc to reinforce it against the bearing of incoming fire, watch each facing's HP and regeneration, and rotate focus as the enemy shifts their aim. The generated Shields section below reads this ship's actual arc strength and regen rate."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "navigation"
name = "Navigation"
description = "entity.alliance_battleship.station.navigation.description"
rank = "Ens."
short_code = "NAV"
manual_overview = "You plot the ship's course. Set waypoints on the system chart for the Helm to follow and clear them onto new headings as the mission develops. A battleship handles slowly, so give the Helm plenty of warning and think several moves ahead of the current position."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "power"
name = "Power"
description = "entity.alliance_battleship.station.power.description"
rank = "Ltn."
short_code = "PWR"
manual_overview = "You manage the reactor. Allocate power between helm, weapons, and shields to match the tactical situation, and watch the battery reserve during heavy weapons fire. On a capital ship the demands are constant and competing — read the battle and shift power to wherever the crew needs it most."

[[station.rating]]
name = "Std"
automated_systems = []

[[station]]
id = "comms"
name = "Comms"
description = "entity.alliance_battleship.station.comms.description"
rank = "Ens."
short_code = "COM"
manual_overview = "You handle communications. Hail contacts, read and answer incoming traffic, and keep the captain and crew informed of mission developments. On a capital ship you are the link between the bridge and everyone else in the sector — stay on top of the message queue and flag anything urgent."

[[station.rating]]
name = "Std"
automated_systems = []


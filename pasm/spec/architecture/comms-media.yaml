entities:
  - component: selected-human-media-control
    core:
      status: implemented
      confidence: confirmed
      title: Selected Human Media Control
      summary: Normal Comms admission selects one actually accepted and heard call. Fixed radio processing derives current once-paid physical carriers. Session consent and packets remain outside deterministic state.
    architecture:
      kind: command-consumer
      authority: authoritative
      reads: [comms-inbox-state]
      writes: [ship-comms-media-intent, comms-media-current-carriers]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/comms/media_control.rs, crates/phoenix-simulation/src/comms/radio.rs]
      symbols: [ShipCommsMediaIntent, PaidMediaCarriers, accepted_call, apply_media_call_commands, derive_paid_carriers]
  - state: ship-comms-media-intent
    core:
      status: implemented
      confidence: confirmed
      title: Selected Comms Call Intent
      summary: Per-actual-radio selected accepted call identity, captured and completely folded; restoring it never restores device consent.
    architecture:
      classification: authoritative
      owner: selected-human-media-control
      writers: [selected-human-media-control]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/comms/media_control.rs, crates/phoenix-simulation/src/snapshot/comms_media.rs, crates/phoenix-simulation/src/sim_digest.rs]
      symbols: [ShipCommsMediaIntent]
  - state: comms-media-current-carriers
    core:
      status: implemented
      confidence: confirmed
      title: Current Paid Media Carriers
      summary: Current fixed-tick accepted/selected endpoint routes derived after ordinary actual radio work; cleared on restore and never saved or folded twice.
    architecture:
      classification: derived
      owner: selected-human-media-control
      writers: [selected-human-media-control]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/comms/media_control.rs, crates/phoenix-simulation/src/comms/radio.rs]
      symbols: [PaidMediaCarriers]
  - state: comms-media-session-leases
    core:
      status: implemented
      confidence: confirmed
      title: Ephemeral Device Leases
      summary: Current physical-connection and operator-bound explicit starts with bounded receiver-clock admission. Restore invalidates starts while preserving the live monotonic generation high-water.
    architecture:
      classification: transport
      owner: selected-human-media-control
      writers: [selected-human-media-control]
    implementation:
      status: declared
      paths: [crates/phoenix-simulation/src/comms/media_session.rs]
      symbols: [MediaLeases]

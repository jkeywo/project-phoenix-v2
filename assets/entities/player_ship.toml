name = "Player Ship"
tags = ["player", "ship"]

[collider]
shape = "Capsule"
radius = 3.0
length = 6.0

[hull]
hull_integrity = 100

[physics]
mass = 100.0
linear_damping = 0.9
angular_damping = 0.9
max_speed = 50.0
acceleration = 16.7
decceleration = 50.0
max_yaw_rate = 1.5708

[weapons]
phaser_range = 200.0
phaser_damage = 10
phaser_cooldown = 0.5

[weapons_console]
power_multipliers = [-0.5, 0.0, 0.25, 0.5]
beam_range = 40.0
beam_damage_per_sec = 5.0
beam_duration_secs = 6.0
cooldown_secs = 6.0
beam_color = [1.0, 0.4, 0.1, 1.0]

[science_console]
power_multipliers = [-0.5, 0.0, 0.25, 0.5]

[science_console.long_range_radar]
range = 200.0
shows = ["region", "asteroid_field", "asteroid", "ship"]

[science_console.system_map]
range = 500.0
shows = ["region", "asteroid_field", "star", "planet"]

[power]
capacity = 100.0
rates = [6.0, 5.0, 4.0, 2.0, -2.0, -6.0]
emergency_threshold = 25.0

[captain_console]

[helm_console]

[engineering_console]

[stations]
min_players = 1
max_players = 6

# 1P: solo crew — captain handles everything including comms.
[[stations.1]]
name = "Captain"
description = "Solo crew: pilot, fight, command, and hail contacts."
consoles = ["CaptainChair", "Helm", "Tactical", "Repair", "Power", "Science", "Comms"]
rank = "Cpt."
next = "Helm"

# 2P: command bridge + tactical ops. Comms bundles with the bridge.
[[stations.2]]
name = "Helm"
description = "Pilot the ship, command the bridge, and manage comms."
consoles = ["CaptainChair", "Helm", "Comms"]
rank = "Cpt."
next = "Helm"
previous = "Captain"

[[stations.2]]
name = "Tactical"
description = "Weapons, damage control, and power management."
consoles = ["Tactical", "Repair", "Power", "Science"]
rank = "Ltn."

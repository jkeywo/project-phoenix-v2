# Probe world for issue #1037 — a radiation storm as authored regions, end to
# end.
#
# The storm is not a system. It is `region_radiation_band.toml` spawned on a
# named deadline (#1024), doing what its five composed effects do, and retired
# with `destroy_entity` (#1033) — and this world is that claim run past every
# consequence it has. Nothing here needs a hazard subsystem to exist, and the
# absence is the point: if a band could only be made to sweep by adding one, this
# file could not have been written.
#
# ── The four experiments, and the control each one needs ─────────────────────
#
# Every claim is a COMPARISON, so every pair differs in exactly one fact.
#
#   tug_storm     tows   hulk_storm   INSIDE a band   -> half rate, twice as long
#   tug_clear     tows   hulk_clear   3 km clear      -> full rate  (the control)
#
#   loiterer      an Alliance Courier that never leaves the band    -> DESTROYED
#   crosser       the SAME hull, moved out at the authored crossing
#                 time by the test, which is the honest analogue of
#                 helm flying through                              -> survives
#   bystander     the same hull again, 3 km from anything           -> untouched
#
# The pair are COURIERS rather than the destroyer the mission actually fields,
# and only because 200 hull points die of this band in about eighty-six seconds
# where 300 take over two minutes: the claim is about the RATIO between crossing
# one and living in one, and a probe that took half again as long to make it
# would be measuring the same thing more expensively.
# `region_radiation_band.toml` carries the destroyer's own arithmetic.
#
# The bystander is the control the damage pair needs: without it, "the band
# killed the loiterer" is satisfied just as well by "something in this world
# kills couriers". Nothing here is hostile to anything — the tugs and the
# couriers are Alliance, the hulks are Requiem and neutral to everyone — so a
# run that produces a shot has gone wrong and every hull that dies died of
# weather.
#
# RANGES ARE DELIBERATELY GENEROUS on the tow capabilities, for
# `probe_operations`' reason: every operator is on AI backfill and will drift,
# and this is a probe of a storm rather than of station-keeping.
#
# ── The authored timeline, in mission seconds ────────────────────────────────
#
#   t=2    the `storm_front` deadline fires. `on_storm_front` spawns the TOW
#          band over the tow pair, into the `storm_bands` group, and schedules
#          its own retirement 18 seconds out through
#          `ctx.schedule.in_seconds(18).destroy_entity(…)`. A band that is
#          spawned and never retired is a wall; the schedule is what makes this
#          a sweep.
#   t=3    the `storm_dwell` deadline fires and spawns the DWELL band over the
#          damage pair, into the same group, retiring 97 seconds out. Two bands
#          in one group, retired 80 seconds apart, is what gives the group
#          assertion something to be wrong about.
#   t=4    both tows open. The clear one runs at full rate; the storm one runs at
#          the 50 % its capability authors for `region_effect = "slow_zone"`.
#   t=16   the clear tow completes — 12 authored seconds, uninterrupted — and
#          pays its `condition_on_complete` into `hulk_clear`, taking that craft
#          over its own authored threshold. THE FLAG IS THE COMPLETION SIGNAL:
#          there is no "operation completed" trigger, so a scenario that needs
#          to know a tow landed hangs `on_flag_set` off the condition threshold
#          the payout crosses. Falling Skyway's rescue is built on exactly this.
#   t=20   the tow band is retired. The storm tow's rate returns to FULL on the
#          next tick, with nothing in the destroy path knowing an operation was
#          running — retirement has a LIVE consequence, not merely an absent
#          entity.
#   t=24   the storm tow completes: 16 seconds at half rate banked 8, and the
#          4 seconds after the band lifted banked the other 4. Eight seconds
#          later than its control, which is the storm in one number.
#   t~89   the loiterer's 200 hull points are gone at the band's effective two
#          and a half points a second, and it is destroyed. The crosser, moved
#          out by the test at the authored crossing time, is not. Eleven seconds
#          of margin before the band goes, so the claim is that the STORM killed
#          it rather than that the run happened to end in the right order.
#   t=100  the dwell band is retired. NOW `on_all_destroyed("storm_bands")`
#          fires: the corridor is clear, no region entity is left behind, and
#          the sweep is over.
#
# Every handler writes a counter flag, so the headless test reads fire ORDER and
# fire COUNT out of the flag store rather than out of a log line.
#
# BASELINE (this world is new in #1037, so this is its first recorded digest).
# It needs a LONG run — a full sweep cycle is 100 seconds, and a digest taken
# before the last band retires would be a digest of a storm that never ended:
#
#   phoenix-headless --world assets/worlds/probe_storm.toml \
#     --seed 42 --ticks 6480 --digest-every 0 --record target/probe_storm.ron
#
# 6,480 frames at the default 60 Hz is 108 mission seconds, which covers the
# whole timeline above with eight seconds to spare. Final digest
# 0x9eaed55cc50999bc (11434311098359716284), and 5933813739461587938
# (0x5259242847f0b3e2) at tick 0. Measured on a clean tree at the commit that
# added this line. It is a NEW number, not a preserved one — nothing to compare
# it against yet — so it is written down here to be the thing a later change is
# A/B'd against, the way the other probes' already are.
#
# What legitimately moves it: this file's entity list and positions, the
# authored condition numbers, the tow durations and payouts, the radiation
# band's own authored effects and radius, and any engine change to what the
# digest folds. What must NOT move with it is any world this one does not enter
# — combat_test 14942520827746055774 and patrol 11531679067393217131 in
# particular.
#
# MOVED IN #1052, to 0xc1034cdf5e40d79c (13908044596492949404). This world is
# the ONLY one of the fifteen measured that moved, and the mechanism is named
# and A/B'd rather than assumed: `regions::server::apply_damage_zone_damage`
# now collects its victims and sorts them by world id before it walks them,
# the pattern `server_app::handle_collisions` has used since #896. Every ship
# inside a damage zone draws from `SimStream::RegionDamage` to pick which of
# its systems absorbs the tick's damage, so the walk order decides which ship
# gets which draw — and the old order was Bevy's archetype-creation order,
# i.e. an artefact of how the world happened to spawn rather than anything
# authored. This file is the one world with several ships inside a band at the
# same time (eight hulls, two radiation bands), which is precisely why it is
# the one that moved: everywhere else there was never a second victim for the
# order to matter between.
#
# BOTH HALVES OF THE A/B ARE RECORDED. Reverting `src/regions/server.rs`
# alone, with #1052's three weapons-site sorts left in place, returns this
# digest to 11434311098359716284 exactly — so the region sort is the whole of
# the move and the beam/blaster/torpedo sorts contributed nothing here. The
# other twelve anchors and duel and rng_coverage were re-measured across the
# same change and are unmoved.
#
# No `--ship`: the player row is the headless default hull, parked 6 km from
# anything, exactly as the other probes leave it.

[global]
seed = 1037
ai_helm_tick_hz = 30.0

[player_spawn]
position = [6000.0, 0.0, 6000.0]

# The player ship. Present because a world needs one; parked far enough away
# that nothing it does reaches any band under test.
[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
id = "player-ship"
transform = { position = [6000.0, 0.0, 6000.0] }
spawn_on = "game_start"

# ── THE TOW, inside a band ───────────────────────────────────────────────────
#
# The tug sits at the band's centre so its AI drift cannot take it out of the
# thing being measured. `duration_secs = 12` is short enough that both tows
# finish well inside the run and long enough that the band's rate has somewhere
# to show.
#
# `condition_on_complete = 45` against a hulk that starts at 30 of 100 and
# authors its threshold at half: the payout is what carries the craft over the
# line, which is what makes the flag mean "the tow landed" rather than "the tow
# was asked for".

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
name = "world.probe_storm.entity.tug_storm.name"
transform = { position = [0.0, 0.0, 0.0] }
overrides = { operations = { capability = [{ verb = "tow", range = 4000.0, duration_secs = 12, power_group = "helm", min_power_level = 2, tow_offset = [0.0, 0.0, -90.0], condition_on_complete = 45.0, interrupt = [{ cause = "region", region_effect = "slow_zone", response = "slow", rate_percent = 50 }] }] } }

# The stricken craft. Three authored facts make it one:
#
#   hull_integrity 900   a bulk hull with a dead drive, not a fragile one. The
#                        DAMAGE claim is measured on the courier pair below;
#                        a hulk that burned up mid-tow would turn every tow
#                        assertion into a race with the damage rule.
#   hull_damage_share 0  its condition track is its DRIVE and rig, not its
#                        plating. Radiation scouring the hull is not what has
#                        stopped it, and at the default 1.0 the band would drag
#                        the track to zero and make the rescue unwinnable.
#   condition 30/100     under its own authored line, so the flag is DOWN from
#                        the first tick and its rise is an event.
[[entity]]
template_path = "assets/entities/ship_civilian_hauler.toml"
name = "world.probe_storm.entity.hulk_storm.name"
transform = { position = [70.0, 0.0, 0.0] }
overrides = { hull = { hull_integrity = 900.0 }, infrastructure = { condition = 30.0, hull_damage_share = 0.0, threshold = [{ flag = "probe_storm_hulk_recovered", fails_below = 0.5 }] } }

# ── THE TOW, in clear space — the control ────────────────────────────────────
#
# Same hull, same capability, same duration, same payout, same threshold shape.
# The one authored difference is that it is three kilometres from any band.

[[entity]]
template_path = "assets/entities/alliance_cruiser.toml"
name = "world.probe_storm.entity.tug_clear.name"
transform = { position = [0.0, 0.0, 3000.0] }
overrides = { operations = { capability = [{ verb = "tow", range = 4000.0, duration_secs = 12, power_group = "helm", min_power_level = 2, tow_offset = [0.0, 0.0, -90.0], condition_on_complete = 45.0, interrupt = [{ cause = "region", region_effect = "slow_zone", response = "slow", rate_percent = 50 }] }] } }

# A separate flag id from the storm hulk's: a flag name is the author's
# namespace, and two craft sharing one would be declaring a single flag between
# them and overwriting each other's answer.
[[entity]]
template_path = "assets/entities/ship_civilian_hauler.toml"
name = "world.probe_storm.entity.hulk_clear.name"
transform = { position = [70.0, 0.0, 3000.0] }
overrides = { hull = { hull_integrity = 900.0 }, infrastructure = { condition = 30.0, hull_damage_share = 0.0, threshold = [{ flag = "probe_clear_hulk_recovered", fails_below = 0.5 }] } }

# ── THE DAMAGE PAIR, and the bystander that makes it mean something ──────────
#
# Three Alliance Couriers: 200 hull points each, which at the band's effective
# two and a half points a second is eighty seconds of exposure. Two of them
# start 150 units either side of the dwell band's centre — inside, and far
# enough apart that neither is manoeuvring around the other. The courier holds
# station when nothing is hostile (`hold-station` at priority 20, and no
# standing Reach), so neither hull wanders out of the experiment on its own.

[[entity]]
template_path = "assets/entities/alliance_courier.toml"
name = "world.probe_storm.entity.loiterer.name"
transform = { position = [-150.0, 0.0, -3000.0] }

[[entity]]
template_path = "assets/entities/alliance_courier.toml"
name = "world.probe_storm.entity.crosser.name"
transform = { position = [150.0, 0.0, -3000.0] }

# Three kilometres from the dwell band and six from the tow band. If this hull
# ever loses a point, the run has proved something about this world rather than
# about the storm.
[[entity]]
template_path = "assets/entities/alliance_courier.toml"
name = "world.probe_storm.entity.bystander.name"
transform = { position = [0.0, 0.0, -6000.0] }

# ── The sweep's clock ────────────────────────────────────────────────────────
#
# Both visible: a storm a crew can see coming is the difference between weather
# and an ambush.

[[deadline]]
id = "storm_front"
label = "world.probe_storm.deadline.storm_front.label"
due_secs = 2
visible = true

[[deadline]]
id = "storm_dwell"
label = "world.probe_storm.deadline.storm_dwell.label"
due_secs = 3
visible = true

[script]
setup = """
on_deadline("storm_front", "on_storm_front");
on_deadline("storm_dwell", "on_storm_dwell");

on_timer(4, "on_begin_tows");

// The completion signal the mission is built on: a tow's payout carries its
// target over an authored condition threshold, and the threshold's flag is what
// a scenario can actually hang a handler off.
on_flag_set("probe_storm_hulk_recovered", "on_storm_hulk_recovered");
on_flag_set("probe_clear_hulk_recovered", "on_clear_hulk_recovered");

// Fires only when the LAST band goes. One of two is not the whole storm.
on_all_destroyed("storm_bands", "on_sweep_complete");

fn on_storm_front(ctx) {
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/region_radiation_band.toml",
        name: "storm_band_tow",
        position: [0, 0, 0],
        groups: ["storm_bands"],
    });
    // The band retires itself. Authored here rather than as a second deadline
    // because a band's DWELL is a property of the band, and a sweep is bands
    // that each carry their own.
    ctx.schedule.in_seconds(18).destroy_entity("storm_band_tow");

    ctx.effects.add_objective(#{
        id: "obj-recover-hulk",
        text: "world.probe_storm.objective.recover_hulk.text",
        mandatory: true,
    });
    ctx.effects.add_objective(#{
        id: "obj-sweep-clear",
        text: "world.probe_storm.objective.sweep_clear.text",
    });
    ctx.flags.increment("front_arrived", 1);
}

fn on_storm_dwell(ctx) {
    ctx.effects.spawn_entity(#{
        template_path: "assets/entities/region_radiation_band.toml",
        name: "storm_band_dwell",
        position: [0, 0, -3000],
        groups: ["storm_bands"],
    });
    ctx.schedule.in_seconds(97).destroy_entity("storm_band_dwell");
    ctx.flags.increment("dwell_arrived", 1);
}

fn on_begin_tows(ctx) {
    ctx.effects.tow(
        "world.probe_storm.entity.tug_storm.name",
        "world.probe_storm.entity.hulk_storm.name",
    );
    ctx.effects.tow(
        "world.probe_storm.entity.tug_clear.name",
        "world.probe_storm.entity.hulk_clear.name",
    );
    ctx.flags.increment("tows_begun", 1);
}

fn on_storm_hulk_recovered(ctx) {
    ctx.effects.complete_objective("obj-recover-hulk");
    ctx.flags.increment("storm_hulk_recovered", 1);
}

fn on_clear_hulk_recovered(ctx) {
    ctx.flags.increment("clear_hulk_recovered", 1);
}

fn on_sweep_complete(ctx) {
    ctx.effects.complete_objective("obj-sweep-clear");
    ctx.flags.increment("sweep_complete", 1);
}
"""

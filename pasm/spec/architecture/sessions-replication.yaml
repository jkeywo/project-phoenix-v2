entities:
  - component: session-identity-manager
    core:
      status: implemented
      confidence: confirmed
      title: Session Identity Manager
      summary: Host-owned persistent session records keyed by a client-held 32-hex session token rather than a transient rendezvous peer id or DataChannel.
      rationale:
        - Reconnect must restore a player's identity and eligible station relationship after WebRTC peer replacement.
        - "[ai] The token is 32 lowercase hex characters held primarily in sessionStorage, with a persistent localStorage copy the first tab adopts — not a UUIDv4 in localStorage, which is what AGENTS.md claimed until issue #1112 corrected it. Per-tab storage is load-bearing: two console tabs on one desktop sharing a token collapsed into one server-side player."
        - "[ai] Since #1112 the transport re-sends Identify with the same token on every automatic reconnect, so restoring the held station and pushing the current projection is the ordinary Identify path rather than a second mechanism."
    architecture:
      kind: session-manager
      authority: authoritative
      owns: [session-identity-state, session-station-ownership-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/lobby/session.rs, src/lobby/handler.rs]
      symbols: [SessionManager]
      tests: [cargo test]

  - state: session-identity-state
    core:
      status: implemented
      confidence: confirmed
      title: Session Identity State
      summary: Authoritative player identity, connection, readiness, and reconnect state keyed by session token.
    architecture:
      classification: authoritative
      owner: session-identity-manager
      writers: [session-identity-manager]
    implementation:
      status: declared
      paths: [src/lobby/session.rs]
      symbols: [SessionManager]

  - state: session-station-ownership-state
    core:
      status: implemented
      confidence: confirmed
      title: Session Station Ownership State
      summary: Authoritative mapping from connected session to claimed station; console access is derived from this mapping and ship topology.
    architecture:
      classification: authoritative
      owner: session-identity-manager
      writers: [session-identity-manager]
      replicas: [lobby-session-replica]
    implementation:
      status: declared
      paths: [src/lobby/session.rs, src/lobby/stations_config.rs, src/core/messages.rs]
      symbols: [SessionManager, Player]
      tests: [cargo test, tests/smoke/stations.spec.js]

  - component: peer-transport-bridge
    core:
      status: removed
      confidence: confirmed
      title: Peer Transport Bridge
      summary: >-
        REMOVED (issue #1112). The PeerJS-based browser host and phone-client transport bridge that
        mapped peer connections to session tokens. Its role is now rendezvous-transport-bridge,
        which owns BOTH ends of the crew transport — this entity's `runs_in` of
        phone-browser-runtime alone was always wrong, because the bridge ran host-side too.
        Retained rather than deleted so crew-transport-peerjs-to-phoenix has an origin to name.
      rationale:
        - "[ai] It also duplicated client-network-interface in engineering-damage.yaml, which described the same client transport from another slice's point of view. WRITING_PASM §2.6 forbids duplicate truth; #1112 resolved it by giving rendezvous-transport-bridge the transport and leaving the other entity the client command gateway it actually is."
    architecture:
      kind: transport-adapter
      authority: non-authoritative

  - migration: crew-transport-peerjs-to-phoenix
    core:
      status: implemented
      confidence: confirmed
      title: Crew Transport — PeerJS to Phoenix
      summary: >-
        Issue #1112's cutover of the complete browser crew star from PeerJS and its public cloud
        broker onto the Phoenix rendezvous service and direct WebRTC DataChannels. One transport,
        no flag: the CDN script tags, the peer-id-in-the-URL-fragment mechanic, the
        ConnectionManager lifecycle, the ?rendezvous opt-in and the BroadcastChannel peerjs-shim
        are all gone.
      rationale:
        - Mandated by p2p-delta-transport-is-a-star-today — Phoenix replaces PeerJS rather than layering more product behaviour onto a public broker.
        - "[ai] Complete rather than adapter-shaped, because there was nothing left to adapt: the JS-to-WASM networking surface is three functions that never knew what a peer was, so retiring the transport touched no Rust beyond the version-pin flip in join-compatibility-gate."
        - "[ai] gui/host-peer-routing.js survived verbatim — its isOpen() already accepted a raw RTCDataChannel as well as a PeerJS DataConnection, so the outbound router needed no change at all."
        - "[ai] gui/connection-manager.js kept its name and its ICE/timing exports and lost only the ConnectionManager class; the reconnect, backoff and snapshot-channel behaviour it carried moved into the joiner half of gui/rendezvous-transport.js, so there is one connection lifecycle instead of two."
        - "[ai] The smoke suite's PeerJS shim went with it. tests/smoke/rendezvous-shim.js is now the ONE transport stand-in, behind the tests/smoke/transport-fixture.js seam, so the ~40 specs that take a test client did not change."
        - "[ai] REPLACES peer-transport-bridge (this slice, now `removed`); TARGET is rendezvous-transport-bridge in architecture/rendezvous-transport.yaml. Written as prose rather than WRITING_PASM §10's `replaces:`/`target:`/`removal_conditions:` keys because the pinned pasm schema rejects those as unknown fields under `architecture:` and reads a second `migration:` block as a duplicate key — the guide's §10 example does not validate against the tool this repo runs. Removal conditions, for the record: no `ConnectionManager` class and no `window.Peer` anywhere in the tree."
    implementation:
      legacy_paths: [gui/connection-manager.js]
      target_paths:
        - gui/rendezvous-transport.js
        - gui/rendezvous-protocol.js
        - server.html
        - client.html
        - tests/smoke/rendezvous-shim.js
        - tests/smoke/transport-fixture.js

  - message: session-identify-command
    core:
      status: implemented
      confidence: confirmed
      title: Session Identify Command
      summary: >-
        Client reconnect handshake carrying persistent token and player name to establish or restore
        a host session. Sent on the reliable DataChannel, and only after the host's compatibility
        gate has accepted the joining build.
      rationale:
        - "[ai] Re-sent on EVERY reconnect since #1112, not only the first channel open: the host restores seat, rating and projection from the token each time it arrives, which is what makes an automatic reconnect resume the same station without the guest re-entering a join code."
    architecture:
      authority: request
      producer: [rendezvous-transport-bridge]
      consumer: [session-identity-manager]
      validator: [session-identity-manager]
      trust_boundary: client-to-host
      payload: Identify
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/lobby/handler.rs, gui/rendezvous-transport.js]
      messages: [Identify, Welcome]
      tests: [cargo test, tests/client/rendezvous-transport.test.js]

  - component: station-claim-router
    core:
      status: implemented
      confidence: confirmed
      title: Station Claim Router
      summary: Authoritative lobby and mid-game router for selecting, releasing, and broadcasting station assignments.
    architecture:
      kind: command-handler
      authority: authoritative
      writes: [session-station-ownership-state]
      reads: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/lobby/handler.rs, src/lobby/stations_config.rs, src/lobby/server.rs]
      messages: [SelectStation, ReleaseStation, StationAssigned]
      tests: [cargo test, tests/smoke/stations.spec.js]

  - component: host-state-broadcaster
    core:
      status: implemented
      confidence: confirmed
      title: Host State Broadcaster
      summary: Host-side broadcaster that emits phase-gated, audience-scoped snapshots and reliable events from authoritative simulation and lobby state.
      rationale:
        - Simulation producers choose Snapshot or Reliable at the point where cadence and loss semantics are known. SimOutbox stores that producer-owned class behind explicit push_snapshot/push_reliable insertion methods; its raw queue is private and the forwarding broadcaster never classifies by payload variant.
        - Reconnect projections are latest-state snapshots targeted at the reconnecting token. Entity-lifecycle, combat, comms, objective, and scenario events remain reliable because losing one is not repaired by the next periodic projection.
        - Replication owners register cache resets and reconnect projection functions under stable semantic keys. The generic runner invokes those adapters in lexical key order and supplies the reconnecting token target without knowing cache resources or message variants.
    architecture:
      kind: replication-service
      authority: authoritative
      owns: [runtime-entity-projection-state]
      produces: [lobby-session-replica, simulation-state-replica]
      reads: [session-identity-state, session-station-ownership-state]
      depends_on: [replication-lifecycle-registry]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/core/broadcast, src/core/broadcast/lifecycle.rs, src/server_app/components.rs, src/server_app/broadcast_publish.rs, src/lobby/server.rs, src/server/bridge.rs]
      symbols: [SimBroadcaster, LobbyBroadcaster, SimOutbox, push_snapshot, push_reliable, Audience, Cadence, reconnect_registered_replication, reset_registered_replication, resync_registered_replication_for_token]
      tests: [cargo test, tests/smoke/snapshot-channel.spec.js]

  - component: replication-lifecycle-registry
    core:
      status: implemented
      confidence: confirmed
      title: Replication Lifecycle Registry
      summary: Stable-keyed host catalogue through which each replication owner contributes its run reset and targeted reconnect projection beside its live publisher.
      rationale:
        - A BTreeMap orders adapters by semantic owner key, so plugin insertion order cannot change the sequence of reconnect snapshots.
        - Adapters may register reset only, reconnect only, or both. This keeps UUID pruning specialized rather than inventing a generic lifecycle operation that unrelated caches do not have.
        - The Blackboard adapter owns LastBroadcastBlackboards and the per-recipient Repair projection cache. Its reconnect projection sorts every current SystemId, applies the same Repair visibility function as the live path, and reads but never mutates either cache.
        - The entity-state adapter is registered beside sim_state_broadcaster under the stable `entity-state` key. It owns LastBroadcastEntityPositions and LastBroadcastEntityHealth and resets them at a run boundary; it has no reconnect projector because Welcome already carries the current world snapshot. UUID pruning remains an explicit owner operation called only from entity-despawn paths.
        - The Hull adapter is registered by the Repair owner under the stable `hull` key. It owns LastBroadcastHull, reuses HullVisibility for live and reconnect projection, and never mutates the token-keyed live delta cache while reconstructing one session.
        - The Shields adapter is registered by ShipShieldsPlugin under the stable `shields` key. It owns no cache and reuses the sole live publisher's current ShieldStatus builder and authored HoldingSystem audience, returning a reconnect projection only for that resolved holder.
        - The Weapons adapter is registered by WeaponsPlugin under the stable `weapons` key. It owns LastWeaponsUpdate and WeaponsUpdateFirstTick, resets the last-value cache and rearms the first-projection latch at every run boundary, resolves the authored Weapons Station and current holder by the same rule as the live HoldingWeapons audience, and rebuilds the live WeaponsUpdate for reconnect without reading or mutating either publisher cache.
    architecture:
      kind: replication-registry
      authority: authoritative
      reads: [session-identity-state, session-station-ownership-state, ship-station-system-topology-state, ship-system-blackboards-state, authoritative-ship-motion-state, authoritative-damage-state, repair-team-state, shield-arc-state, weapons-target-state, phaser-beam-state, blaster-projectile-state, torpedo-state]
      produces: [simulation-state-replica]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/core/broadcast/lifecycle.rs, src/server_app/broadcast.rs, src/server_app/broadcast_publish.rs, src/console/repair/visibility.rs, src/console/repair/server.rs, src/ship/shields.rs, src/console/weapons/blackboard.rs, src/console/weapons/server.rs]
      symbols: [ReplicationLifecycleRegistry, ReplicationLifecycleAdapter, RegisterReplicationLifecycle, LastBroadcastBlackboards, LastBroadcastEntityPositions, LastBroadcastEntityHealth, LastBroadcastHull, LastWeaponsUpdate, WeaponsUpdateFirstTick, register_entity_state_replication_lifecycle, prune_entity_replication_caches, register_hull_replication_lifecycle, register_shields_replication_lifecycle, register_weapons_replication_lifecycle]
      messages: [BlackboardUpdate, SystemHullUpdate, ShieldStatus, WeaponsUpdate]
      tests: [cargo test]

  - state: lobby-session-replica
    core:
      status: implemented
      confidence: confirmed
      title: Lobby Session Replica
      summary: Replicated lobby projection of players, readiness, station assignments, and scenario/loading signals.
    architecture:
      classification: replicated
      owner: host-state-broadcaster
      derived_from: [session-identity-state, session-station-ownership-state, game-phase-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/lobby-state.js]
      messages: [Welcome, PlayerJoined, StationAssigned, ReadyChanged]
      tests: [tests/client/lobby-state.test.js, tests/smoke/lobby.spec.js]

  - state: simulation-state-replica
    core:
      status: implemented
      confidence: confirmed
      title: Simulation State Replica
      summary: Replicated state and event stream used by console clients and late-join reconstruction; it never grants client simulation authority.
    architecture:
      classification: replicated
      owner: host-state-broadcaster
      derived_from: [ship-system-blackboards-state, authoritative-damage-state, world-configuration-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, gui/sim-state.js, gui/console-state.js]
      messages: [SimState, BlackboardUpdate, EntitySpawned, EntityDespawned]
      tests: [tests/client/sim-state.test.js, tests/smoke/snapshot-channel.spec.js]

entities:
  - component: navigation-waypoint-controller
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Waypoint Controller
      summary: Owns each ship's free or entity-anchored navigation waypoint, applying admitted set and clear commands — from a human console OR the Navigation AI operator, symmetrically — and driving the same Channel-3 NavigateTo clearance to the Helm station.
      rationale:
        - "A waypoint reaches the AI Helm identically no matter who set it (AGENTS.md rule 6): the single admitted applier (`handle_navigation_waypoint`) writes the shared component for BOTH sources — the human `SetNavigationWaypoint` and the Navigation AI's admitted emission (issue #830) — and the shared issuer enqueues the clearance, so the message, the delivery lag, and the HelmWaypointClearance latch are the same. Previously the AI wrote the waypoint component directly, bypassing admission."
        - "Issue #830 moved the applier from Input into Physics `.after(operate_navigation_ai)`: admission clears AdmittedCommands once per tick before Input, so the AI operator's same-tick emission must be applied after it in Physics. The clearance issuer is pinned `.after(handle_navigation_waypoint)` so a waypoint set this tick — by either writer — gets its clearance this tick (the #702 shared-issuer invariant)."
        - The sender origin is derived from the navigation system's resolved control source, like every other post-admission enqueuer, not assumed from the wire path. Clearing needs no clearance message because a cleared waypoint leaves the Helm nothing to follow.
    architecture:
      kind: control-handler
      authority: authoritative
      owns: [navigation-waypoint-state, navigation-clearance-issue-state]
      reads: [system-control-source-state]
      writes: [navigation-waypoint-state, navigation-clearance-issue-state]
      consumes: [system-control-command]
      coordinates: [coordination-lag-router]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs, gui/components/ph-navigation-map.js]
      symbols: [enqueue_navigate_to_clearance]
      tests: [cargo test, npx vitest run]

  - state: navigation-waypoint-state
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Waypoint State
      summary: "Per-ship current waypoint: a fixed X/Z position or an entity UUID whose live position is followed until that entity despawns. Snapshot format 14 carries the stable UUID/scalar projection and exact monotonic generation, including a present default component."
    architecture:
      classification: authoritative
      owner: navigation-waypoint-controller
      # Issue #830: the Navigation AI no longer writes this state directly — it
      # emits an admitted system-control-command that the controller applies, so
      # the controller is the sole writer.
      writers: [navigation-waypoint-controller]
      replicas: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs]
      symbols: [NavigationWaypoint, WaypointMode]

  - state: navigation-clearance-issue-state
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Clearance Issue State
      summary: Exactly-once issuer memory for the last enqueued waypoint generation plus the prior Helm-axis AI-control edge. Snapshot format 14 replaces both scalars, including a present default component.
    architecture:
      classification: authoritative
      owner: navigation-waypoint-controller
      writers: [navigation-waypoint-controller]
      derived_from: [navigation-waypoint-state, system-control-source-state]
    implementation:
      status: declared
      paths: [src/console/navigation/server.rs, src/snapshot.rs]
      symbols: [NavClearanceIssueState, NavigationClearanceIssueState]

  - component: navigation-anchor-refresher
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Anchor Refresher
      summary: Refreshes anchored waypoint coordinates from the live target transform and automatically clears the waypoint when its target no longer exists.
    architecture:
      kind: lifecycle-controller
      authority: authoritative
      reads: [navigation-waypoint-state, spawned-entity-state]
      writes: [navigation-waypoint-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs]
      tests: [cargo test]

  - component: navigation-chart-publisher
    core:
      status: implemented
      confidence: confirmed
      title: Navigation Chart Publisher
      summary: Publishes each ship's current navigation waypoint into its own blackboard; the authored chart range and show/select filters are player-only and gated to the local ship.
      rationale:
        - "Issue #830 made this per-Ship: every ship (player + NPC) carries its own NavigationWaypoint, so the waypoint field is published for each. The chart config (range / shows / selects) is a player display surface sourced from the local ShipClientConfigResource, so it is gated on Has<LocalShip>; NPCs get the default (empty) chart config. Nothing consumes an NPC nav blackboard and the wire broadcaster is LocalShip-filtered, but the AC asks NPC ships to carry navigation blackboards."
    architecture:
      kind: blackboard-publisher
      authority: authoritative
      reads: [navigation-waypoint-state]
      writes: [ship-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs, gui/components/ph-navigation-map.js]

  - component: navigation-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Navigation AI Operator
      summary: Ranks positive Helm-relevant objective destinations and eligible chart contacts through the reusable target selector, then emits an admitted SetNavigationWaypoint / ClearNavigationWaypoint system-control-command (on change) for the waypoint controller to apply — rather than writing the waypoint state directly.
      rationale:
        - "Issue #830 (RADAR_TARGET_AUTHORITY_AND_ADMISSION.md §2): the operator kept its decision logic but now emits its decision as an admitted command through the shared validate_and_admit seam using this ship's own ai:<uuid> token, so no AI path mutates system state through a private write. Emission is on-change (compared against the current waypoint by identity) to keep AdmittedCommands clean; the applier's set is generation-idempotent. The NavigateTo clearance is issued by the shared origin-agnostic issuer, not here."
        - "Issue #778 replaced the hand-rolled objective ranking with the reusable per-system TargetSelector (per-system-target-ranking-policy, the third host after Sensors/Tactical). The operator resolves candidate destinations from two authored sources — navigation-objectives (the top positive Helm-relevant objective, a Destroy entity anchor or a Reach/Retreat/Patrol fixed world anchor) and chart-contacts (live chart entities) — and, because the selector ranks entity UUIDs while Navigation needs a Free or Anchored Waypoint, keeps a parallel uuid→WaypointMode side-table so the winning UUID recovers the waypoint variant. Fixed anchors synthesise a stable position-derived UUID (anchor:x:z); the NavigationTargetSelector component holds the authored selector and the ship power rating. The canonical eligibility keys on a `reachable` marker only objective destinations carry, so it reproduces the retired objectives-only behaviour while chart contacts stay author-enableable. The selector only ranks; the operator emits the same admitted command a human console does, so navigation-waypoint-controller remains the sole writer of navigation-waypoint-state (rule 6) and NavigateTo is neither added nor removed here."
        - "Issue #885 (411ace37 authored the block, 8555e336 deleted the fallback) removed the Rust-side default behind that component. [navigation_console.selector] is authored on every shipped hull, default_navigation_target_selector_config is deleted, and strict AI-declaration mode makes an omitted block a load error rather than a synthesised policy. The two inert params that synthesiser declared — objective_weight and chart_contact_weight — were also deleted: no guard read them, because each score term writes its magnitude directly in its own `weight` field."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, scored-objective-pool-state, radar-contact-projection-state, spawned-entity-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/navigation/mod.rs, src/core/messages.rs]
      symbols: [operate_navigation_ai, NavigationTargetSelector]
      tests: [cargo test]

  - component: civilian-order-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Civilian Order AI Operator
      summary: On the LocalShip only, consumes positive Navigation-affined Order objectives from the session-global mission pool and emits the same admitted OrderCivilian payload as the Navigation console, one target and authored route at a time.
      rationale:
        - "[ai] Issue #1141 keeps the actor boundary upstream of admission: the objective names the civilian and route, the operator calls emit_ai_command on the Navigation system, and civilian-traffic-adapter remains the sole applier. Nothing downstream asks whether a human button or Backfill produced the order."
        - "[ai] The mission objective pool is player-crew state even though viewscreen blackboards are carried per ship. The operator therefore queries With<LocalShip>: an NPC may mirror the same blackboard shape for architectural consistency, but it must never consume the player's Order objective or enqueue a second crew command. Backfill still operates normally on the unattended LocalShip."
        - "[ai] Emission is deterministic and idempotent. The scored pool already has a stable order; a craft whose authoritative CivilianState already carries the requested divert is skipped, so its acknowledgement clock is not restarted and the next cadence serves the next objective."
        - "[ai] The world must declare the route and the target must resolve to live CivilianTraffic before anything is emitted. Refusal and compliance remain authored civilian decisions in civilian-traffic-adapter, not policy invented by this operator."
    architecture:
      kind: ai-operator
      authority: authoritative
      reads: [system-control-source-state, scored-objective-pool-state, world-configuration-state, civilian-traffic-state]
      sends: [system-control-command]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/objectives.rs, src/console/navigation/server.rs]
      symbols: [operate_civilian_order_ai, AiDirective, SystemAffinity]
      tests: [cargo test, "cargo test civilian_order_ai_emits_the_console_order_through_admission", "cargo test --features headless --test headless_runner falling_skyway_backfill_orders_traffic_clear_of_all_three_bands"]

  - component: helm-shared-waypoint-consumer
    core:
      status: implemented
      confidence: confirmed
      title: Helm Shared Waypoint Consumer
      summary: Helm AI destination input that reads the authoritative shared waypoint no matter whether a human Navigation operator or Navigation AI wrote it.
      rationale:
        - "Issue #742: both the human console and navigation-ai-operator emit the same admitted SetNavigationWaypoint into the shared NavigationWaypoint, latched for the Helm through the one HelmWaypointClearance generation (rule 6 symmetry), so the consumer reads the authoritative waypoint without branching on origin. cleared_nav_waypoint withholds the waypoint until the Channel-3 clearance latches its generation; build_helm_ai_surfaces_frame carries the cleared waypoint into the per-ship frame; helm_motion_planner turns it into the desired-motion contract's forward travel via helm_ai_decision."
        - "Issue #1256: the generic lag router now stops at DeliveredCoordination. HelmPlugin's receive_helm_coordination owns the NavigateTo effect, re-checks live helm-steering AI ownership (the router's representative Helm axis when axes diverge), and latches the payload's exact generation into HelmWaypointClearance. An offline thrust axis does not discard that steering-owned clearance. It remains in Modifiers after the router, so the existing Physics consumer observes it on the same following logical tick."
    architecture:
      kind: ai-input-adapter
      authority: authoritative
      owns: [helm-waypoint-clearance-state]
      reads: [navigation-waypoint-state, system-control-source-state, coordination-delivery-state]
      writes: [helm-waypoint-clearance-state, desired-motion-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/console/helm/server.rs, src/ship/helm_ai/surfaces.rs, src/ship/helm_planner.rs]
      symbols:
        - receive_helm_coordination
        - cleared_nav_waypoint
        - build_helm_ai_surfaces_frame
        - helm_ai_decision
        - helm_motion_planner
      tests: [cargo test]

  - state: helm-waypoint-clearance-state
    core:
      status: implemented
      confidence: confirmed
      title: Helm Waypoint Clearance State
      summary: Last Navigation waypoint generation delivered to and accepted by AI Helm. Snapshot format 14 replaces the optional generation, including a present empty latch.
    architecture:
      classification: authoritative
      owner: helm-shared-waypoint-consumer
      writers: [helm-shared-waypoint-consumer]
      derived_from: [coordination-delivery-state]
    implementation:
      status: declared
      paths: [src/console/helm/server.rs, src/ship/components.rs, src/snapshot.rs]
      symbols: [HelmWaypointClearance, HelmWaypointClearanceState]

  - component: civilian-traffic-adapter
    core:
      status: implemented
      confidence: confirmed
      title: Civilian Traffic Adapter
      summary: Advances each civilian craft's compliance clock once per logical tick against the live world, validates and publishes its finite authored order options, takes the orders both surfaces queue for it, mirrors the craft's PatrolCursor index onto its state, and keeps ONE doctrine objective on the hull pointed at whatever the craft is currently trying to do.
      rationale:
        - "[ai] NO SECOND STEERING IMPLEMENTATION, and that is the whole design. A civilian is an ordinary NPC hull: its doctrine is scored by aggregate_doctrine_blackboards, its winning directive is flown by plan_helm_travel, and the result reaches it as ordinary admitted SetThrust/SetSteering commands. The adapter's entire job is to keep the single `civilian-route` doctrine entry current - Patrol over the route's anchor chain, Reach for a diverted anchor, Dock for a berth, and NOTHING at all for a hold, which is how every objective-less NPC already comes to a stop."
        - "[ai] The existing PatrolCursor IS the leg pointer; the adapter mirrors its index rather than keeping a second one. Per-leg speed is that leg's authored value written onto the directive's target_speed, and an authored hold_secs dwell is the same lever set to zero - which is why a dwelling craft KEEPS its directive, and therefore its place on the lane, instead of being taken off it and put back."
        - "[ai] AiDirective::Dock is the one addition to the shared directive vocabulary, and it is a DESTINATION rather than a mover: it resolves through the same resolve_destroy_target a Destroy target does, becomes the craft's own anchored waypoint through the same operate_navigation_ai every hull already runs, and is flown by the existing Channel-3 hand-off. plan_helm_travel resolves it to None on purpose - resolving it a second time would fly a stale position and would be the second implementation this slice exists to avoid."
        - "[ai] Both order surfaces converge on one queue and neither is privileged (AGENTS.md rule 6). A console order is an admitted OrderCivilian payload on the navigation system; a script order is buffered as an ActionCmd and resolved by the applier. Both then pass through the same acknowledgement delay and the same authored disposition, so a scenario cannot remote-control traffic that a crew has to negotiate with."
        - "[ai] The human surface is finite and authored: each [civilian] may publish order_options with a stable id, strings.csv label and existing CivilianOrder. The Navigation blackboard copies those options to <ph-civilian-traffic>, whose accessible buttons submit the ordinary order_civilian action. The browser neither invents destinations nor owns scenario policy."
        - "[ai] Runs in SimSet::Input, so a console order admitted this tick is acted on this tick and the doctrine entry it produces is in place before PublishAggregate scores the pool. A scripted order is one tick later by construction - its applier runs in Physics - which is the same one-tick bridge every other world-event consumer rides."
        - "[ai] Craft are walked in UUID order, never query order: Bevy archetype order is not part of the simulation's contract, and two craft racing for the same order would otherwise resolve differently on two hosts."
    architecture:
      kind: subsystem
      authority: authoritative
      owns: [civilian-traffic-state]
      reads: [world-configuration-state, navigation-waypoint-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths:
        - src/civilian/traffic.rs
        - src/civilian/server.rs
        - src/core/messages.rs
        - src/world/config.rs
        - src/world/validate.rs
        - src/world/dispatch.rs
        - src/world/script/effects.rs
        - src/console/navigation/mod.rs
        - src/console/navigation/server.rs
        - gui/components/ph-civilian-traffic.js
        - gui/action-map.js
      symbols:
        - RouteConfig
        - RouteLeg
        - RouteCompletion
        - CivilianConfig
        - CivilianOrder
        - CivilianOrderOption
        - CivilianOrderOptionSnapshot
        - OrderKind
        - OrderResponse
        - ComplianceDisposition
        - CivilianTravel
        - CivilianSection
        - CivilianPlugin
        - PendingCivilianOrder
        - tick_civilian_traffic
        - CIVILIAN_ROUTE_OBJECTIVE_ID
      tests: [cargo test, npm run test:editor, "cargo test --features headless --test headless_runner civilian_orders_walk", "cargo test --features headless --test headless_runner falling_skyway_ordered_traffic"]
    evidence:
      - kind: test
        reference: "tests/headless_runner.rs::civilian_orders_walk_the_compliance_machine_while_the_lane_keeps_being_flown"
        summary: "probe_civilian_traffic.toml driven for thirty mission seconds: four haulers on two authored lanes take one order each and produce all four outcomes - a complied divert, a refused divert, a complied dock, and a dock at a berth the world does not have. The craft nobody diverts flies a whole leg of its circuit, sits out the authored three-second dwell with its lane directive HELD at zero throttle, and moves on to the next leg, which is what proves the cursor is the leg pointer rather than a second one."

  - state: civilian-traffic-state
    core:
      status: implemented
      confidence: confirmed
      title: Civilian Route And Compliance State
      summary: "Per-craft traffic state: the lane it is currently assigned (which a complied divert may have changed), the leg of that lane it is flying, its standing order, where it stands with that order - received, acknowledged, complying, non_compliant or refused - the absolute SimTick that stage is due on, and any authored per-leg dwell. Authoritative: two hosts that disagreed about whether a hauler is complying would disagree about whether traffic control is working."
      rationale:
        - "[ai] FOLDED into the authoritative-state digest, in a namespace of its own, keyed on the minted entity id. Lane, leg, compliance, due tick and the order as a verb plus a destination are in; the per-leg dwell tick is NOT, because it is re-derived from the same authored hold_secs on both hosts the moment a leg is left."
        - "[ai] That namespace folds NOTHING when it is empty, which is the affordance fold_infrastructure_namespace introduced: no shipped world authors [civilian] traffic, and folding a row count for all of them would move every committed world digest over state none of them carry. As soon as one craft exists the count is in the accumulator like everyone else's."
        - "[ai] Snapshotted WHOLE rather than as a projection, because the parts are one fact about a negotiation in progress. Restore the order without the compliance state and a craft that had already refused starts obeying; restore the compliance state without the due tick and a craft frozen mid-acknowledgement answers on the first tick after a resume, or never answers at all."
        - "[ai] REFUSED and NON_COMPLIANT are deliberately different states and a console must be able to tell them apart: a refusal is a DECISION (declined, and carried on down its own lane), non-compliance is a FAILURE (agreed, set off, and the world moved). Only the second needs a crew."
        - "[ai] The authored route ASSIGNMENT is not part of this state - CivilianSection carries it and is re-derived from the entity TOML at spawn. What this carries is the lane the craft is currently on."
    architecture:
      classification: authoritative
      owner: civilian-traffic-adapter
      writers: [civilian-traffic-adapter]
      replicas: [civilian-traffic-published-state]
    implementation:
      status: declared
      paths: [src/civilian/traffic.rs, src/civilian/server.rs]
      symbols:
        - CivilianState
        - CivilianTraffic
        - ComplianceState
        - ComplianceTransition
        - REASON_UNABLE
      tests: [cargo test, "cargo test --features headless --test snapshot_resume civilians"]
    evidence:
      - kind: test
        reference: "tests/snapshot_resume.rs::the_resumed_world_keeps_a_civilians_lane_order_and_place_in_the_negotiation"
        summary: "A capture taken while at least one craft is still mid-negotiation, asserted as an explicit precondition, restored into a freshly booted world whose traffic is provably unordered, and compared field for field. SNAPSHOT_FORMAT stays at 5: a save lacking the field is a save of a world written before it existed, and a world gains traffic by gaining a [civilian] table and [[route]] blocks, both of which move content_digest and get the older save refused as content-moved long before this field is read."

  - state: civilian-traffic-published-state
    core:
      status: implemented
      confidence: confirmed
      title: Published Civilian Traffic State
      summary: The Navigation console's traffic picture - per craft, its uuid, its crew-facing name id, its lane and which leg of how many, its standing order and destination, its compliance state, the reason id behind a refusal or a failure, and its finite authored order options. Carried on the local ship's NavigationBlackboard in UUID order, and empty for every world that authors no traffic.
      rationale:
        - "[ai] Carried ONLY on the local ship's blackboard: this is the crew's traffic picture, and an NPC's own Navigation blackboard has no console to render it on."
        - "[ai] There is deliberately no position on the row. A civilian is already a contact on the nav chart, and a second copy of its coordinates on a different cadence is how two readouts of the same ship end up disagreeing."
        - "[ai] Compliance is published rather than inferred client-side, because 'has not started turning yet' and 'has decided not to' look identical on a chart."
        - "[ai] Order options are authoritative projection, not client configuration: the snapshot carries each stable id, strings.csv label and CivilianOrder whole, and the browser can only submit a control the world offered."
    architecture:
      classification: client-projection
      owner: civilian-traffic-adapter
      writers: [civilian-traffic-adapter]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/console/navigation/server.rs, gui/components/ph-civilian-traffic.js, gui/action-map.js]
      symbols:
        - CivilianTrafficSnapshot
        - CivilianOrderOptionSnapshot
        - publish_navigation_blackboard
      tests: [cargo test, "npx vitest run tests/client/ph-civilian-traffic.test.js"]

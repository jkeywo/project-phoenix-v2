# btf_path_c.toml — Soldier branch: Attack on Ironveil
# Loaded when the crew attacks Ironveil (root world trigger: on_attacked Ironveil).

# ── Triggers ──────────────────────────────────────────────────────────────────

[[trigger]]
condition = "on_destroyed"
entity    = "world.entity.ironveil.name"

  [[trigger.action]]
  type      = "add_objective"
  id        = "obj-harrow-orders"
  text      = "world.btf_path_c.trigger.action.obj_harrow_orders.text"
  mandatory = false

# ── Comms templates ───────────────────────────────────────────────────────────

[[comms]]
thread_id = "path-c-internal"
from    = "world.btf_path_c.comms.path_c_internal.from"
trigger = "on_world_loaded"
urgent  = true
message = "world.btf_path_c.comms.path_c_internal.message"

[[comms]]
thread_id = "path-c-internal"
from    = "world.btf_path_c.comms.path_c_internal.from_2"
trigger = "on_destroyed"
entity  = "world.entity.ironveil.name"
urgent  = true
message = "world.btf_path_c.comms.path_c_internal.message_2"

[package]
name = "phoenix-model"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[features]
ecs = ["dep:bevy_ecs", "dep:bevy_state"]

[dependencies]
strum = { version = "0.28.0", features = ["derive"] }
phoenix-transport = { path = "../phoenix-transport" }
bevy_ecs = { version = "0.18.1", default-features = false, optional = true }
bevy_state = { version = "0.18.1", default-features = false, optional = true }
uuid = { version = "1.23.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

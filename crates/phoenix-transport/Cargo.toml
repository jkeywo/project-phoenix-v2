[package]
name = "phoenix-transport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Game-independent transport vocabulary and connection ownership"
[features]
test-support = []
native = ["dep:tungstenite"]

[dependencies]
serde_json = "1.0.149"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.28", optional = true, default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

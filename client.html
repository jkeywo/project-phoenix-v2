<body>
  <!-- UI click sound (played from JS). -->
  <audio id="ui-click" src="assets/sounds/ui_click.ogg"></audio>

  <!-- This is a pure-JS console (issue #463): no client-side WASM. The page
       and its assets are shipped to dist/client/ by scripts/build-client.mjs
       (npm run build:client) — a plain file copy, NOT a Trunk build, because
       Trunk would implicitly compile the crate's default (server) lib into a
       WASM bundle and inject a loader even with no `rel="rust"` link.
       All client state lives in the gui/*.js modules loaded in <head>. -->

  <!-- Console container: full-screen flex layout host for all in-game
       console sections. [data-orientation] drives portrait (column) vs
       landscape (row) styling in console CSS; set by render() on each paint. -->
  <div id="console-container" data-orientation="portrait">

    <section id="lobby-ui">
      <!-- Ship header -->
      <div id="lobby-header">
        <div id="ship-info">
          <div id="ship-name" data-i18n="client.default_ship_name">Phoenix</div>
          <div id="ship-mission" data-i18n="client.standing_by">Standing by</div>
        </div>
        <div id="crew-ready">
          <span id="crew-display">0/0</span>
          <span id="ready-pill" data-i18n="client.pill_connecting">CONNECTING</span>
        </div>
      </div>

      <!-- Active mod packs the host applied (issue #990). Populated by
           renderActiveMods() from lobbyState.activePacks; empty (and hidden)
           when no packs are applied, so nothing extra renders in the base game. -->
      <div id="lobby-mods" aria-hidden="true"></div>

      <!-- Name input -->
      <div id="lobby-name-row">
        <label><span data-i18n="client.name_label">Name</span>
          <input id="name-input" type="text" placeholder="Your name" data-i18n-attr="placeholder:client.name_placeholder" autocomplete="off" />
        </label>
      </div>

      <!-- Station list -->
      <div id="station-list"></div>

      <!-- At-your-station detail panel -->
      <div id="detail-panel" class="idle">
        <div class="detail-header">
          <span class="detail-station-name" data-i18n="client.no_station">No station assigned</span>
        </div>
        <div id="detail-console-area">
          <div class="detail-consoles"></div>
          <div class="detail-ratings"></div>
        </div>
      </div>

      <!-- Footer -->
      <div id="lobby-footer">
        <span id="status-line" data-i18n="client.connecting_host">Connecting to host…</span>
        <button id="ready-btn" data-i18n="client.ready">READY</button>
      </div>
    </section>

    <!-- Console sections are mounted dynamically by mountConsoles() when a
         Welcome message arrives with ship_stations. Each section is created
         with the same id/iframe-id conventions as the static originals
         (e.g. #captain-ui / #captain-iframe) so all downstream $() references
         continue to resolve. -->
  </div>

  <div id="status" data-i18n="client.connecting">Connecting…</div>
  <div id="conn-diag"></div>

  <div id="top-bar">
    <span id="conn-label"></span>
    <span id="conn-dot"></span>
    <button id="retry-now-btn" title="Retry connection now" data-i18n="client.retry_now" data-i18n-attr="title:client.retry_now_tip">Retry now</button>
    <button id="fullscreen-btn" title="Toggle fullscreen" data-i18n-attr="title:client.fullscreen_tip">⛶</button>
  </div>

  <!-- Asset loading overlay: shown during GamePhase::Loading while the
       server pre-caches GLB models, radar icons, and rig sidecars. -->
  <div id="asset-loading">
    <div class="spinner-ring"></div>
    <span><span data-i18n="client.preparing_scenario">Preparing scenario&hellip;</span> <span class="pct" id="asset-loading-pct">0</span>%</span>
  </div>

  <!-- Game-over overlay: shown when GamePhase::GameOver. Displays either
       "Ship Destroyed" (hull death) or the scenario's game_over message. -->
  <div id="game-over-overlay">
    <div class="game-over-message" id="game-over-message"></div>
    <button id="return-to-lobby-btn" class="game-over-return-btn" data-i18n="client.return_to_lobby">Return to Lobby</button>
  </div>

  <!-- Waiting-for-scenario overlay: shown after ReturnToLobby while the
       host picks a scenario from the server's scenario-selection panel. -->
  <div id="waiting-overlay">
    <div class="spinner-ring"></div>
    <span data-i18n="client.waiting_scenario">Waiting for host to select a scenario&hellip;</span>
  </div>

  <!-- QR-first scenario/ship picker overlay (issue #755): before any world is
       loaded, the host broadcasts the pre-load catalog and any connected phone
       can make the first valid selection (first-valid-wins, no voting). -->
  <div id="scenario-picker-overlay">
    <div id="scenario-picker-heading" data-i18n="client.select_scenario">Select a scenario</div>
    <div id="scenario-picker-body"></div>
  </div>

  <!-- Top-centre coordination popup overlay (issue #494). Shown for AI-to-human
       coordination messages. Click-to-dismiss, auto-dismiss after 8s. -->
  <div id="coordination-popup" onclick="dismissCoordinationPopup()">
    <div class="popup-sender" id="popup-sender"></div>
    <div class="popup-title" id="popup-title"></div>
    <div class="popup-body" id="popup-body"></div>
  </div>

  <!-- Phone bezel frame (issue #439). CSS-only red alert glow; no images.
       The .alert-on class drives the keyframe animation (see <style>).
       Hidden by default; render() flips aria-hidden once in-game. -->
  <div id="phone-bezel" aria-hidden="true"></div>



  <script type="module">
    // Localisation bridge: the big inline script below is a classic script,
    // so it cannot import gui/strings.js. Publish the API on window and
    // substitute the static data-i18n markup once the table is loaded.
    import './gui/strings-boot.js';
    import { t, has, applyToDom } from './gui/strings.js';
    window.phStrings = { t, has, applyToDom };
    applyToDom(document);
  </script>

  <script>
    // Resolve a string id via the module bridge. Safe before modules load —
    // falls back to the raw id, and every call site re-resolves on render.
    function t(id, params) {
      return window.phStrings ? window.phStrings.t(id, params) : id;
    }
    // Station names in ShipStations are lookup identifiers; display them via
    // the derived station.<id>.name string when the table has one.
    function stationLabel(st) {
      if (!st) return '';
      const key = 'station.' + st.id + '.name';
      if (window.phStrings && window.phStrings.has(key)) return window.phStrings.t(key);
      return st.name || st.id || '';
    }

    // -- Click sound --------------------------------------------------------
    // Message types that should NOT trigger a click (continuous / connection
    // setup messages that are not the result of a deliberate button press).
    const NO_CLICK = new Set(['SetThrust', 'SetSteering', 'LateralThrustInput', 'Identify', 'SetName']);

    const CLICK_PITCH_VARIANCE = 0.08; // +/- 8% playback-rate jitter so repeated clicks don't sound identical

    function playClick() {
      const el = document.getElementById('ui-click');
      if (!el) return;
      el.currentTime = 0;
      // preservesPitch defaults to true in modern browsers, which normalizes
      // pitch back out of playbackRate changes — disable it so the rate
      // jitter below actually varies the pitch.
      el.preservesPitch = false;
      el.webkitPreservesPitch = false;
      el.mozPreservesPitch = false;
      el.playbackRate = 1 + (Math.random() * 2 - 1) * CLICK_PITCH_VARIANCE;
      el.play().catch(() => {});
    }

    // -- Connection status --------------------------------------------------

    function setConnectionStatus(state) {
      const dot = document.getElementById('conn-dot');
      const label = document.getElementById('conn-label');
      const retryBtn = document.getElementById('retry-now-btn');
      if (state === 'disconnected') {
        dot.style.background = '#f44';
        label.textContent = t('client.reconnecting'); // — reconnecting…';
        if (retryBtn) retryBtn.classList.add('visible');
      } else if (state === 'error') {
        // No permanent give-up state anymore — connection-manager keeps
        // retrying with backoff even after an 'error' signal, so this still
        // shows the retry-now affordance rather than telling the user to
        // refresh the page.
        dot.style.background = '#f44';
        label.textContent = t('client.conn_error'); // — reconnecting…';
        if (retryBtn) retryBtn.classList.add('visible');
      } else {
        dot.style.background = '#4c4';
        label.textContent = '';
        if (retryBtn) retryBtn.classList.remove('visible');
      }
    }

    // -- Screen Wake Lock (keep screen on when active) -----------------
    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      try {
        if (wakeLockSentinel) return;
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      } catch (_) {}
    }

    function releaseWakeLock() {
      if (wakeLockSentinel) { wakeLockSentinel.release(); wakeLockSentinel = null; }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });

    // -- Fullscreen controller ----------------------------------------------

    (function initFullscreen() {
      const btn = document.getElementById('fullscreen-btn');
      function syncIcon() { btn.textContent = document.fullscreenElement ? '✕' : '⛶'; }
      btn.addEventListener('click', () => {
        const p = document.fullscreenElement
          ? document.exitFullscreen()
          : document.documentElement.requestFullscreen();
        p && p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', syncIcon);
    })();

    // -- Return to Lobby (GameOver overlay button) ---------------------------
    (function initReturnToLobby() {
      const btn = document.getElementById('return-to-lobby-btn');
      if (!btn) return;
      btn.addEventListener('click', () => send('ReturnToLobby'));
    })();

    setConnectionStatus('connecting');

    // -- Retry-now control (issue #614) --------------------------------------
    // Visible only while disconnected/retrying (see setConnectionStatus).
    // Bypasses the connection manager's current backoff wait and attempts a
    // reconnect immediately.
    (function initRetryNow() {
      const btn = document.getElementById('retry-now-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (window.connectionManager && typeof window.connectionManager.retryNow === 'function') {
          window.connectionManager.retryNow();
        }
      });
    })();

    // -- Persistence ---------------------------------------------

    const NAMES = ['Vega', 'Altair', 'Rigel', 'Deneb', 'Sirius', 'Nova', 'Quasar', 'Nebula', 'Pulsar', 'Proxima'];

    function randomName() {
      return NAMES[Math.floor(Math.random() * NAMES.length)];
    }

    // Session identity is resolved per-tab by gui/session-token.js
    // (installSessionToken) just before we Identify — see the connection block
    // below. It is not resolved here because that module is deferred and has
    // not executed yet at parse time. Resolving per-tab (sessionStorage) rather
    // than per-origin (localStorage) is what lets several console tabs run on
    // one desktop without colliding on a single shared token.
    let myToken = null;

    // Display name is per-tab (sessionStorage), not per-origin (localStorage):
    // several clients on one desktop must not all default to the same name, or
    // they look like one another in the lobby. Falls back to a fresh random
    // name per tab. (Identity is the token, not the name — see myToken.)
    let myName = sessionStorage.getItem('player-name') || randomName();
    sessionStorage.setItem('player-name', myName);

    // -- State ---------------------------------------------------

    // Lobby / lifecycle mirror ONLY (players, phase, station roster, game-over
    // flags). All SIM state lives exclusively in window.simState
    // (gui/sim-state.js) — the console builders read it directly, so do NOT
    // add sim-derived fields here (issue #819 deleted the old hand-maintained
    // mirror and the flat blackboard scalars).
    const uiState = { players: [], phase: 'Lobby',
      shipStations: { stations: [] },
      stations: [], maxPlayers: 0, allFilled: false, allReady: false, countdownSecs: 0,
      shipDestroyed: false, gameOverReason: null };

    /// Currently-active console during InProgress. One human = one station
    /// (issue #827): derived by render() as mine[0] || null via
    /// reconcileActiveConsole — null for spectators and in the lobby.
    let activeConsole = null;

    /// Last red-alert value applied to the phone bezel, so the class toggle
    /// only runs when the captain blackboard's flag actually changes.
    /// (The flag itself lives in window.simState.redAlert — issue #819.)
    let bezelAlertOn = false;

    /// Console selected in the lobby detail panel. Null until the player picks one.
    /// Resets when the player releases their station.
    let lobbyConsole = null;
    /// The mounted settings panel (issue #940), or null before the connection
    /// bootstrap runs. handleMessage repaints it when `DebugState` arrives.
    let settingsPanel = null;
    let pendingMidGameClaim = false;
    // #771 AC3: a mid-round station release is a two-step arm→confirm (imitates
    // ph-comms-current-message). First click arms + swaps the button to a
    // confirm string; second click sends ReleaseStation. In-progress only —
    // lobby release stays immediate. Reset whenever we leave InProgress.
    let releaseArmed = false;

    // Single source of truth for changing the active console. Called only by
    // the render() reconciler now that the tab bar and swipe gesture are gone
    // (issue #827). No-op if the value is already current. Delegates the
    // null/undefined/"" ? next sentinel mapping to gui/lobby-state.js
    // (nextActiveConsole) so the contract is locked by Vitest.
    function setActiveConsole(name) {
      const step = (typeof window.nextActiveConsole === 'function')
        ? window.nextActiveConsole(activeConsole, name)
        : { changed: (name || null) !== activeConsole, next: name || null };
      if (!step.changed) return;
      activeConsole = step.next;
    }

    // -- Helpers -------------------------------------------------

    const $ = id => document.getElementById(id);

    function me(s) { return s.players.find(p => p.token === myToken); }
    function playerStation(s) {
      const m = me(s);
      if (!m) return null;
      return typeof m.station === 'string' ? m.station
        : (m.station && typeof m.station.id === 'string' ? m.station.id : null);
    }
    function myConsoles(s) {
      // Post issue #619 a player owns exactly one station id (or none).
      // Callers that historically wanted a "consoles" list (for the tab bar)
      // treat this as a one-element list.
      const sid = playerStation(s);
      return sid ? [sid] : [];
    }

    /// True while the lobby/station-select panel is being shown over an
    /// in-progress game: true spectators, and mid-game claimants who have
    /// picked a station but not yet pressed Ready. Single source of truth for
    /// render()'s vis.lobby override and the SimState/BlackboardUpdate
    /// render guards below — those messages arrive at ~10Hz and must skip the
    /// lobby DOM rebuild in this state, or a click on Ready/Leave can land
    /// between the old button being torn down and the new one's listener
    /// being attached.
    function showingLobbyDuringGame(s) {
      if (s.phase !== 'InProgress') return false;
      const player = me(s);
      return pendingMidGameClaim || !playerStation(s) || !!(player && !player.ready);
    }
    function isCaptain(s)     { return playerStation(s) === 'captain'; }
    function isHelm(s)        { return playerStation(s) === 'helm'; }

    function send(type, data) {
      if (!window.connectionManager || !window.connectionManager.connected) return;
      const clickType = (type === 'ControlSystem' && data && data.payload) ? data.payload.type : type;
      if (!NO_CLICK.has(clickType)) playClick();
      // Client messages (commands, lobby actions) are always reliable
      window.connectionManager.send(type, data, 'reliable');
    }

    function setStatus(text) { $('status').textContent = text; }

    // -- Phone bezel red-alert toggle (issue #439) -------------------------
    // Toggles the .alert-on class on #phone-bezel; CSS keyframes drive the
    // red glow pulse (no PNG swaps needed with the CSS-only implementation).
    function applyBezelAlert(alert) {
      const root = $('phone-bezel');
      if (root) root.classList.toggle('alert-on', !!alert);
    }



    // Console/station display label via the string table (issue #827): the
    // tab-bar CONSOLE_LABEL map is gone; station.<id>.name is the single
    // source. Falls back to the raw id before the string table loads so the
    // first paint never blanks out.
    function consoleLabel(name) {
      if (!name) return '';
      const key = 'station.' + name + '.name';
      if (window.phStrings && window.phStrings.has(key)) return window.phStrings.t(key);
      return name;
    }

    // Defer re-render so rapid server messages don't steal pointer events.
    let _renderFrame = null;
    function scheduleRender() {
      if (_renderFrame !== null) return;
      _renderFrame = requestAnimationFrame(() => {
        _renderFrame = null;
        render(uiState);
      });
    }
    // Expose so gui/device-orientation.js can coalesce its resize-driven
    // re-render through the same rAF scheduler (issue #462).
    window.scheduleRender = scheduleRender;

    // QR-first scenario/ship picker rendering (issue #755). Keyed on the
    // current stage so the DOM (and the ph-ship-picker web component) is only
    // rebuilt when the stage actually changes — the render loop runs at rAF
    // cadence and must not tear down a half-tapped picker.
    let _pickerStageKey = null;
    function renderScenarioPicker() {
      const ls = window.lobbyState;
      const body = document.getElementById('scenario-picker-body');
      const heading = document.getElementById('scenario-picker-heading');
      if (!ls || !body) return;
      const catalog = ls.scenarioCatalog || [];
      const activePacks = ls.activePacks || [];
      const locked = ls.selectionLocked || { scenario_id: null, template_path: null };

      let stage;
      if (locked.scenario_id == null) stage = 'scenario';
      else if (locked.template_path == null) stage = 'ship:' + locked.scenario_id;
      else stage = 'locked';
      // Pack count is in the key so a change to the applied mods re-renders the
      // scenario buttons' mod-origin badges (issue #990), not only a catalog
      // change (the two arrive together, but a later pack edit updates one).
      const key = stage + '|' + catalog.length + '|' + activePacks.length;
      if (key === _pickerStageKey) return;
      _pickerStageKey = key;

      body.innerHTML = '';
      if (stage === 'scenario') {
        if (heading) heading.textContent = t('client.select_scenario');
        if (catalog.length === 0) {
          const note = document.createElement('div');
          note.className = 'scenario-locked-note';
          note.textContent = t('client.waiting_scenario');
          body.appendChild(note);
          return;
        }
        for (const sc of catalog) {
          const btn = document.createElement('button');
          btn.className = 'scenario-btn';
          btn.dataset.scenarioId = sc.id;
          const title = document.createElement('div');
          title.textContent = sc.label || sc.id;
          btn.appendChild(title);
          if (sc.description) {
            const desc = document.createElement('div');
            desc.className = 'scenario-desc';
            desc.textContent = sc.description;
            btn.appendChild(desc);
          }
          // Mod-origin badge (issue #990): only a mod-supplied scenario gets one;
          // a base scenario returns null and stays unmarked.
          const badge = (typeof window.scenarioOriginBadge === 'function')
            ? window.scenarioOriginBadge(sc, activePacks) : null;
          if (badge) {
            const badgeEl = document.createElement('span');
            badgeEl.className = 'scenario-origin';
            badgeEl.textContent = t('client.scenario_mod_origin', { name: badge.name });
            btn.appendChild(badgeEl);
          }
          btn.addEventListener('click', () => {
            // Same action map as the host page — two transports (issue #755).
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_scenario', scenario_id: sc.id }, send);
            } else {
              send('SelectScenario', { scenario_id: sc.id });
            }
          });
          body.appendChild(btn);
        }
      } else if (stage.startsWith('ship:')) {
        if (heading) heading.textContent = t('client.select_ship');
        const entry = catalog.find(s => s && s.id === locked.scenario_id);
        const ships = (entry && entry.ships) || [];
        import('./gui/components/ph-ship-picker.js').then(() => {
          if (_pickerStageKey !== key) return; // stage changed meanwhile
          const picker = document.createElement('ph-ship-picker');
          body.appendChild(picker);
          picker.state = { ships };
          picker.addEventListener('ship-selected', (e) => {
            const tp = e.detail.template_path;
            if (typeof window.dispatchConsoleAction === 'function') {
              window.dispatchConsoleAction({ action: 'select_player_ship', template_path: tp }, send);
            } else {
              send('SelectPlayerShip', { template_path: tp });
            }
          });
        });
      } else {
        if (heading) heading.textContent = t('client.select_ship');
        const note = document.createElement('div');
        note.className = 'scenario-locked-note';
        note.textContent = t('client.scenario_locked');
        body.appendChild(note);
      }
    }

    function render(s) {
      // QR-first pre-scenario picker (issue #755): before any world loads, the
      // host delivers the catalog and this phone can make the first valid
      // selection. Short-circuit the normal lobby/game render while active.
      const pickerEl = document.getElementById('scenario-picker-overlay');
      const pickingScenario = !!(window.lobbyState && window.lobbyState.showScenarioPicker());
      if (pickerEl) pickerEl.style.display = pickingScenario ? 'flex' : 'none';
      if (pickingScenario) {
        $('lobby-ui').className = '';
        const bezel0 = $('phone-bezel');
        if (bezel0) bezel0.setAttribute('aria-hidden', 'true');
        renderScenarioPicker();
        return;
      }

      // Phase ? section visibility (pure JS module, gui/phase-toggle.js).
      // Falls back to a local check if the module hasn't loaded yet so the
      // first paint isn't blank — module load races init on slow networks.
      const vis = (typeof window.sectionVisibility === 'function')
        ? window.sectionVisibility(s.phase)
        : { lobby: s.phase !== 'InProgress' && s.phase !== 'GameOver',
            game: s.phase === 'InProgress' || s.phase === 'GameOver',
            bezel: s.phase === 'InProgress' || s.phase === 'GameOver' };
      const mine = myConsoles(s);
      // Spectators and pending mid-game claimants stay in the lobby. Ready is
      // the point where the server actually hands the station over from AI.
      if (showingLobbyDuringGame(s)) {
        vis.lobby = true; vis.game = false; vis.bezel = false;
      }
      const inGame = vis.game;
      $('lobby-ui').className = vis.lobby ? 'active' : '';
      // Phone bezel (issue #439) is part of the game shell only — the lobby
      // is borderless. Toggle visibility via aria-hidden so the CSS
      // [aria-hidden="true"] { display: none } rule drives the cascade.
      const bezel = $('phone-bezel');
      if (bezel) bezel.setAttribute('aria-hidden', vis.bezel ? 'false' : 'true');

      // Reconcile activeConsole with current consoles list (port of the
      // deleted Bevy reconcile_active_console — see gui/lobby-state.js).
      if (inGame) {
        const next = (typeof window.reconcileActiveConsole === 'function')
          ? window.reconcileActiveConsole(activeConsole, mine)
          : ((activeConsole && mine.includes(activeConsole)) ? activeConsole : (mine[0] || null));
        if (next !== activeConsole) setActiveConsole(next);
      } else {
        setActiveConsole(null);
      }

      // Console sections: map activeConsole → HTML section id via
      // gui/content-switcher.js, over the sections this ship actually mounts
      // (issue #827). Only the matching section gets `.active`. Sections that
      // don't exist on this ship are simply absent from the DOM; the $() call
      // returns null and is silently skipped.
      const stationIds = ((s.shipStations && s.shipStations.stations) || [])
        .map(st => st.id).filter(Boolean);
      const sections = (typeof window.consoleSections === 'function')
        ? window.consoleSections(activeConsole, inGame, stationIds)
        : Object.fromEntries(stationIds.map(id => {
            // Boot-race fallback: canonical `${id}-ui` scheme + the one
            // tactical → weapons alias (single home: gui/mount-plan.js).
            const base = id === 'tactical' ? 'weapons' : id;
            return [base + '-ui', inGame && activeConsole === id];
          }));
      for (const [sectionId, visible] of Object.entries(sections)) {
        const el = $(sectionId);
        if (el) el.className = visible ? 'console-section active' : 'console-section';
      }

      // Orientation drives console CSS via the container's data attribute.
      const orientation = (typeof window.currentOrientation === 'function')
        ? window.currentOrientation()
        : (window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait');
      const container = $('console-container');
      if (container) container.dataset.orientation = orientation;

      // Game-over overlay: covers the game shell when phase is GameOver.
      const gameOverEl = document.getElementById('game-over-overlay');
      const gameOverMsgEl = document.getElementById('game-over-message');
      if (gameOverEl && gameOverMsgEl) {
        if (s.phase === 'GameOver') {
          gameOverMsgEl.textContent = s.shipDestroyed ? t('client.ship_destroyed') : (s.gameOverReason || '');
          gameOverEl.style.display = 'flex';
        } else {
          gameOverEl.style.display = 'none';
        }
      }

      // Waiting-for-scenario overlay: shown after ReturnToLobby while the
      // host selects a scenario from the server scenario-selection panel.
      const waitingEl = document.getElementById('waiting-overlay');
      if (waitingEl) {
        waitingEl.style.display = (window.lobbyState && window.lobbyState.waitingForScenario) ? 'flex' : 'none';
      }

      if (inGame) renderGame(s);
      else if (!(window.lobbyState && window.lobbyState.waitingForScenario)) renderLobby(s);
    }

    // "Mods active" lobby list (issue #990): render the packs the host applied
    // from lobbyState.activePacks. Nothing renders (and the row is hidden) when
    // no packs are applied, so the base game shows no empty banner. Separate
    // from the station list so it survives the boot-race guard below — a mid-
    // round spectator still sees what mods the session is running.
    function renderActiveMods() {
      const el = document.getElementById('lobby-mods');
      if (!el) return;
      const rows = (typeof window.activePacksView === 'function')
        ? window.activePacksView(window.lobbyState && window.lobbyState.activePacks)
        : [];
      el.innerHTML = '';
      if (rows.length === 0) {
        el.setAttribute('aria-hidden', 'true');
        return;
      }
      el.setAttribute('aria-hidden', 'false');
      const heading = document.createElement('div');
      heading.className = 'mods-active-heading';
      heading.textContent = t('client.mods_active');
      el.appendChild(heading);
      for (const row of rows) {
        const rowEl = document.createElement('div');
        rowEl.className = 'mods-active-row';
        const nameEl = document.createElement('span');
        nameEl.className = 'mods-active-name';
        nameEl.textContent = row.name;
        rowEl.appendChild(nameEl);
        if (row.version) {
          const verEl = document.createElement('span');
          verEl.className = 'mods-active-version';
          verEl.textContent = t('client.mods_active_version', { version: row.version });
          rowEl.appendChild(verEl);
        }
        el.appendChild(rowEl);
      }
    }

    function renderLobby(s) {
      renderActiveMods();
      const list = document.getElementById('station-list');
      if (!list) return;
      // Pure selectors live in gui/lobby-view.js (issue #827); this function
      // only writes DOM. Boot race: skip the paint until the module loads —
      // the next server message re-renders.
      if (typeof window.lobbyViewModel !== 'function') return;
      const vm = window.lobbyViewModel(s, myToken, lobbyConsole, {
        labelFor: stationLabel,
        stationRatings: window.simState ? window.simState.stationRatings : null,
      });
      // Detail-panel console auto-select (and clear on release) is part of
      // the view model.
      lobbyConsole = vm.selectedConsole;
      const mine = myConsoles(s);
      // #771 AC3/AC4: the armed-release confirm only exists in-progress; leaving
      // InProgress (or never being in it) disarms so lobby release is immediate.
      const inProgress = s.phase === 'InProgress';
      if (!inProgress) releaseArmed = false;
      // Shared by the row RELEASE and detail LEAVE controls. In-progress: first
      // click arms (re-render swaps to the confirm label), second click sends.
      // Lobby: immediate send. Preserves the pendingMidGameClaim reset either way.
      const releaseStation = () => {
        const step = window.releaseConfirmStep(s.phase, releaseArmed);
        releaseArmed = step.armed;
        if (!step.send) {
          scheduleRender();
          return;
        }
        pendingMidGameClaim = false;
        send('ReleaseStation');
      };

      // Station help lives in Settings; keep the lobby roster visible.
      list.style.display = '';

      list.innerHTML = '';
      for (const row of vm.rows) {
        const rowEl = document.createElement('div');
        rowEl.className = row.rowClass;

        const glyph = document.createElement('div');
        glyph.className = 'glyph';
        glyph.textContent = row.glyph;
        rowEl.appendChild(glyph);

        const info = document.createElement('div');
        info.className = 'info';
        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = row.label;
        info.appendChild(nameEl);
        const meta = document.createElement('div');
        meta.className = 'meta';
        if (row.rank) {
          const rankEl = document.createElement('span');
          rankEl.textContent = row.rank;
          meta.appendChild(rankEl);
        }
        // Post issue #619 a station carries a single (lowercase) id — the
        // station itself is the "console" for chip-rendering purposes.
        if (row.chipId) {
          const chip = document.createElement('span');
          chip.className = 'cons';
          chip.textContent = consoleLabel(row.chipId);
          meta.appendChild(chip);
        }
        info.appendChild(meta);
        if (row.occupant) {
          const occ = document.createElement('div');
          occ.className = 'occupant';
          occ.textContent = row.occupant;
          info.appendChild(occ);
        }
        rowEl.appendChild(info);

        const action = document.createElement('div');
        action.className = 'action';
        const btn = document.createElement('button');
        if (row.button === 'release') {
          btn.className = 'mine-btn';
          btn.textContent = inProgress && releaseArmed ? t('client.release_confirm') : t('client.release');
          btn.addEventListener('click', () => releaseStation());
        } else if (row.button === 'taken') {
          btn.className = 'taken-btn';
          btn.textContent = t('client.taken');
          btn.disabled = true;
        } else {
          btn.className = 'claim-btn';
          btn.textContent = t('client.claim');
          btn.addEventListener('click', () => {
            if (uiState.phase === 'InProgress') pendingMidGameClaim = true;
            send('SelectStation', { station: row.name });
            scheduleRender();
          });
        }
        action.appendChild(btn);
        rowEl.appendChild(action);
        list.appendChild(rowEl);
      }

      // Detail panel
      const detail = document.getElementById('detail-panel');
      if (detail) {
        const detailHeader = detail.querySelector('.detail-header');
        if (vm.detail.active) {
          detail.className = 'active';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = vm.detail.stationName;
          detailHeader.appendChild(nameSpan);
          const releaseBtn = document.createElement('button');
          releaseBtn.className = 'detail-release-btn';
          releaseBtn.textContent = inProgress && releaseArmed ? t('client.release_confirm') : t('client.leave');
          releaseBtn.addEventListener('click', () => releaseStation());
          detailHeader.appendChild(releaseBtn);
          const consolesArea = detail.querySelector('.detail-consoles');
          consolesArea.innerHTML = '';
          for (const c of vm.detail.consoles) {
            const chip = document.createElement('span');
            chip.className = 'chip' + (c === lobbyConsole ? ' selected' : '');
            chip.textContent = consoleLabel(c);
            chip.addEventListener('click', () => {
              lobbyConsole = c;
              scheduleRender();
            });
            consolesArea.appendChild(chip);
          }

          // Complexity toggle: purely data-driven off the station's declared
          // ratings (the view model omits it when the station only has its
          // base rating).
          const ratingsArea = detail.querySelector('.detail-ratings');
          ratingsArea.innerHTML = '';
          if (vm.detail.ratings) {
            const activeRating = vm.detail.ratings.active;
            for (const r of vm.detail.ratings.list) {
              const ratingBtn = document.createElement('button');
              ratingBtn.className = 'rating-btn' + (r === activeRating ? ' active' : '');
              ratingBtn.textContent = (window.phStrings && window.phStrings.has('station.rating.' + r.toLowerCase() + '.name')) ? t('station.rating.' + r.toLowerCase() + '.name') : r.toUpperCase();
              ratingBtn.addEventListener('click', () => {
                if (r !== activeRating) send('SetStationRating', { rating_name: r });
              });
              ratingsArea.appendChild(ratingBtn);
            }
          }
        } else {
          detail.className = 'idle';
          detailHeader.innerHTML = '';
          const nameSpan = document.createElement('span');
          nameSpan.className = 'detail-station-name';
          nameSpan.textContent = t('client.no_station');
          detailHeader.appendChild(nameSpan);
          detail.querySelector('.detail-consoles').innerHTML = '';
          detail.querySelector('.detail-ratings').innerHTML = '';
        }
      }

      // Header
      const crewEl = document.getElementById('crew-display');
      if (crewEl) crewEl.textContent = vm.crew.filled + '/' + vm.crew.max;
      const pill = document.getElementById('ready-pill');
      if (pill) {
        if (vm.allReady) { pill.textContent = t('client.all_crew_ready'); pill.className = 'go'; }
        else { pill.textContent = t('client.awaiting_crew'); pill.className = ''; }
      }

      // Ready button (per-player, replaces captain-only Engage)
      const readyBtn = document.getElementById('ready-btn');
      if (readyBtn) {
        if (vm.readyBtn.visible) {
          readyBtn.style.display = 'block';
          readyBtn.disabled = false;
          if (vm.readyBtn.mode === 'countdown') {
            // Countdown active — keep button in ready state, show timer.
            readyBtn.textContent = vm.readyBtn.secs + 's';
            readyBtn.className = 'armed glow';
          } else if (vm.readyBtn.mode === 'ready-confirmed') {
            readyBtn.textContent = t('client.ready_confirmed');
            readyBtn.className = 'armed glow';
          } else if (vm.readyBtn.mode === 'take-station') {
            // In-progress claiming: same SetReady{true} hand-off, relabelled
            // as Take Station (#771 AC1/AC2 — text only, sendReady unchanged).
            readyBtn.textContent = t('client.take_station');
            readyBtn.className = 'armed';
          } else {
            readyBtn.textContent = t('client.ready');
            readyBtn.className = 'armed';
          }
          readyBtn.onclick = () => send('SetReady', { ready: vm.readyBtn.sendReady });
        } else {
          readyBtn.style.display = 'none';
        }
      }

      // Status line
      const statusLine = document.getElementById('status-line');
      if (statusLine) {
        statusLine.textContent = t(vm.statusLine.id, vm.statusLine.params);
      }
    }

    function rebuildStations() {
      // Pure fold in gui/station-roster.js (issue #827): players + station
      // defs → roster rows + lobby aggregates. Boot race: leave the previous
      // roster in place until the module loads.
      if (typeof window.buildStationRoster === 'function') {
        const defs = (uiState.shipStations && uiState.shipStations.stations) || [];
        const roster = window.buildStationRoster(uiState.players, defs);
        uiState.stations   = roster.stations;
        uiState.maxPlayers = roster.maxPlayers;
        uiState.allFilled  = roster.allFilled;
        uiState.allReady   = roster.allReady;
      }
      uiState.countdownSecs = window.lobbyState ? window.lobbyState.countdownSecs : 0;
      scheduleRender();
    }

    // Repair UI (issue #462): the full repair affordance is owned by the
    // Repair console iframe (gui/repair-console.html), which renders the hull
    // readout + per-team dispatch buttons and sends `dispatch_repair_team`
    // itself. The pure shell-button logic ported from the old Bevy
    // `handle_repair_button_press` / `refresh_repair_button` lives in
    // gui/repair-button.js (all-busy guard, message shape, refresh states).
    // The earlier `renderRepair` / `renderRepairButtons` shell stubs targeted
    // HTML ids that were never added (orphaned Bevy-era remnants) and were
    // removed here; the iframe supersedes them.

    // -- iframe state-push helper (wraps gui/iframe-bridge.js) ----------------
    function _pushIframe(iframeEl, consoleName, stateJson) {
      // Module not loaded yet (boot race): drop the push — pushes are idempotent
      // snapshots and the next tick repeats them.
      if (typeof window.iframeBridgePush !== 'function') return;
      window.iframeBridgePush(iframeEl, consoleName, stateJson);
    }

    // -- Generic console state push (ship-agnostic) --------------------------
    // Every station id (including the aggregate cruiser/destroyer consoles like
    // `engineering` = power+repair and `science` = sensors+shields) is handled
    // generically by window.buildConsoleState(name, window.simState), which nests the
    // sub-panel payloads. Iframe ids resolve through gui/mount-plan.js (the
    // single home of the `${id}-iframe` scheme + the tactical → weapons
    // alias) so whatever iframe the current ship actually mounted is fed.
    // This is the ONLY push path (#823): handleMessage fans out through
    // pushDirtyConsoles below, and renderGame / iframe-load listeners push
    // the active console directly.
    function consoleIframeId(name) {
      return (typeof window.iframeIdFor === 'function')
        ? window.iframeIdFor(name) : (name + '-iframe');
    }

    function pushConsoleStateFor(name) {
      if (!name) return;
      const json = (typeof window.buildConsoleState === 'function' && window.simState)
        ? window.buildConsoleState(name, window.simState)
        : '{}';
      _pushIframe($(consoleIframeId(name)), name, json);
    }

    function pushActiveConsoleState() {
      pushConsoleStateFor(activeConsole);
    }

    // Resolve the active console's iframe the same way pushConsoleStateFor
    // does, so the relay always follows whatever iframe this ship mounted.
    function activeConsoleIframe() {
      if (!activeConsole) return null;
      return $(consoleIframeId(activeConsole));
    }

    // Send the host's key events to the active console, so helm's WASD/arrows,
    // Ctrl impulse and Shift boost keep working after a click on the tab bar or
    // any other host chrome moved focus out of the console iframe. Called from
    // the DOMContentLoaded gate below, once the deferred modules have run.
    function installConsoleKeyRelay() {
      if (typeof window.installKeyRelay !== 'function') return;
      window.installKeyRelay(document, () => {
        const el = activeConsoleIframe();
        try { return el && el.contentDocument; } catch (_) { return null; }
      });
    }

    // -- Message-driven console refresh (issue #823) --------------------------
    // The per-console build*/push*ConsoleState wrapper pairs that used to live
    // here were deleted: handleMessage() now computes which consoles a message
    // dirties via the declarative table in gui/dirty-consoles.js and pushes
    // each through the generic pushConsoleStateFor above. Pushes are gated on
    // the console being active, except the names in DIRTY_ALWAYS_PUSH
    // (captain — its push was always unconditional).
    function pushDirtyConsoles(msg) {
      // Boot race: the module scripts may not have executed yet — drop the
      // fan-out; pushes are idempotent snapshots and the next message repeats
      // them (same tolerance as _pushIframe / pushConsoleStateFor).
      if (typeof window.dirtyConsolesFor !== 'function') return;
      const stationSystems = window.simState ? window.simState.stationSystems : null;
      const alwaysPush = window.DIRTY_ALWAYS_PUSH || new Set();
      for (const name of window.dirtyConsolesFor(msg, stationSystems)) {
        if (alwaysPush.has(name) || activeConsole === name) pushConsoleStateFor(name);
      }
    }

    // Attach on-load listener for an iframe that was created dynamically by
    // mountConsoles(). Each iframe re-pushes its console state on load so it
    // receives the current snapshot even after a reload or late mount.
    // consoleName must be the lowercase station id.
    function _attachIframeLoadListener(iframeEl, consoleName) {
      if (!iframeEl) return;
      iframeEl.addEventListener('load', () => {
        // Push the freshly-loaded iframe its current snapshot. Generic so it
        // covers every station id the ship mounts (including engineering /
        // science aggregates the old per-name switch never handled).
        pushConsoleStateFor(consoleName);
      });
    }

    function renderGame(s) {
      // Refresh whichever console is currently visible. This is ship-agnostic:
      // it covers the aggregate cruiser/destroyer consoles (engineering,
      // science, …) as well as the standalone ones — all resolve to their
      // iframe via the registry.
      pushActiveConsoleState();
    }

    // -- Coordination popup (issue #494) ---------------------------------------
    let coordinationPopupTimer = null;
    function showCoordinationPopup(payload, sender_label) {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      const senderEl = document.getElementById('popup-sender');
      const titleEl = document.getElementById('popup-title');
      const bodyEl = document.getElementById('popup-body');
      if (!senderEl || !titleEl || !bodyEl) return;
      // Payload → { sender, title, body } normalisation is pure and lives in
      // gui/coordination-popup.js (issue #827); only the DOM writes and the
      // auto-dismiss timer stay here.
      if (typeof window.normalizeCoordinationPayload !== 'function') return;
      const norm = window.normalizeCoordinationPayload(payload, sender_label);
      senderEl.textContent = norm.sender;
      titleEl.textContent = norm.title;
      bodyEl.textContent = norm.body;
      el.style.display = 'block';
      if (coordinationPopupTimer) clearTimeout(coordinationPopupTimer);
      coordinationPopupTimer = setTimeout(dismissCoordinationPopup, 8000);
    }
    function dismissCoordinationPopup() {
      const el = document.getElementById('coordination-popup');
      if (!el) return;
      el.style.display = 'none';
      if (coordinationPopupTimer) {
        clearTimeout(coordinationPopupTimer);
        coordinationPopupTimer = null;
      }
    }

    // -- Dynamic console mounting (Module H / issues #621, #827) ---------------
    // Called after a Welcome message updates uiState.shipStations.
    // gui/mount-plan.js decides WHAT to mount (station id → section/iframe
    // ids + URL, tactical alias included); this loop only creates the DOM.
    // Stations not present on this ship have no DOM elements, keeping the DOM
    // minimal and matching only what the current ship configuration provides.
    function mountConsoles(shipStations) {
      const container = $('console-container');
      if (!container) return;

      // Remove all previously-mounted console sections (identified by class),
      // but leave the lobby-ui sibling untouched.
      const existing = container.querySelectorAll('.console-section');
      for (const el of existing) el.remove();

      const plan = (typeof window.planMounts === 'function')
        ? window.planMounts(shipStations) : [];
      for (const mount of plan) {
        const section = document.createElement('section');
        section.id = mount.sectionId;
        section.className = 'console-section';

        const iframe = document.createElement('iframe');
        iframe.id = mount.iframeId;
        iframe.src = mount.url;
        iframe.title = mount.title;
        iframe.allowFullscreen = true;

        section.appendChild(iframe);
        container.appendChild(section);

        // Attach load listener so the iframe re-pushes state after load/reload.
        _attachIframeLoadListener(iframe, mount.stationId);
      }
    }

    // -- Console action postMessage bridge (issue #422) ------------------------
    // All iframe consoles send {type:'console_action', payload:json} via
    // postMessage.  Dispatch is table-driven via gui/action-map.js (issue #455).
    window.addEventListener('message', (event) => {
      if (!event.data || event.data.type !== 'console_action') return;
      let action;
      try { action = JSON.parse(event.data.payload); } catch (_) { return; }
      if (!action || !action.action) return;
      // Contextual tutorial progress (issue #916): every console action feeds
      // the client-local progress store — using a control completes its
      // `control_unused` overlays — and `tutorial_dismiss` is handled
      // entirely client-side (presentation state, never forwarded to the
      // host). On change, re-push the acting console so the overlay advances
      // immediately rather than waiting for the next server message.
      if (window.simState && typeof window.applyTutorialAction === 'function') {
        let tutStorage = null;
        try { tutStorage = window.localStorage; } catch (_) { /* privacy mode */ }
        const tut = window.applyTutorialAction(window.simState, action, tutStorage);
        if (tut.changed) pushConsoleStateFor(action.console || activeConsole);
        if (tut.handled) return;
      }
      if (typeof window.dispatchConsoleAction === 'function') {
        // Optimistic local patches (weaponsTarget / sensorsTarget) land on the
        // one sim store; simState.weaponsTarget has a setter for this path.
        window.dispatchConsoleAction(action, send, (patch) => {
          if (window.simState) Object.assign(window.simState, patch);
        });
        return;
      }
      // Fallback for the rare race window before module scripts load.
      // Only covers set_sensors_target (mutates local state); other actions
      // are silently deferred (non-critical — they arrive after module load).
      if (action.action === 'set_sensors_target' && action.uuid) {
        if (window.simState) window.simState.sensorsTarget = action.uuid;
        send('ControlSystem', {
          target: 'sensors',
          payload: { type: 'SetScienceTarget', data: { uuid: action.uuid } },
        });
      } else if (action.action === 'set_navigation_waypoint'
          && Number.isFinite(action.x)
          && Number.isFinite(action.z)) {
        send('ControlSystem', {
          target: 'navigation',
          payload: { type: 'SetNavigationWaypoint', data: { x: action.x, z: action.z } },
        });
      } else if (action.action === 'clear_navigation_waypoint') {
        send('ControlSystem', {
          target: 'navigation',
          payload: { type: 'ClearNavigationWaypoint' },
        });
      }
    });

    // -- Event wiring --------------------------------------------

    $('name-input').value = myName;

    let nameTimer = null;
    $('name-input').addEventListener('input', e => {
      const val = e.target.value.trim();
      if (!val) return;
      myName = val;
      clearTimeout(nameTimer);
      nameTimer = setTimeout(() => {
        sessionStorage.setItem('player-name', myName);
        send('SetName', { name: myName });
      }, 500);
    });

    // Engage button, view selector, Red Alert button, and helm joystick all
    // live in the per-console iframe pages (gui/*-console.html); the old
    // Bevy WASM client console UIs (#47–#49) were retired with the pure-JS
    // client migration.

    // Orientation watching (resize + orientationchange ? recompute the
    // singleton and rerender so console CSS re-flows) lives in
    // gui/device-orientation.js, which owns window.currentOrientation().

    // -- Incoming message handler --------------------------------

    function handleMessage(msg) {
      // JS state modules (issue #460) — every inbound ServerMessage is applied
      // to the pure state modules first. window.simState is the ONLY sim
      // store (issue #819): the console builders read it directly. Guards
      // cover the brief window before the module scripts have executed.
      if (window.lobbyState)      window.lobbyState.apply(msg);
      if (window.simState)        window.simState.apply(msg);
      if (window.commsState)      window.commsState.apply(msg);
      // The QR-first ScenarioCatalog message (issue #755) is not part of the
      // client-router case table, so force a render to (re)draw the picker.
      if (msg && msg.type === 'ScenarioCatalog') scheduleRender();
      // The host's debug/session read-back (issue #940) only arrives on change,
      // and it is the one push that can change what an OPEN settings panel
      // shows — so repaint here rather than from the render loop, which would
      // rebuild the volume slider out from under a dragging finger.
      if (msg && msg.type === 'DebugState' && settingsPanel) settingsPanel.rebuildContent();
      // Declarative iframe fan-out (#823): gui/dirty-consoles.js maps the
      // message to the console names to re-push. Runs after the state applies
      // above so every push carries fresh data. On Welcome the consoles are
      // (re)mounted AFTER this fan-out — that is fine: each iframe's load
      // listener re-pushes its snapshot once it actually loads.
      pushDirtyConsoles(msg);
      // Per-case routing is pure and lives in gui/client-router.js (issue
      // #827): it applies the uiState mutations and hands back a side-effect
      // plan for the DOM glue below. Boot race: modules run before
      // DOMContentLoaded and the connection waits for it, so routeMessage is
      // present for every real message; drop otherwise (next message repeats).
      if (typeof window.routeMessage !== 'function') return;
      const result = window.routeMessage(msg, {
        uiState,
        myToken,
        pendingMidGameClaim,
        bezelAlertOn,
        lobbyState: window.lobbyState || null,
        redAlert: !!(window.simState && window.simState.redAlert),
      });
      pendingMidGameClaim = result.pendingMidGameClaim;
      bezelAlertOn = result.bezelAlertOn;
      if (result.myName !== undefined) myName = result.myName;
      for (const fx of result.sideEffects) applySideEffect(fx);
      if (result.rebuildStations) rebuildStations();
      if (result.shouldRender) scheduleRender();
    }

    // DOM side effects named by the router (see gui/client-router.js for the
    // catalogue). Everything here is a plain element write.
    function applySideEffect(fx) {
      switch (fx.effect) {
        case 'mount-consoles':
          mountConsoles(fx.shipStations);
          break;
        case 'ship-theme': {
          // Inject ship theme CSS from Welcome ship_css (Fix: Module F).
          let linkEl = document.getElementById('ship-theme-css');
          if (!linkEl) {
            linkEl = document.createElement('link');
            linkEl.rel = 'stylesheet';
            linkEl.id = 'ship-theme-css';
            document.head.appendChild(linkEl);
          }
          linkEl.href = fx.href;
          break;
        }
        case 'ship-info': {
          const nameEl2 = document.getElementById('ship-name');
          const missionEl = document.getElementById('ship-mission');
          if (nameEl2) nameEl2.textContent = fx.title;
          if (missionEl) missionEl.textContent = fx.description;
          break;
        }
        case 'status':
          setStatus(t(fx.id));
          break;
        case 'hide-loading': {
          const loadingEl = document.getElementById('asset-loading');
          if (loadingEl) loadingEl.style.display = 'none';
          break;
        }
        case 'show-loading': {
          const pctEl = document.getElementById('asset-loading-pct');
          const assetEl = document.getElementById('asset-loading');
          if (assetEl) assetEl.style.display = 'flex';
          if (pctEl) pctEl.textContent = String(fx.pct);
          break;
        }
        case 'bezel-alert':
          applyBezelAlert(fx.on);
          break;
        case 'vibrate':
          if (navigator.vibrate) navigator.vibrate(fx.duration);
          break;
        case 'coordination-popup':
          showCoordinationPopup(fx.payload, fx.senderLabel);
          break;
      }
    }

    // -- PeerJS connection (extracted to gui/connection-manager.js, issue #603) --

    const hostPeerId = location.hash.slice(1);

    if (!hostPeerId) {
      setStatus(t('client.status_no_host_id'));
    } else {
      (async () => {
        // Gate on DOMContentLoaded before touching any module-dependent state.
        // See the comment above the original gate for the full rationale.
        if (document.readyState === 'loading') {
          await new Promise(resolve =>
            document.addEventListener('DOMContentLoaded', resolve, { once: true }));
        }

        // Resolve this tab's session token now that all deferred modules have
        // run. Each tab gets its own token, which is what lets several clients
        // on one desktop connect as distinct players. The inline branch is a
        // last-ditch fallback for the rare case the module genuinely failed to
        // load.
        myToken = (typeof window.installSessionToken === 'function')
          ? window.installSessionToken()
          : (() => {
              let t = sessionStorage.getItem('session-token');
              if (!t) {
                t = Array.from(crypto.getRandomValues(new Uint8Array(16)))
                  .map(b => b.toString(16).padStart(2, '0')).join('');
                sessionStorage.setItem('session-token', t);
              }
              return t;
            })();
        console.log(`[client] session token ${myToken.slice(0, 8)}`);

        installConsoleKeyRelay();

        // Mount the settings panel (gear button + overlay) once state is ready.
        // Provide send, a getState closure, and the UI click audio element.
        if (typeof window.mountSettings === 'function') {
          settingsPanel = window.mountSettings({
            send: (type, data) => send(type, data),
            // Station roster from the lobby mirror; the active rating and the
            // host's debug read-back (issue #940) live in the sim store,
            // composed here so the panel sees one object.
            getState: () => ({
              ...uiState,
              stationRatings: window.simState ? window.simState.stationRatings : {},
              debugFlags: window.simState ? window.simState.debugFlags : null,
            }),
            // Every audio channel this page owns. Master volume scales each
            // element's own authored level rather than replacing it, so adding
            // a channel here needs no other change (issue #940).
            audioEls: [document.getElementById('ui-click')],
            getManual: () => (window.simState ? window.simState.shipManual : null),
            myToken: myToken,
          });
        }

        console.log('[PeerJS] fetching ICE servers');
        const { servers: iceServers, relayAvailable, relaySource } = await window.fetchIceServers();
        console.log('[PeerJS] ICE config:', iceServers.map(s => s.urls));

        // Connection diagnostics readout (#conn-diag). A phone stuck behind
        // CGNAT shows "connecting…" forever with the real story buried in an
        // unreachable console — this mirrors the relay + ICE stage on screen.
        const diagEl = document.getElementById('conn-diag');
        const diag = { attempt: 0, ice: '', types: [], probe: null, relayAvailable, relaySource };
        function renderDiag() {
          if (!diagEl) return;
          const lines = [];
          if (!diag.relayAvailable) lines.push(t('client.diag_no_relay'));
          else if (diag.probe === 'unreachable') lines.push(t('client.diag_relay_fail'));
          else if (diag.relaySource === 'openrelay') {
            lines.push(diag.probe === 'reachable'
              ? t('client.diag_relay_fallback_ok')
              : t('client.diag_relay_fallback'));
          }
          else if (diag.probe === 'reachable') lines.push(t('client.diag_relay_ok'));
          if (diag.attempt > 0) {
            lines.push(t('client.diag_stage', {
              attempt: diag.attempt,
              ice: diag.ice || '—',
              types: diag.types.length ? diag.types.join(', ') : t('client.diag_none'),
            }));
          }
          diagEl.textContent = lines.join('\n');
        }
        renderDiag();
        if (relayAvailable && typeof window.probeTurnRelay === 'function') {
          window.probeTurnRelay(iceServers).then(verdict => {
            console.log('[ICE] relay probe:', verdict);
            diag.probe = verdict;
            renderDiag();
          });
        }

        if (typeof window.connectionManager === 'undefined') {
          console.warn('[client] connection-manager module not loaded; falling back to inline Peer setup');
          return;
        }

        window.connectionManager.connect(hostPeerId, {
          iceServers,
          getIdent: () => ({ token: myToken, name: myName }),
          onData: handleMessage,
          onStatus: (state) => {
            setConnectionStatus(state);
            // Diagnostics only matter while the link is down; hide them once
            // the DataChannel is up so they don't sit under the lobby.
            if (diagEl) diagEl.style.display = state === 'ready' ? 'none' : '';
            if (state === 'ready') {
              acquireWakeLock();
              setStatus(t('client.status_waiting_server'));
            } else if (state === 'connecting') {
              setStatus(t('client.status_connecting_host'));
            } else if (state === 'disconnected') {
              releaseWakeLock();
              setStatus(t('client.status_disconnected'));
            } else if (state === 'error') {
              releaseWakeLock();
              setStatus(t('client.status_unreachable'));
            }
          },
          onError: (type) => {
            if (type === 'peer-unavailable') {
              setStatus(t('client.status_host_not_found'));
            } else {
              setStatus(t('client.status_peer_error', { type: type }));
            }
          },
          onLog: (msg) => console.log(msg),
          onDiag: (e) => {
            if (e.event === 'attempt') { diag.attempt = e.attempt; diag.ice = ''; diag.types = []; }
            else if (e.event === 'ice-state') diag.ice = e.state;
            else if (e.event === 'candidates') diag.types = e.types;
            else if (e.event === 'timeout') diag.ice = 'timeout';
            else if (e.event === 'open') diag.ice = 'connected';
            renderDiag();
          },
        });
      })();
    }</script>
</body>
</html>

entities:
  - component: system-blackboard-publisher
    core:
      status: implemented
      confidence: confirmed
      title: System Blackboard Publisher
      summary: Publishes each system's current authoritative state during the simulation publish phase and then aggregates ship-wide views.
      rationale:
        - Systems need a shared, inspectable state surface without reading or mutating each other's private implementation state.
    architecture:
      kind: state-publisher
      authority: authoritative
      owns: [ship-system-blackboards-state, frozen-system-blackboards-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/sim_sets.rs, src/ship/viewscreen.rs, src/core/messages.rs]
      symbols: [SimSet]
      messages: [BlackboardUpdate]
      tests: [cargo test]

  - state: ship-system-blackboards-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship System Blackboard State
      summary: Authoritative current-tick per-ship published state for Helm, Weapons, Power, Shields, Captain, Repair, Comms, Sensors, Navigation, and Viewscreen systems.
      rationale:
        - "Since #801 the map holds two key namespaces: console-level blackboards (Helm, Weapons) are keyed by station id via helm_station_key / tactical_station_key, while per-system blackboards keep system-id keys. Both are carried as SystemId values and the client key strings are unchanged."
    architecture:
      classification: authoritative
      owner: system-blackboard-publisher
      writers: [system-blackboard-publisher]
      replicas: [simulation-state-replica]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/ship/viewscreen.rs]
      symbols: [SystemBlackboard]

  - state: frozen-system-blackboards-state
    core:
      status: implemented
      confidence: confirmed
      title: Frozen System Blackboard State
      summary: Previous-tick immutable snapshot used for deterministic cross-system reads during simulation work before the next publish phase.
    architecture:
      classification: derived
      owner: system-blackboard-publisher
      derived_from: [ship-system-blackboards-state]
    implementation:
      status: declared
      paths: [src/ship/viewscreen.rs, src/sim_sets.rs]

  - state: viewscreen-target-facts-state
    core:
      status: implemented
      confidence: confirmed
      title: Viewscreen Combat Lock & Science Target Facts
      summary: Ship-wide target facts the viewscreen aggregator lifts from the radar blackboards — Combat Lock (from the tactical radar's selection) and Science Target (from the sensor radar's selection).
      rationale:
        - "Issue #829: ViewscreenBlackboard gains combat_lock and science_target. Both viewscreen aggregators (NPC aggregate_doctrine_blackboards and the LocalShip publish_viewscreen_blackboard) read this ship's own tactical-radar / sensor-radar blackboard selected_target in SimSet::PublishAggregate, right after the radar publishers ran in SimSet::Publish."
        - "[ai] These are the only target facts cross-system consumers may read (spec §3): weapons firing paths, helm pursuit, shields target_bearing, sensors AI mirror + frequency hint, and the arc-bearing request all read the FROZEN viewscreen combat_lock rather than reaching a radar's live selection. One-tick lag at 30Hz is accepted, including for firing. In-flight torpedoes keep their TorpedoTargetSnapshot latch."
    architecture:
      classification: derived
      owner: system-blackboard-publisher
      derived_from: [tactical-radar-blackboard-state, sensor-radar-blackboard-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/ai/server.rs, src/server_app/broadcast.rs]
      symbols: [ViewscreenBlackboard]

  - component: inter-system-message-router
    core:
      status: implemented
      confidence: confirmed
      title: Inter-System Message Router
      summary: Typed same-tick channel for system-to-system operational messages such as joystick state, battery drain, and torpedo-round claims.
    architecture:
      kind: message-router
      authority: authoritative
      owns: [inter-system-message-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/ship_plugin.rs, src/console/weapons/mod.rs]
      symbols: [InterSystemMsg]
      messages: [InterSystemPayload]
      tests: [cargo test]

  - state: inter-system-message-state
    core:
      status: implemented
      confidence: confirmed
      title: Inter-System Message State
      summary: Ephemeral addressed messages consumed by the target system in the same simulation tick; this channel is not a player-visible coordination queue.
    architecture:
      classification: ephemeral
      owner: inter-system-message-router
      writers: [inter-system-message-router]
    implementation:
      status: declared
      paths: [src/core/messages.rs]
      symbols: [InterSystemMsg, InterSystemPayload]

  - component: coordination-lag-router
    core:
      status: implemented
      confidence: confirmed
      title: Coordination Lag Router
      summary: Per-ship delayed advisory channel addressed explicitly to one Station or the whole source Ship, carrying a typed semantic payload plus a required producer-owned presentation envelope while control, availability, recipient, and visibility are resolved at delivery time before typed deliveries are handed to the receiving module.
      rationale:
        - Coordination latency should affect the message path consistently without freezing stale ownership decisions at send time.
        - "Issue #1254 replaces Station-shaped SystemId values with CoordinationAddress::Station and makes whole-ship intent explicit as CoordinationAddress::Ship. A producer resolving a fine System to its owning Station drops an ownerless or unknown result; it never widens a failed lookup into a Ship broadcast. ControlSystem commands remain System-addressed."
        - "The lag router selects Station versus Ship routing from the address and never infers a destination from the payload. Station delivery resolves the live Station policy after the delay; Helm and Tactical retain their established composite policies, while other Stations reduce their authored fine-System policies. Unknown Stations are invalid for that hull and are dropped, not sent to every client."
        - "Ship delivery applies route_coordination per authored Station in stable hull order: a backfilled sender reaches every connected human seat, an AI or offline seat gets nothing, and a human sender is suppressed exactly as human-to-human traffic already was. The #737 Repair coarsening is re-applied per recipient so the Ship address cannot widen protected information."
        - "After the delay, an AI Station delivery is emitted as DeliveredCoordination. Issue #1254's Tactical tracer consumes a typed FrequencyHint in the Tactical module and latches PendingTacticalFrequencyHint for apply_tactical_frequency_hint on the following Input tick. Both receiver and applier re-check live Tactical AI ownership, so a human claim inside the delivery/application window drops the hint rather than overwriting the new operator. sender_origin remains only a routing tag."
        - "Issue #1256 moves the three Helm payload effects behind the same seam: HelmPlugin's receive_helm_coordination accepts only an AI delivery, re-checks the resolved Helm Station plus the live helm-steering AI policy (the router's representative Helm axis when axes diverge), then consumes ArcBearingRequest, ArcBearingWithdraw, or NavigateTo into PendingArcBearingRequest or HelmWaypointClearance. A damaged or human-held thrust axis therefore does not discard steering-owned work, while a late human steering claim or a non-AI handoff still does. The lag router no longer queries either Helm state or branches on those payload variants. Receiver order preserves queue order; carried arc geometry, unconditional cross-family withdrawal, and the exact NavigateTo generation are unchanged."
        - "Issue #1255 makes CoordinationPresentation required at every producer and carries it byte-for-byte beside the typed payload through CoordinationLagQueue, DeliveredCoordination, CoordinationPopup, and AiChatterEvent. The phone and Viewscreen resolve the same localised-or-literal title/body plus scalar parameter maps and never enumerate CoordinationPayload; the phone retains separate title/body lines and the Viewscreen joins them onto its existing single line. The router derives the destination heading from CoordinationAddress (`station.<id>.name` or `chatter.addressee.ship`), removing the incomplete client Station switch. Route labels resolve to undecorated display text (including bare `Ship`); each layout owns its single pair of square brackets, matching the existing Station-label contract. The unused text-only ServerMessage::AiChatter vocabulary is deleted so there is no second Coordination presentation contract beside the live AiChatterEvent host channel."
        - "[decision] Adding required presentation and destination fields was treated as one atomic wire-vocabulary change, so PROTOCOL_VERSION advances from 2 to 3 instead of accepting partially-present legacy messages. Parameter values use the existing `<field>_params` localization convention with an untagged scalar enum and BTreeMap ordering: frequency remains numeric, known ids localise, and literal authored text passes through. Display-only waypoint and threat figures are rounded producer-side to preserve the prior JavaScript output; the ThreatBearing semantic label is now the threat UUID because its former composed English existed only to feed the deleted client presenter."
        - "Repair presentation names only the coarse authored Station/Core label and never carries its protected exact deficit, regardless of recipient entitlement. Destroyed-System presentation uses the hull entry's authored display name with String Table title/body ids; no Rust-composed English remains. The strict String Table gate scans literal Rust CoordinationPresentation constructors and text-valued presentation parameters so moving ids out of JavaScript cannot make missing rows invisible."
        - "Issue #1257 extends the same seam with an explicit CoordinationDelivery outcome. RepairRequest deliveries resolved to AI retain their exact host-internal deficit and Repair's receive_repair_coordination merges them into RepairRequestQueue. Deliveries resolved to a human carry the already-resolved session token, sender label, recipient-projected payload, and same-tick popup order; Repair applies its first sub-Disabled report / always-report Disabled-or-Destroyed latch before emitting an OrderedCoordinationPopup. The shared flush sorts approved Repair outcomes together with generic Station and deterministic Ship fan-out popups by the lag router's original enqueue sequence. The lag router retains delay, recipient selection, and HullVisibility projection but no longer queries or mutates RepairRequestQueue or RepairHumanAlerted."
        - "Issue #1258 moves ThreatBearing behind the same seam: receive_shields_coordination verifies the authored shield-arc Station and live authored Shields focus capability before latching PendingShieldsThreatBearing for the following Shields AI decision. The generic lag router no longer knows Shields' private pending-state representation; Human and Offline outcomes remain the generic popup and consume/drop paths."
    architecture:
      kind: coordination-service
      authority: authoritative
      owns: [coordination-lag-queue-state]
      reads: [system-control-source-state, session-station-ownership-state]
      produces: [coordination-delivery-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/ship/coordination.rs, src/ship/coordination_systems.rs, src/ship/components.rs, src/ship/shields.rs, src/ship_plugin.rs, src/core/messages.rs, src/core/codec.rs, src/console_bridge.rs, src/console/helm/server.rs, src/console/weapons/server.rs, src/console/repair/server.rs, gui/client-router.js, gui/sim-state.js, gui/coordination-popup.js, client.html, server.html, scripts/check-strings.mjs, scripts/strings-rust.mjs]
      symbols: [CoordinationAddress, CoordinationPresentation, CoordinationParam, CoordinationDelivery, address_for_system, address_for_system_kind, CoordinationLagQueue, CoordinationPayload, DeliveredCoordination, OrderedCoordinationPopup, PendingArcBearingRequest, HelmWaypointClearance, receive_helm_coordination, PendingTacticalFrequencyHint, receive_tactical_coordination, receive_repair_coordination, PendingShieldsThreatBearing, receive_shields_coordination, flush_coordination_popups, apply_tactical_frequency_hint, broadcast_to_ship, seat_control_source, ShipSeat, normalizeCoordinationPresentation, renderCoordinationPopup, buildCoordinationChatterBubble, coordinationPresentationIds]
      messages: [SendCoordination, CoordinationPopup, DeliveredCoordination, OrderedCoordinationPopup, AiChatterEvent]
      tests: [cargo test, tests/client/client-router.test.js, tests/client/sim-state.test.js, tests/client/coordination-popup.test.js]

  - state: coordination-lag-queue-state
    core:
      status: implemented
      confidence: confirmed
      title: Coordination Lag Queue State
      summary: Authoritative per-ship queue of pending advisory messages carrying an explicit Station or Ship address, typed semantic payload, required producer-owned presentation envelope, and configured delivery delay.
    architecture:
      classification: authoritative
      owner: coordination-lag-router
      writers: [coordination-lag-router]
    implementation:
      status: declared
      paths: [src/ship/coordination.rs, src/ship_plugin.rs]
      symbols: [CoordinationLagQueue, CoordinationQueue]

  - state: coordination-delivery-state
    core:
      status: implemented
      confidence: confirmed
      title: Coordination Delivery State
      summary: "Ephemeral post-delay outputs: Station-addressed typed deliveries carrying the resolved AI or owning-module human-popup outcome and the producer presentation envelope, same-tick ordered human popup candidates, Viewscreen chatter, and deterministic Ship-addressed popup fan-out."
    architecture:
      classification: ephemeral
      owner: coordination-lag-router
      derived_from: [coordination-lag-queue-state]
    implementation:
      status: declared
      paths: [src/core/messages.rs, src/ship/components.rs, src/ship/coordination_systems.rs, src/ship/shields.rs, src/console/helm/server.rs, src/console/weapons/server.rs, src/console/repair/server.rs, src/console_bridge.rs, gui/coordination-popup.js, client.html, server.html, src/ship_plugin.rs]
      symbols: [CoordinationPresentation, CoordinationDelivery, DeliveredCoordination, OrderedCoordinationPopup, AiChatterEvent, receive_helm_coordination, receive_tactical_coordination, receive_repair_coordination, receive_shields_coordination, flush_coordination_popups, normalizeCoordinationPresentation]
      messages: [CoordinationPopup, DeliveredCoordination, OrderedCoordinationPopup, AiChatterEvent]

  - component: intent-narration-coalescer
    core:
      status: implemented
      confidence: confirmed
      title: Intent-Narration Coalescer
      summary: Maps one seat's previous and new decision snapshots to zero or one coarsened intent advisory, so a backfilled seat announces decision changes and never routine repeated action.
      rationale:
        - "Issue #879. The crew of a partly-backfilled bridge needs to know what the automation is doing without an advisory per shot or per thrust tick, so state-change detection is taken out of the emitters entirely: the adapter reads authoritative state (tactical selection, red alert, hull, shield focus, power brownout, the helm policy's own state-machine leg) into an IntentSnapshot and the pure coalesce_intent decides whether anything changed. Steady state produces nothing."
        - "[ai] The contract is zero-or-one per seat per decision tick. When several axes move on the same tick a FIXED priority ladder (break-off, brownout, posture, target, shield focus, manoeuvre) picks exactly one, so two lockstep peers resolving the same tick pick the same advisory. Unreported axes are still recorded in the stored snapshot, so they cannot resurface later as changes that never happened."
        - "Advisories carry a typed kind plus at most one label and NO figures — the same information boundary #737 drew for RepairRequest, where the tier crossing reaches Engineering and the exact HP deficit does not. The producer maps that kind to the required presentation envelope; clients render the envelope without knowing IntentKind."
        - "The break-off hull fraction is authored as [global] intent_break_off_hull_fraction; the serde default is the only hardcoded copy of it."
        - "Nothing on the emit side branches on who holds the seat. The fact is derived from authoritative system state whoever is operating the console, and the seat's control source is stamped onto sender_origin afterwards as a routing tag — the shape issue #873 had to restore after an emit-side operate_ai conjunct made a coordination fact depend on the operator."
        - "The emitter is gated by run_if(ai_tick_ready) on the one shared AI cadence. SimSet is configured in Bevy's Update, so an ungated narrator would sample decision state once per rendered frame and could narrate a flicker inside a single AI tick twice."
    architecture:
      kind: coordination-producer
      authority: authoritative
      owns: [intent-narration-state]
      reads: [system-control-source-state, ship-system-blackboards-state]
      produces: [coordination-lag-queue-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/intent_narration.rs, src/ship/intent_narration_systems.rs, src/core/messages.rs, src/ship_plugin.rs, gui/coordination-popup.js]
      symbols: [coalesce_intent, IntentSnapshot, IntentChange, IntentNarrationConfig, IntentKind, tick_intent_narration, ShipIntentNarration]
      messages: [CoordinationPopup]
      tests: [cargo test, tests/client/coordination-popup.test.js]

  - state: intent-narration-state
    core:
      status: implemented
      confidence: confirmed
      title: Intent Narration State
      summary: Per-ship memory of each narrating seat's last decision snapshot, plus that ship's monotonic advisory counter.
      rationale:
        - "[ai] The counter is a COUNTER, never a clock reading: two lockstep peers advancing the same simulation must stamp the same advisory with the same generation, and elapsed time differs on every host. Same rule NavigationWaypoint::generation follows."
        - "Attached at BOTH ship spawn sites (entities::spawner::spawn_entity and server_app::spawn_game_start_entities); a source scan re-derives the attachment, because a ship without it narrates nothing and nothing warns. The player ship is the one bridge with human seats to narrate to."
    architecture:
      classification: authoritative
      owner: intent-narration-coalescer
      writers: [intent-narration-coalescer]
    implementation:
      status: declared
      paths: [src/ship/intent_narration_systems.rs, src/entities/spawner.rs, src/server_app/world_setup.rs]
      symbols: [ShipIntentNarration, INTENT_NARRATION_SPAWN_SITES]

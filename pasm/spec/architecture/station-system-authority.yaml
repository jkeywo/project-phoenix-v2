entities:
  - component: ship-station-system-topology
    core:
      status: implemented
      confidence: confirmed
      title: Ship Station and System Topology
      summary: Ship-authored station, fine-system, power-group, rating, and console topology that defines who may operate each capability. Since issue #871 every shipped hull authors it, NPC hulls included.
      rationale:
        - "[ai] Station ownership is the authority source for player access; console labels alone must not grant control."
        - "Issue #871 (3394578e) removed the last class of ship that had no topology at all. All eight NPC hulls now carry [[station]] blocks with ratings, and every previously ownerless system is re-parented to a seat. NPC is now simply A STATIONED SHIP WITH NOBODY CONNECTED YET, rather than a second kind of ship with a second seeding rule."
        - "Issue #871 leaves ai_only for exactly the systems that are ownerless BY CONSTRUCTION — the auto-generated per-arc shield_arc systems synthesised for a hull that declares no shields station, and the red_alert capability provisioned for a [behaviour] hull that authors none. ship::config::validate rejects an ownerless system that is not ai_only, so no station rating can ever reach them; that is why the boot seeding needs a second pass (below). Of shipped NPC hulls, the auto-generated shield arc is the only thing still relying on it — every hull now authors its own red-alert provision, which is why three existing tests were re-pointed to inline fixtures rather than weakened."
        - "DELIBERATELY NOT DONE by #871: the full nine-seat mirror. The extra seats on the player cruiser and battleship exist because those hulls declare sensors, shields, navigation, repair and comms SYSTEMS; declaring those on NPC hulls would switch on five more backfill behaviours across every Harrow and pirate hull at once. That is authored behaviour rather than structure, it unmistakably moves the balance, and it belongs with the doctrine content. Each NPC hull gets the seats its declared systems support and no more. Related: every NPC hull now declares tactical-radar, which unblocked the data prerequisite #887 needed — but it does NOT make that radar damageable, since damage needs per-system hull entries that NPC hulls author none of and adding them would change hull HP budgets."
    architecture:
      kind: configuration-model
      authority: authoritative
      owns: [ship-station-system-topology-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/config.rs, assets/entities]
      symbols: [ShipConfig, StationConfig, SystemInstanceConfig]
      tests: [cargo test]

  - state: ship-station-system-topology-state
    core:
      status: implemented
      confidence: confirmed
      title: Ship Station and System Topology State
      summary: Authoritative parsed description of stations, systems, ratings, ownership, power groups, markers, and AI-only capabilities for a ship.
    architecture:
      classification: authoritative
      owner: ship-station-system-topology
      writers: [ship-station-system-topology]
    implementation:
      status: declared
      paths: [src/ship/config.rs]
      symbols: [ShipConfig]

  - component: visiting-station-resolver
    core:
      status: implemented
      confidence: confirmed
      title: Complete Human-Seeking Station Resolver
      summary: Resolves a complete human-seeking Station to its active direct holder, then its finite authored compatible host order, then ordinary Backfill AI, while preserving the visiting Station's identity, rating, Systems, console and command authority.
      rationale:
        - "[ai] Resolution is pure and station-scale: host compatibility, active direct holders and hull-resolved scenario-floor detail are explicit inputs; the Bevy adapter supplies the two live inputs, applies the result to owned System control sources, and publishes the effective visiting rating."
        - "[ai] Host eligibility is about live placement, not Station type: an actively directly held human-seeking Station may host, while a Station currently resolved as visiting has no direct holder and cannot host another visitor, so nesting cannot create transitive authority."
        - "[ai] Scenario floors belong to the root world and supporting-world loads reject them, so an additive layer cannot silently replace or discard the selected scenario's crew-detail contract; Combat Test authors Navigation as its first shipped floor tracer."
        - "[ai] The host projects complete Station placement and effective rating generically in SimSnapshot, rather than asking a family blackboard such as Navigation to carry shell ownership metadata. The same snapshot projects the local ship's sorted fine-System control sources from the live resolver, so a visiting Station's manual authority cannot be overwritten on the client by its stale lobby rating."
        - "[ai] Auxiliary vs visiting is an orthogonal, authored per-Station distinction, enforced generically rather than per-station. An `auxiliary` Station is not offered as a claimable lobby seat (the available_stations filter in lobby/session.rs drops auxiliary defs; a claim on one is a no-op in lobby/handler.rs) yet stays `human_seeking`, so it still resolves a host through this resolver and presents on the Hero Bar. An auxiliary Station is also never a candidate HOST: a visiting Station never lands on an auxiliary surface. On the Alliance Destroyer, Navigation, Comms and Command are all auxiliary human-seeking (hosted-tab-only); Command additionally names a `command_target` — see command-station-authority."
    architecture:
      kind: authority-policy
      authority: authoritative
      owns: [visiting-station-placement-state]
      reads: [ship-station-system-topology-state, session-station-ownership-state, active-station-rating-state, world-configuration-state]
      writes: [system-control-source-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/ship/coordination.rs, src/ship/coordination_systems.rs, src/ship/components.rs, src/lobby/session.rs, src/lobby/handler.rs]
      symbols: [resolve_visiting_station, resolve_scenario_detail_floor, write_scenario_detail_floor, VisitingStationAssignment, VisitingStationHosts, ScenarioDetailFloor]
      tests: [cargo test]

  - state: visiting-station-placement-state
    core:
      status: implemented
      confidence: confirmed
      title: Visiting Station Placement State
      summary: Derived per-ship placement and effective rating for every complete human-seeking Station, including the explicit AI outcome after compatible hosts are exhausted.
    architecture:

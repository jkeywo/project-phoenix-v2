[build]
target = "server.html"
dist = "dist"
public_url = "./"

[watch]
watch_path = ["assets/", "gui/"]
# assets/strings/strings.csv is the string table — without .csv here a text
# edit would not trigger a dev-server rebuild.
include = ["*.toml", "*.csv"]

[[hooks]]
stage = "post_build"
command = "node"
command_arguments = ["scripts/wasm-opt-fixup.mjs", "dist/.stage"]

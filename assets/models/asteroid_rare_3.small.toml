[base]
offset = [ 0, -1.1935511719607135, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 2.100638403299977, 2.100638403299977, 2.100638403299977 ]

[extents]
min = [ -2, -1.1948000355776023, -1.2977682647669304 ]
max = [ 1.9931140715105602, 1.1935511719607135, 1.2967237812506944 ]
size = [ 3.9931140715105604, 2.3883512075383155, 2.594492046017625 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_rare_3
# Same bands and ratios as the four common asteroids, so every rock in a
# field switches level at the same distance. No `remesh_voxel_size` here:
# the import already brought this mesh down to the commons' density with a
# UV-preserving Blender collapse (scripts/blender-decimate.py), which is
# what the voxel pre-pass was standing in for on the stubborn commons.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_rare_3.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_rare_3_lod1.glb"

[lod.generate]
source = "assets/models/asteroid_rare_3.glb"
ratio = 0.319
error = 0.01
texture_size = 256

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_rare_3_lod2.glb"

[lod.generate]
source = "assets/models/asteroid_rare_3.glb"
ratio = 0.113
error = 0.01
texture_size = 128

[[lod]]
billboard = "assets/models/asteroid_rare_3_lod3.png"
scale = [ 3.9857, 2.3835, 1.0 ]

[lod.capture]
source = "assets/models/asteroid_rare_3.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

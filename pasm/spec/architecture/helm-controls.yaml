  - component: helm-boost-ai-operator
    core:
      status: implemented
      confidence: confirmed
      title: Helm Boost AI Operator
      summary: New per-axis boost decide system whose stateless policy resolves the boost-channel engage_boost mode verb to decide whether to engage boost this tick; it emits an admitted SetBoost through the SAME command-admission seam a human uses, on-change only, when the boost feature is available.
      rationale:
        - "Issue #780 introduced AI boost for the first time. HelmBoostAiPolicy (attached at spawn from [helm_console.boost_ai]) resolves the boost channel to the engage_boost mode verb over a fact snapshot seeded from the shared hazard surface and availability (seed_helm_actuator_facts). Fires ⇒ engage; holds ⇒ release. At #780 an unauthored block synthesised an explicit idle, preserving the pre-#780 baseline (no AI boost) exactly."
        - "Issue #885 (8555e336) deleted the default_boost_ai_config synthesiser that used to fill an unauthored block (an explicit idle — no AI boost). Strict AI-declaration mode is now the default in EntityConfig::from_toml, so an undeclared block is a LOAD ERROR rather than an invented policy, and every shipped hull authors the block explicitly."
        - "Issue #882 made Boost the demonstrator for the OPTIONAL stateful path, and issue #883 made it the first axis to use one in shipped content. ai_helm_boost now resolves through the shared resolve_helm_channel seam: stateless policies take the frozen resolve_channel path, a policy declaring a machine resolves the same channel inside the state ai_policy_state_tick committed earlier this tick, and the (machine declared, state component missing) case carries a debug_assert! instead of silently degrading. Its facts also gained the #883 target-relative travel readings, so an escape-leg boost rule can guard on the pass geometry (range/closing rate/speed fraction) and not only on hazard and state time."
        - "Issue #883 content note: [helm_console.boost] is MANDATORY for a hull whose doctrine boosts. The spawner only inserts an ENABLED BoostConfigResource when that block is authored, and this operator returns before doing anything without one — so omitting it produces a ship that runs its manoeuvre and silently loses the boost half of it. assets/entities/ship_harrow_destroyer.toml is the first Harrow hull to author it."
        - "Availability (AC6): boost capability is an ENABLED BoostConfigResource — absent or feature-disabled, the operator stands down and emits nothing (mirrors the shared applier's enabled-guard in process_helm_inputs)."
        - "Human/AI symmetry (AGENTS.md #6): boost is emitted as an admitted SetBoost via emit_ai_command — the SAME seam a human SetBoost/ToggleBoost passes through. Issue #881 retired the LocalShip-only handle_boost_messages into process_helm_inputs, so this operator's emission now applies on EVERY AI ship rather than only the local one; before #881 a non-local NPC's SetBoost was admitted and never applied. Ordering is now identical to the four sibling actuators — ai_helm_boost is .before(process_helm_inputs), which is itself .before(apply_helm_commands) and thus .before(tick_boost) — so the AI-emitted SetBoost is still applied the SAME tick, while a human SetBoost (admitted before Input) is still present and applied unchanged. Emits on-change only, mirroring ai_helm_impulse. Runs on the one shared AI decision cadence (AGENTS.md #7; ai_tick_ready — see ai-helm-tick-cadence)."
    architecture:
      kind: service
      authority: authoritative
      reads:
        - hazard-assessment-state
        - boost-drive-state
        - impulse-manoeuvre-policy-state
        - authoritative-ship-motion-state
        - helm-actuator-input-state
      depends_on:
        - host-command-admission
      runs_in:
        - host-browser-runtime
    implementation:
      status: observed
      paths:
        - src/ship/helm_ai.rs
        - src/ship/helm_ai_emit.rs
        - src/ship/helm_admission.rs
        - src/ai/policy.rs
        - src/entities/config.rs
      symbols:
        - ai_helm_boost
        - HelmBoostAiPolicy
        - HelmBoostAiPolicyState

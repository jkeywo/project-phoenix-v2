[domain]
format=1
id="capture-proof"
exports=["send-status"]
requires=["communication_report_status"]
[[task]]
kind="compound"
id="send-status"
parameters=[{name="actor",kind="actor"}]
[[task.method]]
id="actual-protected-request"
step=[{id="status",task="request-status",arguments={actor={source="parameter",name="actor"}}}]
[[task]]
kind="primitive"
id="request-status"
parameters=[{name="actor",kind="actor"}]
definition="status"
[task.request]
kind="communication"
actor={source="parameter",name="actor"}
owner={source="literal",value={kind="system",value="comms"}}
recipient={source="literal",value={kind="actor",value="status-reporter"}}
channel="fleet"
request="report_status"
[[situation_definition]]
id="status"
initial="reported"
[[situation_definition.state]]
id="reported"
when={kind="communication_reported"}

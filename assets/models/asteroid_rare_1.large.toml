[base]
offset = [ 0, -2.6790189979666743, 0 ]
rotation = [ 0, 0, 0 ]
scale = [ 4.201304160475883, 4.201304160475883, 4.201304160475883 ]

[extents]
min = [ -2.5740546076115196, -2.679945284436639, -4 ]
max = [ 2.5765998484600057, 2.6790189979666743, 3.955885997800961 ]
size = [ 5.150654456071525, 5.3589642824033135, 7.95588599780096 ]

[markers]

# Distance-based LOD (issue #914): full GLB up close, two decimated steps, then
# a shared procedural sphere far away. Levels omit `variant`, `radius` and
# `colour` so each rock inherits them from the entity's own flat `[mesh]`.
# The two decimated steps declare how they are regenerated (issue #919):
#   node scripts/generate-lods.mjs asteroid_rare_1
# Same bands and ratios as the four common asteroids, so every rock in a
# field switches level at the same distance. No `remesh_voxel_size` here:
# the import already brought this mesh down to the commons' density with a
# UV-preserving Blender collapse (scripts/blender-decimate.py), which is
# what the voxel pre-pass was standing in for on the stubborn commons.
[[lod]]
max_distance = 15.0
model = "assets/models/asteroid_rare_1.glb"

[[lod]]
max_distance = 100.0
model = "assets/models/asteroid_rare_1_lod1.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_rare_1.glb"
ratio = 0.319
error = 0.01
texture_size = 256

[[lod]]
max_distance = 400.0
model = "assets/models/asteroid_rare_1_lod2.glb"
tier_rig = "baked"

[lod.generate]
source = "assets/models/asteroid_rare_1.glb"
ratio = 0.113
error = 0.01
texture_size = 128

[[lod]]
billboard = "assets/models/asteroid_rare_1_lod3.png"
scale = [ 7.9402, 5.345, 1.0 ]

[lod.capture]
source = "assets/models/asteroid_rare_1.glb"
yaw_views = 8
resolution = 256
pitch = 20.0

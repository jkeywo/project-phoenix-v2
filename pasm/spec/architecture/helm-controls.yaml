  - state: hazard-assessment-state
    core:
      status: implemented
      confidence: confirmed
      title: Hazard Assessment State
      summary: Shared per-ship 3D hazard assessment that publishes capability-style hazard facts, force contributions, and per-actuator sensitivity inputs for helm actuation.
      rationale:
        - Collision avoidance should be computed centrally for the ship rather than separately inside each fine-system AI operator.
        - Different fine systems may filter the same hazard picture differently, such as vertical thrust ignoring static terrain while engines still brake for it.
        - Hazard publication should expose reusable facts and capabilities rather than hard-coded object categories so fine systems can apply their own policies.
        - "A ship ignores hazards with a lower size_rating than its own: large ships do not avoid smaller ships at all."
        - Each fine actuator owns its sensitivity to hazard distance and force weighting; those authored sensitivities implicitly determine response priority instead of one global priority ladder.
        - Vertical separation is evaluated for collision and weapon range even when its present visual effect is negligible.
        - "Issue #780 made the single shared scan genuinely 3D: assess_hazards now computes a vertical (local +Y) force for ELIGIBLE MOVING hazards only (a co-planar moving hazard drives an upward climb; an off-plane one follows the actual vertical separation sign), while static obstacles leave the vertical axis at zero (AC5). The one scan (still called once in helm_motion_planner — no duplicate per-actuator scans, AC2) publishes the 3D force plus the moving-hazard threat once into HazardAssessment; the vertical actuator reads those facts, not a re-scan. The planner gates the Y component on VerticalMovementMode so Planar hulls take none. The published facts are further seeded into each secondary actuator's policy snapshot by seed_helm_actuator_facts, resolving the #779 empty-facts edge so authored guards fire."
    architecture:
      classification: authoritative
      owner: helm-motion-planner
      writers:
        - helm-motion-planner
      readers:
        - helm-ai-operator
        - helm-lateral-thrust-ai-operator
        - helm-vertical-thrust-ai-operator
        - helm-impulse-ai-operator
        - helm-boost-ai-operator
      replicas:
        - helm-motion-blackboard-state
    implementation:
      status: observed
      paths:

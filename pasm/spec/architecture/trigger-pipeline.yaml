# Trigger pipeline (issues #707-#719): how authored world events become
# dispatched trigger actions on the host, each tick.
#
# Event flow (one host tick, systems chained in this order):
#   external world events (AI combat / waypoint bridge messages, queued
#   world-load / region / delayed-action events)
#     -> world-event-collector            (collect_world_events)
#     -> world-event-buffer-state         (WorldEventBuffer, per-tick)
#     -> world-trigger-chaining-loop      (tick_trigger_pipeline:
#          evaluate conditions -> run each fired trigger's script handler
#          -> ActionCmds -> apply_dispatch_result, looped for same-tick
#          chaining)
#   world-delayed-action-scheduler        (tick_delayed_actions) runs after
#   the loop and feeds the NEXT tick's buffer.
#
# A world-comms-template-injector (inject_comms_templates) sat between the
# buffer and the loop until issue #985 deleted the [[comms]] front-end it
# fired. A scripted thread opens from a trigger handler instead, and
# comms::scripted::open_scripted_comms_threads materialises the queued opens
# after the loop.
#
# Per-caller routing of dispatch-produced events: the chaining loop feeds
# them to the next pass of the SAME tick; only the delayed-action scheduler
# queues them for the NEXT tick. (The comms-response site also pushes onto
# pending_world_events, but it runs in SimSet::Input, before Physics, so the
# pipeline fires those events later the SAME tick.)
#
# This slice complements world-files.yaml, which owns the evaluator
# (world-trigger-evaluator) and the action catalogue
# (world-trigger-action-dispatcher); the entities here describe the pipeline
# that drives them and the contracts that keep it extendable.
entities:
  - component: world-event-collector
    core:
      status: implemented
      confidence: confirmed
      title: World Event Collector
      summary: Collects each tick's externally-sourced world events into the per-tick event buffer from three sources, in order - bridged AI combat and waypoint messages, events queued by world loads, region observers, and the previous tick's delayed actions, and one synthesised timer event once the mission clock is anchored (the first simulation tick of GamePhase::InProgress, not world load).
      goals:
        - every consumer of world events reads one buffer filled by one producer
        - stale events cannot leak between ticks because the buffer is rebuilt every run
      rationale:
        - a single collection point keeps the trigger pipeline's inputs inspectable and keeps event-free ticks from marking runtime state changed
        - "Issue #960 (the wave clock starts at mission start, not app boot): the synthesised timer event measures elapsed time from WorldContentRuntime::mission_clock_anchor_secs — the Time::elapsed_secs() reading anchor_mission_clock stamps on the FIRST simulation tick of GamePhase::InProgress — so on_timer triggers fire after_secs into the MISSION and combat_test's wave clock starts when the mission does. The anchor was previously stamped at world load (world_loaded_at_secs, since #475), but GamePhase defaults to Lobby and the SimSet::Physics chain is gated on InProgress, so after a lobby the first InProgress tick emitted TimerElapsed with the whole lobby duration as elapsed_secs and every timed wave fired at once. arm_mission_clock clears the anchor OnEnter(InProgress) so a second round (ReturnToLobby then a fresh start) re-measures from its own start; anchor_mission_clock only re-stamps when the anchor is None."
      references:
        - world-trigger-chaining-loop
    architecture:
      kind: event-bridge
      authority: authoritative
      owns: [world-event-buffer-state]
      produces: [world-event-buffer-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs]
      symbols: [collect_world_events, AiEventReaders, anchor_mission_clock, arm_mission_clock]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: world_event_buffer_holds_only_current_tick_events
        summary: The buffer holds exactly the current tick's events; stale events do not leak.
      - kind: test
        reference: tick_trigger_pipeline_is_a_noop_on_an_empty_world
        summary: An event-free tick leaves the runtime and the buffer unmarked by change detection.

  - state: world-event-buffer-state
    core:
      status: implemented
      confidence: confirmed
      title: World Event Buffer
      summary: This tick's externally-sourced world events, valid for exactly one tick. Only external events enter it - the chaining loop's internally-produced flag and destruction events stay local to the loop, which is what restricts comms templates to firing from external events only.
    architecture:
      classification: authoritative
      owner: world-event-collector
      writers: [world-event-collector]
    implementation:
      status: declared
      paths: [src/world/server.rs]
      symbols: [WorldEventBuffer]
      tests: [cargo test]

  - state: runtime-spawn-origin-state
    core:
      status: implemented
      confidence: confirmed
      title: Runtime Spawn Origin
      summary: "What a MID-RUN spawn was made from: the entity template path, the instance overrides merged onto it, the resolved placement (position, optional rotation and scale), the scenario name patched over the template's display name, and the authoring layer. Held as an `EntitySpawnOrigin` COMPONENT on the entity the spawn produced, wrapping the Bevy-free `SpawnOrigin` record. Absent on every authored `[[entity]]` block, and the absence is half the signal."
      rationale:
        - "[ai] Issue #863. `snapshot::restore` was an overwrite and nothing else, so a captured entity the bootstrapped world did not have was a `RestoreGap::MissingEntity`. That was survivable only because a fresh app re-ran the same scenario from the same seed and re-minted the same ids through `WorldIdMint` — the resume was relying on a REPLAY. A resumed browser session boots with nobody at the consoles and replays nothing, so a wave released by a player's action came back as a gap or as a `ready_to_restore` that never became true. The record is what a restore rebuilds the ship from instead."
        - "[ai] Nothing about a spawned entity says what made it: the template is merged into the config at spawn and the path discarded, and the overrides go the same way. `combat_test` alone authors nineteen override pairs, and they carry the raid's hostility, doctrine and weapon fit — a rebuild from the bare template would put back friendly, unarmed hulls in the raiders' positions, which is worse than a reported gap."
        - "[ai] IT RIDES ON THE ENTITY rather than in a uuid-keyed ledger on `WorldContentRuntime` (the shape `DeadlineTable`, `CommitmentLedger` and `EvidenceLog` take). Those are state about the WORLD, and live there so every site that borrows the runtime can mutate them; this is state about ONE entity, and putting it there buys pruning for free — a destroyed ship's record dies with it, so nothing can go stale and no destroy path needs a hook. The capture walk that already visits every `EntityUuid` reads it in place."
        - "[ai] The overrides travel as the dynamic `toml::Value` the merge consumed, not as the resolved `EntityConfig`. A dynamic document pins no struct's shape as save format; the config would freeze thirty authored sections' serde layout into the payload AND still be wrong, because its `#[serde(skip)]` system blocks do not survive a plain round-trip (issue #838). The template itself is re-read on restore rather than stored, because the content digest is already bound to the file."
        - "[ai] AUTHORITATIVE BUT NOT FOLDED, like `FlagStore`, `ObjectiveManager`, `DeadlineTable` and `CommitmentLedger`: `state_digest` does not walk it. Measured rather than asserted — `probe_destroy`, which spawns two storm bands from script and therefore gains the component on each, reproduces 14665104268980394769 at seed 42 / 900 ticks exactly, as do all five anchors (combat_test, patrol, duel, falling_skyway, probe_storm)."
        - "[ai] Writing it costs `ActionCmd::SpawnEntity` one field (`template_path`), carried BESIDE the already-resolved config rather than instead of it, so the applier still spawns what dispatch resolved and the two cannot disagree about this spawn; the path is what a LATER rebuild resolves."
    architecture:
      classification: authoritative
      owner: world-trigger-action-dispatcher
      writers: [world-trigger-action-dispatcher]
    implementation:
      status: observed
      # `src/snapshot.rs` is deliberately NOT listed, for the reason
      # `mission-deadline-state` gives in scenario-scripting.yaml: it carries
      # this state's persistence (`EntityState::spawn`, the restore's spawn
      # path, and the 9 → 10 `SNAPSHOT_FORMAT` bump) but is a whole-payload
      # module whose imports a scanner would attribute here wholesale.
      paths:
        - src/world/spawn_origin.rs
        - src/world/server.rs
        - src/entities/spawner.rs
      symbols:
        - SpawnOrigin
        - EntitySpawnOrigin
      tests:
        - cargo test
        - "cargo test --features headless --test snapshot_resume a_mid_run_spawn"
    evidence:
      - kind: test
        reference: "tests/snapshot_resume.rs::a_mid_run_spawn_is_rebuilt_by_the_restore_rather_than_replayed_by_the_bootstrap"
        summary: "`probe_reinforce.toml` spawns two Harrow raiders at t=3 s from the same `alliance_cruiser` template its authored escort flies, made hostile by an `overrides` block alone. The capture is taken after the spawn; a fresh app is stepped only to `ready_to_rebuild` — with the raiders provably absent and `ready_to_restore` provably false — and the restore builds both. Their FACTION and TAGS are read off the rebuilt hulls, neither of which travels anywhere else in the payload, so a rebuild from the bare template would fail the test while satisfying a count; `name_to_uuid`, the `raiders` group and the captured digest are all asserted alongside."

  - component: world-trigger-chaining-loop
    core:
      status: implemented
      confidence: confirmed
      title: World Trigger Chaining Loop
      summary: Within one host tick, alternates trigger evaluation and handler execution until a pass produces no new events, so chained triggers (a flag mutation firing a flag-watching trigger) resolve with zero frame latency. Bounded by a fixed pass cap of sixteen that breaks pathological trigger cycles with a warning instead of hanging the frame.
      goals:
        - chained scenario logic resolves in the same frame that caused it
        - a mis-authored trigger cycle degrades to a logged cutoff, never a hang
      rationale:
        - "determinism contract: each pass is two-phase - every trigger condition is evaluated against the live flag stores before any fired action dispatches, so all triggers in a pass see the same values and their mutations become visible only to the next pass"
        - "[ai] live-store freshness: action dispatch re-projects the live flag stores per action, never a pre-pass snapshot, so duplicate mutations preview correct before/after transitions and each boolean flip emits exactly one event"
        - "the dispatch name map is rebuilt at the top of every pass, so an action can resolve an entity name that a spawn registered in an earlier pass of the same tick"
        - "event routing is per-caller: this loop feeds produced events into its own next pass (same tick); the delayed-action scheduler queues them for the next tick; the comms-response site pushes onto pending_world_events from SimSet::Input, which the pipeline drains later the same tick"
        - "[ai] a fire runs the trigger's SCRIPT HANDLER and nothing else. It also dispatched the trigger's own declarative action array, per-action `when` predicate and per-action delay; issue #985 deleted the `[[trigger]]` parser that was their only writer, so `Trigger` lost `actions`/`action_predicates`/`action_delays` and the loop lost the arm that read them. A handler defers with ctx.schedule.in_seconds and gates with ordinary Rhai control flow"
    architecture:
      kind: evaluation-loop
      authority: authoritative
      reads: [world-event-buffer-state, world-flag-state, world-layer-runtime-state, world-name-binding-state]
      coordinates: [world-trigger-evaluator, world-trigger-action-dispatcher]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/content.rs]
      symbols: [tick_trigger_pipeline, MAX_CHAIN_PASSES, evaluate_single_trigger, apply_dispatch_result]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: trigger_chain_exceeding_max_passes_stops_at_the_cap
        summary: A chain longer than the cap performs exactly the capped number of passes, then breaks.
      - kind: test
        reference: scripted_flag_write_chains_a_declarative_on_flag_set
        summary: A scripted handler's flag write chains a downstream on_flag_set trigger in the same Bevy frame.
      - kind: test
        reference: flag_stores_handed_to_dispatch_are_live_within_one_drain
        summary: Dispatch previews transitions against live stores, never a per-action snapshot.
      - kind: test
        reference: trigger_from_layer_missing_in_layer_map_reads_base_flags
        summary: A trigger whose origin layer is missing from the layer map evaluates against the base flag store.

  - component: trigger-dispatch-purity-contract
    core:
      status: implemented
      confidence: confirmed
      title: Trigger Dispatch Purity Contract
      summary: The action-dispatch table is a pure, Bevy-free decision layer. It reads a read-only context and returns commands keyed by entity UUID strings, warnings as plain data, and destination-agnostic events; one impure applier turns those into ECS mutations for both world-trigger callers (immediate and delayed).
      goals:
        - every dispatch arm, including every failure path, is testable as a plain function call over plain data
        - one dispatch table serves both world-trigger dispatch sites (immediate and delayed), so those two paths cannot drift apart; the comms-response site (handle_respond_to_message) remains an intentionally parallel inline dispatch, kept symmetric by exhaustive matching plus the comms parity test suite
      rationale:
        - "[ai] purity boundaries: entity targets are UUID strings (never ECS entity handles), logging is returned as warning strings, flag mutation is previewed rather than performed, and produced events are returned unrouted for the caller to place"
        - "per-group layout: one exhaustive match routes each variant to its group function - mission state (dispatch_state_action), per-entity modifiers (dispatch_entity_modifier_action), world flags (dispatch_world_flag_action), destruction (dispatch_destroy_entity), spawning (dispatch_spawn_entity). The routing match and the applier are wildcard-free (compile-time exhaustive); each group function ends in an unreachable! guard, so routing a new variant into a group without adding its inner arm is a runtime panic caught by the group's should_panic test, not a compile error"
        - "[ai] non-determinism is injected: the spawn UUID source and the entity template loader are seams on the context, so tests stub them and the module never touches the filesystem or the config cache"
    architecture:
      kind: purity-contract
      authority: authoritative
      coordinates: [world-trigger-action-dispatcher]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/dispatch.rs, src/world/server.rs, src/entities/loader.rs]
      symbols: [dispatch_action, dispatch_state_action, dispatch_entity_modifier_action, dispatch_world_flag_action, dispatch_destroy_entity, dispatch_spawn_entity, DispatchContext, DispatchResult, ActionCmd, TemplateLoader]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: spawn_failed_template_load_does_not_consume_a_uuid_directly
        summary: Failure paths are gated inside the pure layer, so the applier applies results unconditionally.

  - component: trigger-action-extension-contract
    core:
      status: implemented
      confidence: confirmed
      title: Trigger Action Extension Contract
      summary: The authored procedure for adding a new trigger action variant. Exhaustive matches in the dispatch table's routing match and the applier mean the compiler walks the author to every site that must change; the one runtime-only gap is the group functions' unreachable! guards (covered by should_panic tests). There were TWO dispatch sites until issue #985 — the comms-response handler carried an intentionally parallel match — and that duplication is what the retired parity enumeration protected.
      goals:
        - "declare the new variant on the TriggerAction enum and, if a script should be able to buffer it, give it a host fn (src/world/config.rs, src/world/script/effects.rs). It is no longer parsed from world TOML - issue #985 deleted the `[[trigger.action]]` array, so a variant reaches the world either as a `BufferedEffect::Action` from a script or as a `DelayedAction` from `ctx.schedule.in_seconds`"
        - add a dispatch arm in the pure table (src/world/dispatch.rs), routed into the matching per-group function or a new group function for a new action family
        - when the action needs a new ECS effect, add an ActionCmd variant and an applier arm (apply_dispatch_result in src/world/server.rs); actions that resolve to existing commands need no applier change
        - add pure unit tests beside the dispatch table and pipeline tests beside the Bevy systems
      rationale:
        - "[ai] keeping every match exhaustive turns \"did I wire the new variant everywhere\" into a compile error rather than a runtime gap"
      references:
        - trigger-dispatch-purity-contract
    architecture:
      kind: authoring-contract
      authority: authoritative
      coordinates: [world-trigger-action-dispatcher]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/config.rs, src/world/dispatch.rs, src/world/server.rs]
      symbols: [TriggerAction, ActionCmd]
      tests: [cargo test]

  - component: world-delayed-action-scheduler
    core:
      status: implemented
      confidence: confirmed
      title: World Delayed Action Scheduler
      summary: Holds trigger actions whose authored per-action delay has not yet elapsed and dispatches due ones through the same pure dispatch table as immediate actions. Its produced events queue for the next tick's buffer, because it runs after the chaining loop has already drained this tick's.
      rationale:
        - "[ai] sharing the dispatch table with the immediate path means delayed actions gain every dispatch behaviour (including AI target revalidation) instead of drifting on a duplicated table"
        - "Issue #960: a DelayedAction's fire_at_elapsed and the due check both measure against WorldContentRuntime::mission_clock_anchor_secs — the same mission-start anchor on_timer triggers use (see world-event-collector) — so an action authored with a delay fires that many seconds into the MISSION rather than from app boot. partition_delayed_actions compares plain floats against that clock and this module reads no Bevy resource of its own."
    architecture:
      kind: scheduler
      authority: authoritative
      reads: [world-flag-state, world-layer-runtime-state]
      coordinates: [world-trigger-action-dispatcher, world-event-collector]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/world/server.rs, src/world/delayed.rs]
      symbols: [tick_delayed_actions, DelayedAction, partition_delayed_actions]
      tests: [cargo test]
    evidence:
      - kind: test
        reference: delayed_action_dispatches_and_queues_event_for_next_tick
        summary: A delayed action's produced events queue for the next tick, not the current pass.

      symbols: [catalog, compose, findings, selection_findings, scenario_catalogue, new_world_source, CompositionCatalog, ComposeRequest, CatalogueEntry, wasm_workshop_composition, wasm_workshop_compose, wasm_workshop_new_world, reference_dependencies, planScenarioEdits, planExtraWorldEdits, moveRoot, refusalStringId, worldSlugPath, mountWorkshopComposition]
      tests:

[package]
name = "project-phoenix"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["server"]
# Server feature: builds the host crate (Trunk → server.html) which runs
# the lobby, simulation, and 3D renderer. Includes the JS↔WASM bridge in
# `bridge.rs`.
server = []
# Client feature: builds the player crate (Trunk → client.html) which runs
# a thin Bevy app with DefaultPlugins and a JS↔WASM bridge in
# `client_bridge.rs`. No server-side simulation is included.
client = []

[dependencies]
bevy = { version = "0.18.1", features = ["webgl2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.23.1", features = ["v4"] }
wasm-bindgen = "0.2.120"
rand = "0.9"

# Native: parallel physics enabled
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy_rapier3d = { version = "0.33", features = ["parallel"] }

# WASM: no parallel, uses single-threaded runtime
# getrandom 0.3+ needs wasm_js feature + cfg(getrandom_backend="js")
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_rapier3d = { version = "0.33", features = ["dim3"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[target.wasm32-unknown-unknown.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3.97", features = ["Window", "console", "AudioContext"] }

entities:
  - component: authoritative-state-digest-boundary
    core:
      status: proposed
      confidence: confirmed
      title: Authoritative-State Digest Boundary
      summary: The decided, recorded boundary for a future cross-instance authoritative-state digest (issue #894, parent #849) — which types are in the fold, the order they fold in, how floats canonicalise, and what a digest's own type-shape pinning constraint means for this repository. No digest is computed here; this slice is the record a later implementation is checked against, and the enforcement test (below) is what keeps the record honest as new state is added.
      rationale:
        - "This issue authors no new classification vocabulary for WHAT is in scope. `pasm/spec/architecture/` already carries the `classification: authoritative` vocabulary (`derived`, `replicated`, `local`, `ephemeral`, `observational`, `local-view`, `player-knowledge`, `authored` for the rest) across 113 `state` entities, 73 of them authoritative — reviewed and meaning what this record needs. A second, bespoke list would drift against the first the day either one moved. `EntitySnapshot` (`src/core/messages.rs`) is the tempting shortcut and is wrong: it carries `radar_icon`, `region_colour`, `colour`, `radar_size` — authored presentation, not authoritative state — which is why AC5's reviewer table below states the rejection explicitly rather than leaving it to be re-discovered."
        - "The one vocabulary GAP: no existing classification term means 'structurally empty at the fold point'. `InterSystemQueue` (`inter-system-message-state`, owned by `src/core/messages.rs`, cleared every tick by `clear_inter_system_queue` in `command_admission::mod` before `SimSet::Input`) is authoritative in the existing sense — it is real inter-system-message state, not derived or presentation — but by the time a digest could fold over it in `RenderInterp`, it is always empty, on every instance, deterministically. Folding it changes nothing a divergence could ever move, so it is out for a reason distinct from every existing term, and gets the one new term this issue adds: `cleared-at-fold`."
        - "Binding is the size of the actual work, not the boundary decision. 113 conceptual PASM state entities against 171 Rust components and 134 resources is a real granularity mismatch, and 73 authoritative entities across 25 `pasm/spec/architecture/*.yaml` files have had `implementation.symbols` back-filled with real Rust type names as part of this issue (see each file's `state` entries) — the artefact that makes AC5 ('is X in the digest?', answerable from the record alone) literally true rather than aspirational. A handful of back-filled entries could not name one dedicated Rust type honestly (a `thread_local!` pair, a field on a larger resource, a value composed on read rather than stored) and say so in an inline comment next to their `symbols:` list rather than inventing a type that does not exist."
        - "Cross-reference for what happens with this record once #848 exists: #849's sequencing note puts this issue before #848, so the authoritative snapshot type does not exist yet. The two lists this record settles — the fold set and the exclusion classes — become the binding specification #848's snapshot type must satisfy, rather than something #848 re-litigates."
    architecture:
      kind: design-policy
      authority: authoritative
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths:
        - pasm/spec/architecture/deterministic-simulation.yaml
        - tests/authoritative_state_enumeration.rs
      tests: [cargo test]

  - component: digest-fold-order-policy
    core:
      status: proposed
      confidence: confirmed
      title: Digest Fold Order Policy
      summary: The fold order a future digest must use — a structured (namespace, tick, seq) tuple compared as a tuple, never as a rendered string, with namespaces folded in one fixed declared sequence and never merged into a single sorted run.
      rationale:
        - "SORT ON THE STRUCTURED VALUE, NEVER ITS STRING RENDERING. Once IDs become tick-scoped counters (issue #907), a naive string render `\"{tick}-{seq}\"` sorts `\"10-1\"` before `\"2-1\"` — stable within one instance, identical across two instances that agree, and WRONG: fold order becomes a function of how many ticks have elapsed, silently, while every same-seed comparison still passes. The key is `(namespace, tick, seq)` compared as a tuple of numbers. The string form stays for the wire and for human debugging only; where a string key is unavoidable its rendering is zero-padded fixed-width so lexicographic and numeric order coincide — a requirement recorded here rather than assumed at the point someone needs it."
        - "NAMESPACES FOLD IN A FIXED DECLARED SEQUENCE, NEVER MERGED. `AsteroidUuid` (`src/server_app.rs`) is a DIFFERENT namespace from `EntityUuid` (`src/entities/spawner.rs`), deliberately — the comment at `src/ai/server.rs:347` records why asteroids carry their own id rather than being back-filled onto `EntityUuid`: streamed lifecycle identity (`src/asteroids/lifecycle.rs`) is not spawner identity, and conflating them would drag the rocks into radar/networking/targeting paths that key on `EntityUuid`. So 'sort by stable world id' is underspecified without an ordering ACROSS namespaces too. The declared sequence for the fold: `EntityUuid` (all entities, in id order), then `AsteroidUuid` (all asteroids, in id order). A THIRD namespace appends to the sequence; it must never be merged into one flat sorted run across namespaces, because a merge means a new namespace reorders every id that sorts near it and invalidates every previously recorded digest, where an appended sequence only ever adds new fold positions after the existing ones. Namespace membership is part of the minted id itself, so no id can collide across namespaces and the sort key and the fold grouping come from the same value."
        - "NEVER ECS ENTITY HANDLE. Bevy query iteration is archetype order — stable within one process, not across two instances that spawned entities in a different order or count. `handle_collisions` (`src/server_app.rs`) already demonstrates the fix issue #896 applied for its own reason (collision resolution order determinism): it sorts `ship_query.iter()` by `(uuid, entity.index())` rather than iterating `ship_query.iter_mut()` directly, with `entity.index()` used only as a same-uuid tiebreak, never as the primary key. A digest fold must do the same for every type it walks — the ordering constraint is general, not specific to collisions."
    architecture:
      kind: design-policy
      authority: authoritative
      reads: [spawned-entity-state, asteroid-window-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/entities/spawner.rs, src/asteroids/lifecycle.rs, src/ai/server.rs, src/server_app.rs]
      symbols: [EntityUuid, AsteroidUuid]

  - state: world-id-mint-state
    core:
      status: implemented
      confidence: confirmed
      title: World-Id Mint State
      summary: "The tick the id mint is currently issuing for and its per-namespace sequence counters (issue #907). Authoritative: it decides the identity of every entity, comms message and projectile spawned from here on, so two instances that disagree about it will disagree about who is who."
      rationale:
        - "FOLDED, not merely classified. The counters are in the digest's run-scope preamble, beside `SimRng`'s stream positions and for the identical reason: `SimRng`'s positions are folded so a divergent DRAW count is caught the tick it happens, and these are folded so a divergent SPAWN count is. Left out, two instances that spawned a different number of things on one tick would still agree until the next id was minted, and the divergence would be reported a tick late — a different window and a different suspect."
        - "NOT a snapshot-resume hazard in the normal case, and the reason is worth stating: at a tick boundary the sequences are a function of `SimTick` plus what that tick spawned, and `sync_world_id_mint` resets them at the top of the next step. The state that genuinely survives a boundary is an OFF-TICK mint's continuation (a `Startup` spawn, a frame-driven system), which is exactly what stops those ids colliding with the tick they ride on."
    architecture:
      classification: authoritative
      owner: tick-scoped-id-mint
      writers: [tick-scoped-id-mint]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: observed
      paths: [src/world_id.rs]
      symbols: [WorldIdMint, WorldId, IdNamespace]

  - component: tick-scoped-id-mint
    core:
      status: implemented
      confidence: confirmed
      title: Tick-Scoped World-Id Mint — Implementation
      summary: "Issue #907's implementation of the stable world ids the fold-order policy above assumes. Every simulation id — entity, comms message, projectile — is minted at one chokepoint, `crate::world_id::mint_id_with`, from a `(namespace, tick, seq)` counter reset at the top of each fixed step. Two instances reaching tick T on the same admitted inputs give the same spawn the same id."
      rationale:
        - "A COUNTER, NOT A DRAW. Two generations of id were wrong in two different ways. `Uuid::new_v4()` took OS entropy, so two instances spawning the same NPC gave it two different ids. Issue #897 replaced that with a draw from `SimStream::EntityUuid`, which is deterministic within one seeded instance but is a function of RNG DRAW ORDER — so adding one unrelated draw anywhere upstream reshuffles every subsequent entity id and every digest recorded with it, and two instances that interleave draws differently still disagree. `(namespace, tick, seq)` is a function of the logical tick (#895) and of the spawn order within it (#896/#899), both already deterministic, and it survives a draw being added elsewhere because it never touches the RNG."
        - "ONE CHOKEPOINT, AND THE TICK IT IS SCOPED TO IS WIRED BESIDE IT. `WorldIdMint` is registered by `sim_tick::register_sim_tick`, not alongside the other resources, so the counter and the tick it is scoped to cannot get out of step. `sync_world_id_mint` runs in `FixedFirst` and adopts the current `SimTick`, resetting every per-namespace sequence when the tick moves; it is idempotent within a tick, which is what lets an id minted OFF the fixed schedule (a `Startup` spawn, a frame-driven system) ride the last-synced tick and continue its sequence instead of colliding with it. Minting takes `&self` behind an interior `Mutex`, the shape `SimRng` already uses: a spawn site holding a `ResMut` would conflict with every other spawn site in the schedule, and that scheduling ambiguity is the very non-determinism this exists to remove."
        - "THE STRUCTURED TUPLE SORTS; THE STRING IS A RENDERING, AND THE RENDERING IS UUID-SHAPED. `WorldId`'s derived `Ord` is `(namespace, tick, seq)` compared as numbers, and that is what `FoldKey` uses. The wire, the pure-JS client, the save format and PASM all speak `EntityUuid(String)`, so a string form is unavoidable. The first implementation rendered a readable `ent-<tick>-<seq>`, and it does not survive contact with the codebase — a DISCOVERED CONSTRAINT worth recording rather than rediscovering: a world id's uuid SHAPE is load-bearing in two places. (1) `ai::AiWorldEntity::uuid` is a real `uuid::Uuid`, built by `Uuid::parse_str(&uuid.0).unwrap_or_default()` in `ai::server`; a non-uuid id does not fail loudly there, it parses to `Uuid::nil()`, collapsing EVERY entity in the AI's world view onto one identity so target selection quietly stops working (caught by `tests/rng_determinism.rs`, whose coverage scenario stopped landing beam/blaster/torpedo damage on the player). `Uuid` is threaded through the whole pure AI core. (2) Comms uses \"does this parse as a uuid?\" as its entity-vs-synthetic-sender discriminator (`current_sender_in_range`), so a readable id would make every real sender look synthetic and defeat the range gate. Rather than retype `Uuid` -> `String` across the AI tree inside this slice, the rendering is a canonical UUID whose BITS ARE THE TUPLE: RFC 9562 version 8 (\"custom\", exactly this case), with `namespace << 96 | tick << 32 | seq` laid out big-endian in fixed-width lowercase hex across the 30 hex digits the version and variant markers leave free. That meets the fold-order policy's constraint literally — the rendering is zero-padded fixed-width, and because hex `0`-`9` sort before `a`-`f` in ASCII, lexicographic order over rendered ids agrees with numeric order over tuples, across namespaces as well as within one — while leaving every consumer untouched. `FoldKey` still recovers `(tick, seq)`, via `WorldId::parse`, which is what the key exists for. The version nibble is also the discriminator: a v4 uuid (`Uuid::new_v4`, and so every `deterministic_cell_uuid` asteroid) carries `4` there and correctly fails to parse as a mint. What is NOT claimed is readability — `00000000-0000-8000-8000-000b00000000` is worse in a log than `ent-11-0`, and that was the trade. Capacities, since a fixed layout has them: tick is a full `u64`, sequence is 32 bits (`SEQ_LIMIT`, saturating rather than wrapping so an absurd tick fails loud), namespace is 8 bits."
        - "NAMESPACE IS PART OF THE MINTED ID, AND THERE IS ONLY ONE NAMESPACE ENUM. `world_id::IdNamespace` is what the mint stamps into the id AND what `headless::digest` folds by — the digest re-exports it rather than declaring a parallel copy, so the sort key and the fold grouping provably come from the same value. It declares two namespaces the fold does not walk, `Message` and `Projectile`, which is the append rule working as intended rather than a gap: a namespace nothing folds simply never appears in a fold."
        - "COMMS MESSAGE IDS ARE IN SCOPE BECAUSE THEY ARE COMMAND-ADDRESSING SURFACE. `RespondToMessage { message_id, response_index }` is a player command that addresses a message by id, resolved against `comms.active_dialogues`; a recorded command carrying an id the peer minted differently does not resolve at all. Thread ids and the `...` placeholder ids mint the same way, since a follow-up's real message replaces a placeholder by id."
        - "ASTEROIDS ARE DELIBERATELY NOT MINTED HERE. `asteroids::lifecycle::deterministic_cell_uuid` derives a rock's id from its `(layer, cell, slot)` coordinates — constraint 8's design, and it must stay coordinate-derived because a rock respawns fresh when the player leaves its cell and returns and has to come back with the id it had, which a tick-scoped counter could not give it. Those ids are already cross-instance identical, being a pure function of position; they are simply not numeric, so they key `(0, 0)` and sort on the string tiebreak. The `AsteroidUuid` namespace fold is stable, just not tick-ordered."
        - "THE RETIRED RNG STREAM STAYS DECLARED, AND THIS IS THE RECORD OF THAT CALL. `SimStream::EntityUuid` is no longer drawn from, but it is not removed. `SimStream::ALL` is six long, `SimRngState` serialises one generator per entry, and `SimRng::from_state` REJECTS a snapshot whose length disagrees — so deleting the variant would invalidate every recorded snapshot (#862's format) and shift the fingerprint's `rng_positions`, in exchange for one unused mutex. Keeping it also buys an assertion: the digest folds every stream position, so a draw reappearing there is caught the tick it happens, and `sim_rng`'s own `the_retired_entity_uuid_stream_is_never_drawn_from` asserts it locally where the failure names the cause."
        - "THE CI GATE IS #903'S TREATMENT, APPLIED TO THE SAME HAZARD CLASS. `uuid::Uuid::new_v4` joins `clippy.toml`'s `disallowed-methods`, so a new spawn site reaching for OS entropy fails the build. Sanctioned scopes are `#[cfg(test)]` modules ONLY, each carrying a module-scoped allow with a justification — a fixture wanting 'some distinct id' has no run to reproduce. That allow is coarse (`disallowed_methods` is one lint) and therefore also lifts the #908 f32 bans inside those test modules; accepted rather than overlooked, since those bans exist for native-vs-wasm agreement and the test modules do not run on wasm. NOT banned: `Uuid::parse_str`, `Uuid::from_u128`, and `uuid::Builder::from_random_bytes` — the last is how the asteroid cell function renders its pure id."
    architecture:
      kind: mechanism
      authority: authoritative
      owns: [world-id-mint-state]
      depends_on: [digest-fold-order-policy]
      reads: [spawned-entity-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: observed
      paths:
        - src/world_id.rs
        - src/sim_tick.rs
        - src/sim_rng.rs
        - src/headless/digest.rs
        - clippy.toml
      symbols: [WorldId, WorldIdMint, IdNamespace, mint_id_with, sync_world_id_mint]
      tests: [cargo test]

  - component: digest-float-canonicalisation-policy
    core:
      status: proposed
      confidence: confirmed
      title: Digest Float Canonicalisation Policy
      summary: Floats fold by canonical bit pattern with no quantisation — NaN's roughly 16 million bit patterns collapse to one payload, and -0.0 folds as +0.0 (compares equal, differs in bits) — and cross-host bit-exactness is recorded as a stated PRECONDITION of the digest, not something it guarantees on its own.
      rationale:
        - "NO QUANTISATION. Rounding before folding is the tempting alternative and it is a trap: it converts 'the digest catches divergence' into 'the digest catches divergence once it exceeds the quantum' — which reports the WRONG tick a split happened on, destroying the one thing a per-tick digest exists to answer. Bit-pattern folding with NaN collapse and signed-zero normalisation is the only rule that keeps 'the tick the digest disagrees on' meaning 'the tick simulation state first diverged'."
        - "BIT-EXACTNESS ACROSS HOSTS IS A PRECONDITION THIS POLICY DEPENDS ON, NOT SOMETHING IT PROVIDES. IEEE-754 guarantees `+ - * / sqrt` identical across native and wasm; it guarantees NOTHING about transcendental call sites. This repository's own count as of this issue: 59 `sin`, 56 `cos`, 23 `atan2`, 3 `tan`, 3 `powf`, 1 `exp` in `src/`, plus Rapier's own solver internals. Native<->wasm equality is a product requirement (the host and a headless native run must reach the same digest), so those call sites move onto a shared pure-Rust `libm` rather than the platform math library — see the two issues filed alongside this one: #908 (phoenix's own call sites + a clippy lint forbidding new ungated ones) and #909 (dependency features + cross-target vectors, i.e. Rapier)."
        - "BIT-EXACTNESS ALSO NEEDS SERIAL PHYSICS, JOINTLY. Issue #896 already made Rapier's broadphase serial on both targets for exactly this reason — a parallel broadphase orders contacts differently from the serial one the browser is stuck with, and parallel float accumulation reorders independently of which `libm` is underneath. The two preconditions (shared `libm`, serial solve) are independent and both required; neither alone is sufficient for cross-host bit-exactness."
    architecture:
      kind: design-policy
      authority: authoritative
      depends_on: [libm-shared-math-policy]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/ship/physics.rs, Cargo.toml]

  - component: libm-shared-math-policy
    core:
      status: proposed
      confidence: confirmed
      title: Shared libm Math Policy
      summary: Placeholder reference for issues #908 (this crate's own transcendental call sites + a clippy lint) and #909 (dependency features + cross-target vectors, chiefly Rapier), which the float canonicalisation policy above depends on for its cross-host bit-exactness precondition. Filed alongside #894/#907; not built by this issue.
    architecture:
      kind: design-policy
      authority: authoritative
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [Cargo.toml]

  - component: digest-type-shape-pinning-constraint
    core:
      status: proposed
      confidence: confirmed
      title: Digest Type-Shape Pinning Constraint
      summary: "AC4: a digest is a statement about a type's SHAPE, not only its contents (vellum-digest's own caveat, quoted in the parent issue). The moment a digest folds over a set of types, each folded type's field order and enum variant order becomes pinned surface — reordering either is a re-blessing event, not a routine refactor."
      rationale:
        - "This is why the boundary is decided and recorded BEFORE any code computes a digest (AC1): choosing the folded set incidentally, inside the first slice that happens to need a hash, would freeze an arbitrary set of types' shapes forever with nobody having decided to pin them."
        - "'Re-blessing' names the cost precisely: every RECORDED digest computed before the reorder becomes invalid the moment the shape changes, whether or not the reorder changed any runtime BEHAVIOUR. A field reorder that is a pure no-op for every consumer still moves the fold, because the fold is over the type's memory shape, not its semantics. `tests/registration_order_determinism.rs` and `tests/rng_determinism.rs` name their own precedent for a comparable 're-bless the probe' event (see git history: 'test(#896): re-bless the duel probe for same-tick contacts')."
        - "SimRng joining the fold (see the reviewer table below) makes this concrete immediately: `SimRng` moves onto `Pcg32` in issue #897, specifically because `Pcg32` is `Serialize` and therefore has a nameable shape a digest can fold over deterministically. A field added to `Pcg32`, or its six streams reordered, is a re-blessing event under this constraint the moment `SimRng` is actually in a computed digest."
    architecture:
      kind: design-policy
      authority: authoritative
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths: [src/sim_rng.rs]
      symbols: [SimRng, SimStream]

  - component: digest-render-interp-fold-point
    core:
      status: proposed
      confidence: confirmed
      title: Digest Fold Point — Inside the RenderInterp Bracket
      summary: A digest folds INSIDE the RenderInterp bracket — after `SimSet` has fully advanced the tick and before any frame-time interpolation of positions for smooth rendering at a variable frame rate — never at frame time itself. RenderInterp is presentation and is explicitly excluded from the fold (see the exclusion classes below); it is named here separately because, unlike an ordinary excluded UI widget, it lives directly on simulation entities and carries transform-shaped data, making it the single easiest exclusion to get wrong by accident.
      rationale:
        - "Issue #895 settled fixed-tick simulation: `SimSet` runs in Bevy's `FixedUpdate` at the authored `sim_tick_hz`, counted by `SimTick` (`src/sim_tick.rs`). A frame at 144Hz and a frame at 30Hz both observe the SAME committed tick state between two `FixedUpdate` steps; what differs between them is how far a renderer has interpolated a transform TOWARD the next not-yet-committed tick for smooth on-screen motion. Folding at frame time would hash that interpolated, frame-rate-dependent position — two instances that agree on every simulation tick would still produce different digests purely because they render at different frame rates, which is exactly backwards for a mechanism whose entire purpose is telling two AGREEING instances apart from two DIVERGING ones."
        - "'RenderInterp bracket' names the point in the tick/frame relationship where the fold must sit: after the authoritative tick has fully committed (all of `SimSet` has run) and before rendering has interpolated anything derived from it. No literal `RenderInterp` type exists in this repository as of this issue — it is the exclusion-worthy CONCEPT this record pins in advance of any interpolation system being built, so that whoever builds frame-time smoothing inherits an already-settled exclusion rather than discovering the trap by shipping a digest that intermittently disagrees between a 30Hz and a 144Hz instance of the same seed."
    architecture:
      kind: design-policy
      authority: authoritative
      reads: [game-phase-state]
      runs_in: [host-browser-runtime]
    implementation:
      status: declared
      paths: [src/sim_tick.rs, src/sim_sets.rs]
      symbols: [SimTick, SimSet]

  - component: digest-exclusion-classes
    core:
      status: proposed
      confidence: confirmed
      title: Digest Exclusion Classes
      summary: The explicit, reason-coded exclusion classes for state that is real but must never enter the fold — reusing the existing PASM `classification` vocabulary rather than inventing a parallel one, plus the one new term this issue adds for structurally-empty-at-fold state.
      rationale:
        - "PRESENTATION (classification: derived / local-view, or the RenderInterp bracket above). The single most dangerous exclusion on this list, because unlike a UI widget it lives on simulation entities and carries transform-shaped data that looks authoritative at a glance. Excluded: RenderInterp (frame-time interpolated transforms — see the fold-point entry above)."
        - "BROADCAST CACHES (classification: replicated, one-directional mirrors of already-authoritative state). Excluded: `LastBroadcastEntityPositions`, `LastBroadcastEntityHealth`, `LastBroadcastHull`, `LastBroadcastShields`, `LastBroadcastBlackboards` (`src/core/broadcast/cache_registry.rs` — only the first two carry an `Entity` segment in their real name), plus the same family in a different console, `LastWeaponsUpdate` (`src/console/weapons/blackboard.rs`) — each is a delta-suppression cache of what was last SENT over the wire, not a second copy of simulation truth; folding it would fold the network layer's own bookkeeping."
        - "TIMERS / OUTBOXES (classification: derived, or cleared-at-fold for a queue that is provably empty at the fold point). Excluded: `SimBroadcastTimer` (a cadence gate, pure function of the tick count which is itself in the digest — folding it would fold a value wholly derivable from something already folded), `SimOutbox` (outbound wire messages already drained once sent — folding it folds transport state, not sim state), `DamageLog` (a telemetry/balance-tracer append log, read by tooling, never read back by simulation logic that decides an outcome)."
        - "DERIVED STATE — the AI cadence latches (classification: derived). Excluded: `AiTickReady`, `AiSnapshotReady`, `AiBaseInterval`. As of issue #895 these are PURE FUNCTIONS of the tick counter (`sim_tick_hz / ai_tick_hz` logical ticks per decision, `src/ai/cadence.rs`), and the tick counter is already in the fold via `SimTick`. `AiBaseInterval` is the same family as its two latch siblings — the shared base-cadence interval `tick_ai_cadence` derives alongside them, written every tick from the same `sim_tick_hz / ai_tick_hz` ratio — so it excludes for the identical reason, not a new one. The reason code matters distinctly from 'nobody thought about it': a reviewer who sees a timer excluded with no reason given would reasonably suspect an oversight, where 'derived, and its source is already folded' says plainly that excluding it loses no information the digest could otherwise catch."
        - "CLEARED-AT-FOLD (the one new term this issue adds; not an existing classification value). `InterSystemQueue` (`inter-system-message-state`) is real authoritative inter-system-message state — not derived, not a cache, not presentation — but `clear_inter_system_queue` (`command_admission::mod`) empties it every tick before `SimSet::Input`, so by the `RenderInterp` fold point it is ALWAYS empty on every correctly-running instance. A digest fold gains nothing folding a value that is provably constant at the fold point on every instance that agrees; a value that is NOT empty there is itself a bug the admission pipeline already needs to catch, independent of any digest."
    architecture:
      kind: design-policy
      authority: authoritative
      reads: [inter-system-message-state]
      runs_in: [host-browser-runtime, headless-runtime]
    implementation:
      status: declared
      paths:
        - src/ai/cadence.rs
        - src/core/messages.rs
        - src/sim_tick.rs
        - src/core/broadcast/cache_registry.rs
        - src/console/weapons/blackboard.rs
        - src/server_app.rs
        - src/debug_overlay.rs
      # src/command_admission/mod.rs (clear_inter_system_queue's real home) is
      # deliberately NOT a declared path here: it is also host-command-admission's
      # (engineering-damage.yaml) primary implementation file, and PASM's
      # dependency-drift scanner treats a file claimed by two entities as
      # ambiguously owned, dropping every observed import edge through it —
      # which silently broke host-command-admission's four declared
      # dependency edges (admitted-command-router, system-command-admission-policy,
      # and the two routers/operators that depend on host-command-admission
      # in turn) the moment this issue's symbol backfill added it here.
      # clear_inter_system_queue stays named in the CLEARED-AT-FOLD rationale
      # above (prose, not a checked `symbols` entry) rather than reclaiming the
      # file and re-breaking that scan.
      symbols:
        - InterSystemQueue
        - AiTickReady
        - AiSnapshotReady
        - AiBaseInterval
        - SimBroadcastTimer
        - SimOutbox
        - DamageLog
        - LastBroadcastEntityPositions
        - LastBroadcastEntityHealth
        - LastBroadcastHull
        - LastBroadcastShields
        - LastBroadcastBlackboards
        - LastWeaponsUpdate

  - component: digest-boundary-reviewer-answers
    core:
      status: proposed
      confidence: confirmed
      title: Digest Boundary — Reviewer Answers (AC5)
      summary: "AC5's own test: a reviewer must be able to answer 'is this type in the digest?' from this record alone, without reading any fold implementation (none exists yet). The settled in/out calls, stated verbatim so nothing here is left to inference:"
      rationale:
        - "IN: `SimRng` (issue #897 moves it onto `Pcg32`, which is `Serialize`; included so DIVERGENT DRAW COUNT is caught the tick it happens rather than the later tick it becomes an observable wrong number — see the type-shape entry above for why this is a recorded, knowingly-accepted re-blessing cost, not a free inclusion)."
        - "IN: `GamePhase` (the round's own authoritative phase — Lobby/Loading/InProgress/GameOver — is exactly the kind of coarse divergence a digest must catch first)."
        - "IN: `GameOverReason` (the authoritative reason the round ended; two instances reaching GameOver for different reasons on the same seed is a correctness bug, not a cosmetic difference)."
        - "IN: `WorldResource` (the loaded world's own authoritative runtime state)."
        - "IN: `CaptainPriorityBoost` (an authoritative per-ship AI/command modifier, not a presentation value)."
        - "IN: ship physics and hull (`ShipPhysics`/`ShipPhysicsComponent`, `EntitySystemHull` and friends) — the position/velocity/orientation and damage state a divergence most directly shows up as."
        - "IN: collisions (the attribution a collision resolves to — victim, damage, shield-absorbed, hull-damage — not merely its aggregate effect on hull totals, per issue #896's own fingerprint design in `src/headless/fingerprint.rs`)."
        - "OUT: `RenderInterp` (see the fold-point entry above — frame-time interpolated presentation, the most dangerous exclusion on this list precisely because it sits on simulation entities)."
        - "REJECTED AS A SHORTCUT: `EntitySnapshot` (`src/core/messages.rs:1033`) is NOT the digest boundary and must not be treated as one. It carries `radar_icon`, `region_colour`, `colour`, `radar_size` — authored PRESENTATION fields mixed into what looks like a convenient one-stop entity view. Using it as the fold set would silently pull authored presentation into the pinned surface the type-shape constraint (AC4) protects."
    architecture:
      kind: design-policy
      authority: authoritative

  - component: current-paid-radio-work-producer
    core:
      status: implemented
      confidence: confirmed
      title: Actual Current Radio Payment Receipt Producer
      summary: "Existing tick_radio pays continuous listening exactly once and records its raw fraction before Operation. The late current-endpoint adapter only reads that receipt and rechecks current equipment, control, physical pose and Operation once. Restore clears the receipt; it grants no restored credit, extra payment, route history or controller knowledge."
    architecture:
      kind: subsystem
      authority: derived
      owns: [current-paid-radio-work]
      writes: [current-paid-radio-work]
      runs_in: [host-browser-runtime, native-host-runtime, headless-runtime]
